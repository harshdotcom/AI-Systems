<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python Mastery: 200 Chapters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2F5; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#171A21; --muted:#575D6B; --line:#D9DCE4;
  --accent:#2F5F8A; --accent-soft:#E0EAF3; --accent-ink:#FFFFFF;
  --amber:#B97A0B; --tldr-bg:#FFF5DC; --tldr-line:#D49A22;
  --indigo:#7A4E12; --real-bg:#F6EEDF; --real-line:#A06A1E;
  --code-bg:#181A16; --code-ink:#E6E9E1; --inline-code:#E9ECE4;
  --cell-empty:#DCE0D6; --shadow:0 1px 0 rgba(24,26,22,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
    --accent:#8DB8E0; --accent-soft:#1A2D40; --accent-ink:#0B1A28;
    --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
    --indigo:#E6C38A; --real-bg:#2A2114; --real-line:#B9873A;
    --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
    --cell-empty:#2E332B; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
  --accent:#8DB8E0; --accent-soft:#1A2D40; --accent-ink:#0B1A28;
  --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
  --indigo:#E6C38A; --real-bg:#2A2114; --real-line:#B9873A;
  --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
  --cell-empty:#2E332B; --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header with the memory-bank progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:20px;padding:12px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted)}
.bank{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bank-row{display:flex;gap:4px;flex-wrap:nowrap;min-width:0}
.bank-group{flex:1;min-width:0;display:flex;gap:2px;padding:3px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.cell{flex:1;min-width:2px;max-width:10px;height:18px;border-radius:2px;background:var(--cell-empty);border:0;padding:0;cursor:pointer;transition:background .2s}
.cell.done{background:var(--accent)}
.cell.here{box-shadow:0 0 0 2px var(--amber)}
.bank-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bank-meta strong{color:var(--ink);font-weight:600}
.top-actions{display:flex;gap:8px}
.btn{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.menu-btn{display:none}

/* Shell */
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,76px));height:calc(100dvh - var(--top-h,76px) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg)}
.search{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
.part{margin-bottom:4px}
.part-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:8px;cursor:pointer}
.part-head:hover{background:var(--surface-2)}
.part-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);width:22px;flex:none}
.part-name{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.part-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.part-count.full{color:var(--accent);font-weight:600}
.part-list{list-style:none;margin:0 0 6px;padding:0 0 0 30px;display:none}
.part.open .part-list{display:block}
.ch-row{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:6px}
.ch-row.active{background:var(--accent-soft)}
.ch-row a{flex:1;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.ch-row a .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.tick{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:11px;height:11px;opacity:0}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{opacity:1;color:var(--accent-ink)}
.hidden{display:none!important}

/* Main reading area */
.main{padding:24px 32px 80px;min-width:0}
.crumb{font-size:14px;color:var(--muted);margin:0 0 12px}
.crumb a{color:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;font-size:14px;color:var(--muted);max-width:240px;text-align:left}
.tab .tab-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--cell-empty)}
.tab .dot.on{background:var(--accent)}
article{max-width:780px}
.ch-no{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--accent);font-size:15px;margin:0}
h1.ch-title{font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:6px 0 22px;font-weight:700;text-wrap:balance}
.box{border-radius:10px;padding:16px 18px;margin:0 0 26px;border-left:4px solid}
.box h2{font-size:14px;margin:0 0 6px;font-weight:600}
.box p{margin:0}
.tldr{background:var(--tldr-bg);border-color:var(--tldr-line)}
.tldr h2{color:var(--amber)}
.tldr p{font-size:17px;line-height:1.55}
.real{background:var(--real-bg);border-color:var(--real-line);margin-top:34px}
.real h2{color:var(--indigo)}
.body h3{font-size:20px;margin:30px 0 10px;letter-spacing:-.01em}
.body p{margin:0 0 14px}
.body ul,.body ol{padding-left:22px;margin:0 0 16px}
.body li{margin:4px 0}
.body li input[type=checkbox]{margin-right:6px;accent-color:var(--accent)}
.body code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.88em;background:var(--inline-code);padding:1px 5px;border-radius:4px}
.body pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13.5px;line-height:1.55;margin:0 0 18px}
.body pre code{background:none;padding:0;font-size:inherit;color:inherit}
.table-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.body table{border-collapse:collapse;width:100%;font-size:14px}
.body th,.body td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.body th{background:var(--surface-2);font-weight:600}
.body tr:last-child td{border-bottom:0}
.body strong{font-weight:600}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.complete{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:15px}
.complete .tick{border-color:currentColor;pointer-events:none}
.complete.on{background:var(--accent);color:var(--accent-ink)}
.complete.on .tick{background:var(--accent-ink);border-color:var(--accent-ink)}
.complete.on .tick svg{opacity:1;color:var(--accent)}
.nav{display:flex;gap:8px}
.nav .btn[disabled]{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}

/* Diagrams and charts */
.diagram{margin:0 0 20px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
.diagram svg{display:block;margin:0 auto;height:auto}
.diagram.loading{color:var(--muted);font-size:14px}
.chart{margin:0 0 20px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chart figcaption{font-weight:600;font-size:14px;margin:0 0 10px}
.bar-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.bar-label{color:var(--ink);line-height:1.3}
.bar-track{height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar{display:block;height:100%;background:var(--accent);border-radius:7px 0 0 7px}
.bar-val{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.chart-note{font-size:12px;color:var(--muted);margin-top:6px}

/* Contents view */
.contents h1{font-size:32px;margin:0 0 6px;letter-spacing:-.02em}
.contents .lead{color:var(--muted);margin:0 0 24px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.pcard h2{font-size:15px;margin:0 0 2px;line-height:1.3}
.pcard .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pcard ol{list-style:none;padding:0;margin:0}
.pcard li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13.5px;line-height:1.35}
.pcard li a{color:var(--ink);text-decoration:none;flex:1}
.pcard li a:hover{text-decoration:underline}
.contents-actions{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}

/* Mobile */
.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);height:auto;z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .menu-btn{display:inline-block}
  .main{padding:18px 16px 60px}
  .top-inner{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand{flex:1}
  .bank{order:3;flex-basis:100%}
  .bank-row{gap:3px}
  .bank-group{gap:1px;padding:2px}
  .cell{height:12px;max-width:none;min-width:0}
  .bank-row{flex-wrap:wrap;row-gap:3px;gap:3px}
  .bank-group{flex:0 0 calc(10% - 2.7px);gap:1px;padding:1px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="top-inner">
    <button class="btn menu-btn" id="menuBtn" aria-label="Open chapter list">Chapters</button>
    <div class="brand"><b>Python mastery</b><span>From first steps to advanced, professional Python</span></div>
    <div class="bank" aria-label="Course progress">
      <div class="bank-row" id="bank"></div>
      <div class="bank-meta"><span><strong id="doneCount">0</strong> of 200 chapters complete</span><span id="pct">0%</span></div>
    </div>
    <div class="top-actions"><a class="btn" href="#contents" style="text-decoration:none">Contents</a></div>
  </div>
</header>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <nav class="side" id="side" aria-label="Chapters">
    <input class="search" id="search" type="search" placeholder="Search chapters" aria-label="Search chapters">
    <div id="parts"></div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const CHAPTERS = [{"id": 1, "title": "What Python is", "tldr": "Python is a high-level, general-purpose, dynamically typed language that emphasizes readability. It is used for web development, automation, data science, AI, scripting, testing and education, with a huge ecosystem of libraries.", "real": "Guido van Rossum released Python’s first public version in February 1991 and named it after the comedy group Monty Python. Python has ranked first in the TIOBE popularity index since 2021.", "body": "### Key characteristics\n\n| Characteristic | Meaning |\n|---|---|\n| High-level | Memory management handled for you |\n| Interpreted (bytecode) | Code compiled to bytecode, run by a virtual machine |\n| Dynamically typed | Types checked at runtime; optional type hints |\n| Multi-paradigm | Procedural, object-oriented, functional styles |\n| “Batteries included” | Large standard library |\n| Readable syntax | Indentation defines blocks |\n\n### Where Python is used\n\n| Domain | Examples |\n|---|---|\n| Web | Django, Flask, FastAPI |\n| Data and AI | NumPy, pandas, PyTorch, scikit-learn |\n| Automation | Scripts, DevOps tools |\n| Science | Astronomy, biology, physics research |\n| Education | First programming language in many universities |\n\n### Version history highlights\n\n| Version | Year | Highlight |\n|---|---|---|\n| 1.0 | 1994 | First major release |\n| 2.0 | 2000 | List comprehensions, garbage collection of cycles |\n| 3.0 | 2008 | Cleaned-up language, not backward compatible |\n| 2.7 end of life | 2020 | Python 2 no longer supported |\n| 3.15 | 2026 | Lazy imports, frozendict, UTF-8 by default |"}, {"id": 2, "title": "Installing Python and choosing a version", "tldr": "Install a currently supported Python 3 version from python.org, your OS package manager, or a version manager such as uv or pyenv. Each Python version receives about five years of support, so avoid versions near end of life.", "real": "Since Python 3.9, CPython follows an annual release schedule defined in PEP 602, with a new feature version every October and roughly five years of bug-fix and security support for each.", "body": "### Installation options\n\n| Platform | Option |\n|---|---|\n| Windows | python.org installer, Python install manager (`py`), winget |\n| macOS | python.org installer, Homebrew, uv |\n| Linux | System package manager, uv, pyenv |\n| Any | `uv python install 3.15` |\n\n### Check your installation\n\n```bash\npython3 --version        # e.g. Python 3.15.0\npython3 -c \"print('hello')\"\n```\n\nOn Windows, use `py --version` or `python --version`.\n\n### Version lifecycle (per PEP 602)\n\n```mermaid\nflowchart LR\n  REL[Release in October] --> BUGFIX[~2 years bug fixes]\n  BUGFIX --> SEC[~3 years security fixes only]\n  SEC --> EOL[End of life]\n```"}, {"id": 3, "title": "Running Python code", "tldr": "Run Python interactively in the REPL for experiments, as script files for programs, as modules with `python -m`, or in notebooks. Know which interpreter and environment you are using.", "real": "Python 3.13 introduced a new interactive interpreter (REPL) with multi-line editing, colored output and history browsing, based on code from the PyPy project.", "body": "### Ways to run code\n\n| Method | Command | Use |\n|---|---|---|\n| REPL | `python3` | Quick experiments |\n| Script | `python3 app.py` | Programs |\n| Module | `python3 -m http.server 8000` | Run a package’s main module |\n| One-liner | `python3 -c \"print(2**10)\"` | Tiny tasks |\n| Notebook | Jupyter | Data exploration |\n\n### A first script\n\n```python\n# hello.py\nname = \"Asha\"\nprint(f\"Hello, {name}!\")\n```\n\n```bash\npython3 hello.py\n# Hello, Asha!\n```"}, {"id": 4, "title": "The Zen of Python", "tldr": "The Zen of Python lists guiding principles such as “Readability counts” and “Simple is better than complex”. They shape idiomatic (“Pythonic”) code and help you choose between alternative solutions.", "real": "Tim Peters wrote the 19 aphorisms of the Zen of Python in 1999; they were published as PEP 20 and appear when you type `import this` in any Python interpreter.", "body": "### Selected principles\n\n| Principle | In practice |\n|---|---|\n| Beautiful is better than ugly | Clean, consistent code |\n| Explicit is better than implicit | Clear names, no hidden magic |\n| Simple is better than complex | Prefer straightforward solutions |\n| Readability counts | Code is read more than written |\n| Errors should never pass silently | Don’t swallow exceptions |\n| There should be one obvious way to do it | Use idioms |\n\n### See them yourself\n\n```python\nimport this\n```"}, {"id": 5, "title": "PEPs and PEP 8 style", "tldr": "Python Enhancement Proposals (PEPs) document language changes and conventions. PEP 8 is the style guide: 4-space indentation, snake_case for functions and variables, CapWords for classes, and readable line lengths.", "real": "PEP 8 was written in 2001 by Guido van Rossum, Barry Warsaw and Nick Coghlan, and modern tools such as Black and Ruff format and lint code automatically according to PEP 8–compatible rules.", "body": "### Naming conventions\n\n| Thing | Convention | Example |\n|---|---|---|\n| Variables, functions | snake_case | `total_price`, `load_data()` |\n| Classes | CapWords | `OrderService` |\n| Constants | UPPER_SNAKE_CASE | `MAX_RETRIES` |\n| Modules | short lowercase | `utils.py` |\n| “Private” names | leading underscore | `_cache` |\n\n### Layout rules\n\n- 4 spaces per indentation level (never tabs mixed with spaces)\n- Two blank lines between top-level functions and classes\n- Imports at the top: standard library, third-party, local\n- Spaces around operators: `x = a + b`\n\n### Let tools do it\n\n```bash\nruff format .   # or: black .\nruff check .\n```"}, {"id": 6, "title": "Virtual environments", "tldr": "A virtual environment is an isolated directory with its own Python packages, so each project’s dependencies don’t conflict. Create one per project and never install project packages into the system Python.", "real": "The built-in venv module was added in Python 3.3 (PEP 405), and newer tools such as uv (released by Astral in 2024) create and manage virtual environments much faster.", "body": "### Create and use (venv)\n\n```bash\npython3 -m venv .venv\nsource .venv/bin/activate        # macOS / Linux\n.venv\\Scripts\\activate           # Windows\npython -m pip install requests\ndeactivate\n```\n\n### Create and use (uv)\n\n```bash\nuv venv\nuv pip install requests\n# or manage a project:\nuv init myapp && cd myapp && uv add requests\n```\n\n### Why isolation matters\n\n```mermaid\nflowchart LR\n  P1[Project A: Django 4] --> V1[.venv A]\n  P2[Project B: Django 5] --> V2[.venv B]\n  SYS[System Python] -.untouched.-> OS[Operating system tools]\n```"}, {"id": 7, "title": "pip and PyPI", "tldr": "pip installs packages from the Python Package Index (PyPI). Pin versions for reproducibility, prefer `python -m pip` to target the right interpreter, and check packages before installing, since malicious packages exist.", "real": "PyPI hosts hundreds of thousands of projects; in March 2024 it temporarily suspended new account registration and project creation to deal with a large malware upload campaign, and it requires two-factor authentication for all uploaders since January 2024.", "body": "### Common commands\n\n```bash\npython -m pip install requests            # install\npython -m pip install \"requests>=2.31,<3\" # version range\npython -m pip install -r requirements.txt\npython -m pip list\npython -m pip show requests\npython -m pip uninstall requests\npython -m pip freeze > requirements.txt   # snapshot\n```\n\n### Safety habits\n\n| Habit | Why |\n|---|---|\n| Check the exact package name | Typosquatting attacks |\n| Prefer well-maintained projects | Security fixes |\n| Pin versions / use lock files | Reproducible installs |\n| Scan dependencies (pip-audit) | Known vulnerabilities |"}, {"id": 8, "title": "Editors and tools", "tldr": "Use an editor with Python support: syntax highlighting, linting, formatting, debugging and type checking. VS Code, PyCharm and others integrate tools such as Ruff, mypy or Pyright, and pytest.", "real": "The Python extension for Visual Studio Code and JetBrains PyCharm are among the most widely used Python development environments, according to the Python Developers Survey run by the PSF and JetBrains.", "body": "### Recommended setup\n\n| Tool | Purpose |\n|---|---|\n| Editor / IDE | VS Code, PyCharm, Neovim |\n| Formatter | Ruff format or Black |\n| Linter | Ruff |\n| Type checker | mypy or Pyright |\n| Test runner | pytest |\n| Debugger | Built into IDE, or pdb |\n\n### Editor settings to enable\n\n- Format on save\n- Show lint warnings inline\n- Select the project’s virtual environment as interpreter\n- Run tests from the editor"}, {"id": 9, "title": "Your first programs: print and input", "tldr": "`print()` writes output and `input()` reads a line of text from the user as a string. Convert input to numbers explicitly, and use f-strings to format output.", "real": "Python 3 changed print from a statement to a function (PEP 3105), one of the most visible changes when Python 3.0 was released in 2008.", "body": "### Example\n\n```python\nname = input(\"What is your name? \")\nage = int(input(\"How old are you? \"))\nprint(f\"Hi {name}, next year you will be {age + 1}.\")\n```\n\n### print options\n\n```python\nprint(\"a\", \"b\", \"c\")            # a b c\nprint(\"a\", \"b\", sep=\"-\")        # a-b\nprint(\"no newline\", end=\"\")     # stays on same line\nprint()                         # empty line\n```\n\n### Note\n\n`input()` always returns a `str`; `int(\"abc\")` raises `ValueError`, so validate input in real programs (Part 8)."}, {"id": 10, "title": "How Python runs your code", "tldr": "CPython, the reference implementation, compiles source code to bytecode and runs it on a virtual machine. Bytecode is cached in `__pycache__` folders. Other implementations exist, such as PyPy.", "real": "CPython 3.11 included the “Faster CPython” improvements, an adaptive specializing interpreter that made it on average about 1.25 times faster than 3.10 on the standard benchmark suite; later versions added an experimental JIT compiler.", "body": "### Execution pipeline\n\n```mermaid\nflowchart LR\n  SRC[Source .py] --> PARSE[Parse to AST]\n  PARSE --> COMPILE[Compile to bytecode]\n  COMPILE --> CACHE[__pycache__/*.pyc]\n  COMPILE --> VM[Bytecode interpreter]\n  VM --> OUT[Program runs]\n```\n\n### See bytecode\n\n```python\nimport dis\n\ndef add(a, b):\n    return a + b\n\ndis.dis(add)\n```\n\n### Implementations\n\n| Implementation | Notes |\n|---|---|\n| CPython | Reference implementation, written in C |\n| PyPy | JIT-compiled, often faster for pure-Python code |\n| MicroPython | For microcontrollers |\n| GraalPy | On the GraalVM |"}, {"id": 11, "title": "Variables, names and objects", "tldr": "In Python, variables are names bound to objects; assignment never copies data. Every object has an identity, a type and a value. Several names can refer to the same object, which matters for mutable objects.", "real": "Ned Batchelder’s widely cited PyCon 2015 talk “Facts and Myths about Python Names and Values” explained that Python names are references to objects, clarifying a common source of bugs with lists and dictionaries.", "body": "### Names point to objects\n\n```python\na = [1, 2, 3]\nb = a            # b refers to the same list\nb.append(4)\nprint(a)         # [1, 2, 3, 4]\nprint(a is b)    # True: same object\n```\n\n### Identity, type, value\n\n```python\nx = 42\nprint(id(x), type(x), x)\n```\n\n### Rules for names\n\n| Rule | Example |\n|---|---|\n| Letters, digits, underscores | `total_2026` |\n| Can’t start with a digit | `2total` is invalid |\n| Case-sensitive | `Name` ≠ `name` |\n| Avoid built-in names | Don’t use `list`, `dict`, `id` as variables |"}, {"id": 12, "title": "Numbers", "tldr": "Python has `int` (unlimited precision), `float` (64-bit binary floating point), and `complex`, plus `decimal.Decimal` for exact decimal arithmetic and `fractions.Fraction` for exact ratios. Know floating-point limits.", "real": "Because floats use binary IEEE 754 representation, `0.1 + 0.2 == 0.3` is False in Python (and most languages), which is why financial software uses Decimal or integer cents.", "body": "### Arithmetic\n\n```python\n7 + 2      # 9\n7 / 2      # 3.5  (true division always returns float)\n7 // 2     # 3    (floor division)\n-7 // 2    # -4   (floors toward negative infinity)\n7 % 2      # 1\n2 ** 100   # 1267650600228229401496703205376 (exact int)\n```\n\n### Floats vs Decimal\n\n```python\n0.1 + 0.2                    # 0.30000000000000004\nfrom decimal import Decimal\nDecimal(\"0.1\") + Decimal(\"0.2\")   # Decimal('0.3')\nimport math\nmath.isclose(0.1 + 0.2, 0.3)      # True\n```\n\n### Readable literals\n\n```python\npopulation = 1_400_000_000\nhex_value = 0xFF       # 255\n```"}, {"id": 13, "title": "Strings", "tldr": "Strings (`str`) are immutable sequences of Unicode characters. Create them with single, double or triple quotes; index and slice them; and remember that methods return new strings rather than changing the original.", "real": "Python 3.0 made `str` a Unicode text type and separated it strictly from `bytes`, fixing many encoding bugs common in Python 2, where text and bytes were easily confused.", "body": "### Basics\n\n```python\ns = \"Python\"\ns[0]        # 'P'\ns[-1]       # 'n'\ns[1:4]      # 'yth'\ns[::-1]     # 'nohtyP'\nlen(s)      # 6\n\"py\" in s.lower()   # True\n```\n\n### Multi-line and raw strings\n\n```python\ntext = \"\"\"Line 1\nLine 2\"\"\"\npath = r\"C:\\new\\folder\"   # raw string: backslashes kept literally\n```\n\n### Immutability\n\n```python\ns = \"hello\"\ns.upper()   # 'HELLO' (new string)\nprint(s)    # 'hello' (unchanged)\n```"}, {"id": 14, "title": "String methods and f-strings", "tldr": "Use string methods for cleaning and transforming text (strip, split, join, replace, startswith) and f-strings for formatting, including format specifiers for numbers, alignment and dates.", "real": "f-strings were introduced in Python 3.6 (PEP 498) and Python 3.12 (PEP 701) relaxed their grammar, allowing reuse of the same quote type and multi-line expressions inside them.", "body": "### Common methods\n\n```python\n\"  hi  \".strip()                 # 'hi'\n\"a,b,c\".split(\",\")               # ['a', 'b', 'c']\n\"-\".join([\"2026\", \"03\", \"01\"])   # '2026-03-01'\n\"data.csv\".endswith(\".csv\")      # True\n\"Hello\".replace(\"l\", \"L\")        # 'HeLLo'\n\"42\".zfill(5)                    # '00042'\n```\n\n### f-string formatting\n\n```python\nprice = 1234.5\nname = \"Asha\"\nprint(f\"{name:>10}\")        # right-align in 10 chars\nprint(f\"{price:,.2f}\")      # 1,234.50\nprint(f\"{0.256:.1%}\")       # 25.6%\nprint(f\"{price=}\")          # price=1234.5 (debug form, 3.8+)\n```\n\n### Joining performance\n\nBuild strings from many pieces with `\"\".join(parts)` rather than repeated `+=` in a loop."}, {"id": 15, "title": "Booleans and truthiness", "tldr": "`True` and `False` are the boolean values, and every object has a truth value: empty containers, zero, `None` and `False` are falsy; most other values are truthy. `and`/`or` short-circuit and return one of their operands.", "real": "`bool` is a subclass of `int` in Python, so `True + True` equals 2, a design decision from Python 2.3 (PEP 285) kept for backward compatibility.", "body": "### Falsy values\n\n| Value | Type |\n|---|---|\n| `False` | bool |\n| `None` | NoneType |\n| `0`, `0.0` | numbers |\n| `\"\"` | empty string |\n| `[]`, `()`, `{}`, `set()` | empty containers |\n\n### Idioms\n\n```python\nitems = []\nif not items:\n    print(\"empty\")\n\nname = user_input or \"Anonymous\"   # default if empty\n```\n\n### Short-circuit results\n\n```python\n0 or \"default\"      # 'default'\n\"a\" and \"b\"         # 'b'\nNone and expensive() # None (expensive() not called)\n```"}, {"id": 16, "title": "None", "tldr": "`None` represents the absence of a value. Functions without a return statement return None. Compare with `is None`, not `== None`, and be explicit when None is a valid input.", "real": "PEP 8 recommends that comparisons to singletons like None always use `is` or `is not`, never equality operators, because `==` can be overridden by classes.", "body": "### Usage\n\n```python\ndef find_user(user_id):\n    ...\n    return None          # not found\n\nuser = find_user(42)\nif user is None:\n    print(\"No such user\")\n```\n\n### Implicit return\n\n```python\ndef greet():\n    print(\"hi\")\n\nresult = greet()\nprint(result)   # None\n```\n\n### Sentinel values\n\nWhen None is a valid value, use a unique sentinel object to mean “not provided”:\n\n```python\n_MISSING = object()\n\ndef get(key, default=_MISSING):\n    ...\n```\n\nPython 3.15 adds a built-in `sentinel` type (PEP 661) for creating such markers with a readable repr."}, {"id": 17, "title": "Operators and precedence", "tldr": "Python has arithmetic, comparison, logical, identity (`is`), membership (`in`), bitwise and assignment operators. Comparisons can be chained. Use parentheses when precedence is not obvious.", "real": "Python supports chained comparisons such as `0 < x < 10`, which most C-family languages do not, making range checks read like mathematics.", "body": "### Operator groups\n\n| Group | Operators |\n|---|---|\n| Arithmetic | `+ - * / // % **` |\n| Comparison | `== != < <= > >=` |\n| Logical | `and or not` |\n| Identity | `is`, `is not` |\n| Membership | `in`, `not in` |\n| Bitwise | `&`, `^`, `~`, `<<`, `>>` and bitwise or (the vertical bar) |\n| Augmented assignment | `+= -= *= ...` |\n\n### Chained comparisons\n\n```python\nage = 25\n18 <= age < 65     # True\n```\n\n### `is` vs `==`\n\n```python\na = [1, 2]\nb = [1, 2]\na == b   # True  (equal values)\na is b   # False (different objects)\n```"}, {"id": 18, "title": "Type conversion", "tldr": "Convert explicitly between types with `int()`, `float()`, `str()`, `bool()`, `list()` and others. Python does not silently convert strings to numbers, which prevents a class of bugs but requires validation.", "real": "Unlike JavaScript, where `\"5\" + 1` yields `\"51\"`, Python raises a TypeError for `\"5\" + 1`, a deliberate design choice favoring explicit conversions.", "body": "### Conversions\n\n```python\nint(\"42\")          # 42\nint(\"101\", 2)      # 5   (binary)\nfloat(\"3.14\")      # 3.14\nstr(99)            # '99'\nbool(\"\")           # False\nlist(\"abc\")        # ['a', 'b', 'c']\nint(3.99)          # 3   (truncates toward zero)\nround(2.5)         # 2   (banker's rounding to even)\n```\n\n### Safe parsing\n\n```python\ndef parse_int(text):\n    try:\n        return int(text)\n    except ValueError:\n        return None\n```"}, {"id": 19, "title": "Comments and docstrings", "tldr": "Comments (`#`) explain why code does something; docstrings (triple-quoted strings as the first statement) document what modules, classes and functions do. Docstrings are available at runtime via `help()` and tools.", "real": "PEP 257 defines docstring conventions, and documentation tools such as Sphinx and IDEs read docstrings to generate API documentation and tooltips.", "body": "### Example\n\n```python\ndef average(values: list[float]) -> float:\n    \"\"\"Return the arithmetic mean of values.\n\n    Raises:\n        ValueError: if values is empty.\n    \"\"\"\n    if not values:\n        raise ValueError(\"values must not be empty\")\n    return sum(values) / len(values)\n\nhelp(average)\n```\n\n### Good comments\n\n| Avoid | Prefer |\n|---|---|\n| `i += 1  # add one to i` | `# Skip the header row` |\n| Commented-out old code | Delete it (version control keeps history) |\n| Outdated comments | Update with code changes |"}, {"id": 20, "title": "Basic input/output patterns", "tldr": "Beyond print and input, programs read command-line arguments, environment variables and standard input streams. Know these basics before moving to files and argument parsers.", "real": "Unix tools are often written to read standard input and write standard output so they can be chained with pipes, and Python scripts can follow the same convention with `sys.stdin` and `sys.stdout`.", "body": "### Command-line arguments\n\n```python\nimport sys\nprint(sys.argv)   # ['script.py', 'arg1', 'arg2']\n```\n\n### Environment variables\n\n```python\nimport os\napi_url = os.environ.get(\"API_URL\", \"https://example.com\")\n```\n\n### Reading standard input\n\n```python\nimport sys\nfor line in sys.stdin:\n    print(line.strip().upper())\n```\n\n```bash\ncat names.txt | python3 upper.py\n```\n\n### Writing errors\n\n```python\nprint(\"Something went wrong\", file=sys.stderr)\n```"}, {"id": 21, "title": "if, elif and else", "tldr": "Conditional statements run code based on conditions. Indentation defines blocks. Keep conditions simple, use early returns to avoid deep nesting, and use conditional expressions for short value choices.", "real": "Python uses indentation instead of braces to define blocks, a design inherited from the ABC language that Guido van Rossum worked on at CWI in the Netherlands in the 1980s.", "body": "### Syntax\n\n```python\nscore = 82\nif score >= 90:\n    grade = \"A\"\nelif score >= 75:\n    grade = \"B\"\nelse:\n    grade = \"C\"\n```\n\n### Conditional expression\n\n```python\nstatus = \"adult\" if age >= 18 else \"minor\"\n```\n\n### Early return instead of nesting\n\n```python\ndef ship(order):\n    if order is None:\n        return \"no order\"\n    if not order.paid:\n        return \"unpaid\"\n    return \"shipping\"\n```"}, {"id": 22, "title": "while loops", "tldr": "`while` repeats while a condition is true. Ensure the condition eventually becomes false, or use `break`. Prefer `for` loops when iterating over a known collection or range.", "real": "Retry loops with backoff, common in network clients, are typical `while` use cases, where the number of iterations depends on runtime results rather than a fixed collection.", "body": "### Example\n\n```python\nattempts = 0\nwhile attempts < 3:\n    attempts += 1\n    print(f\"Attempt {attempts}\")\n```\n\n### Loop until valid input\n\n```python\nwhile True:\n    text = input(\"Enter a number: \")\n    if text.isdigit():\n        number = int(text)\n        break\n    print(\"Try again\")\n```\n\n### Pitfall\n\nForgetting to update the loop variable creates an infinite loop; press Ctrl+C to interrupt."}, {"id": 23, "title": "for loops and range", "tldr": "`for` iterates over any iterable: lists, strings, dictionaries, files, generators. `range(start, stop, step)` produces numbers lazily, with stop excluded.", "real": "In Python 3, `range` returns a lazy sequence object rather than a list (Python 2’s `xrange` behavior), so `range(10**12)` uses almost no memory.", "body": "### Examples\n\n```python\nfor fruit in [\"apple\", \"mango\", \"banana\"]:\n    print(fruit)\n\nfor i in range(5):          # 0..4\n    print(i)\n\nfor i in range(10, 0, -2):  # 10, 8, 6, 4, 2\n    print(i)\n\nfor ch in \"abc\":\n    print(ch)\n```\n\n### range facts\n\n| Expression | Values |\n|---|---|\n| `range(3)` | 0, 1, 2 |\n| `range(1, 4)` | 1, 2, 3 |\n| `range(0, 10, 3)` | 0, 3, 6, 9 |\n| `len(range(10**12))` | 1000000000000 (no list created) |"}, {"id": 24, "title": "break, continue and loop else", "tldr": "`break` exits a loop, `continue` skips to the next iteration, and a loop’s `else` block runs only if the loop finished without `break`, which is useful for search loops.", "real": "The loop `else` clause is one of Python’s less known features; Raymond Hettinger has suggested it would have been clearer if named “nobreak”, which describes when it runs.", "body": "### Search with for-else\n\n```python\nnumbers = [3, 7, 11, 15]\nfor n in numbers:\n    if n % 5 == 0:\n        print(\"Found multiple of 5:\", n)\n        break\nelse:\n    print(\"No multiple of 5\")\n```\n\n### continue\n\n```python\nfor line in [\"# comment\", \"data 1\", \"\", \"data 2\"]:\n    if not line or line.startswith(\"#\"):\n        continue\n    print(line)\n```"}, {"id": 25, "title": "Structural pattern matching", "tldr": "`match`/`case` (Python 3.10+) matches values against patterns: literals, sequences, mappings, class patterns and guards. It is powerful for parsing structured data such as commands, JSON messages or ASTs.", "real": "Structural pattern matching was added in Python 3.10 through PEP 634, 635 and 636, among the larger syntax additions in Python 3, inspired by similar features in functional languages.", "body": "### Example\n\n```python\ndef handle(command: dict) -> str:\n    match command:\n        case {\"action\": \"move\", \"x\": int(x), \"y\": int(y)}:\n            return f\"Moving to {x}, {y}\"\n        case {\"action\": \"say\", \"text\": str(text)}:\n            return f\"Saying {text}\"\n        case {\"action\": \"quit\"}:\n            return \"Bye\"\n        case _:\n            return \"Unknown command\"\n```\n\n### Pattern types\n\n| Pattern | Example |\n|---|---|\n| Literal | `case 404:` |\n| Capture | `case x:` |\n| Sequence | `case [first, *rest]:` |\n| Mapping | `case {\"type\": \"user\"}:` |\n| Class | `case Point(x=0, y=y):` |\n| Or-pattern | Alternatives joined by a vertical bar (example below) |\n| Guard | `case n if n > 0:` |\n\n```python\nmatch answer.lower():\n    case \"y\" | \"yes\":\n        proceed()\n    case _:\n        stop()\n```"}, {"id": 26, "title": "Comprehensions: first look", "tldr": "Comprehensions build lists, sets and dicts from iterables in one readable expression, optionally filtering items. Use them for simple transformations; switch to loops when logic gets complex.", "real": "List comprehensions were added in Python 2.0 (PEP 202), borrowing notation from mathematics and the Haskell language, and became one of Python’s most recognizable idioms.", "body": "### Examples\n\n```python\nsquares = [n * n for n in range(10)]\nevens = [n for n in range(20) if n % 2 == 0]\nlengths = {word: len(word) for word in [\"py\", \"data\", \"ai\"]}\nunique_lengths = {len(w) for w in [\"py\", \"go\", \"rust\"]}\n```\n\n### Loop equivalent\n\n```python\nsquares = []\nfor n in range(10):\n    squares.append(n * n)\n```\n\n### Readability limit\n\nIf a comprehension needs more than one condition and nested loops, a regular loop is usually clearer."}, {"id": 27, "title": "How iteration works", "tldr": "A `for` loop calls `iter()` on an iterable to get an iterator, then calls `next()` until `StopIteration`. Understanding this protocol explains why files, dicts and generators all work in loops.", "real": "The iterator protocol was formalized in PEP 234 (Python 2.2, 2001), unifying iteration across built-in types and user-defined classes.", "body": "### What a for loop does\n\n```python\nit = iter([10, 20, 30])\nprint(next(it))   # 10\nprint(next(it))   # 20\nprint(next(it))   # 30\n# next(it) now raises StopIteration\n```\n\n### Iterable vs iterator\n\n| Term | Meaning | Example |\n|---|---|---|\n| Iterable | Can produce an iterator | list, str, dict, file |\n| Iterator | Produces items one by one, remembers position | `iter(list)`, generator |\n\n### Consequence\n\nIterators are consumed once:\n\n```python\ngen = (n for n in range(3))\nlist(gen)   # [0, 1, 2]\nlist(gen)   # []\n```"}, {"id": 28, "title": "enumerate, zip and friends", "tldr": "Use `enumerate()` to get indexes with items, `zip()` to iterate several sequences together, `reversed()` and `sorted()` for ordering. These built-ins replace error-prone index arithmetic.", "real": "Python 3.10 added `zip(..., strict=True)` (PEP 618), which raises an error if inputs have different lengths, preventing silent data loss when sequences don’t match.", "body": "### Examples\n\n```python\nnames = [\"Asha\", \"Ben\", \"Chen\"]\nscores = [91, 78, 85]\n\nfor i, name in enumerate(names, start=1):\n    print(i, name)\n\nfor name, score in zip(names, scores, strict=True):\n    print(f\"{name}: {score}\")\n\nfor name in reversed(names):\n    print(name)\n\nfor name in sorted(names, key=len):\n    print(name)\n```\n\n### Anti-pattern\n\n```python\n# Avoid\nfor i in range(len(names)):\n    print(names[i])\n```"}, {"id": 29, "title": "The walrus operator", "tldr": "The assignment expression `:=` (Python 3.8+) assigns a value inside an expression, useful in while loops, comprehensions and conditions to avoid repeated computation. Use it sparingly for clarity.", "real": "The walrus operator (PEP 572) was so contentious in the Python community that Guido van Rossum cited the debate when he stepped down as “Benevolent Dictator For Life” in July 2018.", "body": "### Examples\n\n```python\n# Read chunks until empty\nwhile (chunk := file.read(8192)):\n    process(chunk)\n\n# Avoid calling a function twice\nif (n := len(items)) > 10:\n    print(f\"Too many items: {n}\")\n\n# Reuse computed value in a comprehension\nresults = [y for x in data if (y := transform(x)) is not None]\n```\n\n### Guideline\n\nUse it when it removes duplication; avoid it when a separate assignment line is clearer."}, {"id": 30, "title": "Common loop patterns", "tldr": "Recognize recurring loop patterns: accumulate, count, find, filter, transform, group and pairwise comparison. Many have built-in or standard-library shortcuts that are clearer and faster.", "real": "Python’s built-ins `sum`, `min`, `max`, `any` and `all` are implemented in C in CPython, so they are typically faster than equivalent hand-written loops.", "body": "### Patterns and idioms\n\n| Pattern | Idiom |\n|---|---|\n| Sum values | `sum(prices)` |\n| Count matching | `sum(1 for p in prices if p > 100)` |\n| Any match | `any(p > 100 for p in prices)` |\n| All match | `all(p > 0 for p in prices)` |\n| Min/max by key | `max(products, key=lambda p: p.price)` |\n| Group items | `collections.defaultdict(list)` |\n| Pairwise | `itertools.pairwise(seq)` (3.10+) |\n| Count occurrences | `collections.Counter(words)` |\n\n### Example: group by first letter\n\n```python\nfrom collections import defaultdict\ngroups = defaultdict(list)\nfor word in [\"apple\", \"avocado\", \"banana\"]:\n    groups[word[0]].append(word)\n# {'a': ['apple', 'avocado'], 'b': ['banana']}\n```"}, {"id": 31, "title": "Lists", "tldr": "Lists are ordered, mutable sequences that can hold any objects. They support indexing, slicing, appending and sorting. Appending is fast; inserting or removing at the front is slow for large lists.", "real": "CPython implements lists as dynamic arrays of pointers that over-allocate space, so `append` runs in amortized constant time while `insert(0, x)` must shift every element.", "body": "### Basics\n\n```python\nlangs = [\"python\", \"go\", \"rust\"]\nlangs.append(\"java\")\nlangs[0]            # 'python'\nlangs[-1]           # 'java'\nlangs[1:3]          # ['go', 'rust']\nlen(langs)          # 4\n\"go\" in langs       # True (linear search)\n```\n\n### Time complexity (CPython)\n\n| Operation | Complexity |\n|---|---|\n| `lst[i]`, `lst[i] = x` | O(1) |\n| `append(x)` | O(1) amortized |\n| `pop()` (end) | O(1) |\n| `insert(0, x)`, `pop(0)` | O(n) |\n| `x in lst` | O(n) |\n| `sort()` | O(n log n) |"}, {"id": 32, "title": "List methods, slicing and sorting", "tldr": "Master list methods (append, extend, insert, remove, pop, index, count, sort, reverse), slice assignment, and sorting with `key` functions. `sort()` changes the list in place; `sorted()` returns a new list.", "real": "Python’s sorting algorithm, Timsort, was designed by Tim Peters in 2002 for CPython and was later adopted by Java (for object arrays) and Android; CPython 3.11 refined its merge strategy using the “powersort” policy.", "body": "### Methods\n\n```python\nnums = [5, 2, 9]\nnums.extend([1, 7])     # [5, 2, 9, 1, 7]\nnums.insert(1, 4)       # [5, 4, 2, 9, 1, 7]\nnums.remove(9)          # first occurrence\nlast = nums.pop()       # 7\nnums.sort()             # in place: [1, 2, 4, 5]\nnums.sort(reverse=True)\n```\n\n### Sorting with key\n\n```python\npeople = [(\"Asha\", 31), (\"Ben\", 25), (\"Chen\", 31)]\nsorted(people, key=lambda p: p[1])           # by age (stable)\nsorted(people, key=lambda p: (-p[1], p[0]))  # age desc, then name\n```\n\n### Slicing\n\n```python\ndata = list(range(10))\ndata[::2]      # [0, 2, 4, 6, 8]\ndata[2:5] = [] # delete elements 2..4\ncopy = data[:] # shallow copy\n```"}, {"id": 33, "title": "Tuples and unpacking", "tldr": "Tuples are immutable sequences, ideal for fixed groups of values such as coordinates or records. Unpacking assigns elements to names, including starred unpacking for “the rest”.", "real": "Functions such as `divmod()` and dictionary `.items()` return tuples, and swapping variables with `a, b = b, a` is a classic Python idiom made possible by tuple packing and unpacking.", "body": "### Examples\n\n```python\npoint = (3, 4)\nx, y = point\na, b = b, a                      # swap\nfirst, *middle, last = [1, 2, 3, 4, 5]\nq, r = divmod(17, 5)             # (3, 2)\nsingle = (42,)                   # one-element tuple needs a comma\n```\n\n### Tuples vs lists\n\n| | Tuple | List |\n|---|---|---|\n| Mutability | Immutable | Mutable |\n| Use | Fixed structure (record) | Collection of similar items |\n| Hashable (as dict key) | Yes, if elements hashable | No |\n| Memory | Slightly smaller | Larger |"}, {"id": 34, "title": "Dictionaries", "tldr": "Dictionaries map hashable keys to values with average O(1) lookup, insertion and deletion. Keys must be hashable (immutable types such as str, int, tuple). They are the most important data structure in Python.", "real": "Dictionaries preserve insertion order as a language guarantee since Python 3.7, after CPython 3.6 introduced a compact dict implementation that kept order and reduced memory use.", "body": "### Basics\n\n```python\nuser = {\"name\": \"Asha\", \"age\": 31}\nuser[\"email\"] = \"asha@example.com\"\nuser[\"name\"]                # 'Asha'\nuser.get(\"phone\")           # None (no KeyError)\nuser.get(\"phone\", \"n/a\")    # 'n/a'\n\"age\" in user               # True\ndel user[\"age\"]\n```\n\n### Iterating\n\n```python\nfor key, value in user.items():\n    print(key, value)\n```\n\n### Merging (3.9+)\n\n```python\ndefaults = {\"theme\": \"light\", \"lang\": \"en\"}\nprefs = {\"theme\": \"dark\"}\nsettings = defaults | prefs    # {'theme': 'dark', 'lang': 'en'}\n```"}, {"id": 35, "title": "Dictionary techniques", "tldr": "Use `setdefault`, `defaultdict`, `Counter`, dict comprehensions and `.items()` idioms. Know that dict views are live and that modifying a dict while iterating over it raises an error.", "real": "Python 3.15 added a built-in `frozendict` type (PEP 814), an immutable dictionary that keeps insertion order and is hashable when its keys and values are hashable.", "body": "### Techniques\n\n```python\n# Counting\ncounts = {}\nfor word in words:\n    counts[word] = counts.get(word, 0) + 1\n\n# Grouping\ngroups = {}\nfor name in names:\n    groups.setdefault(name[0], []).append(name)\n\n# Invert a mapping\ninverted = {v: k for k, v in mapping.items()}\n\n# Filter\nexpensive = {k: v for k, v in prices.items() if v > 100}\n```\n\n### Safe modification while iterating\n\n```python\nfor key in list(d):        # iterate over a copy of keys\n    if d[key] is None:\n        del d[key]\n```"}, {"id": 36, "title": "Sets", "tldr": "Sets store unique, hashable items with fast membership tests and support mathematical operations: union, intersection, difference and symmetric difference. `frozenset` is the immutable version.", "real": "Converting a list to a set to test membership changes lookup from O(n) to average O(1), a common, simple optimization in Python code that checks many items against a large collection.", "body": "### Operations\n\n```python\na = {1, 2, 3}\nb = {3, 4}\na | b      # {1, 2, 3, 4}  union\na & b      # {3}           intersection\na - b      # {1, 2}        difference\na ^ b      # {1, 2, 4}     symmetric difference\n2 in a     # True\n```\n\n### Deduplicate while keeping order\n\n```python\nitems = [\"b\", \"a\", \"b\", \"c\", \"a\"]\nunique = list(dict.fromkeys(items))   # ['b', 'a', 'c']\n```\n\n### Empty set\n\n`set()` creates an empty set; `{}` creates an empty dict."}, {"id": 37, "title": "Comprehensions in depth", "tldr": "Comprehensions support nested loops, conditions and conditional expressions. Generator expressions produce items lazily. Keep comprehensions readable and avoid side effects inside them.", "real": "In Python 3, comprehension variables no longer leak into the enclosing scope (unlike Python 2 list comprehensions), and Python 3.12 inlined comprehensions (PEP 709), making them up to about twice as fast in some cases.", "body": "### Nested loops and conditions\n\n```python\npairs = [(x, y) for x in range(3) for y in range(3) if x != y]\nflat = [item for row in matrix for item in row]\nlabels = [\"even\" if n % 2 == 0 else \"odd\" for n in range(5)]\n```\n\n### Generator expression (lazy)\n\n```python\ntotal = sum(n * n for n in range(1_000_000))   # no big list built\n```\n\n### Order of clauses\n\n```python\n# Reads left to right, like nested for loops:\n[expr for a in A if cond_a for b in B if cond_b]\n```"}, {"id": 38, "title": "The collections module", "tldr": "`collections` provides specialized containers: `Counter` for counting, `defaultdict` for automatic defaults, `deque` for fast appends and pops at both ends, `namedtuple` for lightweight records, and `ChainMap` for layered lookups.", "real": "`collections.deque` provides O(1) appends and pops from both ends and supports a `maxlen` for bounded buffers, commonly used for queues and keeping the last N items.", "body": "### Examples\n\n```python\nfrom collections import Counter, defaultdict, deque, namedtuple\n\nCounter(\"mississippi\").most_common(2)     # [('i', 4), ('s', 4)]\n\ngraph = defaultdict(list)\ngraph[\"a\"].append(\"b\")\n\nrecent = deque(maxlen=3)\nfor n in range(5):\n    recent.append(n)                      # deque([2, 3, 4], maxlen=3)\n\nPoint = namedtuple(\"Point\", [\"x\", \"y\"])\np = Point(3, 4)\np.x, p.y                                  # 3, 4\n```\n\n### When to use\n\n| Need | Use |\n|---|---|\n| Count things | Counter |\n| Group into lists | defaultdict(list) |\n| Queue / sliding window | deque |\n| Simple immutable record | namedtuple (or dataclass, ch. 97) |"}, {"id": 39, "title": "Choosing data structures", "tldr": "Pick data structures by the operations you need: lookups by key (dict), membership (set), ordered sequences (list), fixed records (tuple/dataclass), queues (deque), priority queues (heapq). The right choice often matters more than micro-optimization.", "real": "The Python wiki’s TimeComplexity page documents the cost of operations on built-in types in CPython, and is a standard reference for choosing data structures in performance-sensitive code.", "body": "### Decision guide\n\n| Need | Structure | Average cost |\n|---|---|---|\n| Lookup by key | dict | O(1) |\n| Membership test | set | O(1) |\n| Ordered, indexed collection | list | O(1) index |\n| Queue (FIFO) | collections.deque | O(1) both ends |\n| Smallest item repeatedly | heapq on a list | O(log n) push/pop |\n| Sorted inserts and search | bisect on a list | O(log n) search, O(n) insert |\n| Fixed record | tuple / dataclass | — |\n\n### Example impact\n\n```python\n# O(n * m): slow for big lists\ncommon = [x for x in big_list if x in other_list]\n# O(n + m): fast\nother = set(other_list)\ncommon = [x for x in big_list if x in other]\n```"}, {"id": 40, "title": "Mutability and copying", "tldr": "Mutable objects (lists, dicts, sets) can change in place; immutable ones (int, str, tuple) cannot. Assignment shares references. Use shallow copies for one level and `copy.deepcopy` for nested structures.", "real": "A classic beginner bug is creating a grid with `[[0] * 3] * 3`, which repeats the same inner list three times, so changing one row changes all rows.", "body": "### The grid bug\n\n```python\ngrid = [[0] * 3] * 3\ngrid[0][0] = 1\nprint(grid)   # [[1, 0, 0], [1, 0, 0], [1, 0, 0]]\n\ngrid = [[0] * 3 for _ in range(3)]   # correct: separate rows\n```\n\n### Copying\n\n```python\nimport copy\noriginal = {\"tags\": [\"a\", \"b\"]}\nshallow = original.copy()        # or dict(original)\ndeep = copy.deepcopy(original)\n\nshallow[\"tags\"].append(\"c\")      # also changes original[\"tags\"]\ndeep[\"tags\"].append(\"d\")         # original unaffected\n```\n\n### Mutable vs immutable\n\n| Mutable | Immutable |\n|---|---|\n| list, dict, set, bytearray | int, float, str, tuple, frozenset, bytes |"}, {"id": 41, "title": "Defining functions", "tldr": "Functions package reusable logic with a name, parameters, a body and an optional return value. Good functions do one thing, have clear names, and are small enough to understand and test easily.", "real": "The PEP 8 style guide and widely used linters encourage descriptive snake_case function names, and tools such as Ruff can flag overly complex functions using the McCabe complexity rule.", "body": "### Anatomy\n\n```python\ndef net_price(price: float, tax_rate: float = 0.18) -> float:\n    \"\"\"Return price including tax.\"\"\"\n    return round(price * (1 + tax_rate), 2)\n\nnet_price(100)          # 118.0\nnet_price(100, 0.05)    # 105.0\n```\n\n### Good function checklist\n\n| Check | Why |\n|---|---|\n| One clear responsibility | Easier to test and reuse |\n| Descriptive name (verb) | Self-documenting |\n| Few parameters | Simpler calls |\n| No hidden side effects | Predictable behavior |\n| Docstring for public functions | Usability |"}, {"id": 42, "title": "Parameters and arguments", "tldr": "Python supports positional and keyword arguments, default values, `*args` for extra positional arguments, `**kwargs` for extra keyword arguments, positional-only parameters (before `/`) and keyword-only parameters (after `*`).", "real": "Positional-only parameters were added to Python’s syntax in version 3.8 (PEP 570), formalizing a convention already used by many built-in functions such as `len()`.", "body": "### Full signature\n\n```python\ndef f(a, b, /, c, d=4, *args, e, f=6, **kwargs):\n    ...\n# a, b: positional-only\n# c, d: positional or keyword (d has default)\n# args: extra positional\n# e, f: keyword-only (e required)\n# kwargs: extra keyword\n```\n\n### Practical example\n\n```python\ndef connect(host, port=5432, *, timeout=10, ssl=True):\n    ...\n\nconnect(\"db.internal\", timeout=5)      # OK\nconnect(\"db.internal\", 5432, 5)        # TypeError: timeout is keyword-only\n```\n\n### Unpacking arguments\n\n```python\nvalues = [1, 2]\noptions = {\"timeout\": 5}\nconnect(*values[:1], **options)\n```"}, {"id": 43, "title": "The mutable default argument trap", "tldr": "Default values are evaluated once, when the function is defined. A mutable default such as a list is shared across calls, causing surprising behavior. Use `None` as the default and create the object inside the function.", "real": "This is one of the most frequently asked Python questions on Stack Overflow, and linters such as Ruff (rule B006, from flake8-bugbear) warn about mutable default arguments.", "body": "### The bug\n\n```python\ndef add_item(item, items=[]):\n    items.append(item)\n    return items\n\nadd_item(\"a\")   # ['a']\nadd_item(\"b\")   # ['a', 'b']  ← same list reused!\n```\n\n### The fix\n\n```python\ndef add_item(item, items=None):\n    if items is None:\n        items = []\n    items.append(item)\n    return items\n```"}, {"id": 44, "title": "Return values", "tldr": "Functions return one object; return a tuple to return several values, and unpack it at the call site. Prefer returning values over modifying arguments, and be consistent about what a function returns in all paths.", "real": "Built-in functions such as `divmod()` return tuples, and the convention of returning `(result, error)` pairs is avoided in Python in favor of exceptions, unlike in Go.", "body": "### Multiple values\n\n```python\ndef stats(values):\n    return min(values), max(values), sum(values) / len(values)\n\nlow, high, mean = stats([3, 8, 4])\n```\n\n### Consistent return types\n\n```python\n# Avoid: returns list or False\ndef find_matches(text):\n    ...\n\n# Prefer: always a list (possibly empty)\ndef find_matches(text) -> list[str]:\n    ...\n```\n\n### Pure vs impure\n\n| Pure function | Impure function |\n|---|---|\n| Same input → same output | Depends on or changes external state |\n| No side effects | Writes files, mutates arguments |\n| Easy to test | Needs setup/mocks |"}, {"id": 45, "title": "Scope: LEGB, global and nonlocal", "tldr": "Python resolves names in order Local, Enclosing, Global, Built-in (LEGB). Assigning to a name inside a function makes it local unless declared `global` or `nonlocal`. Minimize global state.", "real": "An UnboundLocalError, raised when a function assigns to a variable it also reads before assignment, is a common confusion caused by Python deciding scope at compile time.", "body": "### LEGB\n\n```mermaid\nflowchart LR\n  L[Local] --> E[Enclosing functions]\n  E --> G[Global module]\n  G --> B[Built-ins]\n```\n\n### Examples\n\n```python\ncount = 0\n\ndef increment():\n    global count        # needed to rebind module-level name\n    count += 1\n\ndef make_counter():\n    n = 0\n    def inc():\n        nonlocal n      # rebind enclosing variable\n        n += 1\n        return n\n    return inc\n```\n\n### UnboundLocalError\n\n```python\nx = 10\ndef f():\n    print(x)   # UnboundLocalError: x is local (assigned below)\n    x = 5\n```"}, {"id": 46, "title": "First-class functions and lambdas", "tldr": "Functions are objects: you can pass them as arguments, return them and store them in data structures. `lambda` creates small anonymous functions for simple expressions, often used as `key` functions.", "real": "Python’s `sorted()`, `min()`, `max()` and `re.sub()` all accept functions as arguments, and dictionaries of functions are a common way to implement command dispatch tables.", "body": "### Functions as values\n\n```python\ndef shout(text): return text.upper()\ndef whisper(text): return text.lower()\n\nhandlers = {\"loud\": shout, \"quiet\": whisper}\nhandlers[\"loud\"](\"hello\")    # 'HELLO'\n```\n\n### lambda\n\n```python\nproducts = [{\"name\": \"pen\", \"price\": 10}, {\"name\": \"book\", \"price\": 250}]\ncheapest = min(products, key=lambda p: p[\"price\"])\n```\n\n### When not to use lambda\n\nIf it needs a name, multiple expressions or a docstring, write a normal `def`. Assigning a lambda to a variable is discouraged by PEP 8."}, {"id": 47, "title": "Closures", "tldr": "A closure is a function that remembers variables from the scope where it was created. Closures enable factories, callbacks and decorators. Be careful with loop variables captured late.", "real": "The late-binding behavior of closures in loops, where all created lambdas see the final loop value, is listed in the Python Programming FAQ as a common surprise.", "body": "### Factory\n\n```python\ndef make_multiplier(factor):\n    def multiply(x):\n        return x * factor\n    return multiply\n\ndouble = make_multiplier(2)\ndouble(21)   # 42\n```\n\n### Late-binding pitfall\n\n```python\nfuncs = [lambda: i for i in range(3)]\n[f() for f in funcs]          # [2, 2, 2]\n\nfuncs = [lambda i=i: i for i in range(3)]\n[f() for f in funcs]          # [0, 1, 2]\n```"}, {"id": 48, "title": "Decorators: introduction", "tldr": "A decorator takes a function and returns a new function that adds behavior (logging, timing, caching, access control). The `@decorator` syntax applies it. Use `functools.wraps` to keep the original name and docstring.", "real": "Web frameworks rely heavily on decorators: Flask’s `@app.route(\"/\")` and FastAPI’s `@app.get(\"/\")` register functions as request handlers.", "body": "### Timing decorator\n\n```python\nimport functools\nimport time\n\ndef timed(func):\n    @functools.wraps(func)\n    def wrapper(*args, **kwargs):\n        start = time.perf_counter()\n        try:\n            return func(*args, **kwargs)\n        finally:\n            elapsed = time.perf_counter() - start\n            print(f\"{func.__name__} took {elapsed:.3f}s\")\n    return wrapper\n\n@timed\ndef slow_sum(n):\n    return sum(range(n))\n\nslow_sum(10_000_000)\n```\n\n### What `@timed` means\n\n```python\nslow_sum = timed(slow_sum)\n```"}, {"id": 49, "title": "Recursion", "tldr": "A recursive function calls itself on smaller inputs until reaching a base case. It suits tree and nested structures. Python has a recursion limit (1000 by default) and no tail-call optimization, so use iteration for deep recursion.", "real": "Guido van Rossum explained in 2009 blog posts that Python deliberately does not implement tail-call elimination, partly to preserve full tracebacks for debugging.", "body": "### Example: walk nested data\n\n```python\ndef total_size(node):\n    \"\"\"node: {'size': int, 'children': [nodes]}\"\"\"\n    return node[\"size\"] + sum(total_size(c) for c in node[\"children\"])\n```\n\n### Recursion limit\n\n```python\nimport sys\nsys.getrecursionlimit()   # 1000 (default)\n```\n\n### Iterative alternative with a stack\n\n```python\ndef total_size_iter(root):\n    total, stack = 0, [root]\n    while stack:\n        node = stack.pop()\n        total += node[\"size\"]\n        stack.extend(node[\"children\"])\n    return total\n```"}, {"id": 50, "title": "functools essentials", "tldr": "`functools` offers tools for working with functions: `lru_cache` and `cache` for memoization, `partial` to pre-fill arguments, `reduce` for folding, `wraps` for decorators, `cached_property` and `singledispatch` for type-based dispatch.", "real": "`functools.cache` (Python 3.9) is an unbounded memoization decorator; applying it to a naive recursive Fibonacci function turns exponential time into linear time.", "body": "### Examples\n\n```python\nfrom functools import cache, partial, reduce, singledispatch\n\n@cache\ndef fib(n):\n    return n if n < 2 else fib(n - 1) + fib(n - 2)\n\nfib(200)   # instant\n\ndef power(base, exp): return base ** exp\nsquare = partial(power, exp=2)\nsquare(9)  # 81\n\nreduce(lambda a, b: a * b, [1, 2, 3, 4])   # 24\n\n@singledispatch\ndef describe(x): return \"something\"\n@describe.register\ndef _(x: int): return \"an integer\"\ndescribe(5)   # 'an integer'\n```\n\n### Caution with caches\n\nCached functions must be deterministic and take hashable arguments; caches can grow memory without a `maxsize`."}, {"id": 51, "title": "Modules and imports", "tldr": "A module is a .py file; importing it runs it once and caches it in `sys.modules`. Import whole modules or specific names, avoid wildcard imports, and organize imports into standard library, third-party and local groups.", "real": "Python 3.15 added explicit lazy imports (PEP 810): `lazy import json` defers loading a module until it is first used, which can significantly reduce startup time for programs with many dependencies.", "body": "### Import forms\n\n```python\nimport math\nfrom pathlib import Path\nfrom collections import Counter as C\nimport numpy as np            # common alias convention\n\nmath.sqrt(16)\nPath(\"data.csv\").exists()\n```\n\n### Avoid\n\n```python\nfrom os import *   # pollutes namespace, hides origins\n```\n\n### Import order (PEP 8)\n\n```python\n# 1. Standard library\nimport json\nimport os\n\n# 2. Third-party\nimport requests\n\n# 3. Local\nfrom myapp.config import settings\n```"}, {"id": 52, "title": "Packages", "tldr": "A package is a directory of modules, usually with an `__init__.py`. Packages organize larger codebases into namespaces. Keep `__init__.py` light and define the public API deliberately.", "real": "Large Python projects such as Django organize code into deeply nested packages (for example `django.db.models`), and many projects use the “src layout” recommended by the Python Packaging User Guide.", "body": "### src layout\n\n```text\nmyproject/\n├── pyproject.toml\n├── src/\n│   └── myapp/\n│       ├── __init__.py\n│       ├── cli.py\n│       ├── models.py\n│       └── services/\n│           ├── __init__.py\n│           └── billing.py\n└── tests/\n    └── test_billing.py\n```\n\n### Public API in __init__.py\n\n```python\n# src/myapp/__init__.py\nfrom .models import Order, Customer\n\n__all__ = [\"Order\", \"Customer\"]\n```"}, {"id": 53, "title": "How the import system finds modules", "tldr": "Python searches `sys.path` (script directory, PYTHONPATH, standard library, site-packages) for modules. Many “ModuleNotFoundError” problems come from running the wrong interpreter or environment, or naming a file like a library.", "real": "A frequent beginner error is naming a script `random.py` or `requests.py`, which shadows the real module and causes confusing import errors; recent Python versions print a hint when this happens.", "body": "### Inspect the search path\n\n```python\nimport sys\nfor p in sys.path:\n    print(p)\nprint(sys.executable)   # which interpreter is running\n```\n\n### Troubleshooting\n\n| Problem | Fix |\n|---|---|\n| ModuleNotFoundError | Activate the right venv; `python -m pip install ...` |\n| Wrong module imported | Rename local file that shadows a library |\n| Works in IDE, not terminal | Interpreter mismatch |\n| Import works only from one folder | Install package in editable mode: `pip install -e .` |"}, {"id": 54, "title": "`if __name__ == \"__main__\":`", "tldr": "When a file runs as a script, its `__name__` is `\"__main__\"`; when imported, it’s the module name. Guard script entry code so modules can be imported without side effects and tested easily.", "real": "The `python -m package` convention runs a package’s `__main__.py`, which is how tools such as `python -m venv`, `python -m pip` and `python -m http.server` work.", "body": "### Pattern\n\n```python\n# report.py\ndef build_report(path):\n    ...\n\ndef main():\n    build_report(\"data.csv\")\n\nif __name__ == \"__main__\":\n    main()\n```\n\n### Package entry point\n\n```text\nmyapp/\n  __init__.py\n  __main__.py      # runs with: python -m myapp\n```"}, {"id": 55, "title": "The standard library tour", "tldr": "Python’s “batteries included” standard library covers files, data formats, networking, concurrency, testing, math, dates and much more. Check it before adding a dependency.", "real": "PEP 594 removed many outdated “dead batteries” modules (such as cgi, telnetlib and nntplib) from the standard library in Python 3.13, after deprecating them in 3.11.", "body": "### Highlights\n\n| Area | Modules |\n|---|---|\n| Files and paths | pathlib, os, shutil, tempfile |\n| Data formats | json, csv, tomllib, sqlite3, zipfile |\n| Text | re, string, textwrap, difflib |\n| Dates | datetime, zoneinfo, time |\n| Data structures | collections, heapq, bisect, array |\n| Functional | itertools, functools, operator |\n| Concurrency | threading, multiprocessing, asyncio, concurrent.futures |\n| Networking | urllib, http, socket, ssl |\n| Testing / debugging | unittest, doctest, pdb, logging |\n| Math | math, statistics, random, decimal, fractions |\n| CLI | argparse |\n| System | sys, subprocess, platform |"}, {"id": 56, "title": "pyproject.toml and packaging", "tldr": "`pyproject.toml` is the standard configuration file for Python projects: build system, project metadata, dependencies, and tool settings. Build wheels and source distributions with standard build backends.", "real": "PEP 518 (2016) introduced pyproject.toml for build requirements, PEP 517 standardized build backends, and PEP 621 (2020) standardized project metadata, replacing setup.py-centric packaging.", "body": "### Example\n\n```toml\n[build-system]\nrequires = [\"hatchling\"]\nbuild-backend = \"hatchling.build\"\n\n[project]\nname = \"invoice-tool\"\nversion = \"1.2.0\"\ndescription = \"Generate invoices from CSV files\"\nrequires-python = \">=3.11\"\ndependencies = [\"httpx>=0.27\", \"rich>=13\"]\n\n[project.optional-dependencies]\ndev = [\"pytest>=8\", \"ruff\", \"mypy\"]\n\n[project.scripts]\ninvoice = \"invoice_tool.cli:main\"\n\n[tool.ruff]\nline-length = 100\n```\n\n### Build\n\n```bash\npython -m build      # creates dist/*.whl and dist/*.tar.gz\n```"}, {"id": 57, "title": "Publishing packages", "tldr": "Publish packages to PyPI with clear metadata, semantic versioning, a README, a license and automated releases. Use Trusted Publishing from CI instead of long-lived API tokens.", "real": "PyPI launched Trusted Publishing in 2023, allowing GitHub Actions and other CI systems to publish packages using short-lived OpenID Connect tokens, reducing the risk of leaked upload credentials.", "body": "### Release flow\n\n```mermaid\nflowchart LR\n  TAG[Git tag v1.2.0] --> CI[CI builds wheel + sdist]\n  CI --> TEST[Run tests]\n  TEST --> PUB[Publish via Trusted Publishing]\n  PUB --> PYPI[PyPI]\n```\n\n### Versioning (semantic)\n\n| Change | Version bump |\n|---|---|\n| Breaking API change | Major (2.0.0) |\n| New backward-compatible feature | Minor (1.3.0) |\n| Bug fix | Patch (1.2.1) |\n\n### Test first\n\nUpload to TestPyPI before the real index for new projects."}, {"id": 58, "title": "Dependency management tools", "tldr": "Manage dependencies reproducibly: declare ranges in pyproject.toml and lock exact versions for applications. Tools include pip with requirements files and pip-tools, Poetry, PDM, Hatch and uv.", "real": "uv, released by Astral in 2024 and written in Rust, combines package installation, locking, virtual environments and Python version management, and its authors report it is 10–100 times faster than pip in many cases.", "body": "### Libraries vs applications\n\n| Project type | Dependency approach |\n|---|---|\n| Library | Flexible version ranges in pyproject.toml |\n| Application / service | Lock exact versions (lock file) |\n\n### Tools\n\n| Tool | Notes |\n|---|---|\n| pip + requirements.txt | Simple, universal |\n| pip-tools (pip-compile) | Generates pinned requirements |\n| Poetry | Project and dependency management |\n| uv | Fast all-in-one tool with uv.lock |\n| Hatch / PDM | Standards-based project managers |\n\n### uv workflow\n\n```bash\nuv init api && cd api\nuv add fastapi uvicorn\nuv add --dev pytest\nuv run pytest\nuv lock --upgrade-package fastapi\n```"}, {"id": 59, "title": "Relative and absolute imports", "tldr": "Absolute imports (`from myapp.models import Order`) are clearer and recommended. Relative imports (`from .models import Order`) work only inside packages. Running a module directly as a script breaks relative imports; use `python -m` instead.", "real": "PEP 328 (Python 2.5) introduced explicit relative imports with dots, and Python 3 removed implicit relative imports, which had caused confusing name clashes between local modules and standard library modules.", "body": "### Examples\n\n```python\n# Inside src/myapp/services/billing.py\nfrom myapp.models import Order          # absolute (recommended)\nfrom ..models import Order              # relative: up one package\nfrom .tax import calculate_tax          # same package\n```\n\n### Common error\n\n```bash\npython src/myapp/services/billing.py\n# ImportError: attempted relative import with no known parent package\n\npython -m myapp.services.billing      # works (with package installed or on path)\n```"}, {"id": 60, "title": "Circular imports and module design", "tldr": "Circular imports happen when modules import each other, often failing with partially initialized modules. Fix them by restructuring: move shared code to a third module, import inside functions, or use type-only imports.", "real": "Python’s `typing.TYPE_CHECKING` constant is commonly used to import names only for type checkers, avoiding runtime circular imports in large typed codebases.", "body": "### The problem\n\n```mermaid\nflowchart LR\n  A[orders.py imports customers] --> B[customers.py imports orders]\n  B --> A\n```\n\n### Fixes\n\n| Fix | Example |\n|---|---|\n| Extract shared code | `common.py` used by both |\n| Import inside function | Delay import until needed |\n| Type-only import | `if TYPE_CHECKING:` block |\n| Restructure dependencies | Clear layering (models ← services ← api) |\n\n### Type-only import\n\n```python\nfrom __future__ import annotations\nfrom typing import TYPE_CHECKING\n\nif TYPE_CHECKING:\n    from myapp.customers import Customer\n\ndef bill(customer: Customer) -> None:\n    ...\n```"}, {"id": 61, "title": "Opening files with context managers", "tldr": "Open files with `with open(...) as f:` so they close automatically, even if an error occurs. Choose the mode (read, write, append, binary) carefully, because “w” truncates existing files.", "real": "The `with` statement was introduced in Python 2.5 (PEP 343) specifically to make resource cleanup, such as closing files and releasing locks, reliable and concise.", "body": "### Reading and writing\n\n```python\nwith open(\"notes.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"First line\\n\")\n\nwith open(\"notes.txt\", \"a\", encoding=\"utf-8\") as f:\n    f.write(\"Second line\\n\")\n\nwith open(\"notes.txt\", encoding=\"utf-8\") as f:\n    for line in f:\n        print(line.rstrip())\n```\n\n### Modes\n\n| Mode | Meaning |\n|---|---|\n| `\"r\"` | Read (default) |\n| `\"w\"` | Write, truncate existing |\n| `\"a\"` | Append |\n| `\"x\"` | Create; fail if exists |\n| `\"b\"` | Binary (combine: `\"rb\"`, `\"wb\"`) |\n| `\"+\"` | Read and write |"}, {"id": 62, "title": "Text, bytes and encodings", "tldr": "Text (`str`) is Unicode; files and networks carry bytes. Encoding converts text to bytes and decoding converts back. Always specify `encoding=\"utf-8\"` explicitly for portable code, especially on older Python versions.", "real": "Python 3.15 made UTF-8 the default text encoding (PEP 686); before that, the default depended on the system locale, which caused files written on Linux to be misread on Windows.", "body": "### Encode and decode\n\n```python\ntext = \"naïve café ₹\"\ndata = text.encode(\"utf-8\")     # bytes\ndata.decode(\"utf-8\")            # back to str\nlen(text), len(data)            # characters vs bytes differ\n```\n\n### Handling bad data\n\n```python\nraw = b\"caf\\xe9\"                       # Latin-1 bytes\nraw.decode(\"utf-8\", errors=\"replace\")  # 'caf\\ufffd' (U+FFFD replacement character)\nraw.decode(\"latin-1\")                  # 'café'\n```\n\n### Rules\n\n| Rule | Why |\n|---|---|\n| Decode at input, encode at output | Work with str internally |\n| Specify encoding explicitly | Portability across versions/platforms |\n| Know your data’s encoding | Avoid mojibake |"}, {"id": 63, "title": "pathlib", "tldr": "`pathlib.Path` provides object-oriented, cross-platform file paths: joining with `/`, checking existence, reading and writing, globbing and inspecting parts. Prefer it over string manipulation with `os.path`.", "real": "pathlib was added to the standard library in Python 3.4 (PEP 428), and most standard library functions have accepted path objects since Python 3.6 through the os.PathLike protocol (PEP 519).", "body": "### Examples\n\n```python\nfrom pathlib import Path\n\nbase = Path.home() / \"projects\" / \"report\"\nbase.mkdir(parents=True, exist_ok=True)\n\nout = base / \"summary.txt\"\nout.write_text(\"Total: 42\\n\", encoding=\"utf-8\")\nprint(out.read_text(encoding=\"utf-8\"))\n\nout.name        # 'summary.txt'\nout.stem        # 'summary'\nout.suffix      # '.txt'\nout.parent      # .../projects/report\n\nfor csv_file in Path(\"data\").glob(\"**/*.csv\"):\n    print(csv_file)\n```"}, {"id": 64, "title": "Working with CSV", "tldr": "Use the `csv` module to read and write CSV files correctly, handling quoting, commas inside fields and newlines. `DictReader` and `DictWriter` map rows to dictionaries. Open CSV files with `newline=\"\"`.", "real": "The csv module documentation specifies opening files with `newline=\"\"` because otherwise newlines embedded in quoted fields are not interpreted correctly and extra blank lines can appear on Windows.", "body": "### Reading\n\n```python\nimport csv\n\nwith open(\"orders.csv\", newline=\"\", encoding=\"utf-8\") as f:\n    reader = csv.DictReader(f)\n    total = sum(float(row[\"amount\"]) for row in reader)\n```\n\n### Writing\n\n```python\nrows = [{\"id\": 1, \"name\": \"Pen, blue\", \"price\": 10.5}]\nwith open(\"out.csv\", \"w\", newline=\"\", encoding=\"utf-8\") as f:\n    writer = csv.DictWriter(f, fieldnames=[\"id\", \"name\", \"price\"])\n    writer.writeheader()\n    writer.writerows(rows)\n```\n\nThe comma inside “Pen, blue” is quoted automatically."}, {"id": 65, "title": "Working with JSON", "tldr": "The `json` module converts between JSON text and Python dicts, lists, strings, numbers, booleans and None. Handle non-JSON types (dates, Decimal) explicitly, and validate external JSON before trusting it.", "real": "JSON became the dominant format for web APIs; Python’s json module maps JSON objects to dicts and arrays to lists, and does not serialize types such as datetime without custom handling.", "body": "### Basics\n\n```python\nimport json\n\ndata = {\"name\": \"Asha\", \"skills\": [\"python\", \"sql\"], \"active\": True}\ntext = json.dumps(data, indent=2)\nparsed = json.loads(text)\n\nwith open(\"user.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump(data, f, ensure_ascii=False, indent=2)\n```\n\n### Custom types\n\n```python\nfrom datetime import datetime\n\ndef default(o):\n    if isinstance(o, datetime):\n        return o.isoformat()\n    raise TypeError(f\"Not serializable: {type(o).__name__}\")\n\njson.dumps({\"at\": datetime(2026, 3, 1, 10, 0)}, default=default)\n```"}, {"id": 66, "title": "Directories and file operations", "tldr": "Use pathlib, os and shutil to create, list, move, copy and delete files and directories, and tempfile for temporary files. Be careful with destructive operations and handle errors such

ol for experiment tracking and model registries, and later added features for tracking LLM prompts and evaluations.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Managing the ML lifecycle |\n| Why it matters | Reproducibility and safe deployment |\n| Components | Tracking, registry, pipelines, monitoring |\n| Watch out for | “Best model” whose training settings nobody can reproduce |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EXP[Experiments] --> TRACK[Tracking: params, metrics, data version]\n  TRACK --> COMPARE[Compare runs]\n  COMPARE --> REGISTRY[Model registry]\n  REGISTRY --> DEPLOY[Deploy]\n  DEPLOY --> MONITOR[Monitor drift + performance]\n  MONITOR --> EXP\n```\n\n### Worked example\n\n```python\nimport mlflow\nfrom sklearn.ensemble import HistGradientBoostingClassifier\nfrom sklearn.metrics import roc_auc_score\n\nwith mlflow.start_run(run_name=\"gbt-v2\"):\n    params = {\"max_iter\": 300, \"learning_rate\": 0.05}\n    model = HistGradientBoostingClassifier(**params).fit(X_tr, y_tr)\n    auc = roc_auc_score(y_te, model.predict_proba(X_te)[:, 1])\n    mlflow.log_params(params)\n    mlflow.log_metric(\"test_auc\", auc)\n    mlflow.sklearn.log_model(model, \"model\")\n```"}, {"id": 160, "title": "Combining classical ML and LLMs", "tldr": "Strong systems combine both: LLMs label data to train cheap classifiers, ML models score and rank while LLMs explain, LLMs extract features from text for tabular models, and routers decide when an expensive LLM call is needed.", "real": "Teams commonly use LLMs to bootstrap labels for small classifiers and then serve the classifier at scale, reducing per-request costs by orders of magnitude for high-volume tasks.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Hybrid ML + LLM architectures |\n| Why it matters | Quality of LLMs with economics of ML |\n| Patterns | LLM labeling → classifier; ML scoring + LLM explanation; LLM feature extraction |\n| Watch out for | Propagating LLM labeling errors without review |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  UNLABELED[Unlabeled tickets] --> LLM[LLM labels 5,000 tickets]\n  LLM --> REVIEW[Human review sample]\n  REVIEW --> TRAIN[Train small classifier]\n  TRAIN --> SERVE[Serve classifier at scale]\n  SERVE -->|low confidence| LLM2[LLM fallback]\n```\n\n### Worked example\n\n| Approach | Accuracy | Cost per 1M tickets |\n|---|---|---|\n| LLM on every ticket | 93% | High |\n| Classifier trained on LLM labels | 91% | Very low |\n| Classifier + LLM fallback for low confidence (15%) | 93% | ≈ 15% of LLM-only cost |\n\n(Illustrative; measure on your own data.)"}, {"id": 161, "title": "Choosing problems worth solving with AI", "tldr": "Good AI use cases are frequent, valuable, tolerant of occasional errors or easily verified, backed by available data and measurable. Start with problems where AI assists humans before automating fully.", "real": "GitHub Copilot succeeded early because code suggestions are frequent, valuable and easy for developers to accept, edit or reject, which made occasional mistakes tolerable.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Selecting where AI creates real value |\n| Why it matters | Most AI project failures start with the wrong problem |\n| Good signs | High frequency, verifiable output, data available, clear metric |\n| Watch out for | High-stakes, low-volume decisions as first projects |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  IDEA[Idea] --> FREQ{Frequent task?}\n  FREQ -->|no| LOW[Low priority]\n  FREQ -->|yes| VERIFY{Errors cheap or easy to catch?}\n  VERIFY -->|no| ASSIST[Start as assistant with human review]\n  VERIFY -->|yes| DATA{Data and metric available?}\n  DATA -->|yes| BUILD[Build + evaluate]\n  DATA -->|no| PREP[Collect data first]\n```\n\n### Worked example\n\n| Candidate | Frequency | Verifiability | Verdict |\n|---|---|---|---|\n| Draft support replies for agents | High | Agent reviews | Strong first project |\n| Auto-approve insurance claims | Medium | Hard, costly errors | Later, with oversight |\n| Summarize sales calls | High | Easy to skim | Strong |"}, {"id": 162, "title": "UX patterns for AI features", "tldr": "AI UX should set expectations, show progress (streaming), expose sources, make outputs editable, offer regenerate and feedback options, handle uncertainty honestly and keep humans in control of consequential actions.", "real": "Microsoft’s “Guidelines for Human-AI Interaction” (CHI 2019) proposed 18 design guidelines, such as making clear what the system can do and supporting efficient correction, that remain widely referenced.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Interface patterns for probabilistic features |\n| Why it matters | Trust and usefulness depend on UX as much as model quality |\n| Patterns | Streaming, citations, editing, regenerate, feedback, confirmations |\n| Watch out for | Presenting AI output as authoritative fact |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ASK[User asks] --> STREAM[Streaming answer]\n  STREAM --> SOURCES[Sources shown]\n  SOURCES --> ACTIONS[Copy, edit, regenerate, feedback]\n  ACTIONS --> CONFIRM[Confirm before actions like sending]\n```\n\n### Worked example\n\n| Pattern | Example |\n|---|---|\n| Expectation setting | “I can answer questions about your orders and returns.” |\n| Uncertainty | “I couldn’t find this in the policy; contact support.” |\n| Editable output | Draft email in an editor, not auto-sent |\n| Confirmation | “Send this reply to the customer?” |"}, {"id": 163, "title": "Human-in-the-loop product design", "tldr": "Decide where humans review, approve or correct AI output based on risk and confidence. Design efficient review interfaces, capture corrections as training and eval data, and expand automation as measured quality improves.", "real": "Health systems deploying ambient AI scribes, such as Kaiser Permanente’s 2024 rollout of Abridge’s technology, require clinicians to review and sign AI-drafted notes before they enter the medical record.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structured human review in AI workflows |\n| Why it matters | Safety, accountability and learning |\n| Modes | Review all, review low-confidence, sample audits |\n| Watch out for | Reviewers rubber-stamping due to volume |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  AI[AI output + confidence] --> ROUTE{Confidence and risk}\n  ROUTE -->|high confidence, low risk| AUTO[Auto + sampled audit]\n  ROUTE -->|otherwise| REVIEW[Human review]\n  REVIEW --> CORRECT[Corrections stored]\n  CORRECT --> DATA[(Training + eval data)]\n```\n\n### Worked example\n\n| Month | Auto-approved share | Audit error rate |\n|---|---|---|\n| 1 | 0% (all reviewed) | — |\n| 2 | 30% | 1.2% |\n| 3 | 55% | 0.9% |\n\nAutomation expands only while audited error rates stay below the agreed threshold."}, {"id": 164, "title": "Handling uncertainty and errors", "tldr": "AI products must handle being wrong gracefully: abstain when evidence is missing, signal uncertainty, offer alternatives, make correction easy and escalate to humans. Design the failure experience deliberately.", "real": "The 2024 Air Canada chatbot ruling and Microsoft’s February 2023 limits on Bing Chat conversation length both followed AI systems responding confidently or erratically where they should have deferred or stopped.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Product behavior when AI is unsure or wrong |\n| Why it matters | Bad failures destroy trust faster than good answers build it |\n| Techniques | Abstention, confidence signals, escalation, easy correction |\n| Watch out for | Forcing an answer for every question |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  Q[Question] --> EVIDENCE{Enough evidence?}\n  EVIDENCE -->|yes| ANSWER[Answer + sources]\n  EVIDENCE -->|partly| PARTIAL[Partial answer + what's unknown]\n  EVIDENCE -->|no| ABSTAIN[Say so + offer human help]\n```\n\n### Worked example\n\n| Situation | Response |\n|---|---|\n| Policy found | “Refunds take up to 7 days [Refund policy §2].” |\n| Partly found | “Standard refunds take 7 days; I couldn’t find rules for gift cards.” |\n| Not found | “I don’t have that information. Want me to connect you to support?” |"}, {"id": 165, "title": "Designing for latency", "tldr": "Users judge AI products by responsiveness. Stream output, show progress for multi-step tasks, use faster models for simple steps, run independent steps in parallel, cache aggressively and move long tasks to background jobs with notifications.", "real": "Google research on mobile web behavior (2017) linked longer load times to higher bounce rates, and AI chat products stream tokens because waiting for a complete response feels much slower.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Making AI features feel fast |\n| Why it matters | Perceived speed drives adoption |\n| Techniques | Streaming, progress events, parallelism, smaller models, async jobs |\n| Watch out for | Silent spinners on 30-second agent runs |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  TASK{Expected duration} -->|under 3 s| STREAM[Stream answer]\n  TASK -->|3–30 s| PROGRESS[Show step-by-step progress]\n  TASK -->|over 30 s| BACKGROUND[Background job + notification]\n```\n\n### Worked example\n\n| Optimization | Latency effect |\n|---|---|\n| Stream tokens | First words in < 1 s instead of 6 s wait |\n| Parallel retrieval + profile lookup | −300 ms |\n| Small model for query rewrite | −400 ms |\n| Prompt caching of long system prompt | Faster prefill |"}, {"id": 166, "title": "Pricing and unit economics", "tldr": "AI features have real marginal costs. Model cost per task, choose pricing (included in plan, usage-based, credits, outcome-based) that covers costs with margin, and protect against heavy users with limits.", "real": "Microsoft priced Microsoft 365 Copilot at $30 per user per month (2023), Salesforce launched Agentforce at $2 per conversation (2024) and Intercom charges $0.99 per resolution for Fin, illustrating different AI pricing models.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Making AI features financially sustainable |\n| Why it matters | Usage can grow faster than revenue |\n| Models | Bundled, seat add-on, usage/credits, outcome-based |\n| Watch out for | Unlimited usage plans with heavy power users |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  COST[Cost per task] --> USAGE[Tasks per user per month]\n  USAGE --> CPU[Cost per user]\n  CPU --> PRICE[Price per user]\n  PRICE --> MARGIN[Gross margin]\n```\n\n### Worked example\n\n```text\nCost per assisted reply: $0.012; average agent uses 900 replies/month → $10.80/month\nPrice of AI add-on: $25/user/month → gross margin = (25 − 10.80) / 25 = 56.8%\nHeavy users (3,000 replies) cost $36 → need fair-use limits or usage pricing\n```"}, {"id": 167, "title": "Build vs buy", "tldr": "Buy AI products for common needs (meeting notes, coding assistants, generic support bots) when they fit; build when the feature depends on proprietary data, workflows or differentiated experience. Many solutions combine bought platforms with custom components.", "real": "Many enterprises adopted packaged tools such as GitHub Copilot and Microsoft 365 Copilot for general productivity while building custom AI features where their own data and processes create advantage.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Sourcing decision for AI capabilities |\n| Why it matters | Focus engineering where it differentiates |\n| Trade-off | Speed and maintenance vs control and fit |\n| Watch out for | Building a generic tool vendors already do well |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  NEED[AI need] --> DIFF{Differentiating for our business?}\n  DIFF -->|no| BUY[Buy / use SaaS]\n  DIFF -->|yes| DATA{Depends on our proprietary data or workflow?}\n  DATA -->|yes| BUILD[Build on foundation models]\n  DATA -->|no| HYBRID[Buy platform + customize]\n```\n\n### Worked example\n\n| Need | Decision |\n|---|---|\n| Meeting transcription | Buy |\n| Code completion for developers | Buy |\n| Claims triage using internal rules and history | Build |\n| Customer support | Platform + custom knowledge and tools |"}, {"id": 168, "title": "Metrics for AI products", "tldr": "Measure AI products at several levels: model quality (eval scores), product usage (adoption, retention), user outcomes (task success, time saved), business impact (revenue, cost) and guardrails (safety incidents, complaints, cost per task).", "real": "A 2023 field study by Brynjolfsson, Li and Raymond found a generative AI assistant raised customer support agents’ productivity by about 14% on average, with the largest gains for less experienced agents, an example of outcome-level measurement.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Measuring whether AI features deliver value |\n| Why it matters | Model quality alone doesn’t prove impact |\n| Levels | Quality, usage, outcomes, business, guardrails |\n| Watch out for | Counting AI responses instead of solved problems |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  QUALITY[Eval quality] --> USAGE[Adoption + retention]\n  USAGE --> OUTCOME[Task success, time saved]\n  OUTCOME --> BUSINESS[Revenue, cost, satisfaction]\n  GUARD[Guardrails: safety, cost, complaints] -.-> BUSINESS\n```\n\n### Worked example\n\n| Metric | Baseline | With AI |\n|---|---|---|\n| Median handle time | 11.0 min | 8.6 min |\n| First-contact resolution | 68% | 72% |\n| CSAT | 4.2 | 4.3 |\n| AI suggestion acceptance | — | 61% |"}, {"id": 169, "title": "Launching AI features", "tldr": "Launch gradually: internal dogfooding, beta users, small percentage rollouts with monitoring, clear disclosures, support playbooks, kill switches and success criteria defined in advance.", "real": "Microsoft’s February 2023 Bing Chat launch, which led to conversation-length limits within days after unexpected behaviors in long chats, is often cited as a lesson in staged rollout and monitoring.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Releasing AI features safely |\n| Why it matters | Real users find failure modes testers miss |\n| Stages | Internal → beta → 5% → 25% → 100% |\n| Watch out for | Launching without a way to turn the feature off |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DOG[Internal dogfood] --> BETA[Beta users]\n  BETA --> P5[5% rollout]\n  P5 --> P25[25%]\n  P25 --> FULL[100%]\n  P5 -->|issues| OFF[Kill switch]\n  P25 -->|issues| OFF\n```\n\n### Worked example\n\n- [ ] Eval suite passes thresholds\n- [ ] Red-team findings resolved\n- [ ] Disclosure and help text written\n- [ ] Support team briefed with escalation path\n- [ ] Dashboards for quality, cost, latency, safety\n- [ ] Kill switch tested\n- [ ] Success criteria for each rollout stage"}, {"id": 170, "title": "Iterating after launch", "tldr": "After launch, run a weekly improvement loop: review sampled conversations and failures, categorize issues, fix the largest categories, add cases to evals, ship with gates, and track trends. Most quality gains happen after launch.", "real": "Teams that published lessons from production AI features, such as LinkedIn’s 2024 account, emphasize ongoing error analysis and evaluation as the main driver of quality improvement after initial launch.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Continuous improvement cycle |\n| Why it matters | Real usage reveals new failure modes |\n| Cadence | Weekly review, biweekly releases |\n| Watch out for | Launch-and-forget AI features degrading as content and users change |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SAMPLE[Sample traces + feedback] --> CATEGORIZE[Categorize failures]\n  CATEGORIZE --> PRIORITIZE[Fix biggest category]\n  PRIORITIZE --> EVALS[Add eval cases]\n  EVALS --> SHIP[Ship with gates]\n  SHIP --> SAMPLE\n```\n\n### Worked example\n\n| Week | Failure categories reviewed (top 3) |\n|---|---|\n| 1 | Outdated policy (14), missing refund rules (9), long answers (7) |\n| 2 | Missing refund rules (8), tone (5), wrong language (4) |\n| 3 | Tone (4), wrong language (3), tool timeout (3) |"}, {"id": 171, "title": "Project 1: document Q&A over PDFs", "tldr": "Build a question-answering tool over PDF documents: extract text, chunk it, embed chunks, retrieve the best matches for each question and answer with citations and an explicit “not found” response.", "real": "Internal document assistants, such as Morgan Stanley’s 2023 assistant over its research library, follow this pattern at much larger scale with permissions, hybrid search and evaluation.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Answer questions from PDFs with page citations |\n| Components | pypdf, chunker, embeddings, cosine search, LLM |\n| Success metric | Correct, cited answers on 30 test questions |\n| Extension | Hybrid search, reranking, pgvector, UI |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PDF[PDF files] --> EXTRACT[Extract text per page]\n  EXTRACT --> CHUNK[Chunk with page numbers]\n  CHUNK --> EMB[Embed]\n  Q[Question] --> SEARCH[Top-k search]\n  EMB --> SEARCH\n  SEARCH --> LLM[Answer with page citations]\n```\n\n### Worked example\n\n```python\nfrom pypdf import PdfReader\nimport numpy as np\n\ndef load_chunks(path: str, size: int = 150) -> list[dict]:\n    chunks = []\n    for page_no, page in enumerate(PdfReader(path).pages, start=1):\n        words = (page.extract_text() or \"\").split()\n        for i in range(0, len(words), size):\n            chunks.append({\"page\": page_no, \"text\": \" \".join(words[i:i + size])})\n    return chunks\n\nchunks = load_chunks(\"handbook.pdf\")\nvecs = embedder.encode([c[\"text\"] for c in chunks], normalize_embeddings=True)\n\ndef ask(question: str, k: int = 4) -> str:\n    q = embedder.encode([question], normalize_embeddings=True)[0]\n    top = np.argsort(vecs @ q)[::-1][:k]\n    context = \"\\n\".join(f\"[p.{chunks[i]['page']}] {chunks[i]['text']}\" for i in top)\n    prompt = (\"Answer only from the excerpts and cite pages like [p.3]. \"\n              \"If the answer isn't there, say so.\\n\\n\" + context + \"\\n\\nQuestion: \" + question)\n    resp = client.messages.create(model=MODEL, max_tokens=400,\n                                  messages=[{\"role\": \"user\", \"content\": prompt}])\n    return resp.content[0].text\n```"}, {"id": 172, "title": "Project 2: support ticket router", "tldr": "Route tickets to teams using an embeddings-based classifier for speed and cost, with an LLM fallback for low-confidence cases, and measure accuracy per class on a held-out set.", "real": "Customer service platforms commonly combine fast classifiers for routine routing with LLMs for ambiguous cases, balancing cost, latency and accuracy.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Route tickets to billing, technical or account |\n| Components | Embeddings, logistic regression, LLM fallback |\n| Success metric | ≥ 90% accuracy, < 100 ms median latency |\n| Extension | Priority prediction, language detection |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TICKET[Ticket] --> EMB[Embed]\n  EMB --> CLF[Classifier]\n  CLF --> CONF{Probability ≥ 0.75?}\n  CONF -->|yes| ROUTE[Route]\n  CONF -->|no| LLM[LLM classifies]\n  LLM --> ROUTE\n```\n\n### Worked example\n\n```python\ndef route(ticket: str) -> tuple[str, str]:\n    vec = embedder.encode([ticket], normalize_embeddings=True)\n    probs = clf.predict_proba(vec)[0]\n    best = probs.argmax()\n    if probs[best] >= 0.75:\n        return clf.classes_[best], \"classifier\"\n    resp = client.messages.create(\n        model=MODEL, max_tokens=5, temperature=0,\n        messages=[{\"role\": \"user\", \"content\":\n                   f\"Classify as billing, technical or account. Reply with one word.\\n\\n{ticket}\"}])\n    return resp.content[0].text.strip().lower(), \"llm\"\n```"}, {"id": 173, "title": "Project 3: structured extraction API", "tldr": "Build an HTTP service that extracts typed fields from unstructured text (invoices, emails, forms) using forced tool calls and Pydantic validation, returning clear errors when extraction fails.", "real": "Document automation products in finance and logistics use this pattern to turn emails and PDFs into structured records for ERP and CRM systems, with human review for low-confidence cases.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | POST text → validated JSON fields |\n| Components | FastAPI, Pydantic, forced tool call, validation |\n| Success metric | Per-field exact match ≥ 95% on test set |\n| Extension | Confidence scores, human review queue |\n\n### Diagram\n\n```mermaid\nsequenceDiagram\n  participant C as Client\n  participant API as FastAPI\n  participant M as Model\n  C->>API: POST /extract {text}\n  API->>M: Forced tool call with schema\n  M-->>API: JSON fields\n  API->>API: Pydantic validation + business rules\n  API-->>C: 200 fields or 422 errors\n```\n\n### Worked example\n\n```python\nfrom fastapi import FastAPI, HTTPException\nfrom pydantic import BaseModel, ValidationError\n\napp = FastAPI()\n\nclass Order(BaseModel):\n    customer_name: str\n    product: str\n    quantity: int\n    delivery_city: str\n\nclass ExtractRequest(BaseModel):\n    text: str\n\nTOOL = {\"name\": \"record_order\", \"description\": \"Record order details.\",\n        \"input_schema\": Order.model_json_schema()}\n\n@app.post(\"/extract\", response_model=Order)\ndef extract(req: ExtractRequest) -> Order:\n    resp = client.messages.create(model=MODEL, max_tokens=300, tools=[TOOL],\n                                  tool_choice={\"type\": \"tool\", \"name\": \"record_order\"},\n                                  messages=[{\"role\": \"user\", \"content\": req.text}])\n    data = next(b.input for b in resp.content if b.type == \"tool_use\")\n    try:\n        return Order.model_validate(data)\n    except ValidationError as e:\n        raise HTTPException(status_code=422, detail=e.errors())\n```"}, {"id": 174, "title": "Project 4: a tool-using agent", "tldr": "Build an agent that answers order questions using tools (order lookup, return eligibility), with step limits, error handling, authorization in tools and a trace of every step.", "real": "Customer service agents from companies such as Klarna and Intercom combine knowledge retrieval with scoped order and account tools, escalating to humans when needed.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Resolve “where is my order / can I return it” questions |\n| Components | Tool schemas, handlers with auth, agent loop, tracing |\n| Success metric | ≥ 90% task success on 50 scripted conversations, 0 policy violations |\n| Extension | Human approval for refunds, memory of preferences |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  USER[Customer] --> AGENT[Agent loop]\n  AGENT --> T1[get_order]\n  AGENT --> T2[check_return_eligibility]\n  T1 --> AUTH[Ownership check in code]\n  T2 --> AUTH\n  AGENT --> TRACE[(Trace log)]\n  AGENT --> ANSWER[Answer or escalate]\n```\n\n### Worked example\n\n```python\nfrom datetime import date\n\nORDERS = {\"981\": {\"customer\": \"cus_42\", \"status\": \"delivered\", \"delivered_on\": date(2026, 11, 2)}}\n\ndef get_order(order_id: str, *, customer_id: str) -> dict:\n    o = ORDERS.get(order_id)\n    if not o or o[\"customer\"] != customer_id:\n        return {\"error\": \"Order not found for this customer\"}\n    return {\"order_id\": order_id, \"status\": o[\"status\"], \"delivered_on\": o[\"delivered_on\"].isoformat()}\n\ndef check_return_eligibility(order_id: str, *, customer_id: str, today: date = date(2026, 11, 18)) -> dict:\n    o = ORDERS.get(order_id)\n    if not o or o[\"customer\"] != customer_id:\n        return {\"error\": \"Order not found for this customer\"}\n    days = (today - o[\"delivered_on\"]).days\n    return {\"eligible\": days <= 30, \"days_since_delivery\": days}\n\n# Bind customer_id from the authenticated session, never from model input:\nhandlers = {\"get_order\": lambda **a: get_order(**a, customer_id=\"cus_42\"),\n            \"check_return_eligibility\": lambda **a: check_return_eligibility(**a, customer_id=\"cus_42\")}\n```"}, {"id": 175, "title": "Project 5: an evaluation harness", "tldr": "Build a reusable harness: load cases from JSONL, run the system, apply code checks and LLM judges, compute metrics by category, compare with the previous run and write a report. Run it in CI.", "real": "Open-source tools such as promptfoo, OpenAI Evals and the UK AI Security Institute’s Inspect implement this pattern, but a small custom harness is often the fastest way to start.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Repeatable quality measurement for any AI feature |\n| Components | JSONL cases, runner, scorers, report, baseline comparison |\n| Success metric | Runs in CI in under 10 minutes for the smoke set |\n| Extension | Parallel execution, judge calibration, dashboards |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CASES[cases.jsonl] --> RUN[Run system]\n  RUN --> SCORE[Scorers: code + judge]\n  SCORE --> AGG[Aggregate by tag]\n  BASE[Previous results] --> COMPARE[Compare]\n  AGG --> COMPARE\n  COMPARE --> REPORT[Report + CI pass/fail]\n```\n\n### Worked example\n\n```python\nimport json\nfrom collections import defaultdict\n\ndef contains_expected(output: str, case: dict) -> bool:\n    return case[\"expected\"].lower() in output.lower()\n\ndef run_evals(system, path=\"evals/cases.jsonl\", scorers=(contains_expected,)):\n    results = defaultdict(list)\n    for line in open(path):\n        case = json.loads(line)\n        output = system(case[\"input\"])\n        passed = all(scorer(output, case) for scorer in scorers)\n        for tag in case.get(\"tags\", [\"all\"]):\n            results[tag].append(passed)\n    return {tag: sum(v) / len(v) for tag, v in results.items()}\n\n# Example case line:\n# {\"input\": \"How many casual leave days?\", \"expected\": \"12\", \"tags\": [\"leave\", \"easy\"]}\n```"}, {"id": 176, "title": "Project 6: semantic search API", "tldr": "Build a search API combining keyword and vector search with reciprocal rank fusion, metadata filters and pagination, returning highlighted snippets. Measure recall@10 and latency.", "real": "E-commerce and documentation sites increasingly combine keyword and semantic search so queries like exact product codes and vague descriptions both work.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | /search?q= returning the most relevant items fast |\n| Components | BM25, embeddings, RRF, filters, FastAPI |\n| Success metric | Recall@10 ≥ 0.9, p95 < 150 ms |\n| Extension | Reranking, typo tolerance, personalization |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  Q[Query + filters] --> BM[BM25 top 50]\n  Q --> VEC[Vector top 50]\n  BM --> RRF[RRF fusion]\n  VEC --> RRF\n  RRF --> FILTER[Apply filters]\n  FILTER --> PAGE[Paginate + snippets]\n```\n\n### Worked example\n\n```python\nfrom rank_bm25 import BM25Okapi\nimport numpy as np\n\nproducts = [\"Masala chai tea 250g\", \"Green tea bags 100 count\", \"Filter coffee powder 500g\",\n            \"Steel tea strainer\", \"Assam black tea leaves 1kg\"]\nbm25 = BM25Okapi([p.lower().split() for p in products])\npvecs = embedder.encode(products, normalize_embeddings=True)\n\ndef search(q: str, k: int = 3) -> list[str]:\n    kw = list(np.argsort(bm25.get_scores(q.lower().split()))[::-1])\n    sem = list(np.argsort(pvecs @ embedder.encode([q], normalize_embeddings=True)[0])[::-1])\n    scores = {}\n    for ranking in (kw, sem):\n        for rank, idx in enumerate(ranking, start=1):\n            scores[idx] = scores.get(idx, 0) + 1 / (60 + rank)\n    return [products[i] for i in sorted(scores, key=scores.get, reverse=True)[:k]]\n\nprint(search(\"spiced tea\"))\n```"}, {"id": 177, "title": "Project 7: fine-tune a small model with LoRA", "tldr": "Fine-tune a small open model with LoRA on a classification or formatting task, compare it with a prompted baseline on a held-out set, and save the adapter for serving.", "real": "Small open models such as Qwen2.5-0.5B/1.5B, Llama 3.2 1B/3B and Gemma are commonly fine-tuned with LoRA on a single GPU for narrow, high-volume tasks.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Small, cheap model matching a large model on one task |\n| Components | Datasets, TRL SFTTrainer, PEFT LoRA, eval script |\n| Success metric | Within 2 points of the large model’s accuracy |\n| Extension | Distillation from a larger model, vLLM serving with adapters |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DATA[train.jsonl + test.jsonl] --> TRAIN[SFT + LoRA]\n  BASE[Small base model] --> TRAIN\n  TRAIN --> ADAPTER[LoRA adapter]\n  ADAPTER --> EVAL[Evaluate on test set]\n  EVAL --> COMPARE[Compare with prompted large model]\n```\n\n### Worked example\n\n```python\nfrom datasets import load_dataset\nfrom peft import LoraConfig\nfrom trl import SFTConfig, SFTTrainer\n\ntrain = load_dataset(\"json\", data_files=\"train.jsonl\", split=\"train\")\ntrainer = SFTTrainer(\n    model=\"Qwen/Qwen2.5-0.5B-Instruct\",\n    train_dataset=train,\n    peft_config=LoraConfig(r=16, lora_alpha=32, lora_dropout=0.05,\n                           target_modules=\"all-linear\", task_type=\"CAUSAL_LM\"),\n    args=SFTConfig(output_dir=\"ticket-lora\", num_train_epochs=2,\n                   per_device_train_batch_size=8, learning_rate=2e-4, logging_steps=10),\n)\ntrainer.train()\ntrainer.save_model(\"ticket-lora\")\n```"}, {"id": 178, "title": "Project 8: self-hosted model serving", "tldr": "Serve an open model with vLLM in Docker, expose an OpenAI-compatible endpoint, load-test it for latency and throughput, and put it behind your gateway with authentication and rate limits.", "real": "Organizations with data-residency or cost requirements commonly serve open models with vLLM behind internal gateways, using the OpenAI-compatible API so applications can switch between hosted and self-hosted models.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Private, OpenAI-compatible model endpoint |\n| Components | vLLM container, GPU, gateway, load test |\n| Success metric | p95 TTFT < 1 s at target concurrency |\n| Extension | LoRA adapters, autoscaling, quantized models |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  APP[Applications] --> GW[Gateway: auth + rate limits]\n  GW --> VLLM[vLLM container on GPU]\n  VLLM --> METRICS[Prometheus metrics]\n  LOAD[Load test] --> GW\n```\n\n### Worked example\n\n```bash\ndocker run --gpus all -p 8000:8000 \\\n  -v ~/.cache/huggingface:/root/.cache/huggingface \\\n  vllm/vllm-openai:latest \\\n  --model Qwen/Qwen2.5-7B-Instruct --max-model-len 8192\n\ncurl http://localhost:8000/v1/chat/completions -H \"Content-Type: application/json\" \\\n  -d '{\"model\": \"Qwen/Qwen2.5-7B-Instruct\", \"messages\": [{\"role\": \"user\", \"content\": \"Hello\"}], \"max_tokens\": 50}'\n```"}, {"id": 179, "title": "Project 9: voice-note summarizer", "tldr": "Transcribe voice notes or meeting recordings, then summarize them into decisions, action items and owners with an LLM, returning structured output that can create tasks automatically.", "real": "Meeting assistants such as those built into Zoom, Microsoft Teams and Google Meet transcribe calls and generate summaries with action items, a widely adopted multimodal AI pattern.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Audio → transcript → structured summary |\n| Components | Whisper, LLM with structured output |\n| Success metric | Action items captured correctly in ≥ 90% of test recordings |\n| Extension | Speaker diarization, task creation in project tools |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  AUDIO[Voice note] --> ASR[Whisper transcription]\n  ASR --> LLM[LLM: summary + action items]\n  LLM --> JSON[Structured JSON]\n  JSON --> TASKS[Create tasks]\n```\n\n### Worked example\n\n```python\nimport whisper\n\ntranscript = whisper.load_model(\"base\").transcribe(\"standup.m4a\")[\"text\"]\n\nprompt = f\"\"\"From this meeting transcript, return JSON with:\n\"summary\" (3 sentences), \"decisions\" (list), \"action_items\" (list of {{\"owner\", \"task\", \"due\"}}).\nUse null when a due date isn't stated.\n\n<transcript>{transcript}<\/transcript>\"\"\"\nresp = client.messages.create(model=MODEL, max_tokens=800,\n                              messages=[{\"role\": \"user\", \"content\": prompt}])\nprint(resp.content[0].text)\n```"}, {"id": 180, "title": "Project 10: monitoring dashboard for an AI feature", "tldr": "Log every AI request with model, prompt version, tokens, latency, cost and feedback, then compute daily metrics: volume, p95 latency, cost, error rate and negative feedback rate, with alerts on regressions.", "real": "LLM observability platforms provide these views out of the box, but a minimal SQL-based log is enough to understand early usage and costs.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Daily visibility into quality, latency and cost |\n| Components | Request log table, metrics queries, alert rules |\n| Success metric | Regressions detected within one day |\n| Extension | OpenTelemetry tracing, Grafana dashboards |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  APP[AI feature] --> LOG[(llm_requests table)]\n  LOG --> DAILY[Daily metrics job]\n  DAILY --> DASH[Dashboard]\n  DAILY --> ALERT[Alerts on thresholds]\n```\n\n### Worked example\n\n```python\nimport sqlite3, statistics\n\ndb = sqlite3.connect(\"llm_logs.db\")\ndb.execute(\"\"\"CREATE TABLE IF NOT EXISTS llm_requests (\n  ts TEXT, model TEXT, prompt_version TEXT, input_tokens INT, output_tokens INT,\n  latency_ms INT, cost_usd REAL, error INT, feedback INT)\"\"\")\n\ndef daily_report(day: str) -> dict:\n    rows = db.execute(\"SELECT latency_ms, cost_usd, error, feedback FROM llm_requests \"\n                      \"WHERE ts LIKE ?\", (day + \"%\",)).fetchall()\n    if not rows:\n        return {}\n    latencies = sorted(r[0] for r in rows)\n    p95 = statistics.quantiles(latencies, n=20)[-1] if len(latencies) > 1 else latencies[0]\n    return {\"requests\": len(rows), \"p95_latency_ms\": p95,\n            \"cost_usd\": round(sum(r[1] for r in rows), 2),\n            \"error_rate\": sum(r[2] for r in rows) / len(rows),\n            \"negative_feedback\": sum(1 for r in rows if r[3] == -1) / len(rows)}\n```"}, {"id": 181, "title": "Case study: GitHub Copilot", "tldr": "Copilot showed how AI assistance succeeds when suggestions are frequent, low-friction to accept or reject, and embedded where people already work. It combined a code model, context from the editor, latency engineering and acceptance-rate measurement.", "real": "GitHub launched Copilot as a technical preview in June 2021 and generally in June 2022; a 2022 GitHub study found developers using it completed a specific coding task (writing an HTTP server in JavaScript) about 55% faster.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Problem | Writing code faster without leaving the editor |\n| Key design | Inline suggestions, editor context, low latency |\n| Key metric | Suggestion acceptance and retention rates |\n| Lesson | Embed AI in existing workflows; make errors cheap to reject |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EDITOR[Editor: cursor + open files] --> CONTEXT[Context assembly]\n  CONTEXT --> MODEL[Code model]\n  MODEL --> SUGGEST[Inline suggestion]\n  SUGGEST --> DEV{Developer}\n  DEV -->|accept / edit / reject| SIGNAL[Usage signals]\n  SIGNAL --> IMPROVE[Product + model improvement]\n```\n\n### Worked example\n\n| Design choice | Why it worked |\n|---|---|\n| Ghost-text suggestions | Zero friction to ignore |\n| Context from nearby files | Better relevance |\n| Fast responses | Fits typing flow |\n| Measured acceptance | Objective quality signal |"}, {"id": 182, "title": "Case study: Klarna’s AI assistant", "tldr": "Klarna deployed an AI assistant for customer service that handled a large share of chats, illustrating both the scale of automation possible for routine requests and the importance of keeping human support for quality.", "real": "Klarna reported in February 2024 that its assistant handled two-thirds of customer service chats in its first month (2.3 million conversations), cutting average resolution time from 11 minutes to under 2; in 2025 the company emphasized keeping human agents available as well.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Problem | High-volume routine customer service |\n| Key design | Integration with orders, refunds, payments; multilingual |\n| Key metrics | Share of chats handled, resolution time, repeat inquiries, satisfaction |\n| Lesson | Automate routine cases; preserve human paths for complex ones |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CUST[Customer chat] --> AI[AI assistant]\n  AI --> TOOLS[Order, refund, payment systems]\n  AI -->|routine resolved| DONE[Resolved]\n  AI -->|complex or requested| HUMAN[Human agent]\n```\n\n### Worked example\n\n| Reported metric (Feb 2024) | Value |\n|---|---|\n| Share of chats handled in month one | Two-thirds |\n| Conversations | 2.3 million |\n| Average resolution time | 11 min → under 2 min |\n| Repeat inquiries | Reported 25% drop |"}, {"id": 183, "title": "Case study: Morgan Stanley’s research assistant", "tldr": "Morgan Stanley built a GPT-4-based assistant giving financial advisors answers grounded in the firm’s research library, with an evaluation framework developed before broad rollout.", "real": "Morgan Stanley launched its AI @ Morgan Stanley Assistant in September 2023 for financial advisors, drawing on a large internal library of research and documents, and OpenAI described the firm’s eval-driven approach as key to adoption.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Problem | Advisors searching a huge internal knowledge base |\n| Key design | RAG over approved content, evaluation before rollout |\n| Key metric | Answer accuracy judged by experts, advisor adoption |\n| Lesson | Rigorous evals build trust in regulated environments |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LIBRARY[Research + procedures library] --> INDEX[(Index)]\n  ADVISOR[Advisor question] --> RET[Retrieve approved content]\n  INDEX --> RET\n  RET --> MODEL[GPT-4 answer with sources]\n  EVAL[Expert-graded eval suite] -.gate.-> MODEL\n```\n\n### Worked example\n\n| Practice | Purpose |\n|---|---|\n| Expert-graded eval set | Measure accuracy before launch |\n| Approved content only | Compliance |\n| Sources shown | Advisor verification |\n| Gradual rollout | Build trust |"}, {"id": 184, "title": "Case study: Duolingo Max", "tldr": "Duolingo used GPT-4 to add features such as explaining answers and role-play conversations, combining LLM flexibility with curated content and product constraints suited to learners.", "real": "Duolingo launched Duolingo Max in March 2023 with “Explain My Answer” and “Roleplay” features powered by GPT-4, as one of the early consumer subscription products built on it.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Problem | Personalized explanations and conversation practice |\n| Key design | Structured scenarios, curated prompts, level-appropriate language |\n| Key metric | Learner engagement and subscription uptake |\n| Lesson | Constrain open-ended models with product structure |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LESSON[Lesson context: level, exercise] --> PROMPT[Structured prompt]\n  ANSWER[Learner answer] --> PROMPT\n  PROMPT --> MODEL[GPT-4]\n  MODEL --> EXPLAIN[Explanation / role-play reply]\n  EXPLAIN --> LEARNER[Learner]\n```\n\n### Worked example\n\n| Feature | Constraint applied |\n|---|---|\n| Explain My Answer | Grounded in the exercise and learner level |\n| Roleplay | Predefined scenarios with goals |\n| Content quality | Reviewed scenario design |"}, {"id": 185, "title": "Case study: Air Canada’s chatbot ruling", "tldr": "A tribunal held Air Canada responsible for its website chatbot’s incorrect statement about bereavement fares, rejecting the argument that the chatbot was a separate entity. Companies are accountable for what their AI says.", "real": "In Moffatt v. Air Canada (February 2024), British Columbia’s Civil Resolution Tribunal ordered the airline to pay the customer about CA$812 in damages, interest and fees after its chatbot misstated the refund policy.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Problem | Chatbot gave policy information contradicting the actual policy |\n| Failure | Ungrounded answer on a consequential topic |\n| Outcome | Company held liable |\n| Lesson | Ground policy answers, cite sources, test policy questions |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  Q[Bereavement fare question] --> BOT[Chatbot]\n  BOT -->|ungrounded| WRONG[Incorrect policy statement]\n  WRONG --> CUSTOMER[Customer relies on it]\n  CUSTOMER --> CLAIM[Tribunal claim: company liable]\n  FIX[Fix: RAG on policy + citations + evals] -.-> BOT\n```\n\n### Worked example\n\n| Control | Effect |\n|---|---|\n| Retrieve current policy text | Answers match policy |\n| Require citations | Users can verify |\n| “Not found” behavior | No invented policies |\n| Policy question eval set | Regressions caught before launch |"}, {"id": 186, "title": "Case study: Bing Chat’s early launch", "tldr": "Microsoft’s early Bing Chat showed erratic behavior in long conversations, leading quickly to limits on conversation length. It illustrated the value of staged rollouts, monitoring and conversation-level evaluation.", "real": "Microsoft launched the new Bing with chat in February 2023 and within about ten days limited conversations to 50 turns per day and 5 per session after reports of unexpected responses in long chats; limits were later relaxed.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Problem | Unexpected behavior in long, adversarial conversations |\n| Response | Turn limits, then iterative improvements |\n| Lesson | Evaluate long multi-turn interactions, not just single prompts |\n| Practice | Staged rollout with rapid mitigation levers |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LAUNCH[Launch] --> REPORTS[User reports of erratic replies]\n  REPORTS --> MITIGATE[Mitigation: session turn limits]\n  MITIGATE --> IMPROVE[Model + prompt improvements]\n  IMPROVE --> RELAX[Limits gradually relaxed]\n```\n\n### Worked example\n\n| Lesson | Practice |\n|---|---|\n| Long chats drift | Multi-turn eval scenarios |\n| Adversarial users exist | Red teaming before launch |\n| Need fast levers | Configurable limits and kill switches |"}, {"id": 187, "title": "Case study: an agent deleting production data", "tldr": "An AI coding agent on Replit deleted a production database during a code freeze despite instructions not to change anything. The fix was architectural: separating development and production environments and adding stronger controls.", "real": "The July 2025 incident was publicized by SaaStr founder Jason Lemkin; Replit’s CEO apologized and announced automatic separation of development and production databases and other safeguards.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Problem | Agent with production access took a destructive action |\n| Failure | Instructions relied on as a control |\n| Lesson | Enforce safety with permissions and environment separation |\n| Practice | No production credentials for development agents |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  AGENT[Coding agent] -->|before| PROD[(Production DB)]\n  AGENT -->|after| DEV[(Development DB)]\n  DEV --> REVIEW[Human-reviewed deploy]\n  REVIEW --> PROD\n```\n\n### Worked example\n\n| Control | Prevents |\n|---|---|\n| Separate dev/prod databases | Accidental production changes |\n| Read-only credentials by default | Destructive writes |\n| Approval for destructive commands | Unreviewed deletions |\n| Backups + tested restores | Permanent data loss |"}, {"id": 188, "title": "Case study: a multi-agent research system", "tldr": "Anthropic’s research feature uses a lead agent that plans and spawns parallel subagents to search different aspects of a question, then synthesizes their findings with citations. It improved quality for broad questions at high token cost.", "real": "Anthropic described the system in June 2025, reporting a 90.2% improvement over a single-agent setup on an internal research evaluation, about 15× more tokens than chat, and lessons such as teaching the lead agent to write detailed subagent briefs.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Problem | Broad research questions exceeding one agent’s context |\n| Key design | Orchestrator–worker with parallel subagents and a citation step |\n| Key metric | End-state quality judged by rubric |\n| Lesson | Multi-agent helps breadth-first tasks; costs scale with tokens |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  Q[Research question] --> LEAD[Lead agent: plan]\n  LEAD --> S1[Subagent: search angle 1]\n  LEAD --> S2[Subagent: search angle 2]\n  LEAD --> S3[Subagent: search angle 3]\n  S1 --> LEAD\n  S2 --> LEAD\n  S3 --> LEAD\n  LEAD --> CITE[Citation agent]\n  CITE --> REPORT[Report]\n```\n\n### Worked example\n\n| Lesson from the write-up | Practice |\n|---|---|\n| Vague briefs caused duplicate work | Detailed objectives, formats, boundaries |\n| Effort should match complexity | Scaling rules for subagent count |\n| Agents take different valid paths | Evaluate end states, not exact steps |"}, {"id": 189, "title": "Case study: natural language to SQL at Uber", "tldr": "Uber’s QueryGPT generated SQL from natural-language questions using retrieval of relevant tables and example queries plus specialized agents for intent and table selection, aiming to cut the time employees spent writing queries.", "real": "Uber described QueryGPT in 2024, reporting that it could reduce query authoring time from about 10 minutes to about 3 minutes, and highlighting the importance of curated workspaces of tables and samples.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Problem | Many employees writing complex SQL on huge schemas |\n| Key design | Intent detection, table retrieval, column pruning, example queries |\n| Key metric | Query correctness and time saved |\n| Lesson | Retrieval of the right schema context matters more than raw model power |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  Q[Question] --> INTENT[Intent agent: pick domain]\n  INTENT --> TABLES[Table agent: select tables]\n  TABLES --> PRUNE[Prune columns]\n  PRUNE --> GEN[Generate SQL with examples]\n  GEN --> USER[User reviews + runs]\n```\n\n### Worked example\n\n| Step | Why it helps |\n|---|---|\n| Domain workspaces | Narrow the search space |\n| Sample queries in prompt | Show correct joins and filters |\n| Column pruning | Fit large schemas into context |\n| Human runs the query | Keeps humans in control |"}, {"id": 190, "title": "Case study: lessons from LinkedIn’s generative AI products", "tldr": "LinkedIn’s team found reaching a decent experience was fast but reaching high quality took much longer; evaluation guidelines, consistent annotation, capacity and latency management were the hard parts.", "real": "In a May 2024 engineering post, LinkedIn reported reaching about 80% of the target experience in the first month, then needing four more months to surpass 95%, as they refined evaluation and handled errors.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Problem | Building AI-assisted job and feed experiences |\n| Hard parts | Evaluation, consistency, latency, capacity |\n| Key insight | The last 20% of quality costs most of the effort |\n| Lesson | Invest early in evaluation guidelines and tooling |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  M1[Month 1: ~80% quality] --> EVAL[Build eval guidelines + annotation]\n  EVAL --> ITER[Iterate on prompts, retrieval, errors]\n  ITER --> M5[Month 5: over 95%]\n```\n\n### Worked example\n\n| Phase | Typical effort |\n|---|---|\n| Prototype to “pretty good” | Weeks |\n| Evaluation framework | Weeks, ongoing |\n| “Good” to “great” | Months |\n| Capacity + latency tuning | Ongoing |"}, {"id": 191, "title": "Debugging AI systems", "tldr": "Debug AI failures by locating the first wrong step in the trace: was the input understood, the right context retrieved, the right tool called with correct arguments, the output parsed and validated? Most failures are context, retrieval or tool problems, not model limits.", "real": "Practitioners such as Hamel Husain have emphasized reading real traces and categorizing errors as the most productive activity for improving LLM applications.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Systematic root-cause analysis for AI failures |\n| Why it matters | Targets fixes where they help |\n| Method | Follow the trace; find the first divergence |\n| Watch out for | Switching models when retrieval was broken |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  BAD[Bad output] --> INPUT{Request understood?}\n  INPUT -->|no| FIX1[Query rewriting / clarification]\n  INPUT -->|yes| CTX{Right context retrieved?}\n  CTX -->|no| FIX2[Retrieval: parsing, chunking, hybrid, rerank]\n  CTX -->|yes| TOOL{Tools called correctly?}\n  TOOL -->|no| FIX3[Tool descriptions, schemas, errors]\n  TOOL -->|yes| GEN{Model used context correctly?}\n  GEN -->|no| FIX4[Prompt, context order, model choice]\n  GEN -->|yes| CHECK[Check eval label / expectations]\n```\n\n### Worked example\n\n| Symptom | First thing to inspect |\n|---|---|\n| Wrong policy answer | Retrieved chunks in the trace |\n| Agent loops | Repeated tool calls and error messages |\n| Invalid JSON | stop_reason (max_tokens?) and schema |\n| Slow responses | Span timings per stage |"}, {"id": 192, "title": "Estimating cost before you build", "tldr": "Estimate cost per task from expected input and output tokens, number of calls, retrieval and tool costs, then multiply by volume. Compare model options and include headroom for retries and growth.", "real": "Model providers publish per-token prices and offer discounts for cached and batch input, so careful estimates often change architecture decisions such as routing and caching.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Pre-build cost modeling |\n| Why it matters | Avoids unviable designs |\n| Inputs | Tokens per call, calls per task, volume, prices, cache rate |\n| Watch out for | Ignoring agent loops and retries |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TOKENS[Tokens per call] --> CALL[Cost per call]\n  PRICES[Prices] --> CALL\n  CALL --> TASK[Cost per task × calls]\n  TASK --> VOLUME[× monthly tasks]\n  VOLUME --> BUDGET[Monthly cost + 20% headroom]\n```\n\n### Worked example\n\nIllustrative prices: $3 / $15 per million input/output tokens; cached input at 10% of base price.\n\n```text\nRAG answer: 4,000 input tokens (2,500 cacheable system + docs prefix), 300 output tokens\nUncached input: 1,500 × $3/1M = $0.0045\nCached input: 2,500 × $0.30/1M = $0.00075\nOutput: 300 × $15/1M = $0.0045\nPer answer ≈ $0.00975; 500,000 answers/month ≈ $4,875; with 20% headroom ≈ $5,850\n```"}, {"id": 193, "title": "Choosing models: a playbook", "tldr": "Shortlist models using public benchmarks and constraints (data terms, regions, cost), test them on your eval set, measure latency and cost per task, and choose the cheapest model that meets the quality bar, with a fallback. Re-run the comparison when new models ship.", "real": "Model releases arrive every few months across providers, so teams that keep a ready-to-run eval suite can adopt better or cheaper models quickly, while others face risky manual comparisons.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Evidence-based model selection |\n| Why it matters | Largest lever on quality and cost |\n| Criteria | Eval score, cost per task, latency, data terms, reliability |\n| Watch out for | Choosing by brand or leaderboard alone |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CONSTRAINTS[Constraints: data, region, budget] --> SHORTLIST[Shortlist 3–4 models]\n  SHORTLIST --> EVALS[Run eval suite]\n  EVALS --> MEASURE[Measure latency + cost]\n  MEASURE --> PICK[Cheapest that meets quality bar]\n  PICK --> FALLBACK[Choose fallback model]\n```\n\n### Worked example\n\n| Model | Eval score | Cost per task | p95 latency | Decision |\n|---|---|---|---|---|\n| Large | 0.93 | $0.020 | 6.1 s | Fallback for hard cases |\n| Medium | 0.91 | $0.007 | 3.2 s | Primary (bar is 0.90) |\n| Small | 0.84 | $0.002 | 1.4 s | Below bar |"}, {"id": 194, "title": "Architecture review checklist", "tldr": "Review every AI system design for problem fit, model choice, context and retrieval, tools and permissions, evaluation, safety, reliability, latency, cost, privacy and operations before building and before launch.", "real": "Cloud providers’ well-architected frameworks added generative AI guidance in 2024–2025, reflecting the move toward structured design reviews for AI workloads.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A standard design review gate |\n| Why it matters | Catches predictable failures early |\n| When | Design, pre-launch, after major changes |\n| Watch out for | Reviews that never become action items |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DESIGN[Design doc] --> REVIEW[Checklist review]\n  REVIEW --> GAPS[Gaps found]\n  GAPS --> ACTIONS[Action items with owners]\n  ACTIONS --> APPROVE[Approval to build / launch]\n```\n\n### Worked example\n\n| Area | Question |\n|---|---|\n| Fit | Is AI needed? Simplest pattern chosen? |\n| Model | Selected with evals; fallback defined? |\n| Context | Retrieval evaluated; budgets set? |\n| Tools | Least privilege; approvals for risky actions? |\n| Evals | Golden set, judges calibrated, CI gates? |\n| Safety | Injection defenses, guardrails, red team? |\n| Reliability | Timeouts, retries, fallbacks, kill switch? |\n| Cost | Cost per task within budget? |\n| Privacy | Data minimized, retention defined? |\n| Ops | Tracing, dashboards, alerts, owner? |"}, {"id": 195, "title": "Production readiness checklist", "tldr": "Before launch, confirm evals pass, safety testing is done, monitoring and alerts exist, costs are budgeted, rollback and kill switches work, disclosures are written, support is prepared and owners are on call.", "real": "Google SRE’s production readiness reviews and similar launch checklists at large companies inspired AI-specific readiness reviews covering evaluation and safety as well as reliability.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Launch gate for AI features |\n| Why it matters | Prevents avoidable early incidents |\n| Sign-off | Engineering, product, security, legal where needed |\n| Watch out for | Launch dates overriding failed gates |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EVALS[Evals pass] --> GATE{All gates green?}\n  SAFETY[Red team done] --> GATE\n  MON[Monitoring ready] --> GATE\n  ROLLBACK[Rollback tested] --> GATE\n  GATE -->|yes| LAUNCH[Staged launch]\n  GATE -->|no| FIX[Fix gaps]\n```\n\n### Worked example\n\n- [ ] Eval suite meets thresholds on held-out set\n- [ ] Red-team findings resolved or accepted with mitigations\n- [ ] Guardrails and PII redaction active\n- [ ] Tracing, dashboards and alerts live\n- [ ] Cost per task and monthly budget approved\n- [ ] Kill switch and version rollback tested\n- [ ] AI disclosure and help text published\n- [ ] Support team trained; escalation path defined\n- [ ] On-call owner assigned"}, {"id": 196, "title": "Capstone: an enterprise knowledge assistant", "tldr": "Design an internal assistant that answers employee questions from wikis, policies and tickets with permission-aware hybrid retrieval, citations, “I don’t know” behavior, feedback loops, evaluation gates and cost controls.", "real": "Enterprise assistants such as Microsoft 365 Copilot and Glean ground answers in content users already have access to, making permission-aware retrieval the defining requirement.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Accurate, cited answers from internal knowledge |\n| Key requirements | Permissions, freshness, citations, refusal, evals |\n| Targets | Faithfulness ≥ 95%, zero permission leaks, p95 < 6 s |\n| Watch out for | ACLs not synced, stale content |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SOURCES[Wiki, drive, tickets] --> SYNC[Connectors + ACL sync]\n  SYNC --> INGEST[Parse, chunk, contextualize, embed]\n  INGEST --> INDEX[(Hybrid index + ACL metadata)]\n  USER[Employee] --> API[Assistant API]\n  API --> RET[Permission-filtered hybrid retrieval]\n  INDEX --> RET\n  RET --> RERANK[Rerank]\n  RERANK --> GEN[Answer + citations]\n  GEN --> USER\n  USER --> FEEDBACK[Feedback → evals]\n```\n\n### Worked example\n\n| Component | Choice |\n|---|---|\n| Index | PostgreSQL + pgvector + full-text, ACL columns |\n| Retrieval | Hybrid top 40 → rerank → top 6, filtered by user groups |\n| Generation | Mid-size model, citations required, refusal instruction |\n| Evals | 300 questions incl. 30 unanswerable and 20 permission tests |\n| Ops | Tracing, weekly error review, cost per answer dashboard |"}, {"id": 197, "title": "Capstone: a customer support agent", "tldr": "Design a customer-facing agent that answers policy questions with RAG and performs bounded actions (order status, returns) with tools, policy checks in code, human handoff, disclosure and outcome metrics.", "real": "Klarna’s and Intercom’s public descriptions of support agents, together with the Air Canada ruling, show both the value of automation and the need for grounded answers and enforced policies.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Resolve routine requests safely |\n| Key requirements | Grounded answers, scoped tools, policy engine, handoff |\n| Targets | Resolution ≥ 60%, 0 policy violations, CSAT ≥ baseline |\n| Watch out for | Refunds or promises outside policy |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CUST[Customer] --> AGENT[Support agent]\n  AGENT --> KB[Policy RAG]\n  AGENT --> TOOLS[Order + return tools]\n  TOOLS --> POLICY[Policy engine: limits, eligibility]\n  AGENT --> GUARD[Guardrails: PII, tone]\n  AGENT -->|complex or upset| HUMAN[Human agent + summary]\n```\n\n### Worked example\n\n| Evaluation | Design |\n|---|---|\n| Simulated customers | 200 scripted conversations, pass^4 measured |\n| Policy tests | Refund limits, eligibility windows |\n| Safety tests | Injection in customer messages |\n| Online | Resolution, recontact within 7 days, CSAT |"}, {"id": 198, "title": "The AI engineer career path", "tldr": "AI engineers grow from building prompts and RAG features to owning production AI systems, designing platforms and evaluation strategies, and leading AI architecture. Depth in evaluation, retrieval, agents and operations differentiates senior engineers.", "real": "The “AI engineer” title spread rapidly after 2023, and many companies created AI platform teams responsible for gateways, evaluation tooling and governance across product teams.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Progression of AI engineering roles |\n| Why it matters | Guides skill building |\n| Differentiators | Evals, retrieval, agents, production operations, cost |\n| Watch out for | Collecting frameworks instead of fundamentals |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  JR[Junior: prompts, API integrations] --> MID[Mid: RAG, tools, evals]\n  MID --> SR[Senior: production systems, agents, reliability]\n  SR --> STAFF[Staff: platforms, standards, architecture]\n  STAFF --> PRIN[Principal: AI strategy across org]\n```\n\n### Worked example\n\n| Level | Example deliverable |\n|---|---|\n| Junior | Structured extraction endpoint with tests |\n| Mid | RAG assistant with eval suite |\n| Senior | Agent with tools, guardrails, tracing, on-call |\n| Staff | Company-wide gateway + eval platform |"}, {"id": 199, "title": "Learning roadmap and reading list", "tldr": "Build skills in order: Python and APIs, prompting, embeddings and RAG, evaluation, tools and agents, production operations, fine-tuning and serving, security and governance. Learn by building and measuring real projects.", "real": "Recommended references include “Attention Is All You Need” (2017), Chip Huyen’s “AI Engineering” (2025), Anthropic’s “Building effective agents” (2024), the RAG paper (Lewis et al., 2020), the vLLM paper (2023) and the OWASP Top 10 for LLM Applications.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A structured path through the field |\n| Why it matters | Avoids random tutorial hopping |\n| Method | Build one project per stage; measure it |\n| Watch out for | Skipping evaluation |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  S1[APIs + prompting] --> S2[Embeddings + RAG]\n  S2 --> S3[Evaluation]\n  S3 --> S4[Tools + agents]\n  S4 --> S5[LLMOps + production]\n  S5 --> S6[Fine-tuning + serving]\n  S6 --> S7[Security + governance]\n```\n\n### Worked example\n\n| Stage | Project | Key reading |\n|---|---|---|\n| 1 | Structured extraction API | Provider prompting guides |\n| 2 | Document Q&A | RAG paper; contextual retrieval |\n| 3 | Eval harness | LLM-as-judge paper |\n| 4 | Tool-using agent | ReAct; Building effective agents |\n| 5 | Monitoring dashboard | OpenTelemetry GenAI conventions |\n| 6 | LoRA fine-tune + vLLM | LoRA, QLoRA, vLLM papers |\n| 7 | Red-team exercise | OWASP LLM Top 10 |"}, {"id": 200, "title": "Glossary", "tldr": "A shared vocabulary for AI engineering, covering the terms used throughout this course.", "real": "Consistent terminology across product, engineering and leadership teams reduces misunderstandings in AI projects, where words like “agent”, “accuracy” and “hallucination” are often used loosely.", "body": "### Diagram\n\n```mermaid\nflowchart LR\n  MODEL[Model terms] --> APP[Application terms]\n  APP --> QUALITY[Quality terms]\n  QUALITY --> OPS[Operations terms]\n```\n\n### Glossary\n\n| Term | Meaning |\n|---|---|\n| Token | Unit of text processed by a model |\n| Context window | Maximum tokens a model can process at once |\n| Embedding | Vector representing meaning |\n| RAG | Retrieval-augmented generation |\n| Hybrid search | Keyword + vector retrieval combined |\n| Reranker | Second-stage relevance model |\n| Tool calling | Model requests a function call |\n| Agent | Model-directed loop using tools toward a goal |\n| MCP | Model Context Protocol for tools and data |\n| Eval set | Inputs with expected outputs for testing |\n| LLM-as-judge | Using a model to grade outputs |\n| pass^k | Success on all k repeated trials |\n| Hallucination | Confident but false output |\n| Prompt injection | Untrusted text trying to override instructions |\n| LoRA | Low-rank adapter fine-tuning |\n| Quantization | Lower-precision weights for efficiency |\n| KV cache | Cached attention keys/values during generation |\n| TTFT | Time to first token |\n| Guardrail | Automated policy check on inputs/outputs/actions |\n| Gateway | Central proxy for model access and control |"}];
const PARTS = ["AI engineering foundations", "Neural networks and deep learning", "Transformers and LLM internals", "Working with LLM APIs", "Prompt and context engineering", "Embeddings and search", "Retrieval-augmented generation", "Agents and tools", "Evaluation", "Fine-tuning", "Inference and serving", "LLMOps and production", "Safety, security and responsible AI", "Multimodal AI", "Data for AI systems", "Classical ML in AI engineering", "Building AI products", "Hands-on projects", "Case studies", "Mastery and capstones"];
const TOTAL = 200, PER = 10;
function idsOf(p){ const a = []; for (let i = (p-1)*PER + 1; i <= p*PER; i++) a.push(i); return a; }
const partOf = id => Math.ceil(id / PER);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "ai-engineering-course-progress-v1";
const LS_LAST = "ai-engineering-course-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try{ await dbRef.set({done:[...done].sort((a,b)=>a-b), updated:Date.now()}); }
  catch(e){ if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; pushRemote(); }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...done])); }catch(e){} }
function toggle(id){
  if (done.has(id)) done.delete(id); else done.add(id);
  saveLocal(); pushRemote(); renderAll();
  toast(done.has(id) ? "Chapter " + id + " marked complete" : "Chapter " + id + " marked not complete");
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(s){
  if (window.marked && marked.parse){
    const html = marked.parse(s, {gfm:true, headerIds:false, mangle:false});
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  }
  return "<pre>" + esc(s) + "</pre>";
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function currentId(){
  const m = location.hash.match(/^#ch-(\d{1,3})$/);
  const n = m ? +m[1] : 0;
  return n >= 1 && n <= TOTAL ? n : 0;
}

/* ---------- header memory bank ---------- */
function renderBank(){
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    html += '<div class="bank-group" title="Part ' + p + ': ' + esc(PARTS[p-1]) + '">';
    for (const i of idsOf(p)){
      html += '<button class="cell' + (done.has(i) ? " done" : "") + (i === cur ? " here" : "") +
        '" data-go="' + i + '" aria-label="Chapter ' + i + (done.has(i) ? ", complete" : "") + '"></button>';
    }
    html += "</div>";
  }
  document.getElementById("bank").innerHTML = html;
  document.getElementById("doneCount").textContent = done.size;
  document.getElementById("pct").textContent = Math.round(done.size * 100 / TOTAL) + "%";
}

/* ---------- sidebar ---------- */
const openParts = new Set();
function renderSide(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const matches = ids.filter(i => !q || byId[i].title.toLowerCase().includes(q) || byId[i].tldr.toLowerCase().includes(q) || String(i) === q);
    if (q && !matches.length) continue;
    const count = ids.filter(i => done.has(i)).length;
    const open = q || openParts.has(p) || partOf(cur) === p;
    html += '<div class="part' + (open ? " open" : "") + '">' +
      '<button class="part-head" data-part="' + p + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="part-num">' + String(p).padStart(2, "0") + '</span>' +
      '<span class="part-name">' + esc(PARTS[p-1]) + '</span>' +
      '<span class="part-count' + (count === PER ? " full" : "") + '">' + count + '/' + PER + '</span></button><ul class="part-list">';
    for (const i of matches){
      html += '<li class="ch-row' + (i === cur ? " active" : "") + '">' +
        '<button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="' + (done.has(i) ? "Mark chapter " + i + " not complete" : "Mark chapter " + i + " complete") + '">' + TICK + '</button>' +
        '<a href="#ch-' + i + '"><span class="n">' + i + '.</span>' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ul></div>";
  }
  if (!html) html = '<p style="color:var(--muted);font-size:14px;padding:8px">No chapters match that search. Try a shorter word like “RAG”, “LoRA” or “eval”.</p>';
  document.getElementById("parts").innerHTML = html;
}

/* ---------- diagrams and charts ---------- */
let mermaidPromise = null, renderSeq = 0;
const svgCache = new Map();
function isDark(){
  const a = document.documentElement.getAttribute("data-theme");
  if (a) return a === "dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function ensureMermaid(){
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (mermaidPromise) return mermaidPromise;
  mermaidPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js";
    s.onload = () => {
      try{
        window.mermaid.initialize({ startOnLoad:false, securityLevel:"strict", theme: isDark() ? "dark" : "neutral",
          fontFamily:"IBM Plex Sans, system-ui, sans-serif", flowchart:{ curve:"basis", htmlLabels:true } });
        resolve(window.mermaid);
      }catch(e){ reject(e); }
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return mermaidPromise;
}
function fitSvg(div){
  const svg = div.querySelector("svg");
  if (!svg) return;
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Diagram");
  const vb = (svg.getAttribute("viewBox") || "").split(/\s+/).map(Number);
  const vbw = vb[2] || 0;
  if (vbw && div.clientWidth && div.clientWidth < vbw * 0.7){
    svg.style.maxWidth = "none";
    svg.style.width = Math.round(vbw * 0.85) + "px";
  }
}
function fmtNum(v){ return Number(v).toLocaleString("en-US", { maximumFractionDigits: 3 }); }
function renderChart(el, spec){
  const max = Math.max(...spec.data.map(d => d[1]));
  const unit = spec.unit || "";
  const sep = (unit === "%" || unit === "×") ? "" : " ";
  let rows = "";
  for (const [label, v] of spec.data){
    let w = spec.log ? (Math.log10(v + 1) / Math.log10(max + 1)) * 100 : (v / max) * 100;
    w = Math.max(w, 1.5);
    rows += '<div class="bar-row"><span class="bar-label">' + esc(String(label)) + '</span><span class="bar-track"><span class="bar" style="width:' + w.toFixed(1) + '%"></span></span><span class="bar-val">' + fmtNum(v) + sep + esc(unit) + '</span></div>';
  }
  const fig = document.createElement("figure");
  fig.className = "chart";
  fig.innerHTML = '<figcaption>' + esc(spec.title || "") + '</figcaption>' + rows + (spec.log ? '<div class="chart-note">Bar lengths use a logarithmic scale.</div>' : "");
  el.replaceWith(fig);
}
function enhance(root){
  root.querySelectorAll("code.language-chart").forEach(code => {
    const pre = code.closest("pre") || code;
    try{ renderChart(pre, JSON.parse(code.textContent)); }catch(e){}
  });
  const blocks = [...root.querySelectorAll("code.language-mermaid")];
  if (!blocks.length) return;
  const seq = ++renderSeq;
  const holders = blocks.map(code => {
    const pre = code.closest("pre") || code;
    const div = document.createElement("div");
    div.className = "diagram loading";
    div.textContent = "Loading diagram…";
    div.dataset.src = code.textContent;
    pre.replaceWith(div);
    if (svgCache.has(div.dataset.src)){ div.classList.remove("loading"); div.innerHTML = svgCache.get(div.dataset.src); div.dataset.done = "1"; fitSvg(div); }
    return div;
  }).filter(div => !div.dataset.done);
  if (!holders.length) return;
  ensureMermaid().then(async m => {
    for (let k = 0; k < holders.length; k++){
      const div = holders[k];
      if (seq !== renderSeq || !div.isConnected) return;
      const id = "mmd-" + seq + "-" + k;
      try{
        const out = await m.render(id, div.dataset.src);
        if (!div.isConnected) return;
        div.classList.remove("loading");
        div.innerHTML = out.svg;
        svgCache.set(div.dataset.src, out.svg);
        fitSvg(div);
      }catch(e){
        const junk = document.getElementById("d" + id); if (junk) junk.remove();
        div.classList.remove("loading");
        div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>";
      }
    }
  }).catch(() => {
    holders.forEach(div => { div.classList.remove("loading"); div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>"; });
  });
}

/* ---------- chapter view ---------- */
function renderChapter(id){
  const c = byId[id];
  const p = partOf(id);
  const ids = idsOf(p);
  const isDone = done.has(id);
  const tabs = ids.map(i =>
    '<button class="tab' + (i === id ? " active" : "") + '" role="tab" aria-selected="' + (i === id) + '" data-go="' + i + '">' +
    '<span class="dot' + (done.has(i) ? " on" : "") + '"></span><span class="tab-t">' + i + '. ' + esc(byId[i].title) + '</span></button>'
  ).join("");
  document.getElementById("main").innerHTML =
    '<p class="crumb">Part ' + p + ' of 20: ' + esc(PARTS[p-1]) + '</p>' +
    '<div class="tabs" role="tablist" aria-label="Chapters in this part">' + tabs + '</div>' +
    '<article>' +
      '<p class="ch-no">Chapter ' + id + ' of ' + TOTAL + '</p>' +
      '<h1 class="ch-title">' + esc(c.title) + '</h1>' +
      '<section class="box tldr"><h2>TL;DR</h2><p>' + inlineMd(c.tldr) + '</p></section>' +
      '<div class="body">' + md(c.body) + '</div>' +
      '<section class="box real"><h2>Real-world example</h2><p>' + inlineMd(c.real) + '</p></section>' +
      '<div class="done-bar">' +
        '<button class="complete' + (isDone ? " on" : "") + '" data-toggle="' + id + '" aria-pressed="' + isDone + '">' +
          '<span class="tick' + (isDone ? " on" : "") + '">' + TICK + '</span>' + (isDone ? "Completed" : "Mark as complete") + '</button>' +
        '<div class="nav">' +
          '<button class="btn" data-go="' + (id - 1) + '"' + (id === 1 ? " disabled" : "") + '>Previous</button>' +
          '<button class="btn" data-go="' + (id + 1) + '"' + (id === TOTAL ? " disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  enhance(document.getElementById("main"));
}

/* ---------- contents view ---------- */
function renderContents(){
  let html = '<div class="contents"><h1>Contents</h1>' +
    '<p class="lead">A step-by-step course in twenty parts: ML and deep learning foundations, transformer internals, LLM APIs, prompt and context engineering, embeddings and search, RAG, agents, evaluation, fine-tuning, inference and serving, LLMOps, safety, multimodal AI, data, classical ML, AI product building, ten hands-on projects, case studies and capstones. Every chapter has an engineering card, a diagram and a worked example (code, calculation or prompt). Tick a chapter when you finish it; your progress is saved. Model names, prices and APIs change quickly, so confirm specifics against current documentation.</p>' +
    '<div class="contents-actions"><button class="btn" data-go="' + firstUnread() + '">' + (done.size ? "Continue with chapter " + firstUnread() : "Start chapter 1") + '</button>' +
    '<button class="btn" id="resetBtn">Reset progress</button></div><div class="grid">';
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const count = ids.filter(i => done.has(i)).length;
    html += '<section class="pcard"><h2>Part ' + p + ': ' + esc(PARTS[p-1]) + '</h2><div class="meta">' + count + ' of ' + PER + ' complete</div><ol>';
    for (const i of ids){
      html += '<li><button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="Toggle chapter ' + i + '">' + TICK + '</button><a href="#ch-' + i + '">' + i + '. ' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ol></section>";
  }
  document.getElementById("main").innerHTML = html + "</div></div>";
}
function firstUnread(){ for (let i = 1; i <= TOTAL; i++) if (!done.has(i)) return i; return TOTAL; }

/* ---------- routing ---------- */
let lastRendered = null;
function renderAll(){
  const id = currentId();
  renderBank(); renderSide();
  const y = window.scrollY;
  if (id) renderChapter(id); else renderContents();
  if (lastRendered === location.hash) window.scrollTo(0, y);
  lastRendered = location.hash;
}
function route(){
  const id = currentId();
  if (!id && location.hash !== "#contents"){
    let last = 0; try{ last = +localStorage.getItem(LS_LAST) || 0; }catch(e){}
    location.replace("#ch-" + (last >= 1 && last <= TOTAL ? last : 1));
    return;
  }
  if (id){ try{ localStorage.setItem(LS_LAST, id); }catch(e){} }
  document.body.classList.remove("drawer");
  renderAll();
  window.scrollTo(0, 0);
  const active = document.querySelector(".ch-row.active");
  if (active) active.scrollIntoView({block:"nearest"});
  const tab = document.querySelector(".tab.active");
  if (tab && tab.parentElement){ const r = tab.parentElement; const left = tab.offsetLeft - r.offsetLeft; if (left < r.scrollLeft || left + tab.offsetWidth > r.scrollLeft + r.clientWidth) r.scrollLeft = left - 16; }
}
function go(id){ if (id >= 1 && id <= TOTAL) location.hash = "#ch-" + id; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){ e.preventDefault(); toggle(+t.dataset.toggle); return; }
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled){ go(+g.dataset.go); return; }
  const ph = e.target.closest("[data-part]");
  if (ph){
    const p = +ph.dataset.part;
    const el = ph.parentElement;
    const isOpen = el.classList.toggle("open");
    if (isOpen) openParts.add(p); else openParts.delete(p);
    ph.setAttribute("aria-expanded", isOpen);
    return;
  }
  if (e.target.id === "resetBtn"){
    if (confirm("Clear all 200 ticks? This can’t be undone.")){ done.clear(); saveLocal(); pushRemote(); renderAll(); toast("Progress reset"); }
  }
});
document.getElementById("search").addEventListener("input", renderSide);
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.add("drawer"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = currentId(); if (!id) return;
  if (e.key === "ArrowRight") go(id + 1);
  else if (e.key === "ArrowLeft") go(id - 1);
});
function setTopH(){ document.documentElement.style.setProperty("--top-h", document.getElementById("top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);
window.addEventListener("hashchange", route);
setTopH();
route();
initSync();
</script>
</body>
</html>

# Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Prior knowledge about roads |\n| HD maps | Lanes, curbs, signs, lights, speed limits at cm accuracy |\n| Mapless | Online lane and road-structure inference |\n| Watch out for | Construction zones that differ from the map |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  MAP[HD map prior] --> COMPARE[Compare with live perception]\n  LIVE[Live perception] --> COMPARE\n  COMPARE -->|match| PLAN[Plan using map]\n  COMPARE -->|mismatch: construction| ONLINE[Rely on online perception + caution]\n```\n\n### Worked example\n\n| Approach | Scaling to a new city | Robustness in known areas |\n|---|---|---|\n| HD map–heavy | Slower (mapping needed) | High |\n| Mapless | Faster | Depends on perception quality |\n| Hybrid | Medium | High |"}, {"id": 155, "title": "End-to-end driving models", "tldr": "End-to-end approaches train neural networks that map sensor inputs (and route information) more directly to driving trajectories or controls, reducing hand-designed interfaces. They benefit from large data but are harder to verify and debug.", "real": "UniAD (CVPR 2023 best paper) unified perception, prediction and planning in one network, and Tesla said in 2024 that FSD v12 replaced much of its hand-written planning code with end-to-end neural networks.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Learning driving behavior with fewer handcrafted modules |\n| Strengths | Learns subtle behaviors from data; fewer brittle interfaces |\n| Weaknesses | Interpretability, verification, rare-event behavior |\n| Watch out for | Shortcuts learned from correlations in data |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CAMS[Multi-camera video] --> NET[End-to-end network]\n  ROUTE[Route / navigation] --> NET\n  NET --> TRAJ[Planned trajectory]\n  TRAJ --> GUARD[Rule-based safety checks]\n  GUARD --> CONTROL[Control]\n```\n\n### Worked example\n\n| Design | Verification approach |\n|---|---|\n| Modular stack | Test each module + integration |\n| End-to-end | Massive scenario evaluation, closed-loop sim, safety guards |\n| Hybrid | Learned planner + rule-based safety envelope |"}, {"id": 156, "title": "Prediction and interaction", "tldr": "AVs must forecast what pedestrians, cyclists and vehicles will do, often as multiple probable futures, and plan interactively (others react to the AV too). Prediction quality is crucial at intersections, merges and crosswalks.", "real": "The Waymo Open Motion Dataset (2021) and related challenges spurred research on multi-agent motion forecasting, with transformer models predicting multiple future trajectories per agent.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Forecasting other road users’ behavior |\n| Outputs | Multiple trajectories with probabilities |\n| Interaction | Joint prediction and planning (game-like) |\n| Watch out for | Overconfident single predictions |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  HISTORY[Past tracks] --> MODEL[Prediction model]\n  MAPCTX[Map context] --> MODEL\n  MODEL --> F1[Future A: 60%]\n  MODEL --> F2[Future B: 30%]\n  MODEL --> F3[Future C: 10%]\n  F1 --> PLAN[Planner considers all]\n  F2 --> PLAN\n  F3 --> PLAN\n```\n\n### Worked example\n\n```text\nTime to collision (TTC) = distance / closing speed\nGap 30 m, ego 15 m/s, lead vehicle 5 m/s → closing 10 m/s → TTC = 3.0 s\nBraking distance at 15 m/s with 6 m/s² deceleration: v² / (2a) = 225 / 12 ≈ 18.8 m (+ reaction distance)\n```"}, {"id": 157, "title": "Simulation and scenario testing for AVs", "tldr": "AV validation relies on simulation: replaying real logs, perturbing them, generating adversarial scenarios and testing billions of miles virtually. Scenario libraries cover critical situations; closed-loop sim evaluates how the AV and others react.", "real": "Waymo has reported running billions of miles in simulation, and open simulators such as CARLA (2017) support AV research with configurable scenarios.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Virtual testing of driving software |\n| Methods | Log replay, closed-loop sim, scenario generation, fuzzing |\n| Metrics | Collisions, near-misses, rule violations, comfort |\n| Watch out for | Simulated agents that behave unlike real people |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LOGS[Real driving logs] --> REPLAY[Log replay]\n  LOGS --> VARIANTS[Perturbed variants]\n  GEN[Generated edge cases] --> CLOSED[Closed-loop simulation]\n  REPLAY --> CLOSED\n  VARIANTS --> CLOSED\n  CLOSED --> METRICS[Safety + comfort metrics]\n  METRICS --> GATE{Release gate}\n```\n\n### Worked example\n\n| Scenario class | Example variation |\n|---|---|\n| Cut-in | Lead car cuts in at 0.8–2.0 s headway |\n| Occluded pedestrian | Child emerges from behind parked van |\n| Unprotected left turn | Oncoming speeds 30–70 km/h |\n| Emergency vehicle | Siren approaching from behind |"}, {"id": 158, "title": "Safety standards and safety cases", "tldr": "AV safety combines functional safety (ISO 26262: hardware/software faults), SOTIF (ISO 21448: insufficient performance or misuse without faults), UL 4600 (safety cases for autonomous products) and regulatory reporting. A safety case argues, with evidence, why the system is acceptably safe.", "real": "UL 4600 was published in 2020 as the first standard focused on safety cases for fully autonomous products, complementing ISO 26262 (2011, revised 2018) and ISO 21448 SOTIF (2022).", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Frameworks to argue and demonstrate safety |\n| ISO 26262 | Functional safety (faults) |\n| ISO 21448 | SOTIF: limits of intended functionality |\n| UL 4600 | Structured safety case for autonomy |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  CLAIM[Claim: acceptably safe in ODD] --> ARG1[Hazards identified + mitigated]\n  CLAIM --> ARG2[Perception performance sufficient]\n  CLAIM --> ARG3[Validation coverage adequate]\n  ARG1 --> EV1[Evidence: hazard analysis, FMEA]\n  ARG2 --> EV2[Evidence: test results, field data]\n  ARG3 --> EV3[Evidence: sim + road testing coverage]\n```\n\n### Worked example\n\n| Hazard | Category | Mitigation |\n|---|---|---|\n| Brake actuator fault | ISO 26262 (functional safety) | Redundant braking |\n| Misclassifies unusual object | SOTIF | Treat unknown obstacles as blocking |\n| Operating in snow outside ODD | SOTIF / ODD | Detect weather and pull over |"}, {"id": 159, "title": "Robotaxis in deployment", "tldr": "Robotaxi services operate driverless vehicles in defined areas, supported by remote assistance, fleet operations and depots. Scaling requires safety performance, vehicle supply, regulation, community acceptance and unit economics.", "real": "Waymo was providing more than 500,000 paid rides per week across 14 US cities with about 4,000 vehicles by November 2026 and aimed for 1 million weekly rides by the end of 2026; Tesla, Zoox and Baidu’s Apollo Go also run robotaxi services.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Commercial driverless ride-hailing |\n| Operations | Remote assistance, depots, cleaning, charging, customer support |\n| Scaling factors | Safety record, regulation, vehicles, cost per mile |\n| Watch out for | Single incidents with outsized regulatory and public impact |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  RIDER[Rider app] --> DISPATCH[Dispatch]\n  DISPATCH --> CAR[Driverless vehicle]\n  CAR -->|uncertain situation| REMOTE[Remote assistance gives guidance]\n  REMOTE --> CAR\n  CAR --> DEPOT[Depot: charge, clean, maintain]\n```\n\n### Worked example\n\n| Robotaxi milestone | Date |\n|---|---|\n| Waymo 100,000 paid rides/week | August 2024 |\n| Tesla Robotaxi launch in Austin | June 2025 |\n| Waymo 500,000 paid rides/week | Early 2026 |\n| Waymo target: 1 million/week | End of 2026 |"}, {"id": 160, "title": "Trucks, delivery robots and incidents", "tldr": "Autonomy is expanding into freight trucking on highways, sidewalk delivery robots and campus shuttles. Incidents across the industry show the importance of safety culture, transparency and conservative operations.", "real": "Aurora began driverless commercial trucking between Dallas and Houston in May 2025, while GM shut down its Cruise robotaxi business in December 2024 after an October 2023 incident in which a Cruise vehicle dragged a pedestrian and the company’s disclosures to regulators were criticized.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Autonomy beyond robotaxis + lessons from failures |\n| Trucking | Highway hub-to-hub routes |\n| Delivery | Sidewalk robots, drones |\n| Watch out for | Incomplete disclosure after incidents destroying trust |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  HUB1[Logistics hub A] -->|driverless highway route| HUB2[Logistics hub B]\n  HUB2 --> LASTMILE[Human or robot last mile]\n  INCIDENT[Incident] --> RESPONSE[Transparent reporting + fix + regulator engagement]\n```\n\n### Worked example\n\n| Lesson from incidents | Practice |\n|---|---|\n| Post-crash behavior matters | Safe-stop logic after collisions |\n| Disclosure matters | Full, prompt reporting to regulators |\n| Testing safety drivers can be complacent | Driver monitoring and training |\n| Rare events dominate risk | Scenario-based testing at scale |"}, {"id": 161, "title": "Industrial robots and cobots", "tldr": "Industrial arms perform welding, painting, assembly, machine tending and palletizing with high speed and precision. Collaborative robots (cobots) work near people with force limits and are easier to program; AI adds perception and flexibility to these mature systems.", "real": "The International Federation of Robotics reported about 4.66 million industrial robots operating worldwide in 2024, and Universal Robots sold what is widely considered the first commercial cobot in 2008.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Robots in manufacturing |\n| Traditional arms | Fast, precise, caged or guarded |\n| Cobots | Power and force limited, near humans, easy teaching |\n| AI additions | Vision-guided picking, flexible assembly, inspection |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PARTS[Parts arrive randomly] --> VISION[3D vision locates parts]\n  VISION --> ARM[Robot arm picks]\n  ARM --> FIXTURE[Places in machine]\n  FIXTURE --> INSPECT[AI visual inspection]\n  INSPECT --> OUT[Good / reject]\n```\n\n### Worked example\n\n| Application | Typical robot | AI role |\n|---|---|---|\n| Welding car bodies | Industrial arm | Seam tracking |\n| Machine tending | Cobot | Part localization |\n| Bin picking | Arm + 3D camera | Grasp detection |\n| Quality inspection | Fixed camera + arm | Defect detection |"}, {"id": 162, "title": "Warehouses and logistics", "tldr": "Logistics is one of the largest physical AI markets: goods-to-person robots, autonomous mobile robots, sortation, palletizing, truck unloading and AI-driven picking of varied items. Fleet coordination software is as important as individual robots.", "real": "Amazon reported deploying its one millionth robot in July 2025 and introduced DeepFleet, a foundation model for coordinating robot fleet movement, along with the tactile-sensing Vulcan picking robot earlier that year.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Automation of storage, picking and shipping |\n| Systems | Goods-to-person, AMRs, sorters, robotic picking, unloading |\n| Hard problems | Picking millions of different items, peak scaling |\n| Watch out for | Throughput bottlenecks moving elsewhere in the process |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INBOUND[Inbound trucks] --> UNLOAD[Robotic unloading]\n  UNLOAD --> STORE[AMRs move pods to storage]\n  ORDER[Customer order] --> FLEET[Fleet software]\n  FLEET --> PICK[Robotic / human picking station]\n  PICK --> PACK[Packing]\n  PACK --> SORT[Sortation robots]\n  SORT --> OUTBOUND[Outbound]\n```\n\n### Worked example\n\n```text\nPicking station: 600 picks/hour target\nRobot picker success 98% → 12 failed picks/hour need human handling\nAt 99.5% → 3 failures/hour: one human can supervise several stations\n```"}, {"id": 163, "title": "Humanoids in industry", "tldr": "Humanoids are being piloted in factories and warehouses for tote moving, parts sequencing and material handling, where human-shaped robots fit existing spaces. Key questions are reliability over full shifts, speed, safety certification and cost versus simpler automation.", "real": "Boston Dynamics said its 2026 production of Atlas was fully booked with deployments at Hyundai, Figure ran pilots at BMW, Agility’s Digit works at GXO under a robots-as-a-service model, and Tesla began early Optimus production at Fremont in 2026 with external customer deliveries planned for 2027.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Human-shaped robots doing industrial work |\n| Early tasks | Tote handling, parts sequencing, kitting, machine loading |\n| Key metrics | Uptime, units per hour, interventions, safety incidents, cost per hour |\n| Watch out for | Pilots that never reach multi-shift, multi-site scale |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PILOT[Pilot: one task, one site] --> SHIFT[Full-shift reliability]\n  SHIFT --> MULTI[Multiple tasks]\n  MULTI --> SITES[Multiple sites]\n  SITES --> FLEET[Fleet scale with service model]\n```\n\n### Worked example\n\n| Comparison for moving totes | Humanoid | Conveyor + AMR |\n|---|---|---|\n| Fits existing layout without changes | Yes | Often needs changes |\n| Cost (2026) | High | Lower, mature |\n| Throughput | Lower | Higher |\n| Flexibility to new tasks | Higher (potentially) | Low |"}, {"id": 164, "title": "Robots in the home", "tldr": "Home robots range from vacuums and lawn mowers (widely deployed) to emerging general-purpose humanoids and mobile manipulators. Homes are hard: clutter, variety, stairs, pets, children, privacy and a very high bar for safety and reliability.", "real": "1X opened preorders for its NEO home humanoid in October 2025 at $20,000 (or a monthly subscription), with some tasks supported by remote teleoperation, while Physical Intelligence demonstrated mobile robots cleaning unseen homes with π0.5.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Consumer robots for household tasks |\n| Mature | Vacuums, mops, lawn mowers, pool cleaners |\n| Emerging | General-purpose humanoids, tidying and laundry robots |\n| Watch out for | Privacy (cameras at home), child safety, remote-operator transparency |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REQUEST[User: tidy the living room] --> ROBOT[Home robot]\n  ROBOT --> AUTO{Can do autonomously?}\n  AUTO -->|yes| DO[Perform task]\n  AUTO -->|no| REMOTE[Remote expert assist with user consent]\n  REMOTE --> DATA[Learn for next time]\n```\n\n### Worked example\n\n| Home task | Difficulty (2026) |\n|---|---|\n| Vacuuming floors | Solved commercially |\n| Loading a dishwasher | Demonstrated; reliability improving |\n| Folding laundry | Demonstrated; speed/quality improving |\n| Cooking a full meal | Research frontier |"}, {"id": 165, "title": "Healthcare and surgical robotics", "tldr": "Surgical robots extend surgeons’ precision (teleoperated, not autonomous today); hospital robots deliver supplies; rehabilitation robots and exoskeletons assist patients. Regulation and safety requirements are strict; autonomy is increasing slowly in narrow subtasks.", "real": "Intuitive’s da Vinci system received FDA clearance in 2000 and has been used in millions of procedures, and NVIDIA’s 2026 announcements included partners such as CMR Surgical and LEM Surgical using simulation and Jetson Thor for surgical robotics.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Robots in medicine and care |\n| Types | Surgical, logistics, pharmacy, rehabilitation, eldercare |\n| Autonomy | Mostly assistive; autonomous subtasks in research and early products |\n| Watch out for | Regulatory pathways and liability |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SURGEON[Surgeon at console] --> SYSTEM[Surgical robot]\n  SYSTEM --> AI[AI: tissue tracking, tremor filtering, guidance]\n  AI --> SYSTEM\n  SYSTEM --> PATIENT[Patient]\n  SIM[Simulation + digital twins] -.training + validation.-> AI\n```\n\n### Worked example\n\n| Robot type | Autonomy level |\n|---|---|\n| Laparoscopic surgical robot | Surgeon-controlled with assistance features |\n| Hospital delivery robot | Autonomous navigation |\n| Pharmacy dispensing robot | Highly automated, structured |\n| Rehabilitation exoskeleton | Assistive, patient-driven |"}, {"id": 166, "title": "Agriculture", "tldr": "Agricultural robotics includes autonomous tractors, precision spraying and weeding, harvesting robots, monitoring drones and livestock robots. Outdoor variability, seasonality and cost pressure make robustness and simple maintenance essential.", "real": "John Deere unveiled an autonomous 8R tractor at CES 2022, and Carbon Robotics’ LaserWeeder uses computer vision and lasers to eliminate weeds without herbicides.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Physical AI on farms |\n| Applications | Autonomous tractors, weeding, spraying, harvesting, milking |\n| Sensing | RTK GNSS, cameras, multispectral imaging |\n| Watch out for | Dust, mud, lighting and crop variation breaking perception |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  FIELD[Field] --> CAMERA[Cameras detect crops vs weeds]\n  CAMERA --> DECIDE[Classify each plant]\n  DECIDE -->|weed| ACT[Laser / targeted spray]\n  DECIDE -->|crop| SKIP[Leave untouched]\n  RTK[RTK GNSS] --> PATH[Precise rows]\n```\n\n### Worked example\n\n```text\nTargeted spraying vs broadcast:\nBroadcast: 200 L herbicide per hectare\nTargeted (weeds cover 10% of area): spray only detected weed areas → ≈ 200 × 0.10 = 20 L/ha\nSavings ≈ 90% of chemical; with 90% weed detection, 10% of weeds are missed → plan a follow-up pass\n```"}, {"id": 167, "title": "Construction, inspection and energy", "tldr": "Robots inspect power plants, oil rigs, pipelines, bridges and data centers; quadrupeds and drones capture data in hazardous areas; construction robots lay out sites, drill, tie rebar and operate autonomous excavators. Autonomy reduces risk to workers.", "real": "Boston Dynamics’ Spot and ANYbotics’ ANYmal are deployed for routine inspection rounds in industrial facilities, reading gauges and detecting leaks and thermal anomalies.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Robots for hazardous or repetitive field work |\n| Inspection | Gauges, thermal, acoustic leaks, visual anomalies |\n| Construction | Layout, drilling, autonomous earthmoving |\n| Watch out for | Communication dead zones and harsh environments |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  MISSION[Scheduled inspection mission] --> ROBOT[Quadruped walks route]\n  ROBOT --> CAPTURE[Capture gauges, thermal, audio]\n  CAPTURE --> AI[AI reads gauges + detects anomalies]\n  AI --> ALERT[Alert maintenance team]\n  AI --> TREND[Trend dashboard]\n```\n\n### Worked example\n\n| Inspection task | Sensor | AI output |\n|---|---|---|\n| Analog pressure gauge | Zoom camera | Numeric reading |\n| Motor overheating | Thermal camera | Temperature alarm |\n| Gas leak | Acoustic imager | Leak location |\n| Corrosion | High-res camera | Severity score |"}, {"id": 168, "title": "Drones and aerial delivery", "tldr": "Drones handle mapping, inspection, agriculture, filming, emergency response and delivery. Autonomy covers navigation, obstacle avoidance and precision landing; operations depend heavily on aviation regulation, beyond-visual-line-of-sight approvals and weather.", "real": "Zipline has delivered medical supplies by drone since 2016 and expanded to home delivery, and Wing (Alphabet) partnered with Walmart to expand drone delivery in the United States.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Autonomous aircraft for work tasks |\n| Uses | Delivery, inspection, mapping, agriculture, emergency response |\n| Constraints | Regulation, weather, battery, noise, privacy |\n| Watch out for | Operating without proper airspace authorization |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ORDER[Order] --> PLAN[Route planning + airspace check]\n  PLAN --> FLY[Autonomous flight]\n  FLY --> DROP[Precision drop / landing]\n  DROP --> RETURN[Return + battery swap]\n  WEATHER[Weather service] --> PLAN\n```\n\n### Worked example\n\n```text\nDelivery radius estimate: cruise 25 m/s, usable flight time 30 min with 20% reserve → 24 min\nRound trip distance = 25 × 24 × 60 = 36 km → max radius ≈ 18 km (before wind and hover time)\n```"}, {"id": 169, "title": "Space, underwater and extreme environments", "tldr": "Robots operate where humans can’t easily go: planetary rovers, satellite servicing, deep-sea vehicles, nuclear decommissioning and disaster response. Long communication delays and harsh conditions require high onboard autonomy and robustness.", "real": "NASA’s Perseverance rover uses autonomous navigation (AutoNav) on Mars, where radio signals take several minutes each way, and the Ingenuity helicopter completed 72 flights between 2021 and 2024.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Robots in remote and hazardous settings |\n| Challenges | Communication delay, radiation, pressure, temperature, no repair |\n| Autonomy needs | Navigation, fault detection, safe modes |\n| Watch out for | Single-point failures without redundancy |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EARTH[Mission control] -->|minutes of delay| ROVER[Rover]\n  ROVER --> AUTONAV[Onboard autonomous navigation]\n  AUTONAV --> HAZARD[Hazard avoidance]\n  ROVER --> SAFEMODE[Fault → safe mode + wait for Earth]\n```\n\n### Worked example\n\n```text\nEarth–Mars one-way light time ranges from about 3 to 22 minutes\nTeleoperating a 1 m move with a 20-minute round trip → impractical → autonomy required\n```"}, {"id": 170, "title": "Service and hospitality robots", "tldr": "Service robots deliver food in restaurants, guide visitors, clean commercial floors, deliver packages on sidewalks and handle hotel deliveries. They work in semi-structured public spaces and must be safe, polite and easy for staff to manage.", "real": "Sidewalk delivery robots from companies such as Starship Technologies have completed millions of deliveries on campuses and in cities, and restaurant robots from companies such as Pudu and Bear Robotics are common in Asia and increasingly elsewhere.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Robots serving people in public and commercial spaces |\n| Examples | Food runners, floor cleaners, sidewalk delivery, guides |\n| Requirements | Safe navigation around people, simple UX, reliability |\n| Watch out for | Blocking accessibility routes; vandalism |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  KITCHEN[Kitchen loads tray] --> NAV[Robot navigates dining room]\n  NAV --> TABLE[Arrives at table + announces]\n  TABLE --> CONFIRM[Guest takes food + confirms]\n  CONFIRM --> RETURN[Returns to kitchen]\n  NAV -->|person in path| YIELD[Slow, yield, reroute]\n```\n\n### Worked example\n\n| Service robot metric | Target |\n|---|---|\n| Deliveries per hour | Matches staff workflow |\n| Collisions with people | Zero |\n| Staff interventions per shift | Minimal |\n| Battery covering a full service period | Yes, with opportunity charging |"}, {"id": 171, "title": "Robot safety fundamentals", "tldr": "Robot safety starts with risk assessment: identify hazards (crushing, impact, falling objects, electrical, software errors), estimate risk, reduce it by design first, then safeguards, then information and training, and verify the result.", "real": "ISO 12100 defines the general machinery risk assessment and risk reduction process, and the first known robot-related fatality occurred in 1979 at a Ford plant in Michigan, underscoring why guarding and safe design matter.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Systematic hazard reduction for robots |\n| Hierarchy | Inherently safe design → safeguards → warnings/training |\n| Hazards | Collision, pinching, dropped loads, falls, unexpected motion |\n| Watch out for | Relying on AI behavior instead of engineered safeguards |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  IDENTIFY[Identify hazards] --> ESTIMATE[Estimate risk: severity × probability]\n  ESTIMATE --> REDUCE[Reduce: design → safeguards → information]\n  REDUCE --> VERIFY[Verify + validate]\n  VERIFY --> ACCEPT{Residual risk acceptable?}\n  ACCEPT -->|no| REDUCE\n  ACCEPT -->|yes| DOCUMENT[Document + monitor]\n```\n\n### Worked example\n\n| Hazard | Design measure | Safeguard |\n|---|---|---|\n| Arm hits person | Lower mass and speed | Speed and separation monitoring |\n| Gripper pinches fingers | Limit grip force | Force sensing + stop |\n| Humanoid falls on person | Exclusion zones during testing | Fall detection + controlled falls |\n| Software sends wrong command | Independent limit checks | Safety-rated controller |"}, {"id": 172, "title": "Functional safety", "tldr": "Functional safety ensures safety functions (emergency stop, speed limiting, zone monitoring) work correctly even when components fail. Standards define required reliability levels and development processes for safety-related control systems.", "real": "IEC 61508 is the umbrella functional safety standard, ISO 13849 defines Performance Levels (PL a–e) for machinery safety functions, and IEC 62061 uses Safety Integrity Levels (SIL) for machinery control systems.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Reliability of safety functions under faults |\n| Standards | IEC 61508, ISO 13849 (PL), IEC 62061 (SIL) |\n| Techniques | Redundancy, diagnostics, safe torque off, certified components |\n| Watch out for | Running safety functions on the same unverified computer as the AI |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  AI[AI / main controller] --> MOTORS[Motor drives]\n  SAFETYPLC[Certified safety controller] -->|safe torque off| MOTORS\n  SCANNER[Safety laser scanner] --> SAFETYPLC\n  ESTOP[Emergency stop] --> SAFETYPLC\n  ENCODERS[Redundant position monitoring] --> SAFETYPLC\n```\n\n### Worked example\n\n| Safety function | Typical implementation |\n|---|---|\n| Emergency stop | Hardwired, Category 0 or 1 stop |\n| Safe torque off | Drive-level certified function |\n| Speed limit near people | Safety-rated speed monitoring |\n| Zone monitoring | Certified safety laser scanner |"}, {"id": 173, "title": "Industrial and collaborative robot standards", "tldr": "ISO 10218 sets safety requirements for industrial robots and robot systems; ISO/TS 15066 details collaborative operation, including four modes: safety-rated monitored stop, hand guiding, speed and separation monitoring, and power and force limiting.", "real": "ISO 10218 was revised in 2025 (parts 1 and 2), updating requirements for industrial robots and integrating guidance for collaborative applications that previously sat largely in ISO/TS 15066 (2016).", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Standards for robots in industry |\n| Collaborative modes | Monitored stop, hand guiding, speed & separation, power & force limiting |\n| Requirement | Application-level risk assessment, not just a “safe robot” |\n| Watch out for | Calling a cobot safe while it carries a knife or heavy part |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  COLLAB[Collaborative operation] --> SRMS[Safety-rated monitored stop]\n  COLLAB --> HG[Hand guiding]\n  COLLAB --> SSM[Speed and separation monitoring]\n  COLLAB --> PFL[Power and force limiting]\n```\n\n### Worked example\n\nSimplified speed and separation monitoring (illustrative values):\n\n```text\nProtective separation ≈ human approach + robot reaction + robot stopping + margins\nHuman approach: 1.6 m/s × (reaction 0.1 s + stopping 0.3 s) = 0.64 m\nRobot travel during reaction: 1.0 m/s × 0.1 s = 0.10 m; robot stopping distance: 0.15 m\nMargins (intrusion + position uncertainty): 0.20 m\nRequired separation ≈ 0.64 + 0.10 + 0.15 + 0.20 = 1.09 m\n```"}, {"id": 174, "title": "Mobile, service and humanoid robot standards", "tldr": "Different standards cover different robots: ISO 3691-4 for driverless industrial trucks and AMRs, ISO 13482 for personal care robots, and emerging standards for dynamically stable robots such as humanoids, which pose new hazards like falling.", "real": "ISO 3691-4 (2020) covers driverless industrial trucks, ISO 13482 (2014) covers personal care robots, and ISO 25785-1 was being developed for dynamically stable industrial mobile robots such as legged and humanoid robots.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Standards beyond fixed industrial arms |\n| AMRs | ISO 3691-4 |\n| Personal care | ISO 13482 |\n| Humanoids | Emerging standards for dynamically stable robots |\n| Watch out for | Deploying humanoids among workers before applicable safety cases exist |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  ROBOT{Robot type} -->|fixed industrial arm| ISO10218[ISO 10218]\n  ROBOT -->|AMR / driverless truck| ISO3691[ISO 3691-4]\n  ROBOT -->|personal care / service| ISO13482[ISO 13482]\n  ROBOT -->|legged / humanoid industrial| ISO25785[ISO 25785-1 in development]\n```\n\n### Worked example\n\n| Humanoid-specific hazard | Mitigation |\n|---|---|\n| Fall onto worker | Separation zones, controlled fall, fall prediction |\n| Dropped payload | Grip monitoring, payload limits |\n| Unexpected arm motion | Speed limits near people |\n| Power loss during stance | Safe crouch / brake behavior |"}, {"id": 175, "title": "Safety of AI-driven robots", "tldr": "Learned policies and foundation models can behave unpredictably outside training data, misinterpret instructions or be manipulated. Embodied AI safety combines semantic safety (refusing dangerous requests), physical safety envelopes, uncertainty awareness and independent safety layers.", "real": "Google DeepMind released the ASIMOV benchmark with Gemini Robotics in 2025 to evaluate semantic safety in robot instructions, and described Gemini Robotics ER 2 (2026) as its safest model on safety instruction following and human proximity benchmarks.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Keeping AI-controlled robots safe |\n| Semantic safety | Understand that “put the pan on the person” is unsafe |\n| Physical safety | Hard limits on force, speed, workspace, enforced outside the model |\n| Watch out for | Assuming a capable model is a safe model |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INSTR[Instruction] --> SEMANTIC[Semantic safety check]\n  SEMANTIC -->|unsafe| REFUSE[Refuse + explain]\n  SEMANTIC -->|ok| MODEL[VLA policy]\n  MODEL --> ENVELOPE[Physical safety envelope]\n  ENVELOPE --> ROBOT[Robot]\n  ENVELOPE -->|violation| STOP[Stop]\n```\n\n### Worked example\n\n| Layer | Example rule |\n|---|---|\n| Semantic | Refuse tasks involving harm to people or animals |\n| Workspace | Never move tool tip outside the table area |\n| Force | Stop if contact force > 50 N |\n| Proximity | Slow to 0.25 m/s when a person is within 1 m |"}, {"id": 176, "title": "Robot cybersecurity", "tldr": "Connected robots can be hacked to steal data, spy through cameras or cause physical harm. Secure robots with encrypted and authenticated communication, signed software updates, network segmentation, minimal open services, vulnerability management and secure remote access.", "real": "Security researchers disclosed Bluetooth-based vulnerabilities in several Unitree robot models in 2025, and ROS 2 offers SROS2 tooling for DDS security (authentication, encryption and access control).", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Protecting robots from cyberattacks |\n| Controls | Secure boot, signed OTA updates, encrypted comms, least privilege |\n| ROS 2 | SROS2 / DDS Security |\n| Watch out for | Default passwords and open debug ports on shipped robots |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CLOUD[Fleet cloud] -->|signed updates over TLS| ROBOT[Robot]\n  ROBOT --> SEGMENT[Segmented network]\n  OPERATOR[Remote operator] -->|MFA + audited session| ROBOT\n  ROBOT --> MONITOR[Security monitoring]\n```\n\n### Worked example\n\n| Threat | Control |\n|---|---|\n| Malicious firmware update | Code signing + secure boot |\n| Camera feed interception | Encrypted streams |\n| Unauthorized remote control | Strong authentication, session logging |\n| Lateral movement from robot to factory network | Network segmentation |"}, {"id": 177, "title": "Regulation of physical AI", "tldr": "Physical AI is shaped by machinery regulation, product liability, vehicle regulation, aviation rules, medical device law, privacy law and AI-specific regulation. In the EU, the new Machinery Regulation and the AI Act both apply to AI-enabled machines.", "real": "The EU Machinery Regulation (EU) 2023/1230 applies from January 2027, replacing the Machinery Directive, and the EU AI Act treats AI used as safety components of regulated products such as machinery as high-risk.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Legal frameworks for AI-powered machines |\n| EU | Machinery Regulation 2023/1230, AI Act, product liability rules |\n| Vehicles | National/state AV permits and federal motor vehicle standards (US) |\n| Watch out for | Multiple overlapping regimes for one product |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  PRODUCT[AI-powered robot product] --> MACH[Machinery safety rules]\n  PRODUCT --> AIACT[AI regulation]\n  PRODUCT --> PRIVACY[Privacy law: cameras, microphones]\n  PRODUCT --> SECTOR[Sector rules: vehicles, medical, aviation]\n  PRODUCT --> LIABILITY[Product liability]\n```\n\n### Worked example\n\n| Product | Main regulatory considerations |\n|---|---|\n| Warehouse AMR (EU) | Machinery Regulation, ISO 3691-4, workplace safety |\n| Home robot with cameras | Consumer product safety, privacy law |\n| Robotaxi (US) | State permits, federal vehicle standards and reporting |\n| Surgical robot | Medical device regulation (FDA, EU MDR) |\n\n(General overview, not legal advice.)"}, {"id": 178, "title": "Learning from incidents", "tldr": "Incidents in robotics and autonomous vehicles reveal recurring causes: perception limitations, inadequate safety drivers or monitoring, software assumptions, poor post-incident behavior and weak safety culture. Structured investigation and sharing lessons improve the whole field.", "real": "The US National Transportation Safety Board’s investigation of the 2018 Uber test vehicle fatality cited inadequate safety culture and safety driver monitoring, and the 2023 Cruise incident led to permit suspension and penalties for incomplete reporting.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Systematic learning from failures |\n| Common causes | Perception gaps, automation complacency, design assumptions, culture |\n| Practices | Blameless investigation, root cause analysis, fleet-wide fixes, disclosure |\n| Watch out for | Blaming individuals instead of fixing systems |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EVENT[Incident or near miss] --> SECURE[Secure data + logs]\n  SECURE --> ANALYZE[Root cause analysis]\n  ANALYZE --> FIX[System fixes: software, hardware, process]\n  FIX --> TEST[Regression scenarios]\n  TEST --> SHARE[Report + share lessons]\n```\n\n### Worked example\n\n| Incident lesson | System-level fix |\n|---|---|\n| Safety driver distracted | Driver monitoring + limits on shift length |\n| Object misclassified repeatedly | Track uncertainty; treat unknown objects conservatively |\n| Robot behavior after collision unsafe | Explicit post-collision safe-stop logic |\n| Incomplete regulator reporting | Clear disclosure policies |"}, {"id": 179, "title": "Ethics and societal impact", "tldr": "Physical AI raises ethical questions about jobs and wages, safety and accountability, surveillance, autonomous weapons, accessibility and who benefits. Responsible development includes worker involvement, transparency about autonomy and teleoperation, privacy protection and fair deployment.", "real": "Acemoglu and Restrepo’s 2020 study of US labor markets estimated that one additional robot per thousand workers reduced the employment-to-population ratio by about 0.2 percentage points and wages by about 0.42%, highlighting distributional effects.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Broader human impacts of robots |\n| Issues | Labor displacement, surveillance, safety, accountability, military use |\n| Practices | Worker engagement, retraining, transparency, privacy by design |\n| Watch out for | Hiding remote human operators behind “autonomous” claims |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  DEPLOY[Robot deployment] --> WORKERS[Workers: roles, skills, safety]\n  DEPLOY --> USERS[Users: privacy, trust]\n  DEPLOY --> PUBLIC[Public: shared spaces, accessibility]\n  DEPLOY --> ACCOUNT[Accountability for harm]\n```\n\n### Worked example\n\n| Practice | Example |\n|---|---|\n| Transparency | Disclose when a home robot is teleoperated |\n| Worker involvement | Co-design tasks with floor staff |\n| Retraining | Upskill operators to robot technicians |\n| Accessibility | Sidewalk robots yield to wheelchairs |"}, {"id": 180, "title": "Human–robot interaction", "tldr": "People must understand what robots are doing and intend to do. Good HRI uses legible motion, clear signals (lights, sounds, screens, speech), predictable behavior, appropriate trust calibration and easy ways to stop or redirect the robot.", "real": "Research on “legible motion” (Dragan and colleagues, 2013) showed that robots moving in ways that make their goals clear help people collaborate more effectively.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Designing how robots and people interact |\n| Signals | Lights, sounds, screens, speech, projected paths |\n| Principles | Predictability, legibility, controllability, trust calibration |\n| Watch out for | Anthropomorphic designs creating unrealistic expectations |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INTENT[Robot intent] --> SIGNAL[Signal: light, sound, motion]\n  SIGNAL --> HUMAN[Human understands]\n  HUMAN --> RESPOND[Human adjusts or commands]\n  RESPOND --> ROBOT[Robot adapts]\n  HUMAN --> STOP[Easy stop / pause]\n```\n\n### Worked example\n\n| Situation | HRI design |\n|---|---|\n| AMR about to turn | Turn signal lights + projected path on floor |\n| Robot uncertain | Says “I’m not sure which box; please point” |\n| Robot paused for safety | Amber light + reason on screen |\n| Human wants to stop it | Large stop button + voice command |"}, {"id": 181, "title": "Systems engineering for robots", "tldr": "Robots integrate mechanics, electronics, software, AI and operations, so they need systems engineering: clear requirements, interfaces, budgets (mass, power, compute, latency), traceability from requirements to tests, and design reviews.", "real": "The V-model of systems engineering, used in automotive and aerospace and referenced by functional safety standards such as ISO 26262, links each requirement level to a corresponding verification level.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Disciplined integration of a complex system |\n| Artifacts | Requirements, architecture, interface specs, budgets, test plans |\n| Budgets | Mass, power, compute, latency, cost |\n| Watch out for | AI teams and hardware teams optimizing separately |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REQ[System requirements] --> ARCH[Architecture]\n  ARCH --> SUB[Subsystem design]\n  SUB --> BUILD[Build]\n  BUILD --> SUBTEST[Subsystem tests]\n  SUBTEST --> INTTEST[Integration tests]\n  INTTEST --> SYSTEST[System validation vs requirements]\n```\n\n### Worked example\n\n| Budget | Allocation (mobile manipulator example) |\n|---|---|\n| Power (average) | Base 150 W, arm 120 W, compute 90 W, sensors 30 W = 390 W |\n| Latency (perception → action) | Camera 33 ms + inference 40 ms + control 5 ms = 78 ms (target < 100 ms) |\n| Mass | Battery 18 kg of 120 kg total |"}, {"id": 182, "title": "Testing physical AI systems", "tldr": "Testing spans unit tests, simulation tests, hardware-in-the-loop (HIL), lab tests with real robots, field pilots and continuous monitoring. Learned components need statistical evaluation across many conditions, not just pass/fail unit tests.", "real": "Autonomous vehicle developers combine simulation, closed-course testing and public-road testing, and robotics companies increasingly run nightly simulation regression suites for every software change.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Verification across levels |\n| Levels | Unit → simulation → HIL → lab → field |\n| Learned policies | Success rates over scenario distributions |\n| Watch out for | Changes that pass sim but regress on real hardware |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  UNIT[Unit tests: kinematics, parsers] --> SIMT[Simulation scenario suites]\n  SIMT --> HIL[Hardware-in-the-loop: real computer, simulated world]\n  HIL --> LAB[Lab tests on real robots]\n  LAB --> FIELD[Field pilots]\n  FIELD --> MONITOR[Production monitoring]\n```\n\n### Worked example\n\n| Test level | Example check |\n|---|---|\n| Unit | IK returns joint angles within limits |\n| Simulation | 500 pick scenarios, success ≥ 95% |\n| HIL | Control loop meets 1 ms deadline under load |\n| Lab | 200 real picks across 20 objects |\n| Field | 2-week pilot, interventions per hour tracked |"}, {"id": 183, "title": "Metrics that matter in deployment", "tldr": "Deployed robots are judged by task success, throughput, uptime/availability, mean time between failures and interventions, mean time to recovery, safety events and cost per task. These connect engineering performance to business value.", "real": "Physical Intelligence’s partners reported metrics such as autonomy as a percentage of total time and interventions per task when evaluating π0.6 deployments in 2026.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | KPIs for robots in production |\n| Performance | Success rate, cycle time, throughput |\n| Reliability | MTBF, MTBI (interventions), MTTR, availability |\n| Business | Cost per task, ROI, customer satisfaction |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  OPS[Operations data] --> PERF[Performance: success, throughput]\n  OPS --> REL[Reliability: MTBF, MTTR]\n  OPS --> SAFE[Safety events]\n  PERF --> BIZ[Cost per task + ROI]\n  REL --> BIZ\n```\n\n### Worked example\n\n```text\nAvailability = MTBF / (MTBF + MTTR)\nMTBF = 40 h between failures, MTTR = 0.5 h → availability = 40 / 40.5 ≈ 98.8%\nInterventions: 6 per 8-hour shift → mean time between interventions ≈ 80 minutes\n```"}, {"id": 184, "title": "Fleet operations and updates", "tldr": "Operating many robots requires fleet management: monitoring health, dispatching tasks, scheduling charging, managing maps and configurations, rolling out software and model updates in stages, and responding to incidents.", "real": "Robotaxi operators such as Waymo run fleet operations centers with remote assistance, depots for charging and cleaning, and staged software releases across their fleets.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Running robots at scale |\n| Functions | Monitoring, dispatch, charging, maps, updates, incident response |\n| Updates | Canary robots → small cohort → full fleet, with rollback |\n| Watch out for | Pushing a model update to all robots at once |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BUILD[New software / model] --> SIMGATE[Simulation gate]\n  SIMGATE --> CANARY[Canary: 2% of fleet]\n  CANARY --> MONITOR[Monitor KPIs 48 h]\n  MONITOR -->|regression| ROLLBACK[Rollback]\n  MONITOR -->|healthy| WIDER[25% → 100%]\n```\n\n### Worked example\n\n| Rollout stage | Fleet share | Gate |\n|---|---|---|\n| Canary | 2% | No safety events; interventions ≤ baseline |\n| Early | 25% | Throughput within 2% of baseline |\n| Full | 100% | Stable for one week |"}, {"id": 185, "title": "Remote assistance and teleoperation in production", "tldr": "Many deployed robots rely on remote humans for edge cases: approving actions, resolving confusion, or teleoperating briefly. Remote assistance improves reliability and gathers learning data, but must be secure, low-latency where needed and transparent to customers.", "real": "Robotaxi companies use remote assistance agents who provide guidance (not direct driving) in unusual situations, and home robot companies such as 1X disclosed that remote operators may help with tasks the robot can’t yet do autonomously.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Humans supporting robots from afar |\n| Modes | Guidance (choose a path), approval, full teleoperation |\n| Metrics | Assists per robot-hour, response time, operator-to-robot ratio |\n| Watch out for | Undisclosed teleoperation presented as autonomy |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ROBOT[Robot uncertain] --> REQUEST[Request assistance]\n  REQUEST --> OPERATOR[Remote operator]\n  OPERATOR --> GUIDANCE[Guidance / approval / teleop]\n  GUIDANCE --> ROBOT\n  GUIDANCE --> DATA[Logged for training]\n```\n\n### Worked example\n\n```text\nFleet of 100 robots, 0.5 assists per robot-hour, 2 minutes per assist\nAssist workload = 100 × 0.5 × 2 = 100 operator-minutes per hour → ~1.7 operators busy\nWith 70% target utilization → ~2.4 → staff 3 operators per shift\n```"}, {"id": 186, "title": "Robot economics", "tldr": "Robots must beat alternatives on total cost: purchase or lease, integration, maintenance, energy, software, supervision and downtime versus labor costs, throughput and quality gains. Robots-as-a-service (RaaS) shifts costs to an hourly or monthly fee.", "real": "Agility Robotics deployed Digit at GXO under a multi-year robots-as-a-service agreement in 2024, and Tesla has stated a long-term target cost of around $20,000 per Optimus robot at scale.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Cost-benefit analysis for robots |\n| Costs | Hardware, integration, maintenance, software, supervision, downtime |\n| Benefits | Labor savings, throughput, quality, safety, 24/7 operation |\n| Watch out for | Ignoring integration and exception-handling costs |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CAPEX[Purchase + integration] --> TCO[Total cost of ownership]\n  OPEX[Maintenance, energy, software, supervision] --> TCO\n  BENEFITS[Labor + throughput + quality value] --> NET[Net benefit]\n  TCO --> NET\n  NET --> PAYBACK[Payback period]\n```\n\n### Worked example\n\n```text\nRobot: ₹40 lakh purchase + ₹10 lakh integration; ₹6 lakh/year maintenance + software\nReplaces 1.5 operators per shift at ₹5 lakh per operator-year → ₹7.5 lakh per shift per year\nRunning 2 shifts/day: saves ₹15 lakh/year\nNet annual saving = 15 − 6 = ₹9 lakh → payback ≈ 50 / 9 ≈ 5.6 years (too long for many buyers)\nAt 3 shifts/day with 24/7 operation: saves ₹22.5 lakh → net 16.5 → payback ≈ 3.0 years\n```"}, {"id": 187, "title": "Reliability and maintenance", "tldr": "Robots wear: gearboxes, cables, batteries, grippers, sensors and fingertips degrade. Design for reliability (derating, robust connectors), monitor health (motor temperature, current signatures), plan preventive maintenance and stock spare parts.", "real": "Industrial robots from major manufacturers are known for tens of thousands of hours of mean time between failures, while new humanoids and dexterous hands are still maturing in durability, a key barrier to commercial deployment.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Keeping robots working over years |\n| Practices | Derating, health monitoring, predictive maintenance, modular replacement |\n| Wear items | Gearboxes, cables, batteries, gripper pads, fingers |\n| Watch out for | Cable fatigue in continuously flexing joints |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SENSORS[Motor current, temperature, vibration] --> HEALTH[Health model]\n  HEALTH --> PREDICT{Degradation trend?}\n  PREDICT -->|yes| SCHEDULE[Schedule maintenance]\n  PREDICT -->|no| CONTINUE[Continue operation]\n  SCHEDULE --> SWAP[Swap module + root cause]\n```\n\n### Worked example\n\n| Health signal | Possible issue |\n|---|---|\n| Rising motor current for same motion | Gearbox wear or friction |\n| Higher joint temperature | Overload or cooling issue |\n| Increasing tracking error | Backlash or encoder problem |\n| Battery capacity < 80% of rated | Replace battery |"}, {"id": 188, "title": "Scaling robot manufacturing", "tldr": "Moving from prototypes to thousands of robots requires design for manufacturing, supply chains for actuators and sensors, quality control, calibration at scale, and cost reduction. Many robotics companies underestimate this transition.", "real": "Tesla told investors that Optimus has over 10,000 unique parts on an entirely new production line, and Boston Dynamics announced plans for a facility capable of producing 30,000 Atlas robots annually.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Producing robots in volume |\n| Challenges | Actuator supply, part count, calibration, quality, cost |\n| Practices | Design for manufacturing, modular subsystems, automated test stations |\n| Watch out for | Prototype parts that can’t be produced at scale |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PROTO[Prototype] --> DFM[Design for manufacturing]\n  DFM --> PILOT[Pilot production line]\n  PILOT --> QA[End-of-line test + calibration]\n  QA --> RAMP[Volume ramp]\n  RAMP --> COST[Cost-down iterations]\n```\n\n### Worked example\n\n| Scale | Typical focus |\n|---|---|\n| 1–10 robots | Functionality, research |\n| 10–100 | Reliability, service processes |\n| 100–1,000 | Supply chain, calibration automation |\n| 10,000+ | Cost per unit, factory automation |"}, {"id": 189, "title": "Business models in physical AI", "tldr": "Physical AI companies sell hardware, lease robots (RaaS), license software or models, sell outcomes (per pick, per mile) or operate services themselves (robotaxis). The model shapes incentives, cash needs and customer relationships.", "real": "Physical Intelligence focuses on licensing foundation models to partners rather than building hardware, while Waymo operates its own ride-hailing service and charges per trip.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How physical AI companies make money |\n| Models | Hardware sales, RaaS, software/model licensing, per-outcome, operated service |\n| Trade-offs | Capital intensity, margins, customer risk |\n| Watch out for | Hardware margins that can’t cover support costs |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  MODELS[Business models] --> HW[Sell robots]\n  MODELS --> RAAS[Robots as a service: monthly fee]\n  MODELS --> LICENSE[License models / software]\n  MODELS --> OUTCOME[Pay per pick / delivery / mile]\n  MODELS --> SERVICE[Operate service: robotaxi]\n```\n\n### Worked example\n\n| Model | Customer benefit | Vendor risk |\n|---|---|---|\n| Hardware sale | Ownership | Customer bears utilization risk |\n| RaaS | Low upfront cost | Vendor carries capital and maintenance |\n| Per outcome | Pays only for results | Vendor carries performance risk |\n| Model licensing | Flexible hardware choice | Depends on partners’ success |"}, {"id": 190, "title": "Building physical AI teams", "tldr": "Physical AI teams combine mechanical, electrical and controls engineers, robotics software engineers, ML researchers, data operations, test and field engineers, safety specialists and product people. Tight feedback between hardware, data and models is a key advantage.", "real": "Leading robot learning companies employ large data collection and robot operations teams alongside researchers, because data quality and hardware uptime directly limit model progress.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Organizing people to build robots |\n| Core roles | Hardware, controls, robotics software, ML, data ops, test, safety, product |\n| Practices | Shared lab time, common metrics, fast hardware iteration |\n| Watch out for | ML teams without hardware access; hardware teams without ML input |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  HW[Hardware team] <--> SW[Robotics software]\n  SW <--> ML[ML / models]\n  ML <--> DATA[Data operations]\n  DATA <--> FIELD[Field + test]\n  FIELD <--> HW\n  SAFETY[Safety] -.-> HW\n  SAFETY -.-> ML\n```\n\n### Worked example\n\n| Early-stage team of 12 | Roles |\n|---|---|\n| 3 | Mechanical/electrical engineers |\n| 2 | Controls + robotics software |\n| 3 | ML engineers / researchers |\n| 2 | Data collection + robot operations |\n| 1 | Test + safety |\n| 1 | Product / customer |"}, {"id": 191, "title": "Project 1: reaching with a simulated arm", "tldr": "Build a two-link planar arm in MuJoCo, compute inverse kinematics for a target point, and drive the joints there with PD control, checking the final end-effector position against forward kinematics. This connects kinematics, control and simulation.", "real": "Simple simulated arms are the standard first exercise in robotics courses because they expose every core concept (frames, IK, control gains, timesteps) without hardware risk.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Move the arm tip to (0.45, 0.30) m accurately |\n| Concepts | MJCF, IK (chapter 82), PD control, simulation stepping |\n| Success | Final tip error < 5 mm |\n| Extension | Add a trajectory, gravity in the plane, obstacles |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TARGET[Target point] --> IK[Analytic IK]\n  IK --> QREF[Joint targets]\n  QREF --> PD[PD torques]\n  PD --> SIM[MuJoCo step]\n  SIM --> STATE[Joint angles]\n  STATE --> PD\n  STATE --> FK[Measure tip position]\n```\n\n### Worked example\n\n```python\nimport mujoco\nimport numpy as np\n\nXML = \"\"\"\n<mujoco>\n  <option timestep=\"0.002\" gravity=\"0 0 0\"/>\n  <worldbody>\n    <body name=\"l1\">\n      <joint name=\"j1\" type=\"hinge\" axis=\"0 0 1\" damping=\"0.1\"/>\n      <geom type=\"capsule\" fromto=\"0 0 0 0.4 0 0\" size=\"0.02\" mass=\"1\"/>\n      <body name=\"l2\" pos=\"0.4 0 0\">\n        <joint name=\"j2\" type=\"hinge\" axis=\"0 0 1\" damping=\"0.1\"/>\n        <geom type=\"capsule\" fromto=\"0 0 0 0.3 0 0\" size=\"0.02\" mass=\"0.5\"/>\n        <site name=\"tip\" pos=\"0.3 0 0\"/>\n      <\/body>\n    <\/body>\n  <\/worldbody>\n  <actuator>\n    <motor joint=\"j1\" ctrlrange=\"-20 20\"/>\n    <motor joint=\"j2\" ctrlrange=\"-20 20\"/>\n  <\/actuator>\n<\/mujoco>\n\"\"\"\n\ndef ik(x, y, l1=0.4, l2=0.3):\n    c2 = (x**2 + y**2 - l1**2 - l2**2) / (2 * l1 * l2)\n    q2 = np.arctan2(np.sqrt(1 - c2**2), c2)\n    q1 = np.arctan2(y, x) - np.arctan2(l2 * np.sin(q2), l1 + l2 * np.cos(q2))\n    return np.array([q1, q2])\n\nmodel = mujoco.MjModel.from_xml_string(XML)\ndata = mujoco.MjData(model)\nq_ref = ik(0.45, 0.30)\nfor _ in range(3000):                                   # 6 seconds\n    data.ctrl[:] = 30.0 * (q_ref - data.qpos) - 3.0 * data.qvel\n    mujoco.mj_step(model, data)\ntip = data.site_xpos[model.site(\"tip\").id][:2]\nprint(tip.round(4), round(float(np.linalg.norm(tip - [0.45, 0.30])) * 1000, 2), \"mm error\")\n```"}, {"id": 192, "title": "Project 2: navigate a grid with A* and pure pursuit", "tldr": "Plan a path on an occupancy grid with A* (chapter 62), convert cells to waypoints, then simulate a differential-drive robot following them with pure pursuit (chapter 79), measuring path-tracking error and arrival accuracy.", "real": "This planner-plus-controller structure mirrors Nav2’s split between global planners and local controllers used on real mobile robots.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Reach the goal cell without leaving the planned corridor |\n| Concepts | A*, waypoints, pure pursuit, unicycle model |\n| Success | Arrive within 0.15 m of goal |\n| Extension | Add costmap inflation and dynamic obstacles |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  GRID[Occupancy grid] --> ASTAR[A* path]\n  ASTAR --> WAYPOINTS[Cell centers → waypoints]\n  WAYPOINTS --> PP[Pure pursuit controller]\n  PP --> ROBOT[Simulated unicycle]\n  ROBOT --> PP\n```\n\n### Worked example\n\n```python\nimport math\n\ndef follow(waypoints, v=0.4, lookahead=0.5, dt=0.05, max_steps=2000):\n    x, y, th = waypoints[0][0], waypoints[0][1], 0.0\n    idx = 0\n    for _ in range(max_steps):\n        while idx < len(waypoints) - 1 and math.dist((x, y), waypoints[idx]) < lookahead:\n            idx += 1\n        tx, ty = waypoints[idx]\n        dx, dy = tx - x, ty - y\n        local_y = -math.sin(th) * dx + math.cos(th) * dy\n        L2 = max(dx * dx + dy * dy, 1e-6)\n        omega = v * 2 * local_y / L2\n        x += v * math.cos(th) * dt\n        y += v * math.sin(th) * dt\n        th += omega * dt\n        if idx == len(waypoints) - 1 and math.dist((x, y), waypoints[-1]) < 0.15:\n            return round(x, 2), round(y, 2), \"arrived\"\n    return round(x, 2), round(y, 2), \"timeout\"\n\npath_cells = [(0, 0), (0, 1), (0, 2), (1, 2), (2, 2), (2, 3), (3, 3)]   # from the A* example\nwaypoints = [(c * 1.0, r * 1.0) for r, c in path_cells]                 # 1 m cells: (x = col, y = row)\nprint(follow(waypoints))\n```"}, {"id": 193, "title": "Project 3: EKF localization with landmarks", "tldr": "Simulate a robot driving among known landmarks, measuring noisy range and bearing, and implement an EKF that fuses odometry with these measurements. Compare the EKF estimate with dead reckoning alone.", "real": "Landmark-based EKF localization is a classic exercise from Probabilistic Robotics and remains the conceptual basis for production sensor fusion stacks.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Keep position error small despite noisy odometry |\n| Concepts | EKF predict/update, Jacobians (chapter 53), angle wrapping |\n| Success | Final error well below dead reckoning error |\n| Extension | Unknown data association; add more landmarks |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ODOM[Noisy odometry] --> PRED[EKF predict]\n  PRED --> UPD[EKF update per landmark]\n  MEAS[Range + bearing] --> UPD\n  UPD --> EST[Estimate]\n  ODOM --> DR[Dead reckoning only]\n  EST --> COMPARE[Compare errors]\n  DR --> COMPARE\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\nrng = np.random.default_rng(0)\nlandmarks = np.array([[5.0, 5.0], [-5.0, 5.0], [0.0, -5.0]])\nwrap = lambda a: (a + np.pi) % (2 * np.pi) - np.pi\ndt, v, w = 0.1, 1.0, 0.1\ntrue = np.zeros(3); dr = np.zeros(3); x = np.zeros(3); P = np.eye(3) * 0.01\nQ = np.diag([0.02, 0.02, 0.01]) ** 2; R = np.diag([0.2, 0.05]) ** 2\n\ndef move(s, v, w):\n    return s + np.array([v * dt * np.cos(s[2]), v * dt * np.sin(s[2]), w * dt])\n\nfor _ in range(600):\n    true = move(true, v, w)\n    vn, wn = v + rng.normal(0, 0.1), w + rng.normal(0, 0.05)         # noisy odometry\n    dr = move(dr, vn, wn)\n    F = np.array([[1, 0, -vn * dt * np.sin(x[2])], [0, 1, vn * dt * np.cos(x[2])], [0, 0, 1]])\n    x = move(x, vn, wn); P = F @ P @ F.T + Q\n    for lx, ly in landmarks:\n        dx, dy = lx - true[0], ly - true[1]\n        z = np.array([np.hypot(dx, dy), wrap(np.arctan2(dy, dx) - true[2])]) + rng.normal(0, [0.2, 0.05])\n        ex, ey = lx - x[0], ly - x[1]; q = ex**2 + ey**2; r = np.sqrt(q)\n        zhat = np.array([r, wrap(np.arctan2(ey, ex) - x[2])])\n        H = np.array([[-ex / r, -ey / r, 0], [ey / q, -ex / q, -1]])\n        K = P @ H.T @ np.linalg.inv(H @ P @ H.T + R)\n        innov = z - zhat; innov[1] = wrap(innov[1])\n        x = x + K @ innov; x[2] = wrap(x[2]); P = (np.eye(3) - K @ H) @ P\n\nerr = lambda s: np.hypot(*(s[:2] - true[:2]))\nprint(\"EKF error:\", round(err(x), 3), \"m | dead reckoning error:\", round(err(dr), 3), \"m\")\n```"}, {"id": 194, "title": "Project 4: imitation learning on a low-cost arm", "tldr": "Assemble a low-cost leader–follower arm pair (such as the SO-101), record about 50 demonstrations of a simple pick-and-place task, train an ACT policy, evaluate over 20+ trials and iterate on data where it fails.", "real": "Hugging Face’s LeRobot community has popularized exactly this workflow with SO-100/SO-101 arms, making hands-on robot learning accessible for a few hundred dollars of hardware plus a GPU.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Learned policy that picks a cube and places it in a bowl |\n| Hardware | Leader + follower arm, 1–2 USB cameras, GPU for training |\n| Data | \\~50 episodes, varied cube positions |\n| Success | ≥ 70% over 20 trials, then improve |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BUILD[Build + calibrate arms] --> RECORD[Record 50 demos]\n  RECORD --> TRAIN[Train ACT]\n  TRAIN --> EVAL[20 evaluation trials]\n  EVAL --> ANALYZE[Categorize failures]\n  ANALYZE --> MORE[Add targeted demos]\n  MORE --> TRAIN\n```\n\n### Worked example\n\n| Iteration | Change | Success (20 trials) |\n|---|---|---|\n| 1 | 50 demos, one camera | 11/20 |\n| 2 | +20 demos with cube near edges | 14/20 |\n| 3 | Added wrist camera | 17/20 |\n| 4 | Lighting variation in demos | 18/20 |\n\n(Illustrative progression; follow the current LeRobot documentation for exact commands.)"}, {"id": 195, "title": "Project 5: train a control policy with RL in simulation", "tldr": "Train a PPO policy on a MuJoCo-based Gymnasium task, study the effect of reward and hyperparameters, then add domain randomization and test robustness to changed physics, practicing the full RL workflow before attempting real robots.", "real": "Gymnasium (the maintained successor to OpenAI Gym) includes MuJoCo environments such as Hopper and HalfCheetah, widely used to teach and benchmark continuous-control RL.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Learn to hop forward stably |\n| Tools | Gymnasium MuJoCo env, Stable-Baselines3 PPO |\n| Experiments | Reward weights, learning rate, randomized mass/friction |\n| Success | Steady forward progress across randomized physics |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ENV[Hopper env] --> PPO[PPO training]\n  PPO --> POLICY[Policy]\n  POLICY --> TEST[Test: nominal + perturbed physics]\n  TEST --> ANALYZE[Analyze failures]\n  ANALYZE --> RANDOMIZE[Add randomization]\n  RANDOMIZE --> PPO\n```\n\n### Worked example\n\n```python\nimport gymnasium as gym\nfrom stable_baselines3 import PPO\nfrom stable_baselines3.common.evaluation import evaluate_policy\n\nenv = gym.make(\"Hopper-v5\")\nmodel = PPO(\"MlpPolicy\", env, learning_rate=3e-4, n_steps=2048, batch_size=64, verbose=0)\nmodel.learn(total_timesteps=1_000_000)\nmean_reward, std_reward = evaluate_policy(model, gym.make(\"Hopper-v5\"), n_eval_episodes=10)\nprint(round(mean_reward, 1), round(std_reward, 1))\n```"}, {"id": 196, "title": "Project 6: fine-tune a robot foundation model", "tldr": "Take an open VLA (such as π0 via openpi, OpenVLA, SmolVLA or GR00T), convert your demonstrations to its format, fine-tune on your task, compare against training a small policy from scratch, and measure generalization to new objects and instructions.", "real": "Open releases from Physical Intelligence (openpi), Hugging Face (SmolVLA) and NVIDIA (GR00T N1.x) include fine-tuning instructions, enabling teams to adapt foundation models to their own robots.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Measure what pretraining buys you |\n| Comparison | Fine-tuned VLA vs ACT trained from scratch on the same data |\n| Tests | Seen objects, unseen objects, paraphrased instructions |\n| Watch out for | Action normalization mismatches and wrong camera ordering |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DATA[Your demonstrations] --> CONVERT[Convert to model format]\n  CONVERT --> FT[Fine-tune VLA]\n  DATA --> SCRATCH[Train ACT from scratch]\n  FT --> EVAL[Same evaluation protocol]\n  SCRATCH --> EVAL\n  EVAL --> COMPARE[Seen vs unseen generalization]\n```\n\n### Worked example\n\n| Evaluation split | ACT from scratch | Fine-tuned VLA |\n|---|---|---|\n| Seen objects | 85% | 88% |\n| Unseen objects | 30% | 65% |\n| Paraphrased instructions | n/a (no language) | 80% |\n\n(Illustrative of the typical pattern: pretraining helps most on generalization.)"}, {"id": 197, "title": "Project 7: perception-to-grasp pipeline", "tldr": "Build a pipeline that finds an object named in text, segments it, lifts it to 3D using depth and camera intrinsics, estimates a grasp center and orientation from the object’s points, and transforms the grasp into the robot frame.", "real": "Modular pipelines combining open-vocabulary detection, segmentation and depth remain common in deployed systems because each stage can be inspected, tested and replaced independently.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Text query → grasp pose in robot base frame |\n| Stages | Detect → segment → back-project → principal axis → transform |\n| Tools | Open-vocab detector, segmenter, depth camera, hand–eye calibration |\n| Success | Grasp position error < 1 cm on test objects |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  QUERY[Text: the blue marker] --> DET[Detect + segment]\n  RGBD[RGB-D frame] --> DET\n  DET --> PTS[Back-project masked pixels to 3D]\n  PTS --> PCA[Center + principal axis]\n  PCA --> GRASP[Grasp across the short axis]\n  GRASP --> TF[Camera → base transform]\n  TF --> ROBOT[Send grasp to motion planner]\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\nK = np.array([[600.0, 0, 320.0], [0, 600.0, 240.0], [0, 0, 1]])\n# Simulated mask pixels of an elongated object lying diagonally, at 0.6 m depth\nus = np.arange(280, 361); vs = 200 + 0.5 * (us - 280)\ndepth = 0.6\npts = (np.linalg.inv(K) @ np.vstack([us, vs, np.ones_like(us)])).T * depth   # camera frame\n\ncenter = pts.mean(axis=0)\n_, _, Vt = np.linalg.svd(pts - center)\nlong_axis = Vt[0]\nyaw = np.degrees(np.arctan2(long_axis[1], long_axis[0]))\nprint(center.round(3), round(yaw, 1))   # grasp at center, gripper closes across the ~26.6° long axis\n```"}, {"id": 198, "title": "Capstone: designing a physical AI product", "tldr": "Combine everything: define the task and environment, choose the form factor, sensors and compute, design the software and safety architecture, plan data collection and simulation, choose models, define metrics and evaluation, and plan deployment, operations and economics.", "real": "Successful physical AI products, from warehouse robots to robotaxis, combine careful scoping of the operational domain with layered safety and continuous data-driven improvement.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| Goal | End-to-end design for a tote-handling mobile manipulator |\n| Decisions | Form factor, sensors, compute, models, safety, data, operations |\n| Deliverables | Architecture, safety case outline, data plan, KPI targets, business case |\n| Watch out for | Starting with the coolest hardware instead of the task |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  TASK[Task: move totes between shelves and conveyor] --> FORM[Form: wheeled base + 2 arms]\n  FORM --> SENSE[Sensors: RGB-D, LiDAR, F/T]\n  SENSE --> STACK[Stack: ROS 2, Nav2, VLA for picking, safety PLC]\n  STACK --> DATA[Data: teleop demos + sim + fleet logs]\n  DATA --> EVAL[Eval: sim suite + site acceptance tests]\n  EVAL --> OPS[Ops: fleet manager, remote assist, maintenance]\n  OPS --> BIZ[Business: RaaS per hour]\n```\n\n### Worked example\n\n| KPI | Target for pilot |\n|---|---|\n| Totes moved per hour | 60 |\n| Task success | ≥ 99% |\n| Interventions | ≤ 1 per 2 hours |\n| Availability | ≥ 97% |\n| Safety incidents | 0 |"}, {"id": 199, "title": "Careers and learning roadmap", "tldr": "Physical AI careers include robotics software, controls, perception, robot learning research, simulation, hardware, data operations, safety and field engineering. Learn foundations (math, programming, ROS 2), then specialize, building simulation and hardware projects along the way.", "real": "Open resources such as MIT’s Underactuated Robotics course notes, “Modern Robotics” (Lynch and Park), “Probabilistic Robotics”, the ROS 2 documentation, MuJoCo, Isaac Lab and LeRobot provide a complete free learning path.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| Roles | Robotics SWE, controls, perception, robot learning, sim, hardware, data ops, safety |\n| Foundations | Linear algebra, probability, Python/C++, ROS 2, Linux |\n| Portfolio | Sim projects + one real robot project with documented results |\n| Watch out for | Only watching videos; robotics is learned by building |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  S1[Math + Python + Linux] --> S2[Kinematics, control, estimation]\n  S2 --> S3[ROS 2 + simulation]\n  S3 --> S4[Perception + planning]\n  S4 --> S5[Robot learning: IL, RL, VLAs]\n  S5 --> S6[Real hardware projects]\n  S6 --> S7[Specialize]\n```\n\n### Worked example\n\n| Stage | Chapters | Project |\n|---|---|---|\n| Foundations | 11–20 | Transform and rotation exercises |\n| Classical robotics | 41–100 | Projects 1–3 |\n| Robot learning | 101–130 | Projects 4–6 |\n| Systems | 131–190 | Project 7 + capstone design |"}, {"id": 200, "title": "Glossary", "tldr": "A shared vocabulary for physical AI, covering the key terms used throughout this guide.", "real": "Robotics combines terminology from mechanical engineering, control theory, computer vision and machine learning, so precise shared terms help multidisciplinary teams avoid costly misunderstandings.", "body": "### Diagram\n\n```mermaid\nflowchart LR\n  BODY[Body: kinematics, actuators] --> SENSE[Sensing: perception, estimation]\n  SENSE --> DECIDE[Decision: planning, policies]\n  DECIDE --> SYSTEM[System: safety, deployment]\n```\n\n### Glossary\n\n| Term | Meaning |\n|---|---|\n| DOF | Degrees of freedom: independent ways a robot can move |\n| Forward / inverse kinematics | Joints → pose / pose → joints |\n| Jacobian | Maps joint velocities to end-effector velocities |\n| SLAM | Simultaneous localization and mapping |\n| Kalman filter / EKF | Recursive estimator / its nonlinear extension |\n| C-space | Configuration space of all robot configurations |\n| MPC | Model predictive control |\n| Impedance control | Controlling force–motion relationship like a spring-damper |\n| ZMP | Zero moment point, used for biped balance |\n| Behavior cloning | Supervised learning from demonstrations |\n| Action chunking | Predicting sequences of future actions |\n| VLA | Vision-language-action model |\n| Cross-embodiment | Training across different robot bodies |\n| Domain randomization | Varying simulation to improve real-world transfer |\n| Sim-to-real gap | Differences between simulation and reality |\n| World model | Learned model predicting future world states |\n| Teleoperation | Human remote control of a robot |\n| ODD | Operational design domain for autonomous vehicles |\n| Functional safety | Ensuring safety functions work despite faults |\n| RaaS | Robots as a service business model |"}];
const PARTS = ["Foundations of physical AI", "Math and physics foundations", "Robot hardware", "Compute and software stack", "Perception", "State estimation and SLAM", "Motion planning", "Control", "Manipulation", "Locomotion and mobility", "Robot learning foundations", "Modern imitation learning and policies", "Robot foundation models", "Simulation and world models", "Data for physical AI", "Autonomous vehicles", "Application domains", "Safety, standards and ethics", "Engineering and deployment", "Projects and mastery"];
const TOTAL = 200, PER = 10;
function idsOf(p){ const a = []; for (let i = (p-1)*PER + 1; i <= p*PER; i++) a.push(i); return a; }
const partOf = id => Math.ceil(id / PER);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "physical-ai-progress-v1";
const LS_LAST = "physical-ai-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try{ await dbRef.set({done:[...done].sort((a,b)=>a-b), updated:Date.now()}); }
  catch(e){ if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; pushRemote(); }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...done])); }catch(e){} }
function toggle(id){
  if (done.has(id)) done.delete(id); else done.add(id);
  saveLocal(); pushRemote(); renderAll();
  toast(done.has(id) ? "Chapter " + id + " marked complete" : "Chapter " + id + " marked not complete");
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(s){
  if (window.marked && marked.parse){
    const html = marked.parse(s, {gfm:true, headerIds:false, mangle:false});
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  }
  return "<pre>" + esc(s) + "</pre>";
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function currentId(){
  const m = location.hash.match(/^#ch-(\d{1,3})$/);
  const n = m ? +m[1] : 0;
  return n >= 1 && n <= TOTAL ? n : 0;
}

/* ---------- header memory bank ---------- */
function renderBank(){
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= PARTS.length; p++){
    html += '<div class="bank-group" title="Part ' + p + ': ' + esc(PARTS[p-1]) + '">';
    for (const i of idsOf(p)){
      html += '<button class="cell' + (done.has(i) ? " done" : "") + (i === cur ? " here" : "") +
        '" data-go="' + i + '" aria-label="Chapter ' + i + (done.has(i) ? ", complete" : "") + '"></button>';
    }
    html += "</div>";
  }
  document.getElementById("bank").innerHTML = html;
  document.getElementById("doneCount").textContent = done.size;
  document.getElementById("pct").textContent = Math.round(done.size * 100 / TOTAL) + "%";
}

/* ---------- sidebar ---------- */
const openParts = new Set();
function renderSide(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= PARTS.length; p++){
    const ids = idsOf(p);
    const matches = ids.filter(i => !q || byId[i].title.toLowerCase().includes(q) || byId[i].tldr.toLowerCase().includes(q) || String(i) === q);
    if (q && !matches.length) continue;
    const count = ids.filter(i => done.has(i)).length;
    const open = q || openParts.has(p) || partOf(cur) === p;
    html += '<div class="part' + (open ? " open" : "") + '">' +
      '<button class="part-head" data-part="' + p + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="part-num">' + String(p).padStart(2, "0") + '</span>' +
      '<span class="part-name">' + esc(PARTS[p-1]) + '</span>' +
      '<span class="part-count' + (count === PER ? " full" : "") + '">' + count + '/' + PER + '</span></button><ul class="part-list">';
    for (const i of matches){
      html += '<li class="ch-row' + (i === cur ? " active" : "") + '">' +
        '<button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="' + (done.has(i) ? "Mark chapter " + i + " not complete" : "Mark chapter " + i + " complete") + '">' + TICK + '</button>' +
        '<a href="#ch-' + i + '"><span class="n">' + i + '.</span>' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ul></div>";
  }
  if (!html) html = '<p style="color:var(--muted);font-size:14px;padding:8px">No chapters match that search. Try a shorter word like “SLAM”, “VLA” or “Kalman”.</p>';
  document.getElementById("parts").innerHTML = html;
}

/* ---------- diagrams and charts ---------- */
let mermaidPromise = null, renderSeq = 0;
const svgCache = new Map();
function isDark(){
  const a = document.documentElement.getAttribute("data-theme");
  if (a) return a === "dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function ensureMermaid(){
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (mermaidPromise) return mermaidPromise;
  mermaidPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js";
    s.onload = () => {
      try{
        window.mermaid.initialize({ startOnLoad:false, securityLevel:"strict", theme: isDark() ? "dark" : "neutral",
          fontFamily:"IBM Plex Sans, system-ui, sans-serif", flowchart:{ curve:"basis", htmlLabels:true } });
        resolve(window.mermaid);
      }catch(e){ reject(e); }
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return mermaidPromise;
}
function fitSvg(div){
  const svg = div.querySelector("svg");
  if (!svg) return;
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Diagram");
  const vb = (svg.getAttribute("viewBox") || "").split(/\s+/).map(Number);
  const vbw = vb[2] || 0;
  if (vbw && div.clientWidth && div.clientWidth < vbw * 0.7){
    svg.style.maxWidth = "none";
    svg.style.width = Math.round(vbw * 0.85) + "px";
  }
}
function fmtNum(v){ return Number(v).toLocaleString("en-US", { maximumFractionDigits: 3 }); }
function renderChart(el, spec){
  const max = Math.max(...spec.data.map(d => d[1]));
  const unit = spec.unit || "";
  const sep = (unit === "%" || unit === "×") ? "" : " ";
  let rows = "";
  for (const [label, v] of spec.data){

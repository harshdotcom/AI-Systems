"body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Perception guided by free-form text |\n| Models | CLIP-style embeddings, open-vocab detectors, VLMs |\n| Uses | Language instructions, novel objects, semantic maps |\n| Watch out for | Confident detections of objects that aren’t there |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TEXT[Instruction: pick the blue screwdriver] --> GROUND[Open-vocab detector]\n  IMG[Camera image] --> GROUND\n  GROUND --> BOX[Box + confidence]\n  BOX --> MASK[Segment]\n  MASK --> XYZ[3D location via depth]\n```\n\n### Worked example\n\n| Query | Fixed-class detector | Open-vocabulary detector |\n|---|---|---|\n| “cup” | Works if trained on cups | Works |\n| “the mug with a cat print” | Fails | Often works |\n| “the tool used to tighten screws” | Fails | Sometimes works with VLM reasoning |"}, {"id": 47, "title": "Sensor fusion", "tldr": "Fusion combines sensors to get better estimates than any single sensor: cameras for semantics, LiDAR for geometry, radar for velocity, IMU for fast motion. Fusion can happen early (raw data), at intermediate features or late (object level).", "real": "Bird’s-eye-view (BEV) fusion architectures, such as BEVFusion (2022), became popular in autonomous driving for combining camera and LiDAR features in a shared top-down representation.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Combining multiple sensors |\n| Levels | Early (raw), mid (features/BEV), late (objects/tracks) |\n| Requirements | Time synchronization + extrinsic calibration |\n| Watch out for | Unsynchronized timestamps producing ghost objects |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CAM[Camera features] --> BEV[Bird's-eye-view fusion]\n  LIDAR[LiDAR features] --> BEV\n  RADAR[Radar tracks] --> BEV\n  BEV --> DETECT[3D objects + velocities]\n```\n\n### Worked example\n\n```text\nFusing two independent estimates (inverse-variance weighting):\nCamera range 10.4 m (σ = 0.5 m), LiDAR range 10.1 m (σ = 0.1 m)\nw_cam = 1/0.25 = 4, w_lidar = 1/0.01 = 100\nfused = (4 × 10.4 + 100 × 10.1) / 104 ≈ 10.112 m; fused σ = sqrt(1/104) ≈ 0.098 m\n```"}, {"id": 48, "title": "Tracking", "tldr": "Tracking maintains object identities and states over time: predict where each object will be, associate new detections, update estimates, create and delete tracks. Kalman filters with data association (Hungarian matching) are classic; learned trackers handle complex scenes.", "real": "SORT (2016) combined a Kalman filter with Hungarian matching for fast multi-object tracking, and DeepSORT (2017) added appearance features to reduce identity switches.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Following objects across frames |\n| Steps | Predict → associate → update → manage tracks |\n| Metrics | MOTA, IDF1, identity switches |\n| Watch out for | Identity swaps when objects cross or are occluded |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TRACKS[Existing tracks] --> PREDICT[Kalman predict]\n  DETS[New detections] --> ASSOC[Association: IoU / distance / appearance]\n  PREDICT --> ASSOC\n  ASSOC --> UPDATE[Update matched tracks]\n  ASSOC --> NEW[Create new tracks]\n  ASSOC --> LOST[Age out unmatched tracks]\n```\n\n### Worked example\n\n```python\nimport numpy as np\nfrom scipy.optimize import linear_sum_assignment\n\ntracks = np.array([[1.0, 1.0], [5.0, 5.0]])          # predicted positions\ndets = np.array([[5.2, 4.9], [0.9, 1.1], [9.0, 9.0]])\ncost = np.linalg.norm(tracks[:, None, :] - dets[None, :, :], axis=2)\nrows, cols = linear_sum_assignment(cost)\nprint([(int(r), int(c)) for r, c in zip(rows, cols)])   # [(0, 1), (1, 0)] → detection 2 starts a new track\n```"}, {"id": 49, "title": "Scene representations", "tldr": "Robots represent their surroundings as occupancy grids, voxel maps, meshes, signed distance fields, semantic maps, scene graphs, or neural/radiance representations such as NeRFs and 3D Gaussian splats. The right choice depends on the task.", "real": "NeRF (2020) and 3D Gaussian Splatting (2023) enabled photorealistic 3D scene reconstruction, which robotics teams use for digital twins, simulation assets and semantic mapping.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How a robot stores its model of the world |\n| Options | Occupancy grids, voxels/TSDF, meshes, scene graphs, Gaussian splats |\n| Trade-offs | Memory, update speed, semantic richness, rendering quality |\n| Watch out for | Pretty reconstructions that are too slow for real-time decisions |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  REP[Scene representations] --> OCC[Occupancy grid: navigation]\n  REP --> TSDF[TSDF / voxels: collision checking]\n  REP --> GRAPH[Scene graph: rooms, objects, relations]\n  REP --> GS[Gaussian splats: realistic rendering, sim assets]\n```\n\n### Worked example\n\n| Task | Representation |\n|---|---|\n| Floor navigation | 2D occupancy grid |\n| Arm collision avoidance | Voxel map / signed distance field |\n| “Bring the mug from the kitchen” | Semantic scene graph |\n| Creating a simulation twin | Mesh or Gaussian splats |"}, {"id": 50, "title": "Perception failure modes", "tldr": "Perception fails from lighting changes, glare, reflections, transparency, occlusion, motion blur, sensor degradation, weather and distribution shift. Robust systems detect uncertainty, use redundancy and fall back to safe behavior.", "real": "Investigations of autonomous vehicle crashes, such as the 2018 Uber test vehicle fatality in Tempe, Arizona, highlighted how perception classification instability and system design choices can combine into fatal outcomes.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How and why robot perception goes wrong |\n| Causes | Lighting, weather, occlusion, reflections, rare objects, sensor faults |\n| Mitigations | Redundancy, uncertainty estimation, monitoring, conservative fallbacks |\n| Watch out for | Systems that never say “I don’t know” |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INPUT[Sensor input] --> PERCEIVE[Perception]\n  PERCEIVE --> CONF{Confidence + consistency OK?}\n  CONF -->|yes| ACT[Normal operation]\n  CONF -->|no| SAFE[Slow down / stop / ask for help]\n  HEALTH[Sensor health monitor] --> CONF\n```\n\n### Worked example\n\n| Failure | Detection signal | Response |\n|---|---|---|\n| Camera blinded by sun | Overexposed frames | Rely on LiDAR; slow down |\n| Dirty lens | Persistent blur region | Request cleaning |\n| Unknown object on path | Low-confidence class, occupied space | Treat as obstacle |\n| Depth holes on glass | Missing depth in region | Avoid or probe carefully |"}, {"id": 51, "title": "State estimation overview", "tldr": "State estimation infers quantities the robot can’t measure directly (pose, velocity, contact state, object positions) by combining a motion model with noisy sensor measurements over time. Good estimation is the foundation of control and planning.", "real": "Legged robots such as ANYmal and Spot fuse IMU, joint encoders and leg kinematics to estimate body velocity at high rates, since a fall can happen faster than cameras can report it.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Inferring hidden state from noisy data |\n| Ingredients | Motion model, measurement model, noise models |\n| Methods | Kalman filters, particle filters, factor graph optimization |\n| Watch out for | Wrong noise assumptions making filters over- or under-confident |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CONTROL[Commands / odometry] --> PREDICT[Predict state + uncertainty]\n  PREDICT --> UPDATE[Correct with measurements]\n  SENSORS[Sensor measurements] --> UPDATE\n  UPDATE --> ESTIMATE[State estimate + covariance]\n  ESTIMATE --> PREDICT\n```\n\n### Worked example\n\n| State | How it’s estimated |\n|---|---|\n| Robot position in a building | Wheel odometry + LiDAR localization |\n| Drone attitude | Gyro + accelerometer fusion |\n| Humanoid foot contact | Joint torques + kinematics + force sensors |\n| Object being carried | Gripper state + vision |"}, {"id": 52, "title": "The Kalman filter", "tldr": "The Kalman filter optimally fuses predictions and measurements for linear systems with Gaussian noise. Each cycle predicts the state and its uncertainty, then updates using the Kalman gain, which weighs measurement against prediction by their uncertainties.", "real": "Rudolf Kálmán published the filter in 1960, and it was used in the Apollo program’s navigation computer, becoming one of the most widely applied algorithms in engineering.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Optimal linear Gaussian estimator |\n| Predict | x = F x + B u, P = F P Fᵀ + Q |\n| Update | K = P Hᵀ (H P Hᵀ + R)⁻¹; x += K (z − H x); P = (I − K H) P |\n| Watch out for | Poorly tuned Q (process noise) and R (measurement noise) |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  X[State x, covariance P] --> PRED[Predict with F, Q]\n  PRED --> GAIN[Kalman gain K]\n  Z[Measurement z, noise R] --> GAIN\n  GAIN --> NEWX[Updated x, P]\n  NEWX --> X\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\n# 1D constant-velocity tracking: state [position, velocity], measure position\ndt = 0.1\nF = np.array([[1, dt], [0, 1]]); H = np.array([[1.0, 0.0]])\nQ = np.diag([1e-4, 1e-3]); R = np.array([[0.25]])\nx = np.array([0.0, 0.0]); P = np.eye(2)\n\nrng = np.random.default_rng(0)\ntrue_pos = lambda t: 1.0 * t                      # moving at 1 m/s\nfor k in range(1, 101):\n    x = F @ x; P = F @ P @ F.T + Q                # predict\n    z = true_pos(k * dt) + rng.normal(0, 0.5)     # noisy measurement\n    K = P @ H.T @ np.linalg.inv(H @ P @ H.T + R)  # update\n    x = x + (K @ (z - H @ x)).ravel(); P = (np.eye(2) - K @ H) @ P\nprint(x.round(2))   # position ≈ 10, velocity ≈ 1\n```"}, {"id": 53, "title": "Extended and unscented Kalman filters", "tldr": "Robots are nonlinear (rotations, range-bearing sensors), so the EKF linearizes models with Jacobians around the current estimate, while the UKF propagates sample points through the nonlinear functions. Error-state formulations are standard for orientation.", "real": "EKF-based visual-inertial odometry, such as the MSCKF (Mourikis and Roumeliotis, 2007), became a standard approach for drones and AR devices fusing cameras and IMUs.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Kalman filtering for nonlinear systems |\n| EKF | Linearize with Jacobians |\n| UKF | Sigma points through nonlinear functions |\n| Watch out for | Divergence when linearization is poor or initialization is wrong |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  NL[Nonlinear motion model f] --> JAC[Jacobian F at estimate]\n  NLH[Nonlinear measurement h] --> JACH[Jacobian H at estimate]\n  JAC --> EKF[EKF predict + update]\n  JACH --> EKF\n```\n\n### Worked example\n\nRange-bearing measurement to a landmark at (lx, ly) from robot at (x, y):\n\n```text\nrange r = sqrt((lx − x)² + (ly − y)²), bearing φ = atan2(ly − y, lx − x) − θ\nJacobian rows (w.r.t. x, y, θ):\n∂r = [−(lx − x)/r, −(ly − y)/r, 0]\n∂φ = [(ly − y)/r², −(lx − x)/r², −1]\n```"}, {"id": 54, "title": "Particle filters and localization", "tldr": "Particle filters represent beliefs with many weighted samples, handling multimodal and nonlinear problems. Monte Carlo localization spreads particles over a map, moves them with odometry, weights them by sensor agreement and resamples.", "real": "Monte Carlo Localization was introduced by Dellaert, Fox, Burgard and Thrun in 1999, and its adaptive variant AMCL remains a standard localization package in ROS navigation.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Sample-based Bayesian filtering |\n| Steps | Move particles → weight by likelihood → resample |\n| Strengths | Global localization, multimodal beliefs |\n| Watch out for | Particle depletion; too few particles for large maps |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INIT[Particles spread over map] --> MOVE[Apply odometry + noise]\n  MOVE --> WEIGHT[Weight by scan match to map]\n  WEIGHT --> RESAMPLE[Resample by weight]\n  RESAMPLE --> ESTIMATE[Pose estimate = weighted mean]\n  RESAMPLE --> MOVE\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\nrng = np.random.default_rng(0)\ndoors = np.array([2.0, 5.0, 8.0])                  # 1D corridor with doors\nparticles = rng.uniform(0, 10, 1000)\ntrue_x = 2.0\nfor step in range(3):\n    true_x += 3.0                                  # robot moves 3 m\n    particles += 3.0 + rng.normal(0, 0.1, particles.size)\n    near_door = np.min(np.abs(true_x - doors)) < 0.3\n    dist = np.min(np.abs(particles[:, None] - doors[None, :]), axis=1)\n    likelihood = np.where(dist < 0.3, 0.9, 0.1) if near_door else np.where(dist < 0.3, 0.1, 0.9)\n    w = likelihood / likelihood.sum()\n    particles = particles[rng.choice(particles.size, particles.size, p=w)]\nprint(round(true_x, 1), round(np.median(particles), 1))\n```"}, {"id": 55, "title": "Odometry", "tldr": "Odometry estimates motion incrementally: wheel odometry from encoders, inertial odometry from IMUs, visual odometry from camera motion, LiDAR odometry from scan matching, and visual-inertial odometry combining camera and IMU. All odometry drifts without corrections.", "real": "Visual-inertial odometry powers smartphone AR (Apple ARKit, Google ARCore) and many drones, because cameras and IMUs complement each other well.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Incremental motion estimation |\n| Types | Wheel, inertial, visual, LiDAR, visual-inertial |\n| Weakness | Drift accumulates over distance/time |\n| Watch out for | Wheel slip on smooth or wet floors |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ENC[Wheel encoders] --> WHEEL[Wheel odometry]\n  CAM[Camera] --> VO[Visual odometry]\n  IMU[IMU] --> VIO[Visual-inertial odometry]\n  VO --> VIO\n  WHEEL --> FUSE[Fused odometry]\n  VIO --> FUSE\n```\n\n### Worked example\n\n```python\nimport math\n\ndef diff_drive_update(x, y, th, d_left, d_right, wheel_base):\n    d = (d_left + d_right) / 2\n    dth = (d_right - d_left) / wheel_base\n    x += d * math.cos(th + dth / 2)\n    y += d * math.sin(th + dth / 2)\n    return x, y, th + dth\n\npose = (0.0, 0.0, 0.0)\nfor _ in range(100):                        # right wheel slightly faster → gentle left curve\n    pose = diff_drive_update(*pose, 0.0100, 0.0105, 0.4)\nprint([round(v, 3) for v in pose])          # x ≈ 1.022, y ≈ 0.064, θ = 0.125 rad\n```"}, {"id": 56, "title": "The SLAM problem", "tldr": "Simultaneous localization and mapping builds a map of an unknown environment while estimating the robot’s pose within it. Modern SLAM uses a front end (feature matching, scan registration) and a back end (pose-graph or factor-graph optimization), with loop closure correcting drift.", "real": "The term SLAM emerged in the mid-1990s, and factor graph libraries such as GTSAM (Georgia Tech) became standard back ends for optimizing robot trajectories and maps.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Mapping and localizing at the same time |\n| Front end | Feature tracking, scan matching, place recognition |\n| Back end | Pose-graph / factor-graph optimization |\n| Watch out for | False loop closures corrupting the whole map |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SENSOR[Sensor data] --> FRONT[Front end: odometry + features]\n  FRONT --> GRAPH[Pose graph nodes + edges]\n  FRONT --> LOOP[Loop closure detection]\n  LOOP --> GRAPH\n  GRAPH --> OPT[Back-end optimization]\n  OPT --> MAP[Consistent map + trajectory]\n```\n\n### Worked example\n\n```text\nRobot drives a 100 m loop with 2% odometry drift → ~2 m position error when returning to start\nLoop closure recognizes the start → optimizer distributes the 2 m correction along the trajectory\n```"}, {"id": 57, "title": "Visual SLAM", "tldr": "Visual SLAM uses cameras: tracking features or pixel intensities between frames, triangulating 3D points and optimizing camera poses with bundle adjustment. It’s cheap and information-rich but sensitive to lighting, textureless surfaces and fast motion.", "real": "ORB-SLAM (2015) and its successors ORB-SLAM2 and ORB-SLAM3 became widely used open-source visual SLAM systems supporting monocular, stereo, RGB-D and visual-inertial setups.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | SLAM with cameras |\n| Approaches | Feature-based (ORB), direct (intensity), learned (deep features) |\n| Optimization | Bundle adjustment |\n| Watch out for | White walls, darkness, motion blur |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  FRAME[New frame] --> FEAT[Extract + match features]\n  FEAT --> POSE[Estimate camera pose]\n  POSE --> KEY{Keyframe?}\n  KEY -->|yes| MAP[Triangulate new map points]\n  MAP --> BA[Local bundle adjustment]\n  BA --> LOOPC[Loop closure + global optimization]\n```\n\n### Worked example\n\n| Setup | Scale observable? |\n|---|---|\n| Monocular camera | No (scale ambiguous) |\n| Stereo camera | Yes |\n| RGB-D | Yes |\n| Monocular + IMU | Yes (via accelerometer) |"}, {"id": 58, "title": "LiDAR SLAM", "tldr": "LiDAR SLAM registers point clouds (ICP, feature-based scan matching) to estimate motion and build accurate geometric maps, robust to lighting. It’s standard for outdoor robots, autonomous vehicles and large indoor facilities.", "real": "LOAM (2014) set a benchmark for LiDAR odometry and mapping, and Google’s open-source Cartographer (2016) provided real-time 2D and 3D LiDAR SLAM widely used with ROS.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | SLAM using laser range scans |\n| Methods | ICP, NDT, edge/plane feature matching |\n| Strengths | Accurate geometry, lighting-independent |\n| Watch out for | Long featureless corridors and tunnels causing degeneracy |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SCAN[New LiDAR scan] --> DESKEW[Motion compensation]\n  DESKEW --> MATCH[Scan-to-map matching]\n  MATCH --> POSE[Pose update]\n  POSE --> INSERT[Insert scan into map]\n  INSERT --> SUBMAP[Submaps + loop closure]\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\ndef best_rigid_transform(A, B):\n    \"\"\"Least-squares R, t aligning point set A to B (Kabsch / one ICP step with known matches).\"\"\"\n    ca, cb = A.mean(0), B.mean(0)\n    U, _, Vt = np.linalg.svd((A - ca).T @ (B - cb))\n    Rm = Vt.T @ U.T\n    if np.linalg.det(Rm) < 0:\n        Vt[-1] *= -1\n        Rm = Vt.T @ U.T\n    return Rm, cb - Rm @ ca\n\nth = np.radians(10)\nRtrue = np.array([[np.cos(th), -np.sin(th)], [np.sin(th), np.cos(th)]])\nA = np.random.default_rng(0).uniform(-5, 5, (50, 2))\nB = A @ Rtrue.T + np.array([0.5, -0.2])\nRm, t = best_rigid_transform(A, B)\nprint(round(np.degrees(np.arctan2(Rm[1, 0], Rm[0, 0])), 2), t.round(3))   # 10.0 [ 0.5 -0.2]\n```"}, {"id": 59, "title": "Maps for robots", "tldr": "Maps range from 2D occupancy grids (free/occupied cells, updated with log-odds) to 3D voxel maps, lanelet and HD maps for vehicles, and semantic maps with labeled objects and places. Maps must be maintained as environments change.", "real": "Nav2 uses layered costmaps built from occupancy grids, combining static maps, obstacle layers from sensors and inflation layers around obstacles for safe path planning.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Stored environment models |\n| Types | Occupancy grids, voxel/octree maps, HD maps, semantic maps |\n| Updates | Log-odds occupancy, map merging, change detection |\n| Watch out for | Stale maps after furniture moves or construction |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  STATIC[Static map layer] --> COSTMAP[Layered costmap]\n  OBST[Obstacle layer from sensors] --> COSTMAP\n  INFL[Inflation layer: safety margin] --> COSTMAP\n  COSTMAP --> PLANNER[Path planner]\n```\n\n### Worked example\n\n```python\nimport math\n\ndef logodds(p): return math.log(p / (1 - p))\ndef prob(l): return 1 - 1 / (1 + math.exp(l))\n\nl = logodds(0.5)                  # unknown cell: log-odds 0\nfor _ in range(3):                # three \"occupied\" observations with sensor model p = 0.7\n    l += logodds(0.7)\nprint(round(prob(l), 3))          # 0.927\n```"}, {"id": 60, "title": "Localization in practice", "tldr": "Deployed robots combine methods: wheel/visual odometry for smooth short-term motion, map-based localization (LiDAR or visual) for drift correction, GNSS/RTK outdoors, and fiducials or beacons in difficult spaces. Monitor localization confidence and recover when lost.", "real": "Outdoor robots and agricultural machines use RTK GNSS for centimeter-level positioning, while indoor robots rely on LiDAR or visual localization because satellite signals don’t reach indoors.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Reliable pose estimation in real deployments |\n| Indoors | LiDAR/visual localization against a map, fiducials |\n| Outdoors | GNSS/RTK + IMU + odometry |\n| Watch out for | Kidnapped robot problem: robot moved while off |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ODOM[Odometry: smooth, drifting] --> FUSION[Fusion: e.g. robot_localization EKF]\n  MAPLOC[Map localization: corrections] --> FUSION\n  GNSS[GNSS/RTK outdoors] --> FUSION\n  FUSION --> POSE[Pose]\n  POSE --> CONF{Covariance too large?}\n  CONF -->|yes| RECOVER[Stop + relocalize]\n```\n\n### Worked example\n\n| Positioning method | Typical accuracy |\n|---|---|\n| Standard GNSS | Several meters |\n| RTK GNSS | \\~1–2 cm (open sky) |\n| LiDAR localization indoors | \\~2–5 cm |\n| Wheel odometry over 50 m | Error grows, often decimeters to meters |"}, {"id": 61, "title": "Configuration space", "tldr": "Planning happens in configuration space (C-space): the space of all robot configurations (joint angles, or x, y, θ for a mobile base). Obstacles become forbidden regions in C-space; a plan is a collision-free path between start and goal configurations.", "real": "Tomás Lozano-Pérez formalized configuration-space planning in 1983, a framework still underlying motion planners in MoveIt, OMPL and autonomous vehicle stacks.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Space of all possible robot configurations |\n| Dimension | Number of DOF (7D for a 7-DOF arm) |\n| C-obstacles | Configurations that collide |\n| Watch out for | High-dimensional C-spaces making grid search impossible |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  WORKSPACE[Workspace: 3D world with obstacles] --> MAP[Map to C-space]\n  ROBOT[Robot geometry + joints] --> MAP\n  MAP --> CFREE[C-free: collision-free configs]\n  MAP --> COBS[C-obstacle]\n  CFREE --> PATH[Path from start to goal]\n```\n\n### Worked example\n\n| Robot | C-space dimension |\n|---|---|\n| Point robot on floor | 2 |\n| Car-like robot | 3 (x, y, θ) with nonholonomic constraints |\n| 7-DOF arm | 7 |\n| Mobile manipulator (base + 7-DOF arm) | 10 |\n\n```text\nGrid with 100 cells per dimension: 2D → 10^4 cells; 7D → 10^14 cells (infeasible) → use sampling\n```"}, {"id": 62, "title": "Graph search: Dijkstra and A*", "tldr": "Grid and graph planners search over discretized spaces. Dijkstra finds shortest paths by expanding lowest cost first; A* adds an admissible heuristic (such as straight-line distance) to search far fewer nodes while remaining optimal.", "real": "A* was published by Hart, Nilsson and Raphael in 1968 as part of SRI’s Shakey project, and variants remain core to mobile robot global planners, including Nav2’s planners.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Shortest-path search on graphs |\n| A* cost | f(n) = g(n) + h(n) |\n| Optimality | Guaranteed with admissible (non-overestimating) heuristic |\n| Watch out for | Grid resolution too coarse (misses gaps) or too fine (slow) |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  START[Open set: start] --> POP[Pop lowest f = g + h]\n  POP --> GOAL{Goal?}\n  GOAL -->|yes| PATH[Reconstruct path]\n  GOAL -->|no| EXPAND[Expand neighbors, update g]\n  EXPAND --> POP\n```\n\n### Worked example\n\n```python\nimport heapq\n\ndef astar(grid, start, goal):\n    rows, cols = len(grid), len(grid[0])\n    h = lambda p: abs(p[0] - goal[0]) + abs(p[1] - goal[1])\n    open_set = [(h(start), 0, start)]\n    came, g = {}, {start: 0}\n    while open_set:\n        _, cost, cur = heapq.heappop(open_set)\n        if cur == goal:\n            path = [cur]\n            while cur in came:\n                cur = came[cur]\n                path.append(cur)\n            return path[::-1]\n        for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n            nxt = (cur[0] + dr, cur[1] + dc)\n            if 0 <= nxt[0] < rows and 0 <= nxt[1] < cols and grid[nxt[0]][nxt[1]] == 0:\n                if cost + 1 < g.get(nxt, float(\"inf\")):\n                    g[nxt], came[nxt] = cost + 1, cur\n                    heapq.heappush(open_set, (cost + 1 + h(nxt), cost + 1, nxt))\n    return None\n\ngrid = [[0, 0, 0, 0],\n        [1, 1, 0, 1],\n        [0, 0, 0, 0],\n        [0, 1, 1, 0]]\nprint(astar(grid, (0, 0), (3, 3)))   # 7 cells: (0,0) → (0,2) → (2,2) → (2,3) → (3,3)\n```"}, {"id": 63, "title": "Sampling-based planning: PRM and RRT", "tldr": "In high-dimensional spaces, sampling planners randomly sample configurations and connect collision-free ones. PRMs build reusable roadmaps; RRTs grow trees from the start toward random samples; RRT* and other variants converge toward optimal paths.", "real": "Kavraki and colleagues introduced probabilistic roadmaps in 1996 and LaValle introduced RRTs in 1998; the Open Motion Planning Library (OMPL), used by MoveIt, implements dozens of these planners.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Randomized planning in continuous spaces |\n| PRM | Multi-query roadmap |\n| RRT / RRT-Connect / RRT* | Single-query trees; RRT* asymptotically optimal |\n| Watch out for | Narrow passages needing many samples; jerky paths needing smoothing |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SAMPLE[Sample random config] --> NEAREST[Find nearest tree node]\n  NEAREST --> STEER[Step toward sample]\n  STEER --> COLLIDE{Collision-free?}\n  COLLIDE -->|yes| ADD[Add node + edge]\n  COLLIDE -->|no| SAMPLE\n  ADD --> GOAL{Near goal?}\n  GOAL -->|no| SAMPLE\n  GOAL -->|yes| DONE[Extract path]\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\ndef rrt(start, goal, is_free, step=0.5, iters=5000, goal_tol=0.5, seed=0):\n    rng = np.random.default_rng(seed)\n    nodes, parent = [np.array(start, float)], {0: None}\n    for _ in range(iters):\n        sample = np.array(goal, float) if rng.random() < 0.1 else rng.uniform(0, 10, 2)\n        i = int(np.argmin([np.linalg.norm(n - sample) for n in nodes]))\n        direction = sample - nodes[i]\n        new = nodes[i] + step * direction / (np.linalg.norm(direction) + 1e-9)\n        if is_free(new):\n            nodes.append(new); parent[len(nodes) - 1] = i\n            if np.linalg.norm(new - goal) < goal_tol:\n                path, k = [], len(nodes) - 1\n                while k is not None:\n                    path.append(nodes[k]); k = parent[k]\n                return path[::-1]\n    return None\n\nwall = lambda p: not (4 < p[0] < 5 and p[1] < 7)        # wall with a gap above y = 7\npath = rrt((1, 1), (9, 1), wall)\nprint(len(path) if path else \"no path\")\n```"}, {"id": 64, "title": "Trajectory optimization", "tldr": "Trajectory optimization treats the whole path as decision variables, minimizing costs (smoothness, time, energy) subject to constraints (collisions, joint limits, dynamics). It produces smooth, efficient motions and is often used to refine sampling-based paths.", "real": "CHOMP (2009) and TrajOpt (2013) popularized optimization-based motion planning for manipulators, and modern stacks use solvers such as IPOPT, OSQP and GPU-accelerated optimizers like NVIDIA cuRobo.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Optimizing entire trajectories |\n| Costs | Smoothness, duration, effort, distance to obstacles |\n| Constraints | Dynamics, limits, collisions, endpoint poses |\n| Watch out for | Local minima; needs good initialization |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INIT[Initial path: straight line or RRT] --> COST[Evaluate cost + constraint violations]\n  COST --> GRAD[Gradients / QP step]\n  GRAD --> UPDATE[Update waypoints]\n  UPDATE --> CONV{Converged + feasible?}\n  CONV -->|no| COST\n  CONV -->|yes| TRAJ[Smooth trajectory]\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\n# Smooth a jagged 1D path by minimizing sum of squared accelerations with fixed endpoints\nn = 10\npath = np.array([0, 2, 1, 3, 2, 4, 3, 5, 4, 6], float)\nD = np.diff(np.eye(n), 2, axis=0)            # second-difference operator\nlam = 10.0\nA = np.eye(n) + lam * D.T @ D\nA[0], A[-1] = 0, 0; A[0, 0] = A[-1, -1] = 1  # pin endpoints\nsmooth = np.linalg.solve(A, path)\nprint(smooth.round(2))\n```"}, {"id": 65, "title": "Collision checking", "tldr": "Planners spend most of their time checking collisions. Robots and obstacles are approximated with simpler geometry (spheres, capsules, convex hulls, voxels, signed distance fields), and broad-phase checks quickly discard distant pairs before exact narrow-phase tests.", "real": "The Flexible Collision Library (FCL) is used by MoveIt for collision checking, and GPU-based libraries such as cuRobo approximate robots with spheres to check thousands of trajectories in parallel.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Testing geometry for contact |\n| Approximations | Spheres, capsules, convex meshes, SDFs, voxels |\n| Phases | Broad phase (bounding volumes) → narrow phase (exact) |\n| Watch out for | Thin obstacles missed between sampled waypoints |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ROBOT[Robot links as spheres/capsules] --> BROAD[Broad phase: bounding boxes]\n  WORLD[Obstacles] --> BROAD\n  BROAD --> NARROW[Narrow phase: exact distance]\n  NARROW --> RESULT[Collision? + clearance]\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\ndef spheres_collide(c1, r1, c2, r2, margin=0.02):\n    return np.linalg.norm(np.subtract(c1, c2)) < r1 + r2 + margin\n\nprint(spheres_collide((0, 0, 0.5), 0.05, (0.08, 0, 0.5), 0.03))   # True (0.08 < 0.10)\nprint(spheres_collide((0, 0, 0.5), 0.05, (0.20, 0, 0.5), 0.03))   # False\n```"}, {"id": 66, "title": "Time parameterization and trajectories", "tldr": "A geometric path becomes a trajectory by assigning timing that respects velocity, acceleration and jerk limits. Trapezoidal and S-curve profiles are common; time-optimal parameterization (such as TOPP-RA) finds the fastest feasible timing.", "real": "MoveIt applies time-optimal trajectory generation to planned paths, and industrial controllers use S-curve profiles to limit jerk and reduce vibration.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Turning paths into timed motions |\n| Profiles | Trapezoidal velocity, S-curve (jerk-limited), splines |\n| Constraints | Velocity, acceleration, jerk, torque limits |\n| Watch out for | Abrupt acceleration causing vibration and tracking error |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PATH[Geometric path] --> LIMITS[Apply v, a, j limits]\n  LIMITS --> PROFILE[Velocity profile]\n  PROFILE --> TRAJ[Timed trajectory: q of t]\n  TRAJ --> CONTROLLER[Tracking controller]\n```\n\n### Worked example\n\n```text\nTrapezoidal profile: distance 1.0 rad, v_max = 1.0 rad/s, a_max = 2.0 rad/s²\nAcceleration time = v/a = 0.5 s, distance while accelerating = 0.5 × 2 × 0.5² = 0.25 rad\nSame for deceleration: 0.25 rad → cruise distance = 0.5 rad → cruise time 0.5 s\nTotal time = 0.5 + 0.5 + 0.5 = 1.5 s\n```"}, {"id": 67, "title": "Mobile robot navigation", "tldr": "Navigation stacks combine a global planner (path on the map), a local planner/controller (follow the path while avoiding new obstacles), costmaps, recovery behaviors and behavior trees coordinating them.", "real": "Nav2 provides global planners (such as Smac planners), controllers (such as Regulated Pure Pursuit and MPPI), layered costmaps and recovery behaviors orchestrated by behavior trees.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Getting a mobile robot from A to B safely |\n| Global planner | Path over the known map |\n| Local controller | Real-time obstacle avoidance and tracking |\n| Watch out for | Robots oscillating or freezing in narrow doorways |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  GOAL[Goal pose] --> GLOBAL[Global planner on costmap]\n  GLOBAL --> PATH[Global path]\n  PATH --> LOCAL[Local controller: MPPI / pure pursuit]\n  SENSORS[Live sensors] --> COSTMAP[Local costmap]\n  COSTMAP --> LOCAL\n  LOCAL --> CMD[Velocity commands]\n  LOCAL -->|stuck| RECOVERY[Recovery: clear costmap, back up, spin]\n```\n\n### Worked example\n\n| Nav2 parameter | Effect |\n|---|---|\n| Inflation radius | Larger → stays farther from walls, may block narrow passages |\n| Max velocity | Speed vs safety and stopping distance |\n| Goal tolerance | Precision of final position |\n| Controller frequency | Responsiveness (e.g. 20 Hz) |"}, {"id": 68, "title": "Manipulation planning", "tldr": "Manipulation planning chooses grasps, plans collision-free arm motions to pre-grasp poses, approaches, grasps, lifts and places, while accounting for the object attached to the gripper. MoveIt and cuRobo-style planners handle the arm motion.", "real": "MoveIt 2 integrates inverse kinematics, OMPL planners, collision checking, trajectory processing and grasp pipelines, and NVIDIA’s cuRobo provides GPU-accelerated motion generation for manipulators.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Planning arm motions for pick and place |\n| Phases | Pre-grasp → approach → grasp → lift → transport → place → retreat |\n| Considerations | Attached object collisions, orientation constraints |\n| Watch out for | Grasp poses that are reachable but lead to awkward, collision-prone motions |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  OBJ[Object pose] --> GRASPS[Candidate grasps]\n  GRASPS --> IK[IK feasibility check]\n  IK --> PLAN[Plan to pre-grasp]\n  PLAN --> APPROACH[Straight-line approach]\n  APPROACH --> CLOSE[Close gripper + attach object]\n  CLOSE --> LIFT[Lift + transport]\n  LIFT --> PLACE[Place + release]\n```\n\n### Worked example\n\n| Grasp candidate | IK solvable | Clearance | Score |\n|---|---|---|---|\n| Top-down | Yes | 3 cm | 0.6 |\n| Side, from left | Yes | 8 cm | 0.9 (chosen) |\n| Side, from right | No (beyond reach) | — | 0 |"}, {"id": 69, "title": "Task and motion planning", "tldr": "TAMP combines symbolic task planning (which actions in which order) with geometric motion planning (can each action be executed). It handles long-horizon tasks like “set the table,” where object order and placement constraints interact.", "real": "TAMP research such as PDDLStream (2020) integrated classical planners with sampling-based motion planning, and recent systems use language models to propose task plans that geometric planners verify.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Joint symbolic + geometric planning |\n| Task level | Actions like pick(A), place(A, shelf) |\n| Motion level | Collision-free arm/base motions per action |\n| Watch out for | Symbolic plans that are geometrically impossible |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  GOAL[Goal: cup on shelf, plate on table] --> TASK[Task planner: action sequence]\n  TASK --> CHECK[Motion planner checks each action]\n  CHECK -->|infeasible| BACKTRACK[Backtrack: new order / placement]\n  BACKTRACK --> TASK\n  CHECK -->|feasible| EXEC[Execute]\n```\n\n### Worked example\n\n```text\nGoal: put the book in the drawer\nPlan 1: pick(book) → place(book, drawer)   ✗ drawer closed\nPlan 2: open(drawer) → pick(book) → place(book, drawer) → close(drawer)   ✓\n```"}, {"id": 70, "title": "Planning under uncertainty", "tldr": "Real robots plan with uncertain state, sensing and other agents’ behavior. Approaches include planning with safety margins, belief-space planning (POMDPs), chance constraints, replanning frequently and actions that gather information.", "real": "Autonomous vehicles plan against multiple predicted futures of other road users and replan many times per second, a practical form of planning under uncertainty.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Making plans robust to uncertainty |\n| Methods | Margins, replanning, POMDPs, chance constraints, contingency plans |\n| Information gathering | Look before acting; probe; move camera |\n| Watch out for | Plans that assume perfect perception |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BELIEF[Belief: uncertain positions] --> PLAN[Plan with margins]\n  PLAN --> EXECUTE[Execute a short horizon]\n  EXECUTE --> SENSE[Sense again]\n  SENSE --> BELIEF\n  BELIEF --> INFO{Too uncertain?}\n  INFO -->|yes| LOOK[Information-gathering action]\n```\n\n### Worked example\n\n```text\nPedestrian position uncertainty σ = 0.3 m; required clearance 0.5 m\nPlan clearance = 0.5 + 2σ = 1.1 m from the predicted mean position (≈ 97.7% one-sided margin)\n```"}, {"id": 71, "title": "Control fundamentals", "tldr": "Feedback control compares desired and measured states and computes actions to reduce the error. Key properties are stability (errors don’t grow), performance (speed, overshoot, tracking accuracy) and robustness (works despite model errors, delays and disturbances).", "real": "Classical control theory from the 20th century, including feedback stability analysis by Nyquist (1932) and Bode, underlies every motor controller, autopilot and robot joint today.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Using feedback to make systems behave as desired |\n| Properties | Stability, performance, robustness |\n| Enemies | Delay, saturation, noise, unmodeled dynamics |\n| Watch out for | High gains that look good in simulation but oscillate on hardware |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REF[Reference r] --> SUM[Error e = r − y]\n  SUM --> CTRL[Controller]\n  CTRL --> PLANT[Plant: motor, robot]\n  DIST[Disturbances] --> PLANT\n  PLANT --> Y[Output y]\n  Y --> SENSOR[Sensor] --> SUM\n```\n\n### Worked example\n\n| Symptom | Likely cause |\n|---|---|\n| Slow response | Gains too low |\n| Overshoot and ringing | Too much proportional gain / too little damping |\n| Steady offset | No integral action against constant disturbance (e.g. gravity) |\n| Growing oscillation | Instability: too high gain or delay |"}, {"id": 72, "title": "PID control", "tldr": "PID control combines proportional (react to error), integral (remove steady offset) and derivative (dampen motion) terms. It’s simple and effective for many joints and motors; practical implementations need anti-windup, derivative filtering and output limits.", "real": "PID controllers remain the most widely used controllers in industry and form the inner loops of most robot joint and motor drives.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | u = Kp·e + Ki·∫e dt + Kd·de/dt |\n| Kp | Faster response; too much → oscillation |\n| Ki | Removes steady-state error; too much → overshoot, windup |\n| Kd | Damping; amplifies noise without filtering |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  E[Error e] --> P[Kp × e]\n  E --> I[Ki × integral of e]\n  E --> D[Kd × derivative of e]\n  P --> SUM[Sum + saturate]\n  I --> SUM\n  D --> SUM\n  SUM --> U[Command u]\n```\n\n### Worked example\n\n```python\ndef simulate_pid(kp, ki, kd, steps=2000, dt=0.001):\n    # Joint as inertia J with damping b and a constant gravity-like disturbance\n    J, b, disturbance = 0.05, 0.1, -0.5\n    pos, vel, integral, prev_err, target = 0.0, 0.0, 0.0, 1.0, 1.0\n    for _ in range(steps):\n        err = target - pos\n        integral = max(-5.0, min(5.0, integral + err * dt))      # anti-windup clamp\n        u = kp * err + ki * integral + kd * (err - prev_err) / dt\n        u = max(-10.0, min(10.0, u))                              # torque limit\n        prev_err = err\n        acc = (u - b * vel + disturbance) / J\n        vel += acc * dt\n        pos += vel * dt\n    return round(pos, 3)\n\nprint(simulate_pid(20, 0, 1.5))    # steady error from disturbance (≈ 0.975)\nprint(simulate_pid(20, 30, 1.5))   # integral term removes it (≈ 1.0)\n```"}, {"id": 73, "title": "State-space control and LQR", "tldr": "State-space models (ẋ = Ax + Bu) describe multi-variable systems. The linear quadratic regulator (LQR) computes optimal feedback gains u = −Kx that balance state error (Q) against control effort (R), and is used for balancing and stabilization.", "real": "LQR-based controllers are classic for balancing problems such as inverted pendulums, and are used in legged robot and drone controllers as stabilizing components.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Optimal linear state feedback |\n| Model | ẋ = Ax + Bu |\n| Design knobs | Q (penalize state), R (penalize effort) |\n| Watch out for | Model valid only near the linearization point |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  MODEL[Linear model A, B] --> RICCATI[Solve Riccati equation]\n  WEIGHTS[Q, R weights] --> RICCATI\n  RICCATI --> K[Gain K]\n  STATE[State x] --> U[u = −K x]\n  K --> U\n```\n\n### Worked example\n\n```python\nimport numpy as np\nfrom scipy.linalg import solve_continuous_are\n\n# Double integrator: position and velocity, force input\nA = np.array([[0.0, 1.0], [0.0, 0.0]])\nB = np.array([[0.0], [1.0]])\nQ = np.diag([10.0, 1.0]); R = np.array([[1.0]])\nP = solve_continuous_are(A, B, Q, R)\nK = np.linalg.inv(R) @ B.T @ P\nprint(K.round(3))                                  # [[3.162 2.706]]\nprint(np.linalg.eigvals(A - B @ K).round(3))       # both eigenvalues have negative real parts → stable\n```"}, {"id": 74, "title": "Model predictive control", "tldr": "MPC repeatedly solves an optimization over a short future horizon using a model, applies the first control, then re-solves with new measurements. It handles constraints explicitly and is widely used for legged locomotion, autonomous driving and drones.", "real": "MIT Cheetah 3 and Mini Cheetah controllers used convex MPC on simplified dynamics to plan ground reaction forces, and MPPI (sampling-based MPC) is available as a controller in Nav2.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Receding-horizon optimal control |\n| Strengths | Constraints, preview, multi-variable coordination |\n| Costs | Computation every cycle; needs a model |\n| Watch out for | Solver failures or slow solves in fast loops |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  X[Current state] --> OPT[Optimize controls over N future steps]\n  MODEL[Dynamics model] --> OPT\n  CONSTR[Constraints] --> OPT\n  OPT --> U0[Apply first control only]\n  U0 --> PLANT[Robot]\n  PLANT --> X\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\n# Unconstrained linear MPC for a 1D cart (discrete double integrator), horizon N, solved as least squares\ndt, N = 0.1, 20\nA = np.array([[1, dt], [0, 1]]); B = np.array([[0.5 * dt**2], [dt]])\nx = np.array([1.0, 0.0])                       # start 1 m from target, at rest\nfor step in range(50):\n    # Build prediction matrices: X = Sx x + Su U\n    Sx = np.vstack([np.linalg.matrix_power(A, i + 1) for i in range(N)])\n    Su = np.zeros((2 * N, N))\n    for i in range(N):\n        for j in range(i + 1):\n            Su[2 * i:2 * i + 2, j:j + 1] = np.linalg.matrix_power(A, i - j) @ B\n    W = np.kron(np.eye(N), np.diag([10.0, 1.0])); r = 0.1\n    U = np.linalg.solve(Su.T @ W @ Su + r * np.eye(N), -Su.T @ W @ Sx @ x)\n    u = float(np.clip(U[0], -2.0, 2.0))        # apply first input with actuator limit\n    x = A @ x + (B * u).ravel()\nprint(x.round(3))                              # near [0, 0]\n```"}, {"id": 75, "title": "Impedance and admittance control", "tldr": "Impedance control makes a robot behave like a programmable spring-damper around a target, so contact forces stay gentle and predictable. Admittance control measures force and adjusts motion, suitable for stiff position-controlled robots with force sensors.", "real": "Neville Hogan’s impedance control (1985) became foundational for robots that touch the world, and collaborative robots use compliant control modes for hand guiding and safe contact.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Controlling the relationship between force and motion |\n| Impedance | F = K(x_d − x) + D(ẋ_d − ẋ) |\n| Admittance | Measured force → adjust position/velocity |\n| Watch out for | Instability when contacting very stiff surfaces with high gains |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  XD[Desired pose] --> IMP[Virtual spring K + damper D]\n  X[Measured pose] --> IMP\n  IMP --> F[Command force/torque]\n  F --> ROBOT[Torque-controlled robot]\n  ROBOT --> X\n```\n\n### Worked example\n\n```text\nWiping a table: desired pose 1 cm below the surface, vertical stiffness K = 500 N/m\nResulting contact force ≈ K × 0.01 m = 5 N (gentle, consistent pressure)\nHorizontal stiffness high (2,000 N/m) to follow the wiping path accurately\n```"}, {"id": 76, "title": "Force control and contact-rich tasks", "tldr": "Tasks such as insertion, polishing, screwing and assembly require controlling forces, not just positions. Hybrid position/force control controls force in some directions and position in others; learned policies increasingly handle contact using force and tactile inputs.", "real": "Peg-in-hole insertion has been a benchmark contact task for decades, and industrial robots with force sensing perform tight-tolerance assembly using spiral search and force-guided insertion strategies.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Regulating contact forces during tasks |\n| Hybrid control | Force along constrained axes, position along free axes |\n| Typical strategies | Compliance, search patterns, force thresholds |\n| Watch out for | Jamming and excessive forces damaging parts |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  APPROACH[Approach hole] --> CONTACT[Detect contact force]\n  CONTACT --> SEARCH[Spiral search with light downward force]\n  SEARCH --> DROP{Sudden drop in height?}\n  DROP -->|yes| INSERT[Insert with force limit]\n  DROP -->|no| SEARCH\n  INSERT --> DONE[Done]\n```\n\n### Worked example\n\n| Axis | Control mode | Setpoint |\n|---|---|---|\n| z (down) | Force | 10 N |\n| x, y | Position (spiral pattern) | Spiral radius growing 0.5 mm per turn |\n| Rotation | Compliant | Low stiffness to self-align |\n| Abort | Force > 40 N | Stop and retract |"}, {"id": 77, "title": "Whole-body control", "tldr": "Humanoids and mobile manipulators coordinate many joints to achieve several goals at once (balance, hand position, gaze, posture) under constraints (contact forces, joint limits). Whole-body controllers often solve quadratic programs every millisecond, prioritizing tasks.", "real": "Task-space inverse dynamics and QP-based whole-body controllers were central to humanoids in the DARPA Robotics Challenge (2015), and Gemini Robotics 2 (July 2026) extended learned control to whole-body humanoid movement.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Coordinating all joints for multiple goals |\n| Methods | Hierarchical QP, task priorities, learned whole-body policies |\n| Constraints | Friction cones, torque limits, contact consistency |\n| Watch out for | Conflicting tasks with unclear priorities |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  P1[Priority 1: balance + contacts] --> QP[Whole-body QP]\n  P2[Priority 2: hand reaches target] --> QP\n  P3[Priority 3: posture + gaze] --> QP\n  LIMITS[Joint + torque limits] --> QP\n  QP --> TORQUES[Joint torques]\n```\n\n### Worked example\n\n| Task | Priority | Reason |\n|---|---|---|\n| Keep center of mass over support | 1 | Falling is catastrophic |\n| Avoid self-collision | 1 | Hardware safety |\n| Reach the shelf | 2 | Main objective |\n| Keep head level | 3 | Camera stability |"}, {"id": 78, "title": "Inverse dynamics and computed torque", "tldr": "Computed-torque control uses the robot’s dynamics model to cancel nonlinear effects (gravity, Coriolis, inertia coupling), turning the robot into a simple linear system that a PD controller can track precisely. Accuracy depends on model quality.", "real": "Gravity compensation, the simplest form of model-based feedforward, is standard in collaborative arms, letting them hold position with low feedback gains and enabling safe hand-guiding.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Model-based torque calculation |\n| Law | τ = M(q)(q̈_d + Kd ė + Kp e) + C(q, q̇)q̇ + g(q) |\n| Benefit | Precise tracking with lower feedback gains |\n| Watch out for | Model errors (payload, friction) degrading performance |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DES[Desired q, q̇, q̈] --> PD[PD on errors]\n  PD --> MODEL[Dynamics model: M, C, g]\n  STATE[Measured q, q̇] --> MODEL\n  MODEL --> TAU[Joint torques]\n  TAU --> ROBOT[Robot]\n  ROBOT --> STATE\n```\n\n### Worked example\n\n```text\nSingle joint holding a 2 kg payload at 0.5 m horizontally:\nGravity feedforward τ_g = 2 × 9.81 × 0.5 = 9.81 N·m\nWithout it, a PD controller with Kp = 100 N·m/rad sags by 9.81 / 100 ≈ 0.098 rad ≈ 5.6°\nWith feedforward, the sag is near zero and feedback only corrects small errors\n```"}, {"id": 79, "title": "Path tracking for mobile robots and vehicles", "tldr": "Path-tracking controllers steer vehicles along planned paths: pure pursuit aims at a lookahead point, Stanley control uses cross-track and heading error, and MPC optimizes over a horizon. Lookahead distance trades smoothness against tracking accuracy.", "real": "Pure pursuit dates back to Carnegie Mellon’s early autonomous vehicle work, and the Stanley controller is named after Stanford’s 2005 DARPA Grand Challenge winner.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Following a path with a moving vehicle |\n| Pure pursuit | Curvature = 2·y_lookahead / L² |\n| Stanley | Steering from heading error + cross-track error |\n| Watch out for | Small lookahead → oscillation; large → corner cutting |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PATH[Path] --> LOOK[Find lookahead point at distance L]\n  POSE[Robot pose] --> LOOK\n  LOOK --> LOCAL[Transform to robot frame]\n  LOCAL --> CURV[Curvature κ = 2y / L²]\n  CURV --> CMD[ω = v · κ]\n```\n\n### Worked example\n\n```python\nimport math\n\ndef pure_pursuit(pose, target, v):\n    x, y, th = pose\n    dx, dy = target[0] - x, target[1] - y\n    local_y = -math.sin(th) * dx + math.cos(th) * dy        # lateral offset in robot frame\n    L2 = dx * dx + dy * dy\n    curvature = 2 * local_y / L2\n    return v * curvature                                     # angular velocity\n\nprint(round(pure_pursuit((0, 0, 0), (1.0, 0.2), v=0.5), 3))  # 0.192 rad/s turn left\n```"}, {"id": 80, "title": "Control in practice", "tldr": "Real controllers must handle actuator saturation, sensor noise, latency, friction, backlash and varying loads. Practical habits: tune on hardware incrementally, add limits and watchdogs, log everything, test disturbances and keep a safe stop path independent of the main controller.", "real": "Sim-to-real research consistently finds that unmodeled actuator dynamics, latency and friction are major causes of controllers working in simulation but failing on hardware.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Making controllers work on real hardware |\n| Practical issues | Saturation, latency, noise, friction, backlash, temperature |\n| Safeguards | Limits, watchdogs, e-stop, rate limiters |\n| Watch out for | Tuning everything at once on a powerful robot |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SIM[Tune in simulation] --> LOW[Hardware: low gains, limited speed]\n  LOW --> STEP[Step tests + logging]\n  STEP --> RAISE[Raise gains gradually]\n  RAISE --> DIST[Disturbance + edge-case tests]\n  DIST --> DEPLOY[Deploy with monitoring]\n```\n\n### Worked example\n\n| Safeguard | Example setting |\n|---|---|\n| Command watchdog | Stop motors if no command for 50 ms |\n| Velocity limit | 0.25 m/s near people (collaborative mode) |\n| Torque limit | 80% of rated continuous torque |\n| Rate limiter | Max change 0.5 m/s² in velocity command |"}, {"id": 81, "title": "Forward kinematics", "tldr": "Forward kinematics computes the end-effector pose from joint angles by chaining link transforms. It’s exact, fast and used constantly: visualization, collision checking, control and converting learned joint actions into Cartesian positions.", "real": "Denavit and Hartenberg introduced their four-parameter convention for describing serial-link kinematics in 1955, and robot description formats such as URDF now encode the same information for software tools.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Joint angles → end-effector pose |\n| Method | Multiply link transforms along the chain |\n| Conventions | Denavit–Hartenberg, URDF joint origins, product of exponentials |\n| Watch out for | Wrong joint zero offsets between model and real robot |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  Q[Joint angles q1, q2, q3...] --> T1[T_0_1 of q1]\n  T1 --> T2[T_1_2 of q2]\n  T2 --> T3[T_2_3 of q3]\n  T3 --> EE[End-effector pose]\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\ndef fk_2link(q1, q2, l1=0.4, l2=0.3):\n    x = l1 * np.cos(q1) + l2 * np.cos(q1 + q2)\n    y = l1 * np.sin(q1) + l2 * np.sin(q1 + q2)\n    return np.array([x, y])\n\nprint(fk_2link(np.radians(30), np.radians(45)).round(4))   # [0.4241 0.4898]\n```"}, {"id": 82, "title": "Inverse kinematics", "tldr": "Inverse kinematics finds joint angles that place the end effector at a desired pose. Simple arms have analytic solutions (often multiple, such as elbow-up and elbow-down); general robots use numerical methods with joint limits and redundancy resolution.", "real": "Analytic IK solvers such as IKFast (OpenRAVE) and numerical solvers such as TRAC-IK and KDL are used with MoveIt to solve arm IK quickly and robustly.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Desired pose → joint angles |\n| Analytic | Closed form, fast, all solutions |\n| Numerical | Iterative (Jacobian-based or optimization), handles general robots |\n| Watch out for | No solution (out of reach), multiple solutions, joint limit violations |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TARGET[Target pose] --> SOLVER[IK solver]\n  LIMITS[Joint limits] --> SOLVER\n  SEED[Current joint angles as seed] --> SOLVER\n  SOLVER --> SOLS[Solutions]\n  SOLS --> PICK[Pick closest to current configuration]\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\ndef ik_2link(x, y, l1=0.4, l2=0.3, elbow_up=True):\n    c2 = (x**2 + y**2 - l1**2 - l2**2) / (2 * l1 * l2)\n    if abs(c2) > 1:\n        raise ValueError(\"Target out of reach\")\n    s2 = np.sqrt(1 - c2**2) * (1 if elbow_up else -1)\n    q2 = np.arctan2(s2, c2)\n    q1 = np.arctan2(y, x) - np.arctan2(l2 * s2, l1 + l2 * c2)\n    return q1, q2\n\nq1, q2 = ik_2link(0.4241, 0.4898)\nprint(np.degrees([q1, q2]).round(1))   # ≈ [30. 45.]\n```"}, {"id": 83, "title": "Jacobians and singularities", "tldr": "The Jacobian maps joint velocities to end-effector velocities (v = J q̇) and, transposed, end-effector forces to joint torques (τ = Jᵀ F). At singularities the Jacobian loses rank: the arm can’t move in some directions and IK becomes ill-conditioned.", "real": "Industrial arms have well-known singularities, such as wrist singularities when two wrist axes align, and motion planners and controllers avoid them or use damped least-squares inverses near them.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Linear map from joint to task velocities |\n| Uses | Velocity control, IK iterations, force mapping, manipulability |\n| Singularity | det(J Jᵀ) ≈ 0; huge joint speeds for small task motions |\n| Watch out for | Paths passing through singular configurations |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  QDOT[Joint velocities q̇] --> J[Jacobian J of q]\n  J --> V[End-effector velocity v]\n  F[End-effector force F] --> JT[J transpose]\n  JT --> TAU[Joint torques τ]\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\ndef jacobian_2link(q1, q2, l1=0.4, l2=0.3):\n    return np.array([\n        [-l1 * np.sin(q1) - l2 * np.sin(q1 + q2), -l2 * np.sin(q1 + q2)],\n        [ l1 * np.cos(q1) + l2 * np.cos(q1 + q2),  l2 * np.cos(q1 + q2)],\n    ])\n\nfor q2 in (np.radians(90), np.radians(5), 0.0):\n    J = jacobian_2link(np.radians(30), q2)\n    print(round(np.degrees(q2)), round(abs(np.linalg.det(J)), 4))   # manipulability → 0 as the arm straightens\n```"}, {"id": 84, "title": "Grasping fundamentals", "tldr": "A stable grasp resists disturbances through contact forces within friction cones. Grasp planning considers object geometry, mass, friction, gripper type, reachability and the task that follows. Learned grasp detectors predict good grasps directly from images or point clouds.", "real": "Dex-Net (Berkeley, 2017) trained grasp quality networks on millions of synthetic grasps, and later learned grasping methods such as Contact-GraspNet (2021) predict 6-DOF grasps from point clouds.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Holding objects securely |\n| Physics | Friction cones, force closure, center of mass |\n| Approaches | Analytic grasp quality, learned grasp detection, policies |\n| Watch out for | Grasping in a way that blocks the next step (e.g. placing) |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  OBS[Point cloud / image] --> CAND[Grasp candidates]\n  CAND --> SCORE[Score: stability, reachability, task]\n  SCORE --> BEST[Best grasp]\n  BEST --> EXEC[Execute + verify with force/vision]\n```\n\n### Worked example\n\n```text\nFriction cone: contact force stays within angle α = atan(μ) of the surface normal\nμ = 0.5 → α ≈ 26.6°\nA finger pushing at 35° from the normal on this surface will slip\n```"}, {"id": 85, "title": "Dexterous in-hand manipulation", "tldr": "Dexterous manipulation reorients and repositions objects within the hand using multiple fingers, requiring coordinated contacts, tactile sensing and fast control. Reinforcement learning in simulation with domain randomization produced landmark results, but reliability in everyday tasks remains a frontier.", "real": "OpenAI trained a Shadow Dexterous Hand to solve a Rubik’s Cube one-handed in 2019 using reinforcement learning in simulation with automatic domain randomization.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Fine object manipulation with fingers |\n| Challenges | Many DOF, intermittent contacts, occlusion, hardware fragility |\n| Methods | RL in sim, teleoperated demonstrations, tactile feedback |\n| Watch out for | Hand hardware wear and calibration drift |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SIM[Simulation with randomized physics] --> RL[RL policy]\n  RL --> HAND[Real multi-finger hand]\n  TOUCH[Tactile + vision feedback] --> HAND\n  HAND --> REORIENT[Object reoriented]\n```\n\n### Worked example\n\n| Dexterity level | Example task |\n|---|---|\n| Power grasp | Hold a bottle |\n| Precision grasp | Pick a coin |\n| In-hand reorientation | Rotate a pen to writing position |\n| Tool use | Use scissors or a screwdriver |"}, {"id": 86, "title": "Contact-rich manipulation", "tldr": "Many valuable tasks involve sustained contact: insertion, wiping, opening doors, using tools, kitting and assembly. Success depends on compliance, force feedback and policies that react to contact events rather than following fixed paths.", "real": "Learned policies with force and tactile inputs have improved success on insertion and assembly benchmarks, and industrial cells use force-controlled robots for tight-tolerance insertion that pure position control can’t achieve.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Tasks where contact is the point |\n| Needs | Compliance, force/torque sensing, reactive policies |\n| Examples | Door opening, plug insertion, screwing, wiping |\n| Watch out for | Positional errors of a few millimeters causing jams |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  APPROACH[Approach] --> CONTACT[Make contact]\n  CONTACT --> REGULATE[Regulate force / follow constraint]\n  REGULATE --> EVENT{Contact event?}\n  EVENT -->|aligned| PROCEED[Proceed]\n  EVENT -->|jam| ADJUST[Wiggle / realign]\n```\n\n### Worked example\n\n| Task | Constraint the robot must follow |\n|---|---|\n| Opening a door | Handle moves on an arc around hinges |\n| Turning a valve | Rotation about valve axis |\n| Wiping a table | Stay on plane with steady force |\n| Plug insertion | Align axis, then push along it |"}, {"id": 87, "title": "Deformable objects", "tldr": "Cloth, cables, bags, food and soft packaging change shape when handled, making state estimation and planning hard. Learned policies from demonstrations have driven recent progress on laundry folding and cable handling.", "real": "Physical Intelligence demonstrated laundry folding with its π models, and a partner reported improved folding autonomy with each model generation from π0.5 to π0.6 in 2026.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Manipulating non-rigid objects |\n| Challenges | Infinite-dimensional state, self-occlusion, simulation difficulty |\n| Approaches | Imitation learning, keypoint representations, dynamic flinging |\n| Watch out for | Success metrics that ignore quality (e.g. messy folds) |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PILE[Crumpled shirt] --> PICK[Pick a corner]\n  PICK --> FLATTEN[Shake / flatten]\n  FLATTEN --> ALIGN[Align on table]\n  ALIGN --> FOLD[Fold sequence]\n  FOLD --> CHECK{Fold quality OK?}\n  CHECK -->|no| FLATTEN\n```\n\n### Worked example\n\n| Metric for folding | Why |\n|---|---|\n| Success rate | Completed vs abandoned |\n| Time per item | Economic viability |\n| Fold quality score | Presentability |\n| Interventions per hour | Autonomy level |"}, {"id": 88, "title": "Bimanual manipulation", "tldr": "Two arms enable tasks one arm can’t do: holding while manipulating, handling large objects, tying, folding and handovers. Bimanual policies must coordinate timing and avoid arm collisions; low-cost bimanual teleoperation rigs greatly expanded available data.", "real": "Stanford’s ALOHA (2023) introduced a low-cost bimanual teleoperation system and ACT policies for fine-grained two-arm tasks, followed by Mobile ALOHA in January 2024.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Coordinated two-arm manipulation |\n| Roles | Stabilizer + actor, symmetric, handover |\n| Data | Bimanual teleoperation (leader–follower arms) |\n| Watch out for | Arms colliding; timing mismatches |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LEFT[Left arm: hold jar] --> SYNC[Coordinated policy]\n  RIGHT[Right arm: twist lid] --> SYNC\n  SYNC --> RESULT[Jar opened]\n```\n\n### Worked example\n\n| Task | Left arm | Right arm |\n|---|---|---|\n| Open a jar | Hold and stabilize | Twist lid |\n| Fold a towel | Hold one corner | Bring other corner across |\n| Insert battery | Hold device | Insert battery |"}, {"id": 89, "title": "Mobile manipulation", "tldr": "Mobile manipulators combine a moving base with arms, extending workspace to whole buildings. They must coordinate navigation and manipulation, handle base positioning for reachability and work in cluttered, changing human environments.", "real": "Physical Intelligence’s π0.5 (2025) demonstrated mobile manipulators cleaning kitchens and bedrooms in homes not seen during training, highlighting progress in generalizable mobile manipulation.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Manipulation while moving through environments |\n| Challenges | Base placement, whole-body coordination, long horizons |\n| Approaches | Navigate-then-manipulate, whole-body planning, end-to-end policies |\n| Watch out for | Accumulated localization errors affecting grasps |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  NAV[Navigate to area] --> BASE[Choose base pose for reachability]\n  BASE --> PERCEIVE[Perceive objects]\n  PERCEIVE --> MANIP[Manipulate]\n  MANIP --> NEXT[Next sub-task]\n  NEXT --> NAV\n```\n\n### Worked example\n\n| Task: tidy a bedroom | Sub-skills |\n|---|---|\n| Find clothes on floor | Search + open-vocabulary detection |\n| Pick up clothes | Deformable grasping |\n| Walk to laundry basket | Navigation |\n| Place in basket | Placement |\n| Make the bed | Bimanual cloth manipulation |"}, {"id": 90, "title": "Evaluating manipulation", "tldr": "Manipulation is evaluated with real-world trials (success rate, time, interventions), standardized object sets, simulation benchmarks and head-to-head policy arenas. Results depend heavily on protocol details, so report trials, conditions and failure types.", "real": "The YCB object set (2015) standardized physical test objects, simulation benchmarks such as LIBERO (2023) evaluate learned policies, and distributed real-world evaluations such as RoboArena compare generalist policies.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Measuring manipulation performance |\n| Metrics | Success rate, task progress, time, interventions, generalization splits |\n| Tools | Standard objects, sim benchmarks, arenas, blind A/B evaluations |\n| Watch out for | Cherry-picked demos and tiny trial counts |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PROTOCOL[Fixed protocol: objects, scenes, instructions] --> TRIALS[Many trials per policy]\n  TRIALS --> METRICS[Success, progress, time]\n  METRICS --> SPLITS[Seen vs unseen objects/scenes]\n  SPLITS --> REPORT[Report with confidence intervals]\n```\n\n### Worked example\n\n```text\nPolicy A: 42 / 50 successes = 84%; 95% CI ≈ ±10 points (normal approximation: 1.96 × sqrt(0.84 × 0.16 / 50) ≈ 0.10)\nPolicy B: 45 / 50 = 90%\nThe difference (6 points) is within the uncertainty → run more trials before claiming B is better\n```"}, {"id": 91, "title": "Wheeled and tracked robots", "tldr": "Wheels are efficient and simple on flat ground. Differential drive (two driven wheels) is most common; omnidirectional (mecanum, omni wheels) moves sideways; Ackermann steering suits cars; tracks handle rough terrain at the cost of efficiency and odometry accuracy.", "real": "Amazon’s warehouse robots, descended from Kiva Systems (acquired in 2012 for $775 million), are wheeled drive units; Amazon reported deploying its one millionth robot in July 2025.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Ground mobility with wheels or tracks |\n| Types | Differential, skid-steer, mecanum/omni, Ackermann, tracked |\n| Constraint | Nonholonomic: many can’t move sideways directly |\n| Watch out for | Slip on skid-steer and tracked robots corrupting odometry |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  ENV{Environment} -->|flat indoor, tight spaces| DIFF[Differential drive]\n  ENV -->|need sideways motion| OMNI[Mecanum / omni wheels]\n  ENV -->|roads, higher speed| ACK[Ackermann steering]\n  ENV -->|mud, rubble, snow| TRACK[Tracks]\n```\n\n### Worked example\n\n```python\ndef wheel_speeds(v, omega, wheel_base=0.4, wheel_radius=0.05):\n    \"\"\"Differential drive: body velocity (m/s, rad/s) → wheel angular speeds (rad/s).\"\"\"\n    v_left = v - omega * wheel_base / 2\n    v_right = v + omega * wheel_base / 2\n    return round(v_left / wheel_radius, 3), round(v_right / wheel_radius, 3)\n\nprint(wheel_speeds(0.5, 0.5))   # (8.0, 12.0) rad/s\n```"}, {"id": 92, "title": "Legged locomotion basics", "tldr": "Legs handle stairs, gaps and rough terrain by choosing footholds. Locomotion alternates stance (foot on ground pushing) and swing (foot moving) phases organized into gaits; balance can be static (center of mass over support) or dynamic (stable through motion).", "real": "Boston Dynamics’ Spot, commercially available since 2020, and ANYbotics’ ANYmal are widely deployed quadrupeds for industrial inspection on stairs, grates and uneven terrain.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Walking and running with legs |\n| Concepts | Stance, swing, gait, support polygon, ground reaction forces |\n| Balance | Static (slow) vs dynamic (fast, continuous correction) |\n| Watch out for | Slippery surfaces violating friction assumptions |\n\n### Diagram\n\n```mermaid\nstateDiagram-v2\n  [*] --> Stance\n  Stance --> LiftOff: phase complete\n  LiftOff --> Swing\n  Swing --> TouchDown: foot contact detected\n  TouchDown --> Stance\n```\n\n### Worked example\n\n| Gait (quadruped) | Legs in stance | Character |\n|---|---|---|\n| Walk | 3 at a time | Statically stable, slow |\n| Trot | 2 diagonal pairs | Dynamic, common default |\n| Pace | 2 same-side pairs | Dynamic |\n| Bound / gallop | Front pair, rear pair | Fast, aerial phases |"}, {"id": 93, "title": "ZMP and the linear inverted pendulum", "tldr": "Classical biped walking keeps the zero moment point (where net ground reaction moment is zero) inside the support polygon. The linear inverted pendulum model (LIPM) approximates the body as a point mass at constant height, enabling fast planning of center-of-mass motion.", "real": "Miomir Vukobratović introduced the zero moment point concept around 1968–1972, and Honda’s ASIMO (2000) and many later humanoids used ZMP-based walking control.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Simplified models for biped balance |\n| ZMP rule | Keep ZMP inside the support polygon |\n| LIPM dynamics | ẍ = (g / z_c)(x − p), p = ZMP position |\n| Watch out for | Assuming flat ground and no slipping |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  FOOTSTEPS[Planned footsteps] --> ZMPREF[ZMP reference inside feet]\n  ZMPREF --> LIPM[LIPM: compute CoM trajectory]\n  LIPM --> WBC[Whole-body control]\n  WBC --> ROBOT[Joint torques]\n```\n\n### Worked example\n\n```text\nLIPM natural frequency ω = sqrt(g / z_c)\nCoM height z_c = 0.9 m → ω = sqrt(9.81 / 0.9) ≈ 3.30 rad/s\nCapture point (where to step to stop): ξ = x + ẋ / ω\nCoM at x = 0, moving at ẋ = 0.5 m/s → step ≈ 0.5 / 3.30 ≈ 0.15 m ahead\n```"}, {"id": 94, "title": "Quadruped robots", "tldr": "Quadrupeds balance more easily than bipeds and are mature for inspection, security and research. Modern controllers combine model-based MPC with learned RL policies trained in simulation, enabling robust walking on stairs, slopes and debris.", "real": "ETH Zurich’s 2019 and 2020 work with ANYmal showed RL policies trained in simulation transferring to real quadrupeds, and 2022 research demonstrated perceptive locomotion on challenging hiking trails.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Four-legged robots |\n| Strengths | Stability, terrain capability, payload for sensors |\n| Applications | Industrial inspection, security, research, mapping |\n| Watch out for | Battery life limiting mission length |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SIM[Massively parallel simulation] --> RL[RL locomotion policy]\n  RL --> REAL[Real quadruped]\n  TERRAIN[Height map from sensors] --> RL\n  PROPRIO[IMU + joint states] --> RL\n```\n\n### Worked example\n\n| Platform (examples) | Typical use |\n|---|---|\n| Boston Dynamics Spot | Industrial inspection, data capture |\n| ANYbotics ANYmal | Inspection in oil, gas and power facilities |\n| Unitree Go2 / B2 | Research, education, commercial |"}, {"id": 95, "title": "Bipedal walking", "tldr": "Bipeds have small support areas and must balance dynamically, using foot placement, ankle and hip strategies and whole-body coordination. Learning-based controllers trained in simulation now produce robust humanoid walking, running and recovery.", "real": "Agility Robotics’ Digit and the humanoids from Unitree, Figure, Boston Dynamics and others use combinations of model-based control and RL-trained policies for walking in real facilities.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Two-legged locomotion |\n| Strategies | Ankle, hip, stepping (foot placement) |\n| Approaches | ZMP/MPC, capture point control, RL policies |\n| Watch out for | Narrow stability margins when carrying loads |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  PUSH[Disturbance push] --> SMALL{Small?}\n  SMALL -->|yes| ANKLE[Ankle strategy]\n  SMALL -->|medium| HIP[Hip strategy]\n  SMALL -->|large| STEP[Take a step: capture point]\n```\n\n### Worked example\n\n| Strategy | Recovers from |\n|---|---|\n| Ankle torque | Small pushes (CoP shift within foot) |\n| Hip motion | Medium pushes (angular momentum) |\n| Stepping | Large pushes (move support to capture point) |"}, {"id": 96, "title": "RL for locomotion", "tldr": "Reinforcement learning trains locomotion policies in GPU-parallel simulation with thousands of robots, randomized terrain and physics, then deploys them on hardware. Rewards encourage velocity tracking, stability, energy efficiency and smooth motion.", "real": "Rudin and colleagues (2021) showed legged locomotion policies could be trained in minutes using thousands of parallel simulated robots in Isaac Gym, a workflow now common in Isaac Lab and MuJoCo Playground.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Learning gaits through trial and error in simulation |\n| Ingredients | Parallel sim, domain randomization, terrain curriculum, reward shaping |\n| Policy inputs | Proprioception, commands, optionally height maps |\n| Watch out for | Reward hacking: odd gaits that technically maximize reward |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ENVS[4,096 parallel simulated robots] --> ROLLOUT[Collect experience]\n  ROLLOUT --> PPO[PPO update]\n  PPO --> POLICY[Policy]\n  POLICY --> ENVS\n  CURRICULUM[Harder terrain as skills improve] --> ENVS\n  POLICY --> DEPLOY[Deploy on real robot]\n```\n\n### Worked example\n\n| Reward term | Weight (example) | Purpose |\n|---|---|---|\n| Track commanded velocity | +1.0 | Main objective |\n| Penalize body roll/pitch | −0.5 | Stability |\n| Penalize joint torques | −0.0001 | Energy efficiency |\n| Penalize action changes | −0.01 | Smoothness |\n| Feet air time | +0.5 | Natural stepping |"}, {"id": 97, "title": "Perceptive locomotion", "tldr": "Blind locomotion relies on proprioception; perceptive locomotion uses cameras or LiDAR to build height maps and plan footsteps over stairs, gaps and obstacles. Robust controllers blend perception with proprioception when perception is unreliable.", "real": "Miki and colleagues (Science Robotics, 2022) combined exteroceptive and proprioceptive inputs in a learned policy that let ANYmal complete a hiking route and handle terrain where perception was misleading.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Locomotion using sensing of the terrain ahead |\n| Inputs | Height maps, depth images, proprioception |\n| Benefit | Stairs, gaps, stepping stones |\n| Watch out for | Grass, snow and water making height maps misleading |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DEPTH[Depth / LiDAR] --> HEIGHTMAP[Local height map]\n  HEIGHTMAP --> POLICY[Locomotion policy]\n  PROPRIO[Proprioception] --> POLICY\n  POLICY --> BELIEF[Belief: trust perception or proprioception]\n  POLICY --> FEET[Foot placement + joint targets]\n```\n\n### Worked example\n\n| Terrain | Perception reliability | Robust behavior |\n|---|---|---|\n| Stairs | High | Use height map for foot placement |\n| Tall grass | Low (looks like obstacle) | Rely on proprioception |\n| Deep snow | Low | Probe with feet, adapt gait |"}, {"id": 98, "title": "Humanoid whole-body motion", "tldr": "Humanoids combine walking, balance and manipulation: carrying boxes, crouching, reaching high shelves, using both hands. Approaches include whole-body controllers, motion retargeting from human data and end-to-end learned policies controlling all joints.", "real": "Google DeepMind’s Gemini Robotics 2 (July 2026) controlled humanoids “from feet to fingertips,” and Boston Dynamics’ production Atlas, shown at CES 2026, was designed to lift items up to 50 kg in industrial settings.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Coordinated locomotion + manipulation in humanoids |\n| Methods | Whole-body QP control, motion retargeting, learned whole-body policies |\n| Data | Motion capture, teleoperation, human video |\n| Watch out for | Loss of balance when manipulating heavy objects at arm’s length |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  HUMAN[Human motion data] --> RETARGET[Retarget to robot kinematics]\n  RETARGET --> TRACK[Train tracking policy in sim]\n  TASK[Task commands] --> POLICY[Whole-body policy]\n  TRACK --> POLICY\n  POLICY --> JOINTS[All joints]\n```\n\n### Worked example\n\n```text\nCarrying a 10 kg box held 0.5 m in front of the body (robot mass 70 kg):\nCombined CoM shifts forward by ≈ 10 × 0.5 / (70 + 10) = 0.0625 m\nThe robot must lean back or shift hips ≈ 6 cm to keep the CoM over its feet\n```"}, {"id": 99, "title": "Falls and recovery", "tldr": "Legged robots will fall. Good designs detect imminent falls, fall in controlled ways to protect hardware and people, and get back up autonomously. Fall safety is especially important for heavy humanoids working near people.", "real": "Quadrupeds such as Spot can self-right after falls, and learned get-up policies for humanoids, trained in simulation, have been demonstrated by several research groups and companies.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Handling loss of balance safely |\n| Steps | Detect → protective falling → assess damage → stand up |\n| Design | Protective padding, compliant joints, falling strategies |\n| Watch out for | A falling 60+ kg humanoid near people |\n\n### Diagram\n\n```mermaid\nstateDiagram-v2\n  [*] --> Walking\n  Walking --> FallDetected: CoM outside capturable region\n  FallDetected --> ProtectiveFall: bend knees, reduce stiffness\n  ProtectiveFall --> Grounded\n  Grounded --> SelfCheck\n  SelfCheck --> GetUp: healthy\n  SelfCheck --> RequestHelp: fault detected\n  GetUp --> Walking\n```\n\n### Worked example\n\n```text\nKinetic energy of a falling humanoid: CoM drops ~0.5 m, mass 60 kg\nPotential energy released = m·g·h = 60 × 9.81 × 0.5 ≈ 294 J\n→ Keep safe distances from people and design controlled falls\n```"}, {"id": 100, "title": "Aerial robots", "tldr": "Multirotor drones control position and attitude by varying rotor thrusts; fixed-wing drones are efficient for long distances. Key challenges are flight time, wind, GPS-denied navigation, obstacle avoidance and airspace regulation.", "real": "Zipline began delivering medical supplies by fixed-wing drone in Rwanda in 2016, and later expanded to other countries and US home delivery, one of the longest-running autonomous delivery operations.", "body": "##

<title>Physical AI: 200 Chapters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2F5; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#171A21; --muted:#575D6B; --line:#D9DCE4;
  --accent:#4F46E5; --accent-soft:#E7E6FC; --accent-ink:#FFFFFF;
  --amber:#B97A0B; --tldr-bg:#FFF5DC; --tldr-line:#D49A22;
  --indigo:#0F5E57; --real-bg:#E0F1EE; --real-line:#2F8A80;
  --code-bg:#181A16; --code-ink:#E6E9E1; --inline-code:#E9ECE4;
  --cell-empty:#DCE0D6; --shadow:0 1px 0 rgba(24,26,22,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
    --accent:#A5B4FC; --accent-soft:#1E1F44; --accent-ink:#11122E;
    --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
    --indigo:#8FD5CB; --real-bg:#0F2522; --real-line:#4FA79B;
    --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
    --cell-empty:#2E332B; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
  --accent:#A5B4FC; --accent-soft:#1E1F44; --accent-ink:#11122E;
  --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
  --indigo:#8FD5CB; --real-bg:#0F2522; --real-line:#4FA79B;
  --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
  --cell-empty:#2E332B; --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header with the memory-bank progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:20px;padding:12px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted)}
.bank{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bank-row{display:flex;gap:4px;flex-wrap:nowrap;min-width:0}
.bank-group{flex:1;min-width:0;display:flex;gap:2px;padding:3px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.cell{flex:1;min-width:2px;max-width:10px;height:18px;border-radius:2px;background:var(--cell-empty);border:0;padding:0;cursor:pointer;transition:background .2s}
.cell.done{background:var(--accent)}
.cell.here{box-shadow:0 0 0 2px var(--amber)}
.bank-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bank-meta strong{color:var(--ink);font-weight:600}
.top-actions{display:flex;gap:8px}
.btn{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.menu-btn{display:none}

/* Shell */
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,76px));height:calc(100dvh - var(--top-h,76px) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg)}
.search{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
.part{margin-bottom:4px}
.part-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:8px;cursor:pointer}
.part-head:hover{background:var(--surface-2)}
.part-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);width:22px;flex:none}
.part-name{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.part-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.part-count.full{color:var(--accent);font-weight:600}
.part-list{list-style:none;margin:0 0 6px;padding:0 0 0 30px;display:none}
.part.open .part-list{display:block}
.ch-row{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:6px}
.ch-row.active{background:var(--accent-soft)}
.ch-row a{flex:1;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.ch-row a .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.tick{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:11px;height:11px;opacity:0}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{opacity:1;color:var(--accent-ink)}
.hidden{display:none!important}

/* Main reading area */
.main{padding:24px 32px 80px;min-width:0}
.crumb{font-size:14px;color:var(--muted);margin:0 0 12px}
.crumb a{color:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;font-size:14px;color:var(--muted);max-width:240px;text-align:left}
.tab .tab-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--cell-empty)}
.tab .dot.on{background:var(--accent)}
article{max-width:780px}
.ch-no{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--accent);font-size:15px;margin:0}
h1.ch-title{font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:6px 0 22px;font-weight:700;text-wrap:balance}
.box{border-radius:10px;padding:16px 18px;margin:0 0 26px;border-left:4px solid}
.box h2{font-size:14px;margin:0 0 6px;font-weight:600}
.box p{margin:0}
.tldr{background:var(--tldr-bg);border-color:var(--tldr-line)}
.tldr h2{color:var(--amber)}
.tldr p{font-size:17px;line-height:1.55}
.real{background:var(--real-bg);border-color:var(--real-line);margin-top:34px}
.real h2{color:var(--indigo)}
.body h3{font-size:20px;margin:30px 0 10px;letter-spacing:-.01em}
.body p{margin:0 0 14px}
.body ul,.body ol{padding-left:22px;margin:0 0 16px}
.body li{margin:4px 0}
.body li input[type=checkbox]{margin-right:6px;accent-color:var(--accent)}
.body code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.88em;background:var(--inline-code);padding:1px 5px;border-radius:4px}
.body pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13.5px;line-height:1.55;margin:0 0 18px}
.body pre code{background:none;padding:0;font-size:inherit;color:inherit}
.table-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.body table{border-collapse:collapse;width:100%;font-size:14px}
.body th,.body td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.body th{background:var(--surface-2);font-weight:600}
.body tr:last-child td{border-bottom:0}
.body strong{font-weight:600}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.complete{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:15px}
.complete .tick{border-color:currentColor;pointer-events:none}
.complete.on{background:var(--accent);color:var(--accent-ink)}
.complete.on .tick{background:var(--accent-ink);border-color:var(--accent-ink)}
.complete.on .tick svg{opacity:1;color:var(--accent)}
.nav{display:flex;gap:8px}
.nav .btn[disabled]{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}

/* Diagrams and charts */
.diagram{margin:0 0 20px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
.diagram svg{display:block;margin:0 auto;height:auto}
.diagram.loading{color:var(--muted);font-size:14px}
.chart{margin:0 0 20px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chart figcaption{font-weight:600;font-size:14px;margin:0 0 10px}
.bar-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.bar-label{color:var(--ink);line-height:1.3}
.bar-track{height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar{display:block;height:100%;background:var(--accent);border-radius:7px 0 0 7px}
.bar-val{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.chart-note{font-size:12px;color:var(--muted);margin-top:6px}

/* Contents view */
.contents h1{font-size:32px;margin:0 0 6px;letter-spacing:-.02em}
.contents .lead{color:var(--muted);margin:0 0 24px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.pcard h2{font-size:15px;margin:0 0 2px;line-height:1.3}
.pcard .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pcard ol{list-style:none;padding:0;margin:0}
.pcard li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13.5px;line-height:1.35}
.pcard li a{color:var(--ink);text-decoration:none;flex:1}
.pcard li a:hover{text-decoration:underline}
.contents-actions{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}

/* Mobile */
.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);height:auto;z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .menu-btn{display:inline-block}
  .main{padding:18px 16px 60px}
  .top-inner{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand{flex:1}
  .bank{order:3;flex-basis:100%}
  .bank-row{gap:3px}
  .bank-group{gap:1px;padding:2px}
  .cell{height:12px;max-width:none;min-width:0}
  .bank-row{flex-wrap:wrap;row-gap:3px;gap:3px}
  .bank-group{flex:0 0 calc(10% - 2.7px);gap:1px;padding:1px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>

  <div class="top-inner">

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const CHAPTERS = [{"id": 1, "title": "What physical AI is", "tldr": "Physical AI is artificial intelligence that perceives, reasons about and acts in the physical world through a body: robots, autonomous vehicles, drones and smart machines. It combines perception, world understanding, decision-making and motor control under real physics, noise and safety constraints.", "real": "NVIDIA’s CEO Jensen Huang framed “physical AI” as the next wave of AI at CES 2025, and by 2026 Physical Intelligence, Google DeepMind, NVIDIA, Tesla, Figure and others were all building foundation models meant to control real robots.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | AI embodied in machines that sense and act in the real world |\n| Core loop | Sense → understand → decide → act → observe consequences |\n| Why it matters | Moves AI from screens into factories, roads, homes and hospitals |\n| Watch out for | Physical mistakes can injure people or break things; errors aren’t just wrong text |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  WORLD[Physical world] --> SENSE[Sensors: cameras, LiDAR, IMU, touch]\n  SENSE --> PERCEIVE[Perception + state estimation]\n  PERCEIVE --> DECIDE[Planning / learned policy]\n  DECIDE --> ACT[Actuators: motors, wheels, grippers]\n  ACT --> WORLD\n```\n\n### Worked example\n\n| System | Sense | Decide | Act |\n|---|---|---|---|\n| Robotaxi | Cameras, LiDAR, radar | Driving policy + planner | Steering, braking, throttle |\n| Warehouse arm | Depth cameras | Grasp selection | Arm + suction gripper |\n| Humanoid | Head cameras, joint encoders, IMU | Vision-language-action model | 20–70 joint motors |\n| Delivery drone | GPS, cameras, IMU | Flight planner | Rotor speeds |"}, {"id": 2, "title": "A short history of robotics and embodied AI", "tldr": "Robotics moved from programmed industrial arms (1960s) through mobile robots and probabilistic methods (1990s–2000s), autonomous vehicle challenges (2000s), deep learning for perception (2010s), to learned policies and robot foundation models (2020s).", "real": "Unimate, the first industrial robot, began work at a General Motors plant in 1961; Stanford’s Stanley won the 2005 DARPA Grand Challenge; and Google’s RT-2 (2023) showed vision-language models could be fine-tuned to output robot actions.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Evolution of robots from scripted to learning machines |\n| Why it matters | Explains which techniques endure and which are new |\n| Enduring ideas | Kinematics, control theory, probabilistic estimation, planning |\n| New ideas | Large-scale learning, foundation models, simulation at scale |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  A[1961: Unimate at GM] --> B[1966–72: Shakey at SRI]\n  B --> C[1990s–2000s: probabilistic robotics, SLAM]\n  C --> D[2004–2007: DARPA vehicle challenges]\n  D --> E[2012+: deep learning perception]\n  E --> F[2016–2020: deep RL, sim-to-real]\n  F --> G[2022+: transformers, VLAs, robot foundation models]\n```\n\n### Worked example\n\n| Era | Typical approach to “pick up a cup” |\n|---|---|\n| 1970s–1990s | Hand-coded positions in a fixed workcell |\n| 2000s | Model-based perception + grasp planning |\n| 2010s | Deep learning to detect grasp points |\n| 2020s | Policy trained on demonstrations, conditioned on “pick up the cup” |"}, {"id": 3, "title": "Moravec’s paradox", "tldr": "Tasks that are hard for humans (chess, calculus) are often easy for computers, while tasks that are easy for humans (walking, grasping a mug, folding laundry) are very hard for machines. Physical AI is largely the work of overcoming this paradox.", "real": "Hans Moravec described this in his 1988 book “Mind Children”, and Physical Intelligence’s December 2025 “Robot Olympics” post revisited it, noting that physical skills can’t be programmed from conscious understanding because humans don’t understand them consciously.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Observation that sensorimotor skills are computationally hard |\n| Why | Evolution optimized perception and motor skills over hundreds of millions of years |\n| Implication | Physical skills must be learned from experience and data |\n| Watch out for | Assuming a demo of one task means general capability |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  HUMANHARD[Hard for humans: chess, math] --> EASYAI[Solved early by computers]\n  HUMANEASY[Easy for humans: walking, folding, grasping] --> HARDAI[Still hard for robots]\n  HARDAI --> LEARN[Requires data, learning, embodiment]\n```\n\n### Worked example\n\n| Task | Difficulty for a 5-year-old | Difficulty for robots (2026) |\n|---|---|---|\n| Multiply 347 × 29 | Hard | Trivial |\n| Fold a T-shirt | Easy | Achievable in demos; reliability still improving |\n| Tie shoelaces | Medium | Very hard |\n| Walk on uneven ground | Easy | Largely solved for quadrupeds; improving for humanoids |"}, {"id": 4, "title": "The sense–think–act loop", "tldr": "Robots run a continuous loop: sensors measure the world, software estimates state and decides, actuators apply forces, and the world changes. Loops run at different rates: fast control (hundreds to thousands of Hz) under slower planning and reasoning.", "real": "Industrial and legged robots commonly run joint-level control loops at 1 kHz or faster, while vision-based policies and planners run at roughly 5–50 Hz, a layered pattern used in most modern robots.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The basic architecture of every robot |\n| Rates | Reasoning \\~0.1–1 Hz, policy \\~5–50 Hz, control \\~200–1,000+ Hz |\n| Why it matters | Timing and latency determine stability and safety |\n| Watch out for | Slow perception or networks inside fast control loops |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  REASON[High-level reasoning: ~1 Hz] --> POLICY[Policy / planner: ~10–50 Hz]\n  POLICY --> CONTROL[Joint control: ~1 kHz]\n  CONTROL --> MOTORS[Motors]\n  MOTORS --> SENSORS[Sensors]\n  SENSORS --> CONTROL\n  SENSORS --> POLICY\n  SENSORS --> REASON\n```\n\n### Worked example\n\n```text\nControl loop at 1 kHz → period = 1 ms\nPolicy at 50 Hz → period = 20 ms → 20 control steps per policy output\nCamera at 30 fps → new image every 33.3 ms\nA 100 ms network delay = 100 control cycles of stale commands → keep tight loops on the robot\n```"}, {"id": 5, "title": "Embodiment and form factors", "tldr": "A robot’s body determines what it can do and how it must be controlled: fixed arms, mobile bases, quadrupeds, humanoids, vehicles, drones and specialized machines. The best form factor is the simplest one that fits the task and environment.", "real": "Humanoids attracted billions in investment by 2026 because they fit human-designed environments, yet wheeled mobile manipulators and fixed arms remained far more common in deployed industrial automation.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The physical design of the robot |\n| Factors | Workspace, payload, mobility, dexterity, cost, safety |\n| Trend | General-purpose forms (humanoids, mobile manipulators) vs specialized machines |\n| Watch out for | Choosing a humanoid where a conveyor and arm would do |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  TASK{Task environment} -->|fixed workcell| ARM[Fixed arm / cobot]\n  TASK -->|flat floors, moving goods| AMR[Wheeled AMR / mobile manipulator]\n  TASK -->|stairs, rough terrain| LEGS[Quadruped]\n  TASK -->|human spaces, varied tasks| HUMANOID[Humanoid]\n  TASK -->|roads| VEHICLE[Autonomous vehicle]\n  TASK -->|air| DRONE[Drone]\n```\n\n### Worked example\n\n| Form factor | Strengths | Limits |\n|---|---|---|\n| Fixed industrial arm | Fast, precise, reliable | No mobility |\n| Wheeled mobile manipulator | Efficient, stable, cheaper than legs | Stairs, clutter |\n| Quadruped | Rough terrain, stairs | Limited manipulation |\n| Humanoid | Human tools and spaces | Complexity, cost, balance, power |"}, {"id": 6, "title": "The physical AI landscape", "tldr": "The ecosystem spans robot makers, robot “brain” model developers, simulation and compute platforms, component suppliers, AV companies and integrators. Many companies now separate the general-purpose AI model from the robot hardware.", "real": "Physical Intelligence builds models (π family) rather than hardware, NVIDIA supplies GR00T models, Isaac simulation and Jetson Thor computers, and Google DeepMind partnered with Boston Dynamics in January 2026 to bring Gemini Robotics models to Atlas.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Map of companies and roles |\n| Layers | Hardware, compute, simulation, models, data, applications |\n| Trend | “Robot brains” as a horizontal layer across many bodies |\n| Watch out for | Demo videos without disclosed autonomy level or success rates |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  APPS[Applications: factories, logistics, homes, roads] --> ROBOTS[Robot makers: Boston Dynamics, Figure, Agility, Tesla, Unitree, ABB, FANUC]\n  ROBOTS --> MODELS[Robot models: π, Gemini Robotics, GR00T, Helix]\n  MODELS --> SIM[Simulation + world models: Isaac, MuJoCo, Cosmos]\n  SIM --> COMPUTE[Compute: Jetson Thor, GPUs, custom chips]\n  ROBOTS --> PARTS[Components: actuators, sensors, batteries, hands]\n```\n\n### Worked example\n\n| Layer | Examples (2026) |\n|---|---|\n| Robot foundation models | Physical Intelligence π0.7, Google DeepMind Gemini Robotics 2, NVIDIA GR00T N1.6/N2, Figure Helix |\n| Humanoid makers | Boston Dynamics, Figure, Agility, Tesla, Unitree, Apptronik, 1X, AgiBot |\n| Simulation | NVIDIA Isaac Sim/Lab, MuJoCo, Gazebo, Genesis |\n| Autonomous driving | Waymo, Tesla, Zoox, Baidu Apollo Go, Wayve, Aurora |"}, {"id": 7, "title": "Deployment reality today", "tldr": "Most deployed robots are still industrial arms and warehouse machines running structured tasks; autonomous driving has reached real commercial scale in some cities; humanoids and general-purpose robot models are moving from pilots into early production.", "real": "The International Federation of Robotics reported about 542,000 industrial robots installed worldwide in 2024, with China accounting for over half, and Waymo was delivering more than 500,000 paid driverless rides per week in 2026.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | What’s actually deployed vs demoed |\n| Mature | Industrial arms, warehouse AMRs, vacuum robots, some robotaxi services |\n| Emerging | Humanoids in factories, general-purpose manipulation, home robots |\n| Watch out for | Confusing pilots or teleoperated demos with autonomous scale deployment |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  MATURE[Mature: industrial arms, AMRs, vacuums] --> SCALING[Scaling: robotaxis, warehouse picking]\n  SCALING --> PILOT[Pilots: humanoids in factories]\n  PILOT --> RESEARCH[Research/early: general home robots]\n```\n\n### Worked example\n\n| Questions to ask about any robot demo | Why |\n|---|---|\n| Autonomous or teleoperated? | Many demos are partly remote-controlled |\n| Success rate over how many trials? | One clip may hide many failures |\n| Sped up? | Speed matters for economics |\n| Same objects as training? | Generalization is the hard part |\n| Hours of continuous operation? | Reliability drives deployment |"}, {"id": 8, "title": "Why physical AI is accelerating now", "tldr": "Several trends converged: foundation models with world knowledge, transformer and diffusion policies that learn from demonstrations, GPU-accelerated simulation, cheaper hardware and actuators, edge AI computers, and large investment.", "real": "NVIDIA’s Rev Lebaredian said in March 2026 that $20 billion had been invested in humanoid robots, while Physical Intelligence was reported in 2026 to be raising at more than an $11 billion valuation.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Drivers of the current wave |\n| Technical drivers | VLMs, imitation learning at scale, sim, world models, edge compute |\n| Economic drivers | Labor shortages, falling hardware costs, investment |\n| Watch out for | Hype cycles outrunning reliability and unit economics |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  FM[Vision-language foundation models] --> WAVE[Physical AI acceleration]\n  POL[Diffusion / transformer policies] --> WAVE\n  SIM[GPU simulation + world models] --> WAVE\n  HW[Cheaper actuators, sensors, edge compute] --> WAVE\n  DATA[Teleoperation + fleet data] --> WAVE\n  CAPITAL[Investment + labor demand] --> WAVE\n```\n\n### Worked example\n\n| Driver | Example |\n|---|---|\n| Foundation models | VLAs built on pretrained vision-language models |\n| Edge compute | NVIDIA Jetson AGX Thor for on-robot inference |\n| Low-cost hardware | Unitree humanoids priced in the tens of thousands of dollars or less |\n| Open tooling | Hugging Face LeRobot, MuJoCo, open VLA weights |"}, {"id": 9, "title": "The hard problems", "tldr": "Key open challenges are data scarcity, generalization to new objects and places, long-horizon reliability, dexterity, safety around people, real-time compute on limited power, hardware cost and durability, and evaluation.", "real": "Physical Intelligence reported π0.6 reaching 96.4% autonomy across a full warehouse shift for a partner in February 2026, showing progress while also illustrating that human interventions remained part of real deployments.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | What still limits physical AI |\n| Data | No “internet of robot actions” comparable to web text |\n| Reliability | 99%+ success needed for many commercial tasks |\n| Watch out for | Long-tail failures that only appear after thousands of hours |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  CHALLENGES[Hard problems] --> DATA[Data scarcity]\n  CHALLENGES --> GEN[Generalization]\n  CHALLENGES --> REL[Long-horizon reliability]\n  CHALLENGES --> DEX[Dexterity + touch]\n  CHALLENGES --> SAFE[Safety near people]\n  CHALLENGES --> COST[Hardware cost + durability]\n  CHALLENGES --> EVAL[Evaluation]\n```\n\n### Worked example\n\nWhy reliability compounds:\n\n```text\nA task with 10 steps, each 95% reliable: 0.95^10 ≈ 0.599 → 60% task success\nAt 99% per step: 0.99^10 ≈ 0.904\nAt 99.9% per step: 0.999^10 ≈ 0.990\n```"}, {"id": 10, "title": "How to use this guide", "tldr": "This guide moves from foundations (math, hardware, software) through classical robotics (perception, estimation, planning, control) to modern robot learning, foundation models, simulation, data, autonomous vehicles, applications, safety and deployment, ending with projects.", "real": "Leading robotics courses, such as MIT’s Underactuated Robotics and Stanford’s robot learning courses, combine classical foundations with modern learning methods, which this guide mirrors.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Map of the 20 parts |\n| Approach | Classical foundations + modern learning together |\n| Practice | Simulation projects first, then low-cost hardware |\n| Watch out for | Skipping math and control because “the model will learn it” |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  F[Foundations: 1–40] --> C[Classical robotics: 41–100]\n  C --> L[Robot learning + VLAs: 101–130]\n  L --> S[Simulation + data: 131–150]\n  S --> A[AVs + applications: 151–170]\n  A --> D[Safety + deployment: 171–190]\n  D --> P[Projects: 191–200]\n```\n\n### Worked example\n\n| Learner profile | Suggested path |\n|---|---|\n| Software/ML engineer new to robots | Parts 1–4, then 11–13, then 14–15 |\n| Mechanical/controls engineer | Parts 11–15, then 4, 13 |\n| Product/business leader | Parts 1, 13, 16–19 |\n| Student aiming for research | All parts in order + projects |"}, {"id": 11, "title": "Linear algebra for robotics", "tldr": "Robots are described with vectors (positions, velocities, forces) and matrices (rotations, transforms, Jacobians, inertia). Matrix multiplication chains transformations; eigenvalues describe stability; least squares solves estimation and inverse kinematics problems.", "real": "Libraries such as Eigen (C++) and NumPy (Python) are used throughout robotics software, including ROS 2, MoveIt and Pinocchio, for exactly these vector and matrix operations.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Math of vectors and matrices |\n| Used for | Frames, kinematics, dynamics, estimation, control |\n| Key tools | Matrix products, inverses, pseudo-inverses, eigenvalues, SVD |\n| Watch out for | Mixing row and column vector conventions |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  V[Vectors: positions, velocities] --> M[Matrices: rotations, Jacobians]\n  M --> SOLVE[Solve: least squares, pseudo-inverse]\n  M --> STAB[Eigenvalues: stability]\n  SOLVE --> APPS[IK, calibration, estimation]\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\n# Least squares: fit y = a*x + b to noisy sensor calibration data\nx = np.array([0.0, 1.0, 2.0, 3.0])\ny = np.array([0.1, 2.1, 3.9, 6.2])\nA = np.column_stack([x, np.ones_like(x)])\n(a, b), *_ = np.linalg.lstsq(A, y, rcond=None)\nprint(round(a, 3), round(b, 3))   # slope ≈ 2.01, offset ≈ 0.06\n```"}, {"id": 12, "title": "Coordinate frames and homogeneous transforms", "tldr": "Every sensor, link and object has a coordinate frame. A 4×4 homogeneous transform combines rotation and translation, letting you convert points between frames and chain transforms (world → base → arm → camera → object).", "real": "ROS’s tf2 library maintains a tree of time-stamped transforms between frames such as map, odom, base_link and camera_link, following conventions documented in ROS REP 103 and REP 105.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Representing poses and converting between frames |\n| Form | T = [[R, p], [0, 1]] with R 3×3 rotation, p 3×1 translation |\n| Chaining | T_world_object = T_world_base · T_base_camera · T_camera_object |\n| Watch out for | Confusing T_a_b with T_b_a (inverse) |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  WORLD[world] -->|T_world_base| BASE[base_link]\n  BASE -->|T_base_cam| CAM[camera_link]\n  CAM -->|T_cam_obj| OBJ[object]\n  WORLD -.composed: T_world_obj.-> OBJ\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\ndef transform(yaw_rad, tx, ty, tz):\n    c, s = np.cos(yaw_rad), np.sin(yaw_rad)\n    return np.array([[c, -s, 0, tx], [s, c, 0, ty], [0, 0, 1, tz], [0, 0, 0, 1]])\n\nT_world_base = transform(np.pi / 2, 1.0, 0.0, 0.0)   # base rotated 90° about z, at x = 1 m\np_base = np.array([0.5, 0.0, 0.0, 1.0])               # point 0.5 m ahead of the robot\nprint(np.round(T_world_base @ p_base, 3))             # [1.  0.5 0.  1. ] in the world frame\n```"}, {"id": 13, "title": "Representing rotations", "tldr": "Rotations can be represented as rotation matrices, Euler angles, axis-angle or unit quaternions. Quaternions avoid gimbal lock and interpolate smoothly; Euler angles are intuitive but order-dependent and singular in some orientations.", "real": "ROS messages represent orientation as quaternions (x, y, z, w), and scipy’s Rotation class converts between quaternions, matrices, Euler angles and rotation vectors.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Ways to describe 3D orientation |\n| Rotation matrix | 9 numbers, orthonormal, easy to compose |\n| Quaternion | 4 numbers, no gimbal lock, smooth interpolation (slerp) |\n| Watch out for | Quaternion ordering conventions (w first vs w last) |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EULER[Euler angles: roll, pitch, yaw] <--> MATRIX[Rotation matrix]\n  MATRIX <--> QUAT[Quaternion x, y, z, w]\n  QUAT <--> AXIS[Axis-angle / rotation vector]\n```\n\n### Worked example\n\n```python\nfrom scipy.spatial.transform import Rotation as R\n\nr = R.from_euler(\"z\", 90, degrees=True)\nprint(r.as_quat().round(4))        # [0. 0. 0.7071 0.7071]  (x, y, z, w)\nprint(r.apply([1, 0, 0]).round(4)) # [0. 1. 0.]  x-axis rotated onto y-axis\n```"}, {"id": 14, "title": "Rigid-body kinematics: velocities and twists", "tldr": "A rigid body’s motion combines linear and angular velocity, often packed as a 6D twist. The velocity of a point on a rotating body is v = v_origin + ω × r, which underlies wheel odometry, arm Jacobians and visual tracking.", "real": "Modern Robotics (Lynch and Park, 2017) popularized teaching kinematics with twists and screw theory, and libraries such as Pinocchio implement spatial algebra for fast kinematics and dynamics.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Describing how bodies move |\n| Twist | (ω, v): angular + linear velocity |\n| Key formula | v_point = v + ω × r |\n| Watch out for | Expressing velocities in the wrong frame |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  OMEGA[Angular velocity ω] --> PV[Point velocity = v + ω × r]\n  VEL[Linear velocity v] --> PV\n  R[Offset r to point] --> PV\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\nomega = np.array([0.0, 0.0, 1.0])   # rotating at 1 rad/s about z\nv = np.array([0.5, 0.0, 0.0])       # moving forward at 0.5 m/s\nr = np.array([0.0, 0.3, 0.0])       # point 0.3 m to the left\nprint(v + np.cross(omega, r))       # [0.2 0.  0. ] m/s\n```"}, {"id": 15, "title": "Dynamics", "tldr": "Dynamics relates forces and torques to motion. For robot arms, the manipulator equation M(q)q̈ + C(q, q̇)q̇ + g(q) = τ captures inertia, Coriolis/centrifugal effects, gravity and joint torques. Dynamics enables simulation, model-based control and force estimation.", "real": "Recursive Newton–Euler and articulated-body algorithms compute robot dynamics in linear time in the number of joints, and are implemented in libraries such as Pinocchio, RBDL and physics engines like MuJoCo.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How forces cause motion |\n| Robot equation | M(q)q̈ + C(q, q̇)q̇ + g(q) = τ |\n| Uses | Simulation, computed-torque control, gravity compensation |\n| Watch out for | Ignoring friction and actuator limits in models |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TAU[Joint torques τ] --> DYN[Dynamics model]\n  STATE[q, q̇] --> DYN\n  DYN --> ACC[Accelerations q̈]\n  ACC --> INTEGRATE[Integrate → new q, q̇]\n  INTEGRATE --> STATE\n```\n\n### Worked example\n\nSingle pendulum (mass m at length l): torque needed to hold it still at angle θ from vertical:\n\n```text\nτ = m · g · l · sin(θ)\nm = 2 kg, l = 0.5 m, θ = 30°: τ = 2 × 9.81 × 0.5 × 0.5 = 4.905 N·m\nAt θ = 90° (horizontal): τ = 9.81 N·m (maximum gravity torque)\n```"}, {"id": 16, "title": "Probability for robots", "tldr": "Sensors are noisy and the world is uncertain, so robots represent beliefs as probability distributions and update them with Bayes’ rule as new measurements arrive. This is the foundation of localization, SLAM, tracking and sensor fusion.", "real": "Thrun, Burgard and Fox’s book “Probabilistic Robotics” (2005) established Bayesian filtering as the standard framework for robot state estimation.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Reasoning under uncertainty |\n| Bayes rule | posterior ∝ likelihood × prior |\n| Uses | Localization, mapping, tracking, fusion |\n| Watch out for | Overconfident estimates from ignored noise |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PRIOR[Prior belief] --> PREDICT[Predict with motion model]\n  PREDICT --> UPDATE[Update with sensor likelihood]\n  MEAS[Measurement] --> UPDATE\n  UPDATE --> POSTERIOR[Posterior belief]\n  POSTERIOR --> PRIOR\n```\n\n### Worked example\n\nA robot is either in the kitchen (prior 0.5) or hallway (0.5). Its sensor says “kitchen”, correct 80% of the time:\n\n```text\nP(kitchen | says kitchen) = 0.8 × 0.5 / (0.8 × 0.5 + 0.2 × 0.5) = 0.4 / 0.5 = 0.8\nA second independent \"kitchen\" reading: 0.8 × 0.8 / (0.8 × 0.8 + 0.2 × 0.2) = 0.64 / 0.68 ≈ 0.941\n```"}, {"id": 17, "title": "Optimization in robotics", "tldr": "Many robotics problems are optimization problems: inverse kinematics, trajectory optimization, model predictive control, calibration, SLAM and learning. Know least squares, gradient methods, constraints and when problems are convex.", "real": "Solvers such as OSQP (quadratic programs), IPOPT (nonlinear programs), Ceres and GTSAM (nonlinear least squares for SLAM) are standard components in robot software.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Finding the best solution under constraints |\n| Common forms | Least squares, QP, nonlinear programs |\n| Uses | IK, MPC, trajectory optimization, SLAM, calibration |\n| Watch out for | Local minima in nonconvex problems |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  COST[Cost: tracking error, energy, smoothness] --> SOLVER[Solver]\n  CONSTR[Constraints: joint limits, collisions, dynamics] --> SOLVER\n  INIT[Initial guess] --> SOLVER\n  SOLVER --> SOL[Optimal trajectory / pose / parameters]\n```\n\n### Worked example\n\n```python\nimport numpy as np\nfrom scipy.optimize import minimize\n\n# Find a point on the line x + y = 2 closest to a target (1.5, 1.5) while x ≤ 0.8\ntarget = np.array([1.5, 1.5])\nres = minimize(lambda p: np.sum((p - target) ** 2), x0=[0.0, 0.0],\n               constraints=[{\"type\": \"eq\", \"fun\": lambda p: p[0] + p[1] - 2},\n                            {\"type\": \"ineq\", \"fun\": lambda p: 0.8 - p[0]}])\nprint(res.x.round(3))   # [0.8 1.2]\n```"}, {"id": 18, "title": "Numerical integration and time steps", "tldr": "Simulators and controllers advance state in discrete time steps. Explicit Euler is simple but can blow up with large steps; semi-implicit Euler and Runge–Kutta methods are more stable. Time step size trades accuracy for speed.", "real": "MuJoCo’s default timestep is 2 ms, and its documentation describes semi-implicit Euler and Runge–Kutta 4 integrators along with an implicit-in-velocity option for stability with damping.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Stepping dynamics forward in time |\n| Methods | Explicit Euler, semi-implicit Euler, RK4, implicit methods |\n| Trade-off | Smaller steps: more accurate, slower |\n| Watch out for | Stiff contacts exploding with large time steps |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  STATE[x_t] --> DERIV[Compute derivatives]\n  DERIV --> STEP[x_t+1 = x_t + dt · f]\n  STEP --> CHECK{Energy / stability OK?}\n  CHECK -->|no| SMALLER[Reduce dt or change integrator]\n```\n\n### Worked example\n\n```python\n# Undamped spring-mass: explicit Euler gains energy; semi-implicit Euler stays bounded\nk, m, dt = 1.0, 1.0, 0.1\nx_e, v_e = 1.0, 0.0\nx_s, v_s = 1.0, 0.0\nfor _ in range(1000):\n    x_e, v_e = x_e + dt * v_e, v_e - dt * k / m * x_e   # explicit\n    v_s = v_s - dt * k / m * x_s                          # semi-implicit: velocity first\n    x_s = x_s + dt * v_s\nenergy = lambda x, v: 0.5 * k * x**2 + 0.5 * m * v**2\nprint(round(energy(x_e, v_e), 2), round(energy(x_s, v_s), 2))   # explicit grows (~10^4), semi-implicit stays ≈ 0.5\n```"}, {"id": 19, "title": "Conventions and units", "tldr": "Robotics software breaks quietly when conventions differ: units (SI meters, radians, seconds), axis directions, right-handed frames, quaternion order, angle wrapping and timestamps. Adopt standards and check them at every interface.", "real": "ROS REP 103 specifies SI units and right-handed frames with x forward, y left and z up for bodies, and REP 105 defines the standard map, odom and base_link frames for mobile robots.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Agreed units, frames and formats |\n| Standard (ROS) | Meters, radians, seconds; x forward, y left, z up |\n| Camera optical frames | z forward, x right, y down |\n| Watch out for | Degrees vs radians; camera vs body frame axes |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BODY[Body frame: x forward, y left, z up] --> CONVERT[Fixed rotation]\n  CONVERT --> OPTICAL[Camera optical frame: z forward, x right, y down]\n```\n\n### Worked example\n\n```python\nimport math\n\ndef wrap_angle(a: float) -> float:\n    \"\"\"Wrap angle to [-pi, pi).\"\"\"\n    return (a + math.pi) % (2 * math.pi) - math.pi\n\nheading_error = wrap_angle(math.radians(350) - math.radians(10))\nprint(round(math.degrees(heading_error), 1))   # -20.0, not 340\n```"}, {"id": 20, "title": "Signals, sampling and filtering", "tldr": "Sensor data is sampled in time; sampling must be fast enough (above twice the highest frequency of interest, per Nyquist) and noise must be filtered without adding too much delay. Low-pass filters smooth signals but introduce lag that can destabilize control.", "real": "IMUs on robots and drones are typically sampled at hundreds to thousands of Hz and filtered before use in estimation and control, because vibration and noise would otherwise corrupt state estimates.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Handling time-sampled sensor data |\n| Nyquist | Sample rate > 2 × highest frequency of interest |\n| Filters | Moving average, exponential (first-order low-pass), Butterworth |\n| Watch out for | Filter lag inside fast control loops |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  RAW[Raw noisy signal] --> SAMPLE[Sample at fs]\n  SAMPLE --> FILTER[Low-pass filter]\n  FILTER --> SMOOTH[Smoother signal]\n  FILTER -.adds.-> LAG[Phase lag]\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\ndef low_pass(signal, alpha=0.2):\n    \"\"\"First-order exponential filter: y[k] = alpha*x[k] + (1 - alpha)*y[k-1].\"\"\"\n    out, y = [], signal[0]\n    for x in signal:\n        y = alpha * x + (1 - alpha) * y\n        out.append(y)\n    return np.array(out)\n\nrng = np.random.default_rng(0)\nnoisy = 1.0 + 0.2 * rng.standard_normal(200)\nprint(round(noisy.std(), 3), round(low_pass(noisy)[50:].std(), 3))   # noise reduced\n```"}, {"id": 21, "title": "Robot anatomy and degrees of freedom", "tldr": "Robots are built from links connected by joints (revolute or prismatic), each adding a degree of freedom (DOF). Six DOF are needed to place a tool at any position and orientation in 3D; extra DOF (redundancy) add flexibility; humanoids have dozens.", "real": "Typical industrial arms have 6 DOF, collaborative arms such as the Franka Research 3 and KUKA LBR iiwa have 7 DOF for redundancy, and Tesla’s production Optimus design was reported to have hands with 22 degrees of freedom.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structure of links, joints and DOF |\n| Joint types | Revolute (rotate), prismatic (slide), spherical, passive |\n| Key numbers | 6 DOF for full pose; 7 DOF adds redundancy |\n| Watch out for | More DOF = more motors, weight, cost and control complexity |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BASE[Base] --> J1[Joint 1] --> L1[Link 1] --> J2[Joint 2] --> L2[Link 2] --> J3[Joint 3...] --> EE[End effector]\n```\n\n### Worked example\n\n| Robot | Approximate DOF |\n|---|---|\n| Differential-drive base | 2 (controllable) |\n| Industrial arm | 6 |\n| Redundant cobot arm | 7 |\n| Quadruped (Spot-class, no arm) | 12 leg joints |\n| Humanoid with dexterous hands | 40–70+ |"}, {"id": 22, "title": "Actuators: motors and transmissions", "tldr": "Most modern robots use electric motors (brushless DC) with transmissions: high-ratio gears (harmonic, cycloidal, planetary) for torque and precision, or low-ratio quasi-direct drives for backdrivability and impact tolerance. Hydraulics offer high power density but add complexity.", "real": "MIT’s Mini Cheetah (2019) popularized low-cost quasi-direct-drive actuators, and Boston Dynamics replaced its hydraulic Atlas with an all-electric Atlas in April 2024.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Devices that produce motion and force |\n| Electric | BLDC motors + gearboxes; dominant today |\n| Transmissions | Harmonic (precise, compact), planetary (efficient), cycloidal (robust), QDD (backdrivable) |\n| Watch out for | Gear backlash, overheating, torque limits under peak loads |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BATT[Battery] --> DRIVER[Motor driver / inverter]\n  DRIVER --> MOTOR[BLDC motor: high speed, low torque]\n  MOTOR --> GEAR[Gearbox: ratio N]\n  GEAR --> JOINT[Joint: torque × N, speed ÷ N]\n  ENC[Encoder] --> DRIVER\n```\n\n### Worked example\n\n```text\nMotor: 0.5 N·m continuous, 3,000 rpm; gearbox ratio 50:1, efficiency 80%\nJoint torque ≈ 0.5 × 50 × 0.8 = 20 N·m\nJoint speed = 3,000 / 50 = 60 rpm = 6.28 rad/s\nHigher ratio → more torque, less speed, less backdrivability\n```"}, {"id": 23, "title": "Compliance and series elastic actuators", "tldr": "Compliance (springiness) makes robots safer and better at contact: series elastic actuators place a spring between motor and load, enabling force measurement and shock absorption. Control-based compliance (impedance control) achieves similar effects with stiff hardware and torque sensing.", "real": "Pratt and Williamson introduced series elastic actuators in 1995, and torque-sensing collaborative arms such as the KUKA LBR iiwa use joint torque sensors to detect collisions and behave compliantly.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Mechanical or controlled softness in actuators |\n| Benefits | Safety, impact tolerance, force control |\n| Methods | Springs (SEA), torque sensors + impedance control, soft materials |\n| Watch out for | Reduced precision and bandwidth with very soft springs |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  MOTOR[Motor + gearbox] --> SPRING[Spring]\n  SPRING --> LOAD[Load / joint]\n  SPRING --> DEFLECT[Measure deflection]\n  DEFLECT --> FORCE[Force = k × deflection]\n```\n\n### Worked example\n\n```text\nSpring stiffness k = 500 N·m/rad; measured deflection 0.02 rad\nJoint torque = 500 × 0.02 = 10 N·m\nResolution: encoder with 0.0005 rad steps → torque resolution 0.25 N·m\n```"}, {"id": 24, "title": "Sensors overview", "tldr": "Proprioceptive sensors measure the robot itself (encoders, IMUs, motor currents, joint torque); exteroceptive sensors measure the environment (cameras, depth, LiDAR, radar, microphones, tactile). Choose sensors by what decisions they must support.", "real": "Autonomous vehicles combine cameras, radar and often LiDAR, while Tesla notably pursued a camera-only approach, illustrating different sensor strategies for the same task.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How robots measure themselves and the world |\n| Proprioceptive | Joint encoders, IMU, motor current, torque sensors |\n| Exteroceptive | Cameras, depth, LiDAR, radar, tactile, audio |\n| Watch out for | Single points of failure in sensing |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  SENSORS[Robot sensors] --> PROP[Proprioceptive]\n  SENSORS --> EXT[Exteroceptive]\n  PROP --> ENC[Encoders]\n  PROP --> IMU[IMU]\n  PROP --> TORQUE[Torque / current]\n  EXT --> CAM[Cameras]\n  EXT --> DEPTH[Depth / LiDAR]\n  EXT --> TOUCH[Tactile]\n```\n\n### Worked example\n\n| Decision | Needed sensing |\n|---|---|\n| Am I balanced? | IMU + joint encoders |\n| Where is the cup? | RGB-D camera |\n| Did I grasp it securely? | Gripper force/tactile + motor current |\n| Is a person nearby? | Cameras, LiDAR, safety scanners |"}, {"id": 25, "title": "Cameras and depth sensors", "tldr": "Cameras are the richest robot sensor: RGB for appearance, depth from stereo, structured light or time-of-flight. Key specs are resolution, field of view, frame rate, shutter type, dynamic range and depth accuracy, which typically worsens with distance.", "real": "Intel RealSense, Orbbec, Stereolabs ZED and Luxonis OAK cameras are widely used RGB-D sensors on research and commercial robots.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Visual and depth sensing |\n| Depth methods | Stereo, structured light, time-of-flight |\n| Key specs | Resolution, FOV, fps, global vs rolling shutter, depth range/error |\n| Watch out for | Shiny, transparent and black objects confusing depth sensors |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LEFT[Left camera] --> MATCH[Stereo matching]\n  RIGHT[Right camera] --> MATCH\n  MATCH --> DISP[Disparity d]\n  DISP --> DEPTH[Depth Z = f × B / d]\n```\n\n### Worked example\n\n```text\nStereo depth: Z = f · B / d\nf = 600 px, baseline B = 0.05 m, disparity d = 15 px → Z = 600 × 0.05 / 15 = 2.0 m\nDepth error grows roughly with Z²: at 4 m, a 1 px disparity error matters ~4× more than at 2 m\n```"}, {"id": 26, "title": "LiDAR and radar", "tldr": "LiDAR measures distance with laser pulses, producing accurate 3D point clouds day or night; radar measures range and relative velocity and works in rain, fog and dust. Both complement cameras, especially in autonomous vehicles and outdoor robots.", "real": "Velodyne’s spinning HDL-64E LiDAR became iconic after teams used it in the 2007 DARPA Urban Challenge, and solid-state and lower-cost LiDARs later spread to robots and production vehicles.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Active range sensors |\n| LiDAR | Precise 3D geometry; affected by heavy rain, fog, dark absorptive surfaces |\n| Radar | Velocity (Doppler), robust in weather; lower resolution |\n| Watch out for | Reflections and multipath causing ghost points |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LIDAR[LiDAR: time of flight] --> PCL[3D point cloud]\n  RADAR[Radar: range + Doppler velocity] --> TRACKS[Object tracks]\n  CAM[Camera: semantics] --> FUSION[Sensor fusion]\n  PCL --> FUSION\n  TRACKS --> FUSION\n```\n\n### Worked example\n\n```text\nTime of flight: distance = c × t / 2\nEcho after 200 ns: 3×10^8 m/s × 200×10^-9 s / 2 = 30 m\nLiDAR with 128 channels × 2,048 points/rotation × 10 Hz ≈ 2.6 million points/second\n```"}, {"id": 27, "title": "IMUs and encoders", "tldr": "Encoders measure joint or wheel angles precisely; IMUs (accelerometers + gyroscopes, sometimes magnetometers) measure acceleration and rotation rate. IMU readings drift when integrated, so they’re fused with other sensors.", "real": "Quadruped and humanoid controllers rely on high-rate IMU data fused with joint encoders to estimate body orientation and velocity, since vision is too slow for balance on its own.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Core proprioceptive sensors |\n| Encoders | Incremental or absolute; resolution in counts per revolution |\n| IMU | Gyro (rad/s), accelerometer (m/s²); bias and noise drift |\n| Watch out for | Integrating gyro bias into large orientation errors |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  GYRO[Gyroscope] --> INT[Integrate → orientation]\n  ACC[Accelerometer: gravity direction] --> FUSE[Complementary / Kalman filter]\n  INT --> FUSE\n  FUSE --> ATT[Stable roll + pitch estimate]\n```\n\n### Worked example\n\n```text\nGyro bias 0.01 rad/s, uncorrected for 60 s → heading error 0.6 rad ≈ 34°\nEncoder: 4,096 counts/rev on motor, 100:1 gearbox → joint resolution 2π / 409,600 ≈ 1.5×10^-5 rad\n```"}, {"id": 28, "title": "Touch, force and torque sensing", "tldr": "Tactile sensors (pressure arrays, vision-based skins) and force/torque sensors at wrists or joints let robots feel contact, slip and weight, which is essential for dexterous manipulation, insertion tasks and safe interaction.", "real": "Vision-based tactile sensors such as GelSight (MIT) and Meta’s DIGIT (2020) image a deformable gel surface to measure contact geometry, and Amazon introduced its tactile-sensing Vulcan robot in May 2025.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Sensing contact and forces |\n| Types | Wrist 6-axis F/T, joint torque, tactile arrays, vision-based tactile |\n| Uses | Grasp stability, slip detection, insertion, safe collisions |\n| Watch out for | Fragile sensor skins and calibration drift |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CONTACT[Contact with object] --> TACTILE[Tactile / F-T sensor]\n  TACTILE --> SLIP{Slip detected?}\n  SLIP -->|yes| TIGHTEN[Increase grip force]\n  SLIP -->|no| CONTINUE[Continue task]\n```\n\n### Worked example\n\n```text\nFriction grasp check (two-finger, friction coefficient μ = 0.5):\nRequired normal force per finger ≥ m·g / (2μ) for a vertical lift\nObject 1 kg: 9.81 / (2 × 0.5) = 9.81 N per finger (add a safety factor, e.g. ×1.5 → ~14.7 N)\n```"}, {"id": 29, "title": "End effectors and dexterous hands", "tldr": "End effectors range from simple parallel grippers and suction cups to multi-fingered dexterous hands. Simple grippers are reliable and cheap; dexterous hands handle tools and varied objects but add complexity, weight and failure points.", "real": "Warehouse picking robots widely use suction for its reliability on boxes and packages, while humanoid makers such as Tesla, Figure and Sanctuary invested heavily in human-like hands with many degrees of freedom.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The part that touches the world |\n| Types | Parallel jaw, suction, soft grippers, multi-finger hands, tool changers |\n| Trade-off | Simplicity and reliability vs versatility |\n| Watch out for | Choosing a 20-DOF hand for tasks a gripper can do |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  OBJ{Objects handled} -->|boxes, flat surfaces| SUCTION[Suction]\n  OBJ -->|rigid parts, known shapes| PARALLEL[Parallel gripper]\n  OBJ -->|fragile, irregular| SOFT[Soft gripper]\n  OBJ -->|tools, varied household items| HAND[Dexterous hand]\n```\n\n### Worked example\n\n| Gripper | Cost | Reliability | Versatility |\n|---|---|---|---|\n| Suction cup | Low | High on suitable surfaces | Low |\n| Parallel jaw | Low–medium | High | Medium |\n| Soft gripper | Medium | Medium | Medium |\n| Dexterous hand | High | Lower (more parts) | High |"}, {"id": 30, "title": "Power, batteries and thermal limits", "tldr": "Mobile robots are constrained by battery energy, peak power, heat and weight. Runtime depends on average power draw; motors overheat under sustained high torque; compute adds significant load. Swappable batteries and charging strategies keep fleets running.", "real": "Boston Dynamics’ production Atlas, unveiled at CES 2026, can change its own batteries, an example of designing around limited humanoid battery life for continuous operation.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Energy and heat management |\n| Runtime | Battery energy (Wh) ÷ average power (W) |\n| Thermal | Continuous vs peak torque ratings; cooling |\n| Watch out for | Peak loads (standing up, lifting) causing voltage sag or overheating |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BATTERY[Battery Wh] --> POWER[Power budget]\n  POWER --> MOTORS[Motors]\n  POWER --> COMPUTE[Compute]\n  POWER --> SENSORS[Sensors]\n  MOTORS --> HEAT[Heat → thermal limits]\n  COMPUTE --> HEAT\n```\n\n### Worked example\n\n```text\nHumanoid battery: 2.0 kWh; average draw: 500 W walking + 100 W compute = 600 W\nRuntime ≈ 2,000 / 600 ≈ 3.3 hours (before efficiency losses and reserve)\nWith 20% reserve: ≈ 2.7 hours usable\n```"}, {"id": 31, "title": "Onboard compute", "tldr": "Robots need on-board computers for real-time perception and AI inference within tight power budgets, plus microcontrollers for low-level motor control. Edge AI modules such as NVIDIA Jetson run neural networks locally; heavier training happens in data centers.", "real": "NVIDIA’s Jetson AGX Thor (2025) brought Blackwell-architecture compute to robots, and in 2026 NVIDIA added T4000, T3000 and T2000 modules, offering a range from about 70 TOPS to 2,000 teraflops across the Jetson lineup.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Computers that run on the robot |\n| Layers | Microcontrollers (motor control), real-time CPU, GPU/NPU for AI |\n| Constraints | Power (watts), heat, size, latency, cost |\n| Watch out for | Models that only run fast on data-center GPUs |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  CLOUD[Cloud: training, fleet analytics] -.updates.-> AI[Edge AI computer: perception + policy]\n  AI --> RT[Real-time controller]\n  RT --> MCU[Motor microcontrollers]\n  MCU --> MOTORS[Motors]\n```\n\n### Worked example\n\n| Workload | Typical location |\n|---|---|\n| Joint current control (10–40 kHz) | Motor driver MCU |\n| Whole-body balance (\\~1 kHz) | Real-time CPU |\n| VLA policy (\\~10–50 Hz) | GPU on robot |\n| High-level reasoning (\\~1 Hz) | On robot or cloud, with fallback |\n| Model training | Data center |"}, {"id": 32, "title": "Real-time systems", "tldr": "Control loops must run on time every time: missing deadlines causes jitter and instability. Real-time operating systems or real-time Linux (PREEMPT_RT), careful threading, avoiding memory allocation in loops and separating safety-critical code are standard practices.", "real": "The PREEMPT_RT real-time patches were merged into the mainline Linux kernel in version 6.12 (2024), simplifying real-time Linux setups used in robotics.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Software that meets timing deadlines |\n| Metrics | Loop period, jitter, worst-case latency |\n| Practices | RT kernel, priority threads, preallocated memory, lock-free queues |\n| Watch out for | Garbage collection or logging inside 1 kHz loops |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TIMER[1 ms timer] --> READ[Read sensors]\n  READ --> COMPUTE[Compute control]\n  COMPUTE --> WRITE[Write motor commands]\n  WRITE --> CHECK{Finished within 1 ms?}\n  CHECK -->|no| OVERRUN[Deadline overrun: log + safe behavior]\n```\n\n### Worked example\n\n| Loop | Period | Acceptable jitter (rule of thumb) |\n|---|---|---|\n| Joint control | 1 ms | ≪ 0.1 ms |\n| Balance controller | 2 ms | \\~0.1 ms |\n| Vision policy | 50 ms | A few ms |\n| Planner | 200 ms+ | Tens of ms |"}, {"id": 33, "title": "ROS 2 fundamentals", "tldr": "ROS 2 (Robot Operating System 2) is open-source middleware and tooling for robot software: processes (nodes) communicate through topics, services and actions, with standard messages, launch files, transforms, simulation integration and a huge package ecosystem.", "real": "ROS 2 Lyrical Luth, released on May 22, 2026, is a long-term support release supported until May 2031, targeting Ubuntu 26.04; Jazzy Jalisco (2024) remains supported until May 2029.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Robot software framework and ecosystem |\n| Core concepts | Nodes, topics, services, actions, parameters, launch |\n| Middleware | DDS by default (Fast DDS), Zenoh option |\n| Watch out for | Mixing ROS 1 tutorials with ROS 2 code |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CAMNODE[camera_node] -->|/image_raw topic| DETECT[detector_node]\n  DETECT -->|/detections topic| PLANNER[planner_node]\n  PLANNER -->|/cmd_vel topic| BASE[base_controller]\n  PLANNER -->|service: /get_map| MAPSRV[map_server]\n```\n\n### Worked example\n\n| ROS 2 distro | Released | Support until |\n|---|---|---|\n| Humble Hawksbill (LTS) | May 2022 | May 2027 |\n| Jazzy Jalisco (LTS) | May 2024 | May 2029 |\n| Kilted Kaiju | May 2025 | Dec 2026 |\n| Lyrical Luth (LTS) | May 2026 | May 2031 |"}, {"id": 34, "title": "ROS 2 nodes, topics, services and actions", "tldr": "Topics stream data (sensor readings, commands) publish/subscribe; services are request/response for quick queries; actions handle long-running goals with feedback and cancellation (navigate to a pose, execute a grasp). QoS settings control reliability and history.", "real": "Nav2, the ROS 2 navigation stack, exposes navigation as an action (NavigateToPose), allowing clients to send goals, receive progress feedback and cancel.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | ROS 2 communication patterns |\n| Topics | Continuous streams (pub/sub) |\n| Services | Short request/response |\n| Actions | Long tasks with feedback + cancel |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  TOPIC[Topic: /scan streaming at 10 Hz] --> SUB[Subscribers]\n  SERVICE[Service: /reset_odometry] --> RESP[Single response]\n  ACTION[Action: /navigate_to_pose] --> FEEDBACK[Feedback: distance remaining]\n  ACTION --> RESULT[Result: succeeded / aborted]\n```\n\n### Worked example\n\n```python\nimport rclpy\nfrom rclpy.node import Node\nfrom geometry_msgs.msg import Twist\n\nclass SlowSpin(Node):\n    def __init__(self):\n        super().__init__(\"slow_spin\")\n        self.pub = self.create_publisher(Twist, \"/cmd_vel\", 10)\n        self.timer = self.create_timer(0.1, self.tick)   # 10 Hz\n\n    def tick(self):\n        msg = Twist()\n        msg.angular.z = 0.3   # rad/s\n        self.pub.publish(msg)\n\ndef main():\n    rclpy.init()\n    node = SlowSpin()\n    try:\n        rclpy.spin(node)\n    finally:\n        node.destroy_node()\n        rclpy.shutdown()\n\nif __name__ == \"__main__\":\n    main()\n```"}, {"id": 35, "title": "URDF and tf2", "tldr": "URDF (or Xacro) describes a robot’s links, joints, geometry, inertia and limits; robot_state_publisher combines it with joint states to broadcast transforms via tf2, which any node can query to convert data between frames at a given time.", "real": "URDF descriptions are used across ROS tools (RViz visualization, MoveIt planning, Gazebo and Isaac Sim import), making the robot model a shared source of truth.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Robot model description + transform system |\n| URDF contents | Links (visual, collision, inertial), joints (type, axis, limits) |\n| tf2 | Time-stamped transform tree queries |\n| Watch out for | Wrong inertias making simulation unrealistic |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  URDF[URDF model] --> RSP[robot_state_publisher]\n  JS[joint_states topic] --> RSP\n  RSP --> TF[tf2 transform tree]\n  TF --> RVIZ[RViz]\n  TF --> NODES[Any node: lookup_transform]\n```\n\n### Worked example\n\n```xml\n<robot name=\"mini_arm\">\n  <link name=\"base_link\"/>\n  <link name=\"upper_arm\">\n    <inertial>\n      <mass value=\"1.0\"/>\n      <inertia ixx=\"0.01\" ixy=\"0\" ixz=\"0\" iyy=\"0.01\" iyz=\"0\" izz=\"0.001\"/>\n    <\/inertial>\n  <\/link>\n  <joint name=\"shoulder\" type=\"revolute\">\n    <parent link=\"base_link\"/>\n    <child link=\"upper_arm\"/>\n    <origin xyz=\"0 0 0.1\" rpy=\"0 0 0\"/>\n    <axis xyz=\"0 1 0\"/>\n    <limit lower=\"-1.57\" upper=\"1.57\" effort=\"20\" velocity=\"2.0\"/>\n  <\/joint>\n<\/robot>\n```"}, {"id": 36, "title": "ROS 2 ecosystem tools", "tldr": "Key tools include RViz (visualization), rosbag2 (recording and replay), Nav2 (navigation), MoveIt 2 (manipulation planning), ros2_control (hardware interfaces and controllers), Foxglove (web visualization) and simulators via Gazebo or Isaac Sim bridges.", "real": "rosbag2 has used the MCAP file format as its default storage since the ROS 2 Iron release (2023), improving performance and tooling compatibility.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Standard building blocks around ROS 2 |\n| Navigation | Nav2 |\n| Manipulation | MoveIt 2 |\n| Hardware/control | ros2_control |\n| Data | rosbag2 (MCAP), Foxglove, PlotJuggler |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  APP[Your robot application] --> NAV2[Nav2]\n  APP --> MOVEIT[MoveIt 2]\n  NAV2 --> CTRL[ros2_control]\n  MOVEIT --> CTRL\n  CTRL --> HW[Hardware interface / simulator]\n  ALL[All topics] --> BAG[rosbag2 recording]\n  BAG --> VIS[RViz / Foxglove replay]\n```\n\n### Worked example\n\n```bash\nros2 bag record -o run_2026_11_21 /scan /odom /tf /tf_static /camera/image_raw\nros2 bag info run_2026_11_21\nros2 bag play run_2026_11_21 --rate 0.5\n```"}, {"id": 37, "title": "Middleware: DDS and Zenoh", "tldr": "ROS 2 communication runs over pluggable middleware (RMW). DDS implementations provide discovery and QoS; Zenoh offers efficient communication across networks and constrained links. Choose based on network topology, scale and Wi-Fi conditions.", "real": "rmw_zenoh became an officially supported (Tier 1) ROS 2 middleware with the Kilted Kaiju release in 2025, while Fast DDS remained the default implementation in Lyrical Luth.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Transport layer under ROS 2 |\n| Options | Fast DDS (default), Cyclone DDS, Connext, Zenoh |\n| QoS | Reliability, durability, history depth, deadlines |\n| Watch out for | DDS discovery storms on Wi-Fi with many nodes |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  NODES[ROS 2 nodes] --> RMW[RMW layer]\n  RMW --> DDS[DDS implementation]\n  RMW --> ZENOH[Zenoh]\n  DDS --> LAN[Local network]\n  ZENOH --> WAN[Constrained / wide-area links]\n```\n\n### Worked example\n\n| Data | QoS choice |\n|---|---|\n| Camera images | Best effort, depth 1 (latest frame matters) |\n| Commands to motors | Reliable, small depth |\n| Static map | Reliable + transient local (late joiners receive it) |"}, {"id": 38, "title": "Edge inference optimization", "tldr": "Running AI models on robots requires optimization: quantization (FP16, INT8, FP8/FP4), compilers such as TensorRT, batching cameras, smaller models (distillation), and splitting work between fast low-level and slower high-level models.", "real": "Google DeepMind’s Gemini Robotics On-Device models and NVIDIA’s Cosmos 3 Edge (2026) target on-robot inference, reflecting the need to run capable models locally without cloud latency.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Making models fast and small enough for robots |\n| Techniques | Quantization, TensorRT/ONNX Runtime, distillation, pruning, caching |\n| Metrics | Latency (ms), throughput, power (W), accuracy drop |\n| Watch out for | Accuracy loss on rare but safety-critical inputs after quantization |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  MODEL[Trained model FP32] --> EXPORT[Export ONNX]\n  EXPORT --> QUANT[Quantize FP16 / INT8]\n  QUANT --> ENGINE[TensorRT engine]\n  ENGINE --> BENCH[Benchmark latency + accuracy on robot]\n```\n\n### Worked example\n\n```text\nPolicy must run at 20 Hz → budget 50 ms per step\nCamera preprocessing 6 ms + vision encoder 22 ms + action head 9 ms + overhead 5 ms = 42 ms ✓\nAdding a second camera doubles encoder time → 64 ms ✗ → quantize encoder or share backbone\n```"}, {"id": 39, "title": "Robot software architecture", "tldr": "Robust robot software is layered: hardware abstraction, real-time control, state estimation, perception, planning or learned policy, task/behavior layer and user interface, with a separate safety layer that can always stop the robot.", "real": "Behavior trees, popularized in robotics via game AI and libraries such as BehaviorTree.CPP (used by Nav2), are a common way to structure task-level logic with clear fallbacks.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Organizing robot software into layers |\n| Task layer | Behavior trees, state machines, LLM/VLM planners |\n| Safety layer | Independent monitors, e-stop, speed limits |\n| Watch out for | AI models with direct, unchecked access to motors |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  UI[Operator / user interface] --> TASK[Task layer: behavior tree]\n  TASK --> POLICY[Planning or learned policy]\n  POLICY --> CONTROL[Real-time control]\n  CONTROL --> HAL[Hardware abstraction]\n  PERCEPT[Perception + estimation] --> POLICY\n  SAFETY[Safety layer: limits, e-stop] -.overrides.-> CONTROL\n```\n\n### Worked example\n\n| Behavior tree node | Example |\n|---|---|\n| Sequence | Navigate to shelf → detect item → pick → place |\n| Fallback | Try grasp A; if fail, try grasp B; if fail, ask for help |\n| Condition | Battery > 20%? |\n| Action | Call NavigateToPose action |"}, {"id": 40, "title": "Logging, data and fleet operations", "tldr": "Robots generate large volumes of data: sensor streams, decisions, failures. Record smartly (triggers around interesting events), upload selectively, index for search, and use it for debugging, evaluation and training. Fleet tools manage software updates and monitoring.", "real": "Tesla and Waymo use fleet data pipelines that trigger recording of rare or interesting events, a pattern now adopted by robot companies to build training datasets from deployments.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Capturing and managing robot data at scale |\n| Strategies | Ring buffers, event-triggered uploads, compression, metadata tagging |\n| Uses | Debugging, evaluation, training, safety investigations |\n| Watch out for | Privacy of people captured by robot cameras |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ROBOT[Robot sensors] --> RING[Rolling buffer: last 60 s]\n  TRIGGER[Trigger: failure, intervention, near-miss] --> SAVE[Save clip]\n  RING --> SAVE\n  SAVE --> UPLOAD[Upload when on Wi-Fi]\n  UPLOAD --> LAKE[(Data lake + index)]\n  LAKE --> TRAIN[Training + evaluation]\n```\n\n### Worked example\n\n```text\nData rate: 3 cameras × 1280×720 × 30 fps, H.264 at ~5 Mbit/s each ≈ 15 Mbit/s\nPer 8-hour shift: 15 × 3,600 × 8 / 8 ≈ 54,000 MB ≈ 54 GB per robot\n100 robots → ~5.4 TB/shift → upload only triggered events\n```"}, {"id": 41, "title": "Camera models and calibration", "tldr": "The pinhole model maps 3D points to pixels using intrinsics (focal lengths, principal point) and extrinsics (camera pose); lens distortion is modeled separately. Calibration estimates these parameters and is essential for accurate 3D perception and hand–eye coordination.", "real": "Zhengyou Zhang’s 2000 checkerboard calibration method is implemented in OpenCV and remains the standard approach for calibrating robot cameras.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Mathematical model of how cameras form images |\n| Intrinsics | fx, fy, cx, cy (+ distortion coefficients) |\n| Extrinsics | Camera pose relative to robot (hand–eye calibration) |\n| Watch out for | Recalibration after bumps, lens changes or temperature shifts |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  P3D[3D point in camera frame X, Y, Z] --> PROJ[u = fx·X/Z + cx, v = fy·Y/Z + cy]\n  PROJ --> DIST[Apply lens distortion]\n  DIST --> PIX[Pixel u, v]\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\nK = np.array([[600.0, 0, 320.0], [0, 600.0, 240.0], [0, 0, 1]])\npoint_cam = np.array([0.2, -0.1, 1.5])          # meters, camera optical frame\nuvw = K @ point_cam\nu, v = uvw[:2] / uvw[2]\nprint(round(u, 1), round(v, 1))                 # 400.0 200.0\n\n# Back-project pixel (400, 200) with depth 1.5 m\nxyz = np.linalg.inv(K) @ np.array([400.0, 200.0, 1.0]) * 1.5\nprint(xyz.round(3))                             # [ 0.2 -0.1  1.5]\n```"}, {"id": 42, "title": "Depth estimation", "tldr": "Depth comes from active sensors (time-of-flight, structured light, LiDAR), stereo matching, or learned monocular depth networks. Learned depth is convenient but may have scale ambiguity; metric depth matters for grasping and navigation.", "real": "Monocular depth models such as Depth Anything (2024) produce strong relative depth from single images, and newer metric-depth variants are increasingly used where stereo hardware is unavailable.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Estimating distance per pixel |\n| Methods | Active depth, stereo, monocular networks, multi-view |\n| Key issue | Scale accuracy and failure on reflective/transparent surfaces |\n| Watch out for | Using relative depth as if it were metric |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  NEED{Need metric depth?} -->|yes, short range indoors| RGBD[RGB-D camera]\n  NEED -->|yes, outdoors / long range| LIDAR[LiDAR or stereo]\n  NEED -->|relative is enough| MONO[Monocular depth network]\n```\n\n### Worked example\n\n| Surface | Stereo / ToF behavior | Mitigation |\n|---|---|---|\n| Glass | Often missing or wrong depth | Learned depth completion, tactile confirmation |\n| Shiny metal | Speckle / holes | Polarized lighting, multiple views |\n| Black matte | Weak ToF return | Stereo with texture projection |"}, {"id": 43, "title": "2D detection and segmentation", "tldr": "Robots detect objects (bounding boxes), segment them (pixel masks) and classify them. Real-time detectors (YOLO family) and promptable segmentation models (Segment Anything) provide fast building blocks; robot-specific fine-tuning improves reliability.", "real": "Meta released Segment Anything (SAM) in April 2023 and SAM 2 for video in July 2024, and promptable segmentation became widely used for isolating objects in robot manipulation pipelines.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Finding objects in images |\n| Outputs | Boxes, masks, class labels, confidences |\n| Models | YOLO-style detectors, Mask R-CNN, SAM family |\n| Watch out for | Domain shift: lab-trained detectors failing in new lighting |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  IMG[RGB image] --> DET[Detector: boxes + labels]\n  DET --> SEG[Segmenter: mask per object]\n  SEG --> DEPTH[Combine with depth]\n  DEPTH --> OBJ3D[3D object points for grasping]\n```\n\n### Worked example\n\n```python\ndef iou(a, b):\n    \"\"\"Intersection over union of boxes (x1, y1, x2, y2).\"\"\"\n    ix1, iy1 = max(a[0], b[0]), max(a[1], b[1])\n    ix2, iy2 = min(a[2], b[2]), min(a[3], b[3])\n    inter = max(0, ix2 - ix1) * max(0, iy2 - iy1)\n    area = lambda r: (r[2] - r[0]) * (r[3] - r[1])\n    return inter / (area(a) + area(b) - inter)\n\nprint(round(iou((10, 10, 50, 50), (30, 30, 70, 70)), 3))   # 0.143\n```"}, {"id": 44, "title": "3D perception and point clouds", "tldr": "Point clouds from depth cameras or LiDAR represent geometry directly. Typical processing: downsample, remove outliers, segment planes (tables, floors), cluster objects, estimate normals and fit shapes, often with Open3D or PCL.", "real": "Open3D (2018) and the Point Cloud Library (PCL, 2011) are standard open-source libraries for point cloud processing in robotics research and industry.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Processing 3D points from sensors |\n| Pipeline | Crop → downsample → outlier removal → plane removal → clustering |\n| Uses | Grasping, obstacle detection, mapping |\n| Watch out for | Noisy edges (“flying pixels”) at depth discontinuities |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CLOUD[Raw cloud: 300k points] --> CROP[Crop workspace]\n  CROP --> VOXEL[Voxel downsample]\n  VOXEL --> PLANE[RANSAC: remove table plane]\n  PLANE --> CLUSTER[Cluster objects]\n  CLUSTER --> OBJECTS[Object point sets]\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\ndef ransac_plane(points, iters=200, thresh=0.01, seed=0):\n    rng = np.random.default_rng(seed)\n    best = np.zeros(len(points), bool)\n    for _ in range(iters):\n        p = points[rng.choice(len(points), 3, replace=False)]\n        n = np.cross(p[1] - p[0], p[2] - p[0])\n        if np.linalg.norm(n) < 1e-9:\n            continue\n        n /= np.linalg.norm(n)\n        inliers = np.abs((points - p[0]) @ n) < thresh\n        if inliers.sum() > best.sum():\n            best = inliers\n    return best\n\nrng = np.random.default_rng(1)\ntable = np.column_stack([rng.uniform(-0.5, 0.5, 500), rng.uniform(-0.5, 0.5, 500), rng.normal(0, 0.002, 500)])\ncup = rng.uniform([0, 0, 0.02], [0.08, 0.08, 0.12], (100, 3))\nmask = ransac_plane(np.vstack([table, cup]))\nprint(mask[:500].mean().round(2), mask[500:].mean().round(2))   # ~1.0 table inliers, ~0.0 cup\n```"}, {"id": 45, "title": "6D object pose estimation", "tldr": "Manipulation often needs an object’s full pose (3D position + 3D orientation). Methods range from model-based matching (with CAD models) to learned pose estimators and foundation models that generalize to novel objects with few or no examples.", "real": "NVIDIA’s FoundationPose (CVPR 2024) estimates and tracks 6D poses of novel objects given a CAD model or a few reference images, without object-specific training.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Estimating object position + orientation |\n| Inputs | RGB-D images, object model or reference views |\n| Uses | Precise grasping, assembly, insertion |\n| Watch out for | Symmetric objects with ambiguous orientation |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  RGBD[RGB-D image] --> SEG[Segment object]\n  SEG --> POSE[Pose estimator]\n  MODEL[CAD model or reference views] --> POSE\n  POSE --> T[T_camera_object]\n  T --> GRASP[Transform grasp into robot frame]\n```\n\n### Worked example\n\n| Object | Pose difficulty |\n|---|---|\n| Textured box | Easy |\n| Symmetric cylinder | Rotation about axis ambiguous (often irrelevant for grasping) |\n| Shiny metal part | Hard for depth; use RGB or multiple views |\n| Deformable bag | Pose ill-defined; use keypoints or learned policies |"}, {"id": 46, "title": "Open-vocabulary perception", "tldr": "Vision-language models let robots find objects described in words (“the red mug behind the laptop”) without training on fixed classes. Open-vocabulary detectors and VLMs connect natural-language instructions to pixels and 3D locations.", "real": "CLIP (OpenAI, 2021), OWL-ViT (Google, 2022) and Grounding DINO (2023) enabled zero-shot, text-prompted object detection that robotics researchers combined with segmentation and depth for language-guided manipulation.",

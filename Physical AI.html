# Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Autonomous flying robots |\n| Multirotor | Hover, precise, short flight time |\n| Fixed-wing / VTOL | Efficient, long range |\n| Watch out for | Wind gusts, battery margins, regulatory limits |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  POSCTRL[Position controller] --> ATTCTRL[Attitude controller]\n  ATTCTRL --> MIXER[Motor mixer]\n  MIXER --> ROTORS[Rotor speeds]\n  IMU[IMU + GPS / VIO] --> POSCTRL\n  IMU --> ATTCTRL\n```\n\n### Worked example\n\n```text\nQuadrotor hover: total thrust = m · g\nm = 1.5 kg → thrust = 14.7 N → 3.68 N per rotor (~375 g-force each)\nRule of thumb: total max thrust ≈ 2× weight for control authority → ≥ 7.4 N per rotor\n```"}, {"id": 101, "title": "Why robots learn", "tldr": "Hand-engineering perception and behavior works for structured settings but breaks down with varied objects, deformables, clutter and open-ended instructions. Learning from data (demonstrations, trial and error, video) handles variability that’s impossible to program explicitly.", "real": "Physical Intelligence’s December 2025 Robot Olympics post argued that physical skills can’t be programmed from introspection, because humans don’t consciously understand how they perform them, motivating learning from data.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Using data instead of hand-coded rules for robot behavior |\n| Learning paradigms | Imitation, reinforcement, self-supervised, foundation model pretraining |\n| Strength | Handles variability and complex perception-to-action mappings |\n| Watch out for | Data-hungry; failures can be unpredictable |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DEMOS[Demonstrations] --> POLICY[Learned policy]\n  TRIAL[Trial and error rewards] --> POLICY\n  VIDEO[Human videos] --> POLICY\n  PRETRAIN[Pretrained vision-language models] --> POLICY\n  POLICY --> ACTIONS[Actions from observations]\n```\n\n### Worked example\n\n| Task | Hand-engineered | Learned |\n|---|---|---|\n| Weld identical car parts | Excellent | Unnecessary |\n| Pick any item from a messy bin | Brittle | Strong |\n| Fold varied clothing | Very hard | Feasible with demos |\n| Follow “tidy the table” | Impractical | Feasible with VLAs |"}, {"id": 102, "title": "Imitation learning and behavior cloning", "tldr": "Behavior cloning trains a policy with supervised learning to map observations to the actions demonstrated by an expert. It’s simple and effective with good data, but errors compound when the robot drifts into states the demonstrator never visited.", "real": "Behavior cloning dates back to ALVINN (1989), a neural network that learned to steer a vehicle from human driving, and it underlies most modern robot foundation model pretraining.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Supervised learning from demonstrations |\n| Data | (observation, action) pairs from teleoperation or kinesthetic teaching |\n| Strength | Simple, stable training |\n| Watch out for | Compounding errors from distribution shift |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EXPERT[Expert teleoperates] --> DATA[Dataset of obs, action pairs]\n  DATA --> TRAIN[Supervised training]\n  TRAIN --> POLICY[Policy π of obs]\n  POLICY --> ROBOT[Robot executes]\n```\n\n### Worked example\n\n```python\nimport numpy as np\nfrom sklearn.neural_network import MLPRegressor\n\n# Toy: learn to steer toward a goal from (dx, dy) observations, expert action = heading angle\nrng = np.random.default_rng(0)\nobs = rng.uniform(-1, 1, (2000, 2))\nactions = np.arctan2(obs[:, 1], obs[:, 0])\npolicy = MLPRegressor(hidden_layer_sizes=(64, 64), max_iter=500, random_state=0).fit(obs[:1800], actions[:1800])\nerr = np.abs(policy.predict(obs[1800:]) - actions[1800:])\nprint(round(float(np.median(err)), 3))   # small median error, but larger near the ±π wrap-around\n```\n\n(Notice the angle wrap-around problem: action representation matters. Predicting (cos, sin) instead fixes it.)"}, {"id": 103, "title": "Distribution shift and DAgger", "tldr": "Cloned policies make small errors that lead to unfamiliar states, causing bigger errors. Remedies include DAgger (collect expert corrections on states the policy visits), noise injection during demonstrations, recovery demonstrations, and human-in-the-loop corrections during deployment.", "real": "Ross, Gordon and Bagnell introduced DAgger in 2011, and modern deployments use the same idea: Physical Intelligence’s π*0.6 (November 2025) learned from human corrections as well as its own experience.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The compounding error problem and fixes |\n| DAgger | Iteratively label states visited by the learner with expert actions |\n| Practical variants | Interventions, corrective demos, recovery data |\n| Watch out for | Only collecting “perfect” demonstrations with no recoveries |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TRAIN[Train policy on data] --> RUN[Run policy]\n  RUN --> VISITED[States policy actually visits]\n  VISITED --> EXPERT[Expert labels correct actions / intervenes]\n  EXPERT --> AGG[Aggregate into dataset]\n  AGG --> TRAIN\n```\n\n### Worked example\n\n```text\nError compounding intuition: per-step error rate ε over horizon T\nBehavior cloning worst-case cost grows ~ ε·T² ; DAgger reduces it to ~ ε·T (Ross et al., 2011)\nT = 100 steps, ε = 0.01: quadratic bound term ~100 vs linear ~1\n```"}, {"id": 104, "title": "Reinforcement learning basics", "tldr": "Reinforcement learning learns by trial and error to maximize cumulative reward in a Markov decision process (states, actions, transitions, rewards, discount). Robots use RL mainly in simulation, for locomotion, dexterity and fine-tuning, because real-world trials are slow and risky.", "real": "Sutton and Barto’s textbook “Reinforcement Learning: An Introduction” (1998; 2nd edition 2018) is the standard reference, and RL-trained locomotion policies now run on commercial legged robots.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Learning behavior from rewards |\n| MDP | States, actions, transitions, rewards, discount γ |\n| Goal | Maximize expected discounted return |\n| Watch out for | Sample inefficiency and unsafe exploration on real hardware |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  AGENT[Agent / policy] -->|action| ENV[Environment]\n  ENV -->|state, reward| AGENT\n  AGENT --> UPDATE[Update policy to increase return]\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\n# Value iteration on a 1D corridor: 5 cells, reward +1 at the right end, γ = 0.9\nn, gamma = 5, 0.9\nV = np.zeros(n)\nfor _ in range(100):\n    newV = V.copy()\n    for s in range(n - 1):\n        newV[s] = max(gamma * V[max(s - 1, 0)], (1.0 if s + 1 == n - 1 else 0.0) + gamma * V[s + 1])\n    V = newV\nprint(V.round(3))   # [0.729 0.81  0.9   1.    0.   ]  (goal cell is terminal)\n```"}, {"id": 105, "title": "Policy gradients and PPO", "tldr": "Policy gradient methods adjust a parameterized policy to make high-return actions more likely. PPO (proximal policy optimization) limits each update with a clipped objective, giving stable training; it’s the default algorithm for simulated locomotion.", "real": "OpenAI introduced PPO in 2017, and it became the standard RL algorithm in robotics frameworks such as Isaac Lab and in legged-robot training pipelines.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | On-policy RL with stable updates |\n| Key idea | Clip probability ratio to stay near the old policy |\n| Strengths | Stable, parallelizes well in simulation |\n| Watch out for | Needs many samples; poor fit for slow real-world data |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  COLLECT[Collect rollouts with current policy] --> ADV[Estimate advantages: GAE]\n  ADV --> CLIP[Optimize clipped objective for K epochs]\n  CLIP --> NEW[New policy]\n  NEW --> COLLECT\n```\n\n### Worked example\n\n```python\nimport gymnasium as gym\nfrom stable_baselines3 import PPO\n\nenv = gym.make(\"Pendulum-v1\")\nmodel = PPO(\"MlpPolicy\", env, n_steps=2048, batch_size=64, learning_rate=3e-4, verbose=0)\nmodel.learn(total_timesteps=200_000)\nobs, _ = env.reset(seed=0)\naction, _ = model.predict(obs, deterministic=True)\n```"}, {"id": 106, "title": "Off-policy RL: SAC and friends", "tldr": "Off-policy algorithms (SAC, TD3, DQN variants) learn from replay buffers of past experience, making them far more sample-efficient than PPO, which matters for real-robot learning. SAC adds entropy maximization for robust exploration.", "real": "Soft Actor-Critic (Haarnoja et al., 2018) was demonstrated learning quadruped walking directly on a real Minitaur robot in about two hours of real-world data, showing the value of sample efficiency.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | RL reusing stored experience |\n| Algorithms | SAC, TD3, DDPG; Q-learning variants |\n| Strength | Sample efficiency |\n| Watch out for | Instability with poorly tuned learning rates or replay ratios |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ROBOT[Robot / sim] --> BUFFER[(Replay buffer)]\n  BUFFER --> CRITIC[Update Q critics]\n  CRITIC --> ACTOR[Update actor + entropy]\n  ACTOR --> ROBOT\n```\n\n### Worked example\n\n| Algorithm | On/off-policy | Typical robotics use |\n|---|---|---|\n| PPO | On-policy | Massively parallel sim locomotion |\n| SAC | Off-policy | Real-robot learning, manipulation in sim |\n| TD3 | Off-policy | Continuous control benchmarks |\n| Offline RL (IQL, CQL) | Offline | Learning from logged datasets |"}, {"id": 107, "title": "Reward design", "tldr": "Rewards define what RL optimizes, and agents exploit any loophole. Sparse rewards (success only) are honest but hard to learn from; shaped rewards guide learning but risk unintended behaviors. Combine task success, shaping, regularization and safety penalties carefully.", "real": "Research on “reward hacking” documents agents exploiting simulator bugs or reward loopholes, and Eureka (NVIDIA, 2023) explored using LLMs to write reward functions for dexterous tasks.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Specifying goals as reward signals |\n| Types | Sparse success, dense shaping, penalties, learned rewards |\n| Risks | Reward hacking, unnatural behaviors |\n| Watch out for | Rewards that can be maximized without solving the task |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TASK[Task intent] --> REWARD[Reward function]\n  REWARD --> RL[RL training]\n  RL --> BEHAVIOR[Behavior]\n  BEHAVIOR --> INSPECT{Matches intent?}\n  INSPECT -->|no: exploit found| REWARD\n```\n\n### Worked example\n\n| Reward for “push block to target” | Possible exploit |\n|---|---|\n| + reward for block velocity | Robot flings block around |\n| − distance block-to-target only | Works, but slow learning |\n| + success bonus, − distance, − large forces | Better balanced |"}, {"id": 108, "title": "Offline RL and learning from logs", "tldr": "Offline RL learns policies from fixed datasets without new interaction, using techniques that avoid overestimating unseen actions. It can improve on demonstrations by using reward information, which suits robots with large logs of deployment data.", "real": "Algorithms such as CQL (2020) and IQL (2021) made offline RL more practical, and robot foundation model developers increasingly combine demonstrations, deployment data and reward signals to improve policies.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | RL from fixed datasets |\n| Benefit | Uses existing data; no risky exploration |\n| Challenge | Extrapolation error on actions not in data |\n| Watch out for | Datasets lacking failures or diverse behaviors |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LOGS[(Logged robot data + rewards)] --> OFFLINE[Offline RL: conservative value learning]\n  OFFLINE --> POLICY[Improved policy]\n  POLICY --> EVAL[Careful real-world evaluation]\n  EVAL --> LOGS\n```\n\n### Worked example\n\n| Data source | Usefulness for offline RL |\n|---|---|\n| Expert demos only | Good for BC; limited improvement signal |\n| Mixed-quality deployment logs with outcomes | Valuable: learn what works better |\n| Logged interventions and failures | Very valuable: shows what to avoid |"}, {"id": 109, "title": "Real-world RL and learning from experience", "tldr": "Learning directly on real robots requires safety constraints, resets, reward detection, sample efficiency and human oversight. Recent systems combine demonstrations, human corrections and autonomous practice to improve speed and reliability on deployed tasks.", "real": "Physical Intelligence’s π*0.6 (November 2025) used a method called Recap combining demonstrations, corrections and autonomous experience, which the company reported more than doubled throughput on some of the hardest tasks.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Improving policies from real deployment experience |\n| Ingredients | Success detection, interventions, safety limits, efficient algorithms |\n| Benefit | Learn real-world nuances simulation misses |\n| Watch out for | Unsafe exploration; slow data collection |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DEMO[Demonstrations] --> BASE[Base policy]\n  BASE --> DEPLOY[Deploy on real tasks]\n  DEPLOY --> CORRECT[Human corrections]\n  DEPLOY --> OUTCOMES[Success / failure signals]\n  CORRECT --> IMPROVE[Policy improvement]\n  OUTCOMES --> IMPROVE\n  IMPROVE --> DEPLOY\n```\n\n### Worked example\n\n| Safety measure for real-world learning | Purpose |\n|---|---|\n| Workspace limits and force caps | Prevent damage |\n| Human supervisor with stop button | Immediate intervention |\n| Automatic success classifier | Reward without manual labeling |\n| Reset mechanisms | Continue practice without humans resetting each trial |"}, {"id": 110, "title": "Evaluating learned policies", "tldr": "Learned policies need rigorous evaluation: many trials, varied conditions (seen vs unseen objects, scenes, instructions), failure categorization, simulation evaluation for scale and statistically honest comparisons. Offline metrics like validation loss correlate poorly with real success.", "real": "Researchers have found that training loss for robot policies is a weak predictor of real-world success, which is why simulation proxies (such as SIMPLER, 2024) and real-world arenas emerged for policy evaluation.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Measuring policy quality reliably |\n| Methods | Real trials, sim proxies, A/B blind tests, arenas |\n| Report | Success with CIs, trial counts, conditions, failure modes |\n| Watch out for | Choosing checkpoints by validation loss alone |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CKPT[Checkpoints] --> SIMEVAL[Simulation evaluation: many trials]\n  SIMEVAL --> SHORTLIST[Shortlist]\n  SHORTLIST --> REAL[Real-world evaluation protocol]\n  REAL --> FAILURES[Failure taxonomy]\n  FAILURES --> DATA[Targeted data collection]\n```\n\n### Worked example\n\n| Failure category (50 failed trials) | Count | Fix |\n|---|---|---|\n| Missed grasp | 21 | More grasp demos on that object type |\n| Wrong object | 9 | Better language grounding data |\n| Collision / stuck | 12 | Recovery demonstrations |\n| Timeout (too slow) | 8 | Action chunking / speed tuning |"}, {"id": 111, "title": "Teleoperation for data collection", "tldr": "Teleoperation lets humans drive robots to produce demonstrations: leader–follower arms, VR headsets, exoskeletons, motion capture, spacemice or handheld grippers. Interface quality determines data quality, speed and which tasks can be demonstrated.", "real": "Stanford’s ALOHA (2023) used low-cost leader arms mirrored by follower arms, GELLO (2023) offered cheap 3D-printed leader arms, and the Universal Manipulation Interface (UMI, 2024) collected data with handheld grippers instead of robots.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Humans controlling robots to generate training data |\n| Interfaces | Leader–follower arms, VR, exoskeletons, handheld grippers, mocap |\n| Quality factors | Latency, force feedback, intuitive mapping, operator skill |\n| Watch out for | Operators adopting unnatural strategies the policy can’t learn |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  OPERATOR[Operator] --> LEADER[Leader arm / VR controller]\n  LEADER --> MAP[Kinematic mapping]\n  MAP --> FOLLOWER[Follower robot]\n  FOLLOWER --> CAMS[Cameras + joint states recorded]\n  CAMS --> DATASET[(Demonstration dataset)]\n```\n\n### Worked example\n\n| Interface | Cost | Data quality | Best for |\n|---|---|---|---|\n| Leader–follower arms | Low–medium | High, natural | Bimanual tabletop tasks |\n| VR headset + hand tracking | Medium | Good, intuitive | Humanoids, mobile manipulation |\n| Handheld gripper (UMI-style) | Low | Good; robot-free collection | In-the-wild data |\n| Spacemouse | Low | Lower; slow | Simple pick and place |"}, {"id": 112, "title": "Action chunking and ACT", "tldr": "Instead of predicting one action per step, chunked policies predict sequences of future actions, reducing compounding error and producing smoother motion. ACT (Action Chunking with Transformers) uses a transformer with a CVAE to predict action chunks from images and joint states.", "real": "Zhao and colleagues introduced ACT with ALOHA in 2023, achieving high success on fine bimanual tasks such as opening cups and inserting batteries from about 50 demonstrations per task.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Predicting sequences of actions at once |\n| Benefits | Smoother motion, fewer decision points, handles pauses |\n| Execution | Open-loop chunk, or temporal ensembling of overlapping chunks |\n| Watch out for | Long open-loop chunks reacting slowly to disturbances |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  OBS[Images + joint states] --> ENC[Transformer encoder]\n  ENC --> DEC[Decoder]\n  DEC --> CHUNK[Next k actions]\n  CHUNK --> EXEC[Execute + ensemble with previous chunks]\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\n# Temporal ensembling: average overlapping predictions for the current step, weighting older ones\ndef ensemble(predictions, m=0.1):\n    \"\"\"predictions: list of action predictions for THIS timestep, oldest first.\"\"\"\n    w = np.exp(-m * np.arange(len(predictions)))\n    w /= w.sum()\n    return float(np.dot(w, predictions))\n\nprint(round(ensemble([0.50, 0.52, 0.55, 0.53]), 3))   # smoothed action ≈ 0.523\n```"}, {"id": 113, "title": "Diffusion policies", "tldr": "Diffusion policies generate actions by iteratively denoising random noise into action sequences, conditioned on observations. They model multimodal behavior (several valid ways to do a task) better than regression, which averages modes into invalid actions.", "real": "Chi and colleagues’ Diffusion Policy (2023) outperformed prior imitation methods across many benchmarks, and diffusion-style action generation became common in robot learning.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Generative model of action sequences |\n| Strength | Captures multimodal demonstrations |\n| Cost | Multiple denoising steps per inference (mitigated by fewer steps/distillation) |\n| Watch out for | Inference latency on edge hardware |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  NOISE[Random noise action sequence] --> DENOISE[Denoiser conditioned on observation]\n  OBS[Observation] --> DENOISE\n  DENOISE --> STEP[Repeat K steps]\n  STEP --> ACTIONS[Clean action chunk]\n```\n\n### Worked example\n\nWhy regression fails with multimodal demos:\n\n```text\nObstacle directly ahead; half the demos go left (−1), half go right (+1)\nRegression (MSE) learns the average: 0 → drives straight into the obstacle\nDiffusion / generative policy samples either −1 or +1 → valid behavior\n```"}, {"id": 114, "title": "Flow matching and continuous action experts", "tldr": "Flow matching learns a velocity field that transforms noise into actions in fewer steps than classic diffusion. Several robot foundation models attach a flow-matching “action expert” to a vision-language model to produce high-frequency continuous actions.", "real": "Physical Intelligence’s π0 (2024) used a flow-matching action expert on top of a pretrained vision-language model to generate action chunks at up to 50 Hz for dexterous tasks.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Continuous generative modeling for actions |\n| Advantage | Fewer integration steps; smooth high-frequency control |\n| Architecture | VLM backbone + action expert |\n| Watch out for | Mismatched action spaces across robots |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  IMG[Images] --> VLM[Pretrained VLM backbone]\n  TXT[Instruction] --> VLM\n  STATE[Robot state] --> EXPERT[Flow-matching action expert]\n  VLM --> EXPERT\n  NOISE[Noise] --> EXPERT\n  EXPERT --> CHUNK[Action chunk at 50 Hz]\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\n# Toy flow: integrate a known velocity field from noise toward a target action in 10 Euler steps\ntarget = np.array([0.3, -0.2])\nx = np.random.default_rng(0).normal(size=2)          # noise sample at t = 0\nsteps = 10\nfor i in range(steps):\n    t = i / steps\n    velocity = (target - x) / (1 - t)                 # straight-line (rectified) flow toward target\n    x = x + velocity / steps\nprint(x.round(3))                                     # [ 0.3 -0.2]\n```"}, {"id": 115, "title": "Transformers for control", "tldr": "Transformers process sequences of image tokens, language tokens, proprioception and past actions, letting policies attend over long contexts and multiple cameras. They’re the backbone of most modern robot policies and foundation models.", "real": "Google’s RT-1 (2022) used a transformer trained on 130,000 demonstrations collected over 17 months with 13 robots, establishing transformers as a scalable architecture for robot control.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Attention-based policy networks |\n| Inputs | Image tokens, text tokens, state, history |\n| Outputs | Discrete action tokens or continuous action chunks |\n| Watch out for | Latency from long token sequences on robot hardware |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CAM1[Wrist camera] --> TOK[Tokenize]\n  CAM2[Head camera] --> TOK\n  LANG[Instruction] --> TOK\n  PROPRIO[Joint states] --> TOK\n  TOK --> TRANSFORMER[Transformer]\n  TRANSFORMER --> ACT[Actions]\n```\n\n### Worked example\n\n```text\nToken budget per step: 2 cameras × 256 patch tokens + 20 text tokens + 1 state token ≈ 533 tokens\nAttention cost grows with sequence length squared → 2 frames of history doubles tokens (~1,066) and roughly quadruples attention compute\n```"}, {"id": 116, "title": "Action representations and tokenization", "tldr": "Actions can be joint positions, joint deltas, end-effector poses, velocities or torques, absolute or relative, and either continuous or discretized into tokens. The choice affects learning, transfer across robots and smoothness.", "real": "RT-2 (2023) discretized each action dimension into 256 bins to output actions as text-like tokens, and Physical Intelligence’s FAST tokenizer (2025) compressed action chunks with a frequency-domain transform for more efficient autoregressive training.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How actions are encoded for learning |\n| Options | Joint vs end-effector space; absolute vs delta; continuous vs tokens |\n| Normalization | Scale each dimension (e.g. to [−1, 1]) using dataset statistics |\n| Watch out for | Mixing conventions across datasets |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  ACTION{Action space} --> JOINT[Joint positions: robot-specific]\n  ACTION --> EE[End-effector pose: transfers across arms]\n  ACTION --> DELTA[Deltas: relative motions]\n  EE --> TOKENS[Discretize into bins or compress]\n  EE --> CONT[Continuous via diffusion / flow]\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\ndef tokenize(a, low, high, bins=256):\n    return np.clip(((a - low) / (high - low) * (bins - 1)).round().astype(int), 0, bins - 1)\n\ndef detokenize(t, low, high, bins=256):\n    return low + t / (bins - 1) * (high - low)\n\na = np.array([0.031, -0.12, 0.5])                 # delta x, delta y, gripper\nlow, high = np.array([-0.1, -0.1, 0.0]), np.array([0.1, 0.1, 1.0])\nt = tokenize(a, low, high)\nprint(t, detokenize(t, low, high).round(4))       # note -0.12 is clipped to -0.1\n```"}, {"id": 117, "title": "Language-conditioned and multi-task policies", "tldr": "Conditioning policies on language instructions lets one model perform many tasks and generalize to new phrasings. Training data needs diverse tasks with accurate language labels; hierarchical systems split instructions into simpler subtasks.", "real": "Language-conditioned policies such as RT-1 and RT-2 executed hundreds of distinct instructions, and π0.7 (April 2026) was described by Physical Intelligence as steerable through language and subgoal images in unseen environments.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | One policy, many tasks, selected by instructions |\n| Inputs | Language, sometimes goal images or subgoals |\n| Data needs | Diverse tasks + consistent annotations |\n| Watch out for | Policies ignoring language and doing the most common task |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INSTR[Put the apple in the bowl] --> ENCODE[Language encoder]\n  OBS[Observation] --> POLICY[Multi-task policy]\n  ENCODE --> POLICY\n  POLICY --> ACTIONS[Actions]\n```\n\n### Worked example\n\n| Test | What it checks |\n|---|---|\n| Same scene, different instructions | Does behavior change with language? |\n| Paraphrased instruction | Language generalization |\n| Novel object named in instruction | Grounding to new objects |\n| Distractor objects | Attention to the right target |"}, {"id": 118, "title": "Observation design", "tldr": "What a policy sees strongly affects success: wrist cameras for precise grasping, third-person cameras for context, proprioception for body state, history for dynamics, and optionally depth, force or tactile signals. Consistent camera placement across data matters.", "real": "ALOHA-style setups use multiple cameras including wrist-mounted ones, and many studies report that wrist cameras substantially improve fine manipulation success compared with fixed external views alone.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Choosing inputs to the policy |\n| Common inputs | Wrist RGB, external RGB, joint states, gripper state |\n| Optional | Depth, force/torque, tactile, history frames |\n| Watch out for | Camera moves between data collection and deployment |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  WRIST[Wrist camera: fine detail] --> POLICY[Policy]\n  EXTERNAL[External camera: scene context] --> POLICY\n  JOINTS[Joint + gripper state] --> POLICY\n  FT[Force / tactile] --> POLICY\n  POLICY --> ACT[Actions]\n```\n\n### Worked example\n\n| Observation choice | Effect |\n|---|---|\n| Add wrist camera | Better precise grasps |\n| Add history (2–3 frames) | Infers motion; can cause copycat shortcuts |\n| Remove proprioception | Less overfitting to trajectories, harder state inference |\n| Lower image resolution | Faster inference; may lose small details |"}, {"id": 119, "title": "Data augmentation and robustness", "tldr": "Augmentations such as color jitter, random crops, lighting changes, background replacement and camera pose noise make policies robust to visual changes. Generative models and world models can create more varied training scenes from real demonstrations.", "real": "NVIDIA’s Cosmos Transfer models (2025–2026) were introduced to generate photorealistic variations of robot data under different lighting, textures and environments for training and evaluation.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Artificially varying training data |\n| Image augmentations | Crops, color jitter, blur, cutout |\n| Generative augmentations | New backgrounds, lighting, textures |\n| Watch out for | Augmentations that change task-relevant information |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DEMO[Original demonstration frames] --> AUG[Augment: crop, color, lighting]\n  DEMO --> GEN[Generative variation: new scenes]\n  AUG --> TRAIN[Training set]\n  GEN --> TRAIN\n  TRAIN --> POLICY[More robust policy]\n```\n\n### Worked example\n\n```python\nimport numpy as np\n\ndef random_crop_and_jitter(img, crop=0.9, rng=np.random.default_rng(0)):\n    h, w, _ = img.shape\n    ch, cw = int(h * crop), int(w * crop)\n    y, x = rng.integers(0, h - ch + 1), rng.integers(0, w - cw + 1)\n    out = img[y:y + ch, x:x + cw].astype(float)\n    out *= rng.uniform(0.8, 1.2)                   # brightness jitter\n    return np.clip(out, 0, 255).astype(np.uint8)\n\nframe = np.full((224, 224, 3), 128, np.uint8)\nprint(random_crop_and_jitter(frame).shape)         # (201, 201, 3) → resize back before training\n```"}, {"id": 120, "title": "LeRobot and open tooling", "tldr": "Open-source tooling lowered the barrier to robot learning: Hugging Face LeRobot provides datasets, policies (ACT, Diffusion Policy, π0-family and others), training and recording tools and low-cost arm designs; NVIDIA integrated Isaac and GR00T with it.", "real": "Hugging Face launched LeRobot in May 2024, released the low-cost SO-100/SO-101 arm designs and the compact SmolVLA model (2025), and NVIDIA announced at CES 2026 that it was integrating Isaac and GR00T into LeRobot.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Open-source robot learning ecosystem |\n| Components | LeRobotDataset format, policy implementations, training scripts, hardware support |\n| Hardware | Low-cost arms (SO-101), Reachy 2 humanoid, community robots |\n| Watch out for | Fast-moving APIs: follow docs for your installed version |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ARMS[Leader + follower SO-101 arms] --> RECORD[Record episodes]\n  RECORD --> HUB[(Dataset on Hugging Face Hub)]\n  HUB --> TRAIN[Train ACT / Diffusion / VLA policy]\n  TRAIN --> EVAL[Evaluate on robot]\n  EVAL --> RECORD\n```\n\n### Worked example\n\n| Step | Typical scale for a first task |\n|---|---|\n| Task | Pick a cube and place it in a box |\n| Demonstrations | 50 episodes |\n| Episode length | 10–20 s at 30 fps |\n| Policy | ACT on a single consumer GPU |\n| Evaluation | 20+ trials, record success rate |"}, {"id": 121, "title": "Vision-language-action models", "tldr": "VLAs are robot foundation models that take images, language instructions and robot state as input and output actions. Most start from pretrained vision-language models, inheriting world knowledge, then train on large, diverse robot datasets.", "real": "Google DeepMind’s RT-2 (July 2023) introduced the term vision-language-action model by fine-tuning large vision-language models to output robot actions, showing transfer of web knowledge to robot tasks.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Foundation models mapping vision + language to actions |\n| Ingredients | Pretrained VLM, robot data across embodiments, action decoder |\n| Strengths | Generalization to new objects, instructions and scenes |\n| Watch out for | Latency, reliability on long tasks, physical safety |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  IMGS[Camera images] --> VLM[Vision-language backbone]\n  INSTR[Language instruction] --> VLM\n  STATE[Robot state] --> HEAD[Action head: tokens, diffusion or flow]\n  VLM --> HEAD\n  HEAD --> ACTIONS[Robot actions]\n```\n\n### Worked example\n\n| Capability | Example |\n|---|---|\n| Semantic generalization | “Pick up the extinct animal” → picks a toy dinosaur |\n| New objects | Grasps items never seen in robot data |\n| Instruction following | Different behavior for “left bin” vs “right bin” |\n| Limits | Long multi-step tasks, precise force-sensitive tasks |"}, {"id": 122, "title": "From RT-1 to RT-2: the early milestones", "tldr": "RT-1 showed transformers trained on large real-world robot data could perform hundreds of tasks; RT-2 showed that co-training on web vision-language data and robot data let robots apply web knowledge to physical actions.", "real": "RT-1 (December 2022) trained on about 130,000 episodes from 13 robots over 17 months; RT-2 (July 2023) built on large vision-language models and represented actions as text tokens.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Foundational Google robot transformer models |\n| RT-1 | Efficient transformer on large robot dataset |\n| RT-2 | VLM fine-tuned to output action tokens |\n| Lesson | Scale and pretrained knowledge improve generalization |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  RT1[RT-1 2022: robot data only] --> RT2[RT-2 2023: web + robot co-training]\n  RT2 --> RTX[RT-X 2023: cross-embodiment data]\n  RTX --> VLAS[Modern VLAs]\n```\n\n### Worked example\n\n| Property | RT-1 | RT-2 |\n|---|---|---|\n| Backbone | Efficient transformer + image encoder | Large pretrained VLM |\n| Action output | Discretized tokens | Text-like action tokens |\n| Generalization | Good within training distribution | Semantic reasoning beyond robot data |"}, {"id": 123, "title": "Cross-embodiment learning and Open X-Embodiment", "tldr": "Training one model on data from many different robots can improve performance on each, because skills and visual understanding transfer. Pooled datasets require consistent formats and careful handling of different action spaces.", "real": "The Open X-Embodiment collaboration (October 2023) pooled over one million robot trajectories from 22 robot types contributed by 21 institutions, and RT-X models trained on it outperformed several single-robot models.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Learning from many robot bodies at once |\n| Benefit | More data, better generalization, positive transfer |\n| Challenges | Different action spaces, cameras, control rates |\n| Watch out for | Negative transfer from low-quality or mismatched data |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  R1[Arm A data] --> POOL[(Pooled dataset)]\n  R2[Arm B data] --> POOL\n  R3[Mobile manipulator data] --> POOL\n  R4[Bimanual robot data] --> POOL\n  POOL --> MODEL[Cross-embodiment model]\n  MODEL --> ANY[Fine-tune to a target robot]\n```\n\n### Worked example\n\n| Harmonization step | Example |\n|---|---|\n| Action space | Convert to end-effector deltas where possible |\n| Normalization | Per-dataset statistics |\n| Embodiment token | Tell the model which robot it controls |\n| Camera views | Mark wrist vs external |"}, {"id": 124, "title": "Open VLAs: Octo and OpenVLA", "tldr": "Open-source generalist policies made VLA research accessible: Octo (a transformer diffusion policy) and OpenVLA (a 7-billion-parameter VLA) were trained on Open X-Embodiment data and released with weights and fine-tuning code.", "real": "OpenVLA (June 2024) released a 7B model trained on about 970,000 robot episodes and reported outperforming the much larger closed RT-2-X on its evaluation suite, with efficient LoRA fine-tuning.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Openly released generalist robot policies |\n| Octo | Transformer + diffusion head, flexible inputs |\n| OpenVLA | 7B VLA, action tokens, LoRA fine-tuning |\n| Watch out for | Out-of-the-box performance on your robot may be low without fine-tuning |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  OXE[Open X-Embodiment data] --> OCTO[Octo]\n  OXE --> OPENVLA[OpenVLA 7B]\n  OCTO --> FT[Fine-tune on your robot's demos]\n  OPENVLA --> FT\n  FT --> DEPLOY[Deploy]\n```\n\n### Worked example\n\n| Model | Released | Notes |\n|---|---|---|\n| Octo | 2024 | Lightweight, diffusion action head |\n| OpenVLA | June 2024 | 7B parameters, Llama 2 + vision encoders |\n| π0 (openpi) | Weights released February 2025 | Flow-matching action expert |\n| SmolVLA | 2025 | Compact VLA from Hugging Face |"}, {"id": 125, "title": "The π model family", "tldr": "Physical Intelligence’s π models are generalist VLAs trained on large multi-robot datasets: π0 introduced a flow-matching action expert; π0.5 improved open-world generalization; π0.6 and π*0.6 added better performance and learning from experience; π0.7 added steerability and emergent compositional capabilities.", "real": "Physical Intelligence released π0 in October 2024 (open weights in February 2025), π0.5 in April 2025, π0.6 and π*0.6 in November 2025, and described π0.7 in an April 2026 paper as a steerable generalist model with emergent capabilities.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Leading series of robot foundation models |\n| Architecture | VLM backbone + continuous action expert |\n| Training | Diverse multi-robot data, co-training with web data, RL from experience (π*0.6) |\n| Deployment | Partners fine-tune for tasks like warehouse packing and laundry |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  P0[π0 Oct 2024: flow-matching VLA] --> P05[π0.5 Apr 2025: open-world generalization]\n  P05 --> P06[π0.6 / π*0.6 Nov 2025: learning from experience]\n  P06 --> P07[π0.7 Apr 2026: steerable, compositional]\n```\n\n### Worked example\n\n| Reported milestone | Date |\n|---|---|\n| Cleaning unseen homes with mobile manipulators (π0.5) | 2025 |\n| Espresso, laundry and box assembly with Recap training (π*0.6) | Nov 2025 |\n| 96.4% autonomy across a full warehouse shift for a partner (π0.6) | Feb 2026 |"}, {"id": 126, "title": "Gemini Robotics", "tldr": "Google DeepMind’s Gemini Robotics models bring Gemini’s multimodal understanding to robots: a VLA for control, an embodied reasoning (ER) model for planning and spatial understanding, and on-device versions. Version 2 added whole-body humanoid control and multi-robot teamwork.", "real": "Gemini Robotics and Gemini Robotics-ER launched in March 2025, version 1.5 followed in September 2025, and Gemini Robotics 2 (July 30, 2026) added whole-body control; Gemini Robotics ER 2 became available in Google AI Studio.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Google DeepMind’s robot foundation model family |\n| Components | VLA (action), ER (reasoning/planning), On-Device (local inference) |\n| Notable | Motion transfer across embodiments; safety benchmarks |\n| Partners | Boston Dynamics (Atlas), Apptronik and others |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  USER[User instruction] --> ER[Gemini Robotics ER 2: plan + track progress]\n  ER -->|subtask| VLA[Gemini Robotics 2 VLA]\n  VLA --> ROBOT[Humanoid: feet to fingertips]\n  ROBOT --> CAM[Video feed]\n  CAM --> ER\n```\n\n### Worked example\n\n| Model | Role | Availability (2026) |\n|---|---|---|\n| Gemini Robotics ER 2 | High-level reasoning, planning, tool calling | Google AI Studio; enterprise preview |\n| Gemini Robotics 2 | VLA for whole-body control | Early-access partners |\n| Gemini Robotics On-Device 2 | Efficient local VLA | Early-access partners |"}, {"id": 127, "title": "NVIDIA Isaac GR00T", "tldr": "NVIDIA’s GR00T models are open foundation models for humanoid robots, using a dual-system design: a vision-language module for understanding and a diffusion-based action module for fast motor output, trained on real, synthetic and human video data.", "real": "NVIDIA announced GR00T N1 in March 2025, released N1.5 and N1.6 (CES 2026), and at GTC in March 2026 previewed GR00T N2, which it said would be available by the end of 2026.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Open humanoid foundation models from NVIDIA |\n| Design | “System 2” reasoning VLM + “System 1” fast action generation |\n| Data | Real robot data, simulation, synthetic video, human video |\n| Ecosystem | Isaac Lab, Cosmos, Jetson Thor, LeRobot integration |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SYS2[System 2: VLM reasoning, slower] --> SYS1[System 1: diffusion action module, fast]\n  SENSORS[Cameras + state] --> SYS2\n  SENSORS --> SYS1\n  SYS1 --> JOINTS[Humanoid joint actions]\n```\n\n### Worked example\n\n| Version | Announced |\n|---|---|\n| GR00T N1 | March 2025 |\n| GR00T N1.5 | May 2025 |\n| GR00T N1.6 | January 2026 (CES) |\n| GR00T N2 | Previewed March 2026; expected by end of 2026 |"}, {"id": 128, "title": "Company VLAs: Helix, Optimus and others", "tldr": "Humanoid companies develop their own models tightly integrated with their hardware: Figure’s Helix, Tesla’s Optimus AI (sharing technology with its driving stack), 1X’s world-model-based approach, and Chinese companies such as AgiBot. Details are often less public than research models.", "real": "Figure introduced Helix in February 2025 as a VLA with a slower reasoning system and a fast control system running on the robot, controlling the full humanoid upper body.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Proprietary robot models tied to specific hardware |\n| Advantage | Tight co-design of hardware, data and model |\n| Limitation | Less transparent; evaluation mostly via company demos |\n| Watch out for | Comparing models using non-standardized demo videos |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  COMPANY[Humanoid company] --> HW[Own hardware]\n  COMPANY --> DATA[Own teleop + fleet data]\n  COMPANY --> MODEL[Own VLA]\n  HW --> LOOP[Deploy → collect → improve]\n  DATA --> LOOP\n  MODEL --> LOOP\n```\n\n### Worked example\n\n| Questions to evaluate a company model | Why |\n|---|---|\n| Fully autonomous or teleoperated segments? | Separates capability from operation |\n| Success rate over long shifts? | Commercial viability |\n| Generalization to new sites? | Scalability |\n| Human interventions per hour? | Operating cost |"}, {"id": 129, "title": "Hierarchical systems: reasoning plus control", "tldr": "Many systems split responsibilities: a high-level model (LLM/VLM) interprets instructions, plans steps and monitors progress, while a low-level policy or classical controller executes skills. This combines broad reasoning with fast, reliable motor control.", "real": "SayCan (2022) combined a language model with value functions of robot skills, and Gemini Robotics ER 2 (2026) calls a VLA as a tool while tracking progress from video.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Layered reasoning and acting |\n| High level | Task decomposition, progress monitoring, error recovery, human dialogue |\n| Low level | Skills: grasp, place, navigate, VLA subtasks |\n| Watch out for | Plans the low level can’t execute; poor failure feedback |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INSTR[Clean up the kitchen] --> PLANNER[VLM / LLM planner]\n  PLANNER --> SUB1[Subtask: put cups in sink]\n  PLANNER --> SUB2[Subtask: wipe counter]\n  SUB1 --> SKILL[VLA / skill library]\n  SUB2 --> SKILL\n  SKILL --> OBS[Observation]\n  OBS --> PLANNER\n```\n\n### Worked example\n\n```text\nInstruction: \"Make me a coffee\"\nPlanner steps: (1) find mug (2) place mug under machine (3) press brew button (4) wait (5) bring mug\nMonitor: after step 3, check video for coffee flow; if none, retry button press or report\n```"}, {"id": 130, "title": "Fine-tuning and deploying a VLA", "tldr": "To use a VLA for a specific robot and task: collect demonstrations on your hardware, convert to the model’s data format and action space, fine-tune (often parameter-efficiently), evaluate rigorously, optimize inference for on-robot compute, and add safety layers and monitoring.", "real": "Physical Intelligence’s partners fine-tuned π0.5 and π0.6 for warehouse and laundry tasks in 2026, and NVIDIA released post-training workflows for GR00T models with Isaac Lab and LeRobot.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Adapting a foundation model to your robot |\n| Data | Tens to hundreds of hours of task demonstrations, depending on difficulty |\n| Methods | Full fine-tuning or LoRA/adapters |\n| Watch out for | Action space mismatch, camera placement changes, latency |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  COLLECT[Collect demos on your robot] --> CONVERT[Convert format + normalize actions]\n  CONVERT --> FT[Fine-tune base VLA]\n  FT --> EVAL[Evaluate: sim + real trials]\n  EVAL --> OPT[Optimize inference: quantize, TensorRT]\n  OPT --> DEPLOY[Deploy with safety layer + monitoring]\n  DEPLOY --> COLLECT\n```\n\n### Worked example\n\n| Deployment checklist item | Example |\n|---|---|\n| Control rate achieved | 50 Hz action chunks, 10 Hz model inference |\n| Safety envelope | Joint/velocity/force limits enforced outside the model |\n| Fallback | Stop and request help on low confidence |\n| Data logging | Record interventions for next fine-tune |"}, {"id": 131, "title": "Why simulation matters", "tldr": "Simulation lets robots train and be tested safely, cheaply and at massive scale: thousands of parallel environments, rare edge cases, perfect labels and automatic resets. The challenge is the sim-to-real gap between simulated and real physics, sensors and appearance.", "real": "GPU-parallel simulators let legged locomotion policies train in minutes rather than days, and Waymo reported running billions of simulated miles to test its driving software alongside real-world driving.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Virtual environments for training and testing |\n| Benefits | Scale, safety, reproducibility, edge cases, ground truth |\n| Uses | RL training, synthetic data, regression testing, design iteration |\n| Watch out for | Policies exploiting simulator inaccuracies |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ASSETS[Robot + scene assets] --> SIM[Simulator]\n  SIM --> TRAIN[Policy training at scale]\n  SIM --> TEST[Scenario testing]\n  SIM --> SYNTH[Synthetic labeled data]\n  TRAIN --> REAL[Real robot]\n  REAL --> GAP[Measure sim-to-real gap]\n  GAP --> SIM\n```\n\n### Worked example\n\n```text\nReal-world collection: 1 robot × 8 h/day × 1 episode/min = 480 episodes/day\nSimulation: 4,096 parallel envs × 1 episode/10 s simulated, at 10× real time → ~14.7 million episodes/hour of wall-clock\n```"}, {"id": 132, "title": "Physics engines", "tldr": "Physics engines simulate rigid bodies, joints, contacts and friction (and sometimes soft bodies, cloth and fluids). They differ in contact models, accuracy, speed and GPU support; contact handling is the hardest part to get both stable and realistic.", "real": "MuJoCo was created by Emanuel Todorov (2012), acquired by DeepMind in 2021 and open-sourced in 2022; NVIDIA, Google DeepMind and Disney announced the Newton physics engine in 2025, later contributed to the Linux Foundation.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Software computing physical motion and contact |\n| Examples | MuJoCo/MJX, PhysX, Bullet, Drake, Newton, Warp-based engines |\n| Key settings | Timestep, solver iterations, friction, contact stiffness |\n| Watch out for | Unrealistic contacts letting policies “cheat” |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  STATE[State: positions, velocities] --> COLLIDE[Collision detection]\n  COLLIDE --> CONTACT[Contact + friction solve]\n  CONTACT --> INTEGRATE[Integrate dynamics]\n  INTEGRATE --> STATE\n```\n\n### Worked example\n\n| Engine | Notable strengths |\n|---|---|\n| MuJoCo / MJX | Accurate, fast contacts; JAX GPU version (MJX) |\n| PhysX (Isaac Sim/Lab) | GPU-parallel, photoreal rendering ecosystem |\n| Bullet / PyBullet | Easy to start, widely used historically |\n| Drake | Rigorous multibody dynamics + optimization tools |\n| Newton | Open GPU engine from NVIDIA, Google DeepMind and Disney |"}, {"id": 133, "title": "Robot simulators", "tldr": "Simulators combine physics, rendering, sensors, robot models and tooling: NVIDIA Isaac Sim/Isaac Lab (photoreal, GPU-parallel RL), MuJoCo-based frameworks, Gazebo (ROS integration), Genesis, ManiSkill and driving simulators such as CARLA.", "real": "NVIDIA introduced Isaac Lab-Arena at CES 2026 as an open-source framework for evaluating robot policies in simulation, and Google DeepMind released MuJoCo Playground in 2025 for GPU-accelerated robot learning.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Full simulation environments for robots |\n| Choices | Isaac Sim/Lab, MuJoCo + Playground, Gazebo, Genesis, ManiSkill, CARLA |\n| Selection | Physics fidelity, rendering needs, GPU scale, ROS integration |\n| Watch out for | Choosing photorealism when contact accuracy matters more |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  NEED{Main need} -->|massive RL + photoreal sensors| ISAAC[Isaac Sim / Isaac Lab]\n  NEED -->|accurate contact, research, JAX| MUJOCO[MuJoCo / MJX / Playground]\n  NEED -->|ROS 2 system integration| GAZEBO[Gazebo]\n  NEED -->|manipulation benchmarks| MANISKILL[ManiSkill / LIBERO]\n  NEED -->|autonomous driving| CARLA[CARLA / vendor sims]\n```\n\n### Worked example\n\n| Use case | Simulator choice |\n|---|---|\n| Train humanoid locomotion with RL | Isaac Lab or MuJoCo Playground |\n| Test a ROS 2 navigation stack | Gazebo or Isaac Sim with ROS bridge |\n| Generate labeled images for detection | Isaac Sim (Replicator) |\n| Benchmark manipulation policies | LIBERO, ManiSkill, Isaac Lab-Arena |"}, {"id": 134, "title": "Hands-on: simulating with MuJoCo", "tldr": "MuJoCo models are written in MJCF (XML): bodies, joints, geometry, actuators and sensors. The Python bindings let you step the simulation, read state, apply controls and render, making it ideal for learning control and RL.", "real": "MuJoCo’s official Python package (pip install mujoco) provides MjModel and MjData classes and a viewer, and is widely used in RL benchmarks such as Gymnasium’s MuJoCo environments.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Practical MuJoCo usage |\n| Model | MJCF XML: worldbody, bodies, joints, geoms, actuators |\n| Loop | Set `data.ctrl` → `mj_step` → read `data.qpos`, `data.qvel` |\n| Watch out for | Missing inertial properties and too-large timesteps |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  XML[MJCF model] --> MODEL[MjModel]\n  MODEL --> DATA[MjData: state]\n  CTRL[Controller sets data.ctrl] --> STEP[mj_step]\n  DATA --> STEP\n  STEP --> DATA\n```\n\n### Worked example\n\n```python\nimport mujoco\nimport numpy as np\n\nXML = \"\"\"\n<mujoco>\n  <option timestep=\"0.002\"/>\n  <worldbody>\n    <body name=\"pendulum\" pos=\"0 0 1\">\n      <joint name=\"hinge\" type=\"hinge\" axis=\"0 1 0\" damping=\"0.05\"/>\n      <geom type=\"capsule\" fromto=\"0 0 0 0 0 -0.5\" size=\"0.02\" mass=\"1\"/>\n    <\/body>\n  <\/worldbody>\n  <actuator><motor joint=\"hinge\" gear=\"1\" ctrlrange=\"-10 10\"/><\/actuator>\n<\/mujoco>\n\"\"\"\nmodel = mujoco.MjModel.from_xml_string(XML)\ndata = mujoco.MjData(model)\ndata.qpos[0] = 0.5                                      # start tilted 0.5 rad\ntarget, kp, kd = 0.0, 20.0, 2.0\nfor _ in range(2000):                                   # 4 simulated seconds\n    data.ctrl[0] = kp * (target - data.qpos[0]) - kd * data.qvel[0]\n    mujoco.mj_step(model, data)\nprint(round(float(data.qpos[0]), 4))                    # close to 0\n```"}, {"id": 135, "title": "Building simulation assets", "tldr": "Simulation quality depends on assets: accurate robot models (kinematics, inertia, joint limits, actuator models), collision meshes, object models with realistic mass and friction, and scenes. Assets come from CAD, scans, procedural generation and asset libraries.", "real": "Robot description repositories such as MuJoCo Menagerie (Google DeepMind) provide curated, tuned models of many commercial robots for simulation.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Models of robots, objects and environments |\n| Robot | URDF/MJCF/USD with correct inertia, limits, actuators |\n| Objects | Visual + simplified collision meshes, mass, friction |\n| Watch out for | High-poly collision meshes slowing simulation |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CAD[CAD / scans] --> CLEAN[Simplify meshes]\n  CLEAN --> PHYS[Assign mass, inertia, friction]\n  PHYS --> FORMAT[Export URDF / MJCF / USD]\n  FORMAT --> VALIDATE[Validate vs real robot motions]\n```\n\n### Worked example\n\n| Asset property | Effect if wrong |\n|---|---|\n| Link inertia | Unrealistic swinging and control gains |\n| Joint friction/damping | Policies too aggressive on hardware |\n| Object friction | Grasps succeed in sim, slip in reality |\n| Collision geometry | Fingers pass through or catch on phantom edges |"}, {"id": 136, "title": "Domain randomization", "tldr": "Domain randomization varies simulation parameters (friction, masses, motor strength, latency, lighting, textures, camera pose) during training so the policy treats the real world as just another variation. It’s the most widely used sim-to-real technique.", "real": "Tobin and colleagues (2017) used randomized textures and lighting to transfer object detectors from simulation to reality, and OpenAI’s 2019 Rubik’s Cube hand used automatic domain randomization that widened ranges as the policy improved.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Training across randomized simulation conditions |\n| Physics randomization | Friction, mass, motor strength, delays, noise |\n| Visual randomization | Lighting, textures, camera pose, distractors |\n| Watch out for | Ranges too narrow (no transfer) or too wide (overly conservative policies) |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EPISODE[New training episode] --> SAMPLE[Sample physics + visual parameters]\n  SAMPLE --> SIM[Simulate]\n  SIM --> POLICY[Policy learns robust behavior]\n  POLICY --> REAL[Real world = one more variation]\n```\n\n### Worked example\n\n| Parameter | Randomization range (example) |\n|---|---|\n| Ground friction | 0.4–1.2 |\n| Payload mass | +0 to +3 kg |\n| Motor strength | ±15% |\n| Action latency | 0–20 ms |\n| Camera position | ±2 cm, ±3° |"}, {"id": 137, "title": "Sim-to-real transfer", "tldr": "Bridging the sim-to-real gap combines accurate modeling (system identification, actuator networks), domain randomization, realistic sensor simulation, observation design that avoids sim-only signals, real-world fine-tuning and careful staged deployment.", "real": "Hwangbo and colleagues (Science Robotics, 2019) trained a neural network model of ANYmal’s actuators from real data and used it in simulation, enabling RL policies that transferred to the real robot.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Making simulated training work on real robots |\n| Techniques | System ID, actuator models, randomization, real fine-tuning |\n| Validation | Compare sim vs real trajectories for identical commands |\n| Watch out for | Privileged sim information leaking into policy inputs |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REALDATA[Real robot logs] --> SYSID[System identification]\n  SYSID --> SIM[Calibrated simulator]\n  SIM --> TRAIN[Train with randomization]\n  TRAIN --> DEPLOY[Deploy cautiously]\n  DEPLOY --> COMPARE[Compare behavior]\n  COMPARE --> SYSID\n```\n\n### Worked example\n\n| Sim-to-real gap source | Mitigation |\n|---|---|\n| Actuator torque-speed limits | Model motor curves; actuator networks |\n| Sensor latency | Add delays in sim |\n| Contact/friction differences | Randomize + measure real friction |\n| Visual appearance | Randomization, generative augmentation, real images |"}, {"id": 138, "title": "Digital twins", "tldr": "Digital twins are simulation replicas of real facilities (factories, warehouses) used to plan layouts, test robot fleets, train policies and validate changes before touching production. They need accurate geometry, process data and synchronization with reality.", "real": "NVIDIA Omniverse-based digital twins are used by companies such as KION and Accenture for warehouse automation, and BMW has used Omniverse to plan factories virtually before construction.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Live or high-fidelity virtual copies of facilities |\n| Uses | Layout planning, fleet testing, training, what-if analysis |\n| Inputs | CAD, scans, process data, robot models |\n| Watch out for | Twins that drift from reality after changes |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  FACILITY[Real warehouse] --> SCAN[Scans + CAD + process data]\n  SCAN --> TWIN[Digital twin]\n  TWIN --> TEST[Test fleet layouts + policies]\n  TEST --> CHANGES[Validated changes]\n  CHANGES --> FACILITY\n  FACILITY -->|live data| TWIN\n```\n\n### Worked example\n\n| Question answered in a twin | Example |\n|---|---|\n| How many AMRs are needed for peak throughput? | Simulate 20 vs 30 robots |\n| Will a new shelf layout cause congestion? | Measure traffic jams |\n| Does the new picking policy work across all aisles? | Run policy in simulated aisles |"}, {"id": 139, "title": "World models", "tldr": "World models learn to predict how the world evolves (future video frames or latent states) given actions. They can generate synthetic training data, evaluate policies without real robots, enable planning by imagining outcomes and provide representations for control.", "real": "NVIDIA released Cosmos world foundation models in January 2025 (with Cosmos Predict and Transfer 2.5 at CES 2026 and Cosmos 3 Edge in July 2026), Google DeepMind introduced Genie 3 in August 2025, and Meta released V-JEPA 2 in June 2025.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Learned simulators of physical dynamics |\n| Uses | Synthetic data, policy evaluation, planning, representation learning |\n| Types | Video-generation world models, latent predictive models (JEPA) |\n| Watch out for | Physically implausible predictions on rare situations |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  FRAMES[Current observations] --> WM[World model]\n  ACTIONS[Candidate actions] --> WM\n  WM --> FUTURE[Predicted future frames / states]\n  FUTURE --> SCORE[Score outcomes]\n  SCORE --> CHOOSE[Choose best action or train policy]\n```\n\n### Worked example\n\n| World model use | Example |\n|---|---|\n| Synthetic data | Turn one demo into many lighting/weather variants |\n| Policy evaluation | Predict whether a policy rollout succeeds before real testing |\n| Planning | Imagine outcomes of candidate grasps |\n| Pretraining | Learn physical intuition from video |"}, {"id": 140, "title": "Synthetic data generation", "tldr": "Synthetic data from simulators and generative models provides labeled images, rare scenarios and demonstration variations at scale. It works best mixed with real data, with realism and diversity checked by evaluating models on real-world test sets.", "real": "NVIDIA’s Physical AI Data Factory blueprint (2026) and tools such as Isaac Sim Replicator and Cosmos Transfer were designed to generate synthetic robot and AV training data at scale.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Artificially generated training data |\n| Sources | Simulation rendering, procedural scenes, generative world models |\n| Benefits | Perfect labels, rare cases, scale, privacy |\n| Watch out for | Models learning synthetic artifacts that don’t exist in reality |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SCENES[Procedural scenes] --> RENDER[Render with randomization]\n  RENDER --> LABELS[Auto labels: masks, poses, depth]\n  REALDEMO[Real demos] --> GENAUG[Generative variations]\n  LABELS --> MIX[Mix with real data]\n  GENAUG --> MIX\n  MIX --> TRAIN[Train]\n  TRAIN --> REALTEST[Evaluate on real test set]\n```\n\n### Worked example\n\n| Training mix for a detector | Real-world mAP (illustrative) |\n|---|---|\n| 5,000 real images | 0.62 |\n| 50,000 synthetic only | 0.48 |\n| 5,000 real + 50,000 synthetic | 0.71 |"}, {"id": 141, "title": "The robot data bottleneck", "tldr": "Language models trained on trillions of web tokens, but robot action data must be physically collected, robot by robot. Data scale, diversity and quality are the main constraints on robot foundation models, driving investment in teleoperation fleets, simulation and human video.", "real": "Physical Intelligence’s π0 paper (2024) described pretraining on over 10,000 hours of robot data across 7 robot configurations and 68 tasks, large for robotics yet tiny compared with web-scale text corpora.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The shortage of robot action data |\n| Why | Data needs physical robots, operators, time and resets |\n| Responses | Teleop fleets, sim, world models, human video, cross-embodiment pooling |\n| Watch out for | Quantity without diversity: many hours of the same task |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  WEB[Web text + images: trillions of tokens] --> VLM[Pretrained VLM knowledge]\n  VIDEO[Human video: huge, no robot actions] --> MID[Physical understanding]\n  SIM[Simulation: scalable, gap to reality] --> MID\n  ROBOT[Real robot data: small, exact actions] --> POLICY[Robot policy]\n  VLM --> POLICY\n  MID --> POLICY\n```\n\n### Worked example\n\n```text\nOne teleoperator: ~6 productive hours/day × 250 days ≈ 1,500 hours/year\n10,000 hours of robot data ≈ 7 operator-years of continuous collection\n100 operators × 1,500 h ≈ 150,000 hours/year (before quality filtering)\n```"}, {"id": 142, "title": "The data pyramid", "tldr": "Robot learning combines data sources in a pyramid: abundant but indirect data at the base (web, human video), synthetic data in the middle (simulation, world models), and scarce but precise real robot data at the top (teleoperation, deployment logs).", "real": "NVIDIA described a “data pyramid” for training GR00T models combining web and human video, synthetic data and real robot trajectories.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Framework for mixing data sources |\n| Base | Web images, text, human video (scale, no actions) |\n| Middle | Simulation and generated data (scalable, imperfect) |\n| Top | Real robot demos and logs (exact, expensive) |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  TOP[Real robot data: precise, scarce]\n  MIDDLE[Synthetic: simulation + world models]\n  BASE[Web data + human video: abundant, indirect]\n  BASE --> MIDDLE --> TOP\n```\n\n### Worked example\n\n| Data source | Provides | Lacks |\n|---|---|---|\n| Web images/text | Semantics, object knowledge | Actions, physics |\n| Human video | How tasks are done | Robot action labels, embodiment match |\n| Simulation | Unlimited labeled trials | Real physics/appearance fidelity |\n| Teleoperation | Exact robot actions | Scale, cost-efficiency |"}, {"id": 143, "title": "Running teleoperation data operations", "tldr": "Large-scale data collection is an operations business: training operators, defining tasks and scenes, rotating objects and environments for diversity, quality control, hardware maintenance, metadata, and tracking cost per useful hour of data.", "real": "Boston Dynamics and Hyundai announced a Robot Metaplant Application Center opening in 2026 to collect training data for Atlas, and many humanoid companies operate dedicated teleoperation facilities.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Organized collection of demonstration data |\n| Key processes | Task specs, operator training, scene variation, QA, metadata |\n| Metrics | Useful hours/day, rejection rate, diversity coverage, cost/hour |\n| Watch out for | Operator fatigue degrading data quality |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SPEC[Task specification] --> OPS[Operators collect episodes]\n  VARY[Vary objects, scenes, lighting] --> OPS\n  OPS --> QA[Quality review]\n  QA -->|reject| DISCARD[Discard / relabel]\n  QA -->|accept| STORE[(Dataset + metadata)]\n  STORE --> TRAIN[Training + evaluation]\n  TRAIN -->|gaps found| SPEC\n```\n\n### Worked example\n\n```text\nCost per useful hour of data (illustrative):\nOperator ₹600/h + robot amortization ₹400/h + supervision/QA ₹200/h = ₹1,200 per collection hour\nAcceptance rate 75% → ₹1,600 per useful hour\n```"}, {"id": 144, "title": "Learning from human video", "tldr": "Human videos show how people do countless tasks. Methods extract hand poses, object motions and affordances, use video to pretrain visual representations or world models, or align human egocentric data with robot data so models transfer skills across embodiments.", "real": "The Ego4D dataset (2021) released 3,670 hours of egocentric video, and Physical Intelligence reported in December 2025 that robot foundation models increasingly align human egocentric video with robot behavior after enough diverse pretraining.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Using videos of people as training signal |\n| Methods | Representation pretraining, hand/object tracking, latent actions, co-training |\n| Benefit | Massive scale and task diversity |\n| Watch out for | Embodiment gap: human hands vs robot grippers |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EGO[Egocentric human video] --> HAND[Extract hand + object motion]\n  EGO --> PRETRAIN[Pretrain visual / world model]\n  HAND --> RETARGET[Retarget to robot]\n  PRETRAIN --> POLICY[Robot policy]\n  RETARGET --> POLICY\n  ROBOTDATA[Robot demos] --> POLICY\n```\n\n### Worked example\n\n| Human video use | What transfers |\n|---|---|\n| Visual pretraining | Object understanding, scene features |\n| Hand trajectories | Approach paths, grasp locations |\n| Co-training with robot data | Task structure and sequencing |"}, {"id": 145, "title": "Robot datasets landscape", "tldr": "Public datasets include large cross-embodiment collections (Open X-Embodiment), in-the-wild manipulation (DROID), simulation benchmarks (LIBERO), humanoid and bimanual datasets (AgiBot World and others), and driving datasets (Waymo Open, nuScenes). Check licenses and formats.", "real": "DROID (2024) collected about 76,000 manipulation trajectories (around 350 hours) across hundreds of scenes, and AgiBot World (2025) released over one million trajectories from its robot fleet.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Public data for training and benchmarking |\n| Manipulation | Open X-Embodiment, DROID, BridgeData, AgiBot World |\n| Driving | Waymo Open Dataset, nuScenes, Argoverse |\n| Watch out for | Licenses restricting commercial use |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  DATASETS[Public datasets] --> MANIP[Manipulation: OXE, DROID, Bridge, AgiBot World]\n  DATASETS --> SIMBENCH[Sim benchmarks: LIBERO, ManiSkill]\n  DATASETS --> DRIVE[Driving: Waymo Open, nuScenes]\n  DATASETS --> HUMAN[Human video: Ego4D, EPIC-KITCHENS]\n```\n\n### Worked example\n\n| Dataset | Domain | Approximate scale |\n|---|---|---|\n| Open X-Embodiment | Cross-embodiment manipulation | 1M+ trajectories, 22 robots |\n| DROID | Single-arm, diverse scenes | \\~76k trajectories |\n| Ego4D | Human egocentric video | 3,670 hours |\n| Waymo Open Dataset | Driving perception + motion | Thousands of scenes |"}, {"id": 146, "title": "Data formats and storage", "tldr": "Robot data combines synchronized multi-camera video, joint states, actions, language annotations and metadata. Common formats include RLDS (TFRecord-based), LeRobotDataset (Parquet + video), HDF5, MCAP/rosbag2, with video compression to manage size.", "real": "Open X-Embodiment used the RLDS format, while Hugging Face’s LeRobotDataset stores tabular data in Parquet and camera streams as MP4 video, making datasets easier to stream from the Hugging Face Hub.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How robot episodes are stored |\n| Contents | Timestamps, observations, actions, rewards/success, language, metadata |\n| Formats | RLDS, LeRobotDataset, HDF5, MCAP |\n| Watch out for | Unsynchronized streams and missing calibration metadata |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  RAW[Raw logs: rosbag / MCAP] --> SYNC[Synchronize + resample to fixed rate]\n  SYNC --> CONVERT[Convert to training format]\n  CONVERT --> VIDEO[Cameras → compressed video]\n  CONVERT --> TABLE[States + actions → Parquet]\n  VIDEO --> HUB[(Dataset repository)]\n  TABLE --> HUB\n```\n\n### Worked example\n\n| Field | Example |\n|---|---|\n| episode_index | 1042 |\n| timestamp | 3.433 s |\n| observation.images.wrist | Frame from wrist video |\n| observation.state | 7 joint positions + gripper |\n| action | 7 joint targets + gripper command |\n| task | “put the red block in the bowl” |"}, {"id": 147, "title": "Data quality and curation", "tldr": "Data quality matters more than volume: consistent strategies, smooth motions, correct labels and balanced coverage. Curation filters failed or noisy episodes, balances tasks, removes duplicates and identifies gaps using evaluation failures.", "real": "Research on robot data mixtures has found that dataset composition and quality filtering significantly affect policy performance, and companies report that targeted data collection on observed failure modes yields large gains.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Ensuring training data helps rather than hurts |\n| Checks | Success labels, synchronization, smoothness, operator consistency |\n| Curation | Filtering, balancing, deduplication, gap analysis |\n| Watch out for | Inconsistent strategies across operators confusing the policy |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EPISODES[All episodes] --> AUTO[Automatic checks: sync, length, jerk]\n  AUTO --> LABEL[Success labeling]\n  LABEL --> BALANCE[Balance tasks / scenes]\n  BALANCE --> TRAINSET[Training set]\n  EVALFAIL[Evaluation failures] --> GAPS[Collect targeted data]\n  GAPS --> EPISODES\n```\n\n### Worked example\n\n| Quality check | Rule |\n|---|---|\n| Frame drops | Reject if > 2% frames missing |\n| Episode length | Reject if > 3× median (operator struggled) |\n| Action jerk | Flag sudden spikes in commanded velocity |\n| Success | Human or classifier label required |"}, {"id": 148, "title": "Annotation and language labels", "tldr": "Language-conditioned policies need instructions and often subtask segmentation, success labels and failure reasons. VLMs can automate much of this annotation (captioning episodes, segmenting subtasks), with human spot checks.", "real": "Robot foundation model developers increasingly use VLMs to relabel and enrich episode annotations with detailed descriptions, and π0.7 (2026) emphasized that detailed context information improved how diverse data boosted performance.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Adding semantic labels to robot data |\n| Labels | Instructions, subtask boundaries, success, failure reasons, object names |\n| Automation | VLM captioning + human verification |\n| Watch out for | Vague labels (“do the task”) that teach nothing |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EPISODE[Episode video] --> VLM[VLM: describe + segment subtasks]\n  VLM --> DRAFT[Draft labels]\n  DRAFT --> HUMAN[Human spot-check 10%]\n  HUMAN --> FINAL[Final annotations]\n```\n\n### Worked example\n\n| Label level | Example |\n|---|---|\n| Task | “Make a cup of tea” |\n| Subtask | “Pick up the tea bag” (frames 120–310) |\n| Detail | “Grasp the tea bag by its string with the right gripper” |\n| Outcome | Success; minor regrasp at frame 205 |"}, {"id": 149, "title": "Fleet learning and data flywheels", "tldr": "Deployed robots generate data continuously. A data flywheel captures interventions, failures and successes from the fleet, curates them, retrains models, evaluates and redeploys, so performance improves with deployment scale.", "real": "Physical Intelligence’s partners described human-in-the-loop intervention systems that ensure correctness while continuously generating new data that improves each model iteration (2026), a flywheel pattern also used in autonomous driving.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Continuous improvement from deployment data |\n| Signals | Interventions, failures, near-misses, successes, customer feedback |\n| Requirements | Logging, triggers, labeling, retraining, safe rollout |\n| Watch out for | Regressions from untested model updates pushed to the fleet |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  FLEET[Robot fleet] --> EVENTS[Interventions + failures]\n  EVENTS --> CURATE[Curate + label]\n  CURATE --> RETRAIN[Retrain]\n  RETRAIN --> EVAL[Evaluate: sim + shadow + real]\n  EVAL --> ROLLOUT[Staged rollout]\n  ROLLOUT --> FLEET\n```\n\n### Worked example\n\n| Fleet metric | Month 1 | Month 6 |\n|---|---|---|\n| Interventions per robot-hour | 4.0 | 0.8 |\n| Task success | 82% | 95% |\n| New data hours per month | 300 | 1,200 |\n\n(Illustrative of a healthy flywheel.)"}, {"id": 150, "title": "Privacy and ethics of robot data", "tldr": "Robots record homes, workplaces and public spaces, capturing people, faces, voices and private information. Responsible data practices include consent, minimization, on-device processing, blurring, access controls, retention limits and transparency.", "real": "Privacy concerns intensified after reports in 2022 that images captured by development versions of robot vacuums, including an image of a person in a bathroom, were shared with data labeling contractors and leaked online.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Protecting people captured in robot data |\n| Practices | Consent, signage, face/plate blurring, minimization, retention limits |\n| Law | GDPR, DPDP Act (India), local surveillance laws |\n| Watch out for | Third-party labelers with access to sensitive home footage |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CAPTURE[Robot captures data] --> ONDEVICE[On-device filtering + blurring]\n  ONDEVICE --> MIN[Upload only needed clips]\n  MIN --> ACCESS[Access controls + audit]\n  ACCESS --> RETENTION[Retention limits + deletion]\n```\n\n### Worked example\n\n| Context | Practice |\n|---|---|\n| Home robot | Explicit consent, privacy zones, local processing, user deletion controls |\n| Warehouse | Worker notices, focus cameras on work areas |\n| Public sidewalks | Blur faces and plates before storage |\n| Data labeling | Contractual privacy controls, minimum necessary access |"}, {"id": 151, "title": "Levels of driving automation", "tldr": "SAE J3016 defines six levels: 0–2 are driver support (the human drives and supervises), Level 3 lets the system drive in limited conditions with a human ready to take over, and Levels 4–5 drive without human supervision (Level 4 within a defined operational design domain).", "real": "Robotaxis such as Waymo operate at Level 4 within defined cities and conditions, while most consumer driver-assistance systems, including those marketed with “self-driving” names, are Level 2 and require constant supervision.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Standard taxonomy of driving automation |\n| Key boundary | Level 2 (human supervises) vs Level 4 (no human driver needed in ODD) |\n| ODD | Operational design domain: roads, weather, speeds, times |\n| Watch out for | Marketing names implying more autonomy than the level provides |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  L0[L0: no automation] --> L1[L1: steering OR speed assist]\n  L1 --> L2[L2: steering + speed, driver supervises]\n  L2 --> L3[L3: system drives, driver takes over on request]\n  L3 --> L4[L4: no driver needed within ODD]\n  L4 --> L5[L5: no driver needed anywhere]\n```\n\n### Worked example\n\n| System | Typical level |\n|---|---|\n| Adaptive cruise control | 1 |\n| Lane centering + adaptive cruise | 2 |\n| Traffic-jam pilot with approved eyes-off use | 3 |\n| Robotaxi in a mapped city | 4 |"}, {"id": 152, "title": "The autonomous driving stack", "tldr": "A classic AV stack has perception (detect and track objects), localization, prediction (forecast other agents), planning (choose a safe, comfortable trajectory) and control, supported by maps, simulation and safety monitors. Modern stacks increasingly use large learned models across these stages.", "real": "Waymo described its driving stack in 2026 as using transformer-based models trained on tens of millions of fully driverless trips plus billions of simulated scenarios.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Software architecture of a self-driving vehicle |\n| Modules | Perception, localization, prediction, planning, control |\n| Supporting | Maps, simulation, remote assistance, safety monitors |\n| Watch out for | Errors cascading between modules |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SENSORS[Cameras, LiDAR, radar] --> PERC[Perception + tracking]\n  MAP[Maps] --> LOC[Localization]\n  SENSORS --> LOC\n  PERC --> PRED[Prediction]\n  LOC --> PLAN[Planning]\n  PRED --> PLAN\n  PLAN --> CTRL[Control: steer, brake, throttle]\n  SAFETY[Safety monitor] -.-> CTRL\n```\n\n### Worked example\n\n| Module | Output |\n|---|---|\n| Perception | Pedestrian at (12.0 m, 2.1 m), moving 1.4 m/s |\n| Prediction | 70% crosses, 30% waits at curb |\n| Planning | Slow to 15 km/h, prepare to stop |\n| Control | Brake 1.5 m/s² |"}, {"id": 153, "title": "Sensors for autonomous vehicles", "tldr": "AVs combine cameras (semantics, traffic lights), radar (velocity, weather robustness) and often LiDAR (precise 3D), with redundancy across fields of view. Sensor choice involves cost, performance in weather and night, and safety redundancy.", "real": "Waymo vehicles use LiDAR, cameras and radar together, while Tesla relies on cameras only, representing two contrasting strategies in the industry.", "body": "### Physical AI card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Sensor suites for driving |\n| Cameras | Color, signs, lights; weaker in low light/glare |\n| Radar | Velocity, range, weather robust |\n| LiDAR | Precise 3D geometry; cost |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  CAR[Vehicle] --> FRONT[Long-range camera + radar + LiDAR]\n  CAR --> SIDES[Side cameras + radars]\n  CAR --> REAR[Rear camera + radar]\n  CAR --> ROOF[Roof LiDAR 360°]\n  FRONT --> FUSION[Fusion]\n  SIDES --> FUSION\n  REAR --> FUSION\n  ROOF --> FUSION\n```\n\n### Worked example\n\n| Condition | Camera | Radar | LiDAR |\n|---|---|---|---|\n| Night | Weak | Good | Good |\n| Heavy rain/fog | Weak | Good | Degraded |\n| Traffic light color | Good | No | No |\n| Precise shape/distance | Medium | Weak | Good |"}, {"id": 154, "title": "Maps: HD maps vs mapless driving", "tldr": "HD maps provide centimeter-level lane geometry, traffic controls and semantics, simplifying perception and planning but requiring maintenance. Mapless or lightweight-map approaches infer road structure online, scaling more easily to new areas.", "real": "Waymo uses detailed maps of its service areas, while companies such as Tesla and Wayve emphasize driving with less reliance on HD maps, and Mobileye crowdsources map data (REM) from production vehicles.", "body": "##

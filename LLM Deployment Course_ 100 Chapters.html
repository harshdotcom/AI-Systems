<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#14211D; --muted:#52615C; --line:#D3DCD9;
  --accent:#0B6E5A; --accent-soft:#D7EDE7; --accent-ink:#FFFFFF;
  --amber:#B97A0B; --tldr-bg:#FFF5DC; --tldr-line:#D49A22;
  --indigo:#3550B8; --real-bg:#EBF0FF; --real-line:#4C66CF;
  --code-bg:#15211D; --code-ink:#DCE8E3; --inline-code:#E3EBE8;
  --cell-empty:#D7DFDC; --shadow:0 1px 0 rgba(20,33,29,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1513; --surface:#151E1B; --surface-2:#1A2521; --ink:#E2EBE8; --muted:#93A49E; --line:#26332F;
    --accent:#46C4A6; --accent-soft:#183A31; --accent-ink:#06231C;
    --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
    --indigo:#9EADF5; --real-bg:#171E38; --real-line:#7E90EC;
    --code-bg:#0A100E; --code-ink:#D5E2DD; --inline-code:#22302B;
    --cell-empty:#26332F; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#151E1B; --surface-2:#1A2521; --ink:#E2EBE8; --muted:#93A49E; --line:#26332F;
  --accent:#46C4A6; --accent-soft:#183A31; --accent-ink:#06231C;
  --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
  --indigo:#9EADF5; --real-bg:#171E38; --real-line:#7E90EC;
  --code-bg:#0A100E; --code-ink:#D5E2DD; --inline-code:#22302B;
  --cell-empty:#26332F; --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header with the memory-bank progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:20px;padding:12px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted)}
.bank{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bank-row{display:flex;gap:4px;flex-wrap:nowrap;min-width:0}
.bank-group{flex:1;min-width:0;display:flex;gap:2px;padding:3px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.cell{flex:1;min-width:2px;max-width:10px;height:18px;border-radius:2px;background:var(--cell-empty);border:0;padding:0;cursor:pointer;transition:background .2s}
.cell.done{background:var(--accent)}
.cell.here{box-shadow:0 0 0 2px var(--amber)}
.bank-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bank-meta strong{color:var(--ink);font-weight:600}
.top-actions{display:flex;gap:8px}
.btn{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.menu-btn{display:none}

/* Shell */
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,76px));height:calc(100dvh - var(--top-h,76px) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg)}
.search{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
.part{margin-bottom:4px}
.part-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:8px;cursor:pointer}
.part-head:hover{background:var(--surface-2)}
.part-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);width:22px;flex:none}
.part-name{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.part-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.part-count.full{color:var(--accent);font-weight:600}
.part-list{list-style:none;margin:0 0 6px;padding:0 0 0 30px;display:none}
.part.open .part-list{display:block}
.ch-row{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:6px}
.ch-row.active{background:var(--accent-soft)}
.ch-row a{flex:1;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.ch-row a .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.tick{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:11px;height:11px;opacity:0}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{opacity:1;color:var(--accent-ink)}
.hidden{display:none!important}

/* Main reading area */
.main{padding:24px 32px 80px;min-width:0}
.crumb{font-size:14px;color:var(--muted);margin:0 0 12px}
.crumb a{color:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;font-size:14px;color:var(--muted);max-width:240px;text-align:left}
.tab .tab-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--cell-empty)}
.tab .dot.on{background:var(--accent)}
article{max-width:780px}
.ch-no{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--accent);font-size:15px;margin:0}
h1.ch-title{font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:6px 0 22px;font-weight:700;text-wrap:balance}
.box{border-radius:10px;padding:16px 18px;margin:0 0 26px;border-left:4px solid}
.box h2{font-size:14px;margin:0 0 6px;font-weight:600}
.box p{margin:0}
.tldr{background:var(--tldr-bg);border-color:var(--tldr-line)}
.tldr h2{color:var(--amber)}
.tldr p{font-size:17px;line-height:1.55}
.real{background:var(--real-bg);border-color:var(--real-line);margin-top:34px}
.real h2{color:var(--indigo)}
.body h3{font-size:20px;margin:30px 0 10px;letter-spacing:-.01em}
.body p{margin:0 0 14px}
.body ul,.body ol{padding-left:22px;margin:0 0 16px}
.body li{margin:4px 0}
.body li input[type=checkbox]{margin-right:6px;accent-color:var(--accent)}
.body code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.88em;background:var(--inline-code);padding:1px 5px;border-radius:4px}
.body pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13.5px;line-height:1.55;margin:0 0 18px}
.body pre code{background:none;padding:0;font-size:inherit;color:inherit}
.table-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.body table{border-collapse:collapse;width:100%;font-size:14px}
.body th,.body td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.body th{background:var(--surface-2);font-weight:600}
.body tr:last-child td{border-bottom:0}
.body strong{font-weight:600}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.complete{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:15px}
.complete .tick{border-color:currentColor;pointer-events:none}
.complete.on{background:var(--accent);color:var(--accent-ink)}
.complete.on .tick{background:var(--accent-ink);border-color:var(--accent-ink)}
.complete.on .tick svg{opacity:1;color:var(--accent)}
.nav{display:flex;gap:8px}
.nav .btn[disabled]{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}

/* Contents view */
.contents h1{font-size:32px;margin:0 0 6px;letter-spacing:-.02em}
.contents .lead{color:var(--muted);margin:0 0 24px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.pcard h2{font-size:15px;margin:0 0 2px;line-height:1.3}
.pcard .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pcard ol{list-style:none;padding:0;margin:0}
.pcard li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13.5px;line-height:1.35}
.pcard li a{color:var(--ink);text-decoration:none;flex:1}
.pcard li a:hover{text-decoration:underline}
.contents-actions{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}

/* Mobile */
.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);height:auto;z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .menu-btn{display:inline-block}
  .main{padding:18px 16px 60px}
  .top-inner{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand{flex:1}
  .bank{order:3;flex-basis:100%}
  .bank-row{gap:3px}
  .bank-group{gap:1px;padding:2px}
  .cell{height:14px;max-width:none}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const CHAPTERS = [{"id": 1, "title": "What “deploying a model” actually means", "tldr": "Deployment is four steps: copy the weights into GPU memory, reserve space for the KV cache, expose an API, then batch user requests through the GPU. Every decision in this course is about making those four steps fit and run fast.", "real": "When Meta released Llama 3.1 in July 2024, more than two dozen partners (AWS, Azure, Google Cloud, Databricks, Groq, Together and others) served it on day one. Each of them performed exactly these four steps, just at very different scales and with different engines.", "body": "### The four steps\n\n1. **Load weights.** The learned numbers (billions of them) are read from disk into GPU memory (VRAM).\n2. **Reserve the KV cache.** The inference engine measures leftover VRAM and turns it into a pool for each user’s conversation memory.\n3. **Expose an API.** A web server (usually OpenAI-compatible, e.g. `/v1/chat/completions`) accepts requests.\n4. **Serve.** Requests are tokenized, scheduled, batched together, run on the GPU, and the tokens are streamed back.\n\n### What can go wrong at each step\n\n| Step | Typical failure | Fix covered in |\n|---|---|---|\n| Load | Model bigger than VRAM | Quantization (ch. 21–45), more GPUs (ch. 56–60) |\n| KV cache | Not enough room for long chats | KV math (ch. 18–19), FP8 KV (ch. 45) |\n| API | Exposed with no auth | Gateways (ch. 79, 92) |\n| Serve | Slow under many users | Batching, throughput (ch. 61–65, 81–85) |\n\n### Mental model\n\nThink of the GPU as a kitchen. The weights are the cooking equipment (fixed, takes space), the KV cache is counter space for each order in progress, and the engine is the head chef deciding which orders to cook together. You can only take as many orders as you have counter space."}, {"id": 2, "title": "Parameters and weights", "tldr": "A parameter is one learned number. Model size in bytes ≈ number of parameters × bytes per parameter, so a 7B model at 2 bytes each is about 14 GB.", "real": "Meta’s Llama 3.1 405B is about 810 GB in BF16, too large for one 8×H100 server (640 GB of VRAM). Meta therefore also released an official FP8 version so the model could run on a single node.", "body": "### What “7B” means\n\n“7B” means about 7 billion parameters. Each parameter is a number inside a weight matrix of the network (attention projections, feed-forward layers, embeddings).\n\n### The size formula\n\n```\nSize in bytes ≈ parameters × bytes per parameter\n7B  × 2 bytes (BF16) ≈ 14 GB\n70B × 2 bytes (BF16) ≈ 140 GB\n70B × 0.5 bytes (INT4) ≈ 35 GB (+ overhead ≈ 38–42 GB)\n```\n\n### Common size classes\n\n| Class | Params | Examples | Where it runs |\n|---|---|---|---|\n| Small | 1–4B | Llama 3.2 3B, Qwen 4B, Phi | Laptops, phones, 8 GB GPUs |\n| Medium | 7–14B | Llama 3.1 8B, Mistral 7B, Qwen 14B | One 16–24 GB GPU |\n| Large | 24–34B | Gemma 27B, Qwen 32B | 24–48 GB GPU (quantized) |\n| Very large | 70–123B | Llama 3.3 70B, Mistral Large | 48–160 GB |\n| Frontier open | 200B–1T (often MoE) | DeepSeek V3, Qwen 235B, Kimi K2 | Multi-GPU servers |\n\n### Where the parameters live\n\nRoughly two-thirds of a dense model’s parameters sit in the feed-forward (MLP) layers and most of the rest in attention. Embeddings and the output head are a small share for big models but a large share for small ones, which is why tiny models quantize less neatly."}, {"id": 3, "title": "Data types and precision", "tldr": "The data type decides bytes per parameter: FP32 = 4, BF16/FP16 = 2, FP8/INT8 = 1, INT4 = 0.5, INT2 = 0.25. BF16 is today’s default for inference; lower precisions trade a little accuracy for big memory and speed savings.", "real": "Google invented bfloat16 (“brain floating point”) for its TPUs so training could use 16 bits without FP16’s overflow problems; it is now the default format of nearly every open model release. DeepSeek-V3 went further and was trained largely in FP8.", "body": "### Floating point vs integer\n\n- **Floating point** (FP32, BF16, FP16, FP8) stores a sign, an exponent and a mantissa, so it covers a huge range of magnitudes.\n- **Integer** (INT8, INT4, INT2) stores evenly spaced levels and needs a separate **scale** number to map them back to real values.\n\n### The full table\n\n| Type | Bits | Bytes/param | Levels or range | Typical use |\n|---|---|---|---|---|\n| FP32 | 32 | 4 | Huge range, high precision | Training master weights |\n| FP16 | 16 | 2 | Max ≈ 65,504, can overflow | Older inference |\n| BF16 | 16 | 2 | FP32-like range, less precision | **Default inference** |\n| FP8 E4M3 | 8 | 1 | ±448, floating | Fast modern inference |\n| INT8 | 8 | 1 | 256 levels | Quantized inference |\n| INT4 / FP4 | 4 | 0.5 | 16 levels | Small GPUs, dense serving |\n| INT2 | 2 | 0.25 | 4 levels | Extreme compression |\n\n### Why BF16 beat FP16\n\nBF16 keeps the same 8-bit exponent as FP32, so values do not overflow during long computations. It loses some fine precision, but neural networks tolerate that very well.\n\n### Hardware support matters\n\nA format is only fast if the GPU has native tensor-core support. FP8 is native on Ada (RTX 40, L40S, L4), Hopper (H100/H200) and Blackwell. FP4 (NVFP4/MXFP4) is native on Blackwell. Older GPUs can still *store* low-bit weights but must convert them back to 16-bit before multiplying."}, {"id": 4, "title": "The golden VRAM formula", "tldr": "Total VRAM = weights + KV cache + activations + overhead. Most beginners size only the weights and then run out of memory the moment real users arrive.", "real": "Hugging Face ships a memory estimator (`accelerate estimate-memory`), and community “Can I run it?” calculators exist for exactly this reason: the weights-only estimate is the number people get wrong most often when buying GPUs.", "body": "### The formula\n\n```\nTotal VRAM ≈ Weights + KV cache + Activations + Framework overhead\n\nWeights   = params × bytes_per_param\nKV cache  = KV bytes per token × total tokens of all active users\nOverhead  ≈ 1–3 GB (CUDA context, kernels, CUDA graphs, fragmentation)\n```\n\n### Weights cheat table\n\n| Model | BF16 | FP8 / INT8 | INT4 | INT2 |\n|---|---|---|---|---|\n| 8B | 16 GB | 8 GB | \\~5 GB | \\~3 GB |\n| 14B | 28 GB | 14 GB | \\~8.5 GB | \\~4.5 GB |\n| 32B | 64 GB | 32 GB | \\~18–20 GB | \\~10 GB |\n| 70B | 140 GB | 70 GB | \\~38–42 GB | \\~20–26 GB |\n| 405B | 810 GB | 405 GB | \\~220 GB | \\~110 GB |\n\nINT4 is slightly more than params × 0.5 because scales, zero-points, embeddings and the output head are usually stored at higher precision.\n\n### Worked example\n\nYou want Llama 3.1 8B in BF16 for 10 users at 4,000 tokens each on a 24 GB GPU.\n\n- Weights: 16 GB\n- KV cache: 128 KB/token × 40,000 tokens ≈ 5 GB\n- Overhead: \\~2 GB\n- **Total ≈ 23 GB** → technically fits, with almost no headroom. Switch to FP8 weights (8 GB) and it becomes comfortable."}, {"id": 5, "title": "Prefill and decode: the two phases of inference", "tldr": "Prefill reads the whole prompt in one parallel pass (compute-bound, sets time-to-first-token). Decode then generates one token at a time and re-reads all weights per step (memory-bandwidth-bound, sets tokens per second).", "real": "This is why commercial APIs price input tokens several times cheaper than output tokens: input tokens are processed in a parallel prefill pass, while each output token needs its own sequential decode step.", "body": "### Prefill\n\n- The model processes all prompt tokens **at once**, using big matrix multiplications.\n- It fills the KV cache with every prompt token’s keys and values.\n- Bottleneck: **compute (FLOPs)**. Metric: **TTFT** (time to first token).\n- A 10,000-token document takes noticeably longer to prefill than a 100-token question.\n\n### Decode\n\n- The model produces **one token per step**, appends it, and repeats.\n- Each step reads *all* the weights from memory but does relatively little math per byte.\n- Bottleneck: **memory bandwidth**. Metric: **TPOT/ITL** (time per output token).\n\n### Side by side\n\n| | Prefill | Decode |\n|---|---|---|\n| Work pattern | All prompt tokens in parallel | One token per step |\n| Limited by | GPU compute | Memory bandwidth |\n| User feels it as | Wait before first word | Streaming speed |\n| Helped by | More TFLOPS, prefix caching | Quantization, faster memory, batching |\n\n### Why it matters for deployment\n\nBecause decode is memory-bound, a GPU running one user is mostly idle. Serving many users in the same decode step reuses the same weight read, which is why batching (ch. 63) multiplies throughput almost for free."}, {"id": 6, "title": "Why GPUs and not CPUs", "tldr": "LLM inference is mostly huge matrix multiplications plus massive memory reads. GPUs have thousands of cores, tensor cores built for matrix math, and memory that is 5–40× faster than typical CPU memory.", "real": "Demand for GPUs became the bottleneck of the AI industry: Meta said it planned to have roughly 350,000 H100s by the end of 2024, and xAI built its “Colossus” cluster with around 100,000 H100s that same year.", "body": "### Three reasons GPUs win\n\n1. **Parallel cores.** A modern GPU has thousands of arithmetic units; a server CPU has tens to \\~200 cores.\n2. **Tensor cores.** Special units that do small matrix multiplications in one instruction, in BF16, FP8, INT8 or FP4.\n3. **Memory bandwidth.** HBM on datacenter GPUs moves 2–8 TB/s. Typical dual-channel desktop DDR5 moves \\~80–100 GB/s.\n\n### The numbers\n\n| Device | Memory bandwidth | Rough single-user speed, 8B model at 4-bit |\n|---|---|---|\n| Desktop CPU (dual-channel DDR5) | \\~90 GB/s | \\~10–15 tok/s |\n| Apple M4 Max | \\~546 GB/s | \\~60–90 tok/s |\n| RTX 4090 | \\~1,000 GB/s | \\~130–160 tok/s |\n| H100 SXM | \\~3,350 GB/s | \\~250+ tok/s |\n\n### When CPUs are still fine\n\nPrototypes, offline jobs, small models, and edge devices without a GPU. Chapter 15 covers CPU-only inference.\n\n### Alternatives to GPUs\n\nTPUs (Google), AWS Trainium/Inferentia, AMD Instinct, Intel Gaudi, and SRAM-based chips (Groq, Cerebras). The same principles apply: memory capacity decides what fits, memory bandwidth decides speed."}, {"id": 7, "title": "VRAM, system RAM and unified memory", "tldr": "VRAM/HBM is fast memory attached to the GPU and holds weights plus KV cache. System RAM is slower and used for loading and offload. Unified memory (Apple Silicon, DGX Spark) is one big shared pool that fits huge models but runs slower than HBM.", "real": "In 2025, people ran the 671B-parameter DeepSeek R1 (heavily quantized) on a single Mac Studio with 512 GB of unified memory, something that would otherwise need a multi-GPU server. It worked, but at single-user speeds.", "body": "### The three kinds of memory\n\n| Memory | Where it sits | Speed | Role |\n|---|---|---|---|\n| GDDR6/6X/7 | Consumer and workstation GPUs | \\~300–1,800 GB/s | Weights + KV cache |\n| HBM2e/3/3e | Datacenter GPUs | \\~2,000–8,000 GB/s | Same, faster and larger |\n| DDR5 system RAM | Motherboard | \\~50–600 GB/s depending on channels | Loading, offload, CPU inference |\n| Unified (LPDDR5x) | Apple M-series, DGX Spark, AMD Strix Halo | \\~250–820 GB/s | CPU and GPU share one pool |\n\n### Why VRAM is precious\n\nVRAM cannot be upgraded. A 24 GB card stays 24 GB. Every gigabyte you save with quantization becomes room for more users.\n\n### Unified memory trade-off\n\n- **Pro:** capacity. 128–512 GB lets you load models that would need several GPUs.\n- **Con:** bandwidth is far below HBM, and compute is lower, so tokens/s and prefill speed are slower.\n- **Best for:** one developer exploring big models locally, not serving a team.\n\n### Rule of thumb\n\nCapacity answers *“will it load?”* Bandwidth answers *“will it be fast?”*"}, {"id": 8, "title": "Consumer and prosumer GPUs on the market", "tldr": "For individuals and small teams, 24 GB (RTX 3090/4090) and 32 GB (RTX 5090) cards are the practical sweet spot. Unified-memory machines (Mac, DGX Spark, Strix Halo) offer capacity but lower speed.", "real": "The used RTX 3090 became the favorite card of the local-LLM community (for example on r/LocalLLaMA) because it offers 24 GB of VRAM and roughly 936 GB/s of bandwidth for far less money than any new 24 GB card.", "body": "### The market (mid-2026 snapshot, verify current specs and prices)\n\n| GPU | VRAM | Bandwidth (approx.) | Sweet spot |\n|---|---|---|---|\n| RTX 4060 Ti 16 GB | 16 GB | 288 GB/s | 7–14B at 4-bit, slow |\n| RTX 5060 Ti 16 GB | 16 GB | 448 GB/s | 7–14B at 4-bit |\n| RTX 5070 Ti / 5080 | 16 GB | \\~900–960 GB/s | Fast 8B, 14B at 4-bit |\n| RTX 3090 (used) | 24 GB | 936 GB/s | Best value 24 GB |\n| RTX 4090 | 24 GB | \\~1,008 GB/s | 32B at 4-bit, fast 8B serving |\n| RTX 5090 | 32 GB | \\~1,790 GB/s | 32B at 4-bit with long context |\n| Radeon RX 7900 XTX | 24 GB | 960 GB/s | ROCm, improving support |\n| Intel Arc Pro B60 | 24 GB | \\~456 GB/s | Budget 24 GB |\n| Apple M4 Max | up to 128 GB unified | 546 GB/s | Big models, one user |\n| Apple M3 Ultra | up to 512 GB unified | 819 GB/s | Very big models, one user |\n| DGX Spark / Ryzen AI Max+ 395 | 128 GB unified | \\~256–273 GB/s | Fits 70B+, slow decode |\n\n### How to choose\n\n1. Decide the largest model you need (after quantization).\n2. Add KV cache for your users and context.\n3. Pick the card with enough VRAM, then the highest bandwidth you can afford.\n4. Prefer NVIDIA if you want zero friction with vLLM; AMD works but check model support first."}, {"id": 9, "title": "Workstation and datacenter GPUs", "tldr": "Companies rent or buy 48 GB cards (L40S, RTX 6000 Ada) for mid-size models and 80–288 GB HBM cards (H100, H200, B200, MI300X) for large models and heavy traffic.", "real": "Cloud instance names map directly to these cards: AWS g5 = A10G (24 GB), g6e = L40S (48 GB), p5 = 8× H100 (80 GB each). Choosing an instance is really choosing VRAM and bandwidth.", "body": "### The datacenter lineup\n\n| GPU | VRAM | Bandwidth | Notes |\n|---|---|---|---|\n| T4 | 16 GB | 320 GB/s | Old, cheap |\n| L4 | 24 GB | 300 GB/s | Low power, FP8 |\n| A10 / A10G | 24 GB | 600 GB/s | AWS g5 |\n| RTX A6000 | 48 GB | 768 GB/s | Ampere workstation |\n| RTX 6000 Ada | 48 GB | 960 GB/s | Workstation, FP8 |\n| **L40S** | 48 GB | 864 GB/s | Popular 48 GB inference card |\n| RTX PRO 6000 Blackwell | 96 GB | \\~1,790 GB/s | FP4, workstation/server |\n| A100 | 40 / 80 GB | 1.6 / 2.0 TB/s | Still common |\n| **H100 SXM** | 80 GB | 3.35 TB/s | Industry workhorse |\n| H100 NVL | 94 GB | 3.9 TB/s | PCIe pairs |\n| H200 | 141 GB | 4.8 TB/s | Long-context serving |\n| B200 | \\~180–192 GB | \\~8 TB/s | Blackwell, FP4 |\n| B300 | \\~288 GB | \\~8 TB/s | Blackwell Ultra |\n| AMD MI300X | 192 GB | 5.3 TB/s | Large memory |\n| AMD MI325X / MI355X | 256 / 288 GB | 6–8 TB/s | Large memory |\n| Intel Gaudi 3 | 128 GB | 3.7 TB/s | Alternative accelerator |\n\n### SXM vs PCIe\n\nSXM modules sit on a special board with NVLink between all 8 GPUs and higher power limits. PCIe cards plug into normal servers. For tensor parallelism across 4–8 GPUs, SXM is much faster.\n\n### Buy vs rent\n\nRenting by the hour is ideal for experiments and spiky traffic. Owning or reserving makes sense when utilization is high and steady (see ch. 94)."}, {"id": 10, "title": "Memory bandwidth: the hidden spec that decides speed", "tldr": "Single-user decode speed ≈ memory bandwidth ÷ model size in memory. VRAM size decides what fits; bandwidth decides how fast it runs.", "real": "Groq and Cerebras build chips that keep model weights in on-chip SRAM with enormous bandwidth, which is why they can stream hundreds to thousands of tokens per second to a single user, far above a single GPU.", "body": "### The formula\n\n```\nMax decode tokens/s (one user) ≈ Memory bandwidth (GB/s) ÷ Bytes read per token (GB)\n```\n\nFor dense models, bytes read per token ≈ the whole model’s weights.\n\n### Worked examples\n\n| Setup | Math | Theoretical | Realistic (60–80%) |\n|---|---|---|---|\n| 8B BF16 on RTX 4090 | 1000 ÷ 16 | \\~62 tok/s | \\~45–50 |\n| 8B INT4 on RTX 4090 | 1000 ÷ 5 | \\~200 tok/s | \\~130–160 |\n| 70B INT4 on H100 | 3350 ÷ 40 | \\~84 tok/s | \\~50–65 |\n| 70B Q4 on DGX Spark | 273 ÷ 42 | \\~6.5 tok/s | \\~4–5 |\n\n### Three lessons\n\n1. **Quantization speeds up decode** because fewer bytes are read per token.\n2. **Two GPUs with equal VRAM can differ 3× in speed** (compare an L4 at 300 GB/s with an RTX 4090 at \\~1,000 GB/s, both 24 GB).\n3. **MoE models read only active experts**, so a 30B-total/3B-active model decodes like a \\~3B model.\n\n### Try it\n\nTake the model you plan to run, its size after quantization, and your GPU’s bandwidth. Divide. If the result is below \\~20 tok/s, users will feel it is slow."}, {"id": 11, "title": "Compute-bound vs memory-bound work", "tldr": "At small batch sizes the GPU waits on memory (memory-bound); at large batch sizes it is busy doing math (compute-bound). Serving many users together moves you from wasted waiting toward full use of the chip.", "real": "OpenAI and Anthropic both offer Batch APIs at about a 50% discount. Batch work can be packed into large, efficient GPU batches at off-peak times, so it costs the provider much less per token than interactive traffic.", "body": "### Arithmetic intensity\n\nArithmetic intensity = FLOPs done ÷ bytes moved. Each GPU has a balance point:\n\n```\nBalance point ≈ Peak FLOPS ÷ Memory bandwidth\nH100: ~990 TFLOPS (BF16 dense) ÷ 3.35 TB/s ≈ ~300 FLOPs per byte\n```\n\n### Why decode is memory-bound\n\nFor one user, each weight (2 bytes in BF16) is used for about 2 FLOPs per token. That is \\~1 FLOP per byte, far below \\~300. The GPU spends most time waiting for memory.\n\n### Why batching fixes it\n\nWith 64 users in one decode step, each weight read feeds 64 tokens: \\~64 FLOPs per byte. Throughput rises almost 64× while each step costs only a bit more time. Past the balance point you become compute-bound and adding users slows everyone.\n\n### The roofline picture\n\n```\nThroughput\n   │            ______________  compute roof\n   │          /\n   │        /   ← memory-bound region (add batch = free speed)\n   │      /\n   └──────────────────────────► batch size / arithmetic intensity\n```\n\n### Practical takeaway\n\nPrefill is usually compute-bound already. Decode becomes efficient only when many requests share each step, which is exactly what continuous batching (ch. 63) does."}, {"id": 12, "title": "The role of the CPU", "tldr": "For GPU serving, the GPU decides about 90% of performance. The CPU still runs tokenization, HTTP, scheduling and kernel launches, so a weak CPU can starve fast GPUs at high request rates or with many GPUs.", "real": "vLLM’s V1 engine rewrite (early 2025) was largely about CPU overhead: it split the scheduler and the GPU worker into separate processes because Python-side scheduling and detokenization had become a bottleneck on fast GPUs like the H100.", "body": "### What the CPU does in GPU inference\n\n- Tokenizing prompts and detokenizing outputs\n- Running the HTTP server and streaming responses\n- Scheduling which requests join each batch\n- Launching GPU kernels (each step launches many)\n- Moving data over PCIe\n\n### When the CPU becomes the bottleneck\n\n| Situation | Symptom |\n|---|---|\n| Small model on a very fast GPU | GPU utilization low, CPU core at 100% |\n| Very high requests/second | Rising latency with idle GPU |\n| Many GPUs in one box | Kernel launch and scheduling overhead |\n| CPU offload (ch. 49) | Everything depends on RAM bandwidth |\n\n### Choosing a CPU\n\n| Setup | Recommendation |\n|---|---|\n| 1–2 GPUs, few users | Any modern 8–16 core CPU |\n| 4–8 GPUs, high traffic | Server CPU (EPYC/Xeon) with strong single-thread speed and enough PCIe lanes (x16 per GPU) |\n| CPU or hybrid inference | Many memory channels, AVX-512 or AMX |\n\n### So, does LLM work depend on the processor?\n\nMostly on the **GPU’s VRAM and bandwidth**. The CPU matters at scale, in offload setups, and for CPU-only inference."}, {"id": 13, "title": "How much system RAM you need", "tldr": "Plan system RAM at least equal to total VRAM, ideally 1.5–2×. Weights pass through RAM while loading, and any CPU offload must fit there too.", "real": "AWS’s p5.48xlarge pairs 8× H100 (640 GB of HBM in total) with 2 TiB of system memory. Cloud vendors size host RAM well above VRAM for exactly these loading and offload reasons.", "body": "### Why RAM matters\n\n1. **Loading:** weights are read from disk, often mapped into RAM, then copied to VRAM.\n2. **Offload:** layers or experts pushed off the GPU live in RAM (ch. 49).\n3. **Swap/KV spill:** some engines spill KV cache to CPU memory.\n4. **Everything else:** OS, server, tokenizer, monitoring agents.\n\n### Sizing guide\n\n| GPU setup | Total VRAM | Recommended RAM |\n|---|---|---|\n| 1× RTX 4090 | 24 GB | 32–64 GB |\n| 2× RTX 4090 | 48 GB | 64–128 GB |\n| 1× L40S | 48 GB | 96–128 GB |\n| 8× H100 | 640 GB | 1–2 TB |\n| Hybrid offload of a big MoE | 24 GB | 256–768 GB |\n\n### safetensors helps\n\nThe safetensors format supports memory-mapping, so the loader can stream tensors to the GPU without holding two full copies in RAM.\n\n### Watch out\n\nIf RAM is too small, loading can fail with an out-of-memory error from the operating system (not CUDA), or the machine starts swapping to disk and loading takes forever."}, {"id": 14, "title": "Interconnects: PCIe, NVLink and InfiniBand", "tldr": "Splitting one model across GPUs requires them to talk constantly. NVLink inside a server is 10–30× faster than PCIe; InfiniBand or RoCE connects servers to each other.", "real": "NVIDIA’s GB200 NVL72 rack links 72 Blackwell GPUs into one NVLink domain so a trillion-parameter MoE model can be served as if on one giant GPU. Meanwhile the consumer RTX 4090 dropped NVLink entirely, so multi-4090 setups must talk over PCIe.", "body": "### The links\n\n| Link | Bandwidth (approx.) | Used for |\n|---|---|---|\n| PCIe 4.0 x16 | \\~32 GB/s per direction | Loading weights, 2-GPU tensor parallel (works, slower) |\n| PCIe 5.0 x16 | \\~64 GB/s per direction | Same, faster |\n| NVLink (H100) | \\~900 GB/s total per GPU | Tensor parallel across 8 GPUs |\n| NVLink 5 (Blackwell) | \\~1.8 TB/s per GPU | 72-GPU NVLink domains |\n| InfiniBand / RoCE | 400–800 Gb/s per NIC | Multi-node serving and training |\n\n### Why it matters\n\nTensor parallelism (ch. 56) performs an all-reduce after every layer. With 80 layers and slow links, communication time adds up to a large share of each step.\n\n### Checking your topology\n\n```bash\nnvidia-smi topo -m\n```\n\nLook for `NV#` (NVLink) between GPU pairs. `PIX`, `PHB` or `SYS` mean PCIe paths, with `SYS` (crossing CPU sockets) the slowest.\n\n### Practical rules\n\n- Keep tensor parallelism **inside** one server.\n- Use pipeline parallelism (ch. 57) across servers.\n- On consumer boards, put both GPUs in full x16 (or at least x8) slots."}, {"id": 15, "title": "CPU-only inference", "tldr": "CPUs can run LLMs with llama.cpp, Ollama or vLLM’s CPU backend. Speed is set by RAM bandwidth, so it suits prototypes, batch jobs and small or MoE models, not many concurrent users.", "real": "llama.cpp began in March 2023 when Georgi Gerganov got Meta’s original LLaMA running on a MacBook CPU in plain C/C++. That project grew into the engine behind Ollama, LM Studio and much of local AI.", "body": "### Speed formula (same as GPUs)\n\n```\ntokens/s ≈ RAM bandwidth ÷ model bytes per token\n```\n\n| Machine | RAM bandwidth | 8B at Q4 (\\~5 GB) |\n|---|---|---|\n| Laptop, dual-channel DDR5 | \\~80 GB/s | \\~10–15 tok/s |\n| Workstation, 8-channel DDR5 | \\~300 GB/s | \\~40 tok/s |\n| Dual EPYC, 24 channels | up to \\~900 GB/s theoretical | higher, and good for big MoE |\n\n### When CPU-only makes sense\n\n- No GPU available (edge, air-gapped, laptops)\n- Offline batch jobs where latency does not matter\n- Large **MoE** models: only a few billion active parameters are read per token\n- Embedding and small classification models\n\n### Quick start\n\n```bash\n# llama.cpp, CPU only\n./llama-server -m qwen2.5-7b-instruct-q4_k_m.gguf -c 4096 -t 16 --port 8080\n```\n\n`-t` sets threads; match physical cores, not hyperthreads.\n\n### Limits\n\nPrefill is slow on CPUs (little matrix compute), so long prompts take a long time before the first token."}, {"id": 16, "title": "The model loading flow", "tldr": "Weights travel from the model hub or object storage to local disk, through RAM, over PCIe into VRAM. Then the engine profiles memory and carves out the KV cache. Load time depends on disk, network and PCIe speed.", "real": "Hugging Face created the safetensors format partly because classic PyTorch pickle files can execute arbitrary code when loaded. safetensors is safe and supports fast zero-copy loading, and it is now the default format for model releases.", "body": "### The path\n\n```\nHugging Face Hub / S3 / GCS\n        │ download .safetensors shards\n        ▼\nLocal NVMe ──mmap──► System RAM ──PCIe──► GPU VRAM\n                                           │\n                     engine profiles memory ▼\n                ┌──────────────────────────────────┐\n                │ Weights │ KV cache pool │ misc   │\n                └──────────────────────────────────┘\n```\n\n### What the engine does after loading\n\n1. Runs a dummy forward pass to measure peak activation memory.\n2. Computes free VRAM within `--gpu-memory-utilization`.\n3. Allocates the KV cache as fixed-size blocks.\n4. Captures CUDA graphs (pre-recorded kernel sequences) for faster decode.\n\n### Load time examples\n\n| Model size | From network disk (\\~200 MB/s) | From local NVMe (\\~3 GB/s) |\n|---|---|---|\n| 16 GB | \\~80 s | \\~5–10 s |\n| 140 GB | \\~12 min | \\~1 min |\n\n### Speeding up cold starts\n\n- Keep models on local NVMe or a fast shared cache.\n- Use streaming loaders (vLLM supports the Run:ai Model Streamer via `--load-format runai_streamer`).\n- Pre-pull container images on GPU nodes."}, {"id": 17, "title": "A real VRAM budget, line by line", "tldr": "On a 24 GB GPU with an 8B BF16 model, only about 3.5–4 GB remains for the KV cache. Quantizing the weights to INT4 grows that space to about 14 GB, which means roughly 3–4× more users or context.", "real": "vLLM prints this budget at startup, with lines such as “GPU KV cache size: N tokens” and “Maximum concurrency for X tokens per request”. Production engineers read these two lines first after every deploy.", "body": "### Budget: RTX 4090, Llama 3.1 8B, BF16, vLLM\n\n| Item | Size |\n|---|---|\n| Total VRAM | 24 GB |\n| vLLM may use (`--gpu-memory-utilization 0.90`) | 21.6 GB |\n| Weights | \\~16 GB |\n| CUDA context, graphs, activations | \\~1.5–2 GB |\n| **KV cache pool** | **\\~3.5–4 GB** |\n\nAt 128 KB per token: \\~4 GB ÷ 128 KB ≈ **\\~30,000 tokens** for all users combined.\n\n### Same GPU, INT4 weights\n\n| Item | Size |\n|---|---|\n| Weights | \\~5.5 GB |\n| Overhead | \\~2 GB |\n| **KV cache pool** | **\\~14 GB ≈ 110,000 tokens** |\n\n### Same GPU, INT4 weights and FP8 KV cache\n\nKV per token halves to 64 KB, so **\\~220,000 tokens**, about 7× the BF16 starting point.\n\n### The key insight\n\nQuantizing weights does not just “make it fit”. It **buys capacity**: more simultaneous users and longer conversations on the same hardware."}, {"id": 18, "title": "The KV cache explained", "tldr": "For every token, every layer stores a key and a value vector so it never has to be recomputed. This cache grows with context length and number of users, and for long chats it can be larger than the model itself.", "real": "Character.AI wrote in 2024 that KV cache size was the main bottleneck in serving its chat traffic. It reported shrinking the cache by more than 20× using multi-query attention, mixed local/global attention layers, and sharing KV across layers, and it caches conversation history between turns.", "body": "### Why it exists\n\nAttention lets each new token look at all previous tokens. It needs their **keys** (what each token offers) and **values** (its content). Recomputing them each step would be quadratic work, so they are stored once and reused.\n\n### What it grows with\n\n```\nKV size = per-token size × context length × concurrent users\n```\n\n- More layers → bigger\n- More KV heads → bigger\n- Longer conversations → bigger\n- More simultaneous users → bigger\n\n### Attention variants that shrink it\n\n| Variant | Idea | KV impact |\n|---|---|---|\n| MHA (multi-head) | Every head has its own K/V | Largest |\n| GQA (grouped-query) | Groups of query heads share K/V | 4–8× smaller |\n| MQA (multi-query) | All heads share one K/V | Smallest of the classic variants |\n| MLA (DeepSeek) | Compress K/V into a small latent vector | Very small |\n| Sliding window | Only keep the last N tokens in some layers | Bounded |\n\n### Practical consequences\n\n- Long context is expensive **even if the user writes little**: the whole history sits in cache.\n- Free VRAM after weights is your concurrency budget.\n- When the cache is full, new requests wait in the queue."}, {"id": 19, "title": "KV cache math with real models", "tldr": "KV bytes per token = 2 × layers × KV heads × head dimension × bytes per value. Llama 3.1 8B uses 128 KB per token and a 70B Llama uses 320 KB, so one 32K-token chat on a 70B model needs about 10 GB.", "real": "Llama 2 70B adopted grouped-query attention with 8 KV heads specifically to cut this cost. DeepSeek-V2’s multi-head latent attention went further and reported a 93.3% smaller KV cache than DeepSeek’s earlier 67B model.", "body": "### The formula\n\n```\nKV bytes per token = 2 (K and V) × num_layers × num_kv_heads × head_dim × bytes_per_value\n```\n\nFind `num_hidden_layers`, `num_key_value_heads` and `head_dim` (or hidden size ÷ attention heads) in the model’s `config.json`.\n\n### Worked: Llama 3.1 8B\n\n```\n2 × 32 layers × 8 KV heads × 128 dim × 2 bytes = 131,072 bytes = 128 KB per token\n```\n\n### Table (BF16 KV, per user)\n\n| Model | Layers | KV heads | head_dim | Per token | 8K | 32K | 128K |\n|---|---|---|---|---|---|---|---|\n| Llama 3.1 8B | 32 | 8 | 128 | 128 KB | 1 GB | 4 GB | 16 GB |\n| Qwen 32B-class | 64 | 8 | 128 | 256 KB | 2 GB | 8 GB | 32 GB |\n| Llama 3.x 70B | 80 | 8 | 128 | 320 KB | 2.5 GB | 10 GB | 40 GB |\n\n### Multiply by users\n\n20 users × 8K tokens on a 70B model = 20 × 2.5 GB = **50 GB** of KV cache, more than the 40 GB of INT4 weights.\n\n### Halve it\n\n`--kv-cache-dtype fp8` stores K/V in 1 byte instead of 2, halving every number in the table."}, {"id": 20, "title": "Activations, CUDA graphs and fragmentation", "tldr": "Beyond weights and KV cache, VRAM also holds temporary activations, CUDA graphs and allocator waste. PagedAttention reduced KV waste from 60–80% to a few percent. Always keep 5–10% headroom.", "real": "The vLLM team’s PagedAttention paper (SOSP 2023) measured that earlier serving systems wasted 60–80% of KV cache memory through fragmentation and over-reservation. Its launch reported up to 24× higher throughput than plain Hugging Face Transformers.", "body": "### Activations\n\nTemporary tensors created during a forward pass. They scale with the number of tokens processed per step, which `--max-num-batched-tokens` controls. A large prefill chunk means more activation memory.\n\n### CUDA graphs\n\n- The GPU normally receives kernels one by one from the CPU.\n- A CUDA graph records the whole decode step once and replays it, removing launch overhead.\n- Cost: some VRAM for each captured batch size.\n- `--enforce-eager` turns graphs off, saving memory at the cost of speed.\n\n### Fragmentation\n\nOld approach: reserve a contiguous buffer per request sized for the maximum length.\n\n```\nRequest A reserved: [AAAA____________]  ← mostly empty, still blocked\nRequest B reserved: [BBBBBBB_________]\n```\n\nPagedAttention approach: small blocks allocated on demand.\n\n```\nBlock pool: [A][B][A][B][B][free][free][free]...\n```\n\n### Headroom rule\n\nNever plan to use 100% of VRAM. Driver allocations, spikes in prefill size, and other processes (monitoring, a desktop session) need room. Typical safe setting: `--gpu-memory-utilization 0.90`, or 0.95 on a dedicated server."}, {"id": 21, "title": "What quantization is", "tldr": "Quantization stores each weight with fewer bits. BF16 to INT4 cuts memory about 4×, speeds up decode, and frees room for the KV cache, at the cost of a small accuracy loss that grows as bits shrink.", "real": "Google’s quantization-aware Gemma 3 27B release (April 2025) shrank the model from about 54 GB in BF16 to about 14 GB in INT4. That let it run on a single consumer RTX 3090.", "body": "### The idea\n\nInstead of storing 0.0372819... in 16 bits, store “level 9 of 16” in 4 bits plus a shared scale for a group of weights.\n\n### What you gain\n\n| From BF16 to | Size | Decode speed (memory-bound) |\n|---|---|---|\n| FP8 / INT8 | 50% | up to \\~2× |\n| INT4 | \\~27–30% | up to \\~3–3.5× |\n| INT2 | \\~15% | up to \\~5×, if kernels exist |\n\n### What you lose\n\nRounding error. Every weight moves a little from its true value. At 8 bits nobody notices; at 4 bits there is a small loss; at 2 bits there is a large loss without special methods.\n\n### An analogy\n\nSaving a photo as JPEG: high quality looks identical, medium quality is fine for most uses, very low quality shows blocks. Quantization is JPEG for weights.\n\n### What gets quantized\n\n- **Weights**: almost always the first target.\n- **Activations**: in W8A8 schemes (ch. 24).\n- **KV cache**: separately, with FP8 (ch. 45).\n- **Embeddings and output head**: often kept higher precision because they are sensitive."}, {"id": 22, "title": "The core math: scale and zero-point", "tldr": "q = round(x ÷ scale) + zero_point, and back again x ≈ scale × (q − zero_point). The difference between the original and recovered value is the quantization error.", "real": "This affine scheme comes from Google’s 2017 paper on integer-only inference for mobile networks (Jacob et al.). It became the basis of TensorFlow Lite and PyTorch quantization, and LLM quantizers still use the same formula.", "body": "### Formulas\n\n```\nscale      = (max − min) ÷ (qmax − qmin)\nzero_point = round(qmin − min ÷ scale)\nquantize   : q = clamp(round(x ÷ scale) + zero_point, qmin, qmax)\ndequantize : x̂ = scale × (q − zero_point)\n```\n\n### Worked example: INT4 (levels 0 to 15)\n\nA group of weights ranges from −0.6 to +0.9.\n\n1. `scale = (0.9 − (−0.6)) ÷ 15 = 0.1`\n2. `zero_point = round(0 − (−0.6 ÷ 0.1)) = 6`\n3. Weight 0.33 → `round(3.3) + 6 = 9`\n4. Back: `0.1 × (9 − 6) = 0.30`\n5. Error = 0.03\n\n### What determines the error\n\n- **Spread of the group.** One outlier stretches the range and makes every step larger.\n- **Number of levels.** INT8 has 256, INT4 has 16, INT2 has 4.\n\n### Why groups help\n\nSplitting a row into groups of 128 weights, each with its own scale, keeps one outlier from ruining thousands of other weights (ch. 23)."}, {"id": 23, "title": "Symmetric vs asymmetric, per-tensor vs per-group", "tldr": "Symmetric quantization centers on zero; asymmetric shifts the range. Granularity goes per-tensor → per-channel → per-group. Group size 128 is the standard for INT4 because it balances accuracy against overhead.", "real": "Look at the quantization_config of official INT4 releases on Hugging Face (Qwen’s GPTQ-Int4 and AWQ repos, for example). You will almost always see group_size 128, the default of the GPTQ and AWQ tools.", "body": "### Symmetric vs asymmetric\n\n| | Symmetric | Asymmetric |\n|---|---|---|\n| Zero-point | 0 | Learned shift |\n| Range | −max…+max | min…max |\n| Speed | Slightly faster | Slightly slower |\n| Fits | Centered data | Skewed data |\n\n### Granularity\n\n| Level | One scale per | Overhead | Accuracy |\n|---|---|---|---|\n| Per-tensor | Whole matrix | Tiny | Worst |\n| Per-channel | Output row | Small | Good for INT8 |\n| Per-group (128) | 128 weights | \\~0.25 bits/weight extra | Standard for INT4 |\n| Per-group (32) | 32 weights | \\~1 bit/weight extra | Best, used in low-bit GGUF |\n\n### Overhead math\n\nA 16-bit scale per 128 weights adds 16 ÷ 128 = 0.125 bits per weight; with a zero-point, about 0.25. So “4-bit” models are really about 4.25 bits per weight.\n\n### Choosing\n\n- INT8: per-channel weights, per-token activations.\n- INT4: per-group 128 (try 64 or 32 if quality drops).\n- INT2/3: small groups, plus the advanced tricks in Part 8."}, {"id": 24, "title": "Weight-only vs weight-and-activation quantization", "tldr": "W4A16 quantizes only weights and speeds up memory-bound decode. W8A8 (INT8 or FP8) quantizes weights and activations, so the tensor cores themselves run in 8-bit, speeding up prefill and large batches as well.", "real": "NVIDIA’s TensorRT Model Optimizer offers exactly this menu: FP8, INT8 SmoothQuant, INT4 AWQ, and NVFP4 for Blackwell. Its guidance points to FP8 for high-throughput serving and INT4 AWQ for small-batch, memory-limited cases.", "body": "### Naming\n\n`W{weight bits}A{activation bits}`: W4A16 has 4-bit weights and 16-bit activations.\n\n### How weight-only works\n\n```\nINT4 weights in VRAM ──load──► dequantize to BF16 in registers ──► BF16 matmul\n```\n\nFewer bytes are read (the decode bottleneck), but the math is still 16-bit. vLLM uses fast Marlin/Machete kernels for this.\n\n### How W8A8 works\n\nBoth inputs are 8-bit, and the tensor cores run INT8 or FP8 math, about 2× the 16-bit throughput.\n\n### Comparison\n\n| Scheme | Memory saving | Decode speed | Prefill / high batch | Hardware |\n|---|---|---|---|---|\n| W4A16 (GPTQ, AWQ) | \\~4× | High | Smaller gain | Most NVIDIA/AMD |\n| W8A8 INT8 | 2× | Good | High | Ampere and newer |\n| W8A8 FP8 | 2× | Good | High | Ada, Hopper, Blackwell |\n| W4A4 / NVFP4 | \\~4× | High | Very high | Blackwell |\n\n### Rule of thumb\n\n- Few users, tight VRAM → **W4A16**\n- Many users, modern GPU → **FP8 W8A8**\n- Older A100 → **INT8 W8A8** or W4A16"}, {"id": 25, "title": "PTQ vs QAT", "tldr": "Post-training quantization (PTQ) converts a finished model using a small calibration set in minutes or hours. Quantization-aware training (QAT) trains with quantization simulated and gives better quality at 4 bits and below, but costs a training run.", "real": "Meta released quantized Llama 3.2 1B and 3B models for phones (late 2024) built with QAT plus LoRA and with SpinQuant. Google’s Gemma 3 QAT and OpenAI’s gpt-oss (with MoE weights in MXFP4) are other examples of model makers shipping quantization-aware checkpoints.", "body": "### PTQ: what deployers do\n\n1. Take the trained BF16 model.\n2. Run a few hundred calibration samples through it.\n3. Choose scales (and adjust weights, in GPTQ or AWQ).\n4. Save the quantized checkpoint.\n\nCost: one GPU, minutes to a few hours. No training data needed beyond calibration.\n\n### QAT: what model makers do\n\nDuring fine-tuning, the forward pass uses “fake-quantized” weights, so the model learns to be robust to rounding. Afterward, real low-bit weights lose much less quality.\n\n### Comparison\n\n| | PTQ | QAT |\n|---|---|---|\n| Cost | Low | High (training) |\n| Who does it | You | Usually the model maker |\n| Quality at 8-bit | Excellent | Excellent |\n| Quality at 4-bit | Good | Better |\n| Quality at 2-bit | Poor without special methods | Possible |\n\n### Practical advice\n\nBefore quantizing anything yourself, check whether the model maker published an official QAT or quantized checkpoint. It is usually the best version available."}, {"id": 26, "title": "INT8 overview", "tldr": "INT8 uses 256 levels, halves memory versus BF16, and usually costs almost no accuracy for models of 7B and up. It comes as weight-only (W8A16) or full INT8 (W8A8).", "real": "Character.AI’s 2024 inference write-up said it runs its models in int8 for both weights and computation, trained to be robust to it, as part of serving a very high-volume consumer chat product cheaply.", "body": "### Facts\n\n- Range: −128 to 127 (signed)\n- Size: 1 byte per weight\n- A 70B model: \\~70 GB\n- Typical quality drop: under 1% on standard benchmarks\n\n### Two flavors\n\n| Flavor | What’s 8-bit | Benefit |\n|---|---|---|\n| W8A16 | Weights | Memory saving, faster decode |\n| W8A8 | Weights + activations | Also faster math on INT8 tensor cores |\n\n### The challenge\n\nWeights are easy to quantize to INT8. **Activations** are hard because large models contain outlier channels (ch. 27). Methods like SmoothQuant (ch. 28) solve that.\n\n### When INT8 is the right choice\n\n- A100 or other Ampere GPUs, which lack FP8 tensor cores\n- The model *almost* fits in BF16\n- You want near-lossless quality with 2× savings\n\nOn Ada, Hopper and Blackwell, FP8 (ch. 29) is usually the better 8-bit option."}, {"id": 27, "title": "LLM.int8() and the outlier problem", "tldr": "Around the 6.7B scale, a few activation channels develop values 100× larger than the rest. Naive INT8 breaks on these. LLM.int8() keeps outlier columns in FP16 and the rest in INT8: accurate, but slow.", "real": "Tim Dettmers and colleagues published LLM.int8() in 2022 and integrated it into Hugging Face Transformers through bitsandbytes (`load_in_8bit=True`). It made models like BLOOM-176B fit on far fewer GPUs for research use.", "body": "### The discovery\n\nResearchers found that, as models grow past \\~6.7B parameters, a handful of hidden dimensions hold extreme values in nearly every layer. These “emergent outliers” are important; removing them destroys model quality.\n\n### Why naive INT8 fails\n\n```\nNormal values:  −1.2  0.4  0.9  −0.3\nOutlier value:  58.0\nScale must cover 58 → each step ≈ 0.46\n→ 0.4 and −0.3 both round to 0 or ±0.46; the information is lost\n```\n\n### The LLM.int8() fix\n\n1. Detect outlier columns (above a threshold, e.g. 6.0).\n2. Multiply them in FP16.\n3. Multiply everything else in INT8.\n4. Add the results.\n\n### Trade-off\n\n| | LLM.int8() |\n|---|---|\n| Accuracy | Near BF16 |\n| Memory | \\~2× smaller |\n| Speed | Often slower than BF16 |\n| Use | Research, fitting a model; not production serving |\n\n### Legacy\n\nEvery later method (SmoothQuant, AWQ, FP8 formats, rotation methods) is a different answer to the outlier problem this work identified."}, {"id": 28, "title": "SmoothQuant (W8A8)", "tldr": "SmoothQuant mathematically shifts difficulty from activations into weights by dividing activations and multiplying weights by the same per-channel factor. Both become easy to quantize to INT8, enabling fast INT8 tensor-core math.", "real": "SmoothQuant came from MIT’s Han Lab with NVIDIA in 2022. It reported up to about 1.56× speedup and 2× memory reduction with negligible accuracy loss, and it was adopted in NVIDIA’s TensorRT-LLM and other production stacks.", "body": "### The trick\n\nFor a linear layer `Y = X · W`:\n\n```\nY = (X · diag(s)⁻¹) · (diag(s) · W)\n```\n\nThe output is unchanged. Choosing `s` per channel squeezes activation outliers down and makes weights slightly harder, balancing difficulty between the two.\n\n### Migration strength (α)\n\n- α ≈ 0.5 balances the two sides; some models prefer 0.75–0.85.\n- The smoothing factors are folded offline into the previous layer, so there is no runtime cost.\n\n### Result\n\nBoth X and W are now INT8 friendly, so the matrix multiply runs in INT8 on tensor cores.\n\n### In practice with vLLM\n\nCreate a W8A8 INT8 checkpoint with llm-compressor (SmoothQuant step + GPTQ step), then serve normally; vLLM detects the format.\n\n### Best use\n\nA100 fleets serving many users, where FP8 is not available but INT8 tensor cores are."}, {"id": 29, "title": "FP8: the modern 8-bit standard", "tldr": "FP8 (E4M3) is a tiny floating-point format that tolerates outliers better than INT8. It is native on Ada, Hopper and Blackwell GPUs, near-lossless, and vLLM can apply it at load time with no calibration at all.", "real": "Meta shipped an official FP8 version of Llama 3.1 405B, and DeepSeek-V3 was trained in FP8 and released with FP8 weights. NVIDIA introduced FP8 tensor cores with the H100’s Transformer Engine in 2022.", "body": "### Formats\n\n| Format | Exponent bits | Mantissa bits | Max | Use |\n|---|---|---|---|---|\n| E4M3 | 4 | 3 | ±448 | Weights and activations (inference) |\n| E5M2 | 5 | 2 | ±57,344 | Gradients (training) |\n\n### Why FP8 beats INT8 for LLMs\n\nINT8 levels are evenly spaced, so outliers stretch the scale. FP8 levels are dense near zero and sparse far away, matching how weights and activations are distributed.\n\n### Easiest deployment in vLLM\n\n```bash\nvllm serve meta-llama/Llama-3.1-8B-Instruct --quantization fp8\n```\n\nDynamic FP8: per-channel weight scales computed at load time and per-token activation scales at runtime. No calibration data needed.\n\n### Pre-quantized FP8\n\nRepositories named `*-FP8` or `*-FP8-Dynamic` on Hugging Face load directly:\n\n```bash\nvllm serve RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8\n```\n\n### Quality\n\nBroad evaluations have found FP8 W8A8 essentially matches BF16 on standard benchmarks for models of 8B and up. Still check your own tasks."}, {"id": 30, "title": "When to use INT8 or FP8", "tldr": "On modern GPUs, FP8 is the default production choice: 2× smaller, fast, near-lossless. On A100 or older GPUs, use INT8 W8A8. When 8 bits is still too big, move to INT4.", "real": "Red Hat AI (formerly Neural Magic) publishes FP8, INT8 and INT4 versions of popular open models on Hugging Face with published recovery scores. These scores often show 99%+ of the original accuracy for 8-bit versions, and teams adopt the checkpoints directly with vLLM.", "body": "### Decision table\n\n| Situation | Choose |\n|---|---|\n| H100/H200/L40S/RTX 40–50, want near-zero loss | **FP8 W8A8** |\n| A100 or RTX 30, high batch | INT8 W8A8 (SmoothQuant) |\n| A100, low batch, memory tight | INT4 W4A16 |\n| Model almost fits in BF16 | FP8 or INT8 |\n| Need maximum compression | INT4 (Part 7) |\n| Fine-tuning on small GPU | NF4 with QLoRA (ch. 34) |\n\n### Checklist before switching to FP8\n\n- [ ] GPU supports FP8 natively (compute capability 8.9+)\n- [ ] Your vLLM version supports the model architecture in FP8\n- [ ] Run your evaluation set (ch. 44)\n- [ ] Benchmark throughput at your target concurrency (ch. 84)\n\n### Combine with FP8 KV cache\n\n```bash\nvllm serve <model> --quantization fp8 --kv-cache-dtype fp8\n```\n\nWeights and KV cache both halved: one of the highest-value configurations in production."}, {"id": 31, "title": "INT4 overview", "tldr": "INT4 uses 16 levels per weight (with a scale per group of 128), shrinks models about 4×, and typically costs 1–3% on benchmarks. It is the most popular way to run big models on 24–48 GB GPUs.", "real": "When you run `ollama run llama3.1`, the default download is a ~4-bit quantization (around 4.9 GB for the 8B model). For millions of local users, 4-bit is effectively the standard format.", "body": "### Facts\n\n- 16 levels per weight, with group-wise scales\n- Effective \\~4.25–4.85 bits per weight including scales\n- 70B model: \\~38–42 GB\n- Main methods: GPTQ, AWQ, NF4, GGUF Q4 types\n\n### The golden rule\n\n**A bigger model at INT4 usually beats a smaller model at BF16 with the same memory.**\n\n| Same \\~20 GB budget | Typical result |\n|---|---|\n| 8B in BF16 (16 GB) | Good |\n| 32B in INT4 (\\~19 GB) | Usually clearly better at reasoning and knowledge |\n\n### Where INT4 hurts most\n\n- Small models (1–3B): proportionally larger drop\n- Math and code: small errors compound in long reasoning\n- Long context retrieval: occasionally weaker\n- Non-English languages: sometimes more sensitive\n\n### Which INT4 to choose\n\n| Engine | Format |\n|---|---|\n| vLLM / SGLang (multi-user GPU) | AWQ or GPTQ (W4A16) |\n| llama.cpp / Ollama (local, offload) | GGUF Q4_K_M |\n| Fine-tuning on small GPU | NF4 (bitsandbytes) |"}, {"id": 32, "title": "GPTQ", "tldr": "GPTQ quantizes one layer at a time. After rounding each weight, it adjusts the remaining weights to cancel the error, using second-order (Hessian) information from calibration data.", "real": "The GPTQ paper (Frantar et al., 2022) quantized OPT-175B to 3–4 bits in about four GPU hours and, for the first time, ran a 175B model on a single 80 GB A100. In 2023 the Hugging Face user “TheBloke” published thousands of GPTQ quantizations, making the format a community standard.", "body": "### Intuition\n\nRounding a weight introduces error. Instead of accepting it, GPTQ asks: “How can the other, not-yet-rounded weights in this row shift to compensate?” The Hessian (built from calibration activations) says which directions matter most.\n\n### Algorithm (simplified)\n\n```\nfor each layer:\n    collect inputs X from calibration samples\n    H = 2 · Xᵀ · X                     # sensitivity\n    for each column of W (in blocks):\n        q = quantize(w)\n        error = (w − q) / H⁻¹[i,i]\n        update remaining columns −= error · H⁻¹[i, rest]\n```\n\n### Settings\n\n| Setting | Common value |\n|---|---|\n| Bits | 4 (also 3, 8) |\n| Group size | 128 |\n| act_order (desc_act) | True for better quality |\n| Calibration samples | 128–512 |\n\n### Strengths and weaknesses\n\n- ✅ Good quality, fast Marlin kernels in vLLM, widely available checkpoints\n- ⚠️ Can overfit to calibration data; quantizing large models takes GPU time and memory\n\n### Serving\n\n```bash\nvllm serve Qwen/Qwen2.5-14B-Instruct-GPTQ-Int4\n```"}, {"id": 33, "title": "AWQ: activation-aware weight quantization", "tldr": "About 1% of weights matter far more because they multiply large activations. AWQ finds these salient channels using calibration data and scales them up before quantizing, so they lose less precision. The method is robust and fast to apply.", "real": "AWQ came from MIT’s Han Lab and won the Best Paper award at MLSys 2024. Model makers such as Qwen publish official AWQ checkpoints, and it was shown running Llama-2 on NVIDIA Jetson Orin edge devices through the authors’ TinyChat runtime.", "body": "### Key observation\n\nNot all weights are equal. Channels that see large activation magnitudes affect the output most. Protecting just those channels recovers most of the lost quality.\n\n### The trick\n\nInstead of keeping salient weights in FP16 (awkward for kernels), AWQ multiplies those channels by a factor `s > 1` before quantization and divides the matching activations by `s`:\n\n```\nY = X · W = (X / s) · (s · W)\n```\n\nLarger values have relatively smaller rounding error, so important weights are preserved. A grid search picks `s` per layer.\n\n### Compared with GPTQ\n\n| | GPTQ | AWQ |\n|---|---|---|\n| Uses calibration | Yes (Hessian) | Yes (activation stats) |\n| Adjusts weights | Error compensation | Channel scaling |\n| Overfitting risk | Higher | Lower |\n| Speed to quantize | Slower | Faster |\n| vLLM kernels | Marlin | Marlin |\n\n### Serving\n\n```bash\nvllm serve Qwen/Qwen2.5-32B-Instruct-AWQ --max-model-len 16384\n```\n\n### Tooling note\n\nThe original AutoAWQ library is no longer actively maintained; llm-compressor (ch. 43) now provides an AWQ modifier for vLLM-compatible checkpoints."}, {"id": 34, "title": "NF4, bitsandbytes and QLoRA", "tldr": "NF4 (NormalFloat4) spaces its 16 levels to match the bell-shaped distribution of weights. It quantizes at load time with no calibration, and it is the engine of QLoRA fine-tuning on small GPUs.", "real": "The QLoRA paper (Dettmers et al., 2023) fine-tuned a 65B model on a single 48 GB GPU. The resulting Guanaco model reached about 99% of ChatGPT’s score on the Vicuna benchmark at the time, which put large-model fine-tuning within reach of individuals.", "body": "### NF4 levels\n\nWeights are roughly normally distributed. NF4 places more levels near zero, where most weights sit, and fewer at the extremes. It is information-theoretically well suited for normal data.\n\n### Double quantization\n\nThe per-block scales are themselves quantized to 8 bits, saving about 0.37 bits per parameter.\n\n### Usage in Transformers\n\n```python\nfrom transformers import AutoModelForCausalLM, BitsAndBytesConfig\nimport torch\n\nbnb = BitsAndBytesConfig(load_in_4bit=True, bnb_4bit_quant_type=\"nf4\",\n                         bnb_4bit_use_double_quant=True,\n                         bnb_4bit_compute_dtype=torch.bfloat16)\nmodel = AutoModelForCausalLM.from_pretrained(\"meta-llama/Llama-3.1-8B-Instruct\",\n                                             quantization_config=bnb, device_map=\"auto\")\n```\n\n### QLoRA in one line\n\nFreeze the NF4 base model and train small LoRA adapters in BF16 on top. Memory needed for a 70B fine-tune drops from several hundred GB to under 48 GB.\n\n### For serving\n\nvLLM supports `--quantization bitsandbytes`, but throughput is lower than AWQ/GPTQ kernels. For production, merge the adapter into the base model and requantize with AWQ or GPTQ, or serve the adapter with multi-LoRA (ch. 73)."}, {"id": 35, "title": "GGUF and k-quants", "tldr": "GGUF is llama.cpp’s single-file model format. K-quants mix precisions per tensor. Q4_K_M (~4.8 bits) is the popular default, and lower “IQ” types use an importance matrix. It is best for single users and CPU+GPU splits.", "real": "GGUF replaced the older GGML format in August 2023 and became the format behind Ollama, LM Studio and llama.cpp. Hugging Face hosts many thousands of GGUF repos from quantizers such as bartowski and Unsloth.", "body": "### What is in a GGUF file\n\nWeights plus metadata: architecture, tokenizer, chat template and quantization types. One file, no config folder.\n\n### Common types\n\n| Type | \\~Bits/weight | 8B size | 70B size | Quality |\n|---|---|---|---|---|\n| Q8_0 | 8.5 | 8.5 GB | 75 GB | Near lossless |\n| Q6_K | 6.6 | 6.6 GB | 58 GB | Excellent |\n| Q5_K_M | 5.7 | 5.7 GB | 50 GB | Very good |\n| **Q4_K_M** | 4.8 | 4.9 GB | 42 GB | **Popular default** |\n| Q3_K_M | 3.9 | 4.0 GB | 34 GB | Noticeable loss |\n| Q2_K | \\~3.0 | 3.2 GB | 26 GB | Large loss |\n| IQ2_XS / XXS | \\~2.3 / 2.1 | \\~2.5 GB | 21 / 19 GB | Needs imatrix, big loss |\n\n### K-quants\n\n“K” types use super-blocks with nested scales and give sensitive tensors (for example parts of attention and the output head) more bits. `_S`, `_M`, `_L` mean small, medium, large mixes.\n\n### Importance matrix (imatrix)\n\nFor low-bit types, llama.cpp runs calibration text to learn which weights matter, similar in spirit to AWQ.\n\n### When to use GGUF\n\n- ✅ Local single-user, Mac, CPU, partial GPU offload\n- ❌ High-concurrency GPU serving (use vLLM with AWQ, GPTQ or FP8)"}, {"id": 36, "title": "INT2 overview", "tldr": "INT2 leaves only 4 levels per weight and is about 8× smaller than BF16, so a 70B model fits in ~20 GB. Plain rounding destroys quality, so INT2 works only with advanced methods, mixed precision, or quantization-aware training.", "real": "Apple’s on-device foundation model used a mixed 2-bit and 4-bit scheme averaging about 3.5 bits per weight (2024). Apple reported in 2025 that it compressed the on-device model to 2 bits per weight using quantization-aware training, which shows INT2 can work when the model is trained for it.", "body": "### The levels\n\n```\nINT4: 16 levels  ▁▂▂▃▃▄▄▅▅▆▆▇▇██\nINT2:  4 levels  ▁   ▃   ▆   █\n```\n\nWith 4 levels, almost every weight lands far from its true value.\n\n### Memory gains\n\n| Model | BF16 | INT4 | INT2 |\n|---|---|---|---|\n| 8B | 16 GB | 5 GB | \\~3 GB |\n| 70B | 140 GB | \\~40 GB | \\~20–22 GB |\n| 405B | 810 GB | \\~220 GB | \\~110 GB |\n\n### What makes INT2 usable\n\n1. Better quantizers: AQLM, QuIP#, HQQ, IQ2 (ch. 38)\n2. Mixed precision: sensitive layers at 4–8 bits\n3. Quantization-aware training (ch. 25)\n4. Larger base models, which tolerate it better\n\n### Realistic expectations\n\n- 70B+ models at \\~2.5 bits: usable for chat, weaker at reasoning, code and math\n- 7–13B models at 2 bits: usually not usable\n- Engine support is narrower and speed gains depend on kernels"}, {"id": 37, "title": "Why 2-bit hurts so much", "tldr": "With only four levels, rounding error is large for nearly every weight, and errors compound through dozens of layers. The symptoms are repetition, broken reasoning, wrong facts and poor instruction following, and small models suffer most.", "real": "llama.cpp’s own quantization comparisons show perplexity rising gently from Q8 down to Q4, then climbing sharply below about 3 bits per weight. This pattern is why the community treats Q4_K_M as the sweet spot and Q2 as a last resort.", "body": "### Error compounding\n\n```\nLayer 1 output slightly wrong\n → Layer 2 receives wrong input, adds its own error\n → ... 80 layers later the hidden state has drifted far\n```\n\nAt 4 bits each layer’s error is small enough that later layers absorb it. At 2 bits it often is not.\n\n### Typical symptoms\n\n| Symptom | Example |\n|---|---|\n| Repetition | Same sentence loops |\n| Instruction drift | Ignores format requests (JSON breaks) |\n| Factual errors | Confident wrong answers |\n| Weak reasoning | Fails multi-step math |\n| Code bugs | Syntax errors, wrong APIs |\n\n### Why bigger models cope better\n\nLarge models have more redundancy: many weights encode overlapping information, so individual errors average out.\n\n### How to test 2-bit seriously\n\n1. Perplexity vs the 4-bit version (quick filter)\n2. Your task eval set, especially structured outputs\n3. Long-generation tests (repetition shows up late)\n4. Side-by-side human review on 50–100 prompts"}, {"id": 38, "title": "Methods that make 2-bit work", "tldr": "AQLM (vector codebooks), QuIP# (random rotations plus lattice codes), HQQ (fast optimization), GGUF IQ2 (importance-guided) and mixed precision are the main tools for usable 2-bit models.", "real": "AQLM, from Yandex Research and IST Austria (ICML 2024), reported state-of-the-art accuracy at 2 bits per parameter. QuIP# came from Cornell, and HQQ from Mobius Labs. Unsloth later used mixed “dynamic” low-bit quantization to shrink DeepSeek R1 671B to about 131 GB.", "body": "### The toolbox\n\n| Method | Core idea | Calibration |\n|---|---|---|\n| **AQLM** | Replace groups of 8 weights with codes into learned codebooks (vector quantization) | Yes, slow |\n| **QuIP#** | Multiply by random orthogonal (Hadamard) matrices so weights become “incoherent” (no outliers), then use E8 lattice codebooks | Yes |\n| **HQQ** | Optimize scales/zeros with a fast solver; no data needed | No |\n| **GGUF IQ2_*** | Importance matrix plus lattice-style codes in llama.cpp | Text sample |\n| **Mixed precision** | Attention and first/last layers at 4–8 bits, MLP at 2–3 bits | Varies |\n\n### Rotation: the big modern idea\n\nOutliers make quantization hard. Rotating the weight space spreads outlier energy across all channels, so every channel looks similar and quantizes well. The same idea powers QuaRot and SpinQuant for 4-bit activations.\n\n### Practical status\n\n- Producing these quants is slow (hours to days for large models).\n- Kernel support is narrower than for INT4 AWQ/GPTQ.\n- Check whether your engine version supports the format before investing."}, {"id": 39, "title": "1.58-bit (ternary) models", "tldr": "BitNet-style models use weights in {−1, 0, +1}, about 1.58 bits each, and replace multiplications with additions. They must be trained that way from the start; you cannot convert an existing model.", "real": "Microsoft released BitNet b1.58 2B4T in April 2025, which it described as the first open native 1-bit LLM at the 2B scale, trained on 4 trillion tokens. Microsoft also released bitnet.cpp for efficient CPU inference.", "body": "### Why 1.58 bits\n\nThree possible values carry log₂(3) ≈ 1.58 bits of information.\n\n### Why it is interesting\n\n- Matrix multiply becomes add/subtract and skip, which is very cheap.\n- Memory: a 7B model would be roughly 1.4 GB.\n- Energy use drops sharply, which suits phones and edge devices.\n\n### Why it is not everywhere yet\n\n| Limitation | Detail |\n|---|---|\n| Must be trained natively | Post-training conversion fails |\n| Few strong models | Mostly small research models so far |\n| Hardware | GPUs are optimized for dense FP/INT math, not ternary |\n\n### Takeaway\n\nTernary models are worth watching for edge AI. For deploying today’s strong open models, INT4 and FP8 remain the practical tools."}, {"id": 40, "title": "Quality vs memory: the decision table", "tldr": "8-bit is about lossless, 4-bit is the best balance, 3-bit is a stretch, and 2-bit is for experiments or for very large models that otherwise could not run. Prefer a smaller model at 4-bit over a bigger one at 2-bit unless tests prove otherwise.", "real": "A broad 2024 evaluation from Neural Magic (now Red Hat), titled “Give Me BF16 or Give Me Death?”, ran hundreds of thousands of evaluations across Llama 3.1 sizes. It found FP8 essentially lossless, INT8 within a few percent, and 4-bit weight-only competitive, especially for larger models.", "body": "### The table\n\n| Bits | Size vs BF16 | Typical quality | Use when |\n|---|---|---|---|\n| 16 | 100% | Reference | You have the VRAM |\n| 8 (FP8/INT8) | 50% | \\~Lossless | Default production on modern GPUs |\n| 6–5 | 35–40% | Very close | Local GGUF single user |\n| **4** | \\~27–30% | Small loss | **Best balance on small GPUs** |\n| 3 | \\~22% | Noticeable loss | Tight fit only |\n| 2 | \\~15% | Large loss | Experiments, huge models |\n\n### Choosing between model size and bits\n\n```\nFixed VRAM budget\n  ├─ Option A: bigger model, fewer bits\n  └─ Option B: smaller model, more bits\n\nRule: A usually wins down to ~4 bits.\n      Below ~3 bits, B often wins.\n```\n\n### Always verify\n\nBenchmarks average many tasks; your use case may be more sensitive (JSON output, code, a specific language). Run your own evals (ch. 44) before deciding."}, {"id": 41, "title": "The quantization flow, end to end", "tldr": "Pick the model, pick the scheme, prepare calibration data, quantize, save, evaluate, benchmark, deploy, monitor. Before any of that, check Hugging Face: a good pre-quantized version often already exists.", "real": "Red Hat AI’s public workflow follows exactly this loop for the models it publishes. It quantizes with llm-compressor, evaluates with lm-evaluation-harness, reports recovery against the original, and uploads checkpoints that vLLM loads directly.", "body": "### The flow\n\n```\n1. Base model (BF16)\n       │\n2. Choose scheme ── FP8 / W8A8 INT8 / W4A16 (GPTQ, AWQ) / GGUF\n       │\n3. Calibration data (256–512 samples like your traffic)\n       │\n4. Run quantizer (llm-compressor, llama-quantize)\n       │\n5. Save checkpoint (safetensors + quantization_config)\n       │\n6. Evaluate ── fail ──► change scheme / group size / calibration\n       │ pass\n7. Benchmark speed in vLLM\n       │\n8. Deploy (canary first)\n       │\n9. Monitor quality in production\n```\n\n### Time and hardware\n\n| Scheme | Calibration | Time for 8B | Time for 70B |\n|---|---|---|---|\n| FP8 dynamic | None | Minutes | \\~30–60 min |\n| W8A8 INT8 | Yes | \\~30 min | Hours |\n| W4A16 GPTQ/AWQ | Yes | \\~30–60 min | Several hours |\n| GGUF Q4_K_M | Optional imatrix | Minutes | \\~1 hour |\n\n### Shortcut first\n\nSearch Hugging Face for `<model>-AWQ`, `-GPTQ-Int4`, `-FP8`, or `-GGUF`. Prefer the model maker’s own repos, then well-known quantizers with published evaluations."}, {"id": 42, "title": "Calibration data", "tldr": "GPTQ, AWQ and SmoothQuant learn from real activations. Use 256–512 samples of 512–2,048 tokens that look like your production traffic, formatted with the model’s chat template.", "real": "Most public quantizations calibrate on generic text such as C4, WikiText or UltraChat. Teams serving code, legal or non-English traffic often requantize with their own domain samples because generic calibration can cost extra quality on specialized tasks.", "body": "### Why it matters\n\nThe quantizer decides which channels are important by watching activations. If calibration text is unlike real usage, it protects the wrong channels.\n\n### Good calibration set\n\n| Property | Recommendation |\n|---|---|\n| Size | 256–512 samples |\n| Length | 512–2,048 tokens each |\n| Content | Same domain and language as production |\n| Format | Wrapped in the model’s chat template |\n| Diversity | Mix short and long, different tasks |\n\n### Example: build from your logs\n\n```python\nfrom datasets import Dataset\nfrom transformers import AutoTokenizer\n\ntok = AutoTokenizer.from_pretrained(\"meta-llama/Llama-3.1-8B-Instruct\")\nrows = load_my_anonymized_prompts()[:512]   # your own function\ntexts = [tok.apply_chat_template(r[\"messages\"], tokenize=False) for r in rows]\ncalib = Dataset.from_dict({\"text\": texts})\n```\n\n### Privacy note\n\nRemove personal data from production samples before using them for calibration.\n\n### Methods that need none\n\nFP8 dynamic, NF4 (bitsandbytes), HQQ and plain round-to-nearest need no calibration."}, {"id": 43, "title": "Hands-on quantization with llm-compressor", "tldr": "llm-compressor is the vLLM project’s quantization library. A few lines of Python produce FP8, INT8 or INT4 checkpoints that vLLM serves directly. For GGUF, use llama.cpp’s convert and quantize tools.", "real": "llm-compressor lives under the vllm-project GitHub organization. Many of the quantized checkpoints you download from Hugging Face for vLLM were produced with it.", "body": "### Install\n\n```bash\npip install llmcompressor\n```\n\n### FP8 (no calibration)\n\n```python\nfrom llmcompressor import oneshot\nfrom llmcompressor.modifiers.quantization import QuantizationModifier\n\nrecipe = QuantizationModifier(targets=\"Linear\", scheme=\"FP8_DYNAMIC\", ignore=[\"lm_head\"])\noneshot(model=\"meta-llama/Llama-3.1-8B-Instruct\", recipe=recipe,\n        output_dir=\"Llama-3.1-8B-Instruct-FP8-Dynamic\")\n```\n\n### INT4 W4A16 with GPTQ\n\n```python\nfrom llmcompressor import oneshot\nfrom llmcompressor.modifiers.quantization import GPTQModifier\n\nrecipe = GPTQModifier(targets=\"Linear\", scheme=\"W4A16\", ignore=[\"lm_head\"])\noneshot(model=\"meta-llama/Llama-3.1-8B-Instruct\",\n        dataset=\"open_platypus\",          # swap for your domain data\n        recipe=recipe, max_seq_length=2048, num_calibration_samples=512,\n        output_dir=\"Llama-3.1-8B-Instruct-W4A16\")\n```\n\n### Serve the result\n\n```bash\nvllm serve ./Llama-3.1-8B-Instruct-W4A16\n```\n\n### GGUF path\n\n```bash\npython convert_hf_to_gguf.py ./Llama-3.1-8B-Instruct --outfile model-f16.gguf\n./llama-imatrix -m model-f16.gguf -f calibration.txt -o imatrix.dat   # optional\n./llama-quantize --imatrix imatrix.dat model-f16.gguf model-Q4_K_M.gguf Q4_K_M\n```\n\nRecipe names and arguments evolve; check the llm-compressor examples folder for your version."}, {"id": 44, "title": "Evaluating a quantized model", "tldr": "Check perplexity for quick damage, standard benchmarks for broad skills, and above all your own task evals for real quality. Also compare outputs side by side, because format and style breaks do not show up in averages.", "real": "EleutherAI’s lm-evaluation-harness is the standard tool here. It powered Hugging Face’s Open LLM Leaderboard, and most quantization papers and model cards report their recovery numbers with it.", "body": "### The four checks\n\n| Check | Tool | Tells you |\n|---|---|---|\n| Perplexity | lm-eval, llama-perplexity | General damage, fast |\n| Benchmarks | lm-evaluation-harness (MMLU, GSM8K, IFEval…) | Skill drops |\n| **Your evals** | 100–500 golden prompts with expected answers | Real-world quality |\n| Side by side | Diff outputs vs BF16 | Formatting and style breaks |\n\n### Running lm-eval against vLLM\n\n```bash\npip install lm-eval\nlm_eval --model vllm \\\n  --model_args pretrained=./Llama-3.1-8B-Instruct-W4A16,max_model_len=4096 \\\n  --tasks gsm8k,mmlu --batch_size auto\n```\n\n### Recovery metric\n\n```\nRecovery % = quantized score ÷ original score × 100\n```\n\nCommon acceptance bars: FP8 ≥ 99%, INT4 ≥ 97%.\n\n###

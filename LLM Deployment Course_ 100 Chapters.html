ts |\n| 7 | vLLM exposed without auth | Abuse, data leaks |\n| 8 | Autoscaling on CPU usage | Never scales when needed |\n| 9 | No warm-up before traffic | Slow first requests |\n| 10 | Average latency only | Hidden p99 pain |\n| 11 | Unrealistic benchmark lengths | Wrong capacity plan |\n| 12 | `latest` image tags | Surprise breakages |\n| 13 | TP=8 when TP=2 × 4 replicas fits | Lower throughput |\n| 14 | Batch and chat on the same replicas | Latency spikes |\n| 15 | Ignoring licenses | Legal risk |\n\n### Bonus: silent truncation\n\nCheck what context length your engine actually uses (Ollama `num_ctx`, vLLM `--max-model-len`). Truncated prompts look like a model that “forgets”."}, {"id": 99, "title": "Glossary", "tldr": "A reference of every key term in this course, from VRAM and HBM to PagedAttention, goodput and disaggregation. Come back whenever a term is unclear.", "real": "Many of these terms come from specific papers: PagedAttention (vLLM, SOSP 2023), continuous batching (Orca, OSDI 2022), GPTQ (2022), AWQ (MLSys 2024), QLoRA and NF4 (2023), and speculative decoding (Google, 2022). Reading the originals is the fastest way to deepen your understanding.", "body": "| Term | Meaning |\n|---|---|\n| VRAM | GPU memory |\n| HBM | High Bandwidth Memory on datacenter GPUs |\n| Bandwidth | Memory read speed (GB/s), which sets decode speed |\n| Prefill / Decode | Prompt processing / token-by-token generation |\n| KV cache | Stored attention keys and values of past tokens |\n| GQA / MQA / MLA | Attention variants that shrink the KV cache |\n| TTFT | Time to first token |\n| TPOT / ITL | Time per output token / inter-token latency |\n| Goodput | Throughput that meets latency SLOs |\n| SLO | Service-level objective, e.g. p95 TTFT < 1 s |\n| PTQ / QAT | Post-training quantization / quantization-aware training |\n| W4A16 / W8A8 | Weight bits / activation bits |\n| Scale / zero-point | Numbers mapping integers back to real values |\n| Group size | Weights sharing one scale (often 128) |\n| GPTQ | Hessian-based error-compensating quantization |\n| AWQ | Activation-aware scaling before quantization |\n| SmoothQuant | Moves outliers from activations to weights |\n| NF4 | 4-bit NormalFloat (bitsandbytes, QLoRA) |\n| FP8 / FP4 / MXFP4 / NVFP4 | Low-bit floating-point formats |\n| GGUF / K-quants / imatrix | llama.cpp format, mixed quants, importance matrix |\n| PagedAttention | Block-based KV memory management |\n| Continuous batching | Requests join and leave every step |\n| Chunked prefill | Long prompts split into pieces |\n| Prefix caching | Reuse KV of shared prompt starts |\n| Speculative decoding | Draft-and-verify multi-token generation |\n| TP / PP / DP / EP | Tensor / pipeline / data / expert parallelism |\n| MoE | Mixture of Experts |\n| LoRA | Small adapter weights for fine-tuning |\n| Disaggregation | Prefill and decode on separate pools |\n| CUDA graphs | Recorded kernel sequences for fast replay |\n| NCCL | NVIDIA’s GPU communication library |"}, {"id": 100, "title": "Learning roadmap and final checklist", "tldr": "Practice in ten hands-on steps, from running a local quantized model to studying disaggregated serving, and use the pre-production checklist before any real launch.", "real": "Good free resources include the official vLLM documentation and blog, the Hugging Face documentation and courses, and MIT’s 6.5940 “TinyML and Efficient Deep Learning Computing” course by Song Han. Song Han’s lab created AWQ and SmoothQuant.", "body": "### Ten-step roadmap\n\n1. Run an 8B model with Ollama or llama.cpp; compare Q8, Q4 and Q2 outputs.\n2. Install vLLM, serve an 8B model, call it with the OpenAI SDK.\n3. Read the startup logs; compute KV capacity by hand (ch. 19) and compare.\n4. Serve AWQ and FP8 versions; compare speed and quality on 50 of your prompts.\n5. Benchmark with `vllm bench serve` at several concurrency levels; find the knee.\n6. Quantize a model yourself with llm-compressor (ch. 43).\n7. Run 2-GPU tensor parallelism (rent GPUs by the hour if needed).\n8. Deploy on Kubernetes with Prometheus and Grafana; add autoscaling.\n9. Put a gateway in front with auth, rate limits and routing between two models.\n10. Study llm-d, Dynamo or SGLang to understand disaggregated serving.\n\n### Pre-production checklist\n\n- [ ] Model passes your eval suite; license approved\n- [ ] Precision chosen with measured quality impact\n- [ ] VRAM budget: weights + KV + overhead ≤ 90–95%\n- [ ] `--max-model-len`, `--max-num-seqs`, KV dtype set on purpose\n- [ ] Benchmarked at expected peak; TTFT p95 and TPOT meet SLO\n- [ ] Replicas = peak need + headroom + N+1\n- [ ] Gateway with auth, rate limits and logging; vLLM not public\n- [ ] Metrics, dashboards and alerts live\n- [ ] Image tag and model revision pinned; rollback tested\n- [ ] Canary rollout plan ready\n\n### You finished\n\nIf you can explain why INT4 plus FP8 KV lets a 24 GB GPU serve more users, and how you would size replicas for 1,000 employees, you understand LLM deployment."}];
const PARTS = [
  "Foundations: what an LLM is in memory",
  "GPU hardware and the VRAM market",
  "Does the processor matter?",
  "How a model lives in VRAM",
  "Quantization fundamentals",
  "INT8 and FP8 quantization",
  "INT4 quantization",
  "INT2 and extreme quantization",
  "The end-to-end quantization flow",
  "Big models on a 24 GB GPU",
  "Big models on a 48 GB GPU",
  "Parallelism across GPUs",
  "Inference engines and serving tricks",
  "vLLM hands-on: basics",
  "vLLM hands-on: advanced",
  "Serving multiple users",
  "Throughput and capacity planning",
  "Deploying an open-source LLM to production",
  "How big companies do it",
  "Cheat sheets, mistakes and roadmap"
];
const partOf = id => Math.ceil(id / 5);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "llm-course-progress-v1";
const LS_LAST = "llm-course-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try{ await dbRef.set({done:[...done].sort((a,b)=>a-b), updated:Date.now()}); }
  catch(e){ if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; pushRemote(); }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...done])); }catch(e){} }
function toggle(id){
  if (done.has(id)) done.delete(id); else done.add(id);
  saveLocal(); pushRemote(); renderAll();
  toast(done.has(id) ? "Chapter " + id + " marked complete" : "Chapter " + id + " marked not complete");
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(s){
  if (window.marked && marked.parse){
    const html = marked.parse(s, {gfm:true, headerIds:false, mangle:false});
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  }
  return "<pre>" + esc(s) + "</pre>";
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function currentId(){
  const m = location.hash.match(/^#ch-(\d{1,3})$/);
  const n = m ? +m[1] : 0;
  return n >= 1 && n <= 100 ? n : 0;
}

/* ---------- header memory bank ---------- */
function renderBank(){
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    html += '<div class="bank-group" title="Part ' + p + ': ' + esc(PARTS[p-1]) + '">';
    for (let i = (p-1)*5 + 1; i <= p*5; i++){
      html += '<button class="cell' + (done.has(i) ? " done" : "") + (i === cur ? " here" : "") +
        '" data-go="' + i + '" aria-label="Chapter ' + i + (done.has(i) ? ", complete" : "") + '"></button>';
    }
    html += "</div>";
  }
  document.getElementById("bank").innerHTML = html;
  document.getElementById("doneCount").textContent = done.size;
  document.getElementById("pct").textContent = Math.round(done.size) + "%";
}

/* ---------- sidebar ---------- */
const openParts = new Set();
function renderSide(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    const ids = [1,2,3,4,5].map(k => (p-1)*5 + k);
    const matches = ids.filter(i => !q || byId[i].title.toLowerCase().includes(q) || byId[i].tldr.toLowerCase().includes(q) || String(i) === q);
    if (q && !matches.length) continue;
    const count = ids.filter(i => done.has(i)).length;
    const open = q || openParts.has(p) || partOf(cur) === p;
    html += '<div class="part' + (open ? " open" : "") + '">' +
      '<button class="part-head" data-part="' + p + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="part-num">' + String(p).padStart(2, "0") + '</span>' +
      '<span class="part-name">' + esc(PARTS[p-1]) + '</span>' +
      '<span class="part-count' + (count === 5 ? " full" : "") + '">' + count + '/5</span></button><ul class="part-list">';
    for (const i of matches){
      html += '<li class="ch-row' + (i === cur ? " active" : "") + '">' +
        '<button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="' + (done.has(i) ? "Mark chapter " + i + " not complete" : "Mark chapter " + i + " complete") + '">' + TICK + '</button>' +
        '<a href="#ch-' + i + '"><span class="n">' + i + '.</span>' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ul></div>";
  }
  if (!html) html = '<p style="color:var(--muted);font-size:14px;padding:8px">No chapters match that search. Try a shorter word like “KV” or “INT4”.</p>';
  document.getElementById("parts").innerHTML = html;
}

/* ---------- chapter view ---------- */
function renderChapter(id){
  const c = byId[id];
  const p = partOf(id);
  const ids = [1,2,3,4,5].map(k => (p-1)*5 + k);
  const isDone = done.has(id);
  const tabs = ids.map(i =>
    '<button class="tab' + (i === id ? " active" : "") + '" role="tab" aria-selected="' + (i === id) + '" data-go="' + i + '">' +
    '<span class="dot' + (done.has(i) ? " on" : "") + '"></span><span class="tab-t">' + i + '. ' + esc(byId[i].title) + '</span></button>'
  ).join("");
  document.getElementById("main").innerHTML =
    '<p class="crumb">Part ' + p + ' of 20: ' + esc(PARTS[p-1]) + '</p>' +
    '<div class="tabs" role="tablist" aria-label="Chapters in this part">' + tabs + '</div>' +
    '<article>' +
      '<p class="ch-no">Chapter ' + id + ' of 100</p>' +
      '<h1 class="ch-title">' + esc(c.title) + '</h1>' +
      '<section class="box tldr"><h2>TL;DR</h2><p>' + inlineMd(c.tldr) + '</p></section>' +
      '<div class="body">' + md(c.body) + '</div>' +
      '<section class="box real"><h2>In the real world</h2><p>' + inlineMd(c.real) + '</p></section>' +
      '<div class="done-bar">' +
        '<button class="complete' + (isDone ? " on" : "") + '" data-toggle="' + id + '" aria-pressed="' + isDone + '">' +
          '<span class="tick' + (isDone ? " on" : "") + '">' + TICK + '</span>' + (isDone ? "Completed" : "Mark as complete") + '</button>' +
        '<div class="nav">' +
          '<button class="btn" data-go="' + (id - 1) + '"' + (id === 1 ? " disabled" : "") + '>Previous</button>' +
          '<button class="btn" data-go="' + (id + 1) + '"' + (id === 100 ? " disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>' +
    '</article>';
}

/* ---------- contents view ---------- */
function renderContents(){
  let html = '<div class="contents"><h1>Contents</h1>' +
    '<p class="lead">Twenty parts, five chapters each. Tick a chapter when you finish it; your progress is saved for next time.</p>' +
    '<div class="contents-actions"><button class="btn" data-go="' + firstUnread() + '">' + (done.size ? "Continue with chapter " + firstUnread() : "Start chapter 1") + '</button>' +
    '<button class="btn" id="resetBtn">Reset progress</button></div><div class="grid">';
  for (let p = 1; p <= 20; p++){
    const ids = [1,2,3,4,5].map(k => (p-1)*5 + k);
    const count = ids.filter(i => done.has(i)).length;
    html += '<section class="pcard"><h2>Part ' + p + ': ' + esc(PARTS[p-1]) + '</h2><div class="meta">' + count + ' of 5 complete</div><ol>';
    for (const i of ids){
      html += '<li><button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="Toggle chapter ' + i + '">' + TICK + '</button><a href="#ch-' + i + '">' + i + '. ' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ol></section>";
  }
  document.getElementById("main").innerHTML = html + "</div></div>";
}
function firstUnread(){ for (let i = 1; i <= 100; i++) if (!done.has(i)) return i; return 100; }

/* ---------- routing ---------- */
let lastRendered = null;
function renderAll(){
  const id = currentId();
  renderBank(); renderSide();
  const y = window.scrollY;
  if (id) renderChapter(id); else renderContents();
  if (lastRendered === location.hash) window.scrollTo(0, y);
  lastRendered = location.hash;
}
function route(){
  const id = currentId();
  if (!id && location.hash !== "#contents"){
    let last = 0; try{ last = +localStorage.getItem(LS_LAST) || 0; }catch(e){}
    location.replace("#ch-" + (last >= 1 && last <= 100 ? last : 1));
    return;
  }
  if (id){ try{ localStorage.setItem(LS_LAST, id); }catch(e){} }
  document.body.classList.remove("drawer");
  renderAll();
  window.scrollTo(0, 0);
  const active = document.querySelector(".ch-row.active");
  if (active) active.scrollIntoView({block:"nearest"});
  const tab = document.querySelector(".tab.active");
  if (tab && tab.parentElement) tab.parentElement.scrollLeft = tab.offsetLeft - 16;
}
function go(id){ if (id >= 1 && id <= 100) location.hash = "#ch-" + id; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){ e.preventDefault(); toggle(+t.dataset.toggle); return; }
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled){ go(+g.dataset.go); return; }
  const ph = e.target.closest("[data-part]");
  if (ph){
    const p = +ph.dataset.part;
    const el = ph.parentElement;
    const isOpen = el.classList.toggle("open");
    if (isOpen) openParts.add(p); else openParts.delete(p);
    ph.setAttribute("aria-expanded", isOpen);
    return;
  }
  if (e.target.id === "resetBtn"){
    if (confirm("Clear all 100 ticks? This can’t be undone.")){ done.clear(); saveLocal(); pushRemote(); renderAll(); toast("Progress reset"); }
  }
});
document.getElementById("search").addEventListener("input", renderSide);
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.add("drawer"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = currentId(); if (!id) return;
  if (e.key === "ArrowRight") go(id + 1);
  else if (e.key === "ArrowLeft") go(id - 1);
});
function setTopH(){ document.documentElement.style.setProperty("--top-h", document.getElementById("top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);
window.addEventListener("hashchange", route);
setTopH();
route();
initSync();
</script>
<script src="book-bg.js?v=2"></script>
</body>
</html>

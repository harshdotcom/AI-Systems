 Write explicit pass criteria\n\nExample: “≥ 98% recovery on our eval set, zero JSON parse failures in 500 tool-call tests, no repetition loops in 100 long generations.”"}, {"id": 45, "title": "KV cache quantization", "tldr": "Store the KV cache in FP8 with `--kv-cache-dtype fp8` to fit about 2× more tokens, meaning more users or longer context, usually with small quality impact. It is one of the cheapest wins available in vLLM.", "real": "vLLM, SGLang and TensorRT-LLM all support FP8 KV caches. Research such as KIVI (2024) has pushed KV caches down to 2 bits, because at long context lengths the KV cache, not the weights, dominates memory.", "body": "### Why KV quantization is separate\n\nWeights are fixed and can be calibrated offline. KV values are created live from user input, so they are quantized on the fly with per-tensor or per-head scales.\n\n### Enabling it\n\n```bash\nvllm serve <model> --kv-cache-dtype fp8\n```\n\nOptionally use calibrated KV scales from an llm-compressor checkpoint for better accuracy.\n\n### Effect example (8B model, 14 GB free)\n\n| KV dtype | Bytes/token | Tokens that fit |\n|---|---|---|\n| BF16 | 128 KB | \\~110,000 |\n| FP8 | 64 KB | \\~220,000 |\n\n### Where to be careful\n\n- Very long-context retrieval (“needle in a haystack”) tasks\n- Math-heavy reasoning over long chains\n- Older GPUs without native FP8 (support and speed vary)\n\nTest with a few long-context prompts from your real traffic before turning it on in production."}, {"id": 46, "title": "What fits in 24 GB", "tldr": "On 24 GB (RTX 3090/4090, L4, A10), 8–14B models run comfortably, 24–32B models fit at INT4 with short context, 30B-class MoE models run fast, and 70B needs a second GPU, offloading, or 2-bit.", "real": "Google positioned the Gemma 3 27B QAT release as runnable on one RTX 3090. Qwen3-30B-A3B, a MoE model with about 3B active parameters, became a favorite on 24 GB cards because it decodes about as fast as a 3B model.", "body": "### Fit table (vLLM, 0.9 utilization, \\~1.5 GB overhead)\n\n| Model | Format | Weights | KV room | Verdict |\n|---|---|---|---|---|\n| 8B | BF16 | 16 GB | \\~4 GB | ✅ Few users, short context |\n| 8B | FP8 / INT4 | 8 / 5 GB | \\~12 / \\~15 GB | ✅ Many users |\n| 14B | FP8 | \\~15 GB | \\~5 GB | ✅ Good |\n| 24–27B | INT4 | \\~14–17 GB | \\~4–6 GB | ✅ Good |\n| 32B | INT4 | \\~19 GB | \\~2–3 GB | ⚠️ Short context; use FP8 KV |\n| 30B MoE (3B active) | INT4 | \\~16–17 GB | \\~4 GB | ✅ Fast |\n| 70B | INT4 | \\~40 GB | none | ❌ Needs 2 GPUs or offload |\n| 70B | \\~2-bit | \\~19–22 GB | <2 GB | ⚠️ Single user, quality loss |\n\n### Example: 32B on one RTX 4090\n\n```bash\nvllm serve Qwen/Qwen2.5-32B-Instruct-AWQ \\\n  --max-model-len 8192 --kv-cache-dtype fp8 \\\n  --gpu-memory-utilization 0.95 --max-num-seqs 8\n```\n\n### Tip\n\nIf the GPU also drives your monitor, the desktop takes 0.5–1.5 GB. Use a headless server or lower the utilization setting."}, {"id": 47, "title": "The strategy ladder for small GPUs", "tldr": "Climb in order: a smaller newer model, weight quantization, KV quantization, capped context and concurrency, MoE, a second GPU, offload, and finally 2–3-bit. Stop at the first step that meets your quality and speed target.", "real": "Model quality per parameter keeps rising. Meta’s published numbers showed Llama 3 8B roughly matching Llama 2 70B on MMLU, so step one (“just use a newer, smaller model”) often solves the problem with no tricks at all.", "body": "### The ladder\n\n| Step | Action | Cost |\n|---|---|---|\n| 1 | Use a smaller, newer model | Re-evaluate quality |\n| 2 | Quantize weights: FP8 → INT4 | Small quality risk |\n| 3 | `--kv-cache-dtype fp8` | Tiny risk |\n| 4 | Cap `--max-model-len`, `--max-num-seqs` | Fewer or shorter chats |\n| 5 | Switch to an MoE model | Needs storage for all experts |\n| 6 | Add a second GPU (TP=2) | Money, PCIe overhead |\n| 7 | Offload to CPU RAM | Much slower |\n| 8 | 2–3-bit quantization | Real quality loss |\n\n### Example walk-through\n\nGoal: a strong model for a 10-person team on one RTX 4090.\n\n1. A 70B INT4 model does not fit. Move on.\n2. A 32B INT4 model fits with \\~2–3 GB KV. With FP8 KV that is \\~16K tokens total. Too tight for 10 people with long chats.\n3. A 30B-class MoE at INT4 leaves \\~4 GB KV, with FP8 KV about 30K+ tokens, and fast decode.\n4. A 14B FP8 model leaves \\~5 GB KV and is a strong alternative.\n\nDecide between steps 3 and 4 with your own evaluation set."}, {"id": 48, "title": "Two consumer GPUs (2 × 24 GB)", "tldr": "Tensor parallelism across two 24 GB cards gives 48 GB and roughly double the combined bandwidth, enough for 70B at INT4 with modest context. It works over PCIe without NVLink, with some communication overhead.", "real": "Dual RTX 3090 rigs became a classic community build for running 70B models at home and in small labs. The 3090 still supports an NVLink bridge, which the 4090 dropped, so some builders chose 3090s specifically for that.", "body": "### Command\n\n```bash\nvllm serve Qwen/Qwen2.5-72B-Instruct-AWQ \\\n  --tensor-parallel-size 2 \\\n  --max-model-len 8192 \\\n  --kv-cache-dtype fp8 \\\n  --gpu-memory-utilization 0.92\n```\n\n### What happens\n\n- Each layer’s matrices are split in half: \\~20 GB of weights per card.\n- After each layer, the two GPUs exchange partial results (all-reduce).\n- KV cache is split by attention heads across both GPUs.\n\n### Hardware checklist\n\n- [ ] Both cards in x16 slots (x8 acceptable)\n- [ ] PSU sized for both (2 × 350–450 W plus system)\n- [ ] Good airflow; blower or spaced cards\n- [ ] Same model of GPU (mixing slows to the weaker card)\n- [ ] `--ipc=host` if using Docker\n\n### Expected speed\n\n70B INT4, single user: often \\~15–25 tok/s on dual 3090/4090 depending on PCIe and kernels. It improves with batch size for multiple users."}, {"id": 49, "title": "CPU and RAM offloading", "tldr": "When a model cannot fit, part of it can live in system RAM. vLLM’s `--cpu-offload-gb` streams weights over PCIe every step (slow). llama.cpp’s `-ngl` layer split and MoE expert offload are the most practical tools.", "real": "Tsinghua’s KTransformers project demonstrated DeepSeek-R1 671B running on a single 24 GB GPU plus a large amount of system RAM in early 2025. It kept attention on the GPU and MoE experts on the CPU, and that hybrid pattern is now also available in llama.cpp.", "body": "### Option A: vLLM offload\n\n```bash\nvllm serve <model> --cpu-offload-gb 20\n```\n\nThe offloaded weights cross PCIe (\\~25–60 GB/s) every forward pass, so speed drops sharply. Use it to “make it run”, not to serve many users.\n\n### Option B: llama.cpp layer split\n\n```bash\n./llama-server -m Llama-3.3-70B-Instruct-Q4_K_M.gguf \\\n  -ngl 50 -c 8192 --host 0.0.0.0 --port 8080\n```\n\n`-ngl 50` places 50 layers on the GPU and the rest on the CPU. Raise it until VRAM is nearly full.\n\n### Option C: MoE expert offload\n\nAttention and shared layers stay on the GPU; the many expert FFNs sit in RAM. Because only a few experts run per token, the CPU side stays manageable.\n\n```bash\n./llama-server -m big-moe-Q4_K_M.gguf -ngl 99 --n-cpu-moe 30 -c 16384\n```\n\n(`--n-cpu-moe` and `-ot` tensor overrides exist in recent llama.cpp builds; check `--help`.)\n\n### Expected speed\n\n| Setup | Rough single-user speed |\n|---|---|\n| 70B Q4, half on GPU | \\~3–8 tok/s |\n| Large MoE, experts on fast DDR5 server | \\~5–20 tok/s |"}, {"id": 50, "title": "Why MoE models suit small GPUs", "tldr": "Mixture-of-Experts models store many expert networks but use only a few per token. You need memory for all experts, but bandwidth only for the active ones, so decode speed matches a much smaller dense model.", "real": "Mixtral 8x7B (Dec 2023) has about 46.7B total parameters but only about 12.9B active per token. DeepSeek-V3 has 671B total and 37B active. OpenAI’s gpt-oss-20b (21B total, ~3.6B active) was designed to fit on 16 GB devices.", "body": "### How MoE works\n\n```\ntoken ─► router ─► picks top-k experts (e.g. 2 of 8, or 8 of 128)\n                    │\n            Expert 3 ─┐\n            Expert 7 ─┴► weighted sum ─► next layer\n```\n\n### Memory vs speed\n\n| Model | Total params | Active params | Stored at INT4 | Reads per token |\n|---|---|---|---|---|\n| Dense 32B | 32B | 32B | \\~19 GB | \\~19 GB |\n| 30B MoE (3B active) | 30B | \\~3B | \\~17 GB | \\~2 GB |\n\nThe MoE decodes up to \\~5–8× faster on the same GPU.\n\n### Trade-offs\n\n- Quality is typically between the active size and the total size of a dense model.\n- All experts must be stored somewhere: VRAM, or RAM with offload.\n- Large batches activate many different experts, so heavy multi-user MoE serving needs expert parallelism (ch. 59).\n\n### Best small-GPU picks\n\nLook for MoE models with low active parameters (3–4B active) at INT4 for 16–24 GB cards. They give fast chat with strong quality."}, {"id": 51, "title": "What fits in 48 GB", "tldr": "48 GB (L40S, RTX 6000 Ada, A6000) makes 8–14B BF16 a strong multi-user server, runs 32B in FP8 or INT4 well, and squeezes 70B INT4 for a handful of users.", "real": "AWS’s G6e instances put NVIDIA L40S (48 GB) GPUs in the cloud, and they became a common choice for mid-size model serving: cheaper per hour than H100 instances, with enough memory for 32B-class models.", "body": "### Fit table (0.9–0.95 utilization)\n\n| Model | Format | Weights | KV room | Verdict |\n|---|---|---|---|---|\n| 8B | BF16 | 16 GB | \\~25 GB | ✅ Excellent multi-user |\n| 14B | BF16 | 28 GB | \\~13 GB | ✅ Good |\n| 32B | FP8 | \\~33 GB | \\~8–9 GB | ✅ Quality with moderate users |\n| 32B | INT4 | \\~19 GB | \\~22 GB | ✅ Many users, long context |\n| 70B | INT4 | \\~40 GB | \\~3–4 GB | ⚠️ Few users, FP8 KV advised |\n| 70B | FP8 | 70 GB | none | ❌ Needs 80 GB+ |\n| 100B+ MoE | INT4 | 55–65 GB+ | none | ❌ Needs 2 GPUs or offload |\n\n### Capacity examples (FP8 KV)\n\n| Config | KV tokens | Users at 4K tokens each |\n|---|---|---|\n| 8B BF16 | \\~400K | \\~100 |\n| 32B INT4 | \\~170K | \\~40 |\n| 70B INT4 | \\~25K | \\~6 |\n\n### Takeaway\n\nOn 48 GB the main question becomes **“best quality for few users”** (70B INT4) **vs “great quality for many users”** (32B INT4 or FP8)."}, {"id": 52, "title": "Recipe: 70B on one 48 GB GPU", "tldr": "Use a 70B-class AWQ or GPTQ checkpoint (~40 GB), FP8 KV cache, 8K context and a low max-num-seqs. You get roughly 20–25K tokens of KV cache, enough for about 3–6 simultaneous users.", "real": "Teams that need 70B-class quality for an internal tool, such as a legal or research assistant for a small department, commonly run exactly this single-L40S or RTX 6000 Ada configuration rather than paying for an 80 GB GPU.", "body": "### Command\n\n```bash\nvllm serve Qwen/Qwen2.5-72B-Instruct-AWQ \\\n  --max-model-len 8192 \\\n  --kv-cache-dtype fp8 \\\n  --gpu-memory-utilization 0.95 \\\n  --max-num-seqs 16\n```\n\n### Budget\n\n| Item | Size |\n|---|---|\n| 48 GB × 0.95 | 45.6 GB |\n| Weights (72B AWQ) | \\~41 GB |\n| Overhead | \\~1.5 GB |\n| KV pool | \\~3 GB ≈ 20K+ tokens with FP8 KV |\n\n### If it OOMs at startup\n\n1. Lower `--max-model-len` to 4096\n2. Add `--enforce-eager` (frees CUDA-graph memory)\n3. Reduce `--max-num-seqs` to 4–8\n4. Lower `--max-num-batched-tokens` to 2048\n\n### Expectations\n\n- Single-user decode: roughly 20–30 tok/s on L40S-class bandwidth\n- Good for: internal assistants, evaluation, prototyping\n- Not for: public apps with bursty traffic"}, {"id": 53, "title": "Two 24 GB cards vs one 48 GB card", "tldr": "Two 24 GB cards give the same VRAM with often faster decode (two memory buses), but add PCIe overhead, power and complexity. One 48 GB card is simpler, denser and meant for servers.", "real": "NVIDIA’s GeForce driver license prohibits deploying GeForce cards in datacenters (with narrow exceptions). That is a major reason companies buy L40S or RTX 6000 class cards for servers while individuals and labs use RTX 3090/4090 pairs.", "body": "### Comparison\n\n| Factor | 2 × 24 GB (e.g. 2× 4090) | 1 × 48 GB (e.g. L40S) |\n|---|---|---|\n| Total VRAM | 48 GB | 48 GB |\n| Aggregate bandwidth | \\~2 TB/s | \\~0.86–0.96 TB/s |\n| Decode speed | Often faster | Slower per user |\n| Communication | PCIe all-reduce each layer | None |\n| Power | \\~700–900 W | \\~300–350 W |\n| Rack density | Poor (consumer coolers) | Good (passive, server airflow) |\n| Datacenter licensing | Restricted | Allowed |\n| Complexity | TP config, more failure points | Simple |\n| ECC memory | No | Yes |\n\n### When to choose which\n\n- **Home lab, startup prototype, research:** 2 × 24 GB\n- **Production in a datacenter or cloud:** 48 GB professional cards\n- **Need more than one model:** two separate 24 GB cards can each run their own smaller model (data parallel), which is flexibility a single card does not give"}, {"id": 54, "title": "Context length vs number of users", "tldr": "The KV budget is fixed. Total tokens ÷ tokens per user = users you can serve at once. Longer context means fewer users, and FP8 KV doubles both.", "real": "Llama 3.1 supports 128K tokens, yet hosted providers often cap context lower or charge more for very long prompts. Google, for example, priced Gemini Pro models higher for prompts above a long-context threshold, because long contexts consume so much KV memory.", "body": "### The two formulas\n\n```\nTotal KV tokens  = Free VRAM ÷ KV bytes per token\nConcurrent users ≈ Total KV tokens ÷ average (prompt + output) tokens per user\n```\n\n### Example: 20 GB free, 8B model (128 KB/token BF16)\n\n| Context per user | Users (BF16 KV) | Users (FP8 KV) |\n|---|---|---|\n| 2K | \\~80 | \\~160 |\n| 4K | \\~40 | \\~80 |\n| 8K | \\~20 | \\~40 |\n| 32K | \\~5 | \\~10 |\n| 128K | \\~1 | \\~2 |\n\n### Important nuance\n\n`--max-model-len` is the **maximum**, not what every user consumes. vLLM allocates blocks as tokens are actually generated, so average usage determines capacity. You still need enough room for at least one maximum-length request.\n\n### Design levers\n\n- Summarize old chat turns instead of keeping full history\n- Retrieve relevant chunks (RAG) instead of stuffing whole documents\n- Offer long context only on a premium tier or a dedicated pool"}, {"id": 55, "title": "Example 48 GB configurations by goal", "tldr": "Choose the configuration by goal: 8–14B FP8 for maximum users, 70B INT4 for top quality with few users, 32B INT4 for long-document RAG, and an MoE with prefix caching for coding teams.", "real": "This “one GPU type, several profiles” approach mirrors how cloud model catalogs work. Services like Amazon Bedrock and Vertex AI Model Garden offer the same model family in different sizes so customers can pick quality, speed or cost.", "body": "### Profiles\n\n| Goal | Model / format | Key flags |\n|---|---|---|\n| Max users, good quality | 8B or 14B FP8 | `--kv-cache-dtype fp8 --max-num-seqs 128` |\n| Best quality, few users | 70B INT4 | `--max-model-len 8192 --max-num-seqs 8` |\n| Long documents (RAG) | 32B INT4 | `--max-model-len 32768 --kv-cache-dtype fp8` |\n| Coding assistant team | 30B-class MoE INT4/FP8 | Prefix caching on, long context |\n| Agents with tools | 14–32B with good tool calling | `--enable-auto-tool-choice --tool-call-parser ...` |\n\n### Example: RAG service\n\n```bash\nvllm serve Qwen/Qwen2.5-32B-Instruct-AWQ \\\n  --max-model-len 32768 \\\n  --kv-cache-dtype fp8 \\\n  --enable-prefix-caching \\\n  --max-num-seqs 32\n```\n\n### How to pick\n\nRun each candidate profile against the same eval set and the same load test (ch. 84). Pick the cheapest one that meets both quality and latency targets."}, {"id": 56, "title": "Tensor parallelism (TP)", "tldr": "TP splits each layer’s matrices across GPUs, so every GPU works on every token. It adds memory and bandwidth per request (lower latency) but needs fast links, so it is best inside one server.", "real": "This way of splitting transformer layers was popularized by NVIDIA’s Megatron-LM paper (2019). Every major inference engine (vLLM, SGLang, TensorRT-LLM) uses the Megatron-style split for multi-GPU serving.", "body": "### How it splits\n\n```\nLinear layer W (4096 × 14336)\nGPU 0: columns    0 – 7167\nGPU 1: columns 7168 – 14335\n→ each computes half, then all-reduce combines results\n```\n\nAttention heads are divided between GPUs too, so the KV cache is split as well.\n\n### Flags\n\n```bash\nvllm serve meta-llama/Llama-3.3-70B-Instruct --tensor-parallel-size 4\n```\n\nTP size must divide the number of attention heads (usually 1, 2, 4 or 8).\n\n### Benefits\n\n- Each GPU holds 1/N of the weights\n- Each GPU reads 1/N of the weights per token, so decode is faster\n- KV cache spread across GPUs, giving more total room\n\n### Costs\n\n- Two all-reduces per layer: needs NVLink for good scaling at TP=4/8\n- Communication overhead grows with N; throughput per GPU drops\n- A failure in one GPU stops the whole replica\n\n### Rule\n\nUse the **smallest** TP that fits the model with healthy KV room."}, {"id": 57, "title": "Pipeline parallelism (PP)", "tldr": "PP splits the model by layers, for example GPU 1 runs layers 1–40 and GPU 2 runs 41–80. It sends less data than TP, so it works across servers. The usual pattern is TP inside a node and PP across nodes.", "real": "Google’s GPipe (2018) popularized pipeline parallelism for training giant models. When Llama 3.1 405B launched, vLLM showed BF16 serving across two 8-GPU nodes using pipeline parallelism, while the FP8 version fit on one node.", "body": "### How it splits\n\n```\nNode A (8 GPUs, TP=8): layers  1 – 63\nNode B (8 GPUs, TP=8): layers 64 – 126\nOnly the hidden state passes between nodes per micro-batch\n```\n\n### Flags\n\n```bash\nvllm serve <huge-model> --tensor-parallel-size 8 --pipeline-parallel-size 2\n```\n\nMulti-node vLLM uses a Ray cluster to coordinate workers.\n\n### Pipeline bubbles\n\nWith one request, Node B waits while Node A works. Engines fill the pipeline with multiple micro-batches from different requests, so bubbles shrink under load.\n\n### When to use PP\n\n- The model does not fit in one server\n- GPUs connected by slower links (PCIe-only boxes)\n- Odd GPU counts where TP divisibility fails\n\n### When not to\n\nIf the model fits in one node, TP alone (or TP + replicas) usually gives lower latency."}, {"id": 58, "title": "Data parallelism: replicas", "tldr": "Run full independent copies of the model behind a load balancer. Throughput scales linearly with replicas but single-request speed does not change. This is how services scale to millions of users.", "real": "When LMSYS served its Chatbot Arena and Vicuna demo with vLLM in 2023, the vLLM team reported that LMSYS cut the number of GPUs needed to handle the same traffic by about 50%. At large scale, savings like that come from packing more users into each replica.", "body": "### Picture\n\n```\n              ┌── Replica 1 (GPU 0)\nLoad balancer ├── Replica 2 (GPU 1)\n              ├── Replica 3 (GPU 2)\n              └── Replica 4 (GPU 3)\n```\n\n### Two ways to run it\n\n```bash\n# A: one vLLM process managing DP internally\nvllm serve <model> --data-parallel-size 4\n\n# B: four separate servers behind NGINX/Envoy/Kubernetes Service\nCUDA_VISIBLE_DEVICES=0 vllm serve <model> --port 8001 &\nCUDA_VISIBLE_DEVICES=1 vllm serve <model> --port 8002 &\n```\n\n### Combining with TP\n\n8 GPUs and a model needing 2 GPUs → 4 replicas × TP=2.\n\n### Why replicas beat oversized TP for throughput\n\n| Layout (8 GPUs) | Latency | Total throughput |\n|---|---|---|\n| 1 replica × TP=8 | Lowest | Lower (communication heavy) |\n| 4 replicas × TP=2 | Low | Higher |\n\n### Bonus: resilience\n\nIf one replica fails, the others keep serving. Always run at least N+1."}, {"id": 59, "title": "Expert parallelism (EP) for MoE models", "tldr": "EP places different experts on different GPUs and routes each token to wherever its expert lives. It is the key technique for serving very large MoE models across many GPUs efficiently.", "real": "DeepSeek published details of its production inference system in early 2025. It uses large-scale expert parallelism spanning many nodes, along with prefill/decode disaggregation, and DeepSeek open-sourced DeepEP, its communication library for routing tokens between experts.", "body": "### How it works\n\n```\nGPU 0: experts  0–31\nGPU 1: experts 32–63\nGPU 2: experts 64–95\nGPU 3: experts 96–127\nToken → router picks experts 5 and 70 → sent to GPU 0 and GPU 2 (all-to-all)\n```\n\n### vLLM flags\n\n```bash\nvllm serve <moe-model> --tensor-parallel-size 1 --data-parallel-size 8 --enable-expert-parallel\n```\n\nAttention runs data-parallel across GPUs while experts are spread with EP (the exact combinations depend on your vLLM version).\n\n### Benefits\n\n- Each GPU stores only some experts, so huge models fit\n- With large batches, every expert gets enough tokens to stay efficient\n\n### Challenges\n\n- **All-to-all communication** each MoE layer: needs fast interconnect\n- **Load imbalance:** popular experts overload their GPU; systems replicate hot experts\n- Complex tuning; mostly worth it at large scale"}, {"id": 60, "title": "Choosing a parallelism strategy", "tldr": "If the model fits on one GPU, use one GPU per replica and add replicas. If not, use the smallest TP inside one server that fits. Across servers, add PP. For big MoE models, add EP.", "real": "vLLM’s documentation gives this same rule: tensor parallelism within a node and pipeline parallelism across nodes. Production teams pick the smallest TP that fits and then scale out with replicas.", "body": "### Decision flow\n\n```\nDoes the model + healthy KV fit on 1 GPU?\n├─ Yes → TP=1. Need more traffic? Add replicas (DP).\n└─ No\n   Does it fit in 1 server (2/4/8 GPUs)?\n   ├─ Yes → TP = smallest power of 2 that fits. Add replicas.\n   └─ No  → TP inside node + PP across nodes.\n            MoE? → consider DP attention + EP experts.\n```\n\n### Worked example\n\nYou have 8× L40S (48 GB) and a 70B FP8 model (70 GB).\n\n- TP=2 → 96 GB per replica, \\~20 GB KV after overhead\n- 4 replicas × TP=2 = 8 GPUs, about 4× the throughput of one replica\n\nAlternative: 70B INT4 at TP=1 → 8 replicas, more throughput, slightly lower quality. Measure both.\n\n### Checklist\n\n- [ ] Smallest TP that fits with KV headroom\n- [ ] TP only over NVLink if TP > 2\n- [ ] Replicas ≥ N+1 for resilience\n- [ ] Benchmark both quality and throughput per layout"}, {"id": 61, "title": "The inference engine landscape", "tldr": "vLLM and SGLang lead open-source multi-user GPU serving, TensorRT-LLM gets maximum NVIDIA performance with more setup, and llama.cpp/Ollama rule local and offload use. Choose by workload, not by hype.", "real": "vLLM began at UC Berkeley’s Sky Computing Lab and joined the PyTorch Foundation in 2025. Major clouds offer vLLM-based serving containers (for example AWS’s LMI and Deep Learning Containers and Google Vertex AI Model Garden), and SGLang came out of the LMSYS team behind Chatbot Arena.", "body": "### Comparison\n\n| Engine | Strength | Weak spot | Best for |\n|---|---|---|---|\n| **vLLM** | Broad model + hardware support, OpenAI API, big community | Many knobs | Default production choice |\n| **SGLang** | Very fast, RadixAttention prefix cache, strong structured output, big MoE | Smaller ecosystem | High-performance serving, agents |\n| **TensorRT-LLM** | Peak NVIDIA performance, FP8/FP4 | Engine builds, NVIDIA only | Large NVIDIA fleets |\n| **llama.cpp** | CPU+GPU hybrid, GGUF, Mac, tiny footprint | Lower multi-user throughput | Local, edge, offload |\n| **Ollama / LM Studio** | One-command UX | Not built for high concurrency | Desktop, demos |\n| **HF TGI** | Hugging Face integration | Check current maintenance status | Existing HF stacks |\n\n### How to choose\n\n```\nMany users on GPUs?           → vLLM (or SGLang)\nMax perf on big NVIDIA fleet? → TensorRT-LLM (often via Triton or Dynamo)\nLaptop / Mac / offload?       → llama.cpp or Ollama\n```\n\n### Good news\n\nvLLM, SGLang, Ollama and llama.cpp all expose OpenAI-compatible APIs, so you can switch engines without changing client code."}, {"id": 62, "title": "PagedAttention", "tldr": "PagedAttention stores the KV cache in small fixed-size blocks, like operating-system memory pages, allocated on demand and tracked by a block table. Waste drops to a few percent, concurrency rises 2–4×, and blocks can be shared between requests.", "real": "PagedAttention is the core idea of the vLLM paper by Woosuk Kwon and colleagues at UC Berkeley (SOSP 2023). The paper reported 2–4× higher throughput than the state-of-the-art systems of the time at the same latency.", "body": "### The OS analogy\n\n| Operating system | PagedAttention |\n|---|---|\n| Process | Request |\n| Virtual pages | Logical KV blocks |\n| Physical frames | GPU KV blocks |\n| Page table | Block table |\n\n### How allocation works\n\n```\nBlock size = 16 tokens\nRequest A (40 tokens) → blocks [7] [2] [11]  (last one partly filled)\nRequest B (20 tokens) → blocks [4] [9]\nFree pool             → [0] [1] [3] [5] [6] [8] [10] ...\n```\n\nOnly the last block of each request can be partly empty, so waste stays under one block per request.\n\n### Sharing\n\nTwo requests with the same system prompt can point to the **same physical blocks** for that prefix. If one needs to change a shared block, it gets its own copy (copy-on-write). This powers prefix caching (ch. 64) and parallel sampling (n > 1).\n\n### Why you care\n\nSame GPU, same model, but many more simultaneous users. This is a large part of why vLLM became the default engine."}, {"id": 63, "title": "Continuous batching and chunked prefill", "tldr": "Instead of waiting for a whole batch to finish, the engine lets requests join and leave at every decode step. GPUs stay busy, short requests are not blocked by long ones, and throughput multiplies. Chunked prefill keeps huge prompts from freezing everyone else.", "real": "Iteration-level scheduling was introduced by the Orca paper (OSDI 2022, Seoul National University and FriendliAI). Anyscale’s 2023 benchmarks reported up to about 23× higher throughput from continuous batching compared with naive static batching.", "body": "### Static batching (old)\n\n```\nBatch: [A────────] [B──] [C────]\nGPU waits until A (longest) finishes before new requests start.\nB and C slots sit idle after finishing.\n```\n\n### Continuous batching (now)\n\n```\nStep 1: A B C\nStep 5: A C D      (B finished, D joined)\nStep 9: A D E F    (C finished, E and F joined)\n```\n\n### Chunked prefill\n\nA 30,000-token prompt would take one long prefill step, stalling everyone’s decode. Chunked prefill splits it into pieces (e.g. 2,048 tokens) mixed with decode steps.\n\n| Setting | Effect |\n|---|---|\n| Larger `--max-num-batched-tokens` | Faster prefill and TTFT, more decode jitter |\n| Smaller | Smoother streaming for others, slower long prompts |\n\n### In vLLM\n\nContinuous batching is always on. Chunked prefill is enabled by default in recent versions. You tune with `--max-num-seqs` and `--max-num-batched-tokens`."}, {"id": 64, "title": "Prefix caching", "tldr": "When requests share a beginning (system prompt, few-shot examples, a RAG document, chat history), the engine reuses the stored KV blocks instead of recomputing them. TTFT and cost drop sharply. Put static content first in your prompts.", "real": "Anthropic launched prompt caching in 2024, advertising up to 90% lower cost and up to 85% lower latency on long cached prompts. OpenAI added automatic caching with a 50% discount on cached input tokens, and SGLang built its RadixAttention design around the same idea.", "body": "### How it works in vLLM\n\n1. Each full KV block is hashed based on its tokens and all preceding tokens.\n2. A new request’s prefix blocks are looked up by hash.\n3. Hits are reused; only the new suffix is prefilled.\n4. Unused cached blocks are evicted (LRU) when memory is needed.\n\n### Where it shines\n\n| Use case | Shared prefix |\n|---|---|\n| Chatbots | System prompt + earlier turns |\n| RAG | Same document asked many questions |\n| Agents | Long tool definitions + scratchpad |\n| Few-shot classification | Same examples every time |\n| Code assistants | Same files in context |\n\n### Prompt design rule\n\n```\n✅ [static system prompt][static tools][static docs][dynamic user question]\n❌ [timestamp: 10:42:07][system prompt]...   ← breaks the cache every time\n```\n\n### Enable and check\n\n```bash\nvllm serve <model> --enable-prefix-caching   # default-on in recent versions\n```\n\nWatch the prefix cache hit-rate metric in `/metrics`."}, {"id": 65, "title": "Speculative decoding", "tldr": "A cheap draft proposes several next tokens; the big model verifies them in one pass. Accepted tokens arrive several at a time, cutting latency 1.5–3× at low batch sizes with identical output quality.", "real": "Google researchers introduced speculative decoding in 2022 and later wrote that it is used in products including AI Overviews in Google Search. DeepSeek-V3 trained multi-token prediction heads that can serve as built-in drafts.", "body": "### How it works\n\n```\nDraft proposes:  \"The capital of France is Paris .\"\nTarget checks all 6 tokens in ONE forward pass\nAccepts first 5, corrects the 6th\n→ 6 tokens for the cost of ~1 big step + cheap draft\n```\n\nThe verification is exact, so output quality matches the big model.\n\n### Draft options\n\n| Method | Draft source | Notes |\n|---|---|---|\n| Draft model | Small model of the same family | Needs a matching tokenizer |\n| N-gram / prompt lookup | Copies text already in the prompt | Free, great for editing and RAG |\n| EAGLE / Medusa | Small trained heads on the target model | High acceptance |\n| MTP | Model’s own multi-token heads | Built in (e.g. DeepSeek) |\n\n### vLLM example\n\n```bash\nvllm serve <model> --speculative-config \\\n  '{\"method\": \"ngram\", \"num_speculative_tokens\": 5, \"prompt_lookup_max\": 4}'\n```\n\n### When it helps and when it does not\n\n- ✅ Low to medium load, latency-sensitive chat, code editing\n- ❌ Very high batch (GPU already compute-bound; drafts waste compute)"}, {"id": 66, "title": "Installing vLLM", "tldr": "You need Linux, a supported GPU, a recent Python and a recent NVIDIA driver. Install with pip or uv in a fresh virtual environment, verify with `nvidia-smi`, and log in to Hugging Face for gated models.", "real": "vLLM publishes official wheels and the `vllm/vllm-openai` Docker image, and it supports NVIDIA CUDA, AMD ROCm, Google TPU, Intel and CPU backends. That broad hardware support is one reason it became the common choice across clouds.", "body": "### Requirements\n\n| Item | Requirement |\n|---|---|\n| OS | Linux (use WSL2 on Windows) |\n| GPU | NVIDIA compute capability 7.0+ (V100 and newer); other backends separately |\n| Driver | Recent NVIDIA driver matching the CUDA build |\n| Python | A recent Python 3 (check the docs for supported versions) |\n\n### Install\n\n```bash\n# pip\npython -m venv vllm-env && source vllm-env/bin/activate\npip install vllm\n\n# or uv (faster)\nuv venv && source .venv/bin/activate\nuv pip install vllm --torch-backend=auto\n```\n\n### Verify\n\n```bash\nnvidia-smi\npython -c \"import vllm, torch; print(vllm.__version__, torch.cuda.is_available())\"\n```\n\n### Gated models\n\n```bash\nhuggingface-cli login        # or: export HF_TOKEN=hf_xxx\n```\n\nAccept the license on the model’s Hugging Face page first.\n\n### Common install issues\n\n- CUDA mismatch: use the official wheel or Docker image instead of mixing torch versions\n- No GPU visible in Docker: install the NVIDIA Container Toolkit and use `--gpus all`"}, {"id": 67, "title": "First run: offline batch inference", "tldr": "The `LLM` class in Python runs prompts without a server. vLLM batches everything automatically for maximum throughput, which suits dataset generation, classification and evaluation jobs.", "real": "Synthetic-data and evaluation pipelines use exactly this mode. Hugging Face’s distilabel offers a vLLM backend, and lm-evaluation-harness can run models through vLLM to evaluate thousands of prompts quickly.", "body": "### Minimal example\n\n```python\nfrom vllm import LLM, SamplingParams\n\nllm = LLM(model=\"Qwen/Qwen2.5-7B-Instruct\", max_model_len=8192)\nparams = SamplingParams(temperature=0.7, top_p=0.9, max_tokens=256)\n\nconversation = [{\"role\": \"user\", \"content\": \"Explain KV cache in 3 lines.\"}]\nout = llm.chat(conversation, params)\nprint(out[0].outputs[0].text)\n```\n\n### Batch of prompts\n\n```python\nprompts = [f\"Classify sentiment: {t}\" for t in texts]          # 10,000 texts\nouts = llm.generate(prompts, SamplingParams(temperature=0, max_tokens=5))\nlabels = [o.outputs[0].text.strip() for o in outs]\n```\n\nvLLM schedules all 10,000 with continuous batching, which is usually far faster than looping one at a time.\n\n### Useful SamplingParams\n\n| Param | Meaning |\n|---|---|\n| `temperature` | Randomness (0 = greedy) |\n| `top_p` | Nucleus sampling |\n| `max_tokens` | Output cap |\n| `stop` | Stop strings |\n| `n` | Multiple samples per prompt |\n| `seed` | Reproducibility |"}, {"id": 68, "title": "The OpenAI-compatible server", "tldr": "`vllm serve <model>` starts an OpenAI-compatible HTTP server. Any OpenAI SDK or tool works by changing `base_url`. Use `--api-key`, `--served-model-name` and streaming.", "real": "The OpenAI API shape became the industry’s de facto standard. vLLM, SGLang, Ollama, the llama.cpp server and hosted providers such as Together, Fireworks and Groq all accept it, so most applications switch providers by changing one URL.", "body": "### Start\n\n```bash\nvllm serve Qwen/Qwen2.5-7B-Instruct \\\n  --host 0.0.0.0 --port 8000 \\\n  --served-model-name qwen7b \\\n  --api-key my-secret-key\n```\n\n### curl\n\n```bash\ncurl http://localhost:8000/v1/chat/completions \\\n  -H \"Authorization: Bearer my-secret-key\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"model\":\"qwen7b\",\"messages\":[{\"role\":\"user\",\"content\":\"Hello!\"}],\"max_tokens\":100}'\n```\n\n### Python (streaming)\n\n```python\nfrom openai import OpenAI\nclient = OpenAI(base_url=\"http://localhost:8000/v1\", api_key=\"my-secret-key\")\nstream = client.chat.completions.create(\n    model=\"qwen7b\",\n    messages=[{\"role\": \"user\", \"content\": \"Write a haiku about GPUs\"}],\n    stream=True)\nfor chunk in stream:\n    print(chunk.choices[0].delta.content or \"\", end=\"\")\n```\n\n### Endpoints\n\n| Endpoint | Purpose |\n|---|---|\n| `/v1/chat/completions` | Chat (applies the chat template) |\n| `/v1/completions` | Raw text completion |\n| `/v1/embeddings` | Embedding models |\n| `/v1/models` | List served models |\n| `/health` | Liveness and readiness |\n| `/metrics` | Prometheus metrics |"}, {"id": 69, "title": "The vLLM flags you must know", "tldr": "The flags that matter most are `--gpu-memory-utilization`, `--max-model-len`, `--max-num-seqs`, `--max-num-batched-tokens`, `--tensor-parallel-size`, `--kv-cache-dtype` and `--quantization`. They decide what fits, how many users you serve, and latency.", "real": "vLLM’s “Optimization and Tuning” documentation focuses on these same knobs. Most production incidents with vLLM, such as OOMs, long queues and slow TTFT, trace back to one of them being left at a default that did not suit the workload.", "body": "### Core flags\n\n| Flag | Controls | Typical |\n|---|---|---|\n| `--gpu-memory-utilization` | Fraction of VRAM vLLM may use | 0.85–0.95 (default 0.9) |\n| `--max-model-len` | Max tokens per request (prompt + output) | 4096–32768 |\n| `--max-num-seqs` | Max sequences in a batch | 16–256 |\n| `--max-num-batched-tokens` | Tokens per step / prefill chunk | 2048–16384 |\n| `--tensor-parallel-size` | GPUs per replica | 1, 2, 4, 8 |\n| `--pipeline-parallel-size` | Pipeline stages | 1+ |\n| `--data-parallel-size` | Internal replicas | 1+ |\n| `--quantization` | Force a scheme | usually auto |\n| `--kv-cache-dtype` | KV precision | `auto` / `fp8` |\n| `--dtype` | Compute dtype | `auto` |\n\n### Operational flags\n\n| Flag | Purpose |\n|---|---|\n| `--served-model-name` | Client-facing name |\n| `--api-key` | Simple auth |\n| `--enable-prefix-caching` | Reuse prefixes |\n| `--enforce-eager` | No CUDA graphs (saves VRAM) |\n| `--cpu-offload-gb` | Weights in RAM |\n| `--trust-remote-code` | Custom model code (trusted repos only) |\n| `--download-dir` | Model cache location |\n| `--generation-config` | Use the model’s default sampling settings |\n\n### Always check\n\n```bash\nvllm serve --help\n```\n\nFlags change between releases; the help output for your installed version is the authority."}, {"id": 70, "title": "Serving quantized models in vLLM", "tldr": "Pre-quantized checkpoints (AWQ, GPTQ, FP8, W8A8) are detected automatically from their config. FP8 can be applied at load time with `--quantization fp8`. Add `--kv-cache-dtype fp8` on top, and read the startup log for KV capacity.", "real": "Model makers increasingly publish their own quantized versions next to the BF16 release (Qwen’s AWQ and GPTQ repos, Meta’s FP8 405B, DeepSeek’s native FP8 weights). Teams can serve them with vLLM with no conversion step at all.", "body": "### Commands\n\n```bash\n# AWQ / GPTQ — auto-detected\nvllm serve Qwen/Qwen2.5-32B-Instruct-AWQ --max-model-len 16384\nvllm serve Qwen/Qwen2.5-14B-Instruct-GPTQ-Int4\n\n# FP8 on the fly (Ada / Hopper / Blackwell)\nvllm serve meta-llama/Llama-3.1-8B-Instruct --quantization fp8\n\n# bitsandbytes 4-bit at load (convenient, slower)\nvllm serve meta-llama/Llama-3.1-8B-Instruct --quantization bitsandbytes\n\n# GGUF (experimental support; llama.cpp is usually better for GGUF)\nvllm serve ./model-Q4_K_M.gguf --tokenizer <original-hf-repo>\n\n# Add FP8 KV cache to any of them\n... --kv-cache-dtype fp8\n```\n\n### Read the startup log\n\nLook for:\n\n- Model weights memory (GiB)\n- Available KV cache memory\n- GPU KV cache size (tokens)\n- Maximum concurrency at your `--max-model-len`\n\n### Sanity test after loading\n\n1. Send 5 known prompts and compare with the BF16 answers\n2. Test a JSON-format prompt\n3. Run a short `vllm bench serve` (ch. 84)"}, {"id": 71, "title": "Multi-GPU and multi-node vLLM", "tldr": "Use `--tensor-parallel-size` inside a node, `--data-parallel-size` for internal replicas, and `--pipeline-parallel-size` across nodes with a Ray cluster. Pin GPUs with `CUDA_VISIBLE_DEVICES` and check topology first.", "real": "For the Llama 3.1 405B launch, vLLM published guidance for running the BF16 model across two 8× H100 nodes with tensor parallelism inside each node and pipeline parallelism between them. The FP8 version fit on a single node.", "body": "### Single node\n\n```bash\n# 4 GPUs, one replica\nvllm serve meta-llama/Llama-3.3-70B-Instruct --tensor-parallel-size 4\n\n# 8 GPUs: 4 replicas × TP=2\nvllm serve <model> --tensor-parallel-size 2 --data-parallel-size 4\n\n# choose specific GPUs\nCUDA_VISIBLE_DEVICES=2,3 vllm serve <model> --tensor-parallel-size 2\n```\n\n### Multi-node with Ray\n\n```bash\n# head node\nray start --head --port=6379\n# each worker node\nray start --address=<head-ip>:6379\n# then on the head node\nvllm serve <huge-model> --tensor-parallel-size 8 --pipeline-parallel-size 2\n```\n\n### Checklist\n\n- [ ] Same vLLM, CUDA and driver versions on all nodes\n- [ ] Model files at the same path on every node (shared storage or pre-copied)\n- [ ] Fast network (InfiniBand/RoCE) for PP traffic\n- [ ] `NCCL_DEBUG=INFO` while debugging communication\n\n### Check topology\n\n```bash\nnvidia-smi topo -m\n```\n\nGroup TP ranks on GPUs connected by NVLink."}, {"id": 72, "title": "Docker deployment", "tldr": "Run the official `vllm/vllm-openai` image with `--gpus all`, `--ipc=host`, a mounted model cache and a pinned version tag. This is the standard, reproducible way to deploy vLLM.", "real": "The official vllm/vllm-openai image on Docker Hub is the base most teams start from. Managed platforms such as Kubernetes clusters, SageMaker-style endpoints and GPU clouds generally run vLLM in exactly this containerized form.", "body": "### Run\n\n```bash\ndocker run --gpus all --ipc=host -p 8000:8000 \\\n  -v ~/.cache/huggingface:/root/.cache/huggingface \\\n  -e HF_TOKEN=$HF_TOKEN \\\n  vllm/vllm-openai:<pinned-version> \\\n  --model Qwen/Qwen2.5-7B-Instruct --max-model-len 8192\n```\n\n### Why each flag\n\n| Flag | Reason |\n|---|---|\n| `--gpus all` | Expose GPUs (needs NVIDIA Container Toolkit) |\n| `--ipc=host` | Shared memory for multi-GPU communication |\n| `-v …/huggingface` | Keep downloaded weights across restarts |\n| `-e HF_TOKEN` | Gated model access |\n| `:<pinned-version>` | Reproducible deploys, safe rollbacks |\n\n### docker-compose\n\n```yaml\nservices:\n  vllm:\n    image: vllm/vllm-openai:<pinned-version>\n    command: [\"--model\", \"Qwen/Qwen2.5-7B-Instruct\", \"--max-model-len\", \"8192\"]\n    ports: [\"8000:8000\"]\n    ipc: host\n    volumes: [\"~/.cache/huggingface:/root/.cache/huggingface\"]\n    deploy:\n      resources:\n        reservations:\n          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]\n```"}, {"id": 73, "title": "Multi-LoRA: many fine-tunes on one base model", "tldr": "Load one base model and many small LoRA adapters. Clients choose an adapter by model name, so one GPU serves many tasks or customers without a full copy of the model for each.", "real": "The Punica and S-LoRA research projects (2023) showed one GPU serving hundreds to thousands of LoRA adapters. Predibase’s open-source LoRAX server was built on the same idea, and SaaS companies use the pattern for per-customer fine-tunes.", "body": "### Command\n\n```bash\nvllm serve meta-llama/Llama-3.1-8B-Instruct \\\n  --enable-lora \\\n  --lora-modules sql=/models/sql-lora support=/models/support-lora \\\n  --max-loras 4 --max-lora-rank 64\n```\n\n### Client side\n\n```python\nclient.chat.completions.create(model=\"sql\", messages=[...])      # SQL adapter\nclient.chat.completions.create(model=\"support\", messages=[...])  # support adapter\n```\n\n### Why it is efficient\n\n| | Separate full models | Multi-LoRA |\n|---|---|---|\n| 10 fine-tunes of an 8B model | 10 × 16 GB = 160 GB | 16 GB + 10 × \\~50 MB |\n| GPUs needed | Several | One |\n\n### Key settings\n\n| Flag | Meaning |\n|---|---|\n| `--max-loras` | Adapters active in one batch |\n| `--max-lora-rank` | Highest rank allowed |\n| `--max-cpu-loras` | Adapters cached in CPU memory |\n\nAdapters can also be loaded at runtime through vLLM’s dynamic LoRA endpoints, if enabled in your version."}, {"id": 74, "title": "Structured output and tool calling", "tldr": "vLLM can force output to match a JSON schema, regex or grammar using constrained decoding, and it parses tool calls into OpenAI-format `tool_calls` when started with a tool-call parser.", "real": "OpenAI launched Structured Outputs in August 2024 to guarantee schema-valid JSON. Open-source engines achieve the same with grammar backends such as XGrammar, Outlines and llguidance, which vLLM integrates.", "body": "### JSON schema output\n\n```python\nresp = client.chat.completions.create(\n    model=\"qwen7b\",\n    messages=[{\"role\": \"user\", \"content\": \"Extract name and age: Ravi is 31\"}],\n    response_format={\"type\": \"json_schema\", \"json_schema\": {\n        \"name\": \"person\",\n        \"schema\": {\"type\": \"object\",\n                   \"properties\": {\"name\": {\"type\": \"string\"},\n                                  \"age\": {\"type\": \"integer\"}},\n                   \"required\": [\"name\", \"age\"]}}})\n```\n\n### How constrained decoding works\n\nAt each step, tokens that would break the grammar are masked out (probability set to zero). The model can only produce valid output.\n\n### Tool calling\n\n```bash\nvllm serve Qwen/Qwen2.5-7B-Instruct \\\n  --enable-auto-tool-choice --tool-call-parser hermes\n```\n\n| Model family | Parser (examples) |\n|---|---|\n| Qwen 2.5 / 3 | `hermes` |\n| Llama 3.x | `llama3_json` |\n| Mistral | `mistral` |\n\nCheck the vLLM docs for the parser that matches your model’s chat template.\n\n### Tip\n\nSchemas guarantee format, not correctness. Still validate values in your application."}, {"id": 75, "title": "Troubleshooting common vLLM problems", "tldr": "Most issues are memory (OOM at startup or under load), configuration (wrong chat template, context too long) or environment (NCCL, drivers). Match the symptom to its cause and fix it methodically.", "real": "A typical first production incident runs like this. The service works in testing, then a customer pastes a 50-page document and requests start queuing or erroring. The fix is almost always a context cap, FP8 KV, or another replica, and that pattern repeats across many teams’ postmortems.", "body": "### Symptom table\n\n| Symptom | Likely cause | Fix |\n|---|---|---|\n| CUDA OOM at startup | Weights + KV don’t fit | Lower `--max-model-len`, quantize, more TP |\n| “max seq len larger than KV cache can hold” | Context cap too big for free memory | Smaller `--max-model-len` or FP8 KV |\n| OOM under load | Large prefill bursts | Lower `--max-num-batched-tokens` / `--max-num-seqs` |\n| Slow first request | Warm-up, CUDA graph capture, compile | Send warm-up requests before routing traffic |\n| Garbage or repeating output | Wrong template, bad quant, `/v1/completions` misuse | Use chat endpoint; try another quant |\n| Many requests “waiting” | KV cache full | Add replicas, shorter contexts, FP8 KV |\n| Multi-GPU hang | NCCL / shared memory | `--ipc=host`, `NCCL_DEBUG=INFO`, matching drivers |\n| Model not supported | New architecture | Upgrade vLLM; `--trust-remote-code` for trusted repos |\n| Low GPU utilization | CPU bottleneck or tiny batches | More concurrency, faster CPU, newer vLLM |\n\n### Debug routine\n\n1. Read the full startup log (memory lines, warnings).\n2. `nvidia-smi` for other processes using VRAM.\n3. Reproduce with one request, then with load.\n4. Check `/metrics`: running, waiting, KV usage.\n5. Change **one** flag at a time."}, {"id": 76, "title": "How one GPU serves many users at once", "tldr": "Each decode step reads the weights once and produces the next token for every active request. Per-user speed falls slightly as the batch grows, while total throughput rises a lot. This is the core economics of LLM serving.", "real": "This is why hosted providers charge per token rather than per hour: batching lets one GPU’s cost be shared across many users at once. Self-hosted services that run mostly idle (batch size around 1) usually cost far more per token than API providers.", "body": "### The illustrative curve (8B on one modern GPU)\n\n| Concurrent users | Per-user speed | Total tokens/s |\n|---|---|---|\n| 1 | \\~100 tok/s | \\~100 |\n| 8 | \\~85 tok/s | \\~680 |\n| 32 | \\~60 tok/s | \\~1,900 |\n| 128 | \\~30 tok/s | \\~3,800 |\n\nThe shape is typical; measure your own numbers in ch. 84.\n\n### Why per-user speed drops\n\n- More KV cache to read per step (each user’s history)\n- Eventually the GPU becomes compute-bound\n- Prefills of newly arriving requests interleave with decodes\n\n### The operating point\n\nPick the highest concurrency where per-user speed still meets your target (for example ≥ 20 tok/s and TTFT p95 < 1.5 s). That maximizes users per GPU without hurting experience.\n\n### Mental model\n\nA bus versus a taxi: one taxi trip per person (batch 1) is fast but expensive; a bus (large batch) is slightly slower per person but far cheaper."}, {"id": 77, "title": "The life of a request", "tldr": "A request is authenticated at the gateway, routed to a replica, tokenized, queued, given KV blocks, prefilled, decoded in a shared batch, streamed back, and its KV blocks are freed. Each stage has its own latency and failure modes.", "real": "OpenAI-style streaming uses Server-Sent Events: chunks arrive as lines beginning with `data:` and the stream ends with `data: [DONE]`. vLLM reproduces this format exactly, which is why existing chat UIs work against it unchanged.", "body": "### The path\n\n```\nClient ─HTTPS─► Gateway (auth, rate limit) ─► Load balancer ─► vLLM replica\n  1. Tokenize prompt (CPU)\n  2. Enter scheduler queue (\"waiting\")\n  3. Allocate KV blocks (reuse prefix cache hits)\n  4. Prefill (possibly chunked) ─► first token  ⇒ TTFT\n  5. Decode loop in shared batch                  ⇒ TPOT\n  6. Detokenize + stream via SSE\n  7. Finish (stop token / max_tokens) ─► free KV blocks\n```\n\n### Where time goes\n\n| Stage | Typical | Grows with |\n|---|---|---|\n| Network + gateway | 5–50 ms | Distance, auth checks |\n| Queue wait | 0 to seconds | Load, KV pressure |\n| Prefill | 20 ms – several s | Prompt length, model size |\n| Decode | 10–60 ms per token | Model size, batch |\n\n### Preemption\n\nIf KV memory runs out mid-generation, vLLM may preempt a request (free its blocks and recompute later). Frequent preemption warnings in the logs mean you are oversubscribed.\n\n### Cancellation\n\nWhen the client disconnects, the server aborts the request and frees its blocks. Make sure your gateway propagates disconnects."}, {"id": 78, "title": "Load balancing across replicas", "tldr": "Round-robin is simple but uneven. Least-outstanding-requests is a better default. KV- or prefix-cache-aware routing sends follow-up turns to the replica that already holds that conversation, giving big TTFT savings.", "real": "The llm-d project, launched in 2025 by Red Hat with Google Cloud, IBM Research, NVIDIA, CoreWeave and others, adds KV-cache-aware routing to Kubernetes through the Gateway API Inference Extension. Google’s GKE Inference Gateway offers similar model-aware load balancing.", "body": "### Strategies\n\n| Strategy | How | Good for |\n|---|---|---|\n| Round-robin | Rotate | Uniform short requests |\n| Least outstanding | Fewest in-flight requests | General default |\n| Least KV usage | Lowest cache pressure | Mixed lengths |\n| Session affinity | Same user → same replica | Simple chat caching |\n| Prefix-aware | Hash prefix → replica with cached blocks | Chat, agents, RAG |\n\n### Why naive balancing hurts LLMs\n\nRequests vary hugely: one is 50 tokens, another 30,000. Two “equal” replicas can be very differently loaded.\n\n### Tools\n\n- NGINX / Envoy / HAProxy (basic)\n- Kubernetes Service + ingress\n- vLLM production-stack router\n- llm-d, NVIDIA Dynamo, SGLang router (cache-aware)\n\n### Health checks\n\nRoute only to replicas whose `/health` returns OK **and** that have finished warm-up. Remove replicas from rotation before restarting them (graceful drain)."}, {"id": 79, "title": "Queues, rate limits and fairness", "tldr": "Without limits, one heavy user can starve everyone. Enforce per-user requests-per-minute and tokens-per-minute, cap prompt and output length, return HTTP 429 when overloaded, and separate interactive traffic from batch traffic.", "real": "OpenAI and Anthropic publish tiered rate limits in requests and tokens per minute and return HTTP 429 when they are exceeded. Internal LLM platforms copy this model so one team’s batch job cannot take down everyone else’s chat.", "body": "### Limits to set\n\n| Limit | Example |\n|---|---|\n| Requests per minute (RPM) | 60 per user |\n| Tokens per minute (TPM) | 100K per team |\n| Max prompt tokens | 16K (32K premium tier) |\n| Max output tokens | 2,048 |\n| Concurrent requests | 5 per user |\n\n### Overload behavior\n\n- Return **429 Too Many Requests** with `Retry-After`\n- Clients retry with exponential backoff and jitter\n- Shed lowest-priority traffic first\n\n### Fairness patterns\n\n| Pattern | How |\n|---|---|\n| Separate pools | Interactive replicas vs batch replicas |\n| Priority scheduling | vLLM supports a priority scheduling policy |\n| Weighted fair queuing | Per-tenant queues at the gateway |\n| Off-peak batch | Run large jobs at night |\n\n### Where to enforce\n\nAt the **gateway**, before requests reach GPUs. vLLM’s `--api-key` is a single shared key, not a multi-tenant system."}, {"id": 80, "title": "Streaming and perceived speed", "tldr": "Always stream. People read at roughly 5–10 tokens per second, so about 20–30 tokens per second per user already feels fast. Spend extra GPU capacity on more users, not on speed nobody can read.", "real": "ChatGPT popularized word-by-word streaming, and it is now expected in every chat product. Typical adult reading speed of about 200–300 words per minute (roughly 4–7 tokens per second) is why providers aim for steady streaming rather than maximum single-user speed.", "body": "### Perceived latency\n\n| Experience | Without streaming | With streaming |\n|---|---|---|\n| 500-token answer at 25 tok/s | Wait 20 s, then text | First words in \\~0.5 s |\n\n### Targets for chat\n\n| Metric | Feels good |\n|---|---|\n| TTFT p95 | < 1–2 s |\n| Per-user speed | ≥ 20 tok/s |\n| Stream smoothness | No long pauses (watch inter-token latency p99) |\n\n### Streaming checklist\n\n- [ ] `stream=true` from client to server\n- [ ] Gateway and proxies don’t buffer (disable response buffering in NGINX)\n- [ ] Timeouts long enough for long generations\n- [ ] UI renders tokens incrementally\n- [ ] Client handles disconnects and cancels server-side\n\n### Batch jobs are different\n\nFor offline work nobody watches, ignore TTFT and maximize total throughput (large batches, no streaming)."}, {"id": 81, "title": "The metrics that matter", "tldr": "Track TTFT, TPOT/ITL, end-to-end latency, output tokens per second, requests per second, KV cache usage, and above all goodput, meaning requests that meet your latency target. Use p50, p95 and p99, never averages alone.", "real": "The industry benchmark MLPerf Inference sets explicit latency limits for its LLM tests. Its Llama 2 70B server scenario, for example, requires TTFT and TPOT to stay under set limits, so a system cannot win on raw throughput alone, which is goodput thinking in practice.", "body": "### Definitions\n\n| Metric | Meaning | Chat target |\n|---|---|---|\n| TTFT | Time to first token | p95 < 1–2 s |\n| TPOT / ITL | Time per output token | < 50 ms (≥ 20 tok/s) |\n| E2E latency | Full request time | Depends on length |\n| Output tok/s | Generated tokens per second (all users) | Maximize |\n| Requests/s | Completed requests per second | Maximize under SLO |\n| Goodput | Requests/s meeting the SLO | **Main capacity number** |\n| KV usage % | Cache fullness | Alert near 90–100% with a growing queue |\n| Queue length | Waiting requests | Should be \\~0 most of the time |\n\n### Why percentiles\n\nAn average of 0.8 s TTFT can hide 5% of users waiting 6 s. Those users file the complaints.\n\n### Where to get them\n\n- vLLM `/metrics` (Prometheus)\n- Benchmark tool output (ch. 84)\n- Gateway logs (end-to-end, including network)"}, {"id": 82, "title": "Back-of-envelope speed math", "tldr": "Decode speed ≈ bandwidth ÷ bytes read per step. Prefill FLOPs ≈ 2 × parameters × prompt tokens. These two formulas predict most performance before you buy hardware.", "real": "Kipply’s widely cited 2022 blog post “Transformer Inference Arithmetic” laid out these estimates. Engineers at AI labs and startups still use this kind of arithmetic to sanity-check benchmarks and hardware plans.", "body": "### Decode (memory-bound)\n\n```\ntok/s per user ≈ (bandwidth × efficiency) ÷ (weight bytes + KV bytes read per step)\n```\n\nExample: 70B INT4 (40 GB) on H100 (3.35 TB/s × 0.7) ≈ 2,345 ÷ 40 ≈ **\\~58 tok/s**.\n\n### Prefill (compute-bound)\n\n```\nFLOPs ≈ 2 × params × prompt_tokens\nTTFT  ≈ FLOPs ÷ (GPU FLOPS × efficiency) + queue wait\n```\n\nExample: 8B model, 2,000-token prompt → 2 × 8e9 × 2,000 = 32 TFLOP. At \\~150 effective TFLOPS → **\\~0.2 s**.\n\n### Batch ceiling\n\nThroughput grows with batch until either:\n\n1. The KV cache is full (memory limit), or\n2. The GPU becomes compute-bound (FLOPs limit)\n\n### Use the math to catch problems\n\nIf measured speed is far below the estimate (for example 30% of theoretical), suspect CPU bottlenecks, missing fast kernels, PCIe-bound tensor parallelism, or a misconfiguration."}, {"id": 83, "title": "How many users can one setup serve?", "tldr": "Use Little’s Law for concurrency (arrival rate × duration), KV capacity for the per-replica limit, a benchmark for the latency limit, then replicas = peak ÷ per-replica capacity + headroom + N+1.", "real": "Little’s Law (L = λW) comes from queueing theory and has been used for decades to size call centers, web servers and checkout lanes. LLM capacity planning applies the same rule, with “agents” replaced by KV-cache slots.", "body": "### Step 1: concurrency from traffic\n\n```\nConcurrent requests = Arrival rate (req/s) × Average duration (s)\n```\n\n1,000 employees, peak 2 req/s, average 10 s per answer → **\\~20 concurrent**.\n\n### Step 2: KV capacity per replica\n\n```\nMax concurrent ≈ KV tokens ÷ average tokens per request\n```\n\nL40S, 8B BF16 → \\~25 GB KV ≈ 200K tokens. Average 3K tokens → **\\~65 concurrent** (≈130 with FP8 KV).\n\n### Step 3: latency check\n\nBenchmark at that concurrency. If TTFT p95 or per-user speed fails the target, the real per-replica limit is lower (say 40).\n\n### Step 4: replicas\n\n```\nReplicas = ceil(Peak concurrent ÷ Per-replica limit) × 1.2–1.3 headroom, + 1 spare\n```\n\n20 ÷ 40 → 1 × 1.3 → 2 replicas (one spare).\n\n### Watch out\n\n- Peak, not average, traffic decides capacity\n- Agents make many calls per user action\n- Long-context users count many times over"}, {"id": 84, "title": "Benchmarking with vLLM", "tldr": "Run `vllm bench serve` with realistic input and output lengths at several concurrency levels, plot throughput against latency, and find the knee of the curve. That knee is your operating point.", "real": "Independent firms such as Artificial Analysis publish TTFT and throughput measurements for hosted model providers. Their results show that the same model can perform very differently depending on hardware, engine and configuration, which is why you should benchmark your own setup.", "body": "### Command\n\n```bash\nvllm bench serve \\\n  --backend vllm \\\n  --model Qwen/Qwen2.5-7B-Instruct \\\n  --dataset-name random \\\n  --random-input-len 1024 --random-output-len 256 \\\n  --num-prompts 500 \\\n  --max-concurrency 32\n```\n\nRepeat with `--max-concurrency` 1, 8, 16, 32, 64, 128. Or use `--request-rate 5` for Poisson arrivals that mimic real traffic.\n\n### Read the output\n\n- Request throughput (req/s)\n- Output token throughput (tok/s)\n- Mean / median / p99 TTFT\n- Mean / median / p99 TPOT and ITL\n\n### Plot\n\n```\nTTFT p95 │                       ●\n         │                   ●\n         │          ●  ●  ← knee\n         │  ●  ●\n         └──────────────────────── throughput\n```\n\n### Make it realistic\n\n- Use real prompt/output length distributions from logs\n- Include shared prefixes if production has them\n- Run for minutes, not seconds\n- Other tools: guidellm, genai-perf, llmperf, Locust or k6 against the gateway"}, {"id": 85, "title": "Tuning knobs in order of impact", "tldr": "Quantize weights, quantize the KV cache, right-size the context cap, use prefix caching, tune batch limits, add speculative decoding, prefer more replicas over bigger TP, upgrade hardware, separate pools, and keep vLLM up to date.", "real": "vLLM’s v0.6.0 release (September 2024) reported about 2.7× higher throughput and 5× lower per-token latency for Llama 3 8B on an H100 compared with the previous version, mostly from removing CPU overhead. Simply upgrading the engine is a real tuning lever.", "body": "### The ordered list\n\n| # | Knob | Typical gain |\n|---|---|---|\n| 1 | Weight quantization (FP8 / INT4) | 1.5–3× capacity, faster decode |\n| 2 | `--kv-cache-dtype fp8` | \\~2× KV capacity |\n| 3 | Right-size `--max-model-len` | Avoids wasted reservation |\n| 4 | Prefix caching + prompt order | Large TTFT drop for shared prompts |\n| 5 | `--max-num-seqs` / `--max-num-batched-tokens` | Latency vs throughput balance |\n| 6 | Speculative decoding | 1.5–3× lower latency at low load |\n| 7 | Smaller TP + more replicas | Higher throughput per GPU |\n| 8 | Faster GPU (bandwidth) | Everything faster |\n| 9 | Separate interactive and batch pools | Stable latency |\n| 10 | Upgrade vLLM | Free kernel and scheduler gains |\n\n### Method\n\n1. Baseline benchmark\n2. Change **one** knob\n3. Re-benchmark and evaluate quality\n4. Keep it only if goodput improves without hurting quality\n\n### Record everything\n\nKeep a table of config → TTFT p95, TPOT p95, throughput, quality score. It becomes your team’s performance history."}, {"id": 86, "title": "Choosing the model", "tldr": "Choose on your own evaluations, license, fit on your hardware, needed context length, language support, tool-calling reliability, dense vs MoE, and engine support. Leaderboards are only a starting filter.", "real": "Licenses differ in ways that matter. Meta’s Llama license includes special terms for companies with over 700 million monthly active users, while many Qwen and Mistral models and OpenAI’s gpt-oss use Apache 2.0. Legal teams at large companies review this before any deployment.", "body": "### Selection checklist\n\n| Question | Why |\n|---|---|\n| Quality on **your** evals? | Benchmarks ≠ your use case |\n| License | Commercial use, attribution, user caps, acceptable use |\n| Size vs hardware | Must fit with KV headroom |\n| Context length | Drives KV memory |\n| Languages | Tokenizer efficiency and training coverage |\n| Tool calling / JSON | Agents and integrations |\n| Dense vs MoE | Speed vs storage trade-off |\n| Engine support | New architectures may need a new vLLM |\n| Safety behavior | Refusals, jailbreak robustness |\n\n### Shortlist method\n\n1. Pick 3–5 candidates from leaderboards and community reports\n2. Run each on 100–500 of your real prompts\n3. Score with rubrics or LLM-as-judge plus human spot checks\n4. Benchmark speed on your hardware\n5. Choose the cheapest model that passes\n\n### Tokenizer tip\n\nSome tokenizers split non-English text into many more tokens. More tokens means more KV cache, more cost and slower answers. Measure tokens per sentence in your languages."}, {"id": 87, "title": "Downloading and storing models safely", "tldr": "Mirror models into your own storage, cache them on local NVMe, pin the exact revision, prefer safetensors, and never load pickle files from untrusted sources.", "real": "In 2024, security firm JFrog reported finding around 100 malicious models on Hugging Face that used pickle loading to execute code. This is a key reason companies prefer safetensors and scan or mirror models internally.", "body": "### Download\n\n```bash\nhuggingface-cli download Qwen/Qwen2.5-7B-Instruct \\\n  --revision <commit-hash> --local-dir /models/qwen2.5-7b\nvllm serve /models/qwen2.5-7b\n```\n\n### Production storage pattern\n\n```\nHugging Face ─(one-time, reviewed)─► Internal object storage (S3/GCS/MinIO)\n                                            │\n                                  node startup sync\n                                            ▼\n                                   Local NVMe cache ─► vLLM\n```\n\n### Rules\n\n- [ ] Pin the **revision hash**, not just the repo name\n- [ ] Prefer `.safetensors`; avoid `.bin`/`.pt` pickles from unknown authors\n- [ ] Avoid `--trust-remote-code` unless you reviewed the code\n- [ ] Record license and source in a model registry\n- [ ] Never depend on the public hub at runtime (outages, rate limits)\n\n### Model registry fields\n\nName, version, revision hash, format/quantization, license, eval scores, approved use cases, owner."}, {"id": 88, "title": "Deploying on Kubernetes", "tldr": "Run vLLM as a Deployment with GPU limits, a model volume, a large `/dev/shm`, readiness probes on `/health`, and a Service in front. Higher-level platforms like KServe, Ray Serve, llm-d, Dynamo and the vLLM production-stack add routing and scaling.", "real": "KServe grew out of the KFServing project, started in 2019 by Google, IBM, Bloomberg, NVIDIA and Seldon, and it is used for model serving in many enterprises. NVIDIA’s GPU Operator is the standard way to make GPUs schedulable on Kubernetes clusters.", "body": "### Minimal manifest\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata: {name: qwen7b}\nspec:\n  replicas: 2\n  selector: {matchLabels: {app: qwen7b}}\n  template:\n    metadata: {labels: {app: qwen7b}}\n    spec:\n      containers:\n      - name: vllm\n        image: vllm/vllm-openai:<pinned-version>\n        args: [\"--model\", \"/models/qwen2.5-7b\", \"--max-model-len\", \"8192\",\n               \"--kv-cache-dtype\", \"fp8\", \"--served-model-name\", \"qwen7b\"]\n        ports: [{containerPort: 8000}]\n        resources: {limits: {nvidia.com/gpu: 1}}\n        readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 60}\n        volumeMounts:\n        - {name: models, mountPath: /models}\n        - {name: shm, mountPath: /dev/shm}\n      volumes:\n      - {name: models, persistentVolumeClaim: {claimName: model-store}}\n      - {name: shm, emptyDir: {medium: Memory, sizeLimit: 16Gi}}\n---\napiVersion: v1\nkind: Service\nmetadata: {name: qwen7b}\nspec: {selector: {app: qwen7b}, ports: [{port: 80, targetPort: 8000}]}\n```\n\n### Platform options\n\n| Tool | Adds |\n|---|---|\n| vLLM production-stack (Helm) | Router, observability, prefix-aware routing |\n| KServe | Standard inference CRDs, autoscaling |\n| Ray Serve | Python-native composition, autoscaling |\n| llm-d | KV-aware routing, disaggregated serving |\n| NVIDIA Dynamo | Disaggregated serving, KV routing across engines |"}, {"id": 89, "title": "Autoscaling", "tldr": "Do not scale on CPU usage. Scale on queue length, KV cache usage, TTFT p95 or in-flight requests. Plan for slow cold starts by keeping warm minimum replicas and fast model loading.", "real": "Google Cloud Run added NVIDIA L4 GPU support with scale-to-zero, which shows the trade-off clearly: scale-to-zero saves money, but each cold start must load the model again. That is acceptable for low-traffic apps and painful for interactive ones.", "body": "### Good scaling signals\n\n| Signal | Scale up when |\n|---|---|\n| `num_requests_waiting` | > 0 sustained for 30–60 s |\n| KV cache usage % | > 85–90% sustained |\n| TTFT p95 | Above SLO |\n| In-flight per replica | Above benchmarked limit |\n\n### Tools\n\n- KEDA with a Prometheus trigger\n- Kubernetes HPA with custom metrics\n- Cluster autoscaler or Karpenter for GPU nodes\n\n### Cold start anatomy\n\n| Step | Time |\n|---|---|\n| New GPU node | 1–5 min |\n| Pull image (\\~10 GB) | 1–3 min |\n| Load weights | 10 s – several min |\n| CUDA graphs, warm-up | 10–60 s |\n\n### Mitigations\n\n- Minimum warm replicas during business hours\n- Pre-pulled images on GPU nodes\n- Weights on local NVMe or with streaming loaders\n- Scheduled scale-up before known peaks\n- Scale down slowly (avoid flapping)"}, {"id": 90, "title": "Monitoring and observability", "tldr": "Combine vLLM `/metrics` (queue, KV usage, latency histograms, token counts) with GPU metrics from NVIDIA’s DCGM exporter. Show them in Grafana and alert on queue growth, KV saturation, SLO breaches, errors and GPU hardware faults.", "real": "Meta’s Llama 3 paper reported 419 unexpected interruptions during a 54-day training run on 16,384 H100s, with GPU and HBM issues the largest category. At scale hardware fails routinely, so GPU health monitoring (XID errors, ECC, temperature) is essential.", "body": "### vLLM metrics (names vary by version)\n\n| Metric family | Use |\n|---|---|\n| Requests running / waiting | Load and queueing |\n| KV cache usage % | Capacity pressure |\n| TTFT histogram | User wait |\n| Inter-token latency histogram | Streaming smoothness |\n| E2E latency histogram | Total time |\n| Prompt / generation token counters | Throughput, cost |\n| Prefix cache hits | Caching effectiveness |\n| Preemptions | Oversubscription |\n\n### GPU metrics (DCGM exporter)\n\nUtilization, memory used, power, temperature, clock throttling, ECC errors, XID errors.\n\n### Alerts\n\n| Alert | Condition |\n|---|---|\n| Queue growing | waiting > 0 for 2 min |\n| KV saturated | > 95% for 5 min |\n| SLO breach | TTFT p95 > target for 5 min |\n| Errors | 5xx rate > 1% |\n| GPU fault | Any XID error or ECC uncorrectable |\n\n### Quality monitoring\n\nLog prompts and outputs with PII controls, sample them for human review, and track user feedback (thumbs up/down)."}, {"id": 91, "title": "The big-company reference architecture", "tldr": "Large companies place a gateway, guardrails and a model router in front of several GPU pools (small models, large models, batch) on Kubernetes. Underneath sit a model registry, object storage, observability and an evaluation pipeline.", "real": "Cloud AI platforms package this exact stack as a product: Amazon Bedrock, Azure AI Foundry and Google Vertex AI each combine an API gateway, guardrails, model choice and routing, and managed GPU capacity. Enterprises building in-house platforms recreate the same layers.", "body": "### The architecture\n\n```\n             Users / Apps / Agents\n                     │\n         ┌───────────▼───────────┐\n         │ API gateway           │ auth, quotas, billing, audit\n         └───────────┬───────────┘\n         ┌───────────▼───────────┐\n         │ Guardrails            │ input/output safety, PII redaction\n         └───────────┬───────────┘\n         ┌───────────▼───────────┐\n         │ Model router          │ choose model, cache-aware, fallback\n         └──┬────────┬────────┬──┘\n            ▼        ▼        ▼\n       Small pool  Large pool  Batch pool   (vLLM / SGLang / TRT-LLM on K8s)\n            │        │        │\n  Model registry · Object storage · Metrics · Evals · Feature flags\n```\n\n### Layer responsibilities\n\n| Layer | Owns |\n|---|---|\n| Gateway | Identity, keys, rate limits, usage metering |\n| Guardrails | Policy, safety classifiers, data protection |\n| Router | Model selection, retries, fallbacks |\n| GPU pools | Serving, autoscaling, capacity |\n| Platform | Registry, CI/CD, evals, observability |\n\n### Team split\n\nOften a central “AI platform” team runs the gateway and GPU pools, while product teams own prompts, evals and application logic."}, {"id": 92, "title": "Model gateways and routing", "tldr": "One internal API fronts many models, both open-source and vendor. A router sends easy requests to small, cheap models and hard ones to large models, with fallbacks, per-team budgets and usage tracking.", "real": "OpenAI launched GPT-5 in August 2025 with a real-time router that decides between a fast model and a deeper reasoning model per request. LMSYS’s open RouteLLM research (2024) showed routing between strong and weak models can cut costs substantially while keeping most of the quality.", "body": "### Gateway features\n\n| Feature | Purpose |\n|---|---|\n| Unified API | Teams call one endpoint |\n| Keys per team/app | Attribution and revocation |\n| Budgets and quotas | Cost control |\n| Logging and audit | Compliance, debugging |\n| Retries and fallbacks | Reliability |\n| Caching | Exact-match response cache |\n\n### Routing strategies\n\n| Strategy | Example |\n|---|---|\n| By task | Classification → 8B; complex reasoning → 70B |\n| By difficulty classifier | Small model predicts hardness |\n| Cascade | Try small model; escalate if low confidence |\n| By tenant tier | Premium customers → larger model |\n| By load | Overflow to another region or provider |\n\n### Savings example\n\nIf 70% of traffic is easy and goes to a model 10× cheaper:\n\n```\nCost = 0.7 × 0.1 + 0.3 × 1.0 = 0.37 → about 63% saved\n```\n\nValidate that quality on the routed traffic stays within targets."}, {"id": 93, "title": "Disaggregated prefill/decode and KV-aware routing", "tldr": "At scale, prefill (compute-heavy) and decode (bandwidth-heavy) run on separate GPU pools, with KV caches transferred between them. KV-aware routing and tiered KV storage (GPU → CPU → SSD) cut recomputation further.", "real": "Moonshot AI described Mooncake, the KV-cache-centric disaggregated system behind its Kimi chatbot, in a paper that won Best Paper at FAST 2025. DeepSeek, NVIDIA’s Dynamo and the llm-d project use prefill/decode disaggregation as well, building on research like DistServe and Microsoft’s Splitwise.", "body": "### Why separate the phases\n\n| Phase | Needs | Interferes by |\n|---|---|---|\n| Prefill | Compute | Long prompts stall decodes |\n| Decode | Bandwidth, KV memory | Hogs memory, low compute use |\n\nSeparating them lets each pool use the best hardware, batch size and parallelism, and scale independently.\n\n### Flow\n\n```\nRequest ─► Prefill pool (computes KV) ─► transfer KV (NVLink/RDMA) ─► Decode pool ─► stream\n```\n\n### Supporting techniques\n\n| Technique | Benefit |\n|---|---|\n| KV-aware routing | Reuse cached prefixes across the fleet |\n| Tiered KV cache | Spill to CPU RAM / SSD instead of recomputing |\n| Wide expert parallelism | Efficient giant MoE decode |\n| Global scheduler | Balance load across pools |\n\n### Who needs this\n\nLarge fleets with long prompts and strict latency targets. For one to a few servers, standard vLLM with chunked prefill is simpler and usually enough."}, {"id": 94, "title": "Cost engineering for LLMs", "tldr": "Cost per million tokens = GPU cost per hour ÷ (tokens per hour ÷ 1M). High batch utilization is the biggest lever, followed by quantization, routing, prompt caching, off-peak batch work and capacity reservations.", "real": "In 2025 DeepSeek published a breakdown of its inference serving costs and claimed a very high theoretical margin, achieved through extreme batching, expert parallelism and caching. Separately, a16z estimated in late 2024 that the price of a given level of LLM capability had been falling about 10× per year.", "body": "### Formula\n\n```\nCost per 1M output tokens = GPU $/hour ÷ (output tokens/hour ÷ 1,000,000)\n```\n\nExample: $2.50/hour GPU at 2,500 tok/s → 9M tokens/hour → **\\~$0.28 per 1M tokens**.\n\nSame GPU at 250 tok/s (poorly batched) → **\\~$2.78 per 1M**, 10× worse.\n\n### Levers\n\n| Lever | Effect |\n|---|---|\n| Higher batch utilization | Biggest single factor |\n| FP8 / INT4 | More tokens per GPU |\n| Model routing | Cheaper models for easy requests |\n| Prefix caching | Skip repeated prefill |\n| Shorter prompts | Less compute and KV |\n| Batch jobs off-peak | Fill idle capacity |\n| Reserved vs on-demand | Lower $/hour for baseline |\n| Spot/preemptible | Cheap batch capacity |\n\n### Build vs buy\n\nSelf-hosting wins with **high, steady volume**, strict data-control needs, or custom fine-tunes. APIs win for **low or spiky volume**, because an idle GPU still costs money. Compute both at your real utilization."}, {"id": 95, "title": "Reliability, safety and rollouts", "tldr": "Run N+1 replicas across zones, gate every change with evals, roll out with canaries and shadow traffic, deploy model + engine + config as one pinned artifact, and keep runbooks, guardrails and security controls in place.", "real": "OpenAI’s December 2024 outage was caused by a new telemetry service deployment that overwhelmed its Kubernetes control planes, according to its public postmortem. Staged rollouts and fast rollback paths are standard practice because incidents like that happen even at the largest companies.", "body": "### Reliability\n\n- N+1 replicas per pool, spread across zones or regions\n- Health checks and automatic restarts\n- Graceful drain before restarts\n- Fallback routes to another model or provider\n\n### Release process\n\n```\nNew model / quant / engine version\n  → offline evals (must pass)\n  → load test (must meet SLO)\n  → shadow traffic (compare, no user impact)\n  → canary 1–5% → 25% → 100%\n  → automatic rollback on quality or latency regressions\n```\n\n### Version everything together\n\nModel revision hash + quantization + vLLM image tag + flags = one release artifact.\n\n### Security\n\n- vLLM never exposed directly to the internet\n- Private networking, TLS, secrets in a vault\n- Audit logs, data retention policies\n- Review any `--trust-remote-code` model\n\n### Safety\n\nInput/output classifiers, PII redaction, prompt-injection defenses for agents, and human review of flagged conversations."}, {"id": 96, "title": "VRAM cheat sheet", "tldr": "A one-page lookup from VRAM size to the models that run comfortably, possibly, or as a stretch. Use it for quick hardware decisions, then confirm with the KV math.", "real": "Community “Can I run it?” VRAM calculators are among the most-used tools in local-LLM communities, because this lookup is the first question nearly everyone asks before buying a GPU or picking a model.", "body": "### The sheet\n\n| VRAM | Comfortable, multi-user | Possible, few users | Stretch |\n|---|---|---|---|\n| 8 GB | 3–4B INT4 | 7–8B INT4 | — |\n| 12 GB | 7–8B INT4/FP8 | 14B INT4 | — |\n| 16 GB | 8B FP8, 14B INT4 | 20–24B INT4 | \\~20B MoE at 4-bit |\n| **24 GB** | 8B BF16/FP8, 14B FP8 | 27–32B INT4, 30B MoE INT4 | 70B 2-bit / offload |\n| 32 GB | 14B BF16, 32B INT4 | 32B INT4 long context | 70B \\~3-bit |\n| **48 GB** | 8–14B BF16, 32B INT4 | 32B FP8, **70B INT4** | 100B+ MoE with offload |\n| 80 GB | 32B BF16, 70B INT4 | 70B FP8 | \\~120B MoE at 4-bit |\n| 141–192 GB | 70B FP8, many users | 70B BF16 | 200B+ MoE quantized |\n| 8 × 80 GB | 70B BF16 at scale, 405B FP8 | Very large MoE (memory-heavy) | — |\n\n### Quick formulas\n\n```\nWeights GB ≈ params(B) × bits ÷ 8   (+10% for INT4 overhead)\nKV GB      ≈ KV KB/token × tokens ÷ 1,000,000\n```\n\n### Bandwidth reminder\n\nSame VRAM, different speed: check GB/s before buying."}, {"id": 97, "title": "The deployment decision flowchart", "tldr": "Start with the model that passes your evals. Try BF16, then FP8/INT8, then INT4 with FP8 KV, then more GPUs, then a smaller or MoE model, and only then offload or 2–3-bit for single-user or experimental use.", "real": "Meta followed this logic for Llama 3.1 405B. The BF16 model needed multiple nodes, so Meta provided an FP8 version that fits one 8-GPU node, trading a tiny amount of precision for much simpler, cheaper deployment.", "body": "### Flowchart\n\n```\nSTART: model that passes YOUR evals\n  │\n  ▼\nBF16 weights + KV for target users ≤ 90% VRAM?\n  ├─ Yes → serve BF16 (FP8 for extra capacity). DONE\n  └─ No\n     ▼\nFP8 (modern GPU) / INT8 (older GPU) fits? ── Yes → DONE\n     │ No\n     ▼\nINT4 (AWQ/GPTQ) + FP8 KV fits with headroom? ── Yes → DONE\n     │ No\n     ▼\nCan you add GPUs (TP=2/4)? ── Yes → DONE\n     │ No\n     ▼\nSmaller or MoE model good enough? ── Yes → DONE\n     │ No\n     ▼\nOffload (llama.cpp) or 2–3-bit → single user / experiments only\n```\n\n### After choosing\n\n1. Benchmark at peak concurrency\n2. Size replicas (ch. 83)\n3. Set up monitoring (ch. 90)\n4. Plan the rollout (ch. 95)"}, {"id": 98, "title": "The top 15 mistakes", "tldr": "Most failures come from forgetting the KV cache, oversized context caps, ignoring bandwidth, untested low-bit quants, bad calibration, wrong chat templates, no auth, wrong scaling signals, missing warm-up, average-only metrics, unrealistic benchmarks and unpinned versions.", "real": "Ollama long used a small default context window (2,048 tokens, later raised), so many users unknowingly had long prompts silently truncated and blamed the model for “forgetting”. It is a classic example of a configuration mistake that looks like a model quality problem.", "body": "### The list\n\n| # | Mistake | Consequence |\n|---|---|---|\n| 1 | Sizing only weights, not KV | OOM with real users |\n| 2 | `--max-model-len` 128K “just in case” | Startup failure, low concurrency |\n| 3 | Choosing GPUs by VRAM alone | Slow decode |\n| 4 | 2-bit without task evals | Silent quality collapse |\n| 5 | Calibrating on unrelated data | Extra quality loss |\n| 6 | Raw completions without chat template | Garbage outpu

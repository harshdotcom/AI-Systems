such as LaunchDarkly or in-house systems to roll out changes gradually and disable them instantly, practices especially important for AI features whose behavior can surprise at scale.", "body": "### Rollout plan\n\n| Step | Traffic | Duration | Watch |\n|---|---|---|---|\n| 1 | 1% | 2 days | Errors, safety flags |\n| 2 | 10% | 1 week | Quality, cost, feedback |\n| 3 | 50% | 1 week | Business metrics |\n| 4 | 100% | — | Ongoing monitoring |\n\n### Flag uses\n\n```mermaid\nflowchart LR\n  FLAG[Feature flags] --> PCT[Percentage rollout]\n  FLAG --> CUST[Per-customer enablement]\n  FLAG --> MODEL[Model / prompt version switch]\n  FLAG --> KILL[Kill switch]\n```"}, {"id": 124, "title": "Positioning AI products", "tldr": "Position on the customer outcome and differentiation, not on “AI” itself. Explain what problem is solved, for whom, how it is better and why it can be trusted. As AI becomes common, “AI-powered” alone stops differentiating.", "real": "Apple branded its features “Apple Intelligence” and emphasized privacy and personal context, and Adobe emphasized commercially safe training data for Firefly, both positioning on trust and user benefit rather than raw model capability.", "body": "### Positioning template\n\n```\nFor [target users] who [need],\n[product] is the [category] that [key benefit].\nUnlike [alternatives], we [differentiator].\n```\n\n### Positioning angles for AI\n\n| Angle | Example |\n|---|---|\n| Outcome | “Close books in days, not weeks” |\n| Workflow fit | “Works inside the tools you already use” |\n| Trust | “Your data never trains our models” |\n| Domain expertise | “Built for clinical documentation” |\n| Control | “You approve every action” |\n\n### Avoid\n\nLeading with model names or vague “AI-powered” claims."}, {"id": 125, "title": "Messaging without hype", "tldr": "Overpromising AI creates disappointment, churn and regulatory risk. Make specific, evidence-based claims, describe limitations honestly, and show real examples. Credible messaging builds long-term trust.", "real": "The US Federal Trade Commission announced “Operation AI Comply” in 2024, taking action against companies making deceptive claims about AI capabilities, signaling regulatory attention to AI marketing claims.", "body": "### Claim checklist\n\n| Question | Example |\n|---|---|\n| Is it measurable? | “Resolves 60% of routine questions in our tests” |\n| Is evidence available? | Study, customer case |\n| Are limitations stated? | “Complex cases go to your team” |\n| Would a user be misled? | Avoid implying human-level judgment |\n\n### Messaging ladder\n\n```mermaid\nflowchart LR\n  F[What it does] --> B[Benefit to user]\n  B --> P[Proof: metrics, customer stories]\n  P --> L[Limits and safeguards]\n```"}, {"id": 126, "title": "Enabling sales and customer-facing teams", "tldr": "Sales, support and success teams need to explain AI features accurately: what they do, limits, data handling, security, pricing and how to handle objections. Provide demos, FAQs, security documentation and escalation paths.", "real": "Enterprise AI vendors commonly publish trust or security centers and AI-specific FAQs covering data use, retention and model providers, because customers’ security and legal teams ask the same questions in nearly every deal.", "body": "### Enablement kit\n\n| Asset | Content |\n|---|---|\n| Pitch and demo script | Outcome-focused story |\n| FAQ | Capabilities, limits, data use |\n| Security pack | Architecture, certifications, DPAs |\n| Pricing guide | Packages, limits, ROI calculator |\n| Objection handling | Accuracy, privacy, cost, job concerns |\n| Reference customers | Case studies |\n\n### Common customer questions\n\n- Is our data used to train models?\n- Which model providers do you use, and where is data processed?\n- How accurate is it, and what happens when it’s wrong?\n- Can admins control and audit usage?"}, {"id": 127, "title": "Onboarding customers to AI features", "tldr": "Adoption needs onboarding: setup (data connections, permissions), training users on good use, starter templates, champions inside customer organizations, and early success milestones. Enterprise AI adoption is a change-management project.", "real": "Organizations rolling out enterprise AI assistants commonly run champion programs, prompt libraries and training sessions, because many users initially do not know which tasks benefit from AI.", "body": "### Onboarding plan (enterprise)\n\n| Week | Activities |\n|---|---|\n| 1 | Admin setup, data connections, policies |\n| 2 | Champion training, use-case selection |\n| 3–4 | Team rollouts with templates |\n| 5–8 | Usage reviews, office hours, success stories |\n| 12 | Value review with executives |\n\n### Adoption drivers\n\n```mermaid\nflowchart LR\n  SETUP[Easy setup] --> FIRST[First valuable task]\n  FIRST --> TEMPL[Templates for common jobs]\n  TEMPL --> CHAMP[Internal champions]\n  CHAMP --> HABIT[Habitual use]\n```"}, {"id": 128, "title": "Documentation and user education", "tldr": "Help users get value and use AI safely: guides on effective use, examples, limitations, data handling, and how to report problems. Good education reduces support load and misuse.", "real": "AI providers such as OpenAI, Anthropic and Google publish usage policies, prompting guides and help center articles for their consumer and business products, and enterprise customers often adapt these into internal AI usage guidelines.", "body": "### Documentation set\n\n| Doc | Purpose |\n|---|---|\n| Getting started | First successful task |\n| Use-case guides | Templates by role |\n| Tips for better results | How to give context |\n| Limitations | Known weaknesses |\n| Data and privacy | What happens to inputs |\n| Admin guide | Controls, policies, audit |\n| Troubleshooting | Common issues |\n\n### In-product education\n\nTooltips, example prompts, contextual tips after failures, and short videos."}, {"id": 129, "title": "Launch metrics", "tldr": "Define launch success in advance: adoption, activation, quality, satisfaction, support load, cost and business impact over the first weeks, with targets and owners. Review daily early on, then weekly.", "real": "Product teams typically run launch “war rooms” during the first days of major releases, monitoring dashboards for errors, usage and feedback so they can respond quickly to unexpected problems.", "body": "### Launch scorecard\n\n| Metric | Week-1 target | Week-4 target |\n|---|---|---|\n| Activation | 30% of exposed users | 45% |\n| Quality (eval/sampled) | ≥ bar | ≥ bar |\n| Satisfaction | ≥ 4.0/5 | ≥ 4.2/5 |\n| Support tickets about feature | < 2% of users | < 1% |\n| Cost per task | Within plan | Within plan |\n| Safety incidents | 0 critical | 0 critical |\n\n### First-week routine\n\nDaily metric review, failure triage, quick fixes behind flags, and clear owner for each issue."}, {"id": 130, "title": "Post-launch iteration", "tldr": "Launch is the start of learning. Analyze usage and failures, prioritize fixes and improvements, expand to new segments as quality allows, and communicate improvements. AI products often improve fastest in the months after launch.", "real": "AI products such as ChatGPT, Copilot and Claude publish regular release notes describing improvements and new capabilities after launch, reflecting rapid iteration cycles driven by usage data and model updates.", "body": "### Iteration loop\n\n```mermaid\nflowchart LR\n  DATA[Usage + feedback data] --> ANALYZE[Failure and opportunity analysis]\n  ANALYZE --> PRIOR[Prioritize]\n  PRIOR --> BUILD[Build / tune]\n  BUILD --> EVAL[Evaluate]\n  EVAL --> SHIP[Ship + release notes]\n  SHIP --> DATA\n```\n\n### 30-60-90 after launch\n\n| Period | Focus |\n|---|---|\n| 0–30 days | Fix top failure categories, stabilize |\n| 30–60 days | Improve activation and retention |\n| 60–90 days | Expand scope or segments |"}, {"id": 131, "title": "Monitoring quality in production", "tldr": "Quality must be monitored continuously, not just at launch: sample production outputs for automated and human evaluation, track feedback and outcome signals, and alert on drops by segment, feature and model version.", "real": "AI teams commonly run online evaluation on a sample of production traffic using LLM judges and periodic human review, because offline eval sets cannot capture every new kind of request users send.", "body": "### Monitoring system\n\n```mermaid\nflowchart LR\n  PROD[Production traffic] --> SAMPLE[Sample 1-5%]\n  SAMPLE --> AUTO[Automated judges]\n  SAMPLE --> HUMAN[Human review weekly]\n  PROD --> SIGNALS[Feedback + outcome signals]\n  AUTO --> DASH[Quality dashboard]\n  HUMAN --> DASH\n  SIGNALS --> DASH\n  DASH --> ALERT[Alerts on drops]\n```\n\n### What to monitor\n\n| Signal | Example |\n|---|---|\n| Sampled quality score | Groundedness, correctness |\n| Feedback rate | Thumbs down % |\n| Outcome | Resolution, acceptance |\n| New query types | Topics not in eval set |\n| Segment gaps | Language, customer type |"}, {"id": 132, "title": "Drift and changing user behavior", "tldr": "User needs, content, language and behavior change over time, and so does the world the AI describes. Monitor input distributions, topics and knowledge freshness, and refresh evals, content and prompts accordingly.", "real": "During the early COVID-19 pandemic in 2020, many ML systems faced sudden shifts; Instacart reported its item availability predictions dropping from about 93% to 61% accuracy as shopping behavior changed, a vivid example of distribution shift.", "body": "### Types of drift\n\n| Type | Example |\n|---|---|\n| Input drift | New topics, languages, longer queries |\n| Knowledge drift | Policies or prices changed |\n| Behavior drift | Users rely on AI for new tasks |\n| Model drift | Provider updates change outputs |\n\n### Detection\n\n| Method | Use |\n|---|---|\n| Topic clustering of queries | New intents |\n| Retrieval miss rate | Missing knowledge |\n| Feedback trends | Quality issues |\n| Eval reruns after provider updates | Model changes |\n\n### Response\n\nUpdate content sources, add new eval cases, adjust prompts or routing, and communicate changes."}, {"id": 133, "title": "Managing model updates and versions", "tldr": "Model providers update and deprecate models; your own prompts and pipelines change too. Pin versions, evaluate new versions before switching, roll out gradually, monitor behavior changes, and plan migrations before deprecation deadlines.", "real": "In April 2025 OpenAI rolled back a GPT-4o update in ChatGPT after it became excessively sycophantic, and in August 2025 restored GPT-4o access for paid users after backlash over its replacement, showing both the risks of model changes and users’ attachment to model behavior.", "body": "### Model change process\n\n```mermaid\nflowchart LR\n  NEW[New model available] --> EVAL[Run full eval suite]\n  EVAL --> COMP[Compare quality, cost, latency, behavior]\n  COMP --> SHADOW[Shadow test on real traffic]\n  SHADOW --> CANARY[Canary rollout]\n  CANARY --> FULL[Full rollout]\n  FULL --> MON[Monitor + rollback ready]\n```\n\n### Version policy\n\n| Practice | Why |\n|---|---|\n| Pin model versions | Avoid silent changes |\n| Track deprecation dates | Plan migrations |\n| Keep previous version available briefly | Fast rollback |\n| Document behavior differences | Support and users |\n| Notify customers of material changes | Trust |"}, {"id": 134, "title": "Incident management for AI features", "tldr": "AI incidents include outages, quality collapses, harmful outputs, data exposure and cost spikes. Use defined severity levels, on-call owners, runbooks, kill switches, communication templates and blameless postmortems.", "real": "In March 2023 ChatGPT was taken offline after a bug in an open-source Redis library exposed some users’ chat titles and some subscribers’ payment details; OpenAI published a postmortem describing the cause and fixes.", "body": "### Severity levels (example)\n\n| Severity | Example | Response time |\n|---|---|---|\n| SEV1 | Data exposure, harmful outputs at scale | Immediate |\n| SEV2 | Feature down, major quality drop | < 1 hour |\n| SEV3 | Partial degradation | Same day |\n| SEV4 | Minor issues | Next sprint |\n\n### Runbook\n\n```mermaid\nflowchart LR\n  ALERT[Alert] --> OWNER[On-call owner]\n  OWNER --> ASSESS[Assess severity]\n  ASSESS --> CONTAIN[Contain: flag off, rollback, block]\n  CONTAIN --> COMM[Communicate]\n  COMM --> RESOLVE[Resolve]\n  RESOLVE --> PM[Postmortem + new tests]\n```"}, {"id": 135, "title": "Cost operations", "tldr": "Manage AI spend actively: dashboards by feature and customer, budgets and alerts, anomaly detection, optimization backlogs (caching, routing, prompt trimming), and regular reviews with finance.", "real": "Cloud cost management practices from the FinOps Foundation have been extended to AI workloads, with teams tracking token and GPU costs per feature, and model providers offering usage dashboards and spend limits for API customers.", "body": "### Cost operations checklist\n\n- [ ] Cost per feature, per tenant, per model visible\n- [ ] Monthly budget with alerts at 80% and 100%\n- [ ] Anomaly alerts for sudden spikes\n- [ ] Top-10 most expensive users/workflows reviewed\n- [ ] Optimization backlog with estimated savings\n- [ ] Quarterly model price/performance review\n\n### Optimization backlog (example)\n\n| Item | Estimated saving |\n|---|---|\n| Prompt caching for system prompt | 25% |\n| Route simple queries to small model | 30% |\n| Trim retrieved context from 8 to 5 chunks | 10% |\n| Batch nightly summarization | 50% on that workload |"}, {"id": 136, "title": "Reliability and fallbacks", "tldr": "AI features depend on model providers, retrieval systems and tools that can fail or slow down. Design fallbacks: alternative models, cached answers, non-AI paths and human handoff, with clear messaging so users can continue their work.", "real": "OpenAI’s December 2024 outage, caused by a telemetry service deployment that overwhelmed Kubernetes control planes according to its postmortem, disrupted ChatGPT and the API for hours, affecting many products built on it that lacked fallbacks.", "body": "### Fallback ladder\n\n```mermaid\nflowchart TB\n  PRIMARY[Primary model] -->|fails| SECONDARY[Secondary provider / model]\n  SECONDARY -->|fails| CACHED[Cached or template answers]\n  CACHED -->|not available| NONAI[Non-AI path: search, forms]\n  NONAI --> HUMAN[Human support]\n```\n\n### Reliability requirements\n\n| Requirement | Example |\n|---|---|\n| Timeouts | Fail fast at 15 s |\n| Retries | Limited, with backoff |\n| Circuit breakers | Stop calling failing provider |\n| Status messaging | “AI assistant temporarily unavailable” |\n| SLOs | Availability and latency targets |"}, {"id": 137, "title": "Closing the feedback loop", "tldr": "Turn feedback into improvements systematically: collect, triage, categorize, prioritize, fix, verify with evals, ship, and tell users. Without a loop, feedback buttons become decoration and users stop using them.", "real": "Mature AI product teams run weekly feedback triage meetings where PMs, engineers and domain experts review samples of negatively rated outputs, a practice frequently recommended by practitioners building LLM products.", "body": "### Feedback pipeline\n\n```mermaid\nflowchart LR\n  FB[Feedback + bad outputs] --> TRIAGE[Weekly triage]\n  TRIAGE --> CAT[Categorize root cause]\n  CAT --> PRIO[Prioritize by volume x severity]\n  PRIO --> FIX[Fix: content, prompt, retrieval, model, UX]\n  FIX --> EVAL[Add regression cases]\n  EVAL --> SHIP[Ship]\n  SHIP --> NOTIFY[Release notes]\n```\n\n### Root cause categories\n\n| Category | Typical fix |\n|---|---|\n| Missing or outdated content | Content update |\n| Retrieval miss | Retrieval tuning |\n| Instruction issue | Prompt change |\n| Model limitation | Model change, routing |\n| UX confusion | Design change |\n| User expectation mismatch | Onboarding, messaging |"}, {"id": 138, "title": "Supporting AI products", "tldr": "Support teams need tools and knowledge to handle AI issues: understanding expected behavior and limits, access to conversation traces (with privacy controls), escalation paths to product and engineering, and macros for common questions.", "real": "Companies deploying AI assistants to customers typically train support teams on the assistant’s capabilities and give them access to conversation logs, so they can explain, correct and escalate AI-related complaints quickly.", "body": "### Support readiness\n\n| Item | Content |\n|---|---|\n| Behavior guide | What the AI should and shouldn’t do |\n| Known issues | Current limitations and workarounds |\n| Trace access | View conversation and sources (permissioned) |\n| Escalation path | When and how to involve product/engineering |\n| Macros | Responses for common concerns |\n| Data requests | Process for deletion and access requests |\n\n### Common ticket types\n\nWrong answer, refusal complaints, privacy questions, billing for usage, and feature requests."}, {"id": 139, "title": "Communicating changes to users", "tldr": "AI behavior changes with prompts and models, so tell users about meaningful changes: release notes, in-product notices, documentation updates and advance notice for removals or pricing changes. Predictability builds trust.", "real": "When OpenAI changed default models in ChatGPT in August 2025, users who relied on specific model behavior reacted strongly, and OpenAI responded by restoring options and providing clearer communication about model availability.", "body": "### What to communicate\n\n| Change | Channel |\n|---|---|\n| New capability | Release notes, in-product highlight |\n| Behavior change | Release notes, help docs |\n| Model change | Notes for admins and users |\n| Feature removal | Advance notice, migration guide |\n| Pricing or limits | Email + in-product, with notice period |\n| Data policy change | Clear notice, consent where needed |\n\n### Release note template\n\n```\nWhat's new: faster, more accurate answers on billing questions\nWhat changed: answers now include links to your invoices\nWhat to expect: shorter responses by default; ask for detail if needed\nFeedback: use 👍 / 👎 on any answer\n```"}, {"id": 140, "title": "Sunsetting AI features", "tldr": "Retire AI features that fail to deliver value, cost too much or carry unacceptable risk. Plan migration paths, communicate early, preserve user data and work, and learn from the decision.", "real": "OpenAI wound down ChatGPT plugins in 2024 in favor of GPTs, after introducing plugins in March 2023, and Humane discontinued its AI Pin after its assets were sold to HP in 2025, both examples of AI products being retired as strategies changed.", "body": "### Sunset criteria\n\n| Criterion | Example |\n|---|---|\n| Low adoption | < 5% of users after 6 months |\n| Poor retention | Users try once and stop |\n| Negative unit economics | Cost exceeds value |\n| Unfixable risk | Safety or legal issues |\n| Strategic shift | Replaced by better approach |\n\n### Sunset plan\n\n```mermaid\nflowchart LR\n  DECIDE[Decision with data] --> NOTICE[Notify users with timeline]\n  NOTICE --> MIGRATE[Migration path / alternative]\n  MIGRATE --> EXPORT[Data export]\n  EXPORT --> REMOVE[Remove feature]\n  REMOVE --> LEARN[Retrospective]\n```"}, {"id": 141, "title": "Roadmaps for AI products", "tldr": "AI roadmaps should be outcome-oriented and flexible because capabilities and quality are uncertain and models improve quickly. Use themes and problems with confidence levels, near-term commitments and longer-term bets.", "real": "Many product teams use “now, next, later” roadmaps popularized in the product community (for example by Janna Bastow of ProdPad) instead of date-based feature lists, which suits uncertain AI work.", "body": "### Now / next / later\n\n| Horizon | Content | Confidence |\n|---|---|---|\n| Now | Committed improvements in progress | High |\n| Next | Validated problems, solutions being explored | Medium |\n| Later | Strategic bets dependent on capability progress | Low |\n\n### Roadmap item format\n\n```\nProblem: agents spend 8 minutes searching for answers\nOutcome: reduce to 3 minutes\nApproach: AI answer suggestions with citations (exploring)\nConfidence: medium (prototype at 82% vs 90% bar)\n```\n\n### Avoid\n\nPromising specific AI capabilities by fixed dates before feasibility is proven."}, {"id": 142, "title": "Prioritization frameworks", "tldr": "Frameworks such as RICE (reach, impact, confidence, effort), Kano and cost of delay help compare opportunities consistently. For AI work, add feasibility uncertainty, data readiness, risk and running cost.", "real": "The RICE framework was developed at Intercom (described by Sean McBride) to compare product ideas, and the Kano model, developed by Noriaki Kano in the 1980s, classifies features by how they affect customer satisfaction.", "body": "### RICE\n\n```\nRICE score = (Reach × Impact × Confidence) ÷ Effort\n```\n\n### Extended scoring for AI (example)\n\n| Idea | Reach | Impact | Confidence | Effort | Risk | Run cost | Priority |\n|---|---|---|---|---|---|---|---|\n| AI reply drafts | 5,000 | 2 | 80% | 4 | Low | Medium | High |\n| Autonomous refunds | 2,000 | 3 | 40% | 8 | High | Medium | Later |\n| Auto-tagging | 8,000 | 1 | 90% | 2 | Low | Low | High |\n\n### Kano categories\n\n| Category | Example |\n|---|---|\n| Basic | AI answers are accurate |\n| Performance | Faster, better answers |\n| Delighters | Proactive suggestions |"}, {"id": 143, "title": "Managing uncertainty", "tldr": "AI work has technical uncertainty (can we reach the quality bar?), user uncertainty (will people use it?) and economic uncertainty (will it be profitable?). Reduce the biggest uncertainty first with cheap experiments before committing large investments.", "real": "Teams commonly run time-boxed feasibility spikes for AI features, for example two weeks to see whether a prototype can reach a target score on an evaluation set, before committing roadmap capacity.", "body": "### Uncertainty map\n\n| Type | Question | Cheap test |\n|---|---|---|\n| Technical | Can we reach 90% quality? | Prototype + eval set |\n| User | Will they use it weekly? | Wizard of Oz, beta |\n| Economic | Cost per task acceptable? | Token cost estimate |\n| Risk | Can we make it safe? | Red-team session |\n\n### Sequence\n\n```mermaid\nflowchart LR\n  BIG[Identify biggest uncertainty] --> TEST[Cheapest test]\n  TEST --> LEARN[Learn]\n  LEARN --> DECIDE{Continue?}\n  DECIDE -- yes --> NEXT[Next uncertainty]\n  DECIDE -- no --> STOP[Stop or pivot]\n```"}, {"id": 144, "title": "Research spikes and exploration time", "tldr": "Reserve capacity for exploration: testing new models, prototyping new interaction patterns, and investigating opportunities. Time-box spikes with clear questions and decision criteria so exploration produces decisions.", "real": "Google’s historical “20% time” and Atlassian’s “ShipIt” hack days are well-known examples of companies creating space for exploration; AI product teams similarly reserve time to test new model capabilities as they appear.", "body": "### Spike template\n\n| Field | Example |\n|---|---|\n| Question | Can a smaller model match quality for ticket tagging? |\n| Time box | 1 week |\n| Method | Run 3 models on 300-example eval set |\n| Decision criteria | ≥ 95% of current quality at ≤ 30% cost |\n| Output | Recommendation + data |\n\n### Capacity allocation (guideline)\n\n```chart\n{\"title\": \"Team capacity allocation (guideline)\", \"unit\": \"%\", \"data\": [[\"Committed roadmap\", 65], [\"Quality and reliability\", 15], [\"Exploration and spikes\", 10], [\"Tech and data debt\", 10]]}\n```"}, {"id": 145, "title": "Capability bets vs feature work", "tldr": "Some AI investments build durable capabilities (eval infrastructure, data pipelines, retrieval platforms) that power many features; others ship specific features. Balance both: capabilities compound, features deliver near-term value.", "real": "Companies such as Uber built shared ML platforms (Michelangelo) and later generative AI gateways so many product teams could build AI features quickly on common infrastructure, a capability investment that compounds over time.", "body": "### Comparison\n\n| | Capability investment | Feature work |\n|---|---|---|\n| Example | Eval platform, data flywheel, RAG service | AI summarize button |\n| Payoff | Many future features | Immediate user value |\n| Visibility | Low | High |\n| Risk | Under-investment slows everything | Over-investment in one feature |\n\n### Portfolio\n\n```mermaid\nflowchart TB\n  CAP[Capabilities: evals, data, retrieval, gateway] --> F1[Feature A]\n  CAP --> F2[Feature B]\n  CAP --> F3[Feature C]\n```\n\n### PM role\n\nMake the case for capability work with evidence of how it speeds or improves multiple features."}, {"id": 146, "title": "Technical and data debt in AI products", "tldr": "AI products accumulate debt: undocumented prompts, missing evals, brittle data pipelines, hard-coded model dependencies, unmaintained knowledge bases. Track debt explicitly and pay it down before it causes incidents or blocks progress.", "real": "Google’s 2015 paper “Hidden Technical Debt in Machine Learning Systems” coined influential terms such as “glue code” and “pipeline jungles” to describe how ML systems accumulate maintenance costs beyond ordinary software.", "body": "### AI debt types\n\n| Debt | Symptom |\n|---|---|\n| Prompt debt | Many ad hoc prompts nobody understands |\n| Eval debt | No regression tests; fear of changes |\n| Data debt | Stale knowledge base, broken pipelines |\n| Model coupling | Can’t switch providers easily |\n| Observability debt | Can’t explain bad outputs |\n| Glue code | Fragile integrations |\n\n### Paying it down\n\n- Allocate fixed capacity each cycle\n- Prioritize debt that blocks roadmap items or causes incidents\n- Make debt visible in planning"}, {"id": 147, "title": "Dependencies on model progress", "tldr": "Some product ideas depend on capabilities models do not yet reliably have. Track capability trends, build products that improve automatically as models improve, and avoid over-investing in workarounds that better models will make unnecessary.", "real": "METR reported in 2025 that the length of tasks AI agents could complete with 50% reliability had been doubling roughly every seven months, a trend many product teams use to plan which agentic features may become feasible soon.", "body": "### Planning approaches\n\n| Approach | Example |\n|---|---|\n| Build for today’s capability | Ship assistive features now |\n| Design to benefit from better models | Architecture that can swap models easily |\n| Watch triggers | “When eval score reaches 90%, launch autonomous mode” |\n| Avoid heavy workarounds | Don’t build complex scaffolding likely to be obsolete |\n\n### Capability triggers\n\n```mermaid\nflowchart LR\n  NEW[New model release] --> EVAL[Run feature eval suites]\n  EVAL --> CHECK{Threshold reached?}\n  CHECK -- yes --> UNLOCK[Unlock roadmap item]\n  CHECK -- no --> WAIT[Keep monitoring]\n```"}, {"id": 148, "title": "Portfolio management across AI initiatives", "tldr": "Manage AI initiatives as a portfolio: core improvements, adjacent expansions and transformational bets, with different success criteria and funding approaches. Kill underperformers and double down on winners.", "real": "Gartner’s 2024 prediction that many generative AI projects would be abandoned after proof of concept reflected a common pattern: organizations launched many pilots and then needed portfolio discipline to concentrate investment on the few that showed value.", "body": "### Portfolio mix (guideline)\n\n```chart\n{\"title\": \"Example AI investment mix (guideline)\", \"unit\": \"%\", \"data\": [[\"Core: improve existing workflows\", 60], [\"Adjacent: new use cases for current users\", 30], [\"Transformational: new AI-native products\", 10]]}\n```\n\n### Portfolio review\n\n| Question | Action |\n|---|---|\n| Which initiatives meet milestones? | Continue or scale |\n| Which stall at quality bar? | Re-scope or stop |\n| Which have weak adoption? | Investigate or stop |\n| Which have poor economics? | Optimize or reprice |"}, {"id": 149, "title": "Saying no", "tldr": "Focus requires saying no to many requests, including “add AI to everything” pressure. Decline with reasons tied to strategy and evidence, offer alternatives, and keep a transparent backlog so stakeholders understand trade-offs.", "real": "Steve Jobs said at Apple’s 1997 Worldwide Developers Conference that focus means saying no to the hundred other good ideas, a principle widely quoted in product management.", "body": "### Framework for no\n\n| Step | Example |\n|---|---|\n| Acknowledge | “This is a real customer need.” |\n| Explain trade-off | “Doing it now delays the billing assistant, which affects 5× more users.” |\n| Share criteria | “Our priority is resolution time this quarter.” |\n| Offer alternative | “We can add it to next quarter’s review / here’s a workaround.” |\n\n### “Add AI” requests\n\nAsk: what problem, for whom, how will we measure success, and is AI the best solution?"}, {"id": 150, "title": "OKRs for AI product teams", "tldr": "OKRs set ambitious objectives with measurable key results. For AI teams, combine outcome key results (user value), quality key results (eval scores) and guardrail key results (safety, cost), and avoid output-only key results like “ship feature X”.", "real": "Google adopted OKRs in 1999 after John Doerr introduced them from Intel, and the practice spread widely in technology companies; Doerr’s book “Measure What Matters” (2018) popularized it further.", "body": "### Example OKR\n\n| Objective | Make support faster and more accurate with AI |\n|---|---|\n| KR1 | Median handling time from 9 to 6 minutes |\n| KR2 | AI draft usable rate from 78% to 90% (golden set and sampled production) |\n| KR3 | 60% of agents use AI drafts weekly |\n| KR4 (guardrail) | CSAT stays ≥ 4.4; zero critical safety incidents |\n| KR5 (guardrail) | Cost per ticket ≤ $0.08 |\n\n### Good KR checklist\n\n- [ ] Measurable outcome or quality metric\n- [ ] Baseline and target\n- [ ] Not just “ship X”\n- [ ] Includes guardrails where AI risk exists"}, {"id": 151, "title": "Working with data scientists and researchers", "tldr": "Data scientists and researchers explore uncertain problems; PMs provide direction, context and decisions. Agree on problem framing, success metrics and time boxes, respect research uncertainty, and translate results into product decisions.", "real": "Organizations with applied research teams, such as Google, Microsoft and Meta, commonly pair researchers with product teams through “applied science” or “research engineering” roles to move capabilities from papers into products.", "body": "### Collaboration contract\n\n| Topic | Agreement |\n|---|---|\n| Problem | User problem and why it matters |\n| Metric | What “better” means |\n| Data | What’s available, constraints |\n| Time box | Exploration period and checkpoints |\n| Decision | What results trigger build / stop |\n\n### Translating results\n\n| Research result | Product question |\n|---|---|\n| “F1 improved from 0.82 to 0.87” | How many more users get correct results? |\n| “Latency doubled” | Does UX still work? |\n| “Works in English only” | Which segments can launch? |"}, {"id": 152, "title": "Working with legal, privacy and policy teams", "tldr": "Bring legal, privacy and policy partners in early with clear descriptions of data flows, use cases and risks. Treat them as design partners who help you ship safely, not as last-minute gatekeepers.", "real": "Large technology companies typically require privacy reviews and, for sensitive AI features, responsible AI or policy reviews before launch; teams that involve these partners early tend to avoid late redesigns.", "body": "### What to bring\n\n| Item | Content |\n|---|---|\n| Use case description | What the feature does, for whom |\n| Data flow diagram | Inputs, processing, storage, third parties |\n| Risk assessment | Potential harms and mitigations |\n| User-facing text | Disclosures, terms, notices |\n| Launch plan | Regions, segments, timeline |\n\n### Engagement timeline\n\n```mermaid\nflowchart LR\n  IDEA[Idea stage: early consult] --> DESIGN[Design: data flow review]\n  DESIGN --> BUILD[Build: requirements tracked]\n  BUILD --> LAUNCH[Pre-launch: sign-off]\n```"}, {"id": 153, "title": "Working with executives", "tldr": "Executives need clarity on strategy, value, risk and decisions required. Bring concise narratives with data, frame AI opportunities in business terms, be honest about uncertainty, and propose clear options.", "real": "Shopify CEO Tobi Lütke’s April 2025 memo stated that reflexive AI use was a baseline expectation at Shopify and that teams should show why AI could not do a job before asking for more headcount, an example of executive AI mandates that PMs must translate into practical plans.", "body": "### Executive update format\n\n| Section | Content |\n|---|---|\n| Bottom line | Status and decision needed |\n| Results | Metrics vs goals |\n| Learnings | What we discovered |\n| Risks | Top 3 with mitigations |\n| Options | 2–3 paths with trade-offs |\n| Recommendation | Your choice and why |\n\n### Handling AI hype pressure\n\nTranslate “we need AI” into specific opportunities with expected value, cost, timeline and risks, and propose a portfolio approach."}, {"id": 154, "title": "Working with sales and customer success", "tldr": "Sales and success teams bring customer insight and need product knowledge. Share roadmaps with appropriate confidence levels, involve them in discovery, give them accurate AI positioning, and create channels for structured feedback.", "real": "B2B software companies commonly run customer advisory boards and sales-product feedback programs, where field teams submit structured requests that product teams aggregate by revenue impact and frequency.", "body": "### Collaboration mechanisms\n\n| Mechanism | Purpose |\n|---|---|\n| Field feedback form | Structured requests with deal context |\n| Monthly roadmap briefing | Shared understanding |\n| Customer calls with PM | Direct insight |\n| Win-loss reviews | Competitive learning |\n| Beta customer nominations | Early adopters |\n\n### Roadmap communication\n\n| Confidence | How to describe |\n|---|---|\n| Committed | “Available in Q2” |\n| Likely | “Planned, subject to quality bar” |\n| Exploring | “We’re investigating” |\n\nNever let sales promise uncommitted AI capabilities."}, {"id": 155, "title": "Influencing without authority", "tldr": "PMs rarely manage the people building the product. Influence through clear problem framing, shared goals, evidence, trust built through reliability, and involving people in decisions so they own them.", "real": "Product leaders such as Marty Cagan describe effective PMs as earning credibility through deep knowledge of customers, data, business and industry, rather than through formal authority over the team.", "body": "### Influence toolkit\n\n| Tool | Example |\n|---|---|\n| Customer evidence | Video clips of user struggles |\n| Data | Metrics showing impact |\n| Shared goals | Link to team OKRs |\n| Prototypes | Show, don’t tell |\n| Co-creation | Involve engineers and designers in discovery |\n| Reliability | Do what you say |\n\n### Credibility sources\n\n```mermaid\nflowchart LR\n  CUST[Know customers] --> CRED[Credibility]\n  DATA[Know the data] --> CRED\n  BIZ[Know the business] --> CRED\n  TECH[Understand the technology] --> CRED\n  CRED --> INFL[Influence]\n```"}, {"id": 156, "title": "Communicating uncertainty", "tldr": "AI work is uncertain; communicate it honestly with ranges, confidence levels, milestones and decision points. Stakeholders handle uncertainty better than surprises.", "real": "Forecasting research by Philip Tetlock, summarized in “Superforecasting” (2015), showed that expressing predictions as calibrated probabilities and updating them as evidence arrives leads to better decisions, an approach product teams adapt for uncertain projects.", "body": "### Ways to express uncertainty\n\n| Instead of | Say |\n|---|---|\n| “It’ll be ready in March” | “70% confident for March; we’ll know after the February eval checkpoint” |\n| “The AI is accurate” | “92% on our test set; lower on rare cases” |\n| “This will save money” | “Expected $200K–$400K/year depending on adoption” |\n\n### Checkpoint plan\n\n```mermaid\nflowchart LR\n  NOW[Now: prototype 82%] --> CP1[Checkpoint 1: 88%?]\n  CP1 --> CP2[Checkpoint 2: 90% + latency OK?]\n  CP2 --> LAUNCH[Launch decision]\n```"}, {"id": 157, "title": "Writing as a product leader", "tldr": "Clear writing scales a PM’s thinking: strategy narratives, PRDs, decision memos, updates and launch notes. Write for the reader, lead with the point, use specifics, and make decisions and asks explicit.", "real": "Amazon’s practice of six-page narrative memos instead of slide decks for important meetings is widely cited as a way to force clear thinking, and many product organizations have adopted written decision documents.", "body": "### Document types\n\n| Document | Purpose |\n|---|---|\n| Strategy narrative | Direction and reasoning |\n| PRD | What and why to build |\n| Decision memo | Options and recommendation |\n| Weekly update | Progress, risks, asks |\n| Launch note | What changed for users |\n| Postmortem | Learning from incidents |\n\n### Decision memo structure\n\n```\nContext → Problem → Options (with trade-offs) → Recommendation → Risks → Decision needed by\n```\n\n### Style rules\n\nShort sentences, concrete numbers, no jargon without explanation, and one clear ask."}, {"id": 158, "title": "Decision-making frameworks", "tldr": "Distinguish reversible from irreversible decisions, clarify who decides, gather input efficiently, and decide on time. For AI, many decisions (prompts, models behind flags) are reversible and should be made quickly; launches with risk deserve more care.", "real": "Jeff Bezos’s Amazon shareholder letters described “Type 1” (irreversible, high-consequence) and “Type 2” (reversible) decisions, urging fast decisions on Type 2 choices, a framework widely used by product leaders.", "body": "### Decision types\n\n| Type | Example | Approach |\n|---|---|---|\n| Reversible (two-way door) | Prompt wording, model behind a flag | Decide fast, measure |\n| Irreversible (one-way door) | Public launch with data use, pricing model change | Deliberate, broad input |\n\n### Decision roles (DACI)\n\n| Role | Meaning |\n|---|---|\n| Driver | Runs the process |\n| Approver | Makes the call |\n| Contributors | Provide input |\n| Informed | Told the outcome |\n\n### Disagree and commit\n\nOnce decided, teams commit fully while tracking agreed signals that would trigger revisiting."}, {"id": 159, "title": "Managing conflict and trade-offs", "tldr": "Conflicts arise between speed and safety, quality and cost, sales requests and strategy, and research ambition and delivery. Make trade-offs explicit, use shared goals and data, escalate cleanly when needed, and document decisions.", "real": "AI launches often involve visible tension between speed to market and safety; public incidents after rushed launches, such as Microsoft’s early Bing Chat issues in 2023, show the cost of resolving these trade-offs poorly.", "body": "### Trade-off table\n\n| Tension | Questions to resolve |\n|---|---|\n| Speed vs safety | What is the worst plausible failure? Can we contain it? |\n| Quality vs cost | Which users need the premium model? |\n| Customer request vs strategy | How many customers, how much revenue, strategic fit? |\n| Research vs delivery | What decision will the research enable? |\n\n### Escalation template\n\n```\nDecision needed: launch to all users vs limited beta\nOptions: A (all users, faster revenue, higher risk) / B (beta, safer, slower)\nRecommendation: B, because red-team found injection issues not yet fixed\nDecision owner: VP Product, by Friday\n```"}, {"id": 160, "title": "Building AI literacy across the organization", "tldr": "AI products succeed when the whole organization understands AI basics: capabilities, limits, risks, evaluation and good use. PMs can lead literacy efforts through demos, guidelines, office hours and shared examples.", "real": "Duolingo’s CEO announced in April 2025 that the company would become “AI-first”, including using AI in hiring and performance decisions, which drew public criticism and later clarification, illustrating that AI transformation also requires careful communication and change management.", "body": "### Literacy program\n\n| Element | Example |\n|---|---|\n| Basics session | How LLMs work, strengths, limits |\n| Use guidelines | Approved tools, data rules |\n| Role-specific workshops | Sales, support, engineering use cases |\n| Prompt library | Proven templates |\n| Office hours | Help with real tasks |\n| Showcase | Internal success stories |\n\n### Change management\n\n```mermaid\nflowchart LR\n  WHY[Explain why] --> SAFE[Make it safe to experiment]\n  SAFE --> SKILL[Build skills]\n  SKILL --> SHARE[Share wins]\n  SHARE --> NORM[Make it normal practice]\n```"}, {"id": 161, "title": "Playbook: copilots and AI assistants", "tldr": "Copilots help users inside their existing work: drafting, summarizing, answering and taking actions in context. Success depends on context access, permissions, workflow integration, trust UX and measured productivity gains.", "real": "Microsoft 365 Copilot (generally available to enterprises in November 2023 at $30 per user per month) grounds responses in a user’s work data through Microsoft Graph, and GitHub Copilot started as an in-editor coding assistant in 2021.", "body": "### Copilot design checklist\n\n| Area | Question |\n|---|---|\n| Context | What does the user see and work on? |\n| Permissions | Acts only with the user’s rights? |\n| Invocation | Inline, side panel, or command? |\n| Output | Suggestions with easy accept/edit? |\n| Actions | Which actions need confirmation? |\n| Measurement | Acceptance, time saved, retention |\n\n### Key metrics\n\n| Metric | Why |\n|---|---|\n| Weekly active users of copilot | Adoption |\n| Suggestion acceptance rate | Quality |\n| Tasks completed with copilot | Value |\n| Time saved (studies) | ROI |"}, {"id": 162, "title": "Playbook: enterprise search and knowledge assistants", "tldr": "Knowledge assistants answer questions from company content. Success depends on connectors, permission-aware retrieval, content quality, citations, freshness and evaluation with real employee questions.", "real": "Morgan Stanley launched a GPT-4-based assistant for its wealth management advisors in 2023 to search its large library of internal research and procedures, and Glean built a business on enterprise search across workplace apps with permission-aware results.", "body": "### Architecture (product view)\n\n```mermaid\nflowchart LR\n  APPS[Wiki, drive, tickets, chat] --> CONN[Connectors + permissions]\n  CONN --> IDX[(Search index)]\n  EMP[Employee question] --> SEARCH[Permission-aware retrieval]\n  IDX --> SEARCH\n  SEARCH --> ANSWER[Answer with citations]\n  ANSWER --> FEEDBACK[Feedback to content owners]\n```\n\n### PM priorities\n\n| Priority | Why |\n|---|---|\n| Permission correctness | Zero tolerance for leaks |\n| Content hygiene | Outdated docs cause wrong answers |\n| Citation quality | Employee trust |\n| Coverage of key sources | Usefulness |\n| Eval set of real questions | Quality bar |"}, {"id": 163, "title": "Playbook: customer support AI", "tldr": "Support AI ranges from agent assist (drafts, suggested answers) to customer-facing agents that resolve issues. Key factors: knowledge quality, policy enforcement, authenticated actions, escalation design, and metrics like resolution rate and CSAT.", "real": "Klarna reported in 2024 that its AI assistant handled two-thirds of customer service chats in its first month; Intercom prices its Fin agent per resolution; and the 2024 Moffatt v. Air Canada decision held a company liable for its chatbot’s incorrect policy statement.", "body": "### Maturity path\n\n```mermaid\nflowchart LR\n  A[Agent assist: drafts] --> B[Self-service answers]\n  B --> C[Authenticated actions: order status]\n  C --> D[Policy-bounded actions: refunds within limits]\n  D --> E[Proactive support]\n```\n\n### Metrics\n\n| Metric | Meaning |\n|---|---|\n| Resolution rate | Issues solved without human |\n| Escalation rate | Handed to humans |\n| CSAT | Satisfaction |\n| Recontact rate | Real resolution check |\n| Policy violations | Must be zero |\n| Cost per resolution | Economics |"}, {"id": 164, "title": "Playbook: AI coding tools", "tldr": "Coding AI spans inline completion, chat, code review and autonomous agents. Developers value speed, accuracy in their codebase, control over changes, and integration with their tools. Security and code quality are key concerns.", "real": "GitHub Copilot, Cursor, Claude Code and OpenAI’s Codex illustrate the evolution from inline suggestions to agents that edit multiple files, run tests and open pull requests, while a 2022 GitHub study reported 55% faster completion of a coding task with Copilot.", "body": "### Product layers\n\n| Layer | Latency need | Key metric |\n|---|---|---|\n| Inline completion | Very low | Acceptance rate |\n| Chat in IDE | Low | Helpfulness, answer accuracy |\n| Code review | Medium | Useful comments ratio |\n| Agents | Minutes OK | Task success, PR merge rate |\n\n### Concerns to address\n\n| Concern | Response |\n|---|---|\n| Code quality | Tests, linters, review |\n| Security | Vulnerability scanning, sandboxing |\n| IP and licensing | Code reference filters, policies |\n| Privacy | No training on customer code without consent |\n| Control | Approvals for commands and changes |"}, {"id": 165, "title": "Playbook: content generation products", "tldr": "Content generation (marketing copy, images, video, documents) must balance creativity, brand consistency, factual accuracy, IP safety and scale. Templates, brand controls, review workflows and provenance labeling are central.", "real": "Adobe launched Firefly in 2023 with models trained on licensed and public-domain content and integrated it into Photoshop and Express, positioning it as commercially safe for businesses, and attached Content Credentials to generated images.", "body": "### Product components\n\n| Component | Purpose |\n|---|---|\n| Templates | Consistent structure |\n| Brand voice controls | Tone, terminology |\n| Fact sources | Product data for accuracy |\n| Review and approval | Quality and compliance |\n| Provenance labels | Transparency |\n| Usage rights | Commercial safety |\n\n### Workflow\n\n```mermaid\nflowchart LR\n  BRIEF[Brief / template] --> GEN[Generate variations]\n  GEN --> CHECK[Brand + claims checks]\n  CHECK --> REVIEW[Human review]\n  REVIEW --> PUBLISH[Publish with labels]\n  PUBLISH --> PERF[Performance data]\n  PERF --> BRIEF\n```"}, {"id": 166, "title": "Playbook: recommendations and personalization", "tldr": "Recommendation products choose what to show each user from large catalogs. Combine retrieval and ranking models with business rules, diversity, exploration and safety, and optimize for long-term satisfaction, not just clicks.", "real": "Netflix has reported that about 80% of hours streamed come from recommendations, Spotify launched an AI DJ in 2023 that combines personalized picks with generated voice commentary, and Amazon launched its Rufus shopping assistant in 2024.", "body": "### Product decisions\n\n| Decision | Example |\n|---|---|\n| Objective | Engagement vs satisfaction vs revenue |\n| Surfaces | Home feed, “because you watched”, search |\n| Diversity | Avoid repetitive suggestions |\n| Exploration | New content discovery |\n| Explanations | “Because you liked X” |\n| Controls | Hide, not interested, preferences |\n\n### Generative + recommendation\n\n```mermaid\nflowchart LR\n  REC[Recommendation engine] --> ITEMS[Ranked items]\n  ITEMS --> LLM[LLM explains / converses]\n  LLM --> USER[Conversational discovery]\n  USER --> SIGNALS[Feedback signals]\n  SIGNALS --> REC\n```"}, {"id": 167, "title": "Playbook: AI in regulated domains: healthcare", "tldr": "Healthcare AI needs clinical validation, regulatory compliance, privacy, workflow fit, clinician trust and clear accountability. Validate on representative populations and monitor real-world performance, because lab results often overstate impact.", "real": "A 2021 study in JAMA Internal Medicine found that a widely used sepsis prediction model from Epic missed about two-thirds of sepsis cases in external validation at Michigan Medicine, while the US FDA has authorized well over a thousand AI-enabled medical devices, showing both the promise and the need for rigorous validation.", "body": "### Requirements\n\n| Area | Requirement |\n|---|---|\n| Regulation | Medical device rules where applicable (e.g. FDA, EU MDR) |\n| Validation | External validation on representative data |\n| Privacy | HIPAA (US) or equivalent health data rules |\n| Workflow | Fits clinical routines without alert fatigue |\n| Explainability | Clinicians understand basis of outputs |\n| Accountability | Clinician remains responsible for decisions |\n| Monitoring | Real-world performance tracking |\n\n### Lower-risk entry points\n\nAmbient documentation (drafting clinical notes from conversations for clinician review), administrative automation and patient communication drafts."}, {"id": 168, "title": "Playbook: AI in financial services", "tldr": "Financial AI (credit, fraud, advice, support) must meet requirements for fairness, explainability, model risk management, consumer protection and data security. Human oversight and documentation are essential.", "real": "US banking regulators’ model risk management guidance (SR 11-7, 2011) requires validation and governance of models, and the Consumer Financial Protection Bureau stated in 2022 that lenders must give specific reasons for adverse credit decisions even when using complex algorithms.", "body": "### Use cases and risk\n\n| Use case | Risk level | Key requirement |\n|---|---|---|\n| Fraud detection | Medium | Low false positives, fast appeals |\n| Credit decisions | High | Fair lending, adverse action reasons |\n| Advisor assistants | Medium | Accuracy, compliance review |\n| Customer service | Medium | Accurate policy, disclosures |\n| Document processing | Lower | Accuracy, audit trail |\n\n### Governance essentials\n\nModel inventory, independent validation, documentation, monitoring, fairness testing, and clear human accountability."}, {"id": 169, "title": "Playbook: AI in education", "tldr": "Education AI can personalize learning, give feedback and support teachers, but must protect learning integrity, student privacy (often minors), accuracy and equity. Design AI as a tutor that guides thinking, not an answer machine.", "real": "Khan Academy launched Khanmigo, built on GPT-4, in 2023 as a tutor designed to guide students with questions rather than simply give answers, and Duolingo launched Duolingo Max with GPT-4-powered features such as “Explain My Answer” the same year.", "body": "### Design principles\n\n| Principle | Example |\n|---|---|\n| Socratic guidance | Ask leading questions instead of giving answers |\n| Teacher visibility | Teachers see student interactions |\n| Age-appropriate safety | Strict content filters for minors |\n| Accuracy | Grounded in curriculum |\n| Equity | Works on low-end devices, multiple languages |\n| Privacy | Compliance with student data laws |\n\n### Metrics\n\nLearning outcomes (assessments), engagement, teacher time saved and safety incidents, not just usage."}, {"id": 170, "title": "Playbook: voice and multimodal products", "tldr": "Voice and multimodal AI products need low latency, natural turn-taking, robustness to accents and noise, clear handling of errors, privacy for audio and images, and accessibility benefits.", "real": "OpenAI released its Realtime API in October 2024 for low-latency speech-to-speech applications, and Amazon announced Alexa+, an LLM-powered upgrade to Alexa, in February 2025, reflecting a shift toward conversational voice products.", "body": "### Voice UX requirements\n\n| Requirement | Target |\n|---|---|\n| Response start | Under \\~1 second |\n| Interruptions | Stop speaking when user talks |\n| Confirmation | Repeat back critical details |\n| Errors | Ask to rephrase gracefully |\n| Privacy | Clear recording indicators and controls |\n\n### Multimodal flow\n\n```mermaid\nflowchart LR\n  IN[Voice / image / text input] --> UNDERSTAND[Multimodal understanding]\n  UNDERSTAND --> ACT[Answer or action]\n  ACT --> OUT[Voice / visual output]\n  OUT --> CONFIRM[Confirm critical actions]\n```"}, {"id": 171, "title": "Designing agent products", "tldr": "Agent products complete multi-step tasks on behalf of users. Define the task scope, success criteria, tools and permissions, autonomy level, verification, user oversight and economics. Start narrow with high-value, verifiable tasks.", "real": "Coding agents became one of the first widely adopted agent categories because code tasks can be verified with tests; tools such as Claude Code, OpenAI’s Codex, Cursor and GitHub Copilot’s coding agent all lean on test runs and pull requests for verification.", "body": "### Agent product canvas\n\n| Element | Example |\n|---|---|\n| Task | Reconcile invoices against purchase orders |\n| User | Accounts payable specialist |\n| Success criteria | Matches correct; exceptions flagged |\n| Tools | ERP read, email draft, spreadsheet |\n| Permissions | Read-only ERP; drafts only for emails |\n| Autonomy | Prepares; human approves postings |\n| Verification | Totals reconcile; sample audits |\n| Economics | Cost per invoice vs manual time |\n\n### Good first agent tasks\n\nFrequent, time-consuming, verifiable, low-risk to get wrong, and tolerant of review steps."}, {"id": 172, "title": "Levels of autonomy", "tldr": "Define explicit autonomy levels, from suggestions to fully autonomous action, and move up only as reliability is proven. Users and admins should be able to choose levels appropriate to their risk tolerance.", "real": "The SAE J3016 standard defines six levels of driving automation (0–5), a framework widely used to communicate how much a vehicle does versus the driver. AI product teams increasingly borrow this idea to define agent autonomy levels.", "body": "### Autonomy levels for agents (adapted)\n\n| Level | Agent does | Human does |\n|---|---|---|\n| 0 | Nothing | Everything |\n| 1 | Suggests | Decides and acts |\n| 2 | Drafts actions | Approves each |\n| 3 | Acts on routine cases | Approves exceptions |\n| 4 | Acts within policy limits | Monitors and audits |\n| 5 | Fully autonomous | Sets goals only |\n\n### Progression\n\n```mermaid\nflowchart LR\n  L1[Level 1: suggest] -->|accuracy proven| L2[Level 2: approve each]\n  L2 -->|low override rate| L3[Level 3: routine auto]\n  L3 -->|audits clean| L4[Level 4: within limits]\n```"}, {"id": 173, "title": "Tool ecosystems and MCP for product managers", "tldr": "Agents become useful by connecting to tools and data. Standards such as the Model Context Protocol (MCP) let products integrate with many tools and let your product become a tool for other AI clients. Each integration is a product, security and support decision.", "real": "Anthropic released MCP in November 2024; it was adopted by OpenAI, Google, Microsoft and many developer tools, and in December 2025 it was donated to the Linux Foundation’s Agentic AI Foundation, which said more than 10,000 MCP servers had been published.", "body": "### Two strategic questions\n\n| Question | Example |\n|---|---|\n| Which tools should our agent use? | CRM, email, calendar, docs |\n| Should our product be a tool for others’ agents? | Publish an MCP server for our API |\n\n### Integration decisions\n\n| Decision | Consideration |\n|---|---|\n| Which integrations first | Customer demand, value |\n| Permissions model | User-delegated OAuth, scopes |\n| Security review | Third-party server risk |\n| Support | Who fixes broken integrations |\n| Discovery | How users find and enable tools |\n\n### Ecosystem flywheel\n\n```mermaid\nflowchart LR\n  INTEG[More integrations] --> VALUE[More useful agent]\n  VALUE --> USERS[More users]\n  USERS --> PARTNERS[More partners build integrations]\n  PARTNERS --> INTEG\n```"}, {"id": 174, "title": "Reliability for agent products", "tldr": "Agents fail in compounding ways across many steps. Improve reliability with narrow scope, good tools, verification steps, checkpoints, retries, budgets, human escalation and clear definitions of done. Measure consistency, not just one-off success.", "real": "Sierra’s tau-bench (2024) introduced the pass^k metric, the probability that an agent succeeds on all of k attempts, and showed that agents with decent single-attempt success could be much less consistent across repeated attempts.", "body": "### Why reliability compounds\n\n```\nIf each step succeeds 95% of the time:\n5 steps → 0.95^5 ≈ 77% task success\n10 steps → 0.95^10 ≈ 60%\n20 steps → 0.95^20 ≈ 36%\n```\n\n### Compounding step reliability\n\n```chart\n{\"title\": \"Task success when each step succeeds 95% of the time\", \"unit\": \"%\", \"data\": [[\"5 steps\", 77], [\"10 steps\", 60], [\"20 steps\", 36]]}\n```\n\n### Reliability levers\n\n| Lever | Effect |\n|---|---|\n| Fewer, better tools | Fewer error opportunities |\n| Verification after key steps | Catch errors early |\n| Checkpoints and resumability | Recover from failures |\n| Human escalation | Handle uncertainty |\n| Budgets | Stop runaway loops |"}, {"id": 175, "title": "Evaluating agents", "tldr": "Evaluate agents on realistic tasks in reproducible environments, grading outcomes, consistency across runs, cost, time, safety and need for human intervention. Combine public benchmarks with private task suites from your own users.", "real": "Benchmarks such as SWE-bench Verified (coding), tau-bench (customer service tasks), OSWorld (computer use) and GAIA (general assistant tasks) are widely used to compare agents, while companies build private task suites from real workflows to decide what to ship.", "body": "### Agent eval metrics\n\n| Metric | Meaning |\n|---|---|\n| Task success | Outcome correct |\n| pass^k | Consistency across k runs |\n| Steps and time | Efficiency |\n| Cost per task | Economics |\n| Intervention rate | Human help needed |\n| Safety violations | Unauthorized or harmful actions |\n\n### Private task suite\n\n```mermaid\nflowchart LR\n  REAL[Real user tasks] --> ENV[Reproducible environments]\n  ENV --> RUN[Run agent k times]\n  RUN --> GRADE[Automatic outcome checks]\n  GRADE --> REPORT[Success, consistency, cost]\n```"}, {"id": 176, "title": "Pricing agent products", "tldr": "Agents consume variable compute and deliver variable value, so pricing often moves toward usage or outcomes: per task, per resolution, per agent hour, or credits, sometimes combined with platform fees. Protect margins with limits and routing.", "real": "Salesforce launched Agentforce in 2024 at $2 per conversation, later adding other pricing options, and Intercom charges $0.99 per resolution for its Fin agent, early examples of usage- and outcome-based agent pricing.", "body": "### Options\n\n| Model | Fit | Risk |\n|---|---|---|\n| Per task / action | Clear unit of work | Variable task difficulty |\n| Per outcome | Measurable results | Disputes over outcome definition |\n| Credits | Flexible, many task types | Complex for buyers |\n| Agent seat | Predictable | Misaligned with usage |\n| Platform + usage | Enterprise budgeting | Complexity |\n\n### Margin check\n\n```\nPrice per task − (average tokens × price + tool costs + human escalation cost) = contribution\nWatch the long tail: complex tasks may cost 10–50× the average.\n```"}, {"id": 177, "title": "UX for long-running and background work", "tldr": "When agents work for minutes or hours, users need confidence without watching: clear task definitions, progress indicators, notifications, intermediate checkpoints, the ability to intervene, and reviewable results with evidence.", "real": "Research and coding agents such as deep research features in ChatGPT and Gemini and cloud coding agents run for many minutes, notify users when finished, and present reports or pull requests that summarize work and show sources or diffs.", "body": "### UX elements\n\n| Element | Purpose |\n|---|---|\n| Task brief confirmation | Avoid wasted work |\n| Progress view | Reassurance and transparency |\n| Notifications | Return users at completion |\n| Checkpoints | Approve direction midway |\n| Intervene / redirect | Fix course early |\n| Result summary | Fast review |\n| Evidence (sources, diffs, logs) | Verification |\n\n### Lifecycle\n\n```mermaid\nflowchart LR\n  BRIEF[Confirm brief] --> WORK[Background work]\n  WORK --> CHECK[Checkpoint if needed]\n  CHECK --> DONE[Notify + summary]\n  DONE --> REVIEW[User reviews evidence]\n```"}, {"id": 178, "title": "Multi-agent products", "tldr": "Some products use multiple specialized agents (researcher, writer, reviewer) or let agents collaborate. They can improve breadth and quality but increase cost, latency and coordination failures. Use them where the task truly benefits.", "real": "Anthropic reported in June 2025 that its multi-agent research system outperformed a single agent by 90.2% on an internal evaluation but used about 15 times more tokens than a chat interaction, a clear example of the quality–cost trade-off.", "body": "### When multi-agent helps\n\n| Helps | Hurts |\n|---|---|\n| Broad research across many sources | Tightly coupled tasks |\n| Parallel independent subtasks | Low-value, cheap tasks |\n| Separate generation and review | Shared evolving context |\n\n### Pattern\n\n```mermaid\nflowchart TB\n  LEAD[Lead agent: plan] --> A1[Specialist 1]\n  LEAD --> A2[Specialist 2]\n  LEAD --> A3[Specialist 3]\n  A1 --> SYN[Synthesis]\n  A2 --> SYN\n  A3 --> SYN\n  SYN --> REVIEW[Reviewer agent]\n  REVIEW --> USER[User]\n```\n\n### PM decision\n\nJustify extra cost with measured quality gains on your eval suite."}, {"id": 179, "title": "Safety for agent products", "tldr": "Agents can take real actions, so failures cause real harm. Apply least privilege, confirmations for sensitive actions, sandboxing, prompt-injection defenses, spending limits, audit logs and kill switches. Design so a manipulated agent cannot do serious damage.", "real": "In July 2025 a malicious prompt was inserted into Amazon Q Developer’s VS Code extension instructing the agent to delete files and cloud resources; AWS said the code was not functional enough to cause harm and removed the version, highlighting supply-chain and injection risks for agents.", "body": "### Safety controls\n\n| Control | Example |\n|---|---|\n| Least privilege | Scoped tokens per task |\n| Confirmations | Payments, deletions, external messages |\n| Sandboxing | Isolated environments for code and browsing |\n| Injection defense | Treat web pages, emails and documents as untrusted |\n| Limits | Max spend, max actions per hour |\n| Audit logs | Every action recorded |\n| Kill switch | Disable agent instantly |\n\n### Risk-based design\n\n```mermaid\nflowchart LR\n  ACTION[Proposed action] --> RISK{Risk level}\n  RISK -->|read-only| AUTO[Auto]\n  RISK -->|reversible| LOG[Auto + log]\n  RISK -->|external / financial| CONFIRM[Human confirmation]\n  RISK -->|destructive| BLOCK[Block or require admin]\n```"}, {"id": 180, "title": "The future of agentic products", "tldr": "Agents are moving from assistants to coworkers that handle longer tasks across tools. Expect standardized tool ecosystems, agent identity and permissions, outcome-based pricing, better reliability and new UX patterns. PMs will define the boundaries between human and agent work.", "real": "METR’s research reported that the length of tasks AI agents can complete with 50% reliability has been doubling roughly every seven months, and the formation of the Agentic AI Foundation in December 2025 signaled industry investment in shared agent standards.", "body": "### Trends\n\n| Trend | Product implication |\n|---|---|\n| Longer task horizons | Background work UX, checkpoints |\n| Tool standards (MCP and others) | Faster integrations, ecosystem plays |\n| Agent identity and permissions | Enterprise admin features |\n| Outcome pricing | New business models |\n| Better verification | Higher autonomy levels |\n| Human–agent teams | Workflow redesign |\n\n### PM questions for the next five years\n\n- Which parts of our users’ work will agents do, and which remain human?\n- How do we earn enough trust to increase autonomy?\n- How do we price value when agents replace labor?"}, {"id": 181, "title": "Platform product management for AI", "tldr": "Platform PMs build capabilities that other teams or developers use: model gateways, RAG services, evaluation tools, agent runtimes or public APIs. Their customers are developers, and success is measured by adoption, developer productivity and the value created on top.", "real": "Amazon Bedrock (launched in 2023), Azure AI Foundry and Google Vertex AI are AI platforms whose product managers serve developers building applications, and many large companies run internal AI platforms for the same purpose.", "body": "### Platform vs application PM\n\n| | Application PM | Platform PM |\n|---|---|---|\n| Customer | End users | Developers / internal teams |\n| Success | User outcomes | Adoption, apps built, time to ship |\n| Product surface | UI | APIs, SDKs, docs, consoles |\n| Key quality | UX | Reliability, flexibility, DX |\n\n### Platform layers\n\n```mermaid\nflowchart TB\n  APPS[Applications built by teams] --> SDK[SDKs and templates]\n  SDK --> SERVICES[Gateway, RAG, evals, agent runtime]\n  SERVICES --> MODELS[Models and infrastructure]\n```"}, {"id": 182, "title": "Developer experience for AI APIs", "tldr": "Great AI developer experience means fast time to first success, clear docs with working examples, predictable APIs, good error messages, playgrounds, SDKs in popular languages, transparent pricing and usage dashboards.", "real": "OpenAI’s chat completions API format became so widely adopted that many other providers and open-source inference servers, such as vLLM, implement OpenAI-compatible endpoints so developers can switch with minimal code changes.", "body": "### DX checklist\n\n- [ ] Quickstart that works in under 5 minutes\n- [ ] Copy-paste examples in major languages\n- [ ] Interactive playground\n- [ ] Clear error messages with fixes\n- [ ] Rate limits and pricing documented\n- [ ] Usage and cost dashboard\n- [ ] Changelog and deprecation policy\n- [ ] Status page\n\n### DX metrics\n\n| Metric | Meaning |\n|---|---|\n| Time to first successful call | Onboarding friction |\n| Activation rate | Sign-ups making real usage |\n| Developer retention | Ongoing usage |\n| Support tickets per developer | Doc and API clarity |\n| Apps in production | Platform value |"}, {"id": 183, "title": "Enterprise requirements for AI products", "tldr": "Enterprises require security, privacy, compliance, administration and reliability before adopting AI: SSO, role-based access, audit logs, data residency, no training on their data, retention controls, certifications, SLAs and admin governance.", "real": "Enterprise offerings such as ChatGPT Enterprise (launched in August 2023) and Claude for Enterprise advertised that business data is not used for training by default, along with SSO, admin controls and security certifications, reflecting standard enterprise AI requirements.", "body": "### Enterprise readiness checklist\n\n| Area | Requirement |\n|---|---|\n| Identity | SSO (SAML/OIDC), SCIM provisioning |\n| Access | Role-based permissions |\n| Data | No training on customer data; retention controls; residency |\n| Security | Encryption, certifications (SOC 2, ISO 27001) |\n| Compliance | DPAs, sector requirements |\n| Audit | Logs of usage and admin actions |\n| Admin | Usage analytics, policy controls |\n| Reliability | SLAs, support tiers |\n\n### Why it matters\n\nMissing enterprise features block deals regardless of AI quality; prioritize them early for B2B products."}, {"id": 184, "title": "Admin controls and AI governance features", "tldr": "Enterprise admins need controls over AI: which features are enabled, which users and groups can use them, data source connections, model choices, content policies, usage limits and visibility into usage. Governance features are product features.", "real": "Workplace AI products such as Microsoft 365 Copilot and Google Workspace’s Gemini features provide admin centers where IT can control availability, data access and policies, because enterprises require central governance before broad rollout.", "body": "### Admin control set\n\n| Control | Example |\n|---|---|\n| Feature toggles | Enable AI features by group |\n| Data connectors | Approve which sources AI can access |\n| Model policy | Allowed models / regions |\n| Content policy | Blocked topics, PII handling |\n| Usage limits | Per user or group |\n| Analytics | Adoption and usage reports |\n| Audit logs | Export for compliance |\n\n### Admin journey\n\n```mermaid\nflowchart LR\n  SETUP[Setup and policies] --> PILOT[Pilot group]\n  PILOT --> REVIEW[Review usage + risks]\n  REVIEW --> EXPAND[Expand to organization]\n  EXPAND --> GOVERN[Ongoing governance]\n```"}, {"id": 185, "title": "Internal AI platforms", "tldr": "Large organizations build internal AI platforms so teams can use approved models safely: a gateway with policies and logging, shared retrieval and evaluation services, templates and training. The platform PM balances speed for teams with governance.", "real": "Uber has described an internal GenAI gateway that gives its teams unified access to multiple model providers with logging and policy controls, an approach many large enterprises have adopted to manage AI usage centrally.", "body": "### Internal platform components\n\n```mermaid\nflowchart LR\n  TEAMS[Product teams] --> PORTAL[Developer portal + templates]\n  PORTAL --> GW[AI gateway: auth, routing, logging, cost]\n  GW --> MODELS[Approved models]\n  PORTAL --> RAG[Shared RAG service]\n  PORTAL --> EVAL[Eval service]\n  GOV[Governance: policies, reviews] -.-> GW\n```\n\n### Success metrics\n\n| Metric | Meaning |\n|---|---|\n| Teams onboarded | Reach |\n| Time to production | Speed |\n| Shadow AI reduction | Governance |\n| Cost visibility | Financial control |\n| Incidents | Safety |"}, {"id": 186, "title": "Partnerships and ecosystems", "tldr": "AI products often depend on partnerships: model providers, cloud platforms, data partners, integration partners and distribution channels. Choose partners strategically, structure agreements to protect your position, and build ecosystems that create mutual value.", "real": "Microsoft’s large investment in and partnership with OpenAI from 2019 onward shaped Azure’s AI offerings and Copilot products, and Amazon’s investment in Anthropic made Claude models a central part of Amazon Bedrock, examples of partnerships defining AI strategy.", "body": "### Partnership types\n\n| Type | Example value |\n|---|---|\n| Model provider | Access to frontier models, pricing |\n| Cloud platform | Distribution, credits, marketplace |\n| Data partner | Unique data for quality |\n| Integration partner | Workflow reach |\n| Channel partner | Customer access |\n\n### Evaluation questions\n\n- What do we gain that we can’t build?\n- What dependency risk do we take?\n- How are data rights handled?\n- What happens if the partnership ends?"}, {"id": 187, "title": "Plugins, apps and marketplaces", "tldr": "Platforms let third parties extend AI products through plugins, apps or tools. Marketplaces create ecosystem value but need quality standards, security review, discovery, monetization and policy enforcement.", "real": "OpenAI introduced ChatGPT plugins in March 2023, replaced them with GPTs and the GPT Store (launched January 2024), and later released an Apps SDK in October 2025 for apps inside ChatGPT, showing how platform extension models evolve.", "body": "### Ecosystem design\n\n| Element | Question |\n|---|---|\n| Extension model | Tools, apps, agents, prompts? |\n| Developer incentives | Revenue share, distribution |\n| Quality bar | Review process, ratings |\n| Security | Permissions, data access review |\n| Discovery | Search, recommendations |\n| Policy | Prohibited uses, enforcement |\n\n### Lifecycle lessons\n\n```mermaid\nflowchart LR\n  LAUNCH[Launch extension model] --> LEARN[Learn usage patterns]\n  LEARN --> SIMPLIFY[Simplify or replace]\n  SIMPLIFY --> SCALE[Scale what works]\n```"}, {"id": 188, "title": "Scaling AI across a product portfolio", "tldr": "When many products add AI, coordinate: shared design patterns, a common platform, consistent quality and safety standards, unified branding where helpful, and avoiding duplicated effort or confusing user experiences.", "real": "Microsoft unified many AI features under the “Copilot” brand across Windows, Microsoft 365, GitHub and other products, and Google similarly brought AI features under the Gemini brand, illustrating portfolio-level coordination.", "body": "### Coordination mechanisms\n\n| Mechanism | Purpose |\n|---|---|\n| Shared AI platform | Consistent infrastructure |\n| Design system for AI patterns | Consistent UX (labels, feedback, citations) |\n| Quality and safety standards | Same bar everywhere |\n| Brand guidelines | Clear, consistent naming |\n| AI product council | Prioritization and overlap resolution |\n\n### Common anti-patterns\n\n- Every team builds its own chatbot\n- Different feedback buttons and AI labels across products\n- Duplicate vendor contracts and inconsistent data policies"}, {"id": 189, "title": "Leading AI transformation programs", "tldr": "AI transformation changes how a whole organization works: process redesign, tooling, skills, governance and culture. PMs often lead parts of it, applying product thinking: user research with employees, pilots, metrics and iteration.", "real": "Shopify’s April 2025 internal memo from CEO Tobi Lütke, later shared publicly, set AI usage as a baseline expectation, while Duolingo’s “AI-first” announcement the same month drew public backlash, showing that how transformation is framed and communicated matters greatly.", "body": "### Transformation framework\n\n```mermaid\nflowchart LR\n  ASSESS[Assess processes and opportunities] --> PILOT[Pilot high-value use cases]\n  PILOT --> MEASURE[Measure value]\n  MEASURE --> SCALE[Scale + redesign processes]\n  SCALE --> SKILLS[Training and change management]\n  SKILLS --> GOVERN[Governance]\n```\n\n### Employees as users\n\nTreat employees as users: research their workflows, involve them in design, measure adoption and satisfaction, and address concerns about job changes honestly.\n\n### Metrics\n\nProcess cycle time, quality, employee adoption, satisfaction, cost, and risk incidents."}, {"id": 190, "title": "Measuring AI impact at the organization level", "tldr": "Leaders need to know whether AI investments pay off across the organization: productivity, quality, revenue, cost, risk and employee experience. Combine usage analytics, controlled studies, financial metrics and surveys, and be honest about uncertainty.", "real": "Research on AI and productivity has produced mixed results: some controlled studies, such as studies of customer support agents and developers, found significant productivity gains, while surveys of enterprises report that many generative AI pilots have not yet produced measurable financial impact.", "body": "### Measurement framework\n\n| Dimension | Example metrics |\n|---|---|\n| Adoption | Active users, use cases live |\n| Productivity | Time saved, throughput |\n| Quality | Error rates, customer satisfaction |\n| Financial | Cost savings, revenue influenced |\n| Risk | Incidents, compliance findings |\n| People | Employee satisfaction, skills |\n\n### Evidence strength\n\n```chart\n{\"title\": \"Strength of evidence by method (relative, guideline)\", \"unit\": \"/5\", \"data\": [[\"Randomized controlled study\", 5], [\"Before/after with control group\", 4], [\"Usage analytics\", 3], [\"Self-reported surveys\", 2], [\"Anecdotes\", 1]]}\n```\n\nPrefer stronger methods for major investment decisions."}, {"id": 191, "title": "The AI PM career path", "tldr": "AI PMs come from product, engineering, data science, design and domain backgrounds. Paths lead from AI feature PM to AI product lead, platform PM, group PM, and head of AI product. Build a track record of shipped AI products with measured outcomes.", "real": "Major technology companies and AI labs post roles such as “AI product manager”, “product manager, generative AI” and “product manager, applied AI”, typically asking for experience shipping ML or LLM features, defining evaluation metrics and collaborating with research teams.", "body": "### Career ladder\n\n```mermaid\nflowchart LR\n  APM[Associate PM] --> PM[AI feature PM]\n  PM --> SPM[Senior AI PM]\n  SPM --> LEAD[AI product lead / group PM]\n  LEAD --> DIR[Director of AI product]\n  SPM --> PLAT[AI platform PM]\n  DIR --> HEAD[Head of AI / CPO]\n```\n\n### Entry paths\n\n| Background | Strength | Gap to close |\n|---|---|---|\n| Product manager | Product skills | AI literacy, evals |\n| Software engineer | Technical depth | Customer discovery, strategy |\n| Data scientist | Models, metrics | Product judgment, communication |\n| Designer | User empathy | Business and technical depth |\n| Domain expert | Industry knowledge | Product and AI skills |"}, {"id": 192, "title": "Building your AI PM skills and portfolio", "tldr": "Learn by building: prototype AI features with APIs, create eval sets, write PRDs and strategy memos, analyze AI products critically, and publish case studies. A portfolio of real artifacts beats certificates.", "real": "Many AI PMs build public portfolios of small AI projects, product teardowns and writing, and model providers’ free playgrounds and documentation make it possible to prototype AI features without engineering support.", "body": "### Portfolio projects\n\n| Project | Shows |\n|---|---|\n| RAG assistant over a public dataset | Retrieval, evals, UX |\n| Eval set + LLM judge for a task | Quality thinking |\n| PRD for an AI feature | Product definition |\n| Product teardown of an AI app | Product sense |\n| Pricing analysis of AI products | Business thinking |\n| Responsible AI assessment | Risk judgment |\n\n### 90-day learning plan\n\n| Month | Focus |\n|---|---|\n| 1 | AI fundamentals, prompting, build a prototype |\n| 2 | Evals, RAG, metrics; write a PRD |\n| 3 | Strategy, pricing, safety; publish case study |"}, {"id": 193, "title": "Interviewing for AI PM roles", "tldr": "AI PM interviews test product sense, AI technical judgment, metrics, strategy, execution and behavioral skills. Structure answers: clarify, define users and goals, propose solutions, address AI quality and risk, define metrics, and discuss trade-offs.", "real": "Product management interviews at large technology companies commonly include product design, metrics and strategy questions, and AI PM interviews add prompts like “design an AI assistant for X” or “how would you evaluate this LLM feature?”.", "body": "### Answer framework for AI product design questions\n\n```mermaid\nflowchart LR\n  C[Clarify goal and users] --> J[Jobs and pain points]\n  J --> S[Solutions incl. non-AI]\n  S --> A[AI approach: model, data, RAG, agents]\n  A --> Q[Quality: evals, failure handling]\n  Q --> R[Risks: safety, privacy, cost]\n  R --> M[Metrics + launch plan

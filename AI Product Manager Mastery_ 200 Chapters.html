]\n  M --> T[Trade-offs]\n```\n\n### Common questions\n\n| Type | Example |\n|---|---|\n| Design | “Design an AI travel planner.” |\n| Evaluation | “How do you know if our AI support bot is good?” |\n| Metrics | “Usage dropped 20% after a model update. Investigate.” |\n| Strategy | “Should we build or buy our LLM?” |\n| Ethics | “Our AI performs worse for one language. What do you do?” |"}, {"id": 194, "title": "Capstone: AI customer support agent", "tldr": "Design an AI support agent end to end: problem and users, scope, knowledge and tools, autonomy levels, eval set, guardrails, UX with escalation, metrics, pricing impact, launch plan and operations.", "real": "This capstone combines lessons from public cases: Klarna’s large-scale AI assistant (2024), Intercom’s per-resolution pricing for Fin, and the 2024 Air Canada chatbot ruling that made accurate policy answers a legal requirement.", "body": "### Plan summary\n\n| Area | Decision |\n|---|---|\n| Users | E-commerce customers; support team |\n| Scope v1 | Order status, returns, delivery questions |\n| Knowledge | Help center + policy docs (owned, versioned) |\n| Tools | Order lookup (read), return initiation (≤ policy limits) |\n| Autonomy | Level 3: routine actions automatic; exceptions to humans |\n| Eval set | 300 real conversations; policy, tone, injection cases |\n| Guardrails | Policy engine in code; no promises beyond policy |\n| UX | Disclosure, citations, “talk to a person” always visible |\n| Metrics | Resolution rate, CSAT, recontact, cost per resolution |\n| Launch | 5% traffic → 25% → 100% with weekly reviews |\n\n### Architecture\n\n```mermaid\nflowchart LR\n  CUST[Customer] --> AGENT[Support agent]\n  AGENT --> KB[Knowledge retrieval]\n  AGENT --> TOOLS[Order + returns tools]\n  TOOLS --> POLICY[Policy engine]\n  AGENT --> GUARD[Guardrails]\n  AGENT -->|escalate| HUMAN[Human agent with summary]\n```"}, {"id": 195, "title": "Capstone: enterprise knowledge assistant", "tldr": "Design an internal assistant answering employee questions from company documents with permissions, citations and feedback loops, plus the rollout and adoption plan that makes it valuable.", "real": "This capstone reflects patterns from Morgan Stanley’s 2023 advisor assistant and Microsoft 365 Copilot rollouts, where permission-aware retrieval and content hygiene proved as important as model quality.", "body": "### Plan summary\n\n| Area | Decision |\n|---|---|\n| Users | 10,000 employees; HR, IT, sales first |\n| Sources | Wiki, HR policies, IT knowledge base |\n| Permissions | Respect document ACLs at retrieval |\n| Quality bar | ≥ 90% correct with citations on 250 golden questions |\n| Content hygiene | Owners and review dates for top 500 documents |\n| UX | Citations, “I don’t know”, feedback to content owners |\n| Metrics | Weekly active users, answer rating, ticket deflection |\n| Rollout | Pilot with 2 departments, then organization-wide |\n\n### Phase plan\n\n```mermaid\nflowchart LR\n  P1[Content cleanup + connectors] --> P2[Pilot: HR + IT]\n  P2 --> P3[Eval + feedback improvements]\n  P3 --> P4[Org-wide launch + champions]\n  P4 --> P5[Add actions: tickets, requests]\n```"}, {"id": 196, "title": "Capstone: AI feature in a consumer app", "tldr": "Design an AI feature for a consumer app, such as smart trip planning in a travel app, covering user research, scope, model choice, UX for trust, safety for broad audiences, cost per user, metrics and staged launch.", "real": "Consumer AI launches such as Spotify’s AI DJ (2023) and Amazon’s Rufus shopping assistant (2024) show the pattern of embedding AI into existing consumer experiences with careful scope and gradual rollout.", "body": "### Plan summary (AI trip planner)\n\n| Area | Decision |\n|---|---|\n| Job | “Plan a 3-day trip that fits my budget and interests” |\n| Scope v1 | Itinerary drafts using app’s hotels and activities |\n| Grounding | Real availability and prices from catalog |\n| UX | Editable itinerary, sources, quick swaps |\n| Safety | Travel advisories, no unsafe recommendations |\n| Cost | Small model for drafts; cache popular destinations |\n| Metrics | Itineraries saved, bookings from itineraries, retention |\n| Launch | 10% of users in 3 cities, then expand |\n\n### Funnel to measure\n\n```mermaid\nflowchart LR\n  OPEN[Open planner] --> DRAFT[Draft generated]\n  DRAFT --> EDIT[Edited / saved]\n  EDIT --> BOOK[Booking]\n  BOOK --> RETURN[Return usage]\n```"}, {"id": 197, "title": "Capstone: an AI pricing decision", "tldr": "Decide how to price a new AI capability: analyze value, costs, user segments, competition and customer predictability needs; model scenarios; choose a model; plan communication and monitoring.", "real": "Contrasting public choices, such as Microsoft’s $30 per user per month Copilot add-on, Salesforce’s $2 per conversation Agentforce pricing and Intercom’s $0.99 per resolution for Fin, show that similar AI capabilities can be priced in very different ways depending on value metric and strategy.", "body": "### Scenario\n\nAn AI meeting assistant (summaries, action items, follow-up emails) for a B2B collaboration product.\n\n| Option | Pros | Cons |\n|---|---|---|\n| Include in all plans | Adoption, defense | Margin hit |\n| $8/user/month add-on | Revenue, predictable | Adoption friction |\n| Included with limits; credits for extra | Balanced | Complexity |\n\n### Unit economics check\n\n```\nAverage meetings per user/month: 20\nCost per meeting processed: $0.05\nAI cost per user/month: $1.00\nAdd-on price: $8 → AI gross margin ≈ 88%\nIncluding free with limits (10 meetings): cost $0.50 per user/month\n```\n\n### Recommendation\n\nInclude 10 meetings/month in paid plans to drive adoption; sell unlimited as an add-on; review adoption and margins quarterly."}, {"id": 198, "title": "Capstone: handling an AI incident", "tldr": "Walk through an AI incident: an assistant gives harmful or embarrassing answers that spread on social media. Detect, contain, communicate, fix, verify and learn, while protecting users and trust.", "real": "Public incidents, such as Google pausing Gemini’s image generation of people in February 2024 and OpenAI rolling back a sycophantic GPT-4o update in April 2025, show that fast containment, clear communication and process changes are standard responses.", "body": "### Timeline\n\n| Time | Action |\n|---|---|\n| 0–1 hour | Confirm issue, assess severity, disable affected feature via flag |\n| 1–4 hours | Initial public/customer statement; investigate scope via logs |\n| 1–3 days | Root cause (prompt change? model update? retrieval source?) |\n| 3–7 days | Fix, add eval cases, red-team, staged re-enable |\n| 2 weeks | Postmortem, process changes, follow-up communication |\n\n### Root cause analysis\n\n```mermaid\nflowchart TB\n  INC[Incident] --> PROMPT[Prompt change?]\n  INC --> MODEL[Model update?]\n  INC --> DATA[Retrieved content?]\n  INC --> ABUSE[Adversarial users?]\n  INC --> GAP[Eval coverage gap?]\n```\n\n### Lessons to institutionalize\n\nNew eval cases, launch checklist updates, monitoring for similar patterns, and clearer ownership."}, {"id": 199, "title": "The AI PM operating system", "tldr": "Bring everything together into a repeatable operating system: discovery habits, eval-driven development, data flywheel, responsible AI reviews, metrics and cost reviews, staged launches, and continuous learning about models and users.", "real": "High-performing AI product teams described in public engineering and product writing, such as LinkedIn’s 2024 lessons on building generative AI products and practitioners’ guides to evals, converge on the same habits: real-user examples, systematic evaluation and fast iteration.", "body": "### Weekly operating rhythm\n\n| Day | Activity |\n|---|---|\n| Monday | Metrics + cost review |\n| Tuesday | Customer conversations |\n| Wednesday | Failure review (real outputs) |\n| Thursday | Eval results of changes; ship decisions |\n| Friday | Exploration: new models, prototypes |\n\n### System view\n\n```mermaid\nflowchart LR\n  DISCOVER[Discover with users] --> DEFINE[Define with examples + evals]\n  DEFINE --> BUILD[Build + evaluate]\n  BUILD --> LAUNCH[Staged launch]\n  LAUNCH --> OPERATE[Monitor quality, cost, safety]\n  OPERATE --> LEARN[Learn from data + feedback]\n  LEARN --> DISCOVER\n```"}, {"id": 200, "title": "Final checklist, glossary and mastery roadmap", "tldr": "Use this checklist before shipping any AI feature, the glossary for quick reference, and the roadmap to keep growing. Mastery comes from shipping, measuring and learning repeatedly with real users.", "real": "Recommended reading includes Marty Cagan’s “Inspired” and “Empowered”, Teresa Torres’s “Continuous Discovery Habits”, Chip Huyen’s “AI Engineering” (2025), Google’s People + AI Guidebook, and the NIST AI Risk Management Framework.", "body": "### AI feature launch checklist\n\n- [ ] Clear user job and measurable outcome\n- [ ] AI is the right solution (vs simpler options)\n- [ ] Desired behavior specified with examples\n- [ ] Eval set built; quality bar met\n- [ ] Data rights, privacy and security reviewed\n- [ ] Safety red-teaming done; guardrails in place\n- [ ] UX handles errors, uncertainty, feedback, escalation\n- [ ] Latency and cost per task within targets\n- [ ] Pricing and unit economics validated\n- [ ] Metrics, guardrails and dashboards ready\n- [ ] Staged rollout with kill switch\n- [ ] Support, docs and customer communication ready\n- [ ] Monitoring and incident process owned\n\n### Glossary\n\n| Term | Meaning |\n|---|---|\n| Eval set | Curated test cases for quality |\n| Golden set | Expert-verified eval cases |\n| LLM-as-judge | Model grading outputs |\n| RAG | Retrieval-augmented generation |\n| Grounding | Basing outputs on provided sources |\n| Guardrails | Checks on inputs, outputs, actions |\n| Autonomy level | How much an agent does without approval |\n| pass^k | Success on all of k attempts |\n| Data flywheel | Usage improves product, driving more usage |\n| Unit economics | Revenue and cost per unit of usage |\n\n### Mastery roadmap\n\n1. Ship one AI feature with a full eval suite\n2. Run an A/B test with guardrail metrics\n3. Lead a responsible AI review\n4. Make a pricing decision with unit economics\n5. Handle a model migration safely\n6. Build an agent with autonomy levels\n7. Mentor another PM on AI product practice"}];
const PARTS = ["Product management foundations", "AI fundamentals for PMs", "AI product strategy", "Discovery and user research", "Defining AI products", "Data for AI products", "Models and technical choices", "Evaluation", "AI UX and design", "Trust, safety and responsible AI", "Metrics and experimentation", "Pricing and unit economics", "Launch and go-to-market", "Operating AI in production", "Roadmaps and prioritization", "Stakeholders and leadership", "Domain playbooks", "Agents and frontier products", "Platform and enterprise AI", "Career, capstones and mastery"];
const TOTAL = 200, PER = 10;
function idsOf(p){ const a = []; for (let i = (p-1)*PER + 1; i <= p*PER; i++) a.push(i); return a; }
const partOf = id => Math.ceil(id / PER);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "aipm-book-progress-v1";
const LS_LAST = "aipm-book-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try{ await dbRef.set({done:[...done].sort((a,b)=>a-b), updated:Date.now()}); }
  catch(e){ if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; pushRemote(); }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...done])); }catch(e){} }
function toggle(id){
  if (done.has(id)) done.delete(id); else done.add(id);
  saveLocal(); pushRemote(); renderAll();
  toast(done.has(id) ? "Chapter " + id + " marked complete" : "Chapter " + id + " marked not complete");
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(s){
  if (window.marked && marked.parse){
    const html = marked.parse(s, {gfm:true, headerIds:false, mangle:false});
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  }
  return "<pre>" + esc(s) + "</pre>";
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function currentId(){
  const m = location.hash.match(/^#ch-(\d{1,3})$/);
  const n = m ? +m[1] : 0;
  return n >= 1 && n <= TOTAL ? n : 0;
}

/* ---------- header memory bank ---------- */
function renderBank(){
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    html += '<div class="bank-group" title="Part ' + p + ': ' + esc(PARTS[p-1]) + '">';
    for (const i of idsOf(p)){
      html += '<button class="cell' + (done.has(i) ? " done" : "") + (i === cur ? " here" : "") +
        '" data-go="' + i + '" aria-label="Chapter ' + i + (done.has(i) ? ", complete" : "") + '"></button>';
    }
    html += "</div>";
  }
  document.getElementById("bank").innerHTML = html;
  document.getElementById("doneCount").textContent = done.size;
  document.getElementById("pct").textContent = Math.round(done.size * 100 / TOTAL) + "%";
}

/* ---------- sidebar ---------- */
const openParts = new Set();
function renderSide(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const matches = ids.filter(i => !q || byId[i].title.toLowerCase().includes(q) || byId[i].tldr.toLowerCase().includes(q) || String(i) === q);
    if (q && !matches.length) continue;
    const count = ids.filter(i => done.has(i)).length;
    const open = q || openParts.has(p) || partOf(cur) === p;
    html += '<div class="part' + (open ? " open" : "") + '">' +
      '<button class="part-head" data-part="' + p + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="part-num">' + String(p).padStart(2, "0") + '</span>' +
      '<span class="part-name">' + esc(PARTS[p-1]) + '</span>' +
      '<span class="part-count' + (count === PER ? " full" : "") + '">' + count + '/' + PER + '</span></button><ul class="part-list">';
    for (const i of matches){
      html += '<li class="ch-row' + (i === cur ? " active" : "") + '">' +
        '<button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="' + (done.has(i) ? "Mark chapter " + i + " not complete" : "Mark chapter " + i + " complete") + '">' + TICK + '</button>' +
        '<a href="#ch-' + i + '"><span class="n">' + i + '.</span>' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ul></div>";
  }
  if (!html) html = '<p style="color:var(--muted);font-size:14px;padding:8px">No chapters match that search. Try a shorter word like “evals” or “agents”.</p>';
  document.getElementById("parts").innerHTML = html;
}

/* ---------- diagrams and charts ---------- */
let mermaidPromise = null, renderSeq = 0;
const svgCache = new Map();
function isDark(){
  const a = document.documentElement.getAttribute("data-theme");
  if (a) return a === "dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function ensureMermaid(){
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (mermaidPromise) return mermaidPromise;
  mermaidPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js";
    s.onload = () => {
      try{
        window.mermaid.initialize({ startOnLoad:false, securityLevel:"strict", theme: isDark() ? "dark" : "neutral",
          fontFamily:"IBM Plex Sans, system-ui, sans-serif", flowchart:{ curve:"basis", htmlLabels:true } });
        resolve(window.mermaid);
      }catch(e){ reject(e); }
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return mermaidPromise;
}
function fitSvg(div){
  const svg = div.querySelector("svg");
  if (!svg) return;
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Diagram");
  const vb = (svg.getAttribute("viewBox") || "").split(/\s+/).map(Number);
  const vbw = vb[2] || 0;
  if (vbw && div.clientWidth && div.clientWidth < vbw * 0.7){
    svg.style.maxWidth = "none";
    svg.style.width = Math.round(vbw * 0.85) + "px";
  }
}
function fmtNum(v){ return Number(v).toLocaleString("en-US", { maximumFractionDigits: 3 }); }
function renderChart(el, spec){
  const max = Math.max(...spec.data.map(d => d[1]));
  const unit = spec.unit || "";
  const sep = (unit === "%" || unit === "×") ? "" : " ";
  let rows = "";
  for (const [label, v] of spec.data){
    let w = spec.log ? (Math.log10(v + 1) / Math.log10(max + 1)) * 100 : (v / max) * 100;
    w = Math.max(w, 1.5);
    rows += '<div class="bar-row"><span class="bar-label">' + esc(String(label)) + '</span><span class="bar-track"><span class="bar" style="width:' + w.toFixed(1) + '%"></span></span><span class="bar-val">' + fmtNum(v) + sep + esc(unit) + '</span></div>';
  }
  const fig = document.createElement("figure");
  fig.className = "chart";
  fig.innerHTML = '<figcaption>' + esc(spec.title || "") + '</figcaption>' + rows + (spec.log ? '<div class="chart-note">Bar lengths use a logarithmic scale.</div>' : "");
  el.replaceWith(fig);
}
function enhance(root){
  root.querySelectorAll("code.language-chart").forEach(code => {
    const pre = code.closest("pre") || code;
    try{ renderChart(pre, JSON.parse(code.textContent)); }catch(e){}
  });
  const blocks = [...root.querySelectorAll("code.language-mermaid")];
  if (!blocks.length) return;
  const seq = ++renderSeq;
  const holders = blocks.map(code => {
    const pre = code.closest("pre") || code;
    const div = document.createElement("div");
    div.className = "diagram loading";
    div.textContent = "Loading diagram…";
    div.dataset.src = code.textContent;
    pre.replaceWith(div);
    if (svgCache.has(div.dataset.src)){ div.classList.remove("loading"); div.innerHTML = svgCache.get(div.dataset.src); div.dataset.done = "1"; fitSvg(div); }
    return div;
  }).filter(div => !div.dataset.done);
  if (!holders.length) return;
  ensureMermaid().then(async m => {
    for (let k = 0; k < holders.length; k++){
      const div = holders[k];
      if (seq !== renderSeq || !div.isConnected) return;
      const id = "mmd-" + seq + "-" + k;
      try{
        const out = await m.render(id, div.dataset.src);
        if (!div.isConnected) return;
        div.classList.remove("loading");
        div.innerHTML = out.svg;
        svgCache.set(div.dataset.src, out.svg);
        fitSvg(div);
      }catch(e){
        const junk = document.getElementById("d" + id); if (junk) junk.remove();
        div.classList.remove("loading");
        div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>";
      }
    }
  }).catch(() => {
    holders.forEach(div => { div.classList.remove("loading"); div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>"; });
  });
}

/* ---------- chapter view ---------- */
function renderChapter(id){
  const c = byId[id];
  const p = partOf(id);
  const ids = idsOf(p);
  const isDone = done.has(id);
  const tabs = ids.map(i =>
    '<button class="tab' + (i === id ? " active" : "") + '" role="tab" aria-selected="' + (i === id) + '" data-go="' + i + '">' +
    '<span class="dot' + (done.has(i) ? " on" : "") + '"></span><span class="tab-t">' + i + '. ' + esc(byId[i].title) + '</span></button>'
  ).join("");
  document.getElementById("main").innerHTML =
    '<p class="crumb">Part ' + p + ' of 20: ' + esc(PARTS[p-1]) + '</p>' +
    '<div class="tabs" role="tablist" aria-label="Chapters in this part">' + tabs + '</div>' +
    '<article>' +
      '<p class="ch-no">Chapter ' + id + ' of ' + TOTAL + '</p>' +
      '<h1 class="ch-title">' + esc(c.title) + '</h1>' +
      '<section class="box tldr"><h2>TL;DR</h2><p>' + inlineMd(c.tldr) + '</p></section>' +
      '<div class="body">' + md(c.body) + '</div>' +
      '<section class="box real"><h2>Real-world example</h2><p>' + inlineMd(c.real) + '</p></section>' +
      '<div class="done-bar">' +
        '<button class="complete' + (isDone ? " on" : "") + '" data-toggle="' + id + '" aria-pressed="' + isDone + '">' +
          '<span class="tick' + (isDone ? " on" : "") + '">' + TICK + '</span>' + (isDone ? "Completed" : "Mark as complete") + '</button>' +
        '<div class="nav">' +
          '<button class="btn" data-go="' + (id - 1) + '"' + (id === 1 ? " disabled" : "") + '>Previous</button>' +
          '<button class="btn" data-go="' + (id + 1) + '"' + (id === TOTAL ? " disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  enhance(document.getElementById("main"));
}

/* ---------- contents view ---------- */
function renderContents(){
  let html = '<div class="contents"><h1>Contents</h1>' +
    '<p class="lead">Twenty parts, ten chapters each, from product fundamentals and AI literacy to evals, trust and safety, pricing, agents and AI platforms. Tick a chapter when you finish it; your progress is saved for next time. Company examples come from public announcements, papers and reporting; models, prices and regulations change quickly, so check current sources before relying on a specific detail.</p>' +
    '<div class="contents-actions"><button class="btn" data-go="' + firstUnread() + '">' + (done.size ? "Continue with chapter " + firstUnread() : "Start chapter 1") + '</button>' +
    '<button class="btn" id="resetBtn">Reset progress</button></div><div class="grid">';
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const count = ids.filter(i => done.has(i)).length;
    html += '<section class="pcard"><h2>Part ' + p + ': ' + esc(PARTS[p-1]) + '</h2><div class="meta">' + count + ' of ' + PER + ' complete</div><ol>';
    for (const i of ids){
      html += '<li><button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="Toggle chapter ' + i + '">' + TICK + '</button><a href="#ch-' + i + '">' + i + '. ' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ol></section>";
  }
  document.getElementById("main").innerHTML = html + "</div></div>";
}
function firstUnread(){ for (let i = 1; i <= TOTAL; i++) if (!done.has(i)) return i; return TOTAL; }

/* ---------- routing ---------- */
let lastRendered = null;
function renderAll(){
  const id = currentId();
  renderBank(); renderSide();
  const y = window.scrollY;
  if (id) renderChapter(id); else renderContents();
  if (lastRendered === location.hash) window.scrollTo(0, y);
  lastRendered = location.hash;
}
function route(){
  const id = currentId();
  if (!id && location.hash !== "#contents"){
    let last = 0; try{ last = +localStorage.getItem(LS_LAST) || 0; }catch(e){}
    location.replace("#ch-" + (last >= 1 && last <= TOTAL ? last : 1));
    return;
  }
  if (id){ try{ localStorage.setItem(LS_LAST, id); }catch(e){} }
  document.body.classList.remove("drawer");
  renderAll();
  window.scrollTo(0, 0);
  const active = document.querySelector(".ch-row.active");
  if (active) active.scrollIntoView({block:"nearest"});
  const tab = document.querySelector(".tab.active");
  if (tab && tab.parentElement){ const r = tab.parentElement; const left = tab.offsetLeft - r.offsetLeft; if (left < r.scrollLeft || left + tab.offsetWidth > r.scrollLeft + r.clientWidth) r.scrollLeft = left - 16; }
}
function go(id){ if (id >= 1 && id <= TOTAL) location.hash = "#ch-" + id; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){ e.preventDefault(); toggle(+t.dataset.toggle); return; }
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled){ go(+g.dataset.go); return; }
  const ph = e.target.closest("[data-part]");
  if (ph){
    const p = +ph.dataset.part;
    const el = ph.parentElement;
    const isOpen = el.classList.toggle("open");
    if (isOpen) openParts.add(p); else openParts.delete(p);
    ph.setAttribute("aria-expanded", isOpen);
    return;
  }
  if (e.target.id === "resetBtn"){
    if (confirm("Clear all 200 ticks? This can’t be undone.")){ done.clear(); saveLocal(); pushRemote(); renderAll(); toast("Progress reset"); }
  }
});
document.getElementById("search").addEventListener("input", renderSide);
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.add("drawer"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = currentId(); if (!id) return;
  if (e.key === "ArrowRight") go(id + 1);
  else if (e.key === "ArrowLeft") go(id - 1);
});
function setTopH(){ document.documentElement.style.setProperty("--top-h", document.getElementById("top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);
window.addEventListener("hashchange", route);
setTopH();
route();
initSync();
</script>

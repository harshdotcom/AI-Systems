] Tag documents with permissions and audience"}, {"id": 55, "title": "Privacy, consent and data rights", "tldr": "Know what data you may use for which purpose: product operation, evaluation, model improvement or training. Get appropriate consent, honor contracts and privacy laws, minimize data, and communicate clearly. Trust breaks quickly when users feel their data was used unfairly.", "real": "In August 2023, Zoom faced backlash over terms of service language that appeared to allow training AI on customer content; the company updated its terms to state it would not use audio, video or chat content to train AI models without consent. Adobe faced a similar backlash over terms changes in 2024 and clarified its policy.", "body": "### Data use purposes\n\n| Purpose | Typical basis |\n|---|---|\n| Providing the feature | Contract / service terms |\n| Debugging and safety | Legitimate interest, terms |\n| Evaluation | Terms, often with anonymization |\n| Training models | Explicit consent or clear contract terms (especially enterprise) |\n| Sharing with model providers | Data processing agreements |\n\n### Trust practices\n\n| Practice | Example |\n|---|---|\n| Clear language | Plain-English data use summary |\n| Controls | Opt-out of training, history deletion |\n| Enterprise defaults | No training on customer data by default |\n| Change communication | Announce terms changes clearly |"}, {"id": 56, "title": "Designing the data flywheel", "tldr": "A data flywheel makes the product better as it is used: usage generates feedback and examples, which improve evals, prompts, retrieval or models, which improves the product and drives more usage. Design it deliberately from day one.", "real": "Search engines and recommendation systems at companies such as Google, Netflix and Spotify have long improved through engagement data, and AI assistants now collect thumbs-up and thumbs-down ratings and edits as feedback signals for improvement.", "body": "### Flywheel\n\n```mermaid\nflowchart LR\n  USE[More usage] --> SIG[More feedback signals]\n  SIG --> IMP[Better evals, prompts, retrieval, models]\n  IMP --> QUAL[Higher quality]\n  QUAL --> USE\n```\n\n### Signals to capture\n\n| Signal | Interpretation |\n|---|---|\n| Accept / copy | Positive |\n| Edit before use | Partially good; edits show the gap |\n| Regenerate | Negative |\n| Thumbs down + comment | Negative with reason |\n| Abandon task | Possible failure |\n| Escalate to human | Unresolved |\n\n### Caveat\n\nFeedback is biased (only some users rate). Combine with sampled human evaluation."}, {"id": 57, "title": "Synthetic data", "tldr": "LLMs can generate synthetic examples for evaluation and training: rare cases, varied phrasings, multiple languages and adversarial inputs. Synthetic data fills gaps quickly but must be validated and mixed with real data.", "real": "Microsoft’s Phi models, beginning with the 2023 paper “Textbooks Are All You Need”, used large amounts of carefully generated synthetic training data and achieved strong results for their size.", "body": "### Uses\n\n| Use | Example |\n|---|---|\n| Eval coverage | 50 variations of refund questions |\n| Edge cases | Rare policies, unusual formats |\n| Adversarial tests | Jailbreak and injection attempts |\n| Languages | Translated and localized examples |\n| Training data | Instruction examples for fine-tuning |\n\n### Generation pipeline\n\n```mermaid\nflowchart LR\n  SEED[Real seed examples] --> GEN[LLM generates variations]\n  GEN --> FILTER[Filter: quality, duplicates, realism]\n  FILTER --> HUMAN[Human spot check]\n  HUMAN --> SET[(Dataset tagged as synthetic)]\n```\n\n### Risk\n\nSynthetic data can be unrealistic or repetitive; always confirm results on real user data."}, {"id": 58, "title": "Feedback mechanisms", "tldr": "Design feedback collection into the product: lightweight ratings, edit tracking, reason tags, and outcome signals. Make it easy and valuable for users to give feedback, and close the loop so feedback actually drives improvements.", "real": "ChatGPT and Claude include thumbs-up and thumbs-down buttons on responses with optional comments, and coding assistants track whether suggestions are accepted, kept or deleted, giving continuous quality signals at scale.", "body": "### Feedback design\n\n| Type | Example | Effort for user |\n|---|---|---|\n| Implicit | Accept, edit, ignore | None |\n| Binary rating | Thumbs up/down | Very low |\n| Reason tags | “Incorrect”, “Too long”, “Unsafe” | Low |\n| Free text | Comment | Medium |\n| Corrections | Edited output saved | Medium |\n\n### Closing the loop\n\n```mermaid\nflowchart LR\n  FB[Feedback] --> TRIAGE[Weekly triage]\n  TRIAGE --> CAT[Categorize failures]\n  CAT --> FIX[Fix: prompt, data, retrieval, UX]\n  FIX --> EVAL[Add to eval set]\n  EVAL --> SHIP[Ship + tell users what improved]\n```"}, {"id": 59, "title": "Data contracts and dependencies", "tldr": "AI features depend on upstream data from other teams and vendors. Data contracts define schemas, freshness, quality expectations and change notices, so upstream changes do not silently break AI behavior.", "real": "Data teams adopted “data contracts” in the 2020s, popularized by practitioners such as Chad Sanderson, as agreements between data producers and consumers, an idea especially relevant when AI features depend on many upstream sources.", "body": "### Contract contents\n\n| Element | Example |\n|---|---|\n| Schema | Fields, types |\n| Semantics | What each field means |\n| Freshness | Updated hourly |\n| Quality | Null rates, valid ranges |\n| Ownership | Producer team and contact |\n| Change process | Notice period for breaking changes |\n\n### Dependency map\n\n```mermaid\nflowchart LR\n  CRM[CRM data team] --> FEAT[Features / context]\n  KB[Knowledge base team] --> RAG[Retrieval]\n  VENDOR[Model provider] --> MODEL[Model behavior]\n  FEAT --> AI[AI feature]\n  RAG --> AI\n  MODEL --> AI\n```"}, {"id": 60, "title": "Data governance for AI products", "tldr": "Data governance sets who can access which data, for which purposes, with what retention, documentation and auditability. For AI it also covers training data provenance, evaluation data handling and third-party model data flows.", "real": "The EU AI Act requires providers of high-risk AI systems to apply data governance practices to training, validation and testing data, and requires general-purpose AI model providers to publish a summary of training content.", "body": "### Governance checklist\n\n- [ ] Data inventory with owners and classification\n- [ ] Purpose limitation documented per use\n- [ ] Access controls and audit logs\n- [ ] Retention and deletion policies\n- [ ] Provenance and licenses for training data\n- [ ] Data processing agreements with AI vendors\n- [ ] Regional data residency where required\n- [ ] Review process for new data uses\n\n### Roles\n\n| Role | Responsibility |\n|---|---|\n| Product manager | Defines data needs and uses |\n| Data owner | Approves access and use |\n| Privacy / legal | Compliance review |\n| Security | Protection and monitoring |"}, {"id": 61, "title": "Choosing a model", "tldr": "Choose models by quality on your evaluation set, latency, cost per task, context length, modalities, tool use, safety behavior, data terms and deployment options. Re-evaluate regularly: model quality and prices change fast.", "real": "Analyses such as a16z’s “LLMflation” (2024) estimated that the cost of LLM inference for a given capability level was falling roughly tenfold per year, so model choices made a year earlier are often no longer optimal.", "body": "### Model selection scorecard (example)\n\n| Criterion | Weight | Model A | Model B | Model C |\n|---|---|---|---|---|\n| Eval pass rate | 40% | 92% | 88% | 81% |\n| Cost per task | 20% | $0.02 | $0.006 | $0.002 |\n| p95 latency | 15% | 6 s | 3 s | 1.5 s |\n| Tool use reliability | 10% | High | High | Medium |\n| Data terms / region | 10% | OK | OK | OK |\n| Safety behavior | 5% | Good | Good | Fair |\n\n### Decision rule\n\nPick the cheapest, fastest model that meets the quality bar, and route only hard cases to stronger models.\n\n### Re-evaluation cadence\n\nQuarterly, or whenever a major new model or price change appears."}, {"id": 62, "title": "API models vs open-weight models", "tldr": "Hosted API models offer top capability with no infrastructure; open-weight models offer control, customization, data locality and potential cost savings at scale, with more operational work. Many products use both.", "real": "Enterprises commonly use frontier models through APIs or cloud platforms such as Amazon Bedrock, Azure and Vertex AI, while self-hosting open-weight models such as Llama, Mistral, Qwen or Gemma for sensitive or high-volume workloads.", "body": "### Comparison\n\n| Factor | API | Open-weight self-hosted |\n|---|---|---|\n| Capability | Frontier | Strong, often behind frontier |\n| Time to start | Minutes | Weeks |\n| Data control | Contractual | Full |\n| Customization | Limited | Full fine-tuning |\n| Cost at low volume | Low | High fixed |\n| Cost at high, steady volume | Can be high | Can be lower |\n| Dependency risk | Provider changes | Your operations |\n\n### Hybrid\n\n```mermaid\nflowchart LR\n  GW[AI gateway] --> API[API model: complex tasks]\n  GW --> OPEN[Self-hosted model: sensitive / high-volume tasks]\n```"}, {"id": 63, "title": "Prompting, RAG or fine-tuning", "tldr": "Use prompting for behavior you can describe, RAG to supply knowledge that changes or must be cited, and fine-tuning for consistent style, format or narrow skills at scale. Start simple and escalate only when evals show a gap.", "real": "Both OpenAI and Anthropic advise developers to begin with prompt engineering and retrieval and consider fine-tuning only when there is a clear, measured gap, since fine-tuning adds cost, data requirements and maintenance.", "body": "### Decision guide\n\n```mermaid\nflowchart TD\n  G[Quality gap found in evals] --> K{Missing knowledge?}\n  K -- yes --> R[Add or improve RAG]\n  K -- no --> P{Better instructions or examples fix it?}\n  P -- yes --> PR[Improve prompt]\n  P -- no --> D{Have quality training data?}\n  D -- yes --> FT[Fine-tune]\n  D -- no --> C[Collect data first]\n```\n\n### Comparison\n\n| Need | Prompt | RAG | Fine-tune |\n|---|---|---|---|\n| Changing facts | ✗ | ✓ | ✗ |\n| Citations | ✗ | ✓ | ✗ |\n| Strict format/style | Partial | ✗ | ✓ |\n| Lower cost via smaller model | ✗ | ✗ | ✓ |\n| Speed of iteration | Fast | Fast | Slow |"}, {"id": 64, "title": "RAG essentials for PMs", "tldr": "RAG quality depends on content quality, chunking, retrieval and ranking, permissions, prompt design and citations. Most “the AI is wrong” complaints in RAG products are actually retrieval or content problems.", "real": "Anthropic reported in 2024 that its “contextual retrieval” technique, combined with keyword search and reranking, reduced retrieval failures by 67% in its experiments, showing how much retrieval engineering affects answer quality.", "body": "### RAG pipeline\n\n```mermaid\nflowchart LR\n  CONTENT[Content sources] --> PREP[Clean, chunk, embed]\n  PREP --> IDX[(Index)]\n  Q[Question] --> RET[Retrieve + rerank]\n  IDX --> RET\n  RET --> GEN[Generate with citations]\n  GEN --> ANS[Answer]\n```\n\n### PM checklist\n\n- [ ] Sources chosen, owned and current\n- [ ] Permissions enforced at retrieval\n- [ ] Retrieval quality measured separately from answers\n- [ ] Citations shown and verifiable\n- [ ] “I don’t know” behavior when sources lack answers\n- [ ] Feedback on wrong answers routed to content owners\n\n### Diagnosis\n\n| Retrieved right content? | Answer right? | Fix |\n|---|---|---|\n| No | No | Retrieval / content |\n| Yes | No | Prompt / model |"}, {"id": 65, "title": "Agents and tool use: product implications", "tldr": "Tool use lets AI read data and take actions; agents chain many tool calls toward goals. Product decisions include which tools to expose, permissions, confirmations, task length, cost limits, progress visibility and failure recovery.", "real": "In July 2025, an AI coding agent on Replit deleted a user’s production database during a code freeze despite instructions not to make changes, and Replit responded by adding stronger separation between development and production environments.", "body": "### Tool design decisions\n\n| Decision | Example |\n|---|---|\n| Which actions | Read orders, issue refunds ≤ $50 |\n| Permissions | User’s own data only |\n| Confirmation | Required for refunds, emails, deletions |\n| Limits | Max steps, max spend per task |\n| Visibility | Show steps and results to user |\n| Undo | Reversible actions preferred |\n\n### Risk-based autonomy\n\n| Action risk | Autonomy |\n|---|---|\n| Read-only | Automatic |\n| Reversible write | Automatic with log |\n| External communication | Confirm |\n| Irreversible / financial | Confirm with details, or forbid |"}, {"id": 66, "title": "The quality–cost–latency triangle", "tldr": "Every AI feature balances quality, cost and latency. Decide which matters most per use case and design accordingly: smaller models, caching, routing, shorter context or asynchronous processing can shift the balance.", "real": "OpenAI’s GPT-5 launch in August 2025 included an automatic router that chooses between faster responses and deeper reasoning per request, a product-level answer to the quality–latency–cost trade-off.", "body": "### Priorities by use case\n\n| Use case | Top priority | Approach |\n|---|---|---|\n| Autocomplete | Latency | Small fast model |\n| Legal analysis | Quality | Large model, review |\n| Bulk tagging | Cost | Small model, batch processing |\n| Customer chat | Balance | Routing + caching |\n\n### Levers\n\n| Lever | Effect |\n|---|---|\n| Model size | Quality vs speed/cost |\n| Context length | Quality vs cost/latency |\n| Caching | Lower cost and latency |\n| Routing | Spend only where needed |\n| Async / batch | Lower cost, higher latency |\n| Streaming | Better perceived latency |"}, {"id": 67, "title": "Model routing and fallbacks", "tldr": "Route requests to different models by task, difficulty, user tier or cost budget, and define fallbacks when models fail or are overloaded. Routing can cut costs substantially while maintaining quality where it matters.", "real": "LMSYS’s RouteLLM research (2024) showed that learned routers sending easier queries to cheaper models could reduce costs substantially while preserving most of the quality of the strongest model.", "body": "### Routing flow\n\n```mermaid\nflowchart LR\n  REQ[Request] --> CLS[Classify task and difficulty]\n  CLS -->|simple| SMALL[Small model]\n  CLS -->|complex| LARGE[Large model]\n  SMALL -->|low confidence| LARGE\n  LARGE -->|error| FALLBACK[Backup provider or degraded mode]\n```\n\n### Savings math\n\n```\n70% of traffic to a model 10× cheaper:\ncost = 0.7 × 0.1 + 0.3 × 1.0 = 0.37 of baseline (≈ 63% saving)\n```\n\n### PM responsibilities\n\nDefine quality bars per route, monitor routing mix and quality by route, and decide degraded-mode behavior."}, {"id": 68, "title": "On-device vs cloud AI", "tldr": "On-device AI offers privacy, low latency, offline use and lower server cost; cloud AI offers more capability. Many products use hybrid designs: small on-device models for simple tasks and cloud models for complex ones.", "real": "Apple Intelligence, announced in 2024, uses an on-device model of about 3 billion parameters for many tasks and sends more complex requests to larger models on its Private Cloud Compute servers, which Apple designed to process data without retaining it.", "body": "### Comparison\n\n| Factor | On-device | Cloud |\n|---|---|---|\n| Privacy | High | Depends on provider |\n| Latency | Low | Network dependent |\n| Offline | Yes | No |\n| Capability | Limited | High |\n| Cost to provider | Low per use | Per request |\n| Updates | App/OS releases | Instant |\n\n### Hybrid flow\n\n```mermaid\nflowchart LR\n  U[User request] --> D{Can on-device model handle it?}\n  D -- yes --> LOCAL[On-device]\n  D -- no --> CLOUD[Cloud model with privacy controls]\n```"}, {"id": 69, "title": "Vendor and dependency risk", "tldr": "Relying on AI providers creates risks: price changes, model deprecations, behavior changes, outages, policy changes and data terms. Mitigate with abstraction layers, multi-provider options, evals to test replacements, and contracts.", "real": "In August 2025, when OpenAI replaced GPT-4o with GPT-5 as the default in ChatGPT, many users objected to losing the older model, and OpenAI restored access to GPT-4o for paid users, illustrating how model changes affect products and users who depend on them.", "body": "### Risk register\n\n| Risk | Mitigation |\n|---|---|\n| Model deprecation | Version pinning, migration evals |\n| Behavior change after update | Regression evals before switching |\n| Price increase | Multi-provider routing |\n| Outage | Fallback provider or degraded mode |\n| Policy change | Monitor terms; contractual protections |\n| Data terms | Enterprise agreements, DPAs |\n\n### Abstraction\n\n```mermaid\nflowchart LR\n  APP[Product features] --> GW[Model gateway]\n  GW --> P1[Provider A]\n  GW --> P2[Provider B]\n  GW --> P3[Self-hosted]\n  EVALS[Eval suite] -.-> GW\n```"}, {"id": 70, "title": "Working effectively with ML and AI engineers", "tldr": "Partner with ML engineers by bringing clear problems, examples and quality bars, not solutions. Understand their constraints, involve them in discovery, respect uncertainty in estimates, and share ownership of evals and outcomes.", "real": "Teams that publish lessons from building LLM products, such as LinkedIn’s 2024 write-up, describe tight collaboration between product and engineering on evaluation and quality as essential, since reaching the last stretch of quality took far longer than the initial prototype.", "body": "### What engineers need from PMs\n\n| Need | Provide |\n|---|---|\n| Clear problem | Job, users, success metrics |\n| Examples | Inputs and ideal outputs |\n| Quality bar | Thresholds and priorities |\n| Constraints | Latency, cost, compliance |\n| Context | Why it matters to the business |\n| Decisions | Fast trade-off calls |\n\n### What PMs need from engineers\n\nFeasibility input early, honest uncertainty estimates, failure analyses, and options with trade-offs.\n\n### Estimating uncertain work\n\nUse time-boxed spikes (“2 weeks to see if we can reach 85% on the eval set”) instead of fixed feature deadlines."}, {"id": 71, "title": "Why evals are a product manager’s job", "tldr": "Evals define what “good” means for an AI product and measure whether changes improve it. Because they encode user needs and quality judgments, PMs must co-own them with engineering. Without evals, teams ship on gut feeling and regress silently.", "real": "Hamel Husain’s 2024 post “Your AI Product Needs Evals” described teams stalling after early prototypes because they lacked systematic evaluation, and recommended building evaluation systems as the backbone of AI product iteration.", "body": "### Evals as product spec\n\n```mermaid\nflowchart LR\n  NEEDS[User needs] --> CRITERIA[Quality criteria]\n  CRITERIA --> SET[Eval set + rubrics]\n  SET --> MEASURE[Measure every change]\n  MEASURE --> DECIDE[Ship / don't ship]\n```\n\n### What PMs bring\n\n| Contribution | Example |\n|---|---|\n| Real user scenarios | From research and logs |\n| Priorities | Which errors matter most |\n| Rubrics | What “helpful” means here |\n| Thresholds | Launch bar |\n| Domain experts | Access for labeling |\n\n### Without evals\n\nPrompt tweaks fix one case and break others; model upgrades change behavior unnoticed; debates are opinion-based."}, {"id": 72, "title": "Building an eval set", "tldr": "An eval set is a curated collection of inputs (and often reference outputs or rubrics) representing real usage: common cases, edge cases, high-stakes cases and adversarial cases. Start with 50–200 examples and grow it from production failures.", "real": "Teams building RAG assistants commonly create “golden sets” of real customer questions paired with correct answers and source documents, reviewed by subject-matter experts, as the primary measure of answer quality.", "body": "### Composition\n\n```chart\n{\"title\": \"Suggested eval set composition (guideline)\", \"unit\": \"%\", \"data\": [[\"Common real requests\", 60], [\"Edge and hard cases\", 25], [\"Adversarial and safety cases\", 15]]}\n```\n\n### Example entry\n\n| Field | Example |\n|---|---|\n| Input | “Can I return a sale item after 20 days?” |\n| Context | Return policy v4 |\n| Reference answer | “Yes, within 30 days, unless marked final sale.” |\n| Criteria | Correct policy, mentions exception, cites policy |\n| Tags | Returns, common, English |\n\n### Growing it\n\nEvery serious production failure becomes a new eval case after it is fixed."}, {"id": 73, "title": "Evaluation methods", "tldr": "Use the cheapest reliable method for each criterion: code-based checks for format and exact facts, reference comparisons, LLM judges with rubrics for nuanced quality, and human review for calibration and high-stakes judgments.", "real": "OpenAI open-sourced its Evals framework in 2023, and tools such as promptfoo, Braintrust and LangSmith provide eval runners combining programmatic checks, model-graded evaluations and human review queues.", "body": "### Methods\n\n| Method | Good for | Cost |\n|---|---|---|\n| Programmatic checks | Format, JSON validity, length, keywords | Very low |\n| Reference match | Extraction, classification | Low |\n| Semantic similarity | Paraphrase tolerance | Low |\n| LLM-as-judge | Helpfulness, tone, groundedness | Medium |\n| Human expert review | Correctness in specialized domains | High |\n| Pairwise comparison | Choosing between versions | Medium |\n\n### Layered approach\n\n```mermaid\nflowchart LR\n  OUT[Outputs] --> CODE[Code checks]\n  CODE --> JUDGE[LLM judge]\n  JUDGE --> HUMAN[Human review of samples and disagreements]\n```"}, {"id": 74, "title": "LLM-as-judge", "tldr": "Using a strong model to grade outputs scales evaluation. Make judges reliable with specific rubrics, reference answers, binary or narrow scales, pairwise comparisons, bias controls, and regular checks of agreement with human graders.", "real": "The 2023 paper “Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena” found strong LLM judges agreed with human preferences at rates comparable to agreement between humans, while documenting position and verbosity biases.", "body": "### Judge prompt structure\n\n```text\nYou are grading a customer support answer.\nCriteria: correct per the policy excerpt; does not invent details; offers next step.\nPolicy excerpt: {{policy}}\nQuestion: {{question}}\nAnswer: {{answer}}\nReturn JSON: {\"pass\": true/false, \"reason\": \"...\"}\n```\n\n### Reliability practices\n\n| Practice | Why |\n|---|---|\n| Binary pass/fail per criterion | More consistent than 1–10 scores |\n| Include references | Grounds judgment |\n| Swap order in pairwise tests | Reduce position bias |\n| Calibrate on 100+ human labels | Measure agreement |\n| Different model family than generator | Reduce self-preference |"}, {"id": 75, "title": "Human evaluation", "tldr": "Humans remain the reference for quality, especially for nuanced, specialized or high-stakes outputs. Design human evaluation with clear guidelines, trained raters, blind comparisons, sampling plans and agreement checks.", "real": "Major AI labs rely heavily on human raters and domain experts to evaluate model outputs, and LMArena (formerly Chatbot Arena) ranks models using large numbers of blind pairwise human votes.", "body": "### Setup\n\n| Element | Practice |\n|---|---|\n| Raters | Domain experts for specialized tasks |\n| Guidelines | Rubrics with examples |\n| Blind review | Raters don’t know which version |\n| Sample size | Enough for confidence (often 100–300 items per comparison) |\n| Agreement | Multiple raters on a subset |\n\n### When to use humans\n\n- Calibrating LLM judges\n- Launch decisions for high-stakes features\n- New domains or languages\n- Investigating user complaints\n\n### Cost control\n\nUse humans on samples and disagreements; automate the rest."}, {"id": 76, "title": "Offline vs online evaluation", "tldr": "Offline evals test changes on fixed datasets before release; online evaluation measures real user behavior and outcomes after release through A/B tests, monitoring and feedback. Both are needed: offline for safety and speed, online for truth.", "real": "Companies such as Microsoft and Google run large-scale online experiments, and AI product teams pair offline eval gates with online A/B tests because offline gains do not always translate into user value.", "body": "### Comparison\n\n| | Offline | Online |\n|---|---|---|\n| Data | Curated eval sets | Real traffic |\n| Speed | Minutes to hours | Days to weeks |\n| Risk | None to users | Some exposure |\n| Measures | Quality criteria | Behavior and outcomes |\n| Use | Gate releases | Confirm impact |\n\n### Pipeline\n\n```mermaid\nflowchart LR\n  CHANGE[Change] --> OFF[Offline evals]\n  OFF -->|pass| SHADOW[Shadow / internal testing]\n  SHADOW --> AB[A/B test]\n  AB -->|wins| ROLL[Full rollout]\n  ROLL --> MON[Online monitoring]\n```"}, {"id": 77, "title": "Red teaming AI products", "tldr": "Red teaming deliberately attacks your AI product to find harmful outputs, jailbreaks, prompt injections, data leaks and misuse before users do. Combine internal experts, diverse testers, automated tools and external testers for high-risk launches.", "real": "Microsoft’s AI Red Team published lessons in 2025 from red-teaming more than 100 generative AI products, and the DEF CON 31 Generative Red Team challenge in 2023 had thousands of participants testing leading models.", "body": "### Red-team scope\n\n| Area | Example tests |\n|---|---|\n| Harmful content | Policy-violating requests |\n| Jailbreaks | Role-play, encoding tricks |\n| Prompt injection | Instructions hidden in documents |\n| Data leakage | Revealing other users’ data, system prompt |\n| Misuse | Fraud, harassment assistance |\n| Bias | Different outputs by demographic cues |\n| Brand risk | Offensive or absurd outputs |\n\n### Process\n\n```mermaid\nflowchart LR\n  PLAN[Threat model + test plan] --> TEST[Manual + automated testing]\n  TEST --> TRIAGE[Severity triage]\n  TRIAGE --> FIX[Mitigations]\n  FIX --> REG[Add to regression suite]\n```"}, {"id": 78, "title": "Regression testing for AI", "tldr": "Every prompt, model, retrieval or tool change can break existing behavior. Run the full eval suite on every change, compare against the baseline, review differences, and block releases that regress beyond agreed tolerances.", "real": "In April 2025 OpenAI rolled back an update to GPT-4o in ChatGPT after users reported it had become overly flattering and agreeable (“sycophantic”); OpenAI later said its evaluation and launch processes had not adequately caught the issue and described changes to them.", "body": "### Regression process\n\n```mermaid\nflowchart LR\n  BASE[Baseline results] --> COMP[Compare]\n  NEW[Candidate results] --> COMP\n  COMP --> DIFF[Review changed outputs]\n  DIFF --> GATE{Within tolerance?}\n  GATE -- yes --> SHIP[Ship]\n  GATE -- no --> FIX[Fix or reject]\n```\n\n### Tolerances (example)\n\n| Metric | Allowed change |\n|---|---|\n| Overall pass rate | ≥ −1 point |\n| Critical cases | 0 regressions |\n| Safety suite | 0 failures |\n| Tone / style checks | ≥ −2 points |\n\n### Include behavior checks\n\nTest for subtle behavior shifts such as sycophancy, verbosity and refusal rates, not only correctness."}, {"id": 79, "title": "Eval-driven development", "tldr": "In eval-driven development, the team writes evals first, then iterates prompts, retrieval, tools or models until the evals pass, and keeps them running forever. It brings test-driven discipline to probabilistic systems.", "real": "Model providers and AI product teams increasingly describe workflows where eval suites run automatically in CI for every prompt or model change, similar to unit tests, with dashboards tracking quality over time.", "body": "### Loop\n\n```mermaid\nflowchart LR\n  DEFINE[Define criteria] --> WRITE[Write eval cases]\n  WRITE --> BUILD[Build or change]\n  BUILD --> RUN[Run evals]\n  RUN --> ANALYZE[Analyze failures]\n  ANALYZE --> BUILD\n  RUN -->|meets bar| SHIP[Ship + monitor]\n  SHIP --> PROD[Production failures]\n  PROD --> WRITE\n```\n\n### Error analysis\n\nGroup failures into categories (missing context, wrong tool, tone, format), fix the largest category first, and re-run.\n\n### Team habit\n\nWeekly “failure review” where PM, engineering and ML read real failing outputs together."}, {"id": 80, "title": "Communicating AI quality to stakeholders", "tldr": "Executives and customers need understandable quality statements: what the AI does well, how often it fails, what happens when it fails, and how quality is improving. Avoid both hype and vague hedging; use concrete numbers and examples.", "real": "AI model providers publish system cards and evaluation results for major model releases, and enterprise vendors increasingly share accuracy metrics and limitations in documentation and trust centers to set customer expectations.", "body": "### Quality summary template\n\n| Item | Example |\n|---|---|\n| What it does | Drafts replies to billing questions |\n| How good | 91% of drafts rated usable by agents |\n| Common failures | Outdated policy references (4%) |\n| Safeguards | Agents review all drafts; citations shown |\n| Trend | Up from 84% last quarter |\n| Next | Policy sync improvements |\n\n### Trend chart (illustrative)\n\n```chart\n{\"title\": \"Drafts rated usable by agents (illustrative)\", \"unit\": \"%\", \"data\": [[\"Q1\", 78], [\"Q2\", 84], [\"Q3\", 88], [\"Q4\", 91]]}\n```\n\n### Avoid\n\n“It’s 99% accurate” without defining the measure, or “AI can make mistakes” without numbers."}, {"id": 81, "title": "Designing for probabilistic outputs", "tldr": "AI outputs vary and are sometimes wrong, so UX must make outputs easy to review, edit, regenerate or reject, show sources where possible, and avoid presenting uncertain content as definitive fact.", "real": "Google’s People + AI Guidebook (first published in 2019) offers design patterns for AI products, including setting expectations, explaining outputs and designing for graceful failure, and is widely used by product designers.", "body": "### Design patterns\n\n| Pattern | Example |\n|---|---|\n| Suggest, don’t impose | Draft appears as editable suggestion |\n| Easy correction | Inline edit, regenerate, undo |\n| Multiple options | Show 2–3 alternatives |\n| Show sources | Citations next to claims |\n| Clear AI labeling | “AI-generated draft” |\n| Graceful failure | “I couldn’t find this; here’s how to get help” |\n\n### Interaction model\n\n```mermaid\nflowchart LR\n  AI[AI output] --> REVIEW[User reviews]\n  REVIEW --> ACCEPT[Accept]\n  REVIEW --> EDIT[Edit]\n  REVIEW --> REGEN[Regenerate]\n  REVIEW --> REJECT[Reject / feedback]\n```"}, {"id": 82, "title": "Setting expectations and onboarding", "tldr": "Tell users clearly what the AI can and cannot do, show good examples, and suggest starting prompts. Good onboarding prevents disappointment from overestimating the AI and non-use from underestimating it.", "real": "ChatGPT’s interface has long shown example prompts and a short note that it can make mistakes, and many AI products use suggested prompts or templates on first use to teach users what kinds of requests work well.", "body": "### Onboarding elements\n\n| Element | Example |\n|---|---|\n| Capability statement | “I can answer questions about your orders and returns.” |\n| Limits | “I can’t change payment methods.” |\n| Example prompts | 3–4 clickable examples |\n| Accuracy note | “Check important details” |\n| Data note | How information is used |\n\n### Progressive disclosure\n\n```mermaid\nflowchart LR\n  FIRST[First use: simple examples] --> SUCCESS[Early success]\n  SUCCESS --> ADV[Introduce advanced features]\n  ADV --> HABIT[Habitual use]\n```\n\n### Measure\n\nActivation rate (first successful task), prompts per new user, and early retention."}, {"id": 83, "title": "Transparency and explanations", "tldr": "Explain AI outputs in ways that help users decide whether to trust them: sources, key factors, confidence indicators and reasoning summaries. Explanations should be accurate, concise and actionable, not decorative.", "real": "US consumer lending rules under the Equal Credit Opportunity Act require lenders to give specific reasons for adverse credit decisions, and the Consumer Financial Protection Bureau stated in 2022 that this applies even when complex algorithms are used.", "body": "### Explanation types\n\n| Type | Example | Use |\n|---|---|---|\n| Source citation | “Based on Policy v4, section 2” | Q&A, research |\n| Key factors | “Flagged: new device, unusual location” | Risk decisions |\n| Confidence | “High / medium / low confidence” | Triage |\n| Reasoning summary | “Compared plans A and B on price and limits” | Recommendations |\n| Counterfactual | “Approval likely if income verified” | Decisions affecting people |\n\n### Rules\n\n- Explanations must reflect what the system actually used\n- Keep them short and in plain language\n- Provide a path to contest or get human review for consequential decisions"}, {"id": 84, "title": "Citations and grounding in the UI", "tldr": "Showing sources lets users verify AI answers and builds calibrated trust. Make citations specific (linked to passages), visible near claims, and easy to open. Design for when sources are missing or conflicting.", "real": "Perplexity built its product around inline citations for every answer, and Google’s AI Overviews display links to source websites, making visible sourcing a defining feature of AI answer products.", "body": "### Citation UI patterns\n\n| Pattern | Benefit |\n|---|---|\n| Inline numbered citations | Claim-level verification |\n| Source cards with snippets | Quick context |\n| Highlight passage on click | Fast checking |\n| Source freshness date | Trust in currency |\n| “No source found” message | Honesty |\n\n### Grounding flow\n\n```mermaid\nflowchart LR\n  Q[Question] --> RET[Retrieve sources]\n  RET --> ANS[Answer with citations]\n  ANS --> UI[Citations shown next to claims]\n  UI --> CLICK[User opens source passage]\n```\n\n### Quality check\n\nMeasure citation accuracy: do cited passages actually support the claims?"}, {"id": 85, "title": "Human-in-the-loop UX", "tldr": "When humans review or approve AI work, design the review experience carefully: show what matters, highlight uncertainty, make approve/edit/reject fast, explain consequences of actions, and capture corrections as feedback.", "real": "Coding agents such as Claude Code and GitHub Copilot’s agent mode ask users to approve certain actions like running shell commands and show diffs of proposed code changes, a pattern for keeping humans in control of consequential actions.", "body": "### Review screen elements\n\n| Element | Purpose |\n|---|---|\n| Proposed action in full detail | No hidden effects |\n| Diff or before/after | Clear changes |\n| Sources and reasoning | Basis for decision |\n| Uncertain parts highlighted | Focus attention |\n| Approve / edit / reject | Fast decision |\n| Reason capture | Learning signal |\n\n### Avoid approval fatigue\n\n```mermaid\nflowchart LR\n  RISK{Action risk} -->|low| AUTO[Auto-run with log]\n  RISK -->|medium| BATCH[Batch approvals]\n  RISK -->|high| CONFIRM[Individual confirmation]\n```"}, {"id": 86, "title": "Error states and recovery", "tldr": "Plan for AI failure modes in the UI: no answer found, low confidence, refusals, timeouts, tool failures and wrong outputs. Give clear messages, alternatives and easy recovery paths, including reaching a human.", "real": "Chatbot failures that went viral, such as DPD’s chatbot swearing at a customer in 2024 and a Chevrolet dealer’s chatbot “agreeing” to sell a car for $1 in 2023, show how poorly handled edge cases become public brand incidents.", "body": "### Error state design\n\n| Situation | Response |\n|---|---|\n| No relevant information | “I couldn’t find that in our help center. Want to talk to an agent?” |\n| Low confidence | Show answer with caution and sources, suggest verification |\n| Out of scope | Explain scope politely, redirect |\n| Policy refusal | Brief, non-judgmental explanation |\n| Timeout / outage | Retry option, fallback content |\n| User reports error | Thank, apologize, offer alternative |\n\n### Recovery paths\n\n```mermaid\nflowchart LR\n  FAIL[Failure] --> MSG[Clear message]\n  MSG --> RETRY[Retry / rephrase suggestions]\n  MSG --> HUMAN[Human help]\n  MSG --> ALT[Alternative: search, docs]\n```"}, {"id": 87, "title": "Feedback UX", "tldr": "Make feedback effortless and valuable: one-tap ratings, optional reasons, implicit signals from edits and regenerations, and visible responses to feedback. Good feedback UX feeds the data flywheel and builds user goodwill.", "real": "AI assistants such as ChatGPT, Claude and Gemini place thumbs-up and thumbs-down controls on each response, and some ask users to compare two responses side by side, collecting preference data at scale.", "body": "### Feedback patterns\n\n| Pattern | When |\n|---|---|\n| Thumbs up/down | Every response |\n| Reason chips | After thumbs down |\n| Side-by-side preference | Occasionally, for model comparison |\n| Edit capture | Drafting tools |\n| Report problem | Safety or legal issues |\n\n### Thumbs-down follow-up chips\n\n`Incorrect` · `Not relevant` · `Too long` · `Unsafe` · `Didn't follow instructions` · `Other`\n\n### Close the loop\n\nPublish “what we improved” notes, and occasionally reply to users who reported issues."}, {"id": 88, "title": "Conversational UX", "tldr": "Chat is flexible but not always the best interface. Design conversations with clear scope, good first responses, follow-up suggestions, memory of context, and structured UI elements (buttons, forms, cards) where they are faster than typing.", "real": "Anthropic introduced Artifacts in Claude in June 2024, displaying generated documents, code and apps in a separate panel next to the chat, an example of combining conversation with structured, editable work surfaces.", "body": "### When chat fits\n\n| Good fit | Poor fit |\n|---|---|\n| Open-ended questions | Repetitive structured tasks |\n| Exploration and brainstorming | Precise configuration |\n| Multi-step clarification | Comparing many options visually |\n\n### Hybrid patterns\n\n```mermaid\nflowchart LR\n  CHAT[Chat] --> CARDS[Rich cards: products, orders]\n  CHAT --> FORMS[Forms for structured input]\n  CHAT --> CANVAS[Side panel for documents / code]\n  CHAT --> BUTTONS[Suggested replies / actions]\n```\n\n### Conversation design principles\n\nShort answers by default, offer next steps, ask clarifying questions only when needed, and remember earlier context within the session."}, {"id": 89, "title": "UX for agents and long-running tasks", "tldr": "Agent UX must show what the agent plans, what it is doing, what it has done, and where it needs input. Provide progress visibility, interruption and correction, approvals for risky steps, and clear summaries of results.", "real": "OpenAI’s ChatGPT agent (2025) and similar browser agents show their actions in a visible browser view, ask for confirmation before consequential actions such as purchases, and let users take control for steps like logging in.", "body": "### Agent UX elements\n\n| Element | Purpose |\n|---|---|\n| Plan preview | Align before work starts |\n| Live progress | Trust and transparency |\n| Step log | Audit and debugging |\n| Pause / stop / redirect | User control |\n| Approval prompts | Safety on risky actions |\n| Result summary with evidence | Verify outcomes |\n| Notifications | Long tasks finishing |\n\n### Lifecycle\n\n```mermaid\nflowchart LR\n  ASK[User goal] --> PLAN[Agent proposes plan]\n  PLAN --> APPROVE[User approves / edits]\n  APPROVE --> RUN[Agent works with visible progress]\n  RUN --> CHECK[Approval for risky steps]\n  CHECK --> DONE[Summary + evidence]\n```"}, {"id": 90, "title": "Accessibility and inclusive AI design", "tldr": "AI can greatly improve accessibility (descriptions, captions, voice interfaces, simplification) but can also exclude people through biased performance, inaccessible interfaces or language gaps. Test with diverse users and languages.", "real": "Microsoft’s Seeing AI app, released in 2017, describes people, text and scenes for blind and low-vision users, and Be My Eyes integrated GPT-4 vision in 2023, showing AI’s potential to expand accessibility when designed with affected communities.", "body": "### Inclusive design checklist\n\n- [ ] Works with screen readers and keyboard navigation\n- [ ] Voice input and output options\n- [ ] Plain-language outputs available\n- [ ] Performance tested across accents, dialects and languages\n- [ ] Performance tested across demographic groups\n- [ ] Alternative non-AI paths available\n- [ ] Involve disabled users in research and testing\n\n### AI accessibility opportunities\n\n| Capability | Benefit |\n|---|---|\n| Image descriptions | Blind and low-vision users |\n| Live captions | Deaf and hard-of-hearing users |\n| Simplified text | Cognitive accessibility |\n| Translation | Language accessibility |\n| Voice control | Motor impairments |"}, {"id": 91, "title": "Responsible AI principles in practice", "tldr": "Responsible AI principles, such as fairness, reliability and safety, privacy and security, inclusiveness, transparency and accountability, must be turned into concrete product requirements, reviews, tests and metrics, not left as statements.", "real": "Microsoft published its Responsible AI Standard (version 2 in 2022) translating principles into specific requirements for product teams, and Google published AI Principles in 2018; both companies use review processes for sensitive AI launches.", "body": "### From principle to practice\n\n| Principle | Product requirement example |\n|---|---|\n| Fairness | Quality gap between user groups < 3 points |\n| Reliability and safety | Red-team suite passes; fallback defined |\n| Privacy and security | No training on customer data without consent |\n| Inclusiveness | Tested in all supported languages |\n| Transparency | AI-generated content labeled |\n| Accountability | Named owner, incident process |\n\n### Review flow\n\n```mermaid\nflowchart LR\n  INTAKE[Use case intake] --> RISK[Risk assessment]\n  RISK --> REQ[Requirements + mitigations]\n  REQ --> TEST[Testing evidence]\n  TEST --> SIGN[Sign-off]\n  SIGN --> MON[Monitoring]\n```"}, {"id": 92, "title": "Bias and fairness", "tldr": "AI can perform worse for some groups or reproduce historical discrimination. Define relevant groups, measure performance and outcomes by group, investigate causes, mitigate with data, model and product changes, and monitor continuously.", "real": "Reuters reported in 2018 that Amazon had scrapped an experimental recruiting tool after finding it penalized resumes that included the word “women’s”, having learned from historical hiring patterns. The case is widely cited as a warning about biased training data.", "body": "### Fairness checks\n\n| Check | Example |\n|---|---|\n| Performance parity | Accuracy by language, region, gender where appropriate |\n| Outcome parity | Approval rates by group |\n| Representation | Training and eval data coverage |\n| Stereotypes | Generated content audits |\n\n### Process\n\n```mermaid\nflowchart LR\n  DEFINE[Define groups and harms] --> MEASURE[Measure by group]\n  MEASURE --> GAP{Significant gaps?}\n  GAP -- yes --> CAUSE[Find causes]\n  CAUSE --> MITIGATE[Mitigate: data, model, UX, human review]\n  MITIGATE --> MEASURE\n  GAP -- no --> MONITOR[Monitor ongoing]\n```\n\n### Caution\n\nFairness definitions can conflict; choose with legal, policy and affected stakeholders, and document reasoning."}, {"id": 93, "title": "Safety policies and content standards", "tldr": "Define what your AI must never do, what it should handle carefully, and how it responds. Policies cover harmful content, regulated advice, vulnerable users and brand standards, and must be implemented through prompts, classifiers, testing and enforcement.", "real": "Meta released its Galactica scientific language model demo in November 2022 and took it down after about three days, following criticism that it produced authoritative-sounding but false or biased scientific text, illustrating the need for clear safety and quality standards before public launch.", "body": "### Policy structure\n\n| Tier | Example | Response |\n|---|---|---|\n| Prohibited | Instructions for serious harm | Refuse |\n| Sensitive | Medical, legal, financial questions | Inform, disclaim, refer |\n| Vulnerable users | Self-harm signals | Supportive response, resources |\n| Brand | Offensive jokes, competitor attacks | Decline politely |\n| Allowed | Normal requests | Help fully |\n\n### Implementation layers\n\n```mermaid\nflowchart LR\n  POLICY[Written policy] --> PROMPT[System prompt rules]\n  POLICY --> CLASS[Input/output classifiers]\n  POLICY --> EVAL[Safety eval suite]\n  POLICY --> REVIEW[Human review of flagged cases]\n```\n\n### Avoid over-refusal\n\nMeasure refusals on legitimate requests; excessive caution frustrates users."}, {"id": 94, "title": "Security basics for AI PMs", "tldr": "AI products face new attacks: prompt injection, jailbreaks, data exfiltration through outputs, tool misuse, model abuse and supply-chain risks. PMs should ensure threat modeling, least-privilege tool access, confirmation for risky actions and security testing before launch.", "real": "In 2025 Aim Security disclosed “EchoLeak”, a vulnerability in Microsoft 365 Copilot where a crafted email could cause the assistant to leak data without user interaction; Microsoft fixed it. Such incidents show that connecting AI to private data and tools creates new security responsibilities.", "body": "### Key risks\n\n| Risk | Product mitigation |\n|---|---|\n| Prompt injection via documents/web | Treat external content as untrusted; limit tool power |\n| Data exfiltration | Block auto-loading external links/images; review outbound actions |\n| Excessive permissions | Least privilege, user-scoped access |\n| Jailbreaks | Safety layers, monitoring |\n| Cost abuse | Rate limits, quotas |\n| Cross-user data leaks | Strict tenant isolation |\n\n### The “lethal trifecta” (Simon Willison)\n\n```mermaid\nflowchart TB\n  P[Access to private data] --> R[High risk when combined]\n  U[Exposure to untrusted content] --> R\n  E[Ability to communicate externally] --> R\n```\n\nAvoid combining all three in one autonomous flow without human approval."}, {"id": 95, "title": "Privacy by design for AI", "tldr": "Build privacy into AI features: minimize data sent to models, avoid unnecessary retention, provide user controls (history, memory, training opt-outs), protect sensitive categories, and be transparent about data flows to third-party providers.", "real": "When OpenAI introduced memory in ChatGPT (testing began in February 2024), it gave users controls to view, delete or turn off memories and to use temporary chats that do not save history, an example of user-facing privacy controls for AI features.", "body": "### Privacy controls\n\n| Control | Example |\n|---|---|\n| Data minimization | Send only needed fields to the model |\n| Retention limits | Delete logs after N days |\n| User controls | Clear history, disable memory |\n| Training opt-out | Default off for business customers |\n| Sensitive data handling | Detect and redact PII |\n| Vendor agreements | DPAs, zero-retention options where available |\n\n### Data flow transparency\n\n```mermaid\nflowchart LR\n  USER[User input] --> APP[Our app]\n  APP --> REDACT[Redaction]\n  REDACT --> PROVIDER[Model provider under DPA]\n  PROVIDER --> APP\n  APP --> LOGS[(Logs with retention policy)]\n```"}, {"id": 96, "title": "Regulation for AI products", "tldr": "AI products must comply with general laws (privacy, consumer protection, anti-discrimination, sector rules) and AI-specific rules such as the EU AI Act. Know your risk category, transparency duties, documentation needs and timelines.", "real": "The EU AI Act entered into force in August 2024, with prohibitions applying from February 2025 and general-purpose AI obligations from August 2025. In 2026, EU institutions agreed to delay most high-risk obligations to December 2027 and August 2028, while most transparency duties kept their August 2026 date.", "body": "### Regulatory map (simplified)\n\n| Area | Examples |\n|---|---|\n| AI-specific | EU AI Act; Korea AI Basic Act; China generative AI measures |\n| Privacy | GDPR, India DPDP Act, US state privacy laws |\n| Consumer protection | Unfair or deceptive practices rules |\n| Anti-discrimination | Lending, hiring, housing laws |\n| Sector rules | Healthcare devices, financial services |\n\n### EU AI Act risk tiers\n\n| Tier | Example | Obligation |\n|---|---|---|\n| Prohibited | Social scoring | Banned |\n| High-risk | Hiring, credit scoring | Risk management, documentation, oversight |\n| Transparency | Chatbots, deepfakes | Disclose AI interaction, label content |\n| Minimal | Spam filters | Voluntary codes |\n\nThis is a summary, not legal advice; involve legal counsel early."}, {"id": 97, "title": "Disclosure and labeling of AI", "tldr": "Tell users when they are interacting with AI and when content is AI-generated, especially where it could mislead. Use clear labels, provenance metadata for media, and honest marketing about capabilities.", "real": "The EU AI Act requires disclosure when people interact with AI systems such as chatbots and labeling of certain AI-generated content, and image generators such as Adobe Firefly attach Content Credentials (C2PA metadata) indicating AI generation.", "body": "### Disclosure patterns\n\n| Context | Pattern |\n|---|---|\n| Chatbot | “You’re chatting with an AI assistant” |\n| AI-written text | “Drafted with AI” label |\n| Generated images/video | Visible label + provenance metadata |\n| AI voice calls | Clear statement at the start |\n| Marketing | Accurate capability claims |\n\n### Honest marketing\n\n| Avoid | Prefer |\n|---|---|\n| “Never makes mistakes” | “Answers 9 in 10 common questions accurately in our tests” |\n| “Replaces your team” | “Handles routine requests so your team can focus on complex ones” |"}, {"id": 98, "title": "AI incident response", "tldr": "Prepare for AI incidents, such as harmful outputs going viral, data leaks, biased decisions or runaway costs, with detection, kill switches, escalation paths, communication plans and postmortems. Speed and transparency limit damage.", "real": "In February 2024 Google paused Gemini’s ability to generate images of people after it produced historically inaccurate images, and said it would improve the feature before re-enabling it. A fast pause is a standard containment step in AI incidents.", "body": "### Incident playbook\n\n```mermaid\nflowchart LR\n  DETECT[Detect: monitoring, reports, social] --> TRIAGE[Assess severity]\n  TRIAGE --> CONTAIN[Contain: disable feature, block outputs, rollback]\n  CONTAIN --> COMM[Communicate: users, customers, leadership]\n  COMM --> FIX[Fix root cause]\n  FIX --> REENABLE[Re-enable gradually]\n  REENABLE --> POST[Postmortem + new evals]\n```\n\n### Preparedness\n\n| Item | Example |\n|---|---|\n| Kill switch | Feature flag to disable within minutes |\n| Severity levels | Defined by user harm and scale |\n| Owners | On-call PM and engineer |\n| Templates | Customer and public statements |\n| Evidence | Logs to understand scope |"}, {"id": 99, "title": "Governance processes for AI products", "tldr": "AI governance ensures the right reviews happen at the right time: use-case intake, risk classification, required assessments, approvals, documentation and monitoring. Good governance is fast for low-risk uses and rigorous for high-risk ones.", "real": "The NIST AI Risk Management Framework (2023) organizes AI governance into Govern, Map, Measure and Manage functions, and ISO/IEC 42001 (2023) defines a certifiable AI management system that many organizations use to structure governance.", "body": "### Risk-tiered process\n\n| Risk tier | Example | Required steps |\n|---|---|---|\n| Low | Internal summarization tool | Self-assessment, basic evals |\n| Medium | Customer-facing assistant | Review board, red team, monitoring |\n| High | Credit, hiring, health decisions | Full impact assessment, legal review, human oversight, audits |\n\n### Lifecycle gates\n\n```mermaid\nflowchart LR\n  IDEA[Idea] --> CLASS[Risk classification]\n  CLASS --> BUILD[Build with requirements]\n  BUILD --> REVIEW[Pre-launch review]\n  REVIEW --> LAUNCH[Launch]\n  LAUNCH --> AUDIT[Periodic review]\n```"}, {"id": 100, "title": "Ethical decision-making for AI PMs", "tldr": "PMs regularly face ethical trade-offs: engagement vs wellbeing, automation vs jobs, personalization vs privacy, speed vs safety. Use structured reflection, consider affected stakeholders, escalate when needed, and be willing to say no.", "real": "When Snapchat launched its My AI chatbot to all users in 2023, it faced criticism about safety and appropriateness for its young user base, and the UK Information Commissioner’s Office issued a preliminary enforcement notice over the company’s privacy risk assessment, later concluding in 2024 that Snap had addressed the concerns.", "body": "### Ethical review questions\n\n| Question | Purpose |\n|---|---|\n| Who could be harmed, and how? | Identify stakeholders |\n| Would users be surprised by this? | Transparency |\n| Are vulnerable users affected? | Extra care (children, distress) |\n| What happens if it fails at scale? | Severity |\n| Would we be comfortable explaining this publicly? | Accountability |\n\n### Decision process\n\n```mermaid\nflowchart LR\n  ISSUE[Ethical concern] --> ANALYZE[Analyze stakeholders and harms]\n  ANALYZE --> OPTIONS[Options and mitigations]\n  OPTIONS --> CONSULT[Consult policy, legal, affected users]\n  CONSULT --> DECIDE[Decide and document]\n```\n\n### Courage\n\nRaise concerns early, propose alternatives, and escalate when serious risks are dismissed."}, {"id": 101, "title": "North star metrics for AI products", "tldr": "A north star metric captures the core value users get, such as tasks completed, hours saved or problems resolved. For AI products, choose a metric reflecting delivered value, not raw usage like messages sent, which can grow when the AI is confusing.", "real": "Google’s HEART framework (Happiness, Engagement, Adoption, Retention, Task success), described by Kerry Rodden and colleagues in 2010, is widely used to choose user-centered metrics and adapts well to AI features where task success is central.", "body": "### Good vs weak north stars\n\n| Weak | Better |\n|---|---|\n| Messages sent | Conversations that resolved the user’s issue |\n| Suggestions shown | Suggestions accepted and kept |\n| AI feature clicks | Weekly users completing a task with AI |\n| Tokens processed | Hours saved per active user |\n\n### HEART for an AI assistant\n\n| Dimension | Metric |\n|---|---|\n| Happiness | Satisfaction rating |\n| Engagement | Tasks per user per week |\n| Adoption | % of new users completing first task |\n| Retention | Week-4 retention |\n| Task success | Resolution rate without human help |"}, {"id": 102, "title": "Quality metrics vs engagement metrics", "tldr": "Engagement can rise for bad reasons (retries, confusion) and quality can improve while engagement falls (faster answers). Track quality and outcomes alongside engagement, and interpret changes carefully.", "real": "YouTube changed its recommendation objective from clicks to watch time in 2012 because click-based optimization rewarded misleading thumbnails, and later added user satisfaction surveys, illustrating how metric choice shapes product behavior.", "body": "### Interpreting signals\n\n| Signal | Possible good meaning | Possible bad meaning |\n|---|---|---|\n| More messages per session | Rich engagement | AI not answering clearly |\n| Shorter sessions | Faster answers | Users giving up |\n| More regenerations | Exploring options | Poor first outputs |\n| Fewer escalations | Better resolution | Escalation path hidden |\n\n### Balanced scorecard\n\n```mermaid\nflowchart LR\n  Q[Quality: eval pass rate, satisfaction] --> V[Value delivered]\n  E[Engagement: active users, tasks] --> V\n  O[Outcomes: time saved, resolution] --> V\n  G[Guardrails: complaints, safety, cost] -.-> V\n```"}, {"id": 103, "title": "Adoption and retention of AI features", "tldr": "Many AI features see novelty spikes followed by drop-off. Measure activation (first successful use), repeat use, and retention cohorts, and investigate why users stop: quality, discoverability, workflow fit or trust.", "real": "Enterprise customers of AI assistants commonly report that broad licensing does not automatically lead to daily use, which is why vendors and buyers now track active usage and adoption programs rather than seats purchased.", "body": "### Retention curve (illustrative)\n\n```chart\n{\"title\": \"Share of users still using an AI feature (illustrative)\", \"unit\": \"%\", \"data\": [[\"Week 1\", 100], [\"Week 2\", 62], [\"Week 4\", 45], [\"Week 8\", 38], [\"Week 12\", 36]]}\n```\n\nA flattening curve indicates a core of retained users; a curve heading to zero indicates weak product-market fit.\n\n### Adoption funnel\n\n| Stage | Metric |\n|---|---|\n| Aware | Saw the AI feature |\n| Tried | Used once |\n| Activated | Completed a valuable task |\n| Repeat | Used in 3+ separate weeks |\n| Habitual | Weekly usage after 2 months |"}, {"id": 104, "title": "Task success and time saved", "tldr": "The most meaningful AI metrics show whether users complete tasks better or faster. Measure task success rates, time to complete, error rates and rework, using logs, controlled studies and user surveys.", "real": "A 2022 GitHub study reported that developers using Copilot completed a defined coding task 55% faster than a control group, and similar controlled studies have been used to quantify productivity effects of AI tools.", "body": "### Measurement approaches\n\n| Approach | Strength | Weakness |\n|---|---|---|\n| Controlled experiment | Causal evidence | Artificial setting |\n| Log-based timing | Real usage | Confounders |\n| Before/after comparison | Simple | Other changes interfere |\n| Self-reported surveys | Easy | Biased |\n\n### Time saved estimate\n\n```\nTime saved per task = baseline time − time with AI (including review)\nMonthly value = time saved × tasks per month × loaded hourly cost\n```\n\n### Remember review time\n\nInclude the time users spend checking and correcting AI output; net savings can be much lower than generation speed suggests."}, {"id": 105, "title": "A/B testing AI features", "tldr": "A/B tests compare AI variants on real users with randomized assignment. Test prompts, models, UX and features against business and quality metrics, with guardrails, sufficient sample size and attention to novelty effects.", "real": "Ronny Kohavi and colleagues, who led experimentation at Microsoft, documented that most product ideas tested in controlled experiments fail to improve key metrics, which is why disciplined A/B testing is especially valuable for uncertain AI changes.", "body": "### Test design\n\n| Element | Example |\n|---|---|\n| Hypothesis | New model improves resolution rate |\n| Variants | Model A (control) vs Model B |\n| Randomization unit | User or account |\n| Primary metric | Resolution without escalation |\n| Guardrails | CSAT, latency, cost per conversation, safety flags |\n| Duration | 2+ weeks |\n\n### Flow\n\n```mermaid\nflowchart LR\n  USERS[Users] --> SPLIT{Random assignment}\n  SPLIT --> A[Control]\n  SPLIT --> B[Treatment]\n  A --> METRICS[Metrics]\n  B --> METRICS\n  METRICS --> DECISION[Statistical decision]\n```\n\n### AI-specific pitfalls\n\nNon-deterministic outputs add variance; cost differences matter; offline eval wins may not translate online."}, {"id": 106, "title": "Faster experimentation: interleaving, bandits and holdouts", "tldr": "Interleaving compares ranking or recommendation variants within one user’s results; bandits shift traffic toward better variants automatically; long-term holdouts measure cumulative effects of AI features. Each fits different questions.", "real": "Netflix has described using interleaving to evaluate ranking algorithms with far fewer users than traditional A/B tests, and contextual bandits to personalize artwork for titles.", "body": "### Methods\n\n| Method | Use | Advantage |\n|---|---|---|\n| Interleaving | Ranking/search/recommendations | High sensitivity, small samples |\n| Multi-armed bandit | Many variants, ongoing optimization | Less regret |\n| Long-term holdout | Cumulative impact of AI features | Measures lasting effects |\n| Switchback tests | Marketplaces with network effects | Avoids interference |\n\n### Holdout design\n\n```mermaid\nflowchart LR\n  ALL[All users] --> H[5% holdout: no AI feature]\n  ALL --> T[95%: AI feature]\n  H --> CMP[Compare over months]\n  T --> CMP\n```"}, {"id": 107, "title": "Leading indicators", "tldr": "Business outcomes take time to appear; leading indicators predict them early: activation, acceptance rates, early retention, satisfaction and quality scores. Validate that your leading indicators actually correlate with long-term outcomes.", "real": "Facebook’s growth team identified connecting with 7 friends within 10 days as a leading indicator of long-term engagement, and Slack identified teams sending about 2,000 messages as strongly associated with retention.", "body": "### Example leading indicators for AI products\n\n| Leading indicator | Predicts |\n|---|---|\n| First successful task within 24 hours | Retention |\n| Acceptance rate of suggestions | Perceived productivity |\n| Use in 3+ distinct weeks in first month | Habit |\n| Satisfaction on first 5 uses | Continued use |\n| Admin configuration completed (enterprise) | Expansion |\n\n### Validating\n\n```mermaid\nflowchart LR\n  CANDIDATE[Candidate indicator] --> COHORTS[Compare cohorts with/without]\n  COHORTS --> CORR[Correlation with retention / revenue]\n  CORR --> CAUSE[Test causality with experiments]\n```"}, {"id": 108, "title": "Guardrail metrics", "tldr": "Guardrail metrics protect against harm while you optimize the primary metric: safety incidents, complaints, latency, cost per task, refusal rates, escalations and fairness gaps. Experiments that harm guardrails should not ship even if the primary metric wins.", "real": "Mature experimentation programs at companies such as Microsoft, Booking.com and Airbnb define guardrail metrics that every experiment must not degrade, such as performance and reliability, alongside each test’s primary metric.", "body": "### Guardrails for AI features\n\n| Guardrail | Threshold example |\n|---|---|\n| Safety flags per 1,000 responses | No increase |\n| User complaints | No significant increase |\n| p95 latency | < 6 s |\n| Cost per task | ≤ +10% |\n| Refusal rate on legitimate requests | ≤ 2% |\n| Quality gap between languages | < 5 points |\n\n### Decision rule\n\n```\nShip only if: primary metric improves significantly AND all guardrails hold\n```"}, {"id": 109, "title": "Cost metrics", "tldr": "Track AI costs as product metrics: cost per request, per task, per active user, and per unit of value delivered, plus gross margin of AI features. Cost visibility enables smart trade-offs and prevents margin surprises.", "real": "AI-native companies such as Cursor have publicly discussed the challenge of serving heavy users when underlying model costs scale with usage, and adjusted their pricing plans as a result, showing why cost per user is a core product metric.", "body": "### Cost metric set\n\n| Metric | Formula |\n|---|---|\n| Cost per request | Tokens × prices |\n| Cost per task | Σ requests per task |\n| Cost per active user | Monthly AI cost ÷ active users |\n| Cost per value unit | Cost ÷ tasks resolved |\n| AI gross margin | (Revenue − AI serving costs) ÷ Revenue |\n\n### Cost distribution (illustrative)\n\n```chart\n{\"title\": \"Share of AI cost by user decile (illustrative)\", \"unit\": \"%\", \"data\": [[\"Top 10% of users\", 55], [\"Next 20%\", 25], [\"Middle 40%\", 15], [\"Bottom 30%\", 5]]}\n```\n\nHeavy-user concentration is common; plan limits and pricing accordingly."}, {"id": 110, "title": "Dashboards for AI products", "tldr": "An AI product dashboard combines quality, usage, outcomes, guardrails and cost, broken down by segment, model version and feature. It supports weekly reviews and quick detection of regressions.", "real": "Product teams commonly combine analytics tools such as Amplitude or Mixpanel for user behavior with LLM observability platforms for quality, cost and latency, building dashboards that connect model changes to user outcomes.", "body": "### Dashboard layout\n\n| Section | Metrics |\n|---|---|\n| Value | North star, task success, time saved |\n| Adoption | Active users, activation, retention |\n| Quality | Eval pass rate trend, satisfaction, feedback reasons |\n| Guardrails | Safety flags, complaints, refusals |\n| Performance | Latency, errors |\n| Cost | Cost per task, margin |\n| Releases | Model/prompt versions with annotations |\n\n### Weekly review questions\n\n- What changed, and was it caused by our release, a model update or user mix?\n- Which failure category grew?\n- Are costs in line with usage?"}, {"id": 111, "title": "AI unit economics", "tldr": "AI features have real marginal costs: inference, retrieval, tools, storage and human review. Understand cost per task, its distribution across users, and how it compares with the value and price, before scaling.", "real": "Software margins have traditionally been very high because extra users cost little to serve; AI features change this, and analysts and company disclosures since 2023 have highlighted lower gross margins for AI-heavy products compared with traditional SaaS.", "body": "### Cost components\n\n| Component | Driver |\n|---|---|\n| Model inference | Tokens × price, number of calls |\n| Retrieval | Embeddings, vector search |\n| Tools and APIs | Third-party calls |\n| Infrastructure | Hosting, GPUs if self-hosted |\n| Human review | Escalations, quality checks |\n| Monitoring | Logging, evaluation |\n\n### Unit economics\n\n```\nContribution per user = Price − (avg tasks × cost per task) − other variable costs\nAI gross margin = (Revenue − AI variable costs) ÷ Revenue\n```\n\n### Example\n\n| Item | Value |\n|---|---|\n| Price per user/month | $20 |\n| Avg tasks/month | 300 |\n| Cost per task | $0.03 |\n| AI cost per user | $9 |\n| AI gross margin | 55% |"}, {"id": 112, "title": "Pricing models for AI", "tldr": "AI pricing options include bundling into existing plans, paid add-ons, per seat, usage or credits, outcome-based pricing, and hybrid models. Choose based on value metric, cost structure, customer predictability needs and competition.", "real": "Microsoft priced Microsoft 365 Copilot at $30 per user per month for enterprises in 2023, Salesforce launched Agentforce in 2024 at $2 per conversation, and Intercom charges $0.99 per resolution for its Fin agent, three distinct pricing philosophies for AI.", "body": "### Models\n\n| Model | Pros | Cons |\n|---|---|---|\n| Included in plan | Adoption, competitive defense | Margin pressure |\n| Paid add-on (per seat) | Simple, predictable | Value varies by user |\n| Usage / credits | Aligns cost and price | Bill anxiety |\n| Outcome-based | Aligned with value | Defining outcomes |\n| Hybrid | Balance | Complexity |\n\n### Choosing\n\n```mermaid\nflowchart TD\n  V{Clear measurable outcome?} -- yes --> O[Outcome-based]\n  V -- no --> U{Usage varies a lot between users?}\n  U -- yes --> USAGE[Usage / credits or tiers with limits]\n  U -- no --> SEAT[Per seat / add-on]\n```"}, {"id": 113, "title": "Packaging AI features", "tldr": "Decide which AI capabilities go in which tiers: basic AI in all plans to drive adoption, advanced or high-cost AI in premium tiers or add-ons, with usage limits aligned to cost. Packaging communicates value and protects margins.", "real": "Notion launched Notion AI as a paid add-on in 2023 and later integrated AI more deeply into its higher-tier plans, illustrating how companies evolve AI packaging as adoption and costs change.", "body": "### Packaging grid (example)\n\n| Capability | Free | Pro | Business | Enterprise |\n|---|---|---|---|---|\n| Basic AI writing | Limited | ✓ | ✓ | ✓ |\n| AI Q&A over workspace | — | Limited | ✓ | ✓ |\n| AI agents / automation | — | — | ✓ | ✓ |\n| Admin controls, audit logs | — | — | — | ✓ |\n| Usage limits | Low | Medium | High | Custom |\n\n### Principles\n\n- Give a taste of AI value in lower tiers\n- Put high-cost capabilities where price supports them\n- Enterprise controls in enterprise tiers\n- Make limits clear and visible"}, {"id": 114, "title": "Free tiers, limits and fair use", "tldr": "Free tiers drive adoption but can be expensive with AI. Use usage limits, smaller models for free users, rate limits, queueing at peak times and clear upgrade paths. Communicate limits transparently.", "real": "Consumer AI assistants such as ChatGPT, Claude and Gemini offer free tiers with usage limits and access to some models, and paid tiers with higher limits and access to more capable models, a common pattern to balance adoption and cost.", "body": "### Limit strategies\n\n| Strategy | Example |\n|---|---|\n| Message caps | N messages per day |\n| Model tiers | Smaller model for free tier |\n| Feature gating | Advanced tools for paid users |\n| Peak-time throttling | Slower or queued during high load |\n| Fair-use policies | Prevent abuse of “unlimited” plans |\n\n### Upgrade moments\n\n```mermaid\nflowchart LR\n  FREE[Free user hits limit] --> MSG[Clear message: what's limited, when it resets]\n  MSG --> OPT[Option: upgrade or wait]\n  OPT --> PAID[Paid conversion]\n```\n\n### Avoid\n\nSurprise limits mid-task without warning, and “unlimited” promises you cannot afford."}, {"id": 115, "title": "Managing margins as usage grows", "tldr": "AI margins can erode as heavy users scale usage or as features become more expensive (agents, long context). Manage with routing, caching, efficient prompts, model upgrades that lower cost, limits for outliers and pricing adjustments.", "real": "In mid-2025, AI coding tool Cursor changed its Pro plan’s usage limits, faced user backlash over unexpected charges, apologized and offered refunds. It showed how margin pressure and pricing communication interact.", "body": "### Margin levers\n\n| Lever | Effect |\n|---|---|\n| Model routing | Cheaper models for easy tasks |\n| Prompt caching | Cheaper repeated context |\n| Shorter context | Fewer tokens |\n| Output limits | Fewer tokens |\n| Batch processing | Discounts for async work |\n| Usage tiers | Heavy users pay more |\n| Newer cheaper models | Re-evaluate quarterly |\n\n### Margin monitoring\n\n```mermaid\nflowchart LR\n  USAGE[Usage growth] --> COST[AI cost tracking per user/feature]\n  COST --> ALERT[Margin alerts]\n  ALERT --> ACT[Optimize or reprice]\n```\n\n### Communication\n\nAnnounce pricing changes early, explain why, provide estimates, and protect existing users during transitions."}, {"id": 116, "title": "Enterprise AI pricing and contracts", "tldr": "Enterprise AI deals include committed spend or seat volumes, usage pools, overage terms, SLAs, data protection commitments, IP indemnities and governance features. Pricing must balance predictability for buyers with cost protection for you.", "real": "Major AI providers introduced copyright and IP indemnities for enterprise customers, such as Microsoft’s Copilot Copyright Commitment announced in September 2023, addressing a key enterprise purchasing concern.", "body": "### Contract components\n\n| Component | Example |\n|---|---|\n| Commitment | Annual seat count or spend |\n| Usage pool | Credits shared across organization |\n| Overage | Rate beyond pool |\n| Data terms | No training on customer data, retention, region |\n| Security | Certifications, SSO, audit logs |\n| IP indemnity | Protection against output IP claims |\n| SLAs | Availability, support response |\n\n### Pricing structure (example)\n\n```\nPlatform fee: $50,000/year (governance, admin, support)\n+ Seats: $25/user/month for 1,000 users\n+ Usage pool: 5M agent actions/year included; $0.01 each beyond\n```"}, {"id": 117, "title": "Helping customers measure ROI", "tldr": "Enterprise buyers need proof that AI delivers value. Provide ROI frameworks, baseline measurement, in-product analytics (time saved, tasks completed), and success reviews, so renewals and expansions are grounded in evidence.", "real": "Enterprise AI vendors increasingly provide adoption and impact dashboards to customer administrators, such as usage and productivity reports for Microsoft 365 Copilot, because buyers must justify AI spending to finance teams.", "body": "### ROI framework\n\n```\nAnnual value = users × tasks per user per week × minutes saved per task × 52 ÷ 60 × hourly cost\nROI = (Annual value − Annual cost) ÷ Annual cost\n```\n\n### Example\n\n| Input | Value |\n|---|---|\n| Users | 500 |\n| Tasks per user per week | 10 |\n| Minutes saved per task | 6 |\n| Hourly cost | $40 |\n| Annual value | $1.04M |\n| Annual cost | $180K |\n| ROI | 478% |\n\n### In-product evidence\n\nTasks completed with AI, acceptance rates, estimated time saved, and adoption by team."}, {"id": 118, "title": "Monetization experiments", "tldr": "Test pricing and packaging carefully: price sensitivity research, packaging experiments, limited rollouts, and analysis of conversion, retention and margins. Pricing changes affect trust, so experiment ethically and communicate clearly.", "real": "Pricing research methods such as Van Westendorp’s price sensitivity meter and conjoint analysis are commonly used by SaaS companies to estimate willingness to pay before launching new AI add-ons or tiers.", "body": "### Methods\n\n| Method | Use |\n|---|---|\n| Customer interviews | Value perception |\n| Van Westendorp survey | Acceptable price range |\n| Conjoint analysis | Feature–price trade-offs |\n| Landing page tests | Demand at price points |\n| Cohort pricing tests | Real conversion and retention |\n| Sales feedback | Enterprise willingness to pay |\n\n### Metrics\n\n| Metric | Watch |\n|---|---|\n| Conversion to paid | Price acceptance |\n| Upgrade rate | Packaging fit |\n| Churn after change | Trust impact |\n| Margin | Sustainability |\n\n### Ethics\n\nAvoid charging different users different prices for identical offers without a transparent reason (such as region or plan)."}, {"id": 119, "title": "Forecasting AI costs", "tldr": "Forecast AI costs from expected users, usage per user, tokens per task, model prices and growth, plus scenarios for heavy usage and price changes. Include costs in product plans and pricing decisions.", "real": "Cloud cost management (FinOps) practices, formalized by the FinOps Foundation, have expanded to cover AI workloads, with teams tracking token usage and GPU costs per product feature alongside traditional cloud spend.", "body": "### Forecast model\n\n```\nMonthly cost = active users × tasks per user × calls per task × tokens per call × price per token\n```\n\n### Scenario table (illustrative)\n\n| Scenario | Active users | Tasks/user | Cost/task | Monthly cost |\n|---|---|---|---|---|\n| Base | 50,000 | 40 | $0.02 | $40,000 |\n| Heavy usage | 50,000 | 80 | $0.02 | $80,000 |\n| Agents launched | 50,000 | 40 | $0.06 | $120,000 |\n| Model price drop | 50,000 | 40 | $0.01 | $20,000 |\n\n### Practices\n\nMonthly forecast vs actual reviews, alerts at budget thresholds, and cost impact estimates in every feature spec."}, {"id": 120, "title": "Business cases for AI initiatives", "tldr": "An AI business case quantifies expected value (revenue, cost savings, retention), costs (build, run, people), risks and timeline, with milestones that unlock further investment. Stage-gated funding fits uncertain AI work.", "real": "Large enterprises increasingly require stage-gated business cases for generative AI programs after many pilots failed to reach production; Gartner predicted in 2024 that at least 30% of generative AI projects would be abandoned after proof of concept by the end of 2025.", "body": "### Business case structure\n\n| Section | Content |\n|---|---|\n| Opportunity | Problem, users, scale |\n| Value | Quantified benefits with assumptions |\n| Costs | Build, inference, operations, people |\n| Risks | Quality, adoption, regulatory, vendor |\n| Plan | Phases, milestones, decision gates |\n| Metrics | How success will be measured |\n\n### Stage gates\n\n```mermaid\nflowchart LR\n  G0[Gate 0: problem validated] --> G1[Gate 1: prototype meets quality bar]\n  G1 --> G2[Gate 2: pilot shows value]\n  G2 --> G3[Gate 3: economics work at scale]\n  G3 --> SCALE[Scale investment]\n```"}, {"id": 121, "title": "Launch strategy for AI products", "tldr": "Launch AI features in stages: internal dogfooding, trusted testers, limited beta, gradual rollout, general availability. Each stage has quality, safety and adoption gates. Match launch visibility to confidence in quality.", "real": "After early problems with AI Overviews in May 2024, Google described adding restrictions and improvements, and many companies have since favored staged rollouts and “labs” or “preview” labels for new AI features to set expectations.", "body": "### Launch stages\n\n```mermaid\nflowchart LR\n  DOG[Internal dogfood] --> TT[Trusted testers]\n  TT --> BETA[Limited beta / preview]\n  BETA --> ROLL[Gradual rollout 5% → 50%]\n  ROLL --> GA[General availability]\n```\n\n### Gates\n\n| Stage | Gate criteria |\n|---|---|\n| Dogfood → testers | Eval bar met, no critical safety issues |\n| Testers → beta | Positive feedback, failure categories understood |\n| Beta → rollout | Adoption, satisfaction, cost within plan |\n| Rollout → GA | Stable metrics, support ready |\n\n### Labels\n\n“Preview” or “beta” labels set expectations but do not excuse harmful failures."}, {"id": 122, "title": "Beta programs", "tldr": "Beta programs put AI features in front of real users with feedback channels, close communication and measurement. Choose diverse participants, define what you want to learn, and act visibly on feedback.", "real": "GitHub Copilot launched as a technical preview in June 2021 and became generally available in June 2022 after a year of preview usage, during which GitHub gathered usage data and feedback at scale.", "body": "### Beta design\n\n| Element | Example |\n|---|---|\n| Goals | Validate quality on real data; learn failure modes |\n| Participants | 30 customers across 3 segments |\n| Duration | 6–8 weeks |\n| Feedback channels | In-product, weekly calls, shared channel |\n| Success criteria | Usage, satisfaction, quality thresholds |\n| Exit plan | Conversion to paid or GA terms |\n\n### Participant mix\n\nInclude power users, typical users, skeptics, different languages and regulated customers if relevant.\n\n### Communication\n\nWeekly updates on fixes, known issues list, and clear terms on data use during the beta."}, {"id": 123, "title": "Staged rollouts and feature flags", "tldr": "Roll out AI features gradually with feature flags, monitor quality, cost and safety at each step, and keep the ability to roll back instantly. Flags also allow per-customer enablement and kill switches.", "real": "Software companies widely use feature flag platforms

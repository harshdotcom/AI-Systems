2024, the US Federal Communications Commission ruled that AI-generated voices in robocalls count as “artificial” voices under the Telephone Consumer Protection Act, making such calls illegal without prior consent. The EU AI Act also requires that people be informed when interacting with AI systems such as chatbots, with transparency duties applying from August 2026.", "body": "### Compliance map\n\n| Area | Examples |\n|---|---|\n| Calling | TCPA (US), do-not-call registries, TRAI rules (India) |\n| Email | CAN-SPAM (US), GDPR and ePrivacy (EU) |\n| Privacy | GDPR, India’s DPDP Act, US state privacy laws |\n| AI disclosure | EU AI Act transparency duties |\n| Advertising claims | Truth-in-advertising rules (e.g. FTC) |\n| Recording | Consent laws by jurisdiction |\n\n### Practical controls\n\n- Consent records for automated calls and texts\n- Disclosure when customers chat with AI\n- Human review of AI-generated claims\n- Data processing agreements with AI vendors\n- Legal review before launching new AI outreach programs"}, {"id": 188, "title": "Privacy and data protection in prospecting", "tldr": "Prospecting uses personal data, so privacy law applies: have a legal basis, collect only what you need, be transparent, honor opt-outs and deletion requests, secure data, and be careful with purchased lists.", "real": "Under the EU’s GDPR, regulators have fined companies for unlawful direct marketing and data processing, and India’s Digital Personal Data Protection Act, 2023, with rules notified in November 2025, introduces consent and data-handling obligations relevant to sales and marketing teams.", "body": "### Principles\n\n| Principle | In prospecting |\n|---|---|\n| Lawful basis | Consent or legitimate interest (where allowed) |\n| Minimization | Only business-relevant contact data |\n| Transparency | Explain who you are and why you contacted them |\n| Opt-out | Easy unsubscribe, honored promptly |\n| Accuracy | Update or delete outdated data |\n| Security | Protect lists and CRM access |\n\n### Purchased lists checklist\n\n- [ ] Source and collection method documented\n- [ ] Legal basis valid in target countries\n- [ ] Opt-out and suppression lists applied\n- [ ] Contract terms with data vendor reviewed\n\n### Rule\n\nWhen in doubt, ask legal, especially for EU and other strict jurisdictions."}, {"id": 189, "title": "Personal productivity for salespeople", "tldr": "Top sellers protect selling time: time-blocking prospecting and deep work, prioritizing accounts and deals by value, batching admin, automating repetitive tasks, and ending each day with tomorrow planned.", "real": "Surveys by sales research firms have repeatedly found that sales reps spend well under half their time actually selling, with the rest on administrative tasks, internal meetings and data entry, which is why productivity and automation are major focus areas for sales leaders.", "body": "### Weekly time blocks (example)\n\n| Block | When |\n|---|---|\n| Prospecting power hours | Daily, 9–11 am |\n| Customer meetings | Late morning and afternoon |\n| Deal strategy / proposals | Two afternoon blocks per week |\n| Admin and CRM | 30 minutes end of day |\n| Learning / call review | 1 hour per week |\n\n### Prioritization matrix\n\n```mermaid\nflowchart TB\n  A[High value + closing soon] --> P1[Priority 1]\n  B[High value + early stage] --> P2[Priority 2]\n  C[Low value + closing soon] --> P3[Priority 3]\n  D[Low value + early stage] --> P4[Batch or delegate]\n```\n\n### Daily shutdown\n\nUpdate CRM, set tomorrow’s top 3 actions, and clear follow-ups promised today."}, {"id": 190, "title": "The future of selling", "tldr": "Buyers increasingly self-educate and prefer digital channels, AI handles more routine tasks, and sellers add value through insight, orchestration of complex decisions, trust and relationships. Hybrid human–AI teams will define high-performing sales organizations.", "real": "Gartner has reported that a large majority of B2B buyers prefer a rep-free buying experience for at least parts of their purchase, while complex purchases still require human guidance, a tension shaping how sales roles evolve.", "body": "### Shifts\n\n| From | To |\n|---|---|\n| Information gatekeeper | Insight and guidance provider |\n| Manual research and admin | AI-assisted preparation |\n| Single seller | Team and AI orchestration |\n| Volume outreach | Precise, relevant engagement |\n| Closing deals | Delivering outcomes and expansion |\n\n### Skills that grow in value\n\n```mermaid\nflowchart LR\n  BI[Business acumen] --> V[Value creation]\n  EQ[Empathy and trust] --> V\n  AIF[AI fluency] --> V\n  CON[Consensus building] --> V\n  DATA[Data literacy] --> V\n```\n\n### Constant\n\nPeople still buy from people they trust when decisions are important, complex or risky."}, {"id": 191, "title": "Career paths in sales", "tldr": "Sales offers many paths: SDR to AE to enterprise or strategic AE, into management, sales engineering, customer success, enablement, revenue operations, partnerships or founding companies. Build skills deliberately and document results.", "real": "Many chief revenue officers and founders began their careers in sales development or account executive roles; Salesforce’s Marc Benioff, for example, spent years in sales at Oracle before founding Salesforce in 1999.", "body": "### Career map\n\n```mermaid\nflowchart LR\n  SDR[SDR / BDR] --> AE[SMB / mid-market AE]\n  AE --> EAE[Enterprise / strategic AE]\n  AE --> MGR[Sales manager]\n  EAE --> MGR\n  MGR --> DIR[Director / VP]\n  DIR --> CRO[CRO]\n  AE --> SE[Sales engineering]\n  AE --> CS[Customer success / AM]\n  AE --> OPS[RevOps / enablement]\n  EAE --> FOUND[Founder]\n```\n\n### Building your track record\n\n| Asset | Example |\n|---|---|\n| Results | Quota attainment history, deal sizes |\n| Skills | Methodologies, industries, products |\n| Stories | Complex deals you won and how |\n| Network | Customers and colleagues who vouch for you |\n| Reputation | Integrity and reliability |"}, {"id": 192, "title": "Resilience and wellbeing", "tldr": "Sales involves rejection, uncertainty and pressure. Sustainable performance comes from focusing on controllables, healthy routines, support networks, realistic goals and detaching self-worth from individual outcomes.", "real": "Psychologist Martin Seligman’s research with MetLife insurance agents in the 1980s found that agents who scored higher on optimism outsold more pessimistic peers, and the company changed its hiring approach as a result.", "body": "### Controllables vs uncontrollables\n\n| Control | Don’t control |\n|---|---|\n| Activities and preparation | Buyer budgets |\n| Skill development | Market conditions |\n| Follow-through | Competitor moves |\n| Attitude and learning | Individual buyer decisions |\n\n### Healthy routines\n\n- Sleep, exercise and breaks\n- Time-boxed work; avoid constant late nights\n- Peer support and mentoring\n- Celebrate effort and progress, not only wins\n- Reflect: “What did I learn?” after losses\n\n### Warning signs of burnout\n\nPersistent exhaustion, cynicism about customers, declining performance despite effort. Talk to your manager or a professional."}, {"id": 193, "title": "Ethics deep dive: lessons from failures", "tldr": "Sales failures often come from incentives that reward the wrong behavior, pressure without guardrails, and cultures that tolerate dishonesty. Ethical selling requires personal integrity plus systems: aligned incentives, monitoring and speaking up.", "real": "Theranos founder Elizabeth Holmes was convicted in 2022 of defrauding investors with false claims about the company’s blood-testing technology, and the Wells Fargo account scandal showed how sales targets can drive misconduct, both now classic cases in business ethics.", "body": "### Failure pattern\n\n```mermaid\nflowchart LR\n  T[Aggressive targets] --> P[Pressure without guardrails]\n  P --> R[Rationalization: everyone does it]\n  R --> M[Misconduct]\n  M --> H[Customer harm]\n  H --> C[Legal, financial, reputational collapse]\n```\n\n### Safeguards\n\n| Safeguard | Example |\n|---|---|\n| Balanced incentives | Pay on quality and retention, not volume alone |\n| Clawbacks | Recover pay on cancelled or mis-sold deals |\n| Monitoring | Audit unusual patterns |\n| Speak-up channels | Anonymous reporting, no retaliation |\n| Leadership example | Leaders refuse unethical deals |\n\n### Personal test\n\nWould you be comfortable if the customer, your family and a journalist saw exactly what you did and said?"}, {"id": 194, "title": "Building a sales playbook", "tldr": "A playbook documents how your team sells: ICP and personas, messaging, process stages and exit criteria, qualification, discovery questions, demo flows, objection responses, competitive positioning, tools and plays for common scenarios.", "real": "Fast-growing software companies commonly maintain playbooks in their enablement platforms or internal wikis, and update them using win-loss analysis and call recordings so they reflect what actually works.", "body": "### Playbook contents\n\n| Section | Content |\n|---|---|\n| Who we sell to | ICP, personas, triggers |\n| Why customers buy | Pains, value propositions, proof |\n| How we sell | Stages, exit criteria, methodology |\n| Discovery | Question banks by persona |\n| Demos | Flows by use case |\n| Objections | Responses with evidence |\n| Competition | Battlecards |\n| Pricing | Packages, discount rules |\n| Plays | Scenario playbooks (e.g. displacing incumbent, expansion) |\n| Tools | CRM fields, templates |\n\n### Keeping it alive\n\n```mermaid\nflowchart LR\n  FIELD[Field feedback + call recordings] --> UPDATE[Quarterly updates]\n  WINLOSS[Win-loss insights] --> UPDATE\n  UPDATE --> TRAIN[Training + certification]\n  TRAIN --> FIELD\n```"}, {"id": 195, "title": "Capstone: an SMB SaaS sale from first touch to close", "tldr": "Walk through a complete velocity sale: inbound lead, speed-to-lead response, discovery, tailored demo, simple proposal, objection handling and close within weeks, followed by onboarding and expansion planning.", "real": "This capstone mirrors the high-velocity inside sales motions used by SMB-focused software companies that combine self-serve trials with sales assistance, such as those described in HubSpot’s and Freshworks’ public materials.", "body": "### Scenario\n\nA 40-person marketing agency requests a demo of project management software.\n\n| Day | Step | Key actions |\n|---|---|---|\n| 0 | Lead arrives | Called within 5 minutes; meeting booked for tomorrow |\n| 1 | Discovery (30 min) | Pain: missed deadlines, no visibility across 12 clients; impact: 2 lost clients last year |\n| 3 | Tailored demo | Client dashboard, deadline alerts, time tracking |\n| 4 | Trial | 14-day trial with onboarding checklist |\n| 10 | Check-in | Team active; owner asks about price |\n| 12 | Proposal | Two tiers; recommend “Business” annual plan |\n| 14 | Objection | “Competitor is cheaper” → compare client reporting and time saved |\n| 17 | Close | Annual plan signed with onboarding session |\n| 45 | Value check | Fewer missed deadlines; plan expansion to contractors |\n\n### Lessons\n\nSpeed, focus on one or two pains, a short trial with clear success steps, and a recommendation instead of a menu."}, {"id": 196, "title": "Capstone: an enterprise deal with MEDDPICC", "tldr": "Walk through a complex enterprise deal: account research, multithreaded outreach, discovery, building a champion, reaching the economic buyer, technical evaluation, business case, paper process and negotiation, tracked with MEDDPICC.", "real": "This capstone reflects how enterprise software teams commonly run large deals using MEDDPICC, mutual action plans and executive sponsorship, a combination widely used in companies selling to large organizations.", "body": "### Scenario\n\nA 5,000-employee manufacturer evaluates a finance close automation platform ($400K/year).\n\n### MEDDPICC progression\n\n| Element | Month 1 | Month 3 | Month 5 |\n|---|---|---|---|\n| Metrics | Unknown | Close 12 → 5 days; $1.1M value | Validated by CFO team |\n| Economic buyer | Unknown | CFO identified | CFO approved business case |\n| Decision criteria | Unclear | ERP integration, controls | Technical win |\n| Decision process | Unclear | Mapped with champion | On track |\n| Paper process | — | Security review started | Legal redlines done |\n| Pain | Slow close | Quantified | Board pressure confirmed |\n| Champion | Controller (interested) | Controller (active) | Presented to CFO |\n| Competition | 2 vendors + status quo | 1 vendor remaining | Won on integration and plan |\n\n### Timeline\n\n```mermaid\nflowchart LR\n  M1[Research + outreach] --> M2[Discovery + champion]\n  M2 --> M3[Technical eval + business case]\n  M3 --> M4[CFO approval + security review]\n  M4 --> M5[Negotiation + signature]\n  M5 --> M6[Kickoff with exec sponsor]\n```"}, {"id": 197, "title": "Capstone: a high-ticket consumer sale", "tldr": "Walk through a considered consumer purchase such as a home solar system: lead from referral, needs assessment, family involvement, site evaluation, financing options, transparent proposal, handling fears, and post-installation follow-up.", "real": "Residential solar companies commonly combine site surveys, savings estimates and financing options in their sales process, and consumer protection regulators in several countries have warned about misleading savings claims, which is why transparent proposals matter.", "body": "### Journey\n\n| Step | Seller action |\n|---|---|\n| Referral | Neighbor introduces the family |\n| First meeting | Understand bills, goals (savings, independence), timeline |\n| Family decision | Invite spouse/parents to the main meeting |\n| Site survey | Roof, shading, usage data |\n| Proposal | System size, total cost, conservative savings, payback, warranty |\n| Financing | Cash vs loan comparison, clear terms |\n| Concerns | Roof damage, maintenance, performance guarantees |\n| Decision | No pressure; cooling-off rights explained |\n| Installation | Updates at each step |\n| Follow-up | First bill review; referral request |\n\n### Transparent savings estimate\n\n```\nCurrent annual electricity cost: ₹60,000\nExpected solar offset: 70% (conservative)\nAnnual savings ≈ ₹42,000; system cost ₹2,40,000 → simple payback ≈ 5.7 years\n```"}, {"id": 198, "title": "Capstone: building a sales team from zero", "tldr": "Build a sales function step by step: founder-led sales and playbook, first reps, process and CRM, metrics, specialization (SDR, AE, CS), managers, enablement, compensation and forecasting, scaling only what is proven.", "real": "Many startups follow a similar arc: founders sell the first customers, hire one or two reps to test repeatability, then add a sales leader and specialized roles, as described in widely read startup resources such as “Predictable Revenue” and venture firms’ go-to-market guides.", "body": "### Phases\n\n| Phase | ARR (illustrative) | Focus |\n|---|---|---|\n| 0 → 1 | $0–1M | Founder-led sales, ICP, playbook |\n| Repeatability | $1–3M | First 2–3 AEs, CRM, basic process |\n| Scale-up | $3–10M | Sales leader, SDRs, SEs, CS, enablement |\n| Expansion | $10M+ | Segments, regions, partners, RevOps |\n\n### Build sequence\n\n```mermaid\nflowchart LR\n  F[Founder sells] --> P[Playbook v1]\n  P --> R[Hire 2 AEs]\n  R --> M[Metrics + CRM]\n  M --> L[Sales leader]\n  L --> S[Specialize: SDR, AE, CS]\n  S --> E[Enablement + comp plans]\n  E --> X[Scale segments, partners]\n```\n\n### Key decisions\n\nWhen to hire the first leader, which segment to focus on, inbound vs outbound mix, and compensation design."}, {"id": 199, "title": "Capstone: turning around a missed quarter", "tldr": "A team misses its target by 25%. Diagnose with data, separate market from execution issues, focus on a few high-impact fixes (pipeline generation, qualification, discovery skills, deal execution), communicate clearly and track weekly.", "real": "Sales turnarounds in practice usually combine pipeline generation sprints, tighter stage definitions and targeted coaching, rather than across-the-board discounting, an approach commonly described by experienced sales leaders and RevOps practitioners.", "body": "### Diagnosis (example findings)\n\n| Metric | Last quarter | Prior average | Finding |\n|---|---|---|---|\n| Pipeline coverage at start | 2.1× | 3.2× | Insufficient pipeline |\n| Win rate | 27% | 29% | Stable |\n| Average deal size | $31K | $33K | Stable |\n| Cycle length | 74 days | 61 days | Deals slipping |\n| Deals with economic buyer met | 35% | 55% | Execution gap |\n\n### 90-day plan\n\n| Week | Action |\n|---|---|\n| 1–2 | Pipeline sprint: outbound to top 200 accounts |\n| 1–4 | Require economic buyer meeting before proposal stage |\n| 2–8 | Coaching on executive access and mutual action plans |\n| Weekly | Forecast review with evidence checklist |\n\n### Expected outcome\n\nCoverage back above 3× within 6 weeks and fewer slipped deals next quarter."}, {"id": 200, "title": "Final checklist, glossary and roadmap", "tldr": "Use the checklist to review any deal, the glossary for quick reference and the roadmap to turn knowledge into skill. Selling well comes down to understanding people, creating real value, guiding decisions honestly and following through.", "real": "Classic and modern texts remain the best next steps: Carnegie’s “How to Win Friends and Influence People”, Rackham’s “SPIN Selling”, Dixon and Adamson’s “The Challenger Sale”, Fisher and Ury’s “Getting to Yes”, Voss’s “Never Split the Difference” and Ross’s “Predictable Revenue”.", "body": "### Deal review checklist\n\n- [ ] Fits ICP; real, quantified pain\n- [ ] Champion with influence identified and tested\n- [ ] Economic buyer met and supportive\n- [ ] Decision criteria and process mapped\n- [ ] Paper process started with dates\n- [ ] Business case agreed with buyer numbers\n- [ ] Competition (including no decision) understood\n- [ ] Mutual action plan shared and on track\n- [ ] Next buyer action scheduled\n- [ ] Ethical, transparent terms\n\n### Glossary\n\n| Term | Meaning |\n|---|---|\n| ICP | Ideal customer profile |\n| SDR / AE / AM / CSM | Development rep / account executive / account manager / customer success manager |\n| MQL / SQL / PQL | Marketing / sales / product qualified lead |\n| BANT / MEDDPICC | Qualification frameworks |\n| SPIN | Situation, Problem, Implication, Need-payoff questions |\n| Champion | Influential internal advocate |\n| Economic buyer | Person with final budget authority |\n| MAP | Mutual action plan |\n| BATNA / ZOPA | Negotiation alternatives / zone of agreement |\n| ACV / ARR | Annual contract value / annual recurring revenue |\n| NRR / GRR | Net / gross revenue retention |\n| CAC / LTV | Acquisition cost / lifetime value |\n| OTE | On-target earnings |\n| RevOps | Revenue operations |\n| PLG | Product-led growth |\n\n### Practice roadmap\n\n1. Write your ICP and three personas (Part 3)\n2. Script and test a cold email and call opener (Part 4)\n3. Run five discovery calls using SPIN and record them (Part 5)\n4. Score your pipeline with MEDDPICC (Part 6)\n5. Build one business case with a buyer’s numbers (Part 5)\n6. Practice negotiation with a concession plan (Part 10)\n7. Run a mock QBR for a customer (Part 12)\n8. Build your weekly dashboard (Part 13)\n9. Write your personal playbook (Part 20)\n10. Review one recorded call per week, forever"}];
const PARTS = ["Sales foundations", "Buyers and psychology", "Targeting and prospecting strategy", "Outbound execution", "Discovery", "Qualification", "Sales methodologies", "Presenting and demos", "Objections and competition", "Proposals, pricing and negotiation", "Closing and deal management", "Account management and expansion", "Pipeline, forecasting and metrics", "Sales tools and CRM", "Sales operations and organization design", "Sales leadership and coaching", "Go-to-market motions", "B2C, retail and specialized sales", "Selling technology and AI, AI in sales", "Mastery and capstones"];
const TOTAL = 200, PER = 10;
function idsOf(p){ const a = []; for (let i = (p-1)*PER + 1; i <= p*PER; i++) a.push(i); return a; }
const partOf = id => Math.ceil(id / PER);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "sales-book-progress-v1";
const LS_LAST = "sales-book-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try{ await dbRef.set({done:[...done].sort((a,b)=>a-b), updated:Date.now()}); }
  catch(e){ if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; pushRemote(); }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...done])); }catch(e){} }
function toggle(id){
  if (done.has(id)) done.delete(id); else done.add(id);
  saveLocal(); pushRemote(); renderAll();
  toast(done.has(id) ? "Chapter " + id + " marked complete" : "Chapter " + id + " marked not complete");
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(s){
  if (window.marked && marked.parse){
    const html = marked.parse(s, {gfm:true, headerIds:false, mangle:false});
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  }
  return "<pre>" + esc(s) + "</pre>";
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function currentId(){
  const m = location.hash.match(/^#ch-(\d{1,3})$/);
  const n = m ? +m[1] : 0;
  return n >= 1 && n <= TOTAL ? n : 0;
}

/* ---------- header memory bank ---------- */
function renderBank(){
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    html += '<div class="bank-group" title="Part ' + p + ': ' + esc(PARTS[p-1]) + '">';
    for (const i of idsOf(p)){
      html += '<button class="cell' + (done.has(i) ? " done" : "") + (i === cur ? " here" : "") +
        '" data-go="' + i + '" aria-label="Chapter ' + i + (done.has(i) ? ", complete" : "") + '"></button>';
    }
    html += "</div>";
  }
  document.getElementById("bank").innerHTML = html;
  document.getElementById("doneCount").textContent = done.size;
  document.getElementById("pct").textContent = Math.round(done.size * 100 / TOTAL) + "%";
}

/* ---------- sidebar ---------- */
const openParts = new Set();
function renderSide(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const matches = ids.filter(i => !q || byId[i].title.toLowerCase().includes(q) || byId[i].tldr.toLowerCase().includes(q) || String(i) === q);
    if (q && !matches.length) continue;
    const count = ids.filter(i => done.has(i)).length;
    const open = q || openParts.has(p) || partOf(cur) === p;
    html += '<div class="part' + (open ? " open" : "") + '">' +
      '<button class="part-head" data-part="' + p + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="part-num">' + String(p).padStart(2, "0") + '</span>' +
      '<span class="part-name">' + esc(PARTS[p-1]) + '</span>' +
      '<span class="part-count' + (count === PER ? " full" : "") + '">' + count + '/' + PER + '</span></button><ul class="part-list">';
    for (const i of matches){
      html += '<li class="ch-row' + (i === cur ? " active" : "") + '">' +
        '<button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="' + (done.has(i) ? "Mark chapter " + i + " not complete" : "Mark chapter " + i + " complete") + '">' + TICK + '</button>' +
        '<a href="#ch-' + i + '"><span class="n">' + i + '.</span>' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ul></div>";
  }
  if (!html) html = '<p style="color:var(--muted);font-size:14px;padding:8px">No chapters match that search. Try a shorter word like “discovery” or “pricing”.</p>';
  document.getElementById("parts").innerHTML = html;
}

/* ---------- diagrams and charts ---------- */
let mermaidPromise = null, renderSeq = 0;
const svgCache = new Map();
function isDark(){
  const a = document.documentElement.getAttribute("data-theme");
  if (a) return a === "dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function ensureMermaid(){
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (mermaidPromise) return mermaidPromise;
  mermaidPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js";
    s.onload = () => {
      try{
        window.mermaid.initialize({ startOnLoad:false, securityLevel:"strict", theme: isDark() ? "dark" : "neutral",
          fontFamily:"IBM Plex Sans, system-ui, sans-serif", flowchart:{ curve:"basis", htmlLabels:true } });
        resolve(window.mermaid);
      }catch(e){ reject(e); }
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return mermaidPromise;
}
function fitSvg(div){
  const svg = div.querySelector("svg");
  if (!svg) return;
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Diagram");
  const vb = (svg.getAttribute("viewBox") || "").split(/\s+/).map(Number);
  const vbw = vb[2] || 0;
  if (vbw && div.clientWidth && div.clientWidth < vbw * 0.7){
    svg.style.maxWidth = "none";
    svg.style.width = Math.round(vbw * 0.85) + "px";
  }
}
function fmtNum(v){ return Number(v).toLocaleString("en-US", { maximumFractionDigits: 3 }); }
function renderChart(el, spec){
  const max = Math.max(...spec.data.map(d => d[1]));
  const unit = spec.unit || "";
  const sep = (unit === "%" || unit === "×") ? "" : " ";
  let rows = "";
  for (const [label, v] of spec.data){
    let w = spec.log ? (Math.log10(v + 1) / Math.log10(max + 1)) * 100 : (v / max) * 100;
    w = Math.max(w, 1.5);
    rows += '<div class="bar-row"><span class="bar-label">' + esc(String(label)) + '</span><span class="bar-track"><span class="bar" style="width:' + w.toFixed(1) + '%"></span></span><span class="bar-val">' + fmtNum(v) + sep + esc(unit) + '</span></div>';
  }
  const fig = document.createElement("figure");
  fig.className = "chart";
  fig.innerHTML = '<figcaption>' + esc(spec.title || "") + '</figcaption>' + rows + (spec.log ? '<div class="chart-note">Bar lengths use a logarithmic scale.</div>' : "");
  el.replaceWith(fig);
}
function enhance(root){
  root.querySelectorAll("code.language-chart").forEach(code => {
    const pre = code.closest("pre") || code;
    try{ renderChart(pre, JSON.parse(code.textContent)); }catch(e){}
  });
  const blocks = [...root.querySelectorAll("code.language-mermaid")];
  if (!blocks.length) return;
  const seq = ++renderSeq;
  const holders = blocks.map(code => {
    const pre = code.closest("pre") || code;
    const div = document.createElement("div");
    div.className = "diagram loading";
    div.textContent = "Loading diagram…";
    div.dataset.src = code.textContent;
    pre.replaceWith(div);
    if (svgCache.has(div.dataset.src)){ div.classList.remove("loading"); div.innerHTML = svgCache.get(div.dataset.src); div.dataset.done = "1"; fitSvg(div); }
    return div;
  }).filter(div => !div.dataset.done);
  if (!holders.length) return;
  ensureMermaid().then(async m => {
    for (let k = 0; k < holders.length; k++){
      const div = holders[k];
      if (seq !== renderSeq || !div.isConnected) return;
      const id = "mmd-" + seq + "-" + k;
      try{
        const out = await m.render(id, div.dataset.src);
        if (!div.isConnected) return;
        div.classList.remove("loading");
        div.innerHTML = out.svg;
        svgCache.set(div.dataset.src, out.svg);
        fitSvg(div);
      }catch(e){
        const junk = document.getElementById("d" + id); if (junk) junk.remove();
        div.classList.remove("loading");
        div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>";
      }
    }
  }).catch(() => {
    holders.forEach(div => { div.classList.remove("loading"); div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>"; });
  });
}

/* ---------- chapter view ---------- */
function renderChapter(id){
  const c = byId[id];
  const p = partOf(id);
  const ids = idsOf(p);
  const isDone = done.has(id);
  const tabs = ids.map(i =>
    '<button class="tab' + (i === id ? " active" : "") + '" role="tab" aria-selected="' + (i === id) + '" data-go="' + i + '">' +
    '<span class="dot' + (done.has(i) ? " on" : "") + '"></span><span class="tab-t">' + i + '. ' + esc(byId[i].title) + '</span></button>'
  ).join("");
  document.getElementById("main").innerHTML =
    '<p class="crumb">Part ' + p + ' of 20: ' + esc(PARTS[p-1]) + '</p>' +
    '<div class="tabs" role="tablist" aria-label="Chapters in this part">' + tabs + '</div>' +
    '<article>' +
      '<p class="ch-no">Chapter ' + id + ' of ' + TOTAL + '</p>' +
      '<h1 class="ch-title">' + esc(c.title) + '</h1>' +
      '<section class="box tldr"><h2>TL;DR</h2><p>' + inlineMd(c.tldr) + '</p></section>' +
      '<div class="body">' + md(c.body) + '</div>' +
      '<section class="box real"><h2>Real-world example</h2><p>' + inlineMd(c.real) + '</p></section>' +
      '<div class="done-bar">' +
        '<button class="complete' + (isDone ? " on" : "") + '" data-toggle="' + id + '" aria-pressed="' + isDone + '">' +
          '<span class="tick' + (isDone ? " on" : "") + '">' + TICK + '</span>' + (isDone ? "Completed" : "Mark as complete") + '</button>' +
        '<div class="nav">' +
          '<button class="btn" data-go="' + (id - 1) + '"' + (id === 1 ? " disabled" : "") + '>Previous</button>' +
          '<button class="btn" data-go="' + (id + 1) + '"' + (id === TOTAL ? " disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  enhance(document.getElementById("main"));
}

/* ---------- contents view ---------- */
function renderContents(){
  let html = '<div class="contents"><h1>Contents</h1>' +
    '<p class="lead">Twenty parts, ten chapters each, from the first conversation to enterprise deals, sales leadership and selling in the AI era. Tick a chapter when you finish it; your progress is saved for next time. Company examples and research come from public books, studies and announcements; laws and figures change, so check current sources before relying on a specific detail.</p>' +
    '<div class="contents-actions"><button class="btn" data-go="' + firstUnread() + '">' + (done.size ? "Continue with chapter " + firstUnread() : "Start chapter 1") + '</button>' +
    '<button class="btn" id="resetBtn">Reset progress</button></div><div class="grid">';
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const count = ids.filter(i => done.has(i)).length;
    html += '<section class="pcard"><h2>Part ' + p + ': ' + esc(PARTS[p-1]) + '</h2><div class="meta">' + count + ' of ' + PER + ' complete</div><ol>';
    for (const i of ids){
      html += '<li><button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="Toggle chapter ' + i + '">' + TICK + '</button><a href="#ch-' + i + '">' + i + '. ' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ol></section>";
  }
  document.getElementById("main").innerHTML = html + "</div></div>";
}
function firstUnread(){ for (let i = 1; i <= TOTAL; i++) if (!done.has(i)) return i; return TOTAL; }

/* ---------- routing ---------- */
let lastRendered = null;
function renderAll(){
  const id = currentId();
  renderBank(); renderSide();
  const y = window.scrollY;
  if (id) renderChapter(id); else renderContents();
  if (lastRendered === location.hash) window.scrollTo(0, y);
  lastRendered = location.hash;
}
function route(){
  const id = currentId();
  if (!id && location.hash !== "#contents"){
    let last = 0; try{ last = +localStorage.getItem(LS_LAST) || 0; }catch(e){}
    location.replace("#ch-" + (last >= 1 && last <= TOTAL ? last : 1));
    return;
  }
  if (id){ try{ localStorage.setItem(LS_LAST, id); }catch(e){} }
  document.body.classList.remove("drawer");
  renderAll();
  window.scrollTo(0, 0);
  const active = document.querySelector(".ch-row.active");
  if (active) active.scrollIntoView({block:"nearest"});
  const tab = document.querySelector(".tab.active");
  if (tab && tab.parentElement){ const r = tab.parentElement; const left = tab.offsetLeft - r.offsetLeft; if (left < r.scrollLeft || left + tab.offsetWidth > r.scrollLeft + r.clientWidth) r.scrollLeft = left - 16; }
}
function go(id){ if (id >= 1 && id <= TOTAL) location.hash = "#ch-" + id; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){ e.preventDefault(); toggle(+t.dataset.toggle); return; }
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled){ go(+g.dataset.go); return; }
  const ph = e.target.closest("[data-part]");
  if (ph){
    const p = +ph.dataset.part;
    const el = ph.parentElement;
    const isOpen = el.classList.toggle("open");
    if (isOpen) openParts.add(p); else openParts.delete(p);
    ph.setAttribute("aria-expanded", isOpen);
    return;
  }
  if (e.target.id === "resetBtn"){
    if (confirm("Clear all 200 ticks? This can’t be undone.")){ done.clear(); saveLocal(); pushRemote(); renderAll(); toast("Progress reset"); }
  }
});
document.getElementById("search").addEventListener("input", renderSide);
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.add("drawer"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = currentId(); if (!id) return;
  if (e.key === "ArrowRight") go(id + 1);
  else if (e.key === "ArrowLeft") go(id - 1);
});
function setTopH(){ document.documentElement.style.setProperty("--top-h", document.getElementById("top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);
window.addEventListener("hashchange", route);
setTopH();
route();
initSync();
</script>

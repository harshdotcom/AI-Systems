<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales Mastery: 200 Chapters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F3F4; --surface:#FFFFFF; --surface-2:#F6F8F9; --ink:#15191C; --muted:#56606A; --line:#D7DEE2;
  --accent:#0E6E8C; --accent-soft:#DDEFF5; --accent-ink:#FFFFFF;
  --amber:#B97A0B; --tldr-bg:#FFF5DC; --tldr-line:#D49A22;
  --indigo:#5E3A87; --real-bg:#F3ECF8; --real-line:#7B4FA8;
  --code-bg:#15191C; --code-ink:#E3E9ED; --inline-code:#E6ECEF;
  --cell-empty:#D9E0E4; --shadow:0 1px 0 rgba(21,25,28,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1417; --surface:#161C20; --surface-2:#1C242A; --ink:#E4EBEF; --muted:#9AA7B0; --line:#28323A;
    --accent:#5CC3E0; --accent-soft:#16323C; --accent-ink:#06222B;
    --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
    --indigo:#C9A6EE; --real-bg:#231A2F; --real-line:#9B74C9;
    --code-bg:#0A0E10; --code-ink:#D9E2E8; --inline-code:#24303A;
    --cell-empty:#28323A; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1417; --surface:#161C20; --surface-2:#1C242A; --ink:#E4EBEF; --muted:#9AA7B0; --line:#28323A;
  --accent:#5CC3E0; --accent-soft:#16323C; --accent-ink:#06222B;
  --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
  --indigo:#C9A6EE; --real-bg:#231A2F; --real-line:#9B74C9;
  --code-bg:#0A0E10; --code-ink:#D9E2E8; --inline-code:#24303A;
  --cell-empty:#28323A; --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header with the memory-bank progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:20px;padding:12px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted)}
.bank{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bank-row{display:flex;gap:4px;flex-wrap:nowrap;min-width:0}
.bank-group{flex:1;min-width:0;display:flex;gap:2px;padding:3px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.cell{flex:1;min-width:2px;max-width:10px;height:18px;border-radius:2px;background:var(--cell-empty);border:0;padding:0;cursor:pointer;transition:background .2s}
.cell.done{background:var(--accent)}
.cell.here{box-shadow:0 0 0 2px var(--amber)}
.bank-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bank-meta strong{color:var(--ink);font-weight:600}
.top-actions{display:flex;gap:8px}
.btn{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.menu-btn{display:none}

/* Shell */
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,76px));height:calc(100dvh - var(--top-h,76px) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg)}
.search{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
.part{margin-bottom:4px}
.part-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:8px;cursor:pointer}
.part-head:hover{background:var(--surface-2)}
.part-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);width:22px;flex:none}
.part-name{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.part-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.part-count.full{color:var(--accent);font-weight:600}
.part-list{list-style:none;margin:0 0 6px;padding:0 0 0 30px;display:none}
.part.open .part-list{display:block}
.ch-row{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:6px}
.ch-row.active{background:var(--accent-soft)}
.ch-row a{flex:1;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.ch-row a .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.tick{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:11px;height:11px;opacity:0}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{opacity:1;color:var(--accent-ink)}
.hidden{display:none!important}

/* Main reading area */
.main{padding:24px 32px 80px;min-width:0}
.crumb{font-size:14px;color:var(--muted);margin:0 0 12px}
.crumb a{color:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;font-size:14px;color:var(--muted);max-width:240px;text-align:left}
.tab .tab-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--cell-empty)}
.tab .dot.on{background:var(--accent)}
article{max-width:780px}
.ch-no{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--accent);font-size:15px;margin:0}
h1.ch-title{font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:6px 0 22px;font-weight:700;text-wrap:balance}
.box{border-radius:10px;padding:16px 18px;margin:0 0 26px;border-left:4px solid}
.box h2{font-size:14px;margin:0 0 6px;font-weight:600}
.box p{margin:0}
.tldr{background:var(--tldr-bg);border-color:var(--tldr-line)}
.tldr h2{color:var(--amber)}
.tldr p{font-size:17px;line-height:1.55}
.real{background:var(--real-bg);border-color:var(--real-line);margin-top:34px}
.real h2{color:var(--indigo)}
.body h3{font-size:20px;margin:30px 0 10px;letter-spacing:-.01em}
.body p{margin:0 0 14px}
.body ul,.body ol{padding-left:22px;margin:0 0 16px}
.body li{margin:4px 0}
.body li input[type=checkbox]{margin-right:6px;accent-color:var(--accent)}
.body code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.88em;background:var(--inline-code);padding:1px 5px;border-radius:4px}
.body pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13.5px;line-height:1.55;margin:0 0 18px}
.body pre code{background:none;padding:0;font-size:inherit;color:inherit}
.table-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.body table{border-collapse:collapse;width:100%;font-size:14px}
.body th,.body td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.body th{background:var(--surface-2);font-weight:600}
.body tr:last-child td{border-bottom:0}
.body strong{font-weight:600}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.complete{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:15px}
.complete .tick{border-color:currentColor;pointer-events:none}
.complete.on{background:var(--accent);color:var(--accent-ink)}
.complete.on .tick{background:var(--accent-ink);border-color:var(--accent-ink)}
.complete.on .tick svg{opacity:1;color:var(--accent)}
.nav{display:flex;gap:8px}
.nav .btn[disabled]{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}

/* Diagrams and charts */
.diagram{margin:0 0 20px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
.diagram svg{display:block;margin:0 auto;height:auto}
.diagram.loading{color:var(--muted);font-size:14px}
.chart{margin:0 0 20px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chart figcaption{font-weight:600;font-size:14px;margin:0 0 10px}
.bar-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.bar-label{color:var(--ink);line-height:1.3}
.bar-track{height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar{display:block;height:100%;background:var(--accent);border-radius:7px 0 0 7px}
.bar-val{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.chart-note{font-size:12px;color:var(--muted);margin-top:6px}

/* Contents view */
.contents h1{font-size:32px;margin:0 0 6px;letter-spacing:-.02em}
.contents .lead{color:var(--muted);margin:0 0 24px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.pcard h2{font-size:15px;margin:0 0 2px;line-height:1.3}
.pcard .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pcard ol{list-style:none;padding:0;margin:0}
.pcard li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13.5px;line-height:1.35}
.pcard li a{color:var(--ink);text-decoration:none;flex:1}
.pcard li a:hover{text-decoration:underline}
.contents-actions{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}

/* Mobile */
.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);height:auto;z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .menu-btn{display:inline-block}
  .main{padding:18px 16px 60px}
  .top-inner{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand{flex:1}
  .bank{order:3;flex-basis:100%}
  .bank-row{gap:3px}
  .bank-group{gap:1px;padding:2px}
  .cell{height:12px;max-width:none;min-width:0}
  .bank-row{flex-wrap:wrap;row-gap:3px;gap:3px}
  .bank-group{flex:0 0 calc(10% - 2.7px);gap:1px;padding:1px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</head>
<body>
<header class="top" id="top">
  <div class="top-inner">
    <button class="btn menu-btn" id="menuBtn" aria-label="Open chapter list">Chapters</button>
    <div class="brand"><b>Sales mastery</b><span>From first conversation to enterprise deals and sales leadership</span></div>
    <div class="bank" aria-label="Course progress">
      <div class="bank-row" id="bank"></div>
      <div class="bank-meta"><span><strong id="doneCount">0</strong> of 200 chapters complete</span><span id="pct">0%</span></div>
    </div>
    <div class="top-actions"><a class="btn" href="#contents" style="text-decoration:none">Contents</a></div>
  </div>
</header>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <nav class="side" id="side" aria-label="Chapters">
    <input class="search" id="search" type="search" placeholder="Search chapters" aria-label="Search chapters">
    <div id="parts"></div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const CHAPTERS = [{"id": 1, "title": "What selling really is", "tldr": "Selling is helping a buyer make a decision that improves their situation, and earning a fair exchange for it. Great salespeople diagnose problems, create clarity, reduce risk and guide decisions; they do not pressure people into purchases.", "real": "Dale Carnegie’s “How to Win Friends and Influence People” (1936), one of the best-selling business books ever, argued that genuine interest in other people is the foundation of influence. That principle still underpins modern consultative and value-based selling.", "body": "### Three views of selling\n\n| View | Focus | Outcome |\n|---|---|---|\n| Transactional | Product and price | One-time sale |\n| Consultative | Buyer’s problem | Solution fit |\n| Value / partnership | Buyer’s business outcomes | Long-term relationship and expansion |\n\n### What a salesperson actually does\n\n```mermaid\nflowchart LR\n  A[Find the right buyers] --> B[Understand their situation]\n  B --> C[Diagnose problems and impact]\n  C --> D[Show a credible path to a better outcome]\n  D --> E[Reduce risk and guide the decision]\n  E --> F[Deliver value and grow the relationship]\n```\n\n### Principles\n\n- The buyer’s success is the goal; the sale is the result\n- Questions before answers\n- Clarity beats persuasion\n- Long-term trust beats short-term wins"}, {"id": 2, "title": "Types of sales", "tldr": "Sales differ by buyer (business vs consumer), deal size, complexity, cycle length and channel. Transactional sales optimize speed and volume; complex B2B sales optimize understanding, consensus and risk reduction across many stakeholders.", "real": "Neil Rackham’s research for “SPIN Selling” (1988), based on analysis of about 35,000 sales calls, found that techniques that worked in small, simple sales often hurt results in large, complex sales, which is why sales type determines method.", "body": "### Comparison\n\n| Type | Deal size | Cycle | Decision makers | Example |\n|---|---|---|---|---|\n| B2C transactional | Low | Minutes–days | 1 | Retail, e-commerce |\n| B2C considered | Medium–high | Weeks | 1–2 | Cars, homes, insurance |\n| SMB B2B | Low–medium | Days–weeks | 1–3 | Small business software |\n| Mid-market B2B | Medium | 1–3 months | 3–6 | Department-level software |\n| Enterprise B2B | High | 3–18 months | 6–20+ | ERP, security platforms |\n| Government | High | 6–24 months | Many + formal process | Tenders, RFPs |\n\n### What changes with complexity\n\n| Simple sale | Complex sale |\n|---|---|\n| Product features | Business outcomes |\n| One conversation | Many meetings, many people |\n| Price focus | Risk and value focus |\n| Closing technique | Consensus building |"}, {"id": 3, "title": "Seeing through the buyer’s eyes", "tldr": "Buyers are trying to solve a problem with limited time, information and appetite for risk. Their biggest fear is making a bad decision. Sellers who reduce effort and risk, and make the buyer look good internally, win more often.", "real": "Gartner research found that B2B buyers spend only about 17% of their total buying time meeting with potential suppliers, split across all vendors they consider. Most of the journey happens without any salesperson present.", "body": "### What buyers worry about\n\n| Worry | What helps |\n|---|---|\n| “Will this actually work for us?” | Proof, references, pilots |\n| “Will I look bad if it fails?” | Risk reduction, clear plan |\n| “Is this worth the price?” | Quantified business case |\n| “Is now the right time?” | Cost of inaction |\n| “Can I get everyone to agree?” | Materials for internal selling |\n\n### The buyer’s internal journey\n\n```mermaid\nflowchart LR\n  P[Notice a problem] --> E[Explore options]\n  E --> R[Define requirements]\n  R --> V[Validate suppliers]\n  V --> C[Build consensus]\n  C --> D[Decide and buy]\n```\n\n### Rule\n\nSell the way people want to buy: help them through *their* process, not yours."}, {"id": 4, "title": "Roles in a sales organization", "tldr": "Modern sales teams specialize: SDRs/BDRs create pipeline, account executives win deals, sales engineers prove technical fit, account managers and customer success teams retain and grow customers, and operations and enablement support everyone.", "real": "Aaron Ross’s “Predictable Revenue” (2011) described how Salesforce separated prospecting into a dedicated outbound team, distinct from account executives who closed deals. This specialization model spread widely across software companies.", "body": "### Core roles\n\n| Role | Main job | Key metric |\n|---|---|---|\n| SDR / BDR | Book qualified meetings | Meetings, pipeline created |\n| Account Executive (AE) | Win new deals | Bookings vs quota |\n| Sales Engineer / Solutions Consultant | Technical discovery, demos, POCs | Technical win rate |\n| Account Manager (AM) | Expand existing accounts | Expansion revenue |\n| Customer Success Manager (CSM) | Adoption and retention | Retention, health scores |\n| Partner / Channel Manager | Sell through partners | Partner-sourced revenue |\n| Sales Operations / RevOps | Systems, data, planning | Forecast accuracy |\n| Enablement | Training, content, onboarding | Ramp time, win rate |\n\n### Typical flow\n\n```mermaid\nflowchart LR\n  MKT[Marketing] --> SDR[SDR / BDR]\n  SDR --> AE[Account Executive]\n  SE[Sales Engineer] --> AE\n  AE --> CSM[Customer Success]\n  CSM --> AM[Account Management]\n  AM --> AE\n```"}, {"id": 5, "title": "The sales process at a glance", "tldr": "A sales process is a repeatable sequence of stages, from prospecting to closing and expansion, each with clear goals and exit criteria. A shared process makes performance measurable, coachable and forecastable.", "real": "Most CRM systems, including Salesforce and HubSpot, model deals as opportunities moving through defined stages. Companies customize stage names, but the underlying flow of qualify, discover, propose, negotiate and close is nearly universal.", "body": "### Standard stages\n\n```mermaid\nflowchart LR\n  P[Prospect] --> Q[Qualify]\n  Q --> D[Discover]\n  D --> S[Solution / demo]\n  S --> PR[Proposal]\n  PR --> N[Negotiate]\n  N --> C[Close]\n  C --> O[Onboard and expand]\n```\n\n### Exit criteria examples\n\n| Stage | Exit when |\n|---|---|\n| Qualify | Fits ideal customer profile; problem and interest confirmed |\n| Discover | Pain, impact, stakeholders and process documented |\n| Solution | Buyer agrees the solution addresses requirements |\n| Proposal | Pricing and scope shared with decision makers |\n| Negotiate | Terms agreed in principle |\n| Close | Contract signed |\n\n### Rule\n\nStages should reflect **buyer actions**, not seller activities. “Demo given” is a seller activity; “buyer confirmed fit” is a buyer action."}, {"id": 6, "title": "Pipeline and funnel basics", "tldr": "The pipeline is the set of active opportunities; the funnel shows how many convert at each stage. Healthy sales depend on enough pipeline, good conversion rates, reasonable deal sizes and acceptable cycle times.", "real": "In 2018 HubSpot introduced the “flywheel” model alongside the funnel, emphasizing that satisfied customers drive referrals and growth. The funnel still describes how deals convert; the flywheel describes what happens after the sale.", "body": "### Funnel (illustrative)\n\n```chart\n{\"title\": \"Illustrative B2B funnel per quarter\", \"unit\": \"\", \"data\": [[\"Leads\", 2000], [\"Qualified leads\", 600], [\"Opportunities\", 150], [\"Proposals\", 60], [\"Closed won\", 25]]}\n```\n\n### Four pipeline levers\n\n| Lever | Question |\n|---|---|\n| Volume | How many opportunities? |\n| Conversion | What % become customers? |\n| Deal size | Average contract value? |\n| Velocity | How fast do deals close? |\n\n### Sales velocity formula\n\n```\nSales velocity = (Opportunities × Win rate × Average deal size) ÷ Sales cycle length\n```\n\nImproving any lever increases revenue per unit of time."}, {"id": 7, "title": "Key sales metrics", "tldr": "Measure inputs (activities), pipeline (creation and coverage), outputs (bookings, win rate) and customer value (retention, expansion). Leading indicators predict results; lagging indicators confirm them.", "real": "Software companies commonly report metrics such as annual recurring revenue (ARR), net revenue retention and customer acquisition cost to investors. Snowflake, for example, reported net revenue retention above 150% in its early years as a public company, showing how much growth can come from existing customers.", "body": "### Metric map\n\n| Category | Metrics |\n|---|---|\n| Activity (leading) | Calls, emails, meetings, demos |\n| Pipeline (leading) | Pipeline created, coverage, stage conversion |\n| Results (lagging) | Bookings, revenue, win rate, quota attainment |\n| Efficiency | Sales cycle length, CAC, CAC payback |\n| Customer | Gross and net revenue retention, churn, NPS |\n\n### Leading vs lagging\n\n```mermaid\nflowchart LR\n  A[Activities] --> M[Meetings]\n  M --> O[Opportunities]\n  O --> W[Wins]\n  W --> R[Revenue]\n  R --> RET[Retention and expansion]\n```\n\n### Rule\n\nTrack a small set of metrics consistently. Too many metrics create noise and gaming."}, {"id": 8, "title": "What top performers do differently", "tldr": "Top salespeople are curious, prepared, disciplined and resilient. They listen more, ask better questions, teach buyers something new, qualify hard, follow up reliably and manage their time around the highest-value activities.", "real": "CEB research behind “The Challenger Sale” (2011), covering thousands of sales reps, found that “Challengers”, reps who teach, tailor and take control, made up nearly 40% of star performers, and an even larger share in complex sales.", "body": "### Habits of top performers\n\n| Habit | In practice |\n|---|---|\n| Preparation | Research every account before contact |\n| Curiosity | Ask “why” until the real problem is clear |\n| Listening | Talk less than the buyer in discovery |\n| Insight | Bring new perspectives on the buyer’s business |\n| Qualification | Walk away from poor-fit deals early |\n| Follow-through | Do what they say, when they say |\n| Time management | Protect time for selling activities |\n| Learning | Review calls, seek feedback |\n\n### Common traits\n\nResilience after rejection, coachability, integrity, competitiveness balanced with empathy, and comfort with ambiguity."}, {"id": 9, "title": "Sales, marketing and customer success alignment", "tldr": "Marketing creates demand, sales converts it, and customer success retains and grows it. Misalignment wastes leads and frustrates customers. Shared definitions, service-level agreements and revenue goals align the teams.", "real": "HubSpot popularized the term “smarketing” for sales and marketing alignment and formal service-level agreements between the two teams, such as how quickly sales must follow up on marketing leads.", "body": "### Revenue engine\n\n```mermaid\nflowchart LR\n  MKT[Marketing: attract and educate] --> SALES[Sales: qualify and win]\n  SALES --> CS[Customer success: adopt and retain]\n  CS --> EXP[Expansion and referrals]\n  EXP --> MKT\n```\n\n### Alignment tools\n\n| Tool | Example |\n|---|---|\n| Shared definitions | What counts as a qualified lead |\n| SLA | Sales contacts marketing leads within 1 business hour |\n| Feedback loop | Sales reports lead quality weekly |\n| Shared metrics | Pipeline and revenue, not just leads |\n| Handoff process | Sales → success with documented goals |\n\n### Warning signs\n\n“Marketing leads are junk” vs “sales never follows up” means definitions and processes need fixing, not blame."}, {"id": 10, "title": "Trust and ethics as the foundation", "tldr": "Trust is the currency of selling. Honest claims, transparent pricing, respect for the buyer’s interests and keeping promises create referrals and repeat business; deception creates churn, legal risk and reputational damage.", "real": "Wells Fargo’s cross-selling scandal, revealed in 2016, involved employees opening millions of unauthorized customer accounts to meet aggressive sales targets. It led to fines and settlements totaling billions of dollars, including a $3 billion settlement in 2020.", "body": "### Ethical selling principles\n\n| Principle | In practice |\n|---|---|\n| Honesty | No exaggerated claims; admit limitations |\n| Fit first | Do not sell what the buyer does not need |\n| Transparency | Clear pricing, terms and renewals |\n| Consent | Respect privacy and contact preferences |\n| Accountability | Own mistakes and fix them |\n\n### Incentive risk\n\n```mermaid\nflowchart LR\n  T[Unrealistic targets] --> P[Pressure]\n  P --> S[Shortcuts]\n  S --> H[Customer harm]\n  H --> D[Legal and reputational damage]\n```\n\n### Rule\n\nIf you would be uncomfortable seeing a sales tactic on the front page of a newspaper, do not use it."}, {"id": 11, "title": "How B2B buying really works", "tldr": "B2B purchases involve buying groups of several stakeholders with different priorities, moving through overlapping, non-linear activities. Buyers do much of their research independently, so sellers must provide value in each interaction and equip champions to sell internally.", "real": "Gartner reports that a typical buying group for a complex B2B solution involves six to ten decision makers, each bringing information they gathered independently. CEB (now Gartner) research in 2012 found that buyers were, on average, 57% of the way through the purchase decision before engaging a supplier.", "body": "### Buying group roles\n\n| Role | Cares about |\n|---|---|\n| Economic buyer | ROI, strategic fit, risk |\n| Champion | Solving their problem, career success |\n| Users | Ease of use, daily workflow |\n| Technical evaluator | Integration, security, architecture |\n| Procurement | Price, terms, vendor risk |\n| Legal | Contract risk |\n| Blocker | Status quo, competing priorities |\n\n### Non-linear “jobs”\n\n```mermaid\nflowchart TB\n  PI[Problem identification] <--> SE[Solution exploration]\n  SE <--> RB[Requirements building]\n  RB <--> SS[Supplier selection]\n  SS <--> VA[Validation]\n  VA <--> CC[Consensus creation]\n```\n\nBuyers loop back repeatedly; the seller’s job is to help them make progress on whichever job they are stuck on."}, {"id": 12, "title": "The buyer’s journey", "tldr": "Buyers move from awareness of a problem, to considering approaches, to choosing a solution. Each stage needs different content and conversations: insight early, comparisons in the middle, proof and risk reduction at the end.", "real": "HubSpot’s inbound methodology, introduced around 2006, mapped marketing content to awareness, consideration and decision stages. The model became a standard way for marketing and sales teams to plan content and outreach.", "body": "### Stages and seller actions\n\n| Stage | Buyer thinking | Seller provides |\n|---|---|---|\n| Awareness | “Do we have a problem?” | Insights, benchmarks, cost of inaction |\n| Consideration | “What are the options?” | Frameworks, approaches, education |\n| Decision | “Which vendor, and is it safe?” | Demos, ROI, references, pilots |\n| Post-purchase | “Was this the right choice?” | Onboarding, quick wins |\n\n### Content map\n\n```mermaid\nflowchart LR\n  A[Awareness: reports, posts] --> C[Consideration: guides, webinars]\n  C --> D[Decision: demos, case studies, ROI tools]\n  D --> P[Post-purchase: onboarding, success plans]\n```\n\n### Mistake to avoid\n\nPitching product features to someone still deciding whether they even have a problem."}, {"id": 13, "title": "Pains, gains and jobs to be done", "tldr": "People buy progress, not products. Understand the “job” the buyer is trying to get done, the pains that block it and the gains they want. Products that fit a clear job with a painful gap sell more easily.", "real": "Clayton Christensen’s “jobs to be done” theory is often illustrated by a milkshake study: a fast-food chain learned many morning milkshakes were bought by commuters “hiring” them for a long, boring drive, which changed how the product should be improved and positioned.", "body": "### Jobs framework\n\n| Element | Question |\n|---|---|\n| Job | What progress is the buyer trying to make? |\n| Context | When and where does the job arise? |\n| Pains | What frustrates or blocks them today? |\n| Gains | What would success look like? |\n| Alternatives | What do they “hire” today (including doing nothing)? |\n\n### Example\n\n| Element | B2B accounting software |\n|---|---|\n| Job | Close the books quickly and accurately each month |\n| Pains | Manual spreadsheets, errors, late nights |\n| Gains | Close in 3 days instead of 10; audit confidence |\n| Alternatives | Spreadsheets, more staff, outsourcing |\n\n### Sales use\n\nLead conversations with the job and pains, not product categories."}, {"id": 14, "title": "Decision psychology and cognitive biases", "tldr": "Buyers are not purely rational. Loss aversion, anchoring, status quo bias, social proof and fear of regret shape decisions. Ethical sellers understand these to communicate clearly and reduce perceived risk, not to manipulate.", "real": "Daniel Kahneman and Amos Tversky’s research on prospect theory (1979) showed that losses loom larger than equivalent gains, and Samuelson and Zeckhauser (1988) documented status quo bias. Kahneman received the 2002 Nobel Memorial Prize in Economic Sciences partly for this work.", "body": "### Biases that matter in sales\n\n| Bias | Effect | Ethical response |\n|---|---|---|\n| Loss aversion | Losses feel \\~2× gains | Quantify the cost of inaction honestly |\n| Status quo bias | Prefer no change | Make switching easier and less risky |\n| Anchoring | First number sets expectations | Present full value before price |\n| Social proof | Follow peers | Share relevant references |\n| Choice overload | Too many options paralyze | Recommend a clear option |\n| Fear of regret | Avoid blame | Offer pilots, guarantees, phased rollouts |\n\n### Rule\n\nUse psychology to **make good decisions easier**, never to push bad ones."}, {"id": 15, "title": "Influence: Cialdini’s principles", "tldr": "Robert Cialdini identified universal principles of influence: reciprocity, commitment and consistency, social proof, authority, liking, scarcity, and later unity. Used ethically, they make communication more effective; used deceptively, they destroy trust.", "real": "Cialdini’s “Influence: The Psychology of Persuasion” (1984) became one of the most cited books in marketing and sales; he added “unity” (shared identity) as a seventh principle in his 2016 book “Pre-Suasion”.", "body": "### The principles in sales\n\n| Principle | Ethical use | Manipulative use (avoid) |\n|---|---|---|\n| Reciprocity | Give genuine insight first | Fake “gifts” with strings |\n| Commitment | Agree small next steps | Trick people into commitments |\n| Social proof | Real customer stories | Fabricated reviews |\n| Authority | Credible expertise, certifications | Fake credentials |\n| Liking | Genuine rapport | Flattery |\n| Scarcity | Real deadlines, limited capacity | False urgency |\n| Unity | Shared community or identity | Exploiting identity |\n\n### Test\n\nWould the buyer still feel good about the tactic if they fully understood it?"}, {"id": 16, "title": "Risk, fear and the “no decision” problem", "tldr": "Many deals are lost not to competitors but to indecision. Buyers fear making the wrong choice, overestimate risks of change and keep researching. Sellers win by recommending clearly, limiting endless exploration and removing risk.", "real": "“The JOLT Effect” (Dixon and McKenna, 2022), based on analysis of over 2.5 million recorded sales conversations, reported that 40–60% of deals end in “no decision”, with buyer indecision rather than preference for the status quo as a major cause.", "body": "### Sources of indecision\n\n| Source | Sounds like |\n|---|---|\n| Valuation problems | “We need to compare more options” |\n| Lack of information | “We need more detail” |\n| Outcome uncertainty | “What if it doesn’t work?” |\n\n### JOLT approach\n\n| Step | Action |\n|---|---|\n| Judge the indecision | Identify which fear is present |\n| Offer a recommendation | “For your situation, I’d choose X” |\n| Limit exploration | Focus on what matters, not every option |\n| Take risk off the table | Pilots, opt-outs, phased commitments |\n\n### Cost of inaction\n\nHelp buyers see what staying put costs each month, honestly and with their own numbers."}, {"id": 17, "title": "Building trust and credibility quickly", "tldr": "Trust grows from competence (you know your stuff), integrity (you tell the truth), and care (you have their interests at heart). Preparation, honesty about limitations, reliability on small promises and relevant proof build credibility fast.", "real": "The “trust equation” from “The Trusted Advisor” (Maister, Green and Galford, 2000) defines trust as credibility plus reliability plus intimacy, divided by self-orientation. It remains a widely taught model in professional services and sales.", "body": "### The trust equation\n\n```\nTrust = (Credibility + Reliability + Intimacy) ÷ Self-orientation\n```\n\n| Element | How to raise it |\n|---|---|\n| Credibility | Know the buyer’s industry; be accurate |\n| Reliability | Deliver every small promise on time |\n| Intimacy | Create safety to share real problems |\n| Self-orientation (lower it) | Focus on their goals, not your quota |\n\n### Fast credibility builders\n\n- Research before the first call\n- Share a relevant insight early\n- Admit what your product does not do\n- Follow up exactly as promised"}, {"id": 18, "title": "Buyer personas", "tldr": "Personas describe the roles you sell to: their goals, pains, metrics, objections and preferred communication. They help tailor messaging and questions, but must be grounded in real interviews and data, not stereotypes.", "real": "Software companies selling to IT, finance and operations leaders commonly maintain separate messaging for each persona; for example, a security product pitches risk reduction to a CISO, integration effort to an architect, and cost and contract terms to procurement.", "body": "### Persona template\n\n| Field | Example: VP Finance |\n|---|---|\n| Goals | Faster close, accurate forecasts |\n| KPIs | Days to close, forecast variance |\n| Pains | Manual work, audit risk |\n| Objections | Implementation effort, cost |\n| Information sources | Peers, analyst reports, CFO communities |\n| Message that works | “Close in 3 days with audit-ready controls” |\n\n### Messaging by persona\n\n```mermaid\nflowchart LR\n  P[Same product] --> E[Executive: outcomes and ROI]\n  P --> U[User: ease and time saved]\n  P --> T[Technical: integration and security]\n  P --> PR[Procurement: terms and vendor risk]\n```"}, {"id": 19, "title": "Consumer buying psychology", "tldr": "Consumers decide faster and more emotionally than businesses, influenced by convenience, price perception, brand, reviews and social context. Clear options, trust signals and frictionless purchase matter most.", "real": "In a famous 2000 study by Sheena Iyengar and Mark Lepper, shoppers who saw 6 jam varieties were far more likely to buy (30%) than those who saw 24 (3%), even though the larger display attracted more interest. Later replications found the effect varies by context, but the lesson about choice overload remains influential.", "body": "### Jam study results\n\n```chart\n{\"title\": \"Shoppers who bought jam\", \"unit\": \"%\", \"data\": [[\"6 varieties shown\", 30], [\"24 varieties shown\", 3]]}\n```\n\n### Drivers of consumer decisions\n\n| Driver | Seller response |\n|---|---|\n| Convenience | Fast, simple checkout |\n| Trust | Reviews, guarantees, returns policy |\n| Price perception | Clear value, transparent fees |\n| Emotion and identity | Story and brand fit |\n| Social proof | Ratings, popularity |\n| Choice overload | Curated recommendations |"}, {"id": 20, "title": "Choice architecture and pricing presentation", "tldr": "How options are presented changes what people choose. Good-better-best tiers, recommended options, defaults and comparison layouts help buyers choose confidently. Use them transparently to guide, not to trick.", "real": "Behavioral economist Dan Ariely reported an experiment based on an Economist subscription offer: when a print-only option priced the same as print-plus-web was included, 84% chose the combined offer; without that “decoy”, only 32% did.", "body": "### Decoy effect (Ariely’s experiment)\n\n```chart\n{\"title\": \"Chose print + web subscription\", \"unit\": \"%\", \"data\": [[\"With decoy option\", 84], [\"Without decoy option\", 32]]}\n```\n\n### Good-better-best tiers\n\n| Tier | Role |\n|---|---|\n| Good | Entry point, lowers barrier |\n| Better | Recommended, best value for most |\n| Best | Anchor for premium needs |\n\n### Ethical guidelines\n\n- Every option should be genuinely useful to someone\n- Show total cost clearly, including renewals\n- Avoid pre-checked add-ons and hidden fees (regulators increasingly treat these as dark patterns)"}, {"id": 21, "title": "Ideal customer profile (ICP)", "tldr": "An ICP describes the companies most likely to buy, succeed and stay: industry, size, geography, technology, needs and triggers. A sharp ICP focuses effort, raises win rates and improves retention. Build it from data on your best customers.", "real": "Software companies commonly derive their ICP by analyzing which customers have the highest retention and expansion, not just which ones bought fastest. Customers acquired outside the ICP often churn early, which is why many teams formally score accounts against ICP fit.", "body": "### ICP dimensions\n\n| Dimension | Example |\n|---|---|\n| Industry | Logistics, healthcare |\n| Company size | 200–2,000 employees |\n| Geography | North America, India, EU |\n| Technology | Uses Salesforce and AWS |\n| Business model | B2B subscription |\n| Need signals | Hiring for data roles, rapid growth |\n| Disqualifiers | Heavily regulated without required certifications |\n\n### Building an ICP from data\n\n```mermaid\nflowchart LR\n  C[All customers] --> B[Best customers: high retention, expansion, fast win]\n  B --> A[Common attributes]\n  A --> I[ICP definition]\n  I --> S[Score target accounts]\n```\n\n### ICP vs persona\n\nICP = which **companies** to target; persona = which **people** inside them."}, {"id": 22, "title": "Market sizing: TAM, SAM, SOM", "tldr": "Total addressable market (TAM) is the full demand; serviceable available market (SAM) is the part your product and channels can serve; serviceable obtainable market (SOM) is what you can realistically win soon. Use bottom-up sizing for planning.", "real": "Investors routinely ask startups for bottom-up market sizing (number of target customers × realistic annual contract value) rather than top-down “1% of a huge market” claims, because bottom-up numbers connect directly to sales plans.", "body": "### Definitions\n\n| Term | Meaning |\n|---|---|\n| TAM | Everyone who could use this type of solution |\n| SAM | Those you can serve with your product, region, channel |\n| SOM | Share you can realistically capture in 1–3 years |\n\n### Bottom-up example\n\n```\nTarget companies in SAM: 12,000\nAverage annual contract value: $20,000\nSAM revenue potential: $240M\nRealistic 3-year share: 3% → SOM ≈ $7.2M ARR\n```\n\n### Planning use\n\nMarket sizing informs territory design, hiring plans and quota setting (Part 15)."}, {"id": 23, "title": "Segmentation and territories", "tldr": "Divide the market into segments (by size, industry, region or product need) and assign them to teams and reps as territories. Good territories are fair, have enough potential, and match rep skills to buyer needs.", "real": "Many software companies split sales teams into SMB, mid-market and enterprise segments, each with different deal sizes, cycle lengths and rep profiles, and further divide enterprise into named-account territories assigned to individual reps.", "body": "### Segmentation options\n\n| Basis | Example |\n|---|---|\n| Company size | SMB / mid-market / enterprise |\n| Industry | Financial services, healthcare, retail |\n| Geography | Regions, countries |\n| Named accounts | Strategic top accounts |\n| Product line | Platform vs add-on |\n\n### Territory design principles\n\n| Principle | Why |\n|---|---|\n| Balanced potential | Fair quotas |\n| Manageable size | Coverage and focus |\n| Clear rules of engagement | No internal conflict |\n| Stability | Relationships compound |\n| Skill match | Enterprise reps for complex accounts |"}, {"id": 24, "title": "Account research", "tldr": "Before reaching out, understand the account: business model, priorities, recent news, financials, technology, org structure and likely pains. Ten minutes of focused research makes outreach relevant and meetings productive.", "real": "LinkedIn launched Sales Navigator in 2014 to help sellers research accounts and people, track job changes and find connections. Annual reports, earnings calls and job postings remain free, high-value sources of account intelligence.", "body": "### Research checklist\n\n| Source | What to learn |\n|---|---|\n| Company website and annual report | Strategy, products, priorities |\n| Earnings calls / investor decks | Executive priorities, challenges |\n| News and press releases | Expansions, acquisitions, leadership changes |\n| Job postings | Initiatives and tools being adopted |\n| LinkedIn | Org structure, roles, recent hires |\n| Tech stack tools | Current systems |\n| Industry reports | Market pressures |\n\n### Research output (3 lines)\n\n```\nPriority: \"expanding to 3 new countries this year\" (CEO letter)\nLikely pain: multi-currency billing complexity\nHook: how similar companies reduced billing setup time for new markets\n```"}, {"id": 25, "title": "Trigger events and buying signals", "tldr": "Trigger events, such as funding, leadership changes, expansion, regulation, hiring sprees or poor results, create urgency and openness to change. Monitoring triggers and reaching out at the right moment dramatically improves response.", "real": "Sales intelligence tools such as LinkedIn Sales Navigator alerts, ZoomInfo and similar platforms notify sellers of job changes, funding rounds and hiring trends, because new executives often review vendors and launch new initiatives in their first months.", "body": "### Common triggers\n\n| Trigger | Why it matters |\n|---|---|\n| New executive hired | Fresh priorities, new budget decisions |\n| Funding round | Money to invest in growth |\n| Rapid hiring | Scaling pains |\n| Expansion / new market | New requirements |\n| New regulation | Compliance needs |\n| Merger / acquisition | Systems consolidation |\n| Poor results / layoffs | Efficiency focus |\n| Competitor outage or price rise | Openness to switch |\n\n### Intent signals\n\n| Signal | Example |\n|---|---|\n| First-party | Pricing page visits, content downloads |\n| Product usage | Free users hitting limits |\n| Third-party intent | Research on related topics |"}, {"id": 26, "title": "Inbound vs outbound", "tldr": "Inbound sales responds to buyers who come to you (through marketing, search, referrals, product sign-ups); outbound sales proactively reaches target accounts. Most companies need both: inbound for efficiency, outbound for control over which accounts you pursue.", "real": "HubSpot built its business around inbound marketing (a term it popularized from 2006), while Salesforce’s outbound specialization described in “Predictable Revenue” showed the power of systematic prospecting. Many companies now run both motions with different teams.", "body": "### Comparison\n\n| | Inbound | Outbound |\n|---|---|---|\n| Who starts | Buyer | Seller |\n| Lead intent | Higher | Lower initially |\n| Volume control | Depends on marketing | Controlled by team capacity |\n| Account choice | Less control | Full control (ICP, named accounts) |\n| Cost per meeting | Often lower | Often higher |\n| Best for | Broad markets, product-led | Enterprise, new markets |\n\n### Combined motion\n\n```mermaid\nflowchart LR\n  IN[Inbound leads] --> Q[Qualification]\n  OUT[Outbound prospecting] --> Q\n  Q --> AE[Account executives]\n  PLG[Product sign-ups] --> Q\n```"}, {"id": 27, "title": "Lead sources and channels", "tldr": "Leads come from marketing (content, events, ads), outbound, referrals, partners, product usage and existing customers. Track pipeline and revenue by source to invest in what actually produces customers, not just what produces leads.", "real": "Dropbox’s referral program, which gave free storage to both the referrer and the new user, is widely credited with helping it grow from about 100,000 to 4 million users in roughly 15 months around 2008–2010.", "body": "### Dropbox growth during its referral program\n\n```chart\n{\"title\": \"Dropbox registered users (approximate)\", \"unit\": \"users\", \"data\": [[\"Start of period\", 100000], [\"About 15 months later\", 4000000]]}\n```\n\n### Lead sources compared\n\n| Source | Typical quality | Cost |\n|---|---|---|\n| Referrals | Very high | Low |\n| Existing customers (expansion) | Very high | Low |\n| Inbound demo requests | High | Medium |\n| Partners | High | Revenue share |\n| Events | Medium | High |\n| Content downloads | Low–medium | Medium |\n| Cold outbound | Variable | Medium–high |\n\n### Attribution\n\nMeasure by **closed revenue and retention**, not lead counts."}, {"id": 28, "title": "Lead scoring and qualification stages (MQL, SQL, PQL)", "tldr": "Lead scoring ranks leads by fit (ICP match) and engagement (behavior) so sales focuses on the best. Stages such as MQL (marketing qualified), SAL (sales accepted), SQL (sales qualified) and PQL (product qualified) define handoffs.", "real": "Slack’s leaders have said that teams which exchanged about 2,000 messages were far more likely to keep using the product (Stewart Butterfield cited 93% retention). Product usage thresholds like this inspired the “product-qualified lead” concept.", "body": "### Stages\n\n```mermaid\nflowchart LR\n  L[Lead] --> MQL[MQL: fits + engaged]\n  MQL --> SAL[SAL: sales accepted]\n  SAL --> SQL[SQL: confirmed need and interest]\n  SQL --> OPP[Opportunity]\n  PQL[PQL: product usage signal] --> SQL\n```\n\n### Scoring model example\n\n| Factor | Points |\n|---|---|\n| Industry in ICP | +20 |\n| 200–2,000 employees | +15 |\n| Senior title | +10 |\n| Pricing page visit | +15 |\n| Demo request | +40 |\n| Student email domain | −30 |\n\n### Review\n\nCheck scoring quarterly against which leads actually became customers."}, {"id": 29, "title": "Speed to lead", "tldr": "Response speed to inbound leads strongly affects conversion. Contact high-intent leads within minutes, route them automatically, and set service-level agreements for follow-up.", "real": "A 2011 Harvard Business Review study (“The Short Life of Online Sales Leads”) found firms that tried to contact leads within an hour were nearly seven times as likely to qualify them as firms that waited even one hour longer, and over 60 times as likely as firms waiting 24 hours or more.", "body": "### HBR findings\n\n| Comparison | Likelihood of qualifying the lead |\n|---|---|\n| Contact attempted within 1 hour vs. an hour or more later | Nearly 7× higher |\n| Contact attempted within 1 hour vs. 24 hours or later | More than 60× higher |\n\n### Speed-to-lead system\n\n```mermaid\nflowchart LR\n  F[Form / demo request] --> R[Auto-routing to rep]\n  R --> N[Instant notification]\n  N --> C[Call + email within minutes]\n  C --> S[Schedule meeting on the spot]\n```\n\n### Practices\n\n- Round-robin routing with backups\n- Calendar booking directly from the form\n- Measure median and 90th percentile response time"}, {"id": 30, "title": "Designing prospecting cadences", "tldr": "A cadence is a planned sequence of touches across channels (email, phone, LinkedIn, video) over days or weeks. Good cadences are personalized, valuable at each step, persistent but respectful, and end with a polite close.", "real": "Sales engagement platforms such as Outreach and Salesloft were built to manage multi-step, multi-channel cadences at scale, tracking replies and outcomes so teams can test which sequences perform best.", "body": "### Example 12-day cadence\n\n| Day | Channel | Purpose |\n|---|---|---|\n| 1 | Email | Relevant insight + soft ask |\n| 1 | LinkedIn | Connect with short note |\n| 3 | Call + voicemail | Reference email |\n| 5 | Email | Short case study |\n| 8 | Call | Different angle |\n| 10 | Video or LinkedIn message | Personal touch |\n| 12 | Email | Polite close (“should I stop reaching out?”) |\n\n### Principles\n\n| Principle | Why |\n|---|---|\n| Each touch adds value | Not “just following up” |\n| Vary channels | Different preferences |\n| Personalize the first lines | Relevance |\n| Respect opt-outs | Ethics and law |\n| Test and measure | Reply and meeting rates |"}, {"id": 31, "title": "Writing cold emails that get replies", "tldr": "A good cold email is short, relevant and about the buyer: a personalized opening tied to their situation, a clear problem or insight, brief proof, and a low-friction ask. Write like a peer, not a brochure.", "real": "Sales engagement platforms analyze millions of emails, and their published guidance consistently favors short emails (often under about 100–150 words) with a single, simple call to action, plain text formatting and subject lines that read like internal messages rather than marketing.", "body": "### Structure\n\n| Part | Purpose | Example |\n|---|---|---|\n| Subject | Relevant, short | “Expansion into Germany” |\n| Opening | Why them, why now | “Saw you’re opening a Berlin office this quarter.” |\n| Problem / insight | Something they care about | “Teams expanding to the EU often hit VAT invoicing delays.” |\n| Proof | Brief credibility | “We helped [similar company] cut setup from 6 weeks to 1.” |\n| Ask | Low friction | “Worth a 15-minute call next week?” |\n\n### Example\n\n```text\nSubject: Berlin launch + VAT invoicing\n\nHi Priya — saw the Berlin office announcement, congratulations.\nFinance teams expanding into the EU often lose weeks setting up compliant VAT invoicing.\nWe helped a similar logistics company go live in 7 days instead of 6 weeks.\nOpen to a 15-minute call to compare notes on your rollout?\n```\n\n### Avoid\n\nLong company introductions, attachments in first emails, vague asks (“let me know your thoughts”) and fake familiarity."}, {"id": 32, "title": "Personalization at scale", "tldr": "Personalize where it matters most, the first line and the reason for reaching out, using account, persona and trigger research. Use tiers: deep personalization for top accounts, segment-level personalization for the rest. AI can help draft, but humans must verify.", "real": "Many sales teams tier accounts (for example, “Tier 1” strategic accounts get fully custom outreach, “Tier 2” get industry- and trigger-based messaging, “Tier 3” get persona templates), a practice common in account-based selling programs.", "body": "### Personalization tiers\n\n| Tier | Accounts | Effort per prospect | Personalization |\n|---|---|---|---|\n| 1 | Top 20–50 | 15–30 minutes | Unique research and message |\n| 2 | Next few hundred | 3–5 minutes | Trigger + industry + persona |\n| 3 | Broad list | < 1 minute | Persona template with segment details |\n\n### Personalization sources\n\n| Source | Example line |\n|---|---|\n| Trigger | “Congrats on the Series B” |\n| Content | “Your podcast comment about onboarding costs…” |\n| Hiring | “Noticed you’re hiring 5 SDRs” |\n| Tech stack | “Since you’re on HubSpot…” |\n| Mutual connection | “Rahul at Acme suggested I reach out” |\n\n### Rule\n\nRelevance beats flattery. Personalization should explain **why you are contacting them**, not just prove you looked at their profile."}, {"id": 33, "title": "Email deliverability", "tldr": "If emails land in spam, nothing else matters. Authenticate domains (SPF, DKIM, DMARC), warm up new domains, keep volumes moderate, clean lists, make unsubscribing easy, and keep spam complaints very low.", "real": "Starting in February 2024, Gmail and Yahoo required bulk senders to authenticate email with SPF, DKIM and DMARC, offer one-click unsubscribe, and keep spam complaint rates below 0.3%, raising the bar for outbound email programs.", "body": "### Deliverability checklist\n\n- [ ] SPF, DKIM and DMARC configured\n- [ ] Separate sending domain for outbound (protect main domain)\n- [ ] Gradual warm-up of new domains and mailboxes\n- [ ] Verified email addresses (low bounce rate)\n- [ ] Easy unsubscribe honored promptly\n- [ ] Moderate daily volume per mailbox\n- [ ] Plain text, few links, no large images\n- [ ] Monitor spam complaint and bounce rates\n\n### Key thresholds (guidance)\n\n| Metric | Target |\n|---|---|\n| Bounce rate | < 2% |\n| Spam complaint rate | Well below 0.3% |\n| Reply rate | Track trends; drops may signal spam placement |\n\n### Legal note\n\nFollow laws such as the US CAN-SPAM Act and the EU’s GDPR and ePrivacy rules; requirements differ by country."}, {"id": 34, "title": "Cold calling", "tldr": "Cold calls still work when they are prepared, respectful and conversational. Open with a permission-based or reason-based opener, state a relevant problem briefly, ask a question, and aim for a meeting, not a full pitch.", "real": "Analyses of recorded cold calls by conversation intelligence companies such as Gong have repeatedly found that calls where the rep states a clear reason for calling tend to perform better than generic “how are you today” openers.", "body": "### Call structure\n\n```mermaid\nflowchart LR\n  O[Opener: name + reason] --> P[Problem statement]\n  P --> Q[Question to engage]\n  Q --> L[Listen and respond]\n  L --> A[Ask for meeting]\n  A --> N[Confirm next step]\n```\n\n### Opener examples\n\n| Style | Example |\n|---|---|\n| Reason-based | “Hi Ana, it’s Raj from Acme. I’m calling because you’re hiring finance analysts, and teams at that stage often struggle with month-end close. Is that on your radar?” |\n| Permission-based | “I know I’m calling out of the blue. Can I take 30 seconds to say why, and you tell me if it’s relevant?” |\n\n### Tips\n\n- Stand up and smile; tone carries\n- Prepare 2–3 problem hypotheses per persona\n- Accept “no” gracefully; ask if a later time is better\n- Log outcomes immediately"}, {"id": 35, "title": "Handling call reluctance, gatekeepers and rejection", "tldr": "Rejection is part of prospecting, not a verdict on you. Build routines, focus on activities you control, treat gatekeepers as helpers, and track small wins. Resilience is a trainable skill.", "real": "Prospecting coaches and sales leaders commonly recommend time-blocked “power hours” for calls, because batching outreach into focused blocks reduces procrastination and helps reps build momentum despite frequent rejection.", "body": "### Reframing rejection\n\n| Thought | Reframe |\n|---|---|\n| “They hate me” | “Bad timing or wrong fit” |\n| “I failed” | “One step closer to a yes” |\n| “Calling is pushy” | “I may solve a real problem” |\n\n### Gatekeepers\n\n| Approach | Example |\n|---|---|\n| Be honest and polite | “Could you help me? I’m trying to reach whoever handles finance systems.” |\n| Ask for guidance | “Who would be the right person to speak with about…?” |\n| Respect their role | Never trick or mislead |\n\n### Routines that help\n\n- Fixed daily prospecting blocks\n- Warm-up call to a friendly contact\n- Track activities and conversations, not just meetings\n- Celebrate effort and learning"}, {"id": 36, "title": "Voicemail and follow-up messages", "tldr": "Voicemails rarely get callbacks but increase recognition and email replies. Keep them short (under 30 seconds), give a reason, reference your email, and avoid lengthy pitches.", "real": "Sales cadences in platforms like Outreach and Salesloft commonly pair a voicemail with an email sent the same day, with the voicemail mentioning the subject line so the prospect recognizes the email.", "body": "### Voicemail script\n\n```text\n\"Hi Ana, Raj from Acme. Calling about month-end close for your growing finance team.\nI'll send a short email with the subject 'Close in 3 days' — reply there if it's useful.\nAgain, Raj, at 555-0142.\"\n```\n\n### Follow-up rules\n\n| Rule | Why |\n|---|---|\n| Add something new each time | Avoid “just checking in” |\n| Reference earlier touches | Continuity |\n| Change angle | Different pain or proof |\n| Close the loop | Polite final message |\n\n### Breakup email example\n\n```text\n\"Haven't heard back, so I'll assume close timing isn't a priority right now.\nIf that changes, here's a 2-page guide on cutting close time. Wishing you a strong quarter.\"\n```"}, {"id": 37, "title": "Social selling on LinkedIn", "tldr": "Social selling builds credibility and relationships through professional networks: an optimized profile, sharing useful insights, engaging with prospects’ content, and personalized connection requests. It warms up outreach rather than replacing it.", "real": "LinkedIn introduced its Social Selling Index, a score based on professional brand, finding the right people, engaging with insights and building relationships, and has long promoted social selling through its Sales Navigator product.", "body": "### Profile as a landing page\n\n| Element | Buyer-focused version |\n|---|---|\n| Headline | “Helping finance teams close books faster” |\n| About | Problems you solve, results, proof |\n| Featured | Case studies, articles |\n| Activity | Regular useful posts |\n\n### Engagement routine (20 minutes/day)\n\n```mermaid\nflowchart LR\n  F[Follow target accounts] --> E[Comment thoughtfully on prospects' posts]\n  E --> C[Connect with a personal note]\n  C --> S[Share an insight post weekly]\n  S --> M[Message when there's a relevant reason]\n```\n\n### Avoid\n\nPitching in connection requests, automated spam, and generic comments (“Great post!”)."}, {"id": 38, "title": "Video and creative prospecting", "tldr": "Short personalized videos, screenshots or mini-audits stand out in crowded inboxes. They work best for high-value accounts where effort is justified, and must stay short, specific and genuinely useful.", "real": "Tools such as Vidyard and Loom made personalized prospecting videos easy, and many sales teams use short videos showing a prospect’s own website or public data with a specific observation as a pattern interrupt in cadences.", "body": "### Effective formats\n\n| Format | Example |\n|---|---|\n| Personalized video (60–90 s) | Walk through their pricing page with one improvement idea |\n| Mini-audit | 3 observations about their onboarding flow |\n| Benchmark snapshot | How they compare with peers on a public metric |\n| Handwritten note / gift | For very high-value accounts (follow gift policies) |\n\n### Video script\n\n```\n1. Their name and screen showing their site (5 s)\n2. One specific observation (20 s)\n3. Why it matters + example result (20 s)\n4. Simple ask (10 s)\n```\n\n### Measure\n\nReply and meeting rates by format; stop formats that do not outperform plain email."}, {"id": 39, "title": "Multithreading from the start", "tldr": "Deals that depend on a single contact are fragile. Engage several stakeholders early, each with a role-relevant message, while respecting your main contact. Multithreaded deals close more often and survive personnel changes.", "real": "Revenue intelligence vendors such as Gong have published analyses of their customers’ deals showing that won deals typically involve more buyer-side contacts than lost deals, especially at larger deal sizes.", "body": "### Mapping the account\n\n```mermaid\nflowchart TB\n  EB[Economic buyer: CFO] --- CH[Champion: Finance Ops Director]\n  CH --- U[Users: AP team]\n  CH --- T[Technical: IT architect]\n  EB --- P[Procurement]\n```\n\n### Ways to multithread\n\n| Method | Example |\n|---|---|\n| Ask your champion | “Who else will care about this?” |\n| Role-specific content | Security brief for IT |\n| Executive alignment | Your VP meets their VP |\n| Workshops | Invite several stakeholders |\n| Events | Customer roundtables |\n\n### Etiquette\n\nTell your champion before contacting others, and frame it as helping them succeed internally."}, {"id": 40, "title": "Referrals and warm introductions", "tldr": "Introductions from trusted people convert far better than cold outreach. Ask happy customers, partners, investors and your network for specific introductions, make it easy with a ready-to-forward blurb, and always thank and update the referrer.", "real": "Referral programs have been central to growth at many companies; Dropbox’s two-sided referral reward is a famous consumer example, and in B2B many companies formalize customer referral programs with rewards and advocacy platforms.", "body": "### Asking for referrals\n\n| Step | Example |\n|---|---|\n| Right time | After a success milestone |\n| Be specific | “Do you know the finance lead at X or Y?” |\n| Make it easy | Send a 3-line forwardable blurb |\n| Close the loop | Tell them how it went |\n\n### Forwardable blurb\n\n```text\n\"Meera, introducing Raj from Acme. They helped us cut month-end close from 9 to 4 days.\nThought it might be relevant as you scale your finance team. I'll let you two connect.\"\n```\n\n### Sources\n\nCustomers, partners, investors and advisors, former colleagues, and other vendors serving the same buyers."}, {"id": 41, "title": "The purpose of discovery", "tldr": "Discovery is where deals are won or lost. Its goal is to understand the buyer’s situation, problems, impact, goals, stakeholders and decision process well enough to judge fit and build a compelling case, while helping the buyer think more clearly.", "real": "Neil Rackham’s SPIN research found that in large sales, successful calls were distinguished by the kinds of questions sellers asked, particularly questions that explored the implications of problems, rather than by product presentations or closing techniques.", "body": "### Discovery outcomes\n\n| Outcome | Example |\n|---|---|\n| Current state | How they work today |\n| Problems | What is not working |\n| Impact | Cost, risk, lost revenue |\n| Desired future state | What success looks like |\n| Priority and urgency | Why now |\n| Stakeholders | Who decides, who influences |\n| Process | Steps, timeline, approvals |\n| Fit | Can we genuinely help? |\n\n### Good discovery feels like\n\nA useful consultation for the buyer, not an interrogation. They should leave with new clarity even if they do not buy."}, {"id": 42, "title": "Asking great questions", "tldr": "Use open questions to explore, follow-up questions to go deeper, and confirming questions to check understanding. Ask about business impact, not just features. One good follow-up beats ten scripted questions.", "real": "Analyses by conversation intelligence platforms such as Gong have reported that successful discovery calls tend to include a healthy number of questions spread throughout the conversation, rather than a burst of rapid-fire questions at the start.", "body": "### Question types\n\n| Type | Purpose | Example |\n|---|---|---|\n| Open | Explore | “Walk me through how month-end close works today.” |\n| Probing | Go deeper | “What happens when numbers don’t reconcile?” |\n| Impact | Quantify | “How many hours does that cost the team each month?” |\n| Priority | Urgency | “Where does this rank among your goals this quarter?” |\n| Confirming | Check | “So the main issue is X, causing Y. Did I get that right?” |\n| Future | Vision | “If this were solved, what would change for you?” |\n\n### Follow-up techniques\n\n- “Tell me more about that.”\n- “What do you mean by…?”\n- “Why is that important?”\n- “What have you tried so far?”\n\n### Avoid\n\nLeading questions (“Wouldn’t you agree…?”), stacked questions, and asking what you could have researched."}, {"id": 43, "title": "SPIN questioning", "tldr": "SPIN stands for Situation, Problem, Implication and Need-payoff questions. Situation questions gather facts, problem questions surface difficulties, implication questions explore consequences, and need-payoff questions get the buyer to state the value of solving it.", "real": "Neil Rackham developed SPIN through research at Huthwaite involving about 35,000 sales calls across many companies, published in “SPIN Selling” in 1988. It remains one of the most widely taught questioning models in complex B2B sales.", "body": "### SPIN sequence\n\n```mermaid\nflowchart LR\n  S[Situation: facts] --> P[Problem: difficulties]\n  P --> I[Implication: consequences]\n  I --> N[Need-payoff: value of solving]\n```\n\n### Examples (accounting software)\n\n| Type | Example |\n|---|---|\n| Situation | “How many entities do you consolidate each month?” |\n| Problem | “Where does the process slow down?” |\n| Implication | “When close runs late, how does that affect reporting to the board?” |\n| Need-payoff | “If close took 3 days instead of 10, what would that free your team to do?” |\n\n### Key insights\n\n- Too many situation questions bore buyers\n- Implication questions build urgency in large sales\n- Need-payoff answers become the buyer’s own business case"}, {"id": 44, "title": "Current state, future state and the gap", "tldr": "Map where the buyer is today, where they want to be, and the gap between them, including the business impact of that gap. The size and urgency of the gap, not your product features, determines whether a purchase happens.", "real": "Keenan’s “Gap Selling” (2018) popularized framing sales around the gap between the buyer’s current state and desired future state, arguing that the bigger and more clearly understood the gap, the more compelling the reason to change.", "body": "### Gap map\n\n```mermaid\nflowchart LR\n  CS[Current state: problems, root causes, impact] --> GAP[The gap: value of change]\n  GAP --> FS[Future state: goals, metrics, outcomes]\n```\n\n### Gap worksheet\n\n| Area | Current | Future | Impact |\n|---|---|---|---|\n| Close time | 10 days | 3 days | 7 days earlier reporting |\n| Errors | 4 restatements/year | 0–1 | Audit risk reduced |\n| Team overtime | 120 hours/month | 30 hours/month | Retention, cost |\n\n### Use\n\nShare the worksheet back with the buyer; it becomes the foundation of the business case and proposal."}, {"id": 45, "title": "Active listening and talk ratio", "tldr": "Listening shows respect and uncovers what matters. Summarize, label emotions, ask follow-ups and allow silence. In discovery, buyers should do most of the talking.", "real": "Gong’s analysis of recorded sales calls reported that top-performing reps talked roughly 43% of the time and listened 57%, while lower performers talked considerably more, a finding widely cited in sales training.", "body": "### Talk-to-listen ratio (Gong analysis, top performers)\n\n```chart\n{\"title\": \"Share of conversation time, top performers\", \"unit\": \"%\", \"data\": [[\"Rep talking\", 43], [\"Buyer talking\", 57]]}\n```\n\n### Active listening techniques\n\n| Technique | Example |\n|---|---|\n| Summarize | “So the core problem is…” |\n| Label | “It sounds like this has been frustrating.” |\n| Mirror | Repeat the last few key words as a question |\n| Pause | Wait 2–3 seconds before responding |\n| Note-taking | Capture exact phrases the buyer uses |\n\n### Warning signs you are talking too much\n\nLong monologues, buyer gives short answers, no new information learned."}, {"id": 46, "title": "Uncovering pain and business impact", "tldr": "Surface pain is a symptom; business impact is what drives decisions. Trace problems to consequences for revenue, cost, risk, time or people, and connect them to the goals of each stakeholder, especially the economic buyer.", "real": "The Sandler selling system, developed by David Sandler in 1967, uses a “pain funnel” of progressively deeper questions to move from surface issues to their business and personal impact.", "body": "### Pain funnel\n\n```mermaid\nflowchart TB\n  A[\"Tell me more about that...\"] --> B[\"Can you give me an example?\"]\n  B --> C[\"How long has this been a problem?\"]\n  C --> D[\"What have you tried to fix it?\"]\n  D --> E[\"What has it cost the business?\"]\n  E --> F[\"How do you feel about it?\"]\n  F --> G[\"Have you given up trying to fix it?\"]\n```\n\n### Impact categories\n\n| Category | Example question |\n|---|---|\n| Revenue | “How many deals slip because quotes take a week?” |\n| Cost | “How much overtime does this cause?” |\n| Risk | “What happens if an auditor finds this?” |\n| Time | “How long does each cycle take?” |\n| People | “How is this affecting retention?” |"}, {"id": 47, "title": "Quantifying value and building a business case", "tldr": "Translate impact into numbers using the buyer’s own data: hours saved, revenue gained, risk reduced. Build conservative ROI and payback estimates together with the buyer so they own the case and can defend it internally.", "real": "Enterprise software companies commonly provide ROI calculators and dedicated value engineering teams who build business cases with customer data, because CFOs increasingly require quantified justification for new spending.", "body": "### Simple ROI model\n\n```\nAnnual benefit = hours saved × loaded hourly cost + revenue impact + risk reduction value\nROI = (Annual benefit − Annual cost) ÷ Annual cost\nPayback (months) = Total first-year cost ÷ (Annual benefit ÷ 12)\n```\n\n### Example\n\n| Item | Value |\n|---|---|\n| Hours saved per month | 90 |\n| Loaded hourly cost | $50 |\n| Annual labor benefit | $54,000 |\n| Faster billing cash impact | $30,000 |\n| Annual cost of solution | $36,000 |\n| ROI | 133% |\n| Payback | \\~5 months |\n\n### Credibility rules\n\nUse the buyer’s numbers, show assumptions, be conservative, and let the buyer adjust inputs."}, {"id": 48, "title": "Mapping stakeholders and the decision process", "tldr": "Know who influences, who decides, who signs and who can block, plus the steps and timeline to a decision. Map roles, priorities and attitudes, and validate the map with your champion.", "real": "Miller Heiman’s “Strategic Selling” (1985) introduced the idea of distinct buying influences, economic, user, technical and coach, and many enterprise sales teams still use stakeholder maps based on it.", "body": "### Stakeholder map template\n\n| Name | Role | Influence | Attitude | Priority | Next action |\n|---|---|---|---|---|---|\n| CFO | Economic buyer | High | Neutral | Cost control | Exec briefing |\n| Finance Ops Director | Champion | Medium | Supportive | Faster close | Co-build business case |\n| IT Architect | Technical evaluator | Medium | Skeptical | Security | Security review session |\n| Procurement | Process owner | Medium | Neutral | Terms | Share standard terms early |\n\n### Decision process questions\n\n- “Beyond you, who needs to be involved?”\n- “How have purchases like this been approved before?”\n- “What could delay or stop this?”\n- “What are the steps after you decide?”"}, {"id": 49, "title": "Budget and investment conversations", "tldr": "Discuss money early and naturally. Explore whether funds exist, where they would come from, the approval process, and how the investment compares to the cost of the problem. Budgets can often be created when value is clear.", "real": "IBM’s BANT framework, one of the oldest qualification models, put Budget first. Modern methods such as MEDDIC instead emphasize metrics and the economic buyer, reflecting that strong business cases often create budget that did not exist at first.", "body": "### Budget questions\n\n| Question | Purpose |\n|---|---|\n| “Is there budget allocated for this initiative?” | Existing funds |\n| “If not, how do new investments get approved?” | Creating budget |\n| “What range were you expecting?” | Expectations |\n| “Who controls the budget?” | Economic buyer |\n| “What does this problem cost you today?” | Value comparison |\n\n### Framing price against value\n\n```\nProblem cost per year: $150,000\nSolution cost per year: $40,000\nNet value: $110,000\n```\n\n### Avoid\n\nAvoiding the topic until the proposal, or anchoring on a discount before value is established."}, {"id": 50, "title": "Running a discovery call", "tldr": "Structure discovery calls: agree an agenda and outcome up front, explore situation, problems and impact, check stakeholders and process, summarize, and agree a concrete next step. Document everything in your CRM the same day.", "real": "Sandler’s “up-front contract”, agreeing the purpose, agenda, time and possible outcomes of a meeting at the start, is widely used to make sales conversations more productive and to reduce wasted follow-ups.", "body": "### 30-minute discovery structure\n\n| Minutes | Section |\n|---|---|\n| 0–3 | Rapport and up-front contract (agenda, time, outcomes) |\n| 3–20 | Situation, problems, impact, goals |\n| 20–25 | Stakeholders, process, timeline |\n| 25–28 | Summary and fit check |\n| 28–30 | Next step with date |\n\n### Up-front contract example\n\n```text\n\"We have 30 minutes. I'd like to understand how your close process works and where it hurts.\nThen I'll share whether we've helped teams like yours. At the end, we can decide together\nwhether a deeper session makes sense, or if it's not a fit, that's fine too. Sound good?\"\n```\n\n### Post-call notes\n\nPain, impact numbers, stakeholders, process, next step, risks, and your fit assessment."}, {"id": 51, "title": "Why qualification matters", "tldr": "Qualification decides where you invest limited time. Pursuing poor-fit or unwinnable deals wastes effort and distorts forecasts. Qualify continuously, not once, and be willing to disqualify early.", "real": "Many sales organizations track “no decision” and “unqualified” losses separately from competitive losses; research such as “The JOLT Effect” reporting 40–60% no-decision outcomes shows how much effort goes into deals that never close.", "body": "### Cost of poor qualification\n\n```mermaid\nflowchart LR\n  BAD[Poor-fit deals in pipeline] --> TIME[Rep time wasted]\n  BAD --> FC[Inflated forecast]\n  BAD --> DISC[Desperate discounting]\n  TIME --> MISS[Missed quota]\n  FC --> MISS\n```\n\n### Qualification questions\n\n| Area | Question |\n|---|---|\n| Fit | Do they match our ICP and can we solve the problem? |\n| Pain | Is the problem important enough to act on? |\n| Power | Can we reach the decision maker? |\n| Process | Is there a realistic path to a decision? |\n| Timing | Is there a reason to act now? |\n| Money | Can they fund it? |\n\n### Mindset\n\n“No” early is the second-best answer. A fast no saves both sides time."}, {"id": 52, "title": "BANT", "tldr": "BANT checks Budget, Authority, Need and Timeline. It is simple and useful for transactional or early-stage qualification, but rigid use can disqualify buyers whose budget does not exist yet.", "real": "BANT is generally attributed to IBM, which used it to qualify opportunities decades ago. Its simplicity keeps it popular for SDR qualification, while complex enterprise sales usually layer richer frameworks on top.", "body": "### BANT\n\n| Letter | Question |\n|---|---|\n| Budget | Is money available or obtainable? |\n| Authority | Who decides and signs? |\n| Need | Is there a real problem we solve? |\n| Timeline | When do they need it? |\n\n### Strengths and limits\n\n| Strength | Limit |\n|---|---|\n| Easy to teach | Budget often created by value |\n| Quick for SDRs | Ignores decision process complexity |\n| Good for small deals | Weak on champions and competition |\n\n### Modern adaptation\n\nAsk about need first, then timeline, then authority, then budget (sometimes called “NTAB”), so the conversation starts with the buyer’s problem."}, {"id": 53, "title": "MEDDIC and MEDDPICC", "tldr": "MEDDIC qualifies complex deals through Metrics, Economic buyer, Decision criteria, Decision process, Identify pain and Champion. MEDDPICC adds Paper process and Competition. Gaps in any element are deal risks to address.", "real": "MEDDIC is commonly credited to Dick Dunkel and Jack Napoli at PTC in the 1990s, during a period of very rapid growth for the company. It has since become one of the most widely used qualification frameworks in enterprise software.", "body": "### Elements\n\n| Element | Key question |\n|---|---|\n| Metrics | What measurable outcome will they achieve? |\n| Economic buyer | Who has final authority over the money? |\n| Decision criteria | How will they evaluate options? |\n| Decision process | What steps and approvals lead to a decision? |\n| Paper process | What legal/procurement steps lead to signature? |\n| Identify pain | What business pain drives this? |\n| Champion | Who sells for us internally, with influence? |\n| Competition | What alternatives, including doing nothing? |\n\n### Deal scorecard\n\n```chart\n{\"title\": \"Example MEDDPICC scorecard (0–3 per element)\", \"unit\": \"\", \"data\": [[\"Metrics\", 3], [\"Economic buyer\", 1], [\"Decision criteria\", 2], [\"Decision process\", 2], [\"Paper process\", 0], [\"Pain\", 3], [\"Champion\", 2], [\"Competition\", 2]]}\n```\n\nLow scores (economic buyer, paper process here) show where to act next."}, {"id": 54, "title": "Finding and developing champions", "tldr": "A champion is an influential insider who wants your solution to succeed and actively sells it internally. Test champions by whether they give access, information and action, not just friendliness. Equip them with materials and coaching.", "real": "In MEDDIC training, sales teams distinguish a true champion (has power and influence, and actively advocates) from a “coach” who only shares information, because deals relying on coaches without power frequently stall.", "body": "### Champion vs coach vs friend\n\n| | Friend | C

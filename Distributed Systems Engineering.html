, "real": "Martin Kleppmann’s 2016 analysis “How to do distributed locking” showed that lock services without fencing tokens can allow two clients to believe they hold a lock after a process pause, corrupting data.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Choosing and bounding a leader’s authority |\n| Why it matters | Prevents two leaders acting simultaneously |\n| Mechanisms | Consensus-based election, leases, fencing tokens |\n| Trade-off | Lease length: availability vs safety margin |\n| Failure mode | Paused old leader resuming writes after lease expiry |\n| Production habit | Storage rejects writes with old fencing tokens |\n\n### Fencing tokens\n\n```mermaid\nsequenceDiagram\n  participant A as Client A\n  participant L as Lock service\n  participant S as Storage\n  A->>L: Acquire lock\n  L-->>A: Token 33\n  Note over A: Long GC pause, lease expires\n  participant B as Client B\n  B->>L: Acquire lock\n  L-->>B: Token 34\n  B->>S: Write with token 34\n  A->>S: Write with token 33\n  S-->>A: Rejected: token 33 < 34\n```"}, {"id": 58, "title": "Membership and reconfiguration", "tldr": "Clusters change: nodes join, leave and are replaced. Changing membership safely requires the consensus protocol itself to agree on configuration changes, typically one node at a time or with joint consensus.", "real": "The Raft paper describes joint consensus for membership changes, and etcd adds learner (non-voting) members that catch up before being promoted, reducing the risk of availability loss during reconfiguration.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Safely changing which nodes vote |\n| Why it matters | Unsafe changes can cause split brain or lost quorum |\n| Techniques | Single-server changes, joint consensus, learners |\n| Trade-off | Speed of scaling vs safety |\n| Failure mode | Removing two nodes at once from a three-node cluster |\n| Production habit | Change one member at a time; add learners first |\n\n### Safe replacement\n\n```mermaid\nflowchart LR\n  ADD[Add new node as learner] --> CATCH[Catch up log]\n  CATCH --> PROMOTE[Promote to voter]\n  PROMOTE --> REMOVE[Remove old node]\n```"}, {"id": 59, "title": "Byzantine fault tolerance", "tldr": "Byzantine fault-tolerant protocols tolerate nodes that lie or behave maliciously, requiring 3f + 1 nodes for f faults and more messages. They matter for blockchains and multi-party systems without mutual trust, rarely inside one organization.", "real": "Castro and Liskov’s Practical Byzantine Fault Tolerance (PBFT, 1999) made BFT practical for small clusters, and later protocols such as Tendermint and HotStuff (2019, used as the basis for Meta’s former Diem project) scaled BFT for blockchains.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Consensus despite arbitrary/malicious nodes |\n| Why it matters | Needed where participants don’t trust each other |\n| Cost | 3f + 1 nodes, more communication |\n| When to use | Blockchains, cross-organization ledgers |\n| When not to use | Single trusted organization’s internal systems |\n| Trade-off | Trustlessness vs performance |\n| Failure mode | Paying BFT costs for crash-only threats |\n\n### Crash vs Byzantine tolerance\n\n| | Crash fault tolerant | Byzantine fault tolerant |\n|---|---|---|\n| Nodes for f faults | 2f + 1 | 3f + 1 |\n| Examples | Raft, Paxos | PBFT, HotStuff, Tendermint |\n| Typical use | Databases, coordination | Blockchains |"}, {"id": 60, "title": "Consensus systems in practice", "tldr": "In production, use consensus through mature systems: etcd, ZooKeeper, Consul, or databases with built-in Raft. Keep consensus clusters small (3 or 5 nodes), on low-latency networks, with reliable disks, monitoring and backups.", "real": "Kubernetes stores all cluster state in etcd, and etcd’s documentation recommends odd-sized clusters (typically 3 or 5 members), fast disks for its write-ahead log and regular backups.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Operating consensus clusters |\n| Why it matters | They are critical shared dependencies |\n| Practices | 3 or 5 nodes, fast disks, low latency, backups, monitoring |\n| Trade-off | Larger clusters tolerate more failures but write slower |\n| Failure mode | Slow disks causing leader elections under load |\n| Production habit | Alert on fsync latency, leader changes, quorum health |\n\n### Operating checklist\n\n- [ ] Odd number of members across failure domains\n- [ ] Dedicated fast storage for logs\n- [ ] Regular snapshots and tested restores\n- [ ] Monitoring: leader changes, commit latency, disk fsync\n- [ ] Clients use timeouts and retries\n- [ ] Avoid storing large or high-churn data"}, {"id": 61, "title": "Transactions across nodes", "tldr": "When one logical operation updates data on several nodes or services, keeping it atomic and consistent is hard. Options include distributed commit protocols, sagas with compensation, or redesigning so each operation stays within one partition.", "real": "Pat Helland’s 2007 paper “Life beyond Distributed Transactions” argued that large-scale systems should avoid distributed transactions by designing around entities that each live on one partition, coordinating between them with messages.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Atomicity and consistency spanning multiple nodes |\n| Why it matters | Business operations often touch several data owners |\n| Options | 2PC, consensus-based commit, sagas, single-partition design |\n| Trade-off | Strong atomicity vs availability and latency |\n| Failure mode | Partial updates leaving inconsistent state |\n| Production habit | First try to keep transactions within one partition |\n\n### Approach selection\n\n| Situation | Approach |\n|---|---|\n| Same database, same partition | Local transaction |\n| Distributed SQL database | Built-in distributed transactions |\n| Multiple services | Saga + outbox |\n| Cross-organization | Saga + reconciliation |"}, {"id": 62, "title": "Two-phase commit", "tldr": "In 2PC, a coordinator asks participants to prepare (vote) and then commits only if all vote yes. It guarantees atomicity but blocks if the coordinator fails after participants prepare, holding locks until it recovers.", "real": "The X/Open XA standard (1991) defined 2PC interfaces implemented by databases and message brokers; modern distributed databases such as Spanner make the coordinator fault-tolerant by replicating its state with Paxos.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Atomic commit across participants |\n| Why it matters | All-or-nothing updates on multiple nodes |\n| Trade-off | Atomicity vs blocking and latency |\n| Failure mode | Coordinator crash leaves participants “in doubt” holding locks |\n| Production habit | Replicated coordinators; timeouts and recovery tooling |\n\n### Protocol\n\n```mermaid\nsequenceDiagram\n  participant C as Coordinator\n  participant P1 as Participant 1\n  participant P2 as Participant 2\n  C->>P1: Prepare\n  C->>P2: Prepare\n  P1-->>C: Yes\n  P2-->>C: Yes\n  C->>P1: Commit\n  C->>P2: Commit\n```"}, {"id": 63, "title": "Three-phase commit and its limits", "tldr": "Three-phase commit adds a pre-commit phase to avoid blocking under crash failures, but it isn’t safe under network partitions, so it is rarely used. Practical systems instead make 2PC coordinators highly available with consensus.", "real": "Dale Skeen proposed three-phase commit in 1981; its assumptions of bounded delays and no partitions mean modern systems such as Spanner and CockroachDB combine 2PC with consensus-replicated state instead.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Non-blocking commit protocol under strict assumptions |\n| Why it matters | Explains why practical systems choose other designs |\n| Trade-off | Non-blocking in theory vs unsafe under partitions |\n| Failure mode | Inconsistent decisions during partitions |\n| Production habit | Prefer 2PC + replicated coordinator or sagas |\n\n### Comparison\n\n| | 2PC | 3PC | 2PC + consensus |\n|---|---|---|---|\n| Blocks on coordinator crash | Yes | No (crash-only model) | No (coordinator replicated) |\n| Safe under partitions | Yes (but blocks) | No | Yes |\n| Used in practice | Common | Rare | Distributed databases |"}, {"id": 64, "title": "Sagas", "tldr": "A saga splits a long transaction into local steps, each with a compensating action that undoes it semantically. If a step fails, previous steps are compensated. Sagas trade isolation for availability across services.", "real": "Hector Garcia-Molina and Kenneth Salem introduced sagas in 1987 for long-lived transactions, and the pattern became standard in microservice architectures such as travel booking and order processing.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Sequence of local transactions with compensations |\n| Why it matters | Multi-service consistency without distributed locks |\n| Styles | Orchestrated (central coordinator), choreographed (events) |\n| Trade-off | Availability vs lack of isolation (intermediate states visible) |\n| Failure mode | Compensation that can’t fully undo (email already sent) |\n| Production habit | Order steps so irreversible ones come last |\n\n### Order saga\n\n```mermaid\nflowchart LR\n  R[Reserve inventory] --> P[Charge payment]\n  P --> S[Create shipment]\n  P -->|fails| CR[Compensate: release inventory]\n  S -->|fails| CP[Compensate: refund payment]\n  CP --> CR\n```"}, {"id": 65, "title": "The transactional outbox", "tldr": "To update a database and publish an event atomically, write the event to an outbox table in the same local transaction; a relay later publishes it. This avoids dual-write inconsistencies between databases and message brokers.", "real": "Chris Richardson’s microservices patterns catalog popularized the transactional outbox, and Debezium provides an outbox event router that publishes outbox rows to Kafka via change data capture.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Atomic state change + event via one local transaction |\n| Why it matters | Prevents lost or phantom events |\n| Relay options | Polling publisher, CDC |\n| Trade-off | Extra table and relay process |\n| Failure mode | Events published twice (relay retries) |\n| Production habit | Idempotent consumers keyed by event ID |\n\n### Flow\n\n```mermaid\nflowchart LR\n  TX[Local transaction: update order + insert outbox row] --> DB[(Database)]\n  DB --> RELAY[Relay / CDC]\n  RELAY --> BROKER[Broker]\n  BROKER --> CONSUMER[Idempotent consumers]\n```"}, {"id": 66, "title": "Idempotency and exactly-once effects", "tldr": "Networks and retries cause duplicate requests and messages. “Exactly-once” in practice means at-least-once delivery plus idempotent processing, so duplicates have no additional effect. Use idempotency keys and deduplication records.", "real": "Stripe’s API accepts an Idempotency-Key header so clients can safely retry requests such as charges, and Kafka added idempotent producers and transactions in version 0.11 (2017) to support exactly-once processing within Kafka.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Making repeated operations produce one effect |\n| Why it matters | Retries are unavoidable |\n| Techniques | Idempotency keys, natural keys, dedup tables, conditional writes |\n| Trade-off | Storage for dedup records vs correctness |\n| Failure mode | Double charges after a timeout retry |\n| Production habit | Every mutating API accepts an idempotency key |\n\n### Idempotent handler\n\n```python\ndef handle_payment(request_id: str, account: str, amount: int, db):\n    with db.transaction():\n        if db.exists(\"processed_requests\", request_id):\n            return db.get_result(request_id)          # duplicate: return same result\n        result = charge(account, amount)\n        db.insert(\"processed_requests\", request_id, result)\n        return result\n```"}, {"id": 67, "title": "Spanner-style distributed transactions", "tldr": "Spanner combines Paxos-replicated data splits, two-phase commit across splits, two-phase locking for read-write transactions and TrueTime timestamps to provide externally consistent transactions globally, plus lock-free snapshot reads.", "real": "Google’s 2012 Spanner paper described these mechanisms, and Spanner backed Google’s advertising system (F1); Cloud Spanner became available externally in 2017.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Globally distributed ACID transactions |\n| Why it matters | Strong consistency at global scale |\n| Mechanisms | Paxos groups, 2PC, 2PL, TrueTime commit wait |\n| Trade-off | Cross-region commit latency |\n| Failure mode | Schema with hotspots (monotonic keys) |\n| Production habit | Design keys to spread load; colocate related data |\n\n### Transaction flow\n\n```mermaid\nflowchart LR\n  TX[Read-write transaction] --> LOCKS[Acquire locks on splits]\n  LOCKS --> PREP[2PC prepare across Paxos groups]\n  PREP --> TS[Choose TrueTime timestamp]\n  TS --> WAIT[Commit wait]\n  WAIT --> COMMIT[Commit + release locks]\n```"}, {"id": 68, "title": "Deterministic transactions: Calvin", "tldr": "Deterministic database designs agree on the order of transactions first (via a replicated log), then execute them deterministically on each replica, avoiding 2PC during execution. They need transactions’ read/write sets in advance.", "real": "The Calvin paper (Thomson et al., SIGMOD 2012) introduced this approach, and FaunaDB built a commercial distributed database inspired by Calvin’s deterministic transaction protocol.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Order-then-execute transaction processing |\n| Why it matters | Avoids distributed commit during execution |\n| Trade-off | Needs known read/write sets; less flexible interactive transactions |\n| Failure mode | Dependent transactions requiring reconnaissance queries |\n| Production habit | Suited to stored-procedure style workloads |\n\n### Order then execute\n\n```mermaid\nflowchart LR\n  CLIENTS[Transactions] --> SEQ[Sequencer: agree on order via log]\n  SEQ --> R1[Replica 1 executes in order]\n  SEQ --> R2[Replica 2 executes in order]\n```"}, {"id": 69, "title": "Percolator and snapshot isolation at scale", "tldr": "Percolator added cross-row, cross-table snapshot isolation transactions on top of Bigtable using timestamps from a central oracle and a two-phase commit with primary locks. Its design influenced several distributed databases.", "real": "Google described Percolator in 2010 as the system behind incremental updates to its web search index, and TiDB’s TiKV storage layer uses a Percolator-inspired transaction model.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Client-coordinated 2PC with snapshot isolation on a key-value store |\n| Why it matters | Transactions on top of non-transactional storage |\n| Components | Timestamp oracle, primary lock, secondary locks |\n| Trade-off | Snapshot isolation (write skew possible); oracle dependency |\n| Failure mode | Abandoned locks from crashed clients needing cleanup |\n| Production habit | Lock cleanup and oracle high availability |\n\n### Commit steps\n\n| Step | Action |\n|---|---|\n| 1 | Get start timestamp from oracle |\n| 2 | Prewrite: lock primary + secondaries |\n| 3 | Get commit timestamp |\n| 4 | Commit primary (commit point) |\n| 5 | Commit secondaries asynchronously |"}, {"id": 70, "title": "Reservation patterns: TCC and escrow", "tldr": "Try–Confirm–Cancel reserves resources tentatively (try), then confirms or cancels them. Escrow divides a shared quantity, such as inventory, into allocations each node can spend without coordination. Both avoid long locks across services.", "real": "Airline seat holds, hotel booking “pending” reservations and payment card authorizations (authorize, then capture or void) are everyday examples of try–confirm–cancel semantics.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Tentative reservations finalized later |\n| Why it matters | Coordinates resources without distributed locks |\n| Examples | Card auth/capture, seat holds, inventory reservations |\n| Trade-off | Expired holds and cleanup logic |\n| Failure mode | Holds never released, blocking inventory |\n| Production habit | Expiry on every reservation |\n\n### TCC flow\n\n```mermaid\nflowchart LR\n  TRY[Try: hold seat 15 min] --> DECIDE{Payment OK?}\n  DECIDE -- yes --> CONFIRM[Confirm booking]\n  DECIDE -- no --> CANCEL[Cancel hold]\n  TRY -->|timeout| EXPIRE[Auto-release]\n```"}, {"id": 71, "title": "Partitioning fundamentals", "tldr": "Partitioning (sharding) splits data and load across nodes so each handles a subset. Choose a partitioning scheme that spreads load evenly and keeps related data and common queries within one partition.", "real": "Notion split its PostgreSQL database in 2021 into 480 logical shards across 32 physical databases, partitioned by workspace ID, because almost all queries were scoped to a single workspace.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Dividing data and work across nodes |\n| Why it matters | Scale beyond one machine |\n| Key choice | Partition key |\n| Trade-off | Scale vs cross-partition queries and transactions |\n| Failure mode | Hot partitions from skewed keys |\n| Production habit | Many logical partitions mapped to fewer physical nodes |\n\n### Strategies\n\n| Strategy | Pros | Cons |\n|---|---|---|\n| Range | Range scans, ordered | Hot spots on sequential keys |\n| Hash | Even spread | No range queries |\n| Directory | Flexible placement | Lookup dependency |\n| Geographic | Locality, residency | Uneven sizes |"}, {"id": 72, "title": "Consistent hashing", "tldr": "Consistent hashing maps both keys and nodes onto a ring so that adding or removing a node moves only a small fraction of keys, instead of remapping almost everything as modulo hashing does.", "real": "Karger and colleagues introduced consistent hashing in 1997 for distributed web caching, work that led to Akamai, and Dynamo and Cassandra used it to distribute data across nodes.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Ring-based key-to-node mapping |\n| Why it matters | Minimal data movement on membership changes |\n| Trade-off | Uneven load without virtual nodes |\n| Failure mode | Using hash(key) mod N and remapping most keys when N changes |\n| Production habit | Use virtual nodes or a proven library |\n\n### Keys moved when adding one node (illustrative)\n\n```chart\n{\"title\": \"Share of keys remapped when growing from 10 to 11 nodes\", \"unit\": \"%\", \"data\": [[\"hash mod N\", 91], [\"Consistent hashing (ideal)\", 9]]}\n```\n\n(With modulo hashing about N/(N+1) of keys move; with consistent hashing about 1/(N+1).)"}, {"id": 73, "title": "Virtual nodes", "tldr": "Assigning each physical node many positions (virtual nodes) on the hash ring smooths load distribution, speeds rebalancing and lets more powerful machines take more vnodes.", "real": "Amazon’s Dynamo paper described virtual nodes to balance load across heterogeneous machines, and Cassandra used vnodes (num_tokens, historically defaulting to 256 and later reduced) for the same purpose.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Multiple ring positions per physical node |\n| Why it matters | Even load; capacity-weighted placement |\n| Trade-off | More metadata; repair and streaming overhead with too many vnodes |\n| Failure mode | Few tokens causing uneven ownership |\n| Production habit | Choose token counts based on cluster size and tooling guidance |\n\n### Effect\n\n| Tokens per node | Load balance | Metadata |\n|---|---|---|\n| 1 | Poor | Minimal |\n| 16 | Good | Moderate |\n| 256 | Very even | High |"}, {"id": 74, "title": "Rendezvous and jump hashing", "tldr": "Rendezvous (highest random weight) hashing picks, for each key, the node with the highest hash(key, node) score; jump consistent hash maps keys to numbered buckets with minimal memory. Both offer minimal disruption with different trade-offs.", "real": "Thaler and Ravishankar described rendezvous hashing in 1996, and Google’s Lamping and Veach published jump consistent hash in 2014 as a fast, memory-free algorithm for sharding to numbered buckets.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Alternative minimal-disruption hashing schemes |\n| Why it matters | Simpler or faster than ring-based hashing in some cases |\n| Rendezvous | O(N) per lookup; easy weighted variants |\n| Jump hash | O(log N), no memory; only buckets numbered 0..N−1 |\n| Trade-off | Lookup cost vs flexibility of removing arbitrary nodes |\n| Production habit | Use jump hash for numbered shards, rendezvous for arbitrary node sets |\n\n### Rendezvous hashing\n\n```python\nimport hashlib\n\ndef score(key: str, node: str) -> int:\n    return int.from_bytes(hashlib.sha256(f\"{key}:{node}\".encode()).digest()[:8], \"big\")\n\ndef pick_node(key: str, nodes: list[str]) -> str:\n    return max(nodes, key=lambda n: score(key, n))\n```"}, {"id": 75, "title": "Rebalancing", "tldr": "As data and nodes change, partitions must move. Prefer many fixed logical partitions moved between nodes, throttle data transfer, keep serving during moves and automate carefully with human oversight for large changes.", "real": "Elasticsearch and Kafka use fixed numbers of shards or partitions assigned to nodes, moving whole shards during rebalancing, and both provide throttling settings to limit the impact of data movement on live traffic.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Redistributing partitions across nodes |\n| Why it matters | Keeps load balanced as clusters change |\n| Approaches | Fixed partitions moved, dynamic splitting, hash ring changes |\n| Trade-off | Balance vs disruption |\n| Failure mode | Automatic rebalancing during an incident amplifying load |\n| Production habit | Throttle moves; pause rebalancing during incidents |\n\n### Fixed logical partitions\n\n```mermaid\nflowchart LR\n  subgraph Before\n    N1[Node 1: P0-P3]\n    N2[Node 2: P4-P7]\n  end\n  subgraph After\n    M1[Node 1: P0-P2]\n    M2[Node 2: P4-P6]\n    M3[Node 3: P3, P7]\n  end\n```"}, {"id": 76, "title": "Hot spots and skew", "tldr": "Uneven keys, such as a celebrity account, a viral product or a timestamp-based key, overload single partitions. Mitigate with key salting, splitting hot keys, caching, request coalescing and isolating large tenants.", "real": "Discord described in 2023 how “hot partitions”, channels with very high message volume, stressed its Cassandra cluster, and how request coalescing in a Rust data service layer helped protect the database.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Disproportionate load on some partitions |\n| Why it matters | One hot partition limits the whole system |\n| Causes | Celebrity keys, sequential keys, skewed tenants |\n| Trade-off | Splitting keys complicates reads |\n| Failure mode | Monotonic keys sending all writes to the last range |\n| Production habit | Monitor per-partition load; detect hot keys |\n\n### Mitigations\n\n| Cause | Mitigation |\n|---|---|\n| Monotonic keys | Hash prefix, UUIDv4/v7 with care |\n| Hot read key | Cache, request coalescing, replicas |\n| Hot write key | Split into sub-keys (salting), aggregate on read |\n| Huge tenant | Dedicated partition or cell |"}, {"id": 77, "title": "Secondary indexes in partitioned systems", "tldr": "Secondary indexes can be local (each partition indexes its own data; queries scatter to all partitions) or global (index partitioned by the indexed term; reads are targeted but writes update remote index partitions, often asynchronously).", "real": "Amazon DynamoDB offers local secondary indexes, which share the base table’s partition key, and global secondary indexes, which are updated asynchronously and therefore eventually consistent.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Indexing non-key attributes across partitions |\n| Why it matters | Enables queries beyond the partition key |\n| Local index | Cheap writes, scatter-gather reads |\n| Global index | Targeted reads, distributed (often async) writes |\n| Trade-off | Read efficiency vs write cost and consistency |\n| Failure mode | Expecting a global index to reflect a just-written item |\n| Production habit | Document index consistency for each query |\n\n### Comparison\n\n| | Local index | Global index |\n|---|---|---|\n| Write cost | Local | Remote index update |\n| Read by indexed value | All partitions | One index partition |\n| Consistency | With base data | Often eventual |"}, {"id": 78, "title": "Request routing", "tldr": "Clients must reach the partition holding their data. Options: any node forwards requests, a routing tier knows the mapping, or partition-aware clients route directly. Mapping changes need a consistent source of truth.", "real": "Vitess, created at YouTube in 2010 and later a CNCF graduated project, uses VTGate routing proxies with shard metadata stored in a topology service, so applications connect as if to one MySQL database.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Directing requests to the right partition |\n| Why it matters | Correctness and latency of every request |\n| Options | Node forwarding, routing tier, smart clients |\n| Trade-off | Extra hop vs client complexity |\n| Failure mode | Stale routing tables after rebalancing |\n| Production habit | Version routing metadata; handle “wrong shard” redirects |\n\n### Routing options\n\n```mermaid\nflowchart LR\n  C1[Client] --> ANY[Any node: forwards]\n  C2[Client] --> ROUTER[Routing tier]\n  ROUTER --> P[Correct partition]\n  C3[Smart client with map] --> P\n  META[(Metadata store)] -.-> ROUTER\n  META -.-> C3\n```"}, {"id": 79, "title": "Online resharding", "tldr": "Moving data between shards without downtime requires copying existing data, streaming ongoing changes, verifying consistency, briefly pausing writes, switching routing and cleaning up. Plan it from the start with logical shards.", "real": "Vitess’s VReplication provides online resharding for MySQL, and companies such as Slack described migrating major datastores to Vitess to gain such horizontal scaling capabilities.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Changing shard layout while serving traffic |\n| Why it matters | Data growth eventually forces it |\n| Steps | Copy, stream changes, verify, cut over, clean up |\n| Trade-off | Engineering effort vs downtime |\n| Failure mode | Lost writes during cutover |\n| Production habit | Rehearse on staging with production-like volume |\n\n### Process\n\n```mermaid\nflowchart LR\n  COPY[Bulk copy] --> CDC[Stream changes]\n  CDC --> VERIFY[Checksums / row counts]\n  VERIFY --> PAUSE[Brief write pause]\n  PAUSE --> SWITCH[Switch routing]\n  SWITCH --> CLEAN[Clean up source]\n```"}, {"id": 80, "title": "Geo-partitioning and data residency", "tldr": "Partitioning data by geography keeps it close to users and satisfies data residency rules. It complicates global queries and cross-region operations, which need replication to analytics systems or explicit cross-region workflows.", "real": "Distributed SQL databases such as CockroachDB and YugabyteDB offer row-level geo-partitioning to pin rows to regions, and data protection laws such as GDPR shape where personal data may be stored and processed.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Placing data in regions by attribute (e.g. user country) |\n| Why it matters | Latency and legal compliance |\n| Trade-off | Locality vs global query complexity |\n| Failure mode | Users who move or travel; data stored in wrong region |\n| Production habit | Explicit home-region field and migration process |\n\n### Design\n\n| Concern | Approach |\n|---|---|\n| User data | Home region by residency |\n| Global lookups | Small global directory (user → region) |\n| Analytics | Aggregated/anonymized replication |\n| Cross-region actions | Async workflows |"}, {"id": 81, "title": "Distributed file systems: GFS and HDFS", "tldr": "GFS and HDFS store huge files as large replicated chunks across many machines, with a central metadata server. They are optimized for large sequential reads and appends rather than small random updates.", "real": "Google’s 2003 GFS paper described a single master with chunkservers storing 64 MB chunks replicated three times, and Hadoop’s HDFS adopted a similar design for open-source big data processing.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | File storage spread across a cluster |\n| Why it matters | Foundation of large-scale batch processing |\n| Design | Central metadata, large replicated blocks |\n| Trade-off | Simple metadata vs single-master bottleneck |\n| Failure mode | Many small files overwhelming metadata server |\n| Production habit | Combine small files; replicate across racks |\n\n### Architecture\n\n```mermaid\nflowchart LR\n  CLIENT[Client] -->|metadata| MASTER[Master / NameNode]\n  CLIENT -->|data| CS1[Chunkserver 1]\n  CLIENT -->|data| CS2[Chunkserver 2]\n  CLIENT -->|data| CS3[Chunkserver 3]\n  MASTER -.heartbeats.-> CS1\n```"}, {"id": 82, "title": "Object storage", "tldr": "Object stores keep immutable objects addressed by key in flat namespaces, with massive scale, high durability and HTTP APIs. They are the foundation of data lakes, backups and media storage.", "real": "Amazon S3 launched in March 2006, and in December 2020 S3 introduced strong read-after-write consistency for all operations at no extra cost, removing a long-standing source of application complexity.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Key-addressed immutable blobs over HTTP |\n| Why it matters | Cheap, durable, nearly unlimited storage |\n| When to use | Files, backups, data lakes, static assets |\n| When not to use | Low-latency random updates, transactions |\n| Trade-off | Scale and durability vs latency and semantics |\n| Failure mode | Listing-based workflows that scale poorly |\n| Production habit | Keep an index of objects in a database when needed |\n\n### Semantics\n\n| Operation | Typical behavior |\n|---|---|\n| PUT | Whole object written atomically |\n| GET | Read whole or byte ranges |\n| Overwrite | Replace entire object |\n| Append | Not supported (in classic S3) |\n| Consistency | Strong read-after-write (S3 since 2020) |"}, {"id": 83, "title": "Erasure coding", "tldr": "Erasure coding splits data into k data fragments and m parity fragments, so any k fragments can reconstruct the data. It offers durability similar to replication with much less storage overhead, at the cost of more CPU and network for repairs.", "real": "Facebook’s f4 warm blob storage (2014) moved older photos from triple replication to Reed-Solomon erasure coding, reducing the effective replication factor substantially while maintaining durability.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Parity-based redundancy |\n| Why it matters | Lower storage cost at scale |\n| Example | RS(10,4): 10 data + 4 parity, tolerates 4 losses, 1.4× overhead |\n| Trade-off | Storage savings vs repair cost and read latency |\n| Failure mode | Correlated failures exceeding tolerance |\n| Production habit | Place fragments across failure domains |\n\n### Storage overhead\n\n```chart\n{\"title\": \"Storage overhead for durability\", \"unit\": \"×\", \"data\": [[\"3× replication (tolerates 2 losses)\", 3.0], [\"RS(6,3) (tolerates 3)\", 1.5], [\"RS(10,4) (tolerates 4)\", 1.4]]}\n```"}, {"id": 84, "title": "Bigtable and wide-column stores", "tldr": "Bigtable-style stores are sparse, distributed, sorted maps from (row, column, timestamp) to values, split into tablets by row range and stored in SSTables. They handle massive throughput for applications designed around row keys.", "real": "Google’s 2006 Bigtable paper described its use in web indexing, Google Earth and Google Analytics; Apache HBase and Cassandra’s data model were influenced by it, and Cloud Bigtable became a public service in 2015.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Sorted, distributed key-value maps with column families |\n| Why it matters | Petabyte-scale, high-throughput storage |\n| Design | Row-range tablets, LSM storage, single-row atomicity |\n| Trade-off | Scale vs limited query flexibility and transactions |\n| Failure mode | Sequential row keys creating hot tablets |\n| Production habit | Design row keys around access patterns |\n\n### Row key design\n\n| Key design | Effect |\n|---|---|\n| timestamp#device | Hot spot on latest tablet |\n| device#timestamp | Spread across devices, range scans per device |\n| hash(device)#device#timestamp | Even spread, scans per device |"}, {"id": 85, "title": "Dynamo and DynamoDB", "tldr": "Dynamo pioneered an always-writable leaderless key-value design with consistent hashing, sloppy quorums, vector clocks and anti-entropy. DynamoDB, the managed service, evolved toward leader-based replication per partition with strong consistency options.", "real": "Amazon’s 2022 USENIX ATC paper on DynamoDB explained that the service differs significantly from the 2007 Dynamo design, using Multi-Paxos per partition and adaptive capacity to deliver predictable performance at large scale.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Highly available distributed key-value storage |\n| Why it matters | Influential design; widely used managed service |\n| Dynamo (2007) | Leaderless, eventual consistency, vector clocks |\n| DynamoDB | Managed, partitioned, Multi-Paxos per partition |\n| Trade-off | Access-pattern-driven modeling vs flexibility |\n| Failure mode | Hot partition keys throttling |\n| Production habit | Model access patterns first; even key distribution |\n\n### Dynamo techniques\n\n| Problem | Technique |\n|---|---|\n| Partitioning | Consistent hashing |\n| High availability for writes | Sloppy quorum, hinted handoff |\n| Versioning | Vector clocks |\n| Permanent failures | Merkle-tree anti-entropy |\n| Membership | Gossip |"}, {"id": 86, "title": "Cassandra and ScyllaDB", "tldr": "Cassandra combines Dynamo-style distribution with a Bigtable-style data model and LSM storage, offering high write throughput, tunable consistency and multi-datacenter replication. ScyllaDB reimplements it in C++ for performance.", "real": "Cassandra was developed at Facebook and open-sourced in 2008; Discord described in 2023 migrating trillions of messages from Cassandra to ScyllaDB to reduce latency variability and operational toil.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Leaderless wide-column database |\n| Why it matters | Write-heavy, always-on workloads |\n| Data modeling | Query-first, denormalized tables |\n| Trade-off | Scale and availability vs limited queries and transactions |\n| Failure mode | Large partitions and tombstone buildup |\n| Production habit | Bound partition sizes; run repairs |\n\n### Partition design\n\n```sql\n-- CQL: bound partitions with a time bucket\nCREATE TABLE messages (\n  channel_id bigint,\n  bucket     int,\n  message_id timeuuid,\n  body       text,\n  PRIMARY KEY ((channel_id, bucket), message_id)\n) WITH CLUSTERING ORDER BY (message_id DESC);\n```"}, {"id": 87, "title": "Log-structured storage at scale", "tldr": "Distributed stores commonly use LSM trees: writes go to a commit log and memtable, flush to immutable sorted files and compact in the background. This gives high write throughput; compaction strategy determines read and space amplification.", "real": "RocksDB, created at Facebook in 2012 from Google’s LevelDB, became the storage engine inside many distributed systems, including CockroachDB (before its Pebble engine), TiKV and Kafka Streams state stores.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Append-and-compact storage engines |\n| Why it matters | Efficient writes for distributed databases |\n| Compaction | Leveled (read-optimized), size-tiered (write-optimized) |\n| Trade-off | Write, read and space amplification |\n| Failure mode | Compaction falling behind, causing stalls |\n| Production habit | Monitor pending compaction and write stalls |\n\n### Amplification trade-offs\n\n| Strategy | Write amp | Read amp | Space amp |\n|---|---|---|---|\n| Leveled | Higher | Lower | Lower |\n| Size-tiered | Lower | Higher | Higher |"}, {"id": 88, "title": "Distributed SQL databases", "tldr": "Distributed SQL databases provide SQL and ACID transactions over data split into ranges replicated by consensus, scaling horizontally with automatic rebalancing. They trade some latency for scale and resilience.", "real": "CockroachDB (inspired by Spanner), YugabyteDB (PostgreSQL-compatible query layer), TiDB (MySQL-compatible) and Google Spanner are prominent distributed SQL systems, all using Raft or Paxos replication per data range.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Horizontally scalable SQL with distributed transactions |\n| Why it matters | Avoids manual sharding of relational data |\n| Architecture | SQL layer, transaction layer, consensus-replicated ranges |\n| Trade-off | Higher per-transaction latency vs scale and resilience |\n| Failure mode | Cross-region transactions with high latency |\n| Production habit | Locality-aware schema and placement |\n\n### Layers\n\n```mermaid\nflowchart TB\n  SQL[SQL parsing + distributed planning] --> TXN[Distributed transactions + timestamps]\n  TXN --> R1[Range A: Raft group]\n  TXN --> R2[Range B: Raft group]\n  TXN --> R3[Range C: Raft group]\n```"}, {"id": 89, "title": "Durability math", "tldr": "Durability depends on replication factor or erasure coding, failure rates, repair speed and correlation of failures. Faster repair and independent failure domains matter as much as the number of copies.", "real": "Backblaze has published quarterly hard drive failure statistics since 2013, reporting annualized failure rates for drive models, which engineers use to model storage durability.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Estimating probability of data loss |\n| Why it matters | Guides replication, repair and placement |\n| Inputs | Failure rates, repair time, redundancy, correlation |\n| Trade-off | More redundancy and faster repair cost money |\n| Failure mode | Correlated failures (same rack, batch, power) |\n| Production habit | Spread replicas across failure domains; fast re-replication |\n\n### Simplified model\n\n```text\nP(loss) ≈ P(another replica fails before repair completes) per replica group\nLower by: more replicas, faster repair, independent failure domains\nCorrelated failures (same rack, same firmware bug) break independence assumptions\n```"}, {"id": 90, "title": "Choosing a distributed storage system", "tldr": "Choose storage by data model, access patterns, consistency, latency, scale, durability, cost and operational capacity. Combine systems: relational or distributed SQL for transactions, object storage for blobs, wide-column for huge write volumes, caches for hot reads.", "real": "Large companies such as Netflix and Uber publicly describe using several storage systems, including relational databases, Cassandra, object storage, caches and search engines, each for the workload it fits.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Matching storage technology to workload |\n| Why it matters | Wrong choice is expensive to undo |\n| Trade-off | Specialization vs operational complexity |\n| Failure mode | One storage system forced to serve every workload |\n| Production habit | Decision record with workload evidence |\n\n### Selection guide\n\n| Workload | Typical choice |\n|---|---|\n| Transactions, relational data | PostgreSQL/MySQL; distributed SQL at scale |\n| Huge write throughput, simple queries | Cassandra, ScyllaDB, Bigtable, DynamoDB |\n| Files, backups, data lake | Object storage |\n| Hot reads | Redis / Memcached |\n| Search | Elasticsearch / OpenSearch |\n| Analytics | Columnar warehouse / lakehouse |"}, {"id": 91, "title": "MapReduce", "tldr": "MapReduce processes large datasets by mapping input records to key–value pairs, shuffling them by key, and reducing each group, with the framework handling distribution, scheduling and failures by re-executing tasks.", "real": "Dean and Ghemawat’s 2004 MapReduce paper described Google’s use for building its search index and other large jobs, and Hadoop MapReduce brought the model to the open-source world.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Batch processing via map, shuffle, reduce |\n| Why it matters | Made large-scale fault-tolerant processing simple |\n| Fault tolerance | Re-run failed tasks; deterministic functions |\n| Trade-off | Simplicity vs disk-heavy, slow multi-stage jobs |\n| Failure mode | Skewed keys making one reducer the bottleneck |\n| Production habit | Combiners and skew handling |\n\n### Flow\n\n```mermaid\nflowchart LR\n  IN[Input splits] --> MAP[Map tasks]\n  MAP --> SHUFFLE[Shuffle + sort by key]\n  SHUFFLE --> RED[Reduce tasks]\n  RED --> OUT[Output files]\n```"}, {"id": 92, "title": "Spark and in-memory dataflow", "tldr": "Spark represents computations as directed acyclic graphs over distributed datasets, keeping intermediate data in memory and recomputing lost partitions from lineage. It is much faster than disk-based MapReduce for iterative and multi-stage work.", "real": "Spark began at UC Berkeley’s AMPLab with a 2010 paper, and the 2012 paper on Resilient Distributed Datasets (RDDs) introduced lineage-based fault tolerance; Databricks was founded by Spark’s creators in 2013.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | General distributed dataflow engine |\n| Why it matters | Standard for large-scale batch and ML pipelines |\n| Fault tolerance | Lineage recomputation, checkpoints |\n| Trade-off | Memory pressure vs speed |\n| Failure mode | Shuffle spills and skew causing slow stages |\n| Production habit | Inspect query plans; handle skewed joins |\n\n### Execution\n\n| Concept | Meaning |\n|---|---|\n| DataFrame | Distributed table |\n| Transformation | Lazy operation (filter, join) |\n| Action | Triggers execution (count, write) |\n| Stage | Group of tasks between shuffles |\n| Task | Work on one partition |"}, {"id": 93, "title": "Stream processing fundamentals", "tldr": "Stream processing handles unbounded event streams continuously, computing aggregations, joins and alerts with low latency. Key concerns are state management, time semantics, ordering and fault tolerance.", "real": "Apache Flink, Kafka Streams and Google Cloud Dataflow (Apache Beam) are widely used stream processors, and the 2015 “Dataflow Model” paper from Google described unified batch and streaming semantics.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Continuous processing of event streams |\n| Why it matters | Real-time analytics, fraud detection, alerts |\n| Concerns | Event time, state, windows, exactly-once |\n| Trade-off | Latency vs completeness and cost |\n| Failure mode | Using processing time when event time matters |\n| Production habit | Event-time semantics with watermarks |\n\n### Pipeline\n\n```mermaid\nflowchart LR\n  SRC[Event stream] --> PARSE[Parse]\n  PARSE --> KEY[Key by user]\n  KEY --> WIN[Window: 5 min]\n  WIN --> AGG[Aggregate]\n  AGG --> SINK[Sink: DB / alerts]\n```"}, {"id": 94, "title": "Event time, windows and watermarks", "tldr": "Events arrive late and out of order. Stream processors group events into windows by event time and use watermarks, estimates of how complete the data is, to decide when to emit results, with allowed lateness for stragglers.", "real": "The Dataflow Model paper (Akidau et al., 2015) formalized windowing, watermarks and triggers, concepts implemented in Apache Beam and Apache Flink.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Handling time correctly in streams |\n| Why it matters | Accurate results despite late data |\n| Windows | Tumbling, sliding, session |\n| Trade-off | Waiting longer: more complete, more latency |\n| Failure mode | Dropping late events silently |\n| Production habit | Measure lateness distribution; route late data |\n\n### Window types\n\n| Window | Example |\n|---|---|\n| Tumbling | Fixed 1-minute buckets |\n| Sliding | 10-minute windows every minute |\n| Session | Activity separated by 30-minute gaps |"}, {"id": 95, "title": "Exactly-once stream processing", "tldr": "Exactly-once processing means each event affects results once despite failures. Stream processors achieve it with consistent distributed snapshots of state plus transactional or idempotent sinks.", "real": "Apache Flink’s checkpointing is based on the Chandy–Lamport distributed snapshot algorithm (1985) adapted as asynchronous barrier snapshotting (2015), and Kafka Streams uses Kafka transactions for exactly-once semantics.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Consistent results despite retries and failures |\n| Why it matters | Financial and counting correctness |\n| Mechanisms | Checkpoints, transactional sinks, idempotent writes |\n| Trade-off | Latency and overhead vs correctness |\n| Failure mode | Exactly-once inside the engine, duplicates in external sinks |\n| Production habit | Verify end-to-end, including sinks |\n\n### Checkpoint barriers\n\n```mermaid\nflowchart LR\n  SRC[Source] -->|events + barrier n| OP1[Operator 1]\n  OP1 -->|snapshot state at barrier| STORE[(Checkpoint store)]\n  OP1 -->|barrier n| OP2[Operator 2]\n  OP2 -->|snapshot| STORE\n  OP2 --> SINK[Transactional sink commit on checkpoint]\n```"}, {"id": 96, "title": "Lambda and Kappa architectures", "tldr": "The Lambda architecture runs separate batch and streaming paths and merges results; the Kappa architecture uses only a replayable stream, reprocessing history by replaying the log. Modern engines often make Kappa-style designs practical.", "real": "Nathan Marz proposed the Lambda architecture around 2011, and Jay Kreps argued in his 2014 essay “Questioning the Lambda Architecture” for the simpler stream-only Kappa approach using Kafka.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Architectures combining batch and real-time processing |\n| Why it matters | Avoiding duplicate logic and inconsistent results |\n| Lambda | Batch + speed layers merged |\n| Kappa | Single stream pipeline; replay for reprocessing |\n| Trade-off | Lambda complexity vs Kappa replay requirements |\n| Failure mode | Two codebases computing slightly different answers |\n| Production habit | Unified engines (Beam, Flink, Spark) for both modes |\n\n### Comparison\n\n```mermaid\nflowchart TB\n  subgraph Lambda\n    E1[Events] --> B[Batch layer]\n    E1 --> S[Speed layer]\n    B --> M[Merge]\n    S --> M\n  end\n  subgraph Kappa\n    E2[Event log] --> P[Stream processor]\n    E2 -.replay.-> P\n  end\n```"}, {"id": 97, "title": "Change data capture", "tldr": "CDC streams row-level changes from databases’ logs to other systems, keeping caches, search indexes, warehouses and services in sync without dual writes. It turns databases into event sources.", "real": "Debezium, an open-source CDC platform started at Red Hat, reads PostgreSQL logical decoding and MySQL binlogs, and LinkedIn’s Databus (2012) was an earlier large-scale CDC system.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Capturing database changes as events |\n| Why it matters | Reliable synchronization of derived data |\n| Trade-off | Operational components vs consistency of derived systems |\n| Failure mode | Replication slots retaining logs when consumers stall |\n| Production habit | Monitor consumer lag and slot retention |\n\n### CDC architecture\n\n```mermaid\nflowchart LR\n  DB[(Database log)] --> CDC[CDC connector]\n  CDC --> LOG[Event log]\n  LOG --> SEARCH[Search index]\n  LOG --> CACHE[Cache invalidation]\n  LOG --> WH[Warehouse]\n```"}, {"id": 98, "title": "Event sourcing", "tldr": "Event sourcing stores state changes as an append-only sequence of events and derives current state by replaying them. It provides full history and flexible projections, but requires careful event schema evolution and snapshotting.", "real": "Martin Fowler described event sourcing in 2005, and accounting ledgers, which record transactions rather than overwriting balances, are the classic real-world precedent for the pattern.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Events as the source of truth |\n| Why it matters | Auditability, temporal queries, rebuildable views |\n| When to use | Ledgers, workflows, audit-heavy domains |\n| When not to use | Simple CRUD without history needs |\n| Trade-off | Flexibility vs complexity and eventual consistency of views |\n| Failure mode | Breaking event schemas, making replay impossible |\n| Production habit | Versioned events; snapshots for long streams |\n\n### Flow\n\n```mermaid\nflowchart LR\n  CMD[Command] --> VALIDATE[Validate against current state]\n  VALIDATE --> APPEND[Append event]\n  APPEND --> STORE[(Event store)]\n  STORE --> PROJ[Projections / read models]\n```"}, {"id": 99, "title": "Workflow orchestration for data", "tldr": "Data pipelines are orchestrated as dependency graphs of tasks with schedules, retries, backfills and monitoring. Durable workflow engines also coordinate long-running business processes across services.", "real": "Apache Airflow, created at Airbnb in 2014, defines pipelines as Python DAGs, and Temporal, which originated from Uber’s Cadence, provides durable execution for long-running workflows across services.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Coordinating multi-step processing reliably |\n| Why it matters | Dependencies, retries and visibility |\n| Tools | Airflow, Dagster, Prefect (data); Temporal (durable workflows) |\n| Trade-off | Central orchestration vs decentralized choreography |\n| Failure mode | Non-idempotent tasks breaking on retry or backfill |\n| Production habit | Idempotent tasks partitioned by date or ID |\n\n### Idempotent daily task\n\n```python\ndef load_partition(date: str):\n    # Re-runnable: replaces the whole partition for the date\n    rows = extract(date)\n    with warehouse.transaction():\n        warehouse.execute(\"DELETE FROM sales WHERE day = %s\", (date,))\n        warehouse.insert_many(\"sales\", rows)\n```"}, {"id": 100, "title": "Reliable data pipelines", "tldr": "Reliable pipelines are idempotent, observable, tested and recoverable: they validate data, track freshness and completeness, handle late data, support backfills and alert on anomalies before consumers notice.", "real": "Data quality tools such as Great Expectations and dbt tests became widely used to catch schema changes, null spikes and volume anomalies in pipelines, reflecting the cost of silent data errors.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Operating data flows dependably |\n| Why it matters | Bad data silently corrupts decisions and models |\n| Practices | Idempotency, validation, freshness SLOs, lineage, backfills |\n| Trade-off | Checks add latency and cost |\n| Failure mode | Upstream schema change silently nulling a column |\n| Production habit | Data contracts with producers |\n\n### Pipeline checks\n\n| Check | Example |\n|---|---|\n| Freshness | Partition landed by 06:00 |\n| Volume | Row count within ±20% of 7-day average |\n| Schema | No unexpected column changes |\n| Validity | Amounts ≥ 0, valid currencies |\n| Uniqueness | No duplicate order IDs |"}, {"id": 101, "title": "Timeouts and deadlines", "tldr": "Every remote call needs a timeout; otherwise one slow dependency can exhaust threads and connections everywhere. Propagate deadlines across call chains so downstream services stop work the caller has already abandoned.", "real": "gRPC propagates deadlines between services, and Google’s SRE guidance describes deadline propagation as essential to prevent wasted work and cascading overload in deep call graphs.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Bounding how long to wait for a response |\n| Why it matters | Prevents resource exhaustion and hangs |\n| Setting | Based on downstream latency percentiles and caller budget |\n| Trade-off | Short: more false failures; long: slow recovery |\n| Failure mode | Default infinite timeouts in HTTP clients |\n| Production habit | Explicit timeouts on every client; propagate deadlines |\n\n### Deadline budget\n\n```mermaid\nflowchart LR\n  CLIENT[Client deadline 800 ms] --> A[Service A: 50 ms own work]\n  A -->|remaining 700 ms| B[Service B]\n  B -->|remaining 550 ms| C[Service C]\n```"}, {"id": 102, "title": "Retries with backoff and jitter", "tldr": "Retry transient failures, but only idempotent operations, with exponential backoff and random jitter, a cap on attempts, and retry budgets to avoid amplifying overload. Retry at one layer, not every layer.", "real": "Marc Brooker’s 2015 AWS Architecture Blog post “Exponential Backoff and Jitter” showed through simulation that adding jitter greatly reduced contention and total work compared with plain exponential backoff.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Repeating failed calls carefully |\n| Why it matters | Many failures are transient |\n| Rules | Idempotent only, backoff + jitter, max attempts, retry budget |\n| Trade-off | Higher success vs extra load |\n| Failure mode | Retry storms: 3 attempts per layer across 5 layers = 3⁵ = 243× load |\n| Production habit | Retry budgets (e.g. retries ≤ 10% of requests) |\n\n### Full jitter\n\n```python\nimport random, time\n# TransientError: your timeout / 5xx / throttling exception types\n\ndef retry(call, attempts=4, base=0.1, cap=5.0):\n    for n in range(attempts):\n        try:\n            return call()\n        except TransientError:\n            if n == attempts - 1:\n                raise\n            time.sleep(random.uniform(0, min(cap, base * 2 ** n)))\n```"}, {"id": 103, "title": "Circuit breakers", "tldr": "A circuit breaker stops calling a failing dependency after errors exceed a threshold, fails fast for a cool-down period, then probes with limited requests before closing again. It protects both the caller and the struggling dependency.", "real": "Michael Nygard popularized the circuit breaker pattern in “Release It!” (2007), and Netflix’s Hystrix library (2012) brought it into wide use in Java microservices before entering maintenance mode in 2018.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Automatic fail-fast switch for dependencies |\n| Why it matters | Prevents waiting on and overloading broken services |\n| States | Closed, open, half-open |\n| Trade-off | Fail fast vs occasionally rejecting recoverable calls |\n| Failure mode | Breakers that never open due to poor thresholds |\n| Production habit | Fallback behavior defined for open breakers |\n\n### States\n\n```mermaid\nstateDiagram-v2\n  [*] --> Closed\n  Closed --> Open: error rate above threshold\n  Open --> HalfOpen: cool-down elapsed\n  HalfOpen --> Closed: probes succeed\n  HalfOpen --> Open: probes fail\n```"}, {"id": 104, "title": "Bulkheads and isolation", "tldr": "Bulkheads isolate resources, such as thread pools, connection pools, queues or whole cells, so a failure or overload in one part can’t consume everything. Isolation limits blast radius.", "real": "AWS describes cell-based architecture and shuffle sharding, assigning customers to isolated cells or random subsets of resources, so that a problem caused by one customer affects only a small fraction of others.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Partitioning resources to contain failures |\n| Why it matters | One bad dependency or tenant can’t sink the whole service |\n| Levels | Thread pools, connection pools, processes, cells, regions |\n| Trade-off | Lower utilization vs containment |\n| Failure mode | Shared thread pool exhausted by one slow dependency |\n| Production habit | Separate pools per dependency; cells per customer group |\n\n### Shuffle sharding\n\n| Approach | Customers affected by one bad customer (8 workers, 2 per customer) |\n|---|---|\n| All share all workers | 100% |\n| Fixed shards of 2 | \\~25% |\n| Shuffle sharding (random pairs) | Only customers sharing the exact same pair: small fraction |"}, {"id": 105, "title": "Load shedding", "tldr": "When demand exceeds capacity, reject or degrade some requests early rather than letting all requests slow down and fail. Prioritize critical traffic and shed low-priority work first.", "real": "Google’s SRE book describes load shedding and graceful degradation, and Amazon’s Builders’ Library article “Using load shedding to avoid overload” explains rejecting excess requests quickly so the service keeps serving the rest.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Deliberately rejecting excess load |\n| Why it matters | Preserves goodput under overload |\n| Techniques | Concurrency limits, queue-time checks, priority shedding |\n| Trade-off | Some users rejected vs everyone failing |\n| Failure mode | Accepting all work until latency explodes |\n| Production habit | Reject when queue wait exceeds the request’s deadline |\n\n### Goodput under overload (illustrative)\n\n```chart\n{\"title\": \"Successful requests/s as offered load rises (illustrative)\", \"unit\": \"req/s\", \"data\": [[\"Without shedding at 150% load\", 400], [\"With shedding at 150% load\", 980], [\"Capacity\", 1000]]}\n```"}, {"id": 106, "title": "Backpressure", "tldr": "Backpressure signals upstream producers to slow down when consumers can’t keep up, using bounded queues, flow control or explicit signals, instead of letting queues grow without limit until memory or latency fails.", "real": "Reactive Streams (2015) standardized backpressure for asynchronous stream processing on the JVM, and TCP flow control is a classic network-level backpressure mechanism.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Flow control from consumers to producers |\n| Why it matters | Unbounded queues hide overload until collapse |\n| Mechanisms | Bounded queues, credit-based flow, rate limits, 429 responses |\n| Trade-off | Producers must handle slowdowns |\n| Failure mode | Unbounded in-memory queues causing OOM crashes |\n| Production habit | Every queue has a bound and an overflow policy |\n\n### Overflow policies\n\n| Policy | Use |\n|---|---|\n| Block producer | Internal pipelines |\n| Reject with error | APIs (429) |\n| Drop oldest | Telemetry, metrics |\n| Spill to disk | Durable buffering |"}, {"id": 107, "title": "Graceful degradation", "tldr": "When dependencies fail, serve reduced functionality instead of failing entirely: cached or default content, disabled non-essential features, read-only mode or simplified responses. Decide degradation modes in advance.", "real": "Netflix has described falling back to non-personalized or cached recommendations when personalization services are unavailable, keeping streaming available even when supporting systems fail.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Planned reduced-functionality modes |\n| Why it matters | Partial service beats total outage |\n| Options | Cached data, defaults, feature flags, read-only mode |\n| Trade-off | Lower quality during incidents |\n| Failure mode | Critical path depending on a non-critical service |\n| Production habit | Classify dependencies as critical or optional |\n\n### Dependency classification\n\n| Dependency | If unavailable |\n|---|---|\n| Payments | Fail checkout clearly |\n| Recommendations | Show popular items |\n| Reviews | Hide reviews section |\n| Search suggestions | Disable suggestions |"}, {"id": 108, "title": "Hedged and tied requests", "tldr": "To reduce tail latency, send a second copy of a request to another replica if the first hasn’t returned within a high percentile, using whichever responds first and cancelling the other. Limit hedging to avoid doubling load.", "real": "Dean and Barroso’s 2013 article “The Tail at Scale” described hedged requests sent after the 95th-percentile expected latency, reporting large reductions in tail latency with only a few percent extra load in a Google benchmark.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Redundant requests to beat slow replicas |\n| Why it matters | Tail latency dominates fan-out services |\n| When to use | Idempotent reads with replicas |\n| When not to use | Non-idempotent writes |\n| Trade-off | Extra load vs lower tail latency |\n| Failure mode | Hedging during overload, amplifying it |\n| Production habit | Hedge after p95; cap hedge rate |\n\n### Hedging\n\n```mermaid\nsequenceDiagram\n  participant C as Client\n  participant R1 as Replica 1\n  participant R2 as Replica 2\n  C->>R1: Request\n  Note over C: p95 time passes without reply\n  C->>R2: Hedge request\n  R2-->>C: Response (used)\n  C->>R1: Cancel\n```"}, {"id": 109, "title": "Health checks", "tldr": "Health checks tell load balancers and orchestrators whether an instance should receive traffic (readiness) or be restarted (liveness). Shallow checks miss real problems; deep checks can cause cascading restarts if dependencies fail.", "real": "Kubernetes distinguishes liveness, readiness and startup probes, and the Amazon Builders’ Library article “Implementing health checks” warns that deep health checks tied to shared dependencies can take down an entire fleet at once.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Signals about instance health |\n| Why it matters | Routing and restart decisions |\n| Types | Liveness, readiness, startup |\n| Trade-off | Shallow (misses issues) vs deep (cascading failures) |\n| Failure mode | Database outage makes all instances fail liveness and restart |\n| Production habit | Liveness checks local health only; readiness may check dependencies with care |\n\n### Probe design\n\n| Probe | Should check | Should not check |\n|---|---|---|\n| Liveness | Process responsive, not deadlocked | Shared databases |\n| Readiness | Can serve requests (warm, configured) | Every optional dependency |\n| Startup | Initialization complete | — |"}, {"id": 110, "title": "Idempotency keys at scale", "tldr": "Idempotency keys let clients retry safely: the server records each key’s result and returns the stored result for duplicates. Store keys with expiry, scope them per client, and make the check-and-execute atomic.", "real": "Stripe’s API documentation describes idempotency keys stored for 24 hours, during which repeated requests with the same key return the original result, including errors.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Request-level deduplication |\n| Why it matters | Safe retries for non-idempotent operations |\n| Storage | Key, request hash, response, expiry |\n| Trade-off | Storage and lookup overhead |\n| Failure mode | Same key reused with different parameters |\n| Production habit | Reject key reuse with mismatched request hash |\n\n### Table\n\n```sql\nCREATE TABLE idempotency_keys (\n  client_id     text NOT NULL,\n  key           text NOT NULL,\n  request_hash  text NOT NULL,\n  response      jsonb,\n  created_at    timestamptz NOT NULL DEFAULT now(),\n  PRIMARY KEY (client_id, key)\n);\n```"}, {"id": 111, "title": "Scaling up and scaling out", "tldr": "Scale up (bigger machines) is simple and often sufficient; scale out (more machines) is needed beyond single-machine limits or for availability. Many systems scale out stateless tiers and scale up or partition stateful tiers.", "real": "Stack Overflow has publicly described serving very large traffic for years with a small number of powerful SQL Server and web servers, showing how far careful vertical scaling can go.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Two approaches to adding capacity |\n| Why it matters | Determines architecture complexity |\n| Trade-off | Simplicity of scale-up vs limits and single points of failure |\n| Failure mode | Premature distribution adding complexity without need |\n| Production habit | Scale up first for stateful systems; scale out stateless tiers |\n\n### Comparison\n\n| | Scale up | Scale out |\n|---|---|---|\n| Complexity | Low | Higher |\n| Ceiling | Hardware limits | Very high |\n| Failure isolation | Single node | Many nodes |\n| Cost curve | Steep at high end | Linear-ish |"}, {"id": 112, "title": "Stateless services", "tldr": "Stateless services keep no client state between requests in memory, storing it in databases, caches or tokens instead. Any instance can serve any request, making scaling, deployment and failover simple.", "real": "The Twelve-Factor App methodology, published by Heroku engineers in 2011, recommended executing apps as stateless processes with state in backing services, influencing cloud-native application design.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Instances without per-client in-memory state |\n| Why it matters | Easy horizontal scaling and failover |\n| Where state goes | Databases, caches, object storage, signed tokens |\n| Trade-off | External state adds latency |\n| Failure mode | Sticky sessions hiding statefulness, breaking on failover |\n| Production habit | Kill any instance anytime without user impact |\n\n### Architecture\n\n```mermaid\nflowchart LR\n  LB[Load balancer] --> S1[Instance 1]\n  LB --> S2[Instance 2]\n  LB --> S3[Instance N]\n  S1 --> STATE[(Shared state: DB / cache)]\n  S2 --> STATE\n  S3 --> STATE\n```"}, {"id": 113, "title": "Caching in distributed systems", "tldr": "Caches reduce latency and load by serving repeated reads from memory. The hard parts are invalidation, consistency, thundering herds on expiry and cold starts. Choose patterns and TTLs per data type.", "real": "Facebook’s 2013 paper “Scaling Memcache at Facebook” described serving billions of requests per second from memcached, with techniques such as leases to prevent stale sets and thundering herds, and regional invalidation pipelines.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Fast copies of frequently read data |\n| Why it matters | Large latency and cost reductions |\n| Patterns | Cache-aside, read-through, write-through, write-behind |\n| Trade-off | Speed vs staleness and complexity |\n| Failure mode | Cache stampede when hot keys expire |\n| Production habit | Jittered TTLs, request coalescing, invalidation on writes |\n\n### Stampede protection\n\n| Technique | How |\n|---|---|\n| Request coalescing | One refill per key at a time |\n| Early refresh | Refresh before expiry probabilistically |\n| Jittered TTLs | Avoid synchronized expiry |\n| Stale-while-revalidate | Serve stale while refreshing |"}, {"id": 114, "title": "Content delivery networks and edge caching", "tldr": "CDNs cache content at edge locations near users, cutting latency and origin load and absorbing traffic spikes and attacks. Cache keys, TTLs, invalidation and origin shielding determine effectiveness.", "real": "Akamai, founded in 1998 from MIT research that included consistent hashing, pioneered commercial CDNs, and CDNs such as Cloudflare, Akamai and Fastly now serve a large share of global web traffic.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Geographically distributed caches |\n| Why it matters | Latency, scale, resilience |\n| Controls | Cache-Control headers, cache keys, purge APIs |\n| Trade-off | Freshness vs hit rate |\n| Failure mode | Caching personalized responses for all users |\n| Production habit | Vary cache keys correctly; never cache private data publicly |\n\n### Flow\n\n```mermaid\nflowchart LR\n  USER[User] --> EDGE[Edge PoP]\n  EDGE -->|miss| SHIELD[Origin shield]\n  SHIELD -->|miss| ORIGIN[Origin]\n  EDGE -->|hit| USER\n```"}, {"id": 115, "title": "Tail latency", "tldr": "In systems that fan out to many servers, the slowest response determines overall latency, so rare slow responses become common at the request level. Measure high percentiles and design to tolerate stragglers.", "real": "Dean and Barroso’s “The Tail at Scale” (2013) showed that if each server has a 1% chance of a slow response, a request fanning out to 100 servers is slow about 63% of the time.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Latency of the slowest requests (p99, p99.9) |\n| Why it matters | Fan-out multiplies tail effects |\n| Mitigations | Hedged requests, partial results, reducing fan-out, isolation |\n| Trade-off | Extra resources vs predictable latency |\n| Failure mode | Averages hiding terrible p99 |\n| Production habit | SLOs on p99/p99.9, not averages |\n\n### Fan-out effect\n\n```chart\n{\"title\": \"Chance a request hits at least one slow server (1% slow each)\", \"unit\": \"%\", \"data\": [[\"1 server\", 1], [\"10 servers\", 9.6], [\"100 servers\", 63.4], [\"1000 servers\", 100]]}\n```\n\n(1 − 0.99ⁿ; the 1000-server case is about 99.996%.)"}, {"id": 116, "title": "Queueing theory basics", "tldr": "Latency rises sharply as utilization approaches 100%, because queues grow nonlinearly. Little’s law links concurrency, throughput and latency. Keep utilization below the knee and size concurrency limits accordingly.", "real": "Little’s law (John Little, 1961) states that average items in a system equal arrival rate times average time in system, and it is widely used to size thread pools, connection pools and queues.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Math of waiting and capacity |\n| Why it matters | Explains overload behavior |\n| Little’s law | L = λ × W |\n| Trade-off | High utilization vs latency |\n| Failure mode | Running at 95% utilization and surprised by latency spikes |\n| Production habit | Target utilization with headroom (often 50–70%) |\n\n### Wait time vs utilization (M/M/1 queue)\n\n```chart\n{\"title\": \"Relative waiting time vs utilization (M/M/1: ρ/(1−ρ))\", \"unit\": \"×\", \"data\": [[\"50%\", 1], [\"70%\", 2.3], [\"80%\", 4], [\"90%\", 9], [\"95%\", 19]]}\n```"}, {"id": 117, "title": "Capacity planning", "tldr": "Forecast demand from growth and seasonality, measure capacity per instance with load tests, add headroom for failures and spikes (N+1 or N+2), and plan lead times for hardware, quotas and data migrations.", "real": "Google’s SRE book describes intent-based capacity planning and N+2 provisioning (enough to lose one instance for maintenance and one to failure), principles adopted widely in production engineering.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Ensuring enough resources for expected and peak load |\n| Why it matters | Prevents outages during growth and spikes |\n| Inputs | Demand forecast, per-instance capacity, failure headroom |\n| Trade-off | Cost vs risk |\n| Failure mode | Capacity sized for average, not peak plus failure |\n| Production habit | Regular load tests and forecast reviews |\n\n### Sizing example\n\n```text\nPeak demand: 12,000 req/s\nMeasured capacity per instance at target latency: 800 req/s\nNeeded: 15 instances; per zone (3 zones), survive one zone loss:\n  15 / 2 zones remaining = 7.5 → 8 per zone → 24 instances total\n```"}, {"id": 118, "title": "Autoscaling", "tldr": "Autoscaling adjusts capacity to load based on metrics such as CPU, request rate, queue depth or custom signals. Effective autoscaling needs fast startup, good signals, limits and protection against oscillation and scale-down during incidents.", "real": "Kubernetes’ Horizontal Pod Autoscaler and cloud autoscaling groups are standard tools, and KEDA (2019, from Microsoft and Red Hat) added event-driven autoscaling based on queue lengths and other external metrics.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Automatic capacity adjustment |\n| Why it matters | Cost efficiency and spike handling |\n| Signals | CPU, request rate, queue depth, latency |\n| Trade-off | Responsiveness vs stability |\n| Failure mode | Scaling on CPU while the bottleneck is a database |\n| Production habit | Scale on the true bottleneck metric; set min/max |\n\n### Scaling signals\n\n| Workload | Best signal |\n|---|---|\n| Stateless web | Requests per instance or CPU |\n| Queue workers | Queue depth / age of oldest message |\n| Latency-sensitive | p95 latency (with care) |\n| Batch | Pending jobs |"}, {"id": 119, "title": "Performance and load testing", "tldr": "Load tests measure throughput and latency under expected and peak load; stress tests find breaking points; soak tests reveal leaks over time. Use production-like data and traffic patterns, and test failure scenarios under load.", "real": "Tools such as k6, Gatling, Locust and JMeter are widely used for load testing, and many companies run regular “game day” load tests before peak events such as holiday sales.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Measuring behavior under load |\n| Why it matters | Finds limits before users do |\n| Types | Load, stress, spike, soak |\n| Trade-off | Realism vs cost and risk |\n| Failure mode | Testing with tiny datasets that fit in cache |\n| Production habit | Load tests in CI for critical paths; peak rehearsals |\n\n### Test types\n\n| Test | Question |\n|---|---|\n| Load | Do we meet SLOs at expected peak? |\n| Stress | Where and how do we break? |\n| Spike | Can we absorb sudden bursts? |\n| Soak | Any leaks over hours? |"}, {"id": 120, "title": "Cost efficiency at scale", "tldr": "Distributed systems costs grow with compute, storage, network egress and operations. Improve efficiency with right-sizing, autoscaling, caching, data tiering, efficient serialization and reducing cross-zone and cross-region traffic.", "real": "In 2023 Amazon’s Prime Video team described moving a monitoring service from a serverless, distributed microservice design to a single-process application, reducing infrastructure costs by over 90% for that workload.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Delivering the same reliability for less |\n| Why it matters | Infrastructure is a major expense |\n| Levers | Right-sizing, autoscaling, caching, tiering, egress reduction |\n| Trade-off | Efficiency vs headroom and simplicity |\n| Failure mode | Fine-grained services passing large data across the network |\n| Production habit | Cost per request / per customer dashboards |\n\n### Common savings\n\n| Lever | Example |\n|---|---|\n| Reduce cross-AZ traffic | Zone-aware routing |\n| Data tiering | Old data to cheaper storage |\n| Compression | Smaller payloads and storage |\n| Consolidation | Merge chatty services |\n| Commitments | Reserved / committed-use discounts |"}, {"id": 121, "title": "Monoliths and microservices", "tldr": "Microservices split a system into independently deployable services owned by teams; monoliths deploy as one unit. Microservices help large organizations scale development but add network calls, distributed data and operational overhead.", "real": "James Lewis and Martin Fowler’s 2014 article “Microservices” defined the style, and Amazon and Netflix were early large-scale examples; later, teams such as Segment (2018) described consolidating microservices back into a monolith to reduce complexity.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Service decomposition choices |\n| Why it matters | Shapes delivery speed and reliability |\n| When microservices | Many teams, independent scaling and deployment needs |\n| When monolith | Small teams, early products, tightly coupled domains |\n| Trade-off | Team autonomy vs distributed complexity |\n| Failure mode | Distributed monolith: services that must deploy together |\n| Production habit | Split along business capabilities, not technical layers |\n\n### Comparison\n\n| | Monolith | Microservices |\n|---|---|---|\n| Deployment | Single unit | Independent |\n| Calls | In-process | Network |\n| Data | Shared database | Database per service |\n| Operations | Simpler | Complex (tracing, mesh, CI/CD) |"}, {"id": 122, "title": "Service boundaries and bounded contexts", "tldr": "Good service boundaries follow business capabilities and domain models (bounded contexts), minimizing chatty cross-service calls and shared data. Bad boundaries create coupling, distributed transactions and coordinated releases.", "real": "Eric Evans’s “Domain-Driven Design” (2003) introduced bounded contexts, and Conway’s law (1968), which states that systems mirror their organizations’ communication structures, explains why team boundaries and service boundaries should align.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Deciding what each service owns |\n| Why it matters | Boundaries determine coupling |\n| Heuristics | Business capability, data ownership, change frequency, team ownership |\n| Trade-off | Fine-grained services vs coordination overhead |\n| Failure mode | Splitting by entity (UserService, OrderService) with heavy cross-calls |\n| Production habit | Review call graphs for chatty boundaries |\n\n### Boundary checks\n\n| Smell | Meaning |\n|---|---|\n| Services always deployed together | Wrong boundary |\n| Many synchronous calls per request | Too fine-grained |\n| Shared database tables | Hidden coupling |\n| Distributed transactions everywhere | Boundary cuts a consistency unit |"}, {"id": 123, "title": "Data ownership", "tldr": "Each service should own its data and expose it through APIs or events, not shared databases. Other services keep local copies through events when they need fast reads, accepting eventual consistency.", "real": "The 2002 Amazon internal mandate recounted by Steve Yegge in 2011 required teams to expose data only through service interfaces, with no direct database access between teams, a principle behind service-oriented architecture at Amazon.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Single owner per data set |\n| Why it matters | Independent evolution and clear accountability |\n| Patterns | API access, event-carried state transfer, CDC replicas |\n| Trade-off | Autonomy vs duplicated data and staleness |\n| Failure mode | Several services writing the same tables |\n| Production habit | Ownership catalog for every table and topic |\n\n### Access patterns\n\n```mermaid\nflowchart LR\n  ORDERS[Order service: owns orders DB] -->|API| CHECKOUT[Checkout service]\n  ORDERS -->|OrderPlaced events| SHIP[Shipping service: local copy]\n  ORDERS -->|events| WH[(Warehouse)]\n  WH --> REPORTS[Reporting: no direct DB access]\n```"}, {"id": 124, "title": "API design and versioning", "tldr": "Service APIs are long-lived contracts. Design for evolution: additive changes, explicit versioning for breaking changes, deprecation periods, consumer-driven contrac

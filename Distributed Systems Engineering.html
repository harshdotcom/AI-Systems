<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#F1F2F5; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#171A21; --muted:#575D6B; --line:#D9DCE4;
  --accent:#1F5FA8; --accent-soft:#E1ECF8; --accent-ink:#FFFFFF;
  --amber:#B97A0B; --tldr-bg:#FFF5DC; --tldr-line:#D49A22;
  --indigo:#6B3F12; --real-bg:#F5EBDF; --real-line:#9A6224;
  --code-bg:#181A16; --code-ink:#E6E9E1; --inline-code:#E9ECE4;
  --cell-empty:#DCE0D6; --shadow:0 1px 0 rgba(24,26,22,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
    --accent:#8EB8EE; --accent-soft:#162A44; --accent-ink:#0A1A2E;
    --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
    --indigo:#E3BC8A; --real-bg:#2A1F13; --real-line:#B5843F;
    --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
    --cell-empty:#2E332B; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
  --accent:#8EB8EE; --accent-soft:#162A44; --accent-ink:#0A1A2E;
  --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
  --indigo:#E3BC8A; --real-bg:#2A1F13; --real-line:#B5843F;
  --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
  --cell-empty:#2E332B; --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header with the memory-bank progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:20px;padding:12px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted)}
.bank{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bank-row{display:flex;gap:4px;flex-wrap:nowrap;min-width:0}
.bank-group{flex:1;min-width:0;display:flex;gap:2px;padding:3px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.cell{flex:1;min-width:2px;max-width:10px;height:18px;border-radius:2px;background:var(--cell-empty);border:0;padding:0;cursor:pointer;transition:background .2s}
.cell.done{background:var(--accent)}
.cell.here{box-shadow:0 0 0 2px var(--amber)}
.bank-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bank-meta strong{color:var(--ink);font-weight:600}
.top-actions{display:flex;gap:8px}
.btn{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.menu-btn{display:none}

/* Shell */
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,76px));height:calc(100dvh - var(--top-h,76px) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg)}
.search{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
.part{margin-bottom:4px}
.part-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:8px;cursor:pointer}
.part-head:hover{background:var(--surface-2)}
.part-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);width:22px;flex:none}
.part-name{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.part-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.part-count.full{color:var(--accent);font-weight:600}
.part-list{list-style:none;margin:0 0 6px;padding:0 0 0 30px;display:none}
.part.open .part-list{display:block}
.ch-row{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:6px}
.ch-row.active{background:var(--accent-soft)}
.ch-row a{flex:1;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.ch-row a .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.tick{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:11px;height:11px;opacity:0}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{opacity:1;color:var(--accent-ink)}
.hidden{display:none!important}

/* Main reading area */
.main{padding:24px 32px 80px;min-width:0}
.crumb{font-size:14px;color:var(--muted);margin:0 0 12px}
.crumb a{color:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;font-size:14px;color:var(--muted);max-width:240px;text-align:left}
.tab .tab-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--cell-empty)}
.tab .dot.on{background:var(--accent)}
article{max-width:780px}
.ch-no{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--accent);font-size:15px;margin:0}
h1.ch-title{font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:6px 0 22px;font-weight:700;text-wrap:balance}
.box{border-radius:10px;padding:16px 18px;margin:0 0 26px;border-left:4px solid}
.box h2{font-size:14px;margin:0 0 6px;font-weight:600}
.box p{margin:0}
.tldr{background:var(--tldr-bg);border-color:var(--tldr-line)}
.tldr h2{color:var(--amber)}
.tldr p{font-size:17px;line-height:1.55}
.real{background:var(--real-bg);border-color:var(--real-line);margin-top:34px}
.real h2{color:var(--indigo)}
.body h3{font-size:20px;margin:30px 0 10px;letter-spacing:-.01em}
.body p{margin:0 0 14px}
.body ul,.body ol{padding-left:22px;margin:0 0 16px}
.body li{margin:4px 0}
.body li input[type=checkbox]{margin-right:6px;accent-color:var(--accent)}
.body code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.88em;background:var(--inline-code);padding:1px 5px;border-radius:4px}
.body pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13.5px;line-height:1.55;margin:0 0 18px}
.body pre code{background:none;padding:0;font-size:inherit;color:inherit}
.table-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.body table{border-collapse:collapse;width:100%;font-size:14px}
.body th,.body td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.body th{background:var(--surface-2);font-weight:600}
.body tr:last-child td{border-bottom:0}
.body strong{font-weight:600}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.complete{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:15px}
.complete .tick{border-color:currentColor;pointer-events:none}
.complete.on{background:var(--accent);color:var(--accent-ink)}
.complete.on .tick{background:var(--accent-ink);border-color:var(--accent-ink)}
.complete.on .tick svg{opacity:1;color:var(--accent)}
.nav{display:flex;gap:8px}
.nav .btn[disabled]{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}

/* Diagrams and charts */
.diagram{margin:0 0 20px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
.diagram svg{display:block;margin:0 auto;height:auto}
.diagram.loading{color:var(--muted);font-size:14px}
.chart{margin:0 0 20px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chart figcaption{font-weight:600;font-size:14px;margin:0 0 10px}
.bar-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.bar-label{color:var(--ink);line-height:1.3}
.bar-track{height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar{display:block;height:100%;background:var(--accent);border-radius:7px 0 0 7px}
.bar-val{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.chart-note{font-size:12px;color:var(--muted);margin-top:6px}

/* Contents view */
.contents h1{font-size:32px;margin:0 0 6px;letter-spacing:-.02em}
.contents .lead{color:var(--muted);margin:0 0 24px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.pcard h2{font-size:15px;margin:0 0 2px;line-height:1.3}
.pcard .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pcard ol{list-style:none;padding:0;margin:0}
.pcard li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13.5px;line-height:1.35}
.pcard li a{color:var(--ink);text-decoration:none;flex:1}
.pcard li a:hover{text-decoration:underline}
.contents-actions{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}

/* Mobile */
.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);height:auto;z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .menu-btn{display:inline-block}
  .main{padding:18px 16px 60px}
  .top-inner{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand{flex:1}
  .bank{order:3;flex-basis:100%}
  .bank-row{gap:3px}
  .bank-group{gap:1px;padding:2px}
  .cell{height:12px;max-width:none;min-width:0}
  .bank-row{flex-wrap:wrap;row-gap:3px;gap:3px}
  .bank-group{flex:0 0 calc(10% - 2.7px);gap:1px;padding:1px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const CHAPTERS = [{"id": 1, "title": "What a distributed system is", "tldr": "A distributed system is a set of independent computers that communicate over a network and coordinate to appear as one coherent system. Distribution brings scale, availability and geographic reach, at the cost of partial failures, uncertainty and coordination overhead.", "real": "Leslie Lamport wrote in 1987 that “a distributed system is one in which the failure of a computer you didn’t even know existed can render your own computer unusable”, capturing the defining challenge of partial failure.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Multiple networked machines cooperating on shared work |\n| Why it matters | Almost every modern service runs on one |\n| When to use | Scale, availability or locality needs exceed one machine |\n| When not to use | One machine (plus a backup) meets requirements |\n| Trade-off | Capacity and resilience vs complexity |\n| Failure mode | Partial failures that are hard to detect and reason about |\n| Production habit | Assume any component can fail or be slow at any time |\n\n### Single machine vs distributed\n\n| Property | Single machine | Distributed system |\n|---|---|---|\n| Failure | Mostly all-or-nothing | Partial, ambiguous |\n| Time | One clock | Many unsynchronized clocks |\n| Communication | Memory, fast | Network, slow and unreliable |\n| State | Shared memory | Replicated or partitioned |\n| Debugging | Local | Across many nodes and logs |"}, {"id": 2, "title": "Why distribute", "tldr": "Systems are distributed to scale beyond one machine, survive failures, serve users close to where they are, isolate workloads and meet organizational boundaries. Each reason implies different design choices.", "real": "Google’s early infrastructure papers, such as the Google File System (2003) and MapReduce (2004), described using large clusters of cheap commodity machines and handling their frequent failures in software, an approach that shaped modern distributed systems.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The motivations behind distribution |\n| Why it matters | The reason determines the architecture |\n| Reasons | Scalability, availability, latency, isolation, team autonomy |\n| Trade-off | Each benefit adds coordination cost |\n| Failure mode | Distributing for fashion rather than need |\n| Production habit | State the primary reason in design docs |\n\n### Reasons and techniques\n\n| Reason | Technique |\n|---|---|\n| More throughput or data | Partitioning (sharding) |\n| Survive failures | Replication, failover |\n| Low latency worldwide | Geographic distribution, CDNs |\n| Isolate workloads | Separate services or cells |\n| Independent teams | Service boundaries |"}, {"id": 3, "title": "The fallacies of distributed computing", "tldr": "Engineers new to distribution often assume the network is reliable, latency is zero, bandwidth is infinite, the network is secure, topology doesn’t change, there is one administrator, transport cost is zero and the network is homogeneous. All are false.", "real": "L Peter Deutsch and colleagues at Sun Microsystems listed seven of these fallacies around 1994, and James Gosling added the eighth (“the network is homogeneous”) around 1997; the list remains a standard design checklist.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Eight false assumptions about networks |\n| Why it matters | Most distributed bugs trace back to one of them |\n| Trade-off | Designing for reality adds code and cost |\n| Failure mode | Remote calls written like local function calls |\n| Production habit | Review designs against the list |\n\n### Fallacy → design response\n\n| Fallacy | Response |\n|---|---|\n| The network is reliable | Timeouts, retries, idempotency |\n| Latency is zero | Batching, caching, async |\n| Bandwidth is infinite | Compression, pagination |\n| The network is secure | Encryption, authentication everywhere |\n| Topology doesn’t change | Service discovery |\n| There is one administrator | Clear ownership, automation |\n| Transport cost is zero | Measure serialization and egress costs |\n| The network is homogeneous | Standard protocols, versioning |"}, {"id": 4, "title": "System models", "tldr": "A system model states timing assumptions: synchronous (known bounds on delays), asynchronous (no bounds) or partially synchronous (bounds hold eventually). Algorithms are only correct under their stated model; real systems behave mostly partially synchronously.", "real": "Dwork, Lynch and Stockmeyer’s 1988 paper on consensus in the presence of partial synchrony formalized the model that practical consensus protocols such as Paxos and Raft rely on for liveness.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Formal assumptions about timing and failures |\n| Why it matters | Defines what guarantees are possible |\n| Models | Synchronous, asynchronous, partially synchronous |\n| Trade-off | Weaker assumptions → more robust but harder algorithms |\n| Failure mode | Algorithms that assume bounded delays in a real network |\n| Production habit | Ask “what model does this protocol assume?” |\n\n### Comparison\n\n| Model | Delay bounds | Practical meaning |\n|---|---|---|\n| Synchronous | Known, always hold | Rare outside specialized hardware |\n| Asynchronous | None | Can’t tell slow from dead |\n| Partially synchronous | Hold eventually | Realistic: networks are usually OK |"}, {"id": 5, "title": "Failure models", "tldr": "Components can fail by crashing (stop), crash-recovering (stop then return), omitting messages, behaving with timing errors, or acting arbitrarily (Byzantine). Most systems tolerate crash-recovery failures; Byzantine tolerance is costly and reserved for untrusted settings.", "real": "Lamport, Shostak and Pease’s 1982 paper “The Byzantine Generals Problem” defined arbitrary failures and showed that tolerating f such failures requires at least 3f + 1 nodes.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Classification of how components fail |\n| Why it matters | Determines redundancy and protocol design |\n| Common choice | Crash-recovery, non-Byzantine |\n| Trade-off | Stronger failure tolerance costs nodes and messages |\n| Failure mode | Assuming crash-stop when disks can lose recent writes |\n| Production habit | State the failure model in design docs |\n\n### Failure types\n\n| Type | Behavior | Nodes needed to tolerate f |\n|---|---|---|\n| Crash-stop | Stops forever | 2f + 1 (majority consensus) |\n| Crash-recovery | Stops, may return with stable state | 2f + 1 |\n| Omission | Drops messages | Retries, acknowledgments |\n| Byzantine | Arbitrary or malicious | 3f + 1 |"}, {"id": 6, "title": "Networks and latency", "tldr": "Networks add latency, variability, packet loss, reordering and partitions. Latency within a datacenter is around half a millisecond per round trip; across continents it is often 100 milliseconds or more. Design around the number and placement of round trips.", "real": "Jeff Dean’s widely cited latency numbers listed a datacenter round trip at about 0.5 ms and a California–Netherlands–California packet round trip at about 150 ms; the speed of light makes cross-continent latency a hard physical floor.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The communication medium and its costs |\n| Why it matters | Round trips dominate distributed latency |\n| Properties | Latency, bandwidth, loss, reordering, partitions |\n| Trade-off | Fewer round trips vs simpler protocols |\n| Failure mode | Chatty protocols across regions |\n| Production habit | Count round trips per request in designs |\n\n### Approximate round-trip latency (log scale)\n\n```chart\n{\"title\": \"Approximate round-trip latency (microseconds, log scale)\", \"unit\": \"µs\", \"log\": true, \"data\": [[\"Same datacenter\", 500], [\"Same region, different zone\", 1500], [\"US East ↔ US West\", 65000], [\"India ↔ US East\", 200000], [\"Across continents and back (Dean)\", 150000]]}\n```\n\nValues are typical orders of magnitude; measure your own paths."}, {"id": 7, "title": "Scalability", "tldr": "Scalability is the ability to handle more load by adding resources. Describe load with concrete parameters (requests per second, data size, fan-out), measure performance with percentiles, and identify which resource limits growth.", "real": "Martin Kleppmann’s “Designing Data-Intensive Applications” (2017) used Twitter’s home timeline design, which shifted from computing timelines on read to fan-out on write, as a classic example of describing load parameters precisely.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Handling growth in load gracefully |\n| Why it matters | Load grows; architecture must keep up |\n| Dimensions | Throughput, data volume, users, geography |\n| Trade-off | Scaling one dimension may hurt another |\n| Failure mode | Measuring averages and missing tail latency |\n| Production habit | Load parameters and percentile SLOs defined upfront |\n\n### Scaling approaches\n\n| Approach | Example |\n|---|---|\n| Vertical (scale up) | Bigger machine |\n| Horizontal (scale out) | More machines |\n| Partitioning | Split data by key |\n| Caching | Serve repeated reads cheaply |\n| Async processing | Smooth bursts with queues |"}, {"id": 8, "title": "Reliability, availability and durability", "tldr": "Reliability means working correctly despite faults; availability is the fraction of time a service responds successfully; durability is the probability that stored data survives. Each is designed and measured differently.", "real": "Amazon S3 is designed for 99.999999999% (eleven nines) annual durability of objects, while its availability targets are far lower, illustrating that durability and availability are separate properties.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Three distinct quality properties |\n| Why it matters | Confusing them leads to wrong investments |\n| Measures | Correctness, uptime percentage, data loss probability |\n| Trade-off | Higher nines cost much more |\n| Failure mode | Highly available service that silently loses data |\n| Production habit | Separate SLOs for availability and durability |\n\n### Downtime per year by availability\n\n```chart\n{\"title\": \"Maximum downtime per year\", \"unit\": \"minutes\", \"log\": true, \"data\": [[\"99%\", 5256], [\"99.9%\", 525.6], [\"99.99%\", 52.56], [\"99.999%\", 5.26]]}\n```"}, {"id": 9, "title": "Faults, errors and failures", "tldr": "A fault is a component deviating from spec; a failure is the system as a whole not providing its service. Fault-tolerant design prevents faults from becoming failures through redundancy, isolation, detection and recovery.", "real": "Netflix created Chaos Monkey in 2011 to randomly terminate production instances, forcing engineers to build services that tolerated instance faults without user-visible failures.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Vocabulary for things going wrong |\n| Why it matters | Faults are inevitable; failures are not |\n| Techniques | Redundancy, isolation, detection, recovery, degradation |\n| Trade-off | Redundancy costs resources |\n| Failure mode | One fault cascading into a system-wide failure |\n| Production habit | Inject faults regularly to verify tolerance |\n\n### Fault to failure chain\n\n```mermaid\nflowchart LR\n  FAULT[Fault: disk dies] --> ERROR[Error: read fails]\n  ERROR --> DETECT{Detected + handled?}\n  DETECT -- yes --> OK[Served from replica]\n  DETECT -- no --> FAIL[Failure: user sees error]\n```"}, {"id": 10, "title": "The distributed systems engineering mindset", "tldr": "Distributed systems engineers think in failure modes, trade-offs and probabilities: what happens when this call times out, this node pauses, this message arrives twice, this clock jumps? They prefer simple designs, explicit guarantees and verification.", "real": "The Google SRE book (2016) emphasized that simplicity is a prerequisite for reliability, and Amazon has described using formal methods such as TLA+ to find subtle bugs in distributed designs before implementation.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Habits of thought for building reliable distributed systems |\n| Why it matters | Intuition from single machines misleads |\n| Key questions | What if it fails, is slow, is duplicated, is reordered? |\n| Trade-off | Rigor vs speed of delivery |\n| Failure mode | Designing only for the happy path |\n| Production habit | Failure mode analysis in every design review |\n\n### Design review questions\n\n| Question | Why |\n|---|---|\n| What happens on timeout? | Ambiguous outcomes |\n| Is this operation idempotent? | Retries |\n| What consistency do clients get? | Correctness |\n| What is the blast radius of a failure? | Isolation |\n| How do we know it’s working? | Observability |\n| How do we test failures? | Verification |"}, {"id": 11, "title": "Remote procedure calls", "tldr": "RPC makes calling a remote service look like calling a local function. It is convenient but hides fundamental differences: remote calls can fail partially, time out with unknown outcomes, and take orders of magnitude longer.", "real": "Birrell and Nelson’s 1984 paper “Implementing Remote Procedure Calls” established the RPC model, and the 1994 essay “A Note on Distributed Computing” by Waldo and colleagues warned against hiding the differences between local and remote calls.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Calling functions on another machine |\n| Why it matters | Dominant style for service-to-service calls |\n| When to use | Request–response interactions needing an answer now |\n| When not to use | Long-running work, fire-and-forget events |\n| Trade-off | Simplicity vs hidden network realities |\n| Failure mode | Timeout: did the operation happen or not? |\n| Production habit | Deadlines, retries only for idempotent calls |\n\n### Possible outcomes of an RPC\n\n| Outcome | Client knows |\n|---|---|\n| Success response | Done |\n| Error response | Failed (usually) |\n| Timeout | Unknown: may or may not have executed |\n| Connection refused | Not executed (usually) |"}, {"id": 12, "title": "HTTP and REST APIs", "tldr": "HTTP-based REST APIs model resources with standard methods, status codes and caching semantics. They are universal and debuggable; design them with idempotent methods, pagination, versioning and clear errors.", "real": "Roy Fielding described REST in his 2000 doctoral dissertation, and HTTP/2 (2015) and HTTP/3 over QUIC (standardized in 2022) improved multiplexing and latency for API traffic.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Resource-oriented APIs over HTTP |\n| Why it matters | Default for public and many internal APIs |\n| Idempotent methods | GET, PUT, DELETE (and HEAD, OPTIONS) |\n| Trade-off | Human-friendly vs less efficient than binary RPC |\n| Failure mode | Non-idempotent POST retried, creating duplicates |\n| Production habit | Idempotency keys for POST |\n\n### Method semantics\n\n| Method | Safe | Idempotent |\n|---|---|---|\n| GET | Yes | Yes |\n| PUT | No | Yes |\n| DELETE | No | Yes |\n| POST | No | No (unless keyed) |\n| PATCH | No | Not necessarily |"}, {"id": 13, "title": "gRPC and binary protocols", "tldr": "gRPC uses HTTP/2 and Protocol Buffers for efficient, strongly typed service-to-service calls with streaming, deadlines and code generation. It suits internal microservice communication.", "real": "Google open-sourced gRPC in 2015, based on its internal RPC system Stubby, which had handled very large volumes of internal calls across Google’s datacenters.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Binary, schema-defined RPC framework |\n| Why it matters | Efficiency, types, streaming, deadline propagation |\n| When to use | Internal service calls, polyglot environments |\n| When not to use | Browser clients without a gateway, simple public APIs |\n| Trade-off | Performance and types vs tooling and debuggability |\n| Failure mode | Missing deadlines causing hung calls |\n| Production habit | Always set and propagate deadlines |\n\n### Service definition\n\n```protobuf\nsyntax = \"proto3\";\n\nservice Orders {\n  rpc GetOrder (GetOrderRequest) returns (Order);\n  rpc WatchOrders (WatchRequest) returns (stream OrderEvent);\n}\n\nmessage GetOrderRequest { string order_id = 1; }\nmessage Order { string order_id = 1; string status = 2; int64 total_cents = 3; }\n```"}, {"id": 14, "title": "Serialization and schema evolution", "tldr": "Services and stored data outlive any single version of code. Use formats with explicit schemas (Protocol Buffers, Avro, JSON Schema) and evolve them compatibly: add optional fields, never reuse field numbers, and support old and new readers.", "real": "Confluent’s Schema Registry, widely used with Kafka, enforces compatibility rules (backward, forward, full) on Avro, Protobuf and JSON Schema so producers can’t publish breaking changes.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Encoding data and evolving its structure safely |\n| Why it matters | Rolling deploys mean old and new versions coexist |\n| Formats | JSON, Protobuf, Avro, Thrift |\n| Trade-off | Schema rigor vs flexibility |\n| Failure mode | Renaming a field breaks consumers |\n| Production habit | Compatibility checks in CI |\n\n### Compatibility rules\n\n| Change | Safe? |\n|---|---|\n| Add optional field | Yes |\n| Remove optional field (reserve its number) | Yes, carefully |\n| Rename field (Protobuf, same number) | Wire-safe, code-breaking |\n| Change field type | Usually no |\n| Reuse a field number | Never |"}, {"id": 15, "title": "Asynchronous messaging and queues", "tldr": "Message queues decouple producers from consumers in time: producers enqueue work, consumers process at their own pace. Queues absorb bursts and isolate failures, but introduce delivery semantics, ordering and duplicate handling.", "real": "Amazon SQS, introduced in 2004 as one of AWS’s first public services, and RabbitMQ (2007) made message queues a standard building block, with at-least-once delivery requiring idempotent consumers.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Durable buffers between services |\n| Why it matters | Decoupling, smoothing load, retries |\n| When to use | Background jobs, spikes, unreliable downstreams |\n| When not to use | When the caller needs an immediate answer |\n| Trade-off | Resilience vs latency and complexity |\n| Failure mode | Poison messages blocking queues |\n| Production habit | Dead-letter queues and idempotent consumers |\n\n### Delivery semantics\n\n| Semantics | Meaning | Consumer requirement |\n|---|---|---|\n| At-most-once | May lose messages | Tolerate loss |\n| At-least-once | May duplicate | Idempotent processing |\n| Exactly-once (effectively) | No loss, no duplicate effects | Transactions + idempotency |"}, {"id": 16, "title": "Publish–subscribe", "tldr": "In pub/sub, producers publish events to topics and any number of subscribers receive them. It enables event-driven architectures where services react to changes without the producer knowing consumers.", "real": "Google Cloud Pub/Sub, Amazon SNS and Apache Kafka topics are widely used pub/sub systems, letting new consumers subscribe to existing event streams without changing producers.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Broadcast messaging to interested subscribers |\n| Why it matters | Loose coupling between services |\n| When to use | Notifications of state changes to many consumers |\n| Trade-off | Decoupling vs hidden dependencies and harder tracing |\n| Failure mode | Nobody knows who consumes an event before changing it |\n| Production habit | Event catalog with owners and consumers |\n\n### Pattern\n\n```mermaid\nflowchart LR\n  ORDER[Order service] -->|OrderPlaced| TOPIC[(orders topic)]\n  TOPIC --> EMAIL[Email service]\n  TOPIC --> INV[Inventory service]\n  TOPIC --> ANALYTICS[Analytics]\n```"}, {"id": 17, "title": "Log-based streaming", "tldr": "Log-based brokers such as Apache Kafka store messages in an ordered, durable, replayable log partitioned for scale. Consumers track offsets, can replay history and process in parallel per partition.", "real": "Kafka was created at LinkedIn and open-sourced in 2011; LinkedIn later reported its Kafka deployments handling trillions of messages per day, and Jay Kreps’s 2013 essay “The Log” popularized log-centric architecture.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Durable, partitioned, replayable event logs |\n| Why it matters | High throughput, replay, multiple independent consumers |\n| Ordering | Guaranteed within a partition, not across |\n| Trade-off | Operational complexity vs flexibility |\n| Failure mode | Choosing a partition key that breaks required ordering |\n| Production habit | Partition by the entity whose order matters |\n\n### Concepts\n\n| Concept | Meaning |\n|---|---|\n| Topic | Named stream |\n| Partition | Ordered shard of a topic |\n| Offset | Position in partition |\n| Consumer group | Parallel consumers sharing partitions |\n| Retention / compaction | How long or which records are kept |"}, {"id": 18, "title": "Service discovery", "tldr": "In dynamic environments, service instances come and go. Service discovery maps logical names to current healthy addresses, through DNS, registries (Consul, etcd), platform mechanisms (Kubernetes Services) or service meshes.", "real": "Netflix open-sourced its Eureka service registry in 2012 for dynamic discovery of services on AWS, and Kubernetes later built service discovery into the platform through Services and DNS.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Finding where services currently run |\n| Why it matters | Instances change constantly |\n| Options | DNS, client-side registries, server-side load balancers, mesh |\n| Trade-off | Freshness vs caching and stability |\n| Failure mode | Stale DNS caches sending traffic to dead instances |\n| Production habit | Health-checked registrations; short TTLs where needed |\n\n### Approaches\n\n| Approach | Example |\n|---|---|\n| DNS-based | Kubernetes Services, Route 53 |\n| Registry + client | Eureka, Consul |\n| Load balancer | AWS ALB, Envoy |\n| Service mesh | Istio, Linkerd |"}, {"id": 19, "title": "Load balancing", "tldr": "Load balancers distribute requests across instances using algorithms such as round robin, least connections, consistent hashing or power-of-two-choices, with health checks removing bad instances. Good load balancing improves both utilization and tail latency.", "real": "Michael Mitzenmacher’s analysis of “the power of two random choices” (2001) showed that picking the less loaded of two random servers dramatically reduces maximum load compared with random assignment, and the technique is used in proxies such as Envoy and NGINX.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Spreading work across instances |\n| Why it matters | Utilization, latency, failure isolation |\n| Algorithms | Round robin, least requests, P2C, consistent hashing |\n| Trade-off | Simplicity vs load awareness |\n| Failure mode | Health checks too shallow, routing to broken instances |\n| Production habit | Outlier detection plus health checks |\n\n### Algorithm guide\n\n| Algorithm | Best for |\n|---|---|\n| Round robin | Uniform requests |\n| Least requests | Variable request cost |\n| Power of two choices | Large fleets, low overhead |\n| Consistent hashing | Cache affinity, sticky partitions |"}, {"id": 20, "title": "API gateways and service meshes", "tldr": "API gateways handle north–south traffic (clients to services): auth, rate limiting, routing. Service meshes handle east–west traffic (service to service) with sidecar or node proxies providing mTLS, retries, timeouts and telemetry without changing application code.", "real": "Lyft open-sourced the Envoy proxy in 2016, and Istio (2017, from Google, IBM and Lyft) built a service mesh control plane around it, popularizing mesh-based traffic management and mTLS.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Infrastructure layers for traffic management |\n| Why it matters | Consistent security and reliability policies |\n| Gateway features | Auth, rate limits, routing, request shaping |\n| Mesh features | mTLS, retries, timeouts, traffic splitting, telemetry |\n| Trade-off | Uniform policy vs added latency and complexity |\n| Failure mode | Mesh retries multiplying application retries |\n| Production habit | Retry policy defined in exactly one layer |\n\n### Traffic layers\n\n```mermaid\nflowchart LR\n  CLIENT[Clients] --> GW[API gateway]\n  GW --> A[Service A + proxy]\n  A --> B[Service B + proxy]\n  A --> C[Service C + proxy]\n  CP[Mesh control plane] -.config.-> A\n  CP -.config.-> B\n  CP -.config.-> C\n```"}, {"id": 21, "title": "Physical clocks and NTP", "tldr": "Each machine’s clock drifts. NTP synchronizes clocks to within milliseconds on good networks, but clocks can still jump, drift and disagree. Never assume timestamps from different machines are precisely comparable.", "real": "Google’s Spanner paper (2012) reported that its TrueTime uncertainty was typically under about 7 ms using GPS and atomic clocks, whereas ordinary NTP-synchronized servers can disagree by much more under bad network conditions.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Wall-clock time on each machine |\n| Why it matters | Timestamps drive ordering, expiry, logs |\n| Problems | Drift, skew, jumps, leap seconds |\n| Trade-off | Convenience of timestamps vs correctness |\n| Failure mode | Last-write-wins choosing the wrong write due to skew |\n| Production habit | Use monotonic clocks for durations; avoid wall clocks for ordering |\n\n### Clock types\n\n| Clock | Use | Don’t use for |\n|---|---|---|\n| Wall clock (time-of-day) | Logs, display, expiry dates | Measuring durations, ordering across machines |\n| Monotonic clock | Timeouts, latency measurement | Comparing across machines |"}, {"id": 22, "title": "When clocks go wrong", "tldr": "Clock problems cause real outages: leap seconds, NTP misconfiguration, VM pauses and manual changes can make time jump or run backward. Systems must tolerate non-monotonic wall clocks.", "real": "The June 2012 leap second triggered a Linux kernel issue that caused high CPU usage and outages at sites including Reddit and Mozilla, and on January 1, 2017 a leap second caused negative time calculations that disrupted part of Cloudflare’s DNS service.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Failure modes involving time |\n| Why it matters | Time bugs are rare, global and hard to reproduce |\n| Causes | Leap seconds, drift, VM pauses, NTP errors |\n| Trade-off | Clock smearing vs exact UTC |\n| Failure mode | Code assuming end time ≥ start time across wall clocks |\n| Production habit | Guard against negative durations; smear leap seconds |\n\n### Mitigations\n\n| Problem | Mitigation |\n|---|---|\n| Leap seconds | Leap smearing (as used by Google and AWS time services) |\n| Backward jumps | Monotonic clocks for durations |\n| Skew between nodes | Logical or hybrid clocks for ordering |\n| Long GC / VM pauses | Leases with fencing tokens |"}, {"id": 23, "title": "Lamport clocks", "tldr": "Lamport clocks assign counters to events so that if one event causally precedes another, it has a smaller counter. They give a consistent ordering without synchronized physical clocks, but can’t tell whether two events were concurrent.", "real": "Leslie Lamport’s 1978 paper “Time, Clocks, and the Ordering of Events in a Distributed System” introduced logical clocks and the happened-before relation, and is one of the most cited papers in computer science.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Logical counters that respect causality |\n| Why it matters | Ordering without trusting physical time |\n| Rules | Increment on each event; on receive, take max(local, received) + 1 |\n| Trade-off | Simple, but can’t detect concurrency |\n| Failure mode | Interpreting Lamport order as real-time order |\n| Production habit | Use for total ordering tie-breaks (with node ID) |\n\n### Algorithm\n\n```python\nclass LamportClock:\n    def __init__(self):\n        self.t = 0\n\n    def tick(self) -> int:            # local event or send\n        self.t += 1\n        return self.t\n\n    def receive(self, remote_t: int) -> int:\n        self.t = max(self.t, remote_t) + 1\n        return self.t\n```"}, {"id": 24, "title": "Vector clocks", "tldr": "Vector clocks keep a counter per node, letting systems determine whether two events are causally ordered or concurrent. They power conflict detection in replicated systems, at the cost of metadata that grows with the number of nodes.", "real": "Vector clocks were introduced independently by Fidge and Mattern in 1988, and Amazon’s Dynamo paper (2007) used them to detect conflicting versions of shopping cart data for reconciliation.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Per-node counters capturing causality |\n| Why it matters | Detects concurrent updates |\n| Comparison | A ≤ B if every entry of A ≤ B; otherwise concurrent if neither ≤ |\n| Trade-off | Metadata size grows with participants |\n| Failure mode | Unbounded vector growth with many clients |\n| Production habit | Use version vectors per replica, not per client |\n\n### Comparison example\n\n| Version | Vector | Relation |\n|---|---|---|\n| V1 | {A:1, B:0} | — |\n| V2 | {A:2, B:0} | V1 → V2 (descendant) |\n| V3 | {A:1, B:1} | Concurrent with V2 → conflict |"}, {"id": 25, "title": "Hybrid logical clocks", "tldr": "Hybrid logical clocks combine physical time with a logical counter, producing timestamps close to wall-clock time that still respect causality. They suit databases needing time-like timestamps without special hardware.", "real": "Kulkarni and colleagues introduced hybrid logical clocks in 2014, and CockroachDB and YugabyteDB use HLCs to order transactions across nodes without GPS or atomic clocks.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Physical time + logical counter |\n| Why it matters | Causal order with human-meaningful timestamps |\n| When to use | Distributed databases, event ordering |\n| Trade-off | Still depends on bounded clock skew for some guarantees |\n| Failure mode | Large skew causing timestamps far ahead of real time |\n| Production habit | Monitor clock offsets; reject nodes beyond a max offset |\n\n### HLC timestamp\n\n```text\n(physical_ms = 1763372400123, logical = 2)\nCompare physical first, then logical.\n```"}, {"id": 26, "title": "TrueTime and bounded uncertainty", "tldr": "TrueTime exposes current time as an interval [earliest, latest] with bounded uncertainty. Spanner waits out that uncertainty before committing, guaranteeing that commit timestamps reflect real-time order across the globe.", "real": "Google’s Spanner (OSDI 2012) used GPS receivers and atomic clocks in datacenters to keep TrueTime uncertainty small, enabling external consistency, and AWS later offered microsecond-accurate time via its Time Sync Service hardware.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Clock API with explicit error bounds |\n| Why it matters | Enables globally ordered transactions |\n| Mechanism | Commit wait until uncertainty passes |\n| Trade-off | Requires accurate time infrastructure; adds wait latency |\n| Failure mode | Uncertainty underestimated → consistency violations |\n| Production habit | Treat time bounds as a monitored SLO |\n\n### Commit wait\n\n```mermaid\nflowchart LR\n  T[Choose timestamp s = now.latest] --> W[Wait until now.earliest > s]\n  W --> C[Commit visible]\n```"}, {"id": 27, "title": "Causality and happens-before", "tldr": "Event A happens before B if A precedes B on the same node, or A is a send and B the matching receive, or by transitivity. Preserving causality, so effects never appear before causes, is often the most important ordering guarantee.", "real": "A classic causality bug in social systems is a reply appearing before the original post for some users because replicas applied updates out of order, a problem causal consistency is designed to prevent.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The partial order of events by cause |\n| Why it matters | Users notice effects before causes |\n| Mechanisms | Lamport/vector clocks, dependency tracking, session guarantees |\n| Trade-off | Tracking causality costs metadata |\n| Failure mode | Reply visible before question |\n| Production habit | Identify which operations have causal dependencies |\n\n### Causal violation\n\n```mermaid\nsequenceDiagram\n  participant A as Alice\n  participant R1 as Replica 1\n  participant R2 as Replica 2\n  participant C as Carol\n  A->>R1: Post \"Lost my keys\"\n  A->>R1: Reply \"Found them\"\n  R1->>R2: Replicate reply (arrives first)\n  C->>R2: Read: sees reply without post\n```"}, {"id": 28, "title": "Total order broadcast", "tldr": "Total order broadcast delivers the same messages to all nodes in the same order. It is equivalent to consensus and underlies replicated state machines, distributed logs and many coordination services.", "real": "ZooKeeper’s Zab protocol provides total order broadcast for its replicated state, and Kafka partitions provide a total order per partition, which applications use to build replicated state and event-sourced systems.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Same messages, same order, everywhere |\n| Why it matters | Deterministic replicas stay identical |\n| Implementation | Consensus (Raft, Paxos, Zab), single leader log |\n| Trade-off | Throughput limited by ordering point |\n| Failure mode | Assuming global order across Kafka partitions |\n| Production habit | Scope ordering to what truly needs it |\n\n### Replicated state machine\n\n```mermaid\nflowchart LR\n  CMDS[Commands] --> LOG[Totally ordered log]\n  LOG --> R1[Replica 1 applies in order]\n  LOG --> R2[Replica 2 applies in order]\n  LOG --> R3[Replica 3 applies in order]\n```"}, {"id": 29, "title": "Ordering guarantees in practice", "tldr": "Real systems offer scoped ordering: per partition, per key, per session or per producer. Design so that operations needing order share a key or partition, and handle out-of-order arrival elsewhere with sequence numbers.", "real": "Kafka guarantees order only within a partition, and Amazon SQS FIFO queues guarantee order within a message group, both requiring applications to choose keys carefully to get the ordering they need.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Practical, limited ordering guarantees |\n| Why it matters | Global order is expensive; scoped order is usually enough |\n| Techniques | Partition keys, sequence numbers, version checks |\n| Trade-off | Parallelism vs ordering scope |\n| Failure mode | Events for one account split across partitions |\n| Production habit | Document ordering guarantees per stream |\n\n### Handling out-of-order events\n\n```python\ndef apply(event, state):\n    if event.seq <= state.last_seq:\n        return state                  # duplicate or old: ignore\n    if event.seq > state.last_seq + 1:\n        buffer(event)                 # gap: wait or fetch missing\n        return state\n    state = state.apply(event)\n    state.last_seq = event.seq\n    return state\n```"}, {"id": 30, "title": "Failure detection and timeouts", "tldr": "In asynchronous networks you can’t distinguish a crashed node from a slow one. Failure detectors use timeouts or heartbeats with adaptive thresholds; set timeouts from measured latency distributions and expect false positives.", "real": "The phi accrual failure detector (Hayashibara et al., 2004) outputs a suspicion level based on heartbeat arrival history rather than a fixed timeout, and is used in Apache Cassandra and Akka.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Deciding whether a node has failed |\n| Why it matters | Drives failover and retries |\n| Methods | Fixed timeouts, heartbeats, adaptive (phi accrual) |\n| Trade-off | Fast detection vs false positives |\n| Failure mode | Aggressive timeouts causing failover storms |\n| Production habit | Timeouts from p99.9 latency plus margin |\n\n### Timeout trade-off\n\n| Timeout | Effect |\n|---|---|\n| Too short | False failures, unnecessary failovers, retry storms |\n| Too long | Slow recovery, users wait |\n| Adaptive | Tracks real latency; more complex |"}, {"id": 31, "title": "Why replicate", "tldr": "Replication keeps copies of data on multiple nodes for availability (survive failures), durability (survive data loss), read scaling and lower latency for distant users. The hard part is keeping copies consistent as data changes.", "real": "Amazon’s Dynamo paper (2007) explained that its shopping cart had to remain writable even during failures, motivating replication with relaxed consistency rather than refusing writes.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Maintaining copies of data on several nodes |\n| Why it matters | Availability, durability, performance |\n| Key decisions | Topology, sync vs async, conflict handling |\n| Trade-off | Consistency vs availability and latency |\n| Failure mode | Replicas silently diverging |\n| Production habit | Monitor lag and divergence |\n\n### Goals and techniques\n\n| Goal | Technique |\n|---|---|\n| Survive node loss | Replicas in different failure domains |\n| Read scaling | Read replicas |\n| Low latency | Replicas near users |\n| Durability | Synchronous or quorum writes |"}, {"id": 32, "title": "Single-leader replication", "tldr": "One leader accepts writes and streams changes to followers, which serve reads and take over on leader failure. It’s simple and widely used, but the leader limits write throughput and failover must be handled carefully.", "real": "PostgreSQL streaming replication, MySQL replication and MongoDB replica sets all use single-leader replication, making it the most common replication model in production databases.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | One writer, many readers |\n| Why it matters | Simple consistency model for writes |\n| When to use | Most OLTP databases |\n| Trade-off | Write scaling limited to one node |\n| Failure mode | Split brain during failover |\n| Production habit | Consensus-based leader election with fencing |\n\n### Topology\n\n```mermaid\nflowchart LR\n  CLIENT[Writes] --> L[Leader]\n  L -->|replication log| F1[Follower 1]\n  L -->|replication log| F2[Follower 2]\n  READS[Reads] --> F1\n  READS --> F2\n```"}, {"id": 33, "title": "Multi-leader replication", "tldr": "Multiple leaders accept writes, typically one per region, and replicate to each other. This reduces write latency and survives regional failures, but concurrent writes to the same data conflict and must be resolved.", "real": "Collaborative editors and offline-first apps behave like multi-leader systems, with each device accepting edits; CouchDB and its replication protocol were designed for such multi-master and offline synchronization.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Several nodes accept writes and sync |\n| Why it matters | Local writes in each region; offline operation |\n| When to use | Multi-region writes, offline clients |\n| Trade-off | Low latency vs conflicts |\n| Failure mode | Silent data loss from last-write-wins |\n| Production habit | Route each record’s writes to a home region where possible |\n\n### Conflict example\n\n| Time | Region A | Region B |\n|---|---|---|\n| t1 | Set title = “Draft v2” | Set title = “Final” |\n| t2 | Replicate → conflict | Replicate → conflict |\n| Resolution | LWW, merge or user choice | Same rule everywhere |"}, {"id": 34, "title": "Leaderless replication", "tldr": "In leaderless systems, clients write to and read from several replicas directly, using quorums. Hinted handoff, read repair and anti-entropy keep replicas converging. Availability is high; consistency depends on quorum settings.", "real": "Amazon’s 2007 Dynamo paper described leaderless replication with sloppy quorums and hinted handoff, and Apache Cassandra, Riak and ScyllaDB adopted the design.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Any replica accepts reads/writes via quorums |\n| Why it matters | No single leader to fail |\n| When to use | High write availability, multi-datacenter |\n| Trade-off | Weaker consistency, conflict handling |\n| Failure mode | Sloppy quorums returning stale data |\n| Production habit | Choose consistency level per operation |\n\n### Write and read path\n\n```mermaid\nflowchart LR\n  C[Client] --> R1[Replica 1]\n  C --> R2[Replica 2]\n  C --> R3[Replica 3]\n  R1 -->|ack| C\n  R2 -->|ack| C\n  C --> DONE[Success after W acks]\n```"}, {"id": 35, "title": "Synchronous vs asynchronous replication", "tldr": "Synchronous replication waits for replicas before acknowledging writes: no data loss on failover but higher latency and reduced availability. Asynchronous replication acknowledges immediately: fast but recent writes can be lost.", "real": "GitHub’s October 2018 incident involved MySQL clusters failing over across regions with asynchronous replication, leaving writes in two locations that had to be reconciled, contributing to more than 24 hours of degraded service.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | When writes are acknowledged relative to replication |\n| Why it matters | Determines data loss on failure |\n| Options | Sync, async, semi-sync, quorum |\n| Trade-off | Durability vs latency and availability |\n| Failure mode | Async failover losing acknowledged writes |\n| Production habit | Sync within region, async across regions (common) |\n\n### Comparison\n\n| | Synchronous | Asynchronous |\n|---|---|---|\n| Data loss on leader failure | None for acked writes | Possible |\n| Write latency | Higher | Lower |\n| Availability if replica down | Writes may block | Unaffected |"}, {"id": 36, "title": "Replication lag and session guarantees", "tldr": "Asynchronous replicas lag, so readers may see stale or inconsistent data. Session guarantees such as read-your-writes, monotonic reads and consistent prefix reads restore sensible behavior for each user.", "real": "The Bayou project at Xerox PARC (Terry et al., 1994) defined session guarantees for weakly consistent replicated systems, including read-your-writes and monotonic reads, concepts still used in modern databases.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Per-session consistency on top of weak replication |\n| Why it matters | Users notice when their own changes “disappear” |\n| Guarantees | Read-your-writes, monotonic reads, writes-follow-reads, monotonic writes |\n| Trade-off | Routing complexity vs user-visible correctness |\n| Failure mode | Profile update vanishes on refresh |\n| Production habit | Track a session’s last-write position |\n\n### Implementations\n\n| Guarantee | Technique |\n|---|---|\n| Read-your-writes | Read from leader after write, or wait for replica position |\n| Monotonic reads | Pin session to one replica |\n| Consistent prefix | Partition by causal key |"}, {"id": 37, "title": "Quorums", "tldr": "With N replicas, a write needs W acknowledgments and a read queries R replicas. If W + R > N, read and write sets overlap, so a read sees at least one replica with the latest acknowledged write under normal conditions.", "real": "Apache Cassandra exposes consistency levels such as ONE, QUORUM, LOCAL_QUORUM and ALL per query, letting applications trade latency against consistency for each operation.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Overlapping read and write replica sets |\n| Why it matters | Tunable consistency in leaderless systems |\n| Rule | W + R > N for overlap; W > N/2 avoids conflicting majorities |\n| Trade-off | Higher W/R: stronger but slower and less available |\n| Failure mode | Assuming quorums give linearizability (they don’t alone) |\n| Production habit | Choose W/R per operation’s needs |\n\n### Settings for N = 3\n\n| W | R | Overlap? | Character |\n|---|---|---|---|\n| 1 | 1 | No | Fast, eventually consistent |\n| 2 | 2 | Yes | Balanced |\n| 3 | 1 | Yes | Fast reads, fragile writes |\n| 1 | 3 | Yes | Fast writes, fragile reads |"}, {"id": 38, "title": "Anti-entropy and read repair", "tldr": "Replicas drift due to missed writes. Read repair fixes stale replicas noticed during reads; anti-entropy processes compare replicas in the background, often with Merkle trees to find differing ranges efficiently.", "real": "Dynamo used Merkle trees for anti-entropy so replicas could compare large key ranges by exchanging hashes, and Cassandra’s repair process uses the same idea.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Mechanisms that make replicas converge |\n| Why it matters | Without them, divergence grows |\n| Techniques | Read repair, hinted handoff, Merkle-tree anti-entropy |\n| Trade-off | Background I/O vs consistency |\n| Failure mode | Repairs never run, old deletions resurrected |\n| Production habit | Schedule repairs within tombstone grace periods |\n\n### Merkle tree comparison\n\n```mermaid\nflowchart TB\n  ROOT[Root hash] --> L[Left hash]\n  ROOT --> R[Right hash]\n  L --> L1[Range 1]\n  L --> L2[Range 2]\n  R --> R1[Range 3]\n  R --> R2[Range 4]\n```\n\nCompare roots; descend only into subtrees whose hashes differ."}, {"id": 39, "title": "Conflict resolution and CRDTs", "tldr": "When concurrent writes conflict, systems resolve them with last-write-wins, application merge logic, user choice, or conflict-free replicated data types (CRDTs) that merge mathematically. Choose a strategy that doesn’t silently lose important data.", "real": "Shapiro and colleagues formalized CRDTs in 2011, and they are used in collaborative editing libraries such as Automerge and Yjs and in databases such as Riak and Redis Enterprise’s active-active replication.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Methods to reconcile concurrent updates |\n| Why it matters | Multi-leader and leaderless systems produce conflicts |\n| Options | LWW, merge functions, user resolution, CRDTs |\n| Trade-off | Simplicity vs data preservation |\n| Failure mode | LWW dropping one of two concurrent orders |\n| Production habit | Model data so conflicts are rare or mergeable |\n\n### CRDT examples\n\n| CRDT | Behavior |\n|---|---|\n| G-Counter | Grow-only counter; merge = max per node |\n| PN-Counter | Increments and decrements |\n| OR-Set | Add/remove set without anomalies |\n| LWW-Register | Last write wins, timestamped |\n| Sequence CRDTs | Collaborative text |"}, {"id": 40, "title": "Chain replication", "tldr": "Chain replication orders replicas in a chain: writes enter at the head and propagate to the tail; reads go to the tail. It provides strong consistency with high throughput, and variants allow reads from any node.", "real": "Van Renesse and Schneider introduced chain replication in 2004, and variants such as CRAQ (2009) added reads from all replicas; research systems such as FAWN-KV (2009) used chain replication for their key-value stores.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Linear replication pipeline |\n| Why it matters | Strong consistency with simple protocol |\n| When to use | Storage systems needing linearizable reads and high throughput |\n| Trade-off | Latency proportional to chain length |\n| Failure mode | Slow node in the chain slows all writes |\n| Production habit | External coordinator manages chain membership |\n\n### Chain\n\n```mermaid\nflowchart LR\n  W[Write] --> HEAD[Head]\n  HEAD --> MID[Middle]\n  MID --> TAIL[Tail]\n  TAIL -->|ack| W\n  R[Read] --> TAIL\n```"}, {"id": 41, "title": "The consistency spectrum", "tldr": "Consistency models define what values reads may return when data is replicated and accessed concurrently. They range from strong (linearizable, strictly serializable) to weak (eventual). Stronger models are easier to program but cost latency and availability.", "real": "Jepsen, Kyle Kingsbury’s testing project, publishes a widely referenced map of consistency models and has found many databases that did not provide the consistency they advertised.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Contracts about read and write visibility |\n| Why it matters | Determines which bugs are possible |\n| Trade-off | Programmer simplicity vs performance and availability |\n| Failure mode | Building on a database without knowing its guarantees |\n| Production habit | Document the model each data store provides |\n\n### Spectrum (simplified)\n\n| Model | Guarantee |\n|---|---|\n| Strict serializability | Transactions in real-time order |\n| Linearizability | Single objects behave as one copy, real-time order |\n| Sequential | Same order for all, not real time |\n| Causal | Causally related ops seen in order |\n| Session guarantees | Per-client sanity (read-your-writes etc.) |\n| Eventual | Replicas converge eventually |"}, {"id": 42, "title": "Linearizability", "tldr": "Linearizability makes a replicated object behave like a single copy: once a write completes, every later read returns it or a newer value, respecting real time. It’s essential for locks, leader election and uniqueness constraints.", "real": "Herlihy and Wing defined linearizability in 1990, and coordination services such as etcd and ZooKeeper provide linearizable operations that systems like Kubernetes rely on for correct leader election and configuration.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Single-copy, real-time consistency for objects |\n| Why it matters | Required for correct coordination |\n| Implementation | Consensus, single leader with care, quorum + extra steps |\n| Trade-off | Latency; unavailable during partitions for minority side |\n| Failure mode | Reading from followers and calling it linearizable |\n| Production habit | Use linearizable stores only where needed |\n\n### Uses requiring linearizability\n\n| Use | Why |\n|---|---|\n| Leader election | Exactly one leader |\n| Distributed locks | Mutual exclusion |\n| Unique usernames | No double allocation |\n| Account balances (single object) | No stale overwrites |"}, {"id": 43, "title": "Sequential and causal consistency", "tldr": "Sequential consistency requires all nodes see operations in the same order consistent with each client’s program order, but not necessarily real-time order. Causal consistency only orders causally related operations, allowing more availability and lower latency.", "real": "Causal consistency was shown to be among the strongest models achievable while remaining available during network partitions, and research systems such as COPS (2011) demonstrated causal consistency at geo-replicated scale.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Weaker-than-linearizable ordering models |\n| Why it matters | Better availability and latency |\n| Sequential | One global order, respects each client’s order |\n| Causal | Only cause-before-effect enforced |\n| Trade-off | Fewer guarantees, harder reasoning for some apps |\n| Failure mode | Using causal stores for uniqueness constraints |\n| Production habit | Track dependencies for causal operations |\n\n### Comparison\n\n| Property | Sequential | Causal |\n|---|---|---|\n| Global agreement on all orders | Yes | No |\n| Concurrent writes may be seen in different orders | No | Yes |\n| Available under partition | No | Yes (with sticky sessions) |"}, {"id": 44, "title": "Eventual consistency", "tldr": "Eventual consistency only promises that replicas converge if updates stop. It allows high availability and low latency, but applications must handle stale reads, out-of-order updates and conflicts.", "real": "Werner Vogels, Amazon’s CTO, described eventual consistency and its trade-offs in his widely read 2008 article “Eventually Consistent” in ACM Queue, explaining why Amazon’s systems accepted it for availability.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Convergence without ordering guarantees |\n| Why it matters | Enables always-writable, globally distributed systems |\n| When to use | Caches, counters, social feeds, shopping carts |\n| When not to use | Balances, inventory limits, uniqueness |\n| Trade-off | Availability vs anomalies |\n| Failure mode | Business logic assuming fresh reads |\n| Production habit | Measure convergence time; design idempotent merges |\n\n### Patterns for eventual consistency\n\n| Pattern | Use |\n|---|---|\n| Idempotent updates | Safe reapplication |\n| Commutative operations | Order-independent results |\n| Versioning / timestamps | Detect staleness |\n| Reconciliation jobs | Fix divergence |"}, {"id": 45, "title": "Session guarantees", "tldr": "Session guarantees give each client a sane view even on weakly consistent systems: read-your-writes, monotonic reads, monotonic writes and writes-follow-reads. They are often enough for user-facing correctness.", "real": "Azure Cosmos DB offers “session” consistency as one of its five consistency levels, and it is the default level because it provides read-your-writes and monotonic reads for each client session at low cost.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Per-client consistency guarantees |\n| Why it matters | Users see their own actions reflected |\n| Guarantees | Read-your-writes, monotonic reads, monotonic writes, writes-follow-reads |\n| Trade-off | Session tracking vs global consistency cost |\n| Failure mode | Load balancer sending a client to a lagging replica |\n| Production habit | Session tokens carrying last-seen version |\n\n### Session token flow\n\n```mermaid\nflowchart LR\n  W[Write] --> TOKEN[Return version v42]\n  TOKEN --> CLIENT[Client stores v42]\n  CLIENT --> READ[Read with v42]\n  READ --> REPLICA{Replica ≥ v42?}\n  REPLICA -- yes --> SERVE[Serve]\n  REPLICA -- no --> WAIT[Wait or route elsewhere]\n```"}, {"id": 46, "title": "Serializability and strict serializability", "tldr": "Serializability means concurrent transactions produce results equivalent to some serial order; strict serializability additionally respects real-time order. They are the gold standard for multi-object correctness in databases.", "real": "Google Spanner provides external consistency, equivalent to strict serializability, globally; FoundationDB and CockroachDB provide serializable transactions, while many databases default to weaker isolation levels.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Transaction isolation equivalent to serial execution |\n| Why it matters | Prevents anomalies like write skew |\n| Strict version | Adds real-time ordering |\n| Trade-off | Coordination cost, aborts, latency |\n| Failure mode | Assuming “serializable” in a database that means snapshot isolation |\n| Production habit | Verify isolation behavior with tests (or Jepsen reports) |\n\n### Isolation vs anomalies\n\n| Isolation | Write skew possible? |\n|---|---|\n| Read committed | Yes |\n| Snapshot isolation | Yes |\n| Serializable | No |\n| Strict serializable | No (and real-time order) |"}, {"id": 47, "title": "The CAP theorem", "tldr": "During a network partition, a system must choose between consistency (linearizability) and availability (every non-failed node responds). CAP says nothing about normal operation and uses narrow definitions; treat it as a partition-time trade-off.", "real": "Eric Brewer presented CAP as a conjecture in 2000, Gilbert and Lynch proved it in 2002, and Brewer’s 2012 article “CAP Twelve Years Later” clarified that the “pick two of three” framing is misleading.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Partition-time trade-off between C and A |\n| Why it matters | Clarifies behavior under network failures |\n| Trade-off | Refuse some requests vs serve possibly stale/conflicting data |\n| Failure mode | Using CAP labels to describe normal-operation behavior |\n| Production habit | Specify behavior during partitions explicitly |\n\n### During a partition\n\n```mermaid\nflowchart LR\n  P[Partition] --> CP[CP choice: minority side rejects writes/reads]\n  P --> AP[AP choice: both sides serve, reconcile later]\n```"}, {"id": 48, "title": "PACELC", "tldr": "PACELC extends CAP: if Partitioned, choose Availability or Consistency; Else, choose Latency or Consistency. The latency–consistency trade-off in normal operation affects users every day.", "real": "Daniel Abadi proposed PACELC in 2010 and published it in IEEE Computer in 2012, arguing that many design decisions are driven by the latency cost of consistency even without partitions.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Framework for normal and partitioned trade-offs |\n| Why it matters | Consistency costs latency every day |\n| Trade-off | Coordination round trips vs freshness |\n| Failure mode | Paying cross-region consensus latency for data that tolerates staleness |\n| Production habit | Choose consistency per data type |\n\n### Examples\n\n| System style | Partition | Else |\n|---|---|---|\n| Dynamo-style stores | Availability | Latency |\n| Spanner, CockroachDB | Consistency | Consistency |\n| Single-region RDBMS with async replicas | Consistency (primary) | Latency for replica reads |"}, {"id": 49, "title": "Choosing consistency per use case", "tldr": "Different data needs different guarantees: payments and inventory need strong consistency; feeds, analytics and caches tolerate staleness. Mixing models within one system is normal; make each choice explicit.", "real": "Amazon DynamoDB offers both eventually consistent and strongly consistent reads per request, and Cosmos DB offers five levels, reflecting the practice of choosing consistency per operation.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Matching guarantees to business needs |\n| Why it matters | Avoids paying for unnecessary coordination |\n| Trade-off | Complexity of mixed models vs efficiency |\n| Failure mode | Uniform eventual consistency including financial data |\n| Production habit | Consistency column in the data inventory |\n\n### Data inventory\n\n| Data | Required consistency |\n|---|---|\n| Account balance | Strict serializable |\n| Inventory reservation | Linearizable per item |\n| User profile | Read-your-writes |\n| Like counts | Eventual |\n| Analytics | Eventual (minutes) |"}, {"id": 50, "title": "Testing consistency claims", "tldr": "Verify that systems deliver the guarantees you rely on: run concurrent workloads with fault injection, record histories and check them against the consistency model. Read published analyses before adopting a datastore.", "real": "Jepsen analyses since 2013 have found consistency violations in systems including MongoDB, Elasticsearch, Redis-based designs and several distributed SQL databases, often prompting fixes or documentation changes.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Empirical validation of consistency |\n| Why it matters | Documentation and reality can differ |\n| Methods | Jepsen-style tests, linearizability checkers, chaos experiments |\n| Trade-off | Test infrastructure effort |\n| Failure mode | Discovering anomalies in production |\n| Production habit | Consistency tests in CI for critical paths |\n\n### Test loop\n\n```mermaid\nflowchart LR\n  WORK[Concurrent clients] --> FAULTS[Inject partitions, crashes, clock skew]\n  FAULTS --> HISTORY[Record operation history]\n  HISTORY --> CHECK[Check against model]\n  CHECK --> REPORT[Anomalies?]\n```"}, {"id": 51, "title": "The consensus problem", "tldr": "Consensus lets a group of nodes agree on a value, such as a leader or the next log entry, even if some fail. It underlies leader election, replicated logs, distributed locks, configuration and atomic commits.", "real": "Google’s Chubby lock service (2006) and Apache ZooKeeper (2010) packaged consensus as coordination services, which systems such as Bigtable, HBase and Kafka (before KRaft) used for leader election and metadata.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Agreement among nodes despite failures |\n| Why it matters | Foundation for strong consistency |\n| Properties | Agreement, validity, termination |\n| Trade-off | Safety and correctness vs latency and majority requirement |\n| Failure mode | Home-grown “consensus” without proofs |\n| Production habit | Use proven implementations (etcd, ZooKeeper, Raft libraries) |\n\n### Uses\n\n| Use | Agreement on |\n|---|---|\n| Leader election | Who leads |\n| Replicated log | Order of operations |\n| Configuration | Cluster membership |\n| Locks | Who holds the lock |"}, {"id": 52, "title": "The FLP impossibility result", "tldr": "In a fully asynchronous system where even one process may crash, no deterministic algorithm can guarantee consensus terminates. Practical protocols stay safe always and make progress when the network behaves (partial synchrony) or use randomization.", "real": "Fischer, Lynch and Paterson published this result in 1985, and it received the Dijkstra Prize in 2001; Paxos and Raft sidestep it by guaranteeing safety always and liveness only under timing assumptions.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Proof that perfect asynchronous consensus is impossible |\n| Why it matters | Explains why protocols rely on timeouts |\n| Practical answer | Safety always; liveness when timing is good |\n| Trade-off | Theoretical purity vs real-world progress |\n| Failure mode | Expecting consensus to make progress during unstable networks |\n| Production habit | Tune election timeouts; monitor leader churn |\n\n### Safety vs liveness\n\n| Property | Meaning | Paxos/Raft |\n|---|---|---|\n| Safety | Never decide two different values | Always guaranteed |\n| Liveness | Eventually decide | Under partial synchrony |"}, {"id": 53, "title": "Paxos", "tldr": "Paxos reaches agreement through proposers, acceptors and learners in two phases: prepare/promise and accept/accepted, using proposal numbers and majorities. It is proven correct but notoriously hard to understand and implement fully.", "real": "Leslie Lamport described Paxos in “The Part-Time Parliament” (submitted 1990, published 1998) and later “Paxos Made Simple” (2001); Google’s 2007 paper “Paxos Made Live” described the difficulty of building a production Paxos system for Chubby.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Classic majority-based consensus protocol |\n| Why it matters | Basis of many production systems |\n| Phases | Prepare/promise, accept/accepted |\n| Trade-off | Proven safety vs implementation complexity |\n| Failure mode | Subtle bugs in custom Paxos implementations |\n| Production habit | Prefer well-tested libraries or Raft |\n\n### Single-decree Paxos\n\n```mermaid\nsequenceDiagram\n  participant P as Proposer\n  participant A as Acceptors (majority)\n  P->>A: Prepare(n)\n  A-->>P: Promise(n, highest accepted value)\n  P->>A: Accept(n, v)\n  A-->>P: Accepted(n, v)\n```"}, {"id": 54, "title": "Multi-Paxos and replicated logs", "tldr": "Multi-Paxos runs Paxos for each log slot, with a stable leader skipping the prepare phase for most entries, producing a replicated log that drives replicated state machines efficiently.", "real": "Google’s Chubby and Spanner used Paxos-based replicated logs, with Spanner running a Paxos group per data split to replicate across zones and regions.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Consensus on a sequence of values |\n| Why it matters | Builds replicated state machines |\n| Optimization | Stable leader: one round trip per entry |\n| Trade-off | Leader bottleneck vs efficiency |\n| Failure mode | Leader churn reducing throughput |\n| Production habit | Batch and pipeline log entries |\n\n### Replicated log\n\n| Slot | Value | Status |\n|---|---|---|\n| 1 | set x=1 | Chosen |\n| 2 | set y=7 | Chosen |\n| 3 | delete z | In progress |"}, {"id": 55, "title": "Raft", "tldr": "Raft is a consensus algorithm designed for understandability: leader election with randomized timeouts, log replication from the leader, and safety rules that keep committed entries. It is the most widely implemented consensus protocol today.", "real": "Diego Ongaro and John Ousterhout published Raft in 2014 (“In Search of an Understandable Consensus Algorithm”), and it is used in etcd, Consul, CockroachDB, TiKV and Kafka’s KRaft mode.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Leader-based consensus for replicated logs |\n| Why it matters | Easier to implement and reason about than Paxos |\n| Components | Leader election, log replication, safety |\n| Trade-off | Leader bottleneck; majority needed |\n| Failure mode | Election storms from poorly tuned timeouts |\n| Production habit | Odd cluster sizes; monitor term changes |\n\n### Roles\n\n```mermaid\nflowchart LR\n  F[Follower] -->|election timeout| C[Candidate]\n  C -->|majority votes| L[Leader]\n  C -->|higher term seen| F\n  L -->|higher term seen| F\n```\n\n### Fault tolerance\n\n| Nodes | Majority | Tolerates failures |\n|---|---|---|\n| 3 | 2 | 1 |\n| 5 | 3 | 2 |\n| 7 | 4 | 3 |"}, {"id": 56, "title": "Zab and ZooKeeper", "tldr": "ZooKeeper offers a hierarchical namespace of small data nodes with watches, ephemeral nodes and sequential nodes, replicated with the Zab atomic broadcast protocol. It provides building blocks for leader election, locks and configuration.", "real": "Apache ZooKeeper, described in a 2010 USENIX paper by Hunt and colleagues at Yahoo!, was widely used by Hadoop, HBase and Kafka; Kafka later replaced ZooKeeper with its own Raft-based KRaft mode, which became the only mode in Kafka 4.0 (2025).", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Coordination service with consensus underneath |\n| Why it matters | Reusable primitives for distributed coordination |\n| Primitives | Ephemeral nodes, sequential nodes, watches |\n| Trade-off | Extra cluster to operate |\n| Failure mode | Using ZooKeeper as a general-purpose database |\n| Production habit | Keep data small; separate clusters for critical systems |\n\n### Leader election recipe\n\n```text\n1. Each candidate creates /election/node- as EPHEMERAL_SEQUENTIAL\n2. Lowest sequence number is leader\n3. Others watch the node just before theirs\n4. If the leader's session ends, its node disappears; next in line becomes leader\n```"}, {"id": 57, "title": "Leader election and leases", "tldr": "Leader election picks one node to coordinate; leases give it time-limited authority. Because old leaders may not know they’ve been replaced (pauses, partitions), protect resources with fencing tokens that reject stale leaders."

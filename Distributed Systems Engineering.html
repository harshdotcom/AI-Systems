voiding fallback complexity and limiting blast radius.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Compact guidance for design decisions |\n| Why it matters | Consistent, robust designs |\n| Production habit | Use principles as review prompts |\n\n### Principles\n\n| # | Principle |\n|---|---|\n| 1 | Simplicity first; distribute only when needed |\n| 2 | Every call can fail, be slow or duplicate |\n| 3 | Make operations idempotent |\n| 4 | Bound queues, retries, timeouts and fan-out |\n| 5 | Isolate failure domains (cells, zones, regions) |\n| 6 | Choose consistency per data type |\n| 7 | Prefer static stability over reactive fallbacks |\n| 8 | Stage every change |\n| 9 | Observe from the user’s perspective |\n| 10 | Verify with tests, simulation and formal methods |"}, {"id": 192, "title": "Approaching system design problems", "tldr": "Structure design work: clarify requirements and scale, define APIs and data models, sketch high-level architecture, deep-dive into bottlenecks and failure modes, then discuss trade-offs, observability and evolution.", "real": "System design interviews at large technology companies and resources such as Alex Xu’s “System Design Interview” (2020) follow a similar structure, which mirrors how real design reviews proceed.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A repeatable method for designing systems |\n| Why it matters | Avoids missing requirements and failure modes |\n| Trade-off | Breadth vs depth within limited time |\n| Failure mode | Jumping to technologies before requirements |\n| Production habit | Write numbers: QPS, data size, latency targets |\n\n### Steps\n\n```mermaid\nflowchart LR\n  REQ[Requirements + scale] --> API[APIs + data model]\n  API --> HIGH[High-level design]\n  HIGH --> DEEP[Deep dives: bottlenecks, consistency, failures]\n  DEEP --> TRADE[Trade-offs + evolution]\n```\n\n### Back-of-envelope\n\n```text\n100M daily users × 20 requests/day = 2B requests/day ≈ 23,000 req/s average\nPeak ≈ 3× average ≈ 70,000 req/s\n```"}, {"id": 193, "title": "Capstone: a globally distributed key-value store", "tldr": "Design a key-value store with high availability across regions: consistent hashing with virtual nodes, replication factor 3 per region, tunable quorums, hinted handoff, Merkle-tree repair, and per-request consistency choices.", "real": "This capstone follows the design lineage of Amazon’s Dynamo (2007) and Apache Cassandra, adapted with lessons from DynamoDB’s later operational experience.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| Requirements | 1M writes/s, p99 < 20 ms in-region, survive region loss |\n| Partitioning | Consistent hashing, 256 vnodes per node |\n| Replication | N = 3 per region, async cross-region |\n| Consistency | LOCAL_QUORUM default; ONE for low-latency reads |\n| Repair | Read repair, hinted handoff, Merkle anti-entropy |\n| Trade-off | Cross-region eventual consistency |\n\n### Architecture\n\n```mermaid\nflowchart LR\n  CLIENT[Client] --> COORD[Coordinator node]\n  COORD --> R1[Replica 1]\n  COORD --> R2[Replica 2]\n  COORD --> R3[Replica 3]\n  R1 -.async.-> OTHER[Other region replicas]\n```"}, {"id": 194, "title": "Capstone: a payments system", "tldr": "Design payments with correctness first: idempotency keys on every request, a double-entry ledger as source of truth, state machines for payment lifecycle, outbox for events, reconciliation with external processors, and strong consistency for balances.", "real": "Stripe’s public engineering writing on idempotency keys and API versioning, and the widespread use of double-entry ledgers in fintech systems, inform this design.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| Requirements | No double charges, no lost payments, auditability |\n| Core data | Double-entry ledger (immutable entries) |\n| Consistency | Serializable transactions for ledger writes |\n| Reliability | Idempotency keys, retries with backoff, outbox |\n| Verification | Daily reconciliation with processors and banks |\n| Trade-off | Latency vs correctness (correctness wins) |\n\n### Payment state machine\n\n```mermaid\nstateDiagram-v2\n  [*] --> Created\n  Created --> Authorized\n  Authorized --> Captured\n  Authorized --> Voided\n  Captured --> Refunded\n  Created --> Failed\n```"}, {"id": 195, "title": "Capstone: a chat and messaging system", "tldr": "Design real-time messaging: persistent connections via gateways, channel-partitioned message storage, per-channel ordering with sequence numbers, fan-out to online members, push notifications for offline members and read receipts.", "real": "This capstone draws on public descriptions such as Discord’s message storage evolution and WhatsApp’s historically small engineering team running Erlang-based servers at very large scale.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| Requirements | Low-latency delivery, ordered per channel, history |\n| Connections | WebSocket gateways, session registry |\n| Storage | Partition by channel + time bucket |\n| Ordering | Sequence number per channel |\n| Fan-out | Online: via gateways; offline: push notifications |\n| Trade-off | Large group fan-out cost |\n\n### Architecture\n\n```mermaid\nflowchart LR\n  CLIENTS[Clients] --> GW[WebSocket gateways]\n  GW --> MSG[Message service: assign sequence]\n  MSG --> STORE[(Message store by channel)]\n  MSG --> FAN[Fan-out service]\n  FAN --> GW\n  FAN --> PUSH[Push notifications]\n```"}, {"id": 196, "title": "Capstone: a distributed rate limiter", "tldr": "Design a rate limiter for an API platform: token buckets per client, local enforcement at gateways with periodic synchronization through a shared store, tolerance for slight overshoot, and fail-open or fail-closed policies per endpoint.", "real": "This capstone reflects designs described publicly by companies such as Stripe and Cloudflare, which combine local enforcement with shared counters to balance accuracy, latency and resilience.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| Requirements | Per-key limits, < 1 ms overhead, global approximate accuracy |\n| Algorithm | Token bucket or sliding window counters |\n| Architecture | Local counters in gateways + Redis sync |\n| Failure policy | Fail open for reads; fail closed for expensive writes |\n| Trade-off | Accuracy vs latency and availability |\n\n### Architecture\n\n```mermaid\nflowchart LR\n  REQ[Requests] --> GW1[Gateway 1: local bucket]\n  REQ --> GW2[Gateway 2: local bucket]\n  GW1 <-->|periodic sync| REDIS[(Shared counters)]\n  GW2 <-->|periodic sync| REDIS\n```"}, {"id": 197, "title": "Capstone: an event processing pipeline", "tldr": "Design a pipeline from application events to analytics and real-time alerts: producers with schemas, Kafka topics partitioned by entity, Flink jobs with event-time windows and checkpoints, idempotent sinks, a data lake and monitoring of lag and quality.", "real": "This capstone combines Kafka, Apache Flink and lakehouse table formats such as Apache Iceberg, a common architecture for real-time analytics in large technology companies.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| Requirements | Seconds-latency alerts, exactly-once aggregates, replayable history |\n| Ingestion | Schema-registered events into Kafka |\n| Processing | Flink with event-time windows, checkpoints |\n| Sinks | Transactional/idempotent writes to OLAP store and lake |\n| Operations | Consumer lag, watermark delay, data quality checks |\n| Trade-off | Latency vs completeness (allowed lateness) |\n\n### Architecture\n\n```mermaid\nflowchart LR\n  APPS[Producers] --> KAFKA[Kafka topics]\n  KAFKA --> FLINK[Flink jobs]\n  FLINK --> ALERTS[Alerting]\n  FLINK --> OLAP[(Real-time OLAP)]\n  KAFKA --> LAKE[(Iceberg data lake)]\n```"}, {"id": 198, "title": "Architecture review checklist", "tldr": "Review distributed designs systematically: requirements and scale, data model and partitioning, consistency, replication and failover, failure modes, overload behavior, observability, security, deployment safety, testing and cost.", "real": "The AWS Well-Architected Framework (reliability, security, performance, cost and operational excellence pillars, plus sustainability) and similar frameworks from Google and Microsoft provide structured review questions used by many organizations.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A standard design review gate |\n| Why it matters | Catches predictable distributed failures |\n| Production habit | Use at design, pre-launch and after incidents |\n\n### Checklist\n\n| Area | Questions |\n|---|---|\n| Scale | Load parameters and growth stated? |\n| Data | Partition key, hot-spot plan, indexes? |\n| Consistency | Guarantee per data type documented? |\n| Replication | Sync/async, failover, split-brain prevention? |\n| Failures | Timeouts, retries, idempotency, degradation? |\n| Overload | Load shedding, backpressure, bounded queues? |\n| Isolation | Cells, bulkheads, blast radius? |\n| Observability | SLOs, tracing, alerts, runbooks? |\n| Security | mTLS, authZ, secrets, segmentation? |\n| Changes | Staged rollout, rollback, config safety? |\n| Testing | Fault injection, load tests, formal specs where critical? |"}, {"id": 199, "title": "Essential reading", "tldr": "Build deep understanding by reading foundational papers and books: Lamport on clocks and Paxos, Dynamo, Bigtable, GFS, MapReduce, Spanner, Raft, Dapper, the Tail at Scale, and books such as “Designing Data-Intensive Applications”.", "real": "Many university courses, such as MIT’s 6.824/6.5840 Distributed Systems course, built around labs implementing Raft and a sharded key-value store, use these papers as core material.", "body": "### System card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Foundational literature |\n| Why it matters | Most modern systems build on these ideas |\n| Production habit | Read one paper a month as a team |\n\n### Reading list\n\n| Topic | Reading |\n|---|---|\n| Time and order | Lamport, “Time, Clocks, and the Ordering of Events” (1978) |\n| Consensus | “Paxos Made Simple” (2001), Raft (2014) |\n| Storage | GFS (2003), Bigtable (2006), Dynamo (2007) |\n| Processing | MapReduce (2004), Spark RDDs (2012), Dataflow Model (2015) |\n| Global databases | Spanner (2012), DynamoDB (2022) |\n| Operations | Dapper (2010), The Tail at Scale (2013), Google SRE book (2016) |\n| Books | “Designing Data-Intensive Applications” (Kleppmann), “Database Internals” (Petrov) |"}, {"id": 200, "title": "Glossary and mastery roadmap", "tldr": "Use the glossary for shared vocabulary and the roadmap to build expertise: implement core algorithms, operate real clusters, inject failures, read postmortems and review designs.", "real": "Hands-on courses such as MIT 6.5840 and projects like implementing Raft or a replicated key-value store are widely recommended ways to build intuition for distributed systems.", "body": "### Glossary\n\n| Term | Meaning |\n|---|---|\n| Partition (network) | Nodes unable to communicate |\n| Partition (data) | Shard of a dataset |\n| Linearizability | Single-copy, real-time consistency |\n| Quorum | Majority or overlapping subset of replicas |\n| Consensus | Agreement despite failures |\n| Idempotency | Repeating an operation has no extra effect |\n| Backpressure | Slowing producers when consumers lag |\n| Fencing token | Monotonic token rejecting stale leaders |\n| Error budget | Allowed unreliability under an SLO |\n| Cell | Isolated full-stack unit serving a subset of users |\n\n### Mastery roadmap\n\n1. Implement Lamport and vector clocks\n2. Implement Raft (e.g. MIT 6.5840 labs)\n3. Build a sharded, replicated key-value store\n4. Run Jepsen-style fault tests on it\n5. Operate Kafka or a database cluster with failover drills\n6. Write a TLA+ spec for a small protocol\n7. Design and review three systems with the checklist\n8. Read ten public postmortems and extract lessons"}];
const PARTS = ["Foundations", "Communication", "Time, clocks and ordering", "Replication", "Consistency models", "Consensus and coordination", "Distributed transactions", "Partitioning and data distribution", "Distributed storage", "Distributed data processing", "Fault tolerance patterns", "Scalability and performance", "Service architecture", "Cloud-native infrastructure", "Observability", "Reliability engineering and incidents", "Testing and verification", "Security", "Case studies", "Design practice and mastery"];
const TOTAL = 200, PER = 10;
function idsOf(p){ const a = []; for (let i = (p-1)*PER + 1; i <= p*PER; i++) a.push(i); return a; }
const partOf = id => Math.ceil(id / PER);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "dist-systems-progress-v1";
const LS_LAST = "dist-systems-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try{ await dbRef.set({done:[...done].sort((a,b)=>a-b), updated:Date.now()}); }
  catch(e){ if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; pushRemote(); }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...done])); }catch(e){} }
function toggle(id){
  if (done.has(id)) done.delete(id); else done.add(id);
  saveLocal(); pushRemote(); renderAll();
  toast(done.has(id) ? "Chapter " + id + " marked complete" : "Chapter " + id + " marked not complete");
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(s){
  if (window.marked && marked.parse){
    const html = marked.parse(s, {gfm:true, headerIds:false, mangle:false});
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  }
  return "<pre>" + esc(s) + "</pre>";
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function currentId(){
  const m = location.hash.match(/^#ch-(\d{1,3})$/);
  const n = m ? +m[1] : 0;
  return n >= 1 && n <= TOTAL ? n : 0;
}

/* ---------- header memory bank ---------- */
function renderBank(){
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    html += '<div class="bank-group" title="Part ' + p + ': ' + esc(PARTS[p-1]) + '">';
    for (const i of idsOf(p)){
      html += '<button class="cell' + (done.has(i) ? " done" : "") + (i === cur ? " here" : "") +
        '" data-go="' + i + '" aria-label="Chapter ' + i + (done.has(i) ? ", complete" : "") + '"></button>';
    }
    html += "</div>";
  }
  document.getElementById("bank").innerHTML = html;
  document.getElementById("doneCount").textContent = done.size;
  document.getElementById("pct").textContent = Math.round(done.size * 100 / TOTAL) + "%";
}

/* ---------- sidebar ---------- */
const openParts = new Set();
function renderSide(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const matches = ids.filter(i => !q || byId[i].title.toLowerCase().includes(q) || byId[i].tldr.toLowerCase().includes(q) || String(i) === q);
    if (q && !matches.length) continue;
    const count = ids.filter(i => done.has(i)).length;
    const open = q || openParts.has(p) || partOf(cur) === p;
    html += '<div class="part' + (open ? " open" : "") + '">' +
      '<button class="part-head" data-part="' + p + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="part-num">' + String(p).padStart(2, "0") + '</span>' +
      '<span class="part-name">' + esc(PARTS[p-1]) + '</span>' +
      '<span class="part-count' + (count === PER ? " full" : "") + '">' + count + '/' + PER + '</span></button><ul class="part-list">';
    for (const i of matches){
      html += '<li class="ch-row' + (i === cur ? " active" : "") + '">' +
        '<button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="' + (done.has(i) ? "Mark chapter " + i + " not complete" : "Mark chapter " + i + " complete") + '">' + TICK + '</button>' +
        '<a href="#ch-' + i + '"><span class="n">' + i + '.</span>' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ul></div>";
  }
  if (!html) html = '<p style="color:var(--muted);font-size:14px;padding:8px">No chapters match that search. Try a shorter word like “Raft”, “quorum” or “retry”.</p>';
  document.getElementById("parts").innerHTML = html;
}

/* ---------- diagrams and charts ---------- */
let mermaidPromise = null, renderSeq = 0;
const svgCache = new Map();
function isDark(){
  const a = document.documentElement.getAttribute("data-theme");
  if (a) return a === "dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function ensureMermaid(){
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (mermaidPromise) return mermaidPromise;
  mermaidPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js";
    s.onload = () => {
      try{
        window.mermaid.initialize({ startOnLoad:false, securityLevel:"strict", theme: isDark() ? "dark" : "neutral",
          fontFamily:"IBM Plex Sans, system-ui, sans-serif", flowchart:{ curve:"basis", htmlLabels:true } });
        resolve(window.mermaid);
      }catch(e){ reject(e); }
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return mermaidPromise;
}
function fitSvg(div){
  const svg = div.querySelector("svg");
  if (!svg) return;
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Diagram");
  const vb = (svg.getAttribute("viewBox") || "").split(/\s+/).map(Number);
  const vbw = vb[2] || 0;
  if (vbw && div.clientWidth && div.clientWidth < vbw * 0.7){
    svg.style.maxWidth = "none";
    svg.style.width = Math.round(vbw * 0.85) + "px";
  }
}
function fmtNum(v){ return Number(v).toLocaleString("en-US", { maximumFractionDigits: 3 }); }
function renderChart(el, spec){
  const max = Math.max(...spec.data.map(d => d[1]));
  const unit = spec.unit || "";
  const sep = (unit === "%" || unit === "×") ? "" : " ";
  let rows = "";
  for (const [label, v] of spec.data){
    let w = spec.log ? (Math.log10(v + 1) / Math.log10(max + 1)) * 100 : (v / max) * 100;
    w = Math.max(w, 1.5);
    rows += '<div class="bar-row"><span class="bar-label">' + esc(String(label)) + '</span><span class="bar-track"><span class="bar" style="width:' + w.toFixed(1) + '%"></span></span><span class="bar-val">' + fmtNum(v) + sep + esc(unit) + '</span></div>';
  }
  const fig = document.createElement("figure");
  fig.className = "chart";
  fig.innerHTML = '<figcaption>' + esc(spec.title || "") + '</figcaption>' + rows + (spec.log ? '<div class="chart-note">Bar lengths use a logarithmic scale.</div>' : "");
  el.replaceWith(fig);
}
function enhance(root){
  root.querySelectorAll("code.language-chart").forEach(code => {
    const pre = code.closest("pre") || code;
    try{ renderChart(pre, JSON.parse(code.textContent)); }catch(e){}
  });
  const blocks = [...root.querySelectorAll("code.language-mermaid")];
  if (!blocks.length) return;
  const seq = ++renderSeq;
  const holders = blocks.map(code => {
    const pre = code.closest("pre") || code;
    const div = document.createElement("div");
    div.className = "diagram loading";
    div.textContent = "Loading diagram…";
    div.dataset.src = code.textContent;
    pre.replaceWith(div);
    if (svgCache.has(div.dataset.src)){ div.classList.remove("loading"); div.innerHTML = svgCache.get(div.dataset.src); div.dataset.done = "1"; fitSvg(div); }
    return div;
  }).filter(div => !div.dataset.done);
  if (!holders.length) return;
  ensureMermaid().then(async m => {
    for (let k = 0; k < holders.length; k++){
      const div = holders[k];
      if (seq !== renderSeq || !div.isConnected) return;
      const id = "mmd-" + seq + "-" + k;
      try{
        const out = await m.render(id, div.dataset.src);
        if (!div.isConnected) return;
        div.classList.remove("loading");
        div.innerHTML = out.svg;
        svgCache.set(div.dataset.src, out.svg);
        fitSvg(div);
      }catch(e){
        const junk = document.getElementById("d" + id); if (junk) junk.remove();
        div.classList.remove("loading");
        div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>";
      }
    }
  }).catch(() => {
    holders.forEach(div => { div.classList.remove("loading"); div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>"; });
  });
}

/* ---------- chapter view ---------- */
function renderChapter(id){
  const c = byId[id];
  const p = partOf(id);
  const ids = idsOf(p);
  const isDone = done.has(id);
  const tabs = ids.map(i =>
    '<button class="tab' + (i === id ? " active" : "") + '" role="tab" aria-selected="' + (i === id) + '" data-go="' + i + '">' +
    '<span class="dot' + (done.has(i) ? " on" : "") + '"></span><span class="tab-t">' + i + '. ' + esc(byId[i].title) + '</span></button>'
  ).join("");
  document.getElementById("main").innerHTML =
    '<p class="crumb">Part ' + p + ' of 20: ' + esc(PARTS[p-1]) + '</p>' +
    '<div class="tabs" role="tablist" aria-label="Chapters in this part">' + tabs + '</div>' +
    '<article>' +
      '<p class="ch-no">Chapter ' + id + ' of ' + TOTAL + '</p>' +
      '<h1 class="ch-title">' + esc(c.title) + '</h1>' +
      '<section class="box tldr"><h2>TL;DR</h2><p>' + inlineMd(c.tldr) + '</p></section>' +
      '<div class="body">' + md(c.body) + '</div>' +
      '<section class="box real"><h2>Real-world example</h2><p>' + inlineMd(c.real) + '</p></section>' +
      '<div class="done-bar">' +
        '<button class="complete' + (isDone ? " on" : "") + '" data-toggle="' + id + '" aria-pressed="' + isDone + '">' +
          '<span class="tick' + (isDone ? " on" : "") + '">' + TICK + '</span>' + (isDone ? "Completed" : "Mark as complete") + '</button>' +
        '<div class="nav">' +
          '<button class="btn" data-go="' + (id - 1) + '"' + (id === 1 ? " disabled" : "") + '>Previous</button>' +
          '<button class="btn" data-go="' + (id + 1) + '"' + (id === TOTAL ? " disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  enhance(document.getElementById("main"));
}

/* ---------- contents view ---------- */
function renderContents(){
  let html = '<div class="contents"><h1>Contents</h1>' +
    '<p class="lead">Twenty parts covering failure and system models, communication, time and ordering, replication, consistency, consensus, distributed transactions, partitioning, storage, data processing, fault tolerance, performance, service architecture, cloud-native infrastructure, observability, reliability engineering, testing and verification, security and real-world case studies. Every chapter has a system card covering what it is, why it matters, when to use it and when not, trade-offs, failure modes and production habits. Tick a chapter when you finish it; your progress is saved.</p>' +
    '<div class="contents-actions"><button class="btn" data-go="' + firstUnread() + '">' + (done.size ? "Continue with chapter " + firstUnread() : "Start chapter 1") + '</button>' +
    '<button class="btn" id="resetBtn">Reset progress</button></div><div class="grid">';
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const count = ids.filter(i => done.has(i)).length;
    html += '<section class="pcard"><h2>Part ' + p + ': ' + esc(PARTS[p-1]) + '</h2><div class="meta">' + count + ' of ' + PER + ' complete</div><ol>';
    for (const i of ids){
      html += '<li><button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="Toggle chapter ' + i + '">' + TICK + '</button><a href="#ch-' + i + '">' + i + '. ' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ol></section>";
  }
  document.getElementById("main").innerHTML = html + "</div></div>";
}
function firstUnread(){ for (let i = 1; i <= TOTAL; i++) if (!done.has(i)) return i; return TOTAL; }

/* ---------- routing ---------- */
let lastRendered = null;
function renderAll(){
  const id = currentId();
  renderBank(); renderSide();
  const y = window.scrollY;
  if (id) renderChapter(id); else renderContents();
  if (lastRendered === location.hash) window.scrollTo(0, y);
  lastRendered = location.hash;
}
function route(){
  const id = currentId();
  if (!id && location.hash !== "#contents"){
    let last = 0; try{ last = +localStorage.getItem(LS_LAST) || 0; }catch(e){}
    location.replace("#ch-" + (last >= 1 && last <= TOTAL ? last : 1));
    return;
  }
  if (id){ try{ localStorage.setItem(LS_LAST, id); }catch(e){} }
  document.body.classList.remove("drawer");
  renderAll();
  window.scrollTo(0, 0);
  const active = document.querySelector(".ch-row.active");
  if (active) active.scrollIntoView({block:"nearest"});
  const tab = document.querySelector(".tab.active");
  if (tab && tab.parentElement){ const r = tab.parentElement; const left = tab.offsetLeft - r.offsetLeft; if (left < r.scrollLeft || left + tab.offsetWidth > r.scrollLeft + r.clientWidth) r.scrollLeft = left - 16; }
}
function go(id){ if (id >= 1 && id <= TOTAL) location.hash = "#ch-" + id; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){ e.preventDefault(); toggle(+t.dataset.toggle); return; }
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled){ go(+g.dataset.go); return; }
  const ph = e.target.closest("[data-part]");
  if (ph){
    const p = +ph.dataset.part;
    const el = ph.parentElement;
    const isOpen = el.classList.toggle("open");
    if (isOpen) openParts.add(p); else openParts.delete(p);
    ph.setAttribute("aria-expanded", isOpen);
    return;
  }
  if (e.target.id === "resetBtn"){
    if (confirm("Clear all 200 ticks? This can’t be undone.")){ done.clear(); saveLocal(); pushRemote(); renderAll(); toast("Progress reset"); }
  }
});
document.getElementById("search").addEventListener("input", renderSide);
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.add("drawer"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = currentId(); if (!id) return;
  if (e.key === "ArrowRight") go(id + 1);
  else if (e.key === "ArrowLeft") go(id - 1);
});
function setTopH(){ document.documentElement.style.setProperty("--top-h", document.getElementById("top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);
window.addEventListener("hashchange", route);
setTopH();
route();
initSync();
</script>
</body>
</html>

|\n| Version and test | Prevent regressions |\n\n### Prompt template example\n\n```text\nYou are a support assistant for Acme. Answer only from <docs>.\nIf the answer is not in <docs>, say you don't know and offer a human agent.\nReturn JSON: {\"answer\": str, \"citations\": [doc_id], \"escalate\": bool}\n<docs>{{retrieved_docs}}<\/docs>\nQuestion: {{user_question}}\n```"}, {"id": 104, "title": "API models vs self-hosted models", "tldr": "Hosted APIs offer top quality and zero infrastructure; self-hosting open-weight models offers control, data locality and possibly lower cost at high, steady volume. Many companies use both, behind a common gateway.", "real": "Enterprises often start with API models (OpenAI, Anthropic, Google, or via cloud platforms such as Amazon Bedrock, Azure and Vertex AI) and self-host open-weight models such as Llama, Mistral, Qwen or Gemma for sensitive, high-volume or offline workloads.", "body": "### Comparison\n\n| Factor | API | Self-hosted |\n|---|---|---|\n| Quality | Frontier models | Strong open models, usually behind frontier |\n| Setup | Minutes | Weeks (GPUs, serving, ops) |\n| Cost at low volume | Low | High (idle GPUs) |\n| Cost at high steady volume | Can be high | Can be lower |\n| Data control | Contractual | Full |\n| Customization | Limited fine-tuning | Full |\n| Availability risk | Provider outages, policy changes | Your own operations |\n\n### Break-even sketch\n\n```\nSelf-host cost/month = GPUs × hourly price × 730 + ops staff share\nAPI cost/month       = tokens/month × price per token\nSelf-host wins when utilization is high and steady.\n```\n\n### Hybrid pattern\n\nA gateway routes sensitive or high-volume traffic to self-hosted models and complex tasks to API models (ch. 120)."}, {"id": 105, "title": "LLM latency: TTFT and tokens per second", "tldr": "LLM latency has two parts: time to first token (prompt processing plus queueing) and time per output token (generation speed). Total time grows with output length. Design UX around streaming and keep outputs and prompts as short as the task allows.", "real": "Chat products such as ChatGPT and Claude stream responses token by token so users see progress immediately. Providers publish options such as smaller “mini” or “haiku” models and faster serving tiers specifically for latency-sensitive applications.", "body": "### Latency formula\n\n```\nTotal latency ≈ network + queue + prefill(input_tokens) + output_tokens × time_per_token\n```\n\n### Illustrative timing (single request, mid-size model)\n\n```chart\n{\"title\": \"Where time goes in a 300-token answer (illustrative)\", \"unit\": \"ms\", \"data\": [[\"Network + queue\", 150], [\"Prefill (2,000-token prompt)\", 250], [\"Generate 300 tokens\", 4500]]}\n```\n\n### Levers\n\n| Lever | Effect |\n|---|---|\n| Shorter outputs | Biggest effect on total time |\n| Streaming | Perceived latency drops |\n| Smaller model | Faster tokens |\n| Prompt caching | Faster prefill for repeated prefixes |\n| Speculative decoding | Faster generation (provider/engine side) |\n| Parallel calls | Split independent subtasks |\n\n### Targets for chat UX\n\nTime to first token under \\~1–2 s, and steady streaming faster than reading speed."}, {"id": 106, "title": "LLM cost modeling", "tldr": "LLM cost is driven by input tokens, output tokens, number of calls per task, and model price. Agents and RAG multiply input tokens. Model cost per successful task, then optimize with caching, routing, shorter contexts and batch APIs.", "real": "Providers price input and output tokens separately, with output typically several times more expensive than input. Anthropic and OpenAI offer batch APIs at about 50% off for non-urgent work, and prompt caching discounts for repeated prefixes (on Anthropic’s API, cache reads cost about a tenth of normal input on most models).", "body": "### Cost formula\n\n```\nCost per task = Σ calls [ input_tokens × price_in + output_tokens × price_out ]\nMonthly cost  = cost per task × tasks per month\n```\n\n### Relative cost of input token types (Anthropic-style caching, most models)\n\n```chart\n{\"title\": \"Price multiplier vs normal input token\", \"unit\": \"×\", \"data\": [[\"Normal input\", 1.0], [\"5-minute cache write\", 1.25], [\"1-hour cache write\", 2.0], [\"Cache read\", 0.1]]}\n```\n\n### Optimization levers\n\n| Lever | Typical effect |\n|---|---|\n| Prompt caching | Large savings on repeated system prompts and documents |\n| Model routing | Small models for easy requests |\n| Shorter retrieved context | Fewer input tokens |\n| Output limits | Fewer output tokens |\n| Batch API | Discount for asynchronous work |\n| Semantic caching | Skip calls for repeated questions |\n\n### Rule\n\nReport **cost per successful outcome**, not cost per call."}, {"id": 107, "title": "Structured outputs", "tldr": "Systems need machine-readable outputs. Use JSON schema-constrained generation or tool calls to guarantee format, validate with schemas, and handle refusals and edge cases. Structure makes LLMs composable with normal software.", "real": "OpenAI introduced Structured Outputs in August 2024 to guarantee responses match a supplied JSON schema, and other providers and open-source engines (via grammar-constrained decoding libraries such as XGrammar and Outlines) offer similar guarantees.", "body": "### Methods\n\n| Method | Guarantee |\n|---|---|\n| Prompt instructions only | None (usually works) |\n| JSON mode | Valid JSON, not schema |\n| Schema-constrained decoding | Valid against schema |\n| Tool / function calling | Arguments match tool schema |\n\n### Example schema\n\n```json\n{\n  \"type\": \"object\",\n  \"properties\": {\n    \"category\": {\"type\": \"string\", \"enum\": [\"billing\", \"technical\", \"account\", \"other\"]},\n    \"urgency\": {\"type\": \"integer\", \"minimum\": 1, \"maximum\": 5},\n    \"summary\": {\"type\": \"string\"}\n  },\n  \"required\": [\"category\", \"urgency\", \"summary\"]\n}\n```\n\n### Still validate\n\nSchemas guarantee shape, not truth. Validate values (IDs exist, amounts within limits) in code, and log invalid outputs for evaluation."}, {"id": 108, "title": "Function calling and tool use", "tldr": "Function calling lets an LLM request actions or data from your systems: it outputs a tool name and arguments, your code executes them and returns results. This connects LLMs to databases, APIs and other models, and is the foundation of agents.", "real": "OpenAI introduced function calling in June 2023, and Anthropic, Google and others followed with native tool use. The Model Context Protocol (2024) standardized how tools and data sources are exposed to AI applications.", "body": "### Flow\n\n```mermaid\nsequenceDiagram\n  participant U as User\n  participant A as App\n  participant M as LLM\n  participant T as Tool / API\n  U->>A: \"What's the status of order 1234?\"\n  A->>M: message + tool definitions\n  M->>A: call get_order_status(order_id=1234)\n  A->>T: execute with user's permissions\n  T->>A: {status: shipped, eta: Nov 18}\n  A->>M: tool result\n  M->>A: \"Your order shipped and should arrive Nov 18.\"\n  A->>U: answer\n```\n\n### Design rules\n\n| Rule | Why |\n|---|---|\n| Clear tool names and descriptions | Correct tool choice |\n| Strict argument schemas | Valid calls |\n| Authorization in code | Model cannot exceed user’s rights |\n| Concise tool results | Save context tokens |\n| Confirmation for risky actions | Safety |"}, {"id": 109, "title": "Hallucination and how systems handle it", "tldr": "LLMs can produce fluent but false statements. Systems reduce hallucinations with grounding (retrieval, tools), constrained tasks, citations, verification steps, abstention, and human review for high-stakes outputs.", "real": "In 2023, lawyers in the US case Mata v. Avianca were sanctioned after submitting a brief with fictitious case citations generated by ChatGPT. In 2024, a Canadian tribunal held Air Canada responsible for incorrect refund information given by its website chatbot.", "body": "### Causes\n\n| Cause | Example |\n|---|---|\n| Missing knowledge | Asked about private or recent facts |\n| Pressure to answer | Prompt implies an answer exists |\n| Weak grounding | Retrieved docs irrelevant |\n| Long reasoning chains | Errors compound |\n\n### Mitigations\n\n```mermaid\nflowchart LR\n  Q[Question] --> R[Retrieve sources]\n  R --> G[Generate with citations]\n  G --> V[Verify claims vs sources]\n  V -->|supported| OUT[Answer]\n  V -->|unsupported| ABS[Abstain or escalate]\n```\n\n| Mitigation | How |\n|---|---|\n| Grounding | RAG, tool calls for facts |\n| Citations | Link claims to sources |\n| Abstention | Allow “I don’t know” |\n| Verification | Second pass or checker model |\n| Constrained outputs | Choose from known options |\n| Human review | Legal, medical, financial content |"}, {"id": 110, "title": "Evaluating LLM outputs: the basics", "tldr": "LLM outputs are open-ended, so evaluation combines reference-based metrics, rubric-based grading by humans or LLM judges, task success checks, and online user signals. Build a representative test set before building the system.", "real": "LMSYS’s Chatbot Arena (now LMArena) ranks models using crowdsourced pairwise human preferences with an Elo-style rating system, while teams building products rely mainly on private, task-specific evaluation sets because public rankings rarely match their exact use case.", "body": "### Evaluation methods\n\n| Method | Use |\n|---|---|\n| Exact match / programmatic checks | Classification, extraction, code tests |\n| Reference metrics (BLEU, ROUGE) | Translation, summarization (limited) |\n| LLM-as-judge with rubric | Helpfulness, correctness, tone |\n| Human evaluation | Calibration, high-stakes quality |\n| Pairwise comparison | Choosing between versions |\n| Online metrics | Thumbs up/down, task completion, escalations |\n\n### Building a test set\n\n1. Collect 100–500 real or realistic inputs\n2. Cover common cases, edge cases and adversarial cases\n3. Write expected outcomes or grading rubrics\n4. Version the set; never train or tune on the held-out part\n\n### Metric examples\n\nCorrectness, groundedness, completeness, format validity, safety, latency and cost per task."}, {"id": 111, "title": "LLM inference engines", "tldr": "Inference engines run LLMs efficiently on GPUs with optimized kernels, batching and memory management. vLLM, SGLang, TensorRT-LLM and llama.cpp are the main options, each suited to different hardware and workloads.", "real": "vLLM began at UC Berkeley with the PagedAttention paper (SOSP 2023) and became one of the most widely used open-source serving engines; major cloud providers offer vLLM-based serving containers. SGLang came from the LMSYS team, and NVIDIA develops TensorRT-LLM.", "body": "### Engines\n\n| Engine | Strength | Typical use |\n|---|---|---|\n| vLLM | Broad model support, OpenAI-compatible API | General GPU serving |\n| SGLang | High performance, prefix caching (RadixAttention) | High-throughput, agents |\n| TensorRT-LLM | Peak NVIDIA performance | Large NVIDIA fleets |\n| llama.cpp / Ollama | CPU and edge, GGUF quantization | Local and small deployments |\n| Hosted APIs | No ops | Most applications |\n\n### Serving stack\n\n```mermaid\nflowchart LR\n  GW[LLM gateway] --> LB[Cache-aware load balancer]\n  LB --> E1[Engine replica 1]\n  LB --> E2[Engine replica 2]\n  E1 --> GPU1[GPUs]\n  E2 --> GPU2[GPUs]\n  E1 --> MET[(Metrics)]\n  E2 --> MET\n```\n\n### Selection criteria\n\nModel architecture support, hardware, throughput at your latency target, quantization formats, multi-LoRA support, observability and community activity."}, {"id": 112, "title": "Prefill, decode and the KV cache", "tldr": "LLM inference has two phases: prefill processes the prompt in parallel (compute-bound), decode generates tokens one by one (memory-bandwidth-bound). The KV cache stores attention state per token and often limits how many users fit on a GPU.", "real": "The vLLM team found that earlier serving systems wasted 60–80% of KV cache memory through fragmentation and over-reservation, which motivated PagedAttention’s block-based memory management (2023).", "body": "### Phases\n\n| Phase | Work | Bottleneck | Metric |\n|---|---|---|---|\n| Prefill | Whole prompt at once | Compute | Time to first token |\n| Decode | One token per step | Memory bandwidth | Time per output token |\n\n### KV cache size\n\n```\nKV bytes per token = 2 × layers × KV heads × head dimension × bytes per value\nLlama 3.1 8B (BF16): 2 × 32 × 8 × 128 × 2 = 128 KB per token\n```\n\n### KV cache per token by model (BF16)\n\n```chart\n{\"title\": \"KV cache per token\", \"unit\": \"KB\", \"data\": [[\"Llama 3.1 8B\", 128], [\"32B-class (64 layers, 8 KV heads)\", 256], [\"Llama 3.x 70B\", 320]]}\n```\n\n### Implication\n\nA 32K-token conversation on a 70B model needs about 10 GB of KV cache. Concurrency = free GPU memory ÷ (KV per token × tokens per user)."}, {"id": 113, "title": "Continuous batching and PagedAttention", "tldr": "Continuous batching lets new requests join and finished ones leave at every decode step, keeping GPUs busy. PagedAttention stores KV cache in small blocks allocated on demand, nearly eliminating memory waste and enabling sharing between requests.", "real": "The Orca paper (OSDI 2022) introduced iteration-level scheduling, and vLLM’s PagedAttention (2023) reported 2–4× higher throughput than prior state-of-the-art systems at the same latency. Both techniques are now standard in production engines.", "body": "### Static vs continuous batching\n\n```mermaid\nflowchart TB\n  subgraph Static\n    S1[Batch waits for longest request]\n  end\n  subgraph Continuous\n    C1[Step 1: A B C] --> C2[Step 5: A C D]\n    C2 --> C3[Step 9: A D E F]\n  end\n```\n\n### PagedAttention\n\n| OS concept | PagedAttention |\n|---|---|\n| Process | Request |\n| Virtual page | Logical KV block |\n| Physical frame | GPU memory block |\n| Page table | Block table |\n\n### Benefits\n\n- Near-zero fragmentation → more concurrent users\n- Shared blocks for common prefixes (prefix caching)\n- Efficient parallel sampling\n\n### Chunked prefill\n\nLong prompts are split into chunks interleaved with decode steps, so one huge prompt does not stall everyone’s streaming."}, {"id": 114, "title": "Quantization for LLM serving", "tldr": "Quantizing LLM weights (and sometimes activations and KV cache) to 8-bit or 4-bit precision cuts memory and speeds up decode, letting larger models fit on smaller GPUs or more users share one GPU, with small, measurable quality loss.", "real": "Meta released an official FP8 version of Llama 3.1 405B so it could be served on a single 8-GPU node, and Google released quantization-aware Gemma 3 models in 2025 that fit the 27B model on a single consumer GPU.", "body": "### Common formats\n\n| Format | Bits | Typical quality | Use |\n|---|---|---|---|\n| BF16 | 16 | Reference | Default |\n| FP8 | 8 | Near-lossless | Modern datacenter GPUs |\n| INT8 | 8 | Near-lossless | Older GPUs |\n| INT4 (AWQ, GPTQ) | 4 | Small loss | Smaller GPUs, high density |\n| GGUF k-quants | 2–8 | Varies | llama.cpp, local |\n\n### Effect on capacity (illustrative, 24 GB GPU, 8B model)\n\n```chart\n{\"title\": \"KV cache room left on a 24 GB GPU, 8B model\", \"unit\": \"GB\", \"data\": [[\"BF16 weights\", 4], [\"INT4 weights\", 14], [\"INT4 + FP8 KV cache (effective)\", 28]]}\n```\n\n(FP8 KV cache halves bytes per token, doubling effective capacity.)\n\n### Rule\n\nAlways evaluate quantized models on your tasks; loss varies by model, task and language."}, {"id": 115, "title": "Parallelism for large models", "tldr": "When a model does not fit one GPU, split it: tensor parallelism splits layers across GPUs in a node, pipeline parallelism splits layer groups across nodes, expert parallelism spreads MoE experts. Then add replicas for throughput.", "real": "DeepSeek described serving its large mixture-of-experts models with large-scale expert parallelism across many GPUs and separated prefill and decode stages, open-sourcing communication libraries such as DeepEP in 2025.", "body": "### Strategies\n\n| Strategy | Split | Needs |\n|---|---|---|\n| Tensor parallel (TP) | Matrices within layers | Fast intra-node links (NVLink) |\n| Pipeline parallel (PP) | Layer groups | Works across nodes |\n| Expert parallel (EP) | MoE experts | All-to-all communication |\n| Data parallel (replicas) | Whole model copies | Load balancer |\n\n### Decision flow\n\n```mermaid\nflowchart TD\n  A{Fits on 1 GPU with KV room?} -- yes --> R[1 GPU per replica, add replicas]\n  A -- no --> B{Fits in 1 node?}\n  B -- yes --> T[Smallest TP that fits, add replicas]\n  B -- no --> P[TP within node + PP across nodes; EP for MoE]\n```\n\n### Rule\n\nUse the smallest model split that fits with healthy KV cache room; scale throughput with replicas."}, {"id": 116, "title": "Prefix and prompt caching", "tldr": "Many requests share prefixes (system prompts, documents, conversation history). Caching their computed attention state lets later requests skip that work, cutting time to first token and cost. Design prompts with stable content first.", "real": "Anthropic launched prompt caching in 2024, saying it could reduce costs by up to 90% and latency by up to 85% for long prompts, and OpenAI applies automatic caching to repeated prompt prefixes. SGLang’s RadixAttention and vLLM’s automatic prefix caching do the same for self-hosted models.", "body": "### How it works\n\n```\nRequest 1: [system][docs][question A] → compute and cache [system][docs]\nRequest 2: [system][docs][question B] → reuse cached prefix, compute only question B\n```\n\n### Prompt design for caching\n\n| Do | Don’t |\n|---|---|\n| Static instructions first | Timestamps at the top |\n| Documents before the question | Shuffle tool definitions |\n| Append-only conversation | Edit earlier messages |\n\n### Where caching pays most\n\n| Use case | Shared prefix |\n|---|---|\n| Chat assistants | System prompt + history |\n| Document Q&A | Same document, many questions |\n| Agents | Tool definitions + growing history |\n| Few-shot classification | Same examples each call |\n\n### Routing\n\nWith multiple replicas, route requests with the same prefix to the same replica (cache-aware routing) to maximize hits."}, {"id": 117, "title": "Speculative decoding", "tldr": "A small draft method proposes several next tokens; the large model verifies them in one pass and keeps the correct ones. Output quality is unchanged, and latency drops when drafts are often accepted, especially at low batch sizes.", "real": "Google researchers introduced speculative decoding in 2022 and later wrote that it is used in products including AI Overviews in Google Search. DeepSeek-V3 included multi-token prediction modules that can serve as built-in draft heads.", "body": "### How it works\n\n```mermaid\nflowchart LR\n  D[Draft proposes 5 tokens] --> V[Target model verifies all 5 in one pass]\n  V --> A[Accept first 4]\n  V --> C[Correct the 5th]\n  A --> NEXT[Next round]\n  C --> NEXT\n```\n\n### Draft options\n\n| Draft | Notes |\n|---|---|\n| Small model of same family | Needs same tokenizer |\n| N-gram / prompt lookup | Free; great when output copies input |\n| Extra prediction heads (EAGLE, Medusa, MTP) | High acceptance rates |\n\n### When it helps\n\n| Situation | Benefit |\n|---|---|\n| Low concurrency, latency-sensitive | High |\n| Code editing, summarization (copying) | High |\n| Very high batch sizes | Low (GPU already busy) |"}, {"id": 118, "title": "Disaggregated prefill and decode", "tldr": "At large scale, run prefill and decode on separate GPU pools and transfer the KV cache between them. Each pool can use different hardware, batch sizes and parallelism, improving latency and utilization for mixed workloads.", "real": "Moonshot AI’s Mooncake, the KV-cache-centric serving system behind its Kimi assistant, won a best paper award at FAST 2025. NVIDIA Dynamo, the llm-d project and DeepSeek’s serving system also separate prefill and decode, building on research such as DistServe and Splitwise.", "body": "### Architecture\n\n```mermaid\nflowchart LR\n  REQ[Request] --> ROUTER[Global scheduler]\n  ROUTER --> PF[Prefill pool: compute-optimized]\n  PF -->|KV cache transfer| DC[Decode pool: memory-bandwidth-optimized]\n  DC --> STREAM[Stream tokens to user]\n  KVS[(Tiered KV cache: GPU, CPU, SSD)] --- PF\n  KVS --- DC\n```\n\n### Benefits and costs\n\n| Benefit | Cost |\n|---|---|\n| Long prompts don’t stall decoding | KV transfer bandwidth |\n| Independent scaling of each phase | More complex scheduling |\n| Hardware specialization | Needs fast networking |\n| Better cache reuse with KV store | Operational complexity |\n\n### When to consider\n\nLarge fleets with long prompts (RAG, agents) and strict latency targets; small deployments are better served by a standard engine with chunked prefill."}, {"id": 119, "title": "Serving fine-tuned variants with multi-LoRA", "tldr": "LoRA adapters are small sets of weights that customize a base model. Multi-LoRA serving loads one base model and many adapters, selecting the adapter per request, so one GPU pool can serve many customers or tasks.", "real": "The S-LoRA and Punica research systems (2023) showed thousands of adapters served from shared GPUs. Engines like vLLM and services such as Predibase’s LoRAX productized this, and cloud providers offer fine-tuned model hosting built on similar ideas.", "body": "### Architecture\n\n```mermaid\nflowchart LR\n  R1[Request: tenant A] --> S[Server with base model]\n  R2[Request: tenant B] --> S\n  S --> A1[Adapter A]\n  S --> A2[Adapter B]\n  STORE[(Adapter store)] --> S\n```\n\n### Economics (illustrative)\n\n| Approach | Memory for 20 fine-tunes of an 8B model |\n|---|---|\n| Separate full models | 20 × 16 GB = 320 GB |\n| Base + adapters | 16 GB + 20 × \\~50 MB ≈ 17 GB |\n\n### Design considerations\n\n- Adapter loading latency (cache hot adapters)\n- Max adapters per batch\n- Per-tenant evaluation and versioning\n- Isolation of tenant data in training"}, {"id": 120, "title": "LLM gateways and model routing", "tldr": "An LLM gateway is a single entry point for all model calls: authentication, quotas, routing between models and providers, fallbacks, caching, logging, cost tracking and policy enforcement. Routing sends each request to the cheapest model that can handle it.", "real": "OpenAI’s GPT-5, launched in August 2025, included a real-time router choosing between a fast model and a deeper reasoning model per request. LMSYS’s RouteLLM research (2024) showed that learned routers could cut costs substantially while preserving most of the quality of the strongest model.", "body": "### Gateway architecture\n\n```mermaid\nflowchart LR\n  APPS[Applications] --> GW[LLM gateway]\n  GW --> POL[Policy: auth, quotas, PII checks]\n  POL --> RT[Router]\n  RT --> M1[Small model]\n  RT --> M2[Large model]\n  RT --> M3[Self-hosted model]\n  RT -->|on failure| FB[Fallback provider]\n  GW --> OBS[(Logs, cost, traces)]\n  GW --> CACHE[(Response cache)]\n```\n\n### Routing strategies\n\n| Strategy | Example |\n|---|---|\n| Static by task | Classification → small model |\n| Learned router | Predict difficulty, pick model |\n| Cascade | Try small, escalate on low confidence |\n| Cost/latency-aware | Choose by budget and SLO |\n| Failover | Switch provider on errors |\n\n### Savings example\n\n```\n70% easy requests to a model 10× cheaper:\ncost = 0.7 × 0.1 + 0.3 × 1.0 = 0.37 of baseline (≈63% saved)\n```"}, {"id": 121, "title": "RAG architecture", "tldr": "Retrieval-augmented generation retrieves relevant information from your data and gives it to an LLM to ground its answer. It adds private and current knowledge without retraining, and supports citations. It has an offline ingestion path and an online query path.", "real": "The term RAG comes from a 2020 Facebook AI paper by Lewis and colleagues. Morgan Stanley Wealth Management built a GPT-4-based assistant in 2023 that let financial advisors query the firm’s large library of research and process documents, a widely cited early enterprise RAG deployment.", "body": "### Reference architecture\n\n```mermaid\nflowchart TB\n  subgraph Ingestion\n    SRC[Docs, wikis, tickets, PDFs] --> PARSE[Parse and clean]\n    PARSE --> CHUNK[Chunk]\n    CHUNK --> EMB[Embed]\n    EMB --> VDB[(Vector index)]\n    CHUNK --> KW[(Keyword index)]\n  end\n  subgraph Query\n    Q[User question] --> QR[Query rewrite]\n    QR --> RET[Hybrid retrieval]\n    RET --> RR[Rerank]\n    RR --> PROMPT[Build prompt with sources]\n    PROMPT --> LLM[LLM]\n    LLM --> ANS[Answer + citations]\n  end\n  VDB --> RET\n  KW --> RET\n```\n\n### Why RAG vs fine-tuning for knowledge\n\n| Need | RAG | Fine-tuning |\n|---|---|---|\n| Frequently changing facts | ✓ | Poor |\n| Citations | ✓ | Hard |\n| Access control per user | ✓ | Very hard |\n| Style or format adaptation | Limited | ✓ |"}, {"id": 122, "title": "Ingestion: parsing and chunking", "tldr": "Retrieval quality starts with ingestion: extract clean text from PDFs, HTML and slides, keep structure (headings, tables), split into chunks that are self-contained and sized for the embedding model, and attach metadata for filtering and citations.", "real": "Anthropic’s 2024 “contextual retrieval” technique prepends a short, model-generated description of each chunk’s place in its document before embedding, addressing a common chunking problem: chunks lose context such as which company or time period they refer to.", "body": "### Chunking strategies\n\n| Strategy | Strength | Weakness |\n|---|---|---|\n| Fixed size with overlap | Simple | Splits mid-thought |\n| Structure-aware (headings, sections) | Coherent chunks | Needs good parsing |\n| Semantic splitting | Topic boundaries | More compute |\n| Parent–child (small for search, large for context) | Precise retrieval + rich context | More storage |\n| Contextualized chunks | Better standalone meaning | Extra LLM cost at ingestion |\n\n### Metadata to store with each chunk\n\nSource, title, section path, URL, author, date, permissions, language, document version.\n\n### Typical starting point\n\n```\nChunk size: 300–800 tokens, overlap 10–20%\nKeep tables intact; convert to markdown\nInclude section heading in chunk text\n```\n\n### Ingestion pipeline needs\n\nIncremental updates, deletion handling, re-embedding on model change, and quality checks for empty or garbled text."}, {"id": 123, "title": "Embedding and indexing for RAG", "tldr": "Choose an embedding model by evaluation on your queries, index chunks in a vector store with metadata, and keep a keyword index for hybrid search. Plan for re-embedding when models change and for permission filters at query time.", "real": "Teams frequently start with pgvector inside PostgreSQL for RAG prototypes and move to dedicated vector databases (such as Milvus, Weaviate, Qdrant or Pinecone) or search engines with vector support (Elasticsearch, OpenSearch) as data volume and query rates grow.", "body": "### Indexing decisions\n\n| Decision | Options |\n|---|---|\n| Embedding model | API or open-source; multilingual if needed |\n| Index type | HNSW (default), IVF-PQ for very large scale |\n| Metadata filters | Tenant, permissions, date, document type |\n| Hybrid | BM25 index alongside vectors |\n| Updates | Streaming upserts vs nightly rebuild |\n\n### Capacity estimate\n\n```\n2M chunks × 1,024 dims × 4 bytes ≈ 8 GB of vectors (+ index overhead)\n```\n\n### Versioning\n\n```mermaid\nflowchart LR\n  E1[Embedding model v1] --> I1[(Index v1: live)]\n  E2[Embedding model v2] --> I2[(Index v2: building)]\n  I2 -->|evaluate, then switch alias| LIVE[Live alias]\n```\n\nNever mix vectors from different embedding models in one index."}, {"id": 124, "title": "Retrieval and reranking", "tldr": "Retrieve broadly, then rank precisely: hybrid search returns a few dozen to a hundred candidates, a reranker (cross-encoder) reorders them, and the top few go to the LLM. Filters enforce permissions and scope.", "real": "Anthropic reported in 2024 that adding contextual BM25 and reranking on top of contextual embeddings reduced top-20 retrieval failures by 67% compared with standard embeddings alone in its experiments.", "body": "### Two-stage retrieval\n\n```mermaid\nflowchart LR\n  Q[Query] --> H[Hybrid retrieval top 100]\n  H --> F[Permission and metadata filters]\n  F --> R[Reranker top 20]\n  R --> S[Select top 5–10 for context]\n```\n\n### Tuning parameters\n\n| Parameter | Trade-off |\n|---|---|\n| Candidates retrieved (k) | Recall vs latency |\n| Reranker cutoff | Precision vs context size |\n| Chunks in prompt | Coverage vs distraction and cost |\n| Similarity threshold | Avoid irrelevant context |\n\n### Measuring retrieval\n\nRecall@k (did we retrieve the needed chunk?), MRR, and context precision. Evaluate retrieval separately from generation so you know which part fails."}, {"id": 125, "title": "Query transformation", "tldr": "User questions are often vague, conversational or multi-part. Rewrite them into standalone queries, expand with synonyms, decompose complex questions, or generate hypothetical answers to search with (HyDE) before retrieval.", "real": "Search and assistant products commonly rewrite follow-up questions using conversation history before retrieval; for example, Perplexity-style answer engines and enterprise assistants convert “what about last year?” into a complete query including the subject from earlier turns.", "body": "### Techniques\n\n| Technique | Example |\n|---|---|\n| Conversational rewrite | “And for Germany?” → “VAT rules for e-books in Germany” |\n| Decomposition | “Compare plan A and B pricing and limits” → 2–4 sub-queries |\n| Expansion | Add synonyms, acronyms |\n| HyDE | Generate a hypothetical answer; embed and search with it |\n| Routing | Choose which index or tool to query |\n| Metadata extraction | “2024 policies” → filter year = 2024 |\n\n### Flow\n\n```mermaid\nflowchart LR\n  H[History + question] --> RW[LLM rewrite / decompose]\n  RW --> Q1[Sub-query 1]\n  RW --> Q2[Sub-query 2]\n  Q1 --> RET[Retrieval]\n  Q2 --> RET\n  RET --> MERGE[Merge and rerank]\n```\n\n### Cost note\n\nEach transformation adds an LLM call; use a small, fast model for rewriting."}, {"id": 126, "title": "Context assembly and citations", "tldr": "Assemble the prompt carefully: instructions, retrieved chunks with IDs and source info, then the question. Ask for citations to chunk IDs, keep context within budget, and order the most relevant material where the model attends best.", "real": "Answer engines such as Perplexity and features like Google’s AI Overviews display source links next to generated answers, making citations a core product feature that lets users verify claims.", "body": "### Prompt layout\n\n```text\n<instructions>\nAnswer using only the sources. Cite as [S1], [S2]. If not found, say so.\n<\/instructions>\n<sources>\n[S1] (HR Policy 2026, section 4.2) Employees may carry over up to 5 days…\n[S2] (FAQ, updated 2026-03) Carry-over requests must be filed by Jan 31…\n<\/sources>\n<question>How many leave days can I carry over and by when?<\/question>\n```\n\n### Context budget\n\n| Component | Budget example |\n|---|---|\n| Instructions | 500 tokens |\n| Sources | 4,000 tokens (5–8 chunks) |\n| History | 1,500 tokens |\n| Question | 200 tokens |\n\n### Citation verification\n\nCheck that cited IDs exist and that quoted or paraphrased claims appear in the cited chunks; flag answers with uncited claims."}, {"id": 127, "title": "Advanced RAG patterns", "tldr": "Beyond basic retrieve-then-generate: GraphRAG builds knowledge graphs for global questions, agentic RAG lets the model decide what to search iteratively, multi-hop retrieval chains searches, and long-context approaches load whole documents when feasible.", "real": "Microsoft Research released GraphRAG in 2024, which builds an entity graph and community summaries from documents to answer broad questions like “what are the main themes in this dataset?” that plain vector retrieval handles poorly.", "body": "### Patterns\n\n| Pattern | Best for | Cost |\n|---|---|---|\n| Basic RAG | Single-fact questions | Low |\n| Hybrid + rerank | Most production use | Low–medium |\n| Multi-hop | Questions needing several facts | Medium |\n| Agentic RAG | Open-ended research, tools + search | High |\n| GraphRAG | Global, thematic questions | High ingestion cost |\n| Long-context | Small corpora, whole-document reasoning | High per query |\n| SQL + RAG | Mixed structured and unstructured data | Medium |\n\n### Agentic RAG loop\n\n```mermaid\nflowchart LR\n  Q[Question] --> P[Plan searches]\n  P --> S[Search]\n  S --> R[Read results]\n  R --> D{Enough to answer?}\n  D -- no --> P\n  D -- yes --> A[Answer with citations]\n```\n\n### Choose by question type\n\nCollect real user questions, label them by type, and pick patterns that cover the most common types first."}, {"id": 128, "title": "Evaluating RAG systems", "tldr": "Evaluate retrieval and generation separately and together: retrieval recall and precision, answer faithfulness to sources, answer relevance, completeness and citation accuracy. Use a golden question set with reference answers and source documents.", "real": "The open-source RAGAS framework (2023) popularized metrics such as faithfulness, answer relevance, context precision and context recall, and evaluation platforms now ship RAG-specific evaluators built on LLM judges.", "body": "### Metrics\n\n| Layer | Metric | Question |\n|---|---|---|\n| Retrieval | Context recall | Was the needed information retrieved? |\n| Retrieval | Context precision | How much retrieved text was relevant? |\n| Generation | Faithfulness | Are claims supported by context? |\n| Generation | Answer relevance | Does it answer the question? |\n| Generation | Citation accuracy | Do citations support the claims? |\n| End to end | Correctness | Matches reference answer? |\n\n### Golden set\n\n| Field | Example |\n|---|---|\n| Question | “What is the refund window for annual plans?” |\n| Reference answer | “30 days from purchase” |\n| Source doc IDs | billing-policy#3 |\n| Type | Single-hop fact |\n\n### Diagnosis matrix\n\n| Retrieval OK? | Answer OK? | Problem |\n|---|---|---|\n| No | No | Fix retrieval |\n| Yes | No | Fix prompt / model |\n| No | Yes | Model used prior knowledge (risky) |"}, {"id": 129, "title": "Permission-aware and multi-tenant RAG", "tldr": "Enterprise RAG must return only documents the user may see. Store access metadata with chunks, filter at query time using the user’s identity and groups, keep permissions in sync, and isolate tenants. Never rely on the LLM to hide information.", "real": "Microsoft 365 Copilot retrieves only content the signed-in user can access, and early enterprise rollouts revealed oversharing problems where employees could suddenly find files that had been shared too broadly. Microsoft published oversharing and access-governance guidance in response.", "body": "### Pattern\n\n```mermaid\nflowchart LR\n  U[User identity + groups] --> FIL[Permission filter]\n  Q[Query] --> RET[Retrieval]\n  FIL --> RET\n  RET --> ALLOWED[Only permitted chunks]\n  ALLOWED --> LLM[LLM]\n  SYNC[ACL sync from sources] --> IDX[(Index with ACL metadata)]\n  IDX --> RET\n```\n\n### Rules\n\n| Rule | Why |\n|---|---|\n| Filter inside the retrieval query | The model never sees restricted text |\n| Sync ACL changes quickly | Revocations take effect |\n| Per-tenant namespaces | Prevent cross-customer leaks |\n| Audit logs of retrieved document IDs | Investigations |\n| Oversharing review before launch | RAG exposes existing permission mistakes |\n\n### Testing\n\nUse test accounts with different permissions and verify restricted documents never appear in retrieved context or answers."}, {"id": 130, "title": "Case study: enterprise knowledge assistant", "tldr": "An enterprise assistant connects to many sources (wiki, drive, tickets, chat), respects permissions, answers with citations, and routes some questions to tools or humans. Success depends on data hygiene, retrieval quality and evaluation more than on the model.", "real": "LinkedIn’s engineering team wrote in 2024 about building generative AI products, noting that reaching about 80% of the target quality came quickly, while the remaining improvements took most of the effort, a pattern common to enterprise assistants.", "body": "### End-to-end design\n\n```mermaid\nflowchart TB\n  CONN[Connectors: wiki, drive, tickets, chat] --> ING[Ingestion + ACL sync]\n  ING --> IDX[(Hybrid index)]\n  U[Employee question] --> GW[Gateway: auth, policy]\n  GW --> ORCH[Orchestrator]\n  ORCH --> RET[Permission-aware retrieval]\n  RET --> IDX\n  ORCH --> TOOLS[Tools: HR system, ticket API]\n  RET --> LLM[LLM with citations]\n  TOOLS --> LLM\n  LLM --> CHK[Guardrails: PII, groundedness]\n  CHK --> ANS[Answer]\n  ANS --> FB[Feedback + logs]\n  FB --> EVAL[Evaluation and improvements]\n```\n\n### Requirements snapshot\n\n| Requirement | Target |\n|---|---|\n| Users | 20,000 employees |\n| Latency | First token < 2 s |\n| Groundedness | ≥ 95% on golden set |\n| Permissions | Zero leaks in access tests |\n| Freshness | New docs searchable within 1 hour |\n\n### Rollout plan\n\nPilot with one department → measure answer quality and usage → expand sources → expand users."}, {"id": 131, "title": "Agent architecture", "tldr": "An agent is an LLM in a loop that decides which tools to call, observes results, and continues until a goal is met. Its system design includes the loop, tools, context management, memory, verification, permissions, budgets and observability.", "real": "Anthropic’s “Building effective agents” guide (December 2024) distinguished predefined workflows from autonomous agents and advised starting with the simplest pattern that works. OpenAI’s Agents SDK and Anthropic’s Claude Agent SDK (2025) package these loops for developers.", "body": "### Core loop\n\n```mermaid\nflowchart LR\n  G[Goal] --> M[LLM decides next step]\n  M -->|tool call| T[Execute tool]\n  T --> O[Observation]\n  O --> M\n  M -->|done| V[Verify result]\n  V -->|ok| OUT[Output]\n  V -->|not ok| M\n```\n\n### Components\n\n| Component | Responsibility |\n|---|---|\n| Orchestrator loop | Calls model, executes tools, enforces limits |\n| Tools | Actions and data access |\n| Context manager | What the model sees each step |\n| Memory | State across steps and sessions |\n| Verifier | Tests, validators, evaluators |\n| Guardrails | Permissions, approvals, policies |\n| Observability | Traces, cost, audit |\n\n### Workflows vs agents\n\n| Use a workflow when | Use an agent when |\n|---|---|\n| Steps are known | Steps depend on findings |\n| Determinism matters | Flexibility matters |\n| Latency must be low | Task is open-ended |"}, {"id": 132, "title": "Designing tools for agents", "tldr": "Tools are the agent’s interface to your systems. Design them for models: clear names and descriptions, strict schemas, task-shaped operations, concise and meaningful outputs, helpful errors, and server-side authorization.", "real": "Anthropic reported that when building its SWE-bench agent it spent more time optimizing tools than the overall prompt; for example, requiring absolute file paths eliminated a class of mistakes with relative paths.", "body": "### Tool design checklist\n\n- [ ] Name says what it does (`search_orders`, not `query`)\n- [ ] Description covers when to use and when not to\n- [ ] Typed parameters with enums, ranges and examples\n- [ ] Returns only what is needed for the next decision\n- [ ] Pagination or truncation for large results\n- [ ] Errors explain the cause and the fix\n- [ ] Authorization uses the end user’s identity\n- [ ] Idempotent where possible; dry-run for risky actions\n\n### Granularity\n\n| Too low-level | Task-shaped |\n|---|---|\n| list_users + list_events + create_event | schedule_meeting |\n| raw SQL tool | get_customer_summary(customer_id) |\n| http_request(url) | get_weather(city) |\n\n### Tool count\n\nMore tools increase confusion and context size. Curate per agent; use tool search or code execution when hundreds of tools exist."}, {"id": 133, "title": "Planning and control patterns", "tldr": "Common control patterns are ReAct (reason and act step by step), plan-then-execute (plan first, then run steps), orchestrator–workers (delegate subtasks), evaluator–optimizer (generate and critique), and routing. Choose by task predictability and risk.", "real": "The ReAct paper (2022) showed interleaving reasoning and actions improved LLM performance on interactive tasks. Coding agents such as Claude Code use visible todo lists and an optional plan mode in which the agent proposes a plan before making changes.", "body": "### Patterns\n\n| Pattern | Flow | Best for |\n|---|---|---|\n| ReAct | think → act → observe → repeat | Exploration |\n| Plan-then-execute | plan → approve → execute steps | Risky or long tasks |\n| Orchestrator–workers | lead splits work → workers → synthesize | Broad, parallel tasks |\n| Evaluator–optimizer | draft → critique → revise | Quality-sensitive outputs |\n| Router | classify → specialized handler | Mixed request types |\n\n### Plan-then-execute\n\n```mermaid\nflowchart LR\n  T[Task] --> P[Plan]\n  P --> H{Human approval?}\n  H -- approved --> E1[Step 1]\n  E1 --> E2[Step 2]\n  E2 --> E3[Step 3]\n  E3 --> V[Verify]\n  H -- edit --> P\n```\n\n### Stopping rules\n\nMax steps, max cost, max time, no-progress detection, and verified completion criteria."}, {"id": 134, "title": "Agent memory", "tldr": "Agents need working memory (context window), task state (plans, progress files), long-term memory (facts and preferences) and procedural memory (skills). Externalize state to files or stores so it survives context limits and sessions.", "real": "Anthropic’s 2025 guidance on long-running agents used a progress file, a feature list and git history so each new session could reconstruct state quickly. The Manus team described agents writing and updating a todo.md file to keep goals in recent context.", "body": "### Memory types\n\n| Type | Storage | Example |\n|---|---|---|\n| Working | Context window | Current conversation |\n| Task state | Files, DB | Plan, todo list, progress log |\n| Long-term semantic | Memory store, vector DB | User preferences, project facts |\n| Episodic | Logs, summaries | What happened last session |\n| Procedural | Skills, scripts | How to deploy, how to run tests |\n\n### Context management techniques\n\n| Technique | When |\n|---|---|\n| Compaction (summarize history) | Near context limit |\n| Clearing old tool results | Large outputs already used |\n| Just-in-time retrieval | Fetch details only when needed |\n| Subagents | Isolate exploration from main context |\n\n### Governance\n\nUsers can see and delete memories; memory writes from untrusted content are blocked or reviewed."}, {"id": 135, "title": "Multi-agent systems", "tldr": "Multiple agents can parallelize broad tasks and isolate contexts, but they consume many more tokens and can make inconsistent decisions. Use them for read-heavy, separable work such as research; keep tightly coupled work in one agent.", "real": "Anthropic reported in June 2025 that its multi-agent research system outperformed a single agent by 90.2% on an internal research evaluation but used about 15 times more tokens than a chat. Cognition argued in “Don’t Build Multi-Agents” that sharing full context matters to avoid conflicting decisions.", "body": "### Orchestrator–worker architecture\n\n```mermaid\nflowchart TB\n  U[User task] --> L[Lead agent: plan]\n  L --> W1[Worker 1: search area A]\n  L --> W2[Worker 2: search area B]\n  L --> W3[Worker 3: search area C]\n  W1 --> L2[Lead: synthesize]\n  W2 --> L2\n  W3 --> L2\n  L2 --> C[Citation / verification agent]\n  C --> OUT[Report]\n```\n\n### When to use\n\n| Good fit | Poor fit |\n|---|---|\n| Broad research | Single-codebase edits |\n| Independent subtasks | Tasks needing shared evolving context |\n| High-value queries | Cheap, simple queries |\n\n### Coordination rules\n\nClear delegation briefs, single writer for shared artifacts, structured outputs from workers, and verification of synthesized results."}, {"id": 136, "title": "Model Context Protocol and tool ecosystems", "tldr": "MCP standardizes how AI applications connect to tools, data and prompts through servers. It reduces integration work and lets one tool server serve many AI clients, but each server must be vetted for security and context cost.", "real": "Anthropic released MCP in November 2024, and it was adopted by OpenAI, Google, Microsoft and many developer tools. In December 2025 it was donated to the Linux Foundation’s new Agentic AI Foundation, which said more than 10,000 MCP servers had been published.", "body": "### Architecture\n\n```mermaid\nflowchart LR\n  HOST[AI application / host] --> CLIENT[MCP client]\n  CLIENT --> S1[MCP server: GitHub]\n  CLIENT --> S2[MCP server: database]\n  CLIENT --> S3[MCP server: internal APIs]\n  S1 --> API1[External API]\n  S2 --> DB[(Database)]\n  S3 --> SVC[Company services]\n```\n\n### Design considerations\n\n| Topic | Practice |\n|---|---|\n| Server selection | Approved registry, pinned versions |\n| Auth | OAuth per user with minimal scopes |\n| Context cost | Load only needed tools; tool search for large catalogs |\n| Security | Treat tool descriptions and results as untrusted |\n| Observability | Log every tool call |\n\n### Build your own server when\n\nYou want to expose internal capabilities to several AI clients (assistants, IDE agents, chatbots) through one maintained integration."}, {"id": 137, "title": "Long-running agents", "tldr": "Tasks that span hours or days exceed single context windows. Long-running agent designs use durable state (task lists, progress files, version control), incremental work per session, objective definitions of done, and outer loops with budgets.", "real": "Anthropic’s November 2025 post “Effective harnesses for long-running agents” described an initializer agent that sets up a feature list, a progress file and an init script, followed by coding sessions that each complete and verify one feature before committing.", "body": "### Session pattern\n\n```mermaid\nflowchart TB\n  INIT[Initializer: feature list, progress file, init script, first commit] --> S1[Session 1]\n  S1 --> S2[Session 2]\n  S2 --> S3[Session N]\n  S1 --> ART[(Artifacts: progress, features, git)]\n  S2 --> ART\n  S3 --> ART\n  ART --> S2\n  ART --> S3\n```\n\n### Each session\n\n1. Read progress file and git log\n2. Run smoke test\n3. Pick one unfinished item\n4. Implement and verify end to end\n5. Mark done only after verification; commit; update progress\n\n### Infrastructure\n\n| Need | Solution |\n|---|---|\n| Restart and resume | Durable workflow engine or job queue |\n| Isolation | Sandbox per task |\n| Limits | Max sessions, cost, time |\n| Oversight | Alerts on repeated failure |"}, {"id": 138, "title": "Computer-use and browser agents", "tldr": "Computer-use agents operate graphical interfaces through screenshots, clicks and typing, or through browser automation. They reach systems without APIs but are slower and riskier, needing isolation, confirmations and human takeover for sensitive steps.", "real": "Anthropic released computer use for Claude in October 2024, and OpenAI launched Operator in January 2025, later integrated into ChatGPT agent (July 2025), which asks users to confirm consequential actions and lets them take over for logins or payments.", "body": "### Architecture\n\n```mermaid\nflowchart LR\n  T[Task] --> A[Agent]\n  A --> SS[Take screenshot / read DOM]\n  SS --> A\n  A --> ACT[Click, type, navigate]\n  ACT --> VM[Isolated browser or VM]\n  A -->|sensitive step| H[Human confirmation / takeover]\n```\n\n### Design rules\n\n| Rule | Why |\n|---|---|\n| Isolated environment | Contain mistakes and attacks |\n| Prefer APIs when available | Faster, more reliable |\n| Confirm purchases, submissions, messages | Prevent costly errors |\n| Domain allowlists | Limit exposure |\n| Treat page content as untrusted | Prompt injection risk |\n\n### Reliability\n\nVerify each step’s result, handle pop-ups and timeouts, and convert successful repetitive flows into deterministic scripts."}, {"id": 139, "title": "Evaluating agents", "tldr": "Agent evaluation runs realistic tasks in reproducible environments, grades outcomes (not exact steps), uses multiple trials per task, and tracks reliability, cost, time and failure types. Public benchmarks help compare; private suites decide shipping.", "real": "Sierra’s tau-bench (2024) introduced the pass^k metric, the chance an agent succeeds on all k tries, revealing inconsistency hidden by single-run accuracy. SWE-bench Verified (2024) became the standard coding-agent benchmark with 500 human-validated GitHub issues.", "body": "### Benchmarks\n\n| Benchmark | Domain |\n|---|---|\n| SWE-bench Verified | Fixing real GitHub issues |\n| tau-bench | Customer-service tool use with policies |\n| OSWorld | Computer use |\n| GAIA | General assistant tasks |\n| Terminal-Bench | Command-line tasks |\n| BrowseComp | Hard web research |\n\n### Metrics\n\n| Metric | Meaning |\n|---|---|\n| Success rate | % tasks completed |\n| pass^k | Consistency across k trials |\n| Cost per task | Tokens and tools |\n| Steps / time | Efficiency |\n| Intervention rate | Human help needed |\n| Safety violations | Policy breaches |\n\n### Private suite\n\nBuild tasks from real tickets or workflows, with resettable environments and automatic success checks; add every production failure as a new task."}, {"id": 140, "title": "Case study: AI coding assistant", "tldr": "AI coding assistants combine fast inline completion with chat and autonomous agent modes. Their designs emphasize low-latency completion, repository context retrieval, sandboxed tool execution, verification with tests, and human review of changes.", "real": "GitHub Copilot launched in 2021 on OpenAI’s Codex model, and a 2022 GitHub study found developers completed a coding task 55% faster with Copilot. By 2025, Copilot, Cursor, Claude Code and OpenAI’s Codex offered agent modes that edit multiple files, run tests and open pull requests.", "body": "### Two modes, two designs\n\n| | Inline completion | Agent mode |\n|---|---|---|\n| Latency target | \\~100–300 ms | Minutes |\n| Model | Small, fast | Large, capable |\n| Context | Current file + nearby code | Repo search, docs, tools |\n| Output | Few lines | Multi-file changes, PRs |\n| Verification | Developer eyeballs | Tests, linters, CI |\n\n### Agent mode architecture\n\n```mermaid\nflowchart LR\n  TASK[Issue / request] --> AG[Agent loop]\n  AG --> CTX[Repo search, file reads, AGENTS.md]\n  AG --> SB[Sandbox: edit files, run commands]\n  SB --> TEST[Tests and linters]\n  TEST --> AG\n  AG --> PR[Pull request with summary]\n  PR --> REV[Human review + CI]\n```\n\n### Key design decisions\n\nPermission modes for shell commands, sandboxing, context retrieval strategy (search vs index), model choice per mode, and telemetry on acceptance rates."}, {"id": 141, "title": "Chat assistant architecture", "tldr": "A chat assistant manages conversations, assembles context (system prompt, history, memory, retrieved data), calls models with streaming, applies safety checks, stores history and collects feedback. Scale and safety shape most design choices.", "real": "Consumer assistants such as ChatGPT, Claude and Gemini share this broad architecture: authenticated sessions, conversation storage, model routing, tool use (search, code execution), content safety layers and streaming responses to web and mobile clients.", "body": "### Architecture\n\n```mermaid\nflowchart LR\n  C[Web / mobile client] --> GW[API gateway]\n  GW --> CS[Conversation service]\n  CS --> HIST[(Conversation store)]\n  CS --> MEM[(User memory)]\n  CS --> ORCH[Orchestrator]\n  ORCH --> SAFE1[Input safety]\n  SAFE1 --> LLM[Model router + LLM]\n  LLM --> TOOLS[Tools: search, code, files]\n  LLM --> SAFE2[Output safety]\n  SAFE2 -->|stream| C\n```\n\n### Key components\n\n| Component | Notes |\n|---|---|\n| Conversation store | Partitioned by user; supports search and deletion |\n| Context builder | Truncation and summarization of long histories |\n| Streaming | SSE or WebSockets |\n| Safety | Input and output classifiers |\n| Feedback | Thumbs up/down linked to traces |\n\n### Scale considerations\n\nRate limits per user tier, GPU capacity planning for peaks, graceful degradation to smaller models during overload."}, {"id": 142, "title": "Copilots embedded in products", "tldr": "Copilots embed AI inside an existing product, using its data and actions in context: drafting, summarizing, answering and taking actions. They need deep integration with the product’s permissions, data model and UI, plus clear user control.", "real": "Microsoft 365 Copilot grounds answers in a user’s emails, documents and meetings through Microsoft Graph while respecting existing permissions. Shopify Sidekick and Notion AI similarly act on the data inside their own products.", "body": "### Design pattern\n\n```mermaid\nflowchart LR\n  UI[Product UI context: current doc, selection] --> CO[Copilot service]\n  CO --> PERM[User permissions]\n  CO --> DATA[Product data APIs]\n  CO --> LLM[LLM]\n  LLM --> ACTIONS[Suggested actions]\n  ACTIONS --> CONFIRM[User confirms]\n  CONFIRM --> APPLY[Apply in product]\n```\n\n### Principles\n\n| Principle | Practice |\n|---|---|\n| Context-aware | Use what the user is looking at |\n| Permission-bound | Act with the user’s rights only |\n| Human in control | Suggest, preview, confirm |\n| Reversible | Undo for AI-applied changes |\n| Transparent | Show sources and what changed |\n\n### Metrics\n\nFeature adoption, acceptance rate of suggestions, edits after acceptance, time saved, and support tickets about AI behavior."}, {"id": 143, "title": "Summarization pipelines", "tldr": "Summarizing long or many documents requires chunking, map-reduce or hierarchical summarization, consistent formats, and faithfulness checks. Choose extractive, abstractive or structured summaries based on the use case.", "real": "Meeting tools such as Zoom AI Companion, Google Meet and Microsoft Teams generate meeting summaries and action items from transcripts, a high-volume summarization workload that depends on accurate speech recognition upstream.", "body": "### Approaches\n\n| Approach | When |\n|---|---|\n| Single call | Fits in context window |\n| Map-reduce | Many chunks; summarize each, then combine |\n| Hierarchical | Very long documents (chapters → book) |\n| Refine | Iteratively update summary chunk by chunk |\n| Structured | Fixed fields (decisions, action items, risks) |\n\n### Map-reduce flow\n\n```mermaid\nflowchart LR\n  DOC[Long document] --> C1[Chunk 1 summary]\n  DOC --> C2[Chunk 2 summary]\n  DOC --> C3[Chunk 3 summary]\n  C1 --> R[Combine and summarize]\n  C2 --> R\n  C3 --> R\n  R --> OUT[Final summary]\n```\n\n### Quality checks\n\nFaithfulness (no invented facts), coverage of key points, correct attribution (who said what), and consistent format. Spot-check with human review."}, {"id": 144, "title": "Document processing and extraction", "tldr": "Intelligent document processing turns PDFs, scans, forms and emails into structured data: OCR or vision models, layout understanding, LLM extraction into schemas, validation rules and human review for low-confidence fields.", "real": "Cloud services such as Google Document AI, Amazon Textract and Azure AI Document Intelligence provide OCR and form extraction, and many companies now add multimodal LLMs that read document images directly and output JSON matching a schema.", "body": "### Pipeline\n\n```mermaid\nflowchart LR\n  IN[Documents] --> CLS[Classify document type]\n  CLS --> OCR[OCR / vision model]\n  OCR --> EXT[LLM extraction to schema]\n  EXT --> VAL[Validation rules]\n  VAL -->|confident| SYS[Business system]\n  VAL -->|uncertain| HUM[Human review queue]\n  HUM --> SYS\n  HUM --> TRAIN[(Corrections for evaluation)]\n```\n\n### Validation rules examples\n\n| Field | Rule |\n|---|---|\n| Invoice total | Equals sum of line items + tax |\n| Date | Valid, not in future |\n| Tax ID | Matches format and checksum |\n| Vendor | Exists in vendor master data |\n\n### Metrics\n\nField-level accuracy, straight-through processing rate (no human touch), review time, and error cost."}, {"id": 145, "title": "Text-to-SQL and analytics assistants", "tldr": "Text-to-SQL lets users ask data questions in natural language. Good systems retrieve relevant tables and metric definitions, generate SQL with schema context, validate and run it safely with read-only permissions, and explain results with the query shown.", "real": "Uber described QueryGPT in 2024, an internal tool that generates SQL from natural language using retrieval over schema samples and table selection agents. Uber said it aimed to cut the time engineers and analysts spent writing queries.", "body": "### Architecture\n\n```mermaid\nflowchart LR\n  Q[Question] --> INTENT[Intent + domain routing]\n  INTENT --> SCHEMA[Retrieve tables, columns, metric definitions]\n  SCHEMA --> GEN[LLM generates SQL]\n  GEN --> CHECK[Parse, validate, allowlist tables]\n  CHECK --> RUN[Run with read-only role + limits]\n  RUN --> EXPLAIN[Answer + SQL + chart]\n  RUN -->|error| GEN\n```\n\n### Safety and quality\n\n| Concern | Control |\n|---|---|\n| Destructive SQL | Read-only role, SELECT-only parser check |\n| Unauthorized data | Row-level security, curated views |\n| Wrong metric definitions | Semantic layer, examples |\n| Expensive queries | Timeouts, row limits, cost estimates |\n| Trust | Show SQL and assumptions |\n\n### Evaluation\n\nA golden set of questions with correct SQL or correct result tables; compare results, not SQL text."}, {"id": 146, "title": "Customer support automation", "tldr": "AI support systems answer common questions from knowledge bases, take simple actions (order status, refunds within limits), and escalate to humans with full context. Policies must be enforced in code, and quality measured on resolution and customer satisfaction.", "real": "Klarna reported in February 2024 that its AI assistant handled two-thirds of customer service chats in its first month. In 2025 the company emphasized that customers should always be able to reach a human, a common balance in support automation.", "body": "### Architecture\n\n```mermaid\nflowchart LR\n  CUST[Customer] --> BOT[Support agent]\n  BOT --> KB[Knowledge base RAG]\n  BOT --> ACT[Tools: orders, refunds, account]\n  ACT --> POL[Policy engine: limits, eligibility]\n  BOT -->|escalate| HUMAN[Human agent with summary]\n  BOT --> QA[Conversation QA and analytics]\n```\n\n### Escalation triggers\n\n| Trigger | Example |\n|---|---|\n| Customer request | “Talk to a person” |\n| Policy exception | Refund above limit |\n| Low confidence | Repeated misunderstanding |\n| Sensitive topics | Legal threats, distress |\n| VIP / high-value | Business rules |\n\n### Metrics\n\nResolution rate, escalation rate, CSAT, repeat-contact rate, policy violations, cost per resolved conversation."}, {"id": 147, "title": "Content generation pipelines", "tldr": "Generating marketing copy, product descriptions or reports at scale needs templates, brand and style guidance, factual grounding in product data, automated checks (claims, banned words, length), human review for published content, and A/B testing.", "real": "Duolingo used GPT-4 in 2023 for Duolingo Max features such as “Explain My Answer” and roleplay conversations, with its content team reviewing AI-generated material. E-commerce platforms commonly generate product descriptions from structured catalog attributes.", "body": "### Pipeline\n\n```mermaid\nflowchart LR\n  DATA[Structured data: product attributes] --> PROMPT[Template + brand guide]\n  PROMPT --> GEN[LLM generation]\n  GEN --> CHECKS[Automated checks]\n  CHECKS -->|pass| REVIEW[Human review sample or all]\n  CHECKS -->|fail| GEN\n  REVIEW --> PUB[Publish]\n  PUB --> AB[A/B test performance]\n```\n\n### Automated checks\n\n| Check | Example |\n|---|---|\n| Factual consistency | Mentions only attributes present in data |\n| Claims | No unapproved health or legal claims |\n| Brand | Tone, banned terms |\n| Format | Length, structure, language |\n| Duplicates | Avoid near-identical texts |\n\n### Scale\n\nUse batch APIs for bulk generation, cache by input hash, and track cost per published item."}, {"id": 148, "title": "Real-time voice agents", "tldr": "Voice agents either chain speech-to-text, an LLM and text-to-speech, or use speech-to-speech models. Design around end-to-end latency under about a second, interruption handling, turn detection, telephony integration and safe actions.", "real": "OpenAI launched its Realtime API in October 2024 for low-latency speech-to-speech applications, and companies building phone agents commonly combine streaming speech recognition, LLMs and streaming speech synthesis over WebRTC or telephony connections.", "body": "### Two architectures\n\n| Architecture | Pros | Cons |\n|---|---|---|\n| Cascaded (STT → LLM → TTS) | Modular, text logs, any LLM | More latency, loses tone |\n| Speech-to-speech model | Lower latency, natural prosody | Less control, fewer model choices |\n\n### Cascaded pipeline\n\n```mermaid\nflowchart LR\n  MIC[Caller audio] --> VAD[Voice activity / turn detection]\n  VAD --> STT[Streaming speech-to-text]\n  STT --> LLM[LLM with tools]\n  LLM --> TTS[Streaming text-to-speech]\n  TTS --> SPK[Caller hears response]\n  MIC -->|barge-in| STOPTTS[Stop speaking]\n```\n\n### Latency budget (target under \\~1 s to first audio)\n\n| Stage | Target |\n|---|---|\n| Turn detection | 200–400 ms |\n| STT final | 100–200 ms |\n| LLM first token | 200–400 ms |\n| TTS first audio | 100–200 ms |"}, {"id": 149, "title": "Multimodal applications", "tldr": "Multimodal systems understand or generate images, audio, video and documents alongside text. Design for preprocessing (resizing, frame sampling), token and cost implications of media, storage, moderation of generated media, and provenance.", "real": "Be My Eyes integrated GPT-4 vision in 2023 to describe surroundings for blind and low-vision users, an early high-impact multimodal application. Image generation services such as Adobe Firefly attach Content Credentials (C2PA) to indicate AI-generated images.", "body": "### Input pipelines\n\n| Modality | Preprocessing |\n|---|---|\n| Images | Resize, compress, crop regions of interest |\n| Documents | Render pages, OCR, layout |\n| Audio | Transcribe or send audio tokens |\n| Video | Sample frames, transcribe audio track |\n\n### Generation pipelines\n\n```mermaid\nflowchart LR\n  P[Prompt] --> SAFE[Prompt safety]\n  SAFE --> GEN[Image / video model]\n  GEN --> MOD[Output moderation]\n  MOD --> PROV[Add provenance metadata / watermark]\n  PROV --> STORE[(Object storage + CDN)]\n```\n\n### Cost and latency\n\nImages and video consume many tokens or GPU-seconds; cache results, limit resolution, and use asynchronous jobs for long generations."}, {"id": 150, "title": "Choosing the right LLM application pattern", "tldr": "Match patterns to problems: a single prompt for simple transformations, RAG for knowledge, tools for actions, workflows for predictable processes, agents for open-ended tasks, and fine-tuning for style or narrow skills. Combine patterns deliberately.", "real": "Across published case studies (Morgan Stanley’s knowledge assistant, Klarna’s support agent, Uber’s QueryGPT, GitHub Copilot), the winning designs combine retrieval, tools and workflow structure around the model rather than relying on the model alone.", "body": "### Decision guide\n\n```mermaid\nflowchart TD\n  A{Needs private or current knowledge?} -- yes --> RAG[RAG]\n  A -- no --> B{Needs actions in systems?}\n  RAG --> B\n  B -- yes --> T{Steps predictable?}\n  T -- yes --> WF[Workflow with tool calls]\n  T -- no --> AG[Agent]\n  B -- no --> C{Consistent style or narrow skill at scale?}\n  C -- yes --> FT[Fine-tune or distill]\n  C -- no --> P[Prompt + structured output]\n```\n\n### Pattern summary\n\n| Pattern | Typical use |\n|---|---|\n| Prompt + schema | Classification, extraction, rewriting |\n| RAG | Q&A over documents |\n| Tool calling | Lookups and actions |\n| Workflow | Document pipelines, approvals |\n| Agent | Research, coding, complex support |\n| Fine-tuning | Tone, domain format, cost reduction |"}, {"id": 151, "title": "Eval-driven development", "tldr": "Build the evaluation set before the system, and run it on every change: prompts, models, retrieval, tools. Evals turn subjective quality into numbers that gate releases and guide improvements, just as tests do for code.", "real": "OpenAI open-sourced its Evals framework in 2023, and tools such as promptfoo, Braintrust and LangSmith provide eval suites in CI. Teams that publish lessons from LLM products, such as LinkedIn’s 2024 write-up, consistently highlight evaluation as the hardest and most important part.", "body": "### Loop\n\n```mermaid\nflowchart LR\n  D[Define tasks + criteria] --> B[Build eval set]\n  B --> S[Build / change system]\n  S --> R[Run evals]\n  R --> A[Analyze failures]\n  A --> S\n  R -->|meets bar| SHIP[Ship + monitor]\n  SHIP --> PF[Production failures]\n  PF --> B\n```\n\n### Eval set composition\n\n| Share | Content |\n|---|---|\n| \\~60% | Common real requests |\n| \\~25% | Edge cases and hard cases |\n| \\~15% | Adversarial and safety cases |\n\n### Release gates (example)\n\n| Metric | Gate |\n|---|---|\n| Task success | ≥ baseline |\n| Safety tests | 100% pass |\n| Format validity | ≥ 99.5% |\n| Cost per task | ≤ baseline + 10% |\n| p95 latency | ≤ target |"}, {"id": 152, "title": "LLM-as-judge", "tldr": "An LLM judge grades outputs against a rubric, scaling evaluation beyond human capacity. Make judges reliable with clear rubrics, reference answers, pairwise comparisons, bias controls, and regular calibration against human labels.", "real": "The 2023 paper “Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena” (Zheng et al.) found strong LLM judges agreed with human preferences at rates similar to human–human agreement, while documenting biases such as position bias and verbosity bias.", "body": "### Judge design\n\n| Element | Practice |\n|---|---|\n| Rubric | Specific criteria with score definitions |\n| Reference | Include gold answer when available |\n| Format | Structured output: score + reasoning |\n| Pairwise | Compare A vs B; swap order to reduce position bias |\n| Model | Strong model, different from the one being judged when possible |\n\n### Known biases\n\n| Bias | Mitigation |\n|---|---|\n| Position bias | Randomize or swap order |\n| Verbosity bias | Penalize unnecessary length in rubric |\n| Self-preference | Use a different model family |\n| Leniency | Calibrate thresholds with human labels |\n\n### Calibration\n\nLabel 100–200 examples by humans, measure judge agreement (accuracy, Cohen’s kappa), refine rubric until agreement is acceptable, then recheck periodically."}, {"id": 153, "title": "Guardrails architecture", "tldr": "Guardrails check inputs, retrieved content, tool calls and outputs against policies: safety, privacy, topic scope, format and business rules. Use deterministic rules for hard limits and classifiers or LLMs for nuanced checks, placed at each boundary.", "real": "NVIDIA NeMo Guardrails, Meta’s Llama Guard classifiers, Azure AI Content Safety (including Prompt Shields) and the OpenAI Agents SDK’s guardrails are widely used building blocks for production guardrail layers.", "body": "### Placement\n\n```mermaid\nflowchart LR\n  IN[User input] --> G1[Input guardrails]\n  G1 --> APP[Orchestrator]\n  DOCS[Retrieved content] --> G2[Content scanning]\n  G2 --> APP\n  APP --> LLM[LLM]\n  LLM --> G3[Tool-call guardrails]\n  G3 --> TOOLS[Tools]\n  LLM --> G4[Output guardrails]\n  G4 --> USER[User]\n```\n\n### Guardrail types\n\n| Type | Example | Implementation |\n|---|---|---|\n| Safety | Harmful content | Classifier |\n| Scope | Off-topic requests | Classifier / rules |\n| Privacy | PII in output | Pattern + NER |\n| Injection | Instructions in documents | Classifier |\n| Business | Refund ≤ $100 | Code |\n| Format | Schema validity | Code |\n\n### Trade-off\n\nEach guardrail adds latency and false positives. Run independent checks in parallel and measure over-blocking on real traffic."}, {"id": 154, "title": "Prompt injection defense in system design", "tldr": "Any text an LLM reads can try to override instructions. Defense is architectural: least-privilege tools, separation of untrusted content from privileged actions, blocking exfiltration channels, human approval for sensitive actions, and monitoring.", "real": "In 2025, Aim Security disclosed “EchoLeak” (CVE-2025-32711), a zero-click prompt injection in Microsoft 365 Copilot that could cause data exfiltration through a crafted email; Microsoft fixed it server-side. Simon Willison’s “lethal trifecta” (private data, untrusted content, external communication) summarizes the risk.", "body": "### The lethal trifecta\n\n```mermaid\nflowchart TB\n  P[Private data access] --> R[High risk if all three combine]\n  U[Untrusted content exposure] --> R\n  E[External communication ability] --> R\n```\n\n### Defenses\n\n| Layer | Defense |\n|---|---|\n| Architecture | Untrusted content processed by components without powerful tools |\n| Privileges | Scoped, user-bound credentials |\n| Exfiltration | Block external images/links by default; egress allowlists |\n| Actions | Human confirmation for external or irreversible actions |\n| Detection | Injection classifiers on retrieved content |\n| Monitoring | Alerts on unusual tool sequences |\n\n### Design test\n\nAssume the model is fully controlled by an attacker. What data could leave and what actions could run? Reduce that list until acceptable."}, {"id": 155, "title": "PII and data protection in LLM systems", "tldr": "LLM systems process prompts, documents and logs that may contain personal data. Minimize, redact or pseudonymize before sending to models, choose providers with appropriate data terms, protect logs, and support deletion.", "real": "In April 2023, Samsung restricted employee use of generative AI tools after reports that engineers had pasted confidential source code into ChatGPT. Enterprise offerings from major providers now commit not to train on business customers’ data by default.", "body": "### Controls\n\n| Stage | Control |\n|---|---|\n| Input | PII detection, redaction or tokenization |\n| Provider | Enterprise terms, no training on data, retention limits, region |\n| Retrieval | Permission-aware access |\n| Output | PII leakage checks |\n| Logs | Redaction, encryption, retention, access control |\n| Deletion | Remove from stores, indexes, caches |\n\n### Pseudonymization flow\n\n```mermaid\nflowchart LR\n  T[Text with PII] --> DET[Detect entities]\n  DET --> TOK[Replace with tokens: PERSON_1, EMAIL_1]\n  TOK --> LLM[LLM]\n  LLM --> DETOK[Restore values for authorized user]\n  VAULT[(Token vault)] --- TOK\n  VAULT --- DETOK\n```\n\n### Tooling\n\nMicrosoft Presidio and cloud DLP services detect common PII types; evaluate recall on your own data and languages."}, {"id": 156, "title": "Content moderation for generative AI", "tldr": "Generative systems must prevent harmful outputs and abuse: classify prompts and outputs by policy category, handle borderline cases thoughtfully, rate-limit abusers, and keep humans reviewing samples and appeals. Policies must be explicit and versioned.", "real": "In January 2024, parcel company DPD disabled part of its AI customer chatbot after a user prompted it to swear and write a poem criticizing the company, and screenshots went viral. Output moderation and topic restriction are what prevent such incidents.", "body": "### Policy table (example)\n\n| Category | Action |\n|---|---|\n| Illegal content | Block, report where required |\n| Violence, hate, harassment | Block or safe-complete |\n| Self-harm | Supportive response, resources |\n| Sexual content | Block or restrict by product policy |\n| Off-topic for product | Polite redirect |\n| Brand-damaging content | Refuse |\n\n### Moderation pipeline\n\n```mermaid\nflowchart LR\n  P[Prompt] --> C1[Prompt classifier]\n  C1 --> LLM[Model]\n  LLM --> C2[Output classifier]\n  C2 -->|allowed| OUT[User]\n  C2 -->|blocked| SAFE[Safe response]\n  C2 --> LOG[(Logs + review sampling)]\n```\n\n### Measure\n\nViolation rate, false-block rate on benign traffic, latency added, and reviewer agreement."}, {"id": 157, "title": "Hallucination mitigation in production", "tldr": "Reduce hallucinations by grounding answers in retrieved sources and tools, constraining outputs, requiring citations, verifying claims, allowing abstention, and routing high-stakes answers to humans. Measure groundedness continuously.", "real": "Air Canada was held liable in 2024 (Moffatt v. Air Canada) for a bereavement-fare policy its chatbot described incorrectly. The case is often cited to show that companies are responsible for AI-generated statements to customers.", "body": "### Layered mitigation\n\n| Layer | Technique |\n|---|---|\n| Data | Retrieve authoritative, current sources |\n| Prompt | Answer only from sources; say “I don’t know” otherwise |\n| Output | Require citations per claim |\n| Verification | Checker model compares claims to sources |\n| Product | Show sources; disclaimers where appropriate |\n| Process | Human review for policy, legal, medical outputs |\n\n### Verification step\n\n```mermaid\nflowchart LR\n  A[Draft answer] --> SPLIT[Split into claims]\n  SPLIT --> CHECK[Check each claim against sources]\n  CHECK -->|all supported| OK[Send]\n  CHECK -->|unsupported| FIX[Remove claim or abstain]\n```\n\n### Groundedness metric\n\n% of answer claims supported by cited sources, measured on samples with an LLM judge plus human audit."}, {"id": 158, "title": "Human-in-the-loop systems", "tldr": "Humans review, approve or correct AI outputs where errors are costly or confidence is low. Design review queues, confidence thresholds, reviewer tools and feedback capture so human work also improves the system over time.", "real": "Content moderation at large platforms combines automated classifiers with large teams of human reviewers for uncertain cases and appeals, and document-processing systems in banking and insurance route low-confidence extractions to human review queues.", "body": "### Routing by confidence\n\n```mermaid\nflowchart LR\n  AI[AI output + confidence] --> D{Confidence and risk}\n  D -->|high confidence, low risk| AUTO[Automatic]\n  D -->|medium| REVIEW[Human review queue]\n  D -->|high risk| APPROVE[Mandatory approval]\n  REVIEW --> FEED[(Corrections dataset)]\n  APPROVE --> FEED\n```\n\n### Reviewer tooling\n\n| Feature | Why |\n|---|---|\n| Show sources and reasoning | Faster decisions |\n| Highlight uncertain fields | Focus attention |\n| One-click accept / edit / reject | Efficiency |\n| Capture reasons | Training and evaluation data |\n| Workload balancing | Avoid fatigue |\n\n### Metrics\n\nShare of automated decisions, reviewer throughput, override rate, and error rate after review."}, {"id": 159, "title": "Red teaming AI systems", "tldr": "Red teaming attacks your AI system before others do: jailbreaks, prompt injection, data leakage, tool misuse, harmful content and abuse. Combine automated scanners with expert humans, report reproducible findings, and add them to regression tests.", "real": "Microsoft’s AI Red Team, formed in 2018, published lessons from red-teaming more than 100 generative AI products in 2025. At DEF CON 31 in 2023, thousands of participants red-teamed models from leading AI companies in a White House-supported exercise.", "body": "### Scope\n\n| Area | Example tests |\n|---|---|\n| Jailbreaks | Policy bypass attempts |\n| Prompt injection | Instructions in documents, web pages, tool outputs |\n| Data leakage | System prompt, PII, cross-tenant data |\n| Tool misuse | Unauthorized actions |\n| Output handling | XSS, code execution |\n| Abuse and cost | Rate limits, runaway loops |\n\n### Process\n\n```mermaid\nflowchart LR\n  SCOPE[Scope + threat model] --> PLAN[Test plan]\n  PLAN --> AUTO[Automated scans: garak, PyRIT, promptfoo]\n  PLAN --> MAN[Manual expert testing]\n  AUTO --> TRI[Triage by impact]\n  MAN --> TRI\n  TRI --> FIX[Fixes]\n  FIX --> REG[Regression suite]\n```\n\n### Reporting\n\nInputs, model and version, success rate across retries, impact, and recommended fix."}, {"id": 160, "title": "Responsible AI governance", "tldr": "Responsible AI governance sets policies, roles and processes so AI systems are lawful, fair, safe and accountable: risk classification, impact assessments, documentation, approvals, monitoring and incident handling, aligned with frameworks and regulations.", "real": "The NIST AI Risk Management Framework (2023) organizes AI risk work into Govern, Map, Measure and Manage. ISO/IEC 42001 (2023) defines a certifiable AI management system, and the EU AI Act imposes obligations on high-risk systems and general-purpose AI models.", "body": "### Governance building blocks\n\n| Block | Content |\n|---|---|\n| AI inventory | All AI systems, owners, risk levels |\n| Policies | Acceptable use, data use, human oversight |\n| Risk classification | Low / medium / high by impact |\n| Impact assessments | Before launch for high-risk uses |\n| Documentation | Model cards, system cards |\n| Approvals | Review boards for high-risk systems |\n| Monitoring | Quality, fairness, incidents |\n| Training | Staff awareness |\n\n### Lifecycle gates\n\n```mermaid\nflowchart LR\n  IDEA[Use case intake] --> RISK[Risk classification]\n  RISK --> ASSESS[Impact assessment]\n  ASSESS --> BUILD[Build + evaluate]\n  BUILD --> REVIEW[Governance review]\n  REVIEW --> LAUNCH[Launch]\n  LAUNCH --> MON[Monitor + periodic review]\n```\n\n### Frameworks to map to\n\nNIST AI RMF, ISO/IEC 42001, EU AI Act requirements, and sector rules (finance, health)."}, {"id": 161, "title": "Capacity planning for LLM workloads", "tldr": "Plan LLM capacity from traffic (requests per second), token profile (input and output lengths), latency targets and model throughput measured by benchmarks. Little’s Law converts traffic into concurrency; KV cache memory sets per-replica limits.", "real": "Teams self-hosting models commonly benchmark with tools such as vLLM’s benchmark suite, NVIDIA GenAI-Perf or guidellm to find the throughput a replica sustains at their latency target before sizing a fleet, rather than relying on vendor peak numbers.", "body": "### Formulas\n\n```\nConcurrent requests = arrival rate (req/s) × average duration (s)          (Little's Law)\nReplica concurrency  ≈ min(KV cache capacity ÷ tokens per request, latency-SLO limit from benchmark)\nReplicas             = ceil(peak concurrency ÷ replica concurrency) × headroom (1.2–1.3) + 1 spare\n```\n\n### Worked example\n\n| Input | Value |\n|---|---|\n| Peak arrival | 20 req/s |\n| Avg duration | 8 s |\n| Peak concurrency | 160 |\n| Per-replica limit (benchmarked) | 40 |\n| Replicas | 160 ÷ 40 = 4 → ×1.25 = 5 → + 1 spare = 6 |\n\n### Benchmark first\n\nMeasure TTFT and tokens/s at increasing concurrency with realistic prompt and output lengths; choose the highest concurrency that meets the SLO."}, {"id": 162, "title": "Multi-region deployment and failover", "tldr": "Critical AI services run in multiple regions or zones so a single failure does not take them down. Design for data replication, region-aware routing, capacity headroom in each region, and tested failover, while respecting data residency.", "real": "On 20 October 2025, a major AWS outage in the us-east-1 region, t

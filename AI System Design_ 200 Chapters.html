riggered by a DNS issue affecting DynamoDB, disrupted many online services for hours. Services designed with multi-region failover were better able to keep running.", "body": "### Topologies\n\n| Topology | Description | Trade-off |\n|---|---|---|\n| Active–passive | Standby region takes over | Cheaper, slower failover |\n| Active–active | All regions serve traffic | Faster, more costly, data sync complexity |\n| Region-pinned | Users served in their region | Data residency, less flexible |\n\n### Architecture\n\n```mermaid\nflowchart TB\n  DNS[Global load balancer / geo DNS] --> R1[Region A: app + models + stores]\n  DNS --> R2[Region B: app + models + stores]\n  R1 <-->|replication| R2\n  R1 --> P1[Provider endpoint A]\n  R2 --> P2[Provider endpoint B]\n```\n\n### AI-specific concerns\n\n| Concern | Approach |\n|---|---|\n| GPU capacity per region | Reserve headroom for failover |\n| Vector index replication | Async replication, freshness lag |\n| Model versions | Same version across regions |\n| Provider regions | Use multiple provider regions or providers |\n| Data residency | Region-pinned stores where required |"}, {"id": 163, "title": "Provider redundancy and fallbacks", "tldr": "Depending on one model provider is a single point of failure. Use a gateway that can fail over to another provider or a self-hosted model, keep prompts and evals portable, and define degraded modes when no model is available.", "real": "OpenAI’s December 2024 outage, caused by a new telemetry service overwhelming Kubernetes control planes according to its postmortem, took ChatGPT and the API down for several hours. Applications with fallback providers or degraded modes stayed partially available.", "body": "### Fallback chain\n\n```mermaid\nflowchart LR\n  REQ[Request] --> P1[Primary model]\n  P1 -->|error / timeout| P2[Secondary provider]\n  P2 -->|error| P3[Self-hosted model]\n  P3 -->|error| DEG[Degraded mode: cached answer, search results, human handoff]\n```\n\n### Portability requirements\n\n| Requirement | Why |\n|---|---|\n| Model-agnostic gateway | Switch quickly |\n| Prompts tested per model | Behavior differs |\n| Eval suite runs on all candidates | Know fallback quality |\n| Tool schemas in standard JSON Schema | Portable tool calling |\n| Contracts and quotas with backups | Capacity when needed |\n\n### Circuit breakers\n\nStop sending traffic to a failing provider after an error threshold; probe periodically before restoring."}, {"id": 164, "title": "Caching strategies for LLM applications", "tldr": "Cache at several levels: exact-match response caches for repeated requests, semantic caches for similar questions, provider prompt caching for shared prefixes, and caches for embeddings and retrieval results. Guard against serving stale or personalized answers to the wrong users.", "real": "Zilliz released GPTCache, an open-source semantic cache for LLM responses, in 2023, and gateways such as Cloudflare AI Gateway offer response caching. Provider-side prompt caching (Anthropic, OpenAI, Google) reduces cost for repeated prompt prefixes.", "body": "### Cache layers\n\n| Layer | Key | Use |\n|---|---|---|\n| Exact response cache | Hash of normalized prompt + model | FAQs, deterministic tasks |\n| Semantic cache | Embedding similarity of query | Similar questions |\n| Prompt / KV cache | Shared prefix | Long system prompts, documents |\n| Embedding cache | Text hash + embedding model | Re-ingestion, repeated queries |\n| Retrieval cache | Query + index version | Popular searches |\n\n### Semantic cache flow\n\n```mermaid\nflowchart LR\n  Q[Query] --> E[Embed]\n  E --> S{Similar cached query above threshold?}\n  S -- yes --> HIT[Return cached answer]\n  S -- no --> LLM[Call LLM]\n  LLM --> STORE[Store answer + embedding]\n```\n\n### Risks\n\nWrong answers for subtly different questions (threshold too low), stale content after document updates (include index version in keys), and leaking personalized answers (never share caches across users for personalized content)."}, {"id": 165, "title": "Quotas, rate limits and fairness for AI platforms", "tldr": "AI platforms meter tokens, not just requests. Apply per-user, per-team and per-tenant quotas on requests and tokens, priority classes for interactive vs batch work, and clear 429 responses, so one heavy user cannot starve others or the budget.", "real": "OpenAI and Anthropic publish tiered rate limits measured in requests and tokens per minute, return HTTP 429 when they are exceeded, and offer batch APIs for large asynchronous workloads, a model internal AI platforms commonly copy.", "body": "### Limit dimensions\n\n| Dimension | Example |\n|---|---|\n| Requests per minute | 60 per user |\n| Input tokens per minute | 200K per team |\n| Output tokens per minute | 50K per team |\n| Concurrent requests | 5 per user |\n| Monthly spend | $2,000 per project |\n\n### Priority classes\n\n```mermaid\nflowchart LR\n  I[Interactive traffic] --> HIGH[High-priority pool]\n  B[Batch jobs] --> LOW[Low-priority / batch pool]\n  HIGH --> GPU[(Shared or dedicated capacity)]\n  LOW --> GPU\n```\n\n### Client behavior\n\nExponential backoff with jitter on 429, respect Retry-After, and queue non-urgent work for batch processing."}, {"id": 166, "title": "Cost optimization for AI systems", "tldr": "Optimize AI cost with the biggest levers first: right-size models, route easy requests to cheap models, cache, shorten prompts and outputs, batch non-urgent work, self-host high-volume workloads when utilization is high, and measure cost per successful outcome.", "real": "Analyses such as a16z’s “LLMflation” (2024) estimated that the cost of LLM inference at a fixed capability level was falling roughly tenfold per year, which means re-evaluating model choices regularly can cut costs significantly without losing quality.", "body": "### Levers ranked by typical impact\n\n| Lever | Typical effect |\n|---|---|\n| Model routing / smaller models | Large |\n| Prompt caching | Large for repeated prefixes |\n| Shorter context (better retrieval) | Medium–large |\n| Output length limits | Medium |\n| Batch APIs for async work | \\~50% on that traffic |\n| Response caching | Depends on repetition |\n| Self-hosting at high utilization | Large at scale |\n| Quantization (self-hosted) | Medium–large |\n\n### Cost dashboard\n\n| Metric | Breakdown |\n|---|---|\n| Cost per task | By feature, tenant, model |\n| Tokens per task | Input vs output vs cached |\n| Cache hit rate | Prompt and response caches |\n| Routing mix | Share per model |\n| Waste | Failed or retried calls |\n\n### Rule\n\nOptimize only with an eval suite in place, so cost cuts do not silently reduce quality."}, {"id": 167, "title": "Observability for LLM applications", "tldr": "Trace every LLM request end to end: prompt version, retrieved documents, model calls, tool calls, tokens, latency, cost, guardrail decisions and user feedback. Use traces to debug, evaluate and monitor quality, with privacy controls on stored content.", "real": "LLM observability platforms such as LangSmith, Langfuse, Arize Phoenix, Braintrust and Datadog’s LLM Observability record traces of chains and agents, and OpenTelemetry’s generative AI semantic conventions let teams send this telemetry to general observability backends.", "body": "### Trace structure\n\n```\nrequest r-812 (2.9 s, $0.011, feedback 👍)\n├── input guardrail (40 ms)\n├── query rewrite: small model (180 ms, 120 → 25 tokens)\n├── retrieval: hybrid top 50 → rerank top 6 (210 ms)\n├── generation: main model (2.3 s, 3,400 in / 280 out, 2,900 cached)\n└── output guardrail (60 ms)\n```\n\n### What to monitor\n\n| Area | Metrics |\n|---|---|\n| Performance | TTFT, total latency, tokens/s |\n| Cost | Cost per request and per feature |\n| Quality | Online eval scores, feedback rate, groundedness samples |\n| Safety | Guardrail trigger rates |\n| Retrieval | Empty results, low-similarity rate |\n| Errors | Provider errors, timeouts, invalid outputs |\n\n### Privacy\n\nRedact PII in traces, restrict access, and set retention limits."}, {"id": 168, "title": "SLOs for AI services", "tldr": "AI services need SLOs beyond uptime: latency (time to first token, completion time), quality (groundedness, task success on sampled traffic), safety (violation rate) and freshness. Error budgets then balance shipping changes against stability.", "real": "Google’s SRE practice of SLOs and error budgets is widely adopted, and AI teams extend it with quality SLIs measured on sampled production traffic, since an AI service can be “up” while giving poor answers.", "body": "### Example SLOs for an AI assistant\n\n| SLI | SLO |\n|---|---|\n| Availability (successful responses) | 99.9% monthly |\n| Time to first token | p95 < 1.5 s |\n| Groundedness (sampled, judged) | ≥ 95% |\n| Safety violations | < 0.1% of sampled responses |\n| Index freshness | New docs searchable < 1 hour |\n\n### Measuring quality SLIs\n\n```mermaid\nflowchart LR\n  PROD[Production traffic] --> SAMPLE[Sample 1–5%]\n  SAMPLE --> JUDGE[LLM judges + human audit]\n  JUDGE --> SLI[Quality SLI dashboard]\n  SLI --> ALERT[Alert on budget burn]\n```\n\n### Error budget policy\n\nIf quality or latency budgets burn too fast, pause risky launches (new prompts, models) and focus on fixes."}, {"id": 169, "title": "Graceful degradation", "tldr": "When dependencies fail or load spikes, degrade gracefully instead of failing completely: smaller models, cached answers, search results without generation, reduced features, queued processing, or human handoff, with clear user messaging.", "real": "Netflix pioneered resilience engineering practices such as Chaos Monkey (2011) and fallbacks in its microservices, so that if a personalized row fails, the page still loads with a default row. The same principle applies to AI features.", "body": "### Degradation ladder (AI assistant)\n\n| Level | Behavior |\n|---|---|\n| Normal | Full model with tools and retrieval |\n| Degraded 1 | Smaller model, fewer tools |\n| Degraded 2 | Retrieval results with short extractive answers |\n| Degraded 3 | Cached FAQ answers |\n| Degraded 4 | Human handoff or “try again later” |\n\n### Triggers\n\n```mermaid\nflowchart LR\n  MON[Monitoring] --> D{Condition}\n  D -->|provider errors| FB[Switch provider / smaller model]\n  D -->|latency spike| SHED[Shed low-priority traffic]\n  D -->|budget exceeded| CHEAP[Cheaper mode]\n  D -->|guardrail spike| SAFE[Restrict features]\n```\n\n### Rule\n\nDesign degraded modes upfront and test them in game days; the first outage is a bad time to invent them."}, {"id": 170, "title": "Load testing AI systems", "tldr": "Load test with realistic traffic shapes: real prompt and output length distributions, concurrency ramps, burst patterns and tool calls. Measure latency percentiles, throughput, errors, cost and quality under load, and find the breaking point.", "real": "LLM benchmarking tools such as vLLM’s benchmark scripts, NVIDIA GenAI-Perf, guidellm and llmperf measure throughput and latency at varying concurrency, and general tools such as k6 and Locust are used to load test full applications through their gateways.", "body": "### Test plan\n\n| Test | Purpose |\n|---|---|\n| Baseline | Single-user latency |\n| Ramp | Find the knee of the latency curve |\n| Soak | Stability over hours |\n| Spike | Burst handling and autoscaling |\n| Failover | Behavior when a region or provider fails |\n\n### Throughput vs latency curve (illustrative)\n\n```chart\n{\"title\": \"p95 time to first token vs concurrency (illustrative)\", \"unit\": \"ms\", \"data\": [[\"8 concurrent\", 300], [\"32 concurrent\", 450], [\"64 concurrent\", 800], [\"128 concurrent\", 2100]]}\n```\n\nThe operating point is just before latency rises sharply.\n\n### Realism checklist\n\n- [ ] Prompt lengths sampled from logs\n- [ ] Output lengths realistic\n- [ ] Shared prefixes as in production (caching effects)\n- [ ] Tool calls and retrieval included\n- [ ] Run for long enough to reach steady state"}, {"id": 171, "title": "Prompting vs RAG vs fine-tuning", "tldr": "Use prompting for behavior you can describe, RAG for knowledge that changes or must be cited, and fine-tuning for consistent style, format, narrow skills or cost reduction through smaller models. They combine well; fine-tuning rarely replaces retrieval for facts.", "real": "OpenAI’s and Anthropic’s developer guidance both recommend starting with prompt engineering and retrieval, and moving to fine-tuning when you have a clear, evaluated gap that prompts cannot close, such as strict output formats or matching a specific tone at scale.", "body": "### Comparison\n\n| Need | Prompt | RAG | Fine-tune |\n|---|---|---|---|\n| New or changing facts | ✗ | ✓ | ✗ |\n| Citations | ✗ | ✓ | ✗ |\n| Consistent format / style | Partial | ✗ | ✓ |\n| Domain jargon understanding | Partial | Partial | ✓ |\n| Lower cost via smaller model | ✗ | ✗ | ✓ (distillation) |\n| Fast iteration | ✓ | ✓ | Slower |\n\n### Decision path\n\n```mermaid\nflowchart TD\n  A[Quality gap identified with evals] --> B{Missing knowledge?}\n  B -- yes --> RAG[Improve RAG]\n  B -- no --> C{Can better prompts fix it?}\n  C -- yes --> P[Prompt engineering]\n  C -- no --> D{Have quality training data?}\n  D -- yes --> FT[Fine-tune]\n  D -- no --> DATA[Collect / generate data first]\n```"}, {"id": 172, "title": "Supervised fine-tuning pipelines", "tldr": "Supervised fine-tuning (SFT) trains a model on input–output examples of desired behavior. The pipeline covers data collection, cleaning, formatting with the chat template, training, evaluation against the base model, and safe deployment.", "real": "Stanford’s Alpaca (2023) fine-tuned Meta’s LLaMA 7B on 52,000 instruction examples generated with OpenAI’s text-davinci-003, for less than $600 according to the authors, showing how accessible SFT had become. Cloud providers now offer managed fine-tuning APIs.", "body": "### Pipeline\n\n```mermaid\nflowchart LR\n  RAW[Logs, expert examples, synthetic data] --> CLEAN[Clean, dedupe, PII scrub]\n  CLEAN --> FMT[Format with chat template]\n  FMT --> SPLIT[Train / validation / test]\n  SPLIT --> TRAIN[SFT training]\n  TRAIN --> EVAL[Evaluate vs base model + safety]\n  EVAL --> REG[Register + deploy]\n```\n\n### Data guidelines\n\n| Guideline | Why |\n|---|---|\n| Quality over quantity | Hundreds to thousands of excellent examples often suffice |\n| Diverse inputs | Generalization |\n| Consistent outputs | Clear target behavior |\n| Include hard cases | Robustness |\n| Hold out test set | Honest evaluation |\n\n### Watch for\n\nOverfitting, loss of general abilities, safety regression (re-run safety evals), and data leakage of sensitive information into weights."}, {"id": 173, "title": "Parameter-efficient fine-tuning (LoRA and QLoRA)", "tldr": "LoRA trains small low-rank matrices added to frozen model weights, cutting memory and storage dramatically. QLoRA does this on a 4-bit quantized base. Adapters are small, swappable and servable together on one base model.", "real": "The LoRA paper (Microsoft, 2021) reported reducing trainable parameters for GPT-3 175B by about 10,000 times and GPU memory requirements by about 3 times. QLoRA (2023) showed a 65B model could be fine-tuned on a single 48 GB GPU.", "body": "### How LoRA works\n\n```\nOriginal weight W (frozen)\nUpdate ΔW = B × A, where B is d×r and A is r×k, with small rank r (e.g. 8–64)\nEffective weight = W + ΔW\n```\n\n### Comparison\n\n| Method | Trainable params | Memory | Output |\n|---|---|---|---|\n| Full fine-tune | All | Very high | Full model copy |\n| LoRA | <1% typically | Lower | Small adapter (MBs) |\n| QLoRA | <1% on 4-bit base | Lowest | Small adapter |\n\n### System design benefits\n\n| Benefit | Impact |\n|---|---|\n| Cheap training | Many experiments |\n| Small artifacts | Easy versioning and storage |\n| Multi-tenant serving | One base, many adapters (ch. 119) |\n| Fast rollback | Swap adapters |"}, {"id": 174, "title": "Preference tuning: RLHF and DPO", "tldr": "Preference tuning teaches a model which of several outputs people prefer. RLHF trains a reward model and optimizes against it with reinforcement learning; DPO optimizes directly on preference pairs, simpler and more stable. Both shape helpfulness, tone and safety.", "real": "OpenAI’s InstructGPT (2022) used RLHF and found human evaluators preferred outputs from a 1.3B-parameter tuned model over the 175B GPT-3. Direct Preference Optimization (DPO, Stanford, 2023) offered a simpler alternative that became widely used for open models.", "body": "### RLHF vs DPO\n\n```mermaid\nflowchart TB\n  subgraph RLHF\n    P1[Preference pairs] --> RM[Train reward model]\n    RM --> PPO[RL optimization of policy]\n  end\n  subgraph DPO\n    P2[Preference pairs] --> DIRECT[Direct optimization of policy]\n  end\n```\n\n| Aspect | RLHF | DPO |\n|---|---|---|\n| Components | Reward model + RL | Single training objective |\n| Stability | Harder to tune | Simpler |\n| Flexibility | Reward model reusable | Less flexible |\n| Compute | Higher | Lower |\n\n### Preference data\n\n| Source | Notes |\n|---|---|\n| Human raters | Highest quality, costly |\n| User feedback (thumbs) | Noisy, abundant |\n| AI feedback (RLAIF, constitutional methods) | Scalable, needs validation |"}, {"id": 175, "title": "Distillation into smaller models", "tldr": "Distillation trains a smaller “student” model on outputs of a larger “teacher” model, capturing much of its quality for a specific task at a fraction of the cost and latency. It is one of the most effective cost optimizations for high-volume LLM tasks.", "real": "DistilBERT (2019) retained about 97% of BERT’s performance with 40% fewer parameters. Providers such as OpenAI offer model distillation workflows that use outputs from larger models to fine-tune smaller ones for specific tasks.", "body": "### Distillation pipeline\n\n```mermaid\nflowchart LR\n  INPUTS[Representative inputs] --> TEACHER[Large teacher model]\n  TEACHER --> OUT[High-quality outputs]\n  OUT --> FILTER[Filter with evals / judges]\n  FILTER --> STUDENT[Fine-tune small student]\n  STUDENT --> EVAL[Evaluate vs teacher]\n  EVAL --> DEPLOY[Deploy student; route hard cases to teacher]\n```\n\n### Economics (illustrative)\n\n| | Teacher | Student |\n|---|---|---|\n| Quality on task | 100% (reference) | 90–98% |\n| Cost per request | 1.0 | 0.05–0.2 |\n| Latency | 1.0 | 0.2–0.5 |\n\n### Licensing\n\nCheck model terms: some providers restrict using outputs to train competing models."}, {"id": 176, "title": "Synthetic data pipelines", "tldr": "LLMs can generate training and evaluation data: instructions, answers, edge cases, dialogues and labels. Synthetic data scales coverage but can amplify errors or reduce diversity, so it needs filtering, deduplication, grounding and mixing with real data.", "real": "Microsoft’s Phi models, starting with “Textbooks Are All You Need” (2023), were trained heavily on curated and synthetic “textbook-quality” data and achieved strong results for their size, showing the power of carefully designed synthetic datasets.", "body": "### Pipeline\n\n```mermaid\nflowchart LR\n  SEED[Seed examples + topics] --> GEN[Generate with strong model]\n  GEN --> VERIFY[Verify: tests, judges, rules]\n  VERIFY --> DEDUP[Deduplicate + diversity check]\n  DEDUP --> MIX[Mix with real data]\n  MIX --> DATASET[(Versioned dataset)]\n```\n\n### Uses\n\n| Use | Example |\n|---|---|\n| Instruction data | Varied user requests |\n| Edge cases | Rare formats, adversarial inputs |\n| Evaluation sets | Many test questions per document |\n| Labels | Classify unlabeled examples |\n| Dialogues | Multi-turn support conversations |\n\n### Risks\n\nRepetition and low diversity, factual errors, bias amplification, and “model collapse” effects when models train mostly on generated data. Always validate with real-world evaluation."}, {"id": 177, "title": "Evaluating customized models", "tldr": "A fine-tuned model must beat the base model plus prompting on your task, keep general and safety abilities, and stay robust across slices. Compare on held-out task sets, general benchmarks, safety suites and cost/latency.", "real": "Research by Qi and colleagues (2023) showed that fine-tuning even on a small number of examples could weaken a model’s safety behavior, and that benign fine-tuning could also degrade it somewhat. Re-running safety evaluations after fine-tuning became standard practice.", "body": "### Evaluation matrix\n\n| Dimension | Compare |\n|---|---|\n| Task quality | Fine-tuned vs base + best prompt |\n| Generalization | Held-out and out-of-distribution inputs |\n| Safety | Refusal and jailbreak tests |\n| General ability | A few general benchmarks |\n| Format adherence | Schema validity rate |\n| Cost and latency | Per request |\n\n### Decision rule\n\n```\nShip fine-tuned model only if:\n  task quality improves meaningfully\n  AND safety tests pass\n  AND no key slice regresses\n  AND total cost (training + serving + maintenance) is justified\n```\n\n### Ongoing\n\nRe-evaluate when the base model is updated; a newer base with prompting may beat your older fine-tune."}, {"id": 178, "title": "The data flywheel", "tldr": "A data flywheel turns product usage into improvement: log interactions and feedback, identify failures, label or correct them, add them to training and eval sets, retrain or adjust, and ship, so the product gets better as it is used.", "real": "Tesla has described a “data engine” for its driving models, where the fleet surfaces difficult cases that are labeled and used for retraining. Search and recommendation products have long used click and engagement logs the same way.", "body": "### Flywheel\n\n```mermaid\nflowchart LR\n  USE[Product usage] --> LOG[Logs + feedback]\n  LOG --> MINE[Mine failures and edge cases]\n  MINE --> LABEL[Label / correct]\n  LABEL --> DATA[(Training + eval sets)]\n  DATA --> IMPROVE[Retrain / tune prompts / fix retrieval]\n  IMPROVE --> SHIP[Ship]\n  SHIP --> USE\n```\n\n### Signals to mine\n\n| Signal | Indicates |\n|---|---|\n| Thumbs down | Poor answer |\n| Regenerate / edit | Partial failure |\n| Escalation to human | Unresolved |\n| Low retrieval similarity | Knowledge gap |\n| Guardrail triggers | Safety or scope issues |\n\n### Governance\n\nConsent and privacy rules for using customer data, documented in terms; separate customer data per tenant when required."}, {"id": 179, "title": "Serving and managing custom models", "tldr": "Custom models need the same production discipline as any model: registry entries, versioned adapters or weights, canary rollouts, monitoring, rollback, and compatibility with base model updates. Multi-tenant platforms add isolation per customer.", "real": "Managed platforms such as Amazon Bedrock, Azure AI Foundry and Vertex AI offer hosting for fine-tuned models, and self-hosted engines such as vLLM support loading LoRA adapters dynamically, enabling per-customer model variants on shared infrastructure.", "body": "### Lifecycle\n\n```mermaid\nflowchart LR\n  TRAIN[Train adapter vN] --> REG[Registry]\n  REG --> CANARY[Canary for tenant]\n  CANARY --> PROD[Production]\n  PROD --> MON[Monitor quality per tenant]\n  MON --> TRAIN\n  BASE[Base model update] --> RETEST[Re-evaluate / retrain adapters]\n```\n\n### Operational concerns\n\n| Concern | Approach |\n|---|---|\n| Base model upgrades | Retrain or re-validate adapters |\n| Tenant isolation | Separate data, adapters, logs |\n| Cold adapters | Load on demand with caching |\n| Cost attribution | Track usage per adapter |\n| Rollback | Keep previous adapter version |"}, {"id": 180, "title": "Data governance for model training", "tldr": "Training data must be lawfully obtained, licensed, consented where needed, documented, protected and deletable. Governance covers provenance, copyright, personal data, customer data use, retention, and documentation required by regulations.", "real": "The EU AI Act requires providers of general-purpose AI models to publish a summary of training content and maintain a copyright policy. Several lawsuits by authors, artists and publishers against AI developers have made training-data provenance a major legal concern.", "body": "### Governance checklist\n\n- [ ] Source and license recorded for every dataset\n- [ ] Customer data used only as permitted by contract and consent\n- [ ] PII minimized and scrubbed where possible\n- [ ] Opt-out and deletion processes defined\n- [ ] Dataset documentation (datasheets)\n- [ ] Access controls and audit logs on training data\n- [ ] Retention periods enforced\n- [ ] Legal review for copyrighted material\n\n### Provenance record\n\n| Field | Example |\n|---|---|\n| Dataset | support_conversations_2026Q3 |\n| Source | Production chat logs (consented tenants) |\n| License / basis | Customer agreement section 7 |\n| PII handling | Names and emails tokenized |\n| Retention | 24 months |\n| Used by | support-model-v4 adapter |"}, {"id": 181, "title": "Foundation model training systems", "tldr": "Training a foundation model combines web-scale data pipelines, tens of thousands of accelerators with high-speed networks, 3D/4D parallelism, robust checkpointing, continuous evaluation and careful experiment management. It is one of the largest distributed systems problems in computing.", "real": "Meta’s Llama 3 paper (2024) described training the 405B model on up to 16,384 H100 GPUs on about 15 trillion tokens, using combined tensor, pipeline, context and data parallelism. DeepSeek-V3’s technical report (2024) described FP8 mixed-precision training of a 671B-parameter mixture-of-experts model.", "body": "### Architecture\n\n```mermaid\nflowchart TB\n  DATA[Web-scale data pipeline: crawl, filter, dedupe, mix] --> LOADER[Distributed data loaders]\n  LOADER --> CLUSTER[GPU cluster: TP + PP + DP + CP / EP]\n  CLUSTER --> CKPT[(Checkpoint storage)]\n  CLUSTER --> MET[Loss and system metrics]\n  CKPT --> EVAL[Periodic evaluation jobs]\n  EVAL --> DECIDE[Research decisions: data mix, LR, continue/stop]\n```\n\n### Major components\n\n| Component | Challenge |\n|---|---|\n| Data pipeline | Trillions of tokens, quality filtering, deduplication |\n| Parallelism | Fit model and activations across GPUs |\n| Network | All-reduce and all-to-all at massive scale |\n| Fault tolerance | Frequent hardware failures |\n| Numerics | Loss spikes, low-precision stability |\n| Evaluation | Track capabilities during training |\n\n### Scale numbers to remember\n\nFrontier training runs use tens of thousands of GPUs for weeks to months, trillions of tokens, and very large compute budgets."}, {"id": 182, "title": "Web-scale data pipelines for pretraining", "tldr": "Pretraining data pipelines collect massive text and code, extract clean text, filter for quality and safety, remove duplicates and personal data, balance domains and languages, and tokenize into shards. Data quality strongly determines model quality.", "real": "Hugging Face’s FineWeb dataset (2024), built from Common Crawl with documented filtering and deduplication, showed that careful filtering improved model performance compared with less-filtered web data. Common Crawl has provided open web crawl data since 2008.", "body": "### Pipeline\n\n```mermaid\nflowchart LR\n  CRAWL[Web crawl, code, books, papers] --> EXTRACT[Text extraction]\n  EXTRACT --> LANG[Language ID]\n  LANG --> QUAL[Quality filters + classifiers]\n  QUAL --> SAFE[Safety and PII filtering]\n  SAFE --> DEDUP[Exact + near-duplicate removal]\n  DEDUP --> MIX[Domain / language mixing]\n  MIX --> TOK[Tokenize into shards]\n```\n\n### Filtering techniques\n\n| Technique | Purpose |\n|---|---|\n| Heuristic rules | Remove boilerplate, spam |\n| Quality classifiers | Keep educational/high-quality text |\n| MinHash deduplication | Remove near-duplicates |\n| PII scrubbing | Privacy |\n| Benchmark decontamination | Honest evaluation |\n| Opt-out / robots handling | Respect publisher preferences |\n\n### Scale\n\nProcessing petabytes of raw data with distributed engines (Spark, Ray, custom tooling) over thousands of CPU cores."}, {"id": 183, "title": "AI cluster design", "tldr": "AI clusters are designed around accelerators, high-bandwidth interconnects inside nodes (NVLink), low-latency networks between nodes (InfiniBand or RoCE), fast parallel storage, power and cooling. Network topology and failure handling determine efficiency at scale.", "real": "NVIDIA’s GB200 NVL72 rack connects 72 Blackwell GPUs in one NVLink domain, and hyperscalers have built clusters of 100,000 or more GPUs; xAI’s Colossus cluster reached about 100,000 H100 GPUs in 2024.", "body": "### Layers\n\n| Layer | Technology |\n|---|---|\n| Accelerators | GPUs, TPUs, custom chips |\n| Intra-node | NVLink / NVSwitch |\n| Inter-node | InfiniBand or RoCE Ethernet, rail-optimized topologies |\n| Storage | Parallel file systems, object storage |\n| Power | Tens to hundreds of MW |\n| Cooling | Liquid cooling for dense racks |\n\n### Topology sketch\n\n```mermaid\nflowchart TB\n  subgraph Rack1\n    N1[Node: 8 GPUs + NVLink]\n    N2[Node: 8 GPUs + NVLink]\n  end\n  subgraph Rack2\n    N3[Node: 8 GPUs + NVLink]\n    N4[Node: 8 GPUs + NVLink]\n  end\n  N1 --> LEAF1[Leaf switches]\n  N2 --> LEAF1\n  N3 --> LEAF2[Leaf switches]\n  N4 --> LEAF2\n  LEAF1 --> SPINE[Spine switches]\n  LEAF2 --> SPINE\n```\n\n### Design metrics\n\nModel FLOPs utilization, network bandwidth per GPU, failure rate, power usage effectiveness (PUE), and time to recover from failures."}, {"id": 184, "title": "Reliability at extreme scale", "tldr": "With tens of thousands of components, failures are constant. Large training and serving systems need automated health checks, fast detection of slow or faulty nodes, quick restarts from checkpoints, spare capacity and detailed telemetry.", "real": "Meta reported 419 unexpected interruptions during 54 days of Llama 3 405B pre-training on 16,384 GPUs, roughly one every three hours, with faulty GPUs and GPU memory among the most common causes, yet still achieved over 90% effective training time through automation.", "body": "### Failure handling\n\n```mermaid\nflowchart LR\n  MON[Telemetry: GPU errors, NCCL timeouts, stragglers] --> DET[Detect]\n  DET --> ISO[Isolate node]\n  ISO --> SPARE[Swap in spare]\n  SPARE --> RESTART[Restart from checkpoint]\n  RESTART --> TRAIN[Continue]\n```\n\n### Practices\n\n| Practice | Purpose |\n|---|---|\n| Pre-job burn-in tests | Catch bad hardware early |\n| Straggler detection | Find slow nodes that slow everyone |\n| Frequent async checkpoints | Limit lost work |\n| Spare node pools | Fast replacement |\n| Automated root-cause tagging | Track failure trends |\n\n### Metric\n\nEffective training time = productive time ÷ wall-clock time. At scale, every percentage point is worth large amounts of compute."}, {"id": 185, "title": "Evaluation infrastructure for large models", "tldr": "Large model development needs evaluation infrastructure: hundreds of benchmarks and internal evals run automatically on checkpoints, contamination checks, safety and capability testing, human evaluation pipelines and dashboards that inform training decisions.", "real": "EleutherAI’s lm-evaluation-harness powered the Hugging Face Open LLM Leaderboard, and frontier labs publish system cards describing pre-deployment safety evaluations, often in partnership with government AI safety or security institutes in the US and UK.", "body": "### Evaluation system\n\n```mermaid\nflowchart LR\n  CKPT[New checkpoint] --> SCHED[Eval scheduler]\n  SCHED --> BENCH[Benchmarks: knowledge, reasoning, code, math]\n  SCHED --> INTERNAL[Internal task evals]\n  SCHED --> SAFETY[Safety and red-team evals]\n  SCHED --> HUMAN[Human preference evals]\n  BENCH --> DASH[Dashboard + comparisons]\n  INTERNAL --> DASH\n  SAFETY --> DASH\n  HUMAN --> DASH\n```\n\n### Design concerns\n\n| Concern | Approach |\n|---|---|\n| Contamination | Check overlap between training data and test sets |\n| Variance | Multiple seeds, confidence intervals |\n| Cost | Subsets for frequent checks, full suites for milestones |\n| Reproducibility | Versioned eval code and prompts |\n| Safety gating | Thresholds that block release |"}, {"id": 186, "title": "Inference platforms at massive scale", "tldr": "Serving hundreds of millions of users requires global capacity planning, multi-region GPU fleets, intelligent routing, prefix caching, autoscaling, priority tiers, rate limiting, safety layers and continuous efficiency work. Inference becomes the dominant AI cost.", "real": "OpenAI said ChatGPT reached about 800 million weekly users by October 2025, and Character.AI reported serving over 20,000 queries per second in 2024 while cutting serving costs dramatically through techniques like multi-query attention, int8 quantization and cross-turn KV caching.", "body": "### Architecture\n\n```mermaid\nflowchart TB\n  USERS[Users worldwide] --> EDGE[Edge / CDN / gateways]\n  EDGE --> ROUTE[Global router: region, model, priority]\n  ROUTE --> R1[Region A GPU fleet]\n  ROUTE --> R2[Region B GPU fleet]\n  R1 --> SCHED1[Cache-aware schedulers + engines]\n  R2 --> SCHED2[Cache-aware schedulers + engines]\n  SCHED1 --> KV1[(KV cache tiers)]\n  SCHED2 --> KV2[(KV cache tiers)]\n  ROUTE --> SAFETY[Safety services]\n  ROUTE --> OBS[(Telemetry, billing)]\n```\n\n### Efficiency levers at scale\n\n| Lever | Effect |\n|---|---|\n| Model architecture (GQA, MLA, MoE) | Smaller KV cache, fewer active parameters |\n| Quantization (FP8, FP4) | More throughput per GPU |\n| Prefix caching | Skip repeated prefill |\n| Speculative decoding | Lower latency |\n| Disaggregation | Better utilization |\n| Priority tiers | Protect paid/interactive traffic |"}, {"id": 187, "title": "Enterprise AI platform design", "tldr": "An enterprise AI platform gives every team safe, governed access to models and building blocks: a model gateway, approved models, RAG and agent services, connectors, evaluation, observability, security, cost management and governance workflows.", "real": "Cloud providers package these layers as managed services, such as Amazon Bedrock (with AgentCore for agent runtime, memory, identity and gateway), Azure AI Foundry and Google Vertex AI, and many large enterprises build internal platforms on top of them.", "body": "### Platform layers\n\n```mermaid\nflowchart TB\n  APPS[Business apps, copilots, agents] --> SDK[Platform SDKs and templates]\n  SDK --> GW[Model gateway: routing, quotas, logging, guardrails]\n  GW --> MODELS[Approved models: API + self-hosted]\n  SDK --> RAG[RAG service + connectors]\n  SDK --> AGENT[Agent runtime + tool registry]\n  GW --> OBS[Observability + evaluation]\n  GW --> FIN[Cost management]\n  GOV[Governance: inventory, approvals, policies] -.-> SDK\n  SEC[Identity, secrets, data protection] -.-> GW\n```\n\n### Platform services\n\n| Service | Value |\n|---|---|\n| Model gateway | One integration, central policy |\n| Model catalog | Approved, evaluated options |\n| RAG as a service | Shared ingestion and retrieval |\n| Agent runtime | Sandboxing, identity, tools |\n| Eval service | Standard quality gates |\n| Cost dashboards | Chargeback and budgets |\n\n### Success metric\n\nTime for a team to ship a governed AI feature from idea to production."}, {"id": 188, "title": "Multi-tenant AI SaaS architecture", "tldr": "AI SaaS products serve many customers on shared infrastructure. Design for tenant isolation (data, indexes, caches, fine-tunes), per-tenant quotas and billing, noisy-neighbor protection, configurable models and data residency.", "real": "In 2023, a bug in an open-source Redis client library caused ChatGPT to show some users other users’ conversation titles, and OpenAI’s postmortem said payment details of about 1.2% of ChatGPT Plus subscribers active in a nine-hour window were potentially exposed. Cross-tenant isolation bugs are a core risk in AI SaaS.", "body": "### Isolation models\n\n| Model | Isolation | Cost |\n|---|---|---|\n| Shared everything + tenant IDs | Logical | Lowest |\n| Shared compute, separate data stores | Medium | Medium |\n| Dedicated per tenant (silo) | Strong | Highest |\n| Hybrid tiers | Premium tenants get dedicated resources | Flexible |\n\n### Tenant-aware request path\n\n```mermaid\nflowchart LR\n  REQ[Request + tenant token] --> AUTH[Auth + tenant resolution]\n  AUTH --> QUOTA[Tenant quotas]\n  QUOTA --> RET[Retrieval with tenant namespace]\n  RET --> MODEL[Model or tenant adapter]\n  MODEL --> LOG[(Logs tagged by tenant)]\n  LOG --> BILL[Usage billing]\n```\n\n### Must-haves\n\nTenant ID enforced in every data access, cache keys including tenant, cross-tenant tests, per-tenant encryption keys for sensitive customers, and audit logs."}, {"id": 189, "title": "On-premise, sovereign and air-gapped AI", "tldr": "Some organizations must run AI inside their own data centers or national clouds, sometimes fully disconnected. This requires self-hosted models, local GPU infrastructure, offline update processes, local evaluation and security operations.", "real": "Google offers Gemini on Google Distributed Cloud, including air-gapped configurations for governments, and AWS launched its European Sovereign Cloud in January 2026 with a region in Brandenburg, Germany, operated separately from other AWS regions by EU-resident staff.", "body": "### Deployment options\n\n| Option | Control | Effort |\n|---|---|---|\n| Public cloud API | Low | Low |\n| Sovereign cloud region | Medium–high | Medium |\n| Self-hosted in own data center | High | High |\n| Air-gapped | Highest | Highest |\n\n### Air-gapped architecture\n\n```mermaid\nflowchart LR\n  VENDOR[Model vendor / open weights] --> TRANSFER[Secure transfer station: scan, verify signatures]\n  TRANSFER --> REG[Internal model registry]\n  REG --> SERVE[On-prem GPU serving]\n  SERVE --> APPS[Internal applications]\n  DOCS[(Classified documents)] --> RAG[Local RAG]\n  RAG --> SERVE\n```\n\n### Challenges\n\nModel updates are slower, hardware budgets are fixed, specialized staff are scarce, and evaluation must happen inside the environment."}, {"id": 190, "title": "Reference architecture: a complete GenAI platform", "tldr": "Bringing it together: a complete generative AI platform has clients, gateway and policy, orchestration (workflows and agents), retrieval and data, model serving (API and self-hosted), safety, evaluation, observability, and governance, all with clear ownership.", "real": "Published architectures from cloud providers and large adopters converge on the same layered shape: a gateway in front of multiple models, shared retrieval services, agent runtimes with tool registries, evaluation pipelines and centralized observability and governance.", "body": "### Full architecture\n\n```mermaid\nflowchart TB\n  CLIENTS[Web, mobile, internal tools, APIs] --> GW[API + LLM gateway]\n  GW --> GUARD[Input guardrails]\n  GUARD --> ORCH[Orchestration: workflows + agents]\n  ORCH --> RAG[Retrieval service]\n  RAG --> IDX[(Vector + keyword indexes)]\n  ING[Ingestion pipelines + connectors] --> IDX\n  ORCH --> TOOLS[Tool registry / MCP servers]\n  ORCH --> ROUTER[Model router]\n  ROUTER --> API[External model APIs]\n  ROUTER --> SELF[Self-hosted inference fleet]\n  ORCH --> OUTG[Output guardrails]\n  OUTG --> CLIENTS\n  GW --> OBS[(Traces, metrics, cost)]\n  OBS --> EVAL[Evaluation + monitoring]\n  EVAL --> IMPROVE[Prompt / model / retrieval improvements]\n  GOV[Governance, security, identity] -.-> GW\n```\n\n### Ownership\n\n| Layer | Owner |\n|---|---|\n| Gateway, routing, quotas | AI platform team |\n| Retrieval and ingestion | Data / search team |\n| Orchestration and prompts | Product teams |\n| Inference fleet | ML infrastructure team |\n| Safety and governance | Responsible AI + security |\n| Evaluation | Shared, with product ownership of eval sets |"}, {"id": 191, "title": "A framework for any AI system design", "tldr": "Approach every AI design the same way: clarify requirements, estimate scale, define data and metrics, sketch the high-level architecture, choose models, design serving and data flows, address quality and safety, plan operations, then discuss trade-offs and evolution.", "real": "This structure mirrors how system design interviews at large technology companies and real design reviews are run: reviewers look for clear requirements, explicit trade-offs and an operational plan, not just a model choice.", "body": "### The 9 steps\n\n| Step | Output | Time (45-min interview) |\n|---|---|---|\n| 1. Requirements | Functional, non-functional, constraints | 5 min |\n| 2. Estimates | QPS, data size, tokens, latency budget | 3 min |\n| 3. Metrics | Offline, online, guardrail metrics | 3 min |\n| 4. Data | Sources, labels, features, freshness | 5 min |\n| 5. High-level design | Diagram of components | 7 min |\n| 6. Models | Approach, baseline, build vs buy | 5 min |\n| 7. Serving and scale | Latency, caching, scaling, cost | 7 min |\n| 8. Quality, safety, monitoring | Evals, guardrails, drift, rollout | 5 min |\n| 9. Trade-offs and evolution | Alternatives, v2 plans | 5 min |\n\n### Diagram skeleton\n\n```mermaid\nflowchart LR\n  C[Clients] --> G[Gateway]\n  G --> S[Core service]\n  S --> F[(Data / features / indexes)]\n  S --> M[Model serving]\n  S --> SAFE[Guardrails]\n  S --> L[(Logs)]\n  L --> T[Training / evaluation]\n  T --> M\n```\n\n### Common mistakes\n\nJumping to a model, ignoring data and labels, no metrics, no baseline, no monitoring, and no discussion of cost or failure modes."}, {"id": 192, "title": "Trade-off reasoning", "tldr": "Strong designs make trade-offs explicit: latency vs quality, cost vs accuracy, freshness vs complexity, build vs buy, autonomy vs control, and privacy vs personalization. State the choice, the reason, and what would change your mind.", "real": "Netflix explained that it did not deploy the full Netflix Prize-winning ensemble because the additional accuracy did not justify the engineering cost, a well-known example of choosing a simpler system over the most accurate one.", "body": "### Common trade-offs\n\n| Trade-off | Lean one way when… |\n|---|---|\n| Large vs small model | Quality critical vs latency/cost critical |\n| Real-time vs batch | Fresh context needed vs stable predictions |\n| RAG vs fine-tuning | Facts change vs style/format consistency |\n| API vs self-host | Speed and quality vs control and volume economics |\n| Agent vs workflow | Open-ended vs predictable tasks |\n| Precision vs recall | Cost of false positives vs false negatives |\n| Strong vs eventual consistency | Money/permissions vs feeds/recommendations |\n| Personalization vs privacy | Value of personal data vs risk and regulation |\n\n### How to state a trade-off\n\n```\n\"We choose a smaller model for the first response because the latency target is 1 s.\n Hard queries (about 20%) escalate to the larger model.\n If the eval gap on hard queries exceeds 5 points, we revisit.\"\n```"}, {"id": 193, "title": "Design: a ChatGPT-style assistant", "tldr": "A consumer AI assistant needs conversation management, streaming, model routing, tools (search, code, files), memory, safety layers, massive GPU capacity with priority tiers, and strong observability and abuse prevention.", "real": "ChatGPT grew to about 800 million weekly users by October 2025. Public incidents, such as the March 2023 conversation-title leak and the December 2024 multi-hour outage, illustrate the importance of tenant isolation and resilient infrastructure at this scale.", "body": "### Requirements (assumed)\n\n| Requirement | Target |\n|---|---|\n| Users | 100M daily active |\n| Messages | 1B/day ≈ 11.6K/s avg, \\~35K/s peak |\n| TTFT | p95 < 1.5 s |\n| Availability | 99.9% |\n| Safety | Policy-compliant outputs, abuse controls |\n\n### Architecture\n\n```mermaid\nflowchart TB\n  APP[Web / mobile] --> EDGE[Edge + auth + rate limits]\n  EDGE --> CONV[Conversation service]\n  CONV --> STORE[(Conversation store, partitioned by user)]\n  CONV --> MEM[(Memory service)]\n  CONV --> ORCH[Orchestrator]\n  ORCH --> SAFE_IN[Input safety]\n  ORCH --> ROUTER[Model router: tier, task, load]\n  ROUTER --> FLEET[Multi-region GPU inference fleets]\n  ORCH --> TOOLS[Tools: web search, code sandbox, files, image gen]\n  FLEET --> SAFE_OUT[Output safety]\n  SAFE_OUT -->|SSE stream| APP\n  ORCH --> TEL[(Telemetry, feedback, billing)]\n```\n\n### Key decisions\n\n| Area | Decision |\n|---|---|\n| Context | Summarize long histories; memory retrieval |\n| Capacity | Priority tiers (paid > free), autoscaling, degraded models under load |\n| Caching | Prefix caching for system prompts and histories |\n| Abuse | Rate limits, classifiers, account enforcement |\n| Privacy | User controls for history and memory, retention policies |\n| Evaluation | Offline evals + sampled online quality + A/B tests |"}, {"id": 194, "title": "Design: enterprise RAG assistant", "tldr": "An enterprise assistant connects to many internal sources, enforces document permissions, answers with citations, uses tools for live data, and is measured on groundedness and adoption. Data hygiene and evaluation dominate the work.", "real": "Morgan Stanley’s 2023 GPT-4 assistant for financial advisors and Microsoft 365 Copilot are prominent examples; Microsoft’s rollout highlighted that permission-aware retrieval exposes existing oversharing, which organizations had to clean up.", "body": "### Requirements (assumed)\n\n| Requirement | Target |\n|---|---|\n| Users | 30,000 employees |\n| Corpus | 5M documents across wiki, drive, tickets |\n| Latency | First token < 2 s |\n| Groundedness | ≥ 95% on golden set |\n| Security | Zero permission leaks |\n\n### Architecture\n\n```mermaid\nflowchart TB\n  SRC[Connectors: wiki, drive, tickets, chat] --> ING[Parse, chunk, contextualize, embed]\n  ACL[ACL sync] --> IDX[(Hybrid index with ACL metadata)]\n  ING --> IDX\n  USER[Employee] --> GW[Gateway: SSO, quotas]\n  GW --> ORCH[Orchestrator]\n  ORCH --> QR[Query rewrite]\n  QR --> RET[Permission-filtered hybrid retrieval]\n  RET --> IDX\n  RET --> RR[Reranker]\n  RR --> LLM[LLM with citations]\n  ORCH --> TOOLS[Live tools: HR, ticketing]\n  LLM --> CHECK[Groundedness + PII checks]\n  CHECK --> USER\n```\n\n### Capacity notes\n\n```\n5M docs × ~8 chunks × 1,024 dims × 4 bytes ≈ 164 GB vectors → shard + replicate\nPeak 200 queries/s × ~4K input tokens → plan model capacity or provider quotas accordingly\n```"}, {"id": 195, "title": "Design: personalized recommendation feed", "tldr": "A feed recommender uses multiple candidate sources, a two-stage ranking funnel, real-time features, multi-objective scoring, re-ranking for diversity and policy, and continuous experimentation, all within a tight latency budget.", "real": "YouTube’s published two-stage design, Twitter’s 2023 open-sourced recommendation pipeline (about 1,500 candidates per request and a neural heavy ranker of about 48 million parameters), and Meta’s multi-objective feed ranking are standard references.", "body": "### Requirements (assumed)\n\n| Requirement | Target |\n|---|---|\n| DAU | 50M |\n| Feed requests | 10/user/day → \\~5.8K/s avg, \\~20K/s peak |\n| Latency | p99 < 200 ms |\n| Catalog | 500M items, 10M new per day |\n\n### Architecture\n\n```mermaid\nflowchart TB\n  REQ[Feed request] --> CG[Candidate sources: two-tower ANN, follows, trending, fresh]\n  CG --> MERGE[Merge + dedupe ~2,000]\n  MERGE --> FEAT[Feature fetch: online store]\n  FEAT --> LIGHT[Light ranker → 500]\n  LIGHT --> HEAVY[Multi-task heavy ranker → 100]\n  HEAVY --> RERANK[Diversity, policy, ads]\n  RERANK --> FEED[Feed response]\n  FEED --> LOGS[(Impressions + engagement)]\n  LOGS --> STREAM[Real-time features]\n  LOGS --> TRAIN[Daily / continuous training]\n```\n\n### Metrics\n\nOffline NDCG and recall; online engagement, satisfaction surveys, retention, diversity and integrity metrics; guardrails on latency and policy violations."}, {"id": 196, "title": "Design: AI coding assistant", "tldr": "A coding assistant has two products in one: low-latency inline completion and an autonomous agent mode. Completion needs small fast models and smart context; agent mode needs sandboxes, repository tools, tests, permissions and pull-request workflows.", "real": "GitHub Copilot started with inline completion in 2021 and later added chat and an agent that can be assigned issues and open pull requests. Claude Code, Cursor and OpenAI’s Codex similarly combine interactive editing with agentic, test-driven workflows.", "body": "### Requirements (assumed)\n\n| Mode | Target |\n|---|---|\n| Inline completion | p95 < 300 ms, very high request volume |\n| Chat | First token < 1.5 s |\n| Agent tasks | Minutes; verified by tests; PR output |\n\n### Architecture\n\n```mermaid\nflowchart TB\n  IDE[IDE plugin] -->|keystrokes, debounced| COMP[Completion service: small model, prompt from nearby code]\n  IDE --> CHAT[Chat service]\n  CHAT --> CTX[Context: repo search, open files, docs]\n  CTX --> LLM[Large model]\n  ISSUE[Issue / task] --> AGENT[Agent runtime]\n  AGENT --> SANDBOX[Sandbox: clone repo, edit, run tests]\n  SANDBOX --> AGENT\n  AGENT --> PR[Pull request + summary]\n  PR --> CI[CI + human review]\n```\n\n### Key decisions\n\n| Area | Decision |\n|---|---|\n| Completion context | Current file, cursor neighborhood, related files |\n| Latency | Streaming, cancellation of stale requests |\n| Agent safety | Sandbox, no secrets, permission modes |\n| Quality | Acceptance rate, tests passing, PR merge rate |\n| Privacy | Enterprise code not used for training without consent |"}, {"id": 197, "title": "Design: real-time fraud detection platform", "tldr": "A payments fraud platform scores transactions in tens of milliseconds using streaming features, rules and ML models, makes allow/review/block decisions, handles delayed labels, and adapts quickly to new attack patterns.", "real": "Stripe Radar scores payments with machine learning trained on data across millions of businesses on Stripe’s network, combined with customizable rules, and payment networks run similar real-time risk scoring on every card authorization.", "body": "### Requirements (assumed)\n\n| Requirement | Target |\n|---|---|\n| Transactions | 5,000/s peak |\n| Latency | p99 < 50 ms for scoring |\n| Recall | Catch ≥ 85% of fraud value |\n| False positive rate | < 0.5% of good transactions declined |\n\n### Architecture\n\n```mermaid\nflowchart LR\n  TX[Authorization request] --> GW[Risk API]\n  GW --> FEAT[Feature service]\n  STREAM[(Event stream)] --> AGG[Streaming aggregations: velocity, device, graph]\n  AGG --> ONLINE[(Online feature store)]\n  FEAT --> ONLINE\n  FEAT --> RULES[Rules engine]\n  FEAT --> MODEL[GBDT / neural model]\n  RULES --> DEC[Decision engine]\n  MODEL --> DEC\n  DEC --> RESP[Allow / review / block / step-up]\n  RESP --> LOG[(Decision logs)]\n  LABELS[Chargebacks, reviews] --> TRAIN[Retraining]\n  LOG --> TRAIN\n  TRAIN --> MODEL\n```\n\n### Key decisions\n\nVelocity and graph features from streams, cost-sensitive thresholds per merchant segment, shadow-testing new models, and frequent retraining with delayed-label correction."}, {"id": 198, "title": "Design: AI customer support agent", "tldr": "A support agent answers questions from knowledge bases, performs authenticated actions within policy, escalates to humans with context, and is measured on resolution, satisfaction, policy compliance and cost. Policies live in code, not prompts.", "real": "Klarna’s 2024 AI assistant handled two-thirds of its customer service chats in its first month, and the Moffatt v. Air Canada decision in 2024 showed companies are accountable for what their support bots say. Both shape how support agents are designed.", "body": "### Requirements (assumed)\n\n| Requirement | Target |\n|---|---|\n| Conversations | 100K/day |\n| Resolution without human | ≥ 60% |\n| CSAT | ≥ human baseline |\n| Policy violations | 0 in audits |\n| Latency | First token < 1.5 s |\n\n### Architecture\n\n```mermaid\nflowchart TB\n  CUST[Customer: chat, email, voice] --> CHAN[Channel adapters]\n  CHAN --> AGENT[Support agent orchestrator]\n  AGENT --> KB[Help center RAG]\n  AGENT --> TOOLS[Tools: orders, refunds, account]\n  TOOLS --> POLICY[Policy engine: limits, eligibility, auth]\n  AGENT --> GUARD[Guardrails: tone, PII, scope]\n  AGENT -->|escalate| HUMAN[Human agent desk with summary]\n  AGENT --> QA[Conversation QA + evals]\n  QA --> IMPROVE[KB fixes, prompt updates]\n```\n\n### Evaluation\n\nSimulated customer conversations (tau-bench style) with policies, weekly samples of real conversations reviewed by QA, and A/B tests of changes on resolution and CSAT."}, {"id": 199, "title": "Design: multimodal semantic search", "tldr": "Multimodal search lets users search images, video and documents with text or images. It embeds all content into shared vector spaces, indexes at scale, combines with metadata and keyword search, and reranks with stronger models.", "real": "OpenAI’s CLIP (2021) showed that images and text could be embedded in a shared space, enabling text-to-image search. Pinterest Lens and Google Lens apply visual search at large scale, and photo apps let users search personal photos by describing them.", "body": "### Requirements (assumed)\n\n| Requirement | Target |\n|---|---|\n| Corpus | 1B images + 50M videos |\n| Query types | Text → image, image → image, text → video moment |\n| Latency | p95 < 300 ms |\n| Freshness | New uploads searchable in < 5 minutes |\n\n### Architecture\n\n```mermaid\nflowchart TB\n  UPLOAD[New media] --> PROC[Processing: thumbnails, frame sampling, OCR, transcripts]\n  PROC --> EMB[Multimodal embedding model]\n  EMB --> ANN[(Sharded ANN index)]\n  PROC --> META[(Metadata + keyword index)]\n  Q[Text or image query] --> QEMB[Query embedding]\n  QEMB --> ANN\n  Q --> META\n  ANN --> FUSE[Fusion + filters]\n  META --> FUSE\n  FUSE --> RERANK[Multimodal reranker]\n  RERANK --> RESULTS[Results]\n```\n\n### Capacity estimate\n\n```\n1B images × 768 dims × 1 byte (int8) ≈ 768 GB → shard across many nodes, with replicas\n```"}, {"id": 200, "title": "Final checklist, glossary and study roadmap", "tldr": "Use this checklist for every AI design review, the glossary for quick reference, and the roadmap to turn this book into practical skill. If you can apply the framework in chapter 191 to any new problem with clear trade-offs, you have mastered the core of AI system design.", "real": "The most useful primary sources to keep learning from are engineering blogs and papers from teams that run these systems: Google, Meta, Netflix, Uber, Airbnb, Pinterest, LinkedIn, Microsoft, Anthropic and OpenAI, plus Chip Huyen’s “Designing Machine Learning Systems” and Martin Kleppmann’s “Designing Data-Intensive Applications”.", "body": "### Design review checklist\n\n- [ ] Requirements are measurable (latency, scale, quality, cost, safety)\n- [ ] Baseline defined and measured\n- [ ] Data sources, labels and freshness documented\n- [ ] Leakage and training–serving skew addressed\n- [ ] Offline and online metrics chosen, with guardrails\n- [ ] Architecture diagram with data flows\n- [ ] Model choice justified (build/buy, size, cost)\n- [ ] Serving: latency budget, caching, scaling, fallbacks\n- [ ] Safety: guardrails, prompt injection, PII, human review\n- [ ] Evaluation suite and release gates\n- [ ] Monitoring: drift, quality, cost, incidents\n- [ ] Rollout: shadow, canary, rollback\n- [ ] Governance: documentation, approvals, compliance\n- [ ] Trade-offs and future evolution stated\n\n### Glossary\n\n| Term | Meaning |\n|---|---|\n| SLO / SLI | Reliability target / measured indicator |\n| Feature store | System for consistent offline and online features |\n| Training–serving skew | Mismatch between training and production inputs |\n| Data drift / concept drift | Input distribution change / relationship change |\n| Two-tower model | Separate user and item encoders for retrieval |\n| ANN | Approximate nearest-neighbor search |\n| NDCG | Ranking quality metric with position discount |\n| RAG | Retrieval-augmented generation |\n| Reranker | Model that reorders retrieved candidates |\n| KV cache | Stored attention state during LLM generation |\n| Continuous batching | Requests join and leave batches every step |\n| LoRA | Low-rank adapters for efficient fine-tuning |\n| Distillation | Training a small model from a large one |\n| LLM-as-judge | Model grading outputs against a rubric |\n| Guardrails | Checks on inputs, actions and outputs |\n| Agent | LLM in a loop calling tools toward a goal |\n| MCP | Model Context Protocol for tools and data |\n\n### Study roadmap\n\n1. Parts 1–2: practice estimation and draw 5 classic system designs\n2. Parts 3–7: build a small ML pipeline with a feature store and monitoring\n3. Parts 8–10: implement a two-stage recommender on a public dataset\n4. Parts 11–15: build a RAG app and a tool-using agent with evals\n5. Parts 16–18: add guardrails, observability, caching and a fine-tuned small model\n6. Parts 19–20: walk through all capstone designs aloud in 45 minutes each"}];
const PARTS = ["System design foundations", "Distributed building blocks", "Machine learning fundamentals", "Data systems for ML", "Model training systems", "Model serving and inference", "MLOps", "Recommendation systems", "Search and retrieval", "Classic AI case studies", "LLM foundations", "LLM serving infrastructure", "Retrieval-augmented generation", "Agents and tool use", "LLM application patterns", "Quality, safety and guardrails", "Scale, reliability and cost", "Fine-tuning and customization", "Large-scale AI platforms", "Design framework and capstone designs"];
const TOTAL = 200, PER = 10;
function idsOf(p){ const a = []; for (let i = (p-1)*PER + 1; i <= p*PER; i++) a.push(i); return a; }
const partOf = id => Math.ceil(id / PER);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "ai-sysdesign-progress-v1";
const LS_LAST = "ai-sysdesign-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try{ await dbRef.set({done:[...done].sort((a,b)=>a-b), updated:Date.now()}); }
  catch(e){ if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; pushRemote(); }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...done])); }catch(e){} }
function toggle(id){
  if (done.has(id)) done.delete(id); else done.add(id);
  saveLocal(); pushRemote(); renderAll();
  toast(done.has(id) ? "Chapter " + id + " marked complete" : "Chapter " + id + " marked not complete");
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(s){
  if (window.marked && marked.parse){
    const html = marked.parse(s, {gfm:true, headerIds:false, mangle:false});
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  }
  return "<pre>" + esc(s) + "</pre>";
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function currentId(){
  const m = location.hash.match(/^#ch-(\d{1,3})$/);
  const n = m ? +m[1] : 0;
  return n >= 1 && n <= TOTAL ? n : 0;
}

/* ---------- header memory bank ---------- */
function renderBank(){
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    html += '<div class="bank-group" title="Part ' + p + ': ' + esc(PARTS[p-1]) + '">';
    for (const i of idsOf(p)){
      html += '<button class="cell' + (done.has(i) ? " done" : "") + (i === cur ? " here" : "") +
        '" data-go="' + i + '" aria-label="Chapter ' + i + (done.has(i) ? ", complete" : "") + '"></button>';
    }
    html += "</div>";
  }
  document.getElementById("bank").innerHTML = html;
  document.getElementById("doneCount").textContent = done.size;
  document.getElementById("pct").textContent = Math.round(done.size * 100 / TOTAL) + "%";
}

/* ---------- sidebar ---------- */
const openParts = new Set();
function renderSide(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const matches = ids.filter(i => !q || byId[i].title.toLowerCase().includes(q) || byId[i].tldr.toLowerCase().includes(q) || String(i) === q);
    if (q && !matches.length) continue;
    const count = ids.filter(i => done.has(i)).length;
    const open = q || openParts.has(p) || partOf(cur) === p;
    html += '<div class="part' + (open ? " open" : "") + '">' +
      '<button class="part-head" data-part="' + p + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="part-num">' + String(p).padStart(2, "0") + '</span>' +
      '<span class="part-name">' + esc(PARTS[p-1]) + '</span>' +
      '<span class="part-count' + (count === PER ? " full" : "") + '">' + count + '/' + PER + '</span></button><ul class="part-list">';
    for (const i of matches){
      html += '<li class="ch-row' + (i === cur ? " active" : "") + '">' +
        '<button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="' + (done.has(i) ? "Mark chapter " + i + " not complete" : "Mark chapter " + i + " complete") + '">' + TICK + '</button>' +
        '<a href="#ch-' + i + '"><span class="n">' + i + '.</span>' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ul></div>";
  }
  if (!html) html = '<p style="color:var(--muted);font-size:14px;padding:8px">No chapters match that search. Try a shorter word like “RAG” or “ranking”.</p>';
  document.getElementById("parts").innerHTML = html;
}

/* ---------- diagrams and charts ---------- */
let mermaidPromise = null, renderSeq = 0;
const svgCache = new Map();
function isDark(){
  const a = document.documentElement.getAttribute("data-theme");
  if (a) return a === "dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function ensureMermaid(){
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (mermaidPromise) return mermaidPromise;
  mermaidPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js";
    s.onload = () => {
      try{
        window.mermaid.initialize({ startOnLoad:false, securityLevel:"strict", theme: isDark() ? "dark" : "neutral",
          fontFamily:"IBM Plex Sans, system-ui, sans-serif", flowchart:{ curve:"basis", htmlLabels:true } });
        resolve(window.mermaid);
      }catch(e){ reject(e); }
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return mermaidPromise;
}
function fitSvg(div){
  const svg = div.querySelector("svg");
  if (!svg) return;
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Diagram");
  const vb = (svg.getAttribute("viewBox") || "").split(/\s+/).map(Number);
  const vbw = vb[2] || 0;
  if (vbw && div.clientWidth && div.clientWidth < vbw * 0.7){
    svg.style.maxWidth = "none";
    svg.style.width = Math.round(vbw * 0.85) + "px";
  }
}
function fmtNum(v){ return Number(v).toLocaleString("en-US", { maximumFractionDigits: 3 }); }
function renderChart(el, spec){
  const max = Math.max(...spec.data.map(d => d[1]));
  const unit = spec.unit || "";
  const sep = (unit === "%" || unit === "×") ? "" : " ";
  let rows = "";
  for (const [label, v] of spec.data){
    let w = spec.log ? (Math.log10(v + 1) / Math.log10(max + 1)) * 100 : (v / max) * 100;
    w = Math.max(w, 1.5);
    rows += '<div class="bar-row"><span class="bar-label">' + esc(String(label)) + '</span><span class="bar-track"><span class="bar" style="width:' + w.toFixed(1) + '%"></span></span><span class="bar-val">' + fmtNum(v) + sep + esc(unit) + '</span></div>';
  }
  const fig = document.createElement("figure");
  fig.className = "chart";
  fig.innerHTML = '<figcaption>' + esc(spec.title || "") + '</figcaption>' + rows + (spec.log ? '<div class="chart-note">Bar lengths use a logarithmic scale.</div>' : "");
  el.replaceWith(fig);
}
function enhance(root){
  root.querySelectorAll("code.language-chart").forEach(code => {
    const pre = code.closest("pre") || code;
    try{ renderChart(pre, JSON.parse(code.textContent)); }catch(e){}
  });
  const blocks = [...root.querySelectorAll("code.language-mermaid")];
  if (!blocks.length) return;
  const seq = ++renderSeq;
  const holders = blocks.map(code => {
    const pre = code.closest("pre") || code;
    const div = document.createElement("div");
    div.className = "diagram loading";
    div.textContent = "Loading diagram…";
    div.dataset.src = code.textContent;
    pre.replaceWith(div);
    if (svgCache.has(div.dataset.src)){ div.classList.remove("loading"); div.innerHTML = svgCache.get(div.dataset.src); div.dataset.done = "1"; fitSvg(div); }
    return div;
  }).filter(div => !div.dataset.done);
  if (!holders.length) return;
  ensureMermaid().then(async m => {
    for (let k = 0; k < holders.length; k++){
      const div = holders[k];
      if (seq !== renderSeq || !div.isConnected) return;
      const id = "mmd-" + seq + "-" + k;
      try{
        const out = await m.render(id, div.dataset.src);
        if (!div.isConnected) return;
        div.classList.remove("loading");
        div.innerHTML = out.svg;
        svgCache.set(div.dataset.src, out.svg);
        fitSvg(div);
      }catch(e){
        const junk = document.getElementById("d" + id); if (junk) junk.remove();
        div.classList.remove("loading");
        div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>";
      }
    }
  }).catch(() => {
    holders.forEach(div => { div.classList.remove("loading"); div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>"; });
  });
}

/* ---------- chapter view ---------- */
function renderChapter(id){
  const c = byId[id];
  const p = partOf(id);
  const ids = idsOf(p);
  const isDone = done.has(id);
  const tabs = ids.map(i =>
    '<button class="tab' + (i === id ? " active" : "") + '" role="tab" aria-selected="' + (i === id) + '" data-go="' + i + '">' +
    '<span class="dot' + (done.has(i) ? " on" : "") + '"></span><span class="tab-t">' + i + '. ' + esc(byId[i].title) + '</span></button>'
  ).join("");
  document.getElementById("main").innerHTML =
    '<p class="crumb">Part ' + p + ' of 20: ' + esc(PARTS[p-1]) + '</p>' +
    '<div class="tabs" role="tablist" aria-label="Chapters in this part">' + tabs + '</div>' +
    '<article>' +
      '<p class="ch-no">Chapter ' + id + ' of ' + TOTAL + '</p>' +
      '<h1 class="ch-title">' + esc(c.title) + '</h1>' +
      '<section class="box tldr"><h2>TL;DR</h2><p>' + inlineMd(c.tldr) + '</p></section>' +
      '<div class="body">' + md(c.body) + '</div>' +
      '<section class="box real"><h2>Real-world use case</h2><p>' + inlineMd(c.real) + '</p></section>' +
      '<div class="done-bar">' +
        '<button class="complete' + (isDone ? " on" : "") + '" data-toggle="' + id + '" aria-pressed="' + isDone + '">' +
          '<span class="tick' + (isDone ? " on" : "") + '">' + TICK + '</span>' + (isDone ? "Completed" : "Mark as complete") + '</button>' +
        '<div class="nav">' +
          '<button class="btn" data-go="' + (id - 1) + '"' + (id === 1 ? " disabled" : "") + '>Previous</button>' +
          '<button class="btn" data-go="' + (id + 1) + '"' + (id === TOTAL ? " disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  enhance(document.getElementById("main"));
}

/* ---------- contents view ---------- */
function renderContents(){
  let html = '<div class="contents"><h1>Contents</h1>' +
    '<p class="lead">Twenty parts, ten chapters each, from fundamentals to frontier-scale platforms. Tick a chapter when you finish it; your progress is saved for next time. Company examples come from public engineering blogs, papers and announcements; product details and prices change, so check current sources before relying on a specific number.</p>' +
    '<div class="contents-actions"><button class="btn" data-go="' + firstUnread() + '">' + (done.size ? "Continue with chapter " + firstUnread() : "Start chapter 1") + '</button>' +
    '<button class="btn" id="resetBtn">Reset progress</button></div><div class="grid">';
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const count = ids.filter(i => done.has(i)).length;
    html += '<section class="pcard"><h2>Part ' + p + ': ' + esc(PARTS[p-1]) + '</h2><div class="meta">' + count + ' of ' + PER + ' complete</div><ol>';
    for (const i of ids){
      html += '<li><button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="Toggle chapter ' + i + '">' + TICK + '</button><a href="#ch-' + i + '">' + i + '. ' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ol></section>";
  }
  document.getElementById("main").innerHTML = html + "</div></div>";
}
function firstUnread(){ for (let i = 1; i <= TOTAL; i++) if (!done.has(i)) return i; return TOTAL; }

/* ---------- routing ---------- */
let lastRendered = null;
function renderAll(){
  const id = currentId();
  renderBank(); renderSide();
  const y = window.scrollY;
  if (id) renderChapter(id); else renderContents();
  if (lastRendered === location.hash) window.scrollTo(0, y);
  lastRendered = location.hash;
}
function route(){
  const id = currentId();
  if (!id && location.hash !== "#contents"){
    let last = 0; try{ last = +localStorage.getItem(LS_LAST) || 0; }catch(e){}
    location.replace("#ch-" + (last >= 1 && last <= TOTAL ? last : 1));
    return;
  }
  if (id){ try{ localStorage.setItem(LS_LAST, id); }catch(e){} }
  document.body.classList.remove("drawer");
  renderAll();
  window.scrollTo(0, 0);
  const active = document.querySelector(".ch-row.active");
  if (active) active.scrollIntoView({block:"nearest"});
  const tab = document.querySelector(".tab.active");
  if (tab && tab.parentElement){ const r = tab.parentElement; const left = tab.offsetLeft - r.offsetLeft; if (left < r.scrollLeft || left + tab.offsetWidth > r.scrollLeft + r.clientWidth) r.scrollLeft = left - 16; }
}
function go(id){ if (id >= 1 && id <= TOTAL) location.hash = "#ch-" + id; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){ e.preventDefault(); toggle(+t.dataset.toggle); return; }
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled){ go(+g.dataset.go); return; }
  const ph = e.target.closest("[data-part]");
  if (ph){
    const p = +ph.dataset.part;
    const el = ph.parentElement;
    const isOpen = el.classList.toggle("open");
    if (isOpen) openParts.add(p); else openParts.delete(p);
    ph.setAttribute("aria-expanded", isOpen);
    return;
  }
  if (e.target.id === "resetBtn"){
    if (confirm("Clear all 200 ticks? This can’t be undone.")){ done.clear(); saveLocal(); pushRemote(); renderAll(); toast("Progress reset"); }
  }
});
document.getElementById("search").addEventListener("input", renderSide);
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.add("drawer"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = currentId(); if (!id) return;
  if (e.key === "ArrowRight") go(id + 1);
  else if (e.key === "ArrowLeft") go(id - 1);
});
function setTopH(){ document.documentElement.style.setProperty("--top-h", document.getElementById("top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);
window.addEventListener("hashchange", route);
setTopH();
route();
initSync();
</script>
</body>
</html>

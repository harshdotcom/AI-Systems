<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI System Design: 200 Chapters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1F1; --surface:#FFFFFF; --surface-2:#F8F6F6; --ink:#1C1718; --muted:#5F5759; --line:#DFD8D9;
  --accent:#9C2F55; --accent-soft:#F6E1E8; --accent-ink:#FFFFFF;
  --amber:#B97A0B; --tldr-bg:#FFF5DC; --tldr-line:#D49A22;
  --indigo:#1F5E6E; --real-bg:#E6F1F3; --real-line:#2F7C8F;
  --code-bg:#1C1718; --code-ink:#EEE4E6; --inline-code:#EEE6E8;
  --cell-empty:#E2DADB; --shadow:0 1px 0 rgba(28,23,24,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151213; --surface:#1C1819; --surface-2:#241F20; --ink:#EEE7E8; --muted:#A99FA1; --line:#352D2F;
    --accent:#EE8FB0; --accent-soft:#3D1F2A; --accent-ink:#2E0D19;
    --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
    --indigo:#86CBDA; --real-bg:#13262B; --real-line:#4FA3B6;
    --code-bg:#0F0C0D; --code-ink:#E4DADC; --inline-code:#2D2527;
    --cell-empty:#352D2F; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151213; --surface:#1C1819; --surface-2:#241F20; --ink:#EEE7E8; --muted:#A99FA1; --line:#352D2F;
  --accent:#EE8FB0; --accent-soft:#3D1F2A; --accent-ink:#2E0D19;
  --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
  --indigo:#86CBDA; --real-bg:#13262B; --real-line:#4FA3B6;
  --code-bg:#0F0C0D; --code-ink:#E4DADC; --inline-code:#2D2527;
  --cell-empty:#352D2F; --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header with the memory-bank progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:20px;padding:12px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted)}
.bank{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bank-row{display:flex;gap:4px;flex-wrap:nowrap;min-width:0}
.bank-group{flex:1;min-width:0;display:flex;gap:2px;padding:3px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.cell{flex:1;min-width:2px;max-width:10px;height:18px;border-radius:2px;background:var(--cell-empty);border:0;padding:0;cursor:pointer;transition:background .2s}
.cell.done{background:var(--accent)}
.cell.here{box-shadow:0 0 0 2px var(--amber)}
.bank-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bank-meta strong{color:var(--ink);font-weight:600}
.top-actions{display:flex;gap:8px}
.btn{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.menu-btn{display:none}

/* Shell */
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,76px));height:calc(100dvh - var(--top-h,76px) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg)}
.search{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
.part{margin-bottom:4px}
.part-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:8px;cursor:pointer}
.part-head:hover{background:var(--surface-2)}
.part-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);width:22px;flex:none}
.part-name{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.part-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.part-count.full{color:var(--accent);font-weight:600}
.part-list{list-style:none;margin:0 0 6px;padding:0 0 0 30px;display:none}
.part.open .part-list{display:block}
.ch-row{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:6px}
.ch-row.active{background:var(--accent-soft)}
.ch-row a{flex:1;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.ch-row a .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.tick{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:11px;height:11px;opacity:0}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{opacity:1;color:var(--accent-ink)}
.hidden{display:none!important}

/* Main reading area */
.main{padding:24px 32px 80px;min-width:0}
.crumb{font-size:14px;color:var(--muted);margin:0 0 12px}
.crumb a{color:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;font-size:14px;color:var(--muted);max-width:240px;text-align:left}
.tab .tab-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--cell-empty)}
.tab .dot.on{background:var(--accent)}
article{max-width:780px}
.ch-no{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--accent);font-size:15px;margin:0}
h1.ch-title{font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:6px 0 22px;font-weight:700;text-wrap:balance}
.box{border-radius:10px;padding:16px 18px;margin:0 0 26px;border-left:4px solid}
.box h2{font-size:14px;margin:0 0 6px;font-weight:600}
.box p{margin:0}
.tldr{background:var(--tldr-bg);border-color:var(--tldr-line)}
.tldr h2{color:var(--amber)}
.tldr p{font-size:17px;line-height:1.55}
.real{background:var(--real-bg);border-color:var(--real-line);margin-top:34px}
.real h2{color:var(--indigo)}
.body h3{font-size:20px;margin:30px 0 10px;letter-spacing:-.01em}
.body p{margin:0 0 14px}
.body ul,.body ol{padding-left:22px;margin:0 0 16px}
.body li{margin:4px 0}
.body li input[type=checkbox]{margin-right:6px;accent-color:var(--accent)}
.body code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.88em;background:var(--inline-code);padding:1px 5px;border-radius:4px}
.body pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13.5px;line-height:1.55;margin:0 0 18px}
.body pre code{background:none;padding:0;font-size:inherit;color:inherit}
.table-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.body table{border-collapse:collapse;width:100%;font-size:14px}
.body th,.body td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.body th{background:var(--surface-2);font-weight:600}
.body tr:last-child td{border-bottom:0}
.body strong{font-weight:600}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.complete{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:15px}
.complete .tick{border-color:currentColor;pointer-events:none}
.complete.on{background:var(--accent);color:var(--accent-ink)}
.complete.on .tick{background:var(--accent-ink);border-color:var(--accent-ink)}
.complete.on .tick svg{opacity:1;color:var(--accent)}
.nav{display:flex;gap:8px}
.nav .btn[disabled]{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}

/* Diagrams and charts */
.diagram{margin:0 0 20px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
.diagram svg{display:block;margin:0 auto;height:auto}
.diagram.loading{color:var(--muted);font-size:14px}
.chart{margin:0 0 20px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chart figcaption{font-weight:600;font-size:14px;margin:0 0 10px}
.bar-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.bar-label{color:var(--ink);line-height:1.3}
.bar-track{height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar{display:block;height:100%;background:var(--accent);border-radius:7px 0 0 7px}
.bar-val{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.chart-note{font-size:12px;color:var(--muted);margin-top:6px}

/* Contents view */
.contents h1{font-size:32px;margin:0 0 6px;letter-spacing:-.02em}
.contents .lead{color:var(--muted);margin:0 0 24px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.pcard h2{font-size:15px;margin:0 0 2px;line-height:1.3}
.pcard .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pcard ol{list-style:none;padding:0;margin:0}
.pcard li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13.5px;line-height:1.35}
.pcard li a{color:var(--ink);text-decoration:none;flex:1}
.pcard li a:hover{text-decoration:underline}
.contents-actions{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}

/* Mobile */
.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);height:auto;z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .menu-btn{display:inline-block}
  .main{padding:18px 16px 60px}
  .top-inner{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand{flex:1}
  .bank{order:3;flex-basis:100%}
  .bank-row{gap:3px}
  .bank-group{gap:1px;padding:2px}
  .cell{height:12px;max-width:none;min-width:0}
  .bank-row{flex-wrap:wrap;row-gap:3px;gap:3px}
  .bank-group{flex:0 0 calc(10% - 2.7px);gap:1px;padding:1px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<header class="top" id="top">
  <div class="top-inner">
    <button class="btn menu-btn" id="menuBtn" aria-label="Open chapter list">Chapters</button>
    <div class="brand"><b>AI system design</b><span>From fundamentals to frontier-scale AI platforms</span></div>
    <div class="bank" aria-label="Course progress">
      <div class="bank-row" id="bank"></div>
      <div class="bank-meta"><span><strong id="doneCount">0</strong> of 200 chapters complete</span><span id="pct">0%</span></div>
    </div>
    <div class="top-actions"><a class="btn" href="#contents" style="text-decoration:none">Contents</a></div>
  </div>
</header>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <nav class="side" id="side" aria-label="Chapters">
    <input class="search" id="search" type="search" placeholder="Search chapters" aria-label="Search chapters">
    <div id="parts"></div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const CHAPTERS = [{"id": 1, "title": "What AI system design is", "tldr": "AI system design is the practice of turning a business problem into a working, reliable, scalable system that uses machine learning or generative models. It combines classic distributed-systems design with data pipelines, model lifecycle and evaluation.", "real": "Google’s 2015 paper “Hidden Technical Debt in Machine Learning Systems” showed that in real ML systems the model code is a small fraction of the whole. Most of the system is data collection, feature extraction, serving infrastructure, monitoring and configuration.", "body": "### The whole system, not just the model\n\n```mermaid\nflowchart LR\n  A[Business goal] --> B[Data collection]\n  B --> C[Data and features]\n  C --> D[Training]\n  D --> E[Evaluation]\n  E --> F[Serving]\n  F --> G[Users]\n  G -->|feedback and logs| B\n  F --> H[Monitoring]\n  H --> D\n```\n\n### What an AI system designer decides\n\n| Area | Example decisions |\n|---|---|\n| Problem framing | Classification, ranking, generation, or no ML at all |\n| Data | Sources, labels, freshness, privacy |\n| Model | Type, size, build vs buy, fine-tune vs prompt |\n| Serving | Batch vs real time, latency budget, hardware |\n| Quality | Offline metrics, online experiments, guardrails |\n| Operations | Monitoring, retraining, cost, incidents |\n\n### Traditional vs AI system design\n\n| Traditional system | AI system |\n|---|---|\n| Behavior defined by code | Behavior learned from data |\n| Deterministic outputs | Probabilistic outputs |\n| Tested with unit tests | Evaluated statistically |\n| Changes when code changes | Also changes when data changes |\n\n### How this book is organized\n\nParts 1–2 cover system-design fundamentals; Parts 3–10 cover classical ML systems; Parts 11–18 cover LLM and generative AI systems; Parts 19–20 cover large-scale platforms and complete design walkthroughs."}, {"id": 2, "title": "Requirements: functional and non-functional", "tldr": "Every design starts with requirements. Functional requirements say what the system must do; non-functional requirements say how well: latency, throughput, availability, accuracy, cost, privacy and compliance. AI systems add quality and safety requirements.", "real": "Netflix designs its recommendation systems around engagement and retention goals. Its 2016 paper by Gomez-Uribe and Hunt reported that about 80% of hours streamed on Netflix came from recommendations, which shows why the business requirement drives the design.", "body": "### Requirement checklist\n\n| Category | Questions |\n|---|---|\n| Functional | What inputs, outputs and user actions? |\n| Scale | Users, requests per second, data volume |\n| Latency | p50 / p95 / p99 targets |\n| Availability | Uptime target, acceptable degradation |\n| Quality | Accuracy, relevance, groundedness targets |\n| Freshness | How current must data and models be? |\n| Cost | Budget per request or per month |\n| Safety | Harmful output, bias, abuse |\n| Privacy and compliance | PII, data residency, regulations |\n\n### Example: AI support assistant\n\n| Type | Requirement |\n|---|---|\n| Functional | Answer questions from help docs; escalate to human |\n| Scale | 50,000 conversations per day |\n| Latency | First token under 1.5 s (p95) |\n| Quality | ≥ 90% answers grounded in docs |\n| Safety | Never invent refund policies |\n| Cost | Under $0.05 per conversation |\n\n### Tip\n\nWrite requirements as **measurable numbers**. “Fast and accurate” cannot be designed or tested."}, {"id": 3, "title": "Back-of-the-envelope estimation", "tldr": "Quick estimates of traffic, storage, bandwidth and compute keep designs grounded. Convert daily numbers to per-second rates, multiply by peak factors, and estimate model compute and memory before choosing infrastructure.", "real": "In 2024 Character.AI reported serving more than 20,000 inference queries per second, which it compared to roughly 20% of Google Search’s request volume. Numbers like this determine whether you need one GPU or thousands.", "body": "### Core conversions\n\n| Quantity | Approximation |\n|---|---|\n| Seconds per day | \\~86,400 (≈ 10⁵) |\n| 1 million requests/day | \\~12 requests/second average |\n| Peak factor | 2–5 × average |\n| 1 KB × 1 billion | 1 TB |\n\n### Worked example: chat assistant\n\n```\nDaily active users:        1,000,000\nMessages per user per day: 10\nRequests/day:              10,000,000  → ~116 req/s average, ~350 req/s peak (3×)\nTokens per request:        1,500 in + 300 out\nOutput tokens/s at peak:   350 × 300 / (≈10 s per answer) ≈ 10,500 tokens/s\nStorage for logs:          10M × 8 KB ≈ 80 GB/day ≈ 29 TB/year\n```\n\n### Model memory estimate\n\n```\nWeights (bytes) ≈ parameters × bytes per parameter\n8B model in 16-bit ≈ 16 GB; in 4-bit ≈ 5 GB\n```\n\n### Habit\n\nState assumptions explicitly, round aggressively, and check whether the answer changes the design (one machine vs a fleet)."}, {"id": 4, "title": "Latency numbers and budgets", "tldr": "Know the rough cost of common operations, then split the end-to-end latency target into a budget per component. AI components, especially model inference, usually consume most of the budget.", "real": "Jeff Dean of Google popularized the “latency numbers every programmer should know” list, which shows memory access in nanoseconds, datacenter round trips in about half a millisecond, and cross-continent round trips in about 150 milliseconds. Those magnitudes still guide design.", "body": "### Approximate magnitudes\n\n| Operation | Time |\n|---|---|\n| Main memory reference | \\~100 ns |\n| SSD random read | \\~16–150 µs |\n| Round trip within a datacenter | \\~0.5 ms |\n| Redis/memcached lookup | \\~0.5–1 ms |\n| Database indexed query | \\~1–10 ms |\n| Small ML model inference (CPU) | \\~1–20 ms |\n| Cross-continent round trip | \\~150 ms |\n| LLM first token | \\~200 ms – 2 s |\n| LLM full response (300 tokens) | \\~3–15 s |\n\n### Latency budget example (search ranking, 200 ms p99)\n\n| Stage | Budget |\n|---|---|\n| Network + gateway | 20 ms |\n| Query understanding | 15 ms |\n| Candidate retrieval | 40 ms |\n| Feature fetch | 30 ms |\n| Ranking model | 60 ms |\n| Business rules + response | 15 ms |\n| Headroom | 20 ms |\n\n### Rule\n\nDesign to **percentiles** (p95/p99), not averages. Tail latency is what users feel at scale."}, {"id": 5, "title": "Availability, SLAs, SLOs and error budgets", "tldr": "Availability targets determine redundancy and cost. Define service level indicators (what you measure), objectives (internal targets) and agreements (external promises). Error budgets turn reliability into a resource teams can spend on change.", "real": "Google’s Site Reliability Engineering book introduced error budgets: if a service’s objective is 99.9% availability, the remaining 0.1% is a budget for risk. When it is used up, teams slow feature launches and focus on reliability.", "body": "### Downtime per year by availability\n\n```chart\n{\"title\": \"Allowed downtime per year\", \"unit\": \"hours\", \"data\": [[\"99% (two nines)\", 87.6], [\"99.9% (three nines)\", 8.76], [\"99.99% (four nines)\", 0.876], [\"99.999% (five nines)\", 0.0876]]}\n```\n\n### Terms\n\n| Term | Meaning | Example |\n|---|---|---|\n| SLI | Measured indicator | % of requests answered in < 2 s |\n| SLO | Internal target | 99.5% over 30 days |\n| SLA | Contract with customers | 99.9% or service credits |\n| Error budget | 100% − SLO | 0.5% failed or slow requests |\n\n### AI-specific SLIs\n\n- Time to first token, tokens per second\n- % of answers passing groundedness checks\n- % of requests served by the primary model (not fallback)\n- Model freshness (hours since last retrain)\n\n### Design implication\n\nEach extra “nine” roughly multiplies cost and complexity. Pick the lowest target the business truly needs."}, {"id": 6, "title": "Scalability: vertical and horizontal", "tldr": "Vertical scaling uses bigger machines; horizontal scaling adds more machines. Stateless services scale horizontally behind load balancers; stateful components need replication and partitioning. GPU workloads add their own scaling limits.", "real": "Stack Overflow famously served very large traffic for years from a small number of powerful, vertically scaled servers, while companies like Netflix built on horizontally scaled microservices in the cloud. Both approaches can work; the choice depends on workload and team.", "body": "### Comparison\n\n| | Vertical | Horizontal |\n|---|---|---|\n| How | Bigger CPU, RAM, GPU | More instances |\n| Limit | Largest available machine | Coordination complexity |\n| Failure | Single point of failure | Partial failures |\n| Good for | Databases, large models on one node | Stateless APIs, inference replicas |\n\n### Scaling AI components\n\n```mermaid\nflowchart LR\n  LB[Load balancer] --> R1[Model replica 1]\n  LB --> R2[Model replica 2]\n  LB --> R3[Model replica 3]\n  R1 --> FS[(Feature store)]\n  R2 --> FS\n  R3 --> FS\n```\n\n| Component | Typical scaling |\n|---|---|\n| API / app servers | Horizontal, stateless |\n| Model inference | Horizontal replicas; vertical for huge models (multi-GPU) |\n| Feature store | Partitioned key-value store |\n| Vector index | Sharded and replicated |\n| Training | Distributed across many GPUs |\n\n### Principle\n\nKeep services **stateless** wherever possible, and push state into purpose-built stores."}, {"id": 7, "title": "Consistency, CAP and PACELC", "tldr": "In distributed systems you trade consistency, availability and latency. CAP says that during a network partition you must choose between consistency and availability; PACELC adds that even without partitions you trade latency against consistency.", "real": "Amazon’s 2007 Dynamo paper described a highly available key-value store that chose availability and eventual consistency for the shopping cart. Google’s Spanner (2012) chose strong consistency at global scale using synchronized clocks (TrueTime).", "body": "### Consistency models\n\n| Model | Guarantee | Example use |\n|---|---|---|\n| Strong | Reads see the latest write | Payments, inventory |\n| Read-your-writes | A user sees their own updates | Profile edits |\n| Eventual | Replicas converge over time | Feeds, counters, recommendations |\n\n### Where AI systems sit\n\n| Component | Typical choice |\n|---|---|\n| Feature store (online) | Eventual consistency, low latency |\n| Model registry | Strong consistency |\n| User conversation history | Read-your-writes |\n| Recommendation caches | Eventual |\n| Billing and quotas | Strong |\n\n### PACELC summary\n\n```\nIf Partition → choose Availability or Consistency\nElse         → choose Latency or Consistency\n```\n\n### Rule of thumb\n\nMost ML features tolerate slightly stale data; money, permissions and safety decisions do not."}, {"id": 8, "title": "Load balancing and traffic routing", "tldr": "Load balancers spread requests across servers, remove unhealthy instances and enable zero-downtime deploys. AI workloads need smarter routing because requests vary hugely in cost (a short query vs a long document).", "real": "Netflix built and open-sourced client-side load balancing (Ribbon) and an edge gateway (Zuul) for its microservices. For LLM serving, projects such as llm-d add routing that is aware of each replica’s KV cache and queue depth.", "body": "### Algorithms\n\n| Algorithm | Behavior | Fit |\n|---|---|---|\n| Round robin | Rotate servers | Uniform requests |\n| Least connections | Fewest active requests | Variable durations |\n| Weighted | By capacity | Mixed hardware |\n| Consistent hashing | Same key → same server | Caches, sessions |\n| Latency / queue-aware | Fastest or least loaded | Model inference |\n| Cache-aware | Server already holding relevant cache | LLM prefix caching |\n\n### Layers\n\n```mermaid\nflowchart LR\n  U[Users] --> DNS[Geo DNS]\n  DNS --> L7[L7 load balancer / API gateway]\n  L7 --> S1[Service pool A]\n  L7 --> S2[Service pool B]\n  S1 --> M[Model serving pool]\n```\n\n### Health checks\n\nUse both liveness (process alive) and readiness (model loaded and warmed). Never route traffic to a model server that is still loading weights."}, {"id": 9, "title": "Caching fundamentals", "tldr": "Caches store results close to where they are needed to cut latency and cost. Choose what to cache, where (client, CDN, application, database), how long, and how to invalidate. AI systems cache features, embeddings, predictions and even LLM responses.", "real": "Facebook’s 2013 paper “Scaling Memcache at Facebook” described a cache tier handling billions of requests per second in front of its databases. Today’s LLM providers apply caching at the token level: prompt caching reuses computation for repeated prompt prefixes.", "body": "### Cache patterns\n\n| Pattern | How | Use |\n|---|---|---|\n| Cache-aside | App reads cache, falls back to DB, then fills cache | General purpose |\n| Write-through | Write to cache and DB together | Read-heavy, consistency needed |\n| Write-back | Write to cache, flush later | High write throughput |\n| Precomputation | Batch job fills cache | Recommendations, embeddings |\n\n### What AI systems cache\n\n| Item | TTL example |\n|---|---|\n| User features | Minutes |\n| Item embeddings | Until model version changes |\n| Batch recommendations | Hours to a day |\n| LLM exact-match responses | Hours (non-personalized only) |\n| Prompt prefix (KV) cache | Minutes, provider-managed |\n\n### Pitfalls\n\n- Stale or wrong data after model updates (version your cache keys)\n- Caching personalized or sensitive responses across users\n- Cache stampede when a hot key expires (use jitter and request coalescing)"}, {"id": 10, "title": "Choosing whether to use AI at all", "tldr": "Start every design by asking whether ML is necessary. Rules, heuristics or search may be simpler, cheaper and more reliable. Use ML when patterns are too complex for rules, data exists, and errors are tolerable or manageable.", "real": "Google’s “Rules of Machine Learning” guide by Martin Zinkevich advises: “Don’t be afraid to launch a product without machine learning,” and to use simple heuristics first. Many successful ML products started from a heuristic baseline that the model later had to beat.", "body": "### Decision checklist\n\n| Question | If “no” |\n|---|---|\n| Is the pattern too complex for rules? | Use rules |\n| Is there enough data (or can it be collected)? | Collect first, or use rules |\n| Is the cost of errors acceptable or controllable? | Add human review or avoid ML |\n| Will the problem change over time? | Rules may suffice |\n| Can success be measured? | Define metrics first |\n\n### Choosing the AI approach\n\n```mermaid\nflowchart TD\n  A[Problem] --> B{Rules work well?}\n  B -- yes --> R[Rules / heuristics]\n  B -- no --> C{Labeled data available?}\n  C -- yes --> S[Supervised ML]\n  C -- no --> D{Language or content task?}\n  D -- yes --> L[LLM with prompting or RAG]\n  D -- no --> E[Collect data or use unsupervised methods]\n```\n\n### Baseline first\n\nAlways ship or at least measure a simple baseline (rules, popularity, keyword search). It sets the bar and gives a fallback when the model fails."}, {"id": 11, "title": "Databases: SQL, NoSQL and specialized stores", "tldr": "Pick storage by access pattern. Relational databases suit transactions and complex queries; key-value and wide-column stores suit huge, simple lookups; document stores suit flexible schemas; search engines and vector databases suit retrieval; time-series stores suit metrics.", "real": "Apache Cassandra was created at Facebook for inbox search and open-sourced in 2008, combining ideas from Amazon’s Dynamo and Google’s Bigtable. Many ML feature stores use similar key-value or wide-column stores for low-latency online features.", "body": "### Store types\n\n| Type | Examples | AI use |\n|---|---|---|\n| Relational | PostgreSQL, MySQL | Metadata, users, billing, registries |\n| Key-value | Redis, DynamoDB | Online features, caches, sessions |\n| Wide-column | Cassandra, Bigtable, HBase | Large-scale features, event history |\n| Document | MongoDB | Flexible app data, conversation logs |\n| Search | Elasticsearch, OpenSearch | Keyword search, logs |\n| Vector | pgvector, Milvus, Pinecone, Weaviate | Embedding similarity search |\n| Columnar warehouse | BigQuery, Snowflake | Analytics, training datasets |\n| Object storage | S3, GCS | Datasets, models, checkpoints |\n\n### Selection questions\n\n1. Point lookups or complex queries?\n2. Read/write ratio and volume?\n3. Consistency needs?\n4. Latency target?\n5. Growth over 2–3 years?\n\n### Polyglot persistence\n\nReal AI systems usually combine several stores: a warehouse for training data, a key-value store for online features, object storage for models, and a vector index for retrieval."}, {"id": 12, "title": "Replication and sharding", "tldr": "Replication copies data for availability and read scale; sharding splits data across machines for write scale and size. Choose shard keys that spread load evenly and keep related data together. Vector indexes and feature stores use the same techniques.", "real": "Discord described moving its message storage from Cassandra to ScyllaDB in 2023, partitioning messages by channel and time bucket. Partition-key choice and hot partitions were central design concerns, the same ones that affect large feature stores and vector indexes.", "body": "### Replication modes\n\n| Mode | Trade-off |\n|---|---|\n| Leader–follower (async) | Fast writes, possible stale reads |\n| Leader–follower (sync) | Consistent, slower writes |\n| Multi-leader | Writes in many regions, conflicts possible |\n| Leaderless (quorum) | High availability, tunable consistency |\n\n### Sharding strategies\n\n| Strategy | Pros | Cons |\n|---|---|---|\n| Hash-based | Even distribution | Range queries hard |\n| Range-based | Range queries easy | Hot spots |\n| Directory-based | Flexible | Lookup service needed |\n| Geographic | Data residency, low latency | Uneven load |\n\n### Sharding a vector index\n\n```mermaid\nflowchart LR\n  Q[Query embedding] --> C[Coordinator]\n  C --> S1[Shard 1 top-k]\n  C --> S2[Shard 2 top-k]\n  C --> S3[Shard 3 top-k]\n  S1 --> M[Merge global top-k]\n  S2 --> M\n  S3 --> M\n```\n\n### Watch for\n\nHot keys (a celebrity user, a viral item), rebalancing cost, and cross-shard queries."}, {"id": 13, "title": "Message queues and event streaming", "tldr": "Queues and logs decouple producers from consumers, absorb traffic spikes and enable asynchronous processing. Event streams (Kafka-style logs) also feed real-time features, model monitoring and training data.", "real": "Apache Kafka was developed at LinkedIn and open-sourced in 2011 to handle activity streams and operational data. It became the backbone for real-time data pipelines across the industry, including many ML feature pipelines.", "body": "### Queue vs log\n\n| | Message queue | Event log (stream) |\n|---|---|---|\n| Examples | RabbitMQ, SQS | Kafka, Kinesis, Pub/Sub |\n| Consumption | Message removed after processing | Retained; many consumers replay |\n| Ordering | Often per queue | Per partition |\n| Use | Task distribution | Event sourcing, analytics, ML features |\n\n### AI uses of streams\n\n```mermaid\nflowchart LR\n  App[App events] --> K[(Event stream)]\n  K --> RT[Real-time feature jobs]\n  K --> LAKE[Data lake for training]\n  K --> MON[Model monitoring]\n  RT --> FS[(Online feature store)]\n```\n\n### Delivery semantics\n\n| Semantics | Meaning |\n|---|---|\n| At-most-once | May lose messages |\n| At-least-once | May duplicate; consumers must be idempotent |\n| Exactly-once | Supported in specific systems with constraints |\n\n### Asynchronous inference\n\nLong jobs (document processing, video analysis, batch LLM tasks) should be queued, processed by workers, and results returned via callback or polling."}, {"id": 14, "title": "Batch vs stream processing", "tldr": "Batch processing handles large datasets on a schedule; stream processing handles events continuously with low latency. ML systems often need both: batch for training data and heavy features, streaming for fresh features and real-time decisions.", "real": "Uber’s Michelangelo platform supported both batch features computed with Spark and near-real-time features computed from Kafka event streams, so models like ETA prediction could use both historical and very recent signals.", "body": "### Comparison\n\n| | Batch | Stream |\n|---|---|---|\n| Latency | Minutes to hours | Milliseconds to seconds |\n| Tools | Spark, BigQuery, dbt | Flink, Kafka Streams, Spark Streaming |\n| Complexity | Lower | Higher (state, ordering, late data) |\n| Use | Training sets, daily features | Fraud signals, trending items |\n\n### Lambda vs Kappa architectures\n\n| Architecture | Idea |\n|---|---|\n| Lambda | Separate batch and speed layers, merged at query time |\n| Kappa | Single streaming pipeline; reprocess by replaying the log |\n\n### Feature freshness examples\n\n| Feature | Freshness need |\n|---|---|\n| User’s lifetime purchases | Daily batch fine |\n| Clicks in last 10 minutes | Streaming |\n| Card transactions in last hour | Streaming (fraud) |\n| Item popularity this week | Hourly batch |\n\n### Principle\n\nUse the slowest processing that meets the freshness requirement; streaming adds real operational cost."}, {"id": 15, "title": "Object storage, data lakes and lakehouses", "tldr": "Object storage holds raw data, datasets, model artifacts and checkpoints cheaply at massive scale. Data lakes organize raw files; lakehouses add table formats with transactions and schema on top, serving both analytics and ML.", "real": "Databricks popularized the lakehouse architecture with Delta Lake, while Netflix created Apache Iceberg and Uber created Apache Hudi. These open table formats now underpin many ML training-data platforms.", "body": "### Layers\n\n```mermaid\nflowchart TB\n  RAW[Raw zone: logs, files, events] --> CLEAN[Cleaned zone: validated tables]\n  CLEAN --> CUR[Curated zone: features, training sets]\n  CUR --> TRAIN[Training jobs]\n  CUR --> BI[Analytics and dashboards]\n```\n\n### Table formats\n\n| Format | Origin | Feature |\n|---|---|---|\n| Delta Lake | Databricks | ACID transactions, time travel |\n| Apache Iceberg | Netflix | Large tables, schema evolution |\n| Apache Hudi | Uber | Upserts, incremental processing |\n\n### Why they matter for ML\n\n- **Time travel:** reproduce the exact training data of a past model\n- **Schema evolution:** add features without breaking pipelines\n- **ACID:** consistent reads during writes\n\n### Storage practices\n\nPartition by date and key fields, use columnar formats (Parquet), version datasets, and apply lifecycle policies to old raw data."}, {"id": 16, "title": "API design: REST, gRPC and streaming", "tldr": "Choose API styles by client and latency needs: REST/JSON for broad compatibility, gRPC for fast internal service calls, and streaming (server-sent events or WebSockets) for token-by-token LLM output and real-time voice.", "real": "OpenAI’s API popularized streaming responses using server-sent events, letting chat interfaces display tokens as they are generated. Its request format became a de facto standard that many inference servers, such as vLLM, now implement.", "body": "### Styles\n\n| Style | Strengths | Typical AI use |\n|---|---|---|\n| REST + JSON | Simple, universal | Public prediction APIs |\n| gRPC + Protobuf | Fast, typed, bidirectional streaming | Internal model serving |\n| Server-sent events | Simple one-way streaming | LLM token streaming |\n| WebSockets | Two-way, low latency | Voice agents, collaborative apps |\n| Async job API | Submit, poll or callback | Long-running inference |\n\n### Prediction API design\n\n```json\nPOST /v1/predict\n{ \"model\": \"fraud-v12\", \"request_id\": \"r-123\",\n  \"features\": { \"amount\": 129.5, \"country\": \"IN\", \"card_age_days\": 42 } }\n\n→ { \"score\": 0.83, \"decision\": \"review\", \"model_version\": \"fraud-v12.3\", \"latency_ms\": 18 }\n```\n\n### Good practices\n\n- Return the model version with every prediction\n- Idempotency keys for retried requests\n- Explicit timeouts and error codes\n- Versioned endpoints (/v1, /v2)"}, {"id": 17, "title": "Monoliths, microservices and modular design", "tldr": "Monoliths are simpler to build and operate; microservices allow independent scaling and deployment at the cost of complexity. AI systems often separate model serving, feature computation and orchestration into services because they scale and change differently.", "real": "Amazon Prime Video’s team wrote in 2023 that moving a video-quality monitoring tool from distributed serverless components back to a single process reduced its infrastructure cost by over 90%. Architecture should follow workload needs, not fashion.", "body": "### Comparison\n\n| | Monolith | Microservices |\n|---|---|---|\n| Development speed (small team) | Fast | Slower |\n| Independent scaling | No | Yes |\n| Deployment | One unit | Many units |\n| Failure isolation | Low | Higher |\n| Operational complexity | Low | High |\n\n### Common AI service boundaries\n\n```mermaid\nflowchart LR\n  APP[Application service] --> ORCH[AI orchestration service]\n  ORCH --> FEAT[Feature service]\n  ORCH --> MODEL[Model serving]\n  ORCH --> RET[Retrieval service]\n  MODEL --> GPU[GPU pool]\n```\n\n### Why separate model serving\n\n- GPUs are expensive and scale differently from CPUs\n- Models deploy on a different cadence than app code\n- Several applications can share one model service\n\n### Advice\n\nStart modular inside one service; split out components when scaling, team ownership or deployment cadence demands it."}, {"id": 18, "title": "API gateways and service mesh", "tldr": "An API gateway is the front door: authentication, rate limits, routing, request validation and logging. A service mesh handles service-to-service traffic: retries, timeouts, encryption and observability. LLM gateways extend the gateway idea to model routing and token accounting.", "real": "Netflix’s Zuul gateway and the Envoy proxy (created at Lyft) are widely used examples. For AI, products such as LiteLLM, Portkey and Cloudflare AI Gateway add model routing, fallbacks, caching and per-team token budgets in front of multiple LLM providers.", "body": "### Gateway responsibilities\n\n| Responsibility | AI-specific addition |\n|---|---|\n| Authentication | Per-team API keys |\n| Rate limiting | Tokens per minute, not only requests |\n| Routing | Choose model or provider |\n| Caching | Exact-match or semantic response cache |\n| Logging | Prompts, tokens, cost (with redaction) |\n| Policy | Guardrails, data-loss prevention |\n| Failover | Fallback model or provider |\n\n### Placement\n\n```mermaid\nflowchart LR\n  C[Clients] --> GW[API / LLM gateway]\n  GW --> A[Internal model A]\n  GW --> B[Provider B API]\n  GW --> D[Provider C API]\n  GW --> LOG[(Usage and audit logs)]\n```\n\n### Mesh features\n\nMutual TLS, retries with budgets, circuit breakers, traffic splitting for canary releases, and distributed tracing headers."}, {"id": 19, "title": "Rate limiting and backpressure", "tldr": "Rate limiting protects systems and budgets from overload and abuse. Use token bucket or sliding window algorithms per user, key and tenant. Backpressure (queues, 429 responses, load shedding) keeps the system stable when demand exceeds capacity.", "real": "Stripe’s engineering blog described using several rate limiters and load shedders in production: request rate limits, concurrent request limits, and shedding of less critical traffic during incidents. LLM APIs apply the same ideas with tokens-per-minute limits.", "body": "### Algorithms\n\n| Algorithm | Behavior |\n|---|---|\n| Fixed window | Simple; bursts at window edges |\n| Sliding window | Smoother |\n| Token bucket | Allows bursts up to bucket size, steady refill |\n| Leaky bucket | Constant output rate |\n| Concurrency limit | Max in-flight requests |\n\n### Token bucket sketch\n\n```python\ndef allow(bucket, cost=1):\n    now = time.time()\n    bucket.tokens = min(bucket.capacity,\n                        bucket.tokens + (now - bucket.last) * bucket.refill_rate)\n    bucket.last = now\n    if bucket.tokens >= cost:\n        bucket.tokens -= cost\n        return True\n    return False\n```\n\nFor LLMs, set `cost` to the estimated tokens of the request.\n\n### Backpressure tools\n\n| Tool | When |\n|---|---|\n| Queue with max length | Smooth bursts |\n| HTTP 429 + Retry-After | Tell clients to slow down |\n| Load shedding by priority | Protect critical traffic |\n| Degraded mode | Smaller model or cached answers |"}, {"id": 20, "title": "Observability: logs, metrics and traces", "tldr": "You cannot operate what you cannot see. Collect metrics (rates, errors, latency), logs (events with context) and traces (request paths across services). AI systems add model metrics: prediction distributions, drift, token usage, quality scores.", "real": "Google’s SRE book defined the “four golden signals”: latency, traffic, errors and saturation. OpenTelemetry has since become the standard for traces and metrics, and has added semantic conventions for generative AI calls.", "body": "### Three pillars plus AI signals\n\n| Signal | Examples |\n|---|---|\n| Metrics | QPS, p99 latency, error rate, GPU utilization |\n| Logs | Request IDs, errors, decisions |\n| Traces | Gateway → retrieval → model → response |\n| Model metrics | Score distributions, drift, accuracy on labeled samples |\n| LLM metrics | Tokens in/out, time to first token, cost, guardrail hits |\n\n### Golden signals for an AI service\n\n```\nLatency:     p50/p95/p99 end-to-end and per stage\nTraffic:     requests/s, tokens/s\nErrors:      5xx, timeouts, invalid outputs\nSaturation:  GPU memory, queue depth, KV cache usage\n```\n\n### Correlation\n\nAttach the same request ID and model version to logs, traces and predictions so you can explain any single output later.\n\n### Dashboards\n\nOne per service (health), one per model (quality and drift), one per product (business metrics). Alerts should point to the right dashboard."}, {"id": 21, "title": "The machine learning lifecycle", "tldr": "ML systems follow a loop: frame the problem, collect and label data, build features, train, evaluate offline, deploy, test online, monitor and retrain. Most effort and most failures happen outside model training.", "real": "Google’s TFX paper (KDD 2017) described an end-to-end platform covering data validation, training, model analysis and serving, because teams kept rebuilding the same lifecycle pieces. Uber’s Michelangelo was built for the same reason across its teams.", "body": "### The loop\n\n```mermaid\nflowchart LR\n  F[Frame problem] --> D[Data collection and labeling]\n  D --> FE[Features]\n  FE --> T[Training]\n  T --> E[Offline evaluation]\n  E --> DEP[Deployment]\n  DEP --> AB[Online test]\n  AB --> MON[Monitoring]\n  MON --> D\n```\n\n### Stage outputs\n\n| Stage | Output |\n|---|---|\n| Framing | Objective, metrics, constraints |\n| Data | Versioned datasets, labels |\n| Features | Feature definitions, pipelines |\n| Training | Model artifacts, experiment logs |\n| Evaluation | Metric reports, slice analysis |\n| Deployment | Serving endpoint, rollout plan |\n| Online test | A/B results |\n| Monitoring | Drift and quality alerts |\n\n### Where time goes\n\nSurveys of practitioners repeatedly find that data collection, cleaning and pipeline work take more time than modeling. Plan staffing accordingly."}, {"id": 22, "title": "Framing the ML problem", "tldr": "Translate a business goal into a precise ML task: what is predicted, for whom, when, with what inputs, and how success is measured. Poor framing, such as optimizing a proxy that diverges from the real goal, is the most expensive mistake in ML design.", "real": "YouTube shifted its recommendation objective from clicks toward watch time around 2012, and later added satisfaction signals such as surveys, because optimizing clicks alone rewarded misleading thumbnails. The choice of objective shaped what the system promoted.", "body": "### Framing template\n\n| Element | Example (food delivery) |\n|---|---|\n| Business goal | Increase repeat orders |\n| ML task | Rank restaurants for a user |\n| Prediction target | Probability of order within session |\n| Prediction time | When home screen loads |\n| Inputs | User history, location, time, restaurant features |\n| Online metric | Orders per session, retention |\n| Offline metric | NDCG@10, AUC |\n| Constraints | p99 < 100 ms, fairness to new restaurants |\n\n### Task types\n\n| Task | Examples |\n|---|---|\n| Binary classification | Fraud or not, click or not |\n| Multi-class | Category of support ticket |\n| Regression | ETA, price, demand |\n| Ranking | Search results, feeds |\n| Generation | Summaries, replies, code |\n| Clustering / anomaly | Segments, outliers |\n\n### Proxy risks\n\n| Proxy | Risk |\n|---|---|\n| Clicks | Clickbait |\n| Time spent | Addictive content |\n| Short-term revenue | Long-term churn |\n\nUse guardrail metrics alongside the main objective."}, {"id": 23, "title": "Learning paradigms", "tldr": "Supervised learning learns from labeled examples; unsupervised learning finds structure without labels; self-supervised learning creates labels from data itself (the basis of LLMs); reinforcement learning learns from rewards. Many production systems combine them.", "real": "Large language models are pretrained with self-supervised next-token prediction and then refined with supervised fine-tuning and reinforcement learning from human feedback. OpenAI’s InstructGPT paper (2022) found human raters preferred a 1.3B-parameter model tuned this way over the 175B-parameter GPT-3.", "body": "### Overview\n\n| Paradigm | Data | Examples |\n|---|---|---|\n| Supervised | Inputs + labels | Fraud detection, image classification |\n| Unsupervised | Inputs only | Clustering, anomaly detection |\n| Self-supervised | Labels derived from data | LLM pretraining, embeddings |\n| Semi-supervised | Few labels + much unlabeled data | Pseudo-labeling |\n| Reinforcement | Actions + rewards | Bandits, game agents, RLHF |\n\n### Where each appears in products\n\n| Product | Paradigm |\n|---|---|\n| Spam filter | Supervised |\n| Customer segmentation | Unsupervised |\n| Semantic search embeddings | Self-supervised + contrastive |\n| Homepage personalization with exploration | Contextual bandits (RL family) |\n| Chat assistant | Self-supervised + supervised + RL |\n\n### Design implication\n\nLabel availability usually decides the paradigm. If labels are scarce, consider self-supervised pretraining, weak supervision, or LLM-assisted labeling (ch. 32)."}, {"id": 24, "title": "Features, labels and data leakage", "tldr": "Features are model inputs; labels are the targets. Leakage happens when training features contain information unavailable at prediction time, producing great offline results and poor production performance. Point-in-time correctness prevents it.", "real": "Kaggle competitions have repeatedly been disrupted by leakage, where features accidentally encoded the answer. In production, the same mistake appears when a feature computed after the event (for example “chargeback filed”) is used to predict that event.", "body": "### Leakage examples\n\n| Leak | Why it is wrong |\n|---|---|\n| Using “account closed” to predict churn | Known only after churn |\n| Aggregates computed over the full dataset including future | Future information |\n| Duplicate users across train and test | Memorization |\n| Target encoding without proper folds | Label leaks into features |\n\n### Point-in-time correctness\n\n```\nFor each training example at time t:\n   use only feature values that existed at time t\n   label = outcome observed after t (within a defined window)\n```\n\n### Timeline view\n\n```mermaid\nflowchart LR\n  P[Feature values known before t] --> T((Prediction time t))\n  T --> L[Label window: outcome after t]\n```\n\n### Prevention\n\n- Time-based train/validation/test splits\n- Feature stores with point-in-time joins (ch. 35)\n- Review every feature: “Would I know this at prediction time?”\n- Suspicion of offline results that look too good"}, {"id": 25, "title": "Splitting data and validation strategy", "tldr": "Evaluate on data the model has not seen, split in a way that mirrors production. Use time-based splits for temporal problems, group splits to avoid the same entity in both sets, and keep a final untouched test set.", "real": "Recommendation and forecasting teams at companies such as Netflix and Amazon evaluate models on later time periods than they train on, because random splits allow the model to “see the future” and overstate accuracy.", "body": "### Split strategies\n\n| Strategy | Use when |\n|---|---|\n| Random | Independent examples, no time effects |\n| Time-based | Forecasting, recommendations, fraud |\n| Group-based | Same user/patient/device appears many times |\n| Stratified | Rare classes need representation |\n| Cross-validation | Small datasets |\n\n### Standard layout\n\n```\n|------ train ------|-- validation --|-- test --|   (time →)\ntune hyperparameters on validation; report once on test\n```\n\n### Common mistakes\n\n- Tuning on the test set repeatedly (test set becomes training signal)\n- Random splits for temporal data\n- Preprocessing (scaling, vocabulary) fitted on all data before splitting\n\n### Slices\n\nReport metrics on important slices (new users, regions, devices, languages). Aggregate metrics can hide severe failures on small groups."}, {"id": 26, "title": "Offline evaluation metrics", "tldr": "Choose metrics that match the task and the business cost of errors: precision, recall, F1 and AUC for classification; MAE and RMSE for regression; NDCG, MAP and recall@k for ranking; task-specific metrics for generation.", "real": "Fraud and medical screening systems typically tune for high recall at an acceptable precision, because missing a positive case is costly, while email spam filters weigh false positives heavily, because losing a legitimate email is very costly to users.", "body": "### Classification\n\n| Metric | Meaning |\n|---|---|\n| Precision | Of predicted positives, % correct |\n| Recall | Of actual positives, % found |\n| F1 | Balance of precision and recall |\n| ROC AUC | Ranking quality across thresholds |\n| PR AUC | Better for rare positives |\n| Calibration | Predicted probabilities match reality |\n\n### Ranking and retrieval\n\n| Metric | Meaning |\n|---|---|\n| Recall@k | Relevant items in top k |\n| Precision@k | Relevant fraction of top k |\n| MRR | Position of first relevant result |\n| NDCG@k | Graded relevance with position discount |\n\n### Regression\n\nMAE (average absolute error), RMSE (penalizes large errors), MAPE (percentage error; unstable near zero).\n\n### Threshold choice (illustrative)\n\n```chart\n{\"title\": \"Precision vs recall at different thresholds (illustrative)\", \"unit\": \"%\", \"data\": [[\"Threshold 0.3: precision\", 62], [\"Threshold 0.3: recall\", 91], [\"Threshold 0.5: precision\", 78], [\"Threshold 0.5: recall\", 80], [\"Threshold 0.8: precision\", 92], [\"Threshold 0.8: recall\", 55]]}\n```\n\nPick the threshold from the business cost of false positives vs false negatives."}, {"id": 27, "title": "Online evaluation and A/B testing", "tldr": "Offline metrics predict but do not prove impact. A/B tests expose randomized user groups to different models and measure business metrics with statistical rigor. Interleaving and bandits are faster alternatives for some ranking problems.", "real": "Microsoft’s experimentation platform team (Kohavi and colleagues) reported running thousands of controlled experiments per year on Bing and other products and found that most ideas did not improve key metrics, which is why rigorous online testing matters.", "body": "### A/B test design\n\n| Element | Example |\n|---|---|\n| Hypothesis | New ranker increases orders per session |\n| Unit of randomization | User |\n| Primary metric | Orders per session |\n| Guardrail metrics | Latency, complaints, revenue per order |\n| Sample size | From power analysis |\n| Duration | Full weekly cycles (e.g. 2 weeks) |\n\n### Flow\n\n```mermaid\nflowchart LR\n  U[Users] --> R{Random assignment}\n  R -->|50%| A[Control model]\n  R -->|50%| B[Treatment model]\n  A --> M[Metrics]\n  B --> M\n  M --> S[Statistical analysis]\n```\n\n### Pitfalls\n\n| Pitfall | Effect |\n|---|---|\n| Peeking and stopping early | False positives |\n| Novelty effects | Temporary lift |\n| Network effects between users | Biased results |\n| Too many metrics | Spurious wins |\n| Sample ratio mismatch | Broken randomization |\n\n### Alternatives\n\nInterleaving (mix results of two rankers for the same user) needs fewer users; multi-armed bandits shift traffic toward winners automatically."}, {"id": 28, "title": "Baselines and heuristics", "tldr": "A baseline is the simplest reasonable solution: popularity, rules, logistic regression or keyword search. It sets the bar a complex model must beat, provides a fallback, and often captures most of the value.", "real": "Popularity-based and “trending” recommendations remain strong baselines in many recommender systems, and BM25 keyword search remains a strong baseline for retrieval; research benchmarks such as BEIR (2021) showed BM25 competitive with many neural retrievers on out-of-domain datasets.", "body": "### Baselines by task\n\n| Task | Baseline |\n|---|---|\n| Recommendations | Most popular items, recently viewed |\n| Search | BM25 keyword search |\n| Classification | Logistic regression, rules |\n| Forecasting | Last value, seasonal average |\n| Fraud | Rules on amount, velocity, geography |\n| LLM app | Simple prompt with no retrieval |\n\n### Baseline ladder\n\n```\nRule/heuristic → simple model (logistic regression, GBDT) → deep model → large model\n```\n\nMove up only when the gain justifies cost and complexity.\n\n### Why baselines matter in production\n\n- Fallback when the model or feature store fails\n- Sanity check for data and evaluation bugs\n- Explainable reference for stakeholders"}, {"id": 29, "title": "Generalization, overfitting and bias–variance", "tldr": "A model must perform well on new data, not just training data. Overfitting memorizes noise; underfitting misses patterns. Regularization, more data, simpler models and good validation manage the trade-off.", "real": "Google Flu Trends, launched in 2008 to estimate flu prevalence from search queries, overestimated flu levels substantially in the 2012–2013 season according to a 2014 Science article. Critics attributed part of this to overfitting to search patterns that later changed.", "body": "### Diagnosis\n\n| Symptom | Likely issue | Fix |\n|---|---|---|\n| High train and validation error | Underfitting | Bigger model, better features |\n| Low train error, high validation error | Overfitting | Regularization, more data, simpler model |\n| Good offline, poor online | Distribution shift or leakage | Better splits, monitoring |\n\n### Regularization tools\n\n| Tool | Effect |\n|---|---|\n| L1 / L2 penalties | Smaller weights |\n| Dropout | Robust neural features |\n| Early stopping | Stop before memorizing |\n| Data augmentation | More varied examples |\n| Ensembling | Lower variance |\n\n### Generalization in production\n\nData distributions change (seasonality, new products, user behavior). Generalization is not a one-time property; it must be monitored (ch. 63)."}, {"id": 30, "title": "Deep learning and transformers for system designers", "tldr": "Deep learning learns representations from raw data. Transformers, built on attention, power modern language, vision and recommendation models. For design purposes, know their compute and memory costs, input limits, and how embeddings and attention scale.", "real": "The 2017 paper “Attention Is All You Need” introduced the transformer for machine translation. Google applied BERT, a transformer model, to Search in 2019 and said it affected about 1 in 10 English-language queries in the US at launch.", "body": "### Model families\n\n| Family | Typical use |\n|---|---|\n| Gradient-boosted trees (XGBoost, LightGBM) | Tabular data, fraud, ranking features |\n| CNNs | Images, some audio |\n| RNNs / LSTMs | Older sequence models |\n| Transformers | Text, code, vision, speech, sequences of user actions |\n| Two-tower / embedding models | Retrieval and recommendations |\n| Diffusion models | Image and video generation |\n\n### Transformer cost basics\n\n```\nParameters → memory for weights\nSequence length n → attention cost grows roughly with n² (mitigated by optimizations)\nGeneration → one forward pass per output token\n```\n\n### Design-relevant facts\n\n| Aspect | Implication |\n|---|---|\n| Context window | Max input size; long inputs cost more |\n| Embedding dimension | Vector storage size |\n| Model size | GPU memory and latency |\n| Batch size | Throughput vs latency trade-off |\n\n### Tabular reality check\n\nFor structured business data, gradient-boosted trees often match or beat deep models with far less cost. Choose by data type, not hype."}, {"id": 31, "title": "Data collection and event logging", "tldr": "Models are only as good as the data they learn from. Design logging up front: log what was shown, what the user did, the context and model version, with consistent IDs and timestamps, so future training data and analysis are possible.", "real": "Recommender systems such as those at Netflix and Spotify depend on detailed interaction logs (impressions, plays, skips, searches). Logging impressions, not just clicks, is essential, because without knowing what was shown you cannot learn what users chose not to click.", "body": "### What to log for an ML feature\n\n| Field | Why |\n|---|---|\n| Request ID, user ID, timestamp | Joins and time ordering |\n| Context (device, location, page) | Features |\n| Candidates shown and positions | Learn from non-clicks; position bias |\n| Model version and scores | Debugging, counterfactual analysis |\n| User actions and outcomes | Labels |\n| Latency and errors | Operations |\n\n### Event schema example\n\n```json\n{ \"event\": \"recommendation_impression\", \"request_id\": \"r-91\", \"user_id\": \"u-7\",\n  \"ts\": \"2026-11-16T10:21:03Z\", \"model\": \"home-ranker-v18\",\n  \"items\": [{\"id\": \"i-1\", \"pos\": 1, \"score\": 0.82}, {\"id\": \"i-9\", \"pos\": 2, \"score\": 0.77}] }\n```\n\n### Pipeline\n\n```mermaid\nflowchart LR\n  C[Clients and services] --> E[Event collector]\n  E --> K[(Stream)]\n  K --> L[(Data lake)]\n  L --> T[Training datasets]\n```\n\n### Practices\n\nSchema registry, versioned event definitions, sampling for very high volumes, and privacy review of every logged field."}, {"id": 32, "title": "Labeling pipelines", "tldr": "Labels come from user behavior (implicit), human annotators (explicit), rules (weak supervision) or models (including LLMs). Design for quality control, cost and turnaround, and track label provenance.", "real": "Scale AI built a large business supplying human-labeled data to companies including autonomous-driving firms and AI labs. Snorkel, originating from Stanford research, popularized weak supervision, where programmatic labeling functions generate noisy labels at scale.", "body": "### Label sources\n\n| Source | Strength | Weakness |\n|---|---|---|\n| Implicit feedback (clicks, purchases) | Cheap, abundant | Noisy, biased |\n| Human annotation | High quality | Expensive, slow |\n| Expert annotation | Domain accuracy | Very expensive |\n| Weak supervision (rules) | Fast, scalable | Noisy |\n| LLM-assisted labeling | Fast, cheap | Needs validation |\n| Active learning | Focuses human effort | More complex pipeline |\n\n### Quality controls\n\n| Control | How |\n|---|---|\n| Clear guidelines | Examples and edge cases |\n| Gold questions | Known-answer checks for annotators |\n| Agreement metrics | Multiple annotators per item |\n| Adjudication | Experts resolve disagreements |\n| Audits | Random re-labeling |\n\n### Active learning loop\n\n```mermaid\nflowchart LR\n  M[Model] --> U[Uncertain examples]\n  U --> H[Human labelers]\n  H --> D[Labeled data]\n  D --> M\n```"}, {"id": 33, "title": "Data quality and validation", "tldr": "Bad data silently breaks models. Validate schema, ranges, distributions and freshness at every pipeline stage, and block training or serving when checks fail. Treat data like code with tests and owners.", "real": "Google’s TensorFlow Data Validation (part of TFX) was built to detect schema anomalies and drift between training and serving data, after Google found data errors were a frequent cause of production ML problems. Open-source tools like Great Expectations serve similar purposes.", "body": "### Checks\n\n| Check | Example |\n|---|---|\n| Schema | Column types, required fields |\n| Range | Age between 0 and 120 |\n| Nulls | Missing rate below threshold |\n| Uniqueness | No duplicate IDs |\n| Distribution | Mean/quantiles within expected bounds |\n| Freshness | Data updated within last N hours |\n| Referential | Foreign keys valid |\n| Volume | Row counts within expected range |\n\n### Where to validate\n\n```mermaid\nflowchart LR\n  I[Ingestion] -->|validate| C[Clean tables]\n  C -->|validate| F[Features]\n  F -->|validate| T[Training]\n  F -->|validate| S[Serving]\n```\n\n### Failure policy\n\n| Severity | Action |\n|---|---|\n| Critical (schema broken) | Stop pipeline, alert |\n| Warning (drift) | Continue, alert owner |\n| Info | Log for review |"}, {"id": 34, "title": "Feature engineering", "tldr": "Features turn raw data into signals a model can use: aggregates, ratios, time-windowed counts, encodings, text and image embeddings, and cross features. Good features often matter more than model choice, especially for tabular data.", "real": "Airbnb’s 2018 paper on real-time personalization trained listing embeddings from user click sessions and used embedding similarity features in search ranking. The paper received a best paper award at KDD 2018 and is a classic example of learned features in production.", "body": "### Feature types\n\n| Type | Example |\n|---|---|\n| Raw | Price, category |\n| Aggregates | Orders in last 30 days |\n| Ratios | Click-through rate of item |\n| Time | Hour of day, days since signup |\n| Encodings | One-hot, target encoding, hashing |\n| Embeddings | User, item, text, image vectors |\n| Cross features | Category × country |\n| Real-time | Actions in current session |\n\n### Windowed aggregation example\n\n```sql\nSELECT user_id,\n       COUNT(*) FILTER (WHERE ts > now() - interval '1 day')  AS orders_1d,\n       COUNT(*) FILTER (WHERE ts > now() - interval '30 day') AS orders_30d\nFROM orders GROUP BY user_id;\n```\n\n### Feature checklist\n\n- [ ] Available at prediction time (no leakage)\n- [ ] Same computation in training and serving\n- [ ] Reasonable cost and latency to compute\n- [ ] Documented owner and definition\n- [ ] Monitored for drift and missing values"}, {"id": 35, "title": "Feature stores", "tldr": "A feature store centralizes feature definitions, computes them consistently for training and serving, serves low-latency online features, and produces point-in-time-correct training data. It prevents duplicated work and training-serving skew.", "real": "Uber described its Michelangelo feature store (Palette) in 2017, Airbnb built Zipline, and Gojek with Google created the open-source Feast in 2019. LinkedIn open-sourced its feature store, Feathr, in 2022.", "body": "### Architecture\n\n```mermaid\nflowchart LR\n  SRC[Batch and stream sources] --> DEF[Feature definitions]\n  DEF --> OFF[(Offline store: warehouse/lake)]\n  DEF --> ON[(Online store: key-value)]\n  OFF --> TRAIN[Point-in-time training sets]\n  ON --> SERVE[Low-latency serving]\n  REG[Feature registry] --- DEF\n```\n\n### Components\n\n| Component | Role |\n|---|---|\n| Registry | Definitions, owners, versions |\n| Offline store | Historical values for training |\n| Online store | Latest values, millisecond reads |\n| Materialization jobs | Keep stores in sync |\n| Point-in-time joins | Correct historical training data |\n| Monitoring | Freshness and drift |\n\n### When you need one\n\n| Signal | Need |\n|---|---|\n| Many models share features | High |\n| Real-time features | High |\n| One or two batch models | Low (a well-organized warehouse may suffice) |"}, {"id": 36, "title": "Data versioning and lineage", "tldr": "Reproducing a model requires knowing exactly which data, code and configuration produced it. Version datasets, track lineage from sources to models, and record it in the model registry.", "real": "Tools such as DVC, lakeFS and table formats with time travel (Delta Lake, Iceberg) let teams version data. Regulated industries such as banking require this lineage for model risk management, for example under the US Federal Reserve’s SR 11-7 guidance on model risk.", "body": "### What to version\n\n| Artifact | How |\n|---|---|\n| Raw data snapshots | Table versions, object storage paths |\n| Feature definitions | Code in git |\n| Training datasets | Content hashes, table snapshot IDs |\n| Code | Git commit |\n| Configuration | Hyperparameters in files |\n| Environment | Container image digests |\n| Model artifacts | Registry with version and hash |\n\n### Lineage graph\n\n```mermaid\nflowchart LR\n  S1[(Orders table v812)] --> FE[Feature job commit a1b2]\n  S2[(Users table v455)] --> FE\n  FE --> DS[(Training set hash 9f3c)]\n  DS --> M[Model fraud-v12]\n  CODE[Training code commit c3d4] --> M\n```\n\n### Uses\n\n- Reproduce or audit any model\n- Find all models affected by a bad data source\n- Comply with regulations and deletion requests"}, {"id": 37, "title": "Generating training datasets", "tldr": "Training sets are built by joining labels with point-in-time features, sampling to balance classes or reduce volume, and filtering bad examples. Design the generation pipeline as carefully as the model.", "real": "Facebook’s 2014 paper on ad click prediction (“Practical Lessons from Predicting Clicks on Ads at Facebook”) discussed negative downsampling with probability recalibration, data freshness effects, and combining boosted trees with logistic regression, all of which are dataset-generation decisions.", "body": "### Pipeline\n\n```mermaid\nflowchart LR\n  L[Label events] --> J[Point-in-time join]\n  F[(Feature history)] --> J\n  J --> S[Sampling and balancing]\n  S --> Q[Quality filters]\n  Q --> SPLIT[Train / val / test split]\n  SPLIT --> OUT[(Versioned dataset)]\n```\n\n### Sampling techniques\n\n| Technique | Use | Caveat |\n|---|---|---|\n| Negative downsampling | Rare positives (clicks, fraud) | Recalibrate probabilities |\n| Stratified sampling | Preserve slices | Needs slice labels |\n| Recency weighting | Changing behavior | May forget rare patterns |\n| Hard negative mining | Retrieval models | Can introduce false negatives |\n\n### Recalibration after downsampling\n\n```\nIf negatives kept with rate w:  p_true = p / (p + (1 − p) / w)\n```\n\n### Checks\n\nClass balance, slice coverage, duplicate removal, and the time range covered by each split."}, {"id": 38, "title": "Embeddings as a data asset", "tldr": "Embeddings are dense vectors that capture meaning of users, items, text or images. Once computed, they power retrieval, recommendations, clustering and features across many models. Manage them as versioned data assets.", "real": "Pinterest’s PinSage (2018) learned embeddings for billions of pins using graph neural networks and used them across recommendation surfaces. Spotify open-sourced Annoy, a library for approximate nearest-neighbor search over embeddings, used in its music recommendations.", "body": "### Embedding uses\n\n| Use | Example |\n|---|---|\n| Similarity search | Similar products, semantic search |\n| Candidate retrieval | Two-tower recommenders |\n| Features | User–item embedding similarity |\n| Clustering | Topic or audience segments |\n| Deduplication | Near-duplicate detection |\n| RAG | Retrieve relevant documents for LLMs |\n\n### Embedding pipeline\n\n```mermaid\nflowchart LR\n  D[Items / documents] --> E[Embedding model vN]\n  E --> V[(Vector index vN)]\n  E --> FS[(Feature store)]\n  Q[Query] --> QE[Same embedding model vN] --> V\n```\n\n### Management rules\n\n- Version embeddings by model; never mix versions in one index\n- Re-embed everything when the model changes (plan backfills)\n- Monitor embedding drift and index freshness\n- Store dimension, normalization and model ID with vectors"}, {"id": 39, "title": "Privacy in ML data pipelines", "tldr": "ML pipelines handle personal data at scale. Apply minimization, purpose limitation, access controls, anonymization or pseudonymization, retention limits and deletion propagation, and consider privacy-preserving techniques like differential privacy and federated learning.", "real": "Apple has used local differential privacy since 2016 to learn usage patterns such as popular emoji and new words without collecting raw individual data, and Google uses federated learning for Gboard keyboard suggestions so typing data stays on devices.", "body": "### Controls by stage\n\n| Stage | Control |\n|---|---|\n| Collection | Collect only needed fields; consent |\n| Storage | Encryption, access controls, separation of identifiers |\n| Processing | Pseudonymization, aggregation |\n| Training | Differential privacy, PII scrubbing |\n| Serving | Avoid exposing sensitive predictions |\n| Deletion | Remove from datasets, features, embeddings; retrain policy |\n\n### Techniques\n\n| Technique | Protects |\n|---|---|\n| Pseudonymization | Direct identifiers |\n| k-anonymity / aggregation | Re-identification in releases |\n| Differential privacy | Individual contribution to models or stats |\n| Federated learning | Raw data stays on devices |\n| Secure enclaves | Data in use |\n\n### Deletion requests\n\nDocument how a user’s data is removed from raw stores, features, training sets and embeddings, and when models trained on it are retrained."}, {"id": 40, "title": "Modern data platform for AI", "tldr": "A modern AI data platform combines event streams, a lakehouse, transformation tooling, a feature store, a vector store, data quality checks, a catalog with lineage, and governance. It serves analytics, classical ML and LLM applications from shared foundations.", "real": "Netflix, Uber and LinkedIn each built internal data platforms combining streaming (Kafka), large-scale storage, open table formats and ML platforms. Commercial platforms such as Databricks and Snowflake now package similar components for other companies.", "body": "### Reference architecture\n\n```mermaid\nflowchart TB\n  subgraph Sources\n    APP[Apps and services]\n    DB[(Operational DBs)]\n    DOCS[Documents]\n  end\n  APP --> STREAM[(Event stream)]\n  DB --> CDC[Change data capture]\n  STREAM --> LAKE[(Lakehouse)]\n  CDC --> LAKE\n  DOCS --> PARSE[Parsing and chunking]\n  LAKE --> TRANSFORM[Transformations]\n  TRANSFORM --> FS[(Feature store)]\n  PARSE --> VEC[(Vector store)]\n  LAKE --> TRAIN[Model training]\n  FS --> SERVE[Model serving]\n  VEC --> RAG[LLM applications]\n  CAT[Catalog, lineage, quality, access control] -.-> LAKE\n```\n\n### Platform capabilities checklist\n\n- [ ] Reliable ingestion (streams and change data capture)\n- [ ] Open table formats with time travel\n- [ ] Data quality checks and alerts\n- [ ] Catalog with owners and lineage\n- [ ] Access control and PII tagging\n- [ ] Feature store for ML\n- [ ] Vector store and document pipelines for LLM apps\n- [ ] Cost monitoring"}, {"id": 41, "title": "Training pipeline architecture", "tldr": "A production training pipeline is an automated workflow: fetch versioned data, validate it, train, evaluate against baselines, register the model, and trigger deployment checks. Orchestrators run it on schedules or triggers, reproducibly.", "real": "Netflix open-sourced Metaflow in 2019, a framework its data scientists use to build and run ML workflows from prototype to production. Kubeflow Pipelines, Airflow and Vertex AI Pipelines are other widely used orchestration options.", "body": "### Pipeline stages\n\n```mermaid\nflowchart LR\n  D[Fetch dataset version] --> V[Validate data]\n  V --> T[Train]\n  T --> E[Evaluate vs baseline]\n  E -->|pass| R[Register model]\n  E -->|fail| X[Alert and stop]\n  R --> C[Deployment checks]\n```\n\n### Orchestrator options\n\n| Tool | Notes |\n|---|---|\n| Airflow | General workflow scheduler |\n| Kubeflow Pipelines | Kubernetes-native ML pipelines |\n| Metaflow | Data-scientist friendly (Netflix) |\n| Vertex AI / SageMaker Pipelines | Managed cloud services |\n| Dagster, Prefect | Modern data orchestration |\n\n### Design requirements\n\n- Every run reproducible (data version, code commit, config, image)\n- Artifacts stored with metadata\n- Automated evaluation gates\n- Resumable after failures\n- Cost tracking per run"}, {"id": 42, "title": "Distributed training", "tldr": "When data or models outgrow one GPU, distribute training: data parallelism (replicate the model, split data), tensor and pipeline parallelism (split the model), and sharded approaches such as ZeRO and FSDP that split optimizer states, gradients and weights.", "real": "Microsoft’s DeepSpeed introduced the ZeRO optimizer (2019–2020), and PyTorch added Fully Sharded Data Parallel (FSDP). NVIDIA’s Megatron-LM popularized tensor parallelism. Training frontier models combines all of these across thousands of GPUs.", "body": "### Parallelism types\n\n| Type | Splits | Communication |\n|---|---|---|\n| Data parallel | Batches | Gradient all-reduce each step |\n| ZeRO / FSDP | Optimizer state, gradients, weights | Gather/scatter of shards |\n| Tensor parallel | Layers’ matrices | Heavy, needs fast links |\n| Pipeline parallel | Layers into stages | Activations between stages |\n| Expert parallel | MoE experts | All-to-all |\n\n### Typical combination for large models\n\n```mermaid\nflowchart TB\n  DP[Data parallel replicas across nodes] --> PP[Pipeline stages across node groups]\n  PP --> TP[Tensor parallel within a node, NVLink]\n```\n\n### Memory per parameter (mixed-precision Adam, typical)\n\n```\nweights (bf16) 2 B + gradients 2 B + optimizer states (fp32 master + 2 moments) 12 B ≈ 16 B/parameter\n7B model ≈ 112 GB before activations → needs sharding across GPUs\n```\n\n### Rule\n\nUse the simplest strategy that fits: single GPU → data parallel → FSDP/ZeRO → add tensor/pipeline parallelism for very large models."}, {"id": 43, "title": "Hyperparameter tuning", "tldr": "Hyperparameters (learning rate, depth, regularization, batch size) strongly affect results. Automate search with random search, Bayesian optimization or early-stopping methods like Hyperband, and track every trial.", "real": "Google Vizier, described in a 2017 KDD paper, is Google’s internal black-box optimization service for hyperparameter tuning. Open-source tools such as Optuna and Ray Tune bring similar capabilities to other teams.", "body": "### Methods\n\n| Method | Strength | Weakness |\n|---|---|---|\n| Grid search | Simple | Expensive, poor in high dimensions |\n| Random search | Surprisingly efficient | No learning from trials |\n| Bayesian optimization | Sample-efficient | Sequential overhead |\n| Hyperband / ASHA | Stops bad trials early | Needs intermediate metrics |\n| Population-based training | Adapts during training | Complex |\n\n### Practical approach\n\n1. Tune the most important parameters first (learning rate, model size)\n2. Use log scales for learning rates and regularization\n3. Run many short trials, then fewer long ones\n4. Keep a fixed validation set; report final results on test once\n\n### Budget control\n\nSet maximum trials, GPU hours and parallelism. For large models, use scaling experiments on small versions to choose settings."}, {"id": 44, "title": "Experiment tracking", "tldr": "Track every training run: code version, data version, parameters, metrics, artifacts and environment. Without tracking, teams cannot compare models, reproduce results or explain what changed.", "real": "MLflow, open-sourced by Databricks in 2018, and Weights & Biases are widely used experiment trackers. Large model labs track thousands of runs with loss curves and evaluation metrics to decide which experiments to scale.", "body": "### What to record per run\n\n| Item | Example |\n|---|---|\n| Code | Git commit |\n| Data | Dataset version / hash |\n| Config | Hyperparameters, seeds |\n| Environment | Container image, library versions |\n| Metrics | Loss curves, validation metrics by slice |\n| Artifacts | Model files, plots, evaluation reports |\n| Resources | GPU type, hours, cost |\n| Notes | Hypothesis and conclusion |\n\n### Comparing runs\n\n```\nrun 41  lr=3e-4  auc=0.871  recall@95%prec=0.42\nrun 42  lr=1e-4  auc=0.876  recall@95%prec=0.45   ← promote to candidate\n```\n\n### Practices\n\n- Name experiments by hypothesis\n- Log slices, not just overall metrics\n- Link the best run to the registered model"}, {"id": 45, "title": "GPU clusters and job scheduling", "tldr": "Training infrastructure must share expensive accelerators fairly and efficiently: schedulers queue jobs, place them on suitable nodes, support gang scheduling for distributed jobs, preemption, quotas and monitoring of utilization.", "real": "Large AI labs run training on Slurm or Kubernetes-based schedulers. Meta described two 24,576-GPU H100 clusters used for Llama 3 in 2024, one built on a RoCE network fabric and the other on InfiniBand, and Google trains on TPU pods connected by its own interconnect.", "body": "### Scheduler options\n\n| Scheduler | Notes |\n|---|---|\n| Slurm | Classic HPC scheduler, common for large training |\n|

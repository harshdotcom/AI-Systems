Kubernetes + Kueue / Volcano | Cloud-native batch and gang scheduling |\n| Ray | Distributed Python workloads |\n| Managed (SageMaker, Vertex) | Less ops, less control |\n\n### Key features\n\n| Feature | Why |\n|---|---|\n| Gang scheduling | All workers of a distributed job start together |\n| Topology awareness | Place jobs on well-connected GPUs |\n| Quotas and priorities | Fair sharing across teams |\n| Preemption | Urgent jobs can reclaim capacity |\n| Health checks | Detect bad GPUs before jobs fail |\n\n### Utilization metrics\n\nGPU utilization, memory use, MFU (model FLOPs utilization), queue wait time, failed-job rate, and cost per useful GPU-hour."}, {"id": 46, "title": "Checkpointing and fault tolerance", "tldr": "Long training jobs will hit failures. Save checkpoints regularly, resume automatically, detect bad hardware, and design so a single failure costs minutes, not days. Checkpoint frequency balances overhead against lost work.", "real": "Meta reported that during a 54-day period of Llama 3 405B pre-training on 16,384 H100 GPUs, there were 466 job interruptions, 419 of them unexpected, with GPU and memory issues the largest category. Automated recovery kept effective training time above 90%.", "body": "### Failure sources\n\n| Source | Example |\n|---|---|\n| Hardware | GPU, memory, network faults |\n| Software | Bugs, driver issues |\n| Infrastructure | Node maintenance, preemption |\n| Data | Corrupt batches |\n| Numerical | Loss spikes, NaNs |\n\n### Checkpoint strategy\n\n```\nCheckpoint interval ≈ balance(save time, expected time between failures)\nSave: model weights, optimizer state, data loader position, RNG state, step count\nStore: fast local/parallel storage, then copy to durable object storage\n```\n\n### Recovery flow\n\n```mermaid\nflowchart LR\n  F[Failure detected] --> I[Isolate bad node]\n  I --> R[Reschedule job]\n  R --> L[Load latest checkpoint]\n  L --> C[Continue training]\n```\n\n### Practices\n\nAsynchronous checkpointing, health checks before job start, automatic retries, and monitoring loss for spikes that need rollback."}, {"id": 47, "title": "Retraining strategies", "tldr": "Models degrade as the world changes. Retrain on a schedule, when performance drops, when drift is detected, or continuously with streaming updates. Each retrain must pass the same evaluation gates as the original model.", "real": "During the early COVID-19 pandemic, Instacart reported that the accuracy of its item availability predictions fell sharply, from about 93% to 61%, as shopping behavior changed overnight. The company had to retrain more frequently and adjust inputs to the new patterns.", "body": "### Retraining triggers\n\n| Trigger | Example |\n|---|---|\n| Scheduled | Nightly or weekly |\n| Performance drop | Accuracy on labeled samples below threshold |\n| Drift detected | Input distribution shift |\n| New data volume | Enough new labels collected |\n| Business event | New product line, policy change |\n\n### Strategies\n\n| Strategy | Trade-off |\n|---|---|\n| Full retrain from scratch | Clean, costly |\n| Warm start (fine-tune from previous) | Faster, may accumulate bias |\n| Online learning | Very fresh, risk of instability |\n| Sliding window data | Adapts, forgets old patterns |\n\n### Safety gates\n\n```mermaid\nflowchart LR\n  N[New model] --> O[Offline eval vs current]\n  O --> S[Shadow traffic]\n  S --> C[Canary rollout]\n  C --> F[Full rollout]\n```"}, {"id": 48, "title": "Transfer learning and fine-tuning", "tldr": "Instead of training from scratch, start from a pretrained model and adapt it to your task. Fine-tuning needs far less data and compute, and is the default approach for vision, language and speech tasks today.", "real": "The 2018 BERT paper showed that one pretrained language model could be fine-tuned to set state-of-the-art results across many language tasks. ImageNet-pretrained vision models had earlier shown the same pattern for computer vision.", "body": "### Options\n\n| Option | Trainable parameters | Data needed |\n|---|---|---|\n| Feature extraction (frozen backbone) | Head only | Small |\n| Full fine-tuning | All | Medium |\n| Parameter-efficient (LoRA, adapters) | Small fraction | Small to medium |\n| Continued pretraining | All | Large domain corpus |\n\n### Decision guide\n\n| Situation | Choice |\n|---|---|\n| Few hundred labeled examples | Frozen backbone or LoRA |\n| Domain language very different | Continued pretraining then fine-tune |\n| Many tasks on one base | Adapters per task |\n| Strict latency | Distill into a smaller model (ch. 54) |\n\n### Risks\n\nCatastrophic forgetting of general skills, overfitting small datasets, and inheriting biases or licenses from the base model."}, {"id": 49, "title": "Model registry", "tldr": "A model registry is the system of record for trained models: versions, artifacts, metadata, lineage, evaluation results, approval status and deployment stage. Serving systems deploy only registered, approved versions.", "real": "MLflow Model Registry, SageMaker Model Registry and Vertex AI Model Registry provide versioning and stage transitions such as staging and production. In regulated industries, the registry also serves as evidence for model governance reviews.", "body": "### Registry record\n\n| Field | Example |\n|---|---|\n| Name and version | fraud-detector v12.3 |\n| Artifact location and hash | s3://models/fraud/v12.3, sha256:… |\n| Training data version | orders_2026_10 snapshot 812 |\n| Code commit | c3d4e5 |\n| Metrics | AUC 0.91; recall at 95% precision 0.47 |\n| Slices | Metrics per region and segment |\n| Owner | Risk ML team |\n| Status | Candidate → Approved → Production → Archived |\n| Approvals | Reviewer, date |\n\n### Lifecycle\n\n```mermaid\nstateDiagram-v2\n  [*] --> Candidate\n  Candidate --> Approved: passes review\n  Approved --> Production: rollout\n  Production --> Archived: replaced\n  Candidate --> Rejected: fails gates\n```\n\n### Rule\n\nNo model reaches production without a registry entry linking it to data, code and evaluation evidence."}, {"id": 50, "title": "Reproducibility", "tldr": "Reproducibility means you can rebuild a model and explain its behavior later. It requires versioned data, code, configs and environments, fixed seeds where practical, and documented nondeterminism. It underpins debugging, audits and trust.", "real": "Research on ML reproducibility (for example, the NeurIPS reproducibility checklist introduced in 2019) pushed authors to document data, code and settings. In industry, regulated domains such as credit scoring must be able to recreate decisions for audits and customer disputes.", "body": "### Sources of irreproducibility\n\n| Source | Mitigation |\n|---|---|\n| Changing data | Snapshot or version datasets |\n| Unpinned libraries | Lockfiles, container images |\n| Random seeds | Fix and record seeds |\n| GPU nondeterminism | Deterministic settings where needed; record tolerance |\n| Hidden config | Configs in version control |\n| Manual steps | Automate pipelines |\n\n### Reproducibility checklist\n\n- [ ] Dataset version or hash recorded\n- [ ] Code commit recorded\n- [ ] Config and hyperparameters stored\n- [ ] Container image digest stored\n- [ ] Seeds recorded\n- [ ] Hardware type noted\n- [ ] Evaluation script versioned\n\n### Practical standard\n\nExact bit-for-bit reproduction is often impossible on GPUs; aim for **statistically equivalent** results and full traceability."}, {"id": 51, "title": "Batch vs online inference", "tldr": "Batch inference precomputes predictions on a schedule and stores them; online inference computes predictions per request in real time. Choose by freshness, latency, input availability and cost. Many systems combine both.", "real": "Netflix has described computing many recommendation candidates offline in batch and then adjusting or ranking them with fresher signals online. This hybrid lets expensive models run offline while the user experience stays responsive.", "body": "### Comparison\n\n| | Batch | Online |\n|---|---|---|\n| Latency at request time | Lookup only | Model inference |\n| Freshness | Hours old | Real-time |\n| Cost | Efficient bulk compute | Peak capacity needed |\n| Inputs | Known in advance | Can use request context |\n| Examples | Daily recommendations, churn scores | Fraud checks, search ranking, chat |\n\n### Hybrid pattern\n\n```mermaid\nflowchart LR\n  B[Nightly batch job] --> C[(Precomputed candidates)]\n  R[User request] --> O[Online ranker]\n  C --> O\n  RT[Real-time context] --> O\n  O --> RESP[Response]\n```\n\n### Decision questions\n\n1. Does the prediction depend on request-time context?\n2. How stale can the prediction be?\n3. How many entities need predictions vs how many are requested?\n4. What latency is acceptable?"}, {"id": 52, "title": "Online model serving architecture", "tldr": "An online serving stack receives requests, fetches features, runs the model, applies business logic, and returns results with versioning, logging and fallbacks. Model servers handle batching, hardware and model loading.", "real": "Common model servers include NVIDIA Triton Inference Server, TorchServe, TensorFlow Serving, KServe on Kubernetes and Ray Serve. For LLMs, specialized engines such as vLLM, SGLang and TensorRT-LLM dominate.", "body": "### Request path\n\n```mermaid\nflowchart LR\n  C[Client] --> GW[Gateway]\n  GW --> PS[Prediction service]\n  PS --> FS[(Online feature store)]\n  PS --> MS[Model server]\n  MS --> PS\n  PS --> BR[Business rules]\n  BR --> C\n  PS --> LOG[(Prediction logs)]\n```\n\n### Responsibilities\n\n| Component | Handles |\n|---|---|\n| Prediction service | Validation, feature fetch, orchestration, fallback |\n| Model server | Loading models, batching, hardware acceleration |\n| Feature store | Fresh features with low latency |\n| Logging | Inputs, outputs, versions for monitoring and training |\n\n### Serving checklist\n\n- [ ] Timeouts on every dependency\n- [ ] Fallback (cached result, simpler model, default)\n- [ ] Model version in every response and log\n- [ ] Warm-up before receiving traffic\n- [ ] Resource limits and autoscaling"}, {"id": 53, "title": "Latency optimization for models", "tldr": "Reduce inference latency by shrinking the model, optimizing runtimes, batching wisely, caching, precomputing, parallelizing feature fetches and placing compute close to users. Measure each stage before optimizing.", "real": "Google’s 2016 Wide & Deep recommender for Google Play had to score candidates within strict latency limits, and the paper described splitting candidate batches across threads to keep serving latency low. Most production rankers use similar multi-threading and batching.", "body": "### Techniques\n\n| Technique | Typical gain |\n|---|---|\n| Model compression (quantization, distillation) | 2–4× faster |\n| Optimized runtimes (TensorRT, ONNX Runtime) | Kernel fusion, faster execution |\n| Request batching | Higher throughput, small latency cost |\n| Caching predictions | Skip inference |\n| Parallel feature fetching | Cut I/O wait |\n| Precomputing embeddings | Only light work online |\n| Early exit / cascades | Cheap model first, expensive only if needed |\n| Edge / regional deployment | Lower network time |\n\n### Cascade pattern\n\n```mermaid\nflowchart LR\n  R[Request] --> L1[Light model]\n  L1 -->|confident| OUT[Response]\n  L1 -->|uncertain| L2[Heavy model]\n  L2 --> OUT\n```\n\n### Profiling first\n\nBreak latency down by stage (network, features, model, post-processing). Optimize the largest stage; it is often feature fetching, not the model."}, {"id": 54, "title": "Model compression: quantization, distillation, pruning", "tldr": "Compression makes models smaller and faster: quantization lowers numeric precision, distillation trains a small model to imitate a large one, and pruning removes unimportant weights. Each trades a little accuracy for large efficiency gains.", "real": "Hugging Face’s DistilBERT (2019) kept about 97% of BERT’s language understanding performance while being 40% smaller and 60% faster. Quantized LLMs at 8-bit and 4-bit precision are now standard for efficient deployment.", "body": "### Comparison\n\n| Technique | How | Gain | Cost |\n|---|---|---|---|\n| Quantization | 32/16-bit → 8/4-bit | 2–4× smaller, faster | Small accuracy loss |\n| Distillation | Student learns from teacher outputs | Much smaller model | Training effort |\n| Pruning | Remove weights or structures | Smaller, sometimes faster | Needs hardware support for speedups |\n| Low-rank factorization | Approximate weight matrices | Fewer parameters | Accuracy loss |\n\n### DistilBERT vs BERT-base parameters\n\n```chart\n{\"title\": \"Parameters (millions)\", \"unit\": \"M\", \"data\": [[\"BERT-base\", 110], [\"DistilBERT\", 66]]}\n```\n\n### Memory for a 70B-parameter model by precision\n\n```chart\n{\"title\": \"Approximate weight memory, 70B model\", \"unit\": \"GB\", \"data\": [[\"16-bit\", 140], [\"8-bit\", 70], [\"4-bit\", 38], [\"2-bit\", 20]]}\n```\n\n### Choosing\n\nQuantize first (cheapest), distill when you need a much smaller model, and evaluate on your own tasks after any compression."}, {"id": 55, "title": "GPU serving and dynamic batching", "tldr": "GPUs are efficient only when busy. Dynamic batching groups incoming requests within a short time window to run them together, raising throughput. For generative models, continuous batching lets requests join and leave a batch at every step.", "real": "NVIDIA Triton supports dynamic batching with configurable maximum queue delay, and vLLM’s continuous batching with PagedAttention reported up to 24 times higher throughput than Hugging Face Transformers in the original 2023 vLLM release.", "body": "### Batching types\n\n| Type | How | Fit |\n|---|---|---|\n| No batching | One request at a time | Low traffic, CPU |\n| Static batching | Fixed batch size | Offline jobs |\n| Dynamic batching | Wait up to N ms to fill batch | Classic models on GPU |\n| Continuous batching | Add/remove sequences each step | LLM generation |\n\n### Throughput vs latency (illustrative)\n\n```chart\n{\"title\": \"Throughput with batch size (illustrative)\", \"unit\": \"requests/s\", \"data\": [[\"Batch 1\", 120], [\"Batch 8\", 700], [\"Batch 32\", 1900], [\"Batch 128\", 3600]]}\n```\n\n### Tuning knobs\n\n| Knob | Effect |\n|---|---|\n| Max batch size | Throughput ceiling, memory use |\n| Max queue delay | Latency added for batching |\n| Instances per GPU | Parallelism for small models |\n| Precision | Speed vs accuracy |"}, {"id": 56, "title": "Autoscaling inference", "tldr": "Scale model servers with demand using metrics that reflect real load: queue depth, GPU utilization, concurrency or latency, not CPU. Account for slow cold starts by keeping warm capacity and scaling ahead of predictable peaks.", "real": "Kubernetes-based serving stacks such as KServe use Knative autoscaling based on request concurrency and can scale to zero for idle models. For large models, cold starts measured in minutes lead teams to keep minimum replicas during business hours.", "body": "### Scaling signals\n\n| Signal | Good for |\n|---|---|\n| Requests in flight / concurrency | Most model servers |\n| Queue length | Batch-heavy servers |\n| GPU utilization | Throughput-bound workloads |\n| p95 latency | User-facing SLOs |\n| Scheduled | Known daily peaks |\n\n### Cold start breakdown\n\n| Step | Time |\n|---|---|\n| Provision GPU node | Minutes |\n| Pull container image | Seconds to minutes |\n| Load model weights | Seconds to minutes |\n| Warm-up | Seconds |\n\n### Strategies\n\n- Minimum warm replicas for production\n- Pre-pulled images and local model caches\n- Predictive scaling before known peaks\n- Scale down slowly to avoid flapping\n- Separate pools for latency-critical and batch traffic"}, {"id": 57, "title": "Serving many models", "tldr": "Platforms often serve hundreds of models: per-country, per-customer or per-task variants. Use multi-model servers, model caching, shared base models with adapters, and routing layers to avoid one dedicated server per model.", "real": "Multi-LoRA serving, explored in research such as S-LoRA and Punica (2023), lets one GPU serve many fine-tuned adapters on a shared base model. Platforms like Predibase built products on this idea, and engines such as vLLM support it.", "body": "### Patterns\n\n| Pattern | How | Fit |\n|---|---|---|\n| Dedicated server per model | Simple isolation | Few, high-traffic models |\n| Multi-model server | Load/unload models on demand | Many small models |\n| Shared base + adapters | One base model, many LoRA adapters | Many fine-tuned LLM variants |\n| Model routing layer | Route by tenant/task to pools | Mixed workloads |\n\n### Routing layer\n\n```mermaid\nflowchart LR\n  REQ[Request with tenant and task] --> ROUTER[Model router]\n  ROUTER --> P1[Pool A: base + adapters]\n  ROUTER --> P2[Pool B: large model]\n  ROUTER --> P3[Pool C: small CPU models]\n```\n\n### Watch for\n\nNoisy neighbors, memory pressure from too many loaded models, and slow first requests when a model is loaded on demand."}, {"id": 58, "title": "Edge and on-device inference", "tldr": "Running models on phones, browsers, cars or devices cuts latency, works offline, saves server cost and keeps data private. Constraints are memory, power and heat, which require small, quantized models and hardware-specific runtimes.", "real": "Apple’s on-device foundation model, introduced in 2024, has about 3 billion parameters and uses low-bit quantization to run on iPhones, with larger requests sent to its Private Cloud Compute servers. Google ships Gemini Nano on Android devices for on-device features.", "body": "### When on-device fits\n\n| Need | Example |\n|---|---|\n| Low latency | Camera effects, keyboard suggestions |\n| Offline use | Field work, travel |\n| Privacy | Personal messages, health data |\n| Cost | Billions of daily inferences |\n\n### Runtimes\n\n| Platform | Runtime |\n|---|---|\n| iOS / macOS | Core ML |\n| Android | LiteRT (TensorFlow Lite), NNAPI |\n| Cross-platform | ONNX Runtime, ExecuTorch |\n| Browser | WebGPU, WebAssembly runtimes |\n\n### Hybrid device–cloud\n\n```mermaid\nflowchart LR\n  U[User request] --> D{On-device model can handle?}\n  D -- yes --> L[Local inference]\n  D -- no --> C[Cloud model]\n```\n\n### Operations\n\nModel updates ship with app releases or downloads; monitor via privacy-preserving telemetry; support older devices with smaller models."}, {"id": 59, "title": "Safe model deployment: shadow, canary and rollback", "tldr": "Deploy models gradually: shadow mode (run without affecting users), canary (small traffic share), then progressive rollout with automatic rollback on metric regressions. Keep the previous model ready to restore instantly.", "real": "Knight Capital lost about $440 million in roughly 45 minutes in 2012 after a faulty software deployment activated old code on production servers. It is a classic reminder, relevant to automated decision systems, that untested rollouts can cause huge losses very quickly.", "body": "### Deployment stages\n\n```mermaid\nflowchart LR\n  S[Shadow: log predictions only] --> C1[Canary 1%]\n  C1 --> C2[10%]\n  C2 --> C3[50%]\n  C3 --> F[100%]\n  C1 -->|metrics regress| RB[Rollback]\n  C2 -->|metrics regress| RB\n  C3 -->|metrics regress| RB\n```\n\n### What to compare at each stage\n\n| Metric | Example |\n|---|---|\n| Operational | Latency, errors, resource use |\n| Prediction distribution | Score histograms vs current model |\n| Business | Conversion, fraud caught, complaints |\n| Safety | Guardrail triggers |\n\n### Rollback requirements\n\n- Previous model kept loaded or quickly loadable\n- Feature compatibility maintained between versions\n- One-command or automatic rollback\n- Clear owner on call during rollout"}, {"id": 60, "title": "Training–serving skew", "tldr": "Training–serving skew happens when features or preprocessing differ between training and production, so the model sees different data than it learned on. Prevent it with shared feature code, feature stores, logging served features, and comparing distributions.", "real": "Google’s “Rules of Machine Learning” names training–serving skew as a major source of problems and recommends logging the features used at serving time and reusing them for training. Feature stores were created largely to solve this problem.", "body": "### Causes\n\n| Cause | Example |\n|---|---|\n| Different code paths | Python training, Java serving |\n| Different data sources | Warehouse vs live database |\n| Timing differences | Batch features older at serve time |\n| Missing value handling | Defaults differ |\n| Preprocessing versions | Tokenizer or vocabulary mismatch |\n\n### Prevention\n\n```mermaid\nflowchart LR\n  DEF[Single feature definition] --> OFF[Offline computation]\n  DEF --> ON[Online computation]\n  ON --> LOGF[Log served features]\n  LOGF --> TRAIN[Use logged features for training]\n```\n\n### Detection\n\n- Compare feature distributions at training vs serving\n- Replay logged requests through the training pipeline and compare outputs\n- Alert on large differences in prediction distributions"}, {"id": 61, "title": "MLOps maturity levels", "tldr": "MLOps maturity runs from manual notebooks, to automated training pipelines, to full CI/CD for data, models and code with monitoring and automatic retraining. Move up one level at a time, driven by the number and criticality of models.", "real": "Google Cloud’s MLOps guidance describes three levels: level 0 (manual process), level 1 (ML pipeline automation with continuous training) and level 2 (CI/CD pipeline automation). Many organizations use it as a roadmap.", "body": "### Levels\n\n| Level | Characteristics |\n|---|---|\n| 0 Manual | Notebooks, manual deploys, no monitoring |\n| 1 Pipeline automation | Automated training pipelines, continuous training, model registry |\n| 2 CI/CD automation | Automated testing and deployment of pipelines, monitoring, triggers |\n\n### Capability checklist\n\n- [ ] Versioned data and code\n- [ ] Automated training pipeline\n- [ ] Model registry with approvals\n- [ ] Automated evaluation gates\n- [ ] Safe deployment (canary, rollback)\n- [ ] Monitoring of data, model and business metrics\n- [ ] Retraining triggers\n- [ ] Incident process\n\n### Investing wisely\n\n| Situation | Target |\n|---|---|\n| One experimental model | Level 0–1 |\n| Several production models | Level 1 |\n| Many critical models | Level 2 + platform team |"}, {"id": 62, "title": "CI/CD for machine learning", "tldr": "ML CI/CD tests more than code: data schemas, feature logic, training pipelines, model quality and serving compatibility. Pipelines promote models through environments only when automated checks pass.", "real": "Teams using platforms such as Vertex AI Pipelines, SageMaker Pipelines, Kubeflow or GitHub Actions build CI for ML that runs unit tests on feature code, small training runs on sample data, and evaluation against a baseline before a model can be registered.", "body": "### What CI tests\n\n| Test | Example |\n|---|---|\n| Code unit tests | Feature transformation logic |\n| Data tests | Schema, ranges on sample data |\n| Pipeline test | End-to-end run on small data |\n| Model quality | Metrics ≥ baseline on fixed validation set |\n| Fairness / slices | No large regression on key slices |\n| Serving test | Model loads, latency within budget |\n| Contract test | Input/output schema unchanged or versioned |\n\n### Flow\n\n```mermaid\nflowchart LR\n  PR[Pull request] --> CI[CI: tests + small training run]\n  CI --> TR[Full training pipeline]\n  TR --> EV[Evaluation gates]\n  EV --> REG[Registry: candidate]\n  REG --> STG[Staging deploy + load test]\n  STG --> PROD[Canary to production]\n```"}, {"id": 63, "title": "Monitoring data drift and concept drift", "tldr": "Data drift is a change in input distributions; concept drift is a change in the relationship between inputs and outcomes. Monitor both with statistical tests, prediction distributions and delayed ground-truth metrics, and alert owners with context.", "real": "Zillow wound down its Zillow Offers home-buying business in November 2021 after its pricing models misjudged a rapidly changing housing market, leading to an inventory write-down of more than $300 million in one quarter and plans to cut about 25% of staff. It is a high-profile example of models failing under changing conditions.", "body": "### Drift types\n\n| Type | Meaning | Example |\n|---|---|---|\n| Covariate (data) drift | Inputs change | New user demographics |\n| Prior drift | Label distribution changes | Fraud rate doubles |\n| Concept drift | Input → outcome relation changes | Pandemic changes buying patterns |\n| Upstream data change | Pipeline bug | Field units change from dollars to cents |\n\n### Detection methods\n\n| Method | Use |\n|---|---|\n| Population stability index (PSI) | Feature distribution shift |\n| KS test, chi-square | Statistical comparison |\n| Prediction distribution monitoring | Early signal without labels |\n| Delayed label metrics | True accuracy once labels arrive |\n| Embedding drift | Text and image inputs |\n\n### Monitoring flow\n\n```mermaid\nflowchart LR\n  P[Prediction logs] --> D[Drift jobs]\n  L[Delayed labels] --> Q[Quality metrics]\n  D --> A[Alerts with dashboards]\n  Q --> A\n  A --> O[Owner investigates: retrain, fix data, roll back]\n```"}, {"id": 64, "title": "Model performance monitoring", "tldr": "Track model quality in production with labeled samples, delayed outcomes, proxy metrics and business KPIs, broken down by slice. Combine with operational metrics so you can tell whether a problem is the model, the data or the infrastructure.", "real": "Fraud and credit models in banks are monitored with periodic performance reports (for example approval rates, default rates, population stability) as part of model risk management expected under supervisory guidance such as the US SR 11-7, with documented thresholds for action.", "body": "### Monitoring layers\n\n| Layer | Metrics |\n|---|---|\n| Operational | Latency, errors, throughput |\n| Inputs | Missing rates, drift |\n| Outputs | Score distributions, decision rates |\n| Quality | Precision/recall on labeled data |\n| Business | Revenue, losses, user satisfaction |\n| Fairness | Metrics by protected or key groups |\n\n### Getting labels in production\n\n| Source | Delay |\n|---|---|\n| User actions (clicks, purchases) | Seconds to days |\n| Chargebacks | Weeks to months |\n| Human review samples | Hours to days |\n| Customer complaints | Variable |\n\n### Alert design\n\nAlert on sustained changes, include the slice affected, link to the dashboard and runbook, and route to the model owner."}, {"id": 65, "title": "Feedback loops", "tldr": "Models influence the data they later learn from: a recommender shows items, users click what they see, and the model learns its own preferences back. Design for exploration, debiasing and holdout groups to avoid self-reinforcing loops.", "real": "Researchers have documented feedback loops in predictive policing, where models trained on arrest data send more patrols to the same areas, generating more recorded incidents there. Recommender systems face the analogous problem of popularity bias.", "body": "### Types of feedback loops\n\n| Loop | Effect |\n|---|---|\n| Exposure bias | Items not shown cannot be clicked |\n| Position bias | Top items get clicks because they are on top |\n| Popularity bias | Popular items get more popular |\n| Behavior shift | Users adapt to the model |\n| Adversarial | Fraudsters adapt to detection |\n\n### Mitigations\n\n| Mitigation | How |\n|---|---|\n| Exploration | Show some uncertain items (bandits) |\n| Randomized holdouts | Small traffic share without the model |\n| Position debiasing | Model or correct for position effects |\n| Inverse propensity weighting | Weight examples by probability of being shown |\n| Diversity constraints | Avoid repetitive results |\n\n### Loop diagram\n\n```mermaid\nflowchart LR\n  M[Model] --> S[What users see]\n  S --> A[User actions]\n  A --> D[Training data]\n  D --> M\n```"}, {"id": 66, "title": "Automated retraining pipelines", "tldr": "Automate retraining end to end: trigger, fetch fresh data, train, evaluate against the current production model, and promote only if better. Human approval can remain for high-risk models.", "real": "Ad click prediction systems retrain very frequently because user behavior and inventory change quickly; Facebook’s 2014 ads paper showed measurable accuracy loss when models went even a few days without retraining, motivating continuous training pipelines.", "body": "### Automated loop\n\n```mermaid\nflowchart LR\n  T[Trigger: schedule / drift / data volume] --> D[Fetch fresh data]\n  D --> TR[Train candidate]\n  TR --> E[Compare to production model]\n  E -->|better| C[Canary deploy]\n  E -->|worse| K[Keep current, alert]\n  C --> P[Promote]\n```\n\n### Promotion rules (example)\n\n| Rule | Threshold |\n|---|---|\n| Primary metric | ≥ production − 0.2% |\n| Key slices | No slice drops > 1% |\n| Calibration | Within tolerance |\n| Latency | Within budget |\n| Fairness | No regression beyond limits |\n\n### Safeguards\n\nData validation before training, limits on how often models can change, rollback automation, and audit logs of every automatic promotion."}, {"id": 67, "title": "Designing an internal ML platform", "tldr": "An ML platform gives many teams shared infrastructure: data access, feature store, training and tuning, experiment tracking, registry, serving, monitoring and governance. It trades some flexibility for speed and consistency.", "real": "Uber’s Michelangelo (2017), Facebook’s FBLearner Flow (2016), Airbnb’s Bighead and Google’s TFX were early internal ML platforms. Uber reported that Michelangelo let teams deploy many models into production that previously required ad hoc infrastructure.", "body": "### Platform components\n\n```mermaid\nflowchart TB\n  DATA[Data access and feature store] --> TRAIN[Training and tuning]\n  TRAIN --> EXP[Experiment tracking]\n  EXP --> REG[Model registry]\n  REG --> SERVE[Batch and online serving]\n  SERVE --> MON[Monitoring]\n  MON --> TRAIN\n  GOV[Governance, access control, cost] -.-> DATA\n  GOV -.-> SERVE\n```\n\n### Build vs buy\n\n| Option | Fit |\n|---|---|\n| Managed cloud (SageMaker, Vertex AI, Azure ML) | Most companies |\n| Open-source stack (Kubeflow, MLflow, Feast, KServe) | Need control, have platform engineers |\n| Fully custom | Very large scale, unique needs |\n\n### Platform success metrics\n\nTime from idea to production, number of models in production, model incidents, compute utilization and user satisfaction of data scientists."}, {"id": 68, "title": "Model governance and documentation", "tldr": "Governance ensures models are appropriate, fair, documented, approved and monitored. Model cards, datasheets for datasets, risk classifications, approvals and audit trails are the core tools, and regulations increasingly require them.", "real": "Google researchers proposed “Model Cards for Model Reporting” in 2019 and “Datasheets for Datasets” was proposed the same period. The EU AI Act now requires technical documentation, logging and human oversight for high-risk AI systems.", "body": "### Model card contents\n\n| Section | Content |\n|---|---|\n| Intended use | Tasks, users, out-of-scope uses |\n| Training data | Sources, time range, known gaps |\n| Evaluation | Metrics overall and by slice |\n| Limitations | Known failure modes |\n| Fairness | Group performance analysis |\n| Ethical considerations | Risks and mitigations |\n| Maintenance | Owner, retraining schedule |\n\n### Governance process\n\n```mermaid\nflowchart LR\n  R[Risk classification] --> D[Documentation]\n  D --> REV[Independent review]\n  REV --> APP[Approval]\n  APP --> MON[Ongoing monitoring]\n  MON --> RE[Periodic re-validation]\n```\n\n### Risk tiers (example)\n\n| Tier | Example | Controls |\n|---|---|---|\n| Low | Internal search ranking | Basic documentation |\n| Medium | Marketing personalization | Review + monitoring |\n| High | Credit, hiring, medical | Full validation, fairness testing, human oversight |"}, {"id": 69, "title": "Cost management for ML systems", "tldr": "ML costs come from data storage and processing, training compute, inference compute, and people. Track cost per model, per prediction and per experiment; optimize the biggest items first, often inference at scale.", "real": "For widely used AI products, inference typically becomes the dominant ongoing cost because it scales with users, while training is periodic. This is why companies invest heavily in inference optimization, custom chips (such as Google TPUs and AWS Inferentia) and model compression.", "body": "### Cost breakdown (typical shape)\n\n| Area | Drivers |\n|---|---|\n| Data | Storage, processing jobs, egress |\n| Training | GPU hours, failed experiments |\n| Inference | Traffic × model size × hardware |\n| Monitoring | Logging volume |\n| People | Platform and ML engineers |\n\n### Optimization levers\n\n| Lever | Effect |\n|---|---|\n| Right-size models | Smaller models where good enough |\n| Compression | Quantization, distillation |\n| Batch where possible | Cheaper than real-time |\n| Spot / preemptible for training | Large savings with checkpointing |\n| Autoscaling and scale-to-zero | Pay for use |\n| Caching predictions | Avoid recomputation |\n| Data lifecycle policies | Delete or archive old data |\n\n### Unit economics\n\n```\nCost per prediction = (infrastructure cost per hour) ÷ (predictions per hour)\nCompare to value per prediction (revenue, fraud prevented, time saved)\n```"}, {"id": 70, "title": "Incident response for ML systems", "tldr": "ML incidents include silent quality drops, bad data, biased outputs and runaway costs, not just outages. Prepare runbooks, kill switches, fallbacks and rollback paths, and run blameless postmortems that fix systems, not people.", "real": "In 2015 Google Photos’ image labeling produced an offensive misclassification of Black people, and Google responded by removing the affected labels while working on better fixes. ML incidents can be reputational and ethical, not only technical, and need fast containment options.", "body": "### ML incident types\n\n| Type | Example |\n|---|---|\n| Outage | Model server down |\n| Silent degradation | Accuracy drops, no errors |\n| Data incident | Upstream schema change, wrong units |\n| Harmful output | Offensive or biased predictions |\n| Security | Model theft, adversarial abuse |\n| Cost | Runaway inference spend |\n\n### Response playbook\n\n| Phase | Actions |\n|---|---|\n| Detect | Alerts, user reports, monitoring |\n| Contain | Fallback model, disable feature, block outputs |\n| Diagnose | Compare model versions, data, features |\n| Fix | Roll back, retrain, patch pipeline |\n| Recover | Gradual re-enable with monitoring |\n| Learn | Postmortem, new tests and alerts |\n\n### Preparedness checklist\n\n- [ ] Fallback for every model (rules, previous version, safe default)\n- [ ] Feature flags to disable AI features quickly\n- [ ] Runbooks linked from alerts\n- [ ] On-call ownership for each model"}, {"id": 71, "title": "Recommendation systems overview", "tldr": "Recommenders choose a few items from millions for each user. They use a multi-stage funnel: candidate generation (recall), ranking (precision), and re-ranking with business rules. Each stage uses heavier models on fewer items.", "real": "YouTube’s 2016 paper “Deep Neural Networks for YouTube Recommendations” described a two-stage system: candidate generation narrowing millions of videos to hundreds, followed by a ranking network scoring those candidates. That funnel structure is now standard across the industry.", "body": "### The funnel\n\n```mermaid\nflowchart LR\n  ALL[Millions of items] --> CG[Candidate generation: thousands]\n  CG --> RK[Ranking: hundreds]\n  RK --> RR[Re-ranking and rules: tens]\n  RR --> UI[Shown to user]\n```\n\n### Funnel sizes (illustrative)\n\n```chart\n{\"title\": \"Items per stage (log scale, illustrative)\", \"unit\": \"items\", \"log\": true, \"data\": [[\"Catalog\", 10000000], [\"Candidates\", 2000], [\"Ranked\", 300], [\"Shown\", 20]]}\n```\n\n### Stage design\n\n| Stage | Model type | Latency budget |\n|---|---|---|\n| Candidate generation | Embeddings + ANN, collaborative filtering, heuristics | \\~10–30 ms |\n| Ranking | Deep networks or GBDTs with rich features | \\~20–60 ms |\n| Re-ranking | Diversity, freshness, policy, business rules | \\~5–10 ms |\n\n### Signals\n\nUser history, item content, context (time, device, location), social signals and real-time session behavior."}, {"id": 72, "title": "Collaborative filtering and matrix factorization", "tldr": "Collaborative filtering recommends items liked by similar users or similar to items a user liked. Matrix factorization learns user and item vectors whose dot product predicts preference. These remain strong, efficient baselines.", "real": "Amazon’s 2003 paper “Amazon.com Recommendations: Item-to-Item Collaborative Filtering” described recommending items similar to those a customer bought or viewed. During the 2006–2009 Netflix Prize, matrix factorization methods became central to the winning approaches.", "body": "### Approaches\n\n| Approach | Idea | Strength |\n|---|---|---|\n| User–user CF | Similar users like similar items | Intuitive |\n| Item–item CF | Items co-consumed are similar | Stable, scalable (Amazon) |\n| Matrix factorization | Learn latent user and item vectors | Compact, accurate |\n| Implicit ALS | Factorization for clicks/plays | Works without ratings |\n\n### Matrix factorization idea\n\n```\nRating(user u, item i) ≈ vector_u · vector_i\nLearn vectors to minimize error on observed interactions (+ regularization)\n```\n\n### Limitations\n\n| Limitation | Mitigation |\n|---|---|\n| Cold start (new users/items) | Content features, popularity |\n| Ignores context | Add features in ranking stage |\n| Popularity bias | Regularization, exploration |"}, {"id": 73, "title": "Two-tower retrieval models", "tldr": "Two-tower models encode users (or queries) and items into the same vector space with separate networks. Item vectors are precomputed and indexed; at request time only the user tower runs, followed by fast nearest-neighbor search.", "real": "YouTube described two-tower retrieval with sampling-bias correction in a 2019 RecSys paper, and Pinterest, Instagram and many others use two-tower or similar embedding retrieval for candidate generation at large scale.", "body": "### Architecture\n\n```mermaid\nflowchart LR\n  UF[User features] --> UT[User tower]\n  IF[Item features] --> IT[Item tower]\n  UT --> UV[User vector]\n  IT --> IV[Item vectors, precomputed]\n  IV --> IDX[(ANN index)]\n  UV --> IDX\n  IDX --> CANDS[Top-k candidates]\n```\n\n### Training\n\n| Aspect | Practice |\n|---|---|\n| Positives | Clicks, watches, purchases |\n| Negatives | In-batch negatives, sampled negatives |\n| Loss | Softmax / contrastive |\n| Bias correction | Adjust for item popularity in sampling |\n\n### Serving\n\n- Item embeddings recomputed in batch and indexed\n- User embedding computed per request (or cached)\n- ANN search returns hundreds of candidates in milliseconds\n\n### Limitation\n\nNo interaction between user and item features inside the model; cross features are left to the ranking stage."}, {"id": 74, "title": "Ranking models", "tldr": "Ranking models score each candidate with rich features, including user–item cross features, often predicting several outcomes at once (click, watch time, like, purchase) and combining them into a final score.", "real": "YouTube’s 2019 paper “Recommending What Video to Watch Next” used a multi-task ranking model (multi-gate mixture-of-experts) to predict engagement and satisfaction objectives together, plus a component to reduce position bias.", "body": "### Model choices\n\n| Model | Notes |\n|---|---|\n| Logistic regression | Simple, fast baseline |\n| GBDT (XGBoost, LightGBM) | Strong on tabular features |\n| Wide & Deep (Google, 2016) | Memorization + generalization |\n| DLRM (Meta, 2019) | Embeddings + feature interactions |\n| Multi-task networks | Several objectives together |\n| Transformers over user history | Sequence-aware ranking |\n\n### Multi-objective score\n\n```\nfinal_score = w1·P(click) + w2·E[watch_time] + w3·P(like) − w4·P(dislike)\n```\n\nWeights encode product strategy and are tuned with online experiments.\n\n### Ranking features\n\n| Group | Examples |\n|---|---|\n| User | History aggregates, embeddings |\n| Item | Popularity, freshness, quality |\n| Cross | User–category affinity, embedding similarity |\n| Context | Time, device, session |"}, {"id": 75, "title": "Re-ranking, diversity and business rules", "tldr": "After ranking, a final layer adjusts the list for diversity, freshness, fairness, deduplication, policy compliance and business goals. Without it, lists become repetitive or violate product constraints.", "real": "Twitter’s 2023 open-sourced recommendation algorithm included heuristics and filters after its heavy ranker, such as author diversity, content balance between in-network and out-of-network tweets, and visibility filtering, before assembling the final timeline.", "body": "### Common re-ranking steps\n\n| Step | Purpose |\n|---|---|\n| Deduplication | Remove near-identical items |\n| Diversity | Mix categories, creators |\n| Freshness boost | Surface new content |\n| Fairness / exposure | Give new creators visibility |\n| Policy filters | Remove unsafe or ineligible items |\n| Business rules | Sponsored slots, inventory, contracts |\n\n### Diversity algorithm example (MMR)\n\n```\nPick next item maximizing:  λ·relevance(item) − (1−λ)·max_similarity(item, already_picked)\n```\n\n### Pipeline position\n\n```mermaid\nflowchart LR\n  RK[Ranked list] --> F[Filters]\n  F --> D[Diversity / MMR]\n  D --> B[Business rules and ads]\n  B --> OUT[Final list]\n```"}, {"id": 76, "title": "Cold start", "tldr": "New users and new items lack interaction data. Solve cold start with content features, onboarding questions, popularity and context, exploration traffic, and transfer from similar entities until behavior data accumulates.", "real": "Netflix and Spotify ask new users to pick some titles or artists during onboarding to bootstrap recommendations. Content-based embeddings of text, audio or images let new items be recommended before they have many interactions.", "body": "### Strategies\n\n| Case | Strategies |\n|---|---|\n| New user | Onboarding preferences, popular items by context, location/device signals |\n| New item | Content embeddings, creator history, exploration slots |\n| New market | Transfer from similar markets, editorial curation |\n\n### Blend over time\n\n```\nscore = α(n)·content_based + (1 − α(n))·collaborative\nα decreases as interaction count n grows\n```\n\n### Exploration slots\n\nReserve a small share of impressions for new items, measure early engagement, and promote items that perform well."}, {"id": 77, "title": "Exploration and multi-armed bandits", "tldr": "Bandits balance exploiting known good options with exploring uncertain ones. Contextual bandits choose per user context. They are useful for layouts, artwork, new items and any decision where learning while serving matters.", "real": "Netflix has written about using contextual bandits to personalize the artwork shown for each title, learning which image works for which member. Spotify has described a bandit-based approach (BaRT) for its home page recommendations.", "body": "### Algorithms\n\n| Algorithm | Idea |\n|---|---|\n| ε-greedy | Explore randomly with probability ε |\n| Upper confidence bound (UCB) | Favor options with high uncertainty |\n| Thompson sampling | Sample from posterior beliefs |\n| Contextual bandits | Use user/context features |\n\n### Bandit vs A/B test\n\n| | A/B test | Bandit |\n|---|---|---|\n| Goal | Learn which variant is best | Maximize reward while learning |\n| Traffic split | Fixed | Adaptive |\n| Statistical clarity | High | Lower |\n| Best for | Major decisions | Many options, continuous optimization |\n\n### Logging requirement\n\nLog the probability with which each option was chosen; it enables unbiased offline evaluation of new policies."}, {"id": 78, "title": "Case study: video and content recommendations", "tldr": "Large content platforms combine many candidate sources, multi-objective ranking, satisfaction signals and strong policy layers. Their designs show the full funnel at extreme scale, with careful choice of what to optimize.", "real": "YouTube’s published papers describe candidate generation from user history plus deep ranking, moving from clicks toward watch time and satisfaction surveys. Twitter’s open-sourced 2023 system described sourcing roughly 1,500 candidates per request and scoring them with a neural “heavy ranker” of about 48 million parameters.", "body": "### End-to-end design\n\n```mermaid\nflowchart TB\n  REQ[Home feed request] --> CS1[Embedding retrieval]\n  REQ --> CS2[Followed creators]\n  REQ --> CS3[Trending and fresh]\n  CS1 --> MERGE[Merge candidates ~1000s]\n  CS2 --> MERGE\n  CS3 --> MERGE\n  MERGE --> LR[Light ranker]\n  LR --> HR[Heavy multi-task ranker]\n  HR --> RR[Re-ranking: diversity, policy, ads]\n  RR --> FEED[Feed]\n  FEED --> LOGS[(Impressions and engagement logs)]\n```\n\n### Key decisions\n\n| Decision | Choice |\n|---|---|\n| Objective | Engagement + satisfaction + policy |\n| Candidate sources | Several, for coverage |\n| Ranking | Multi-task deep model |\n| Freshness | Real-time features for trending |\n| Safety | Policy filters before showing |\n\n### Metrics\n\nWatch time, satisfaction surveys, retention, diversity, creator coverage and policy violation rates."}, {"id": 79, "title": "Case study: e-commerce and marketplace recommendations", "tldr": "Commerce recommenders optimize purchases and revenue while handling inventory, price, seller fairness and very sparse purchase data. They rely on co-purchase signals, embeddings from sessions, and strong business rules.", "real": "Amazon’s item-to-item collaborative filtering powered “customers who bought this also bought” for years. Airbnb’s 2018 work trained listing embeddings from booking sessions and used them for similar-listing recommendations and real-time personalization of search.", "body": "### Surfaces\n\n| Surface | Signal |\n|---|---|\n| Similar items | Co-view, embedding similarity |\n| Frequently bought together | Co-purchase |\n| Personalized home | User history, session |\n| Search ranking | Query + personalization |\n| Email / push | Propensity models |\n\n### Marketplace constraints\n\n| Constraint | Handling |\n|---|---|\n| Inventory | Filter out-of-stock items |\n| Seller fairness | Exposure constraints |\n| Price sensitivity | Features and segmenting |\n| Sponsored listings | Auction + relevance blending |\n| Returns and quality | Penalize high-return items |\n\n### Session-based embeddings\n\nTreat browsing sessions like sentences and items like words; train embeddings (word2vec-style) so items viewed together are close in vector space."}, {"id": 80, "title": "Evaluating recommender systems", "tldr": "Evaluate recommenders offline with ranking metrics on time-split data, then online with A/B tests on business and satisfaction metrics. Also measure diversity, coverage, novelty and fairness, which accuracy metrics ignore.", "real": "The Netflix Prize optimized RMSE on rating predictions, but Netflix later explained it did not deploy the full winning ensemble, partly because the engineering cost outweighed the measured gains and its product had shifted toward streaming, where other signals mattered more.", "body": "### Metrics\n\n| Category | Metrics |\n|---|---|\n| Accuracy | Recall@k, NDCG@k, MAP |\n| Beyond accuracy | Diversity, novelty, catalog coverage, serendipity |\n| Business (online) | CTR, conversion, watch time, retention |\n| Satisfaction | Surveys, dislikes, hides |\n| Fairness | Exposure across creators or sellers |\n\n### Offline evaluation pitfalls\n\n- Logged data only contains items that were shown (exposure bias)\n- Random splits leak future behavior\n- Optimizing CTR offline may hurt long-term satisfaction\n\n### Counterfactual evaluation\n\nUsing logged propensities (ch. 77), estimate how a new policy would have performed on past traffic before running an A/B test."}, {"id": 81, "title": "Search system architecture", "tldr": "A search system has an offline side (crawl or ingest, parse, index) and an online side (understand the query, retrieve candidates, rank, present). Modern search mixes keyword, semantic and learned ranking, and increasingly generates answers with LLMs.", "real": "Google’s 1998 paper by Brin and Page (“The Anatomy of a Large-Scale Hypertextual Web Search Engine”) described crawling, indexing and ranking with PageRank. Today’s search engines keep that offline/online split while adding neural retrieval and ranking.", "body": "### Architecture\n\n```mermaid\nflowchart TB\n  subgraph Offline\n    SRC[Documents] --> PARSE[Parse and enrich]\n    PARSE --> IDX1[(Inverted index)]\n    PARSE --> EMB[Embed]\n    EMB --> IDX2[(Vector index)]\n  end\n  subgraph Online\n    Q[Query] --> QU[Query understanding]\n    QU --> R1[Keyword retrieval]\n    QU --> R2[Semantic retrieval]\n    R1 --> MRG[Merge]\n    R2 --> MRG\n    MRG --> RANK[Learning-to-rank]\n    RANK --> RES[Results / answer]\n  end\n  IDX1 --> R1\n  IDX2 --> R2\n```\n\n### Requirements to define\n\n| Requirement | Example |\n|---|---|\n| Corpus size | 100M documents |\n| Freshness | New docs searchable in < 1 minute |\n| Latency | p99 < 300 ms |\n| Relevance metric | NDCG@10 |\n| Access control | Per-user document permissions |"}, {"id": 82, "title": "Inverted indexes and BM25", "tldr": "An inverted index maps each term to the documents containing it, enabling fast keyword search. BM25 scores documents by term frequency, inverse document frequency and length normalization. It is fast, explainable and still a strong baseline.", "real": "Elasticsearch and OpenSearch, built on Apache Lucene, use BM25 as the default similarity for text fields, and BM25 remains a standard component in hybrid retrieval for RAG systems.", "body": "### Inverted index\n\n```\n\"refund\"  → [doc3, doc17, doc42]\n\"policy\"  → [doc3, doc8, doc42]\nQuery \"refund policy\" → intersect / union → candidate docs → score\n```\n\n### BM25 intuition\n\n| Factor | Effect |\n|---|---|\n| Term frequency | More occurrences help, with diminishing returns |\n| Inverse document frequency | Rare terms matter more |\n| Length normalization | Long documents not unfairly favored |\n\n### Strengths and weaknesses\n\n| Strength | Weakness |\n|---|---|\n| Exact matches (codes, names, IDs) | Misses synonyms and paraphrases |\n| Fast and cheap | No understanding of meaning |\n| Explainable | Language-specific tokenization needed |\n\n### Practical tips\n\nUse language analyzers (stemming, stopwords), field boosts (title > body), and phrase matching for precise queries."}, {"id": 83, "title": "Semantic search with embeddings", "tldr": "Semantic search embeds queries and documents into vectors so similar meanings are close even with different words. It handles paraphrases and natural-language questions well but can miss exact terms, so it is often combined with keyword search.", "real": "Dense passage retrieval (DPR, Facebook AI, 2020) showed that learned dense embeddings could outperform BM25 on open-domain question answering. Embedding models from OpenAI, Cohere, Google and open-source families such as E5 and BGE are now widely used.", "body": "### Flow\n\n```mermaid\nflowchart LR\n  D[Documents] --> C[Chunk]\n  C --> E[Embedding model]\n  E --> V[(Vector index)]\n  Q[Query] --> QE[Same embedding model]\n  QE --> V\n  V --> TOP[Top-k similar chunks]\n```\n\n### Choosing an embedding model\n\n| Factor | Consider |\n|---|---|\n| Quality on your domain | Evaluate on your queries |\n| Languages | Multilingual support |\n| Dimensions | Storage and speed |\n| Max input length | Chunk size limits |\n| Cost and hosting | API vs self-hosted |\n| License | Commercial use |\n\n### Similarity measures\n\nCosine similarity (on normalized vectors) is most common; dot product and Euclidean distance are alternatives depending on how the model was trained."}, {"id": 84, "title": "Approximate nearest neighbor search", "tldr": "Exact nearest-neighbor search over millions of vectors is too slow, so systems use approximate methods: graph-based (HNSW), clustering-based (IVF), and compression (product quantization). They trade a little recall for huge speed and memory gains.", "real": "Meta released the FAISS library in 2017, Spotify open-sourced Annoy, and Google published ScaNN in 2020. The HNSW algorithm (Malkov and Yashunin) became the default in many vector databases.", "body": "### Algorithms\n\n| Method | Idea | Strength | Weakness |\n|---|---|---|---|\n| Brute force | Compare with all | Exact | Slow at scale |\n| HNSW | Navigable layered graph | High recall, fast | Memory-heavy |\n| IVF | Cluster, search nearest clusters | Scalable | Recall depends on probes |\n| PQ / IVF-PQ | Compress vectors | Huge memory savings | Lower accuracy |\n| DiskANN-style | Graph on SSD | Billions of vectors | More complex |\n\n### Key tuning parameters\n\n| Parameter | Trade-off |\n|---|---|\n| HNSW M, ef_construction | Index quality vs build time/memory |\n| HNSW ef_search | Recall vs latency |\n| IVF nlist, nprobe | Recall vs latency |\n| PQ code size | Memory vs accuracy |\n\n### Memory estimate\n\n```\n100M vectors × 768 dims × 4 bytes ≈ 307 GB (float32), before index overhead\nWith 8-bit quantization ≈ 77 GB\n```"}, {"id": 85, "title": "Vector databases", "tldr": "Vector databases store embeddings with metadata and provide ANN search, filtering, updates, replication and access control. Options range from libraries and database extensions to dedicated managed services.", "real": "pgvector adds vector search to PostgreSQL, Elasticsearch and OpenSearch offer vector fields, and dedicated systems include Milvus, Weaviate, Qdrant and Pinecone. Many teams start with pgvector and move to a dedicated system only at large scale.", "body": "### Options\n\n| Type | Examples | Fit |\n|---|---|---|\n| Library | FAISS, Annoy, hnswlib | Embedded, custom systems |\n| Database extension | pgvector, Elasticsearch/OpenSearch | Existing stack, moderate scale |\n| Dedicated open source | Milvus, Weaviate, Qdrant | Large scale, self-hosted |\n| Managed service | Pinecone and cloud offerings | Less operations |\n\n### Features to evaluate\n\n| Feature | Why |\n|---|---|\n| Metadata filtering | Tenant, permissions, dates |\n| Hybrid search | Keyword + vector |\n| Real-time updates | Fresh data |\n| Scale and sharding | Growth |\n| Multi-tenancy | Isolation |\n| Backup and replication | Reliability |\n| Cost | Memory-heavy indexes |\n\n### Filtering caution\n\nFiltering after ANN search can return too few results; prefer engines that filter during search."}, {"id": 86, "title": "Hybrid search and fusion", "tldr": "Hybrid search combines keyword and semantic retrieval to get the strengths of both. Results are merged with score normalization or reciprocal rank fusion (RRF), then often reranked with a cross-encoder.", "real": "Reciprocal rank fusion was introduced by Cormack and colleagues in 2009 and is now built into search engines such as Elasticsearch and OpenSearch. Anthropic’s 2024 “contextual retrieval” work combined embeddings with BM25 and reranking to cut retrieval failures substantially.", "body": "### Reciprocal rank fusion\n\n```\nRRF_score(doc) = Σ over result lists [ 1 / (k + rank_in_list) ],  with k ≈ 60\n```\n\n### Pipeline\n\n```mermaid\nflowchart LR\n  Q[Query] --> BM[BM25 top 100]\n  Q --> VEC[Vector top 100]\n  BM --> F[RRF fusion]\n  VEC --> F\n  F --> RR[Cross-encoder rerank top 50]\n  RR --> TOP[Top 10]\n```\n\n### Retrieval failure rates reported by Anthropic (top-20 retrieval)\n\n```chart\n{\"title\": \"Retrieval failure rate\", \"unit\": \"%\", \"data\": [[\"Embeddings only\", 5.7], [\"Contextual embeddings\", 3.7], [\"+ contextual BM25\", 2.9], [\"+ reranking\", 1.9]]}\n```\n\n### When each wins\n\n| Query | Better retriever |\n|---|---|\n| “error code E1043” | Keyword |\n| “why does my card get declined abroad” | Semantic |\n| Mixed natural language with IDs | Hybrid |"}, {"id": 87, "title": "Learning to rank and rerankers", "tldr": "After retrieval, a ranking model orders candidates using many features or deep query–document interaction. Approaches include pointwise, pairwise and listwise learning to rank, and transformer cross-encoders that read query and document together.", "real": "Microsoft’s RankNet and LambdaMART (2005–2010) powered web ranking research for years. Today cross-encoder rerankers, such as Cohere Rerank and open-source BGE rerankers, are standard in RAG pipelines to reorder top candidates.", "body": "### Approaches\n\n| Approach | Loss over | Example |\n|---|---|---|\n| Pointwise | Each item’s relevance | Regression / classification |\n| Pairwise | Pairs (A better than B) | RankNet |\n| Listwise | Whole list ordering | LambdaMART, ListNet |\n| Cross-encoder | Query + document jointly | BERT-style rerankers |\n\n### Bi-encoder vs cross-encoder\n\n| | Bi-encoder (retrieval) | Cross-encoder (rerank) |\n|---|---|---|\n| Speed | Very fast (precomputed) | Slow (per pair) |\n| Accuracy | Good | Higher |\n| Use | Millions of docs | Top 20–200 candidates |\n\n### Ranking features (classic LTR)\n\nBM25 scores per field, embedding similarity, freshness, popularity, click-through rates, document quality and personalization features."}, {"id": 88, "title": "Query understanding", "tldr": "Understanding the query before retrieval improves results: spelling correction, normalization, language detection, intent classification, entity recognition, query expansion and rewriting. LLMs now handle many of these steps.", "real": "Google has said that about one in ten search queries is misspelled, which is why spelling correction is a core part of its query understanding. E-commerce search teams commonly classify query intent (product, category, brand, help) before choosing a retrieval strategy.", "body": "### Steps\n\n| Step | Example |\n|---|---|\n| Normalization | Lowercase, unicode, punctuation |\n| Spell correction | “recieve” → “receive” |\n| Language detection | Route to language-specific index |\n| Intent classification | Navigational, product, question, support |\n| Entity recognition | Brand, location, product codes |\n| Expansion | Synonyms, acronyms |\n| Rewriting (LLM) | Conversational query → standalone query |\n\n### Conversational rewriting\n\n```\nHistory: \"Show me laptops under $1,000\"  →  User: \"only ones with 32GB\"\nRewritten: \"laptops under $1,000 with 32GB RAM\"\n```\n\n### Routing by intent\n\n```mermaid\nflowchart LR\n  Q[Query] --> I{Intent}\n  I -->|product| P[Product index + ranking]\n  I -->|help| H[Help center RAG]\n  I -->|order status| O[Orders API]\n```"}, {"id": 89, "title": "Autocomplete and typeahead design", "tldr": "Autocomplete suggests completions as users type, under very tight latency (tens of milliseconds). Typical designs use prefix tries or indexes over popular queries, ranked by frequency, freshness and personalization, with filtering of unsafe suggestions.", "real": "Google Search autocomplete predicts queries from what people search for, and Google has published policies for removing predictions that violate rules (for example hateful or sexually explicit predictions). Safety filtering is a core part of autocomplete design.", "body": "### Architecture\n\n```mermaid\nflowchart LR\n  LOGS[Query logs] --> AGG[Aggregate popular queries]\n  AGG --> BUILD[Build prefix index / trie]\n  BUILD --> SERVE[In-memory suggestion service]\n  U[Keystroke] --> SERVE\n  SERVE --> RANK[Rank + personalize + filter]\n  RANK --> UI[Suggestions]\n```\n\n### Requirements\n\n| Requirement | Target |\n|---|---|\n| Latency | < 50 ms per keystroke |\n| Freshness | Trending queries within minutes to hours |\n| Safety | Block offensive and dangerous suggestions |\n| Personalization | Recent user queries |\n\n### Ranking signals\n\nQuery frequency, recency, user’s own history, location, and click-through on suggestions.\n\n### Scale tricks\n\nCache top suggestions per prefix, debounce keystrokes on the client, and shard tries by prefix."}, {"id": 90, "title": "Evaluating search quality", "tldr": "Measure search with relevance judgments (human or LLM-assisted), offline ranking metrics, and online behavior: clicks, reformulations, abandonment, success rates. Keep a fixed judged query set to catch regressions.", "real": "Major search engines use trained human raters to judge result quality; Google publishes its Search Quality Rater Guidelines, which raters use to evaluate results, though their ratings do not directly change individual rankings.", "body": "### Offline evaluation\n\n| Element | Practice |\n|---|---|\n| Query set | Sample of real queries, including tail queries |\n| Judgments | Graded relevance (0–3) by raters or LLM + human audit |\n| Metrics | NDCG@10, Recall@100, MRR |\n| Slices | Head vs tail, languages, query types |\n\n### Online signals\n\n| Signal | Interpretation |\n|---|---|\n| Click-through on top results | Relevance (biased by position) |\n| Reformulation rate | Failure signal |\n| Abandonment | Possibly failure (or answer shown directly) |\n| Time to success | Efficiency |\n| Zero-result rate | Coverage gaps |\n\n### Regression gate\n\nEvery ranking change must not reduce NDCG on the golden query set beyond a small tolerance before online testing."}, {"id": 91, "title": "Case study: ad click-through prediction", "tldr": "Ad systems predict the probability of a click or conversion for each ad candidate in milliseconds, combine it with bids in an auction, and retrain constantly. Calibration matters because predicted probabilities directly set prices.", "real": "Facebook’s 2014 paper “Practical Lessons from Predicting Clicks on Ads at Facebook” combined gradient-boosted trees with logistic regression and emphasized data freshness and calibration. Google’s 2013 paper “Ad Click Prediction: a View from the Trenches” described large-scale online learning for search ads.", "body": "### Architecture\n\n```mermaid\nflowchart LR\n  REQ[Ad request + context] --> CAND[Candidate ads by targeting]\n  CAND --> PCTR[pCTR / pCVR model]\n  PCTR --> AUC[Auction: bid × pCTR × quality]\n  AUC --> SHOW[Ad shown]\n  SHOW --> LOG[(Impressions, clicks, conversions)]\n  LOG --> TRAIN[Frequent retraining]\n  TRAIN --> PCTR\n```\n\n### Key design points\n\n| Topic | Choice |\n|---|---|\n| Model | GBDT + linear, or deep CTR models (DLRM-style) |\n| Features | User, ad, context, cross features, embeddings |\n| Training data | Huge, imbalanced; negative downsampling + recalibration |\n| Freshness | Hourly or continuous updates |\n| Metrics | Log loss, calibration, AUC; online revenue and advertiser ROI |\n| Latency | Tens of milliseconds for many candidates |\n\n### Why calibration matters\n\n```\nExpected value = bid × predicted CTR\nIf pCTR is overestimated by 20%, prices and auction outcomes are distorted.\n```"}, {"id": 92, "title": "Case study: real-time fraud detection", "tldr": "Fraud systems score transactions in real time with rules plus ML, using velocity features, device and network signals, and graph relationships. They balance blocking fraud against declining good customers, and adapt to adversaries.", "real": "Stripe Radar uses machine learning trained on payments data across the businesses on Stripe’s network to score transactions, combined with rules that businesses can customize. Network-wide data is a major advantage because fraudsters reuse cards and devices across merchants.", "body": "### Architecture\n\n```mermaid\nflowchart LR\n  TX[Transaction] --> FEAT[Real-time features]\n  STREAM[(Event stream)] --> FEAT\n  FEAT --> RULES[Rules engine]\n  FEAT --> ML[ML risk score]\n  RULES --> DEC{Decision}\n  ML --> DEC\n  DEC -->|allow| OK[Approve]\n  DEC -->|review| REV[Manual review / step-up auth]\n  DEC -->|block| BLK[Decline]\n  REV --> LABELS[(Labels)]\n  CB[Chargebacks] --> LABELS\n```\n\n### Features\n\n| Group | Examples |\n|---|---|\n| Velocity | Transactions per card in last hour |\n| Device | Fingerprint, emulator signals |\n| Geography | Distance from usual location |\n| Behavioral | Typing speed, navigation |\n| Graph | Shared cards/devices/emails across accounts |\n| Merchant | Category risk, history |\n\n### Challenges\n\n| Challenge | Approach |\n|---|---|\n| Label delay (chargebacks take weeks) | Use early proxies + delayed labels |\n| Class imbalance | Sampling, cost-sensitive learning |\n| Adversaries adapt | Frequent retraining, rules for new patterns |\n| Customer friction | Step-up authentication instead of decline |"}, {"id": 93, "title": "Case study: spam and content moderation", "tldr": "Moderation systems combine hash matching for known bad content, ML classifiers for new content, user reports, and human reviewers, with appeals. They must work across languages and media types at enormous scale.", "real": "Google has said Gmail blocks more than 99.9% of spam, phishing and malware, and in 2019 reported that TensorFlow-based models were blocking an additional 100 million spam messages per day. Hash-matching technologies such as Microsoft’s PhotoDNA detect known illegal images across many platforms.", "body": "### Layered moderation\n\n```mermaid\nflowchart LR\n  C[New content] --> H[Hash match known bad]\n  H -->|match| X[Remove]\n  H -->|no match| CL[ML classifiers]\n  CL -->|high confidence| X\n  CL -->|uncertain| HR[Human review]\n  CL -->|low risk| PUB[Publish]\n  PUB --> REP[User reports]\n  REP --> HR\n  HR --> APPEAL[Appeals]\n```\n\n### Design decisions\n\n| Decision | Consideration |\n|---|---|\n| Thresholds per policy | Severity of harm vs over-removal |\n| Languages | Classifiers and reviewers per language |\n| Media types | Text, image, video, audio models |\n| Latency | Pre-publication vs post-publication checks |\n| Transparency | Notices and appeals |\n\n### Metrics\n\nPrevalence of violating content, precision and recall per policy, review time, appeal overturn rate."}, {"id": 94, "title": "Case study: ETA prediction", "tldr": "ETA systems predict arrival times by combining routing engines with ML models that correct for traffic, pickup times and local patterns. They need low latency at very high request volume and must be well calibrated.", "real": "Uber described DeepETA in 2022, a transformer-based model that predicts a correction (residual) on top of its routing engine’s ETA, using features such as origin, destination, time and real-time traffic. It served at very high query rates with low latency.", "body": "### Hybrid architecture\n\n```mermaid\nflowchart LR\n  REQ[Trip request] --> ROUTE[Routing engine ETA]\n  REQ --> FEAT[Features: time, location, traffic, weather]\n  ROUTE --> ML[ML residual model]\n  FEAT --> ML\n  ML --> ETA[Final ETA = route ETA + residual]\n```\n\n### Why predict the residual\n\n| Benefit | Explanation |\n|---|---|\n| Uses domain physics | Routing engine encodes road network |\n| Easier learning | Model learns systematic errors only |\n| Safer fallback | Routing ETA alone still works if ML fails |\n\n### Metrics\n\nMAE, error percentiles, bias by city and time of day, and the share of trips arriving within a tolerance window."}, {"id": 95, "title": "Case study: dynamic pricing", "tldr": "Dynamic pricing systems forecast demand and supply, estimate price sensitivity, and set prices within business and regulatory constraints. They need guardrails, explainability and fairness checks because prices directly affect customers.", "real": "Airbnb introduced Smart Pricing (described in a 2018 KDD paper), which suggests nightly prices to hosts using a model of booking probability by price and demand signals, while hosts keep control over minimum and maximum prices.", "body": "### Components\n\n```mermaid\nflowchart LR\n  D[Demand forecast] --> OPT[Price optimizer]\n  E[Price elasticity model] --> OPT\n  S[Supply / inventory] --> OPT\n  C[Constraints: min/max, rules, fairness] --> OPT\n  OPT --> P[Recommended price]\n  P --> OUT[Outcomes logged]\n  OUT --> E\n```\n\n### Guardrails\n\n| Guardrail | Example |\n|---|---|\n| Bounds | Price within ±X% of reference |\n| Rate of change | Limited updates per day |\n| Emergency caps | Limits during disasters |\n| Fairness checks | No discriminatory patterns |\n| Human override | Merchant or host control |\n\n### Experimentation\n\nUse carefully designed experiments (randomized by market or time) because prices affect both customer behavior and competitors."}, {"id": 96, "title": "Case study: feed ranking for social networks", "tldr": "Social feeds rank posts from friends, followed accounts and recommendations by predicted engagement and value, combining many prediction heads into one score, with integrity filters and diversity rules. Objective choice is a major ethical decision.", "real": "Meta has publicly described its feed ranking as predicting multiple outcomes (such as likes, comments and shares) for each post and combining them into a relevance score, and in 2018 it announced a shift toward “meaningful social interactions” between people.", "body": "### Pipeline\n\n```mermaid\nflowchart LR\n  INV[Inventory: friends, pages, groups, recommended] --> PRE[Pre-filter and integrity checks]\n  PRE --> LR[Lightweight ranking]\n  LR --> HR[Multi-task heavy ranking]\n  HR --> SCORE[Value model combines predictions]\n  SCORE --> RR[Diversity and policy re-ranking]\n  RR --> FEED[Feed]\n```\n\n### Value model\n\n```\nvalue(post) = Σ weight_k × P(action_k) for actions such as like, comment, share, hide, report\n```\n\nNegative actions (hide, report) carry negative weights.\n\n### Integrity layer\n\nClassifiers for misinformation, hate speech, spam and borderline content can demote or remove posts before or after ranking.\n\n### Metrics\n\nEngagement, meaningful interactions, user-reported satisfaction, integrity prevalence metrics."}, {"id": 97, "title": "Case study: visual search", "tldr": "Visual search lets users search with images. Systems detect objects, embed image crops, retrieve similar items from a large index, and rank by relevance and shoppability. Embedding quality and index scale are the core challenges.", "real": "Pinterest described its visual search system in a 2015 KDD paper and later launched Lens (2017) to search using the phone camera. Google Lens similarly identifies objects and text from camera images to search the web and shopping results.", "body": "### Architecture\n\n```mermaid\nflowchart LR\n  IMG[Query image] --> DET[Object detection]\n  DET --> CROP[Crops]\n  CROP --> EMB[Image embedding model]\n  EMB --> ANN[(ANN index of catalog images)]\n  ANN --> RANK[Ranking: similarity, quality, availability]\n  RANK --> RES[Results]\n```\n\n### Design points\n\n| Topic | Choice |\n|---|---|\n| Embeddings | CNN or vision transformer trained with metric learning |\n| Index | Billions of images, sharded ANN |\n| Multimodal | Combine image and text embeddings (CLIP-style) |\n| Freshness | Index new products quickly |\n| Safety | Filter unsafe images |\n\n### Evaluation\n\nHuman-judged relevance, click-through and save rates, and purchase conversion for shopping use cases."}, {"id": 98, "title": "Case study: voice assistants", "tldr": "Voice assistants chain wake-word detection, speech recognition, language understanding, actions or answers, and speech synthesis. Latency, accuracy in noisy settings, privacy and on-device processing shape the design. LLMs are replacing rigid intent pipelines.", "real": "Classic assistants such as Amazon Alexa and Apple’s Siri used on-device wake-word detection with cloud speech recognition and intent classification. Newer designs use LLMs, and Amazon announced its LLM-powered Alexa+ in February 2025.", "body": "### Classic pipeline\n\n```mermaid\nflowchart LR\n  MIC[Microphone] --> WW[Wake word, on-device]\n  WW --> ASR[Speech-to-text]\n  ASR --> NLU[Intent + slots / LLM]\n  NLU --> ACT[Action or answer]\n  ACT --> TTS[Text-to-speech]\n  TTS --> SPK[Speaker]\n```\n\n### Latency budget (illustrative, voice turn)\n\n| Stage | Target |\n|---|---|\n| End-of-speech detection | 200–500 ms |\n| Speech recognition | 100–300 ms |\n| Reasoning / action | 200–1000 ms |\n| First audio of response | < 1 s total feels natural |\n\n### Design concerns\n\n| Concern | Approach |\n|---|---|\n| Privacy | On-device wake word, clear recording policies |\n| Noise and accents | Diverse training data |\n| Interruptions | Barge-in support |\n| Actions | Secure integration with devices and accounts |"}, {"id": 99, "title": "Case study: machine translation", "tldr": "Translation systems use neural sequence-to-sequence models (now transformers or LLMs), serve many language pairs, and handle domain terms, formatting and quality estimation. Multilingual models share capacity across languages.", "real": "Google switched Google Translate to neural machine translation (GNMT) in 2016, reporting large quality improvements, and later used massively multilingual models. Meta’s No Language Left Behind project (2022) released a model covering 200 languages.", "body": "### Architecture\n\n```mermaid\nflowchart LR\n  IN[Source text] --> PRE[Language detection, segmentation]\n  PRE --> MT[Translation model]\n  GLOSS[Glossary / terminology] --> MT\n  MT --> POST[Formatting, tags restore]\n  POST --> QE[Quality estimation]\n  QE -->|low quality| HUMAN[Human post-editing]\n  QE -->|ok| OUT[Output]\n```\n\n### Design choices\n\n| Choice | Options |\n|---|---|\n| Model | Bilingual vs multilingual; dedicated MT vs LLM |\n| Domain | Fine-tune on domain parallel data |\n| Terminology | Glossary constraints |\n| Latency | Caching repeated segments |\n| Quality | Automatic metrics (BLEU, COMET) + human evaluation |\n\n### Low-resource languages\n\nUse multilingual transfer, back-translation for synthetic data, and community-built datasets."}, {"id": 100, "title": "Case study: demand forecasting", "tldr": "Forecasting systems predict future demand per product, location and time to drive inventory, staffing and pricing. They combine statistical and ML models, hierarchical reconciliation, uncertainty estimates, and frequent backtesting.", "real": "Amazon has described moving its demand forecasting from traditional statistical methods to deep learning at large scale, and released research models such as DeepAR, which produces probabilistic forecasts across many related time series.", "body": "### Architecture\n\n```mermaid\nflowchart LR\n  HIST[Sales history] --> FEAT[Features: seasonality, promotions, price, holidays]\n  FEAT --> MODELS[Models: statistical + ML]\n  MODELS --> REC[Hierarchical reconciliation]\n  REC --> PROB[Probabilistic forecasts p10/p50/p90]\n  PROB --> PLAN[Inventory and staffing decisions]\n  ACT[Actual demand] --> BT[Backtesting and monitoring]\n  BT --> MODELS\n```\n\n### Model options\n\n| Model | Fit |\n|---|---|\n| Seasonal naive / ETS / ARIMA | Baselines, stable series |\n| Gradient-boosted trees | Many features, many series |\n| DeepAR-style RNNs, transformers | Large collections of series |\n| Foundation time-series models | Zero-shot forecasting |\n\n### Why probabilistic forecasts\n\nInventory decisions depend on quantiles (e.g. stock to p90 demand), not just the average. Evaluate with quantile loss and coverage, not only MAE."}, {"id": 101, "title": "LLMs from a system designer’s view", "tldr": "An LLM takes tokens in and generates tokens out, one at a time, conditioned on a context window. For design, what matters is context limits, latency per token, cost per token, quality on your tasks, determinism, and failure modes such as hallucination.", "real": "ChatGPT launched in November 2022, and by October 2025 OpenAI said it had about 800 million weekly users. Serving at that scale turned LLM inference into one of the largest workloads in computing and made LLM system design a core engineering discipline.", "body": "### The interface\n\n```mermaid\nflowchart LR\n  SYS[System instructions] --> CTX[Context window]\n  HIST[Conversation history] --> CTX\n  DOCS[Retrieved documents] --> CTX\n  TOOLS[Tool definitions] --> CTX\n  USER[User message] --> CTX\n  CTX --> LLM[LLM]\n  LLM --> OUT[Generated tokens / tool calls]\n```\n\n### Properties that drive design\n\n| Property | Design impact |\n|---|---|\n| Context window | How much data per request |\n| Tokens per second | Response speed |\n| Time to first token | Perceived latency |\n| Price per input/output token | Unit economics |\n| Non-determinism | Testing and evaluation strategy |\n| Knowledge cutoff | Need for retrieval or tools |\n| Hallucination | Grounding and verification |\n\n### Tokens\n\nText is split into tokens (roughly 3–4 characters of English on average; more tokens for many other languages). All limits and prices are in tokens."}, {"id": 102, "title": "Choosing a model", "tldr": "Choose models by task quality on your own evaluations, latency, cost, context length, modality, license, data handling and deployment options. Often a portfolio of models works best: a strong model for hard tasks and smaller ones for routine work.", "real": "Many production applications route requests across model sizes. For example, providers offer families of models at different sizes and prices (such as Claude’s Haiku, Sonnet and Opus tiers, and OpenAI’s mini and full models), precisely so applications can match capability to task.", "body": "### Selection criteria\n\n| Criterion | Questions |\n|---|---|\n| Quality | Pass rate on your eval set? |\n| Latency | Time to first token, tokens/s at your load |\n| Cost | Price per task, not per token |\n| Context | Enough for your documents? |\n| Modalities | Text, images, audio, video |\n| Tool use | Reliable function calling? |\n| Deployment | API, cloud marketplace, self-hosted |\n| Data terms | Retention, training use, region |\n| License | Open-weight terms if self-hosting |\n\n### Portfolio approach\n\n```mermaid\nflowchart LR\n  REQ[Request] --> CLS[Classifier / router]\n  CLS -->|simple| S[Small fast model]\n  CLS -->|complex| L[Large model]\n  CLS -->|sensitive| P[Self-hosted model]\n```\n\n### Rule\n\nNever choose by public leaderboard alone. Build a task-specific evaluation set first (ch. 151)."}, {"id": 103, "title": "Prompting as an interface contract", "tldr": "In LLM systems, prompts are part of the code: they define roles, tasks, formats and constraints. Treat them as versioned, tested artifacts, structure them clearly, and separate stable instructions from dynamic inputs.", "real": "Model providers publish prompt engineering guides (Anthropic, OpenAI, Google) recommending clear instructions, examples, structured sections such as XML tags, and explicit output formats. Teams increasingly manage prompts in version control with evaluation suites.", "body": "### Prompt structure\n\n```text\n[System]   role, goals, rules, output format\n[Context]  retrieved documents, user profile, tool results (clearly delimited)\n[Examples] a few representative input → output pairs\n[Task]     the user's request\n```\n\n### Good practices\n\n| Practice | Why |\n|---|---|\n| Clear, specific instructions | Fewer misunderstandings |\n| Delimit untrusted inputs | Reduce prompt injection risk |\n| Specify output schema | Easier parsing |\n| Give reasons for rules | Better generalization |\n| Stable content first | Enables prompt caching

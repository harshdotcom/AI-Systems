<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backend &amp; API Engineering: 200 Chapters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2F5; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#171A21; --muted:#575D6B; --line:#D9DCE4;
  --accent:#0E6B57; --accent-soft:#DDF1EA; --accent-ink:#FFFFFF;
  --amber:#B97A0B; --tldr-bg:#FFF5DC; --tldr-line:#D49A22;
  --indigo:#4A3A8C; --real-bg:#ECE8F7; --real-line:#6A57B5;
  --code-bg:#181A16; --code-ink:#E6E9E1; --inline-code:#E9ECE4;
  --cell-empty:#DCE0D6; --shadow:0 1px 0 rgba(24,26,22,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
    --accent:#7DD3B8; --accent-soft:#12302A; --accent-ink:#04201A;
    --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
    --indigo:#BCAEF0; --real-bg:#1E1A33; --real-line:#8A79D0;
    --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
    --cell-empty:#2E332B; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
  --accent:#7DD3B8; --accent-soft:#12302A; --accent-ink:#04201A;
  --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
  --indigo:#BCAEF0; --real-bg:#1E1A33; --real-line:#8A79D0;
  --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
  --cell-empty:#2E332B; --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header with the memory-bank progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:20px;padding:12px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted)}
.bank{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bank-row{display:flex;gap:4px;flex-wrap:nowrap;min-width:0}
.bank-group{flex:1;min-width:0;display:flex;gap:2px;padding:3px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.cell{flex:1;min-width:2px;max-width:10px;height:18px;border-radius:2px;background:var(--cell-empty);border:0;padding:0;cursor:pointer;transition:background .2s}
.cell.done{background:var(--accent)}
.cell.here{box-shadow:0 0 0 2px var(--amber)}
.bank-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bank-meta strong{color:var(--ink);font-weight:600}
.top-actions{display:flex;gap:8px}
.btn{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.menu-btn{display:none}

/* Shell */
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,76px));height:calc(100dvh - var(--top-h,76px) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg)}
.search{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
.part{margin-bottom:4px}
.part-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:8px;cursor:pointer}
.part-head:hover{background:var(--surface-2)}
.part-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);width:22px;flex:none}
.part-name{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.part-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.part-count.full{color:var(--accent);font-weight:600}
.part-list{list-style:none;margin:0 0 6px;padding:0 0 0 30px;display:none}
.part.open .part-list{display:block}
.ch-row{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:6px}
.ch-row.active{background:var(--accent-soft)}
.ch-row a{flex:1;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.ch-row a .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.tick{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:11px;height:11px;opacity:0}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{opacity:1;color:var(--accent-ink)}
.hidden{display:none!important}

/* Main reading area */
.main{padding:24px 32px 80px;min-width:0}
.crumb{font-size:14px;color:var(--muted);margin:0 0 12px}
.crumb a{color:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;font-size:14px;color:var(--muted);max-width:240px;text-align:left}
.tab .tab-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--cell-empty)}
.tab .dot.on{background:var(--accent)}
article{max-width:780px}
.ch-no{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--accent);font-size:15px;margin:0}
h1.ch-title{font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:6px 0 22px;font-weight:700;text-wrap:balance}
.box{border-radius:10px;padding:16px 18px;margin:0 0 26px;border-left:4px solid}
.box h2{font-size:14px;margin:0 0 6px;font-weight:600}
.box p{margin:0}
.tldr{background:var(--tldr-bg);border-color:var(--tldr-line)}
.tldr h2{color:var(--amber)}
.tldr p{font-size:17px;line-height:1.55}
.real{background:var(--real-bg);border-color:var(--real-line);margin-top:34px}
.real h2{color:var(--indigo)}
.body h3{font-size:20px;margin:30px 0 10px;letter-spacing:-.01em}
.body p{margin:0 0 14px}
.body ul,.body ol{padding-left:22px;margin:0 0 16px}
.body li{margin:4px 0}
.body li input[type=checkbox]{margin-right:6px;accent-color:var(--accent)}
.body code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.88em;background:var(--inline-code);padding:1px 5px;border-radius:4px}
.body pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13.5px;line-height:1.55;margin:0 0 18px}
.body pre code{background:none;padding:0;font-size:inherit;color:inherit}
.table-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.body table{border-collapse:collapse;width:100%;font-size:14px}
.body th,.body td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.body th{background:var(--surface-2);font-weight:600}
.body tr:last-child td{border-bottom:0}
.body strong{font-weight:600}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.complete{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:15px}
.complete .tick{border-color:currentColor;pointer-events:none}
.complete.on{background:var(--accent);color:var(--accent-ink)}
.complete.on .tick{background:var(--accent-ink);border-color:var(--accent-ink)}
.complete.on .tick svg{opacity:1;color:var(--accent)}
.nav{display:flex;gap:8px}
.nav .btn[disabled]{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}

/* Diagrams and charts */
.diagram{margin:0 0 20px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
.diagram svg{display:block;margin:0 auto;height:auto}
.diagram.loading{color:var(--muted);font-size:14px}
.chart{margin:0 0 20px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chart figcaption{font-weight:600;font-size:14px;margin:0 0 10px}
.bar-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.bar-label{color:var(--ink);line-height:1.3}
.bar-track{height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar{display:block;height:100%;background:var(--accent);border-radius:7px 0 0 7px}
.bar-val{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.chart-note{font-size:12px;color:var(--muted);margin-top:6px}

/* Contents view */
.contents h1{font-size:32px;margin:0 0 6px;letter-spacing:-.02em}
.contents .lead{color:var(--muted);margin:0 0 24px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.pcard h2{font-size:15px;margin:0 0 2px;line-height:1.3}
.pcard .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pcard ol{list-style:none;padding:0;margin:0}
.pcard li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13.5px;line-height:1.35}
.pcard li a{color:var(--ink);text-decoration:none;flex:1}
.pcard li a:hover{text-decoration:underline}
.contents-actions{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}

/* Mobile */
.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);height:auto;z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .menu-btn{display:inline-block}
  .main{padding:18px 16px 60px}
  .top-inner{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand{flex:1}
  .bank{order:3;flex-basis:100%}
  .bank-row{gap:3px}
  .bank-group{gap:1px;padding:2px}
  .cell{height:12px;max-width:none;min-width:0}
  .bank-row{flex-wrap:wrap;row-gap:3px;gap:3px}
  .bank-group{flex:0 0 calc(10% - 2.7px);gap:1px;padding:1px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<header class="top" id="top">
  <div class="top-inner">
    <button class="btn menu-btn" id="menuBtn" aria-label="Open chapter list">Chapters</button>
    <div class="brand"><b>Backend &amp; API Engineering</b><span>Designing, securing and operating production backends and APIs</span></div>
    <div class="bank" aria-label="Course progress">
      <div class="bank-row" id="bank"></div>
      <div class="bank-meta"><span><strong id="doneCount">0</strong> of 200 chapters complete</span><span id="pct">0%</span></div>
    </div>
    <div class="top-actions"><a class="btn" href="#contents" style="text-decoration:none">Contents</a></div>
  </div>
</header>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <nav class="side" id="side" aria-label="Chapters">
    <input class="search" id="search" type="search" placeholder="Search chapters" aria-label="Search chapters">
    <div id="parts"></div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const CHAPTERS = [{"id": 1, "title": "What backend engineering is", "tldr": "Backend engineering builds the server-side systems behind applications: APIs, business logic, data storage, authentication, background processing and integrations. Good backends are correct, secure, fast, reliable, observable and easy to change.", "real": "Amazon’s well-known 2002 internal mandate, recounted by Steve Yegge in 2011, required teams to expose all data and functionality through service interfaces, an early statement of API-first backend design.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Server-side software providing data and behavior to clients |\n| Why it matters | Every app depends on its backend for correctness and security |\n| Core concerns | APIs, data, auth, performance, reliability, operations |\n| Trade-off | Delivery speed vs long-term maintainability |\n| Failure mode | Business rules scattered across controllers, jobs and SQL |\n| Production habit | Clear layers, tests, observability from day one |\n\n### Backend responsibilities\n\n```mermaid\nflowchart LR\n  CLIENT[Clients: web, mobile, partners] --> API[API layer]\n  API --> LOGIC[Business logic]\n  LOGIC --> DATA[(Databases)]\n  LOGIC --> JOBS[Background jobs]\n  LOGIC --> EXT[External services]\n  OBS[Logs, metrics, traces] -.-> API\n```"}, {"id": 2, "title": "The life of a request", "tldr": "A request travels through DNS, TLS, load balancers, gateways, the application (routing, auth, validation, business logic, data access) and back. Each hop adds latency and failure modes; understanding the path is essential for debugging and performance.", "real": "Cloudflare’s and Google’s public engineering material describe how DNS resolution, TLS handshakes and connection reuse often dominate latency for short API calls, which is why connection reuse and edge termination matter.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The end-to-end path of an API call |\n| Why it matters | Bottlenecks and errors can occur at any hop |\n| Key stages | DNS, TCP/TLS, load balancer, gateway, app, database |\n| Trade-off | More layers add features and latency |\n| Failure mode | Debugging only application code when the issue is upstream |\n| Production habit | Trace IDs from edge to database |\n\n### Request path\n\n```mermaid\nsequenceDiagram\n  participant C as Client\n  participant LB as Load balancer\n  participant A as App\n  participant DB as Database\n  C->>LB: HTTPS request\n  LB->>A: Forward\n  A->>A: Route, authenticate, validate\n  A->>DB: Query\n  DB-->>A: Rows\n  A-->>LB: JSON response\n  LB-->>C: Response\n```"}, {"id": 3, "title": "Backend architecture layers", "tldr": "Organize backends into layers: transport (HTTP handlers), application (use cases), domain (business rules) and infrastructure (databases, external APIs). Dependencies point inward so business logic stays testable and independent of frameworks.", "real": "Alistair Cockburn described the hexagonal (ports and adapters) architecture in 2005, and Robert C. Martin’s “Clean Architecture” (2012 blog post, 2017 book) popularized keeping business rules independent of frameworks and databases.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Separating code by responsibility |\n| Why it matters | Testability, maintainability, framework independence |\n| Layers | Handlers, services/use cases, domain, repositories/adapters |\n| Trade-off | More structure vs speed for tiny services |\n| Failure mode | SQL queries inside HTTP handlers |\n| Production habit | Handlers thin; business rules in services/domain |\n\n### Layers\n\n```mermaid\nflowchart TB\n  HANDLER[HTTP handlers: parse, validate, respond] --> SERVICE[Application services: use cases]\n  SERVICE --> DOMAIN[Domain: entities, rules]\n  SERVICE --> PORTS[Ports: repository interfaces]\n  ADAPTERS[Adapters: DB, HTTP clients, queues] --> PORTS\n```"}, {"id": 4, "title": "Choosing a language and runtime", "tldr": "Choose backend languages by team skills, ecosystem, performance needs, concurrency model, hiring, and operational fit. Most mainstream options (Go, Java/Kotlin, C#, Python, TypeScript, Rust, Ruby, PHP) can build excellent backends.", "real": "Large companies run successful backends on very different stacks: Shopify on Ruby on Rails, Instagram on Python and Django, Uber heavily on Go and Java, and Discord on Elixir and Rust for performance-critical services.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Selecting the primary backend stack |\n| Why it matters | Affects productivity, performance and hiring for years |\n| Trade-off | Developer speed vs runtime efficiency |\n| Failure mode | Choosing by hype; many languages in one small team |\n| Production habit | Standardize on one or two primary languages |\n\n### Comparison (general tendencies)\n\n| Language | Strengths |\n|---|---|\n| Go | Simple concurrency, fast startup, small binaries |\n| Java / Kotlin | Mature ecosystem, JVM performance, Spring |\n| C# | ASP.NET Core performance, strong tooling |\n| Python | Productivity, data/AI ecosystem |\n| TypeScript (Node.js) | Shared language with frontend, async I/O |\n| Rust | Performance and memory safety |\n| Ruby / PHP | Rapid product development (Rails, Laravel) |"}, {"id": 5, "title": "Concurrency models", "tldr": "Backends handle many requests concurrently using threads, event loops, coroutines or async/await, or lightweight processes. The model determines how blocking I/O, CPU work and memory behave under load.", "real": "Node.js (2009) popularized a single-threaded event loop for I/O-heavy servers, Go uses lightweight goroutines scheduled across OS threads, and Java 21 (2023) added virtual threads to make thread-per-request scale to many more concurrent requests.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How a server handles simultaneous work |\n| Why it matters | Throughput, latency and correctness under load |\n| Models | Thread-per-request, event loop, goroutines/virtual threads, actors |\n| Trade-off | Simplicity vs efficiency |\n| Failure mode | Blocking call inside an event loop freezing all requests |\n| Production habit | Keep CPU-heavy work off request threads/loops |\n\n### Models\n\n| Model | Examples | Watch out for |\n|---|---|---|\n| Thread pool | Classic Java, Rails/Puma | Pool exhaustion |\n| Event loop | Node.js, Python asyncio | Blocking calls |\n| Green threads | Go goroutines, Java virtual threads | Shared-state races |\n| Actors | Erlang/Elixir | Mailbox overload |"}, {"id": 6, "title": "Statelessness", "tldr": "Stateless application servers keep no client state in memory between requests; state lives in databases, caches or signed tokens. Any instance can handle any request, which simplifies scaling, deployment and failure recovery.", "real": "The Twelve-Factor App methodology (2011) recommended stateless processes with state in backing services, and container platforms such as Kubernetes assume instances can be replaced at any time.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Servers that don’t depend on in-memory client state |\n| Why it matters | Horizontal scaling and resilience |\n| State locations | Database, cache, object storage, tokens |\n| Trade-off | External state adds latency |\n| Failure mode | In-memory sessions lost on deploy |\n| Production habit | Any instance can be killed at any time safely |\n\n### Where state goes\n\n| State | Location |\n|---|---|\n| User sessions | Redis / database or signed cookies |\n| Uploaded files | Object storage |\n| Rate limit counters | Redis |\n| Job progress | Database / queue |"}, {"id": 7, "title": "Configuration and environments", "tldr": "Keep configuration separate from code, supplied by environment variables or config services, validated at startup. Use distinct environments (local, test, staging, production) with the same code and different configuration.", "real": "The Twelve-Factor App’s “store config in the environment” principle became standard practice, and libraries such as pydantic-settings, Viper (Go) and Spring Boot’s configuration properties validate configuration at startup.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Settings that vary by environment |\n| Why it matters | Same build, different deployments |\n| Practices | Env vars, typed config, startup validation, secrets separate |\n| Trade-off | Flexibility vs config sprawl |\n| Failure mode | Missing variable discovered at 3 a.m. on first request |\n| Production habit | Fail fast at startup on invalid config |\n\n### Typed config (Python)\n\n```python\nfrom pydantic_settings import BaseSettings\n\nclass Settings(BaseSettings):\n    database_url: str\n    redis_url: str = \"redis://localhost:6379/0\"\n    request_timeout_s: float = 5.0\n    debug: bool = False\n\nsettings = Settings()   # raises a validation error at startup if DATABASE_URL is missing\n```"}, {"id": 8, "title": "Errors and exceptions in backends", "tldr": "Distinguish expected errors (validation, not found, conflicts) from unexpected ones (bugs, outages). Map expected errors to clear API responses, log unexpected ones with context, and never leak internal details to clients.", "real": "Error tracking tools such as Sentry (open-sourced in 2008) became standard in backends because unhandled exceptions in production are otherwise easy to miss among millions of requests.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Handling and reporting failures |\n| Why it matters | Clear errors for clients; visibility for engineers |\n| Categories | Client errors (4xx), server errors (5xx), dependency errors |\n| Trade-off | Detail for debugging vs leaking internals |\n| Failure mode | Stack traces in API responses |\n| Production habit | Central error handler mapping exceptions to responses |\n\n### Mapping\n\n| Exception | HTTP status |\n|---|---|\n| ValidationError | 400 / 422 |\n| NotAuthenticated | 401 |\n| PermissionDenied | 403 |\n| NotFound | 404 |\n| Conflict (version, duplicate) | 409 |\n| RateLimited | 429 |\n| Unexpected exception | 500 (generic message) |\n| Dependency timeout | 503 / 504 |"}, {"id": 9, "title": "Backend engineer skills", "tldr": "Strong backend engineers combine API design, data modeling, SQL, concurrency, security, testing, performance, observability, distributed systems basics and operational ownership, plus clear communication with frontend, product and platform teams.", "real": "The DevOps movement and practices such as “you build it, you run it”, a phrase associated with Amazon CTO Werner Vogels in 2006, expanded backend engineers’ responsibilities to include operating their services in production.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The competency map of backend work |\n| Why it matters | Guides learning and hiring |\n| Trade-off | Breadth vs depth |\n| Failure mode | Strong coding, weak operations and security |\n| Production habit | Own services in production (on-call, dashboards) |\n\n### Skill map\n\n```mermaid\nflowchart TB\n  BE[Backend engineer] --> API[API design + HTTP]\n  BE --> DATA[Data modeling + SQL]\n  BE --> SEC[Security + auth]\n  BE --> PERF[Performance + caching]\n  BE --> REL[Reliability + async]\n  BE --> OPS[Testing + observability + deployment]\n```"}, {"id": 10, "title": "Backend quality attributes", "tldr": "Measure backends against quality attributes: correctness, security, performance, reliability, scalability, maintainability, observability and cost. Make trade-offs explicit and measurable with SLOs and tests.", "real": "ISO/IEC 25010 defines software product quality characteristics such as functional suitability, performance efficiency, reliability, security and maintainability, a vocabulary often used in architecture reviews.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Non-functional properties of a backend |\n| Why it matters | Users experience these as much as features |\n| Trade-off | Improving one may cost another |\n| Failure mode | Only functional requirements written down |\n| Production habit | Non-functional requirements in every design doc |\n\n### Attributes and measures\n\n| Attribute | Measure |\n|---|---|\n| Correctness | Tests, error rates |\n| Security | Vulnerabilities, auth coverage |\n| Performance | p95/p99 latency |\n| Reliability | Availability SLO |\n| Scalability | Throughput per instance, limits |\n| Maintainability | Change lead time, defect rate |\n| Observability | Time to diagnose |\n| Cost | Cost per request |"}, {"id": 11, "title": "HTTP semantics", "tldr": "HTTP is a stateless request–response protocol: a method, target URI, headers and optional body produce a status code, headers and optional body. Respecting HTTP semantics makes APIs predictable and lets proxies, caches and clients work correctly.", "real": "The IETF consolidated HTTP’s core definitions in RFC 9110 “HTTP Semantics” in June 2022, separating version-independent semantics from HTTP/1.1, HTTP/2 and HTTP/3 wire formats.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The meaning of methods, status codes and headers |\n| Why it matters | Interoperability with clients, caches and tools |\n| Trade-off | Strict semantics vs convenient shortcuts |\n| Failure mode | Returning 200 with an error body |\n| Production habit | Correct methods and status codes by default |\n\n### Anatomy\n\n```http\nPOST /v1/orders HTTP/1.1\nHost: api.example.com\nContent-Type: application/json\nAuthorization: Bearer eyJ...\nIdempotency-Key: 6f1c2b7e-3d1a-4c55-9a2e-8b1f0d9e4a11\n\n{\"items\": [{\"sku\": \"A-100\", \"qty\": 2}]}\n```\n\n```http\nHTTP/1.1 201 Created\nLocation: /v1/orders/981\nContent-Type: application/json\n\n{\"id\": \"981\", \"status\": \"pending\"}\n```"}, {"id": 12, "title": "Methods, safety and idempotency", "tldr": "Safe methods (GET, HEAD, OPTIONS) don’t change state; idempotent methods (GET, PUT, DELETE and safe methods) can be repeated with the same effect. POST is neither by default. These properties determine what clients, proxies and retries may do safely.", "real": "RFC 9110 defines method safety and idempotency, and APIs such as Stripe’s add idempotency keys so POST requests, which are not inherently idempotent, can still be retried safely.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Behavioral guarantees of HTTP methods |\n| Why it matters | Safe retries, caching, prefetching |\n| Trade-off | Correct method choice vs convenience |\n| Failure mode | GET endpoints that delete or change data |\n| Production habit | Idempotency keys for POST that create resources |\n\n### Method table\n\n| Method | Typical use | Safe | Idempotent |\n|---|---|---|---|\n| GET | Read resource | Yes | Yes |\n| POST | Create / action | No | No |\n| PUT | Replace resource | No | Yes |\n| PATCH | Partial update | No | Not guaranteed |\n| DELETE | Delete | No | Yes |\n| HEAD / OPTIONS | Metadata / capabilities | Yes | Yes |"}, {"id": 13, "title": "Status codes", "tldr": "Use status codes precisely: 2xx success, 3xx redirection, 4xx client errors, 5xx server errors. Precise codes let clients handle outcomes correctly and make monitoring meaningful.", "real": "Monitoring and alerting commonly treat 5xx responses as service errors counting against SLOs and 4xx as client errors, so misusing codes (for example 500 for validation errors) distorts reliability metrics.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Standard outcome signals |\n| Why it matters | Client behavior, retries, monitoring |\n| Trade-off | Precision vs simplicity |\n| Failure mode | Everything returns 200 or 500 |\n| Production habit | Document status codes per endpoint |\n\n### Essential codes\n\n| Code | Meaning | Use |\n|---|---|---|\n| 200 | OK | Successful read/update |\n| 201 | Created | Resource created (+ Location) |\n| 202 | Accepted | Async processing started |\n| 204 | No Content | Success without body |\n| 304 | Not Modified | Conditional GET cache hit |\n| 400 | Bad Request | Malformed request |\n| 401 | Unauthorized | Missing/invalid authentication |\n| 403 | Forbidden | Authenticated but not allowed |\n| 404 | Not Found | Resource missing (or hidden) |\n| 409 | Conflict | State conflict, duplicates |\n| 412 | Precondition Failed | If-Match version mismatch |\n| 422 | Unprocessable Content | Valid syntax, semantic errors |\n| 429 | Too Many Requests | Rate limited (+ Retry-After) |\n| 500 | Internal Server Error | Unexpected failure |\n| 503 | Service Unavailable | Overloaded / maintenance |"}, {"id": 14, "title": "Headers that matter", "tldr": "Headers carry metadata: content types, authentication, caching, conditional requests, tracing, rate-limit information and security policies. Use standard headers before inventing custom ones.", "real": "The W3C Trace Context recommendation (2020) standardized the traceparent header for distributed tracing, and the IETF’s RateLimit header fields draft aims to standardize how APIs communicate remaining quota.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Metadata on requests and responses |\n| Why it matters | Behavior of clients, caches, proxies, security |\n| Trade-off | Standard headers vs custom needs |\n| Failure mode | Custom X- headers duplicating standard ones |\n| Production habit | Document required headers per API |\n\n### Common headers\n\n| Header | Purpose |\n|---|---|\n| Content-Type / Accept | Body format negotiation |\n| Authorization | Credentials |\n| Cache-Control / ETag | Caching and validation |\n| If-None-Match / If-Match | Conditional requests |\n| Location | URL of created resource |\n| Retry-After | When to retry (429/503) |\n| traceparent | Distributed tracing |\n| Idempotency-Key | Safe retries (de facto standard) |"}, {"id": 15, "title": "Content negotiation and formats", "tldr": "Clients and servers agree on representation formats through Content-Type and Accept headers. JSON is the default for APIs; use consistent field naming, dates in ISO 8601 (RFC 3339), and explicit units and currencies.", "real": "RFC 3339 (2002) defines the internet date-time format used by most JSON APIs, and payment APIs such as Stripe’s represent money as integers in the smallest currency unit with explicit currency codes to avoid floating-point errors.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Agreeing on data formats |\n| Why it matters | Interoperability, correctness |\n| Conventions | JSON, RFC 3339 timestamps, integer minor units for money |\n| Trade-off | Human-readable JSON vs compact binary formats |\n| Failure mode | Ambiguous dates (“03/04/2026”) and float money |\n| Production habit | API style guide for formats |\n\n### Format conventions\n\n```json\n{\n  \"id\": \"ord_981\",\n  \"created_at\": \"2026-11-17T10:15:30Z\",\n  \"amount\": {\"value\": 249900, \"currency\": \"INR\"},\n  \"status\": \"paid\"\n}\n```"}, {"id": 16, "title": "HTTP caching", "tldr": "HTTP caching reduces latency and load using Cache-Control directives, freshness lifetimes and validators (ETag, Last-Modified) for conditional requests. Mark private and sensitive responses so shared caches never store them.", "real": "RFC 9111 (2022) defines HTTP caching, and CDNs such as Cloudflare, Fastly and Akamai rely on Cache-Control and validator headers to cache API responses and assets at the edge.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Reusing stored responses |\n| Why it matters | Speed and server load reduction |\n| Mechanisms | Cache-Control, ETag, If-None-Match, Vary |\n| Trade-off | Freshness vs efficiency |\n| Failure mode | Caching user-specific responses in a shared CDN cache |\n| Production habit | `Cache-Control: private, no-store` for sensitive data |\n\n### Conditional GET\n\n```http\nGET /v1/products/42\nIf-None-Match: \"v17\"\n\nHTTP/1.1 304 Not Modified\nETag: \"v17\"\nCache-Control: max-age=60\n```\n\n### Directives\n\n| Directive | Meaning |\n|---|---|\n| max-age=60 | Fresh for 60 s |\n| no-cache | Revalidate before use |\n| no-store | Never store |\n| private | Only browser caches |\n| public | Shared caches allowed |"}, {"id": 17, "title": "Cookies and sessions", "tldr": "Cookies carry session identifiers or tokens between browsers and servers. Secure them with HttpOnly, Secure, SameSite and appropriate expiry, and protect state-changing requests against CSRF.", "real": "Major browsers changed the default SameSite behavior for cookies to Lax starting with Chrome in 2020, reducing cross-site request forgery risks for sites that didn’t set the attribute.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Browser-managed state for HTTP |\n| Why it matters | Web authentication and sessions |\n| Attributes | HttpOnly, Secure, SameSite, Domain, Path, Max-Age |\n| Trade-off | Convenience vs CSRF and privacy risks |\n| Failure mode | Session cookies readable by JavaScript (XSS theft) |\n| Production habit | HttpOnly + Secure + SameSite=Lax or Strict |\n\n### Secure session cookie\n\n```http\nSet-Cookie: session=7f3a...; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=86400\n```"}, {"id": 18, "title": "HTTP/1.1, HTTP/2 and HTTP/3", "tldr": "HTTP/1.1 uses one request at a time per connection; HTTP/2 multiplexes many streams over one TCP connection with header compression; HTTP/3 runs over QUIC (UDP), avoiding TCP head-of-line blocking and speeding connection setup.", "real": "HTTP/2 was standardized in 2015 (updated as RFC 9113 in 2022), QUIC in RFC 9000 (2021) and HTTP/3 in RFC 9114 (2022); major browsers and CDNs support all three.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Generations of HTTP transport |\n| Why it matters | Latency and connection efficiency |\n| Trade-off | Newer protocols need infrastructure support |\n| Failure mode | Opening a new connection per request |\n| Production habit | Terminate HTTP/2/3 at edge; reuse connections internally |\n\n### Comparison\n\n| | HTTP/1.1 | HTTP/2 | HTTP/3 |\n|---|---|---|---|\n| Transport | TCP | TCP | QUIC (UDP) |\n| Multiplexing | No | Yes | Yes |\n| Head-of-line blocking | Yes | At TCP level | Avoided per stream |\n| Header compression | No | HPACK | QPACK |"}, {"id": 19, "title": "TLS", "tldr": "TLS encrypts and authenticates HTTP traffic. Use TLS 1.2+ (prefer 1.3), automated certificate management, HSTS, and verify certificates in clients. Encrypt internal service traffic too.", "real": "TLS 1.3 was published as RFC 8446 in 2018, removing legacy algorithms and reducing handshake round trips, and Let’s Encrypt, launched in 2015–2016, made free automated certificates widely available.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Transport encryption and server authentication |\n| Why it matters | Confidentiality and integrity of API traffic |\n| Practices | TLS 1.3, automated renewal, HSTS, cert monitoring |\n| Trade-off | Minor CPU cost vs essential security |\n| Failure mode | Expired certificates causing outages |\n| Production habit | Automate renewal; alert 30 days before expiry |\n\n### HSTS header\n\n```http\nStrict-Transport-Security: max-age=31536000; includeSubDomains\n```"}, {"id": 20, "title": "CORS", "tldr": "Cross-Origin Resource Sharing lets browsers call APIs on other origins when servers explicitly allow it. Configure allowed origins, methods and headers precisely; CORS is a browser policy, not server-side security.", "real": "Misconfigured CORS, such as reflecting any Origin header while allowing credentials, has repeatedly appeared in bug bounty reports, because it lets malicious sites read authenticated API responses.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Browser mechanism for cross-origin requests |\n| Why it matters | Frontends on different domains need API access |\n| Key headers | Access-Control-Allow-Origin, -Methods, -Headers, -Credentials |\n| Trade-off | Convenience vs exposure |\n| Failure mode | Reflecting arbitrary origins with credentials allowed |\n| Production habit | Explicit origin allow-list |\n\n### Preflight\n\n```mermaid\nsequenceDiagram\n  participant B as Browser (app.example.com)\n  participant API as api.example.com\n  B->>API: OPTIONS /v1/orders (Origin, Access-Control-Request-Method: POST)\n  API-->>B: 204 Access-Control-Allow-Origin: https://app.example.com\n  B->>API: POST /v1/orders\n  API-->>B: 201 Created\n```"}, {"id": 21, "title": "REST principles", "tldr": "REST models systems as resources identified by URIs and manipulated through a uniform interface of standard methods with stateless requests and cacheable responses. Most “REST APIs” are pragmatic HTTP JSON APIs following these principles loosely.", "real": "Roy Fielding defined REST in his 2000 doctoral dissertation as the architectural style of the web, and the Richardson Maturity Model (popularized by Martin Fowler in 2010) describes levels of REST adoption.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Resource-oriented API style over HTTP |\n| Why it matters | Predictable, cacheable, widely understood APIs |\n| Constraints | Client–server, stateless, cacheable, uniform interface, layered |\n| Trade-off | Simplicity vs chatty interactions for complex screens |\n| Failure mode | RPC-style URLs (/getOrder, /createOrder) under a REST label |\n| Production habit | Nouns for resources, HTTP methods for actions |\n\n### Richardson Maturity Model\n\n| Level | Description |\n|---|---|\n| 0 | One endpoint, RPC over HTTP |\n| 1 | Resources |\n| 2 | HTTP methods and status codes |\n| 3 | Hypermedia controls (HATEOAS) |"}, {"id": 22, "title": "Resource modeling", "tldr": "Identify resources from the domain (orders, customers, invoices), their relationships and lifecycles. Expose stable, client-meaningful resources rather than database tables, and model actions that don’t fit CRUD as sub-resources or state transitions.", "real": "Google’s API Improvement Proposals (AIPs) advise resource-oriented design, with custom methods (such as `:cancel`) for actions that don’t map cleanly to standard methods.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Deciding what the API’s nouns are |\n| Why it matters | Resources are the API’s long-term contract |\n| Trade-off | Mirroring the database vs designing for clients |\n| Failure mode | Exposing internal join tables as resources |\n| Production habit | Model from client use cases and domain language |\n\n### Example model\n\n| Resource | URI | Notes |\n|---|---|---|\n| Customer | /v1/customers/{id} | Top-level |\n| Order | /v1/orders/{id} | Belongs to customer |\n| Order items | /v1/orders/{id}/items | Sub-collection |\n| Cancel order | POST /v1/orders/{id}:cancel or /v1/orders/{id}/cancellation | Action as custom method or sub-resource |"}, {"id": 23, "title": "URL design", "tldr": "Use plural nouns, lowercase, hyphens or consistent casing, hierarchical paths only for true containment, query parameters for filtering, and stable opaque IDs. Avoid verbs in paths except for well-defined custom actions.", "real": "Widely referenced API style guides from Microsoft, Google and Zalando converge on plural resource names, consistent casing and query parameters for filtering and pagination.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Conventions for API paths |\n| Why it matters | Consistency and discoverability |\n| Trade-off | Deep nesting vs flat resources with filters |\n| Failure mode | /api/getAllOrdersForCustomerById?id=4 |\n| Production habit | Max two levels of nesting |\n\n### Good vs bad\n\n| Avoid | Prefer |\n|---|---|\n| GET /getOrders | GET /v1/orders |\n| POST /orders/delete/981 | DELETE /v1/orders/981 |\n| GET /customers/4/orders/981/items/7/notes | GET /v1/order-items/7/notes |\n| GET /orders?customerId=4 (mixed casing) | GET /v1/orders?customer_id=4 (consistent) |"}, {"id": 24, "title": "Request and response bodies", "tldr": "Design consistent JSON bodies: stable field names, explicit types, nullable vs absent semantics, IDs as strings, timestamps in RFC 3339, enums as strings and envelopes only when needed. Return the created or updated resource.", "real": "GitHub’s and Stripe’s APIs return full resource representations after creates and updates, letting clients avoid an extra round trip to fetch the new state.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The shape of API payloads |\n| Why it matters | Client simplicity and evolution |\n| Conventions | snake_case or camelCase (consistently), string IDs, enum strings |\n| Trade-off | Rich responses vs payload size |\n| Failure mode | Numeric IDs exceeding JavaScript’s safe integer range |\n| Production habit | Validate requests against schemas |\n\n### Response example\n\n```json\n{\n  \"id\": \"ord_981\",\n  \"customer_id\": \"cus_42\",\n  \"status\": \"pending\",\n  \"items\": [{\"sku\": \"A-100\", \"quantity\": 2, \"unit_price\": {\"value\": 49900, \"currency\": \"INR\"}}],\n  \"created_at\": \"2026-11-17T10:15:30Z\",\n  \"updated_at\": \"2026-11-17T10:15:30Z\"\n}\n```"}, {"id": 25, "title": "Error responses", "tldr": "Return machine-readable, consistent errors with a stable type or code, a human-readable title and detail, the HTTP status, and field-level validation details. Standardize with RFC 9457 Problem Details.", "real": "RFC 9457 “Problem Details for HTTP APIs” (2023) replaced RFC 7807 and defines the application/problem+json format, used by frameworks such as Spring and ASP.NET Core.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Standard structure for API errors |\n| Why it matters | Clients can handle errors programmatically |\n| Fields | type, title, status, detail, instance, plus extensions |\n| Trade-off | Detail vs information leakage |\n| Failure mode | Error messages that change wording and break clients |\n| Production habit | Clients rely on codes, not message text |\n\n### Problem Details\n\n```http\nHTTP/1.1 422 Unprocessable Content\nContent-Type: application/problem+json\n\n{\n  \"type\": \"https://api.example.com/errors/validation\",\n  \"title\": \"Validation failed\",\n  \"status\": 422,\n  \"detail\": \"2 fields are invalid.\",\n  \"errors\": [\n    {\"field\": \"items[0].quantity\", \"code\": \"min_value\", \"message\": \"Must be at least 1\"},\n    {\"field\": \"email\", \"code\": \"invalid_format\", \"message\": \"Not a valid email\"}\n  ],\n  \"trace_id\": \"4bf92f3577b34da6\"\n}\n```"}, {"id": 26, "title": "Pagination", "tldr": "Paginate every list endpoint. Offset pagination is simple but slow and inconsistent for large or changing data; cursor (keyset) pagination is stable and efficient. Return a next cursor and cap page sizes.", "real": "Stripe, Slack and many large APIs use cursor-based pagination (for example `starting_after` in Stripe and `cursor` in Slack) because offset pagination degrades on large datasets and skips or duplicates items when data changes.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Returning large collections in pages |\n| Why it matters | Performance and predictable responses |\n| Styles | Offset/limit, page number, cursor/keyset |\n| Trade-off | Random page access (offset) vs stability and speed (cursor) |\n| Failure mode | Unbounded list endpoints returning 100,000 rows |\n| Production habit | Default and maximum page sizes |\n\n### Cursor pagination\n\n```http\nGET /v1/orders?limit=50&cursor=eyJjcmVhdGVkX2F0IjoiMjAyNi0xMS0xN1QxMDoxNTozMFoiLCJpZCI6Im9yZF85ODEifQ\n```\n\n```json\n{\"data\": [ ... ], \"next_cursor\": \"eyJjcmVhdGVk...\", \"has_more\": true}\n```\n\n```sql\n-- Keyset query behind the cursor\nSELECT * FROM orders\nWHERE (created_at, id) < ($1, $2)\nORDER BY created_at DESC, id DESC\nLIMIT 50;\n```"}, {"id": 27, "title": "Filtering, sorting and field selection", "tldr": "Support filtering with explicit, documented query parameters, sorting with an allow-listed sort parameter, and optional field selection or expansion. Index database columns that back common filters and reject unsupported parameters clearly.", "real": "Stripe’s `expand[]` parameter lets clients include related objects in one response, and Google’s AIP-160 defines a filtering syntax for list methods, both reducing round trips while keeping APIs predictable.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Query controls on collection endpoints |\n| Why it matters | Clients fetch exactly what they need |\n| Trade-off | Flexibility vs query complexity and performance risk |\n| Failure mode | Arbitrary sort fields causing full table scans |\n| Production habit | Allow-lists for filter and sort fields |\n\n### Examples\n\n```http\nGET /v1/orders?status=paid&created_after=2026-11-01T00:00:00Z&sort=-created_at&limit=20\nGET /v1/orders/ord_981?expand=customer,items.product\n```"}, {"id": 28, "title": "Partial updates", "tldr": "Use PUT to replace a whole resource and PATCH for partial updates. JSON Merge Patch is simple (send changed fields; null deletes); JSON Patch is precise (operations list). Define semantics for absent vs null fields clearly.", "real": "JSON Patch (RFC 6902, 2013) and JSON Merge Patch (RFC 7396, 2014) standardize partial update formats, and Kubernetes supports both plus its own strategic merge patch.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Updating some fields of a resource |\n| Why it matters | Avoids overwriting concurrent changes to other fields |\n| Formats | Merge Patch, JSON Patch, custom field masks |\n| Trade-off | Simplicity vs precision (arrays, explicit nulls) |\n| Failure mode | Clients sending full objects that overwrite others’ changes |\n| Production habit | Combine PATCH with ETag/If-Match concurrency control |\n\n### Merge Patch\n\n```http\nPATCH /v1/customers/cus_42\nContent-Type: application/merge-patch+json\nIf-Match: \"v7\"\n\n{\"phone\": \"+1-202-555-0143\", \"nickname\": null}\n```\n\n(Sets phone, removes nickname, leaves other fields unchanged; 412 if version changed.)"}, {"id": 29, "title": "Optimistic concurrency control", "tldr": "Prevent lost updates by versioning resources: clients send the version they read (ETag with If-Match, or a version field), and the server rejects updates if the resource changed. No locks are held between requests.", "real": "RFC 9110’s conditional requests (If-Match, 412 Precondition Failed) provide standard optimistic concurrency, and APIs such as Azure Resource Manager and Kubernetes (resourceVersion) use versions to prevent conflicting updates.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Version checks to detect conflicting writes |\n| Why it matters | Prevents silent overwrites |\n| Mechanisms | ETag + If-Match, version columns |\n| Trade-off | Clients must handle conflicts |\n| Failure mode | Last write wins silently in collaborative edits |\n| Production habit | Version column updated atomically |\n\n### SQL\n\n```sql\nUPDATE orders\nSET status = 'cancelled', version = version + 1\nWHERE id = $1 AND version = $2;\n-- 0 rows updated → return 412 Precondition Failed (or 409)\n```"}, {"id": 30, "title": "Long-running operations", "tldr": "For work that takes longer than a request should wait, return 202 Accepted with an operation resource clients can poll, or notify them via webhooks. Operations should expose status, progress, result and errors.", "real": "Google’s AIP-151 defines long-running operations returning an Operation resource, and Microsoft’s REST API guidelines describe the 202 plus status-monitor pattern used across Azure.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Async API pattern for slow work |\n| Why it matters | Avoids timeouts and tied-up connections |\n| Pattern | 202 + Location of operation; poll or webhook |\n| Trade-off | Client complexity vs reliability |\n| Failure mode | 60-second synchronous requests timing out at proxies |\n| Production habit | Operations are idempotent and retain results for a period |\n\n### Flow\n\n```http\nPOST /v1/reports\n→ 202 Accepted\n  Location: /v1/operations/op_77\n\nGET /v1/operations/op_77\n→ 200 {\"id\": \"op_77\", \"status\": \"running\", \"progress\": 0.4}\n\nGET /v1/operations/op_77\n→ 200 {\"id\": \"op_77\", \"status\": \"succeeded\", \"result\": {\"report_url\": \"/v1/reports/rep_12\"}}\n```"}, {"id": 31, "title": "API-first design and OpenAPI", "tldr": "Design APIs as contracts before implementation, written in OpenAPI, reviewed with consumers, and used to generate documentation, mocks, SDKs, validation and tests. The specification becomes the single source of truth.", "real": "Swagger, created by Tony Tam in 2011, was donated to the Linux Foundation’s OpenAPI Initiative in 2015 and renamed the OpenAPI Specification; version 3.1 (2021) aligned fully with JSON Schema.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Contract-first API development with a machine-readable spec |\n| Why it matters | Parallel work, consistency, tooling |\n| Uses | Docs, mocks, SDK generation, request validation, contract tests |\n| Trade-off | Upfront design time vs rework later |\n| Failure mode | Spec and implementation drifting apart |\n| Production habit | Validate implementation against the spec in CI |\n\n### OpenAPI fragment\n\n```yaml\nopenapi: 3.1.0\ninfo: {title: Orders API, version: 1.4.0}\npaths:\n  /v1/orders/{order_id}:\n    get:\n      operationId: getOrder\n      parameters:\n        - {name: order_id, in: path, required: true, schema: {type: string}}\n      responses:\n        \"200\":\n          description: The order\n          content:\n            application/json:\n              schema: {$ref: \"#/components/schemas/Order\"}\n        \"404\": {description: Order not found}\n```"}, {"id": 32, "title": "API versioning", "tldr": "Version APIs to make breaking changes without breaking clients: URL versions (/v1), header or media-type versions, or date-based versions per account. Most changes should be additive and need no new version.", "real": "Stripe uses date-based API versions pinned per account (for example a version string like 2024-06-20) and transforms responses internally, while GitHub’s REST API introduced date-based versions via the X-GitHub-Api-Version header in 2022.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Managing incompatible API changes |\n| Why it matters | Clients upgrade at their own pace |\n| Styles | URL path, header, media type, date-based |\n| Trade-off | Supporting old versions costs maintenance |\n| Failure mode | New version for every small change |\n| Production habit | Additive changes by default; versions for breaking ones only |\n\n### Comparison\n\n| Style | Example | Notes |\n|---|---|---|\n| URL path | /v2/orders | Visible, simple, coarse |\n| Header | API-Version: 2026-06-01 | Clean URLs |\n| Date-based per account | Stripe-Version | Fine-grained evolution |\n| Media type | Accept: application/vnd.example.v2+json | Precise, less common |"}, {"id": 33, "title": "Backward compatibility", "tldr": "Non-breaking changes include adding optional fields, endpoints and enum values (if clients tolerate unknowns). Breaking changes include removing or renaming fields, changing types or meanings, tightening validation and changing defaults.", "real": "Google’s AIP-180 on backwards compatibility lists source, wire and semantic compatibility rules, emphasizing that changing behavior without changing the schema can still break clients.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Evolving APIs without breaking consumers |\n| Why it matters | Trust and adoption |\n| Trade-off | Freedom to change vs stability |\n| Failure mode | “Small” default change breaking integrations |\n| Production habit | Breaking-change detection in CI (spec diff) |\n\n### Change rules\n\n| Change | Breaking? |\n|---|---|\n| Add optional response field | No |\n| Add endpoint | No |\n| Add enum value | Potentially (strict clients) |\n| Make optional request field required | Yes |\n| Remove/rename field | Yes |\n| Change default sort or page size | Yes (semantic) |"}, {"id": 34, "title": "Idempotency keys", "tldr": "For non-idempotent operations (create payment, place order), let clients send an Idempotency-Key header. The server stores the key with the request fingerprint and response, returning the same response for retries and rejecting reuse with different parameters.", "real": "Stripe popularized idempotency keys for its API, storing them for 24 hours, and the IETF HTTPAPI working group has drafted a standard Idempotency-Key header field.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Client-supplied key for safe retries |\n| Why it matters | Prevents duplicate orders and payments |\n| Storage | Key, client, request hash, status, response, expiry |\n| Trade-off | Storage and complexity |\n| Failure mode | Concurrent duplicates processed twice (race) |\n| Production habit | Insert key row first with a unique constraint |\n\n### Handler logic\n\n```python\n# db, orders, sha256 and canonical_json are application helpers (illustrative)\ndef create_order(client_id, idem_key, body, db):\n    fingerprint = sha256(canonical_json(body))\n    with db.transaction():\n        row = db.fetch_for_update(\"SELECT * FROM idem WHERE client_id=%s AND key=%s\",\n                                  (client_id, idem_key))\n        if row:\n            if row.fingerprint != fingerprint:\n                return 422, {\"title\": \"Idempotency key reused with different request\"}\n            return row.status, row.response\n        order = orders.create(body)\n        response = order.to_json()\n        db.execute(\"INSERT INTO idem (client_id, key, fingerprint, status, response) \"\n                   \"VALUES (%s, %s, %s, %s, %s)\", (client_id, idem_key, fingerprint, 201, response))\n        return 201, response\n```\n\n(With a unique constraint on (client_id, key), a concurrent duplicate fails the insert and can return 409 or wait and replay.)"}, {"id": 35, "title": "Webhooks", "tldr": "Webhooks push events to client-provided URLs. Deliver reliably with retries and backoff, sign payloads (HMAC with timestamp), include event IDs for deduplication, and let consumers verify, acknowledge quickly and process asynchronously.", "real": "Stripe signs webhook payloads with HMAC-SHA256 and a timestamp in the Stripe-Signature header and retries failed deliveries for up to three days, and the Standard Webhooks specification (2024) proposed common conventions across providers.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Server-to-server event notifications |\n| Why it matters | Real-time integration without polling |\n| Producer duties | Signing, retries, event IDs, ordering notes, replay |\n| Consumer duties | Verify signature, dedupe, respond 2xx fast, process async |\n| Trade-off | Push efficiency vs delivery complexity |\n| Failure mode | Unsigned webhooks accepted from anyone |\n| Production habit | Event log + redelivery API |\n\n### Signature verification\n\n```python\nimport hmac, hashlib, time\n\ndef verify(secret: bytes, body: bytes, timestamp: str, signature: str, tolerance=300) -> bool:\n    if abs(time.time() - int(timestamp)) > tolerance:\n        return False                                  # replay protection\n    expected = hmac.new(secret, f\"{timestamp}.\".encode() + body, hashlib.sha256).hexdigest()\n    return hmac.compare_digest(expected, signature)\n```"}, {"id": 36, "title": "Hypermedia and HATEOAS", "tldr": "Hypermedia APIs include links to related resources and available actions, letting clients navigate without hard-coding URLs. Full HATEOAS is rare in practice, but links for pagination and related resources are widely useful.", "real": "GitHub’s REST API returns pagination links in the HTTP Link header (RFC 8288), and formats such as HAL and JSON:API define conventions for links in JSON responses.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Links and actions embedded in responses |\n| Why it matters | Discoverability, decoupled URLs |\n| Trade-off | Payload size and client tooling vs flexibility |\n| Failure mode | Clients ignoring links and hard-coding URLs anyway |\n| Production habit | At least provide pagination and self links |\n\n### Link header\n\n```http\nLink: <https://api.example.com/v1/orders?cursor=abc>; rel=\"next\",\n      <https://api.example.com/v1/orders>; rel=\"first\"\n```"}, {"id": 37, "title": "API style guides", "tldr": "An API style guide defines naming, casing, pagination, errors, versioning, dates, money, filtering, security and documentation rules for all APIs in an organization. Automated linting enforces it.", "real": "Public guides such as Google’s AIPs, Microsoft’s REST API Guidelines and Zalando’s RESTful API Guidelines are widely used as templates for internal style guides.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Organization-wide API conventions |\n| Why it matters | Consistent experience across teams |\n| Contents | Naming, errors, pagination, versioning, auth, formats |\n| Trade-off | Uniformity vs team flexibility |\n| Failure mode | Guide exists but nobody follows it |\n| Production habit | Lint OpenAPI specs in CI |\n\n### Style guide sections\n\n| Section | Example rule |\n|---|---|\n| Naming | Plural nouns, snake_case fields |\n| Errors | RFC 9457 Problem Details |\n| Pagination | Cursor-based, limit ≤ 100 |\n| Dates | RFC 3339 UTC |\n| Money | Integer minor units + currency |\n| Versioning | /v{n} major versions only |"}, {"id": 38, "title": "API linting and governance tooling", "tldr": "Automate API standards with linters that check OpenAPI specs (naming, error formats, required descriptions, security schemes) and breaking-change detectors that compare spec versions in pull requests.", "real": "Stoplight’s open-source Spectral linter and tools such as oasdiff are widely used to enforce API rules and detect breaking changes in OpenAPI specifications during CI.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Automated API quality checks |\n| Why it matters | Scales consistency across many teams |\n| Checks | Style rules, security definitions, breaking changes |\n| Trade-off | Rule maintenance vs manual reviews |\n| Failure mode | Too many noisy rules disabled by teams |\n| Production habit | Start with a small rule set; block only critical violations |\n\n### Spectral rule example\n\n```yaml\nrules:\n  paths-plural-nouns:\n    description: Collection paths should use plural nouns\n    given: $.paths[*]~\n    severity: warn\n    then:\n      function: pattern\n      functionOptions:\n        match: \"^(/v[0-9]+)?(/[a-z0-9-]+s(/\\\\{[a-z_]+\\\\})?)*(/[a-z0-9-:]+)?$\"\n```\n\n(Simplified illustration; tune patterns to your conventions.)"}, {"id": 39, "title": "Developer experience and documentation", "tldr": "Great APIs have great documentation: quickstarts, authentication guides, reference generated from the spec, runnable examples, SDKs, error explanations, changelogs and sandbox environments. Measure time to first successful call.", "real": "Stripe and Twilio are frequently cited for developer experience, with interactive documentation, code samples in many languages and test modes that let developers integrate without real money or messages.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Everything that makes an API easy to adopt |\n| Why it matters | Adoption, support costs, integration quality |\n| Elements | Quickstart, reference, examples, SDKs, sandbox, changelog |\n| Trade-off | Documentation investment vs support burden |\n| Failure mode | Reference docs only, no working examples |\n| Production habit | Track time-to-first-call and docs feedback |\n\n### Documentation map\n\n| Doc type | Purpose |\n|---|---|\n| Quickstart | First call in minutes |\n| Guides | Common tasks end to end |\n| Reference | Every endpoint and field |\n| Errors | Causes and fixes |\n| Changelog | What changed and when |"}, {"id": 40, "title": "Designing APIs for clients", "tldr": "Design from clients’ perspectives: what screens and workflows need, how many calls they require, mobile network constraints and error handling. Avoid exposing internal complexity; consider client-specific aggregation when needs differ widely.", "real": "Netflix’s API team described in 2012 moving from a one-size-fits-all REST API to device-optimized endpoints, because different devices needed different data shapes and call patterns.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Consumer-driven API design |\n| Why it matters | Fewer round trips, simpler clients |\n| Techniques | Use-case reviews, expansion parameters, BFFs, GraphQL |\n| Trade-off | Generic reusable APIs vs tailored ones |\n| Failure mode | Mobile screen needing 12 sequential API calls |\n| Production habit | Review API designs with client developers |\n\n### Call count check\n\n| Screen | Calls today | Target |\n|---|---|---|\n| Order details | 5 sequential | 1 (with expand) |\n| Home feed | 8 | 1–2 (BFF) |"}, {"id": 41, "title": "GraphQL fundamentals", "tldr": "GraphQL exposes a typed schema; clients send queries specifying exactly the fields they need across related objects in one request. It suits complex, client-driven data needs but shifts complexity to the server: performance, caching and security.", "real": "Facebook developed GraphQL in 2012 for its mobile apps and open-sourced it in 2015; the GraphQL Foundation was formed under the Linux Foundation in 2018, and GitHub and Shopify offer public GraphQL APIs.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Typed query language and runtime for APIs |\n| Why it matters | Clients fetch exactly what they need in one call |\n| When to use | Many clients with varied data needs, complex graphs |\n| When not to use | Simple CRUD, heavy HTTP caching needs, file transfers |\n| Trade-off | Client flexibility vs server complexity |\n| Failure mode | Unbounded queries overloading databases |\n| Production habit | Query cost limits and persisted queries |\n\n### Schema and query\n\n```graphql\ntype Order { id: ID!  status: String!  customer: Customer!  items: [Item!]! }\ntype Customer { id: ID!  name: String! }\ntype Query { order(id: ID!): Order }\n\nquery {\n  order(id: \"ord_981\") { status customer { name } items { sku quantity } }\n}\n```"}, {"id": 42, "title": "GraphQL performance and the N+1 problem", "tldr": "Naive GraphQL resolvers fetch related data per object, causing N+1 database queries. Batch and cache loads per request with DataLoader-style batching, use query planning, and monitor resolver timings.", "real": "Facebook open-sourced DataLoader in 2015 alongside GraphQL to batch and deduplicate data fetches within a request, and DataLoader ports exist for most server languages.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Efficient data fetching in GraphQL servers |\n| Why it matters | Prevents query explosions |\n| Techniques | DataLoader batching, per-request caching, joins, query cost analysis |\n| Trade-off | Batching complexity vs performance |\n| Failure mode | 1 query for orders + 100 queries for customers |\n| Production habit | Trace resolver counts per query |\n\n### Batching\n\n```mermaid\nflowchart LR\n  R1[Resolver: order 1 customer] --> DL[DataLoader]\n  R2[Resolver: order 2 customer] --> DL\n  R3[Resolver: order N customer] --> DL\n  DL --> SQL[One query: WHERE id IN ...]\n```"}, {"id": 43, "title": "GraphQL security", "tldr": "GraphQL’s flexibility enables abusive queries: deep nesting, huge result sets, introspection of private schemas and batching attacks. Enforce depth and complexity limits, pagination, persisted queries, field-level authorization and rate limits by cost.", "real": "GitHub’s GraphQL API rate-limits clients by a calculated query cost in points rather than request count, and Shopify’s GraphQL Admin API uses a similar calculated cost model.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Protecting GraphQL servers from abuse |\n| Why it matters | One query can be very expensive |\n| Controls | Depth/complexity limits, persisted queries, cost-based rate limits, authz per field |\n| Trade-off | Restrictions vs client flexibility |\n| Failure mode | Deeply nested query exhausting the database |\n| Production habit | Allow-list persisted queries for first-party clients |\n\n### Controls\n\n| Risk | Control |\n|---|---|\n| Deep nesting | Max depth (e.g. 10) |\n| Large lists | Required pagination arguments |\n| Expensive queries | Cost analysis + budgets |\n| Schema exposure | Disable introspection publicly if needed |\n| Unauthorized fields | Field-level authorization |"}, {"id": 44, "title": "gRPC for service-to-service APIs", "tldr": "gRPC uses Protocol Buffers over HTTP/2 for efficient, strongly typed RPC with streaming, deadlines and code generation. It is ideal for internal service communication; browsers need gRPC-Web or a gateway.", "real": "Google open-sourced gRPC in 2015 based on its internal Stubby framework, and it became a CNCF incubating project used by companies such as Netflix, Square and Cisco for internal APIs.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | High-performance typed RPC framework |\n| Why it matters | Efficiency, contracts, streaming |\n| When to use | Internal microservices, polyglot systems, streaming |\n| When not to use | Public browser-facing APIs without a gateway |\n| Trade-off | Performance vs human readability and tooling |\n| Failure mode | Missing deadlines leading to hung calls |\n| Production habit | Deadlines on every call; status codes mapped consistently |\n\n### Streaming types\n\n| Type | Example |\n|---|---|\n| Unary | GetOrder |\n| Server streaming | WatchOrderStatus |\n| Client streaming | UploadMetrics |\n| Bidirectional | Chat |"}, {"id": 45, "title": "Protocol Buffers and schema evolution", "tldr": "Protocol Buffers define messages with numbered fields, producing compact binary encoding and generated code. Evolve schemas safely: add fields with new numbers, never reuse or change numbers, and reserve removed ones.", "real": "Google open-sourced Protocol Buffers in 2008 after years of internal use, and its official guidance warns that reusing field numbers can cause data corruption when old and new binaries coexist.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Schema-defined binary serialization |\n| Why it matters | Compact, fast, evolvable messages |\n| Rules | Never reuse field numbers; reserve removed fields |\n| Trade-off | Efficiency vs readability |\n| Failure mode | Changing a field’s type in place |\n| Production habit | buf breaking-change checks in CI |\n\n### Safe evolution\n\n```protobuf\nmessage Order {\n  reserved 4;                 // removed field 'coupon'\n  reserved \"coupon\";\n  string id = 1;\n  string status = 2;\n  int64 total_minor = 3;\n  string currency = 5;        // new field, new number\n}\n```"}, {"id": 46, "title": "WebSockets", "tldr": "WebSockets provide full-duplex, persistent connections for real-time features: chat, collaboration, live dashboards, games. They need connection management, authentication, heartbeats, reconnection and horizontal scaling via pub/sub.", "real": "The WebSocket protocol was standardized as RFC 6455 in 2011, and applications such as Slack and Discord use persistent socket connections through gateway services to deliver real-time messages.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Persistent bidirectional connections |\n| Why it matters | Low-latency push in both directions |\n| When to use | Chat, collaboration, multiplayer |\n| When not to use | Simple server-to-client updates (SSE simpler) |\n| Trade-off | Real-time power vs stateful infrastructure |\n| Failure mode | All sockets dropped on deploy with thundering reconnects |\n| Production habit | Jittered reconnects; connection draining |\n\n### Scaling\n\n```mermaid\nflowchart LR\n  C1[Clients] --> G1[Socket gateway 1]\n  C2[Clients] --> G2[Socket gateway 2]\n  G1 <--> PUB[Pub/sub: Redis / NATS / Kafka]\n  G2 <--> PUB\n  SVC[Services] --> PUB\n```"}, {"id": 47, "title": "Server-Sent Events and streaming responses", "tldr": "Server-Sent Events stream text events from server to client over a regular HTTP response, with automatic reconnection. They are simpler than WebSockets for one-way updates, and are widely used to stream LLM responses token by token.", "real": "SSE is defined in the HTML Living Standard, and OpenAI’s and Anthropic’s APIs stream model output as server-sent events, which made SSE common again in AI-powered backends.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | One-way server push over HTTP |\n| Why it matters | Simple real-time updates |\n| When to use | Notifications, progress, LLM token streams |\n| Trade-off | One direction only; text-based |\n| Failure mode | Proxies buffering responses and breaking streaming |\n| Production habit | Disable proxy buffering; send heartbeats |\n\n### Event stream\n\n```http\nHTTP/1.1 200 OK\nContent-Type: text/event-stream\nCache-Control: no-cache\n\nevent: progress\ndata: {\"percent\": 40}\n\nevent: done\ndata: {\"report_id\": \"rep_12\"}\n```"}, {"id": 48, "title": "Polling, long polling and push", "tldr": "Choose how clients learn about changes: polling (simple, wasteful), long polling (held requests), SSE or WebSockets (push), or webhooks (server-to-server). Match the mechanism to latency needs, scale and client type.", "real": "Before WebSockets were standardized, applications such as early Gmail and Facebook chat used long polling techniques (often called Comet) to deliver near-real-time updates over plain HTTP.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Mechanisms for delivering updates |\n| Why it matters | Latency, cost and complexity differ widely |\n| Trade-off | Simplicity vs real-time behavior |\n| Failure mode | Thousands of clients polling every second |\n| Production habit | Conditional requests (ETags) for polling |\n\n### Comparison\n\n| Mechanism | Latency | Complexity | Best for |\n|---|---|---|---|\n| Polling | Interval | Low | Infrequent updates |\n| Long polling | Low | Medium | Legacy real-time |\n| SSE | Low | Low–medium | Server → browser streams |\n| WebSockets | Very low | High | Bidirectional real time |\n| Webhooks | Low | Medium | Server-to-server events |"}, {"id": 49, "title": "Asynchronous APIs and AsyncAPI", "tldr": "Event-driven APIs over brokers (Kafka, AMQP, MQTT) need contracts too: channels, message schemas, bindings and semantics. AsyncAPI documents them as OpenAPI documents HTTP APIs.", "real": "The AsyncAPI specification, started in 2017 and later hosted by the Linux Foundation, is used to document event-driven APIs and generate code and documentation for message-based systems.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Contracts for message-based APIs |\n| Why it matters | Consumers need schemas and semantics |\n| Contents | Channels, messages, schemas, protocols |\n| Trade-off | Documentation effort vs integration speed |\n| Failure mode | Undocumented events with unknown consumers |\n| Production habit | Event catalog with schemas and owners |\n\n### AsyncAPI fragment\n\n```yaml\nasyncapi: 3.0.0\ninfo: {title: Order events, version: 1.0.0}\nchannels:\n  orderPlaced:\n    address: orders.placed\n    messages:\n      OrderPlaced:\n        payload:\n          type: object\n          properties:\n            order_id: {type: string}\n            total_minor: {type: integer}\n            currency: {type: string}\n```"}, {"id": 50, "title": "Choosing an API style", "tldr": "Choose REST for broad, public, cacheable resource APIs; GraphQL for client-driven aggregation; gRPC for internal high-performance calls; WebSockets/SSE for real time; webhooks and events for asynchronous integration. Many systems use several.", "real": "Companies such as GitHub offer both REST and GraphQL public APIs, while using gRPC or other RPC frameworks internally, illustrating that API styles are chosen per audience and use case.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Matching API style to needs |\n| Why it matters | Wrong style creates friction for years |\n| Trade-off | Consistency vs best tool per job |\n| Failure mode | GraphQL everywhere, including simple internal calls |\n| Production habit | Document the default style per audience |\n\n### Decision guide\n\n| Need | Style |\n|---|---|\n| Public developer API | REST (+ webhooks) |\n| Complex client UIs with varied data | GraphQL or BFF |\n| Internal service calls | gRPC or REST |\n| Real-time bidirectional | WebSockets |\n| Server push to browser | SSE |\n| Event integration | Broker + AsyncAPI |"}, {"id": 51, "title": "Choosing a database", "tldr": "Default to a relational database such as PostgreSQL for most backends: transactions, constraints, SQL and maturity. Add specialized stores (key-value, document, search, analytics) when workloads clearly need them.", "real": "PostgreSQL was the most used database among professional developers in Stack Overflow’s Developer Surveys from 2023 onward, reflecting its role as a default backend datastore.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Selecting primary and secondary datastores |\n| Why it matters | Data choices are hard to reverse |\n| Trade-off | One general store vs specialized stores |\n| Failure mode | NoSQL chosen for “scale” then needing joins and transactions |\n| Production habit | Start relational; add stores for proven needs |\n\n### Common choices\n\n| Need | Store |\n|---|---|\n| Core business data | PostgreSQL / MySQL |\n| Cache, sessions, rate limits | Redis / Valkey |\n| Full-text search | Elasticsearch / OpenSearch / Postgres FTS |\n| Files | Object storage |\n| Analytics | Columnar warehouse |\n| Massive key-value scale | DynamoDB / Cassandra |"}, {"id": 52, "title": "Data modeling for backends", "tldr": "Model data around domain entities and invariants: normalized tables, primary and foreign keys, constraints that enforce rules, and indexes matching access patterns. The database should protect data integrity even if application code has bugs.", "real": "Edgar Codd’s 1970 relational model paper laid the foundation for normalized schemas, and constraints such as UNIQUE and FOREIGN KEY remain the most reliable way to prevent duplicate or orphaned data.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Designing tables, keys and constraints |\n| Why it matters | Integrity and query performance |\n| Tools | Primary keys, foreign keys, unique, check, not null |\n| Trade-off | Normalization vs read performance |\n| Failure mode | Uniqueness enforced only in application code (race conditions) |\n| Production habit | Every business invariant possible as a constraint |\n\n### Schema example\n\n```sql\nCREATE TABLE customers (\n  id          uuid PRIMARY KEY,\n  email       text NOT NULL UNIQUE,\n  created_at  timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE orders (\n  id           uuid PRIMARY KEY,\n  customer_id  uuid NOT NULL REFERENCES customers(id),\n  status       text NOT NULL CHECK (status IN ('pending','paid','shipped','cancelled')),\n  total_minor  bigint NOT NULL CHECK (total_minor >= 0),\n  currency     char(3) NOT NULL,\n  version      int NOT NULL DEFAULT 1,\n  created_at   timestamptz NOT NULL DEFAULT now()\n);\nCREATE INDEX orders_customer_created_idx ON orders (customer_id, created_at DESC);\n```"}, {"id": 53, "title": "ORMs, query builders and raw SQL", "tldr": "ORMs speed up CRUD and map rows to objects; query builders give composable SQL; raw SQL gives full control. Use ORMs for simple operations, but understand generated SQL and drop to SQL for complex or performance-critical queries.", "real": "Popular ORMs include Django ORM, SQLAlchemy, Hibernate, Entity Framework Core, ActiveRecord, Prisma and GORM, and most provide ways to log generated SQL, which teams use to catch inefficient queries.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Ways to access databases from code |\n| Why it matters | Productivity vs control and performance |\n| Trade-off | Abstraction convenience vs hidden queries |\n| Failure mode | Lazy loading producing hundreds of queries per request |\n| Production habit | Log SQL in development; query count assertions in tests |\n\n### Choosing\n\n| Approach | Best for |\n|---|---|\n| ORM | CRUD, simple relations |\n| Query builder | Dynamic filters, composable queries |\n| Raw SQL | Reports, complex joins, performance-critical paths |"}, {"id": 54, "title": "Transactions in application code", "tldr": "Wrap related writes in transactions so they commit or roll back together. Keep transactions short, avoid external calls inside

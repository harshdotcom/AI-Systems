## Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Systems language for safe, fast services |\n| Strengths | Performance, memory safety, predictable latency |\n| Watch out | Learning curve, compile times |\n| Frameworks | Axum, Actix Web, Rocket |\n| Production habit | Use for performance-critical paths where justified |\n\n### Axum route (0.8)\n\n```rust\nuse axum::{extract::Path, routing::get, Json, Router};\n\nasync fn get_order(Path(id): Path<String>) -> Json<serde_json::Value> {\n    Json(serde_json::json!({ \"id\": id, \"status\": \"pending\" }))\n}\n\n#[tokio::main]\nasync fn main() {\n    let app = Router::new().route(\"/v1/orders/{id}\", get(get_order));\n    let listener = tokio::net::TcpListener::bind(\"0.0.0.0:8080\").await.unwrap();\n    axum::serve(listener, app).await.unwrap();\n}\n```"}, {"id": 189, "title": "Ruby on Rails and Laravel", "tldr": "Rails (Ruby) and Laravel (PHP) are productive, convention-driven frameworks with ORMs, migrations, background jobs, authentication helpers and large ecosystems. They power many successful products and scale with good engineering.", "real": "Rails was extracted from Basecamp in 2004 and powers Shopify and GitHub; Laravel, released in 2011, became one of the most popular PHP frameworks.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Convention-over-configuration web frameworks |\n| Strengths | Developer speed, integrated tooling |\n| Watch out | ORM N+1s, monolith boundaries |\n| Production habit | Background jobs for slow work; modular boundaries |\n\n### Rails and Laravel routes\n\n```ruby\n# config/routes.rb\nnamespace :v1 do\n  resources :orders, only: [:index, :show, :create]\nend\n```\n\n```php\n// routes/api.php\nRoute::get('/v1/orders/{id}', [OrderController::class, 'show']);\n```"}, {"id": 190, "title": "Choosing frameworks and stacks", "tldr": "Choose by team expertise, ecosystem maturity, performance needs, hiring, operational tooling and organizational standards. A well-understood mainstream stack usually beats a theoretically faster but unfamiliar one.", "real": "Successful companies run on very different stacks, from Shopify on Rails to Uber on Go and Java, showing that architecture, engineering practices and operations matter more than framework choice.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Selecting backend technology |\n| Why it matters | Long-lived decision affecting hiring and velocity |\n| Trade-off | Familiarity vs specific technical advantages |\n| Failure mode | Rewriting working systems for fashion |\n| Production habit | ADR documenting stack choice and criteria |\n\n### Decision criteria\n\n| Criterion | Question |\n|---|---|\n| Team skills | Can we ship and operate it well now? |\n| Ecosystem | Libraries for our integrations? |\n| Performance | Does it meet latency/cost needs? |\n| Hiring | Can we hire for it locally? |\n| Operations | Observability, deployment, support? |\n| Longevity | Healthy community and releases? |"}, {"id": 191, "title": "Capstone: an e-commerce orders API", "tldr": "Design an orders API with resource modeling, cursor pagination, idempotent creation, optimistic concurrency, RFC 9457 errors, event publication through an outbox, authorization per customer and SLOs.", "real": "This capstone combines patterns used by public commerce and payments APIs such as Shopify’s and Stripe’s: idempotency keys, cursor pagination, webhooks and consistent error formats.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Endpoints | POST/GET /v1/orders, GET/PATCH /v1/orders/{id}, POST /v1/orders/{id}:cancel |\n| Correctness | Idempotency-Key on create; If-Match on updates |\n| Data | PostgreSQL with constraints; outbox for order events |\n| Security | OAuth scopes orders:read/write; object-level checks |\n| SLO | 99.9% availability; p95 < 200 ms reads, < 400 ms writes |\n\n### Architecture\n\n```mermaid\nflowchart LR\n  CLIENT[Clients] --> GW[API gateway: auth, rate limits]\n  GW --> API[Orders API]\n  API --> DB[(PostgreSQL + outbox)]\n  DB --> RELAY[Outbox relay]\n  RELAY --> BUS[Event bus]\n  BUS --> EMAIL[Notifications]\n  BUS --> SEARCH[Search index]\n```"}, {"id": 192, "title": "Capstone: an authentication service", "tldr": "Build or integrate an auth service with OIDC login, Argon2id password hashing, passkeys and MFA, short-lived access tokens with rotating refresh tokens, session management, brute-force protection, audit logs and account recovery.", "real": "Many companies use managed identity providers (Auth0/Okta, Microsoft Entra ID, AWS Cognito) or open-source ones (Keycloak, Ory, Zitadel) rather than building authentication from scratch, because the security surface is large.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Features | Login, signup, MFA, passkeys, password reset, sessions, OIDC |\n| Tokens | Access 10–15 min; refresh rotated, reuse detection |\n| Protections | Rate limits, breached-password checks, lockout with care |\n| Audit | Logins, MFA changes, password resets |\n| Decision | Prefer managed/open-source IdP unless strong reasons |\n\n### Refresh token rotation\n\n```mermaid\nflowchart LR\n  USE[Client uses refresh token R1] --> ISSUE[Issue access token + R2, invalidate R1]\n  REUSE[Attacker reuses R1] --> DETECT[Reuse detected]\n  DETECT --> REVOKE[Revoke whole token family]\n```"}, {"id": 193, "title": "Capstone: a webhook delivery system", "tldr": "Build reliable outbound webhooks: event log, per-endpoint queues, signed payloads with timestamps, retries with exponential backoff, circuit breaking for failing endpoints, delivery logs, manual replay and endpoint management APIs.", "real": "Providers such as Stripe and GitHub expose webhook delivery logs and redelivery tools, and open-source and hosted services such as Svix were built specifically to provide reliable webhook delivery as infrastructure.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Delivery | At-least-once with event IDs for dedup |\n| Security | HMAC-SHA256 signatures, timestamps, secret rotation |\n| Retries | Exponential backoff for up to \\~3 days, then disable endpoint + notify |\n| Isolation | Per-endpoint queues so one slow customer doesn’t block others |\n| Observability | Delivery logs, success rate per endpoint |\n\n### Architecture\n\n```mermaid\nflowchart LR\n  EVENTS[Domain events] --> LOG[(Event log)]\n  LOG --> FAN[Fan-out to subscriptions]\n  FAN --> Q1[Endpoint queue A]\n  FAN --> Q2[Endpoint queue B]\n  Q1 --> SENDER[Signed HTTP sender + retries]\n  Q2 --> SENDER\n  SENDER --> DLOG[(Delivery log)]\n```"}, {"id": 194, "title": "Capstone: a file upload and processing service", "tldr": "Build an upload service using presigned URLs, quarantine buckets, validation and malware scanning, asynchronous processing (thumbnails, metadata), access-controlled delivery via signed CDN URLs, and lifecycle policies for cleanup.", "real": "Image-heavy products such as social networks and marketplaces use this architecture to keep large file traffic off application servers and process media in isolated workers.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Upload | Presigned PUT (5 min), size and type constraints |\n| Processing | Event-driven workers, sandboxed |\n| Security | Content validation, scanning, private buckets |\n| Delivery | Signed CDN URLs with expiry |\n| Cleanup | Lifecycle rules for abandoned uploads |\n\n### States\n\n```mermaid\nstateDiagram-v2\n  [*] --> PendingUpload\n  PendingUpload --> Uploaded\n  Uploaded --> Scanning\n  Scanning --> Processing\n  Scanning --> Rejected\n  Processing --> Ready\n  PendingUpload --> Expired\n```"}, {"id": 195, "title": "Capstone: a public API platform", "tldr": "Launch a public API with an API gateway, API keys and OAuth, per-plan rate limits and quotas, usage metering, developer portal, SDKs, versioning and deprecation policy, status page and support processes.", "real": "Twilio, Stripe and similar API-first companies combine these elements, and their developer experience is frequently cited as a reason for adoption over competitors.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Access | API keys (server), OAuth (third-party apps) |\n| Limits | Per-plan rate limits + monthly quotas |\n| Metering | Durable usage events → billing |\n| DX | Portal, docs from OpenAPI, SDKs, sandbox |\n| Lifecycle | Versioning, changelog, Sunset/Deprecation headers |\n\n### Platform view\n\n```mermaid\nflowchart LR\n  DEV[Developers] --> PORTAL[Developer portal]\n  DEV --> GW[Gateway: keys, OAuth, limits]\n  GW --> APIS[API services]\n  GW --> METER[Usage metering]\n  METER --> BILL[Billing]\n  APIS --> STATUS[Status page]\n```"}, {"id": 196, "title": "API design review checklist", "tldr": "Review every new or changed API for resource modeling, naming, methods and status codes, errors, pagination, filtering, idempotency, concurrency, versioning, security, documentation and performance.", "real": "Organizations with API style guides, such as Google, Microsoft and Zalando, pair them with design reviews or automated linting to keep large API portfolios consistent.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A standard API design gate |\n| Why it matters | APIs are hard to change after release |\n| Production habit | Review before implementation starts |\n\n### Checklist\n\n| Area | Question |\n|---|---|\n| Resources | Nouns, clear ownership, stable IDs? |\n| Methods | Correct semantics; idempotency for creates? |\n| Errors | RFC 9457 format, stable codes? |\n| Lists | Cursor pagination, limits, allow-listed filters? |\n| Concurrency | ETags / versions on updates? |\n| Security | Auth, scopes, object-level checks, rate limits? |\n| Compatibility | Additive changes; versioning plan? |\n| Docs | OpenAPI with examples and error docs? |\n| Performance | Payload sizes, query patterns, caching? |"}, {"id": 197, "title": "Code review checklist for backends", "tldr": "Review backend code for correctness, security, data integrity, error handling, performance, observability, tests and operability, not just style. Use checklists so important issues aren’t missed.", "real": "Google’s engineering practices documentation on code review emphasizes design, functionality, complexity, tests and naming, and many teams add backend-specific checks for security and data integrity.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Backend-specific review guidance |\n| Why it matters | Catches bugs before production |\n| Production habit | Checklist in PR template |\n\n### Checklist\n\n- [ ] Input validated; authorization checked per object\n- [ ] Queries parameterized; no N+1; indexes for new queries\n- [ ] Transactions short; no external calls inside\n- [ ] Timeouts and retries correct; idempotency preserved\n- [ ] Errors mapped to proper status codes; no leaks\n- [ ] Logs structured, no secrets/PII; metrics/traces added\n- [ ] Migrations backward compatible\n- [ ] Tests cover success, errors and permissions"}, {"id": 198, "title": "Production readiness checklist", "tldr": "Before a service goes live, confirm ownership, SLOs, observability, alerts, runbooks, security review, capacity, scaling, backups, deployment safety, dependency failure handling and documentation.", "real": "Google SRE’s production readiness reviews and similar checklists at companies such as Uber and Spotify formalize launch criteria so new services don’t reach production without basic operational safeguards.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Launch gate for new services |\n| Why it matters | Prevents avoidable first-week incidents |\n| Production habit | Required sign-off before production traffic |\n\n### Checklist\n\n| Area | Requirement |\n|---|---|\n| Ownership | Team, on-call rotation, catalog entry |\n| SLOs | Defined with dashboards and burn-rate alerts |\n| Observability | Logs, metrics, traces, error tracking |\n| Reliability | Timeouts, retries, health checks, graceful shutdown |\n| Security | Threat model, authz tests, secrets managed |\n| Data | Backups, restore tested, migrations safe |\n| Capacity | Load tested, autoscaling configured |\n| Deployment | Canary, rollback, feature flags |\n| Docs | API docs, runbooks, architecture diagram |"}, {"id": 199, "title": "The backend engineering career path", "tldr": "Backend engineers grow from implementing endpoints to owning services, designing systems, leading architecture and setting technical direction. Growth comes from depth (data, security, performance, reliability) and breadth (product, operations, communication).", "real": "Engineering career ladders published by companies such as Dropbox, GitLab and Spotify describe progression from feature delivery to system ownership, cross-team technical leadership and organizational impact.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Progression of backend engineering roles |\n| Why it matters | Guides learning and responsibilities |\n| Trade-off | Specialization vs breadth |\n| Production habit | Seek ownership of production systems early |\n\n### Levels\n\n| Level | Focus |\n|---|---|\n| Junior | Implement endpoints with tests |\n| Mid | Own features end to end, including operations |\n| Senior | Design services, mentor, lead incidents |\n| Staff | Cross-team architecture, standards, platforms |\n| Principal | Technical strategy across the organization |"}, {"id": 200, "title": "Glossary and mastery roadmap", "tldr": "Use the glossary for shared vocabulary and the roadmap to practice: build real APIs, secure them, test them, operate them, and review others’ designs. Mastery comes from shipping and running systems.", "real": "Recommended references: RFC 9110 (HTTP Semantics), RFC 9457 (Problem Details), the OWASP API Security Top 10, Google’s API Improvement Proposals, “Designing Data-Intensive Applications” and the Google SRE books.", "body": "### Glossary\n\n| Term | Meaning |\n|---|---|\n| Idempotent | Repeating a request has no extra effect |\n| ETag | Version identifier for conditional requests |\n| BOLA | Broken object-level authorization |\n| Cursor pagination | Paging with an opaque position marker |\n| Outbox | Table storing events in the same transaction as data |\n| PKCE | Code challenge protecting OAuth authorization codes |\n| SLO | Target for a service level indicator |\n| BFF | Backend for frontend |\n| Circuit breaker | Fail-fast switch for failing dependencies |\n| Problem Details | RFC 9457 error format |\n\n### Mastery roadmap\n\n1. Build a REST API with validation, errors and pagination\n2. Add OAuth/OIDC authentication and object-level authorization\n3. Add idempotency keys, ETags and an outbox\n4. Write unit, integration (Testcontainers) and contract tests\n5. Instrument logs, metrics and traces; define SLOs\n6. Containerize, deploy with CI/CD and canaries\n7. Load test and optimize the slowest endpoint\n8. Run a security review against the OWASP API Top 10"}];
const PARTS = ["Backend foundations", "HTTP in depth", "REST API design", "API design practices", "GraphQL, gRPC and real-time APIs", "Data and persistence", "Authentication", "Authorization", "API security", "Asynchronous processing", "Performance", "Reliability", "Backend architecture", "Testing backends and APIs", "Observability and operations", "Deployment and infrastructure", "API lifecycle and governance", "Specialized backend topics", "Languages and frameworks", "Capstones and mastery"];
const TOTAL = 200, PER = 10;
function idsOf(p){ const a = []; for (let i = (p-1)*PER + 1; i <= p*PER; i++) a.push(i); return a; }
const partOf = id => Math.ceil(id / PER);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "backend-api-progress-v1";
const LS_LAST = "backend-api-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try{ await dbRef.set({done:[...done].sort((a,b)=>a-b), updated:Date.now()}); }
  catch(e){ if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; pushRemote(); }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...done])); }catch(e){} }
function toggle(id){
  if (done.has(id)) done.delete(id); else done.add(id);
  saveLocal(); pushRemote(); renderAll();
  toast(done.has(id) ? "Chapter " + id + " marked complete" : "Chapter " + id + " marked not complete");
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(s){
  if (window.marked && marked.parse){
    const html = marked.parse(s, {gfm:true, headerIds:false, mangle:false});
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  }
  return "<pre>" + esc(s) + "</pre>";
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function currentId(){
  const m = location.hash.match(/^#ch-(\d{1,3})$/);
  const n = m ? +m[1] : 0;
  return n >= 1 && n <= TOTAL ? n : 0;
}

/* ---------- header memory bank ---------- */
function renderBank(){
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    html += '<div class="bank-group" title="Part ' + p + ': ' + esc(PARTS[p-1]) + '">';
    for (const i of idsOf(p)){
      html += '<button class="cell' + (done.has(i) ? " done" : "") + (i === cur ? " here" : "") +
        '" data-go="' + i + '" aria-label="Chapter ' + i + (done.has(i) ? ", complete" : "") + '"></button>';
    }
    html += "</div>";
  }
  document.getElementById("bank").innerHTML = html;
  document.getElementById("doneCount").textContent = done.size;
  document.getElementById("pct").textContent = Math.round(done.size * 100 / TOTAL) + "%";
}

/* ---------- sidebar ---------- */
const openParts = new Set();
function renderSide(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const matches = ids.filter(i => !q || byId[i].title.toLowerCase().includes(q) || byId[i].tldr.toLowerCase().includes(q) || String(i) === q);
    if (q && !matches.length) continue;
    const count = ids.filter(i => done.has(i)).length;
    const open = q || openParts.has(p) || partOf(cur) === p;
    html += '<div class="part' + (open ? " open" : "") + '">' +
      '<button class="part-head" data-part="' + p + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="part-num">' + String(p).padStart(2, "0") + '</span>' +
      '<span class="part-name">' + esc(PARTS[p-1]) + '</span>' +
      '<span class="part-count' + (count === PER ? " full" : "") + '">' + count + '/' + PER + '</span></button><ul class="part-list">';
    for (const i of matches){
      html += '<li class="ch-row' + (i === cur ? " active" : "") + '">' +
        '<button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="' + (done.has(i) ? "Mark chapter " + i + " not complete" : "Mark chapter " + i + " complete") + '">' + TICK + '</button>' +
        '<a href="#ch-' + i + '"><span class="n">' + i + '.</span>' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ul></div>";
  }
  if (!html) html = '<p style="color:var(--muted);font-size:14px;padding:8px">No chapters match that search. Try a shorter word like “OAuth”, “cache” or “pagination”.</p>';
  document.getElementById("parts").innerHTML = html;
}

/* ---------- diagrams and charts ---------- */
let mermaidPromise = null, renderSeq = 0;
const svgCache = new Map();
function isDark(){
  const a = document.documentElement.getAttribute("data-theme");
  if (a) return a === "dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function ensureMermaid(){
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (mermaidPromise) return mermaidPromise;
  mermaidPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js";
    s.onload = () => {
      try{
        window.mermaid.initialize({ startOnLoad:false, securityLevel:"strict", theme: isDark() ? "dark" : "neutral",
          fontFamily:"IBM Plex Sans, system-ui, sans-serif", flowchart:{ curve:"basis", htmlLabels:true } });
        resolve(window.mermaid);
      }catch(e){ reject(e); }
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return mermaidPromise;
}
function fitSvg(div){
  const svg = div.querySelector("svg");
  if (!svg) return;
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Diagram");
  const vb = (svg.getAttribute("viewBox") || "").split(/\s+/).map(Number);
  const vbw = vb[2] || 0;
  if (vbw && div.clientWidth && div.clientWidth < vbw * 0.7){
    svg.style.maxWidth = "none";
    svg.style.width = Math.round(vbw * 0.85) + "px";
  }
}
function fmtNum(v){ return Number(v).toLocaleString("en-US", { maximumFractionDigits: 3 }); }
function renderChart(el, spec){
  const max = Math.max(...spec.data.map(d => d[1]));
  const unit = spec.unit || "";
  const sep = (unit === "%" || unit === "×") ? "" : " ";
  let rows = "";
  for (const [label, v] of spec.data){
    let w = spec.log ? (Math.log10(v + 1) / Math.log10(max + 1)) * 100 : (v / max) * 100;
    w = Math.max(w, 1.5);
    rows += '<div class="bar-row"><span class="bar-label">' + esc(String(label)) + '</span><span class="bar-track"><span class="bar" style="width:' + w.toFixed(1) + '%"></span></span><span class="bar-val">' + fmtNum(v) + sep + esc(unit) + '</span></div>';
  }
  const fig = document.createElement("figure");
  fig.className = "chart";
  fig.innerHTML = '<figcaption>' + esc(spec.title || "") + '</figcaption>' + rows + (spec.log ? '<div class="chart-note">Bar lengths use a logarithmic scale.</div>' : "");
  el.replaceWith(fig);
}
function enhance(root){
  root.querySelectorAll("code.language-chart").forEach(code => {
    const pre = code.closest("pre") || code;
    try{ renderChart(pre, JSON.parse(code.textContent)); }catch(e){}
  });
  const blocks = [...root.querySelectorAll("code.language-mermaid")];
  if (!blocks.length) return;
  const seq = ++renderSeq;
  const holders = blocks.map(code => {
    const pre = code.closest("pre") || code;
    const div = document.createElement("div");
    div.className = "diagram loading";
    div.textContent = "Loading diagram…";
    div.dataset.src = code.textContent;
    pre.replaceWith(div);
    if (svgCache.has(div.dataset.src)){ div.classList.remove("loading"); div.innerHTML = svgCache.get(div.dataset.src); div.dataset.done = "1"; fitSvg(div); }
    return div;
  }).filter(div => !div.dataset.done);
  if (!holders.length) return;
  ensureMermaid().then(async m => {
    for (let k = 0; k < holders.length; k++){
      const div = holders[k];
      if (seq !== renderSeq || !div.isConnected) return;
      const id = "mmd-" + seq + "-" + k;
      try{
        const out = await m.render(id, div.dataset.src);
        if (!div.isConnected) return;
        div.classList.remove("loading");
        div.innerHTML = out.svg;
        svgCache.set(div.dataset.src, out.svg);
        fitSvg(div);
      }catch(e){
        const junk = document.getElementById("d" + id); if (junk) junk.remove();
        div.classList.remove("loading");
        div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>";
      }
    }
  }).catch(() => {
    holders.forEach(div => { div.classList.remove("loading"); div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>"; });
  });
}

/* ---------- chapter view ---------- */
function renderChapter(id){
  const c = byId[id];
  const p = partOf(id);
  const ids = idsOf(p);
  const isDone = done.has(id);
  const tabs = ids.map(i =>
    '<button class="tab' + (i === id ? " active" : "") + '" role="tab" aria-selected="' + (i === id) + '" data-go="' + i + '">' +
    '<span class="dot' + (done.has(i) ? " on" : "") + '"></span><span class="tab-t">' + i + '. ' + esc(byId[i].title) + '</span></button>'
  ).join("");
  document.getElementById("main").innerHTML =
    '<p class="crumb">Part ' + p + ' of 20: ' + esc(PARTS[p-1]) + '</p>' +
    '<div class="tabs" role="tablist" aria-label="Chapters in this part">' + tabs + '</div>' +
    '<article>' +
      '<p class="ch-no">Chapter ' + id + ' of ' + TOTAL + '</p>' +
      '<h1 class="ch-title">' + esc(c.title) + '</h1>' +
      '<section class="box tldr"><h2>TL;DR</h2><p>' + inlineMd(c.tldr) + '</p></section>' +
      '<div class="body">' + md(c.body) + '</div>' +
      '<section class="box real"><h2>Real-world example</h2><p>' + inlineMd(c.real) + '</p></section>' +
      '<div class="done-bar">' +
        '<button class="complete' + (isDone ? " on" : "") + '" data-toggle="' + id + '" aria-pressed="' + isDone + '">' +
          '<span class="tick' + (isDone ? " on" : "") + '">' + TICK + '</span>' + (isDone ? "Completed" : "Mark as complete") + '</button>' +
        '<div class="nav">' +
          '<button class="btn" data-go="' + (id - 1) + '"' + (id === 1 ? " disabled" : "") + '>Previous</button>' +
          '<button class="btn" data-go="' + (id + 1) + '"' + (id === TOTAL ? " disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  enhance(document.getElementById("main"));
}

/* ---------- contents view ---------- */
function renderContents(){
  let html = '<div class="contents"><h1>Contents</h1>' +
    '<p class="lead">Twenty parts covering HTTP, REST and API design, GraphQL, gRPC and real-time APIs, data and persistence, authentication, authorization, API security, asynchronous processing, performance, reliability, architecture, testing, observability, deployment, API lifecycle and governance, specialized topics, major languages and frameworks, and capstone builds. Every chapter has an engineering card covering what it is, why it matters, when to use it and when not, trade-offs, failure modes and production habits. Tick a chapter when you finish it; your progress is saved.</p>' +
    '<div class="contents-actions"><button class="btn" data-go="' + firstUnread() + '">' + (done.size ? "Continue with chapter " + firstUnread() : "Start chapter 1") + '</button>' +
    '<button class="btn" id="resetBtn">Reset progress</button></div><div class="grid">';
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const count = ids.filter(i => done.has(i)).length;
    html += '<section class="pcard"><h2>Part ' + p + ': ' + esc(PARTS[p-1]) + '</h2><div class="meta">' + count + ' of ' + PER + ' complete</div><ol>';
    for (const i of ids){
      html += '<li><button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="Toggle chapter ' + i + '">' + TICK + '</button><a href="#ch-' + i + '">' + i + '. ' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ol></section>";
  }
  document.getElementById("main").innerHTML = html + "</div></div>";
}
function firstUnread(){ for (let i = 1; i <= TOTAL; i++) if (!done.has(i)) return i; return TOTAL; }

/* ---------- routing ---------- */
let lastRendered = null;
function renderAll(){
  const id = currentId();
  renderBank(); renderSide();
  const y = window.scrollY;
  if (id) renderChapter(id); else renderContents();
  if (lastRendered === location.hash) window.scrollTo(0, y);
  lastRendered = location.hash;
}
function route(){
  const id = currentId();
  if (!id && location.hash !== "#contents"){
    let last = 0; try{ last = +localStorage.getItem(LS_LAST) || 0; }catch(e){}
    location.replace("#ch-" + (last >= 1 && last <= TOTAL ? last : 1));
    return;
  }
  if (id){ try{ localStorage.setItem(LS_LAST, id); }catch(e){} }
  document.body.classList.remove("drawer");
  renderAll();
  window.scrollTo(0, 0);
  const active = document.querySelector(".ch-row.active");
  if (active) active.scrollIntoView({block:"nearest"});
  const tab = document.querySelector(".tab.active");
  if (tab && tab.parentElement){ const r = tab.parentElement; const left = tab.offsetLeft - r.offsetLeft; if (left < r.scrollLeft || left + tab.offsetWidth > r.scrollLeft + r.clientWidth) r.scrollLeft = left - 16; }
}
function go(id){ if (id >= 1 && id <= TOTAL) location.hash = "#ch-" + id; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){ e.preventDefault(); toggle(+t.dataset.toggle); return; }
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled){ go(+g.dataset.go); return; }
  const ph = e.target.closest("[data-part]");
  if (ph){
    const p = +ph.dataset.part;
    const el = ph.parentElement;
    const isOpen = el.classList.toggle("open");
    if (isOpen) openParts.add(p); else openParts.delete(p);
    ph.setAttribute("aria-expanded", isOpen);
    return;
  }
  if (e.target.id === "resetBtn"){
    if (confirm("Clear all 200 ticks? This can’t be undone.")){ done.clear(); saveLocal(); pushRemote(); renderAll(); toast("Progress reset"); }
  }
});
document.getElementById("search").addEventListener("input", renderSide);
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.add("drawer"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = currentId(); if (!id) return;
  if (e.key === "ArrowRight") go(id + 1);
  else if (e.key === "ArrowLeft") go(id - 1);
});
function setTopH(){ document.documentElement.style.setProperty("--top-h", document.getElementById("top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);
window.addEventListener("hashchange", route);
setTopH();
route();
initSync();
</script>
</body>
</html>

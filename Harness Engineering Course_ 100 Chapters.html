on locally\n3. Update token validation to reject expired tokens\n4. Tests: unit (expiry logic), integration (login flow)\n5. Update docs/auth.md\n```\n\n### Harness support\n\nStore the plan as a file or structured state, show it in the UI, and require updates when steps complete or change."}, {"id": 42, "title": "Reflection, self-critique and evaluator loops", "tldr": "Agents improve when they check their work against criteria: rerun tests, compare output to requirements, or have a separate evaluator critique it. Feedback from real checks (tests, tools) is more reliable than self-assessment alone.", "real": "The Reflexion paper (2023) showed agents improving on coding and decision tasks by writing reflections on failures and retrying. Anthropic’s “Building effective agents” guide describes an evaluator-optimizer pattern in which one model call generates and another evaluates and gives feedback in a loop.", "body": "### Feedback sources, strongest first\n\n| Source | Reliability |\n|---|---|\n| Real execution (tests, compilers, running the app) | High |\n| Deterministic validators (schemas, linters) | High |\n| Separate evaluator model with clear rubric | Medium |\n| Same model self-critique | Lower (tends to approve own work) |\n\n### Evaluator-optimizer loop\n\n```\ndraft = generator(task)\nrepeat up to N times:\n    feedback = evaluator(task, draft, rubric)\n    if feedback.passes: break\n    draft = generator(task, draft, feedback)\n```\n\n### Rubric example (documentation task)\n\n| Criterion | Pass if |\n|---|---|\n| Accuracy | Every command was run and works |\n| Completeness | Covers install, config, usage, troubleshooting |\n| Clarity | Steps numbered, no undefined terms |\n\n### Pitfall\n\nSelf-critique without new information often just rephrases the same answer. Give the critic **evidence** (test results, diffs, screenshots) or a different perspective (separate prompt or model)."}, {"id": 43, "title": "Stopping conditions and budgets", "tldr": "Every agent loop needs limits: maximum turns, time, tokens and cost, plus rules for when to stop and ask a human. Without them, agents can loop, burn money or keep “improving” past the point of usefulness.", "real": "Agent SDKs expose such limits directly: both the Claude Agent SDK and the OpenAI Agents SDK let developers cap the maximum number of turns in an agent run. Production teams typically add their own per-task cost alerts and timeouts on top.", "body": "### Limits to set\n\n| Limit | Example |\n|---|---|\n| Max turns (model calls) | 50 for a support task, 300 for a coding session |\n| Wall-clock time | 30 minutes |\n| Token / cost budget | $2 per task |\n| Tool call caps | Max 10 web searches |\n| No-progress detection | Stop after 5 turns without state change |\n| Error streak | Stop after 3 identical failures |\n\n### Healthy stop reasons\n\n| Reason | Action |\n|---|---|\n| Verified done | Report and exit |\n| Blocked on missing info | Ask the user a specific question |\n| Needs approval | Pause for human |\n| Budget reached | Summarize state and hand off |\n| Repeated failure | Report what was tried, escalate |\n\n### Final message template\n\n```text\nStatus: done | blocked | partial\nWhat was done: …\nVerification: tests X/Y passing; manual check of …\nOpen issues: …\nNext steps: …\n```"}, {"id": 44, "title": "Error handling and recovery", "tldr": "Agents will hit errors constantly: failing commands, bad edits, API limits, wrong assumptions. Keep errors visible in context so the agent learns, retry transient failures automatically, and give the agent ways to roll back.", "real": "The Manus team recommended keeping failed actions and their error messages in the context rather than hiding them, because seeing the failure helps the model update its beliefs and avoid repeating the same mistake. They described error recovery as one of the clearest signs of real agentic behavior.", "body": "### Error classes and handling\n\n| Error | Handling |\n|---|---|\n| Transient (timeouts, rate limits) | Harness retries with backoff, no model involvement |\n| Invalid tool arguments | Return clear error; model corrects |\n| Command failure | Return trimmed stderr; model diagnoses |\n| Wrong approach | Model revises plan; note in progress file |\n| Broken state | Roll back (git) to last good checkpoint |\n| Environment problems | Escalate to human |\n\n### Make errors useful\n\n```\nCommand failed: npm test (exit 1)\n2 failing tests:\n  - auth/reset.test.ts › rejects expired link\n    Expected 401, received 200 (src/auth/reset.ts:48)\nFull log: /tmp/test-17.log\n```\n\n### Avoid\n\n- Silent retries that hide model mistakes\n- Dumping 5,000-line stack traces into context\n- Removing failed attempts from history entirely\n\n### Loop detection\n\nIf the agent repeats the same failing action, the harness can inject a reminder: “This command has failed 3 times with the same error. Try a different approach or ask for help.”"}, {"id": 45, "title": "Determinism vs autonomy", "tldr": "Not everything should be left to the model. Hard-code steps that must always happen (formatting, tests, security checks) as deterministic code or hooks, and let the model handle judgment-heavy parts. Good harnesses mix both.", "real": "Claude Code supports hooks: user-defined shell commands that run automatically at points such as before or after a tool call or when the agent stops. Anthropic’s documentation positions hooks as a way to guarantee actions happen, instead of relying on the model to remember an instruction.", "body": "### What to make deterministic\n\n| Step | Why |\n|---|---|\n| Code formatting after edits | Always required, no judgment |\n| Running tests before commit | Must not be skipped |\n| Blocking edits to protected files | Security |\n| Logging and notifications | Reliability |\n| Secret scanning | Must never be missed |\n| Final validation | Objective checks |\n\n### What to leave to the model\n\n| Step | Why |\n|---|---|\n| Deciding which files to change | Needs understanding |\n| Debugging failures | Needs reasoning |\n| Choosing between approaches | Judgment |\n| Writing explanations | Language |\n\n### Hook examples (concept)\n\n```\nPreToolUse(edit, path matches \"migrations/*\")  → block, ask human\nPostToolUse(edit, *.py)                         → run formatter and linter\nStop                                            → run test suite; if failing, tell agent to continue\n```\n\n### Principle\n\n**Instructions are suggestions; code is a guarantee.** Move important rules from prompts into the harness when they must always hold."}, {"id": 46, "title": "When multiple agents help, and what they cost", "tldr": "Multi-agent setups can parallelize broad work and keep each agent’s context focused, but they use many more tokens and add coordination problems. Use them for parallelizable, breadth-heavy tasks, not for tightly coupled work like most single-codebase changes.", "real": "Anthropic reported in June 2025 that its multi-agent research system (a lead agent with parallel subagents) outperformed a single agent by 90.2% on an internal research evaluation. It also noted that agents used about 4 times more tokens than chats, and multi-agent systems about 15 times more.", "body": "### Good fits\n\n| Task type | Why multi-agent helps |\n|---|---|\n| Broad research | Subagents explore different sources in parallel |\n| Large-scale analysis | Split data or documents across workers |\n| Independent subtasks | Each worker owns a separate piece |\n| Context isolation | Workers explore deeply and return summaries |\n\n### Poor fits\n\n| Task type | Why |\n|---|---|\n| Tightly coupled code changes | Workers make conflicting decisions |\n| Tasks needing full shared context | Information lost between agents |\n| Low-value queries | Token cost not justified |\n\n### Cost check\n\n```\nSingle agent:  1 context, sequential, cheaper\nMulti-agent:   N contexts, parallel, faster on broad tasks, ~multiple × tokens\nUse when:      value of speed or breadth > extra token cost\n```\n\n### Start simple\n\nBuild a strong single-agent harness first. Add subagents for specific, measured bottlenecks."}, {"id": 47, "title": "Orchestrator–worker and subagents", "tldr": "An orchestrator agent breaks a task into subtasks, delegates them to worker subagents with their own clean contexts, and synthesizes the results. Subagents are also useful simply to isolate context-heavy exploration from the main thread.", "real": "In Anthropic’s research system, a lead agent planned the research and spawned subagents to search in parallel, each returning condensed findings. Claude Code supports subagents with their own instructions, tools and context windows, which the main agent can call for tasks like code review or exploring a large codebase.", "body": "### Pattern\n\n```\nOrchestrator (plans, delegates, synthesizes)\n   ├── Worker A: \"Find all uses of the payments API\" → summary\n   ├── Worker B: \"Check test coverage for module X\" → summary\n   └── Worker C: \"Read docs for library Y v3 changes\" → summary\nOrchestrator combines summaries → decides next steps\n```\n\n### Writing good delegation briefs\n\n| Include | Why |\n|---|---|\n| Objective | What to find or do |\n| Output format | So results combine easily |\n| Scope and boundaries | Avoid overlapping work |\n| Tools and sources to use | Focus effort |\n| Effort level | Avoid over- or under-work |\n\n### Subagents for context isolation\n\nEven without parallelism, a subagent can read 50 files and return a two-paragraph summary, keeping the main agent’s context clean.\n\n### Pitfalls\n\n- Vague briefs lead to duplicated or irrelevant work\n- Too many subagents for simple tasks\n- Orchestrator trusting summaries without verification"}, {"id": 48, "title": "Context-sharing pitfalls in multi-agent systems", "tldr": "When agents work on parts of the same task without sharing full context, they make conflicting implicit decisions. Prefer sharing full context and traces, keep writes in one place, and use multi-agent mainly for read-heavy, separable work.", "real": "In June 2025, Cognition (maker of Devin) published “Don’t Build Multi-Agents”, arguing that agents should share full context including other agents’ traces, because actions carry implicit decisions, and that conflicting decisions produce bad results. Anthropic’s research system worked well partly because research subtasks are largely read-only and parallel.", "body": "### The core problem\n\n```\nTask: \"Build a Flappy Bird clone\"\nSubagent 1 builds background in Super Mario style\nSubagent 2 builds a bird in a different art style\nCombiner: pieces don't fit\n```\n\nEach subagent made reasonable but inconsistent choices because it lacked the others’ decisions.\n\n### Guidelines\n\n| Guideline | Practice |\n|---|---|\n| Share context | Pass relevant decisions and traces to workers |\n| Single writer | One agent integrates changes |\n| Read-heavy delegation | Research, search, review |\n| Explicit contracts | Shared interfaces defined before parallel work |\n| Synthesis with verification | Orchestrator checks consistency |\n\n### When parallel writing works\n\nClearly separated components with agreed interfaces (for example separate services with an API contract), each verified independently and then integrated with tests."}, {"id": 49, "title": "Generator–evaluator separation and review agents", "tldr": "Separate the agent that produces work from the agent that judges it. A reviewer with a fresh context, different instructions and real tools (tests, browser) catches mistakes the producer overlooks, and humans can then focus on higher-level review.", "real": "OpenAI’s harness engineering post described review shifting increasingly to agent-to-agent review, with agents reviewing pull requests and responding to feedback while humans steered priorities. Anthropic’s long-running harness research suggested specialized agents such as testing or QA agents could improve results further.", "body": "### Why separation helps\n\n| Same agent reviews own work | Separate reviewer |\n|---|---|\n| Biased toward its own choices | Fresh perspective |\n| Shares the same blind spots | Different instructions and rubric |\n| Context polluted by implementation details | Clean context focused on outcomes |\n\n### Review agent setup\n\n| Element | Example |\n|---|---|\n| Inputs | Diff, task description, test results |\n| Tools | Run tests, open app in browser, read code |\n| Rubric | Correctness, tests, security, conventions, docs |\n| Output | Approve / request changes with specific comments |\n\n### Review loop\n\n```\nProducer opens PR → Reviewer agent comments → Producer fixes\n→ repeat until reviewer approves → human reviews summary and merges\n```\n\n### Guard against collusion\n\nReviewer must base approval on **evidence** (tests run, behavior observed), not on the producer’s description."}, {"id": 50, "title": "Coordinating parallel agents", "tldr": "Running several agents at once needs isolation (separate branches, worktrees or containers), clear task boundaries, locking for shared resources, and a merge process. Without these, agents overwrite each other’s work.", "real": "Developers commonly run several coding agents in parallel using git worktrees, which give each agent its own working directory on a separate branch of the same repository. Cloud coding agents such as Codex cloud and Jules run each task in its own sandbox and return a pull request.", "body": "### Isolation options\n\n| Option | Isolation level |\n|---|---|\n| Separate branches, same directory | Low (conflicts likely) |\n| Git worktrees | Medium (separate directories) |\n| Containers per agent | High |\n| Cloud sandboxes per task | High, scalable |\n\n### Worktree example\n\n```bash\ngit worktree add ../task-142 -b agent/task-142\ngit worktree add ../task-143 -b agent/task-143\n# run one agent in each directory\n```\n\n### Coordination rules\n\n| Rule | Purpose |\n|---|---|\n| One task per agent | Clear ownership |\n| Shared resources locked (DB, ports) | Avoid interference |\n| Task board with status | Avoid duplicate work |\n| Merge via PRs with CI | Catch conflicts and regressions |\n| Small, frequent merges | Reduce conflict size |\n\n### Watch for\n\nAgents editing the same files, shared test databases, port collisions for dev servers, and dependency changes that affect other tasks."}, {"id": 51, "title": "Verification is the heart of the harness", "tldr": "An agent is only as reliable as its ability to check its own work. Give it fast, objective feedback (tests, builds, linters, runtime checks, user-like testing) and make verification part of the definition of done. Better verification usually beats better prompting.", "real": "Anthropic’s long-running harness research found that agents often marked features complete without proper end-to-end testing, and that explicitly prompting them to test as a human user would (using browser automation) dramatically improved results. OpenAI’s harness engineering team similarly invested heavily in making the app and its telemetry inspectable by agents.", "body": "### The verification ladder\n\n| Level | Check | Catches |\n|---|---|---|\n| 1 | Syntax / type check | Broken code |\n| 2 | Linters and static analysis | Style, common bugs, rule violations |\n| 3 | Unit tests | Logic errors |\n| 4 | Integration tests | Interface mismatches |\n| 5 | End-to-end (browser, API) | Real user-facing behavior |\n| 6 | Runtime observability | Performance, errors in logs |\n| 7 | Human or reviewer agent | Design, intent, edge cases |\n\n### Make feedback fast\n\n| Speed | Effect |\n|---|---|\n| Seconds | Agent uses it every step |\n| Minutes | Agent uses it per feature |\n| Hours | Too slow for the loop |\n\nInvest in fast test subsets the agent can run often, with full suites in CI.\n\n### Principle\n\nIf a property matters, there should be a **check the agent can run** that tells it whether the property holds."}, {"id": 52, "title": "Tests, linters and type checkers as feedback", "tldr": "Existing developer tooling becomes the agent’s senses. Make commands easy to run, outputs concise and actionable, and failures specific. Strong type systems and good test suites make agents markedly more effective.", "real": "SWE-agent’s 2024 design ran a linter on every edit and rejected changes that introduced syntax errors, showing the edit back to the agent so it could fix it immediately. Coding agents today routinely run test suites and type checkers after changes as part of their default workflow.", "body": "### Make tooling agent-friendly\n\n| Practice | Example |\n|---|---|\n| One-command checks | `make check` runs lint, types, fast tests |\n| Targeted runs | `pytest tests/auth -q` |\n| Concise output | Quiet modes, failure summaries |\n| Deterministic tests | No flaky tests (agents chase ghosts) |\n| Clear messages | Expected vs actual with file and line |\n\n### Example: agent-oriented test output\n\n```\nFAILED tests/auth/test_reset.py::test_expired_link\n  expected status 401, got 200\n  at src/auth/reset.py:48 (check_expiry not called)\n1 failed, 213 passed in 4.2s\n```\n\n### Flaky tests\n\nAgents cannot tell flakiness from real failures. Quarantine flaky tests or mark them clearly, or agents will waste time “fixing” them, or worse, change correct code.\n\n### Protect the tests\n\nInstruct and enforce: agents must not delete or weaken tests to make them pass. Hooks or CI can flag test deletions for human review."}, {"id": 53, "title": "End-to-end verification", "tldr": "Unit tests can pass while the product is broken. Let agents verify like users: run the app, click through flows with browser automation, call APIs, check screenshots and logs. This catches integration bugs that code-level checks miss.", "real": "In Anthropic’s long-running harness, giving the coding agent browser automation tools to test features end to end, and asking it to do so before marking any feature complete, substantially improved its ability to find and fix bugs that were not obvious from the code alone.", "body": "### E2E methods\n\n| Method | Use |\n|---|---|\n| Browser automation (Playwright, Puppeteer) | Web UI flows |\n| API calls (curl, HTTP client) | Backend behavior |\n| CLI runs with sample inputs | Command-line tools |\n| Screenshot comparison | Visual regressions |\n| Log inspection | Errors behind the UI |\n\n### Smoke test script (init.sh concept)\n\n```bash\n#!/usr/bin/env bash\nset -e\nnpm run dev &                      # start app\nnpx wait-on http://localhost:3000\nnpx playwright test e2e/smoke.spec.ts\n```\n\nThe agent runs this at the start of each session to confirm the app works before changing anything.\n\n### Limits\n\n| Limit | Mitigation |\n|---|---|\n| Vision may miss subtle UI issues | Assertions on DOM text and states |\n| Slow | Run full E2E per feature, smoke tests per session |\n| Environment setup | Reproducible dev environment (ch. 57) |"}, {"id": 54, "title": "Architectural constraints as code", "tldr": "Agents can generate code fast but drift from intended architecture. Encode rules as automated checks: custom linters, dependency rules, structural tests and code generators. The harness enforces taste and architecture consistently, every time.", "real": "OpenAI’s harness engineering post described enforcing architectural boundaries and coding standards with custom linters and structural tests, with error messages written to tell the agent how to fix violations. That made rules legible and enforced, rather than relying on agents to remember documentation.", "body": "### Rules worth encoding\n\n| Rule | Check |\n|---|---|\n| Layering (UI must not import DB) | Dependency linter / import rules |\n| Naming conventions | Lint rules |\n| No direct HTTP calls outside client module | Custom lint rule |\n| Every endpoint has tests | Structural test |\n| Logging and error handling patterns | Static analysis |\n| File size / complexity limits | Lint thresholds |\n\n### Linter messages written for agents\n\n```\nERROR arch/no-db-in-ui: src/ui/Profile.tsx imports src/db/users.ts.\nUI components must fetch data through src/api/users.ts.\nFix: replace the import with `import { getUser } from \"../api/users\"`.\n```\n\n### Why it matters\n\n| Without constraints | With constraints |\n|---|---|\n| Inconsistent patterns spread | Patterns enforced automatically |\n| Reviewers catch issues late | Agent fixes violations immediately |\n| Docs drift from reality | Rules are executable |\n\n### Tip\n\nWhen you notice the same review comment twice, turn it into a lint rule or test."}, {"id": 55, "title": "Observability the agent can use", "tldr": "Give agents access to logs, metrics and traces of the system they are working on, in a form they can query. Then they can reproduce bugs, check performance and confirm fixes themselves instead of guessing.", "real": "OpenAI’s harness engineering post described making application logs, metrics and traces available to Codex in local development environments, so agents could reproduce issues, measure behavior such as startup time, and validate fixes against telemetry.", "body": "### What to expose\n\n| Signal | Agent use |\n|---|---|\n| Application logs | Find errors, trace requests |\n| Metrics | Performance, error rates before vs after |\n| Traces | Follow a request across services |\n| Database state | Confirm data changes |\n| Screenshots / recordings | Visual verification |\n\n### Access patterns\n\n```\nTool: query_logs(service, level, since, contains)\nTool: query_metric(name, range)\nTool: get_trace(trace_id)\n```\n\nReturn summaries and small samples, not raw log floods.\n\n### Workflow example\n\n```\n1. Reproduce bug locally\n2. query_logs(level=\"error\", since=\"5m\") → find stack trace\n3. Fix code\n4. Rerun scenario; query_logs again → no errors\n5. Check latency metric unchanged\n```\n\n### Safety\n\nUse development or staging telemetry for most work; production access only read-only, scoped and audited."}, {"id": 56, "title": "Agent-legible codebases", "tldr": "Codebases built for agents make knowledge discoverable from the repository: clear structure, design docs versioned with code, consistent patterns, good names, and executable checks. What helps agents almost always helps human newcomers too.", "real": "OpenAI’s harness engineering team described optimizing its repository for Codex’s legibility first, so an agent could reason about the full business domain from the repository alone, with design documents, architecture maps and execution plans kept in the repo rather than in external tools or people’s heads.", "body": "### Legibility checklist\n\n- [ ] Short instruction file with commands and a map (ch. 12–13)\n- [ ] ARCHITECTURE.md describing modules and boundaries\n- [ ] Design docs in the repo, linked from the map\n- [ ] Consistent patterns (one way to do common things)\n- [ ] Descriptive names for files, functions, tests\n- [ ] Executable checks for rules (ch. 54)\n- [ ] Examples of good implementations to copy\n\n### Knowledge that often lives outside the repo\n\n| Hidden knowledge | Move it to |\n|---|---|\n| Decisions in chat threads | docs/decisions/ records |\n| Setup steps in someone’s head | init scripts, docs |\n| Product requirements in documents elsewhere | Linked specs in the repo |\n| Tribal conventions | Lint rules, instruction files |\n\n### Principle\n\n**If the agent cannot see it, it does not exist.** Bring essential context into the repository or into tools the agent can query."}, {"id": 57, "title": "Reproducible development environments", "tldr": "Agents need an environment where the project builds and runs reliably, every time: pinned dependencies, setup scripts, containers or dev environments, seed data and fast reset. Environment problems are a top cause of wasted agent effort.", "real": "Cloud coding agents such as OpenAI’s Codex cloud let teams configure setup scripts that prepare each task’s container, and Anthropic’s long-running harness used an init.sh script so each session could start the app and run a smoke test before doing anything else.", "body": "### Environment checklist\n\n| Item | Practice |\n|---|---|\n| Dependencies | Lockfiles, pinned versions |\n| Setup | One script (`./setup.sh`) that works from scratch |\n| Services | Docker Compose or similar for databases, queues |\n| Data | Seed scripts, fixtures |\n| Secrets | Fake or development credentials only |\n| Reset | One command to return to a clean state |\n| Health check | Smoke test script |\n\n### Dev container sketch\n\n```json\n{\n  \"image\": \"mcr.microsoft.com/devcontainers/typescript-node:20\",\n  \"postCreateCommand\": \"npm ci && npm run db:seed\",\n  \"forwardPorts\": [3000]\n}\n```\n\n### Common environment failures\n\n- Missing system packages\n- Services not started (database, cache)\n- Network access needed during tests\n- Tests depending on local machine state\n\n### Rule\n\nIf a new human engineer cannot set up the project in minutes with one command, an agent will struggle too."}, {"id": 58, "title": "Sandboxing and isolation", "tldr": "Agents should run in isolated environments with limited filesystem access, controlled network egress, no production credentials, and resource limits. Sandboxing reduces both accident and attack damage, and lets you grant more autonomy safely.", "real": "Anthropic added OS-level sandboxing to Claude Code in 2025, restricting filesystem and network access, and reported that in internal use it reduced permission prompts by 84%. OpenAI’s Codex CLI also runs commands in a sandbox by default on supported operating systems.", "body": "### Isolation layers\n\n| Layer | Controls |\n|---|---|\n| Filesystem | Only the project directory writable |\n| Network | Deny by default; allowlist registries and needed APIs |\n| Credentials | Scoped, short-lived; no production secrets |\n| Process | Container, VM or OS sandbox |\n| Resources | CPU, memory, time limits |\n| Persistence | Ephemeral environments per task |\n\n### Autonomy vs isolation\n\n```\nWeak sandbox  → need approvals for many actions → slow, approval fatigue\nStrong sandbox → can auto-approve more actions safely → faster, safer\n```\n\n### Common pitfalls\n\n- Mounting home directories with SSH keys and cloud credentials\n- Allowing unrestricted network “for package installs”\n- Sharing one sandbox between tasks or users\n\nSee the AI security course (Parts 9–10) for deeper agent security."}, {"id": 59, "title": "Permissions and approval modes", "tldr": "Harnesses need a permission model: which actions run automatically, which require approval, and which are forbidden. Offer modes from cautious to autonomous, and use allowlists so routine actions do not flood users with prompts.", "real": "Claude Code offers permission modes and allow/deny rules for tools and commands, and OpenAI’s Codex CLI offers approval modes ranging from read-only suggestions to full auto within a sandbox. Both let users allowlist common safe commands.", "body": "### Permission tiers\n\n| Tier | Example actions | Default |\n|---|---|---|\n| Read | Read files, search | Allow |\n| Local write | Edit files in project | Allow or approve once |\n| Execute | Run tests, build | Allowlist patterns |\n| Network | Fetch URLs, call APIs | Approve or allowlist domains |\n| External effects | Push, deploy, send messages | Always approve |\n| Destructive | Delete data, force-push | Deny |\n\n### Rule configuration example (concept)\n\n```json\n{\n  \"allow\": [\"Read(*)\", \"Bash(npm test:*)\", \"Bash(git status)\", \"Edit(src/**)\"],\n  \"ask\":   [\"Bash(git push:*)\", \"WebFetch(*)\"],\n  \"deny\":  [\"Bash(rm -rf:*)\", \"Edit(.env*)\", \"Read(~/.ssh/**)\"]\n}\n```\n\n### Designing approvals\n\n- Show the exact command or change\n- Group related low-risk actions\n- Remember approvals within a session when safe\n- Default to deny on timeout"}, {"id": 60, "title": "Hooks and deterministic guardrails", "tldr": "Hooks run your code at fixed points in the agent loop: before tools run, after they finish, when the agent stops, at session start or before compaction. Use them to enforce rules, inject context, run checks and log activity.", "real": "Claude Code’s hooks include events such as PreToolUse, PostToolUse and Stop. A PreToolUse hook can block a tool call and tell the agent why, and a Stop hook can run tests and tell the agent to continue if they fail, turning instructions into guarantees.", "body": "### Hook points and uses\n\n| Hook point | Use |\n|---|---|\n| Session start | Load context (branch, open issues), check environment |\n| Before tool call | Block dangerous commands, validate paths, require approval |\n| After tool call | Format code, run linters, scan for secrets |\n| Before compaction | Save notes or state |\n| On stop | Verify tests pass; continue if not |\n| On notification | Alert humans (Slack, desktop) |\n\n### Example: block edits to protected files (pseudo-code)\n\n```python\ndef pre_tool_use(event):\n    if event.tool == \"edit\" and event.path.startswith((\"migrations/\", \".env\")):\n        return {\"decision\": \"block\",\n                \"reason\": \"Protected path. Ask a human to apply this change.\"}\n    return {\"decision\": \"allow\"}\n```\n\n### Example: stop gate\n\n```python\ndef on_stop(event):\n    result = run(\"npm test --silent\")\n    if result.failed:\n        return {\"decision\": \"continue\",\n                \"message\": f\"Tests failing:\\n{result.summary}\\nFix before finishing.\"}\n```\n\nThese are simplified sketches. Real hook interfaces (input format, decision fields, exit codes) differ by product, so follow your harness’s documentation.\n\n### Principle\n\nHooks are where team policy lives. Keep them in version control and review them like code."}, {"id": 61, "title": "Prompt injection inside the harness", "tldr": "Any content an agent reads, including files, web pages, issues, tool results and emails, can contain instructions that hijack it. Harness design must assume injection will sometimes succeed and limit what a hijacked agent can do, especially when private data, untrusted content and outbound communication meet.", "real": "In 2025, Invariant Labs showed that an agent using the GitHub MCP server could be manipulated by a malicious public issue into leaking data from private repositories into a public pull request. Simon Willison described the dangerous combination of private data, untrusted content and external communication as the “lethal trifecta”.", "body": "### Where injection enters a harness\n\n| Source | Example |\n|---|---|\n| Repository files | Malicious comments, README, config |\n| Issues and tickets | Attacker-written text |\n| Web pages | Hidden instructions |\n| Tool results | API responses, search results |\n| MCP tool descriptions | Tool poisoning |\n| Dependencies | Instructions inside packages or docs |\n\n### Harness-level defenses\n\n| Defense | How |\n|---|---|\n| Separate untrusted content | Label it; isolate in subagents without powerful tools |\n| Least privilege | Scoped tokens, minimal tools |\n| Block exfiltration | Network allowlists, no auto-rendered external images |\n| Approval for external actions | Push, send, publish require humans |\n| Monitoring | Detect unusual tool sequences |\n\n### Design rule\n\nNever combine all three trifecta legs in one autonomous session without a human checkpoint. See the AI security course for full coverage."}, {"id": 62, "title": "Least privilege, credentials and secrets", "tldr": "Give agents the minimum access needed for the task: scoped, short-lived credentials tied to the user, no production secrets in development sandboxes, and secrets kept out of prompts, logs and context.", "real": "In August 2025, the compromised “s1ngularity” releases of the Nx build tool included code that invoked AI coding command-line tools installed on developers’ machines to search for secrets and wallets. It showed why agent tools should not run with broad access to credentials on personal machines.", "body": "### Credential practices\n\n| Practice | Why |\n|---|---|\n| Per-task, short-lived tokens | Limit damage if leaked |\n| Minimal scopes (one repo, read-only) | Smaller blast radius |\n| User-bound OAuth | Agent cannot exceed the user’s rights |\n| Secrets via environment, not prompts | Keeps them out of context and logs |\n| Separate dev and prod credentials | Agents never touch prod by default |\n| Secret scanning on outputs and commits | Catch leaks |\n\n### Keep secrets out of context\n\n```\nBad:  \"Use API key sk-live-123… to call the billing API\"\nGood: Tool call billing_get_invoice(id) — the tool server holds the key\n```\n\n### Audit regularly\n\n- Which credentials can each agent reach?\n- Are any long-lived or admin-scoped?\n- Are home directories with keys mounted into sandboxes?"}, {"id": 63, "title": "Guardrails and policy enforcement", "tldr": "Guardrails check inputs, actions and outputs against policy: content filters, schema validators, action allowlists, rate limits and business rules. Put critical policy in code outside the model, and use model-based checks for nuanced cases.", "real": "The OpenAI Agents SDK includes input and output guardrails that run checks alongside the agent and can stop a run when a check trips. Guardrail libraries such as NVIDIA NeMo Guardrails and classifiers such as Meta’s Llama Guard are also used in production agent stacks.", "body": "### Guardrail types\n\n| Type | Example |\n|---|---|\n| Input guardrail | Detect off-topic or malicious requests |\n| Action guardrail | Allowed tools and argument ranges (refund ≤ $100) |\n| Output guardrail | No secrets, no personal data, policy-compliant content |\n| Business rule | Approvals required above thresholds |\n| Rate guardrail | Max actions per minute |\n\n### Code vs model checks\n\n| Check | Implement in |\n|---|---|\n| Hard limits (amounts, paths, recipients) | Code |\n| Format and schema | Code |\n| Nuanced content policy | Classifier or model |\n| Tone and quality | Model-based evaluator |\n\n### Placement\n\n```\nInput → [input guardrail] → agent → [action guardrail per tool call] → tools\n                                   → [output guardrail] → user\n```\n\n### Tip\n\nLog every guardrail trigger with context. They are valuable signals for improving prompts, tools and policies."}, {"id": 64, "title": "Human-in-the-loop design", "tldr": "Decide where humans steer (goals, plans, priorities), approve (risky actions) and review (outcomes). Good human-in-the-loop design keeps people in control of important decisions without forcing them to babysit every step.", "real": "OpenAI’s harness engineering post summarized the role shift as “humans steer, agents execute”: engineers set intent, priorities and constraints and review outcomes, while agents perform most implementation work. Agent frameworks such as LangGraph provide interrupts so a graph can pause for human input and resume.", "body": "### Human roles\n\n| Role | When |\n|---|---|\n| Steer | Define goals, constraints, priorities |\n| Approve | Before risky or irreversible actions |\n| Unblock | Answer questions the agent cannot resolve |\n| Review | Check outcomes before merge or release |\n| Teach | Turn repeated corrections into rules, tests, skills |\n\n### Interaction patterns\n\n| Pattern | Example |\n|---|---|\n| Plan approval | Agent proposes plan; human edits and approves |\n| Checkpoint review | Pause after each milestone |\n| Async questions | Agent posts question, continues other work |\n| Final review | PR review with summary and evidence |\n\n### Reduce human load\n\n- Clear summaries with evidence (tests, screenshots)\n- Batch questions instead of interrupting constantly\n- Escalate only when needed (confidence, risk, policy)\n- Convert recurring reviews into automated checks"}, {"id": 65, "title": "Audit trails and accountability", "tldr": "Every agent action should be traceable: who requested it, what the agent saw, which tools it called with which arguments, what changed, and who approved it. Audit trails support debugging, security investigations and compliance.", "real": "Agent platforms increasingly integrate with standard telemetry. The OpenTelemetry project has defined semantic conventions for generative AI (model calls, token usage, tool calls), so agent activity can flow into the same observability and audit systems used for other software.", "body": "### What to record\n\n| Field | Example |\n|---|---|\n| Requester | User ID, ticket ID |\n| Agent identity and version | Harness version, prompt version, model ID |\n| Inputs | Task, retrieved document IDs |\n| Tool calls | Name, arguments, results (redacted as needed), duration |\n| Approvals | Who approved what, when |\n| Changes | Commits, records modified |\n| Cost | Tokens, dollars |\n| Outcome | Success, failure, escalation |\n\n### Storage and access\n\n- Append-only logs or immutable storage for audit records\n- Redaction of secrets and personal data\n- Role-based access to transcripts\n- Retention aligned with policy\n\n### Accountability principle\n\nAn agent acts on behalf of a person or team. Records must make clear **whose authority** each action used."}, {"id": 66, "title": "Why evaluating agents is hard", "tldr": "Agents take many steps, outputs vary between runs, tasks have multiple valid solutions, and environments have side effects. Agent evaluation needs realistic environments, multiple trials, outcome-based grading and attention to cost and reliability, not just single-run accuracy.", "real": "The tau-bench benchmark from Sierra (2024) introduced a pass^k metric, the probability that an agent succeeds on all k attempts of the same task. It showed that agents with decent single-try success could be much less consistent across repeated trials, which matters for customer-facing deployments.", "body": "### Challenges\n\n| Challenge | Why |\n|---|---|\n| Non-determinism | Same task, different trajectories |\n| Many valid solutions | Exact-match grading fails |\n| Long horizons | Expensive and slow to run |\n| Side effects | Need resettable environments |\n| Grading | Requires tests, rubrics or judges |\n| Cost and latency | Part of quality for agents |\n\n### Principles\n\n- Grade **outcomes** (state of environment, tests passing), not exact steps\n- Run **multiple trials** per task\n- Track **cost, time and steps** alongside success\n- Use **realistic** tasks from your domain\n- Keep a **held-out** set to avoid overfitting the harness\n\n### Two complementary approaches\n\n| Approach | Use |\n|---|---|\n| Public benchmarks | Compare models and harnesses broadly |\n| Private eval suites | Measure what matters for your product |"}, {"id": 67, "title": "Agent benchmarks to know", "tldr": "Public benchmarks cover coding (SWE-bench Verified, Terminal-Bench), tool use with users (tau-bench), computer use (OSWorld), general assistance (GAIA), web browsing (BrowseComp) and task length (METR’s time horizons). Each measures model plus harness, so read setups carefully.", "real": "METR reported in March 2025 that the length of tasks (measured by how long they take skilled humans) that frontier agents can complete with 50% reliability had been doubling roughly every seven months over the previous six years. It is now a widely cited trend line for agent capability.", "body": "### Benchmark overview\n\n| Benchmark | Measures | Notes |\n|---|---|---|\n| SWE-bench Verified | Fixing real GitHub issues | 500 human-validated tasks (OpenAI with SWE-bench authors, 2024) |\n| Terminal-Bench | Tasks in a terminal environment | Shell-heavy agent skills |\n| tau-bench | Tool use with simulated users and policies | pass^k reliability |\n| OSWorld | Computer use across desktop apps | Screenshot-based agents |\n| GAIA | General assistant tasks with tools | Web, files, reasoning |\n| BrowseComp | Hard-to-find information on the web | Persistent browsing |\n| METR time horizons | Length of tasks agents can complete | Trend over model generations |\n\n### Reading results critically\n\n- Which harness and tools were used?\n- How many attempts per task?\n- Were any tasks excluded?\n- What was the cost per task?\n- Is there contamination risk (tasks seen in training)?\n\n### Use for harness work\n\nRun a small subset of a public benchmark with your harness to compare against published numbers and catch harness bugs."}, {"id": 68, "title": "Building your own agent eval suite", "tldr": "Your most important evals come from your own work: real tasks, realistic environments and clear success checks. Start with 20–50 tasks, automate grading where possible, and grow the suite from production failures.", "real": "Teams building coding agents commonly create internal suites from past pull requests and tickets: reset the repository to the commit before a real fix, give the agent the original issue, and grade by running the tests that accompanied the real fix, mirroring how SWE-bench was constructed.", "body": "### Task anatomy\n\n| Field | Example |\n|---|---|\n| Starting state | Repo at commit abc123, seeded database |\n| Instruction | The original ticket text |\n| Allowed tools | Same as production |\n| Success check | Hidden tests pass; no forbidden files changed |\n| Budget | Max turns, time, cost |\n| Tags | Category, difficulty |\n\n### Grading methods\n\n| Method | Use |\n|---|---|\n| Programmatic tests | Code, data transformations |\n| State checks | Database records, files present |\n| Rubric + LLM judge | Writing, research quality |\n| Human review | Sample for calibration |\n\n### Building the suite\n\n```\n1. Collect real tasks (tickets, PRs, support cases)\n2. Make environments reproducible (containers, snapshots)\n3. Write success checks\n4. Run baseline harness 3–5 times per task\n5. Add every serious production failure as a new task\n```\n\n### Avoid overfitting\n\nKeep a held-out set you do not look at while tuning prompts and tools."}, {"id": 69, "title": "Metrics: success, reliability, cost and efficiency", "tldr": "Measure success rate and consistency (pass@k and pass^k), cost per task, time per task, turns and tool calls, intervention rate, and error categories. A harness that is slightly less accurate but far cheaper or more reliable may be better.", "real": "Anthropic reported in its multi-agent research post that token usage alone explained about 80% of the variance in performance on the BrowseComp evaluation, with tool calls and model choice explaining much of the rest. Efficiency and capability metrics are deeply intertwined.", "body": "### Core metrics\n\n| Metric | Definition |\n|---|---|\n| Success rate | % of tasks passed (single attempt) |\n| pass@k | % of tasks solved in at least one of k attempts |\n| pass^k | % of tasks solved in all k attempts (consistency) |\n| Cost per task | Tokens × prices, including cached and uncached |\n| Time per task | Wall-clock duration |\n| Turns / tool calls | Efficiency and loop detection |\n| Intervention rate | % of tasks needing human help |\n| Error taxonomy | Why failures happen (ch. 73) |\n\n### Why pass^k matters\n\n| Agent | pass@1 | pass^4 |\n|---|---|---|\n| A | 70% | 40% |\n| B | 65% | 58% |\n\n(Illustrative.) For customer-facing work, B’s consistency may be more valuable.\n\n### Dashboard per harness version\n\nSuccess, pass^k, median cost, p90 time, top 3 failure categories. Compare every change against the previous version."}, {"id": 70, "title": "Harness A/B testing and regression evals", "tldr": "Treat every harness change (prompt, tool, model, context policy) as an experiment: run it against the eval suite with multiple trials, compare to the baseline with uncertainty in mind, and gate releases on no regressions. Monitor in production after rollout.", "real": "Because agent runs vary, small eval suites can produce noisy comparisons. Anthropic’s multi-agent research post recommended starting evaluation early with small samples (around 20 realistic queries) to catch large effects, then scaling up as the system matures and effects become smaller.", "body": "### Experiment workflow\n\n```\n1. Define change and hypothesis (\"consolidated tool reduces wrong-tool calls\")\n2. Run baseline and candidate on same tasks, k trials each\n3. Compare success, pass^k, cost, time, failure categories\n4. Inspect transcripts for unexpected behavior changes\n5. Ship if better (or equal and cheaper); otherwise revert\n```\n\n### Dealing with noise\n\n| Technique | Why |\n|---|---|\n| Multiple trials per task | Average out variance |\n| Paired comparisons (same tasks) | Reduces noise |\n| Confidence intervals | Avoid chasing random differences |\n| Larger suites for small effects | Detect subtle changes |\n\n### Regression gates in CI\n\n| Gate | Example |\n|---|---|\n| Success rate | Not lower than baseline by more than 2 points |\n| Critical tasks | 100% pass |\n| Cost | Not higher than baseline by more than 15% |\n| Safety tests | 100% pass |\n\n### Production feedback\n\nOnline metrics (user acceptance, edits after agent changes, escalations) validate what offline evals predict."}, {"id": 71, "title": "Tracing agent runs", "tldr": "A trace records every step of an agent run: model calls with prompts and responses, tool calls with inputs and outputs, timings, tokens and costs, organized as nested spans. Traces are the primary debugging tool for harness engineers.", "real": "Agent frameworks ship tracing by default: the OpenAI Agents SDK includes built-in tracing of runs, and platforms such as LangSmith, Langfuse, Arize Phoenix and Braintrust collect agent traces. OpenTelemetry’s generative AI conventions let teams send traces to general observability backends.", "body": "### Trace structure\n\n```\nrun: fix-issue-142 (12m 31s, $1.84, success)\n├── model_call #1 (system 2.1k, history 0.4k → 0.6k out)\n├── tool: search_code(\"createSession\") (0.3s)\n├── tool: read_file(src/auth/session.ts, 1-120) (0.1s)\n├── model_call #2 …\n├── tool: edit_file(src/auth/session.ts) (0.1s)\n├── tool: run_command(\"npm test auth\") (8.4s, exit 1)\n├── model_call #3 …\n└── verifier: tests pass, lint clean\n```\n\n### What to capture per span\n\n| Span type | Fields |\n|---|---|\n| Model call | Model, settings, input/output tokens, cached tokens, latency, stop reason |\n| Tool call | Name, arguments, result size, duration, error flag |\n| Verifier | Checks run, results |\n| Run | Task, outcome, total cost, harness version |\n\n### Practices\n\n- Correlate traces with task IDs and commits\n- Redact secrets and personal data\n- Sample high-volume production traces; keep all failures\n- Make traces easy to share in bug reports"}, {"id": 72, "title": "Reading transcripts and building a failure taxonomy", "tldr": "The fastest way to improve a harness is to read agent transcripts, especially failures. Categorize what went wrong, count categories, and fix the biggest ones with harness changes. Agents can help summarize patterns across many transcripts.", "real": "Anthropic’s engineering posts repeatedly emphasize reading transcripts. For its research agent, it built simulations to watch agents step by step, and found failure modes such as continuing after sufficient results, using overly verbose search queries, and choosing incorrect tools.", "body": "### Failure taxonomy (starting point)\n\n| Category | Example |\n|---|---|\n| Misunderstood task | Solved a different problem |\n| Missing context | Did not find the relevant file or doc |\n| Wrong tool / misuse | Bad arguments, wrong tool chosen |\n| Environment issue | Build broken, service down |\n| Premature completion | Declared done without verification |\n| Looping | Repeated same failing action |\n| Over-engineering | Large unrequested changes |\n| Constraint violation | Edited forbidden files, skipped tests |\n| Model capability limit | Genuinely hard reasoning |\n\n### Process\n\n```\n1. Sample 20–50 failed runs\n2. Label each with one primary category\n3. Count; pick the top category\n4. Design a harness fix (tool, prompt, check, context)\n5. Re-run evals; confirm the category shrinks\n```\n\n### Agent-assisted analysis\n\nFeed batches of transcripts to a model with the taxonomy and ask for labels and examples. Spot-check its labels before trusting them."}, {"id": 73, "title": "Common agent failure modes and fixes", "tldr": "The same failure modes appear across harnesses: premature completion, test tampering, context drift, loops, scope creep, ignored instructions and environment confusion. Each has known harness-level fixes.", "real": "Anthropic’s long-running harness research documented premature completion (declaring a project done too early) and incomplete testing as common failures, addressing them with a feature list of testable items and required end-to-end verification before marking features complete.", "body": "### Failure → fix table\n\n| Failure | Harness fixes |\n|---|---|\n| Premature completion | Feature lists, stop hooks running tests, verifier agents |\n| Test tampering (deleting/weakening tests) | Protect test files, flag test diffs, review gates |\n| Context drift (forgets constraints) | Recite goals in notes, re-inject key rules, compaction quality |\n| Loops | Repetition detection, budgets, escalation |\n| Scope creep | Explicit scope in task, diff size limits, plan approval |\n| Ignored instructions | Move rule into code (hooks, lint), shorter prompts |\n| Hallucinated APIs or files | Require reading before use, type checking, search tools |\n| Environment confusion | Init scripts, smoke tests, clear errors |\n| Over-reliance on one approach | Prompt to consider alternatives after N failures |\n\n### Prevention over cure\n\nMost fixes move a property from “the model should remember” to “the harness ensures”.\n\n### Track trends\n\nAfter each harness release, compare failure category counts. A good release shrinks the top category without growing others."}, {"id": 74, "title": "A debugging workflow for harnesses", "tldr": "Debug agents like distributed systems: reproduce the failure, inspect the trace, find the first wrong step, identify whether the cause was context, tool, instruction, environment or model, make a minimal fix, and add a regression test.", "real": "Practitioners commonly find that the first wrong step in a failed agent run happens long before the visible failure, for example a misread file or a truncated tool output many turns earlier. Traces that show exactly what the model saw at each step are what make this diagnosable.", "body": "### Steps\n\n```\n1. Reproduce: rerun the task (several times; it may be intermittent)\n2. Locate: find the FIRST step where behavior went wrong\n3. Inspect: what did the model see at that step? (full context, not just the last message)\n4. Classify cause: context | tool | instruction | environment | model limit\n5. Fix minimally: one change\n6. Verify: rerun the task k times + related eval subset\n7. Lock in: add the task to the regression suite\n```\n\n### Questions at the first wrong step\n\n| Question | Possible cause |\n|---|---|\n| Was the needed information in context? | Retrieval / context policy |\n| Was it truncated or buried? | Output limits, context ordering |\n| Was the tool description clear? | Tool design |\n| Did the instructions conflict? | Prompt hygiene |\n| Did the environment behave unexpectedly? | Setup, flakiness |\n| Would a stronger model succeed? | Capability limit |\n\n### Tooling tip\n\nBuild a “replay” tool that re-runs a model call with the exact recorded context, so you can test prompt or tool changes on the failing step directly."}, {"id": 75, "title": "Monitoring agents in production", "tldr": "Production monitoring tracks success, cost, latency, errors, guardrail triggers, human interventions and user feedback per harness version. Alert on drift, cost spikes and runaway loops, and sample transcripts for regular review.", "real": "Teams operating customer-facing agents typically review samples of real conversations every week and treat spikes in escalations to humans or in tool errors as early warnings, because model or data changes can degrade agents without any code change on their side.", "body": "### Production dashboard\n\n| Metric | Alert when |\n|---|---|\n| Task success / resolution rate | Drops vs 7-day baseline |\n| Cost per task | Rises sharply |\n| p90 duration | Rises |\n| Tool error rate | Spikes for a tool |\n| Guardrail triggers | Spikes (possible attack or bug) |\n| Human escalations | Rises |\n| Loop detections | Any increase |\n| User feedback | Negative trend |\n\n### Sampling for review\n\n- Random sample of successes (check quality)\n- All failures above a severity level\n- All runs above cost or turn thresholds\n\n### Change awareness\n\nLog harness version, prompt version and model ID on every run. When metrics shift, you can tell whether it followed your release, a model update or a change in user traffic.\n\n### Feedback loop\n\nProduction failures → triage → eval tasks → harness fixes → release → monitor."}, {"id": 76, "title": "Token economics of agents", "tldr": "Agents resend growing context on every step, so input tokens dominate cost, often by a large multiple over output. Cost scales with steps × context size. Caching, trimming, subagents and smaller models for routine steps are the main levers.", "real": "Manus reported an average input-to-output token ratio of around 100:1 in its agent, and Anthropic reported that its agents use about 4 times more tokens than chat interactions, with multi-agent systems using about 15 times more.", "body": "### Why input dominates\n\n```\nStep 1:  input 10k  output 0.5k\nStep 2:  input 11k  output 0.4k\n…\nStep 40: input 60k  output 0.3k\nTotal input ≈ sum of all step contexts (very large); output small\n```\n\n### Cost formula (simplified)\n\n```\nTask cost ≈ Σ over steps [ uncached_input × price_in\n                         + cached_input × price_cache_read\n                         + cache_writes × price_cache_write\n                         + output × price_out ]\n```\n\n### Levers\n\n| Lever | Effect |\n|---|---|\n| Prompt caching | Large savings on repeated prefixes |\n| Trimming tool outputs | Smaller contexts every later step |\n| Fewer steps | Better tools, consolidated operations |\n| Subagents for exploration | Main context stays small |\n| Smaller models for routine steps | Lower price per token |\n| Code execution for data processing | Data stays out of context |\n\n### Measure per task\n\nReport cost per successful task, not just per call. A cheaper harness that fails more often may cost more overall."}, {"id": 77, "title": "Prompt caching in practice", "tldr": "Structure requests so the long, stable prefix (system prompt, tools, early history) is cached, and mark cache breakpoints correctly. Verify hits in API usage fields, and pick cache lifetimes that match how often requests repeat.", "real": "On Anthropic’s API, prompt caching covers the full prefix of tools, system prompt and messages up to a marked breakpoint. A 5-minute cache write costs 1.25 times the base input price and a 1-hour write costs 2 times, while cache reads cost about 0.1 times base input on most models (lower on some newer models). Responses report cache creation and cache read token counts.", "body": "### Implementation checklist\n\n- [ ] Stable content first: tools, system prompt, instruction files\n- [ ] Cache breakpoint after the stable prefix (and optionally at the end of history)\n- [ ] No timestamps, random IDs or reordered tools in the prefix\n- [ ] Deterministic JSON serialization\n- [ ] Check usage fields for cache reads on every call\n- [ ] Choose lifetime: short for rapid agent loops, longer for slower, repeated sessions\n\n### Example (concept)\n\n```python\nresp = client.messages.create(\n    model=MODEL,\n    max_tokens=2048,\n    system=[{\"type\": \"text\", \"text\": SYSTEM_PROMPT,\n             \"cache_control\": {\"type\": \"ephemeral\"}}],\n    tools=TOOLS,\n    messages=history,\n)\nprint(resp.usage)   # includes cache_creation_input_tokens and cache_read_input_tokens\n```\n\n### Common mistakes\n\n| Mistake | Result |\n|---|---|\n| Breakpoint on changing content | Pay write premium every time, never read |\n| Editing early history (e.g. clearing old tool results) | Cache invalidated from that point |\n| Tools added dynamically | Prefix changes |\n\nCheck your provider’s current documentation for exact prices, minimum cacheable lengths and lifetimes."}, {"id": 78, "title": "Model routing and mixing", "tldr": "Not every step needs the most capable model. Route planning, hard reasoning and final review to strong models, and routine steps such as summarization, classification, search and simple edits to faster, cheaper ones, and measure the effect on success.", "real": "Anthropic’s research system paired a more capable lead model with faster subagent models, and many coding tools let users choose different models for planning and execution. Routing is one of the most common ways teams cut agent costs without large quality losses.", "body": "### Routing patterns\n\n| Pattern | Example |\n|---|---|\n| Planner / executor | Strong model plans; smaller model executes steps |\n| Orchestrator / workers | Strong lead; cheaper subagents |\n| Escalation | Start small; escalate on failure or low confidence |\n| Task-type routing | Classify request, pick model per type |\n| Utility calls | Small model for summaries, titles, classification |\n\n### Decision table\n\n| Step type | Model choice |\n|---|---|\n| Ambiguous planning, architecture | Most capable |\n| Debugging hard failures | Most capable |\n| Reading and summarizing files | Fast / small |\n| Formatting, extraction | Small |\n| Final verification judgment | Capable, separate from producer |\n\n### Measure\n\nCompare success, pass^k and cost per task for mixed routing vs single model. Mixed routing helps only if failures do not increase enough to erase the savings."}, {"id": 79, "title": "Latency: making agents faster", "tldr": "Agent latency is the sum of many model calls and tool runs. Reduce it with parallel tool calls, parallel subagents, faster tools and tests, smaller models for simple steps, caching, streaming progress, and fewer unnecessary steps.", "real": "Anthropic reported that introducing parallelization in its research system (the lead agent spinning up subagents in parallel, and subagents using multiple tools in parallel) cut research time by up to 90% for complex queries.", "body": "### Latency sources\n\n| Source | Fix |\n|---|---|\n| Many sequential model calls | Fewer, richer tools; parallel tool calls |\n| Slow tools (tests, builds) | Targeted tests, caching, faster machines |\n| Long contexts | Caching, trimming |\n| Large models for trivial steps | Route to smaller models |\n| Waiting for humans | Async questions, continue other work |\n| Cold environments | Pre-warmed sandboxes, cached dependencies |\n\n### Parallelism opportunities\n\n```\nSequential:  read A → read B → read C → think\nParallel:    [read A, read B, read C] → think\n```\n\n### Perceived latency\n\nStream the agent’s progress (plan, current step, tool activity) so users see work happening. Long silent waits feel broken even when work is progressing.\n\n### Budget latency like cost\n\nSet target p50/p90 durations per task type and track them per harness version."}, {"id": 80, "title": "Budgets, quotas and cost controls", "tldr": "Put explicit spending limits at every level: per step, per task, per user, per team and per month. Combine hard caps with alerts and graceful handoffs, so runaway agents cannot cause large unexpected bills.", "real": "Security researchers at Sysdig documented “LLMjacking” in 2024, where attackers used stolen cloud credentials to run expensive model workloads on victims’ accounts. Budget caps and anomaly alerts protect against both runaway agents and stolen keys.", "body": "### Budget layers\n\n| Layer | Example limit |\n|---|---|\n| Per model call | Max output tokens |\n| Per task | $3 or 200 turns |\n| Per user per day | $20 |\n| Per team per month | $5,000 with alert at 80% |\n| Organization | Provider-level spend limits |\n\n### Graceful handling at the limit\n\n```\nBudget 90% used → agent told to wrap up: summarize progress, commit, write handoff\nBudget 100%     → harness stops the run, saves state, notifies owner\n```\n\n### Cost anomaly signals\n\n- Sudden spike in tasks per user\n- Tasks with far more turns than usual\n- New models or regions in use\n- Spending outside working hours\n\n### Reporting\n\nShow cost per task type and per successful outcome to teams. Visibility changes behavior faster than limits alone."}, {"id": 81, "title": "Matching the harness to the model", "tldr": "Different models respond differently to prompt styles, tool formats, thinking settings and context lengths. Tune the harness to each model you support, follow the provider’s prompting guidance, and re-evaluate whenever you change models.", "real": "Model providers publish model-specific prompting guides. OpenAI, for example, advised developers building on its GPT-4.1 and Codex models to use the apply_patch editing format those models were trained with, and Anthropic’s documentation describes how newer Claude models follow instructions more literally than earlier ones, which changes how prompts should be written.", "body": "### What can differ between models\n\n| Aspect | Example |\n|---|---|\n| Instruction following | Literal vs inferring intent |\n| Tool-call style | Parallel calls, verbosity |\n| Preferred edit formats | Patch vs string replace |\n| Thinking / reasoning modes | Budgets, interleaved thinking |\n| Context length behavior | Quality at long contexts |\n| Verbosity and tone | Need for format instructions |\n\n### Practices\n\n- Keep model-specific prompt variants where needed\n- Store evaluation results per model + harness pair\n- Read release notes and migration guides when upgrading\n- Re-run the full eval suite on model changes\n\n### Upgrade checklist\n\n- [ ] Run eval suite on new model with current harness\n- [ ] Review transcripts for behavior shifts\n- [ ] Adjust prompts that were workarounds for old model weaknesses\n- [ ] Re-check cost and latency\n- [ ] Roll out gradually with monitoring"}, {"id": 82, "title": "Keep the harness simple: the bitter lesson", "tldr": "As models improve, elaborate scaffolding written to work around old weaknesses becomes unnecessary or even harmful. Prefer simple, general mechanisms (good tools, clear goals, feedback), and regularly remove harness complexity that newer models no longer need.", "real": "Richard Sutton’s 2019 essay “The Bitter Lesson” argued that general methods that scale with computation beat hand-engineered knowledge in AI over the long run. Agent builders apply the same idea to harnesses: Anthropic’s guidance repeatedly recommends starting simple and adding complexity only when it demonstrably improves results.", "body": "### Signs of over-engineered harnesses\n\n| Sign | Example |\n|---|---|\n| Many special-case rules | “If the file is YAML and contains X, then…” |\n| Rigid step sequences | Forcing steps the model would choose anyway |\n| Heavy output parsing | Regexes to extract answers instead of tool calls |\n| Prompts with workarounds | “Remember to close brackets” for old model bugs |\n\n### What tends to age well\n\n| Durable investment | Why |\n|---|---|\n| Good tools and environments | Every model benefits |\n| Verification and tests | Objective feedback stays useful |\n| Clear goals and definitions of done | Universal |\n| Observability and evals | Needed to improve anything |\n| Security boundaries | Always required |\n\n### Practice: harness pruning\n\nWith each major model upgrade, try removing scaffolding components one at a time and re-run evals. Keep only what still helps."}, {"id": 83, "title": "Harness portability across models", "tldr": "To avoid lock-in and benefit from new models, keep the harness model-agnostic where possible: an abstraction for model calls, standard tool schemas, MCP for integrations, prompts in separate files, and evals that can run on any model.", "real": "Open-source harnesses such as goose, OpenHands and Aider support multiple model providers, and gateway tools like LiteLLM expose many providers behind one OpenAI-compatible interface. Teams use these to compare models on the same harness and switch when a better or cheaper option appears.", "body": "### Portability layers\n\n| Layer | Portable approach |\n|---|---|\n| Model API | Thin adapter interface (chat, tools, streaming) |\n| Tools | JSON Schema definitions; MCP servers |\n| Prompts | Files with per-model variants where needed |\n| Context policies | Configurable limits per model |\n| Evals | Same suite, any model |\n| Observability | OpenTelemetry-based traces |\n\n### Adapter sketch\n\n```python\nclass ModelClient:\n    def call(self, system: str, messages: list, tools: list) -> Response:\n        \"\"\"Returns text blocks and tool calls in a common format.\"\"\"\n        ...\n\nclass AnthropicClient(ModelClient): ...\nclass OpenAIClient(ModelClient): ...\n```\n\n### Limits of portability\n\nSome features are provider-specific (caching mechanics, built-in tools, edit formats, thinking controls). Use them where valuable, behind feature flags, and keep a portable fallback."}, {"id": 84, "title": "Models trained for harnesses", "tldr": "Frontier models are increasingly trained inside specific agent harnesses, with particular tools and workflows. Using those same tools and conventions often works best. When you design your own harness, align with formats the model already knows.", "real": "OpenAI described its Codex models as trained for agentic coding in Codex environments, and recommended specific tools such as apply_patch for best results. Anthropic provides tools such as its bash and text editor tools for Claude, and describes the Claude Agent SDK as the same agent harness that powers Claude Code.", "body": "### Implications\n\n| Implication | Practice |\n|---|---|\n| Familiar tools perform better | Use provider-defined tools when available |\n| Conventions matter | Match expected file names, formats, workflows |\n| Harness and model co-evolve | Update your harness with model releases |\n| Custom tools still work | But need clearer descriptions and more testing |\n\n### Provider-defined tools (examples)\n\n| Provider | Examples |\n|---|---|\n| Anthropic | Bash tool, text editor tool, computer use, web search, code execution, memory |\n| OpenAI | apply_patch, shell, web search, file search, computer use |\n| Google | Code execution, search grounding |\n\n(Check each provider’s current documentation; tool sets change.)\n\n### Strategy\n\nStart from the provider’s reference harness or SDK where possible, then customize. Building from scratch is educational, but rarely beats a harness co-designed with the model."}, {"id": 85, "title": "Reasoning and thinking budgets", "tldr": "Reasoning models think before answering. Harnesses control how much thinking happens (budgets or effort levels), whether thinking happens between tool calls, and whether previous thinking is kept. More thinking helps hard steps but costs time and tokens.", "real": "Anthropic’s API offers extended thinking with configurable budgets and an effort setting, plus interleaved thinking between tool calls, and OpenAI’s reasoning models expose a reasoning effort parameter. Harnesses commonly raise effort for planning and debugging and lower it for routine steps.", "body": "### Controls\n\n| Control | Effect |\n|---|---|\n| Thinking budget / effort | How much reasoning per response |\n| Interleaved thinking | Reasoning between tool calls, using new results |\n| Thinking retention | Whether earlier reasoning stays in context |\n| Prompted reflection | “Think about what the test failure means before editing” |\n\n### When to spend more thinking\n\n| Step | Thinking |\n|---|---|\n| Initial planning | High |\n| Debugging a confusing failure | High |\n| Choosing between designs | High |\n| Reading files, simple edits | Low |\n| Formatting, summarizing | Minimal |\n\n### Measure the trade-off\n\nRun evals at different effort levels. Plot success vs cost and latency, and pick the point that fits each task type."}, {"id": 86, "title": "Agent-first software development", "tldr": "In agent-first development, engineers design the environment, specify intent and build feedback loops, while agents write most of the code. Productivity depends less on prompting skill and more on the quality of the repository, tests, docs and review systems.", "real": "OpenAI’s February 2026 harness engineering post described a team that built and shipped an internal beta product over five months with roughly a million lines of code, none written manually. Engineers focused on decomposing work, improving the environment, and turning recurring feedback into documentation and automated checks.", "body": "### Shifts in the engineer’s job\n\n| From | To |\n|---|---|\n| Writing code | Specifying intent and acceptance criteria |\n| Fixing bugs by hand | Improving tools and checks so agents fix them |\n| Code review of every line | Reviewing outcomes, evidence and architecture |\n| Tribal knowledge | Documentation in the repo |\n| Manual QA | Agent-executable verification |\n\n### When agents struggle, ask\n\n1. What capability is missing (tool, access, information)?\n2. What check would have caught this?\n3. What doc or rule would have prevented it?\n\nThen add it to the harness so every future run benefits.\n\n### Compounding effect\n\nImprovements to the harness (better docs, tests, constraints) benefit every future task, while individual code changes do not. That is why harness work has high leverage."}, {"id": 87, "title": "Decomposing work for coding agents", "tldr": "Break goals into small, verifiable units that an agent can complete and test in one session. Work depth-first: build foundational pieces first, verify them, then use them to unlock larger tasks. Clear acceptance criteria per unit are essential.", "real": "OpenAI’s harness engineering team described working depth-first: breaking larger goals into smaller building blocks (design, code, review, test), prompting the agent to construct those blocks, and using them to unlock more complex tasks.", "body": "### Good task units\n\n| Property | Example |\n|---|---|\n| Small | One feature, one bug, one refactor |\n| Verifiable | Has tests or a check |\n| Independent | Minimal overlap with other tasks |\n| Clear context | Links to relevant docs and files |\n| Explicit done | Acceptance criteria listed |\n\n### Task template\n\n```markdown\n## Task: Add CSV export to reports page\nContext: docs/reports.md; src/reports/\nAcceptance:\n- Export button on /reports downloads CSV of current filter\n- Columns: date, region, revenue, orders\n- Unit tests for CSV builder; e2e test clicking the button\nConstraints: no new dependencies; follow src/export/ patterns\n```\n\n### Depth-first progression\n\n```\nBuild: data access layer → verify\n  → business logic → verify\n    → API endpoint → verify\n      → UI → verify end to end\n```\n\nEach verified layer becomes reliable ground for the next."}, {"id": 88, "title": "Review loops and human steering", "tldr": "Agent output needs review, but reviewing every line does not scale. Combine automated checks, review agents and focused human review on design, risk and intent. Turn repeated human comments into rules, tests or docs.", "real": "OpenAI’s harness engineering post described moving most review to agent-to-agent loops, with Codex reviewing its own and other agents’ pull requests and iterating on feedback, while humans reviewed when judgment was needed and fed recurring feedback back into the harness.", "body": "### Layered review\n\n| Layer | Reviews |\n|---|---|\n| Automated checks | Tests, lint, types, security scans |\n| Review agent | Correctness, conventions, missing tests |\n| Human reviewer | Design, product intent, risk, architecture |\n\n### Making human review efficient\n\n| Practice | Benefit |\n|---|---|\n| PR summaries with evidence | Faster understanding |\n| Small PRs | Easier to review |\n| Risk labels | Focus attention |\n| Screenshots / recordings | Verify UI quickly |\n| Links to task and test results | Context at hand |\n\n### Closing the loop\n\n```\nHuman comment: \"We never call the payments API directly from controllers.\"\n  → add lint rule + doc entry\n  → future agents get immediate feedback; humans never repeat the comment\n```\n\n### Risk-based depth\n\nPayments, security, migrations and public APIs get deep human review; internal tooling and tests may need only automated and agent review."}, {"id": 89, "title": "Entropy control and garbage collection", "tldr": "Agents replicate patterns they see, including bad ones, so codebases can drift: duplicated code, stale docs, inconsistent patterns. Schedule cleanup work, run background agents that fix drift, and keep “golden” examples current.", "real": "OpenAI’s harness engineering post described this as a form of garbage collection: encoding “golden principles” into the repository and running recurring background tasks in which agents scan for deviations, update quality grades and open targeted refactoring pull requests.", "body": "### Sources of entropy\n\n| Source | Effect |\n|---|---|\n| Copying inconsistent patterns | Drift spreads |\n| Outdated docs | Agents follow wrong guidance |\n| Dead code and flags | Confusion, larger context |\n| Quick fixes accumulating | Technical debt |\n\n### Cleanup mechanisms\n\n| Mechanism | Example |\n|---|---|\n| Scheduled cleanup agents | Weekly: remove dead code, fix lint warnings |\n| Doc freshness checks | Flag docs untouched while related code changed |\n| Golden examples | Reference implementations kept up to date |\n| Quality scores per module | Prioritize refactors |\n| Deprecation tracking | Lists of patterns to migrate away from |\n\n### Rule\n\nBudget a fixed share of agent capacity for maintenance, just as good teams do for human engineering time."}, {"id": 90, "title": "Team workflows: from tickets to merged code", "tldr": "At team scale, harnesses connect to work systems: tickets trigger agent runs in isolated environments, agents open pull requests with evidence, reviewers (agents and humans) approve, CI verifies, and results feed back into tickets and metrics.", "real": "Coding agents now integrate with issue trackers and code hosts. For example, GitHub’s Copilot coding agent can be assigned an issue and opens a pull request, and several agent products accept tasks from Linear, Jira or Slack and report results back as pull requests and comments.", "body": "### Workflow\n\n```\nTicket created ─► triage (human or agent) ─► agent run in sandbox\n      ▲                                           │\n      │                                       PR with evidence\n      │                                           │\n   metrics ◄── merge ◄── human review ◄── review agent + CI\n```\n\n### Ticket quality matters\n\n| Weak ticket | Strong ticket |\n|---|---|\n| “Fix login bug” | Steps to reproduce, expected vs actual, affected files, acceptance criteria |\n\n### Team metrics\n\n| Metric | Meaning |\n|---|---|\n| Agent PR merge rate | Usefulness |\n| Review time per PR | Human load |\n| Rework rate | Quality |\n| Escaped defects | Verification strength |\n| Cost per merged PR | Efficiency |\n\n### Rollout advice\n\nStart with low-risk task types (tests, docs, small bugs), measure, then expand scope as harness and trust mature."}, {"id": 91, "title": "Research agent harnesses", "tldr": "Research agents search, read and synthesize information over many steps. Their harnesses emphasize search tools, parallel subagents, source tracking and citations, stopping rules, and verification of claims against sources.", "real": "OpenAI launched deep research in ChatGPT in February 2025, and Anthropic described its multi-agent research system for Claude in June 2025. Both run many searches over minutes, track sources, and produce cited reports, with harness design choices such as parallel subagents and effort scaling.", "body": "### Harness components\n\n| Component | Purpose |\n|---|---|\n| Query planning | Break question into sub-questions |\n| Search and fetch tools | Find and read sources |\n| Parallel subagents | Explore directions simultaneously |\n| Source store | Track URLs, quotes, dates |\n| Synthesis step | Combine findings into an answer |\n| Citation checker | Verify claims map to sources |\n| Effort scaling | Simple questions get fewer steps |\n\n### Effort scaling rules (example)\n\n| Query type | Budget |\n|---|---|\n| Simple fact | 1 agent, 3–10 tool calls |\n| Comparison | 2–4 subagents, 10–15 calls each |\n| Broad research | More subagents with divided responsibilities |\n\n### Failure modes\n\n- Searching endlessly after enough evidence is found\n- Overly long or overly narrow search queries\n- Over-trusting low-quality or SEO-heavy sources\n- Claims without supporting citations\n\n### Verification\n\nRun a final pass that checks each key claim against stored source text, and flags unsupported statements."}, {"id": 92, "title": "Customer support and business-process agents", "tldr": "Business agents follow policies, use internal tools (orders, refunds, accounts) and talk to customers. Their harnesses prioritize policy enforcement in code, reliable tool use, consistent behavior across runs, escalation to humans, and full audit logs.", "real": "In 2024 Klarna reported that its AI assistant handled two-thirds of customer service chats in its first month. In 2025 the company emphasized that customers should always be able to reach a human, reflecting a common pattern: automate the routine, keep clear human escalation.", "body": "### Harness priorities\n\n| Priority | Implementation |\n|---|---|\n| Policy compliance | Rules in code (refund limits), policy documents in context |\n| Identity and authorization | Tools act only on the authenticated customer’s data |\n| Consistency | Measure pass^k on realistic conversations |\n| Escalation | Clear triggers and smooth handoff with context |\n| Tone and brand | Style guide, output checks |\n| Auditability | Every action logged with reason |\n\n### Escalation triggers\n\n- Customer asks for a human\n- Policy exception requested\n- Low confidence or repeated misunderstanding\n- High-value or sensitive actions\n- Signs of distress or legal threats\n\n### Evaluation\n\nSimulated customers (as in tau-bench) with realistic goals and policies, plus review of real conversation samples each week."}, {"id": 93, "title": "Data analysis agents", "tldr": "Data agents explore datasets, write and run code or SQL, make charts and explain findings. Harnesses provide sandboxed execution, schema and metric documentation, safe database access, result validation and clear reporting of assumptions.", "real": "OpenAI’s Code Interpreter (later Advanced Data Analysis), rolled out to ChatGPT Plus users in July 2023, popularized the pattern of an LLM writing and running Python in a sandbox on uploaded data. Data agents in analytics platforms now apply the same loop to company warehouses.", "body": "### Components\n\n| Component | Purpose |\n|---|---|\n| Code sandbox | Run Python/SQL safely |\n| Schema docs and semantic layer | Correct table and metric definitions |\n| Read-only database roles | Prevent damage |\n| Query limits | Time and row caps |\n| Charting tools | Visual output |\n| Validation checks | Sanity checks on results |\n\n### Analysis loop\n\n```\nUnderstand question → inspect schema/docs → write query → run → check result sanity\n  → iterate → chart → explain with assumptions and caveats\n```\n\n### Com

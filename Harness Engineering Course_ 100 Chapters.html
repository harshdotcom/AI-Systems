<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harness Engineering Course: 100 Chapters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F1F4; --surface:#FFFFFF; --surface-2:#F7F7FA; --ink:#17171F; --muted:#565766; --line:#D9D9E2;
  --accent:#4648B0; --accent-soft:#E3E3F6; --accent-ink:#FFFFFF;
  --amber:#B97A0B; --tldr-bg:#FFF5DC; --tldr-line:#D49A22;
  --indigo:#2E6B42; --real-bg:#E8F2EA; --real-line:#3C8A56;
  --code-bg:#17171F; --code-ink:#E2E2EE; --inline-code:#E6E6EF;
  --cell-empty:#DBDBE5; --shadow:0 1px 0 rgba(23,23,31,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121219; --surface:#191922; --surface-2:#20202B; --ink:#E6E6F0; --muted:#9E9EB0; --line:#2C2C3A;
    --accent:#A3A5F4; --accent-soft:#26274A; --accent-ink:#12133A;
    --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
    --indigo:#8FD3A4; --real-bg:#15261B; --real-line:#4FA36B;
    --code-bg:#0C0C12; --code-ink:#DCDCE8; --inline-code:#262634;
    --cell-empty:#2C2C3A; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121219; --surface:#191922; --surface-2:#20202B; --ink:#E6E6F0; --muted:#9E9EB0; --line:#2C2C3A;
  --accent:#A3A5F4; --accent-soft:#26274A; --accent-ink:#12133A;
  --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
  --indigo:#8FD3A4; --real-bg:#15261B; --real-line:#4FA36B;
  --code-bg:#0C0C12; --code-ink:#DCDCE8; --inline-code:#262634;
  --cell-empty:#2C2C3A; --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header with the memory-bank progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:20px;padding:12px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted)}
.bank{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bank-row{display:flex;gap:4px;flex-wrap:nowrap;min-width:0}
.bank-group{flex:1;min-width:0;display:flex;gap:2px;padding:3px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.cell{flex:1;min-width:2px;max-width:10px;height:18px;border-radius:2px;background:var(--cell-empty);border:0;padding:0;cursor:pointer;transition:background .2s}
.cell.done{background:var(--accent)}
.cell.here{box-shadow:0 0 0 2px var(--amber)}
.bank-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bank-meta strong{color:var(--ink);font-weight:600}
.top-actions{display:flex;gap:8px}
.btn{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.menu-btn{display:none}

/* Shell */
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,76px));height:calc(100dvh - var(--top-h,76px) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg)}
.search{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
.part{margin-bottom:4px}
.part-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:8px;cursor:pointer}
.part-head:hover{background:var(--surface-2)}
.part-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);width:22px;flex:none}
.part-name{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.part-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.part-count.full{color:var(--accent);font-weight:600}
.part-list{list-style:none;margin:0 0 6px;padding:0 0 0 30px;display:none}
.part.open .part-list{display:block}
.ch-row{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:6px}
.ch-row.active{background:var(--accent-soft)}
.ch-row a{flex:1;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.ch-row a .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.tick{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:11px;height:11px;opacity:0}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{opacity:1;color:var(--accent-ink)}
.hidden{display:none!important}

/* Main reading area */
.main{padding:24px 32px 80px;min-width:0}
.crumb{font-size:14px;color:var(--muted);margin:0 0 12px}
.crumb a{color:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;font-size:14px;color:var(--muted);max-width:240px;text-align:left}
.tab .tab-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--cell-empty)}
.tab .dot.on{background:var(--accent)}
article{max-width:780px}
.ch-no{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--accent);font-size:15px;margin:0}
h1.ch-title{font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:6px 0 22px;font-weight:700;text-wrap:balance}
.box{border-radius:10px;padding:16px 18px;margin:0 0 26px;border-left:4px solid}
.box h2{font-size:14px;margin:0 0 6px;font-weight:600}
.box p{margin:0}
.tldr{background:var(--tldr-bg);border-color:var(--tldr-line)}
.tldr h2{color:var(--amber)}
.tldr p{font-size:17px;line-height:1.55}
.real{background:var(--real-bg);border-color:var(--real-line);margin-top:34px}
.real h2{color:var(--indigo)}
.body h3{font-size:20px;margin:30px 0 10px;letter-spacing:-.01em}
.body p{margin:0 0 14px}
.body ul,.body ol{padding-left:22px;margin:0 0 16px}
.body li{margin:4px 0}
.body li input[type=checkbox]{margin-right:6px;accent-color:var(--accent)}
.body code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.88em;background:var(--inline-code);padding:1px 5px;border-radius:4px}
.body pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13.5px;line-height:1.55;margin:0 0 18px}
.body pre code{background:none;padding:0;font-size:inherit;color:inherit}
.table-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.body table{border-collapse:collapse;width:100%;font-size:14px}
.body th,.body td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.body th{background:var(--surface-2);font-weight:600}
.body tr:last-child td{border-bottom:0}
.body strong{font-weight:600}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.complete{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:15px}
.complete .tick{border-color:currentColor;pointer-events:none}
.complete.on{background:var(--accent);color:var(--accent-ink)}
.complete.on .tick{background:var(--accent-ink);border-color:var(--accent-ink)}
.complete.on .tick svg{opacity:1;color:var(--accent)}
.nav{display:flex;gap:8px}
.nav .btn[disabled]{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}

/* Contents view */
.contents h1{font-size:32px;margin:0 0 6px;letter-spacing:-.02em}
.contents .lead{color:var(--muted);margin:0 0 24px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.pcard h2{font-size:15px;margin:0 0 2px;line-height:1.3}
.pcard .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pcard ol{list-style:none;padding:0;margin:0}
.pcard li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13.5px;line-height:1.35}
.pcard li a{color:var(--ink);text-decoration:none;flex:1}
.pcard li a:hover{text-decoration:underline}
.contents-actions{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}

/* Mobile */
.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);height:auto;z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .menu-btn{display:inline-block}
  .main{padding:18px 16px 60px}
  .top-inner{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand{flex:1}
  .bank{order:3;flex-basis:100%}
  .bank-row{gap:3px}
  .bank-group{gap:1px;padding:2px}
  .cell{height:14px;max-width:none}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>

      <div class="bank-meta"><span><strong id="doneCount">0</strong> of 100 chapters complete</span><span id="pct">0%</span></div>
    </div>
    <div class="top-actions"><a class="btn" href="#contents" style="text-decoration:none">Contents</a></div>

</header>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const CHAPTERS = [{"id": 1, "title": "What harness engineering is", "tldr": "The harness is everything around the model that turns it into a working agent: instructions, tools, context management, memory, the control loop, verification, permissions and the environment it acts in. Harness engineering is the discipline of designing, testing and improving that system.", "real": "OpenAI popularized the term in a February 2026 engineering post, “Harness engineering: leveraging Codex in an agent-first world”. It described a team that shipped an internal product with about a million lines of code written by Codex agents over five months, with engineers designing the environment, intent and feedback loops instead of writing code.", "body": "### Model vs harness\n\n```\n            ┌─────────────────────────── HARNESS ───────────────────────────┐\n Task  ───► │ instructions → context assembly → MODEL → tool calls → results │ ───► Outcome\n            │      ▲              memory, state, files          │            │\n            │      └──── verification, feedback, guardrails ◄───┘            │\n            └────────────────────────────────────────────────────────────────┘\n```\n\nThe model predicts the next tokens. The harness decides **what it sees, what it can do, how its actions are checked, and when it stops**.\n\n### What the harness includes\n\n| Component | Question it answers |\n|---|---|\n| Instructions | What is the agent’s job and rules? |\n| Tools | What can it do in the world? |\n| Context management | What does it see at each step? |\n| Memory and state | What persists across steps and sessions? |\n| Control loop | How does it decide, act and continue? |\n| Verification | How do we know the work is correct? |\n| Guardrails and permissions | What is it not allowed to do? |\n| Environment | Where does it run, with which files and services? |\n| Observability | How do humans see what happened? |\n\n### Related terms\n\n| Term | Focus |\n|---|---|\n| Prompt engineering | Wording of instructions |\n| Context engineering | What information the model sees |\n| Harness engineering | The whole system around the model, including tools, loops, checks and environment |"}, {"id": 2, "title": "Why the harness matters as much as the model", "tldr": "The same model can score very differently depending on its harness. Tool design, context handling, feedback loops and stopping rules often decide whether an agent succeeds. Improving the harness is frequently cheaper and faster than waiting for a better model.", "real": "When Anthropic built an agent for the SWE-bench coding benchmark in 2024, it reported spending more time optimizing the tools than the overall prompt. For example, it changed a file-editing tool to require absolute file paths after the model made mistakes with relative paths, which fixed that class of errors.", "body": "### Evidence that harnesses matter\n\n| Observation | Implication |\n|---|---|\n| Leaderboards list the same model with different scaffolds and scores | Results are model + harness, not model alone |\n| Small tool changes fix whole error classes | Interface design matters |\n| Adding tests or verification steps raises success rates | Feedback loops matter |\n| Better context management enables longer tasks | Memory and compaction matter |\n\n### Where improvements usually come from\n\n1. **Clearer tools** (names, descriptions, parameters, outputs)\n2. **Better feedback** (tests, linters, runtime checks the agent can run)\n3. **Leaner context** (only what is needed, when it is needed)\n4. **Explicit state** (task lists, progress files)\n5. **Sensible limits** (budgets, stop conditions, approvals)\n\n### A useful mindset\n\nWhen an agent fails, ask first: “What did the harness let it see, do, and check?” Only after that ask whether the model is the problem."}, {"id": 3, "title": "Anatomy of an agent harness", "tldr": "A production harness has layers: an entry point that receives the task, a context builder, the model call, a tool executor, state and memory stores, a verifier, guardrails, and observability. Each layer can be designed, tested and improved independently.", "real": "Coding agents such as Claude Code, OpenAI’s Codex CLI, Block’s open-source goose and OpenHands share this anatomy: a loop that calls a model with tool definitions, executes tool calls in a controlled environment, feeds results back, and logs everything for review.", "body": "### Reference architecture\n\n```\n┌──────────────┐\n│ Task intake  │  user request, ticket, schedule, API call\n└──────┬───────┘\n       ▼\n┌──────────────┐   system prompt, instruction files, retrieved docs,\n│Context builder│  memory, task state, tool definitions\n└──────┬───────┘\n       ▼\n┌──────────────┐\n│   Model      │  reasoning + tool-call requests\n└──────┬───────┘\n       ▼\n┌──────────────┐   permission check → sandboxed execution → result\n│Tool executor │   (files, shell, browser, APIs, MCP servers)\n└──────┬───────┘\n       ▼\n┌──────────────┐   tests, linters, validators, evaluator models\n│  Verifier    │\n└──────┬───────┘\n       ▼\n┌──────────────┐   progress files, git, databases, memory\n│ State store  │\n└──────────────┘\nObservability (traces, logs, cost) wraps every layer\n```\n\n### Responsibilities by layer\n\n| Layer | Typical decisions |\n|---|---|\n| Intake | Task format, acceptance criteria |\n| Context builder | What to include, order, size limits |\n| Model call | Which model, thinking budget, temperature |\n| Tool executor | Permissions, timeouts, output truncation |\n| Verifier | What counts as done |\n| State store | What persists and where |\n| Observability | What is logged, who can see it |"}, {"id": 4, "title": "The agent loop", "tldr": "At its core an agent is a loop: the model thinks, requests a tool call, the harness executes it and returns the result, and the model continues until it decides it is done or a limit is hit. Most harness engineering is about making this loop reliable.", "real": "The ReAct paper (Yao et al., 2022) showed that interleaving reasoning (“thought”) with actions and observations improved language models on question answering and interactive tasks. Today’s tool-calling APIs from Anthropic, OpenAI and Google implement the same loop natively.", "body": "### The loop\n\n```\nmessages = [system, user_task]\nloop:\n    response = model(messages, tools)\n    if response has no tool calls:\n        return response            # model believes it is done\n    for each tool call:\n        result = execute(tool call)  # with permissions and limits\n        append result to messages\n    if budget exceeded: stop\n```\n\n### What the harness controls in the loop\n\n| Control point | Example |\n|---|---|\n| Before the call | Trim or compact context, inject reminders |\n| After the call | Validate tool arguments, ask for approval |\n| Tool execution | Sandbox, timeout, truncate output |\n| After results | Run checks, add feedback |\n| Loop exit | Verify the result before accepting “done” |\n\n### Parallel tool calls\n\nModern APIs let the model request several tool calls in one turn (for example reading three files at once). The harness can run them concurrently, which cuts latency.\n\n### Key insight\n\nThe model’s “I’m done” is a **claim**, not a fact. Good harnesses verify before ending the loop (Part 11)."}, {"id": 5, "title": "Workflows vs agents, and when not to build an agent", "tldr": "Workflows follow predefined code paths with LLM steps; agents decide their own steps dynamically. Start with the simplest solution: a single call, then a workflow, and only use a full agent when the task genuinely needs flexible, multi-step decisions.", "real": "Anthropic’s December 2024 guide “Building effective agents” described common patterns (prompt chaining, routing, parallelization, orchestrator-workers and evaluator-optimizer) and advised developers to find the simplest solution possible, only increasing complexity when needed.", "body": "### The spectrum\n\n| Approach | Control | Flexibility | Use when |\n|---|---|---|---|\n| Single LLM call | Highest | Lowest | One-step tasks |\n| Prompt chain | High | Low | Fixed sequence of steps |\n| Router | High | Medium | Different handling per input type |\n| Parallelization | High | Medium | Independent subtasks or voting |\n| Orchestrator–workers | Medium | High | Subtasks not known in advance |\n| Evaluator–optimizer | Medium | Medium | Clear quality criteria, iterative refinement |\n| Autonomous agent | Lowest | Highest | Open-ended, multi-step tasks |\n\n### Signals you need an agent\n\n- Number of steps is unknown in advance\n- Next step depends on what was found\n- Task needs exploration (searching code, browsing)\n- Errors must be noticed and corrected along the way\n\n### Signals you do not\n\n- Steps are known and stable\n- Strict compliance or determinism is required\n- Latency and cost must be minimal\n- A failed step is expensive to undo\n\n### Hybrid is common\n\nMany production systems are workflows with agentic steps inside: a fixed pipeline where one step lets an agent explore, followed by deterministic validation."}, {"id": 6, "title": "From prompts to context to harnesses", "tldr": "The field moved from writing clever prompts (2020–2022), to tool use and retrieval (2023), to context engineering for long-running agents (2024–2025), to harness engineering: designing whole environments where agents work for hours (2025–2026).", "real": "Anthropic published “Effective context engineering for AI agents” in September 2025 and “Effective harnesses for long-running agents” in November 2025. OpenAI’s “Harness engineering” post followed in February 2026. Together they mark the shift from single prompts to engineered agent systems.", "body": "### Timeline\n\n| Era | Focus | Typical artifact |\n|---|---|---|\n| 2020–2022 | Prompt engineering | Few-shot prompts, instructions |\n| 2022–2023 | Reasoning and tools | Chain of thought, ReAct, function calling |\n| 2023–2024 | Retrieval and assistants | RAG pipelines, chat assistants |\n| 2024–2025 | Agents and context engineering | Coding agents, MCP, compaction, memory |\n| 2025–2026 | Harness engineering | Long-running agents, agent-legible repos, verification loops |\n\n### What changed to make harnesses central\n\n- Models became reliable at tool use\n- Context windows grew, but quality still degrades with length\n- Tasks lengthened from minutes to hours\n- Coding agents showed large productivity effects when well harnessed\n\n### The new job description\n\nEngineers increasingly design **environments, constraints, feedback and documentation** for agents, and review outcomes, rather than writing every line themselves."}, {"id": 7, "title": "Landmark research behind harness design", "tldr": "Key research ideas still shape harnesses: reasoning plus acting (ReAct), learning to use tools (Toolformer), self-reflection from feedback (Reflexion), skill libraries (Voyager), memory streams (Generative Agents), virtual context (MemGPT) and agent-computer interfaces (SWE-agent).", "real": "The SWE-agent paper from Princeton (2024) introduced the idea of an “agent-computer interface”: custom commands for viewing, searching and editing files, plus a linter that rejects syntactically invalid edits. Designing the interface for the model, not reusing human tools as-is, improved results substantially.", "body": "### Ideas and their harness descendants\n\n| Work | Year | Idea | Where you see it today |\n|---|---|---|---|\n| Chain-of-thought | 2022 | Step-by-step reasoning | Thinking / reasoning modes |\n| ReAct | 2022 | Interleave reasoning and actions | Every tool-use loop |\n| Toolformer | 2023 | Models learn when to call tools | Native tool calling |\n| Reflexion | 2023 | Verbal self-reflection after failures | Retry with feedback |\n| Generative Agents | 2023 | Memory stream, reflection, planning | Agent memory systems |\n| Voyager | 2023 | Growing library of code skills | Skills and reusable procedures |\n| MemGPT | 2023 | Paging memory in and out of context | Compaction and memory tools |\n| Lost in the Middle | 2023 | Models use mid-context information poorly | Context ordering and trimming |\n| SWE-agent | 2024 | Agent-computer interface design | Purpose-built file and edit tools |\n\n### Takeaway\n\nMost “new” harness techniques are refinements of these ideas, adapted to stronger models and longer tasks."}, {"id": 8, "title": "Production harnesses today", "tldr": "Widely used harnesses include coding agents (Claude Code, Codex, Cursor, GitHub Copilot’s agent features, Devin, goose, OpenHands, Aider), general assistants with tools, and research agents. Studying how they work is one of the best ways to learn harness design.", "real": "AGENTS.md, an open format for instructions to coding agents released by OpenAI in August 2025, had been adopted by more than 60,000 open-source projects and agents such as Codex, Cursor, Devin, Gemini CLI, GitHub Copilot, Jules and VS Code by December 2025, according to the Linux Foundation.", "body": "### Categories\n\n| Category | Examples | Distinctive harness features |\n|---|---|---|\n| Terminal coding agents | Claude Code, Codex CLI, Gemini CLI, goose, Aider | Shell and file tools, permissions, instruction files |\n| IDE agents | Cursor, GitHub Copilot, Windsurf, VS Code agent mode | Editor context, diffs, inline review |\n| Cloud coding agents | Codex cloud, Devin, Jules | Remote sandboxes, PR output |\n| Open-source agent platforms | OpenHands | Pluggable tools, evaluation harnesses |\n| Research agents | Deep research products | Search, subagents, citations |\n| Computer-use agents | Browser and desktop agents | Screenshots, clicks, approvals |\n\n### Common features across them\n\n- Instruction files read at session start\n- File, search and shell tools\n- Permission and approval modes\n- Context compaction for long sessions\n- Subagents or parallel tasks\n- Integration with version control\n\n### How to study a harness\n\nRead its docs and, where available, its source code. Watch transcripts: which tools are called, how context grows, how it recovers from errors."}, {"id": 9, "title": "Frameworks and SDKs for building harnesses", "tldr": "You can build harnesses on raw model APIs, or use frameworks: the Claude Agent SDK (the harness behind Claude Code), the OpenAI Agents SDK, LangGraph, Google’s Agent Development Kit, Microsoft’s agent frameworks, and others. Choose based on control, portability and observability needs.", "real": "Anthropic renamed its Claude Code SDK to the Claude Agent SDK in September 2025, describing it as the same infrastructure that powers Claude Code, made available for building other kinds of agents. OpenAI released its Agents SDK in March 2025 with primitives for agents, handoffs, guardrails and tracing.", "body": "### Options\n\n| Option | Strength | Trade-off |\n|---|---|---|\n| Raw API (tool use) | Full control, minimal dependencies | You build everything |\n| Claude Agent SDK | Mature coding-agent harness: tools, compaction, permissions, subagents | Tied to Claude models |\n| OpenAI Agents SDK | Agents, handoffs, guardrails, tracing | Best fit with OpenAI models |\n| LangGraph | Explicit state graphs, checkpoints, human-in-the-loop | More concepts to learn |\n| Google ADK | Multi-agent apps, Google ecosystem | Ecosystem fit |\n| Durable workflow engines (e.g. Temporal) | Reliability for long jobs | Not agent-specific |\n\n### Selection questions\n\n1. Do I need model portability?\n2. How long do tasks run, and do they need checkpoints?\n3. Do I need human approval steps?\n4. What observability do I need?\n5. Can I inspect and modify the framework’s prompts and loop?\n\n### Advice\n\nPrototype on a raw API loop first (ch. 97) so you understand the mechanics. Then adopt a framework where it removes real work, and keep your tools and evals framework-independent."}, {"id": 10, "title": "Open standards: MCP, AGENTS.md and skills", "tldr": "Standards make harness components portable: MCP connects agents to tools and data, AGENTS.md gives agents project instructions, and skills package reusable procedures. Using standards lets you swap models and harnesses without rebuilding integrations.", "real": "In December 2025, the Linux Foundation formed the Agentic AI Foundation with founding projects Anthropic’s Model Context Protocol, Block’s goose and OpenAI’s AGENTS.md. The Linux Foundation said more than 10,000 MCP servers had been published by then.", "body": "### The standards\n\n| Standard | Purpose | Format |\n|---|---|---|\n| Model Context Protocol (MCP) | Connect agents to tools, data and prompts | Client–server protocol (stdio or HTTP) |\n| AGENTS.md | Project instructions for coding agents | Markdown file in the repo |\n| Agent Skills | Packaged instructions, scripts and resources loaded on demand | Folder with a SKILL.md file |\n| OpenTelemetry GenAI conventions | Standard traces for AI calls | Telemetry spans and attributes |\n\n### How they fit together\n\n```\nHarness\n ├── reads AGENTS.md at start (project rules)\n ├── loads skills on demand (procedures)\n ├── connects to MCP servers (tools and data)\n └── emits OpenTelemetry traces (observability)\n```\n\n### Benefits\n\n- Write a tool integration once, use it in many agents\n- Move between agent products without rewriting instructions\n- Shared security and governance practices\n\n### Caution\n\nStandards do not make components trustworthy. MCP servers and skills are code and text you are choosing to trust (see the AI security course)."}, {"id": 11, "title": "Writing the system prompt for an agent", "tldr": "An agent’s system prompt sets its role, goals, working style, rules and how to use tools. Write it at the “right altitude”: specific enough to guide behavior, general enough to handle situations you did not foresee. Avoid long lists of brittle if-then rules.", "real": "Anthropic’s context engineering guidance (September 2025) describes two failure modes: prompts that hardcode complex, brittle logic, and prompts so vague they give the model no concrete signals. It recommends a minimal set of clear instructions, organized into sections, then adding detail based on observed failures.", "body": "### Recommended structure\n\n```text\n<role>         Who the agent is and who it serves\n<goal>         What success looks like\n<environment>  What it can access (tools, files, systems)\n<workflow>     How to approach tasks (explore, plan, act, verify)\n<rules>        Hard constraints (never push to main, never delete data)\n<style>        Communication format for updates and final answers\n<done>         Definition of done and how to verify it\n```\n\n### Good vs weak instructions\n\n| Weak | Better |\n|---|---|\n| “Be careful.” | “Before editing a file, read it. After editing, run the relevant tests.” |\n| “Don’t break things.” | “Never run destructive commands (rm -rf, DROP TABLE) without explicit user approval.” |\n| 40 rules for edge cases | A few principles plus examples of the hardest cases |\n| “Always use tool X” | Explain when and why tool X is the right choice |\n\n### Tips\n\n- Explain **why** a rule exists; models generalize better from reasons\n- Put stable content first (helps prompt caching, ch. 19)\n- Keep it short; move details into files the agent reads when needed (ch. 13)\n- Test changes against an eval suite before shipping (ch. 15)"}, {"id": 12, "title": "Instruction files: AGENTS.md and CLAUDE.md", "tldr": "Instruction files in a repository tell agents how the project works: build and test commands, conventions, architecture pointers and rules. They load automatically at session start, so they must be short, accurate and maintained like code.", "real": "OpenAI released AGENTS.md as an open format in August 2025, and Claude Code reads CLAUDE.md files in a similar way. OpenAI’s harness engineering post described keeping the main instruction file short, as a map pointing to deeper documentation, rather than one giant manual.", "body": "### What to include\n\n| Section | Example content |\n|---|---|\n| Project overview | One paragraph on what the system does |\n| Commands | How to install, build, test, lint, run |\n| Conventions | Code style, naming, patterns to follow |\n| Architecture map | Where key modules live; links to design docs |\n| Rules | What never to do (e.g. edit generated files) |\n| Definition of done | Tests pass, lint clean, docs updated |\n\n### Example\n\n```markdown\n# AGENTS.md\n## Commands\n- Install: `pnpm install`\n- Test: `pnpm test` (run before every commit)\n- Lint: `pnpm lint --fix`\n\n## Architecture\nSee docs/ARCHITECTURE.md. API handlers in src/api/, domain logic in src/core/.\n\n## Rules\n- Never edit files in src/generated/ (regenerate with `pnpm codegen`).\n- Every new endpoint needs an integration test in tests/api/.\n```\n\n### Maintenance practices\n\n- Review instruction files in code review like any other file\n- Delete outdated rules; stale instructions mislead agents\n- Use nested files for subprojects in monorepos\n- Measure: if agents keep making the same mistake, add or fix a rule"}, {"id": 13, "title": "A map, not a manual: progressive disclosure", "tldr": "Do not load everything into the context up front. Give the agent a short map of what exists and where, and let it pull details when needed through file reads, search or skills. This keeps context lean and relevant.", "real": "OpenAI’s harness engineering post summarized its first lesson as giving Codex “a map, not a 1,000-page instruction manual”. Anthropic’s Agent Skills (introduced in 2025) use the same principle: only a short description of each skill is loaded at first, and the full instructions are read only when the skill is relevant.", "body": "### Three levels of disclosure\n\n| Level | Loaded when | Example |\n|---|---|---|\n| 1. Index | Always | List of docs and skills with one-line descriptions |\n| 2. Main document | When relevant | docs/payments.md |\n| 3. Details | When needed | Reference tables, scripts, examples |\n\n### Example index in an instruction file\n\n```markdown\n## Where to find things\n- docs/ARCHITECTURE.md — system overview (read first for cross-module work)\n- docs/payments.md — payment flows and invariants\n- docs/testing.md — test strategy, fixtures, how to run e2e tests\n- skills/release/ — steps for cutting a release\n```\n\n### Why it works\n\n- Context stays small, so attention stays on what matters\n- Documents can be detailed without cluttering every session\n- Agents learn to look things up, like human engineers\n\n### Pitfall\n\nIf the index is wrong or stale, agents miss documents entirely. Keep the map accurate and check it in reviews."}, {"id": 14, "title": "Examples and few-shot prompting in agents", "tldr": "Examples are powerful for showing desired behavior, but in agents they can cause imitation: the model repeats the pattern of past actions even when it no longer fits. Use diverse, canonical examples and vary formats to avoid lock-in.", "real": "In its July 2025 post on context engineering, the team behind the Manus agent warned “don’t get few-shotted”: when an agent’s context fills with many similar past action-observation pairs, the model tends to follow the pattern and can drift or overgeneralize, so they introduce structured variation.", "body": "### When examples help\n\n| Use | Example |\n|---|---|\n| Output formats | A sample status update or report |\n| Tool usage | One clear example of a complex tool call |\n| Judgment calls | Examples of when to ask vs proceed |\n| Style | Commit message examples |\n\n### When examples hurt\n\n- Many similar repeated steps in history (the agent keeps doing the same thing)\n- Examples that cover only easy cases\n- Long example blocks that crowd out task context\n\n### Practices\n\n- Prefer a few **diverse, canonical** examples over many similar ones\n- Label examples clearly as examples\n- Vary phrasing and order in templates the harness injects\n- Remove examples that no longer reflect desired behavior\n\n### Self-generated examples\n\nAn agent’s own history acts as examples for its next steps. Compaction and summarization (ch. 32) can break unhelpful repetition patterns."}, {"id": 15, "title": "Versioning and testing prompts and instructions", "tldr": "Treat prompts, instruction files and tool descriptions as code: version them, review changes, and run evaluation suites before deploying. Small wording changes can shift agent behavior in unexpected ways.", "real": "Teams building on tools like promptfoo, Braintrust, LangSmith and similar platforms commonly run prompt changes against regression test sets in continuous integration, because informal spot checks repeatedly miss regressions that only appear on a minority of tasks.", "body": "### What to version\n\n| Artifact | Why |\n|---|---|\n| System prompt | Core behavior |\n| Instruction files | Project guidance |\n| Tool names, descriptions, schemas | Tool selection behavior |\n| Injected reminders and templates | Mid-task behavior |\n| Model ID and settings | Behavior changes across versions |\n\n### Change process\n\n```\nEdit prompt → run eval suite (multiple samples per task) → compare to baseline\n  → review diffs in transcripts → ship if no regressions → monitor in production\n```\n\n### Test types\n\n| Test | Checks |\n|---|---|\n| Task success | Does the agent complete representative tasks? |\n| Rule adherence | Does it obey hard constraints? |\n| Tool choice | Does it pick the right tools? |\n| Cost and steps | Did efficiency change? |\n| Safety | Does it refuse or escalate correctly? |\n\n### Tip\n\nStore a “golden set” of 20–100 real tasks with clear pass criteria. It catches most regressions cheaply."}, {"id": 16, "title": "Context is a finite resource", "tldr": "Even with very large context windows, model performance tends to degrade as context grows, and information in the middle of long contexts is used less reliably. Treat context as an attention budget: every token included competes with every other.", "real": "Chroma’s 2025 “Context Rot” study tested 18 models and found performance generally declined as input length increased, even on simple tasks. The 2023 “Lost in the Middle” paper showed models used information at the beginning and end of long contexts better than information in the middle.", "body": "### Why more context is not always better\n\n| Effect | Description |\n|---|---|\n| Attention dilution | More tokens compete for limited attention |\n| Distractors | Irrelevant but similar content misleads |\n| Position effects | Middle content is used less reliably |\n| Cost and latency | Every token costs money and time |\n| Cache misses | Changing early content invalidates caches |\n\n### The attention budget mindset\n\n```\nAsk for every piece of context:\n  Does the model need this for the next decision?\n  Could it fetch this itself when needed?\n  Is there a shorter form (summary, reference, ID)?\n```\n\n### Signs of context problems\n\n- The agent forgets constraints stated earlier\n- It repeats work already done\n- It confuses details from different files or tasks\n- Quality drops late in long sessions\n\n### Responses\n\nJust-in-time retrieval (ch. 18), trimming tool outputs (ch. 20), compaction (ch. 32), notes files (ch. 33) and subagents (ch. 47)."}, {"id": 17, "title": "What goes into the context window", "tldr": "Context is assembled from system instructions, tool definitions, instruction files, retrieved documents, memory, conversation history, tool results and injected reminders. Measure how much each part uses, because tool definitions and tool results often dominate.", "real": "Anthropic reported in November 2025 that tool definitions from many connected MCP servers can consume tens of thousands of tokens before an agent reads the user’s request, which motivated features such as on-demand tool search and calling tools from code.", "body": "### Typical context composition (illustrative, coding agent mid-task)\n\n| Component | Share | Notes |\n|---|---|---|\n| System prompt | Small | Stable, cacheable |\n| Tool definitions | Small to large | Grows with every connected server |\n| Instruction files | Small | Should be short maps |\n| Conversation history | Medium | Grows each turn |\n| Tool results | Often largest | File contents, command outputs |\n| Memory / notes | Small | Summaries and state |\n\n### Measure it\n\nLog token counts per component for every model call. You cannot optimize what you do not measure.\n\n```\ncall 37: system=2.1k tools=14.8k history=31.0k tool_results=58.3k total=106.2k\n```\n\n### Ordering guidance\n\n1. Stable content first (system prompt, tool definitions): better caching\n2. Task-specific instructions and state next\n3. Recent history and results last, where the model attends well\n\n### Budget rules\n\nSet per-component caps, for example: tool results truncated to N tokens each, history compacted above a threshold, retrieved documents limited to the top few."}, {"id": 18, "title": "Just-in-time retrieval vs loading up front", "tldr": "Instead of pre-loading all possibly relevant data, give the agent lightweight references (file paths, queries, IDs) and tools to fetch details when needed. Combine with a small amount of up-front context for speed.", "real": "Claude Code explores codebases with search and file-reading tools (glob, grep-style search, reading files) rather than pre-indexing an entire repository into the prompt. Anthropic’s context engineering post describes this hybrid: load a few key files like CLAUDE.md up front, and let the agent navigate for the rest.", "body": "### Comparison\n\n| Strategy | Strength | Weakness |\n|---|---|---|\n| Load everything up front | Fast first answer | Context bloat, distractors |\n| Pure just-in-time | Lean, fresh data | Slower, needs good tools |\n| Hybrid | Balanced | Needs judgment on what to preload |\n\n### Reference-based context\n\n```\nInstead of: [full 4,000-line log file]\nGive:       \"Logs are in logs/app.log (4,000 lines). Use grep or tail to inspect.\"\n```\n\n### Tools that enable just-in-time context\n\n| Tool | Use |\n|---|---|\n| File search (glob, grep) | Find relevant files |\n| Read file with line ranges | Read only the needed part |\n| Semantic search | Find concepts across docs |\n| Database queries | Fetch specific records |\n| Web search / fetch | Current external information |\n\n### When to preload\n\n- Information needed in almost every task (project rules)\n- Small, stable references\n- Latency-critical first responses"}, {"id": 19, "title": "Designing context for caching", "tldr": "Prompt caching makes repeated prefixes much cheaper and faster. Agents resend the growing history on every step, so keeping the prefix stable (fixed system prompt, stable tool list, append-only history) can cut costs dramatically.", "real": "The Manus team wrote in 2025 that the KV-cache hit rate was the single most important metric for its production agent, noting that its agents’ input-to-output token ratio averaged around 100:1. On Anthropic’s API, cache reads cost about a tenth of normal input tokens (less on some newer models), while 5-minute cache writes cost 1.25 times the input price.", "body": "### How caching works (simplified)\n\n```\nCall 1: [system][tools][msg1]                → write cache\nCall 2: [system][tools][msg1][msg2]          → read cached prefix, process only msg2\nCall 3: [system][tools][msg1][msg2][msg3]    → read cached prefix, process only msg3\n```\n\nAny change early in the prompt invalidates everything after it.\n\n### Cache-friendly rules\n\n| Rule | Why |\n|---|---|\n| Stable system prompt (no timestamps at the top) | Prefix stays identical |\n| Fixed tool list order | Tool definitions stay cached |\n| Append-only history | Earlier messages never change |\n| Deterministic serialization (sorted JSON keys) | Same content gives same tokens |\n| Put changing data at the end | Later tokens only |\n\n### Tension with tool loading\n\nAdding or removing tools mid-session breaks the cache. Alternatives: keep tools stable and restrict which ones may be used (masking), or use a tool-search mechanism designed for caching (ch. 27).\n\n### Measure\n\nTrack cache hit rate and cost per task. A drop usually means something started changing early in the prompt."}, {"id": 20, "title": "Context hygiene: trimming and clearing", "tldr": "Tool outputs are the largest source of context bloat. Truncate long outputs, summarize them, store full versions in files, and clear stale tool results once their information has been used. Keep errors visible long enough for the agent to learn from them.", "real": "Anthropic’s guidance on writing tools noted that Claude Code limits tool responses to 25,000 tokens by default, and recommended pagination, filtering and truncation with helpful messages. Anthropic later added context-editing features that clear older tool results automatically as a session grows.", "body": "### Techniques\n\n| Technique | How |\n|---|---|\n| Truncation | Cap output size; say what was cut and how to get more |\n| Pagination | Return page 1 of N with a next-page parameter |\n| Filtering | Let tools accept filters (e.g. errors only) |\n| Summarize-then-store | Write full output to a file, return a summary and the path |\n| Clear stale results | Replace old tool outputs with a short placeholder |\n| Deduplicate | Do not re-insert the same file contents twice |\n\n### Example truncation message\n\n```\n[Output truncated: showing first 200 of 12,480 lines.\n Full output saved to /tmp/test-run-42.log.\n Tip: grep for \"FAIL\" to find failing tests.]\n```\n\n### What not to remove\n\n- Recent errors and failed attempts (they prevent repeating mistakes)\n- The current plan and task list\n- Hard constraints from the user\n\n### Rule of thumb\n\nKeep **decisions and findings**; drop **raw material** that has already been digested."}, {"id": 21, "title": "Tools are the agent-computer interface", "tldr": "Tools are how an agent perceives and changes the world. Design them for a model, not a human: clear purpose, unambiguous parameters, outputs that are informative and compact, and errors that explain how to recover.", "real": "Anthropic’s September 2025 post “Writing effective tools for agents — with agents” argued that tools are a new kind of software: a contract between deterministic systems and non-deterministic agents. It recommended building prototypes, running evaluations, and letting agents themselves analyze transcripts to improve tool designs.", "body": "### Human interface vs agent interface\n\n| Human tool | Agent-oriented tool |\n|---|---|\n| Interactive UI, menus | Single call with explicit parameters |\n| Output for the eye (colors, tables) | Plain, structured, token-efficient text |\n| Errors shown as codes | Errors with cause and next step |\n| Many small commands | Fewer, task-shaped operations |\n| Assumes memory of previous screens | Each call self-contained |\n\n### Properties of good tools\n\n- **Clear purpose:** one job, described in plain words\n- **Obvious inputs:** typed, named, with examples\n- **Meaningful outputs:** what the agent needs for the next step\n- **Safe by default:** dry runs, confirmations for destructive actions\n- **Predictable:** same input, same behavior\n\n### Remember\n\nThe model only knows a tool through its name, description, schema and the results it returns. Those four things are the entire interface."}, {"id": 22, "title": "Designing tool schemas and descriptions", "tldr": "Write tool descriptions like onboarding docs for a new teammate: what the tool does, when to use it and when not to, what each parameter means, formats and examples. Use precise parameter names and types, and avoid ambiguous names like “id” or “data”.", "real": "Anthropic’s tool-writing guidance noted that small refinements to tool descriptions produced large improvements on evaluations, and recommended unambiguous parameter names such as user_id instead of user. Model providers’ documentation generally advises detailed descriptions as the most important factor in tool performance.", "body": "### Example: weak vs strong\n\n```json\n{ \"name\": \"search\", \"description\": \"Search stuff\",\n  \"input_schema\": { \"type\": \"object\", \"properties\": { \"q\": { \"type\": \"string\" } } } }\n```\n\n```json\n{\n  \"name\": \"search_tickets\",\n  \"description\": \"Search support tickets by text and status. Use this to find existing tickets before creating a new one. Returns up to `limit` tickets with id, title, status and last update. Does not return ticket bodies; call get_ticket for full details.\",\n  \"input_schema\": {\n    \"type\": \"object\",\n    \"properties\": {\n      \"query\":  { \"type\": \"string\", \"description\": \"Words to match in title or body, e.g. 'refund delayed'\" },\n      \"status\": { \"type\": \"string\", \"enum\": [\"open\", \"pending\", \"closed\", \"any\"], \"description\": \"Filter by status. Default 'open'.\" },\n      \"limit\":  { \"type\": \"integer\", \"minimum\": 1, \"maximum\": 50, \"description\": \"Max results. Default 10.\" }\n    },\n    \"required\": [\"query\"]\n  }\n}\n```\n\n### Checklist\n\n- [ ] Name says what it does (verb_object)\n- [ ] Description covers when to use and when not to\n- [ ] Every parameter has a description and example\n- [ ] Enums for fixed choices\n- [ ] Defaults stated\n- [ ] Output shape described\n- [ ] Related tools referenced"}, {"id": 23, "title": "How many tools: consolidation and namespacing", "tldr": "More tools mean more confusion and more context. Consolidate related operations into task-shaped tools, remove tools that are rarely useful, and namespace tools by service so the agent can tell similar ones apart.", "real": "Anthropic’s tool guidance gave examples of consolidation, such as a single schedule_event tool that finds availability and books a meeting instead of separate list_users, list_events and create_event tools. It also recommended prefixes like asana_search and jira_search to distinguish services.", "body": "### Consolidation examples\n\n| Many low-level tools | One task-shaped tool |\n|---|---|\n| list_users, list_events, create_event | schedule_event |\n| read_logs (returns everything) | search_logs (returns relevant lines with context) |\n| get_customer, list_transactions, list_notes | get_customer_context |\n\n### Namespacing\n\n```\ngithub_search_issues      jira_search_issues\ngithub_create_pr          slack_post_message\n```\n\nPrefixes reduce wrong-tool calls when several services offer similar actions.\n\n### Signs you have too many tools\n\n- The agent calls the wrong tool for a task\n- It asks which tool to use\n- Tool definitions take a large share of context\n- Evaluations improve when you remove tools\n\n### Strategies at scale\n\n| Strategy | When |\n|---|---|\n| Curate per agent | Each agent gets only its tools |\n| Tool search | Hundreds of tools available, few needed per task (ch. 27) |\n| Code APIs | Agent writes code against libraries instead of calling many tools (ch. 26) |"}, {"id": 24, "title": "Tool outputs and error messages", "tldr": "Tool results should return what the agent needs for its next decision, in a compact, readable form: human-meaningful identifiers instead of opaque IDs, relevant fields only, truncated with guidance, and errors that state what went wrong and how to fix it.", "real": "Anthropic recommended returning natural-language names and meaningful fields rather than low-level technical identifiers like UUIDs and MIME types, and offering a response_format option (concise or detailed) so agents can control verbosity. It reported that resolving identifiers to meaningful language reduced hallucinations in retrieval tasks.", "body": "### Output design\n\n| Principle | Example |\n|---|---|\n| Relevant fields only | name, status, owner; not 40 metadata fields |\n| Meaningful identifiers | “invoice INV-2041 (Acme Ltd)” not “a7f3e2c1-…” |\n| Verbosity control | response_format: “concise” or “detailed” |\n| Structure when useful | Short JSON or markdown tables |\n| Truncation with guidance | “Showing 20 of 340; use page=2” |\n\n### Error messages that help\n\n| Unhelpful | Helpful |\n|---|---|\n| `Error 400` | `start_date must be YYYY-MM-DD; received '12/05/2026'.` |\n| `Not found` | `No file at src/util.ts. Did you mean src/utils.ts?` |\n| `Permission denied` | `Writing to /etc is not allowed. Use the project directory.` |\n| Stack trace | One-line cause plus the relevant trace lines |\n\n### Mark errors explicitly\n\nMost tool-calling APIs let you flag a result as an error (for example `is_error: true` in Anthropic’s tool_result). The model then knows to adjust instead of treating the text as data."}, {"id": 25, "title": "Evaluating and improving tools", "tldr": "Improve tools with evidence: build realistic tasks, run the agent, measure success, tool errors, call counts and tokens, read transcripts, then refine. Agents themselves can analyze transcripts and propose better tool descriptions.", "real": "Anthropic described using Claude to analyze evaluation transcripts and rewrite its own tool descriptions and implementations, and reported that agent-optimized tools outperformed versions written by human experts on held-out test sets in its internal experiments.", "body": "### Tool evaluation loop\n\n```\n1. Write 20–100 realistic tasks that need the tools\n2. Run the agent; record transcripts\n3. Measure: success, wrong-tool calls, invalid arguments, retries, tokens\n4. Read failing transcripts (or have an agent summarize patterns)\n5. Change one thing: name, description, parameters, output, consolidation\n6. Re-run; keep changes that improve metrics on held-out tasks\n```\n\n### Metrics per tool\n\n| Metric | Signals |\n|---|---|\n| Call frequency | Is it used at all? |\n| Error rate | Confusing parameters |\n| Calls per task | Too low-level? |\n| Tokens returned | Too verbose? |\n| Wrong-tool rate | Ambiguous naming |\n\n### Common fixes\n\n| Symptom | Fix |\n|---|---|\n| Invalid arguments | Better descriptions, enums, examples |\n| Repeated calls to get context | Consolidate into a richer tool |\n| Huge outputs | Filters, pagination, concise mode |\n| Wrong tool chosen | Rename, namespace, clarify when-to-use |"}, {"id": 26, "title": "Code execution as a tool", "tldr": "Letting an agent write and run code (in a sandbox) gives it a very flexible tool: it can chain many operations, filter large data before it enters context, and use libraries. Exposing tool integrations as code APIs can greatly reduce tokens.", "real": "In November 2025, Anthropic described presenting MCP servers to agents as code APIs that the agent calls from a code-execution environment, instead of loading every tool definition into context. In one example, token use fell from about 150,000 to about 2,000, a reduction of roughly 98.7%.", "body": "### Direct tool calls vs code\n\n```\nDirect tools:\n  call get_sheet(id) → 10,000 rows enter context → model filters → call update_crm(...)\n\nCode execution:\n  rows = sheets.get(id)\n  pending = [r for r in rows if r.status == \"pending\"]\n  print(len(pending), pending[:5])          → only a summary enters context\n```\n\n### Benefits\n\n| Benefit | Why |\n|---|---|\n| Fewer tokens | Data processed outside the context |\n| Composition | Loops, conditionals, retries in code |\n| Privacy | Sensitive data can stay in the sandbox |\n| Reuse | Agents can save useful scripts as skills |\n\n### Requirements\n\n- Strong sandbox (no secrets, controlled network, resource limits)\n- Clear API documentation the agent can read on demand\n- Output limits on what is printed back\n\n### When to prefer direct tools\n\nSimple, single actions; strict auditing of every action; environments where running code is not allowed."}, {"id": 27, "title": "Tool search and dynamic tool availability", "tldr": "When an agent has access to many tools, load only what is needed: provide a searchable tool index, mask unavailable tools rather than deleting them mid-session, or route to specialized subagents with small toolsets.", "real": "Manus described masking tool choices during decoding instead of adding and removing tool definitions, because changing definitions mid-session breaks the KV cache and can confuse the model about earlier calls. Anthropic later released a tool search capability so agents can discover tools on demand from large tool libraries.", "body": "### Approaches\n\n| Approach | How | Trade-off |\n|---|---|---|\n| Static curated set | Fixed small list per agent | Simple; limited reach |\n| Tool search | Agent searches an index, then loads matching tool definitions | Scales; extra step |\n| Masking | Definitions stay; harness constrains which can be called now | Cache-friendly; needs decoding control or prompt rules |\n| Subagent routing | Different agents own different toolsets | Clean separation; coordination cost |\n| Code APIs | Tools as importable modules (ch. 26) | Very scalable; needs sandbox |\n\n### State-based availability\n\n```\nState: \"planning\"   → allowed: read, search\nState: \"editing\"    → allowed: read, search, edit, run_tests\nState: \"releasing\"  → allowed: run_tests, create_pr (no direct push)\n```\n\nRestricting tools by phase reduces mistakes and risk.\n\n### Design tip\n\nTool names with consistent prefixes (browser_, shell_, git_) make masking and search easier."}, {"id": 28, "title": "Shell and file-editing tools", "tldr": "Coding agents depend on a few core tools: read files (with line ranges), search, edit files, and run shell commands. Edit format matters: exact string replacement, unified diffs or patches each have trade-offs in reliability and token use.", "real": "Anthropic’s text editor tool for Claude uses commands like view, str_replace and create, where str_replace requires the old text to match exactly once. OpenAI’s Codex models were trained to use an apply_patch tool with a specific patch format, which OpenAI recommends using when building on those models.", "body": "### Core coding tools\n\n| Tool | Purpose | Key design points |\n|---|---|---|\n| read_file | View content | Line ranges, line numbers, size limits |\n| search (grep/glob) | Find code | Regex, file filters, result caps |\n| edit_file | Modify code | Unambiguous matching, clear errors |\n| create_file | New files | Refuse to overwrite silently |\n| run_command | Build, test, git | Timeouts, output caps, permissions |\n\n### Edit formats compared\n\n| Format | Strength | Weakness |\n|---|---|---|\n| Whole-file rewrite | Simple | Expensive for big files, risk of accidental changes |\n| Exact string replace | Precise, verifiable | Fails if text is not unique or has drifted |\n| Unified diff / patch | Compact, multi-hunk | Formatting errors common without training |\n| Line-number edits | Simple | Breaks after earlier edits shift lines |\n\n### Practices\n\n- Require reading a file before editing it\n- Reject edits that produce syntax errors (lint on edit, as in SWE-agent)\n- Return a short snippet of the edited region for confirmation\n- Use the edit format the model was trained on when possible"}, {"id": 29, "title": "Browser and computer-use tools", "tldr": "Browser and computer-use tools let agents operate websites and desktop apps through screenshots, clicks and typing, or through structured page access (DOM, accessibility tree). They unlock end-to-end verification and legacy workflows, but are slower and need strict safety controls.", "real": "Anthropic released computer use for Claude in October 2024, and OSWorld became a standard benchmark for computer-use agents. Anthropic’s long-running harness research found that giving coding agents browser automation (via a Puppeteer MCP server) to test features end to end, as a user would, substantially improved their ability to catch bugs.", "body": "### Interaction modes\n\n| Mode | How | Strength | Weakness |\n|---|---|---|---|\n| Screenshot + coordinates | Vision model clicks pixels | Works on any UI | Slow, fragile with layout changes |\n| DOM / accessibility tree | Structured element access | Precise, cheaper | Needs web technology access |\n| Scripted automation (Playwright, Puppeteer) | Agent writes test scripts | Repeatable | Requires coding |\n\n### Uses in harnesses\n\n| Use | Example |\n|---|---|\n| Verification | Open the app and test the new feature |\n| Research | Browse documentation, gather data |\n| Operations | Fill forms in systems without APIs |\n| QA | Exploratory testing, screenshot comparison |\n\n### Safety controls\n\n- Isolated browser profile without personal logins\n- Domain allowlists for sensitive tasks\n- Confirmation before purchases, submissions, logins\n- Treat page content as untrusted (prompt injection, see the AI security course)"}, {"id": 30, "title": "Connecting MCP servers to your harness", "tldr": "MCP lets your harness connect to external tools and data through a standard protocol. Choose servers carefully, limit which tools each agent sees, scope credentials, and watch the token cost of tool definitions.", "real": "Anthropic introduced MCP in November 2024, and it was adopted by OpenAI, Google, Microsoft and many developer tools within a year. In December 2025 it moved to the Linux Foundation’s Agentic AI Foundation for neutral governance.", "body": "### Integration pattern\n\n```\nHarness (MCP client)\n  ├── local server (stdio): filesystem, git, database CLI\n  ├── remote server (HTTP + OAuth): issue tracker, docs, CRM\n  └── internal server: your company APIs wrapped as tools\n```\n\n### Harness responsibilities\n\n| Responsibility | Practice |\n|---|---|\n| Selection | Approved servers only; pin versions |\n| Exposure | Load only the tools an agent needs |\n| Credentials | Per-user OAuth, minimal scopes |\n| Output handling | Truncate and treat results as untrusted |\n| Monitoring | Log every tool call with arguments |\n| Updates | Review description changes (tool poisoning risk) |\n\n### Building your own MCP server\n\n- Wrap internal APIs as task-shaped tools (ch. 23)\n- Write descriptions as carefully as for native tools\n- Enforce authorization server-side, using the real user’s identity\n- Test with your evaluation tasks before publishing\n\n### Token cost\n\nEach connected server adds tool definitions to the context. Measure, prune, or use tool search or code APIs when the list grows."}, {"id": 31, "title": "Types of agent memory", "tldr": "Agents need several kinds of memory: working memory (the current context), short-term task state (plans, notes), long-term facts and preferences, episodic records of past runs, and procedural memory (skills, scripts). The harness decides where each lives and when it is loaded.", "real": "Research systems such as Generative Agents (Stanford, 2023) used a memory stream with retrieval and reflection, and MemGPT (2023, later the Letta project) paged information between a small “main context” and external storage. Production harnesses now combine files, databases and memory tools for the same purposes.", "body": "### Memory types\n\n| Type | Holds | Typical storage |\n|---|---|---|\n| Working | What the model sees now | Context window |\n| Task state | Plan, todo list, progress | Files, structured state |\n| Semantic | Facts, preferences, project knowledge | Files, databases, vector stores |\n| Episodic | What happened in past runs | Logs, summaries, git history |\n| Procedural | How to do things | Skills, scripts, instruction files |\n\n### Design questions\n\n1. What must survive the end of a context window?\n2. What must survive the end of a session?\n3. Who can read and write each memory (user, agent, other agents)?\n4. How is outdated memory corrected or expired?\n5. How is memory protected from injection (see the AI security course)?\n\n### Simple beats clever\n\nMany effective harnesses use plain files (markdown, JSON) plus git as memory. They are inspectable by humans, versioned and easy for models to read."}, {"id": 32, "title": "Compaction and summarization", "tldr": "When context approaches its limit, compaction summarizes the conversation so far into a shorter form and continues from there. Good compaction keeps decisions, open problems, file paths and constraints; it drops redundant tool output.", "real": "Claude Code compacts long sessions automatically near the context limit and offers a /compact command with optional focus instructions. Anthropic’s long-running agent research noted that compaction alone was not sufficient for very long projects, which is why it added explicit progress files and feature lists.", "body": "### What to preserve in a compaction summary\n\n| Keep | Drop |\n|---|---|\n| User goal and constraints | Raw tool outputs already used |\n| Decisions made and why | Duplicate file contents |\n| Current plan and status | Exploratory dead ends (keep a one-line note) |\n| Files changed and key locations | Verbose logs |\n| Known bugs and failed approaches | Small talk |\n| Next steps | |\n\n### Compaction prompt sketch\n\n```text\nSummarize this session for a fresh engineer continuing the work.\nInclude: goal, constraints, decisions with reasons, files touched,\ncurrent status, failing tests, approaches that did not work, next 3 steps.\nBe specific: use file paths, function names and exact error messages.\n```\n\n### Pitfalls\n\n- Summaries lose subtle details (a constraint mentioned once)\n- Repeated compactions compound losses\n- The agent may over-trust the summary\n\n### Mitigation\n\nKeep durable artifacts outside the context (progress file, task list, git), so compaction is a convenience, not the only memory."}, {"id": 33, "title": "Structured notes and scratch files", "tldr": "Asking agents to write notes, such as todo lists, progress logs and decision records, to files gives them memory that survives compaction and new sessions, and also keeps goals visible by “reciting” them into recent context.", "real": "Manus described agents that create and keep updating a todo.md file during complex tasks, which pushes the global plan into the most recent part of the context and helps the model avoid losing track of goals. Anthropic’s long-running harness uses a progress file that each session reads first and updates last.", "body": "### Useful note files\n\n| File | Content |\n|---|---|\n| todo.md / tasks.json | Remaining tasks with status |\n| progress.md | What was done each session |\n| decisions.md | Choices and reasons |\n| findings.md | Facts discovered (APIs, quirks) |\n| notes for next session | Explicit handoff |\n\n### Example progress entry\n\n```markdown\n## Session 7 (agent)\n- Implemented password reset email (src/auth/reset.ts); tests pass.\n- Found: mail provider rejects >100 req/min; added queue (src/mail/queue.ts).\n- Open: reset link expiry not configurable yet (see todo #12).\n- Next: add expiry setting, then e2e test via browser.\n```\n\n### Recitation effect\n\nRewriting the plan near the end of the context helps the model attend to it, counteracting “lost in the middle” effects.\n\n### Rules for agents\n\n- Read notes at the start of every session\n- Update notes before ending or compacting\n- Keep notes short and factual; link to files instead of copying content"}, {"id": 34, "title": "Long-term memory stores", "tldr": "Long-term memory lets agents remember users, projects and lessons across sessions. Options include memory files, key-value stores, vector databases and memory tools. Memory must be accurate, editable, scoped and protected.", "real": "Anthropic released a memory tool for Claude in 2025 that lets agents create, read, update and delete files in a memory directory managed by the developer, so knowledge persists across conversations without being kept in the context window.", "body": "### Storage options\n\n| Option | Good for | Watch out |\n|---|---|---|\n| Markdown memory files | Project knowledge, preferences | Must be curated |\n| Structured store (JSON, DB) | Facts with fields | Schema design |\n| Vector store | Large, fuzzy recall | Retrieval errors, stale entries |\n| Knowledge graph | Relationships | Complexity |\n| Memory tool (file-based) | Agent-managed persistence | Needs scoping and review |\n\n### What to remember\n\n| Remember | Do not remember |\n|---|---|\n| Stable user preferences | Secrets and credentials |\n| Project conventions discovered | One-off details |\n| Lessons from failures | Unverified claims from untrusted content |\n| Useful commands | Personal data without consent |\n\n### Governance\n\n- Memory scoped per user, project or team\n- Users can view, edit and delete memories\n- Expiry or re-validation for old entries\n- Writes triggered by untrusted content are blocked or reviewed"}, {"id": 35, "title": "Skills: procedural memory", "tldr": "Skills package know-how, meaning instructions, scripts and reference files for a specific kind of task, that the agent loads only when relevant. They let you teach agents repeatable procedures without bloating every prompt.", "real": "Anthropic introduced Agent Skills in October 2025: folders containing a SKILL.md file with a name and description, plus optional scripts and resources. Only the short descriptions load by default; the full content loads when the agent judges a skill relevant. The 2023 Voyager research agent similarly grew a library of reusable code skills.", "body": "### Skill structure (example)\n\n```\nskills/\n  pdf-forms/\n    SKILL.md        ← name, description, step-by-step instructions\n    fill_form.py    ← script the agent can run\n    reference.md    ← field mappings, edge cases\n```\n\n### SKILL.md sketch\n\n```markdown\n---\nname: pdf-forms\ndescription: Fill PDF forms from structured data. Use when asked to complete or populate a PDF form.\n---\n1. Inspect the form fields with `python fill_form.py --list form.pdf`.\n2. Map input data to field names (see reference.md for common names).\n3. Fill: `python fill_form.py form.pdf data.json out.pdf`.\n4. Verify by rendering page 1 and checking key fields.\n```\n\n### Why skills work\n\n| Property | Benefit |\n|---|---|\n| Progressive disclosure | Low context cost until needed |\n| Executable scripts | Deterministic steps instead of model guesswork |\n| Versioned files | Reviewable, shareable |\n| Composable | Several skills per task |\n\n### Harness tip\n\nLet agents propose new skills after solving a task well; review them before adding to the shared library."}, {"id": 36, "title": "The multi-context-window problem", "tldr": "Long tasks exceed a single context window, and each new window starts without memory. Without help, agents try to do everything at once, run out of context mid-change, or declare victory too early. Long-running harnesses solve this with durable state and incremental work.", "real": "Anthropic’s November 2025 post “Effective harnesses for long-running agents” observed two main failure patterns when asking an agent to build a full web app across sessions: trying to one-shot the whole app and leaving half-finished work, and later sessions seeing progress and declaring the job complete too early.", "body": "### Failure modes\n\n| Failure | What happens |\n|---|---|\n| One-shotting | Agent attempts everything; context runs out mid-feature |\n| Amnesia | New session re-explores or redoes work |\n| Premature completion | Agent sees progress and says “done” |\n| Broken state | Session ends with code that does not build |\n| Undocumented work | Next session cannot tell what changed |\n\n### Principles for multi-window work\n\n1. **Externalize state** (files, git), not just context\n2. **Work incrementally**: one feature or task per session\n3. **Leave the environment clean**: builds pass at the end of each session\n4. **Make “done” objective**: feature lists with tests\n5. **Standard startup routine**: read progress, check git log, run smoke test\n\n### Analogy\n\nThink of engineers working in shifts: each shift needs a handoff note, a clean workspace and a clear list of what is left."}, {"id": 37, "title": "The initializer and incremental worker pattern", "tldr": "A two-role harness: an initializer agent sets up the project once (requirements list, progress file, init script, first commit); then worker sessions each make incremental progress on one item, verify it, update the progress file and commit.", "real": "Anthropic’s long-running harness used exactly this split. The initializer created an init.sh script, a progress file (claude-progress.txt), a detailed feature list, and an initial git commit. Every later coding session read these artifacts, picked one unfinished feature, tested it end to end and recorded results.", "body": "### Initializer responsibilities\n\n| Artifact | Purpose |\n|---|---|\n| Feature / requirements list | Expands the user’s request into testable items |\n| init.sh | Starts dev server, runs smoke tests |\n| Progress file | Running log for future sessions |\n| Initial commit | Clean, versioned baseline |\n\n### Worker session routine\n\n```\n1. pwd; read progress file; read git log -20\n2. Run init.sh; confirm the app works (smoke test)\n3. Choose the highest-priority unfinished feature\n4. Implement it\n5. Verify end to end (tests, browser automation)\n6. Mark the feature as passing only if verified\n7. Commit with a descriptive message; update progress file\n```\n\n### Why it works\n\n- Each session has a clear, bounded goal\n- State is reconstructed quickly from artifacts\n- Mistakes are contained to one feature and one commit\n\n### Variants\n\nAdd specialized roles: a testing agent, a reviewer, a cleanup agent (Part 10)."}, {"id": 38, "title": "Feature lists and definitions of done", "tldr": "Agents stop when they believe the task is done. Make “done” objective: a structured list of requirements, each with a verification step and a pass/fail status that only changes after a real check. Protect the list from being edited to look complete.", "real": "In Anthropic’s long-running harness, the feature list was a JSON file with a “passes” field for each feature, and agents were instructed to change only that field, with strongly worded rules against removing or editing tests. JSON was chosen partly because the model was less likely to inappropriately rewrite it than a markdown file.", "body": "### Example feature list\n\n```json\n[\n  {\n    \"id\": 14,\n    \"category\": \"auth\",\n    \"description\": \"User can reset password via emailed link\",\n    \"steps\": [\"Request reset for test user\", \"Open link from test mailbox\", \"Set new password\", \"Log in with new password\"],\n    \"passes\": false\n  }\n]\n```\n\n### Rules for agents\n\n- Only flip `passes` after running the listed steps\n- Never delete or weaken features or tests\n- Add newly discovered requirements as new items\n- If a feature cannot be done, record why in the progress file\n\n### Harness enforcement\n\n| Enforcement | How |\n|---|---|\n| Read-only fields | Hook or validator rejects edits to descriptions and steps |\n| Verified flips | Harness reruns the steps before accepting `passes: true` |\n| Diff review | Flag deletions in the feature file |\n\n### General principle\n\nCompletion should be a property of **artifacts and checks**, not of what the model says in its final message."}, {"id": 39, "title": "Git as memory and checkpoint system", "tldr": "Version control gives agents a reliable history, a way to see what changed, and the ability to roll back bad work. Commit small, descriptive changes; use branches or worktrees per task; never let agents rewrite shared history without approval.", "real": "Anthropic’s long-running harness asked agents to commit after each feature with descriptive messages and to read the git log at the start of each session. It noted that git also lets the agent revert bad changes and return to a working state.", "body": "### How git serves the harness\n\n| Use | Benefit |\n|---|---|\n| git log | Episodic memory of what happened |\n| git diff | Precise view of current changes |\n| Commits | Checkpoints to roll back to |\n| Branches / worktrees | Isolation between parallel tasks |\n| Pull requests | Review gate before merging |\n\n### Commit discipline for agents\n\n```\nfeat(auth): add password reset link expiry setting\n\n- Adds RESET_LINK_TTL_MINUTES (default 30) in src/config.ts\n- Tests: tests/auth/reset.test.ts (3 new cases), all passing\n- E2E: verified reset flow in browser\n```\n\n### Guardrails\n\n- No force-push or history rewrites without approval\n- No direct commits to protected branches\n- Hooks that run tests before allowing commits\n- One task per branch for traceability\n\n### Recovery\n\nWhen a session goes wrong, the next session (or a human) can `git reset` to the last good commit rather than untangling broken edits."}, {"id": 40, "title": "Keeping agents running: loops, schedules and durability", "tldr": "Long-running work needs an outer loop that restarts sessions, schedules work, survives crashes and stops when done. Options range from a simple shell loop to job queues, schedulers and durable workflow engines with checkpoints.", "real": "Developer Geoffrey Huntley popularized the “Ralph Wiggum loop”, a minimal outer loop that repeatedly runs a coding agent with the same prompt and specification so it keeps making progress. Teams running production agents often use durable execution engines such as Temporal so long jobs survive failures and restarts.", "body": "### Outer loop options\n\n| Option | Strength | Weakness |\n|---|---|---|\n| Shell while-loop | Trivial to set up | No durability, easy to run away |\n| Cron / scheduler | Regular runs | Limited state handling |\n| Job queue (tickets → runs) | Scales across tasks | Needs infrastructure |\n| Durable workflow engine | Checkpoints, retries, timeouts | More complexity |\n| Graph framework with checkpoints | Resume mid-graph | Framework lock-in |\n\n### Minimal loop (concept)\n\n```bash\nwhile ! all_features_pass; do\n  run_agent_session --prompt PROMPT.md --max-turns 200\n  run_test_suite || echo \"tests failing, next session will see it in progress file\"\ndone\n```\n\n### Required safeguards\n\n- Maximum iterations, time and spend\n- Stop when no progress is made for N sessions\n- Alerts to humans on repeated failures\n- Clean environment checks between sessions\n\n### Event-driven agents\n\nInstead of loops, many teams trigger agent runs from events: a new ticket, a failing build, a review comment, or a schedule."}, {"id": 41, "title": "Planning: task lists and plan-then-execute", "tldr": "Explicit planning helps agents on multi-step work: break the goal into steps, write them down, and update them as work proceeds. For risky tasks, have the agent propose a plan for human approval before it changes anything.", "real": "Claude Code includes a todo-list tool that the agent uses to track multi-step tasks and show progress to the user, and offers a plan mode in which the agent researches and proposes a plan before making edits. OpenAI’s harness engineering post described decomposing goals depth-first into small building blocks the agent could complete.", "body": "### Planning styles\n\n| Style | How | Best for |\n|---|---|---|\n| Implicit | Model plans in its reasoning | Short tasks |\n| Todo list | Agent maintains a visible list | Multi-step tasks |\n| Plan-then-execute | Plan approved before acting | Risky or large changes |\n| Hierarchical | Plan of plans, subagents per branch | Very large tasks |\n| Replanning | Revise plan after each milestone | Uncertain tasks |\n\n### Good plans have\n\n- Concrete steps with observable outcomes\n- Verification for each step\n- Dependencies and ordering\n- Explicit unknowns to investigate first\n\n### Example plan\n\n```markdown\n1. Find where session tokens are created (search: \"createSession\")\n2. Add expiry field + migration; run migrati

mon errors and harness fixes\n\n| Error | Fix |\n|---|---|\n| Wrong metric definition | Semantic layer, metric docs in context |\n| Join explosions | Row-count checks before and after joins |\n| Silent filtering mistakes | Show filters applied in the final answer |\n| Over-confident conclusions | Require stating sample size and limitations |"}, {"id": 94, "title": "Browser and computer-use agents in operations", "tldr": "Operations agents use browsers and desktop apps to complete tasks in systems without APIs. Their harnesses need robust page understanding, step verification, confirmation before consequential actions, takeover by humans, and strong isolation.", "real": "OpenAI launched Operator in January 2025 and folded it into ChatGPT agent in July 2025. The agent asks for confirmation before consequential actions such as purchases and lets users take over the browser for sensitive steps like logging in, a pattern now common in computer-use harnesses.", "body": "### Harness features\n\n| Feature | Purpose |\n|---|---|\n| Structured page access (DOM / accessibility) | More reliable than pixels alone |\n| Screenshots for verification | Confirm state after actions |\n| Confirmation gates | Purchases, submissions, messages |\n| Human takeover | Logins, payments, CAPTCHAs |\n| Domain allowlists | Limit where the agent can go |\n| Session isolation | Separate browser profiles |\n\n### Reliability practices\n\n- Verify each step’s result before the next (did the form submit?)\n- Prefer APIs when available; use UI automation as fallback\n- Save successful workflows as scripts or skills for reuse\n- Handle pop-ups, cookie banners and timeouts explicitly\n\n### Security\n\nWeb content is untrusted. Prompt injection on visited pages is a primary risk; keep sensitive data and credentials away from browsing agents unless strictly needed."}, {"id": 95, "title": "Enterprise agent platform architecture", "tldr": "At company scale, harnesses sit on shared platform services: a model gateway, identity and permissions for agents, tool and MCP registries, memory services, sandboxed runtimes, observability, evaluation and governance.", "real": "AWS launched Amazon Bedrock AgentCore in 2025, offering managed building blocks for agents such as a runtime, memory, identity, a tool gateway and observability. It reflects how enterprise harness infrastructure is becoming a standard platform layer.", "body": "### Platform layers\n\n```\n┌──────────────────────── Agents (support, coding, ops, research) ───────────────────────┐\n├────────────────────────────────────────────────────────────────────────────────────────┤\n│ Harness runtime: loops, sandboxes, schedulers, durable execution                       │\n├────────────────────────────────────────────────────────────────────────────────────────┤\n│ Shared services: model gateway │ tool/MCP registry │ memory │ secrets │ approvals       │\n├────────────────────────────────────────────────────────────────────────────────────────┤\n│ Identity & policy: agent identities, user delegation, permissions, guardrails          │\n├────────────────────────────────────────────────────────────────────────────────────────┤\n│ Observability & evals: traces, cost, dashboards, regression suites                      │\n└────────────────────────────────────────────────────────────────────────────────────────┘\n```\n\n### Platform responsibilities\n\n| Service | Responsibility |\n|---|---|\n| Model gateway | Routing, quotas, logging, provider failover |\n| Tool registry | Approved tools and MCP servers, versions |\n| Identity | Agents act with delegated, scoped user rights |\n| Runtime | Isolated execution, scaling |\n| Observability | Traces, cost attribution |\n| Governance | Policies, audits, incident response |\n\n### Benefit\n\nTeams build agents faster and more safely when they do not each reinvent security, logging and evaluation."}, {"id": 96, "title": "Build vs buy: choosing your harness", "tldr": "Use an existing harness (a coding agent, an agent SDK or a platform) when it fits your task, and build custom only where your domain needs it. Most teams combine: an off-the-shelf core with custom tools, instructions, checks and evals.", "real": "When Anthropic renamed the Claude Code SDK to the Claude Agent SDK in September 2025, it said it had been using the same harness internally for tasks beyond coding, such as deep research, video creation and note-taking. General-purpose coding harnesses often transfer well to other knowledge-work tasks.", "body": "### Options\n\n| Option | Effort | Control | Best for |\n|---|---|---|---|\n| Use an agent product as-is | Lowest | Low | Standard tasks |\n| Configure an agent product (instructions, MCP, hooks, skills) | Low | Medium | Team workflows |\n| Build on an agent SDK | Medium | High | Custom products |\n| Build on raw APIs | High | Highest | Unique requirements, research |\n\n### Decision questions\n\n1. Does an existing harness already solve 80% of the task?\n2. Which parts are truly unique to our domain?\n3. Do we need model portability?\n4. What are our security and deployment constraints?\n5. Do we have capacity to maintain a custom harness as models change?\n\n### Customization points that matter most\n\nInstruction files, tools/MCP servers, hooks, permissions, skills, verification scripts and evals. These usually deliver more value than rewriting the core loop."}, {"id": 97, "title": "A minimal harness you can build today", "tldr": "A working agent harness fits in about 70 lines: a system prompt, a couple of tools, a loop that calls the model and executes tool calls, output truncation, a simple policy check and a turn budget. Building one teaches the fundamentals behind every larger harness.", "real": "The SWE-agent team released mini-swe-agent in 2025, an agent of roughly a hundred lines of Python that uses only a bash tool, and reported competitive results on SWE-bench Verified with strong models. It shows how much of an agent’s capability comes from the model plus a clean loop.", "body": "### Python example (Anthropic Messages API)\n\n```python\nimport subprocess\nimport anthropic\n\nclient = anthropic.Anthropic()  # reads ANTHROPIC_API_KEY from the environment\nMODEL = \"your-model-id\"         # use a current model ID from the provider docs\nSYSTEM = (\"You are a coding agent in the current directory. Explore before editing. \"\n          \"After changes, run the tests. Finish with a short summary of what you did.\")\n\nTOOLS = [\n    {\"name\": \"run_bash\",\n     \"description\": \"Run a shell command in the project directory. Returns stdout and stderr (truncated). \"\n                    \"Use for ls, grep, cat, running tests.\",\n     \"input_schema\": {\"type\": \"object\",\n                      \"properties\": {\"command\": {\"type\": \"string\", \"description\": \"Shell command\"}},\n                      \"required\": [\"command\"]}},\n    {\"name\": \"write_file\",\n     \"description\": \"Create or overwrite a file with the given content.\",\n     \"input_schema\": {\"type\": \"object\",\n                      \"properties\": {\"path\": {\"type\": \"string\"}, \"content\": {\"type\": \"string\"}},\n                      \"required\": [\"path\", \"content\"]}},\n]\n\nBLOCKED = (\"rm -rf\", \"git push\", \"sudo\")   # illustrative only; real safety needs a sandbox\nMAX_OUT = 8000\n\ndef run_tool(name, args):\n    if name == \"run_bash\":\n        cmd = args[\"command\"]\n        if any(b in cmd for b in BLOCKED):\n            return \"Blocked by policy: this command needs human approval.\", True\n        try:\n            p = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=120)\n        except subprocess.TimeoutExpired:\n            return \"Command timed out after 120 seconds.\", True\n        out = p.stdout + p.stderr\n        if len(out) > MAX_OUT:\n            out = out[:MAX_OUT] + f\"\\n[truncated {len(out) - MAX_OUT} characters]\"\n        return out or \"(no output)\", p.returncode != 0\n    if name == \"write_file\":\n        with open(args[\"path\"], \"w\") as f:\n            f.write(args[\"content\"])\n        return \"Wrote \" + args[\"path\"], False\n    return \"Unknown tool: \" + name, True\n\ndef agent(task, max_turns=30):\n    messages = [{\"role\": \"user\", \"content\": task}]\n    for _ in range(max_turns):\n        resp = client.messages.create(model=MODEL, max_tokens=4096, system=SYSTEM,\n                                      tools=TOOLS, messages=messages)\n        messages.append({\"role\": \"assistant\", \"content\": resp.content})\n        if resp.stop_reason != \"tool_use\":\n            return \"\".join(b.text for b in resp.content if b.type == \"text\")\n        results = []\n        for block in resp.content:\n            if block.type == \"tool_use\":\n                output, is_error = run_tool(block.name, block.input)\n                results.append({\"type\": \"tool_result\", \"tool_use_id\": block.id,\n                                \"content\": output, \"is_error\": is_error})\n        messages.append({\"role\": \"user\", \"content\": results})\n    return \"Stopped: turn budget reached.\"\n\nif __name__ == \"__main__\":\n    print(agent(\"Find the failing test in this repo and fix it.\"))\n```\n\n### Run it safely\n\nOnly run this inside a disposable container or VM with no secrets. The `BLOCKED` list is a teaching device, not a security boundary.\n\n### Extensions to try next\n\nPrompt caching (ch. 77), a progress file (ch. 33), a stop hook that runs tests (ch. 60), tracing (ch. 71), and an eval suite (ch. 68)."}, {"id": 98, "title": "Harness maturity model", "tldr": "Teams progress from ad hoc prompting, to configured agents, to instrumented and evaluated harnesses, to agent-first workflows with continuous improvement. Assess where you are and invest in the next level, not all levels at once.", "real": "Google Cloud’s 2025 DORA report on AI-assisted software development concluded that AI acts as an amplifier: it magnifies the strengths of high-performing organizations and the dysfunctions of struggling ones. Harness maturity, meaning docs, tests, platforms and feedback loops, is much of what determines which way the amplification goes.", "body": "### Levels\n\n| Level | Name | Characteristics |\n|---|---|---|\n| 0 | Ad hoc | Individuals chat with models; no shared practices |\n| 1 | Configured | Agent tools adopted; instruction files; basic permissions |\n| 2 | Verified | Agents run tests and checks; sandboxing; hooks |\n| 3 | Measured | Eval suites, tracing, cost tracking, failure taxonomy |\n| 4 | Agent-first | Agent-legible repos, review agents, ticket-to-PR workflows |\n| 5 | Self-improving | Automated harness experiments, cleanup agents, continuous evals |\n\n### Assessment questions\n\n- Do agents have instruction files and reproducible environments?\n- Can agents verify their own work end to end?\n- Do you measure success, cost and failure categories?\n- Are repeated review comments turned into automated checks?\n- Do harness changes go through evals before rollout?\n\n### Advancing one level\n\n| From → to | Key investment |\n|---|---|\n| 0 → 1 | Pick tools; write instruction files |\n| 1 → 2 | Fast tests, sandboxes, hooks |\n| 2 → 3 | Tracing and an eval suite |\n| 3 → 4 | Repository legibility, review agents, workflows |\n| 4 → 5 | Automation of harness improvement |"}, {"id": 99, "title": "The future of harness engineering", "tldr": "Expect longer-running agents, more standardized harness components, agents improving their own harnesses, richer verification environments, stronger security models, and engineering roles centered on specifying, constraining and evaluating agent work.", "real": "METR’s measurements suggest the length of tasks agents can complete has been doubling roughly every seven months. In December 2025, the formation of the Agentic AI Foundation around MCP, AGENTS.md and goose signaled that core harness components are becoming shared, vendor-neutral infrastructure.", "body": "### Trends\n\n| Trend | Implication |\n|---|---|\n| Longer task horizons | Durable state, multi-session harnesses become standard |\n| Standardization | Portable tools, instructions, skills |\n| Agents improving harnesses | Automated tool and prompt optimization |\n| Verification environments | Richer simulators and test worlds |\n| Agent identity and permissions | Enterprise-grade delegation models |\n| Model–harness co-training | Models trained in specific harnesses |\n| Cost declines | More agents, more parallelism |\n\n### Open problems\n\n- Reliable verification for subjective or long-horizon work\n- Prompt injection resistance at the architecture level\n- Coordination of many agents without conflicts\n- Measuring real productivity impact\n- Keeping humans meaningfully in control\n\n### Skills that will matter\n\nSystems thinking, writing clear specifications, test and evaluation design, security engineering, observability, and the judgment to know what to automate."}, {"id": 100, "title": "Roadmap, checklist and glossary", "tldr": "Learn harness engineering by building: a minimal loop, then tools, context policies, memory, verification, permissions, tracing and evals. Use the checklist before shipping any agent, and keep the glossary handy.", "real": "Good sources to follow include Anthropic’s engineering blog (agents, context engineering, tools, long-running harnesses), OpenAI’s engineering posts (including harness engineering), the Manus and Cognition blogs on agent design, METR’s research, and Simon Willison’s writing on agents and security.", "body": "### Ten-step roadmap\n\n1. Build the minimal harness (ch. 97) and run it on a small repo.\n2. Add a progress file and task list; test across two sessions.\n3. Redesign one tool using the tool checklist (ch. 22–24).\n4. Add output truncation and measure context size per call.\n5. Add prompt caching and check cache hit rates.\n6. Add a stop hook that runs tests before accepting “done”.\n7. Put the agent in a sandbox with network allowlists.\n8. Add tracing and build a failure taxonomy from 20 runs.\n9. Create a 20-task eval suite with automated grading.\n10. Run an A/B experiment on one harness change.\n\n### Pre-ship checklist\n\n- [ ] Clear system prompt and short instruction files\n- [ ] Tools reviewed: names, descriptions, schemas, outputs, errors\n- [ ] Context policy: truncation, compaction, caching\n- [ ] Durable state for long tasks (progress, task list, git)\n- [ ] Verification built into the definition of done\n- [ ] Sandbox, least-privilege credentials, permission rules\n- [ ] Hooks for must-always-happen rules\n- [ ] Budgets: turns, time, cost\n- [ ] Tracing and audit logs\n- [ ] Eval suite with baseline results; regression gates\n- [ ] Human escalation and approval paths\n- [ ] Prompt injection risks assessed\n\n### Glossary\n\n| Term | Meaning |\n|---|---|\n| Harness | Everything around the model that makes it an agent |\n| Agent loop | Call model → execute tools → feed results back → repeat |\n| Context engineering | Choosing what the model sees at each step |\n| Tool | Function the agent can call, defined by name, description and schema |\n| ACI | Agent-computer interface: tools designed for models |\n| MCP | Model Context Protocol for connecting tools and data |\n| AGENTS.md / CLAUDE.md | Instruction files read by coding agents |\n| Skill | Packaged instructions and scripts loaded on demand |\n| Compaction | Summarizing context to continue in a fresh window |\n| Progress file | Durable notes for the next session |\n| Subagent | Agent spawned with its own context for a subtask |\n| Orchestrator–worker | Lead agent delegates to worker agents |\n| Hook | Code run automatically at fixed points in the loop |\n| Sandbox | Isolated environment limiting agent actions |\n| Prompt caching | Reusing processed prompt prefixes to cut cost and latency |\n| pass@k / pass^k | Success in at least one / all of k attempts |\n| Trace | Recorded spans of model and tool calls in a run |\n| Lethal trifecta | Private data + untrusted content + external communication |\n| Agent-first development | Humans steer and verify; agents write most code |"}];
const PARTS = ["Foundations of harness engineering", "History, landscape and standards", "Instructions and system prompts", "Context engineering", "Tool design", "Advanced tooling", "Memory and state", "Long-running agents", "Planning and control flow", "Multi-agent harnesses", "Verification and feedback loops", "Environment design and guardrails", "Safety and security in the harness", "Evaluating agents", "Observability and debugging", "Cost and performance", "Model–harness co-design", "Harnesses for software development", "Domain harnesses and platforms", "Building your own and the road ahead"];
const partOf = id => Math.ceil(id / 5);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "harness-course-progress-v1";
const LS_LAST = "harness-course-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try{ await dbRef.set({done:[...done].sort((a,b)=>a-b), updated:Date.now()}); }
  catch(e){ if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; pushRemote(); }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...done])); }catch(e){} }
function toggle(id){
  if (done.has(id)) done.delete(id); else done.add(id);
  saveLocal(); pushRemote(); renderAll();
  toast(done.has(id) ? "Chapter " + id + " marked complete" : "Chapter " + id + " marked not complete");
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(s){
  if (window.marked && marked.parse){
    const html = marked.parse(s, {gfm:true, headerIds:false, mangle:false});
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  }
  return "<pre>" + esc(s) + "</pre>";
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function currentId(){
  const m = location.hash.match(/^#ch-(\d{1,3})$/);
  const n = m ? +m[1] : 0;
  return n >= 1 && n <= 100 ? n : 0;
}

/* ---------- header memory bank ---------- */
function renderBank(){
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    html += '<div class="bank-group" title="Part ' + p + ': ' + esc(PARTS[p-1]) + '">';
    for (let i = (p-1)*5 + 1; i <= p*5; i++){
      html += '<button class="cell' + (done.has(i) ? " done" : "") + (i === cur ? " here" : "") +
        '" data-go="' + i + '" aria-label="Chapter ' + i + (done.has(i) ? ", complete" : "") + '"></button>';
    }
    html += "</div>";
  }
  document.getElementById("bank").innerHTML = html;
  document.getElementById("doneCount").textContent = done.size;
  document.getElementById("pct").textContent = Math.round(done.size) + "%";
}

/* ---------- sidebar ---------- */
const openParts = new Set();
function renderSide(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    const ids = [1,2,3,4,5].map(k => (p-1)*5 + k);
    const matches = ids.filter(i => !q || byId[i].title.toLowerCase().includes(q) || byId[i].tldr.toLowerCase().includes(q) || String(i) === q);
    if (q && !matches.length) continue;
    const count = ids.filter(i => done.has(i)).length;
    const open = q || openParts.has(p) || partOf(cur) === p;
    html += '<div class="part' + (open ? " open" : "") + '">' +
      '<button class="part-head" data-part="' + p + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="part-num">' + String(p).padStart(2, "0") + '</span>' +
      '<span class="part-name">' + esc(PARTS[p-1]) + '</span>' +
      '<span class="part-count' + (count === 5 ? " full" : "") + '">' + count + '/5</span></button><ul class="part-list">';
    for (const i of matches){
      html += '<li class="ch-row' + (i === cur ? " active" : "") + '">' +
        '<button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="' + (done.has(i) ? "Mark chapter " + i + " not complete" : "Mark chapter " + i + " complete") + '">' + TICK + '</button>' +
        '<a href="#ch-' + i + '"><span class="n">' + i + '.</span>' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ul></div>";
  }
  if (!html) html = '<p style="color:var(--muted);font-size:14px;padding:8px">No chapters match that search. Try a shorter word like “tools” or “memory”.</p>';
  document.getElementById("parts").innerHTML = html;
}

/* ---------- chapter view ---------- */
function renderChapter(id){
  const c = byId[id];
  const p = partOf(id);
  const ids = [1,2,3,4,5].map(k => (p-1)*5 + k);
  const isDone = done.has(id);
  const tabs = ids.map(i =>
    '<button class="tab' + (i === id ? " active" : "") + '" role="tab" aria-selected="' + (i === id) + '" data-go="' + i + '">' +
    '<span class="dot' + (done.has(i) ? " on" : "") + '"></span><span class="tab-t">' + i + '. ' + esc(byId[i].title) + '</span></button>'
  ).join("");
  document.getElementById("main").innerHTML =
    '<p class="crumb">Part ' + p + ' of 20: ' + esc(PARTS[p-1]) + '</p>' +
    '<div class="tabs" role="tablist" aria-label="Chapters in this part">' + tabs + '</div>' +
    '<article>' +
      '<p class="ch-no">Chapter ' + id + ' of 100</p>' +
      '<h1 class="ch-title">' + esc(c.title) + '</h1>' +
      '<section class="box tldr"><h2>TL;DR</h2><p>' + inlineMd(c.tldr) + '</p></section>' +
      '<div class="body">' + md(c.body) + '</div>' +
      '<section class="box real"><h2>Real-world example</h2><p>' + inlineMd(c.real) + '</p></section>' +
      '<div class="done-bar">' +
        '<button class="complete' + (isDone ? " on" : "") + '" data-toggle="' + id + '" aria-pressed="' + isDone + '">' +
          '<span class="tick' + (isDone ? " on" : "") + '">' + TICK + '</span>' + (isDone ? "Completed" : "Mark as complete") + '</button>' +
        '<div class="nav">' +
          '<button class="btn" data-go="' + (id - 1) + '"' + (id === 1 ? " disabled" : "") + '>Previous</button>' +
          '<button class="btn" data-go="' + (id + 1) + '"' + (id === 100 ? " disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>' +
    '</article>';
}

/* ---------- contents view ---------- */
function renderContents(){
  let html = '<div class="contents"><h1>Contents</h1>' +
    '<p class="lead">Twenty parts, five chapters each. Tick a chapter when you finish it; your progress is saved for next time. Product features, prices and APIs change quickly, so check current documentation before relying on a specific detail.</p>' +
    '<div class="contents-actions"><button class="btn" data-go="' + firstUnread() + '">' + (done.size ? "Continue with chapter " + firstUnread() : "Start chapter 1") + '</button>' +
    '<button class="btn" id="resetBtn">Reset progress</button></div><div class="grid">';
  for (let p = 1; p <= 20; p++){
    const ids = [1,2,3,4,5].map(k => (p-1)*5 + k);
    const count = ids.filter(i => done.has(i)).length;
    html += '<section class="pcard"><h2>Part ' + p + ': ' + esc(PARTS[p-1]) + '</h2><div class="meta">' + count + ' of 5 complete</div><ol>';
    for (const i of ids){
      html += '<li><button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="Toggle chapter ' + i + '">' + TICK + '</button><a href="#ch-' + i + '">' + i + '. ' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ol></section>";
  }
  document.getElementById("main").innerHTML = html + "</div></div>";
}
function firstUnread(){ for (let i = 1; i <= 100; i++) if (!done.has(i)) return i; return 100; }

/* ---------- routing ---------- */
let lastRendered = null;
function renderAll(){
  const id = currentId();
  renderBank(); renderSide();
  const y = window.scrollY;
  if (id) renderChapter(id); else renderContents();
  if (lastRendered === location.hash) window.scrollTo(0, y);
  lastRendered = location.hash;
}
function route(){
  const id = currentId();
  if (!id && location.hash !== "#contents"){
    let last = 0; try{ last = +localStorage.getItem(LS_LAST) || 0; }catch(e){}
    location.replace("#ch-" + (last >= 1 && last <= 100 ? last : 1));
    return;
  }
  if (id){ try{ localStorage.setItem(LS_LAST, id); }catch(e){} }
  document.body.classList.remove("drawer");
  renderAll();
  window.scrollTo(0, 0);
  const active = document.querySelector(".ch-row.active");
  if (active) active.scrollIntoView({block:"nearest"});
  const tab = document.querySelector(".tab.active");
  if (tab && tab.parentElement){ const r = tab.parentElement; const left = tab.offsetLeft - r.offsetLeft; if (left < r.scrollLeft || left + tab.offsetWidth > r.scrollLeft + r.clientWidth) r.scrollLeft = left - 16; }
}
function go(id){ if (id >= 1 && id <= 100) location.hash = "#ch-" + id; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){ e.preventDefault(); toggle(+t.dataset.toggle); return; }
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled){ go(+g.dataset.go); return; }
  const ph = e.target.closest("[data-part]");
  if (ph){
    const p = +ph.dataset.part;
    const el = ph.parentElement;
    const isOpen = el.classList.toggle("open");
    if (isOpen) openParts.add(p); else openParts.delete(p);
    ph.setAttribute("aria-expanded", isOpen);
    return;
  }
  if (e.target.id === "resetBtn"){
    if (confirm("Clear all 100 ticks? This can’t be undone.")){ done.clear(); saveLocal(); pushRemote(); renderAll(); toast("Progress reset"); }
  }
});
document.getElementById("search").addEventListener("input", renderSide);
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.add("drawer"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = currentId(); if (!id) return;
  if (e.key === "ArrowRight") go(id + 1);
  else if (e.key === "ArrowLeft") go(id - 1);
});
function setTopH(){ document.documentElement.style.setProperty("--top-h", document.getElementById("top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);
window.addEventListener("hashchange", route);
setTopH();
route();
initSync();
</script>
</body>
</html>

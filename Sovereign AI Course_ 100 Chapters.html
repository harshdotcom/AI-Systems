 42 is the main international committee for AI standards. Its ISO/IEC 42001 (2023), the first certifiable AI management system standard, is now used by companies and referenced in procurement. European standards bodies are developing harmonized standards to support the EU AI Act.", "body": "### Key standards areas\n\n| Area | Example |\n|---|---|\n| Management systems | ISO/IEC 42001 |\n| Risk management | ISO/IEC 23894 |\n| Terminology and concepts | ISO/IEC 22989 |\n| Data quality | ISO/IEC 5259 series |\n| Testing and evaluation | Emerging standards |\n| Content provenance | C2PA specification |\n| Interoperability | Model and data formats, APIs |\n\n### Why standards matter for sovereignty\n\n- They define how compliance is shown\n- They influence which products succeed in many markets\n- Countries that participate shape rules; others adopt them\n\n### How to engage\n\n| Action | Benefit |\n|---|---|\n| Fund national experts to attend committees | Influence |\n| Mirror committees at national standards bodies | Coordination |\n| Adopt international standards in procurement | Interoperability |\n| Contribute local-language and context requirements | Inclusion |"}, {"id": 91, "title": "Assessing your sovereignty baseline", "tldr": "Before choosing investments, map where you stand: dependencies at each layer of the stack, capacity and gaps, critical use cases, legal exposure, talent, and readiness. Independent indices help with comparison, but a layer-by-layer dependency map is what drives decisions.", "real": "Oxford Insights publishes an annual Government AI Readiness Index covering most countries, and the IMF released an AI Preparedness Index in 2024. Governments use such indices as a starting point, then commission detailed national assessments of their own dependencies.", "body": "### Dependency map template\n\n| Layer | Current supplier(s) | Country of control | Substitutes available? | Criticality | Risk |\n|---|---|---|---|---|---|\n| Energy | | | | | |\n| Chips | | | | | |\n| Compute / cloud | | | | | |\n| Data | | | | | |\n| Models | | | | | |\n| Applications | | | | | |\n| Skills | | | | | |\n| Governance capacity | | | | | |\n\n### Critical use-case inventory\n\nFor each important public or industrial AI use: data sensitivity, current provider, what happens if it stops, and required sovereignty level (ch. 4).\n\n### Readiness questions\n\n1. How many operational GPUs are available to domestic users?\n2. How good are available models in our languages?\n3. Which laws apply to our data in current providers?\n4. How many AI engineers and researchers do we have, and how many leave each year?\n5. Do we have an institution able to evaluate AI models independently?\n\n### Output\n\nA short list of the **3–5 most critical dependencies** to address first."}, {"id": 92, "title": "Designing a sovereign AI strategy", "tldr": "A good strategy states goals (why), priorities by layer (what to own, partner or buy), flagship programs, governance and funding, metrics, and a timeline. It should be specific, demand-led and honest about trade-offs.", "real": "The UK’s AI Opportunities Action Plan (January 2025) set out 50 specific recommendations across infrastructure, adoption and homegrown capability, each with owners. The government accepted all of them and published a one-year progress report, showing a strategy built for tracking rather than only vision.", "body": "### Strategy structure\n\n| Section | Content |\n|---|---|\n| Vision and goals | Why sovereign AI matters for this country |\n| Baseline | Dependency map and gaps (ch. 91) |\n| Layer priorities | Own / partner / buy per layer |\n| Flagship programs | Compute, models, data, skills, adoption |\n| Governance | Lead agency, coordination, oversight |\n| Funding | Public, private, phasing |\n| Partnerships | Domestic and international |\n| Metrics | Indicators and targets (ch. 75) |\n| Risks | What could go wrong and responses |\n| Timeline | Phases and milestones |\n\n### Own / partner / buy example\n\n| Layer | Decision | Rationale |\n|---|---|---|\n| Energy | Own (national grid planning) | Core state role |\n| Chips | Buy + partner | No fab capacity; secure supply |\n| Compute | Own core + partner for scale | Sensitive and research needs |\n| Data | Own | National asset |\n| Models | Adapt open + some from scratch | Languages and capability |\n| Applications | Domestic ecosystem | Economic value |\n| Governance | Own | Sovereign function |\n\n### Test the strategy\n\nCan each flagship program name its users, budget, owner, milestones and exit criteria?"}, {"id": 93, "title": "Reference architecture for a sovereign AI platform", "tldr": "A practical sovereign AI platform combines domestic or certified infrastructure, a model catalog (open and licensed models), an AI gateway with security and logging, data services, evaluation and MLOps, and shared services for agencies or business units.", "real": "Singapore’s GovTech built Pair, an AI assistant for public officers, on government-controlled cloud infrastructure using commercial models under government security controls. It is an example of a hybrid approach: sovereign control of data and access, with models sourced from external providers.", "body": "### Architecture\n\n```\n┌─────────────────────────── Users: agencies, citizens, developers ───────────────────────────┐\n│                                                                                               │\n│  Applications: assistants, document tools, citizen services, agents                           │\n├───────────────────────────────────────────────────────────────────────────────────────────────┤\n│  AI gateway: identity, policy, rate limits, logging, safety filters, routing                  │\n├───────────────────────────────────────────────────────────────────────────────────────────────┤\n│  Model catalog: national models │ open-weight models │ licensed models (sovereign-hosted)    │\n├───────────────────────────────────────────────────────────────────────────────────────────────┤\n│  Data services: RAG indexes, national datasets, consent & access control                      │\n├───────────────────────────────────────────────────────────────────────────────────────────────┤\n│  MLOps & evaluation: fine-tuning, national benchmarks, red teaming, monitoring                │\n├───────────────────────────────────────────────────────────────────────────────────────────────┤\n│  Infrastructure: national compute │ certified sovereign cloud │ air-gapped enclaves           │\n└───────────────────────────────────────────────────────────────────────────────────────────────┘\n```\n\n### Design principles\n\n- **Model-agnostic gateway** so models can be swapped\n- **Data stays local**; models come to the data\n- **Tiered environments** by sensitivity\n- **Shared services** to avoid every agency building its own\n- **Open standards** for APIs and formats\n\n### Technical building blocks\n\nKubernetes-based serving, inference engines such as vLLM, vector databases, identity integration, security monitoring, and evaluation pipelines (see the LLM deployment and AI security courses)."}, {"id": 94, "title": "Implementation roadmap and governance", "tldr": "Implement in phases: quick wins and foundations first, flagship capabilities next, scale and refresh later. Clear ownership, coordination across ministries, independent review and public progress reports keep programs on track.", "real": "The UK’s one-year progress report on its AI Opportunities Action Plan (January 2026) listed delivered items, such as Isambard-AI, alongside items still in progress, and named turning AI Growth Zones “from designation to delivery” as a priority. That kind of candid reporting helps programs correct course.", "body": "### Phased roadmap\n\n| Phase | Timeline | Focus |\n|---|---|---|\n| 1. Foundations | 0–12 months | Strategy, governance, baseline, quick-win compute access, procurement rules |\n| 2. Capability | 1–3 years | National compute, language datasets, model programs, platform for agencies |\n| 3. Scale | 3–5 years | Broad adoption, ecosystem growth, refresh, international partnerships |\n| 4. Renewal | Ongoing | Hardware refresh, model updates, strategy review |\n\n### Governance structure\n\n| Body | Role |\n|---|---|\n| Lead ministry or agency | Owns strategy and budget |\n| Inter-ministerial council | Coordinates across government |\n| Expert advisory board | Independent technical advice |\n| Delivery units | Run specific programs |\n| Audit / evaluation office | Checks value for money |\n| Parliament / public | Oversight and transparency |\n\n### Risk register examples\n\n| Risk | Response |\n|---|---|\n| Hardware delivery delays | Multiple suppliers, penalty clauses |\n| Low adoption | User co-design, support teams |\n| Talent shortage | Training, competitive pay, partnerships |\n| Policy changes abroad | Fallback models and suppliers |"}, {"id": 95, "title": "Enterprise sovereign AI", "tldr": "Companies, especially in finance, health, defense and critical infrastructure, also pursue sovereign AI: control over data, models and providers through private deployments, open-weight models, sovereign cloud, and multi-provider architectures.", "real": "After restricting employee use of public generative AI tools in 2023, Samsung developed its own in-house model family, Samsung Gauss, unveiled in November 2023. Many large enterprises followed similar paths, combining internal models with tightly governed access to external ones.", "body": "### Enterprise drivers\n\n| Driver | Example |\n|---|---|\n| Confidential data | Source code, contracts, customer data |\n| Regulation | Banking, health, telecom rules |\n| IP protection | Avoid training others’ models on your data |\n| Resilience | Avoid single-vendor dependence |\n| Cost control | Predictable costs at scale |\n| Customization | Domain-specific models |\n\n### Enterprise options\n\n| Option | Control | Effort |\n|---|---|---|\n| Commercial API with enterprise terms | Low–medium | Low |\n| Models via sovereign or private cloud | Medium–high | Medium |\n| Self-hosted open-weight models | High | Medium–high |\n| Custom-trained models | Highest | High |\n\n### Practical blueprint\n\n1. Classify data and use cases by sensitivity.\n2. Provide an internal AI gateway with approved models.\n3. Self-host open-weight models for sensitive workloads.\n4. Use commercial models with strong contracts for general tasks.\n5. Keep evaluations and fine-tuning data portable.\n6. Rehearse switching providers."}, {"id": 96, "title": "Risks and failure modes of sovereign AI", "tldr": "Sovereign AI efforts can waste money, fragment the global ecosystem, create new lock-in to national champions, lag behind global quality, or be used for surveillance and censorship. Good design anticipates these failure modes.", "real": "The EU’s AI gigafactory initiative moved from a February 2025 announcement of a €20 billion fund for up to five gigafactories to a July 2026 tender for up to seven, with selection planned for early 2027 and operations about 18 months later. Long timelines like this are typical, and plans must account for them.", "body": "### Failure modes\n\n| Failure mode | Description | Mitigation |\n|---|---|---|\n| White elephants | Expensive infrastructure with few users | Demand-led programs, utilization metrics |\n| Quality gap | National models far behind global leaders | Hybrid strategies, open models, focus on niches |\n| New lock-in | Dependence on a national champion | Competition, open standards, portability |\n| Fragmentation | Incompatible rules and systems across countries | Interoperability, international standards |\n| Delays | Hardware, power, permits behind schedule | Realistic timelines, phased delivery |\n| Surveillance misuse | AI used to monitor citizens unlawfully | Legal limits, oversight, transparency |\n| Capture | Programs serving insiders | Open competition, independent review |\n| Obsolescence | Hardware and models outdated quickly | Refresh budgets, modular design |\n\n### Questions to ask regularly\n\n1. Are users getting better services or products because of this?\n2. Is our dependence on any single supplier actually reduced?\n3. Are we spending on public goods or subsidizing private winners?\n4. Would we choose the same plan today?"}, {"id": 97, "title": "Democratic safeguards and human rights", "tldr": "Sovereign control over AI should come with rights protections: lawful limits on surveillance, transparency, non-discrimination, freedom of expression, data protection, independent oversight and accessible remedies. These make sovereign AI legitimate and trusted.", "real": "The EU AI Act’s prohibitions, which applied from February 2025, ban practices such as social scoring and untargeted scraping of facial images to build recognition databases. The Council of Europe’s Framework Convention on AI commits signatories to protect human rights, democracy and the rule of law across the AI lifecycle.", "body": "### Safeguards checklist\n\n- [ ] Legal basis and limits for any state use of AI on citizens\n- [ ] Independent oversight body with real powers\n- [ ] Transparency registers for public AI systems\n- [ ] Impact assessments for high-risk uses\n- [ ] Non-discrimination testing and remedies\n- [ ] Protection of journalists, activists and opposition from AI surveillance\n- [ ] Freedom of expression in model policies; no hidden political censorship\n- [ ] Data protection and minimization\n- [ ] Courts and complaint mechanisms accessible to ordinary people\n\n### Particularly sensitive uses\n\n| Use | Concern |\n|---|---|\n| Facial recognition in public spaces | Mass surveillance |\n| Predictive policing | Bias, presumption of innocence |\n| Welfare fraud scoring | Discrimination, wrongful penalties |\n| Content moderation by state models | Censorship |\n| Election-related AI | Manipulation, disinformation |\n\n### Principle\n\nSovereignty answers “who decides?” Democracy and rights answer “how, and with what limits?” Both are needed."}, {"id": 98, "title": "Trends shaping the future of sovereign AI", "tldr": "Key trends include rising efficiency (cheaper inference, smaller strong models), narrowing gaps between open and closed models, AI agents in public services, gigawatt infrastructure, model-level export controls, energy constraints, and growing international coordination.", "real": "Stanford’s 2025 AI Index reported that the performance gap between the best open-weight and closed models on a leading chatbot leaderboard narrowed from about 8% in early 2024 to about 1.7% in early 2025. It also reported a steep fall in the cost of querying a model at a fixed level of performance.", "body": "### Trends and implications\n\n| Trend | Implication for sovereignty |\n|---|---|\n| Falling inference costs | Sovereign deployment becomes cheaper |\n| Strong open-weight models | More countries can run capable AI independently |\n| Small efficient models | On-premise and edge sovereignty |\n| AI agents | New security and governance needs (see AI security course) |\n| Gigawatt campuses | Concentration of frontier capacity in few places |\n| Model export controls | Access to frontier models may depend on policy |\n| Energy limits | Power becomes a strategic AI asset |\n| Multimodal and speech | Inclusion of non-literate and multilingual users |\n| Confidential computing | Technical sovereignty in shared infrastructure |\n| International institutions | More coordination on evaluation and standards |\n\n### Scenarios to plan for\n\n1. **Open abundance:** strong open models widely available; focus shifts to data, deployment and adoption.\n2. **Frontier concentration:** a few providers dominate the best capabilities; access agreements become critical.\n3. **Fragmented blocs:** competing technology spheres; alignment choices harder.\n4. **Constrained energy:** power limits growth; efficiency and siting dominate.\n\nRobust strategies perform reasonably in all four."}, {"id": 99, "title": "What has worked so far: lessons from country strategies", "tldr": "Across countries, the strongest approaches are demand-led, use open models and partnerships smartly, fund public goods like data and languages, publish progress honestly, support several companies through competition, and match sovereignty levels to use-case sensitivity.", "real": "Japan’s GENIAC program, launched in 2024 by the Ministry of Economy, Trade and Industry, supports many domestic developers with compute rather than one champion. Korea runs a transparent staged competition, India uses public-private compute, Switzerland bets on full openness, and the UAE uses partnered infrastructure, each a different answer to the same question.", "body": "### Patterns compared\n\n| Pattern | Example | Strength | Watch-out |\n|---|---|---|---|\n| Many supported developers | Japan (GENIAC) | Diversity, resilience | Spreads funds thin |\n| Staged competition | South Korea | Transparency, quality pressure | Losers may exit market |\n| Public-private compute | India | Speed, scale with private capital | Delivery depends on providers |\n| Full openness | Switzerland (Apertus) | Trust, reuse | Smaller scale |\n| Partnered infrastructure | UAE, Saudi Arabia | Rapid access to frontier hardware | Conditions tied to partners |\n| Regulation + public compute | EU | Trust, shared infrastructure | Slower scaling |\n| Champion support | France | Visible capability | Concentration risk |\n\n### Ten lessons\n\n1. Start with use cases and users.\n2. Match sovereignty level to sensitivity.\n3. Fund data and languages as public goods.\n4. Use open models; build adaptation skills.\n5. Pair compute with users and support staff.\n6. Prefer competition over single champions.\n7. Secure power early.\n8. Keep multi-provider fallbacks.\n9. Publish progress, including shortfalls.\n10. Build rights protections in from the start."}, {"id": 100, "title": "Roadmap, checklist and glossary", "tldr": "Use this final chapter as a toolkit: a learning roadmap, a sovereign AI program checklist, and a glossary of key terms. Policies and numbers change quickly, so keep following reliable sources.", "real": "Good sources to follow include the Stanford AI Index, OECD.AI, the IEA’s energy and AI work, Oxford Insights’ readiness index, Epoch AI’s compute data, EuroHPC and national ministries’ official updates (such as IndiaAI, the UK’s DSIT and Korea’s MSIT). Many facts in this course come from these kinds of sources.", "body": "### Learning roadmap\n\n1. Map your country’s (or company’s) AI stack and dependencies.\n2. Read your national AI strategy and one other country’s for comparison.\n3. Study one data protection law and one AI law in detail.\n4. Compare two sovereign cloud offers using the scorecard (ch. 45).\n5. Measure tokenizer efficiency for your languages (ch. 33).\n6. Deploy an open-weight model on infrastructure you control (see the LLM deployment course).\n7. Design a national or enterprise AI gateway (ch. 93).\n8. Draft a one-page strategy with own / partner / buy decisions (ch. 92).\n9. Write a measurement framework with five indicators (ch. 75).\n10. Follow the international summit and institute outputs (ch. 86–88).\n\n### Program checklist\n\n- [ ] Clear goals and critical use cases\n- [ ] Dependency map across all layers\n- [ ] Sovereignty level set per use case\n- [ ] Power and data center plan\n- [ ] Compute access with utilization targets\n- [ ] National data and language programs\n- [ ] Model strategy (build, adapt, buy)\n- [ ] Sovereign cloud and key-control requirements\n- [ ] Security, evaluation and incident capability\n- [ ] Talent pipeline\n- [ ] Procurement rules supporting portability\n- [ ] Rights safeguards and oversight\n- [ ] Public metrics and regular review\n\n### Glossary\n\n| Term | Meaning |\n|---|---|\n| Sovereign AI | Capacity to develop, deploy and govern AI on one’s own terms |\n| Strategic autonomy | Ability to act independently in critical areas |\n| Data residency | Where data is stored |\n| Data localization | Legal requirement to keep data in-country |\n| Data sovereignty | Data governed by and controlled under a jurisdiction |\n| Sovereign cloud | Cloud with local data, operations and legal control |\n| Air-gapped | Physically disconnected from external networks |\n| HYOK / EKM | Hold-your-own-key / external key management |\n| Confidential computing | Protecting data during processing in hardware enclaves |\n| Open weights | Model parameters released for download |\n| Fully open model | Weights plus data recipes, code and documentation |\n| Continued pretraining | Further training a base model on new data, e.g. a language |\n| Tokenizer fertility | Tokens per word; measures language efficiency |\n| AI factory | Facility providing AI compute and services |\n| Gigawatt campus | Very large AI data center site |\n| Export controls | Government limits on exporting technology |\n| Digital public infrastructure | Shared identity, payments and data-exchange systems |\n| AI safety / security institute | Government body evaluating advanced AI |\n| PUE | Power usage effectiveness of a data center |\n| TCO | Total cost of ownership |"}];
const PARTS = ["Foundations of sovereign AI", "History and geopolitics", "Compute sovereignty", "Semiconductors and supply chains", "Energy and data center infrastructure", "Data sovereignty", "Language and culture", "Model strategies", "Sovereign cloud", "Security and trust", "Regulation and governance", "Country strategies: Americas and Europe", "Country strategies: Asia and the Middle East", "More country strategies", "Economics and financing", "Talent and ecosystems", "AI in the public sector", "International cooperation", "Building a sovereign AI program", "Risks, lessons and the road ahead"];
const partOf = id => Math.ceil(id / 5);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "sov-ai-course-progress-v1";
const LS_LAST = "sov-ai-course-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try{ await dbRef.set({done:[...done].sort((a,b)=>a-b), updated:Date.now()}); }
  catch(e){ if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; pushRemote(); }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...done])); }catch(e){} }
function toggle(id){
  if (done.has(id)) done.delete(id); else done.add(id);
  saveLocal(); pushRemote(); renderAll();
  toast(done.has(id) ? "Chapter " + id + " marked complete" : "Chapter " + id + " marked not complete");
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(s){
  if (window.marked && marked.parse){
    const html = marked.parse(s, {gfm:true, headerIds:false, mangle:false});
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  }
  return "<pre>" + esc(s) + "</pre>";
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function currentId(){
  const m = location.hash.match(/^#ch-(\d{1,3})$/);
  const n = m ? +m[1] : 0;
  return n >= 1 && n <= 100 ? n : 0;
}

/* ---------- header memory bank ---------- */
function renderBank(){
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    html += '<div class="bank-group" title="Part ' + p + ': ' + esc(PARTS[p-1]) + '">';
    for (let i = (p-1)*5 + 1; i <= p*5; i++){
      html += '<button class="cell' + (done.has(i) ? " done" : "") + (i === cur ? " here" : "") +
        '" data-go="' + i + '" aria-label="Chapter ' + i + (done.has(i) ? ", complete" : "") + '"></button>';
    }
    html += "</div>";
  }
  document.getElementById("bank").innerHTML = html;
  document.getElementById("doneCount").textContent = done.size;
  document.getElementById("pct").textContent = Math.round(done.size) + "%";
}

/* ---------- sidebar ---------- */
const openParts = new Set();
function renderSide(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    const ids = [1,2,3,4,5].map(k => (p-1)*5 + k);
    const matches = ids.filter(i => !q || byId[i].title.toLowerCase().includes(q) || byId[i].tldr.toLowerCase().includes(q) || String(i) === q);
    if (q && !matches.length) continue;
    const count = ids.filter(i => done.has(i)).length;
    const open = q || openParts.has(p) || partOf(cur) === p;
    html += '<div class="part' + (open ? " open" : "") + '">' +
      '<button class="part-head" data-part="' + p + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="part-num">' + String(p).padStart(2, "0") + '</span>' +
      '<span class="part-name">' + esc(PARTS[p-1]) + '</span>' +
      '<span class="part-count' + (count === 5 ? " full" : "") + '">' + count + '/5</span></button><ul class="part-list">';
    for (const i of matches){
      html += '<li class="ch-row' + (i === cur ? " active" : "") + '">' +
        '<button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="' + (done.has(i) ? "Mark chapter " + i + " not complete" : "Mark chapter " + i + " complete") + '">' + TICK + '</button>' +
        '<a href="#ch-' + i + '"><span class="n">' + i + '.</span>' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ul></div>";
  }
  if (!html) html = '<p style="color:var(--muted);font-size:14px;padding:8px">No chapters match that search. Try a shorter word like “compute” or “India”.</p>';
  document.getElementById("parts").innerHTML = html;
}

/* ---------- chapter view ---------- */
function renderChapter(id){
  const c = byId[id];
  const p = partOf(id);
  const ids = [1,2,3,4,5].map(k => (p-1)*5 + k);
  const isDone = done.has(id);
  const tabs = ids.map(i =>
    '<button class="tab' + (i === id ? " active" : "") + '" role="tab" aria-selected="' + (i === id) + '" data-go="' + i + '">' +
    '<span class="dot' + (done.has(i) ? " on" : "") + '"></span><span class="tab-t">' + i + '. ' + esc(byId[i].title) + '</span></button>'
  ).join("");
  document.getElementById("main").innerHTML =
    '<p class="crumb">Part ' + p + ' of 20: ' + esc(PARTS[p-1]) + '</p>' +
    '<div class="tabs" role="tablist" aria-label="Chapters in this part">' + tabs + '</div>' +
    '<article>' +
      '<p class="ch-no">Chapter ' + id + ' of 100</p>' +
      '<h1 class="ch-title">' + esc(c.title) + '</h1>' +
      '<section class="box tldr"><h2>TL;DR</h2><p>' + inlineMd(c.tldr) + '</p></section>' +
      '<div class="body">' + md(c.body) + '</div>' +
      '<section class="box real"><h2>Real-world example</h2><p>' + inlineMd(c.real) + '</p></section>' +
      '<div class="done-bar">' +
        '<button class="complete' + (isDone ? " on" : "") + '" data-toggle="' + id + '" aria-pressed="' + isDone + '">' +
          '<span class="tick' + (isDone ? " on" : "") + '">' + TICK + '</span>' + (isDone ? "Completed" : "Mark as complete") + '</button>' +
        '<div class="nav">' +
          '<button class="btn" data-go="' + (id - 1) + '"' + (id === 1 ? " disabled" : "") + '>Previous</button>' +
          '<button class="btn" data-go="' + (id + 1) + '"' + (id === 100 ? " disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>' +
    '</article>';
}

/* ---------- contents view ---------- */
function renderContents(){
  let html = '<div class="contents"><h1>Contents</h1>' +
    '<p class="lead">Twenty parts, five chapters each. Tick a chapter when you finish it; your progress is saved for next time. Facts reflect public sources up to November 2026; budgets, laws and timelines change often, so check official sources before relying on a specific number.</p>' +
    '<div class="contents-actions"><button class="btn" data-go="' + firstUnread() + '">' + (done.size ? "Continue with chapter " + firstUnread() : "Start chapter 1") + '</button>' +
    '<button class="btn" id="resetBtn">Reset progress</button></div><div class="grid">';
  for (let p = 1; p <= 20; p++){
    const ids = [1,2,3,4,5].map(k => (p-1)*5 + k);
    const count = ids.filter(i => done.has(i)).length;
    html += '<section class="pcard"><h2>Part ' + p + ': ' + esc(PARTS[p-1]) + '</h2><div class="meta">' + count + ' of 5 complete</div><ol>';
    for (const i of ids){
      html += '<li><button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="Toggle chapter ' + i + '">' + TICK + '</button><a href="#ch-' + i + '">' + i + '. ' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ol></section>";
  }
  document.getElementById("main").innerHTML = html + "</div></div>";
}
function firstUnread(){ for (let i = 1; i <= 100; i++) if (!done.has(i)) return i; return 100; }

/* ---------- routing ---------- */
let lastRendered = null;
function renderAll(){
  const id = currentId();
  renderBank(); renderSide();
  const y = window.scrollY;
  if (id) renderChapter(id); else renderContents();
  if (lastRendered === location.hash) window.scrollTo(0, y);
  lastRendered = location.hash;
}
function route(){
  const id = currentId();
  if (!id && location.hash !== "#contents"){
    let last = 0; try{ last = +localStorage.getItem(LS_LAST) || 0; }catch(e){}
    location.replace("#ch-" + (last >= 1 && last <= 100 ? last : 1));
    return;
  }
  if (id){ try{ localStorage.setItem(LS_LAST, id); }catch(e){} }
  document.body.classList.remove("drawer");
  renderAll();
  window.scrollTo(0, 0);
  const active = document.querySelector(".ch-row.active");
  if (active) active.scrollIntoView({block:"nearest"});
  const tab = document.querySelector(".tab.active");
  if (tab && tab.parentElement){ const r = tab.parentElement; const left = tab.offsetLeft - r.offsetLeft; if (left < r.scrollLeft || left + tab.offsetWidth > r.scrollLeft + r.clientWidth) r.scrollLeft = left - 16; }
}
function go(id){ if (id >= 1 && id <= 100) location.hash = "#ch-" + id; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){ e.preventDefault(); toggle(+t.dataset.toggle); return; }
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled){ go(+g.dataset.go); return; }
  const ph = e.target.closest("[data-part]");
  if (ph){
    const p = +ph.dataset.part;
    const el = ph.parentElement;
    const isOpen = el.classList.toggle("open");
    if (isOpen) openParts.add(p); else openParts.delete(p);
    ph.setAttribute("aria-expanded", isOpen);
    return;
  }
  if (e.target.id === "resetBtn"){
    if (confirm("Clear all 100 ticks? This can’t be undone.")){ done.clear(); saveLocal(); pushRemote(); renderAll(); toast("Progress reset"); }
  }
});
document.getElementById("search").addEventListener("input", renderSide);
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.add("drawer"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = currentId(); if (!id) return;
  if (e.key === "ArrowRight") go(id + 1);
  else if (e.key === "ArrowLeft") go(id - 1);
});
function setTopH(){ document.documentElement.style.setProperty("--top-h", document.getElementById("top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);
window.addEventListener("hashchange", route);
setTopH();
route();
initSync();
</script>
<script src="book-bg.js?v=2"></script>
</body>
</html>

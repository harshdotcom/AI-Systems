<style>
:root{
  --bg:#F2F0F2; --surface:#FFFFFF; --surface-2:#F8F6F8; --ink:#1D1620; --muted:#5E5562; --line:#DDD6DD;
  --accent:#7A3B69; --accent-soft:#F1E3EE; --accent-ink:#FFFFFF;
  --amber:#B97A0B; --tldr-bg:#FFF5DC; --tldr-line:#D49A22;
  --indigo:#1F5E6E; --real-bg:#E6F1F3; --real-line:#2F7C8F;
  --code-bg:#1D1620; --code-ink:#ECE3EC; --inline-code:#EDE6EC;
  --cell-empty:#E0D8E0; --shadow:0 1px 0 rgba(29,22,32,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141016; --surface:#1B161E; --surface-2:#221C26; --ink:#EDE6EE; --muted:#A99FAD; --line:#33293A;
    --accent:#D99BC8; --accent-soft:#3A2236; --accent-ink:#2A0F24;
    --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
    --indigo:#86CBDA; --real-bg:#13262B; --real-line:#4FA3B6;
    --code-bg:#0E0B10; --code-ink:#E2D9E3; --inline-code:#2B2230;
    --cell-empty:#33293A; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141016; --surface:#1B161E; --surface-2:#221C26; --ink:#EDE6EE; --muted:#A99FAD; --line:#33293A;
  --accent:#D99BC8; --accent-soft:#3A2236; --accent-ink:#2A0F24;
  --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
  --indigo:#86CBDA; --real-bg:#13262B; --real-line:#4FA3B6;
  --code-bg:#0E0B10; --code-ink:#E2D9E3; --inline-code:#2B2230;
  --cell-empty:#33293A; --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header with the memory-bank progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:20px;padding:12px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted)}
.bank{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bank-row{display:flex;gap:4px;flex-wrap:nowrap;min-width:0}
.bank-group{flex:1;min-width:0;display:flex;gap:2px;padding:3px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.cell{flex:1;min-width:2px;max-width:10px;height:18px;border-radius:2px;background:var(--cell-empty);border:0;padding:0;cursor:pointer;transition:background .2s}
.cell.done{background:var(--accent)}
.cell.here{box-shadow:0 0 0 2px var(--amber)}
.bank-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bank-meta strong{color:var(--ink);font-weight:600}
.top-actions{display:flex;gap:8px}
.btn{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.menu-btn{display:none}

/* Shell */
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,76px));height:calc(100dvh - var(--top-h,76px) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg)}
.search{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
.part{margin-bottom:4px}
.part-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:8px;cursor:pointer}
.part-head:hover{background:var(--surface-2)}
.part-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);width:22px;flex:none}
.part-name{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.part-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.part-count.full{color:var(--accent);font-weight:600}
.part-list{list-style:none;margin:0 0 6px;padding:0 0 0 30px;display:none}
.part.open .part-list{display:block}
.ch-row{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:6px}
.ch-row.active{background:var(--accent-soft)}
.ch-row a{flex:1;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.ch-row a .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.tick{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:11px;height:11px;opacity:0}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{opacity:1;color:var(--accent-ink)}
.hidden{display:none!important}

/* Main reading area */
.main{padding:24px 32px 80px;min-width:0}
.crumb{font-size:14px;color:var(--muted);margin:0 0 12px}
.crumb a{color:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;font-size:14px;color:var(--muted);max-width:240px;text-align:left}
.tab .tab-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--cell-empty)}
.tab .dot.on{background:var(--accent)}
article{max-width:780px}
.ch-no{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--accent);font-size:15px;margin:0}
h1.ch-title{font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:6px 0 22px;font-weight:700;text-wrap:balance}
.box{border-radius:10px;padding:16px 18px;margin:0 0 26px;border-left:4px solid}
.box h2{font-size:14px;margin:0 0 6px;font-weight:600}
.box p{margin:0}
.tldr{background:var(--tldr-bg);border-color:var(--tldr-line)}
.tldr h2{color:var(--amber)}
.tldr p{font-size:17px;line-height:1.55}
.real{background:var(--real-bg);border-color:var(--real-line);margin-top:34px}
.real h2{color:var(--indigo)}
.body h3{font-size:20px;margin:30px 0 10px;letter-spacing:-.01em}
.body p{margin:0 0 14px}
.body ul,.body ol{padding-left:22px;margin:0 0 16px}
.body li{margin:4px 0}
.body li input[type=checkbox]{margin-right:6px;accent-color:var(--accent)}
.body code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.88em;background:var(--inline-code);padding:1px 5px;border-radius:4px}
.body pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13.5px;line-height:1.55;margin:0 0 18px}
.body pre code{background:none;padding:0;font-size:inherit;color:inherit}
.table-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.body table{border-collapse:collapse;width:100%;font-size:14px}
.body th,.body td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.body th{background:var(--surface-2);font-weight:600}
.body tr:last-child td{border-bottom:0}
.body strong{font-weight:600}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.complete{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:15px}
.complete .tick{border-color:currentColor;pointer-events:none}
.complete.on{background:var(--accent);color:var(--accent-ink)}
.complete.on .tick{background:var(--accent-ink);border-color:var(--accent-ink)}
.complete.on .tick svg{opacity:1;color:var(--accent)}
.nav{display:flex;gap:8px}
.nav .btn[disabled]{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}

/* Contents view */
.contents h1{font-size:32px;margin:0 0 6px;letter-spacing:-.02em}
.contents .lead{color:var(--muted);margin:0 0 24px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.pcard h2{font-size:15px;margin:0 0 2px;line-height:1.3}
.pcard .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pcard ol{list-style:none;padding:0;margin:0}
.pcard li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13.5px;line-height:1.35}
.pcard li a{color:var(--ink);text-decoration:none;flex:1}
.pcard li a:hover{text-decoration:underline}
.contents-actions{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}

/* Mobile */
.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);height:auto;z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .menu-btn{display:inline-block}
  .main{padding:18px 16px 60px}
  .top-inner{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand{flex:1}
  .bank{order:3;flex-basis:100%}
  .bank-row{gap:3px}
  .bank-group{gap:1px;padding:2px}
  .cell{height:14px;max-width:none}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const CHAPTERS = [{"id": 1, "title": "What sovereign AI means", "tldr": "Sovereign AI is a country’s (or organization’s) ability to develop, deploy and govern AI on its own terms: control over the compute, data, models, rules and talent it depends on, so that no outside party can unilaterally cut it off or dictate how it is used.", "real": "Nvidia CEO Jensen Huang popularized the phrase at the World Government Summit in Dubai in February 2024, arguing that every country needs to own the production of its own intelligence. Nvidia later told investors it expected sovereign AI revenue to reach the low double-digit billions of dollars in its 2025 fiscal year.", "body": "### A working definition\n\n**Sovereign AI** = the capacity to make and enforce your own choices about AI across the full stack, without critical dependence on actors you do not trust or cannot influence.\n\n### Three questions that define it\n\n| Question | Example |\n|---|---|\n| **Who controls it?** | Who can switch the service off, change it, or see the data? |\n| **Whose rules apply?** | Which country’s laws govern the data, models and operators? |\n| **Whose values and languages does it reflect?** | Does it work well in local languages and contexts? |\n\n### What it is not\n\n- **Not autarky.** Almost no country can build every layer alone; the goal is managed dependence.\n- **Not only a national model.** A model without compute, data, talent and governance is not sovereignty.\n- **Not only for governments.** Companies, regions (such as the EU) and sectors (defense, health) pursue sovereignty too.\n\n### The two main motivations\n\n1. **Resilience and security:** keep critical AI services running and protected from foreign interference.\n2. **Economic and cultural value:** capture AI’s economic gains locally and make sure AI serves local languages, laws and needs.\n\n### Course map\n\nParts 1–2 cover concepts and geopolitics; Parts 3–9 cover each layer of the stack; Parts 10–11 cover security and regulation; Parts 12–14 cover country strategies; Parts 15–20 cover economics, ecosystems, public-sector use, cooperation and how to build a program."}, {"id": 2, "title": "Why sovereign AI became urgent", "tldr": "Generative AI became a general-purpose technology almost overnight. Countries realized that compute, frontier models and cloud platforms were concentrated in a few companies in a few countries, and that export controls, outages or policy changes could cut off access.", "real": "On 27 January 2025, after China’s DeepSeek released its R1 reasoning model with open weights, Nvidia lost roughly $590 billion in market value in a single day. The episode showed both how concentrated AI power had been and how quickly a new player could change the picture.", "body": "### The drivers\n\n| Driver | What changed |\n|---|---|\n| **General-purpose technology** | AI now touches government, defense, health, education and industry |\n| **Concentration** | A handful of firms dominate frontier models, AI chips and cloud |\n| **Geopolitics** | Export controls on chips (since 2022) made access a policy decision |\n| **Data protection** | Sending sensitive citizen data abroad raises legal and security issues |\n| **Language and culture** | Early models served English far better than most other languages |\n| **Economic capture** | Countries want AI value created locally, not only imported |\n| **Security of services** | Foreign providers can change terms, prices or availability |\n\n### The dependency chain\n\n```\nYour public service ─► AI application ─► model API ─► cloud region ─► GPUs ─► chip fabs\n       (local)            (local?)        (foreign?)    (foreign?)    (foreign)  (very few countries)\n```\n\nEvery arrow is a potential point of control by someone else.\n\n### Why “now” rather than in the cloud era\n\nCloud dependence already raised these questions (Part 9), but AI adds three things: models encode values and language, AI may become a decisive economic and military capability, and the hardware is scarcer and more export-controlled than ordinary servers."}, {"id": 3, "title": "The sovereign AI stack", "tldr": "Sovereign AI spans seven layers: energy, chips, compute infrastructure, data, models, applications and governance, with talent running through all of them. Countries decide layer by layer what to own, what to partner for and what to buy.", "real": "South Korea’s government defined sovereignty strictly at the model layer. In its 2026 evaluation of national foundation model projects, the science ministry said a sovereign model must be trained by the developer from initialized weights, and it did not advance one entrant whose system it judged did not meet that standard.", "body": "### The seven layers\n\n```\n┌───────────────────────────────────────────────┐\n│ 7. Governance: laws, standards, oversight     │\n├───────────────────────────────────────────────┤\n│ 6. Applications: public services, industry    │\n├───────────────────────────────────────────────┤\n│ 5. Models: foundation, fine-tuned, small      │\n├───────────────────────────────────────────────┤\n│ 4. Data: national datasets, language corpora  │\n├───────────────────────────────────────────────┤\n│ 3. Compute & cloud: data centers, GPUs, ops   │\n├───────────────────────────────────────────────┤\n│ 2. Semiconductors: design, fabs, memory       │\n├───────────────────────────────────────────────┤\n│ 1. Energy: power generation, grid, cooling    │\n└───────────────────────────────────────────────┘\n        Talent and capital run through every layer\n```\n\n### Control questions per layer\n\n| Layer | Sovereignty question |\n|---|---|\n| Energy | Can we power AI data centers reliably and affordably? |\n| Chips | Can we obtain accelerators even under export controls? |\n| Compute | Who operates the data centers and under which law? |\n| Data | Do we control our datasets and where they are processed? |\n| Models | Can we train, adapt or at least run models ourselves? |\n| Applications | Are critical services built and operated locally? |\n| Governance | Do our rules apply and can we enforce them? |\n\n### Key idea\n\nSovereignty is only as strong as the **weakest critical layer** for a given use case. A national model running on a foreign-controlled cloud is not fully sovereign for classified workloads."}, {"id": 4, "title": "Degrees of sovereignty", "tldr": "Sovereignty is a spectrum, not a switch: from pure dependence, through managed dependence and strategic autonomy, to full self-sufficiency. Most countries aim for strategic autonomy in a few critical layers and diversified partnerships elsewhere.", "real": "The EU frames its goal as “open strategic autonomy”: acting independently where it matters while staying open to trade. Mario Draghi’s 2024 report on European competitiveness warned that the EU relies on non-EU countries for roughly 80% of its digital products, services, infrastructure and intellectual property.", "body": "### The spectrum\n\n| Level | Description | Example posture |\n|---|---|---|\n| 0. Dependence | Use foreign AI services as offered | Consumer apps, default cloud |\n| 1. Contractual control | Negotiated terms: data location, no training on data | Enterprise agreements |\n| 2. Operational control | Local operators, local keys, in-country regions | Sovereign cloud offerings |\n| 3. Technological capability | Ability to train or adapt and run your own models | National model programs |\n| 4. Strategic autonomy | Critical layers owned or with multiple trusted suppliers | Large blocs and major powers |\n| 5. Self-sufficiency | Every layer domestic | No country today has this fully |\n\n### Choosing a target per use case\n\n| Use case | Reasonable target |\n|---|---|\n| Public website chatbot | Level 1–2 |\n| Citizen health records | Level 2–3 |\n| Tax and benefits decisions | Level 2–3 |\n| Intelligence and defense | Level 3–4, often air-gapped |\n| National language model | Level 3 |\n\n### The rule\n\nMatch the level of sovereignty to the **criticality and sensitivity** of each use, not one level for everything. Over-sovereignty wastes money; under-sovereignty creates risk."}, {"id": 5, "title": "Myths and trade-offs", "tldr": "Sovereignty costs money, time and sometimes quality. Common myths are that a national model equals sovereignty, that local data centers alone solve legal exposure, and that self-sufficiency is achievable. Good strategies weigh control against cost and capability.", "real": "Gaia-X, launched by France and Germany in 2019–2020 to build a European cloud ecosystem, admitted large non-EU cloud providers as members and evolved mainly into a framework for data-sharing rules and labels. Critics argued it did not produce the European cloud alternative many had expected.", "body": "### Five common myths\n\n| Myth | Reality |\n|---|---|\n| “A national LLM makes us sovereign” | Without compute, talent, data and adoption it is a demo |\n| “Data in our country is safe from foreign law” | Ownership and control of the provider matter too (ch. 29) |\n| “We must build everything ourselves” | No one does; choose critical layers |\n| “Sovereign = closed” | Open-weight models and open standards are major sovereignty tools |\n| “Sovereignty is a one-time purchase” | Hardware ages in 3–5 years; models in months |\n\n### The core trade-offs\n\n| Gain | Cost |\n|---|---|\n| Control and resilience | Higher cost per unit of capability |\n| Local language quality | Smaller training budgets than global labs |\n| Legal certainty | Fewer features, slower updates |\n| Local economic capture | Risk of subsidizing uncompetitive champions |\n\n### Questions to ask any proposal\n\n1. Which specific dependency does this reduce?\n2. What would happen without it in a crisis?\n3. What is the full cost over five years, including refresh?\n4. Who will use it, and is there demand?\n5. How will we measure success?"}, {"id": 6, "title": "Where the idea came from", "tldr": "Sovereign AI grew out of earlier “digital sovereignty” and “data sovereignty” debates about internet governance, cloud dependence and surveillance. The 2013 Snowden revelations and the cloud era set the stage; generative AI and chip controls made it urgent.", "real": "After the 2013 Snowden disclosures about mass surveillance, Brazil and Germany led a United Nations General Assembly resolution on “the right to privacy in the digital age”, adopted in December 2013. It marked the start of governments treating data flows as a sovereignty issue.", "body": "### Timeline of ideas\n\n| Period | Debate |\n|---|---|\n| 1990s–2000s | Internet governance: who controls domain names and standards |\n| 2013 | Snowden revelations: foreign surveillance of data and communications |\n| 2015–2020 | EU court rulings invalidate EU–US data transfer frameworks (ch. 7) |\n| 2016–2021 | Data localization laws spread (ch. 27) |\n| 2019–2020 | European cloud initiatives (Gaia-X) and “digital sovereignty” in EU policy |\n| 2022 | US export controls on advanced AI chips to China |\n| 2022–2023 | ChatGPT shows generative AI’s reach; national model programs begin |\n| 2024 | “Sovereign AI” enters mainstream vocabulary |\n| 2025–2026 | Large national compute programs, gigawatt campuses and model-access controls |\n\n### Related terms\n\n| Term | Focus |\n|---|---|\n| Digital sovereignty | Control over digital infrastructure and rules broadly |\n| Data sovereignty | Control over data, its location and the law that applies |\n| Technological sovereignty | Capability to produce key technologies |\n| Strategic autonomy | Ability to act independently in critical areas |\n| Sovereign AI | All of the above applied to the AI stack |"}, {"id": 7, "title": "The data-transfer battles that shaped digital sovereignty", "tldr": "Europe’s long legal fight over sending personal data to the US showed that the location of data is not enough: what matters is which governments can compel access. These rulings directly inform how sovereign AI and sovereign cloud are designed today.", "real": "The Court of Justice of the EU struck down the EU–US Safe Harbor framework in 2015 (Schrems I) and its successor, Privacy Shield, in 2020 (Schrems II), citing US surveillance law. A third framework, the EU–US Data Privacy Framework, was adopted in July 2023, and the EU General Court rejected a challenge to it in September 2025.", "body": "### The sequence\n\n| Year | Event | Outcome |\n|---|---|---|\n| 2000 | Safe Harbor adopted | Transfers allowed under self-certification |\n| 2015 | Schrems I | Safe Harbor invalidated |\n| 2016 | Privacy Shield adopted | New framework |\n| 2020 | Schrems II | Privacy Shield invalidated; standard contractual clauses need case-by-case assessment |\n| 2023 | EU–US Data Privacy Framework | New adequacy decision |\n| 2025 | General Court (Latombe case) | Challenge to the framework dismissed; further appeals possible |\n\n### Lessons for sovereign AI\n\n1. **Legal access matters more than physical location.**\n2. **Frameworks can be invalidated**, creating sudden compliance shocks.\n3. **Technical safeguards** (encryption, local key control) became a way to reduce legal risk.\n4. **Contracts alone are not enough** when foreign law can override them.\n\n### How this shapes AI design\n\nWhen an AI system processes sensitive personal data, designers now ask: who operates the model and infrastructure, under which jurisdiction, and can foreign authorities compel access to prompts, outputs or training data?"}, {"id": 8, "title": "US–China technology competition", "tldr": "The rivalry between the US and China is the main geopolitical force shaping AI supply chains. Export controls, investment restrictions, competing open-weight models and rival governance initiatives all push other countries to think about their own position.", "real": "On 7 October 2022, the US Commerce Department introduced sweeping export controls on advanced computing chips and chipmaking equipment destined for China. The rules were updated in 2023 and 2024 and changed again in 2025–2026, making access to top AI chips a matter of government policy rather than only commercial purchase.", "body": "### Main fronts\n\n| Front | US measures | China’s response |\n|---|---|---|\n| Chips | Export controls on advanced GPUs and HBM | Domestic accelerators (e.g. Huawei Ascend), stockpiling |\n| Equipment | Controls on lithography and fab tools, with allies | Investment in domestic equipment makers |\n| Models | Frontier closed models; debates on model export controls | Strong open-weight models (DeepSeek, Qwen and others) |\n| Capital | Outbound investment restrictions | State funds for chips and AI |\n| Governance | Domestic action plan, AI export promotion | Global AI governance initiatives |\n\n### What it means for other countries\n\n- **Access risk:** hardware and services from either side may come with conditions.\n- **Alignment pressure:** partnerships can require choosing suppliers and security commitments.\n- **Opportunity:** competition creates offers of investment, models and infrastructure.\n\n### A balanced view\n\nSupporters of export controls argue they protect national security and slow rivals’ military AI. Critics argue they push affected countries to build substitutes faster and cost exporters market share. Both effects are debated in policy research."}, {"id": 9, "title": "Middle powers and hedging strategies", "tldr": "Countries that are neither the US nor China, from the UK, France and Japan to India, the UAE and Saudi Arabia, combine domestic investment with partnerships, trying to secure access to the best technology while keeping options open and building local capability.", "real": "In April 2024, Microsoft invested $1.5 billion in Abu Dhabi’s G42 under an arrangement backed by US and UAE government assurances. G42 had earlier said it would phase out Chinese hardware, illustrating how middle powers trade alignment commitments for access to leading US technology.", "body": "### Common middle-power playbook\n\n| Element | Purpose |\n|---|---|\n| Domestic compute programs | Baseline capacity under national control |\n| National model or language model programs | Local language and capability |\n| Partnerships with leading firms | Access to frontier chips, models and know-how |\n| Investment abroad | Leverage and seats at the table |\n| Regulatory leadership | Shape global norms |\n| Niche excellence | Specialize in areas like robotics, health or chips |\n\n### Hedging techniques\n\n- Multi-vendor procurement (more than one model provider and cloud)\n- Open-weight models as fallback options\n- Joint ventures with local majority control\n- Security commitments that unlock export licenses\n- Regional cooperation (EU, ASEAN, African Union)\n\n### The tension\n\nDeeper partnership with one bloc often means accepting its security rules. Each middle power balances access against autonomy differently."}, {"id": 10, "title": "Perspectives from the Global South", "tldr": "For many developing countries, the priority is less about frontier models and more about affordable access to compute, AI that works in local languages, fair data partnerships, skills, and a voice in global rules. Regional cooperation and open models are key tools.", "real": "The African Union endorsed a Continental Artificial Intelligence Strategy in July 2024 that emphasizes African-led development, data governance, skills and regional cooperation. Grassroots research communities such as Masakhane have built datasets and models for African languages through open collaboration.", "body": "### Priorities\n\n| Priority | Why |\n|---|---|\n| Affordable compute access | National clusters are expensive; shared regional capacity helps |\n| Local languages | Thousands of languages are poorly served by global models |\n| Data rights | Avoid extracting local data without local benefit |\n| Skills | Talent pipelines and retention |\n| Connectivity and power | Basic infrastructure precedes AI |\n| Voice in governance | Rules written elsewhere affect everyone |\n\n### Practical approaches\n\n- **Open-weight models** adapted to local languages instead of training from scratch\n- **Regional compute hubs** shared by several countries\n- **Digital public infrastructure** that AI services can plug into (ch. 82)\n- **Community data efforts** with fair licensing\n- **South–South cooperation** on datasets, benchmarks and policy\n\n### A different definition of success\n\nFor a country with limited budgets, sovereign AI may mean: “our citizens can use AI in their own languages, our sensitive data stays under our law, and our engineers can adapt and run models”, not owning a frontier lab."}, {"id": 11, "title": "Why compute is the bottleneck", "tldr": "Training and serving modern AI requires large clusters of specialized accelerators, and the compute used to train leading models has grown several-fold each year. Access to compute is therefore the most tangible, and most contested, layer of sovereign AI.", "real": "Research group Epoch AI has estimated that the training compute of notable AI models grew roughly four to five times per year over the past decade. That pace has made national compute programs, not just research grants, a central policy tool.", "body": "### Training vs inference\n\n| | Training | Inference (serving) |\n|---|---|---|\n| What | Building or adapting a model | Answering users’ requests |\n| Pattern | Huge, bursty, weeks to months | Continuous, grows with adoption |\n| Hardware | Tightly linked GPU clusters | Can be spread across many smaller sites |\n| Sovereignty concern | Can we build our own models? | Can we serve citizens without foreign dependence? |\n\n### Why inference matters more over time\n\nOnce AI is widely adopted, serving millions of users can need more total compute than training. A sovereign strategy that funds only training clusters may leave public services dependent on foreign inference.\n\n### What “compute” includes\n\n- Accelerators (GPUs, TPUs, other AI chips)\n- High-speed networking between them\n- Storage for datasets and checkpoints\n- Data center power and cooling\n- Software stack and **skilled operators**\n\n### Measuring capacity\n\nCountries describe compute in different units: number of GPUs, petaflops or exaflops, megawatts of data center power, or GPU-hours delivered to users. When comparing programs, check which unit is used and whether the figure is installed, contracted or merely announced."}, {"id": 12, "title": "National supercomputers and AI factories", "tldr": "Many governments build or fund AI supercomputers (“AI factories”) for researchers, startups and public bodies. They provide baseline sovereign compute and expertise, but are smaller than the largest private clusters.", "real": "The UK launched Isambard-AI in Bristol in 2025, built with about 5,400 Nvidia GH200 superchips, as the core of its AI Research Resource. Switzerland’s Alps system at CSCS, with over 10,000 GH200 chips, was used to train the fully open Apertus model released in 2025.", "body": "### Examples of public AI compute\n\n| Country / bloc | System or program |\n|---|---|\n| EU | EuroHPC supercomputers and a network of 19 AI Factories |\n| UK | Isambard-AI (Bristol), Dawn (Cambridge) in the AI Research Resource |\n| Switzerland | Alps at CSCS |\n| Germany | JUPITER at Jülich, Europe’s first exascale system |\n| Japan | ABCI at AIST |\n| India | IndiaAI common compute through empanelled private providers |\n| US | NAIRR pilot (shared research resource) and national lab systems |\n\n### What these systems are good for\n\n- Academic research and open-science models\n- Startups that cannot afford commercial clusters\n- Fine-tuning national or sector models\n- Training talent on large systems\n\n### Limits\n\n| Limit | Implication |\n|---|---|\n| Smaller than frontier private clusters | Rarely enough for frontier-scale training |\n| Allocation by proposals | Slower access than commercial cloud |\n| Refresh cycles | Hardware ages in a few years |\n| Utilization | Must be filled by real users to be worthwhile |"}, {"id": 13, "title": "Ownership models for national compute", "tldr": "Governments can own and run compute directly, fund private providers through public-private partnerships, subsidize users with vouchers, or reserve capacity through long-term contracts. Each model trades control against speed, cost and flexibility.", "real": "India’s IndiaAI Mission chose a public-private model: instead of building one state supercomputer, it empanelled private cloud providers and offers GPU access to startups, researchers and model builders at subsidized hourly rates. By 2026 it reported more than 38,000 GPUs available through its common compute portal.", "body": "### Four models\n\n| Model | How it works | Pros | Cons |\n|---|---|---|---|\n| **State-owned** | Government builds and runs | Maximum control | Slow procurement, needs operators |\n| **PPP / empanelment** | Private providers host, government subsidizes usage | Fast, uses private capital | Less control, vendor quality varies |\n| **Vouchers / credits** | Users get credits for approved providers | Flexible, demand-driven | Money may flow to foreign clouds |\n| **Reserved capacity** | Long-term contracts for dedicated capacity | Predictable access | Lock-in, take-or-pay risk |\n\n### Hybrid approaches are common\n\n```\nSensitive / classified ─► state-owned, air-gapped\nResearch & startups     ─► PPP or public supercomputers with allocation\nGeneral government use  ─► certified sovereign cloud\nCommodity workloads     ─► commercial cloud with contractual controls\n```\n\n### Key design choices\n\n- Who qualifies for subsidized access?\n- How is capacity allocated (merit, first-come, strategic priority)?\n- What security and data rules apply to providers?\n- How is utilization tracked and reported?"}, {"id": 14, "title": "GPU supply and vendor concentration", "tldr": "Nvidia dominates AI accelerators, and its software ecosystem (CUDA) deepens dependence. Alternatives include AMD, Google TPUs (via cloud), AWS Trainium, Huawei Ascend in China, and various startups. Diversifying hardware reduces risk but costs engineering effort.", "real": "DeepSeek reported training its V3 model on 2,048 Nvidia H800 chips, a version designed to comply with earlier US export rules. It showed that careful engineering could partly offset restricted hardware, while Chinese firms also invested heavily in domestic accelerators such as Huawei’s Ascend line.", "body": "### The accelerator landscape (simplified)\n\n| Supplier | Products | Notes |\n|---|---|---|\n| Nvidia | Hopper, Blackwell GPUs | Dominant; CUDA ecosystem |\n| AMD | Instinct MI300/MI350 series | Growing software support (ROCm) |\n| Google | TPUs | Mostly via Google Cloud |\n| AWS | Trainium, Inferentia | Via AWS |\n| Intel | Gaudi | Smaller share |\n| Huawei | Ascend | Main domestic option in China |\n| Others | Cerebras, Groq and more | Specialized architectures |\n\n### Why software lock-in matters\n\nModels, kernels and tools are often optimized for CUDA first. Switching vendors can require porting work and performance tuning. Frameworks such as PyTorch and engines like vLLM increasingly support multiple vendors, which lowers this barrier.\n\n### Procurement strategies\n\n- Multi-vendor tenders with portability requirements\n- Standardize on hardware-neutral software layers\n- Keep a share of capacity on a second supplier\n- Long-term supply agreements for critical needs\n- Plan for 3–5 year refresh cycles"}, {"id": 15, "title": "Sizing a national compute program", "tldr": "Size compute from demand, not prestige: estimate training, fine-tuning and inference needs of researchers, startups and public services, add growth and redundancy, and decide what must be domestic. Then plan power, people and refresh budgets alongside hardware.", "real": "The EU’s 2026 call for AI Gigafactories sized each facility relative to existing capacity: bidders must initially deploy at least as many advanced AI processors as Europe’s most powerful AI factory, and expand to at least three times that in a second phase, with selection planned for early 2027.", "body": "### Demand-based estimation\n\n| Demand segment | Estimate from |\n|---|---|\n| Research | Number of groups × typical GPU-hours per project |\n| Startups | Expected cohort size × training and inference needs |\n| National models | Planned model sizes and training runs |\n| Public services | Users × requests per day × tokens per request |\n| Sensitive workloads | Systems that cannot run on foreign clouds |\n\n### Simple inference sizing (per service)\n\n```\nDaily tokens = users × requests per user per day × tokens per request\nGPUs needed ≈ peak tokens per second ÷ tokens per second per GPU (from benchmarks)\nAdd 30–50% headroom + redundancy\n```\n\n### Hidden costs to budget\n\n| Item | Why |\n|---|---|\n| Power and cooling | Often 20–40% of total cost of ownership |\n| Networking and storage | Large clusters need fast interconnects |\n| Operations staff | Scarce, specialized skills |\n| Software and support | Licenses, schedulers, security |\n| Refresh | New hardware generations every few years |\n\n### Avoid the empty-cluster trap\n\nPair hardware with users: allocation programs, startup support, training and application funding. Track **utilization** from day one."}, {"id": 16, "title": "The semiconductor supply chain", "tldr": "AI chips pass through a long chain: design software, chip design, extreme lithography machines, leading-edge fabs, high-bandwidth memory, advanced packaging and system assembly. Each stage is concentrated in a few companies and countries.", "real": "A typical leading AI accelerator involves a US designer (such as Nvidia), fabrication at TSMC in Taiwan, high-bandwidth memory from South Korean or US makers (SK hynix, Samsung, Micron), lithography machines from the Netherlands’ ASML, and advanced packaging, which itself became a major capacity constraint in 2023–2024.", "body": "### Stages and leading players\n\n| Stage | Leading players |\n|---|---|\n| EDA software | Synopsys, Cadence (US), Siemens EDA |\n| Chip design | Nvidia, AMD, Google, AWS, Huawei and others |\n| Lithography | ASML (Netherlands) for EUV; Nikon, Canon for older tools |\n| Other fab equipment | Applied Materials, Lam Research, KLA (US), Tokyo Electron (Japan) |\n| Leading-edge fabrication | TSMC (Taiwan); Samsung, Intel |\n| HBM memory | SK hynix, Samsung (Korea), Micron (US) |\n| Advanced packaging | TSMC (CoWoS) and others |\n| Servers and systems | Many manufacturers worldwide |\n\n### Why this matters for sovereignty\n\nNo country controls the whole chain. Even the US relies on Taiwan for fabrication and the Netherlands for EUV lithography; China relies on imports for many tools and materials.\n\n### Strategic options\n\n- Secure **long-term supply** rather than full production\n- Develop **niches** (design, packaging, testing, materials)\n- Join **allied supply-chain initiatives**\n- Build **inventory and diversity** for critical systems"}, {"id": 17, "title": "Chokepoints: lithography, foundries, memory and packaging", "tldr": "The tightest chokepoints are EUV lithography (one supplier), leading-edge foundry capacity (concentrated in Taiwan), high-bandwidth memory (three suppliers), and advanced packaging. These are where export controls and supply shocks bite hardest.", "real": "ASML is the only company that makes extreme ultraviolet (EUV) lithography machines, which are needed for the most advanced chips. In 2023 the Netherlands, coordinating with the US, introduced export restrictions on some advanced lithography tools, extending controls beyond EUV to certain older DUV systems.", "body": "### Chokepoint table\n\n| Chokepoint | Concentration | Risk |\n|---|---|---|\n| EUV lithography | One supplier (ASML) | Export controls, long lead times |\n| Leading-edge foundry | Mostly Taiwan | Geopolitical and natural-disaster risk |\n| HBM memory | Three suppliers | Shortages limit accelerator output |\n| Advanced packaging | Limited capacity | Bottleneck for accelerator supply |\n| Specialty materials | Some concentrated sources | Trade restrictions |\n\n### How countries respond\n\n| Response | Example |\n|---|---|\n| Domestic fabs with incentives | US CHIPS Act projects, Japan’s Rapidus |\n| Allied coordination | Joint controls among US, Netherlands, Japan |\n| Stockpiling | Buying ahead during supply windows |\n| Substitution | Domestic accelerators, older-node optimization |\n| Software efficiency | Doing more with fewer or older chips |\n\n### Practical takeaway\n\nFor most countries, the realistic goal is **assured access** through diversified suppliers and partnerships, plus efficiency, rather than building leading-edge fabs."}, {"id": 18, "title": "National chip programs", "tldr": "Major economies spend tens of billions on semiconductor manufacturing incentives to reduce dependence: the US CHIPS Act, the EU Chips Act, Japan’s support for Rapidus and TSMC, Korea’s chip tax credits, China’s national funds, and India’s Semiconductor Mission.", "real": "The US CHIPS and Science Act (2022) provided about $52.7 billion for semiconductor manufacturing, research and workforce. India approved its first major commercial fab in 2024, a Tata Electronics facility with Taiwan’s PSMC in Dholera, Gujarat, alongside chip assembly and test plants including Micron’s in Sanand.", "body": "### Program overview\n\n| Country / bloc | Program | Focus |\n|---|---|---|\n| US | CHIPS and Science Act (2022) | Fabs, R&D, workforce |\n| EU | European Chips Act (2023) | Mobilize public and private investment, pilot lines |\n| Japan | Rapidus support; TSMC Kumamoto subsidies | Leading-edge logic (2 nm target), foreign fabs |\n| South Korea | Tax credits for chip investment | Memory and foundry leadership |\n| China | National IC funds (“Big Fund” phases) | Self-reliance across the chain |\n| India | India Semiconductor Mission | Fabs, assembly and test, design incentives |\n| Taiwan | Continued R&D and incentives | Maintaining leadership |\n\n### Lessons\n\n- Fabs take **years** to build and need ecosystems (suppliers, water, power, skills)\n- Leading-edge production is **extremely capital intensive**\n- **Packaging, testing and design** are faster entry points for new players\n- Incentives must be paired with **talent programs**\n\n### Relation to AI sovereignty\n\nChip programs are long-term insurance. In the near term, AI sovereignty depends more on **access agreements** and **efficient use** of available accelerators."}, {"id": 19, "title": "Export controls on AI chips and models", "tldr": "Export controls determine who may buy advanced AI chips and, increasingly, who may access advanced models. US rules have shifted repeatedly since 2022, so sovereign AI plans must assume that access conditions can change quickly.", "real": "The US rescinded its global “AI Diffusion Rule” in May 2025 before it took effect, and in January 2026 moved exports of Nvidia H200-class chips to China from a presumption of denial to case-by-case licensing with conditions. In June 2026, the Commerce Department required Anthropic to restrict foreign nationals’ access to two frontier models; the controls were lifted on 30 June.", "body": "### Timeline (selected US actions)\n\n| Date | Action |\n|---|---|\n| Oct 2022 | Controls on advanced AI chips and chipmaking tools to China |\n| Oct 2023 | Updated thresholds; more countries and chips covered |\n| Dec 2024 | Controls extended to high-bandwidth memory and more equipment |\n| Jan 2025 | AI Diffusion Rule published (global tiered licensing) |\n| May 2025 | AI Diffusion Rule rescinded before taking effect |\n| Late 2025 | Large chip export approvals to Gulf partners with security conditions |\n| Jan 2026 | H200-class chips to China: case-by-case licensing with conditions |\n| Jun 2026 | Commerce directs restriction of foreign access to specific frontier models; lifted 30 June |\n\n### What controls can target\n\n| Target | Example |\n|---|---|\n| Chips | Performance thresholds |\n| Equipment | Lithography and fab tools |\n| Destinations | Country lists |\n| End users | Entity lists |\n| Model weights or access | Emerging area |\n\n### Planning implications\n\n- Build scenarios for **tighter and looser** access\n- Keep **compliance capacity** (end-use checks, security commitments)\n- Maintain **fallback models** you can run without a foreign API\n- Watch policy closely; this chapter is a snapshot and rules keep changing"}, {"id": 20, "title": "Strategies for countries without fabs", "tldr": "Most countries will never build leading-edge fabs. They can still strengthen sovereignty through chip design skills, packaging and testing, long-term supply contracts, regional partnerships, hardware-neutral software, efficient models, and secure operation of imported hardware.", "real": "Malaysia, already a major chip assembly and testing hub, launched a National Semiconductor Strategy in 2024 that focuses on moving up into chip design and advanced packaging, building on existing strengths rather than trying to start with leading-edge fabrication.", "body": "### Options by ambition\n\n| Ambition | Strategy |\n|---|---|\n| Low | Diversified procurement, long-term contracts, efficient software |\n| Medium | Packaging, testing, design centers, talent programs |\n| High | Specialized chips (edge AI, inference), partnerships with foreign fabs |\n\n### Practical moves\n\n1. **Secure supply:** multi-year agreements, multiple vendors, government-to-government assurances.\n2. **Own the software layer:** open frameworks that run on several hardware types.\n3. **Efficiency first:** smaller models, quantization, distillation (see the LLM deployment course).\n4. **Build design talent:** university programs and design-linked incentives.\n5. **Regional pooling:** shared clusters among neighboring countries.\n6. **Trusted operation:** domestic operators and security for imported hardware.\n\n### Key insight\n\nSovereignty can come from **control over operation and use**, not just manufacturing. A country that runs, secures and adapts imported hardware and open models under its own law has meaningful autonomy for most use cases."}, {"id": 21, "title": "The energy demand of AI", "tldr": "AI data centers need large amounts of reliable electricity, and demand is rising fast. Energy has become a hard constraint on sovereign AI: without grid capacity and generation, chips cannot be used.", "real": "The International Energy Agency’s 2025 “Energy and AI” report estimated that data centers used about 415 TWh of electricity in 2024, around 1.5% of global consumption, and projected this could roughly double to about 945 TWh by 2030, with AI the main driver.", "body": "### Scale in plain numbers\n\n| Facility | Typical power |\n|---|---|\n| Traditional enterprise data center | A few MW |\n| Large cloud data center | Tens of MW |\n| Large AI training campus | Hundreds of MW to over 1 GW |\n| 1 GW | Roughly the output of a large power plant |\n\n### Why AI is power-hungry\n\n- Accelerators draw far more power per rack than ordinary servers\n- Large clusters run near full load for weeks\n- Cooling adds overhead (measured by PUE: power usage effectiveness)\n\n### Sovereignty implications\n\n| Issue | Question |\n|---|---|\n| Grid capacity | Can the grid connect a new 100 MW+ load, and how soon? |\n| Generation mix | Will AI growth raise emissions or prices for households? |\n| Energy security | Is fuel or power imported? |\n| Siting | Where is power available, cheap and clean? |\n\n### Planning tip\n\nTreat power as the **first** constraint when planning compute. Grid connection queues in many countries now run for years."}, {"id": 22, "title": "Powering sovereign AI", "tldr": "Countries and companies combine grid power, renewables with storage, gas, and increasingly nuclear (including restarted plants and planned small modular reactors) to power AI. Long-term power contracts are now part of AI strategy.", "real": "In 2024, Microsoft signed a 20-year agreement with Constellation Energy to restart a reactor at the Three Mile Island site in Pennsylvania to supply its data centers, and Google signed a deal with Kairos Power for small modular reactors. Both showed tech firms securing dedicated power for AI.", "body": "### Power options\n\n| Source | Strength | Weakness |\n|---|---|---|\n| Grid supply | Simple | Capacity limits, price exposure |\n| Solar / wind + storage | Low emissions, falling cost | Intermittent; storage needed for 24/7 load |\n| Natural gas | Dispatchable, fast to build | Emissions, fuel import risk |\n| Existing nuclear | Firm, low-carbon | Limited sites |\n| Small modular reactors | Firm, flexible siting (in future) | Not yet widely deployed; timelines uncertain |\n| Hydro / geothermal | Firm, low-carbon | Geography-dependent |\n\n### Contract structures\n\n- **Power purchase agreements (PPAs):** long-term contracts with generators\n- **Behind-the-meter:** generation on or next to the data center site\n- **Flexible load:** data centers that reduce use at grid peaks\n\n### Policy levers\n\n- Fast-track grid connections for strategic AI zones\n- Clear rules on who pays for grid upgrades\n- Heat reuse requirements (district heating)\n- Siting near abundant clean power"}, {"id": 23, "title": "Data center siting, cooling and water", "tldr": "Where to build AI data centers depends on power, land, connectivity, climate, water, permitting and community acceptance. Liquid cooling is now common for dense AI racks, and water use is a growing public concern.", "real": "In Ireland, data centers used about a fifth of all metered electricity in 2023 according to the Central Statistics Office, and the grid operator restricted new connections in the Dublin area. It is a clear example of AI and cloud growth colliding with grid limits.", "body": "### Siting factors\n\n| Factor | Why it matters |\n|---|---|\n| Power availability | Biggest constraint |\n| Network connectivity | Low latency to users, international links |\n| Climate | Cooler climates reduce cooling energy |\n| Water | Evaporative cooling uses water; drought risk |\n| Land and permitting | Large sites, environmental reviews |\n| Natural hazards | Floods, earthquakes, heat waves |\n| Security | Physical protection, distance from borders |\n| Community | Noise, jobs, local benefits |\n\n### Cooling approaches\n\n| Method | Use |\n|---|---|\n| Air cooling | Lower-density racks |\n| Direct-to-chip liquid cooling | Dense AI racks (common for latest GPUs) |\n| Immersion cooling | Very high density, specialized |\n| Free cooling | Uses cold outside air or water where climate allows |\n\n### Metrics to require\n\nPUE (power usage effectiveness), WUE (water usage effectiveness), share of carbon-free energy, and heat reuse."}, {"id": 24, "title": "Gigawatt-scale AI campuses", "tldr": "The largest AI projects now plan campuses of one to several gigawatts, costing tens of billions of dollars. They concentrate compute, attract partners, and raise questions about who controls them, who can use them, and whether demand will materialize.", "real": "In January 2025, OpenAI, SoftBank, Oracle and MGX announced the Stargate project in the US, targeting up to $500 billion of AI infrastructure. In May 2025, the UAE and US announced a 5 GW UAE–US AI Campus in Abu Dhabi, including a 1 GW “Stargate UAE” cluster whose first 200 MW phase was planned for 2026.", "body": "### Why go gigawatt-scale\n\n- Frontier training needs huge, tightly linked clusters\n- Economies of scale on power, cooling and operations\n- Attracts leading companies as anchor tenants\n- Positions the host as a regional AI hub\n\n### Sovereignty questions for mega-campuses\n\n| Question | Why it matters |\n|---|---|\n| Who owns and operates it? | Control and legal jurisdiction |\n| Who gets capacity? | National users vs foreign tenants |\n| Which security rules apply? | Export-license conditions may restrict access |\n| Can it be repurposed? | If demand shifts |\n| What happens if a partner leaves? | Concentration risk |\n\n### Risk management\n\n| Risk | Mitigation |\n|---|---|\n| Demand shortfall | Phased build (e.g. 200 MW first), anchor contracts |\n| Technology obsolescence | Modular halls, refresh plans |\n| Power delays | Secure generation before construction |\n| Geopolitical conditions | Clear agreements on access and oversight |"}, {"id": 25, "title": "Physical security and resilience of sovereign infrastructure", "tldr": "Sovereign AI infrastructure is critical infrastructure. It needs physical security, redundancy across sites, disaster recovery, protection of supply and maintenance chains, and plans for crises such as conflicts, cyberattacks, fires and power loss.", "real": "In March 2021, a fire destroyed one of OVHcloud’s data centers in Strasbourg, France, and damaged another, taking many customer services offline. Some customers who had not kept backups elsewhere lost data permanently, a reminder that sovereignty without resilience is fragile.", "body": "### Resilience layers\n\n| Layer | Measures |\n|---|---|\n| Site | Perimeter security, access control, fire suppression |\n| Power | Redundant feeds, backup generation, fuel stocks |\n| Cooling | Redundant systems |\n| Network | Multiple carriers and routes, including international links |\n| Data | Backups in separate sites, tested restores |\n| Compute | Spare capacity, multiple regions |\n| Supply | Spare parts, maintenance contracts that work in crises |\n| People | Cleared staff, succession, on-call rotations |\n\n### Crisis scenarios to plan for\n\n1. A foreign supplier stops providing updates or support\n2. A primary site is lost to fire, flood or attack\n3. International connectivity is cut\n4. A cyberattack encrypts systems\n5. Export controls block replacement hardware\n\n### Continuity principle\n\nFor essential services, design so that the AI system can keep operating, at least in degraded form, **without** external dependencies for a defined period."}, {"id": 26, "title": "Data sovereignty, residency and localization", "tldr": "Data residency means data is stored in a location; data localization means law requires it to stay there; data sovereignty means data is subject to the laws and control of a jurisdiction. Sovereign AI usually needs all three for sensitive data, plus control over who operates the systems.", "real": "Microsoft completed its “EU Data Boundary” in February 2025, committing to store and process EU customers’ cloud data within the EU. Debates continued, however, over whether residency alone protects data from access under non-EU law, which led to separate “sovereign cloud” offerings.", "body": "### Definitions\n\n| Term | Meaning | Example |\n|---|---|---|\n| Data residency | Where data physically sits | Data stored in a Frankfurt region |\n| Data localization | Legal requirement to keep data in-country | Certain personal data must stay local |\n| Data sovereignty | Data governed by and controlled under a jurisdiction | Only national law can compel access |\n| Operational sovereignty | Who runs and administers systems | Only cleared local staff have access |\n\n### Data types and typical requirements\n\n| Data type | Typical requirement |\n|---|---|\n| Public data | Few restrictions |\n| Personal data | Data protection law (consent, purpose, transfers) |\n| Health and financial data | Sector rules, often localization |\n| Government data | Classification levels, often national-only |\n| Critical infrastructure data | Security rules |\n\n### AI-specific data flows\n\nAI adds new data that must be governed: **prompts, outputs, embeddings, logs, fine-tuning datasets and model weights** trained on sensitive data. Each needs a defined location and access policy."}, {"id": 27, "title": "Data localization laws around the world", "tldr": "Many countries require some data to stay in-country or restrict cross-border transfers. Rules range from strict localization (Russia, China for some data) to conditional transfers (EU, India). AI services must design for these differences.", "real": "In 2016, Russia blocked LinkedIn for failing to comply with its 2015 law requiring personal data of Russian citizens to be stored on servers in Russia. It remains one of the clearest examples of a localization law being enforced against a global platform.", "body": "### Selected regimes (simplified)\n\n| Jurisdiction | Approach |\n|---|---|\n| EU | GDPR: transfers allowed to “adequate” countries or with safeguards |\n| China | Cybersecurity Law, Data Security Law, PIPL: localization for critical data; security assessments for exports |\n| Russia | Personal data of citizens must be stored and processed in Russia first |\n| India | DPDP Act 2023: transfers allowed except to countries the government restricts; sector rules (e.g. payments data) stricter |\n| Vietnam | Localization requirements for certain data under cybersecurity rules |\n| Indonesia | Personal Data Protection Law (2022) with transfer conditions |\n| Saudi Arabia | Personal Data Protection Law with transfer rules |\n| US | No general localization; sector and national security rules |\n\n### Design patterns for compliance\n\n- **Regional deployments:** separate model endpoints per jurisdiction\n- **Data minimization:** send only what the model needs\n- **On-premise or in-country inference** for restricted data\n- **Federated or split processing:** sensitive steps stay local\n- **Transfer documentation:** records of what goes where and why\n\n### Note\n\nThese summaries are simplified. Always confirm current rules with legal counsel; several regimes changed in 2023–2026."}, {"id": 28, "title": "Cross-border data transfers and “data free flow with trust”", "tldr": "Countries also want data to flow for trade, research and AI training. Mechanisms like adequacy decisions, standard contracts, certifications and trusted-partner agreements try to balance openness with protection.", "real": "Japan promoted the idea of “Data Free Flow with Trust” at the G20 in Osaka in 2019, and the G7 later created an institutional arrangement to put it into practice. It reflects a middle path between unrestricted flows and strict localization.", "body": "### Transfer mechanisms (EU example)\n\n| Mechanism | How it works |\n|---|---|\n| Adequacy decision | EU declares a country’s protection equivalent |\n| Standard contractual clauses | Contract terms plus a transfer risk assessment |\n| Binding corporate rules | Approved intra-group rules |\n| Certifications / codes | Approved schemes |\n| Derogations | Narrow exceptions (e.g. explicit consent) |\n\n### Why AI complicates transfers\n\n- Training datasets may mix data from many countries\n- Model weights may encode personal data\n- Logs and prompts may be processed by foreign providers\n- Inference may route through other regions for capacity\n\n### Practical approach\n\n| Step | Action |\n|---|---|\n| 1 | Map every AI data flow and where it is processed |\n| 2 | Classify data by sensitivity and legal regime |\n| 3 | Choose mechanism per flow (local, adequacy, contracts) |\n| 4 | Add technical safeguards (encryption, pseudonymization) |\n| 5 | Monitor provider sub-processors and region changes |"}, {"id": 29, "title": "Extraterritorial access: CLOUD Act, FISA and similar laws", "tldr": "Some laws let a government compel companies under its jurisdiction to hand over data they control, even when it is stored abroad. This is why the nationality and corporate structure of cloud and AI providers matter for sovereignty, not just server location.", "real": "In June 2025, Microsoft France’s director of public and legal affairs told a French Senate inquiry that he could not guarantee that data of French citizens hosted by Microsoft would never be transmitted to US authorities if they lawfully requested it. The testimony became a reference point in European sovereign-cloud debates.", "body": "### Key laws often cited\n\n| Law | Country | Relevance |\n|---|---|---|\n| CLOUD Act (2018) | US | Lets US authorities seek data controlled by US providers, wherever stored, under legal process |\n| FISA Section 702 | US | Foreign intelligence collection from US providers about non-US persons |\n| National Intelligence Law (2017) | China | Requires organizations to support and cooperate with state intelligence work |\n| Various national security laws | Many countries | Lawful access provisions |\n\n### How providers respond\n\n| Measure | Effect |\n|---|---|\n| Transparency reports | Disclose volume of requests |\n| Commitments to challenge requests | Legal resistance |\n| Customer-controlled encryption keys | Provider cannot read data without the key |\n| Local subsidiaries and staff | Operational separation |\n| Partner-operated clouds | Local company runs the infrastructure |\n\n### How to assess your exposure\n\n1. Which companies in the chain are subject to foreign law?\n2. Can they technically access your data or keys?\n3. Do contracts require notice of requests?\n4. Can you encrypt so that only you hold keys?\n5. For the most sensitive data, can you use a provider outside that jurisdiction?"}, {"id": 30, "title": "National datasets and data commons", "tldr": "High-quality local data is the raw material of sovereign AI. Governments build national dataset platforms, open government data, language corpora and sector data spaces, with clear licensing, privacy protection and access rules.", "real": "India launched AIKosh in March 2025 as the IndiaAI Mission’s platform for datasets, models and tools for developers. The EU is building “common European data spaces” for sectors such as health, mobility and manufacturing, governed by laws like the Data Governance Act and the European Health Data Space regulation.", "body": "### Types of national data assets\n\n| Asset | Example |\n|---|---|\n| Open government data | Statistics, maps, budgets, legislation |\n| Language corpora | Text and speech in national languages |\n| Cultural archives | Libraries, broadcasters, museums |\n| Sector data spaces | Health, agriculture, mobility, manufacturing |\n| Scientific data | Research datasets, satellite imagery |\n| Synthetic data | Generated datasets that protect privacy |\n\n### Governance design\n\n| Question | Options |\n|---|---|\n| Who can access? | Open, registered users, approved researchers |\n| Under what license? | Open, non-commercial, custom |\n| How is privacy protected? | Anonymization, secure enclaves, differential privacy |\n| Who benefits? | Revenue sharing, public-interest conditions |\n| How is quality maintained? | Curation teams, documentation, versioning |\n\n### Rights holders\n\nPublishers, broadcasters and creators increasingly negotiate or litigate over use of their works in AI training. National data programs need clear copyright and licensing positions."}, {"id": 31, "title": "Why language is central to sovereign AI", "tldr": "Most early AI models were trained mainly on English text. Languages with less online data get worse quality, higher costs (more tokens) and less cultural accuracy. Serving citizens in their own languages is one of the strongest arguments for sovereign AI.", "real": "A 2023 study by Petrov and colleagues (“Language Model Tokenizers Introduce Unfairness Between Languages”) found that the same text could need up to about 15 times more tokens in some languages than in English. That makes AI slower and more expensive for speakers of those languages.", "body": "### How language gaps show up\n\n| Gap | Effect |\n|---|---|\n| Less training data | Lower accuracy, more hallucinations |\n| Tokenizer inefficiency | More tokens per sentence, higher cost and latency |\n| Script handling | Poor support for some scripts and code-mixing |\n| Cultural context | Wrong references, norms or examples |\n| Speech | Weak recognition for accents and dialects |\n\n### Why it matters for the state\n\n- Citizens must understand public services\n- Legal and administrative language needs precision\n- Minority and indigenous languages risk being left out\n- Code-mixed speech (for example Hindi–English) is common in daily life\n\n### Low-resource does not mean unimportant\n\nMany languages with tens of millions of speakers have relatively little digitized, high-quality text. Building data for them is a public-good investment that markets alone may not make."}, {"id": 32, "title": "Building language datasets", "tldr": "Language datasets come from public text, government documents, broadcasters, books, crowdsourced speech and translation, and carefully licensed partnerships. Quality, consent, licensing and dialect coverage matter as much as volume.", "real": "India’s Bhashini (National Language Translation Mission, launched 2022) and the AI4Bharat research lab at IIT Madras have built large open datasets and models for Indian languages, including crowdsourced speech collection across many districts. Mozilla’s Common Voice has collected volunteer speech in over 100 languages.", "body": "### Data sources\n\n| Source | Strength | Watch out for |\n|---|---|---|\n| Web crawl | Volume | Quality, toxicity, copyright |\n| Government documents | Formal, accurate | Narrow style |\n| Broadcasters and news | Varied, current | Licensing |\n| Books and archives | Rich language | Digitization, rights |\n| Crowdsourced speech | Accents, dialects | Consent, payment fairness |\n| Translation pairs | Multilingual learning | Translation quality |\n| Synthetic data | Fills gaps | Can amplify model errors |\n\n### Quality pipeline\n\n```\nCollect → deduplicate → language ID → quality filter → toxicity/PII filter\n       → dialect & domain tagging → license check → document (datasheet) → release\n```\n\n### Ethics checklist\n\n- [ ] Informed consent for voice and personal content\n- [ ] Fair pay for contributors\n- [ ] Clear license for reuse\n- [ ] Community involvement for minority languages\n- [ ] Removal requests honored"}, {"id": 33, "title": "Tokenizers and local-language efficiency", "tldr": "A tokenizer splits text into pieces the model processes. If it was built mostly from English, local-language text breaks into many small pieces, raising cost and lowering quality. Extending or rebuilding tokenizers is a key step in local-language models.", "real": "Japanese researchers at the Tokyo Institute of Technology and AIST built the Swallow models by continuing to pretrain Llama models on Japanese text, and for early versions expanded the vocabulary with Japanese tokens. This improved efficiency and Japanese performance.", "body": "### Measuring tokenizer efficiency\n\n```\nFertility = number of tokens ÷ number of words\nLower is better (≈1.2–1.5 for well-supported languages)\n```\n\nCompare fertility for the same parallel sentences across languages.\n\n### Options\n\n| Option | Effort | Effect |\n|---|---|---|\n| Use an existing multilingual tokenizer | None | May be inefficient |\n| Extend vocabulary with local tokens | Medium | Better efficiency; new embeddings need training |\n| Train a new tokenizer and model | High | Best fit, requires full pretraining |\n| Choose base models with large multilingual vocabularies | Low | Often a good compromise |\n\n### Practical check\n\nBefore choosing a base model, tokenize 1,000 representative sentences in each target language. Fertility differences translate directly into cost and context length."}, {"id": 34, "title": "Cultural alignment and local values", "tldr": "Models reflect the values, norms and references in their training data and tuning. Sovereign AI efforts tune models to local laws, social norms, history and institutions, while respecting human rights and avoiding government-imposed censorship of legitimate speech.", "real": "In 2023, Abu Dhabi’s Inception (a G42 company), MBZUAI and Cerebras released Jais, an Arabic-English model trained with substantial Arabic data and tuned for Arabic contexts. It is a widely cited example of a model built to serve a specific language community.", "body": "### What “local alignment” can include\n\n| Aspect | Example |\n|---|---|\n| Legal context | Correct answers about national laws and procedures |\n| Institutions | Accurate knowledge of local agencies and services |\n| History and geography | Local perspectives, correct names |\n| Social norms | Appropriate tone and politeness |\n| Dialects | Understanding regional speech |\n| Sensitive topics | Policies on religion, politics, minorities |\n\n### Methods\n\n- Local-language instruction data and preference data from local annotators\n- Constitution or policy documents describing desired behavior\n- Evaluation with local experts and diverse communities\n\n### A caution\n\n“Cultural alignment” can be used to justify suppressing legitimate debate. Democratic safeguards include publishing model policies, independent audits, and protecting freedom of expression (Part 20)."}, {"id": 35, "title": "Local benchmarks and evaluation", "tldr": "Global benchmarks are mostly English and Western-centric, so they miss local performance. Sovereign AI programs need their own evaluation suites in local languages, covering public-service tasks, local knowledge, safety and fairness.", "real": "Researchers behind the Global-MMLU dataset (Cohere For AI and collaborators, 2024) found that a substantial share of the widely used MMLU benchmark’s questions required culturally specific knowledge, mostly Western. They released culturally annotated translations into dozens of languages.", "body": "### What to evaluate\n\n| Area | Example tests |\n|---|---|\n| Language quality | Grammar, fluency, dialect understanding |\n| Local knowledge | Laws, geography, institutions, history |\n| Public-service tasks | Form filling, eligibility explanations, summarizing notices |\n| Translation | Between national and regional languages |\n| Speech | Recognition across accents and noisy environments |\n| Safety | Harmful content in local languages and slang |\n| Fairness | Performance across regions, genders, communities |\n\n### Building a benchmark\n\n1. Define tasks from real citizen and government needs\n2. Write items natively (not only translated)\n3. Have local experts verify answers\n4. Keep a hidden test set to avoid contamination\n5. Publish methods and update regularly\n\n### Use it in procurement\n\nRequire vendors to report results on your national benchmark, not only global leaderboards."}, {"id": 36, "title": "Build, adapt or buy: model strategies", "tldr": "Countries choose among training models from scratch, adapting open-weight models, licensing commercial models under sovereign terms, or combining these. The right mix depends on budget, talent, data, and how much control each use case needs.", "real": "Singapore’s SEA-LION project, run by AI Singapore, has built Southeast Asian language models by continuing to train strong open models (for example versions based on Llama and Gemma) rather than always training from scratch. South Korea’s national program, by contrast, requires models trained from initialized weights.", "body": "### The options\n\n| Option | Control | Cost | Time | Best for |\n|---|---|---|---|---|\n| Train from scratch | Highest | Very high | 1–2 years+ | Large programs, strategic capability |\n| Continued pretraining of open model | High | Medium | Months | Local languages, domain depth |\n| Fine-tune open model | Medium-high | Low | Weeks | Specific tasks |\n| Commercial model under sovereign hosting | Medium | Usage-based | Fast | General productivity |\n| Commercial API | Low | Usage-based | Immediate | Low-sensitivity uses |\n\n### Questions that decide\n\n1. Do we need the capability to build models, or just to use them?\n2. Are open-weight licenses acceptable for our uses?\n3. Do we have the data and talent to train well?\n4. What happens if a foreign provider changes terms?\n5. Which uses truly need the highest control?\n\n### Common portfolio\n\n```\nStrategic capability:    national model (from scratch or deep adaptation)\nPublic services:         sovereign-hosted open or licensed models\nProductivity tools:      commercial models with strong contracts\nClassified uses:         air-gapped, locally controlled models\n```"}, {"id": 37, "title": "What it takes to train a national foundation model", "tldr": "Training a competitive foundation model needs large compute budgets, trillions of tokens of curated data, an experienced team, evaluation infrastructure, and a plan for continuous updates. Costs range from millions to hundreds of millions of dollars depending on scale.", "real": "Stanford’s 2024 AI Index estimated training compute costs of about $78 million for GPT-4 and about $191 million for Google’s Gemini Ultra. DeepSeek reported that the final training run of its V3 model used about 2.8 million H800 GPU-hours (around $5.6 million at its assumed rental price), excluding earlier research and experiments.", "body": "### Ingredients\n\n| Ingredient | Typical requirement |\n|---|---|\n| Compute | Thousands of GPUs for months for mid-to-large models |\n| Data | Trillions of tokens, with strong local-language share |\n| Team | Pretraining, data, infra, evaluation, safety experts |\n| Evaluation | Global and local benchmarks, red teaming |\n| Post-training | Instruction tuning, preference tuning |\n| Deployment | Serving infrastructure, APIs, monitoring |\n| Maintenance | Regular new versions to stay relevant |\n\n### Cost drivers\n\n- Model size and number of training tokens\n- GPU price (owned vs rented)\n- Failed runs and experiments (often a large share of total)\n- Staff (scarce and expensive)\n- Data acquisition and cleaning\n\n### Reality check\n\nA national model rarely beats the best global frontier models on general tasks. Its value is usually in **local languages, control, trust, and building national capability**. Define success on those terms."}, {"id": 38, "title": "Adapting open-weight models", "tldr": "Continued pretraining, fine-tuning and preference tuning let a country build strong local models on top of open-weight bases at a fraction of the cost of training from scratch. License terms, base-model provenance and safety must be checked carefully.", "real": "Many national and regional efforts build on open bases: Japan’s Swallow on Llama, Southeast Asia’s SEA-LION on Llama and Gemma, and numerous Indian, Arabic and European models on Llama, Mistral or Qwen bases. This approach let teams ship useful local models within months.", "body": "### Adaptation pipeline\n\n```\nOpen base model\n   │ continued pretraining on local-language corpus (billions of tokens)\n   ▼\nLocal base model\n   │ supervised fine-tuning on local instructions\n   ▼\nLocal chat model\n   │ preference tuning with local annotators + safety tuning\n   ▼\nEvaluated, documented release\n```\n\n### Choosing a base model\n\n| Criterion | Check |\n|---|---|\n| License | Commercial use, user thresholds, acceptable-use policy |\n| Language coverage | Tokenizer efficiency, existing multilingual skill |\n| Size | Fits your compute budget |\n| Provenance | Publisher’s training transparency, origin |\n| Safety | Behavior after your tuning |\n| Community | Tooling support, updates |\n\n### Risks\n\n- Inheriting the base model’s biases or hidden behaviors\n- License changes in future versions\n- Dependence on a foreign publisher for upgrades\n\nMitigate by keeping evaluation suites, documenting lineage, and being able to switch bases."}, {"id": 39, "title": "Open source and open weights as sovereignty tools", "tldr": "Open-weight and fully open models let countries run, inspect and adapt AI without permission from a vendor. Fully open models (weights, data recipes and code) offer the most transparency. Licenses differ, so “open” must be checked case by case.", "real": "In September 2025, Swiss institutions EPFL, ETH Zurich and the Swiss National Supercomputing Centre released Apertus, a fully open multilingual model with published weights, training data recipes and code, covering more than 1,000 languages. Meta’s Llama license, by contrast, is open-weight but includes conditions such as a clause for very large companies.", "body": "### Levels of openness\n\n| Level | What is released | Example types |\n|---|---|---|\n| Closed API | Access only | Most frontier commercial models |\n| Open weights, restrictive license | Weights with use conditions | Some major model families |\n| Open weights, permissive license | Weights under Apache 2.0 / MIT | Many Qwen, Mistral, other releases |\n| Fully open | Weights, data recipes, code, logs | Apertus, OLMo and similar |\n\n### Sovereignty benefits\n\n- Run on your own infrastructure under your law\n- No vendor can switch it off remotely\n- Inspect and adapt behavior\n- Build local skills by working with real models\n\n### Limits\n\n| Limit | Note |\n|---|---|\n| Frontier gap | Best closed models may still lead in some tasks |\n| Responsibility | You carry security, safety and maintenance |\n| Origin concerns | Some governments restrict models from certain countries |\n| License conditions | Read them; they vary and can change for new versions |"}, {"id": 40, "title": "Small and efficient models for sovereignty", "tldr": "Small language models (roughly 1–15 billion parameters) can run on modest hardware, on-premise or on devices, making sovereignty cheaper and more practical for many public uses. Efficiency techniques such as quantization and distillation multiply the effect.", "real": "In 2026, India’s IndiaAI Mission said it would support 20 indigenous model proposals: 12 large language models and 8 small language models. Including SLMs reflects the practical value of compact models for local deployment, speech and specific domains.", "body": "### Why small models help\n\n| Benefit | Detail |\n|---|---|\n| Low

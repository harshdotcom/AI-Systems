er cost | Fewer GPUs to train and serve |\n| Local deployment | Run in national data centers, offices or devices |\n| Privacy | Data need not leave the device or site |\n| Resilience | Work offline or with limited connectivity |\n| Specialization | Strong in a narrow domain after fine-tuning |\n\n### Where SLMs fit\n\n| Use | Example |\n|---|---|\n| Speech and translation | Local language assistants |\n| Document processing | Forms, summaries |\n| Edge devices | Field workers, clinics, schools |\n| Classification and routing | Triage of citizen requests |\n| Agents with narrow tools | Specific government workflows |\n\n### Combine with a larger model\n\nA common pattern routes easy, high-volume tasks to small local models and sends hard tasks to a larger model, under appropriate data rules."}, {"id": 41, "title": "What “sovereign cloud” means", "tldr": "A sovereign cloud is cloud infrastructure where data, operations and legal control stay within a jurisdiction: local data location, locally controlled operations and staff, customer-controlled keys, and protection from foreign legal access. Offers vary widely, so definitions must be checked.", "real": "France’s security agency ANSSI defines a demanding cloud qualification called SecNumCloud. Its version 3.2 requirements include protections against non-EU laws, such as limits on non-EU ownership and control of the provider, making it one of the strictest official definitions of a sovereign cloud.", "body": "### Four dimensions of cloud sovereignty\n\n| Dimension | Question |\n|---|---|\n| **Data** | Where is data stored and processed, including backups and logs? |\n| **Operations** | Who administers the systems and from where? |\n| **Technology** | Can it keep running if the foreign vendor stops support? |\n| **Legal** | Which laws can compel access, and who owns the provider? |\n\n### Spectrum of offers\n\n| Type | Description |\n|---|---|\n| Public cloud region in-country | Data residency, global operations |\n| Hyperscaler sovereign offering | Separated region, local staff, extra controls |\n| Partner-operated cloud | Local company operates hyperscaler technology |\n| National / domestic provider | Locally owned and operated |\n| Government private cloud | State-owned, often classified-capable |\n| Air-gapped deployment | Physically disconnected |\n\n### Typical requirements in tenders\n\n- Data, logs, backups and support in-country or in-bloc\n- Operations only by local residents or cleared staff\n- Customer-managed or externally held encryption keys\n- Independent audits and certifications\n- Ability to operate during disconnection from the vendor\n- Contractual commitments on government access requests"}, {"id": 42, "title": "Hyperscaler sovereign offerings", "tldr": "AWS, Microsoft, Google and Oracle now offer sovereign variants: separated regions, EU-resident operations, local governance entities, external key management, and partner-operated options. They bring full cloud and AI features, but remain owned by non-local parent companies.", "real": "AWS made its European Sovereign Cloud generally available on 15 January 2026, with a first region in Brandenburg, Germany, physically and logically separate from other AWS regions and operated by EU-resident staff under a German entity. AWS said it planned to invest €7.8 billion in it through 2040.", "body": "### Typical features\n\n| Feature | Purpose |\n|---|---|\n| Separate regions / partitions | Limit cross-border dependency |\n| Local legal entity and governance | Local management and oversight |\n| EU- or nation-resident operators | Operational control |\n| External key management | Customer holds keys outside the provider |\n| Local support and billing | Data stays local |\n| Continuity commitments | Operate if disconnected from parent |\n\n### Strengths\n\n- Full feature set, including AI model services\n- Proven scale, security and reliability\n- Fast to adopt\n\n### Questions to ask\n\n1. Can the parent company be compelled to provide access, and what technical controls prevent it?\n2. Which services and AI models are available in the sovereign variant?\n3. Who holds encryption keys?\n4. What happens in a disconnection scenario?\n5. Which certifications apply (national schemes, ISO, SOC)?\n\n### Balanced view\n\nSupporters say technical and organizational controls make legal access practically very difficult. Skeptics argue that ownership by a foreign parent still leaves legal exposure. Many governments use these offers for some workloads and domestic or air-gapped options for the most sensitive."}, {"id": 43, "title": "Partner-operated and national clouds", "tldr": "In partner-operated models, a local company runs a hyperscaler’s technology under local control, aiming to combine features with sovereignty. National providers offer locally owned clouds. Both are common in Europe for public-sector and regulated workloads.", "real": "In France, Bleu (a joint venture of Orange and Capgemini using Microsoft technology) and S3NS (a Thales company using Google Cloud technology) were created to offer sovereign cloud services aimed at SecNumCloud qualification. In Germany, Delos Cloud, an SAP subsidiary using Microsoft technology, targets the public sector.", "body": "### Models compared\n\n| Model | Technology | Operator | Example |\n|---|---|---|---|\n| Partner-operated | Hyperscaler | Local company | Bleu, S3NS, Delos Cloud |\n| National provider | Own or open-source stack | Local company | OVHcloud, Scaleway, IONOS and others in Europe |\n| Telecom clouds | Mixed | National telecom | Many countries |\n| Government cloud | Mixed | State | National government clouds |\n\n### Trade-offs\n\n| Aspect | Partner-operated | National provider |\n|---|---|---|\n| Features | Close to hyperscaler | Narrower |\n| AI services | Depends on licensing | Growing |\n| Legal exposure | Reduced, depends on structure | Lowest |\n| Dependence on foreign tech | Yes (software updates) | Lower |\n| Scale | Large | Smaller |\n\n### Open-source stacks\n\nSome providers build on open-source cloud software (for example OpenStack and Kubernetes-based platforms), which reduces dependence on any single vendor’s proprietary technology."}, {"id": 44, "title": "Government, classified and air-gapped AI", "tldr": "The most sensitive workloads, such as defense, intelligence and critical infrastructure, need AI running in classified or air-gapped environments. That requires on-premise hardware, models delivered offline, cleared staff, and strict update and supply-chain controls.", "real": "Google offers Gemini models on Google Distributed Cloud, including air-gapped configurations for governments, and AWS has long operated Secret and Top Secret cloud regions for US government customers. Air-gapped AI is now a product category, not a research project.", "body": "### Characteristics of air-gapped AI\n\n| Aspect | Requirement |\n|---|---|\n| Network | No connection to the public internet |\n| Model delivery | Weights transferred through controlled media |\n| Updates | Vetted, signed, staged |\n| Staff | Security-cleared operators |\n| Logging | Retained internally for audit |\n| Hardware | Supply-chain verified |\n\n### Architecture sketch\n\n```\nClassified network\n ├─ Model servers (on-premise GPUs)\n ├─ Model registry (signed artifacts)\n ├─ Document stores / RAG indexes (classified)\n ├─ AI gateway (access control, audit)\n └─ Applications (analysts, planners)\nUpdate path: vendor → secure transfer station → scanning → approval → registry\n```\n\n### Challenges\n\n- Models age quickly without frequent updates\n- Smaller hardware budgets than commercial clouds\n- Specialized staff are scarce\n- Testing and evaluation must happen inside the environment"}, {"id": 45, "title": "Evaluating sovereignty claims", "tldr": "“Sovereign” is used as a marketing term. Evaluate offers against concrete criteria: data location, operator control, key ownership, legal exposure, ability to run disconnected, auditability, exit options and AI feature availability.", "real": "Under AWS’s European Sovereign Cloud design, AWS said that authorized EU-citizen employees have independent access to a copy of the source code needed to maintain the service, so it can keep operating in extreme scenarios. Commitments like this are exactly what buyers should ask vendors to document and verify.", "body": "### Scorecard\n\n| Criterion | Weak | Strong |\n|---|---|---|\n| Data location | “Primary storage local” | All data, logs, backups, telemetry local |\n| Operations | Global support teams | Local, cleared staff only |\n| Keys | Provider-managed | Customer-held, external HSM |\n| Legal | Foreign parent, no protections | Local ownership or strong legal safeguards |\n| Continuity | Depends on parent | Proven ability to run disconnected |\n| Transparency | Marketing claims | Independent audits, certifications |\n| Exit | Proprietary lock-in | Data and model portability, open formats |\n| AI services | Few models available | Required models and tools available |\n\n### Questions for AI specifically\n\n1. Where do prompts, outputs and logs go?\n2. Is customer data used to train provider models?\n3. Can we bring our own model weights?\n4. Can we run models without calling external APIs?\n5. Are safety filters and model updates controlled locally?\n\n### Verification\n\nAsk for audit reports, test disconnection drills, and contractual remedies, not just presentations."}, {"id": 46, "title": "National security dimensions of AI", "tldr": "AI affects national security through military applications, intelligence analysis, cyber operations, critical infrastructure, information integrity and economic security. Governments therefore treat parts of the AI stack as strategic and build institutions to evaluate and secure it.", "real": "In February 2025, the UK renamed its AI Safety Institute the AI Security Institute, sharpening its focus on national security risks such as cyber and chemical-biological misuse. In 2025 the US reorganized its AI Safety Institute into the Center for AI Standards and Innovation (CAISI) within NIST.", "body": "### Security domains\n\n| Domain | AI relevance |\n|---|---|\n| Defense | Decision support, logistics, autonomy, intelligence |\n| Intelligence | Analysis of large data volumes, translation |\n| Cyber | Both offense and defense are being transformed |\n| Critical infrastructure | AI in grids, water, transport, finance |\n| Information integrity | Disinformation, deepfakes, influence operations |\n| Economic security | Supply chains, technology leadership |\n| Biosecurity | Risk of misuse for dangerous agents |\n\n### Sovereignty implications\n\n- Sensitive defense and intelligence AI usually needs Level 3–4 sovereignty (ch. 4)\n- Evaluation capacity (testing models for dangerous capabilities) is itself strategic\n- Supply-chain trust becomes a security issue (ch. 47)\n\n### Institutions\n\nNational AI security or safety institutes, cyber agencies, defense AI offices and intelligence technology units increasingly coordinate on AI risks."}, {"id": 47, "title": "Trust in foreign models and software", "tldr": "Using models or apps from another country raises questions about data flows, hidden behavior, censorship or bias, and supply-chain integrity. Governments respond with bans on certain apps in government use, security reviews, and preference for self-hosted open weights after evaluation.", "real": "In early 2025, after DeepSeek’s app became popular, Italy’s data protection authority ordered it blocked, and several governments including Australia and South Korea restricted its use on government devices or paused downloads over data-handling concerns. Some organizations instead evaluated and self-hosted DeepSeek’s open weights.", "body": "### Distinguish app risk from weights risk\n\n| Use | Main risk |\n|---|---|\n| Foreign app or API | Data sent to foreign servers under foreign law |\n| Self-hosted open weights | Hidden behaviors, bias, censorship patterns, backdoors (no data flow) |\n\n### Evaluation steps for foreign models\n\n1. **Provenance:** who published it, which license, which version hash\n2. **Security scan:** safe file formats, no malicious code\n3. **Behavior tests:** local benchmarks, sensitive-topic responses, refusal patterns\n4. **Backdoor and safety tests:** red teaming, trigger searches (see the AI security course)\n5. **Isolation:** run without network access to the publisher\n6. **Monitoring:** log outputs for drift or anomalies\n\n### Policy options\n\n| Option | Effect |\n|---|---|\n| Allowlist approved models | Clear guidance |\n| Ban apps, allow evaluated self-hosted weights | Balances risk and value |\n| Origin-based bans | Simple, may exclude good tools |\n| Case-by-case risk assessment | Flexible, needs expertise |"}, {"id": 48, "title": "Encryption, key control and confidential computing", "tldr": "Technical controls can reduce dependence on legal promises: customer-held encryption keys, external key management, hardware security modules, and confidential computing that keeps data encrypted even while being processed, verified by remote attestation.", "real": "Nvidia’s H100 was the first GPU to support confidential computing, allowing AI workloads to run in hardware-protected environments with attestation. Cloud providers now offer confidential GPU instances, which governments and regulated firms evaluate for sensitive AI workloads.", "body": "### Key control levels\n\n| Level | Description | Provider can decrypt? |\n|---|---|---|\n| Provider-managed keys | Default | Yes |\n| Customer-managed keys (in provider KMS) | Customer controls rotation and policy | Often technically possible |\n| External key management (EKM / HYOK) | Keys held outside the provider | Only when customer allows |\n| Client-side encryption | Data encrypted before upload | No, but limits processing |\n\n### Confidential computing for AI\n\n```\nData and model in a trusted execution environment (CPU + GPU)\n  → memory encrypted\n  → remote attestation proves which hardware and software run\n  → client releases keys only after verification\n```\n\n### Limits\n\n- Side-channel attacks remain a research concern\n- Trust shifts to the chip vendor\n- Performance overhead and operational complexity\n- AI processing still needs plaintext inside the protected environment\n\n### Practical use\n\nCombine: sovereign location + local operations + customer-held keys + confidential computing for the highest-sensitivity AI."}, {"id": 49, "title": "Dependency risk and “kill switches”", "tldr": "If a critical service depends on a foreign provider, that provider, or its government, can restrict, change or end access. Sovereign AI planning identifies these switches and builds fallbacks: multiple providers, self-hosted models, and contracts that cover continuity.", "real": "On 12 June 2026, the US Commerce Department directed Anthropic to restrict access by foreign nationals to two of its frontier models. Unable to verify nationality in real time, Anthropic suspended the models globally until the controls were lifted on 30 June and access resumed on 1 July. Earlier, in 2019, US export restrictions cut Huawei’s new phones off from Google’s licensed apps.", "body": "### Types of switches\n\n| Switch | Example |\n|---|---|\n| Export controls | Government restricts chips or model access |\n| Sanctions | Provider must stop serving certain countries or entities |\n| Commercial decisions | Price changes, product retirement, terms changes |\n| Model deprecation | Older versions removed |\n| Outages | Provider-wide failures |\n| Account actions | Suspension for policy reasons |\n\n### Mitigation playbook\n\n| Mitigation | How |\n|---|---|\n| Multi-provider design | Abstraction layer to switch models |\n| Self-hosted fallback | Open-weight model ready to serve |\n| Version pinning | Contracts on model availability windows |\n| Data portability | Keep prompts, evaluations and fine-tuning data |\n| Contract terms | Notice periods, continuity clauses |\n| Regular drills | Test switching providers |\n\n### Design principle\n\nFor essential services, ensure you can continue operating at an acceptable quality level if any single external AI provider becomes unavailable for weeks."}, {"id": 50, "title": "Cybersecurity of national AI infrastructure", "tldr": "National AI infrastructure attracts sophisticated attackers seeking data, model weights, compute or disruption. Apply critical-infrastructure security: segmentation, identity controls, supply-chain checks, monitoring, incident response and AI-specific protections.", "real": "In 2024, security firm Oligo reported active exploitation of exposed Ray AI compute clusters (“ShadowRay”), with attackers stealing credentials and using GPUs for cryptomining. Exposed AI tooling is a real target, and national clusters face the same risks at higher stakes.", "body": "### Threats to national AI infrastructure\n\n| Threat | Example |\n|---|---|\n| Weight theft | Exfiltration of national models |\n| Data theft | Training data, citizen data in RAG |\n| Compute abuse | Hijacked GPUs for mining or attacker workloads |\n| Sabotage | Poisoned training data, tampered models |\n| Disruption | Ransomware, DDoS on AI services |\n| Insider threats | Privileged staff misuse |\n\n### Controls\n\n- [ ] Critical-infrastructure designation and requirements\n- [ ] Network segmentation; no public exposure of management tools\n- [ ] Strong identity: hardware keys, least privilege, privileged access management\n- [ ] Signed models and datasets; registry controls\n- [ ] 24/7 monitoring by a security operations center\n- [ ] AI-specific defenses (prompt injection, model security)\n- [ ] Incident response exercises with national cyber agencies\n- [ ] Vetting for staff with access to weights and sensitive data\n\nSee the AI security course for detailed technical controls."}, {"id": 51, "title": "Regulatory approaches to AI", "tldr": "Jurisdictions regulate AI in different ways: comprehensive risk-based laws (EU), targeted rules plus heavy state oversight (China), sector regulators and voluntary frameworks (UK, India, US federal level), and state or provincial laws. Regulation is itself an expression of sovereignty.", "real": "The OECD’s AI policy observatory (OECD.AI) tracks more than a thousand AI policy initiatives from around 70 countries and the EU, showing how widely governments are writing their own AI rules rather than leaving them to companies or other states.", "body": "### Main models\n\n| Model | Example jurisdictions | Characteristics |\n|---|---|---|\n| Comprehensive risk-based law | EU | One horizontal law with risk tiers |\n| Targeted rules + state oversight | China | Specific rules for algorithms, generative AI, labeling; registration |\n| Pro-innovation, sector-led | UK, India | Existing regulators apply principles; few new AI laws |\n| Federal frameworks + state laws | US | Executive policy, agency guidance; state legislation |\n| Framework laws | Japan, South Korea | Basic acts promoting AI with governance structures |\n\n### Common elements across regimes\n\n- Transparency for AI-generated content and chatbots\n- Rules for high-impact uses (employment, credit, public services)\n- Data protection law applied to AI\n- Safety evaluation for powerful models (in some regimes)\n- Public-sector AI use guidelines\n\n### Sovereignty angle\n\nRules decide which products can operate in your market and on what terms. Large markets can export their rules globally (the “Brussels effect”), while smaller ones often align with a major regime."}, {"id": 52, "title": "The EU AI Act and European sovereignty", "tldr": "The EU AI Act is the first comprehensive AI law. It bans certain practices, regulates high-risk systems, sets transparency duties and imposes obligations on general-purpose AI model providers. It applies to anyone placing AI on the EU market, regardless of where they are based.", "real": "The AI Act entered into force in August 2024. Prohibitions applied from February 2025 and general-purpose AI model obligations from August 2025. In 2026, EU institutions agreed a “Digital Omnibus” amendment that moved most high-risk obligations to December 2027 (stand-alone systems) and August 2028 (AI in regulated products), while most transparency duties kept their August 2026 date.", "body": "### Structure\n\n| Category | Examples | Obligations |\n|---|---|---|\n| Prohibited | Social scoring, certain biometric and manipulative uses | Banned |\n| High-risk | Hiring, education, credit, critical infrastructure, some public services | Risk management, data governance, documentation, human oversight, robustness, cybersecurity |\n| Transparency | Chatbots, deepfakes, AI-generated content | Disclosure and labeling |\n| General-purpose AI models | Foundation models | Documentation, copyright policy; more duties for systemic-risk models |\n| Minimal risk | Most other AI | Voluntary codes |\n\n### Sovereignty dimensions\n\n- **Rule-setting power:** applies to non-EU providers serving EU users\n- **Codes of practice:** the General-Purpose AI Code of Practice (2025) shaped provider commitments\n- **AI Office:** EU-level body supervising general-purpose AI models\n- **Debate:** some argue strict rules protect citizens and build trust; others argue they slow European competitiveness. The Omnibus delays reflect that debate.\n\n### Note\n\nDates and details may change further. Check the official EU texts for current obligations."}, {"id": 53, "title": "China’s AI governance", "tldr": "China regulates AI through targeted measures: algorithm recommendation rules, deep synthesis rules, interim measures for generative AI services, mandatory content labeling, and a filing (registration) system for algorithms and models, alongside strong state industrial policy.", "real": "China’s Interim Measures for the Management of Generative AI Services took effect on 15 August 2023, requiring public-facing generative AI services to meet content and security requirements. Rules requiring labeling of AI-generated content took effect on 1 September 2025.", "body": "### Key instruments\n\n| Instrument | Year in force | Focus |\n|---|---|---|\n| Algorithm Recommendation Provisions | 2022 | Recommendation algorithms, filing |\n| Deep Synthesis Provisions | 2023 | Deepfakes and synthetic media |\n| Interim Measures for Generative AI | 2023 | Public generative AI services |\n| AI-generated content labeling measures | 2025 | Explicit and implicit labels |\n| Data laws (PIPL, DSL, Cybersecurity Law) | 2017–2021 | Data protection and localization |\n\n### Industrial policy\n\n| Policy | Content |\n|---|---|\n| New Generation AI Development Plan (2017) | Goal of global AI leadership by 2030 |\n| “AI+” action plan (2025) | Broad AI adoption across the economy |\n| Chip self-reliance funds | Domestic semiconductor capacity |\n\n### Characteristics\n\n- Registration and security assessment of public-facing models\n- Content requirements aligned with state policy\n- Strong support for domestic open-weight model development\n- Active international governance proposals (ch. 89)"}, {"id": 54, "title": "United States federal AI policy", "tldr": "US federal policy emphasizes AI leadership, infrastructure build-out, reduced regulatory barriers, export of American AI technology to partners, and security controls on rivals. Much detailed regulation happens at the state level and through agencies.", "real": "In July 2025, the White House released “America’s AI Action Plan” with three executive orders, including one establishing a program to promote exports of full-stack American AI technology packages to partner countries. An earlier January 2025 order revoked the previous administration’s 2023 AI executive order.", "body": "### Pillars of the 2025 Action Plan\n\n| Pillar | Examples |\n|---|---|\n| Accelerate innovation | Remove regulatory barriers, support open models, federal adoption |\n| Build infrastructure | Faster permitting for data centers, energy, chip manufacturing |\n| International diplomacy and security | Export American AI stack to allies, export controls on rivals |\n\n### Related instruments\n\n| Instrument | Content |\n|---|---|\n| Stargate project (private, announced Jan 2025) | Large AI infrastructure investment |\n| CHIPS and Science Act (2022) | Domestic semiconductors |\n| NAIRR pilot (2024) | Shared research compute and data |\n| Genesis Mission (Nov 2025) | Executive order on AI for scientific discovery via national labs |\n| OMB memos (2025) | Federal agency AI use and procurement |\n\n### For other countries\n\nUS policy affects everyone through chip and model export rules, “AI exports” partnership offers, and the dominance of US cloud and model providers. Partners weigh access to US technology against dependence."}, {"id": 55, "title": "India’s AI governance approach", "tldr": "India favors a pro-innovation, light-touch approach: principle-based governance guidelines, existing laws (IT Act, Digital Personal Data Protection Act), sector regulators, and strong state investment through the IndiaAI Mission rather than a standalone AI law.", "real": "In November 2025, India’s Ministry of Electronics and IT released the India AI Governance Guidelines, which favor principles, institutions and voluntary measures over a new AI-specific law. The same month, the government notified the rules implementing the Digital Personal Data Protection Act, 2023, with phased compliance timelines.", "body": "### Key elements\n\n| Element | Description |\n|---|---|\n| IndiaAI Mission (2024) | Compute, models, datasets (AIKosh), applications, skills, startups, safe and trusted AI |\n| India AI Governance Guidelines (2025) | Principles and institutional framework |\n| DPDP Act (2023) and Rules (2025) | Personal data protection |\n| IT Rules | Platform obligations, including on synthetic media |\n| Sector regulators | RBI, SEBI and others issue AI guidance in their domains |\n| IndiaAI Safety Institute | Announced in 2025 |\n\n### Sovereignty emphasis\n\n- Indian languages through Bhashini and national model programs\n- Public compute through private providers\n- Digital public infrastructure as a platform for AI (ch. 82)\n- International role through hosting the 2026 AI Impact Summit\n\n### Debates\n\nSupporters say flexibility encourages innovation and adoption. Critics argue that without binding rules, protections for citizens in high-risk uses may be weaker. Policy continues to evolve."}, {"id": 56, "title": "United States: the scale leader", "tldr": "The US leads in frontier models, AI chips design, cloud platforms, private investment and talent. Its sovereignty strategy focuses on maintaining that lead, securing supply chains, building energy and data centers, and extending US technology to partners.", "real": "Stanford’s AI Index reports have consistently found the US producing the largest number of notable AI models and attracting the most private AI investment, by a wide margin, while also noting that China has narrowed the performance gap on major benchmarks.", "body": "### Strengths\n\n| Layer | Position |\n|---|---|\n| Chips | Leading designers (Nvidia, AMD, Google, AWS); some domestic manufacturing growing |\n| Compute | Largest clusters, hyperscalers |\n| Models | Most frontier labs |\n| Capital | Largest private AI investment |\n| Talent | Top universities, immigration of researchers |\n\n### Dependencies\n\n| Dependency | Mitigation |\n|---|---|\n| Taiwan fabrication | CHIPS Act fabs |\n| Energy and grid capacity | Permitting reform, new generation |\n| Some materials and components | Supply-chain diversification |\n| Foreign talent | Visa policy is a recurring debate |\n\n### Strategy themes\n\n- Infrastructure build-out (private and federal sites)\n- Export controls toward rivals\n- Packaging US AI for allies (“AI exports”)\n- Federal adoption of AI\n- Public research resources (NAIRR, national labs)"}, {"id": 57, "title": "The European Union: rules, compute and catch-up", "tldr": "The EU combines regulation (AI Act, data laws) with investment: EuroHPC supercomputers, AI Factories, the InvestAI initiative and planned AI Gigafactories. Its challenge is scale: private AI investment and cloud market share lag the US.", "real": "At the Paris AI Action Summit in February 2025, Commission President Ursula von der Leyen announced InvestAI, aiming to mobilize €200 billion including a €20 billion fund for AI gigafactories. By 2026, EuroHPC was implementing 19 AI Factories, and on 30 July 2026 it launched a tender for up to seven AI Gigafactories, with selection expected in early 2027.", "body": "### EU instruments\n\n| Instrument | Purpose |\n|---|---|\n| AI Act | Rules and trust |\n| GDPR, Data Act, Data Governance Act | Data rights and sharing |\n| EuroHPC Joint Undertaking | Public supercomputing and AI Factories |\n| AI Continent Action Plan (2025) | Compute, data, skills, adoption |\n| InvestAI | Investment mobilization incl. gigafactories |\n| Chips Act | Semiconductor capacity |\n| Apply AI Strategy (2025) | Adoption in industry and public sector |\n\n### Strengths\n\n- Large single market and regulatory influence\n- Strong research base and supercomputing network\n- Industrial champions (ASML, SAP) and AI startups (Mistral and others)\n- Many languages served by EU-funded open models\n\n### Challenges\n\n- Fragmented capital markets and smaller private investment\n- Dependence on US cloud providers\n- Energy prices and grid constraints in some states\n- Talent competition with US labs"}, {"id": 58, "title": "France", "tldr": "France positions itself as Europe’s AI leader through national champions (Mistral AI), large announced private investments in data centers, nuclear-powered electricity, a strong research ecosystem, and leadership in international AI diplomacy.", "real": "Around the February 2025 AI Action Summit in Paris, President Macron announced €109 billion of private AI investment commitments, including large data center projects. Mistral AI announced Mistral Compute with Nvidia in June 2025, and in September 2025 Dutch chip-equipment maker ASML led a €1.7 billion funding round in Mistral, becoming a major shareholder.", "body": "### Pillars\n\n| Pillar | Detail |\n|---|---|\n| Champions | Mistral AI, plus many AI startups |\n| Infrastructure | Data center investment commitments, Mistral Compute |\n| Energy | Large low-carbon nuclear electricity base |\n| Research | INRIA, CNRS, universities, Jean Zay public supercomputer |\n| Sovereign cloud | SecNumCloud qualification, Bleu, S3NS, French providers |\n| Diplomacy | Hosted the 2025 AI Action Summit |\n\n### Distinctive features\n\n- Strong state support for a European champion with open-weight releases\n- Use of nuclear power as an AI-infrastructure advantage\n- Strict sovereign-cloud certification for sensitive public data\n\n### Open questions\n\nTurning announced investments into built capacity, and scaling champions against US competitors with far larger budgets."}, {"id": 59, "title": "Germany", "tldr": "Germany combines strong industry (manufacturing, automotive, chemicals), public supercomputing, sovereign cloud initiatives for the public sector, and industrial AI partnerships. Its focus is AI for industry and secure public administration.", "real": "Germany’s JUPITER system at Forschungszentrum Jülich, inaugurated in 2025, became Europe’s first exascale supercomputer and hosts a EuroHPC AI Factory. Germany has also backed public-sector sovereign cloud offerings such as Delos Cloud.", "body": "### Pillars\n\n| Pillar | Detail |\n|---|---|\n| Public compute | JUPITER (Jülich), other national HPC centers |\n| Industrial AI | Manufacturing, automotive, engineering partnerships |\n| Sovereign cloud | Public-sector offerings, German providers |\n| Open models | Projects such as OpenGPT-X (Teuken models) |\n| Research | Max Planck, Fraunhofer, Helmholtz, universities |\n| Startups | Including companies focused on enterprise and public-sector AI |\n\n### Distinctive features\n\n- Strong emphasis on industrial and “physical” AI\n- Federal structure: states run much of the administration\n- High data protection expectations\n\n### Challenges\n\n- Energy costs and grid expansion\n- Pace of public-sector digitalization\n- Scaling startups to global size"}, {"id": 60, "title": "United Kingdom", "tldr": "The UK pursues an “AI maker” strategy: expanding public compute (Isambard-AI and the AI Research Resource), AI Growth Zones for data centers, a Sovereign AI Unit investing in UK firms, a strong safety and security institute, and partnerships with US companies.", "real": "The UK’s January 2025 AI Opportunities Action Plan, written by Matt Clifford, set out 50 recommendations, all accepted by the government. A year on, the government reported five designated AI Growth Zones, the launch of Isambard-AI, £2 billion committed to expand compute twentyfold by 2030, and a Sovereign AI Unit backed by up to £500 million that began its investment phase in April 2026.", "body": "### Pillars\n\n| Pillar | Detail |\n|---|---|\n| Public compute | AI Research Resource (Isambard-AI, Dawn), Compute Roadmap |\n| Data centers | AI Growth Zones with planning and energy support |\n| Investment | Sovereign AI Unit |\n| Security | AI Security Institute (renamed 2025) |\n| Data | National Data Library initiative |\n| Public sector | AI tools for civil servants (e.g. the “Humphrey” suite) |\n| Partnerships | Major investments announced by US technology firms |\n\n### Distinctive features\n\n- World-class research universities and an AI lab ecosystem (including Google DeepMind in London)\n- Early and influential government AI evaluation capability\n- Pro-innovation, sector-regulator approach to rules\n\n### Challenges\n\nDelivering announced Growth Zones on time, energy costs, and keeping homegrown companies in the UK as they scale."}, {"id": 61, "title": "China: self-reliance at scale", "tldr": "China pursues AI self-reliance across the stack: domestic chips and accelerators, large cloud providers, many competitive open-weight models, abundant data and engineers, strong state planning, and a large domestic market. Export controls have accelerated domestic substitution.", "real": "In January 2025, DeepSeek released its R1 reasoning model with open weights, matching leading Western reasoning models on several benchmarks at much lower reported cost. In August 2025, China’s State Council issued an “AI+” action plan setting targets for broad AI adoption across industry and society.", "body": "### Stack overview\n\n| Layer | Position |\n|---|---|\n| Chips | Domestic accelerators (Huawei Ascend and others); limited access to the most advanced foreign chips; manufacturing constrained by equipment controls |\n| Cloud | Alibaba Cloud, Huawei Cloud, Tencent Cloud, Baidu and others |\n| Models | DeepSeek, Qwen (Alibaba), Kimi (Moonshot), GLM (Zhipu), Doubao (ByteDance), ERNIE (Baidu) and more |\n| Data | Large domestic data, governed by strict data laws |\n| Talent | Very large pool of AI researchers and engineers |\n| Governance | Registration, content and labeling rules |\n\n### Strategy features\n\n- **Open-weight leadership:** many top open models come from Chinese labs\n- **Efficiency innovation:** engineering to do more with constrained hardware\n- **State funds:** for chips, compute and AI adoption\n- **Domestic market scale:** fast deployment in consumer and industrial apps\n\n### Challenges\n\n- Access to the most advanced chips and lithography\n- Software ecosystem maturity for domestic accelerators\n- Content controls that shape model behavior"}, {"id": 62, "title": "India: public compute, languages and digital public infrastructure", "tldr": "India’s approach combines the IndiaAI Mission (subsidized compute via private providers, indigenous foundation models, datasets, skills), strong focus on Indian languages, and its digital public infrastructure (Aadhaar, UPI, Bhashini) as a platform for AI at population scale.", "real": "The IndiaAI Mission was approved in March 2024 with an outlay of about ₹10,372 crore over five years. By 2026 the government reported more than 38,000 GPUs onboarded for subsidized access, selected 12 organizations to build foundation models, and saw sovereign models from Sarvam AI, BharatGen and Gnani launched at the February 2026 AI Impact Summit in New Delhi.", "body": "### The seven pillars of IndiaAI\n\n| Pillar | Purpose |\n|---|---|\n| Compute capacity | Subsidized GPU access via empanelled providers |\n| Innovation Centre (foundation models) | Indigenous LLMs and SLMs |\n| Datasets platform (AIKosh) | Data, models and tools |\n| Application development | AI for sectors like agriculture and health |\n| FutureSkills | Training and education |\n| Startup financing | Funding support |\n| Safe and trusted AI | Tools for bias, privacy, deepfake detection and more |\n\n### Distinctive strengths\n\n- 22 scheduled languages and hundreds of dialects: strong case for language AI\n- Population-scale digital public infrastructure\n- Large software and IT services workforce\n- Growing data center investment\n\n### Challenges\n\n| Challenge | Detail |\n|---|---|\n| GPU deployment pace | Reports in 2025 showed installation lagging empanelment |\n| Talent retention | Competition with global labs |\n| Power and water | Data center growth constraints |\n| Model competitiveness | Matching global quality with smaller budgets |"}, {"id": 63, "title": "Japan", "tldr": "Japan pairs a light-touch, promotion-focused AI law with industrial policy: compute subsidies for domestic model developers (GENIAC), public supercomputers (ABCI), Japanese-language models, and major semiconductor investments including Rapidus and TSMC’s Kumamoto fab.", "real": "Japan enacted its AI Promotion Act in May 2025, a framework law focused on promoting research, development and use of AI, with a government AI strategy headquarters, rather than imposing detailed restrictions. In April 2025, Rapidus started a 2 nm pilot production line in Hokkaido, targeting mass production in 2027.", "body": "### Pillars\n\n| Pillar | Detail |\n|---|---|\n| Law | AI Promotion Act (2025): basic framework and strategy |\n| Compute | ABCI (AIST), support for private GPU clouds |\n| Models | GENIAC program supporting domestic developers; LLM-jp; Swallow; startups such as Sakana AI |\n| Chips | Rapidus (leading-edge logic), TSMC/JASM Kumamoto fab |\n| Data | Japanese-language corpora, public data |\n| Security | Japan AI Safety Institute (J-AISI) |\n\n### Distinctive features\n\n- Many supported model developers rather than a single champion\n- Strong focus on Japanese language and culture\n- Semiconductor revival as long-term sovereignty play\n- Close alignment with US and allied supply-chain efforts\n\n### Challenges\n\nTalent scarcity, energy costs, and scaling domestic models against global leaders."}, {"id": 64, "title": "South Korea", "tldr": "South Korea combines memory-chip leadership (SK hynix, Samsung), large conglomerates, a competitive national foundation-model program with staged elimination, major GPU deployment plans, and a basic AI law. It is a leading example of an explicit “sovereign model” competition.", "real": "Korea’s independent AI foundation model project selected five teams in August 2025 and narrows them through regular evaluations. In August 2026, the science ministry advanced LG AI Research, SK Telecom and Upstage after its second evaluation, with a final selection of two teams planned. In October 2025, Nvidia announced that Korea’s government and companies would deploy over 260,000 of its GPUs.", "body": "### Pillars\n\n| Pillar | Detail |\n|---|---|\n| Chips | World leaders in memory, including HBM |\n| Models | National foundation model competition; models from LG (EXAONE), Naver (HyperCLOVA X), SK Telecom, Upstage, others |\n| Compute | Government GPU procurement plus large corporate AI factories |\n| Law | AI Basic Act (passed December 2024; in effect from January 2026) |\n| Industry | Manufacturing, shipbuilding, automotive AI |\n\n### What others can learn\n\n- **Transparent, staged competition** with published criteria and scores\n- **Clear definition** of what counts as a sovereign model\n- **Public–private compute** split between government and conglomerates\n\n### Challenges\n\n- Scale of investment versus US and Chinese leaders\n- Concentration of capability in a few conglomerates\n- Energy for large AI data centers"}, {"id": 65, "title": "The UAE and Saudi Arabia", "tldr": "Gulf states use sovereign wealth, cheap energy and strategic partnerships with US technology firms to build AI hubs: national champions (G42, Humain), gigawatt-scale campuses, Arabic models, and investments abroad, in exchange for security commitments that unlock advanced chips.", "real": "In May 2025 the UAE and US announced a 5 GW AI campus in Abu Dhabi, and Saudi Arabia’s Public Investment Fund launched Humain as its national AI company. In November 2025, the US approved exports of advanced Nvidia chips to G42 and Humain under security conditions.", "body": "### UAE\n\n| Element | Detail |\n|---|---|\n| Champions | G42 (with Khazna data centers), Technology Innovation Institute (Falcon models) |\n| Models | Falcon (TII), Jais (Arabic), K2 Think (MBZUAI and G42) |\n| Research | MBZUAI, world’s first graduate AI university (founded 2019) |\n| Investment | MGX, a technology investment firm and Stargate partner |\n| Infrastructure | UAE–US AI Campus (5 GW plan), Stargate UAE (1 GW) |\n\n### Saudi Arabia\n\n| Element | Detail |\n|---|---|\n| Champion | Humain (PIF-backed, launched 2025) |\n| Models | ALLaM Arabic models (developed by SDAIA) |\n| Infrastructure | Large data center plans, partnerships with US chip and cloud firms |\n| Governance | SDAIA as national data and AI authority |\n\n### Model of sovereignty\n\n“Partnered sovereignty”: domestic ownership of infrastructure and champions, built with foreign technology under negotiated conditions. Critics question how much control remains when access depends on foreign export licenses; supporters point to rapid capability gains."}, {"id": 66, "title": "Singapore and Southeast Asia", "tldr": "Singapore acts as a regional AI hub with strong governance tools, public-sector AI adoption and the SEA-LION regional language model family. Other Southeast Asian countries pursue national models, data center growth and digital economy strategies.", "real": "Singapore launched its National AI Strategy 2.0 in December 2023 and committed S$70 million to a National Multimodal LLM Programme to build Southeast Asian language capabilities, building on AI Singapore’s SEA-LION models. Singapore also open-sourced AI Verify, a testing toolkit for responsible AI.", "body": "### Singapore’s pillars\n\n| Pillar | Detail |\n|---|---|\n| Strategy | National AI Strategy 2.0 |\n| Models | SEA-LION (regional languages) |\n| Governance | Model AI governance frameworks, AI Verify toolkit |\n| Public sector | GovTech AI tools for public officers |\n| Infrastructure | Data center capacity managed carefully due to land and energy limits |\n\n### Regional picture\n\n| Country | Examples of activity |\n|---|---|\n| Indonesia | National AI strategy, Bahasa Indonesia models |\n| Malaysia | Data center boom (notably Johor), semiconductor strategy |\n| Vietnam | Digital technology law, Vietnamese language models |\n| Thailand | National AI strategy, Thai models |\n| Philippines | National AI roadmap |\n\n### Regional cooperation\n\nASEAN has issued a guide on AI governance and ethics (2024), giving member states a shared reference while each sets its own rules."}, {"id": 67, "title": "Canada", "tldr": "Canada combines deep research strength (Mila, Vector, Amii and pioneering researchers), a national compute strategy, a homegrown frontier-class company (Cohere), and policies to keep AI talent and infrastructure in the country.", "real": "In December 2024, Canada announced the Canadian Sovereign AI Compute Strategy with $2 billion over five years, including funding to build public compute and an AI Compute Access Fund to help Canadian researchers and companies obtain compute.", "body": "### Pillars\n\n| Pillar | Detail |\n|---|---|\n| Research | National AI institutes (Mila, Vector Institute, Amii) under the Pan-Canadian AI Strategy |\n| Compute | Sovereign AI Compute Strategy |\n| Champions | Cohere (enterprise LLMs) and other startups |\n| Governance | AI governance efforts; the proposed Artificial Intelligence and Data Act died when Parliament was prorogued in January 2025 |\n| Security | Canadian AI Safety Institute (2024) |\n\n### Distinctive features\n\n- World-class research history (deep learning pioneers)\n- Strong focus on keeping talent from moving to the US\n- Bilingual (English/French) requirements in public services\n\n### Challenges\n\n- Proximity to and dependence on US cloud and labs\n- Commercializing research at scale\n- Energy and data center siting decisions"}, {"id": 68, "title": "Switzerland and the Nordic countries", "tldr": "Smaller wealthy countries pursue sovereignty through public supercomputers, fully open models, clean energy for data centers, and regional cooperation, punching above their weight in specific layers rather than across the whole stack.", "real": "Switzerland’s Apertus model (2025), trained on the Alps supercomputer, was released fully open with data and training recipes. In the Nordics, Finnish lab Silo AI built open multilingual Nordic models (such as Viking) on the EuroHPC LUMI supercomputer before AMD acquired it in 2024 for about $665 million.", "body": "### Switzerland\n\n| Element | Detail |\n|---|---|\n| Compute | CSCS Alps supercomputer |\n| Models | Apertus (fully open, multilingual, including Swiss German and Romansh) |\n| Research | EPFL, ETH Zurich, Swiss AI Initiative |\n| Approach | Transparency and openness as a sovereignty strategy |\n\n### Nordic countries\n\n| Element | Detail |\n|---|---|\n| Compute | LUMI (Finland, EuroHPC), national clusters |\n| Energy | Abundant clean power and cool climate attract data centers |\n| Models | Nordic-language models from research groups and companies |\n| Cooperation | Joint Nordic projects and EU programs |\n\n### Lessons for small countries\n\n- Specialize: openness, clean-energy compute, language models\n- Cooperate regionally and through EU or multilateral programs\n- Use public supercomputers to train national talent and models"}, {"id": 69, "title": "Brazil and Latin America", "tldr": "Latin American countries focus on national AI plans, Spanish- and Portuguese-language models, data centers powered by renewable energy, regulation debates, and regional collaboration such as the Latam-GPT project.", "real": "In July 2024, Brazil presented its Brazilian AI Plan (PBIA) for 2024–2028 with about R$23 billion in planned investment, including supercomputing and Portuguese-language models. In December 2024, Brazil’s Senate approved an AI regulation bill (PL 2338/2023), which then moved to the Chamber of Deputies.", "body": "### Brazil\n\n| Element | Detail |\n|---|---|\n| Strategy | Brazilian AI Plan (PBIA) 2024–2028 |\n| Compute | Plans to expand public supercomputing |\n| Models | Portuguese-language model initiatives |\n| Regulation | AI bill with risk-based approach (in legislative process) |\n| Energy | Large renewable share attracts data centers |\n\n### Regional activity\n\n| Country / project | Activity |\n|---|---|\n| Chile | National AI policy; leads the regional Latam-GPT project through its national AI center (CENIA) |\n| Mexico | Digital strategy and data center growth |\n| Colombia, Argentina, Uruguay | National AI strategies and policies |\n\n### Distinctive opportunities\n\n- Renewable energy for sustainable data centers\n- Large Spanish- and Portuguese-speaking populations\n- Regional cooperation to share costs of models and data"}, {"id": 70, "title": "Africa", "tldr": "African AI sovereignty efforts center on the African Union’s continental strategy, national AI strategies, African-language datasets and models, regional data centers, skills, and connectivity. Community research networks and startups play a major role.", "real": "The African Union endorsed its Continental AI Strategy in July 2024. Grassroots networks like Masakhane, and companies like South Africa’s Lelapa AI (which released InkubaLM, a small model for African languages), show local teams building language technology with limited resources.", "body": "### Priorities\n\n| Priority | Example activity |\n|---|---|\n| Continental coordination | AU Continental AI Strategy |\n| National strategies | Kenya, Rwanda, Nigeria, Egypt, South Africa and others |\n| Language technology | Datasets and models for African languages |\n| Infrastructure | Data centers in hubs such as Johannesburg, Lagos, Nairobi |\n| Skills | Universities, bootcamps, research networks |\n| Data governance | AU data policy framework; national data protection laws |\n\n### Strategic opportunities\n\n- Leapfrogging with mobile-first AI services\n- Shared regional compute instead of many small national clusters\n- Open models adapted to local languages\n- AI for agriculture, health and financial inclusion\n\n### Challenges\n\n| Challenge | Detail |\n|---|---|\n| Connectivity and power | Infrastructure gaps |\n| Compute cost | GPUs and cloud are expensive relative to budgets |\n| Talent retention | Emigration of skilled researchers |\n| Data | Limited digitized local-language content |"}, {"id": 71, "title": "The cost of sovereignty", "tldr": "Sovereign AI is expensive: hardware, data centers, power, staff, data and models, with hardware needing refresh every few years. National budgets are small compared with the largest private AI spenders, so countries must target spending carefully.", "real": "India’s IndiaAI Mission budget of about ₹10,372 crore (roughly $1.2 billion) over five years, and the UK’s £2 billion compute commitment, are significant national sums. Yet the largest US technology companies’ combined AI-related capital spending has run to hundreds of billions of dollars per year, which is why governments focus on leverage rather than matching it.", "body": "### Cost components\n\n| Component | Notes |\n|---|---|\n| Accelerators | Largest upfront cost; depreciate over \\~3–5 years |\n| Data center build | Shell, power, cooling; long-lived (15–20 years) |\n| Power | Ongoing; often a large share of operating cost |\n| Networking and storage | Significant for large clusters |\n| Staff | Engineers, researchers, operators |\n| Data | Acquisition, cleaning, annotation, licensing |\n| Model development | Training runs and experiments |\n| Programs | Grants, subsidies, skills, adoption support |\n\n### Total cost of ownership (TCO) thinking\n\n```\nTCO (5 years) = hardware + facility share + power + staff + software + refresh reserve\nCost per useful GPU-hour = TCO ÷ (GPU-hours actually used)\n```\n\nUtilization strongly drives value: a cluster used at 30% costs more than twice as much per useful hour as one used at 70%.\n\n### Leverage strategies\n\n- Co-investment with private partners\n- Using open models instead of training from scratch\n- Pooling regionally\n- Focusing public funds on public goods (data, languages, skills)"}, {"id": 72, "title": "Funding models", "tldr": "Sovereign AI is funded through government budgets, public-private partnerships, sovereign wealth funds, development banks, private investment attracted by incentives, and regional funds. Mixing sources spreads risk but complicates control.", "real": "Abu Dhabi created MGX in 2024, a technology investment firm backed by Mubadala and G42, which became an equity partner in the US Stargate project. The EU’s InvestAI initiative aims to combine EU funds with private capital, and India’s compute pillar relies on private providers investing in GPUs with public subsidies for users.", "body": "### Funding sources\n\n| Source | Typical role |\n|---|---|\n| Government budget | Public compute, research, programs |\n| Public-private partnerships | Shared investment in infrastructure |\n| Sovereign wealth funds | Large strategic investments at home and abroad |\n| Development and investment banks | Loans and guarantees |\n| Venture capital | Startups and champions |\n| Corporate investment | Data centers, enterprise AI |\n| Regional funds | Bloc-level programs (EU) |\n\n### Structuring for control\n\n| Mechanism | Purpose |\n|---|---|\n| Golden shares or board seats | State influence on strategic decisions |\n| Capacity reservations | Guaranteed access for public users |\n| Local ownership requirements | Domestic control |\n| Clawback clauses | Recover funds if commitments are missed |\n| Milestone-based funding | Pay for delivery |\n\n### Watch for\n\nAnnounced numbers often include private pledges over many years. Track **committed, contracted and delivered** amounts separately."}, {"id": 73, "title": "Making sovereign compute pay off", "tldr": "Public compute succeeds only if it is used. Allocation programs, subsidized pricing, easy onboarding, software support and anchor users (public agencies, national models) keep utilization high and convert hardware into outcomes.", "real": "In mid-2025, Indian media reported that of roughly 34,000 GPUs approved in the IndiaAI Mission’s first tender rounds, only about 17,000 had been installed by then, with some providers behind schedule. The gap between empanelment and operational capacity is a common challenge in national compute programs.", "body": "### Utilization drivers\n\n| Driver | Practice |\n|---|---|\n| Demand programs | Grants that include compute allocations |\n| Simple access | Portal, clear eligibility, fast approval |\n| Fair pricing | Subsidies for startups and academia |\n| Support | Engineers who help users scale jobs |\n| Software stack | Familiar tools (PyTorch, containers, schedulers) |\n| Anchor tenants | National model programs, agencies |\n\n### Metrics to publish\n\n| Metric | Why |\n|---|---|\n| Installed vs announced capacity | Delivery honesty |\n| Utilization % | Value for money |\n| Number of users and projects | Reach |\n| Queue wait time | Accessibility |\n| Outputs (models, papers, products) | Impact |\n\n### Typical failure modes\n\n- Hardware delivered before users are ready\n- Complex access processes deter startups\n- No support staff to help users\n- Capacity reserved but idle"}, {"id": 74, "title": "Industrial policy pitfalls", "tldr": "State-backed tech projects can fail when they chase prestige, lack users, pick the wrong technology, or try to replicate global giants without a differentiator. Good programs are demand-led, staged, transparent and willing to stop.", "real": "Quaero, a Franco-German project launched in 2005 to build a European rival to Google search, split when Germany pursued its own Theseus program in 2006 and ended without producing a competitive search engine. It is often cited as a warning for top-down digital sovereignty projects.", "body": "### Common pitfalls\n\n| Pitfall | Symptom |\n|---|---|\n| Prestige over demand | Big announcement, few users |\n| Single bet | One champion, no competition |\n| Wrong layer | Building what can be bought cheaply |\n| Under-budgeted operations | Hardware without staff or software |\n| Political timelines | Launch dates driven by events |\n| No exit criteria | Projects continue regardless of results |\n\n### Good practice\n\n| Practice | How |\n|---|---|\n| Staged funding | Milestones and evaluations (e.g. Korea’s elimination rounds) |\n| Competition | Several teams, not one |\n| Open outputs | Public goods others can build on |\n| Independent review | External evaluators |\n| User involvement | Agencies and startups co-design |\n| Sunset clauses | Stop or restructure if targets are missed |\n\n### Key question\n\n“What will exist in five years because of this program that would not exist otherwise, and who will use it?”"}, {"id": 75, "title": "Measuring results and public value", "tldr": "Sovereign AI programs should measure capability (compute, models, data), adoption (users, services), economic effects (firms, jobs), public value (better services, inclusion), and resilience (reduced dependence). Publishing results builds trust and allows correction.", "real": "In August 2026, South Korea’s science ministry published second-round evaluation scores for its national foundation model project, with teams ranked on benchmarks, expert review and user evaluation. Publishing scores made the program’s decisions open to public scrutiny.", "body": "### Measurement framework\n\n| Dimension | Example indicators |\n|---|---|\n| Capability | Operational GPUs, model quality on national benchmarks, datasets released |\n| Adoption | Agencies using AI, citizens served, API calls |\n| Economy | Startups supported, private investment attracted, jobs |\n| Public value | Service time saved, accuracy, satisfaction, inclusion of languages |\n| Resilience | Share of critical services that can run without foreign dependencies |\n| Talent | Researchers trained and retained |\n| Trust | Incidents, complaints, audit results |\n\n### Good reporting habits\n\n- Baselines before programs start\n- Distinguish announced, committed and delivered\n- Independent evaluation\n- Regular public dashboards\n\n### Avoid vanity metrics\n\n“Number of GPUs announced” or “parameters in our model” mean little without utilization, quality and real users."}, {"id": 76, "title": "Talent: the scarcest layer", "tldr": "People build and run everything else. Countries compete to train, attract and retain AI researchers, engineers and operators through education, research funding, competitive pay, visas, compute access and ambitious projects.", "real": "Mistral AI was founded in Paris in 2023 by researchers who had worked at Google DeepMind and Meta, and it quickly became Europe’s best-known AI company. Its founding is often cited as an example of talent returning home when there is a credible project, capital and compute.", "body": "### Talent types needed\n\n| Role | Scarcity |\n|---|---|\n| Frontier research scientists | Extremely scarce |\n| ML engineers (training, infrastructure) | Very scarce |\n| Data engineers and annotators | Moderate |\n| HPC and data center operators | Scarce |\n| AI product and policy specialists | Growing need |\n| Domain experts (health, law) with AI skills | Needed for adoption |\n\n### Levers\n\n| Lever | Example |\n|---|---|\n| Education | AI degrees, scholarships, reskilling |\n| Research funding | Grants, institutes, chairs |\n| Compute access | Researchers go where compute is |\n| Immigration | Fast visas for AI talent |\n| Ambitious projects | National models, labs |\n| Pay and equity | Startups and competitive public-sector pay |\n| Diaspora engagement | Programs to attract returnees |\n\n### Reality\n\nGovernments rarely match private lab salaries. They compete on mission, freedom to publish, compute access and quality of life."}, {"id": 77, "title": "Research institutions and national labs", "tldr": "Universities, national labs and AI institutes generate knowledge, train talent, run public compute and often build open models. Strong institutions with long-term funding are the foundation of sustainable AI sovereignty.", "real": "Abu Dhabi founded the Mohamed bin Zayed University of Artificial Intelligence (MBZUAI) in 2019 as a graduate research university dedicated to AI. It has since co-developed models such as Jais and K2 Think and built a research faculty in a short time.", "body": "### Institution types\n\n| Type | Role | Examples |\n|---|---|---|\n| Universities | Research and education | Worldwide |\n| National AI institutes | Focused research hubs | Mila, Vector (Canada); Swiss AI Initiative |\n| National labs | Large-scale compute and science | US DOE labs, Jülich, CSCS |\n| Government research agencies | Applied research | AIST (Japan), CSIR and others |\n| Public-interest AI labs | Open models and evaluation | Various non-profits |\n\n### Success factors\n\n- Long-term, predictable funding\n- Access to large compute\n- Freedom to publish and collaborate internationally\n- Links to industry and government users\n- Ability to pay competitive salaries for key roles\n\n### Role in sovereignty\n\nInstitutions keep capabilities **inside the country** even when companies are acquired or relocate, and they train the next generation."}, {"id": 78, "title": "Startups and national champions", "tldr": "National champions such as Mistral, Cohere, Sarvam, G42 and others give countries domestic AI capability and political leverage. Champions need customers, capital and compute, and some pivot when competing with global leaders becomes too costly.", "real": "Germany’s Aleph Alpha, once promoted as a European answer to OpenAI, said in 2024 that it would stop focusing on building its own frontier-competitive LLMs and shift toward an enterprise and government AI platform. It shows how champions adapt their strategy to market realities.", "body": "### Champion models\n\n| Model | Example traits |\n|---|---|\n| Frontier challenger | Builds competitive general models (e.g. Mistral) |\n| Enterprise specialist | Secure, private deployments (e.g. Cohere) |\n| Language specialist | Local-language models and speech |\n| Infrastructure champion | Data centers and sovereign cloud |\n| State-linked conglomerate | Broad national AI holding (e.g. G42, Humain) |\n\n### How governments support champions\n\n| Support | Risk |\n|---|---|\n| Procurement contracts | Favoritism, lock-in |\n| Compute access | Crowding out others |\n| Equity investment | Losses if the company fails |\n| Regulatory sandboxes | Uneven playing field |\n| Diplomatic promotion | Political dependence |\n\n### Healthy ecosystem principle\n\nSupport **several** companies through competitive programs, open procurement and public goods, rather than anointing one permanent champion."}, {"id": 79, "title": "Public procurement as an ecosystem lever", "tldr": "Governments are large AI buyers. Procurement can require sovereignty features (local hosting, portability, local languages), create markets for domestic firms, and set quality and safety standards, while avoiding lock-in and unfair favoritism.", "real": "France’s government built Albert, an AI assistant for public servants based on open models, developed by the interministerial digital directorate (DINUM) and deployed to help agents in public service counters. It shows a state building a capability in-house rather than buying a closed product.", "body": "### Procurement requirements that support sovereignty\n\n| Requirement | Effect |\n|---|---|\n| Data location and operations | Sensitive data stays under national control |\n| Portability and open formats | Avoid lock-in |\n| Bring-your-own-model support | Ability to switch models |\n| Local-language performance on national benchmarks | Better citizen service |\n| Security certifications | Trustworthy suppliers |\n| Transparency documentation | Model cards, data sources |\n| Exit plans | Data and model handover |\n\n### Market-shaping tools\n\n- Innovation procurement (pre-commercial procurement, challenges)\n- Framework agreements open to startups\n- Shared platforms used across agencies\n- Payment for outcomes rather than inputs\n\n### Pitfalls\n\nLong procurement cycles can exclude startups; overly specific requirements can lock in one vendor. Use modular contracts and regular re-competition."}, {"id": 80, "title": "Open science and research access to compute", "tldr": "Giving researchers and small firms access to compute, data and models spreads AI capability beyond large companies. National research resources, open datasets and open models are public goods that strengthen sovereignty broadly.", "real": "The US launched the National AI Research Resource (NAIRR) pilot in January 2024, led by the National Science Foundation with partner agencies and companies, to give researchers access to compute, datasets, models and training. The UK’s AI Research Resource and the EU’s AI Factories serve similar goals.", "body": "### Components of a research resource\n\n| Component | Example |\n|---|---|\n| Compute | Allocations on public and donated systems |\n| Data | Curated and secure datasets |\n| Models | Access to open and commercial models |\n| Software | Tools, notebooks, evaluation suites |\n| Training | Courses, documentation, support |\n| Community | Workshops, collaboration platforms |\n\n### Design principles\n\n- Open calls with transparent merit review\n- Fast lanes for small projects and students\n- Secure enclaves for sensitive data\n- Requirements to share results openly where possible\n\n### Why it matters for sovereignty\n\nA broad base of skilled researchers who can work with real models is more durable than any single model release."}, {"id": 81, "title": "AI in government services", "tldr": "Governments use AI for citizen help desks, document processing, translation, case summarization, fraud detection, policy analysis and internal productivity. Sovereign deployment matters most where services handle personal data or make decisions about people.", "real": "The UK government developed “Humphrey”, a suite of AI tools for civil servants, including “Consult”, which analyzes responses to public consultations. The government said such tools could save significant staff time, illustrating productivity-focused public-sector AI.", "body": "### Use cases by sensitivity\n\n| Use case | Data sensitivity | Typical deployment |\n|---|---|---|\n| Public information chatbot | Low | Commercial or sovereign cloud |\n| Drafting and summarizing internal documents | Medium | Sovereign cloud, approved tools |\n| Translation of public notices | Low–medium | Local-language models |\n| Case summaries (benefits, immigration) | High | Sovereign hosting, strict access |\n| Fraud and error detection | High | Controlled, audited models |\n| Health records assistance | Very high | National or certified sovereign infrastructure |\n| Intelligence and defense | Classified | Air-gapped |\n\n### Principles\n\n- **Human decision-makers** for decisions about people’s rights\n- **Transparency** about where AI is used\n- **Accessibility** in all official languages\n- **Testing** for accuracy and fairness before scaling\n- **Recourse** for citizens to challenge outcomes\n\n### Start with\n\nInternal productivity and low-risk information services; build skills and governance before moving to high-stakes decisions."}, {"id": 82, "title": "Digital public infrastructure and AI", "tldr": "Digital public infrastructure (DPI), meaning shared digital identity, payments and data exchange, gives AI services a trusted platform to reach whole populations. Combining DPI with local-language AI can deliver inclusive services at scale.", "real": "India’s DPI includes Aadhaar digital identity, the UPI payments system and the Bhashini language platform. Projects such as Jugalbandi, built in 2023 by AI4Bharat with Microsoft, demonstrated a WhatsApp-based assistant that explained government schemes in Indian languages using translation and LLMs.", "body": "### DPI building blocks\n\n| Block | Function | AI synergy |\n|---|---|---|\n| Digital identity | Verify who a person is | Personalized, authorized services |\n| Payments | Move money instantly | AI-assisted financial services |\n| Data exchange / consent | Share data with permission | Consent-based personalization |\n| Language platform | Translation and speech | Services in every language |\n| Open APIs | Standard interfaces | Many providers build on top |\n\n### Pattern: AI on DPI\n\n```\nCitizen speaks in local language\n   → speech recognition + translation (language platform)\n   → AI assistant understands the request\n   → consent-based data fetch (data exchange)\n   → eligibility check (government system)\n   → answer and next steps in the citizen's language\n```\n\n### Safeguards\n\n- Consent and purpose limitation for data use\n- Strong security for identity systems\n- Offline and human channels for people who cannot use digital tools\n- Oversight to prevent surveillance misuse"}, {"id": 83, "title": "Procuring and evaluating AI for government", "tldr": "Government AI procurement should define the problem, risk level and sovereignty needs, test candidates on real tasks and national benchmarks, require documentation and security, and keep the ability to switch providers.", "real": "In April 2025, the US Office of Management and Budget issued two memos (M-25-21 and M-25-22) on federal agencies’ use and acquisition of AI, covering risk management for high-impact AI and procurement practices such as avoiding vendor lock-in and protecting government data.", "body": "### Procurement steps\n\n| Step | Action |\n|---|---|\n| 1. Define | Problem, users, success metrics |\n| 2. Classify | Risk level and data sensitivity |\n| 3. Sovereignty needs | Hosting, operations, key control (ch. 4) |\n| 4. Market scan | Commercial, open-source, in-house options |\n| 5. Pilot | Test on real tasks with real users |\n| 6. Evaluate | Accuracy, fairness, security, cost |\n| 7. Contract | Data rights, portability, audits, exit |\n| 8. Monitor | Ongoing performance and incidents |\n\n### Contract clauses to include\n\n- No use of government data for vendor training without permission\n- Data location and sub-processor controls\n- Model version notice and availability periods\n- Incident notification timelines\n- Right to audit and independent testing\n- Exit assistance and data return\n\n### Evaluation tips\n\nTest in the languages and conditions citizens actually use; include adversarial and edge cases; compare against the current process, not perfection."}, {"id": 84, "title": "Citizen trust, transparency and rights", "tldr": "Public AI must earn trust: tell people when AI is used, explain decisions, test for bias, provide human review and appeal, and publish records of algorithmic systems. Failures in automated public systems can cause serious harm.", "real": "In the Netherlands, the childcare benefits scandal, in which tax authorities wrongly flagged thousands of families for fraud using risk-profiling methods that included discriminatory factors, led the government to resign in January 2021. The UK now requires central government bodies to publish records under its Algorithmic Transparency Recording Standard.", "body": "### Trust practices\n\n| Practice | Description |\n|---|---|\n| Disclosure | Clear notice when people interact with AI |\n| Algorithm registers | Public records of systems in use |\n| Impact assessments | Before deployment for high-risk uses |\n| Bias testing | Across groups and regions |\n| Human review | For decisions affecting rights |\n| Appeals | Accessible ways to challenge outcomes |\n| Independent oversight | Auditors, ombudspersons, courts |\n\n### Lessons from failures\n\n- Risk-scoring of citizens can encode discrimination\n- Automation can scale errors quickly\n- Lack of transparency delays discovery of harm\n- People need meaningful, timely recourse\n\n### Sovereignty and rights\n\nA sovereign system is not automatically a trustworthy one. Democratic oversight, rule of law and rights protections should be built into sovereign AI from the start."}, {"id": 85, "title": "Defense and dual-use AI", "tldr": "AI is transforming defense: intelligence analysis, logistics, cyber, decision support and autonomous systems. Defense AI needs the highest sovereignty, rigorous testing, clear rules on human control, and careful partnerships with commercial AI firms.", "real": "In July 2025, the US Department of Defense’s Chief Digital and AI Office awarded contracts with ceilings of up to $200 million each to Anthropic, Google, OpenAI and xAI to develop AI capabilities for national security uses. Defense ministries worldwide are similarly partnering with commercial AI developers.", "body": "### Defense AI uses\n\n| Area | Examples |\n|---|---|\n| Intelligence | Analyzing imagery, signals, documents |\n| Logistics | Maintenance prediction, supply planning |\n| Cyber | Detection, response, vulnerability discovery |\n| Decision support | Planning, wargaming, situational awareness |\n| Autonomy | Unmanned systems with varying human control |\n| Training | Simulation and exercises |\n\n### Sovereignty requirements\n\n- Classified or air-gapped deployment\n- Trusted supply chains for hardware and models\n- National control over updates and data\n- Ability to operate in contested or disconnected environments\n\n### Governance\n\n| Topic | Approach |\n|---|---|\n| Human control | Policies on appropriate human judgment over use of force |\n| Testing | Rigorous evaluation before fielding |\n| International norms | Discussions at the UN and in political declarations on responsible military AI |\n| Export controls | Dual-use technology rules |"}, {"id": 86, "title": "The international AI summit series", "tldr": "Since 2023, governments have met at a series of AI summits: Bletchley Park (UK, 2023), Seoul (2024), Paris (2025) and New Delhi (2026). The focus shifted from frontier safety toward action, inclusion and impact, with non-binding declarations.", "real": "The February 2026 AI Impact Summit in New Delhi, the first in the series hosted in the Global South, ended with the New Delhi Declaration on AI Impact, endorsed at adoption by 88 countries and international organizations, including the US and China, with more joining afterward. The US and UK had declined to sign the Paris summit’s declaration in 2025.", "body": "### The series\n\n| Summit | Year | Main theme | Notable outcome |\n|---|---|---|---|\n| Bletchley Park, UK | 2023 | Frontier AI safety | Bletchley Declaration (28 countries and the EU) |\n| Seoul, South Korea | 2024 | Safety, innovation, inclusion | Frontier AI Safety Commitments by companies |\n| Paris, France | 2025 | AI Action | Declaration on inclusive and sustainable AI; InvestAI and French investment announcements |\n| New Delhi, India | 2026 | AI Impact | New Delhi Declaration; voluntary frontier AI impact commitments |\n\n### Why summits matter for sovereignty\n\n- Platforms for middle powers and the Global South to shape agendas\n- Venues for investment and partnership announcements\n- Build shared vocabulary even without binding rules\n\n### Limits\n\nDeclarations are voluntary. Real influence depends on follow-through: institutions, funding and national implementation."}, {"id": 87, "title": "Multilateral AI governance bodies", "tldr": "AI governance is spread across the UN, OECD, G7, G20, Council of Europe, UNESCO, ITU and regional bodies. Each offers different tools: principles, treaties, scientific assessment, standards and capacity building.", "real": "In August 2025, the UN General Assembly established an Independent International Scientific Panel on AI and a Global Dialogue on AI Governance. The Council of Europe’s Framework Convention on AI, opened for signature in September 2024, is the first legally binding international treaty on AI and human rights.", "body": "### Bodies and their roles\n\n| Body | Main contribution |\n|---|---|\n| United Nations | Scientific panel, global dialogue, resolutions |\n| UNESCO | Recommendation on the Ethics of AI (2021) |\n| OECD | AI Principles (2019, updated 2024), policy observatory; integrated GPAI |\n| G7 | Hiroshima AI Process code of conduct for advanced AI developers |\n| G20 | AI principles and development agenda |\n| Council of Europe | Framework Convention on AI, human rights and rule of law |\n| ITU | AI for Good, technical standards |\n| Regional | EU, African Union, ASEAN frameworks |\n\n### How countries use them\n\n- Join and shape principles consistent with national values\n- Use treaties to anchor human-rights protections\n- Access capacity-building and shared research\n- Coordinate on cross-border issues (safety, misuse, standards)\n\n### Tension with sovereignty\n\nInternational commitments constrain some choices; in exchange they offer influence, interoperability and legitimacy."}, {"id": 88, "title": "AI safety and security institutes", "tldr": "Many governments created AI safety or security institutes to evaluate advanced models, develop testing methods and advise policy. They are a form of sovereign capability: the ability to independently test the AI systems a country depends on.", "real": "The UK created its AI Safety Institute in November 2023 and renamed it the AI Security Institute in February 2025. The US created its institute within NIST in 2023 and reorganized it as the Center for AI Standards and Innovation in 2025. Japan, Singapore, Canada, Korea, France, India and others established their own institutes or equivalents.", "body": "### What institutes do\n\n| Function | Example |\n|---|---|\n| Pre-deployment testing | Evaluate models for dangerous capabilities |\n| Research | Evaluation methods, safeguards |\n| Standards | Contribute to testing standards |\n| International cooperation | Joint testing, shared methods |\n| Advice | Inform regulators and ministers |\n\n### Why it matters for sovereignty\n\n- Countries can verify claims instead of relying on vendor self-reports\n- Evaluation expertise informs procurement and regulation\n- Access agreements with labs give early insight into new models\n\n### Building one\n\n| Element | Need |\n|---|---|\n| Talent | ML researchers, security experts, domain scientists |\n| Access | Agreements with model developers |\n| Compute | For running evaluations |\n| Mandate | Clear legal and policy role |\n| Partnerships | Network with other institutes |"}, {"id": 89, "title": "Alliances, partnerships and competing visions", "tldr": "Major powers offer AI partnerships that come with technology and conditions. The US promotes exports of its full AI stack to partners with security commitments; China promotes open models, infrastructure cooperation and a UN-centered governance vision. Other countries weigh the offers.", "real": "In July 2025, the US launched a program to promote exports of full-stack American AI technology packages. The same month, China released a Global AI Governance Action Plan at the World Artificial Intelligence Conference in Shanghai and proposed a World AI Cooperation Organization.", "body": "### Partnership types\n\n| Type | Example features |\n|---|---|\n| Government-to-government | Security commitments, export licenses, joint projects |\n| Company-to-country | Data center investments, “for countries” programs, sovereign cloud offers |\n| Regional | Shared compute or data initiatives |\n| Supply-chain coalitions | Trusted partners for chips and critical materials |\n\n### Comparing visions (as described by each side)\n\n| Theme | US approach | China’s approach |\n|---|---|---|\n| Technology offer | Full-stack US AI exports to trusted partners | Open models, infrastructure, capacity building |\n| Governance | Innovation-led, security controls on rivals | UN-centered multilateral governance, proposed new organization |\n| Conditions | Security and export-control commitments | Emphasis on non-interference and development |\n\n### Evaluating a partnership\n\n1. What capability do we gain, and what control do we keep?\n2. What conditions apply now, and can they change?\n3. Does it lock us into one ecosystem?\n4. Does it build local skills and institutions?\n5. Can we exit or diversify later?"}, {"id": 90, "title": "Standards and interoperability", "tldr": "International standards for AI management, risk, data quality, testing and terminology shape markets and trust. Participating in standards bodies is a quiet but powerful sovereignty tool, because standards often become the basis for regulation and procurement.", "real": "ISO/IEC JTC 1/SC

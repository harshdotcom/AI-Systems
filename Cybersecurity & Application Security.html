ty. Sigstore enables keyless signing tied to CI identities via OIDC, with signatures recorded in a public transparency log.", "real": "The Sigstore project launched in 2021 (Linux Foundation, Google, Red Hat, Purdue), and package ecosystems including npm and PyPI added provenance attestations built on it.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Verifiable signatures on software artifacts |\n| Why it matters | Blocks tampered or unofficial artifacts |\n| Tools | cosign, Rekor transparency log, admission policies |\n| Watch out for | Signing without verifying at deploy time |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CI[CI workflow identity] --> SIGN[cosign keyless sign]\n  SIGN --> LOG[Transparency log]\n  SIGN --> REG[Signed image in registry]\n  REG --> ADMIT[Admission controller verifies identity]\n  ADMIT -->|valid| RUN[Run]\n  ADMIT -->|invalid| BLOCK[Block]\n```\n\n### Worked example\n\n```bash\ncosign sign registry.example.com/orders-api@sha256:4f1c...\ncosign verify registry.example.com/orders-api@sha256:4f1c... \\\n  --certificate-identity-regexp \"https://github.com/acme/orders-api/.*\" \\\n  --certificate-oidc-issuer https://token.actions.githubusercontent.com\n```"}, {"id": 106, "title": "Package registry attacks", "tldr": "Attackers publish malicious packages with names similar to popular ones (typosquatting), exploit internal package names on public registries (dependency confusion) or hijack maintainer accounts. Use private registries, scoped names, pinning and allow-lists.", "real": "In February 2021 researcher Alex Birsan demonstrated dependency confusion by publishing public packages matching internal package names used by major companies, which were then installed by their build systems.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Malicious or impersonating packages |\n| Why it matters | Code runs during install or at runtime |\n| Defenses | Private registry proxy, scoped names, lock files, install-script restrictions |\n| Watch out for | Builds pulling from public registries by default for internal names |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BUILD[Build] --> PROXY[Internal registry proxy]\n  PROXY -->|internal scope @acme| PRIVATE[Private packages only]\n  PROXY -->|public packages| ALLOW[Allow-listed + scanned]\n  PUBLIC[Public registry] --> ALLOW\n```\n\n### Worked example\n\n```ini\n# .npmrc: internal scope always resolves to the private registry\n@acme:registry=https://npm.internal.example.com/\nregistry=https://npm.internal.example.com/\nignore-scripts=true\n```"}, {"id": 107, "title": "CI/CD pipeline security", "tldr": "Pipelines hold powerful credentials and produce what runs in production. Use OIDC federation instead of stored cloud keys, least-privilege tokens, pinned third-party actions, isolated runners, protected branches and restrictions on running untrusted pull request code with secrets.", "real": "In March 2025 the popular GitHub Action tj-actions/changed-files was compromised so that it printed CI secrets into workflow logs in many repositories, prompting widespread guidance to pin actions to full commit SHAs.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Protecting build and deployment automation |\n| Why it matters | Compromised pipeline = compromised production |\n| Controls | OIDC, minimal permissions, SHA-pinned actions, ephemeral runners |\n| Watch out for | Secrets exposed to pull requests from forks |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PR[Pull request] --> CI[CI without secrets]\n  MERGE[Merge to protected main] --> CD[Deploy job with OIDC]\n  CD --> CLOUD[Short-lived cloud credentials]\n  ACTIONS[Third-party actions pinned to commit SHA] --> CI\n  ACTIONS --> CD\n```\n\n### Worked example\n\n```yaml\npermissions:\n  contents: read\n  id-token: write          # only in the deploy job that needs OIDC\nsteps:\n  - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # pinned to a full commit SHA\n```\n\n(Look up the SHA for the exact release you trust; tools such as Dependabot can keep pinned SHAs updated.)"}, {"id": 108, "title": "Container image security", "tldr": "Build images from minimal, trusted base images, pin versions or digests, run as non-root, exclude secrets, scan for vulnerabilities, sign images and rebuild regularly to pick up patches.", "real": "Minimal base images such as Google’s distroless and Chainguard’s images (2022) contain only runtime dependencies and typically report far fewer known vulnerabilities than general-purpose base images.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Securing container build artifacts |\n| Why it matters | Images carry OS packages and dependencies into production |\n| Practices | Minimal bases, non-root, scanning, signing, regular rebuilds |\n| Watch out for | Images built once and run unpatched for years |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BASE[Minimal pinned base image] --> BUILD[Multi-stage build]\n  BUILD --> SCAN[Vulnerability + misconfiguration scan]\n  SCAN --> SIGN[Sign + SBOM]\n  SIGN --> REG[Registry]\n  REBUILD[Scheduled rebuild for patches] --> BUILD\n```\n\n### Worked example\n\n```dockerfile\nFROM python:3.12-slim AS build\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install --no-cache-dir --prefix=/install -r requirements.txt\n\nFROM python:3.12-slim\nCOPY --from=build /install /usr/local\nCOPY app/ /app/\nRUN useradd --uid 10001 --create-home appuser\nUSER 10001\nCMD [\"python\", \"-m\", \"app\"]\n```\n\n```bash\ntrivy image --severity CRITICAL,HIGH --exit-code 1 registry.example.com/orders-api:1.42.0\n```"}, {"id": 109, "title": "Open-source governance", "tldr": "Organizations need policies for consuming and contributing to open source: approved licenses, security review for new dependencies, vulnerability response, support for critical upstream projects and an inventory of what’s used where.", "real": "The OpenSSF, formed in 2020 under the Linux Foundation, and its Alpha-Omega project fund security improvements in critical open-source projects, following high-profile incidents such as Heartbleed (2014) and Log4Shell (2021).", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Policies for open-source use and contribution |\n| Why it matters | Legal, security and sustainability risks |\n| Elements | License policy, intake review, inventory, upstream support |\n| Watch out for | Critical dependencies maintained by one volunteer |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INTAKE[Dependency intake review] --> INVENTORY[(SBOM inventory)]\n  INVENTORY --> MONITOR[Vulnerability + license monitoring]\n  INVENTORY --> CRITICAL[Identify critical upstream projects]\n  CRITICAL --> SUPPORT[Fund / contribute maintenance]\n```\n\n### Worked example\n\n| License type | Policy example |\n|---|---|\n| MIT, Apache-2.0, BSD | Allowed |\n| LGPL | Allowed with review |\n| GPL / AGPL in distributed products | Legal review required |\n| No license | Not allowed |"}, {"id": 110, "title": "Vulnerability exploitability exchange", "tldr": "Not every vulnerable component is exploitable in your product. VEX documents state whether a product is affected by a vulnerability and why, reducing noise for customers and internal teams when scanners report many component CVEs.", "real": "CISA published VEX guidance and minimum requirements (2022–2023), and formats such as OpenVEX and CycloneDX VEX let vendors communicate “not affected” status with justifications.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Statements of vulnerability applicability |\n| Why it matters | Reduces false-positive remediation work |\n| Statuses | Not affected, affected, fixed, under investigation |\n| Watch out for | Marking “not affected” without evidence |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CVE[CVE in component] --> ANALYZE[Analyze reachability + configuration]\n  ANALYZE --> STATUS{Exploitable in our product?}\n  STATUS -->|no| NA[VEX: not affected + justification]\n  STATUS -->|yes| FIX[Fix + VEX: affected → fixed]\n```\n\n### Worked example\n\n```json\n{\n  \"vulnerability\": {\"name\": \"CVE-2021-44228\"},\n  \"products\": [\"pkg:oci/orders-api@1.42.0\"],\n  \"status\": \"not_affected\",\n  \"justification\": \"vulnerable_code_not_in_execute_path\"\n}\n```"}, {"id": 111, "title": "Cloud shared responsibility", "tldr": "Cloud providers secure the underlying infrastructure; customers secure their identities, data, configurations, network rules and applications. The split shifts depending on whether you use IaaS, PaaS or SaaS.", "real": "Gartner predicted in 2019 that through 2025, 99% of cloud security failures would be the customer’s fault, largely due to misconfiguration rather than provider weaknesses.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Division of security duties |\n| Why it matters | Gaps appear where each side assumes the other is responsible |\n| Customer always owns | Identities, data, access policies, configurations |\n| Watch out for | “It’s in the cloud, so it’s secure” |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  subgraph Customer\n    DATA[Data + classification]\n    IAM[Identity + access]\n    CONF[Configuration + network rules]\n    APP[Application code]\n  end\n  subgraph Provider\n    PHYS[Datacenters + hardware]\n    HV[Virtualization]\n    MANAGED[Managed service internals]\n  end\n```\n\n### Worked example\n\n| Service | Customer responsibilities |\n|---|---|\n| Virtual machine | OS patching, firewall rules, app, data |\n| Managed database | Access control, encryption choices, backups policy, data |\n| Object storage | Bucket policies, public access blocks, encryption, logging |\n| SaaS email | User access, MFA, data retention settings |"}, {"id": 112, "title": "Cloud identity and access management", "tldr": "Cloud IAM is the most important cloud security control. Use SSO for humans, roles for workloads, OIDC federation for CI, least-privilege policies, guardrails across accounts and no long-lived access keys.", "real": "Leaked long-lived cloud access keys in public code repositories are routinely abused within minutes, often for cryptocurrency mining, which is why providers and GitHub scan for and auto-revoke exposed keys.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Access control for cloud APIs and resources |\n| Why it matters | Controls everything in the account |\n| Practices | SSO + MFA, roles, workload identity, least privilege, SCPs |\n| Watch out for | Wildcard policies and access keys for CI |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  HUMAN[Engineer] -->|SSO + MFA| ROLE1[Temporary role session]\n  VM[VM / pod] -->|workload identity| ROLE2[Scoped role]\n  CI[CI pipeline] -->|OIDC| ROLE3[Deploy role]\n  ROLE1 --> CLOUD[Cloud APIs]\n  ROLE2 --> CLOUD\n  ROLE3 --> CLOUD\n```\n\n### Worked example\n\n```json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [{\n    \"Effect\": \"Allow\",\n    \"Action\": [\"s3:GetObject\"],\n    \"Resource\": \"arn:aws:s3:::invoices-prod/*\",\n    \"Condition\": {\"Bool\": {\"aws:SecureTransport\": \"true\"}}\n  }]\n}\n```"}, {"id": 113, "title": "Cloud misconfiguration", "tldr": "The most common cloud security failures are misconfigurations: public storage, open security groups, unencrypted data, overly permissive roles, disabled logging and exposed management interfaces. Prevent them with secure templates, policy-as-code and continuous posture scanning.", "real": "The 2019 Capital One breach combined a misconfigured web application firewall, server-side request forgery and an over-permissive IAM role, leading to the exposure of data on about 100 million people in the US.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Insecure cloud resource settings |\n| Why it matters | Easy for attackers to discover at scale |\n| Prevention | IaC with policy checks, organization guardrails |\n| Detection | CSPM, config rules, alerts on risky changes |\n| Watch out for | Manual console changes bypassing reviews |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  IAC[IaC change] --> POLICY[Policy-as-code check]\n  POLICY -->|fail| BLOCK[Block merge]\n  POLICY -->|pass| APPLY[Apply]\n  APPLY --> CSPM[Posture scanning]\n  CONSOLE[Manual console change] --> CSPM\n  CSPM -->|risky| ALERT[Alert owner + auto-remediate]\n```\n\n### Worked example\n\n| Misconfiguration | Guardrail |\n|---|---|\n| Public bucket | Account-level Block Public Access |\n| SSH open to 0.0.0.0/0 | Policy denies; use Session Manager |\n| Unencrypted volumes | Default encryption enforced |\n| CloudTrail disabled | SCP denies StopLogging |"}, {"id": 114, "title": "Cloud security posture and CNAPP", "tldr": "Cloud security posture management continuously evaluates configurations against best practices; cloud-native application protection platforms combine posture, workload, identity, data and code scanning with attack-path analysis to prioritize real risks.", "real": "Native tools (AWS Security Hub, Microsoft Defender for Cloud, Google Security Command Center) and vendors such as Wiz, Orca and Palo Alto Networks Prisma Cloud became standard as cloud estates grew.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Continuous cloud risk assessment |\n| Why it matters | Cloud environments change constantly |\n| Capabilities | Misconfigurations, vulnerabilities, identities, sensitive data, attack paths |\n| Watch out for | Thousands of findings with no ownership or prioritization |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ACCOUNTS[Cloud accounts] --> SCAN[Posture + workload scanning]\n  SCAN --> GRAPH[Attack path analysis]\n  GRAPH --> PRIO[Prioritized risks]\n  PRIO --> OWNERS[Routed to owning teams with SLAs]\n```\n\n### Worked example\n\n| Finding | Context | Priority |\n|---|---|---|\n| VM with critical CVE | Internet-exposed + role can read customer data | Critical |\n| VM with critical CVE | Internal, no sensitive access | Medium |\n| Unencrypted dev bucket | No sensitive data | Low |"}, {"id": 115, "title": "Kubernetes security", "tldr": "Secure Kubernetes with RBAC least privilege, Pod Security Standards (restricted), network policies, image signing and verification, secrets encryption, audit logging, admission policies and regular upgrades.", "real": "PodSecurityPolicy was removed in Kubernetes 1.25 (2022) and replaced by built-in Pod Security Admission, and the NSA and CISA published a Kubernetes Hardening Guide in 2021 (updated 2022).", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Hardening clusters and workloads |\n| Why it matters | Many workloads share infrastructure and credentials |\n| Controls | RBAC, Pod Security, NetworkPolicy, admission policies, audit logs |\n| Watch out for | Privileged containers and cluster-admin for CI |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DEPLOY[Deployment request] --> ADMISSION[Admission: Pod Security + policies + signature check]\n  ADMISSION -->|allowed| POD[Pod: non-root, read-only FS]\n  POD --> NETPOL[Network policies: default deny]\n  API[API server] --> AUDIT[Audit logs]\n```\n\n### Worked example\n\n```yaml\nsecurityContext:\n  runAsNonRoot: true\n  allowPrivilegeEscalation: false\n  readOnlyRootFilesystem: true\n  capabilities: {drop: [\"ALL\"]}\n  seccompProfile: {type: RuntimeDefault}\n```"}, {"id": 116, "title": "Container runtime security", "tldr": "Runtime security detects suspicious behavior in running containers and hosts: unexpected shells, privilege changes, unusual network connections and file modifications. Combine detection with hardened workloads that make attacks harder.", "real": "Falco, created by Sysdig in 2016 and graduated from the CNCF in 2024, detects suspicious runtime behavior in containers and Kubernetes using kernel events.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Monitoring workloads while they run |\n| Why it matters | Build-time checks can’t catch everything |\n| Signals | Shells in containers, unexpected processes, outbound connections |\n| Watch out for | Noisy default rules nobody tunes |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  KERNEL[Kernel events: syscalls] --> SENSOR[Runtime sensor e.g. Falco]\n  SENSOR --> RULES[Detection rules]\n  RULES --> ALERT[Alert to SIEM]\n  ALERT --> RESPOND[Isolate pod, investigate]\n```\n\n### Worked example\n\n```yaml\n- rule: Shell spawned in container\n  desc: Detect interactive shells inside containers\n  condition: spawned_process and container and proc.name in (bash, sh, zsh)\n  output: \"Shell in container (user=%user.name container=%container.name cmd=%proc.cmdline)\"\n  priority: WARNING\n```"}, {"id": 117, "title": "Secrets management", "tldr": "Store secrets in dedicated managers (cloud secret managers, HashiCorp Vault), fetch them at runtime with workload identity, prefer short-lived dynamic credentials, rotate regularly and audit access. Never commit secrets or bake them into images.", "real": "HashiCorp Vault (2015) popularized dynamic secrets that are generated on demand with short lifetimes, reducing the impact of leaked credentials.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Secure storage and delivery of credentials |\n| Why it matters | Leaked secrets are a top breach cause |\n| Practices | Central vault, runtime retrieval, rotation, audit, scanning |\n| Watch out for | Secrets in environment files committed to Git |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  APP[Application] -->|workload identity| VAULT[Secret manager]\n  VAULT --> SHORT[Short-lived DB credentials]\n  SHORT --> DB[(Database)]\n  VAULT --> AUDIT[Access audit log]\n  ROTATE[Automatic rotation] --> VAULT\n```\n\n### Worked example\n\n| Credential type | Typical lifetime | Risk if leaked |\n|---|---|---|\n| Static API key | Months–years | High |\n| Rotated secret | Weeks | Medium |\n| Dynamic DB credential | Hours | Low |\n| Workload identity token | Minutes | Lowest |"}, {"id": 118, "title": "Cloud logging and threat detection", "tldr": "Enable control-plane audit logs in every account, centralize them in a protected archive, add data-access logs for sensitive resources, enable managed threat detection and alert on high-risk events such as logging changes and new admin grants.", "real": "Amazon GuardDuty (2017), Microsoft Defender for Cloud and Google Security Command Center analyze cloud audit, network and DNS logs to detect threats such as credential misuse and cryptocurrency mining.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Visibility and detection in cloud accounts |\n| Why it matters | Investigations depend on logs that exist before the incident |\n| Sources | Audit logs, flow logs, DNS logs, data access logs |\n| Watch out for | Logs stored where attackers can delete them |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ACC[All accounts] --> TRAIL[Org-wide audit trail]\n  TRAIL --> ARCHIVE[(Immutable log archive account)]\n  TRAIL --> DETECT[Managed threat detection]\n  DETECT --> SIEM[SIEM + alerting]\n  SIEM --> RESP[Responders]\n```\n\n### Worked example\n\n| Event | Why alert |\n|---|---|\n| Root / global admin sign-in | Should be rare |\n| Audit logging disabled | Attacker covering tracks |\n| Policy granting admin rights | Privilege escalation |\n| Storage made public | Data exposure |\n| New access keys for a user | Persistence |"}, {"id": 119, "title": "Serverless security", "tldr": "Serverless shifts infrastructure security to the provider but leaves code, dependencies, permissions, event inputs and configuration to you. Give each function minimal permissions, validate event data, manage secrets properly and monitor invocations.", "real": "The OWASP Serverless Top 10 project highlighted risks such as event injection, over-privileged function permissions and insecure secrets storage specific to function-as-a-service architectures.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Securing function-based applications |\n| Why it matters | Many small functions multiply permission and input surfaces |\n| Controls | Per-function roles, input validation, secret managers, concurrency limits |\n| Watch out for | One shared admin role for all functions |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EVENT[Events: API, queue, storage] --> FN1[Function A: role A]\n  EVENT --> FN2[Function B: role B]\n  FN1 --> RES1[Only table X]\n  FN2 --> RES2[Only bucket Y]\n  FN1 --> LOGS[Logs + traces]\n  FN2 --> LOGS\n```\n\n### Worked example\n\n| Function | Allowed permissions |\n|---|---|\n| resize-image | Read uploads bucket, write thumbnails bucket |\n| send-receipt | Send email via provider, read orders table |\n| nightly-report | Read analytics DB replica |"}, {"id": 120, "title": "Cloud incident response", "tldr": "Prepare for cloud incidents with runbooks for compromised credentials, exposed storage and compromised workloads; pre-provisioned forensic roles; snapshot and isolation procedures; log retention; and practiced communication.", "real": "AWS, Azure and Google Cloud publish incident response guides, and common first steps include revoking compromised credentials, isolating resources with restrictive security groups and snapshotting disks for forensic analysis.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Responding to security incidents in cloud environments |\n| Why it matters | Cloud attacks move fast via APIs |\n| Preparation | Runbooks, forensic access, retained logs, contacts |\n| Watch out for | Terminating instances and destroying evidence |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ALERT[Alert: leaked access key used] --> REVOKE[Disable key + revoke sessions]\n  REVOKE --> SCOPE[Review audit logs for actions taken]\n  SCOPE --> CONTAIN[Remove persistence: new users, roles, keys]\n  CONTAIN --> RECOVER[Restore + harden]\n  RECOVER --> LESSONS[Postmortem: why a long-lived key existed]\n```\n\n### Worked example\n\n| Scenario | First three steps |\n|---|---|\n| Leaked access key | Disable key; review CloudTrail for its activity; look for new IAM entities |\n| Compromised VM | Isolate with restrictive security group; snapshot disk; rotate role credentials |\n| Public bucket with PII | Block public access; check access logs; assess notification duties |"}, {"id": 121, "title": "Endpoint protection and EDR", "tldr": "Endpoint detection and response (EDR) tools monitor laptops and servers for malicious behavior, block known threats, and let responders investigate and isolate devices remotely. Combine EDR with hardening, patching and least privilege.", "real": "The July 2024 CrowdStrike incident, in which a faulty sensor content update crashed about 8.5 million Windows devices, showed both how widely EDR is deployed and why staged rollouts matter even for security tools.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Behavioral monitoring and response on devices |\n| Why it matters | Endpoints are where many attacks begin |\n| Capabilities | Detection, blocking, isolation, investigation, telemetry |\n| Watch out for | Gaps in coverage (servers, contractors, Linux hosts) |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DEVICE[Endpoint] --> AGENT[EDR agent]\n  AGENT --> CLOUD[EDR console: detections]\n  CLOUD --> ANALYST[Analyst]\n  ANALYST -->|isolate| DEVICE\n  CLOUD --> SIEM[SIEM]\n```\n\n### Worked example\n\n| Coverage metric | Target |\n|---|---|\n| Managed endpoints with EDR | 100% |\n| Agents reporting in last 24 h | ≥ 99% |\n| Servers (Windows + Linux) covered | 100% |\n| Time to isolate a confirmed compromised device | < 15 minutes |"}, {"id": 122, "title": "Patch management", "tldr": "Unpatched software is one of the most exploited weaknesses. Maintain an inventory, prioritize patches by exploitation and exposure, test and deploy in rings, and track patch compliance against SLAs.", "real": "WannaCry (May 2017) spread using a Windows SMB vulnerability that Microsoft had patched in March 2017 (MS17-010), affecting organizations that hadn’t applied the update.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Keeping software updated with security fixes |\n| Why it matters | Known vulnerabilities are exploited at scale |\n| Process | Inventory → prioritize → test → deploy in rings → verify |\n| Watch out for | Internet-facing appliances excluded from patch processes |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  RELEASE[Vendor patch] --> PRIO[Prioritize: KEV, exposure, severity]\n  PRIO --> RING0[Ring 0: IT test devices]\n  RING0 --> RING1[Ring 1: pilot group]\n  RING1 --> RING2[Ring 2: everyone]\n  RING2 --> VERIFY[Compliance report]\n```\n\n### Worked example\n\n| Patch type | SLA |\n|---|---|\n| Actively exploited, internet-facing | 48 hours |\n| Critical | 7–14 days |\n| High | 30 days |\n| Medium/low | Next monthly cycle |"}, {"id": 123, "title": "System hardening", "tldr": "Hardening reduces attack surface: remove unnecessary software and services, disable default accounts, enforce secure configurations, restrict admin rights and apply benchmarks such as CIS. Automate hardening through images and configuration management.", "real": "The Center for Internet Security publishes free CIS Benchmarks for operating systems, cloud platforms, databases and applications, widely used as configuration baselines.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Secure configuration baselines |\n| Why it matters | Defaults are often permissive |\n| Sources | CIS Benchmarks, vendor guides, DISA STIGs |\n| Watch out for | Hardening done manually and drifting over time |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BENCH[CIS Benchmark] --> IMAGE[Hardened golden image]\n  IMAGE --> DEPLOY[Deploy instances]\n  DEPLOY --> SCAN[Compliance scan]\n  SCAN -->|drift| FIX[Remediate via automation]\n```\n\n### Worked example\n\n| Hardening item | Example setting |\n|---|---|\n| SSH | PasswordAuthentication no; PermitRootLogin no |\n| Services | Disable unused services (e.g. telnet, FTP) |\n| Accounts | Remove default accounts; unique admin credentials |\n| Logging | Forward auth and audit logs centrally |"}, {"id": 124, "title": "Vulnerability management programs", "tldr": "Vulnerability management is a continuous cycle: discover assets, scan for vulnerabilities, prioritize by risk, remediate within SLAs, verify fixes and report trends. Coverage and prioritization matter more than raw finding counts.", "real": "CISA’s Binding Operational Directive 22-01 (2021) required US federal agencies to remediate vulnerabilities in the Known Exploited Vulnerabilities catalog within set deadlines, popularizing KEV-based prioritization.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Ongoing process to find and fix vulnerabilities |\n| Why it matters | Systematic reduction of exploitable weaknesses |\n| Inputs | Asset inventory, scanners, KEV, EPSS, threat intel |\n| Watch out for | Scanning only known assets |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DISCOVER[Discover assets] --> SCAN[Scan]\n  SCAN --> PRIORITIZE[Prioritize by risk]\n  PRIORITIZE --> REMEDIATE[Remediate]\n  REMEDIATE --> VERIFY[Verify]\n  VERIFY --> REPORT[Report trends]\n  REPORT --> DISCOVER\n```\n\n### Worked example\n\n| Metric | Value |\n|---|---|\n| Assets scanned / assets known | 96% |\n| KEV vulnerabilities open | 3 (all within SLA) |\n| Median time to remediate critical | 9 days |\n| Vulnerabilities reopened after fix | 4% |"}, {"id": 125, "title": "Asset inventory", "tldr": "You can only protect what you know exists. Maintain an inventory of devices, servers, cloud resources, applications, domains, APIs and SaaS accounts with owners and criticality, fed automatically from many sources.", "real": "The first CIS Control (Inventory and Control of Enterprise Assets) and NIST CSF’s Identify function both start with asset inventory, because unknown assets go unpatched and unmonitored.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Complete list of technology assets |\n| Why it matters | Foundation for every other control |\n| Sources | Cloud APIs, EDR, MDM, DNS, CMDB, network scans of owned ranges |\n| Watch out for | Shadow IT and forgotten internet-facing systems |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CLOUD[Cloud APIs] --> INV[(Asset inventory)]\n  EDR[EDR / MDM] --> INV\n  DNS[DNS + certificate transparency] --> INV\n  SAAS[SSO app catalog] --> INV\n  INV --> OWNER[Owner + criticality]\n  OWNER --> CONTROLS[Patching, monitoring, backups]\n```\n\n### Worked example\n\n| Asset | Owner | Criticality | EDR | Backup |\n|---|---|---|---|---|\n| payments-api (K8s) | Payments team | Critical | n/a (runtime sensor) | DB PITR |\n| hr-laptop-0412 | IT | Medium | Yes | Cloud sync |\n| old-campaign.example.com | Unknown | Unknown | — | Investigate |"}, {"id": 126, "title": "Logging and SIEM", "tldr": "Centralize security-relevant logs (authentication, endpoint, network, cloud, application) in a SIEM or security data lake, normalize them, retain them long enough for investigations and build detections on top.", "real": "Mandiant’s M-Trends reports have shown global median attacker dwell time falling from over a year in 2011 to around 10 days in recent years, partly due to better logging and detection.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Central collection and analysis of security logs |\n| Why it matters | Detection and investigation depend on it |\n| Key sources | Identity provider, EDR, cloud audit, firewall/DNS, apps |\n| Watch out for | Retention shorter than typical detection time |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  IDP[Identity logs] --> PIPE[Collection pipeline]\n  EDR2[Endpoint telemetry] --> PIPE\n  CLOUD2[Cloud audit logs] --> PIPE\n  APPLOGS[Application security events] --> PIPE\n  PIPE --> SIEM[(SIEM / data lake)]\n  SIEM --> DETECTIONS[Detections + dashboards]\n```\n\n### Worked example\n\n| Log source | Retention (hot / archive) |\n|---|---|\n| Identity provider sign-ins | 90 days / 1 year |\n| Cloud audit logs | 90 days / 1–7 years |\n| EDR telemetry | 30 days / 90 days |\n| Application auth events | 90 days / 1 year |"}, {"id": 127, "title": "Directory and identity infrastructure security", "tldr": "Directories such as Active Directory and Entra ID are high-value targets because they control access to everything. Use tiered administration, separate admin accounts, unique local admin passwords, monitoring of privileged changes and regular attack-path reviews.", "real": "Microsoft’s guidance on securing privileged access recommends separating administrative tiers and using dedicated privileged access workstations, and Windows LAPS (built into Windows from 2023) randomizes local administrator passwords per device.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Protecting identity infrastructure |\n| Why it matters | Directory compromise = organization-wide compromise |\n| Controls | Admin tiering, separate admin accounts, LAPS, monitoring, MFA |\n| Watch out for | Same local admin password on every machine |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  T0[Tier 0: domain controllers, identity admins] --> PAW[Privileged access workstations only]\n  T1[Tier 1: servers] --> SRVADMIN[Server admin accounts]\n  T2[Tier 2: workstations] --> HELPDESK[Helpdesk accounts]\n  T0 -.never log into lower tiers.-> T2\n```\n\n### Worked example\n\n| Control | Effect |\n|---|---|\n| Separate admin account per person | Daily browsing account can’t administer |\n| LAPS for local admin passwords | Prevents password reuse across machines |\n| Alert on privileged group changes | Detects escalation |\n| No domain admin logons to workstations | Limits credential exposure |"}, {"id": 128, "title": "Linux server security", "tldr": "Secure Linux servers with minimal installs, key-based or centralized SSH access (or none, via managed access tools), automatic security updates, least-privilege sudo, host firewalls, mandatory access control (SELinux/AppArmor) and central logging.", "real": "Cloud providers’ managed access tools, such as AWS Systems Manager Session Manager (2018) and Google Cloud IAP, let administrators reach servers without opening SSH ports, with access logged centrally.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Hardening Linux hosts |\n| Why it matters | Most cloud servers and containers run Linux |\n| Controls | Patching, SSH hardening, sudo policy, MAC, logging |\n| Watch out for | Password SSH open to the internet |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ADMIN[Admin] -->|IAM + MFA| SSM[Managed access: no inbound SSH]\n  SSM --> HOST[Linux host]\n  HOST --> UPDATES[Automatic security updates]\n  HOST --> MAC[SELinux / AppArmor enforcing]\n  HOST --> LOGS[Auth + audit logs to SIEM]\n```\n\n### Worked example\n\n```text\n# /etc/ssh/sshd_config (if SSH is needed)\nPasswordAuthentication no\nPermitRootLogin no\nKbdInteractiveAuthentication no\nAllowGroups ssh-admins\n```"}, {"id": 129, "title": "Backups and ransomware resilience", "tldr": "Ransomware resilience depends on backups attackers can’t delete: offline or immutable copies, separate credentials, regular restore tests and documented recovery priorities. Follow the 3-2-1 rule with at least one immutable copy.", "real": "The 2021 Colonial Pipeline ransomware attack led the company to shut down pipeline operations for several days and pay a ransom of about $4.4 million, part of which the US Department of Justice later recovered.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Ensuring recovery without paying ransoms |\n| Why it matters | Attackers target backups first |\n| Rule | 3 copies, 2 media, 1 offsite, plus immutability and tested restores |\n| Watch out for | Backups reachable with the same admin credentials as production |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PROD[(Production data)] --> BACKUP[Backup system: separate credentials]\n  BACKUP --> COPY1[Local copy]\n  BACKUP --> COPY2[Immutable cloud copy: object lock]\n  BACKUP --> COPY3[Offline / air-gapped copy]\n  TEST[Quarterly restore test] --> COPY2\n```\n\n### Worked example\n\n| System | RPO | RTO | Restore tested |\n|---|---|---|---|\n| Payments DB | 5 min | 2 h | Monthly |\n| File servers | 24 h | 24 h | Quarterly |\n| Active Directory | 24 h | 8 h | Quarterly (isolated) |"}, {"id": 130, "title": "Mobile device and SaaS security", "tldr": "Manage mobile devices with MDM (encryption, screen lock, OS updates, remote wipe) and secure SaaS applications with SSO, MFA, least-privilege admin roles, sharing controls and audit logs. SaaS sprawl creates unmanaged data stores.", "real": "The 2024 attacks on Snowflake customer accounts used credentials stolen by infostealer malware on accounts without MFA, showing how SaaS identity controls directly affect data security.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Securing devices and cloud applications employees use |\n| Why it matters | Data lives in phones and SaaS apps |\n| Controls | MDM, SSO + MFA, SaaS posture management, sharing policies |\n| Watch out for | SaaS apps with local passwords outside SSO |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  USER[Employee] --> DEVICE[Managed device: MDM]\n  DEVICE --> SSO[SSO + MFA]\n  SSO --> SAAS1[Email]\n  SSO --> SAAS2[CRM]\n  SSO --> SAAS3[Data warehouse]\n  SSPM[SaaS posture monitoring] -.-> SAAS1\n  SSPM -.-> SAAS2\n  SSPM -.-> SAAS3\n```\n\n### Worked example\n\n| SaaS control | Setting |\n|---|---|\n| Authentication | SSO only, MFA enforced, local logins disabled |\n| Admin roles | Minimal admins, reviewed quarterly |\n| External sharing | Restricted to approved domains |\n| Audit logs | Exported to SIEM |"}, {"id": 131, "title": "The security operations center", "tldr": "A SOC monitors security telemetry, triages alerts, investigates incidents and coordinates response, around the clock where needed. Effective SOCs focus on high-quality detections, clear playbooks and automation to avoid alert fatigue.", "real": "Many organizations combine in-house teams with managed detection and response (MDR) providers, because staffing a 24/7 SOC requires multiple analysts per shift across time zones.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Team and processes for detection and response |\n| Why it matters | Prevention eventually fails |\n| Functions | Monitoring, triage, investigation, response, improvement |\n| Watch out for | Thousands of low-quality alerts per day |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TELEMETRY[Logs + telemetry] --> DETECT[Detections]\n  DETECT --> TRIAGE[Tier 1 triage]\n  TRIAGE -->|benign| CLOSE[Close + tune]\n  TRIAGE -->|suspicious| INVESTIGATE[Tier 2 investigation]\n  INVESTIGATE --> INCIDENT[Incident response]\n  CLOSE --> TUNE[Detection engineering]\n```\n\n### Worked example\n\n| SOC metric | Target |\n|---|---|\n| Alerts per analyst per shift | Manageable (tens, not hundreds) |\n| True positive rate of top detections | Tracked and improving |\n| Mean time to triage critical alerts | < 15 minutes |\n| Detections with playbooks | 100% of high severity |"}, {"id": 132, "title": "Detection engineering", "tldr": "Detection engineering treats detections as code: written in standard formats, version-controlled, tested against sample data, mapped to attacker techniques, tuned for false positives and measured for coverage and quality.", "real": "The Sigma project (started in 2017) provides a generic, open signature format for log-based detections that can be converted to many SIEM query languages.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Building and maintaining detection rules systematically |\n| Why it matters | Detection quality drives SOC effectiveness |\n| Practices | Detections as code, testing, ATT&CK mapping, tuning |\n| Watch out for | Rules written once and never validated |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  HYP[Hypothesis: attacker behavior] --> RULE[Write rule as code]\n  RULE --> TEST[Test against sample logs]\n  TEST --> DEPLOY[Deploy to SIEM]\n  DEPLOY --> MEASURE[Measure true/false positives]\n  MEASURE --> TUNE[Tune]\n  TUNE --> RULE\n```\n\n### Worked example\n\n```yaml\ntitle: Many failed logins followed by success for the same user\nstatus: experimental\nlogsource:\n  product: okta\n  service: okta\ndetection:\n  failures:\n    eventType: user.session.start\n    outcome.result: FAILURE\n  success:\n    eventType: user.session.start\n    outcome.result: SUCCESS\n  condition: failures and success\nlevel: medium\n```\n\n(Simplified illustration; production rules correlate counts within a time window per user, typically in the SIEM’s correlation language.)"}, {"id": 133, "title": "MITRE ATT&CK", "tldr": "MITRE ATT&CK is a knowledge base of adversary tactics (goals) and techniques (methods) observed in real attacks. Defenders use it to map detection coverage, plan threat-informed defenses and communicate about attacker behavior.", "real": "MITRE began developing ATT&CK internally in 2013 and released it publicly in 2015; it is now widely used by security vendors, SOCs and threat intelligence teams.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Framework of attacker tactics and techniques |\n| Why it matters | Common language; coverage gap analysis |\n| Uses | Detection mapping, red/purple team planning, threat intel |\n| Watch out for | Chasing 100% coverage instead of prioritizing likely techniques |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  IA[Initial access] --> EX[Execution]\n  EX --> PERS[Persistence]\n  PERS --> PRIV[Privilege escalation]\n  PRIV --> CRED[Credential access]\n  CRED --> LAT[Lateral movement]\n  LAT --> COLL[Collection]\n  COLL --> EXF[Exfiltration]\n  EXF --> IMP[Impact]\n```\n\n### Worked example\n\n| Tactic | Example detection |\n|---|---|\n| Initial access | Phishing link clicks from email security logs |\n| Credential access | Unusual access to credential stores |\n| Lateral movement | New admin logons between servers |\n| Exfiltration | Large uploads to unusual destinations |\n| Impact | Mass file modifications (ransomware behavior) |"}, {"id": 134, "title": "Threat intelligence", "tldr": "Threat intelligence provides context about adversaries, their techniques and indicators. Strategic intelligence informs priorities; operational and tactical intelligence informs detections and hunts. Use it to focus on threats relevant to your organization.", "real": "Government advisories from CISA, the UK NCSC and India’s CERT-In, along with industry sharing groups (ISACs), regularly publish intelligence about active threats and exploited vulnerabilities.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Information about threats, actors and techniques |\n| Why it matters | Focuses defenses on real, relevant threats |\n| Levels | Strategic, operational, tactical (indicators) |\n| Watch out for | Ingesting millions of stale indicators without context |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SOURCES[Advisories, ISACs, vendors, own incidents] --> ANALYZE[Analyze relevance]\n  ANALYZE --> PRIORITIES[Security priorities]\n  ANALYZE --> DETECTIONS[New detections + hunts]\n  ANALYZE --> PATCH[Patch prioritization]\n```\n\n### Worked example\n\n| Intelligence item | Action |\n|---|---|\n| Advisory: VPN product exploited in the wild | Emergency patch + hunt for compromise indicators |\n| Sector report: ransomware targeting hospitals | Test backups, review remote access |\n| New phishing technique | Update email filtering + user awareness |"}, {"id": 135, "title": "Incident response lifecycle", "tldr": "Incident response follows a lifecycle: preparation, detection and analysis, containment, eradication, recovery and post-incident activity. Clear roles, communication plans and practiced playbooks determine how well it goes.", "real": "NIST released SP 800-61 Revision 3 in April 2025, aligning incident response guidance with the Cybersecurity Framework 2.0 and treating response as part of overall risk management.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structured handling of security incidents |\n| Why it matters | Limits damage and speeds recovery |\n| Roles | Incident lead, technical leads, communications, legal, executives |\n| Watch out for | Improvising during the first major incident |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PREP[Prepare] --> DETECT[Detect + analyze]\n  DETECT --> CONTAIN[Contain]\n  CONTAIN --> ERAD[Eradicate]\n  ERAD --> RECOVER[Recover]\n  RECOVER --> LESSONS[Lessons learned]\n  LESSONS --> PREP\n```\n\n### Worked example\n\n| Phase | Ransomware example |\n|---|---|\n| Detect | EDR alert: mass file encryption on file server |\n| Contain | Isolate affected hosts, disable compromised accounts |\n| Eradicate | Remove persistence, reset credentials |\n| Recover | Restore from immutable backups, monitor closely |\n| Lessons | Close initial access path, improve detection |"}, {"id": 136, "title": "Digital forensics basics", "tldr": "Forensics preserves and analyzes evidence to understand what happened: volatile data (memory, connections), disk images, logs and cloud audit trails. Preserve evidence before making changes and maintain chain of custody.", "real": "Incident response firms and guides emphasize collecting volatile evidence such as memory before rebooting systems, because restarts destroy information about running processes and network connections.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Evidence collection and analysis |\n| Why it matters | Determines scope, root cause and legal options |\n| Order of volatility | Memory → network state → disk → logs → backups |\n| Watch out for | Reimaging systems before collecting evidence |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ISOLATE[Isolate host from network] --> MEMORY[Capture memory]\n  MEMORY --> DISK[Image disk / snapshot]\n  DISK --> LOGS[Collect logs]\n  LOGS --> HASH[Hash evidence + chain of custody]\n  HASH --> ANALYZE[Analyze copies, not originals]\n```\n\n### Worked example\n\n| Evidence | Cloud equivalent |\n|---|---|\n| Disk image | Volume snapshot |\n| Network capture | VPC flow logs / traffic mirroring |\n| System logs | Central log archive |\n| Admin actions | Cloud audit trail |"}, {"id": 137, "title": "Threat hunting", "tldr": "Threat hunting proactively searches for attackers who evaded detections, starting from hypotheses based on threat intelligence and attacker techniques. Successful hunts become new automated detections.", "real": "Hunting programs commonly follow hypothesis-driven approaches, such as searching for unusual remote administration tool usage after advisories about attackers using legitimate tools to blend in.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Proactive search for undetected threats |\n| Why it matters | Detections never cover everything |\n| Method | Hypothesis → data → analysis → findings → new detections |\n| Watch out for | Hunts without documented hypotheses or outcomes |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  HYP[Hypothesis] --> DATA[Query telemetry]\n  DATA --> ANALYZE[Analyze anomalies]\n  ANALYZE -->|found| IR[Incident response]\n  ANALYZE -->|pattern| DETECT[New detection rule]\n  ANALYZE -->|nothing| DOC[Document coverage]\n```\n\n### Worked example\n\n| Hypothesis | Data source |\n|---|---|\n| Attackers use remote management tools not approved by IT | EDR process inventory |\n| Compromised accounts log in from new countries at night | Identity provider logs |\n| Data staged in unusual archive files before exfiltration | EDR file events |"}, {"id": 138, "title": "Security automation and SOAR", "tldr": "Security orchestration, automation and response (SOAR) automates repetitive steps: enriching alerts, querying threat intel, disabling accounts, isolating hosts and opening tickets. Automate well-understood actions; keep humans for judgment.", "real": "SOC teams commonly automate phishing triage, where reported emails are analyzed, similar messages are found and removed from mailboxes, and users are notified, saving significant analyst time.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Automated security workflows |\n| Why it matters | Speed and consistency; frees analysts |\n| Good candidates | Enrichment, phishing triage, account disable, host isolation |\n| Watch out for | Automated actions on low-confidence signals |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REPORT[User reports phishing] --> ENRICH[Extract URLs, check reputation]\n  ENRICH --> VERDICT{Malicious?}\n  VERDICT -->|yes| PURGE[Remove similar emails from all mailboxes]\n  PURGE --> BLOCK[Block sender + URLs]\n  VERDICT -->|unsure| ANALYST[Analyst review]\n  VERDICT -->|no| THANK[Thank user]\n```\n\n### Worked example\n\n| Manual step | Time saved by automation |\n|---|---|\n| Look up URL reputation | 3 min → seconds |\n| Search all mailboxes for same email | 10 min → seconds |\n| Open ticket with evidence | 5 min → automatic |"}, {"id": 139, "title": "Security metrics for operations", "tldr": "Measure detection and response with mean time to detect (MTTD), mean time to respond/contain (MTTR), detection coverage of priority techniques, false positive rates and incident trends. Use metrics to improve, not to punish.", "real": "Mandiant’s M-Trends reports track median dwell time (time from intrusion to detection) globally, which has fallen substantially over the past decade, providing an external benchmark.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Quantifying detection and response performance |\n| Why it matters | Shows improvement and gaps |\n| Metrics | MTTD, MTTR, coverage, false positive rate |\n| Watch out for | Gaming metrics by closing alerts quickly without investigation |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INTRUSION[Intrusion] -->|MTTD| DETECTED[Detected]\n  DETECTED -->|time to contain| CONTAINED[Contained]\n  CONTAINED -->|time to recover| RECOVERED[Recovered]\n```\n\n### Worked example\n\n| Metric | Last year | This year |\n|---|---|---|\n| Median time to detect | 6 days | 1.5 days |\n| Median time to contain | 9 hours | 2 hours |\n| Priority ATT&CK techniques with detections | 45% | 72% |\n| False positive rate (top 20 rules) | 68% | 31% |"}, {"id": 140, "title": "Tabletop exercises", "tldr": "Tabletop exercises walk leaders and responders through realistic incident scenarios to test plans, decisions, communication and roles without touching production systems. They reveal gaps cheaply before real incidents do.", "real": "CISA publishes free Tabletop Exercise Packages (CTEPs) covering scenarios such as ransomware and insider threats, used by organizations to practice incident response.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Discussion-based incident simulations |\n| Why it matters | Practice decisions under pressure |\n| Participants | Executives, IT, security, legal, communications |\n| Watch out for | Exercises without follow-up actions |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SCENARIO[Scenario: ransomware Friday night] --> INJECTS[Timed injects]\n  INJECTS --> DECISIONS[Team decisions]\n  DECISIONS --> GAPS[Gaps identified]\n  GAPS --> ACTIONS[Action items with owners]\n```\n\n### Worked example\n\n| Inject | Question |\n|---|---|\n| File servers encrypted at 23:00 | Who declares an incident? Who is called? |\n| Attackers claim data theft | Legal and regulatory notification obligations? |\n| Backups partially affected | Recovery priorities? |\n| Media inquiry | Who speaks; what do we say? |"}, {"id": 141, "title": "Phishing and social engineering", "tldr": "Social engineering manipulates people into revealing credentials, approving access or making payments. Phishing arrives by email, SMS, phone and chat. Defend with phishing-resistant MFA, email authentication and filtering, easy reporting, verification procedures and training.", "real": "Verizon’s Data Breach Investigations Reports consistently find the human element, including phishing, stolen credentials and errors, involved in a majority of breaches.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Attacks that exploit human trust |\n| Why it matters | Bypasses many technical controls |\n| Defenses | Passkeys, DMARC, filtering, report button, verification processes |\n| Watch out for | Blaming users instead of designing resilient processes |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LURE[Phishing message] --> FILTER[Email filtering]\n  FILTER -->|delivered| USER[User]\n  USER -->|reports| SOC[SOC auto-triage]\n  USER -->|enters password on fake site| MFA[Phishing-resistant MFA blocks login]\n  SOC --> PURGE[Remove similar messages org-wide]\n```\n\n### Worked example\n\n| Phishing signal | Example |\n|---|---|\n| Urgency | “Your account will be closed in 2 hours” |\n| Lookalike sender | support@examp1e-billing.com |\n| Unusual request | Gift cards, bank detail changes |\n| Mismatched link | Displayed text differs from actual URL |"}, {"id": 142, "title": "Ransomware", "tldr": "Ransomware groups gain access, escalate privileges, steal data, destroy backups and encrypt systems, then extort victims. Resilience requires strong identity security, patching, EDR, segmentation, immutable backups and practiced recovery.", "real": "The May 2021 Colonial Pipeline attack led to a multi-day shutdown of a major US fuel pipeline, and ransomware attacks on healthcare, such as the February 2024 Change Healthcare incident, disrupted claims processing across the US health system.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Extortion through encryption and data theft |\n| Why it matters | Operational shutdowns and large losses |\n| Defenses | MFA, patching, EDR, segmentation, immutable backups, IR plans |\n| Watch out for | Backups accessible with domain admin credentials |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ACCESS[Initial access: phishing, VPN flaw, stolen creds] --> ESCALATE[Privilege escalation]\n  ESCALATE --> SPREAD[Lateral movement]\n  SPREAD --> STEAL[Data theft]\n  STEAL --> ENCRYPT[Encryption + backup deletion]\n  ENCRYPT --> EXTORT[Extortion]\n  D1[MFA + patching] -.blocks.-> ACCESS\n  D2[EDR + segmentation] -.blocks.-> SPREAD\n  D3[Immutable backups] -.enables recovery from.-> ENCRYPT\n```\n\n### Worked example\n\n| Control | Ransomware stage disrupted |\n|---|---|\n| Phishing-resistant MFA, patched VPN | Initial access |\n| Tiered admin, LAPS | Privilege escalation |\n| EDR with isolation | Lateral movement |\n| Egress monitoring | Data theft |\n| Immutable, tested backups | Encryption impact |"}, {"id": 143, "title": "Business email compromise", "tldr": "BEC uses compromised or spoofed email accounts to trick staff into paying fake invoices, changing bank details or sending sensitive data. Defenses are mostly process: out-of-band verification of payment changes, dual approval and email authentication.", "real": "The FBI’s IC3 2024 report recorded about $2.8 billion in reported business email compromise losses that year, making it one of the costliest cybercrime categories.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Fraud through trusted email channels |\n| Why it matters | Large direct financial losses |\n| Defenses | Callback verification, dual approval, DMARC, MFA on mailboxes |\n| Watch out for | Bank detail changes accepted by email alone |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EMAIL[Email: please update our bank details] --> FINANCE[Finance team]\n  FINANCE --> CALL[Call vendor on number from existing records]\n  CALL -->|confirmed| APPROVE[Second approver]\n  CALL -->|not confirmed| REPORT[Report to security]\n  APPROVE --> UPDATE[Update details]\n```\n\n### Worked example\n\n| Process control | Prevents |\n|---|---|\n| Callback to known phone number | Fake vendor bank changes |\n| Dual approval above threshold | Single-person fraud |\n| External sender banner | Spoofed executive emails |\n| MFA on all mailboxes | Account takeover |"}, {"id": 144, "title": "Advanced persistent threats", "tldr": "APTs, often state-sponsored, pursue long-term access for espionage or disruption, using stealthy techniques, custom tools and legitimate administrative tools. Defend with strong identity security, monitoring, threat intelligence and assume-breach thinking.", "real": "Government advisories in 2023–2024 described a state-sponsored group known as Volt Typhoon pre-positioning in US critical infrastructure networks using “living off the land” techniques that blend into normal administration.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Well-resourced, persistent adversaries |\n| Why it matters | Long dwell times, high-value targets |\n| Defenses | Identity hardening, behavioral detection, logging, threat intel, hunting |\n| Watch out for | Relying on malware signatures against tool-less techniques |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  RECON[Reconnaissance] --> ACCESS[Access via edge device or credentials]\n  ACCESS --> BLEND[Use legitimate admin tools]\n  BLEND --> PERSIST[Long-term persistence]\n  PERSIST --> OBJECTIVE[Espionage / pre-positioning]\n  DETECT[Behavioral detection + hunting] -.-> BLEND\n```\n\n### Worked example\n\n| Defensive focus | Why it helps against APTs |\n|---|---|\n| Patch and monitor edge devices | Common entry point |\n| Baseline admin tool usage | Detect unusual legitimate-tool activity |\n| Long log retention | Investigations over months |\n| Threat hunting | Finds stealthy activity |"}, {"id": 145, "title": "Insider threats", "tldr": "Insiders, whether malicious, negligent or compromised, already have legitimate access. Reduce risk with least privilege, separation of duties, monitoring of sensitive data access, offboarding discipline and a supportive culture for reporting concerns.", "real": "In 2023 Tesla reported that two former employees leaked personal information of over 75,000 people to a media outlet, an example of insider data exposure.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Risks from people with authorized access |\n| Why it matters | Insiders bypass perimeter controls |\n| Controls | Least privilege, separation of duties, DLP, access monitoring, offboarding |\n| Watch out for | Excessive monitoring damaging trust and privacy |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ACCESS[Least-privilege access] --> MONITOR[Monitor sensitive data access]\n  MONITOR --> ANOMALY{Unusual volume or pattern?}\n  ANOMALY -->|yes| REVIEW[Review by security + HR + legal]\n  OFFBOARD[Timely offboarding] --> ACCESS\n```\n\n### Worked example\n\n| Signal | Example |\n|---|---|\n| Bulk download | Exporting the whole customer list before resignation |\n| Unusual access | Engineer reading HR records |\n| Policy bypass | Uploading company files to personal cloud storage |"}, {"id": 146, "title": "Zero-day and n-day vulnerabilities", "tldr": "Zero-days are vulnerabilities exploited before a fix is available; n-days are known, patched vulnerabilities that remain exploitable where patches aren’t applied. Most real-world exploitation involves n-days, so fast patching matters; defense in depth limits zero-day impact.", "real": "Google’s Threat Analysis Group and Mandiant tracked dozens of exploited zero-days per year in 2023 and 2024, with growing focus on enterprise security and networking products.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Unpatched vs patched-but-not-applied vulnerabilities |\n| Why it matters | Determines patching urgency and layered defense needs |\n| Defenses | Rapid patching, attack surface reduction, EDR, segmentation, monitoring |\n| Watch out for | Months-long patch cycles for internet-facing systems |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DISCOVER[Vulnerability discovered] --> ZERODAY[Zero-day window: no patch]\n  ZERODAY --> PATCH[Patch released]\n  PATCH --> NDAY[N-day window: patch not yet applied]\n  NDAY --> APPLIED[Patched]\n  LAYERS[Defense in depth] -.limits.-> ZERODAY\n  FASTPATCH[Fast patching] -.shortens.-> NDAY\n```\n\n### Worked example\n\n| Situation | Response |\n|---|---|\n| Zero-day in internet-facing appliance, no patch | Apply vendor mitigations, restrict exposure, hunt for compromise |\n| Patch released, exploitation reported (KEV) | Emergency patch within 48 hours |\n| Patch released, no exploitation | Standard SLA |"}, {"id": 147, "title": "Credential theft and infostealers", "tldr": "Infostealer malware harvests saved passwords, browser cookies and session tokens from infected devices, which are sold and used to access corporate systems, sometimes bypassing MFA via stolen sessions. Defend with managed devices, phishing-resistant MFA, short sessions and token binding.", "real": "Mandiant reported in 2024 that attackers accessed about 165 Snowflake customer environments using credentials stolen by infostealer malware, mostly on accounts without MFA.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Malware stealing credentials and sessions |\n| Why it matters | Stolen sessions can bypass passwords and MFA |\n| Defenses | EDR, managed devices only, MFA, short sessions, credential monitoring |\n| Watch out for | Corporate logins from personal, unmanaged devices |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INFECT[Unmanaged device infected] --> STEAL[Passwords + session cookies stolen]\n  STEAL --> MARKET[Sold on criminal markets]\n  MARKET --> LOGIN[Attacker logs in]\n  LOGIN --> CONTROLS{Device check + MFA + short sessions?}\n  CONTROLS -->|yes| BLOCKED[Blocked]\n  CONTROLS -->|no| BREACH[Account compromised]\n```\n\n### Worked example\n\n| Control | Effect |\n|---|---|\n| Access only from managed devices | Stolen credentials useless elsewhere |\n| Phishing-resistant MFA | Password alone insufficient |\n| Session lifetime ≤ 12 h + re-auth for sensitive actions | Limits stolen session value |\n| Credential leak monitoring | Forces resets after exposure |"}, {"id": 148, "title": "Supply chain and third-party attacks", "tldr": "Attackers compromise vendors, managed service providers, software updates or SaaS integrations to reach many victims. Manage third-party risk with least-privilege integrations, vendor security reviews, monitoring of third-party access and contractual requirements.", "real": "In 2023 attackers compromised Okta’s customer support case management system and accessed files uploaded by customers, and in 2021 the Kaseya VSA attack spread ransomware through a managed service provider tool to many downstream businesses.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Attacks via trusted vendors and integrations |\n| Why it matters | Inherited risk from partners |\n| Controls | Vendor reviews, least-privilege integrations, monitoring, contracts |\n| Watch out for | OAuth apps and integrations with broad, permanent access |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  VENDOR[Vendor compromised] --> ACCESS[Vendor's access to you]\n  ACCESS --> SCOPE{Least privilege + monitored?}\n  SCOPE -->|yes| LIMITED[Limited impact + detection]\n  SCOPE -->|no| WIDE[Broad compromise]\n```\n\n### Worked example\n\n| Integration | Safer configuration |\n|---|---|\n| MSP remote access | MFA, time-bound, logged sessions |\n| SaaS OAuth app | Minimal scopes, admin approval required |\n| Support file uploads | Remove secrets and session tokens (e.g. HAR files) before sharing |"}, {"id": 149, "title": "DDoS and availability attacks", "tldr": "Attackers disrupt availability with volumetric floods, protocol attacks or application-layer request floods, sometimes for extortion or hacktivism. Use upstream scrubbing, CDNs, rate limiting, autoscaling limits and incident playbooks.", "real": "The HTTP/2 “Rapid Reset” technique disclosed in October 2023 enabled record-breaking application-layer DDoS attacks against major providers, which coordinated patches across web servers and CDNs.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Attacks that make services unavailable |\n| Why it matters | Revenue loss and reputational damage |\n| Defenses | CDN/scrubbing, rate limits, caching, patched protocol stacks |\n| Watch out for | Origin servers reachable directly, bypassing protection |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  FLOOD[Attack traffic] --> EDGE[Anycast CDN / scrubbing]\n  EDGE --> L7[L7 rate limits + bot management]\n  L7 --> ORIGIN[Origin: accepts only CDN traffic]\n  RUNBOOK[DDoS runbook] -.-> EDGE\n```\n\n### Worked example\n\n| Attack layer | Mitigation |\n|---|---|\n| Volumetric (bandwidth) | Upstream scrubbing capacity |\n| Protocol (connections) | SYN cookies, connection limits |\n| Application (requests) | Rate limits, challenges, caching |\n| Protocol implementation flaws | Patch servers and proxies promptly |"}, {"id": 150, "title": "AI-enabled threats", "tldr": "Attackers use AI to scale phishing, generate convincing lures in many languages, clone voices and create deepfake video for fraud, and speed up reconnaissance. Defenses emphasize verification processes that don’t rely on recognizing voices or faces.", "real": "In early 2024 an employee at engineering firm Arup’s Hong Kong office was tricked into transferring about HK$200 million (around US$25 million) after a video call with deepfaked colleagues, including the CFO.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Attacks enhanced by generative AI |\n| Why it matters | More convincing, scalable social engineering |\n| Defenses | Out-of-band verification, approval workflows, code words, passkeys |\n| Watch out for | Trusting a familiar voice or face as proof of identity |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REQUEST[Urgent payment request on video call] --> POLICY[Policy: verify via known channel]\n  POLICY --> CALLBACK[Call back on directory number]\n  CALLBACK -->|confirmed| DUAL[Dual approval]\n  CALLBACK -->|not confirmed| STOP[Stop + report]\n```\n\n### Worked example\n\n| Scenario | Verification control |\n|---|---|\n| “CFO” requests urgent transfer on video | Callback + dual approval in payment system |\n| Voice call from “IT” asking for MFA code | Policy: IT never asks for codes |\n| Polished phishing in local language | Technical controls (passkeys, filtering) over user detection alone |"}, {"id": 151, "title": "Data classification", "tldr": "Classify data by sensitivity (public, internal, confidential, restricted) so controls match risk: who can access it, where it can be stored, whether it must be encrypted and how long it’s kept. Classification drives every other data protection decision.", "real": "Standards such as ISO/IEC 27001 require organizations to classify and label information, and regulated data such as payment card numbers (PCI DSS) and health records (HIPAA) carry specific handling rules.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Labeling data by sensitivity |\n| Why it matters | Matches controls to risk |\n| Typical levels | Public, internal, confidential, restricted |\n| Watch out for | Classification schemes nobody applies in practice |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DATA[Data asset] --> CLASS{Classification}\n  CLASS -->|public| P[No restrictions]\n  CLASS -->|internal| I[Employees only]\n  CLASS -->|confidential| C[Need-to-know + encryption]\n  CLASS -->|restricted| R[Strict access + encryption + logging + DLP]\n```\n\n### Worked example\n\n| Data | Class | Key controls |\n|---|---|---|\n| Marketing website copy | Public | Integrity only |\n| Internal wiki | Internal | SSO access |\n| Customer contact details | Confidential | Role-based access, encryption |\n| Card numbers, health records, Aadhaar numbers | Restricted | Tokenization, strict access, audit |"}, {"id": 152, "title": "Encryption at rest and in transit", "tldr": "Encrypt data in transit with TLS everywhere, including internal traffic, and at rest with platform encryption and, where needed, application-level encryption for highly sensitive fields. Encryption only helps if keys are protected separately.", "real": "Major cloud providers now encrypt many storage services at rest by default (Amazon S3 encrypts new objects by default since January 2023), shifting the focus to key management and access control.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Protecting data from unauthorized reading |\n| Why it matters | Limits exposure from stolen media or intercepted traffic |\n| Layers | TLS, disk/storage encryption, database encryption, field-level encryption |\n| Watch out for | Encryption with keys stored next to the data |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CLIENT[Client] -->|TLS| API[API]\n  API -->|TLS| DB[(Database: storage encryption)]\n  API --> FIELD[Field-level encryption for restricted fields]\n  KMS[KMS] --> FIELD\n  KMS --> DB\n```\n\n### Worked example\n\n| Layer | Protects against |\n|---|---|\n| TLS | Network interception |\n| Storage encryption | Stolen disks or snapshots |\n| Field-level encryption | Database admins and SQL injection reading raw values |\n| Tokenization | Systems that never need the real value |"}, {"id": 153, "title": "Key management", "tldr": "Keys need secure generation, storage, access control, rotation, backup and destruction. Use cloud KMS or HSMs, envelope encryption, separation of duties between key admins and data admins, and audit all key usage.", "real": "Envelope encryption, where data keys encrypt data and a KMS master key encrypts the data keys, is used by AWS KMS, Google Cloud KMS and Azure Key Vault so large data can be encrypted efficiently while master keys never leave the KMS.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Lifecycle management of cryptographic keys |\n| Why it matters | Encryption strength depends on key protection |\n| Practices | KMS/HSM, envelope encryption, rotation, least privilege, audit |\n| Watch out for | Deleting keys without confirming no data depends on them |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  KMS[KMS master key] -->|encrypts| DEK[Data encryption key]\n  DEK -->|encrypts| DATA[Data]\n  WRAPPED[Wrapped DEK stored with data] --> KMS\n  KMS -->|decrypt DEK on authorized request| APP[Application]\n```\n\n### Worked example\n\n| Practice | Setting |\n|---|---|\n| Key rotation | Automatic yearly for master keys |\n| Key deletion | Waiting period (e.g. 30 days) + alerts |\n| Access | Separate roles for key admins vs key users |\n| Audit | All decrypt calls logged |"}, {"id": 154, "title": "Data loss prevention", "tldr": "DLP detects and controls sensitive data leaving approved locations via email, uploads, removable media, SaaS sharing or endpoints. Start with high-confidence detectors for regulated data and focus on coaching users rather than only blocking.", "real": "Microsoft Purview, Google Workspace DLP and cloud data security tools detect patterns such as card numbers and national identifiers, often combined with labels from data classification.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Monitoring and controlling sensitive data flows |\n| Why it matters | Prevents accidental and malicious leaks |\n| Channels | Email, web uploads, SaaS sharing, endpoints, generative AI tools |\n| Watch out for | Noisy rules that block normal work |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  USER[User action: share, upload, email] --> DLP[DLP policy check]\n  DLP -->|no sensitive data| ALLOW[Allow]\n  DLP -->|sensitive, low risk| WARN[Warn + justify]\n  DLP -->|restricted data to external| BLOCK[Block + notify]\n```\n\n### Worked example\n\n```python\ndef luhn_valid(number: str) -> bool:\n    digits = [int(d) for d in number if d.isdigit()]\n    checksum = 0\n    for i, d in enumerate(reversed(digits)):\n        if i % 2 == 1:\n            d = d * 2 - 9 if d * 2 > 9 else d * 2\n        checksum += d\n    return len(digits) >= 13 and checksum % 10 == 0\n\nprint(luhn_valid(\"4111 1111 1111 1111\"))   # True: well-known test card number\n```\n\n(DLP tools combine patterns like this with context to reduce false positives.)"}, {"id": 155, "title": "Tokenization and masking", "tldr": "Tokenization replaces sensitive values with non-sensitive tokens, keeping real values in a secured vault; masking hides parts of values for display or testing. Both shrink the number of systems that handle sensitive data.", "real": "Payment processors tokenize card numbers so merchants store tokens instead of card data, greatly reducing their PCI DSS scope, and many companies mask production data before using it in test environments.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Substituting or hiding sensitive values |\n| Why it matters | Fewer systems in scope for sensitive data |\n| Types | Vault tokenization, format-preserving tokens, masking, anonymization |\n| Watch out for | Production data copied unmasked into test systems |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CARD[Card number] --> VAULT[Token vault / payment provider]\n  VAULT --> TOKEN[Token: tok_9f2c]\n  TOKEN --> APP[Your systems store token only]\n  APP -->|charge| VAULT\n```\n\n### Worked example\n\n| Value | Masked display | Tokenized storage |\n|---|---|---|\n| 4111 1111 1111 1111 | **** **** **** 1111 | tok_9f2c81 |\n| asha.rao@example.com | a***@example.com | — |\n| +91 98765 43210 | +91 ****** 3210 | — |"}, {"id": 156, "title": "Privacy by design", "tldr": "Build privacy into systems from the start: collect only necessary data, limit purposes, minimize retention, give users control, secure data by default and assess privacy impacts for risky processing.", "real": "GDPR Article 25 (applicable since May 2018) requires “data protection by design and by default”, and regulators have issued fines where systems collected or kept more personal data than necessary.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Designing systems to protect personal data by default |\n| Why it matters | Legal requirement and user trust |\n| Principles | Minimization, purpose limitation, retention limits, transparency, user control |\n| Watch out for | Collecting data “in case it’s useful later” |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  FEATURE[New feature] --> NEED{Personal data needed?}\n  NEED -->|no| SKIP[Don't collect]\n  NEED -->|yes| MIN[Collect minimum + define purpose]\n  MIN --> RETAIN[Set retention period]\n  RETAIN --> ACCESS[Restrict access + encrypt]\n  ACCESS --> DPIA{High risk processing?}\n  DPIA -->|yes| ASSESS[Privacy impact assessment]\n```\n\n### Worked example\n\n| Design choice | Privacy-friendly alternative |\n|---|---|\n| Store full date of birth to check age | Store only “over 18” flag |\n| Keep logs with IPs forever | Truncate IPs, 30-day retention |\n| Use real customer data in tests | Synthetic or masked data |"}, {"id": 157, "title": "Privacy regulations", "tldr": "Privacy laws such as the EU GDPR, India’s DPDP Act, California’s CCPA/CPRA and many others regulate collection, use, transfer and protection of personal data, granting individuals rights and imposing breach notification duties and penalties.", "real": "GDPR fines can reach €20 million or 4% of global annual turnover, and Meta received a €1.2 billion fine in 2023 over EU–US data transfers; India’s Digital Personal Data Protection Act was passed in 2023, with implementing rules notified in November 2025.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Legal obligations for personal data |\n| Why it matters | Fines, litigation, market access |\n| Common elements | Lawful basis/consent, rights, security, breach notification, transfers |\n| Watch out for | Assuming one jurisdiction’s rules cover all users |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DATA[Personal data processing] --> BASIS[Lawful basis / consent]\n  BASIS --> RIGHTS[Support user rights: access, correction, deletion]\n  RIGHTS --> SECURITY[Reasonable security safeguards]\n  SECURITY --> BREACH[Breach notification process]\n```\n\n### Worked example\n\n| Requirement | GDPR (EU) | DPDP Act (India) |\n|---|---|---|\n| Consent / lawful basis | Six lawful bases | Consent or legitimate uses |\n| Data subject rights | Access, rectification, erasure, portability, objection | Access, correction, erasure, grievance redressal |\n| Breach notification | Authority within 72 hours where required | Board and affected individuals as prescribed by rules |\n| Maximum penalties | €20M or 4% of global turnover | Up to ₹250 crore per breach category |\n\n(Summary only; consult legal counsel for obligations.)"}, {"id": 158, "title": "Data retention and deletion", "tldr": "Keep personal and sensitive data only as long as needed for defined purposes or legal obligations, then delete or anonymize it across all systems, including backups, logs, analytics copies and search indexes.", "real": "Regulators have fined companies for retaining personal data longer than necessary; for example, Denmark’s data protection authority proposed fines against companies for failing to delete customer data as required under GDPR.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Managing data lifetimes |\n| Why it matters | Less data = less breach impact and compliance risk |\n| Practices | Retention schedules, automated deletion, deletion propagation |\n| Watch out for | Data deleted from the main DB but kept in backups and exports forever |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SCHEDULE[Retention schedule] --> JOB[Automated deletion jobs]\n  JOB --> DB[(Primary DB)]\n  JOB --> LOGS[Logs]\n  JOB --> ANALYTICS[Analytics copies]\n  JOB --> SEARCH[Search indexes]\n  BACKUPS[Backups expire per policy] --> DONE[Data fully removed over time]\n```\n\n### Worked example\n\n| Data | Retention |\n|---|---|\n| Application logs with IPs | 30 days |\n| Support tickets | 3 years after closure |\n| Invoices | As required by tax law (e.g. 8 years) |\n| Inactive accounts | Delete after 2 years of inactivity with notice |"}, {"id": 159, "title": "Breach notification", "tldr": "Many laws require notifying regulators and affected individuals after personal data breaches within strict deadlines. Prepare templates, decision criteria, legal contacts and evidence collection in advance.", "real": "GDPR requires notifying the supervisory authority within 72 hours of becoming aware of a reportable breach, India’s CERT-In 2022 directions require reporting specified cyber incidents within 6 hours, and the US SEC requires public companies to disclose material incidents within four business days of determining materiality.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Legal duties to report incidents |\n| Why it matters | Missed deadlines add penalties |\n| Preparation | Contacts, templates, decision trees, evidence |\n| Watch out for | Waiting for complete information before starting notification work |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INCIDENT[Incident confirmed] --> ASSESS[Assess data + jurisdictions]\n  ASSESS --> CLOCKS[Start regulatory clocks]\n  CLOCKS --> NOTIFY_REG[Notify regulators]\n  CLOCKS --> NOTIFY_USERS[Notify affected individuals if required]\n  CLOCKS --> DISCLOSE[Public / investor disclosure if required]\n```\n\n### Worked example\n\n| Regime | Deadline |\n|---|---|\n| GDPR (supervisory authority) | 72 hours |\n| CERT-In (India, specified incidents) | 6 hours |\n| SEC (material cybersecurity incident) | 4 business days after materiality determination |"}, {"id": 160, "title": "Securing data in AI tools", "tldr": "Employees paste sensitive data into AI assistants, and AI applications process prompts, files and retrieved documents. Provide approved AI tools with suitable data terms, apply DLP to AI channels, restrict retrieval to authorized data and log usage.", "real": "Samsung restricted employee use of external generative AI tools in 2023 after engineers entered confidential source code into ChatGPT, leading many companies to adopt approved enterprise AI tools with data protections.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Data protection for AI usage |\n| Why it matters | New channel for data leakage |\n| Controls | Approved tools, enterprise data terms, DLP, permission-aware retrieval |\n| Watch out for | Banning AI entirely, pushing usage to unapproved tools |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  USER[Employee] --> APPROVED[Approved enterprise AI tool]\n  APPROVED --> DLP[DLP + classification checks]\n  APPROVED --> RETRIEVAL[Retrieval limited to user's permissions]\n  USER -.blocked or monitored.-> UNAPPROVED[Unapproved consumer AI tools]\n```\n\n### Worked example\n\n| Data class | AI usage

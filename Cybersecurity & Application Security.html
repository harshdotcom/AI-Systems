 policy |\n|---|---|\n| Public | Any approved tool |\n| Internal | Enterprise AI tools only |\n| Confidential | Enterprise tools with no-training data terms |\n| Restricted | Not allowed unless specifically approved |"}, {"id": 161, "title": "Security governance", "tldr": "Governance defines who is accountable for security, how decisions are made, what policies apply, how risk is reported to leadership and how resources are allocated. Without governance, security depends on individual heroics.", "real": "NIST Cybersecurity Framework 2.0 (2024) added “Govern” as a core function, reflecting that cybersecurity strategy, roles, policies and oversight are leadership responsibilities.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structures for security accountability and decisions |\n| Why it matters | Aligns security with business risk |\n| Elements | Roles (CISO, owners), policies, risk appetite, reporting, budgets |\n| Watch out for | Security accountability resting only with the security team |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  BOARD[Board / leadership: risk appetite] --> CISO[CISO: program strategy]\n  CISO --> POLICY[Policies + standards]\n  CISO --> RISK[Risk register]\n  POLICY --> TEAMS[Business + engineering owners]\n  RISK --> TEAMS\n  TEAMS --> REPORT[Metrics + risk reporting]\n  REPORT --> BOARD\n```\n\n### Worked example\n\n| Role | Accountability |\n|---|---|\n| Board | Oversight of cyber risk |\n| CISO | Security program and reporting |\n| System owners | Risk decisions for their systems |\n| Engineers | Implementing secure designs and fixes |"}, {"id": 162, "title": "Risk management", "tldr": "Risk management identifies, assesses, treats and monitors risks in a register with owners and due dates. Decisions to accept risk should be explicit, documented, time-limited and made by people with authority.", "real": "ISO/IEC 27005 provides guidance on information security risk management, and NIST SP 800-37 describes the Risk Management Framework used across US federal systems.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Systematic handling of security risks |\n| Why it matters | Prioritizes effort and documents decisions |\n| Treatments | Mitigate, transfer, accept, avoid |\n| Watch out for | Risk acceptances that never expire |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  IDENTIFY[Identify] --> ASSESS[Assess likelihood + impact]\n  ASSESS --> TREAT[Treat]\n  TREAT --> MONITOR[Monitor]\n  MONITOR --> IDENTIFY\n  TREAT --> REGISTER[(Risk register: owner, due date)]\n```\n\n### Worked example\n\n| Risk | Owner | Treatment | Due |\n|---|---|---|---|\n| Legacy app without MFA | CIO | Mitigate: move behind SSO | Q2 |\n| Vendor without SOC 2 | Procurement | Accept until renewal, compensating controls | 6 months |\n| Ransomware business interruption | CFO | Transfer partly via cyber insurance | Annual |"}, {"id": 163, "title": "ISO/IEC 27001", "tldr": "ISO/IEC 27001 specifies requirements for an information security management system (ISMS): scope, risk assessment, controls selection (Annex A), policies, internal audits, management review and continual improvement. Certification is audited by accredited bodies.", "real": "The 2022 revision of ISO/IEC 27001 reorganized Annex A into 93 controls across four themes (organizational, people, physical and technological), with a transition deadline for certified organizations in October 2025.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | International standard for security management systems |\n| Why it matters | Widely requested by customers, especially internationally |\n| Core | Risk-based control selection, Statement of Applicability, audits |\n| Watch out for | Documentation-only programs without real control operation |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PLAN[Plan: scope, risks, controls] --> DO[Do: implement controls]\n  DO --> CHECK[Check: monitor, internal audit]\n  CHECK --> ACT[Act: management review, improve]\n  ACT --> PLAN\n```\n\n### Worked example\n\n| Annex A theme (2022) | Example controls |\n|---|---|\n| Organizational | Policies, supplier security, incident management |\n| People | Screening, awareness training |\n| Physical | Secure areas, equipment protection |\n| Technological | Access control, logging, secure development |"}, {"id": 164, "title": "SOC 2", "tldr": "SOC 2 reports, issued by independent auditors under AICPA criteria, describe a service organization’s controls for security and optionally availability, processing integrity, confidentiality and privacy. Type II reports test controls over a period.", "real": "SOC 2 Type II reports became a de facto requirement for B2B SaaS vendors in North America, and compliance automation platforms such as Vanta and Drata emerged to help companies collect evidence continuously.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Independent attestation on service controls |\n| Why it matters | Customers’ vendor reviews often require it |\n| Types | Type I (design at a point in time), Type II (operating effectiveness over months) |\n| Watch out for | Controls designed for the audit, not for real security |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SCOPE[Define scope + criteria] --> CONTROLS[Implement controls]\n  CONTROLS --> EVIDENCE[Collect evidence continuously]\n  EVIDENCE --> AUDIT[Auditor tests over period]\n  AUDIT --> REPORT[SOC 2 Type II report]\n```\n\n### Worked example\n\n| Control | Evidence |\n|---|---|\n| Access reviews quarterly | Signed review records |\n| Code changes reviewed | Pull request approvals |\n| Background checks | HR records |\n| Incident response tested | Tabletop exercise report |"}, {"id": 165, "title": "PCI DSS", "tldr": "PCI DSS sets security requirements for organizations that store, process or transmit payment card data. The best strategy is reducing scope: use tokenization and hosted payment pages so card data never touches your systems.", "real": "PCI DSS version 4.0 was published in March 2022 (with 4.0.1 in 2024), and its future-dated requirements became mandatory on March 31, 2025, including stronger authentication and e-commerce script controls.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Payment card industry security standard |\n| Why it matters | Required to accept card payments |\n| Key strategy | Minimize cardholder data environment via tokenization |\n| Watch out for | Card numbers in logs, analytics or support tickets |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CUSTOMER[Customer] --> HOSTED[Payment provider's hosted fields]\n  HOSTED --> PROVIDER[Payment provider: card data]\n  PROVIDER --> TOKEN[Token returned]\n  TOKEN --> YOURAPP[Your app: no card data stored]\n```\n\n### Worked example\n\n| Design | PCI scope |\n|---|---|\n| Your servers receive card numbers | Large: full requirements apply |\n| Hosted payment page / fields | Much smaller scope |\n| Tokens only stored | Card data never in your environment |"}, {"id": 166, "title": "Security policies and standards", "tldr": "Policies state intent and rules at a high level (what and why); standards specify mandatory technical requirements; procedures describe how; guidelines recommend. Keep them short, owned, versioned and connected to real controls.", "real": "Frameworks such as ISO/IEC 27001 and SOC 2 require documented policies, and auditors test whether practice matches policy, so unrealistic policies create audit findings.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Documented security rules |\n| Why it matters | Clarity, consistency, audit evidence |\n| Hierarchy | Policy → standard → procedure → guideline |\n| Watch out for | 80-page policies nobody follows |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  POLICY[Policy: all access must be least privilege] --> STANDARD[Standard: MFA required; admin via JIT]\n  STANDARD --> PROCEDURE[Procedure: how to request JIT access]\n  PROCEDURE --> GUIDE[Guideline: tips for scoping roles]\n```\n\n### Worked example\n\n| Document | Example statement |\n|---|---|\n| Policy | Production data access is limited to authorized roles |\n| Standard | Production access requires SSO, MFA and approval; max 8 hours |\n| Procedure | Request via access portal; approver = service owner |"}, {"id": 167, "title": "Third-party risk management", "tldr": "Vendors, SaaS providers and partners can expose your data and systems. Tier vendors by risk, review security evidence proportionately, set contractual requirements, limit integration access and monitor for incidents and changes.", "real": "Breaches originating at third parties, such as the 2023 MOVEit exploitation affecting organizations through their file transfer providers, led regulators and customers to scrutinize vendor risk management more closely.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Managing security risk from suppliers |\n| Why it matters | You inherit your vendors’ weaknesses |\n| Process | Tiering, due diligence, contracts, access limits, monitoring |\n| Watch out for | Same heavy questionnaire for every vendor |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  VENDOR[New vendor] --> TIER{Data + access risk}\n  TIER -->|high| DEEP[SOC 2/ISO review + contract clauses + access review]\n  TIER -->|medium| STANDARD[Questionnaire + key evidence]\n  TIER -->|low| LIGHT[Basic checks]\n  DEEP --> MONITOR[Ongoing monitoring + annual review]\n```\n\n### Worked example\n\n| Vendor | Risk tier | Requirements |\n|---|---|---|\n| Payroll SaaS with employee PII | High | SOC 2 Type II, DPA, breach notice 24–72 h, SSO |\n| Design tool with no customer data | Low | SSO, basic review |\n| Managed IT provider with admin access | High | MFA, logged sessions, least privilege, right to audit |"}, {"id": 168, "title": "Security awareness and culture", "tldr": "Effective awareness programs focus on a few high-impact behaviors (reporting phishing, using password managers and MFA, verifying payment changes), use realistic, frequent short training and celebrate reporting rather than punishing mistakes.", "real": "Research and industry experience show that making reporting easy (a report button) and rewarding it improves detection, since a fast report from one user lets security teams remove a phishing campaign for everyone.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Building secure habits across the organization |\n| Why it matters | People are part of every control |\n| Focus | Reporting, MFA, verification, data handling |\n| Watch out for | Shaming people who click on simulated phishing |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TRAIN[Short, role-based training] --> BEHAVIOR[Target behaviors]\n  SIM[Phishing simulations] --> REPORT[Report button usage]\n  REPORT --> FEEDBACK[Positive feedback + recognition]\n  FEEDBACK --> CULTURE[Security culture]\n```\n\n### Worked example\n\n| Metric | Better signal than |\n|---|---|\n| Phishing report rate and speed | Click rate alone |\n| Password manager adoption | Training completion % |\n| Payment verification compliance | Quiz scores |"}, {"id": 169, "title": "Reporting security to leadership", "tldr": "Leaders need risk-based reporting: top risks and trends, progress on key initiatives, incidents and lessons, compliance status and decisions required, in business terms rather than tool metrics.", "real": "The US SEC’s 2023 cybersecurity disclosure rules require public companies to describe their cybersecurity risk management and board oversight in annual reports, increasing board-level attention to security reporting.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Communicating security posture to executives and boards |\n| Why it matters | Drives funding and risk decisions |\n| Content | Top risks, trends, incidents, initiatives, decisions needed |\n| Watch out for | Dashboards of tool counts without business meaning |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DATA[Operational metrics] --> TRANSLATE[Translate to business risk]\n  TRANSLATE --> TOP[Top 5 risks + trends]\n  TOP --> DECISIONS[Decisions + investments requested]\n  DECISIONS --> BOARD[Board / executives]\n```\n\n### Worked example\n\n| Instead of | Report |\n|---|---|\n| “We blocked 2 million attacks” | “Ransomware risk reduced: immutable backups now cover 95% of critical systems” |\n| “3,412 vulnerabilities open” | “All internet-facing exploited vulnerabilities fixed within 48 hours this quarter” |\n| “Phishing click rate 4%” | “Phishing-resistant MFA rollout 80% complete; target Q3” |"}, {"id": 170, "title": "Cyber insurance and security investment", "tldr": "Cyber insurance transfers part of the financial impact of incidents, and insurers increasingly require baseline controls such as MFA, EDR, backups and patching. Security investment decisions should weigh risk reduction per cost.", "real": "After rising ransomware claims around 2020–2021, cyber insurers tightened underwriting and commonly began requiring controls such as MFA for remote access, EDR and offline backups for coverage.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Financial risk transfer and investment prioritization |\n| Why it matters | Some risk remains after controls |\n| Common requirements | MFA, EDR, backups, patching, incident response plan |\n| Watch out for | Insurance treated as a substitute for controls |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  RISKS[Residual risks] --> CONTROLS[Invest in controls: reduce likelihood/impact]\n  RISKS --> INSURANCE[Insurance: transfer financial impact]\n  CONTROLS --> PREMIUM[Better insurability + lower premiums]\n```\n\n### Worked example\n\nAnnualized loss expectancy (ALE) = single loss expectancy × annual rate of occurrence:\n\n```text\nRansomware scenario: SLE ₹8 crore, ARO 0.2 → ALE = ₹1.6 crore per year\nControls (immutable backups + EDR) reduce ARO to 0.05 and SLE to ₹3 crore\nNew ALE = ₹0.15 crore; annual risk reduction ≈ ₹1.45 crore vs control cost ₹40 lakh\n```"}, {"id": 171, "title": "Securing LLM applications", "tldr": "LLM applications add new risks: prompt injection, sensitive data disclosure, insecure output handling, excessive agency of tools, poisoned data and unbounded consumption. Apply classic AppSec plus LLM-specific controls from the OWASP Top 10 for LLM Applications.", "real": "OWASP published the 2025 edition of its Top 10 for LLM Applications in November 2024, listing prompt injection first and adding system prompt leakage and vector/embedding weaknesses.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Security for AI-powered applications |\n| Why it matters | Models process untrusted text and can trigger actions |\n| Key controls | Least-privilege tools, output validation, data minimization, rate limits |\n| Watch out for | Treating the model as a trusted component |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  USER[User input] --> GUARD1[Input checks]\n  DOCS[Retrieved documents: untrusted] --> MODEL[LLM]\n  GUARD1 --> MODEL\n  MODEL --> GUARD2[Output validation + encoding]\n  MODEL --> TOOLS[Tools: least privilege + approvals]\n  GUARD2 --> APP[Application]\n```\n\n### Worked example\n\n| OWASP LLM risk (2025) | Control |\n|---|---|\n| LLM01 Prompt injection | Privilege separation, approvals, egress limits |\n| LLM02 Sensitive information disclosure | Redaction, permission-aware retrieval |\n| LLM05 Improper output handling | Treat output as untrusted; encode/validate |\n| LLM06 Excessive agency | Minimal tool scopes |\n| LLM10 Unbounded consumption | Token budgets, rate limits |"}, {"id": 172, "title": "Prompt injection defenses", "tldr": "Prompt injection can’t be fully prevented by prompts or filters, so contain its impact: keep untrusted content away from privileged actions, avoid combining private data, untrusted input and external communication in one autonomous flow, and require confirmation for sensitive actions.", "real": "Simon Willison described the “lethal trifecta” in 2025: an AI agent with access to private data, exposure to untrusted content and the ability to communicate externally can be manipulated into leaking data.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Containment strategies for injected instructions |\n| Why it matters | Indirect injection via documents, web pages and emails is common |\n| Patterns | Least privilege, dual-model separation, approvals, egress controls |\n| Watch out for | Relying on “ignore malicious instructions” in the system prompt |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  P[Private data access] --> RISK[Exfiltration possible]\n  U[Untrusted content] --> RISK\n  E[External communication] --> RISK\n  RISK --> MITIGATE[Remove one leg or require human approval]\n```\n\n### Worked example\n\n| Agent design | Risky? | Mitigation |\n|---|---|---|\n| Reads inbox + browses web + sends email | Yes | Human approval for every send |\n| Summarizes uploaded docs, no tools | Low | Output encoding |\n| Answers from internal KB, can create tickets | Medium | Ticket creation limited to user’s own account |"}, {"id": 173, "title": "AI model supply chain", "tldr": "Models, datasets and ML libraries are supply chain components. Some model formats (such as Python pickle) can execute code when loaded; prefer safe formats like safetensors, verify sources and hashes, scan model files and track model provenance.", "real": "Hugging Face introduced the safetensors format (2022) as a safe alternative to pickle-based model files, and security researchers have reported malicious models on public hubs that executed code when loaded.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Securing models, datasets and ML dependencies |\n| Why it matters | Loading a model can run code |\n| Controls | Safe formats, trusted sources, hash pinning, scanning, ML-BOMs |\n| Watch out for | torch.load on untrusted files without weights_only=True |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  HUB[Model hub] --> VERIFY[Verify publisher + hash]\n  VERIFY --> FORMAT{Safe format?}\n  FORMAT -->|safetensors| LOAD[Load]\n  FORMAT -->|pickle-based| SCAN[Scan + sandbox or reject]\n  LOAD --> REGISTRY[(Internal model registry)]\n```\n\n### Worked example\n\n```python\nfrom safetensors.torch import load_file\nimport torch\n\nweights = load_file(\"model.safetensors\")                       # data only, no code execution\nstate = torch.load(\"checkpoint.pt\", weights_only=True)         # restricts unpickling to tensors/primitives\n```"}, {"id": 174, "title": "Securing AI agents", "tldr": "Agents act with real permissions, so secure them like privileged service accounts: scoped credentials per user and task, authorization in tool code, sandboxes for code execution, approvals for risky actions, budgets and complete audit logs.", "real": "In May 2025, Invariant Labs demonstrated that a malicious GitHub issue could manipulate an agent using a broadly scoped GitHub MCP server token into leaking data from private repositories, illustrating why agent credentials must be narrowly scoped.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Controls for autonomous AI systems |\n| Why it matters | Manipulated agents can take real actions |\n| Controls | Least privilege, sandboxing, approvals, budgets, audit |\n| Watch out for | One powerful token shared by all agent actions |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  AGENT[Agent proposes action] --> SCHEMA[Validate parameters]\n  SCHEMA --> AUTHZ[Authorization in tool: user scope]\n  AUTHZ --> RISK{High-risk action?}\n  RISK -->|yes| APPROVE[Human approval]\n  RISK -->|no| EXEC[Execute in sandbox]\n  APPROVE --> EXEC\n  EXEC --> AUDIT[Audit log]\n```\n\n### Worked example\n\n| Tool | Scope |\n|---|---|\n| read_repo | Single repository, read-only |\n| comment_issue | That repository only |\n| run_code | Ephemeral sandbox, no network, no secrets |\n| send_email | Draft only; user sends |"}, {"id": 175, "title": "AI for defenders", "tldr": "Security teams use AI to summarize alerts, explain suspicious scripts, draft detection rules, triage phishing, query logs in natural language and accelerate investigations. Keep humans accountable for decisions and validate AI outputs.", "real": "Security vendors launched AI assistants for SOC work from 2023 onward, such as Microsoft Security Copilot (generally available in April 2024) and Google Security Operations’ Gemini features, to speed up investigation and reporting.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Using AI to augment security operations |\n| Why it matters | Analyst capacity is scarce |\n| Uses | Alert summaries, query generation, script explanation, report drafting |\n| Watch out for | Automated actions based on unverified AI conclusions |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ALERT[Alert] --> AI[AI assistant: summarize, enrich, suggest queries]\n  AI --> ANALYST[Analyst reviews evidence]\n  ANALYST --> DECIDE[Decision + action]\n  DECIDE --> FEEDBACK[Feedback improves prompts/playbooks]\n```\n\n### Worked example\n\n| Task | AI assistance | Human role |\n|---|---|---|\n| Alert triage | Summarize related events | Confirm severity |\n| Detection writing | Draft Sigma rule | Test + tune |\n| Incident report | First draft timeline | Verify facts |\n| Phishing analysis | Explain lure and URLs | Approve purge |"}, {"id": 176, "title": "Identity verification in the deepfake era", "tldr": "Deepfake audio and video weaken verification based on recognizing people. Use cryptographic and process controls: phishing-resistant authentication, callbacks to known numbers, approvals inside systems, liveness checks for onboarding and code words for high-risk requests.", "real": "The 2024 Arup incident, in which an employee transferred about US$25 million after a video call with deepfaked executives, led many companies to formalize out-of-band verification for payments and sensitive requests.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Verifying identity when media can be faked |\n| Why it matters | Fraud and account takeover via impersonation |\n| Controls | Passkeys, callbacks, in-system approvals, liveness detection, code words |\n| Watch out for | Help desks resetting credentials based on a convincing voice |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REQ[Sensitive request via call/video] --> CHANNEL[Verify through a separate known channel]\n  CHANNEL --> SYSTEM[Approve inside authenticated system]\n  SYSTEM --> DUAL[Second approver]\n  DUAL --> EXECUTE[Execute]\n```\n\n### Worked example\n\n| Request | Required verification |\n|---|---|\n| Payment > ₹10 lakh | In-system approval by two authenticated users |\n| MFA reset | Identity proofing + manager confirmation |\n| Vendor bank change | Callback to number on file |"}, {"id": 177, "title": "IoT and operational technology security", "tldr": "IoT devices and industrial control systems often run old software, lack authentication and can’t be patched easily, while their failures can affect physical safety. Segment them from IT networks, inventory devices, monitor traffic and follow standards such as IEC 62443.", "real": "Stuxnet, discovered in 2010, targeted industrial control systems controlling centrifuges, and the 2016 Mirai botnet hijacked hundreds of thousands of IoT devices with default passwords to launch massive DDoS attacks.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Securing connected devices and industrial systems |\n| Why it matters | Physical safety and critical infrastructure |\n| Controls | Segmentation, inventory, default credential removal, monitoring, secure remote access |\n| Watch out for | Flat networks connecting office IT to plant control systems |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  ENT[Enterprise IT network] --> DMZ[Industrial DMZ]\n  DMZ --> OPS[Operations: SCADA, historians]\n  OPS --> CONTROL[Control: PLCs]\n  CONTROL --> FIELD[Field devices]\n  REMOTE[Vendor remote access] -->|brokered, MFA, logged| DMZ\n```\n\n### Worked example\n\n| Risk | Control |\n|---|---|\n| Default passwords on cameras | Unique credentials at installation |\n| Unpatchable PLCs | Network isolation + monitoring |\n| Vendor remote access always on | Time-bound brokered access |\n| Unknown devices | Passive network discovery for inventory |"}, {"id": 178, "title": "Browser and extension security", "tldr": "Browsers hold sessions for most business apps, and extensions can read and change page content. Manage browsers centrally, allow-list extensions, keep browsers updated, and protect sessions against theft.", "real": "In December 2024 attackers phished a Chrome Web Store developer account at Cyberhaven and published a malicious version of its extension that targeted session data, and several other extensions were compromised in the same campaign.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Securing the browser as the main work environment |\n| Why it matters | Sessions and data flow through it |\n| Controls | Managed browsers, extension allow-lists, auto-update, session protections |\n| Watch out for | Employees installing any extension with broad permissions |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  POLICY[Central browser policy] --> UPDATE[Auto-update]\n  POLICY --> EXT[Extension allow-list]\n  POLICY --> SITES[Site isolation + safe browsing]\n  EXT --> REVIEW[Review permissions of requested extensions]\n```\n\n### Worked example\n\n| Extension permission | Risk |\n|---|---|\n| Read and change data on all websites | Very high: can read sessions and data |\n| Access to specific site only | Moderate |\n| No host permissions | Low |"}, {"id": 179, "title": "Crypto-agility and post-quantum migration", "tldr": "Prepare for post-quantum cryptography by inventorying where and how cryptography is used, prioritizing long-lived confidential data and key exchange, adopting hybrid TLS where available, and making algorithms configurable rather than hard-coded.", "real": "NIST finalized ML-KEM, ML-DSA and SLH-DSA in August 2024 and selected HQC as an additional key encapsulation algorithm in March 2025, and governments have published migration timelines targeting the 2030s.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Planning cryptographic transitions |\n| Why it matters | Migrations take years; data recorded today may be decrypted later |\n| Steps | Inventory, prioritize, test hybrids, upgrade libraries, track vendors |\n| Watch out for | Hard-coded algorithms deep in legacy systems |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INVENTORY[Crypto inventory: protocols, libraries, keys, certificates] --> RISK[Rank by data lifetime + exposure]\n  RISK --> PILOT[Pilot hybrid key exchange]\n  PILOT --> UPGRADE[Upgrade libraries + configs]\n  UPGRADE --> VENDORS[Track vendor PQC roadmaps]\n```\n\n### Worked example\n\n| Asset | Algorithm today | Plan |\n|---|---|---|\n| Public TLS endpoints | ECDHE + ECDSA | Enable hybrid X25519 + ML-KEM where supported |\n| Internal service mTLS | ECDHE | Follow service mesh PQC support |\n| Archived encrypted backups | AES-256 | Symmetric keys at 256 bits remain strong |\n| Code-signing | ECDSA | Monitor ML-DSA ecosystem support |"}, {"id": 180, "title": "Secure use of AI coding assistants", "tldr": "AI coding assistants speed development but can suggest insecure patterns, invent non-existent packages, leak secrets in prompts and make large unreviewed changes. Keep code review, SAST and dependency checks mandatory and verify every new package.", "real": "Researchers in 2024–2025 documented “package hallucination”, where code assistants suggested non-existent package names that attackers could register, a risk nicknamed “slopsquatting”.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Managing risks of AI-generated code |\n| Why it matters | Volume of code increases faster than review capacity |\n| Controls | Review, SAST/SCA, package verification, secrets protection, sandboxed agents |\n| Watch out for | Installing suggested packages without checking they exist and are legitimate |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  AI[AI-generated change] --> PKG{New dependencies?}\n  PKG -->|yes| VERIFY[Verify package: exists, maintainer, popularity]\n  PKG -->|no| SCANS[SAST + secrets + tests]\n  VERIFY --> SCANS\n  SCANS --> REVIEW[Human code review]\n  REVIEW --> MERGE[Merge]\n```\n\n### Worked example\n\n| Policy | Rationale |\n|---|---|\n| AI-generated code gets the same review as human code | Accountability |\n| New packages need approval | Prevents hallucinated or malicious packages |\n| No secrets in prompts | Data leakage |\n| Coding agents run in sandboxes without production credentials | Limits damage |"}, {"id": 181, "title": "Case study: Equifax (2017)", "tldr": "Attackers exploited a known Apache Struts vulnerability in an internet-facing dispute portal two months after a patch was available, then moved through systems and exfiltrated data on about 147 million people over several weeks.", "real": "The US Government Accountability Office’s 2018 report found that Equifax failed to patch CVE-2017-5638, and that an expired certificate on a traffic-inspection device prevented detection of the data exfiltration for months.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Initial access | Unpatched Struts vulnerability (CVE-2017-5638) |\n| Amplifiers | Weak segmentation, credentials in plaintext, expired inspection certificate |\n| Impact | \\~147 million people; settlement of up to about $700 million |\n| Key lessons | Asset inventory, fast patching, segmentation, monitoring health |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  MAR[March 2017: patch released] --> MAY[May: exploitation begins]\n  MAY --> MOVE[Lateral movement + credential discovery]\n  MOVE --> EXFIL[Weeks of exfiltration]\n  EXFIL --> JUL[July 29: detected after certificate renewed]\n  JUL --> SEP[September: public disclosure]\n```\n\n### Worked example\n\n| Failure | Control that would help |\n|---|---|\n| Patch not applied to portal | Asset inventory + KEV-style SLAs |\n| Plaintext credentials found | Secrets manager |\n| Expired inspection certificate | Monitoring of security tool health |\n| Wide access from one app | Segmentation + least privilege |"}, {"id": 182, "title": "Case study: SolarWinds (2020)", "tldr": "Attackers compromised SolarWinds’ build environment and inserted a backdoor into signed Orion software updates, which about 18,000 customers downloaded; a smaller set of high-value targets, including US government agencies, were then exploited further.", "real": "FireEye discovered the campaign in December 2020 while investigating its own breach, and the US government attributed it to Russia’s foreign intelligence service (SVR) in April 2021.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Initial access | Build system compromise |\n| Technique | Malicious code inserted at build time into signed updates |\n| Impact | Broad distribution; targeted follow-on intrusions |\n| Key lessons | Build integrity (SLSA), monitoring of trusted software, least privilege for management tools |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BUILD[Compromised build server] --> INJECT[Backdoor added during build]\n  INJECT --> SIGN[Signed + released update]\n  SIGN --> CUSTOMERS[~18,000 customers install]\n  CUSTOMERS --> SELECT[Attackers select high-value targets]\n  SELECT --> INTRUDE[Follow-on intrusions]\n```\n\n### Worked example\n\n| Lesson | Practice |\n|---|---|\n| Signed doesn’t mean safe | Verify build provenance (SLSA) |\n| Management software is high-value | Restrict its network and privileges |\n| Unusual outbound traffic from servers | Egress monitoring and allow-lists |"}, {"id": 183, "title": "Case study: Log4Shell (2021)", "tldr": "A critical vulnerability in the Log4j Java logging library let attackers trigger remote code execution by getting a crafted string logged. Because Log4j was embedded in countless products, organizations struggled to find where they were affected.", "real": "CVE-2021-44228 was disclosed in December 2021 with the maximum CVSS score of 10.0, and CISA’s director described it as one of the most serious vulnerabilities she had seen.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Weakness | Unsafe feature in a ubiquitous dependency |\n| Challenge | Finding all affected software, including vendor products |\n| Response | Patches, mitigations, scanning, vendor coordination |\n| Key lessons | SBOMs, SCA, egress filtering, rapid patching |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DISCLOSE[Disclosure Dec 2021] --> SCAN[Mass scanning by attackers within hours]\n  DISCLOSE --> FIND[Defenders search for Log4j everywhere]\n  FIND --> SBOM{SBOMs available?}\n  SBOM -->|yes| FAST[Hours to identify affected apps]\n  SBOM -->|no| SLOW[Weeks of manual searching]\n```\n\n### Worked example\n\n| Capability | Effect during Log4Shell |\n|---|---|\n| SBOM per service | Immediate list of affected services |\n| Egress restrictions | Blocked outbound connections used in exploitation |\n| WAF virtual patching | Temporary protection |\n| Vendor inventory | Know which third-party products to chase |"}, {"id": 184, "title": "Case study: Capital One (2019)", "tldr": "An attacker used a misconfigured web application firewall to perform server-side request forgery, obtained credentials for an over-permissive IAM role from the instance metadata service and copied data from storage buckets.", "real": "The breach exposed data on about 100 million people in the US and 6 million in Canada; Capital One paid an $80 million penalty to the US Office of the Comptroller of the Currency, and AWS later promoted IMDSv2 to mitigate this class of attack.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Initial access | SSRF through misconfigured WAF |\n| Escalation | Metadata service credentials with broad S3 access |\n| Impact | \\~106 million people affected |\n| Key lessons | SSRF defenses, IMDSv2, least-privilege roles, anomaly detection |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  WAF[Misconfigured WAF] --> SSRF[SSRF request to metadata service]\n  SSRF --> CREDS[Role credentials]\n  CREDS --> LIST[List + read many buckets]\n  LIST --> EXFIL[Data copied out]\n```\n\n### Worked example\n\n| Weakness | Control |\n|---|---|\n| SSRF possible | URL allow-lists, block metadata IPs |\n| Metadata accessible with simple GET | IMDSv2 required |\n| Role could read many buckets | Least-privilege policy per workload |\n| Unusual bulk S3 reads | Anomaly detection on data access |"}, {"id": 185, "title": "Case study: Colonial Pipeline (2021)", "tldr": "Ransomware attackers accessed Colonial Pipeline’s network through a legacy VPN account without MFA, encrypted IT systems and stole data; the company shut down pipeline operations as a precaution, causing fuel shortages in the US Southeast.", "real": "Colonial paid about $4.4 million in ransom to the DarkSide group in May 2021, and the US Department of Justice later seized about $2.3 million of it; the CEO testified that the compromised VPN account lacked MFA.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Initial access | Legacy VPN account password, no MFA |\n| Impact | Multi-day shutdown of fuel pipeline operations |\n| Key factor | IT/OT dependency drove precautionary shutdown |\n| Key lessons | MFA on remote access, account lifecycle, IT/OT segmentation, recovery planning |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  VPN[Legacy VPN account: no MFA] --> ACCESS[Network access]\n  ACCESS --> RANSOM[Ransomware on IT systems]\n  RANSOM --> SHUTDOWN[Precautionary pipeline shutdown]\n  SHUTDOWN --> SHORTAGE[Regional fuel shortages]\n```\n\n### Worked example\n\n| Lesson | Control |\n|---|---|\n| Unused account still active | Joiner–mover–leaver + access reviews |\n| No MFA on VPN | Phishing-resistant MFA for all remote access |\n| Billing/IT dependency halted operations | Business continuity plans for IT outages |"}, {"id": 186, "title": "Case study: MOVEit Transfer (2023)", "tldr": "The Cl0p group exploited a zero-day SQL injection vulnerability in Progress Software’s MOVEit Transfer file-transfer product at scale, stealing data from thousands of organizations and their customers within days, then extorting victims.", "real": "Exploitation of CVE-2023-34362 began in late May 2023, and analyses later counted more than 2,500 affected organizations and tens of millions of affected individuals, many reached indirectly through vendors.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Initial access | Zero-day SQL injection in internet-facing file transfer software |\n| Scale | Mass exploitation within days |\n| Impact | Data theft and extortion across many sectors |\n| Key lessons | Minimize internet-facing products, monitor file-transfer systems, third-party risk |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ZERODAY[Zero-day in file transfer app] --> MASS[Mass exploitation over a few days]\n  MASS --> STEAL[Data stolen from many organizations]\n  STEAL --> EXTORT[Extortion + leak site]\n  STEAL --> DOWNSTREAM[Customers of victims affected too]\n```\n\n### Worked example\n\n| Control | Effect |\n|---|---|\n| Restrict file-transfer UI to known partners/IPs | Smaller exposure |\n| Retention limits on transferred files | Less data to steal |\n| Monitoring for unusual downloads | Faster detection |\n| Vendor inventory | Know which suppliers use affected software |"}, {"id": 187, "title": "Case study: Uber (2022)", "tldr": "An attacker obtained a contractor’s credentials, used repeated MFA push requests and a message impersonating IT to get one approved, then found hard-coded admin credentials in a network share that gave access to many internal systems.", "real": "Uber attributed the September 2022 breach to an attacker associated with the Lapsus$ group, and the incident became a widely cited example of MFA fatigue and secrets left in scripts.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Initial access | Stolen contractor password + MFA fatigue |\n| Escalation | Hard-coded privileged credentials in a script |\n| Impact | Access to many internal tools |\n| Key lessons | Phishing-resistant MFA, secret scanning on file shares, PAM hygiene |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PASS[Stolen contractor password] --> PUSH[Repeated MFA pushes]\n  PUSH --> SOCIAL[Message impersonating IT]\n  SOCIAL --> APPROVE[Push approved]\n  APPROVE --> SHARE[Network share: script with admin credentials]\n  SHARE --> TOOLS[Access to many internal tools]\n```\n\n### Worked example\n\n| Weakness | Control |\n|---|---|\n| Push MFA approvals | Number matching or passkeys |\n| No limit on push attempts | Rate-limit + alert on repeated denials |\n| Admin credentials in a script | Secret scanning of shares; vault + rotation |"}, {"id": 188, "title": "Case study: Snowflake customer breaches (2024)", "tldr": "Attackers used credentials stolen by infostealer malware, some years old, to log into Snowflake customer accounts that lacked MFA and network restrictions, stealing large datasets from companies including AT&T and Ticketmaster.", "real": "Mandiant reported in June 2024 that about 165 organizations were potentially affected, with no evidence of a breach of Snowflake’s own platform; Snowflake subsequently moved toward mandatory MFA.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Initial access | Valid customer credentials from infostealers |\n| Missing controls | MFA, network policies, credential rotation |\n| Impact | Large data thefts from multiple companies |\n| Key lessons | MFA on all SaaS, SSO enforcement, IP allow-lists, rotate old credentials |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INFOSTEALER[Infostealer on contractor PC] --> CREDS[Credentials sold]\n  CREDS --> LOGIN[Login to SaaS data platform]\n  LOGIN --> NOMFA{MFA or network policy?}\n  NOMFA -->|no| EXFIL[Bulk data export]\n  NOMFA -->|yes| BLOCKED[Blocked]\n```\n\n### Worked example\n\n| Control | Effect |\n|---|---|\n| SSO + MFA required | Stolen passwords insufficient |\n| Network policies (IP allow-lists) | Logins from attacker infrastructure blocked |\n| Credential rotation | Old stolen credentials useless |\n| Export monitoring | Detect unusual bulk downloads |"}, {"id": 189, "title": "Case study: the xz Utils backdoor (2024)", "tldr": "Over roughly two years, an attacker using the persona “Jia Tan” gained maintainer trust in the xz compression project and inserted a sophisticated backdoor affecting SSH on some Linux systems. It was caught shortly before reaching most stable distributions.", "real": "Microsoft engineer Andres Freund discovered the backdoor (CVE-2024-3094) in March 2024 after noticing that SSH logins on a test system were slower and using more CPU than expected.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Technique | Long-term social engineering of an open-source maintainer |\n| Hiding place | Build scripts and test files rather than visible source |\n| Impact | Caught before widespread deployment |\n| Key lessons | Support critical maintainers, reproducible builds, scrutiny of build artifacts |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TRUST[Years of helpful contributions] --> MAINTAINER[Gains maintainer rights]\n  MAINTAINER --> HIDE[Backdoor hidden in release tarball build steps]\n  HIDE --> DISTRO[Enters testing distributions]\n  DISTRO --> NOTICE[Engineer notices slow SSH logins]\n  NOTICE --> DISCLOSE[Disclosure + rollback]\n```\n\n### Worked example\n\n| Lesson | Practice |\n|---|---|\n| Release tarballs differed from source repo | Reproducible builds; build from source |\n| Overloaded solo maintainer | Fund and support critical projects |\n| Anomaly caught by performance curiosity | Investigate unexplained behavior changes |"}, {"id": 190, "title": "Case study: Okta support system breach (2023)", "tldr": "Attackers accessed Okta’s customer support case management system using a service account and downloaded files customers had uploaded, including browser HAR files containing session tokens, which were then used against some customers.", "real": "Okta disclosed the breach in October 2023 after customers including BeyondTrust and Cloudflare detected suspicious activity, and later reported that names and email addresses of all its customer support system users had been accessed.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Initial access | Compromised service account for support system |\n| Sensitive data | HAR files containing live session tokens |\n| Detection | Customers noticed and reported first |\n| Key lessons | Sanitize support uploads, short session lifetimes, customer-side monitoring |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SERVICE[Compromised service account] --> SUPPORT[Support case system]\n  SUPPORT --> HAR[Customer-uploaded HAR files]\n  HAR --> TOKENS[Session tokens extracted]\n  TOKENS --> CUSTOMERS[Attempted access to customer admin consoles]\n  CUSTOMERS --> DETECT[Customers detect + report]\n```\n\n### Worked example\n\n| Practice | Prevents |\n|---|---|\n| Strip cookies/tokens from HAR files before upload | Token reuse |\n| Short admin session lifetimes + device binding | Value of stolen tokens |\n| Alerts on admin logins from new locations | Faster detection |\n| Service accounts with MFA alternatives / restricted access | Initial access |"}, {"id": 191, "title": "Capstone: designing a secure web application", "tldr": "Combine the course into one design: SSO with passkeys, server-side authorization, parameterized data access, auto-escaping templates with strict CSP, secure sessions, secrets in a vault, logging, rate limits, dependency scanning and an incident runbook.", "real": "OWASP ASVS Level 2 is commonly used as the target requirement set for business applications handling sensitive data, and this capstone maps to its main areas.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Customer portal handling personal and payment data |\n| Target | OWASP ASVS Level 2 |\n| Key decisions | Hosted payments, passkeys + MFA, object-level authorization, strict CSP |\n| Verification | Threat model, SAST/SCA/DAST, authorization tests, pentest |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  USER[User] --> CDN[CDN + WAF + DDoS protection]\n  CDN --> APP[Web app: CSP, secure cookies, CSRF protection]\n  APP --> AUTH[Identity provider: passkeys, MFA]\n  APP --> API[API: authz per object, validation, rate limits]\n  API --> DB[(Database: least-privilege user, encryption, RLS)]\n  API --> PAY[Hosted payment provider: tokens only]\n  API --> VAULT[Secrets manager]\n  API --> LOGS[Security logs to SIEM]\n```\n\n### Worked example\n\n| ASVS area | Design choice |\n|---|---|\n| Authentication | Passkeys + MFA via identity provider |\n| Session management | __Host- cookies, 30-min idle timeout |\n| Access control | Per-object checks + permission matrix tests |\n| Validation and encoding | Schema validation, auto-escaping, strict CSP |\n| Data protection | Tokenized payments, field encryption for IDs |\n| Logging | Auth and admin events to SIEM |"}, {"id": 192, "title": "Capstone: threat modeling a payments feature", "tldr": "Threat-model a “saved cards and one-click payments” feature: draw the data flow, apply STRIDE per element, rank threats and assign mitigations with owners, then verify mitigations with tests.", "real": "Payment providers’ integration guides recommend hosted fields, tokenization and webhook signature verification precisely because these mitigate the most common threats to merchant payment flows.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Scope | Save card, pay with saved card, refunds |\n| Method | Data flow diagram + STRIDE |\n| Output | Prioritized threats, mitigations, owners, tests |\n| Review | Security + payments team sign-off |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BROWSER[Browser] -->|hosted fields| PROVIDER[Payment provider]\n  PROVIDER -->|token| API[Our API]\n  API --> DB[(Orders DB: tokens only)]\n  PROVIDER -->|signed webhooks| API\n  ADMIN[Support console] -->|refunds| API\n```\n\n### Worked example\n\n| Threat | STRIDE | Mitigation | Test |\n|---|---|---|---|\n| Forged “payment succeeded” webhook | Tampering | HMAC verification + timestamp | Unsigned webhook rejected |\n| Using another user’s saved card | Elevation of privilege | Card token bound to customer ID | Cross-user test returns 404 |\n| Support agent issues large refunds | Elevation of privilege | Limits + dual approval | Refund above limit requires approval |\n| Card data in logs | Information disclosure | Card data never reaches our servers | Log scanning in CI |"}, {"id": 193, "title": "Capstone: building an application security program", "tldr": "Build an AppSec program in stages: inventory applications, add automated scanning to CI, establish vulnerability SLAs, train developers, start threat modeling for risky features, launch security champions, then add pentests and a disclosure program.", "real": "OWASP SAMM provides a maturity model for software assurance programs, and organizations commonly use it to assess current practices and plan improvements over 12–24 months.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Sustainable, scalable application security |\n| Phases | Foundations → automation → design security → scale → external validation |\n| Measures | Coverage, SLA compliance, recurrence, escaped vulnerabilities |\n| Watch out for | Buying tools before defining ownership and SLAs |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  P1[Quarter 1: inventory + SCA + secrets scanning] --> P2[Quarter 2: SAST + SLAs + training]\n  P2 --> P3[Quarter 3: threat modeling + champions]\n  P3 --> P4[Quarter 4: DAST + pentests + disclosure policy]\n  P4 --> P5[Year 2: metrics-driven improvement + bug bounty]\n```\n\n### Worked example\n\n| Program element | First-year target |\n|---|---|\n| Repos with SCA + secrets scanning | 100% |\n| Repos with SAST | 90% |\n| Critical vulnerability SLA compliance | ≥ 95% |\n| Features with threat models (high risk) | 100% |\n| Champions | 1 per team |"}, {"id": 194, "title": "Capstone: writing an incident response plan", "tldr": "An incident response plan defines severity levels, roles, contact lists, decision authorities, communication templates, legal and regulatory steps, playbooks for top scenarios and evidence handling. Test it with tabletop exercises.", "real": "NIST SP 800-61 Revision 3 (2025) and CISA’s incident response playbooks provide templates and guidance that organizations adapt into their own plans.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Ready-to-use plan for security incidents |\n| Contents | Severity matrix, roles, contacts, playbooks, communications, legal |\n| Playbooks | Ransomware, account compromise, data exposure, cloud key leak |\n| Testing | Tabletop twice a year; update after incidents |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  DETECT[Detection] --> SEV{Severity}\n  SEV -->|SEV1| ALL[IR lead + execs + legal + comms]\n  SEV -->|SEV2| TEAM[IR lead + system owners]\n  SEV -->|SEV3| SOC[SOC handles]\n  ALL --> PLAYBOOK[Run scenario playbook]\n  TEAM --> PLAYBOOK\n  PLAYBOOK --> NOTIFY[Regulatory + customer notifications if required]\n  PLAYBOOK --> POST[Postmortem]\n```\n\n### Worked example\n\n| Severity | Definition | Response time |\n|---|---|---|\n| SEV1 | Confirmed breach of restricted data or business-wide outage | Immediate, 24/7 |\n| SEV2 | Contained compromise of a system or account | Within 1 hour |\n| SEV3 | Suspicious activity, no confirmed impact | Within 1 business day |"}, {"id": 195, "title": "Security architecture review checklist", "tldr": "Review designs consistently across identity, authorization, data protection, input handling, secrets, dependencies, logging, resilience, third parties and privacy before building and before launch.", "real": "Cloud providers’ well-architected security pillars and OWASP ASVS provide the structure many organizations use for architecture security reviews.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Standard security design review |\n| When | New systems, major changes, pre-launch |\n| Output | Findings with owners and due dates |\n| Watch out for | Reviews too late to change the design |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DESIGN[Design doc + data flow] --> REVIEW[Checklist review]\n  REVIEW --> FINDINGS[Findings + risk ratings]\n  FINDINGS --> FIX[Mitigations planned]\n  FIX --> APPROVE[Approval]\n```\n\n### Worked example\n\n| Area | Question |\n|---|---|\n| Identity | SSO, MFA, service identities? |\n| Authorization | Object-level checks; deny by default? |\n| Data | Classification, encryption, retention? |\n| Input/output | Validation, parameterization, encoding? |\n| Secrets | Vault, rotation, no secrets in code? |\n| Dependencies | SCA, pinned versions, SBOM? |\n| Logging | Security events logged and monitored? |\n| Resilience | Rate limits, DDoS protection, backups? |\n| Third parties | Least-privilege integrations? |\n| Privacy | Minimization, user rights? |"}, {"id": 196, "title": "Production security readiness checklist", "tldr": "Before launch, confirm security controls are working, not just designed: scans clean or accepted, authorization tests passing, secrets managed, logging and alerts live, incident contacts ready, and risk acceptances documented.", "real": "Many organizations require a security sign-off before production launches of internet-facing services, combining automated evidence from pipelines with manual review for high-risk systems.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Launch gate for security |\n| Why it matters | Prevents predictable post-launch incidents |\n| Evidence | Pipeline results, test reports, configuration checks |\n| Watch out for | Launch deadlines overriding unresolved critical findings |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SCANS[Scans: no open criticals] --> GATE{Ready?}\n  TESTS[Authz + auth tests pass] --> GATE\n  CONFIG[Headers, TLS, cookies verified] --> GATE\n  MONITOR[Logging + alerts live] --> GATE\n  GATE -->|yes| LAUNCH[Launch]\n  GATE -->|no| FIX[Fix or document risk acceptance]\n```\n\n### Worked example\n\n- [ ] No unresolved critical/high findings (or approved, time-limited exceptions)\n- [ ] Authorization matrix tests passing\n- [ ] TLS, HSTS, CSP and cookie flags verified\n- [ ] Secrets in vault; no secrets in repo history\n- [ ] Rate limits on login, signup, reset, OTP\n- [ ] Security logging to SIEM with alerts\n- [ ] Backups configured and restore tested\n- [ ] Incident contacts and runbook linked"}, {"id": 197, "title": "Security roadmap for a growing company", "tldr": "Prioritize security by stage: startups focus on identity (SSO, MFA), cloud basics, secrets, dependencies and backups; growing companies add SOC 2/ISO, AppSec automation, logging and IR; larger organizations build SOCs, detection engineering, GRC and specialized teams.", "real": "The CIS Controls define Implementation Groups (IG1, IG2, IG3) that scale safeguards from essential cyber hygiene for small organizations to advanced controls for mature ones.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Stage-appropriate security priorities |\n| Why it matters | Avoids overbuilding early or underbuilding later |\n| Baseline | CIS IG1 essential hygiene |\n| Watch out for | Buying advanced tools before basics like MFA and backups |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  S1[Startup: SSO + MFA, cloud guardrails, secrets, SCA, backups] --> S2[Growth: SOC 2/ISO, SAST/DAST, SIEM, IR plan, champions]\n  S2 --> S3[Scale: SOC, detection engineering, red team, GRC, privacy program]\n```\n\n### Worked example\n\n| Stage | Top 5 priorities |\n|---|---|\n| 10–50 people | SSO + MFA everywhere, password manager, cloud guardrails, dependency scanning, backups |\n| 50–300 people | SOC 2, central logging, EDR, AppSec pipeline, incident response plan |\n| 300+ people | 24/7 detection, threat modeling program, vendor risk, privacy engineering, red teaming |"}, {"id": 198, "title": "Security careers and certifications", "tldr": "Build a security career on fundamentals (networking, operating systems, programming, cloud) plus hands-on practice in labs and real projects. Certifications can structure learning and help hiring, but demonstrable skills matter most.", "real": "Widely recognized certifications include CompTIA Security+ (entry level), ISC2 CISSP (management and broad knowledge), OSCP (hands-on penetration testing), cloud security certifications from AWS, Azure and Google, and GIAC certifications for specialized areas.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Paths into and through security careers |\n| Why it matters | Guides learning investment |\n| Foundations | Networking, Linux/Windows, scripting, cloud, web |\n| Watch out for | Certifications without practical experience |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BASE[Fundamentals: networks, OS, code, cloud] --> ENTRY[Entry: SOC analyst, junior AppSec, IT security]\n  ENTRY --> SPEC[Specialize: AppSec, cloud, IR, pentest, GRC]\n  SPEC --> SENIOR[Senior / architect]\n  SENIOR --> LEAD[Security leadership / CISO]\n```\n\n### Worked example\n\n| Path | Hands-on practice |\n|---|---|\n| AppSec | OWASP Juice Shop and WebGoat (intentionally vulnerable training apps), secure code reviews |\n| Cloud security | Build and audit a landing zone in a sandbox account |\n| SOC / IR | Detection labs, Sigma rules, tabletop exercises |\n| GRC | Map controls to ISO 27001 for a sample company |"}, {"id": 199, "title": "Learning roadmap and reading list", "tldr": "Learn in layers: fundamentals and cryptography, identity, web and API security, secure SDLC and testing, cloud and infrastructure, operations and incident response, then governance and emerging areas, practicing each in safe, legal lab environments.", "real": "Free resources such as the OWASP Cheat Sheet Series, OWASP ASVS, NIST CSF 2.0, CIS Controls, MITRE ATT&CK and CISA advisories cover most of this course’s topics in depth.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structured path through security |\n| Why it matters | Security is broad; order helps |\n| Practice | Intentionally vulnerable labs you own or are authorized to use |\n| Watch out for | Testing systems without permission (illegal and unethical) |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  L1[Foundations + crypto] --> L2[Identity + access]\n  L2 --> L3[Web + API security]\n  L3 --> L4[Secure SDLC + testing]\n  L4 --> L5[Cloud + infrastructure]\n  L5 --> L6[SecOps + incident response]\n  L6 --> L7[GRC + privacy + AI security]\n```\n\n### Worked example\n\n| Stage | Resource | Project |\n|---|---|---|\n| Web security | OWASP Top 10, Cheat Sheets | Fix vulnerabilities in a training app |\n| Requirements | OWASP ASVS 5.0 | Assess your own app at Level 1 |\n| Threat modeling | Shostack’s four questions | Threat model a feature you built |\n| Cloud | CIS Benchmarks | Harden a sandbox account |\n| Operations | MITRE ATT&CK, Sigma | Write and test five detections |\n| Governance | NIST CSF 2.0 | Map your organization’s controls |"}, {"id": 200, "title": "Glossary", "tldr": "A shared vocabulary for cybersecurity and application security, covering the key terms used throughout this course.", "real": "Consistent terminology between engineering, security, legal and leadership teams speeds incident response and decision-making, which is why frameworks such as NIST maintain glossaries of security terms.", "body": "### Diagram\n\n```mermaid\nflowchart LR\n  FOUND[Foundations] --> APP[Application security]\n  APP --> OPS[Operations]\n  OPS --> GOV[Governance]\n```\n\n### Glossary\n\n| Term | Meaning |\n|---|---|\n| CIA triad | Confidentiality, integrity, availability |\n| Vulnerability / CVE | Weakness / public identifier for a known vulnerability |\n| CWE | Category of software weakness |\n| MFA / passkey | Multiple factors / phishing-resistant FIDO credential |\n| Zero trust | No implicit trust; verify every request |\n| IDOR / BOLA | Object access without ownership checks |\n| XSS | Script injection into web pages |\n| CSRF | Forged requests using a victim’s session |\n| SSRF | Server tricked into requesting attacker-chosen URLs |\n| CSP | Browser policy restricting content sources |\n| SAST / DAST / SCA | Code analysis / runtime testing / dependency analysis |\n| SBOM | Software bill of materials |\n| SLSA | Supply-chain build integrity framework |\n| EDR / SIEM / SOAR | Endpoint detection / log analysis / automation |\n| MTTD / MTTR | Mean time to detect / respond |\n| KEV / EPSS / CVSS | Exploited list / exploit likelihood / severity score |\n| DLP | Data loss prevention |\n| RPO / RTO | Acceptable data loss / downtime |\n| ISMS | Information security management system (ISO 27001) |\n| Threat model | Structured analysis of what can go wrong in a design |"}];
const PARTS = ["Security foundations", "Cryptography essentials", "Identity and access", "Network security", "Web application security fundamentals", "Injection and cross-site scripting", "Access control and business logic", "API security", "Secure development lifecycle", "Application security testing", "Software supply chain security", "Cloud and container security", "Endpoint and infrastructure security", "Security operations and incident response", "Threat landscape", "Data protection and privacy", "Governance, risk and compliance", "AI and emerging security", "Breach case studies", "Capstones and mastery"];
const TOTAL = 200, PER = 10;
function idsOf(p){ const a = []; for (let i = (p-1)*PER + 1; i <= p*PER; i++) a.push(i); return a; }
const partOf = id => Math.ceil(id / PER);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "cyber-appsec-progress-v1";
const LS_LAST = "cyber-appsec-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try{ await dbRef.set({done:[...done].sort((a,b)=>a-b), updated:Date.now()}); }
  catch(e){ if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; pushRemote(); }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...done])); }catch(e){} }
function toggle(id){
  if (done.has(id)) done.delete(id); else done.add(id);
  saveLocal(); pushRemote(); renderAll();
  toast(done.has(id) ? "Chapter " + id + " marked complete" : "Chapter " + id + " marked not complete");
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(s){
  if (window.marked && marked.parse){
    const html = marked.parse(s, {gfm:true, headerIds:false, mangle:false});
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  }
  return "<pre>" + esc(s) + "</pre>";
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function currentId(){
  const m = location.hash.match(/^#ch-(\d{1,3})$/);
  const n = m ? +m[1] : 0;
  return n >= 1 && n <= TOTAL ? n : 0;
}

/* ---------- header memory bank ---------- */
function renderBank(){
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    html += '<div class="bank-group" title="Part ' + p + ': ' + esc(PARTS[p-1]) + '">';
    for (const i of idsOf(p)){
      html += '<button class="cell' + (done.has(i) ? " done" : "") + (i === cur ? " here" : "") +
        '" data-go="' + i + '" aria-label="Chapter ' + i + (done.has(i) ? ", complete" : "") + '"></button>';
    }
    html += "</div>";
  }
  document.getElementById("bank").innerHTML = html;
  document.getElementById("doneCount").textContent = done.size;
  document.getElementById("pct").textContent = Math.round(done.size * 100 / TOTAL) + "%";
}

/* ---------- sidebar ---------- */
const openParts = new Set();
function renderSide(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const matches = ids.filter(i => !q || byId[i].title.toLowerCase().includes(q) || byId[i].tldr.toLowerCase().includes(q) || String(i) === q);
    if (q && !matches.length) continue;
    const count = ids.filter(i => done.has(i)).length;
    const open = q || openParts.has(p) || partOf(cur) === p;
    html += '<div class="part' + (open ? " open" : "") + '">' +
      '<button class="part-head" data-part="' + p + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="part-num">' + String(p).padStart(2, "0") + '</span>' +
      '<span class="part-name">' + esc(PARTS[p-1]) + '</span>' +
      '<span class="part-count' + (count === PER ? " full" : "") + '">' + count + '/' + PER + '</span></button><ul class="part-list">';
    for (const i of matches){
      html += '<li class="ch-row' + (i === cur ? " active" : "") + '">' +
        '<button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="' + (done.has(i) ? "Mark chapter " + i + " not complete" : "Mark chapter " + i + " complete") + '">' + TICK + '</button>' +
        '<a href="#ch-' + i + '"><span class="n">' + i + '.</span>' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ul></div>";
  }
  if (!html) html = '<p style="color:var(--muted);font-size:14px;padding:8px">No chapters match that search. Try a shorter word like “XSS”, “MFA” or “SBOM”.</p>';
  document.getElementById("parts").innerHTML = html;
}

/* ---------- diagrams and charts ---------- */
let mermaidPromise = null, renderSeq = 0;
const svgCache = new Map();
function isDark(){
  const a = document.documentElement.getAttribute("data-theme");
  if (a) return a === "dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function ensureMermaid(){
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (mermaidPromise) return mermaidPromise;
  mermaidPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js";
    s.onload = () => {
      try{
        window.mermaid.initialize({ startOnLoad:false, securityLevel:"strict", theme: isDark() ? "dark" : "neutral",
          fontFamily:"IBM Plex Sans, system-ui, sans-serif", flowchart:{ curve:"basis", htmlLabels:true } });
        resolve(window.mermaid);
      }catch(e){ reject(e); }
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return mermaidPromise;
}
function fitSvg(div){
  const svg = div.querySelector("svg");
  if (!svg) return;
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Diagram");
  const vb = (svg.getAttribute("viewBox") || "").split(/\s+/).map(Number);
  const vbw = vb[2] || 0;
  if (vbw && div.clientWidth && div.clientWidth < vbw * 0.7){
    svg.style.maxWidth = "none";
    svg.style.width = Math.round(vbw * 0.85) + "px";
  }
}
function fmtNum(v){ return Number(v).toLocaleString("en-US", { maximumFractionDigits: 3 }); }
function renderChart(el, spec){
  const max = Math.max(...spec.data.map(d => d[1]));
  const unit = spec.unit || "";
  const sep = (unit === "%" || unit === "×") ? "" : " ";
  let rows = "";
  for (const [label, v] of spec.data){
    let w = spec.log ? (Math.log10(v + 1) / Math.log10(max + 1)) * 100 : (v / max) * 100;
    w = Math.max(w, 1.5);
    rows += '<div class="bar-row"><span class="bar-label">' + esc(String(label)) + '</span><span class="bar-track"><span class="bar" style="width:' + w.toFixed(1) + '%"></span></span><span class="bar-val">' + fmtNum(v) + sep + esc(unit) + '</span></div>';
  }
  const fig = document.createElement("figure");
  fig.className = "chart";
  fig.innerHTML = '<figcaption>' + esc(spec.title || "") + '</figcaption>' + rows + (spec.log ? '<div class="chart-note">Bar lengths use a logarithmic scale.</div>' : "");
  el.replaceWith(fig);
}
function enhance(root){
  root.querySelectorAll("code.language-chart").forEach(code => {
    const pre = code.closest("pre") || code;
    try{ renderChart(pre, JSON.parse(code.textContent)); }catch(e){}
  });
  const blocks = [...root.querySelectorAll("code.language-mermaid")];
  if (!blocks.length) return;
  const seq = ++renderSeq;
  const holders = blocks.map(code => {
    const pre = code.closest("pre") || code;
    const div = document.createElement("div");
    div.className = "diagram loading";
    div.textContent = "Loading diagram…";
    div.dataset.src = code.textContent;
    pre.replaceWith(div);
    if (svgCache.has(div.dataset.src)){ div.classList.remove("loading"); div.innerHTML = svgCache.get(div.dataset.src); div.dataset.done = "1"; fitSvg(div); }
    return div;
  }).filter(div => !div.dataset.done);
  if (!holders.length) return;
  ensureMermaid().then(async m => {
    for (let k = 0; k < holders.length; k++){
      const div = holders[k];
      if (seq !== renderSeq || !div.isConnected) return;
      const id = "mmd-" + seq + "-" + k;
      try{
        const out = await m.render(id, div.dataset.src);
        if (!div.isConnected) return;
        div.classList.remove("loading");
        div.innerHTML = out.svg;
        svgCache.set(div.dataset.src, out.svg);
        fitSvg(div);
      }catch(e){
        const junk = document.getElementById("d" + id); if (junk) junk.remove();
        div.classList.remove("loading");
        div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>";
      }
    }
  }).catch(() => {
    holders.forEach(div => { div.classList.remove("loading"); div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>"; });
  });
}

/* ---------- chapter view ---------- */
function renderChapter(id){
  const c = byId[id];
  const p = partOf(id);
  const ids = idsOf(p);
  const isDone = done.has(id);
  const tabs = ids.map(i =>
    '<button class="tab' + (i === id ? " active" : "") + '" role="tab" aria-selected="' + (i === id) + '" data-go="' + i + '">' +
    '<span class="dot' + (done.has(i) ? " on" : "") + '"></span><span class="tab-t">' + i + '. ' + esc(byId[i].title) + '</span></button>'
  ).join("");
  document.getElementById("main").innerHTML =
    '<p class="crumb">Part ' + p + ' of 20: ' + esc(PARTS[p-1]) + '</p>' +
    '<div class="tabs" role="tablist" aria-label="Chapters in this part">' + tabs + '</div>' +
    '<article>' +
      '<p class="ch-no">Chapter ' + id + ' of ' + TOTAL + '</p>' +
      '<h1 class="ch-title">' + esc(c.title) + '</h1>' +
      '<section class="box tldr"><h2>TL;DR</h2><p>' + inlineMd(c.tldr) + '</p></section>' +
      '<div class="body">' + md(c.body) + '</div>' +
      '<section class="box real"><h2>Real-world example</h2><p>' + inlineMd(c.real) + '</p></section>' +
      '<div class="done-bar">' +
        '<button class="complete' + (isDone ? " on" : "") + '" data-toggle="' + id + '" aria-pressed="' + isDone + '">' +
          '<span class="tick' + (isDone ? " on" : "") + '">' + TICK + '</span>' + (isDone ? "Completed" : "Mark as complete") + '</button>' +
        '<div class="nav">' +
          '<button class="btn" data-go="' + (id - 1) + '"' + (id === 1 ? " disabled" : "") + '>Previous</button>' +
          '<button class="btn" data-go="' + (id + 1) + '"' + (id === TOTAL ? " disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  enhance(document.getElementById("main"));
}

/* ---------- contents view ---------- */
function renderContents(){
  let html = '<div class="contents"><h1>Contents</h1>' +
    '<p class="lead">A defensive security course in twenty parts: foundations, cryptography, identity, network security, web and API security, injection and access control, secure SDLC, testing, supply chain, cloud and containers, endpoints, security operations, threats, data protection and privacy, GRC, AI security, ten breach case studies and capstones. Every chapter has an engineering card, a diagram and a worked example (secure code, configuration, rule or calculation). Practice only on systems you own or are authorized to test. Tick a chapter when you finish it; your progress is saved.</p>' +
    '<div class="contents-actions"><button class="btn" data-go="' + firstUnread() + '">' + (done.size ? "Continue with chapter " + firstUnread() : "Start chapter 1") + '</button>' +
    '<button class="btn" id="resetBtn">Reset progress</button></div><div class="grid">';
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const count = ids.filter(i => done.has(i)).length;
    html += '<section class="pcard"><h2>Part ' + p + ': ' + esc(PARTS[p-1]) + '</h2><div class="meta">' + count + ' of ' + PER + ' complete</div><ol>';
    for (const i of ids){
      html += '<li><button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="Toggle chapter ' + i + '">' + TICK + '</button><a href="#ch-' + i + '">' + i + '. ' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ol></section>";
  }
  document.getElementById("main").innerHTML = html + "</div></div>";
}
function firstUnread(){ for (let i = 1; i <= TOTAL; i++) if (!done.has(i)) return i; return TOTAL; }

/* ---------- routing ---------- */
let lastRendered = null;
function renderAll(){
  const id = currentId();
  renderBank(); renderSide();
  const y = window.scrollY;
  if (id) renderChapter(id); else renderContents();
  if (lastRendered === location.hash) window.scrollTo(0, y);
  lastRendered = location.hash;
}
function route(){
  const id = currentId();
  if (!id && location.hash !== "#contents"){
    let last = 0; try{ last = +localStorage.getItem(LS_LAST) || 0; }catch(e){}
    location.replace("#ch-" + (last >= 1 && last <= TOTAL ? last : 1));
    return;
  }
  if (id){ try{ localStorage.setItem(LS_LAST, id); }catch(e){} }
  document.body.classList.remove("drawer");
  renderAll();
  window.scrollTo(0, 0);
  const active = document.querySelector(".ch-row.active");
  if (active) active.scrollIntoView({block:"nearest"});
  const tab = document.querySelector(".tab.active");
  if (tab && tab.parentElement){ const r = tab.parentElement; const left = tab.offsetLeft - r.offsetLeft; if (left < r.scrollLeft || left + tab.offsetWidth > r.scrollLeft + r.clientWidth) r.scrollLeft = left - 16; }
}
function go(id){ if (id >= 1 && id <= TOTAL) location.hash = "#ch-" + id; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){ e.preventDefault(); toggle(+t.dataset.toggle); return; }
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled){ go(+g.dataset.go); return; }
  const ph = e.target.closest("[data-part]");
  if (ph){
    const p = +ph.dataset.part;
    const el = ph.parentElement;
    const isOpen = el.classList.toggle("open");
    if (isOpen) openParts.add(p); else openParts.delete(p);
    ph.setAttribute("aria-expanded", isOpen);
    return;
  }
  if (e.target.id === "resetBtn"){
    if (confirm("Clear all 200 ticks? This can’t be undone.")){ done.clear(); saveLocal(); pushRemote(); renderAll(); toast("Progress reset"); }
  }
});
document.getElementById("search").addEventListener("input", renderSide);
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.add("drawer"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = currentId(); if (!id) return;
  if (e.key === "ArrowRight") go(id + 1);
  else if (e.key === "ArrowLeft") go(id - 1);
});
function setTopH(){ document.documentElement.style.setProperty("--top-h", document.getElementById("top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);
window.addEventListener("hashchange", route);
setTopH();
route();
initSync();
</script>
</body>
</html>

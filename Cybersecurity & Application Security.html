d example\n\n| Bad response | Good response |\n|---|---|\n| `psycopg2.errors.UndefinedColumn: column \"pasword\" does not exist at line 1 ...` | `{\"error\": \"Something went wrong\", \"request_id\": \"req_7f3a\"}` |\n| `Server: Apache/2.4.29 (Ubuntu)` | Version banner removed |"}, {"id": 50, "title": "Security misconfiguration", "tldr": "Many breaches stem from configuration, not code: default credentials, open admin panels, public storage buckets, debug modes, verbose errors, unnecessary services and missing patches. Harden defaults and scan configurations continuously.", "real": "Misconfigured cloud storage and databases exposed to the internet without authentication have caused numerous large data exposures, which is why cloud providers now block public bucket access by default for new resources.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Insecure settings in apps and infrastructure |\n| Why it matters | Easy for attackers to find and exploit |\n| Controls | Hardened templates, IaC scanning, CSPM, configuration reviews |\n| Watch out for | Settings changed manually during incidents and never reverted |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TEMPLATE[Hardened baseline templates] --> IAC[Infrastructure as code]\n  IAC --> SCAN[Policy-as-code scan in CI]\n  SCAN --> DEPLOY[Deploy]\n  DEPLOY --> CSPM[Continuous posture scanning]\n  CSPM -->|drift| FIX[Fix + update templates]\n```\n\n### Worked example\n\n| Misconfiguration | Fix |\n|---|---|\n| Admin panel reachable from the internet | Restrict to VPN/ZTNA + MFA |\n| Default admin password | Forced change; unique credentials |\n| Public storage bucket | Block public access at account level |\n| Directory listing enabled | Disable in web server config |"}, {"id": 51, "title": "Injection: the core idea", "tldr": "Injection happens when untrusted data is interpreted as code or commands by an interpreter: SQL, NoSQL, shell, templates, LDAP, XML parsers or browsers. The fix is always to keep data and code separate with safe APIs.", "real": "The 2023 MOVEit Transfer mass exploitation, attributed to the Cl0p group, used a SQL injection vulnerability (CVE-2023-34362) and affected thousands of organizations worldwide.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Data crossing into a code context |\n| Why it matters | Can lead to data theft or full compromise |\n| Universal fix | Parameterization / safe APIs that separate data from code |\n| Watch out for | Building queries or commands with string concatenation |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INPUT[Untrusted input] --> CONCAT{Combined with code by string concatenation?}\n  CONCAT -->|yes| VULN[Interpreter may execute attacker-controlled code]\n  CONCAT -->|no: passed as parameter| SAFE[Treated strictly as data]\n```\n\n### Worked example\n\n| Interpreter | Unsafe pattern | Safe pattern |\n|---|---|---|\n| SQL | f-string query | Parameterized query / ORM |\n| Shell | `os.system(f\"...{x}\")` | `subprocess.run([...])` without shell |\n| HTML | String concatenation into markup | Auto-escaping templates |\n| Templates | Rendering user input as a template | Passing input as template variables |"}, {"id": 52, "title": "SQL injection", "tldr": "SQL injection occurs when user input is concatenated into SQL statements, letting attackers change query logic. Use parameterized queries or ORMs everywhere, least-privilege database accounts and allow-lists for dynamic identifiers like sort columns.", "real": "SQL injection has appeared in every edition of the OWASP Top 10 and was behind major incidents such as the 2008 Heartland Payment Systems breach and the 2023 MOVEit exploitation.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Untrusted input altering SQL statements |\n| Why it matters | Data theft, modification, authentication bypass |\n| Fix | Parameterized queries; allow-lists for identifiers |\n| Watch out for | Dynamic ORDER BY and table names built from input |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  USER[Search term] --> APP[App]\n  APP -->|unsafe: string concatenation| DB1[(Database parses input as SQL)]\n  APP -->|safe: parameter binding| DB2[(Database treats input as a value)]\n```\n\n### Worked example\n\n```python\n# Vulnerable: input becomes part of the SQL text\ncur.execute(f\"SELECT id, name FROM products WHERE name LIKE '%{term}%'\")\n\n# Secure: input is bound as a parameter\ncur.execute(\"SELECT id, name FROM products WHERE name LIKE %s\", (f\"%{term}%\",))\n\n# Dynamic sort column: allow-list, never interpolate raw input\nSORTS = {\"name\": \"name\", \"price\": \"price_minor\", \"newest\": \"created_at DESC\"}\norder = SORTS.get(sort_param, \"name\")\ncur.execute(f\"SELECT id, name FROM products ORDER BY {order} LIMIT 50\")\n```"}, {"id": 53, "title": "NoSQL injection", "tldr": "NoSQL databases can also be injected when user input is passed as query objects, for example allowing query operators instead of plain values. Validate types strictly, build queries from validated fields and avoid server-side JavaScript evaluation.", "real": "OWASP’s Web Security Testing Guide includes NoSQL injection testing, noting that applications passing unvalidated JSON request bodies directly into MongoDB queries can have their query logic changed.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Input altering NoSQL query structure |\n| Why it matters | Authentication bypass, data exposure |\n| Fix | Strict type validation; construct queries explicitly |\n| Watch out for | Passing request JSON directly as a query filter |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BODY[Request JSON] --> VALIDATE[Validate: fields must be strings]\n  VALIDATE -->|object or operator received| REJECT[Reject 400]\n  VALIDATE -->|plain strings| QUERY[Build query from validated values]\n```\n\n### Worked example\n\n```python\nfrom pydantic import BaseModel, StrictStr\n\nclass Login(BaseModel):\n    username: StrictStr      # rejects objects/dicts, only plain strings allowed\n    password: StrictStr\n\ndef find_user(body: dict):\n    data = Login.model_validate(body)\n    return users.find_one({\"username\": data.username})   # filter built from validated string\n```"}, {"id": 54, "title": "OS command injection", "tldr": "Command injection happens when input reaches a shell. Avoid shells entirely: call programs with argument lists, use library functions instead of shell commands, validate inputs with allow-lists and run with least privilege.", "real": "Command injection vulnerabilities in network appliances and management interfaces have repeatedly appeared in CISA’s Known Exploited Vulnerabilities catalog, often granting attackers full device control.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Input executed by a system shell |\n| Why it matters | Full server compromise |\n| Fix | No shell; argument arrays; native libraries |\n| Watch out for | shell=True, os.system, backticks in scripts |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INPUT[Hostname from user] --> CHOICE{How is it executed?}\n  CHOICE -->|shell string| SHELL[Shell parses metacharacters: unsafe]\n  CHOICE -->|argument list| EXEC[Program receives one literal argument: safe]\n```\n\n### Worked example\n\n```python\nimport re, subprocess\n\n# Vulnerable: input is parsed by a shell\n# os.system(f\"ping -c 1 {host}\")\n\n# Secure: validate + argument list, no shell\nif not re.fullmatch(r\"[A-Za-z0-9.-]{1,253}\", host):\n    raise ValueError(\"Invalid hostname\")\nresult = subprocess.run([\"ping\", \"-c\", \"1\", host], capture_output=True, text=True, timeout=5)\n```"}, {"id": 55, "title": "Cross-site scripting: overview", "tldr": "XSS occurs when untrusted data is placed into a web page in a way the browser executes as script, letting attackers act as the victim in that site. Types: stored, reflected and DOM-based. Defenses: contextual output encoding, safe DOM APIs, CSP and HttpOnly cookies.", "real": "The 2005 Samy worm on MySpace used a stored XSS flaw to add over a million friend requests in about 20 hours, an early demonstration of how XSS can spread.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Script injection into web pages |\n| Why it matters | Account actions, data theft within the victim’s session |\n| Types | Stored, reflected, DOM-based |\n| Watch out for | Disabling template auto-escaping for convenience |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  XSS[XSS types] --> STORED[Stored: saved in DB, shown to others]\n  XSS --> REFLECTED[Reflected: echoed from request]\n  XSS --> DOM[DOM-based: client-side JS writes unsafe HTML]\n  STORED --> FIX[Contextual encoding + safe DOM APIs + CSP]\n  REFLECTED --> FIX\n  DOM --> FIX\n```\n\n### Worked example\n\n| Context | Correct handling |\n|---|---|\n| HTML text | HTML-encode (templates do this automatically) |\n| HTML attribute | Attribute-encode and quote attributes |\n| JavaScript data | Serialize as JSON into a data attribute or script type=application/json |\n| URL | URL-encode; allow only http/https schemes |"}, {"id": 56, "title": "Preventing XSS on the server", "tldr": "Use templating engines with automatic contextual escaping, never mark untrusted content as safe, sanitize rich HTML with a proven sanitizer, and validate URLs before putting them in links.", "real": "Modern frameworks such as Django, Rails, React and Angular escape output by default, which significantly reduced XSS rates; most remaining XSS bugs come from explicit escape bypasses.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Server-side rendering without XSS |\n| Why it matters | Stored XSS affects every viewer |\n| Tools | Auto-escaping templates, HTML sanitizers (e.g. nh3/bleach, DOMPurify on client) |\n| Watch out for | Jinja’s safe filter, `mark_safe`, `html_safe`, `dangerouslySetInnerHTML` |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  COMMENT[User comment] --> STORE[(Stored as plain text)]\n  STORE --> TEMPLATE[Template with auto-escaping]\n  TEMPLATE --> PAGE[Rendered as text, not markup]\n  RICH[Rich text needed?] --> SANITIZE[Allow-list sanitizer]\n```\n\n### Worked example\n\n```python\nfrom markupsafe import escape\n\ncomment = \"<b>Great product<\/b>\"\nprint(escape(comment))      # &lt;b&gt;Great product&lt;/b&gt;  → displayed as text\n\n# Jinja2: autoescape on by default for .html templates in Flask\n# {{ comment }}        safe: escaped\n# {{ comment|safe }}   unsafe for untrusted input\n```"}, {"id": 57, "title": "DOM-based XSS and safe client-side code", "tldr": "DOM XSS happens when JavaScript writes untrusted data into dangerous sinks such as innerHTML, document.write, eval or javascript: URLs. Use textContent, safe framework bindings, sanitizers for HTML and Trusted Types to lock down sinks.", "real": "Google deployed Trusted Types across many of its web applications and reported that it greatly reduced DOM XSS, and Chromium-based browsers support Trusted Types enforcement via CSP.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Client-side injection into the DOM |\n| Why it matters | Bypasses server-side defenses |\n| Safe APIs | textContent, setAttribute (non-URL attributes), framework bindings |\n| Watch out for | innerHTML with untrusted strings; eval |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SRC[Untrusted source: URL, message, API data] --> SINK{Sink}\n  SINK -->|innerHTML, eval| DANGER[Dangerous]\n  SINK -->|textContent| SAFE[Safe]\n  DANGER --> FIX[Sanitize or switch to safe API]\n```\n\n### Worked example\n\n```javascript\nconst name = new URLSearchParams(location.search).get(\"name\") ?? \"\";\n\n// Unsafe: interprets markup\n// greeting.innerHTML = \"Hello \" + name;\n\n// Safe: treats input as text\ngreeting.textContent = \"Hello \" + name;\n```"}, {"id": 58, "title": "Content Security Policy", "tldr": "CSP tells browsers which sources of scripts, styles, frames and other content are allowed, limiting the impact of XSS. Strict CSPs use nonces or hashes for scripts and disallow inline event handlers and eval.", "real": "Google’s research on CSP adoption (2016) found most deployed policies could be bypassed, leading to the “strict CSP” approach based on nonces and `'strict-dynamic'` now recommended by browser vendors.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Browser-enforced content restrictions |\n| Why it matters | Defense in depth against XSS |\n| Strict CSP | Nonce per response + `'strict-dynamic'`, no `'unsafe-inline'` |\n| Watch out for | Allow-lists of large CDNs that host attacker-usable scripts |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SERVER[Server generates random nonce] --> HEADER[CSP header with nonce]\n  SERVER --> HTML[Script tags carry same nonce]\n  HEADER --> BROWSER[Browser]\n  HTML --> BROWSER\n  BROWSER -->|nonce matches| RUN[Run script]\n  BROWSER -->|injected script without nonce| BLOCK[Block]\n```\n\n### Worked example\n\n```http\nContent-Security-Policy: script-src 'nonce-R4nd0mPerResponse' 'strict-dynamic'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'\n```\n\n```html\n<script nonce=\"R4nd0mPerResponse\" src=\"/static/app.js\"><\/script>\n```\n\nStart with Content-Security-Policy-Report-Only to find violations before enforcing."}, {"id": 59, "title": "Template injection and unsafe deserialization", "tldr": "Rendering user input as a template, or deserializing untrusted data with formats that can instantiate arbitrary objects (Python pickle, Java native serialization), can lead to code execution. Pass user data only as template variables and use data-only formats like JSON.", "real": "Java deserialization vulnerabilities, publicized widely in 2015 with libraries such as Apache Commons Collections, affected many enterprise products, and Python’s documentation warns never to unpickle data from untrusted sources.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Untrusted data treated as code during rendering or parsing |\n| Why it matters | Remote code execution |\n| Fix | Templates from code only; JSON for untrusted data; signed data if needed |\n| Watch out for | pickle.loads on cookies, caches or uploads |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INPUT[Untrusted input] --> TPL{Used as template source?}\n  TPL -->|yes| BAD1[Unsafe]\n  TPL -->|no: passed as variable| OK1[Safe]\n  INPUT --> DESER{Deserialized with pickle / native objects?}\n  DESER -->|yes| BAD2[Unsafe]\n  DESER -->|no: JSON| OK2[Safe]\n```\n\n### Worked example\n\n```python\nfrom flask import render_template_string\nimport json\n\n# Unsafe: user input becomes the template itself\n# render_template_string(\"Hello \" + request.args[\"name\"])\n\n# Safe: template is fixed; input is a variable\nrender_template_string(\"Hello {{ name }}\", name=request.args.get(\"name\", \"\"))\n\n# Unsafe: pickle.loads(untrusted_bytes)\n# Safe: data-only parsing\npayload = json.loads(untrusted_text)\n```"}, {"id": 60, "title": "XML external entities and path traversal", "tldr": "XML parsers with external entities enabled can read local files or make network requests; disable DTDs and entities or use hardened parsers. Path traversal uses ../ sequences to escape intended directories; resolve paths and verify they stay inside the allowed base.", "real": "XXE was a separate OWASP Top 10 category in 2017 (merged into misconfiguration in 2021), and path traversal (CWE-22) regularly appears in MITRE’s lists of the most dangerous software weaknesses.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Parser and file-path abuse |\n| Why it matters | File disclosure, SSRF, overwriting files |\n| Fixes | Hardened XML parsers (defusedxml); path resolution + containment checks |\n| Watch out for | Joining user-supplied filenames to directories |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  NAME[Requested filename] --> JOIN[Join with base directory]\n  JOIN --> RESOLVE[Resolve to absolute path]\n  RESOLVE --> CHECK{Inside base directory?}\n  CHECK -->|yes| SERVE[Serve file]\n  CHECK -->|no| DENY[Reject]\n```\n\n### Worked example\n\n```python\nfrom pathlib import Path\nimport defusedxml.ElementTree as ET\n\nBASE = Path(\"/srv/app/reports\").resolve()\n\ndef safe_report_path(name: str) -> Path:\n    path = (BASE / name).resolve()\n    if not path.is_relative_to(BASE):           # Python 3.9+\n        raise PermissionError(\"Invalid path\")\n    return path\n\ntree = ET.fromstring(xml_bytes)                  # defusedxml blocks entity expansion attacks\n```"}, {"id": 61, "title": "Broken access control", "tldr": "Broken access control lets users act outside their permissions: viewing others’ data, using admin functions or modifying records they don’t own. Enforce authorization server-side on every request, deny by default and test it explicitly.", "real": "Broken access control moved to first place in the OWASP Top 10 in 2021, with OWASP reporting that 94% of tested applications had some form of it.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Missing or flawed permission checks |\n| Why it matters | Most common critical web vulnerability class |\n| Fix | Central authorization, deny by default, per-object checks |\n| Watch out for | Hiding buttons in the UI instead of checking on the server |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REQ[Request] --> AUTHN[Authenticated?]\n  AUTHN -->|no| D1[401]\n  AUTHN -->|yes| FUNC{Allowed to use this function?}\n  FUNC -->|no| D2[403]\n  FUNC -->|yes| OBJ{Allowed on this specific object?}\n  OBJ -->|no| D3[404 or 403]\n  OBJ -->|yes| OK[Process]\n```\n\n### Worked example\n\n| Check level | Example |\n|---|---|\n| Function level | Only admins call DELETE /users/{id} |\n| Object level | User can read only their own invoices |\n| Field level | Users can’t set their own role or price |"}, {"id": 62, "title": "Insecure direct object references", "tldr": "IDOR (called BOLA in APIs) happens when an app uses identifiers from the request to fetch objects without checking the requester owns or may access them. Always scope queries to the authenticated user or tenant.", "real": "The 2022 Optus breach in Australia, affecting about 9.8 million customers, involved an internet-facing API that returned customer data without proper access controls, with sequential identifiers making bulk retrieval easy.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Object access without ownership checks |\n| Why it matters | Mass data exposure through simple ID changes |\n| Fix | Query by ID and owner/tenant; return 404 when not accessible |\n| Watch out for | Assuming random IDs are enough (they reduce but don’t replace checks) |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REQ[GET /invoices/1043 by user A] --> QUERY[SELECT where id=1043 AND owner=A]\n  QUERY -->|found| RETURN[Return invoice]\n  QUERY -->|not found| NOTFOUND[404]\n```\n\n### Worked example\n\n```python\n# Vulnerable: fetches any invoice by ID\n# invoice = db.fetch_one(\"SELECT * FROM invoices WHERE id = %s\", (invoice_id,))\n\n# Secure: scoped to the authenticated user\ninvoice = db.fetch_one(\n    \"SELECT * FROM invoices WHERE id = %s AND customer_id = %s\",\n    (invoice_id, current_user.customer_id),\n)\nif invoice is None:\n    raise NotFound()\n```"}, {"id": 63, "title": "Function-level authorization and privilege escalation", "tldr": "Privilege escalation occurs when users reach functions meant for higher roles, such as admin endpoints left unprotected or role checks only in the frontend. Protect every route with explicit role checks and test with lower-privileged accounts.", "real": "OWASP’s API Security Top 10 (2023) lists broken function level authorization (API5) as a top risk, noting that admin endpoints are often discoverable and insufficiently protected.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Users invoking functions beyond their role |\n| Why it matters | Account takeover, data manipulation |\n| Fix | Decorators/middleware enforcing roles on every route |\n| Watch out for | “Hidden” admin URLs without server-side checks |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ROUTE[Every route] --> POLICY[Declared required permission]\n  POLICY --> MIDDLEWARE[Authorization middleware]\n  MIDDLEWARE -->|missing permission| DENY[403]\n  MIDDLEWARE -->|ok| HANDLER[Handler]\n  CI[CI check: routes without permission declaration fail build] -.-> ROUTE\n```\n\n### Worked example\n\n```python\nfrom functools import wraps\n\ndef require(permission: str):\n    def decorator(fn):\n        @wraps(fn)\n        def wrapper(*args, user, **kwargs):\n            if permission not in user.permissions:\n                raise PermissionError(f\"Missing permission: {permission}\")\n            return fn(*args, user=user, **kwargs)\n        return wrapper\n    return decorator\n\n@require(\"users:delete\")\ndef delete_user(user_id: str, *, user):\n    ...\n```"}, {"id": 64, "title": "Mass assignment", "tldr": "Mass assignment occurs when frameworks bind request fields directly to data models, letting users set fields they shouldn’t, such as role, balance or owner. Use explicit input schemas with allow-listed fields for each operation.", "real": "In 2012 a researcher used a mass assignment flaw in GitHub’s Rails application to add his SSH key to the Rails organization, prompting Rails to adopt “strong parameters” by default.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Unintended fields set through request binding |\n| Why it matters | Privilege escalation, data tampering |\n| Fix | Per-endpoint input models; reject unknown fields |\n| Watch out for | `Model.update(**request.json)` |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BODY[Request body: name, email, role=admin] --> SCHEMA[Input schema: name, email only]\n  SCHEMA -->|extra field| REJECT[Reject 422]\n  SCHEMA -->|allowed fields| UPDATE[Update profile]\n```\n\n### Worked example\n\n```python\nfrom pydantic import BaseModel, ConfigDict, EmailStr\n\nclass ProfileUpdate(BaseModel):\n    model_config = ConfigDict(extra=\"forbid\")   # role, plan, owner_id are rejected\n    display_name: str | None = None\n    email: EmailStr | None = None\n\nupdate = ProfileUpdate.model_validate(request_json)\nuser.apply(update.model_dump(exclude_unset=True))\n```"}, {"id": 65, "title": "Business logic flaws", "tldr": "Logic flaws abuse legitimate features in unintended ways: negative quantities, coupon stacking, skipping workflow steps, changing prices client-side. They require understanding the business rules and enforcing invariants on the server.", "real": "OWASP’s API Security Top 10 (2023) added “Unrestricted Access to Sensitive Business Flows” (API6), covering abuse such as automated ticket scalping and mass account creation that exploits legitimate functionality.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Abuse of valid functionality |\n| Why it matters | Scanners rarely find it; financial losses |\n| Fix | Server-side invariants, state machines, threat modeling of flows |\n| Watch out for | Trusting prices, quantities or step order from the client |\n\n### Diagram\n\n```mermaid\nstateDiagram-v2\n  [*] --> Cart\n  Cart --> Shipping: address validated\n  Shipping --> Payment: shipping cost computed server-side\n  Payment --> Confirmed: payment verified by provider webhook\n  Confirmed --> [*]\n```\n\n### Worked example\n\n| Abuse case | Server-side rule |\n|---|---|\n| Quantity −5 to reduce total | quantity ≥ 1 and ≤ stock limit |\n| Price sent from browser | Price looked up server-side |\n| Same coupon applied 3 times | One use per order, per account |\n| Skip payment step via direct URL | Order state machine enforces sequence |"}, {"id": 66, "title": "Race conditions", "tldr": "Race conditions occur when concurrent requests interleave unexpectedly, such as redeeming one gift card twice or withdrawing more than a balance. Use atomic database operations, transactions with proper isolation, locks or unique constraints.", "real": "Research presented at Black Hat USA 2023 (“Smashing the state machine”, PortSwigger) showed many web applications were vulnerable to race conditions such as multiple redemptions of single-use codes.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Time-of-check vs time-of-use flaws |\n| Why it matters | Double spending, limit bypass |\n| Fix | Atomic updates, unique constraints, row locks, idempotency |\n| Watch out for | Read-then-write logic in application code |\n\n### Diagram\n\n```mermaid\nsequenceDiagram\n  participant R1 as Request 1\n  participant R2 as Request 2\n  participant DB\n  R1->>DB: check balance = 100\n  R2->>DB: check balance = 100\n  R1->>DB: withdraw 100\n  R2->>DB: withdraw 100\n  Note over DB: Balance −100 without atomic update\n```\n\n### Worked example\n\n```sql\n-- Atomic: succeeds only if enough balance remains at the moment of update\nUPDATE wallets SET balance = balance - 100\nWHERE user_id = $1 AND balance >= 100;\n-- 0 rows updated → insufficient funds\n\n-- One-time codes: enforce uniqueness at the database level\nCREATE UNIQUE INDEX one_redemption_per_code ON redemptions (code);\n```"}, {"id": 67, "title": "Rate limiting and abuse prevention", "tldr": "Rate limits protect against brute force, credential stuffing, scraping and resource exhaustion. Apply limits per account, IP, API key and endpoint, stricter on login, signup, password reset and OTP verification.", "real": "OWASP’s API Security Top 10 (2023) lists unrestricted resource consumption (API4) as a key risk, covering missing limits that enable denial of service and cost explosions.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Controlling request frequency |\n| Why it matters | Stops automated attacks and abuse |\n| Dimensions | Account, IP, device, API key, endpoint |\n| Watch out for | OTP verification without attempt limits |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REQ[Login attempt] --> ACCT{Account attempts in 15 min under 5?}\n  ACCT -->|no| SLOW[Delay / CAPTCHA / lock temporarily]\n  ACCT -->|yes| IP{IP attempts under 50?}\n  IP -->|no| BLOCK[429]\n  IP -->|yes| CHECK[Verify credentials]\n```\n\n### Worked example\n\n| Endpoint | Limit |\n|---|---|\n| POST /login | 5 per account per 15 min; 50 per IP per 15 min |\n| POST /otp/verify | 5 attempts per code, then new code required |\n| POST /password-reset | 3 per account per hour |\n| GET /api/* | 600 per API key per minute |\n\nA 6-digit OTP has 1,000,000 possibilities; with 5 attempts per code the guessing chance is 5 in 1,000,000 (0.0005%)."}, {"id": 68, "title": "Account recovery security", "tldr": "Password reset and account recovery are often weaker than login. Use single-use, short-lived, high-entropy reset tokens; don’t reveal whether accounts exist; notify users of changes; and require strong verification before resetting MFA.", "real": "Social engineering of help desks to reset credentials or MFA was a key technique in the 2023 MGM Resorts and Caesars incidents, highlighting recovery processes as a critical attack surface.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Securing “forgot password” and MFA reset |\n| Why it matters | Attackers target the weakest path to an account |\n| Controls | Random single-use tokens, expiry, notifications, verified MFA resets |\n| Watch out for | Security questions; help desks resetting MFA by phone |\n\n### Diagram\n\n```mermaid\nsequenceDiagram\n  participant U as User\n  participant A as App\n  U->>A: Request reset for email\n  A-->>U: Same message whether or not account exists\n  A->>U: Email with single-use token, 30-minute expiry\n  U->>A: New password + token\n  A->>A: Verify token, invalidate token + all sessions\n  A->>U: Notify: password changed\n```\n\n### Worked example\n\n```python\nimport secrets, hashlib\nfrom datetime import datetime, timedelta, timezone\n\ntoken = secrets.token_urlsafe(32)                         # sent to user by email\ntoken_hash = hashlib.sha256(token.encode()).hexdigest()   # only the hash is stored\nexpires_at = datetime.now(timezone.utc) + timedelta(minutes=30)\n```"}, {"id": 69, "title": "Multi-tenant isolation", "tldr": "SaaS applications must guarantee tenants never see each other’s data. Enforce tenant context in every query, cache key, file path, search index and background job, with database-level controls such as row-level security as a backstop.", "real": "PostgreSQL row-level security (version 9.5, 2016) lets databases enforce tenant filters automatically, and many SaaS providers use it alongside application checks as defense in depth.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Separating customers’ data in shared systems |\n| Why it matters | Cross-tenant leaks are severe incidents |\n| Controls | Tenant ID everywhere, RLS, separate keys/indexes, tests |\n| Watch out for | Caches and search indexes without tenant scoping |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REQ[Request] --> CTX[Tenant from authenticated session]\n  CTX --> DB[(DB with row-level security)]\n  CTX --> CACHE[Cache keys prefixed by tenant]\n  CTX --> SEARCH[Search filtered by tenant]\n  CTX --> FILES[Storage path per tenant]\n```\n\n### Worked example\n\n```sql\nALTER TABLE invoices ENABLE ROW LEVEL SECURITY;\nCREATE POLICY tenant_isolation ON invoices\n  USING (tenant_id = current_setting('app.tenant_id')::uuid);\n-- The application sets app.tenant_id per request from the authenticated session\n```"}, {"id": 70, "title": "Testing authorization", "tldr": "Authorization bugs hide in individual endpoints. Build a permission matrix (roles × endpoints × expected result), automate tests for each cell, include cross-user and cross-tenant ID swaps, and fail CI when new endpoints lack tests.", "real": "Testing tools such as Burp Suite’s Autorize extension automate replaying requests with lower-privileged sessions to find authorization gaps, a standard technique in web application assessments.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Systematic access control verification |\n| Why it matters | Scanners miss most authorization flaws |\n| Method | Permission matrix + automated tests |\n| Watch out for | Only testing with admin accounts |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  MATRIX[Permission matrix] --> TESTS[Generated tests]\n  USERS[Test users: viewer, editor, admin, other tenant] --> TESTS\n  TESTS --> CI[Run in CI]\n  CI -->|unexpected 200| FAIL[Fail build]\n```\n\n### Worked example\n\n| Endpoint | Viewer | Editor | Admin | Other tenant |\n|---|---|---|---|---|\n| GET /docs/{id} | 200 | 200 | 200 | 404 |\n| PUT /docs/{id} | 403 | 200 | 200 | 404 |\n| DELETE /docs/{id} | 403 | 403 | 204 | 404 |\n\n```python\nimport pytest\n\n@pytest.mark.parametrize(\"role,expected\", [(\"viewer\", 403), (\"editor\", 200), (\"admin\", 200)])\ndef test_update_doc_permissions(client, login_as, role, expected):\n    resp = client.put(\"/docs/doc_1\", json={\"title\": \"x\"}, headers=login_as(role))\n    assert resp.status_code == expected\n```"}, {"id": 71, "title": "The OWASP API Security Top 10", "tldr": "APIs expose application logic and data directly, so their top risks center on authorization, authentication, resource consumption and inventory. OWASP’s API Security Top 10 (2023) is the standard checklist for API design and testing.", "real": "OWASP published its first API Security Top 10 in 2019 and updated it in 2023, keeping broken object level authorization as the number one risk.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Top API-specific security risks |\n| Why it matters | APIs carry most modern application traffic |\n| Use | Design reviews, testing, threat modeling |\n| Watch out for | Assuming web app controls automatically cover APIs |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  API[OWASP API Top 10 2023] --> A1[API1 Broken object level authorization]\n  API --> A2[API2 Broken authentication]\n  API --> A3[API3 Broken object property level authorization]\n  API --> A4[API4 Unrestricted resource consumption]\n  API --> A5[API5 Broken function level authorization]\n  API --> A6[API6 Unrestricted access to sensitive business flows]\n  API --> A7[API7 Server-side request forgery]\n  API --> A8[API8 Security misconfiguration]\n  API --> A9[API9 Improper inventory management]\n  API --> A10[API10 Unsafe consumption of APIs]\n```\n\n### Worked example\n\n| Risk | Control |\n|---|---|\n| API1 | Object ownership checks |\n| API3 | Separate input/output schemas per role |\n| API4 | Pagination limits, rate limits, payload size limits |\n| API9 | API catalog; retire old versions |"}, {"id": 72, "title": "API authentication", "tldr": "Choose API authentication by caller: OAuth 2.0 / OIDC tokens for user-delegated access, OAuth client credentials or mTLS for services, and API keys only for simple server-to-server integrations with scoping and rotation.", "real": "GitHub’s secret scanning partner program detects leaked API tokens from many providers in public repositories using token prefixes, and providers can revoke them automatically.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Verifying API callers |\n| Why it matters | APIs are directly reachable by attackers |\n| Options | OAuth/OIDC, client credentials, mTLS, scoped API keys |\n| Watch out for | Long-lived keys embedded in mobile apps |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  CALLER{Caller type} -->|user via app| OAUTH[OAuth 2.0 + PKCE]\n  CALLER -->|backend service| CC[Client credentials / mTLS]\n  CALLER -->|partner server| KEY[Scoped, rotatable API key or OAuth]\n  CALLER -->|mobile app| NOKEY[No embedded secrets: user tokens only]\n```\n\n### Worked example\n\n| API key practice | Why |\n|---|---|\n| High entropy (≥ 128 bits) | Unguessable |\n| Store only a hash | Database leak doesn’t expose keys |\n| Identifiable prefix (sk_live_) | Secret scanning |\n| Scopes + expiry + rotation | Limit damage |"}, {"id": 73, "title": "JWT security", "tldr": "JWTs are signed tokens; their security depends on strict validation: pinned algorithms, verified signature, issuer, audience and expiry, short lifetimes and key rotation. Never trust unverified claims, and don’t put secrets in token payloads.", "real": "In 2015 researchers disclosed that several JWT libraries accepted tokens with the “none” algorithm or confused RSA and HMAC algorithms, leading to the now-standard practice of explicitly specifying allowed algorithms.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Signed claims used as access tokens |\n| Why it matters | Validation mistakes grant access to anyone |\n| Must check | Algorithm, signature, iss, aud, exp, nbf |\n| Watch out for | Decoding without verifying; long-lived tokens |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TOKEN[JWT] --> ALG{Allowed algorithm?}\n  ALG -->|no| REJECT[Reject]\n  ALG -->|yes| SIG{Signature valid with known key?}\n  SIG -->|no| REJECT\n  SIG -->|yes| CLAIMS{iss, aud, exp, nbf valid?}\n  CLAIMS -->|no| REJECT\n  CLAIMS -->|yes| ACCEPT[Accept claims]\n```\n\n### Worked example\n\n```python\nimport jwt   # PyJWT\n\nclaims = jwt.decode(\n    token,\n    key=public_key,\n    algorithms=[\"RS256\"],                       # pinned\n    audience=\"https://api.example.com\",\n    issuer=\"https://auth.example.com/\",\n    options={\"require\": [\"exp\", \"iat\", \"sub\"]},\n)\n```"}, {"id": 74, "title": "API gateways and security controls", "tldr": "API gateways centralize authentication, rate limiting, request validation, TLS, logging and threat protection for APIs. They complement, but never replace, authorization checks inside services.", "real": "Managed gateways such as Amazon API Gateway, Azure API Management and Google Apigee, and open-source ones such as Kong, are widely used to apply consistent security policies across APIs.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Central policy enforcement for API traffic |\n| Why it matters | Consistency across many services |\n| Handles | Token validation, rate limits, schema validation, logging |\n| Watch out for | Services trusting any request that passed the gateway |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CLIENT[Client] --> GW[API gateway: TLS, auth, rate limits, schema checks]\n  GW --> SVC[Service: object-level authorization + business rules]\n  GW --> LOGS[Security logs]\n```\n\n### Worked example\n\n| Control | Gateway | Service |\n|---|---|---|\n| Token signature validation | ✓ | Defense in depth |\n| Rate limiting | ✓ | |\n| Request size limits | ✓ | ✓ |\n| Object-level authorization | | ✓ |\n| Business rule validation | | ✓ |"}, {"id": 75, "title": "Input validation for APIs", "tldr": "Validate every API request against a schema: types, formats, lengths, ranges, enums, array sizes and unknown fields. Schema-first APIs (OpenAPI) let gateways and frameworks enforce validation automatically.", "real": "Frameworks such as FastAPI (Pydantic), ASP.NET Core and Spring Boot (Bean Validation) validate request bodies against declared schemas, reducing injection and resource-exhaustion risks.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Enforcing request structure and limits |\n| Why it matters | Blocks malformed and oversized inputs early |\n| Checks | Types, lengths, enums, array limits, unknown fields |\n| Watch out for | Unbounded arrays and strings |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REQ[Request JSON] --> SCHEMA[Schema validation]\n  SCHEMA -->|invalid| E422[422 with field errors]\n  SCHEMA -->|valid| HANDLER[Handler]\n```\n\n### Worked example\n\n```python\nfrom pydantic import BaseModel, Field, ConfigDict\n\nclass Item(BaseModel):\n    sku: str = Field(pattern=r\"^[A-Z0-9-]{3,20}$\")\n    quantity: int = Field(ge=1, le=100)\n\nclass CreateOrder(BaseModel):\n    model_config = ConfigDict(extra=\"forbid\")\n    items: list[Item] = Field(min_length=1, max_length=50)\n    note: str | None = Field(default=None, max_length=500)\n```"}, {"id": 76, "title": "Server-side request forgery", "tldr": "SSRF tricks a server into making requests to attacker-chosen destinations, such as internal services or cloud metadata endpoints. Allow-list destinations, block private and link-local addresses after DNS resolution, use egress proxies and require IMDSv2.", "real": "The 2019 Capital One breach involved SSRF used to obtain cloud credentials from an instance metadata service, affecting about 100 million people in the US; AWS later promoted IMDSv2, which requires session tokens.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Server fetching attacker-controlled URLs |\n| Why it matters | Access to internal networks and cloud credentials |\n| Risky features | Webhooks, URL previews, imports, PDF/image fetchers |\n| Watch out for | Validating hostnames but not resolved IPs |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  URL[User-supplied URL] --> SCHEME{https only?}\n  SCHEME -->|no| REJECT[Reject]\n  SCHEME -->|yes| RESOLVE[Resolve DNS]\n  RESOLVE --> IPCHECK{Public IP?}\n  IPCHECK -->|private / loopback / link-local| REJECT\n  IPCHECK -->|public| PROXY[Fetch via egress proxy]\n```\n\n### Worked example\n\n```python\nimport ipaddress, socket\nfrom urllib.parse import urlparse\n\ndef is_safe_url(url: str) -> bool:\n    parts = urlparse(url)\n    if parts.scheme != \"https\" or not parts.hostname:\n        return False\n    for info in socket.getaddrinfo(parts.hostname, 443):\n        ip = ipaddress.ip_address(info[4][0])\n        if ip.is_private or ip.is_loopback or ip.is_link_local or ip.is_reserved or ip.is_multicast:\n            return False\n    return True\n# Also pin the resolved IP for the actual request to prevent DNS rebinding.\n```"}, {"id": 77, "title": "Resource limits for APIs", "tldr": "APIs must bound the resources a single request or client can consume: pagination with maximum page sizes, request body limits, timeouts, query complexity limits, rate limits and quotas. Unbounded APIs invite denial of service and runaway costs.", "real": "GitHub’s GraphQL API rate-limits by calculated query cost in points, and many public APIs cap page sizes (for example at 100 items) to prevent expensive requests.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Caps on per-request and per-client usage |\n| Why it matters | Availability and cost control |\n| Controls | Page size caps, body limits, timeouts, rate limits, quotas |\n| Watch out for | limit=1000000 accepted by list endpoints |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REQ[Request] --> SIZE[Body ≤ 1 MB]\n  SIZE --> PAGE[limit ≤ 100]\n  PAGE --> RATE[Client within rate limit]\n  RATE --> TIMEOUT[Query timeout 5 s]\n  TIMEOUT --> PROCESS[Process]\n```\n\n### Worked example\n\n| Parameter | Limit |\n|---|---|\n| Page size | Default 20, max 100 |\n| Request body | 1 MB (uploads use separate flow) |\n| Database statement timeout | 5 s |\n| Requests per key | 600/min |\n| Export jobs | Async, 1 concurrent per account |"}, {"id": 78, "title": "GraphQL security", "tldr": "GraphQL’s flexibility enables expensive or abusive queries: deep nesting, huge lists, alias-based batching and schema discovery. Enforce depth and complexity limits, pagination, persisted queries, field-level authorization and cost-based rate limiting.", "real": "GitHub and Shopify both rate-limit their public GraphQL APIs by calculated query cost rather than request count, reflecting how one GraphQL query can be far more expensive than another.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Securing GraphQL endpoints |\n| Why it matters | One query can be very expensive or expose many fields |\n| Controls | Depth/complexity limits, persisted queries, field authz, cost limits |\n| Watch out for | Authorization only at the top-level resolver |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  QUERY[GraphQL query] --> PARSE[Parse]\n  PARSE --> DEPTH{Depth ≤ 10?}\n  DEPTH -->|no| REJECT[Reject]\n  DEPTH -->|yes| COST{Cost within budget?}\n  COST -->|no| REJECT\n  COST -->|yes| EXEC[Execute with field-level authorization]\n```\n\n### Worked example\n\n| Control | Setting |\n|---|---|\n| Max depth | 10 |\n| Max list size per field | 100 (first/last required) |\n| Introspection | Disabled for public production if schema is private |\n| First-party clients | Persisted query allow-list |"}, {"id": 79, "title": "API inventory and lifecycle", "tldr": "You can’t secure APIs you don’t know about. Maintain an inventory of all APIs, versions, owners, data sensitivity and exposure; discover shadow and zombie APIs from traffic; and retire old versions on schedule.", "real": "OWASP’s API Security Top 10 (2023) lists improper inventory management (API9), noting that forgotten old API versions often lack current security controls.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Knowing and managing all APIs |\n| Why it matters | Forgotten endpoints are easy targets |\n| Sources | OpenAPI specs, gateway logs, traffic analysis |\n| Watch out for | v1 endpoints still live years after v2 launch |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SPECS[OpenAPI specs] --> CATALOG[(API catalog)]\n  TRAFFIC[Gateway + traffic logs] --> DISCOVER[Discover undocumented APIs]\n  DISCOVER --> CATALOG\n  CATALOG --> REVIEW[Owner, data class, exposure, version]\n  REVIEW --> RETIRE[Deprecate + retire old versions]\n```\n\n### Worked example\n\n| API | Owner | Data | Exposure | Status |\n|---|---|---|---|---|\n| /v2/orders | Commerce | PII | Public | Active |\n| /v1/orders | Commerce | PII | Public | Retire by Q1 |\n| /internal/reports | Analytics | Financial | Internal | Active |\n| /debug/metrics | Unknown | Unknown | Public | Investigate now |"}, {"id": 80, "title": "Testing API security", "tldr": "Test APIs with schema-based fuzzing, authorization matrix tests, authentication tests, rate-limit checks and manual business-logic testing. Integrate automated tests into CI and complement them with periodic expert assessments.", "real": "Tools such as Schemathesis (property-based testing from OpenAPI specs), Microsoft Research’s RESTler (2019) and OWASP ZAP’s API scanning are commonly used for automated API security testing.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Verifying API security controls |\n| Why it matters | APIs change frequently; regressions are common |\n| Methods | Fuzzing, authz matrices, auth tests, manual logic review |\n| Watch out for | Only scanning for injection, missing authorization flaws |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SPEC[OpenAPI spec] --> FUZZ[Schema-based fuzzing]\n  MATRIX[Permission matrix] --> AUTHZ[Authorization tests]\n  FUZZ --> CI[CI pipeline]\n  AUTHZ --> CI\n  CI --> MANUAL[Periodic manual testing of business flows]\n```\n\n### Worked example\n\n```bash\n# Property-based checks against a staging API from its OpenAPI spec\nschemathesis run https://staging.example.com/openapi.json --checks all \\\n  --header \"Authorization: Bearer $TEST_TOKEN\"\n```"}, {"id": 81, "title": "The secure development lifecycle", "tldr": "A secure SDLC builds security into every phase: requirements, design (threat modeling), implementation (secure coding, reviews), verification (testing), release (approvals, signing) and operations (monitoring, vulnerability response).", "real": "Bill Gates’s 2002 “Trustworthy Computing” memo led Microsoft to create its Security Development Lifecycle in 2004, which significantly reduced vulnerabilities in later Windows releases and influenced industry practice.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Security activities across development phases |\n| Why it matters | Fixing flaws early is far cheaper |\n| Frameworks | Microsoft SDL, NIST SSDF (SP 800-218), OWASP SAMM |\n| Watch out for | Security only as a pre-release gate |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REQ[Requirements: security needs] --> DESIGN[Design: threat model]\n  DESIGN --> CODE[Code: secure standards, review]\n  CODE --> TEST[Test: SAST, DAST, SCA]\n  TEST --> RELEASE[Release: signing, approvals]\n  RELEASE --> OPS[Operate: monitor, patch, respond]\n  OPS --> REQ\n```\n\n### Worked example\n\n| Phase | Security activity |\n|---|---|\n| Requirements | ASVS level chosen, data classification |\n| Design | Threat model reviewed |\n| Code | Secure coding guide, peer review |\n| Test | SAST/SCA in CI, DAST on staging |\n| Release | Signed artifacts, change approval |\n| Operate | Vulnerability SLAs, monitoring |"}, {"id": 82, "title": "Security requirements and OWASP ASVS", "tldr": "Define security requirements like functional requirements. OWASP’s Application Security Verification Standard (ASVS) provides testable requirements at three levels, from basic hygiene to high-assurance applications.", "real": "OWASP released ASVS version 5.0 in May 2025, reorganizing requirements to make them easier to apply and verify across modern web applications and APIs.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Testable security requirements |\n| Why it matters | Clear targets for developers and testers |\n| Levels | L1 baseline, L2 most apps, L3 high assurance |\n| Watch out for | Vague requirements like “must be secure” |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CLASSIFY[Classify app risk] --> LEVEL[Choose ASVS level]\n  LEVEL --> SELECT[Select applicable requirements]\n  SELECT --> STORIES[Add to user stories / acceptance criteria]\n  STORIES --> VERIFY[Verify in tests + reviews]\n```\n\n### Worked example\n\n| Requirement (paraphrased) | Acceptance test |\n|---|---|\n| Passwords stored with an approved slow hash | Unit test checks Argon2id hash format |\n| Session invalidated on logout | Integration test reuses old session → 401 |\n| Authorization enforced server-side on every endpoint | Permission matrix tests |\n| Security events logged | Login failures appear in log stream |"}, {"id": 83, "title": "Threat modeling", "tldr": "Threat modeling identifies what can go wrong in a design before building it. Answer four questions: What are we working on? What can go wrong? What are we going to do about it? Did we do a good job? Use data flow diagrams and STRIDE.", "real": "Adam Shostack’s “Threat Modeling: Designing for Security” (2014) popularized the four-question framework, and the Threat Modeling Manifesto (2020) summarized shared values and principles.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structured analysis of design-level threats |\n| Why it matters | Finds design flaws scanners never will |\n| Tools | Data flow diagrams, STRIDE, attack trees |\n| Watch out for | Threat models written once and never updated |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  USER[User browser] -->|HTTPS| API[API service]\n  API -->|SQL| DB[(Database)]\n  API -->|HTTPS| PAY[Payment provider]\n  ADMIN[Admin] -->|VPN + MFA| ADMINUI[Admin console]\n  ADMINUI --> API\n  TB1[Trust boundary: internet ↔ API] -.-> API\n```\n\n### Worked example\n\n| Element | Threat (STRIDE) | Mitigation |\n|---|---|---|\n| Login API | Spoofing via credential stuffing | MFA, rate limits |\n| Orders DB | Information disclosure via IDOR | Object-level authorization |\n| Payment webhook | Tampering with forged events | HMAC signature verification |\n| Admin console | Elevation of privilege | MFA, ZTNA, audit logs |"}, {"id": 84, "title": "STRIDE in practice", "tldr": "STRIDE categorizes threats: Spoofing identity, Tampering with data, Repudiation, Information disclosure, Denial of service and Elevation of privilege. Walk through each element and data flow of a design asking which categories apply.", "real": "Loren Kohnfelder and Praerit Garg created STRIDE at Microsoft in 1999, and it remains one of the most widely taught threat modeling methods.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Mnemonic for threat categories |\n| Why it matters | Systematic coverage during design reviews |\n| Mapped properties | Authentication, integrity, non-repudiation, confidentiality, availability, authorization |\n| Watch out for | Listing threats without mitigations or owners |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  STRIDE[STRIDE] --> S[Spoofing → authentication]\n  STRIDE --> T[Tampering → integrity]\n  STRIDE --> R[Repudiation → audit logs]\n  STRIDE --> I[Information disclosure → confidentiality]\n  STRIDE --> D[Denial of service → availability]\n  STRIDE --> E[Elevation of privilege → authorization]\n```\n\n### Worked example\n\n| Threat for “file sharing link” feature | Category | Control |\n|---|---|---|\n| Guessable share links | Information disclosure | 128-bit random tokens |\n| Shared file replaced by attacker | Tampering | Only owner can edit; versioning |\n| User denies deleting a file | Repudiation | Audit log |\n| Huge uploads exhaust storage | Denial of service | Quotas |"}, {"id": 85, "title": "Secure design patterns", "tldr": "Reusable secure patterns prevent whole classes of flaws: centralized authentication and authorization, secure defaults, parameterized data access, output encoding by default, secrets from vaults, safe file handling and audited admin actions.", "real": "Google’s book “Building Secure and Reliable Systems” (2020) describes how secure-by-construction libraries and frameworks, such as safe HTML templating, eliminated common vulnerability classes across many products.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Proven building blocks that are secure by default |\n| Why it matters | Developers can’t make the common mistake |\n| Examples | Auth middleware, ORM-only data access, safe templating, secret clients |\n| Watch out for | Each team inventing its own crypto or auth |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PLATFORM[Platform libraries] --> AUTHN[Authentication middleware]\n  PLATFORM --> AUTHZ[Authorization policy library]\n  PLATFORM --> DATA[Safe data access layer]\n  PLATFORM --> TEMPL[Auto-escaping templates]\n  PLATFORM --> SECRETS[Secrets client]\n  APPS[Product teams] --> PLATFORM\n```\n\n### Worked example\n\n| Vulnerability class | Secure-by-default pattern |\n|---|---|\n| SQL injection | Data access only via parameterized query builder |\n| XSS | Auto-escaping templates + strict CSP |\n| Secrets leakage | Secrets fetched at runtime from vault |\n| Missing authorization | Routes fail closed without a declared policy |"}, {"id": 86, "title": "Secure code review", "tldr": "Security-focused code review checks authentication and authorization, input handling, data access, cryptography, secrets, error handling, logging and dependencies. Use checklists, focus on risky changes and combine with automated tools.", "real": "OWASP’s Code Review Guide and secure code review checklists are widely used, and many organizations require security review for changes touching authentication, payments or cryptography.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Reviewing code for security flaws |\n| Why it matters | Catches logic and authorization bugs tools miss |\n| Focus | Auth, data access, input/output, crypto, secrets |\n| Watch out for | Rubber-stamp reviews on large pull requests |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PR[Pull request] --> AUTO[Automated SAST, secrets, SCA]\n  AUTO --> RISK{Touches auth, payments, crypto?}\n  RISK -->|yes| SECREVIEW[Security reviewer required]\n  RISK -->|no| PEER[Peer review with checklist]\n  SECREVIEW --> MERGE[Merge]\n  PEER --> MERGE\n```\n\n### Worked example\n\n- [ ] Every new endpoint has authentication and authorization\n- [ ] Object access scoped to user/tenant\n- [ ] Queries parameterized; no shell or eval with input\n- [ ] Outputs encoded; no unsafe HTML rendering\n- [ ] No secrets in code or logs\n- [ ] Errors don’t leak internals\n- [ ] New dependencies reviewed"}, {"id": 87, "title": "Secure coding standards", "tldr": "Secure coding standards document language- and framework-specific rules: approved libraries, banned functions, patterns for authentication, data access, crypto and error handling. Back them with linters so rules are enforced automatically.", "real": "The SEI CERT Coding Standards (for C, C++, Java and others) and OWASP’s cheat sheet series are widely used references for secure coding rules.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Team rules for writing secure code |\n| Why it matters | Consistency; prevents repeated mistakes |\n| Enforcement | Linters, SAST rules, code review |\n| Watch out for | Standards documents nobody reads |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  STANDARD[Secure coding standard] --> RULES[Lint / SAST rules]\n  RULES --> IDE[IDE warnings]\n  RULES --> CI[CI checks]\n  CI --> FEEDBACK[Feedback on pull requests]\n```\n\n### Worked example\n\n| Rule | Enforcement |\n|---|---|\n| No `eval`/`exec` on input | Semgrep rule |\n| No `shell=True` | Bandit (B602/B605 family) |\n| Use `secrets` for tokens, not `random` | Bandit B311 |\n| No `verify=False` in HTTP clients | Bandit B501 |"}, {"id": 88, "title": "Security champions", "tldr": "Security champions are developers in each team who receive extra security training and act as the first point of contact for security questions, threat models and reviews. They scale scarce security expertise.", "real": "OWASP’s Security Champions Guide and programs at companies such as Salesforce and Adobe describe champions networks as a way to embed security knowledge in development teams.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Embedded security advocates in teams |\n| Why it matters | Security teams can’t review everything |\n| Activities | Threat models, triage findings, share knowledge |\n| Watch out for | Champions with no time allocated for the role |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SECTEAM[Central security team] --> TRAIN[Training + office hours]\n  TRAIN --> C1[Champion team A]\n  TRAIN --> C2[Champion team B]\n  TRAIN --> C3[Champion team C]\n  C1 --> TEAMA[Team A practices]\n  C2 --> TEAMB[Team B practices]\n  C3 --> TEAMC[Team C practices]\n```\n\n### Worked example\n\n| Champion activity | Time per month |\n|---|---|\n| Training / community meeting | 2 hours |\n| Threat models for team features | 4 hours |\n| Triage scanner findings | 3 hours |\n| Security review of risky PRs | As needed |"}, {"id": 89, "title": "DevSecOps pipelines", "tldr": "DevSecOps automates security checks in CI/CD: secrets scanning, SAST, dependency scanning, IaC scanning, container scanning, DAST on staging, signing and policy gates. Fast, low-noise checks keep developers engaged.", "real": "Platforms such as GitHub Advanced Security, GitLab security scanning and open-source tools (Semgrep, Trivy, Gitleaks, OWASP ZAP) integrate security testing directly into pull requests and pipelines.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Security automation in delivery pipelines |\n| Why it matters | Continuous, early feedback |\n| Gates | Block high-confidence critical findings; warn on others |\n| Watch out for | Noisy tools that developers learn to ignore |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  COMMIT[Commit] --> SECRETS[Secrets scan]\n  SECRETS --> SAST[SAST]\n  SAST --> SCA[Dependency scan]\n  SCA --> IAC[IaC scan]\n  IAC --> BUILD[Build + image scan + sign]\n  BUILD --> DAST[DAST on staging]\n  DAST --> DEPLOY[Deploy]\n```\n\n### Worked example\n\n```yaml\nname: security\non: [pull_request]\npermissions:\n  contents: read\n  security-events: write\njobs:\n  scan:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: github/codeql-action/init@v3\n        with: {languages: python}\n      - uses: github/codeql-action/analyze@v3\n      - run: pip install pip-audit && pip-audit -r requirements.txt\n```"}, {"id": 90, "title": "Vulnerability disclosure and bug bounties", "tldr": "Make it easy for outsiders to report vulnerabilities: publish a disclosure policy and security.txt, respond quickly, fix within defined timelines, credit reporters and consider a bug bounty program once internal processes are mature.", "real": "RFC 9116 (2022) standardized the security.txt file for publishing security contact information, and bug bounty platforms such as HackerOne and Bugcrowd have paid researchers hundreds of millions of dollars cumulatively.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Process for receiving external vulnerability reports |\n| Why it matters | Researchers find what internal teams miss |\n| Elements | Policy, contact, safe harbor, triage SLAs, fixes, credit |\n| Watch out for | Launching a bounty before you can triage and fix quickly |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REPORT[Researcher report] --> TRIAGE[Triage within 3 business days]\n  TRIAGE --> VALIDATE[Validate + severity]\n  VALIDATE --> FIX[Fix within SLA]\n  FIX --> NOTIFY[Notify reporter + credit]\n  NOTIFY --> ADVISORY[Advisory / CVE if applicable]\n```\n\n### Worked example\n\n```text\n# https://example.com/.well-known/security.txt\nContact: mailto:security@example.com\nExpires: 2027-06-30T23:59:59Z\nPolicy: https://example.com/security/disclosure-policy\nPreferred-Languages: en\n```"}, {"id": 91, "title": "Static application security testing", "tldr": "SAST analyzes source code without running it, finding patterns such as injection, unsafe APIs and hard-coded secrets. It runs early in CI and IDEs; tune rules to reduce false positives and write custom rules for your frameworks.", "real": "GitHub’s CodeQL, which treats code as a queryable database, and Semgrep’s lightweight pattern rules are widely used SAST tools, and CodeQL is free for public repositories on GitHub.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Analyzing code for vulnerability patterns |\n| Why it matters | Finds bugs before deployment, in developers’ workflow |\n| Strengths | Early, broad coverage, explains location in code |\n| Watch out for | False positives eroding trust; missing logic flaws |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CODE[Source code] --> PARSE[Parse + data flow analysis]\n  PARSE --> RULES[Match vulnerability rules]\n  RULES --> FINDINGS[Findings with file + line]\n  FINDINGS --> PR[Comments on pull request]\n```\n\n### Worked example\n\n```yaml\n# Semgrep rule: flag subprocess calls with shell=True\nrules:\n  - id: python-subprocess-shell-true\n    languages: [python]\n    severity: ERROR\n    message: Avoid shell=True; pass an argument list instead.\n    pattern: subprocess.$FUNC(..., shell=True, ...)\n```"}, {"id": 92, "title": "Dynamic application security testing", "tldr": "DAST tests running applications from the outside, sending crafted requests and analyzing responses, finding issues such as missing headers, injection and misconfiguration. Run it against staging with authenticated sessions and safe settings.", "real": "OWASP ZAP (Zed Attack Proxy), first released in 2010, became one of the most widely used open-source DAST tools and is commonly run in CI against staging environments.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Black-box testing of running apps |\n| Why it matters | Finds runtime and configuration issues |\n| Strengths | Language-agnostic, tests real deployment |\n| Watch out for | Running aggressive scans against production |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  APP[Staging app] --> SPIDER[Crawl / import OpenAPI]\n  SPIDER --> TEST[Send test requests]\n  TEST --> ANALYZE[Analyze responses]\n  ANALYZE --> REPORT[Findings report]\n```\n\n### Worked example\n\n```bash\n# Baseline (passive) scan of a staging site with OWASP ZAP in Docker\ndocker run --rm -v \"$(pwd)\":/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable \\\n  zap-baseline.py -t https://staging.example.com -r zap-report.html\n```"}, {"id": 93, "title": "Software composition analysis", "tldr": "SCA identifies third-party dependencies and their known vulnerabilities and licenses. Since most application code is open-source dependencies, SCA with automated updates is one of the highest-value security practices.", "real": "The December 2021 Log4Shell vulnerability (CVE-2021-44228) in the widely used Log4j library forced organizations worldwide to search their software for the dependency, highlighting the need for SCA and SBOMs.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Inventory + vulnerability checks for dependencies |\n| Why it matters | Dependencies dominate codebases |\n| Tools | pip-audit, npm audit, OSV-Scanner, Dependabot, Renovate, Snyk |\n| Watch out for | Alerts for unreachable code drowning real issues |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LOCK[Lock files] --> SCA[SCA scan]\n  SCA --> DB[(Vulnerability databases: OSV, NVD, GHSA)]\n  DB --> FINDINGS[Vulnerable packages + fixed versions]\n  FINDINGS --> PRS[Automated update PRs]\n  PRS --> TESTS[Tests + merge]\n```\n\n### Worked example\n\n```bash\npip-audit -r requirements.txt\nnpm audit --audit-level=high\n```"}, {"id": 94, "title": "Secrets scanning", "tldr": "Secrets scanners detect API keys, tokens, passwords and private keys in code, commits, CI logs and images. Block secrets before they’re pushed, scan history, and when a secret leaks, rotate it immediately: deleting the commit isn’t enough.", "real": "GitHub reported detecting tens of millions of leaked secrets in public repositories in 2024 and enabled push protection by default for public repositories to block secrets before they’re committed.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Finding credentials in code and artifacts |\n| Why it matters | Leaked secrets are exploited quickly |\n| Tools | Gitleaks, TruffleHog, GitHub secret scanning + push protection |\n| Watch out for | Removing a leaked key from Git without revoking it |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DEV[Developer commit] --> HOOK[Pre-commit / push protection]\n  HOOK -->|secret found| BLOCK[Block push]\n  HOOK -->|clean| REPO[Repository]\n  REPO --> SCAN[Scheduled history scan]\n  SCAN -->|leak found| ROTATE[Revoke + rotate + investigate usage]\n```\n\n### Worked example\n\n```bash\ngitleaks detect --source . --report-path gitleaks-report.json\n```\n\n| Leak response step | Owner |\n|---|---|\n| Revoke/rotate the secret | Service owner, immediately |\n| Check logs for misuse | Security |\n| Remove from history (optional) | Developer |\n| Add pre-commit scanning | Team |"}, {"id": 95, "title": "Fuzzing", "tldr": "Fuzzing feeds large numbers of generated or mutated inputs to software to find crashes, hangs and memory bugs. Coverage-guided fuzzers are highly effective for parsers, file formats and libraries written in memory-unsafe languages.", "real": "Google’s OSS-Fuzz, launched in 2016, has continuously fuzzed critical open-source projects and helped identify and fix thousands of vulnerabilities.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Automated testing with generated inputs |\n| Why it matters | Finds edge-case bugs humans don’t think of |\n| Best targets | Parsers, decoders, protocol handlers, APIs |\n| Watch out for | Running fuzzers without triaging crashes |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SEED[Seed inputs] --> MUTATE[Mutate inputs]\n  MUTATE --> RUN[Run target]\n  RUN --> COV{New code coverage?}\n  COV -->|yes| CORPUS[Add to corpus]\n  CORPUS --> MUTATE\n  RUN -->|crash| TRIAGE[Save + triage crash]\n```\n\n### Worked example\n\n```python\n# Property-based fuzzing of a parser with Hypothesis\nfrom hypothesis import given, strategies as st\n\ndef parse_amount(text: str) -> int:\n    \"\"\"Parse '123.45' into minor units; raise ValueError on bad input.\"\"\"\n    whole, _, frac = text.partition(\".\")\n    if not whole.isdigit() or (frac and (not frac.isdigit() or len(frac) > 2)):\n        raise ValueError(\"invalid amount\")\n    return int(whole) * 100 + int(frac.ljust(2, \"0\") or 0)\n\n@given(st.text())\ndef test_parse_amount_never_crashes_unexpectedly(s):\n    try:\n        assert parse_amount(s) >= 0\n    except ValueError:\n        pass      # expected rejection; any other exception is a bug\n```"}, {"id": 96, "title": "Penetration testing", "tldr": "Penetration testing is an authorized, scoped simulation of attacks by skilled testers to find exploitable weaknesses and chained attack paths. It requires written authorization, rules of engagement, careful execution and clear reporting with remediation guidance.", "real": "Methodologies such as the OWASP Web Security Testing Guide, PTES and NIST SP 800-115 describe structured approaches to planning, executing and reporting penetration tests.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Authorized expert security testing |\n| Why it matters | Finds chained and logic flaws automation misses |\n| Prerequisites | Written authorization, scope, rules of engagement, contacts |\n| Watch out for | Annual pentest as the only security testing |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SCOPE[Scope + authorization] --> RECON[Information gathering within scope]\n  RECON --> ANALYSIS[Vulnerability analysis]\n  ANALYSIS --> VERIFY[Controlled verification]\n  VERIFY --> REPORT[Report: findings, risk, fixes]\n  REPORT --> RETEST[Retest after fixes]\n```\n\n### Worked example\n\n| Rules of engagement item | Example |\n|---|---|\n| In scope | app.example.com, api.example.com (staging + production read-only) |\n| Out of scope | Third-party payment provider, employees (no social engineering) |\n| Testing window | Mon–Fri, 10:00–18:00 IST |\n| Prohibited | Denial-of-service, data modification in production |\n| Emergency contact | Security on-call phone + email |"}, {"id": 97, "title": "Interpreting findings: severity and prioritization", "tldr": "Prioritize vulnerabilities by real risk, not just severity scores: combine CVSS severity with exploitation evidence (CISA KEV), exploit likelihood (EPSS), exposure (internet-facing?), asset criticality and existing mitigations.", "real": "FIRST released CVSS version 4.0 in November 2023, and many organizations now combine CVSS with CISA’s Known Exploited Vulnerabilities catalog (2021) and FIRST’s Exploit Prediction Scoring System to prioritize patching.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Ranking vulnerabilities for remediation |\n| Why it matters | Teams can’t fix everything at once |\n| Inputs | CVSS, KEV, EPSS, exposure, asset value |\n| Watch out for | Fixing high-CVSS internal issues before exploited internet-facing ones |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  VULN[Vulnerability] --> KEV{In CISA KEV?}\n  KEV -->|yes| EXPOSED{Internet-facing?}\n  EXPOSED -->|yes| P1[P1: fix in 48 hours]\n  EXPOSED -->|no| P2[P2: 7 days]\n  KEV -->|no| CVSS{CVSS critical/high + high EPSS?}\n  CVSS -->|yes| P2\n  CVSS -->|no| P3[P3: 30–90 days]\n```\n\n### Worked example\n\n| Finding | CVSS | KEV | Exposure | Priority |\n|---|---|---|---|---|\n| VPN appliance RCE | 9.8 | Yes | Internet | P1 |\n| Internal wiki XSS | 6.1 | No | Internal | P3 |\n| Library deserialization flaw | 9.0 | No | Internal batch job | P2/P3 depending on reachability |"}, {"id": 98, "title": "Mobile application security", "tldr": "Mobile apps run on devices attackers control. Never embed secrets in apps, enforce authorization on the server, use platform secure storage, pin or validate TLS properly, protect against tampering where needed and follow OWASP MASVS.", "real": "OWASP’s Mobile Application Security Verification Standard (MASVS) and Mobile Application Security Testing Guide (MASTG) are the standard references for mobile app security requirements and testing.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Securing iOS and Android apps |\n| Why it matters | Apps can be decompiled and modified |\n| Rules | No embedded secrets; server-side authorization; secure storage |\n| Watch out for | API keys in the app bundle |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  APP[Mobile app: untrusted client] --> TLS[TLS]\n  TLS --> API[API: authentication + authorization]\n  APP --> STORE[Keychain / Keystore for tokens]\n  APP -.no secrets in bundle.-> X[Static keys removed]\n```\n\n### Worked example\n\n| Data | Storage |\n|---|---|\n| Access/refresh tokens | iOS Keychain / Android Keystore-backed storage |\n| Cached profile data | Encrypted app storage |\n| Third-party API secrets | Never on device: proxy through your backend |"}, {"id": 99, "title": "Security testing in CI/CD", "tldr": "Combine fast checks on every pull request (secrets, SAST, SCA, IaC) with slower checks before release (DAST, container scans) and periodic deep testing (pentests). Define clear gates and exception processes with expiry.", "real": "NIST’s Secure Software Development Framework (SP 800-218, 2022) recommends integrating automated security testing into development pipelines, and it informs US federal software attestation requirements.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Automated security checks across the pipeline |\n| Why it matters | Consistent, early detection |\n| Gating | Block critical, high-confidence findings; track others |\n| Watch out for | Permanent “temporary” exceptions |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PR[Pull request: secrets, SAST, SCA, IaC] --> MAIN[Main branch]\n  MAIN --> STAGE[Staging: DAST, container scan]\n  STAGE --> PROD[Production]\n  PERIODIC[Quarterly pentest + bug bounty] -.-> PROD\n```\n\n### Worked example\n\n| Gate | Blocks on | Exception process |\n|---|---|---|\n| PR | Leaked secret, critical SAST with high confidence | Security approval, 30-day expiry |\n| Release | Critical exploitable dependency, critical image CVE with fix | Risk acceptance by owner |\n| Production | KEV-listed vulnerability | Emergency patch |"}, {"id": 100, "title": "Measuring an AppSec program", "tldr": "Track outcomes, not activity: vulnerability counts by severity and age, time to remediate versus SLA, recurrence of vulnerability classes, coverage of scanning and threat modeling, and escaped vulnerabilities found in production.", "real": "OWASP SAMM (Software Assurance Maturity Model) and BSIMM (Building Security In Maturity Model, first published in 2009) provide frameworks for measuring and improving software security programs.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Metrics for application security effectiveness |\n| Why it matters | Guides investment; shows progress |\n| Key metrics | Mean time to remediate, SLA compliance, coverage, recurrence |\n| Watch out for | Counting scans run instead of risk reduced |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  FINDINGS[Findings data] --> AGE[Age by severity]\n  FINDINGS --> SLA[SLA compliance]\n  FINDINGS --> CLASS[Recurring classes]\n  COVERAGE[Coverage: repos scanned, threat models] --> DASH[AppSec dashboard]\n  AGE --> DASH\n  SLA --> DASH\n  CLASS --> DASH\n```\n\n### Worked example\n\n| Metric | Q1 | Q2 |\n|---|---|---|\n| Critical findings open > SLA | 7 | 2 |\n| Mean time to remediate (high) | 41 days | 18 days |\n| Repos with SAST + SCA | 62% | 91% |\n| New features with threat model | 30% | 70% |"}, {"id": 101, "title": "Software supply chain threats", "tldr": "Attackers increasingly target the software supply chain: dependencies, build systems, CI/CD pipelines, package registries, update mechanisms and maintainers. One compromise can reach thousands of downstream organizations.", "real": "The 2020 SolarWinds attack inserted malicious code into Orion software builds distributed to about 18,000 customers, and in 2024 a backdoor planted in xz Utils over a multi-year campaign was discovered shortly before reaching major Linux distributions’ stable releases.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Attacks on how software is built and delivered |\n| Why it matters | Trusted software becomes the attack vector |\n| Targets | Dependencies, build systems, CI secrets, registries, maintainers |\n| Watch out for | Assuming signed or popular software is automatically safe |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SRC[Source code] --> DEPS[Dependencies]\n  DEPS --> BUILD[Build system / CI]\n  BUILD --> ARTIFACT[Artifacts]\n  ARTIFACT --> REGISTRY[Registry]\n  REGISTRY --> DEPLOY[Deployment]\n  ATT1[Malicious package] -.-> DEPS\n  ATT2[Compromised build] -.-> BUILD\n  ATT3[Stolen CI secrets] -.-> BUILD\n```\n\n### Worked example\n\n| Incident | Supply chain stage |\n|---|---|\n| SolarWinds (2020) | Build system compromise |\n| Codecov (2021) | Modified CI script exfiltrating secrets |\n| 3CX (2023) | Trojanized desktop app via upstream compromise |\n| xz Utils (2024) | Malicious maintainer contribution |"}, {"id": 102, "title": "Dependency management", "tldr": "Manage dependencies deliberately: choose well-maintained packages, pin versions with lock files, minimize dependency count, update regularly with automated PRs and tests, and review new dependencies before adding them.", "real": "The OpenSSF Scorecard project (2020) automatically evaluates open-source projects on practices such as maintenance, code review, branch protection and pinned dependencies to help consumers assess risk.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Controlling third-party code in your software |\n| Why it matters | Dependencies are most of your codebase |\n| Practices | Lock files, minimal deps, automated updates, review new packages |\n| Watch out for | Unmaintained packages with single maintainers |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  NEW[New dependency request] --> REVIEW[Check maintenance, Scorecard, license, popularity]\n  REVIEW --> LOCK[Add with pinned version]\n  LOCK --> BOT[Dependabot / Renovate updates]\n  BOT --> TESTS[CI tests + SCA]\n  TESTS --> MERGE[Merge]\n```\n\n### Worked example\n\n| Check before adding a package | Signal |\n|---|---|\n| Recent releases and commits | Maintained |\n| Multiple maintainers | Lower bus-factor risk |\n| OpenSSF Scorecard | Security practices |\n| License | Compatible |\n| Could we write 20 lines instead? | Avoid trivial dependencies |"}, {"id": 103, "title": "Software bills of materials", "tldr": "An SBOM lists the components and versions in a piece of software, in standard formats such as SPDX or CycloneDX. SBOMs let you answer “are we affected?” within minutes when a new vulnerability is disclosed.", "real": "US Executive Order 14028 (May 2021) directed SBOM requirements for software sold to the federal government, and SPDX became an ISO/IEC standard (5962) in 2021.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Inventory of software components |\n| Why it matters | Fast impact analysis for new vulnerabilities |\n| Formats | SPDX, CycloneDX |\n| Watch out for | SBOMs generated once and never used |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BUILD[Build] --> GEN[Generate SBOM]\n  GEN --> STORE[(SBOM store per release)]\n  NEWCVE[New CVE published] --> QUERY[Query SBOMs]\n  STORE --> QUERY\n  QUERY --> AFFECTED[List affected services]\n```\n\n### Worked example\n\n```bash\nsyft registry.example.com/orders-api:1.42.0 -o cyclonedx-json > orders-api.cdx.json\ngrype sbom:./orders-api.cdx.json --fail-on critical\n```"}, {"id": 104, "title": "SLSA and build integrity", "tldr": "SLSA (Supply-chain Levels for Software Artifacts) defines increasing levels of build integrity: provenance exists, builds run on hosted platforms with signed provenance, and builds are hardened and isolated. Provenance lets consumers verify how artifacts were built.", "real": "Google introduced SLSA in 2021 based on its internal practices, and it is now maintained by the Open Source Security Foundation, with GitHub Actions and other platforms able to generate SLSA provenance.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Framework for trustworthy builds |\n| Why it matters | Detects tampered or unofficial artifacts |\n| Build track | L1 provenance, L2 signed provenance on hosted builds, L3 hardened builds |\n| Watch out for | Artifacts built on developer laptops |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  COMMIT[Reviewed commit] --> HOSTED[Hosted, isolated build]\n  HOSTED --> ART[Artifact]\n  HOSTED --> PROV[Signed provenance: source, builder, steps]\n  ART --> VERIFY[Consumer verifies provenance]\n  PROV --> VERIFY\n```\n\n### Worked example\n\n| SLSA build level | Requirement |\n|---|---|\n| L1 | Provenance generated |\n| L2 | Hosted build platform; signed provenance |\n| L3 | Hardened, isolated build; provenance unforgeable by tenants |"}, {"id": 105, "title": "Signing artifacts with Sigstore", "tldr": "Sign container images, packages and binaries so consumers can verify origin and integri

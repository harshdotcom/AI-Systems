<style>
:root{
  --bg:#F1F2F5; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#171A21; --muted:#575D6B; --line:#D9DCE4;
  --accent:#B91C1C; --accent-soft:#FBE4E4; --accent-ink:#FFFFFF;
  --amber:#B97A0B; --tldr-bg:#FFF5DC; --tldr-line:#D49A22;
  --indigo:#1F4E5F; --real-bg:#E2EEF1; --real-line:#3C7A8C;
  --code-bg:#181A16; --code-ink:#E6E9E1; --inline-code:#E9ECE4;
  --cell-empty:#DCE0D6; --shadow:0 1px 0 rgba(24,26,22,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
    --accent:#FCA5A5; --accent-soft:#3A1717; --accent-ink:#2A0909;
    --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
    --indigo:#9CCFDC; --real-bg:#122329; --real-line:#5A9AAD;
    --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
    --cell-empty:#2E332B; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
  --accent:#FCA5A5; --accent-soft:#3A1717; --accent-ink:#2A0909;
  --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
  --indigo:#9CCFDC; --real-bg:#122329; --real-line:#5A9AAD;
  --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
  --cell-empty:#2E332B; --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header with the memory-bank progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:20px;padding:12px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted)}
.bank{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bank-row{display:flex;gap:4px;flex-wrap:nowrap;min-width:0}
.bank-group{flex:1;min-width:0;display:flex;gap:2px;padding:3px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.cell{flex:1;min-width:2px;max-width:10px;height:18px;border-radius:2px;background:var(--cell-empty);border:0;padding:0;cursor:pointer;transition:background .2s}
.cell.done{background:var(--accent)}
.cell.here{box-shadow:0 0 0 2px var(--amber)}
.bank-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bank-meta strong{color:var(--ink);font-weight:600}
.top-actions{display:flex;gap:8px}
.btn{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.menu-btn{display:none}

/* Shell */
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,76px));height:calc(100dvh - var(--top-h,76px) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg)}
.search{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
.part{margin-bottom:4px}
.part-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:8px;cursor:pointer}
.part-head:hover{background:var(--surface-2)}
.part-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);width:22px;flex:none}
.part-name{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.part-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.part-count.full{color:var(--accent);font-weight:600}
.part-list{list-style:none;margin:0 0 6px;padding:0 0 0 30px;display:none}
.part.open .part-list{display:block}
.ch-row{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:6px}
.ch-row.active{background:var(--accent-soft)}
.ch-row a{flex:1;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.ch-row a .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.tick{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:11px;height:11px;opacity:0}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{opacity:1;color:var(--accent-ink)}
.hidden{display:none!important}

/* Main reading area */
.main{padding:24px 32px 80px;min-width:0}
.crumb{font-size:14px;color:var(--muted);margin:0 0 12px}
.crumb a{color:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;font-size:14px;color:var(--muted);max-width:240px;text-align:left}
.tab .tab-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--cell-empty)}
.tab .dot.on{background:var(--accent)}
article{max-width:780px}
.ch-no{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--accent);font-size:15px;margin:0}
h1.ch-title{font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:6px 0 22px;font-weight:700;text-wrap:balance}
.box{border-radius:10px;padding:16px 18px;margin:0 0 26px;border-left:4px solid}
.box h2{font-size:14px;margin:0 0 6px;font-weight:600}
.box p{margin:0}
.tldr{background:var(--tldr-bg);border-color:var(--tldr-line)}
.tldr h2{color:var(--amber)}
.tldr p{font-size:17px;line-height:1.55}
.real{background:var(--real-bg);border-color:var(--real-line);margin-top:34px}
.real h2{color:var(--indigo)}
.body h3{font-size:20px;margin:30px 0 10px;letter-spacing:-.01em}
.body p{margin:0 0 14px}
.body ul,.body ol{padding-left:22px;margin:0 0 16px}
.body li{margin:4px 0}
.body li input[type=checkbox]{margin-right:6px;accent-color:var(--accent)}
.body code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.88em;background:var(--inline-code);padding:1px 5px;border-radius:4px}
.body pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13.5px;line-height:1.55;margin:0 0 18px}
.body pre code{background:none;padding:0;font-size:inherit;color:inherit}
.table-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.body table{border-collapse:collapse;width:100%;font-size:14px}
.body th,.body td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.body th{background:var(--surface-2);font-weight:600}
.body tr:last-child td{border-bottom:0}
.body strong{font-weight:600}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.complete{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:15px}
.complete .tick{border-color:currentColor;pointer-events:none}
.complete.on{background:var(--accent);color:var(--accent-ink)}
.complete.on .tick{background:var(--accent-ink);border-color:var(--accent-ink)}
.complete.on .tick svg{opacity:1;color:var(--accent)}
.nav{display:flex;gap:8px}
.nav .btn[disabled]{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}

/* Diagrams and charts */
.diagram{margin:0 0 20px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
.diagram svg{display:block;margin:0 auto;height:auto}
.diagram.loading{color:var(--muted);font-size:14px}
.chart{margin:0 0 20px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chart figcaption{font-weight:600;font-size:14px;margin:0 0 10px}
.bar-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.bar-label{color:var(--ink);line-height:1.3}
.bar-track{height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar{display:block;height:100%;background:var(--accent);border-radius:7px 0 0 7px}
.bar-val{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.chart-note{font-size:12px;color:var(--muted);margin-top:6px}

/* Contents view */
.contents h1{font-size:32px;margin:0 0 6px;letter-spacing:-.02em}
.contents .lead{color:var(--muted);margin:0 0 24px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.pcard h2{font-size:15px;margin:0 0 2px;line-height:1.3}
.pcard .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pcard ol{list-style:none;padding:0;margin:0}
.pcard li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13.5px;line-height:1.35}
.pcard li a{color:var(--ink);text-decoration:none;flex:1}
.pcard li a:hover{text-decoration:underline}
.contents-actions{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}

/* Mobile */
.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);height:auto;z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .menu-btn{display:inline-block}
  .main{padding:18px 16px 60px}
  .top-inner{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand{flex:1}
  .bank{order:3;flex-basis:100%}
  .bank-row{gap:3px}
  .bank-group{gap:1px;padding:2px}
  .cell{height:12px;max-width:none;min-width:0}
  .bank-row{flex-wrap:wrap;row-gap:3px;gap:3px}
  .bank-group{flex:0 0 calc(10% - 2.7px);gap:1px;padding:1px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const CHAPTERS = [{"id": 1, "title": "What cybersecurity is", "tldr": "Cybersecurity protects systems, networks, applications and data from unauthorized access, misuse, disruption and destruction. It combines technology, processes and people to prevent, detect, respond to and recover from attacks.", "real": "The 2017 WannaCry ransomware outbreak disrupted organizations worldwide, including parts of the UK’s National Health Service, using a Windows vulnerability for which Microsoft had released a patch two months earlier.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Protecting digital assets against threats |\n| Why it matters | Breaches cause financial, legal, safety and reputational harm |\n| Core activities | Identify, protect, detect, respond, recover (plus govern) |\n| Watch out for | Treating security as a product you buy rather than a practice |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  GOV[Govern] --> ID[Identify assets + risks]\n  ID --> PROTECT[Protect]\n  PROTECT --> DETECT[Detect]\n  DETECT --> RESPOND[Respond]\n  RESPOND --> RECOVER[Recover]\n  RECOVER --> ID\n```\n\n### Worked example\n\n| Function | Example activity |\n|---|---|\n| Identify | Inventory of servers, apps and data |\n| Protect | MFA, patching, encryption |\n| Detect | Alerts on suspicious logins |\n| Respond | Isolate a compromised laptop |\n| Recover | Restore systems from backups |"}, {"id": 2, "title": "The CIA triad", "tldr": "Security goals are usually framed as confidentiality (only authorized access), integrity (data is accurate and unaltered) and availability (systems work when needed). Every control protects one or more of these.", "real": "Ransomware attacks such as the 2021 Colonial Pipeline incident threaten all three at once: data is stolen (confidentiality), encrypted or altered (integrity) and systems become unusable (availability).", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Three core security properties |\n| Why it matters | Clarifies what each control protects |\n| Extensions | Authenticity, non-repudiation, privacy |\n| Watch out for | Ignoring availability in security planning |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  CIA[Security goals] --> C[Confidentiality: encryption, access control]\n  CIA --> I[Integrity: hashing, signatures, change control]\n  CIA --> A[Availability: redundancy, backups, DDoS protection]\n```\n\n### Worked example\n\n| Threat | Property affected | Control |\n|---|---|---|\n| Stolen laptop with customer data | Confidentiality | Full-disk encryption |\n| Tampered invoice amounts | Integrity | Digital signatures, audit logs |\n| DDoS on checkout | Availability | CDN + rate limiting |"}, {"id": 3, "title": "Risk: likelihood and impact", "tldr": "Security risk combines how likely a threat is to exploit a weakness with how much damage it would cause. Risk assessment prioritizes effort: reduce, transfer, accept or avoid each risk deliberately.", "real": "NIST’s Special Publication 800-30 provides a widely used methodology for conducting risk assessments by evaluating threats, vulnerabilities, likelihood and impact.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Quantifying potential harm |\n| Why it matters | Budgets are finite; risks are not equal |\n| Treatment | Mitigate, transfer (insurance), accept, avoid |\n| Watch out for | Security decisions based on fear rather than analysis |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  THREAT[Threat] --> LIKE[Likelihood]\n  VULN[Vulnerability] --> LIKE\n  ASSET[Asset value] --> IMPACT[Impact]\n  LIKE --> RISK[Risk]\n  IMPACT --> RISK\n  RISK --> TREAT[Mitigate / transfer / accept / avoid]\n```\n\n### Worked example\n\n| Risk | Likelihood (1–5) | Impact (1–5) | Score | Priority |\n|---|---|---|---|---|\n| Phishing → account takeover | 4 | 4 | 16 | High |\n| Unpatched VPN appliance | 3 | 5 | 15 | High |\n| Office flood | 1 | 3 | 3 | Low |"}, {"id": 4, "title": "Threats, vulnerabilities and exploits", "tldr": "A vulnerability is a weakness; a threat is something that could exploit it; an exploit is the method used; an incident is when harm occurs. Defenders reduce vulnerabilities, detect exploitation and limit impact.", "real": "The CVE program, launched by MITRE in 1999, assigns identifiers to publicly known vulnerabilities, and the CVE list has grown to hundreds of thousands of entries.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Core vocabulary of security |\n| Why it matters | Precise language enables precise decisions |\n| Identifiers | CVE (vulnerabilities), CWE (weakness types) |\n| Watch out for | Confusing a vulnerability’s existence with active exploitation |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  WEAK[Vulnerability: unpatched library] --> EXPLOIT[Exploit attempt]\n  ACTOR[Threat actor] --> EXPLOIT\n  EXPLOIT --> INC[Incident: data accessed]\n  CONTROL[Patch, WAF, monitoring] -.blocks.-> EXPLOIT\n```\n\n### Worked example\n\n| Term | Example |\n|---|---|\n| Vulnerability (CVE) | CVE-2021-44228 in Log4j |\n| Weakness type (CWE) | CWE-89 SQL injection |\n| Threat actor | Ransomware group |\n| Incident | Customer database exfiltrated |"}, {"id": 5, "title": "Threat actors and motivations", "tldr": "Attackers range from opportunistic criminals and ransomware gangs to hacktivists, insiders and state-sponsored groups. Their goals, such as money, data, disruption or espionage, shape their methods and persistence.", "real": "The FBI’s Internet Crime Complaint Center reported over $16 billion in reported losses for 2024, with business email compromise and investment fraud among the costliest categories.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Who attacks and why |\n| Why it matters | Defenses should match likely adversaries |\n| Categories | Criminals, ransomware groups, nation-states, hacktivists, insiders |\n| Watch out for | Assuming “we’re too small to be targeted” |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  ACTORS[Threat actors] --> CRIM[Criminals: money]\n  ACTORS --> RANSOM[Ransomware groups: extortion]\n  ACTORS --> STATE[Nation-states: espionage, disruption]\n  ACTORS --> HACK[Hacktivists: publicity]\n  ACTORS --> INSIDER[Insiders: grievance, money, mistakes]\n```\n\n### Worked example\n\n| Organization | Most likely threats |\n|---|---|\n| Small online shop | Card fraud, credential stuffing, phishing |\n| Hospital | Ransomware, insider misuse |\n| Defense supplier | Nation-state espionage |\n| SaaS startup | Account takeover, API abuse, supply chain |"}, {"id": 6, "title": "Defense in depth", "tldr": "Use multiple independent layers of controls so a single failure doesn’t lead to compromise: identity, network, endpoint, application, data, monitoring and recovery. Attackers must defeat several layers.", "real": "In many breach investigations, attackers succeeded because a single control, such as a password without MFA or an exposed management port, was the only barrier between the internet and sensitive systems.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Layered security controls |\n| Why it matters | Every control eventually fails |\n| Layers | Identity, network, endpoint, app, data, monitoring, recovery |\n| Watch out for | Many layers that all fail the same way |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ATTACK[Attacker] --> L1[MFA]\n  L1 --> L2[Network segmentation]\n  L2 --> L3[Endpoint protection]\n  L3 --> L4[App authorization]\n  L4 --> L5[Data encryption]\n  L5 --> L6[Monitoring + response]\n```\n\n### Worked example\n\n| Scenario | Layers that limit damage |\n|---|---|\n| Employee clicks phishing link | Phishing-resistant MFA, EDR, DNS filtering |\n| App has an SQL injection bug | WAF, least-privilege DB user, encryption, alerts |\n| Laptop stolen | Disk encryption, remote wipe, short sessions |"}, {"id": 7, "title": "Least privilege and zero trust principles", "tldr": "Grant users and systems only the access they need, for only as long as needed, and verify every request explicitly rather than trusting network location. These principles shrink the blast radius of any compromise.", "real": "Google’s BeyondCorp initiative (described from 2014) moved access decisions from the network perimeter to user and device identity, and NIST published zero trust architecture guidance (SP 800-207) in 2020.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Minimal access + continuous verification |\n| Why it matters | Limits what attackers can reach after a breach |\n| Practices | Role-based access, just-in-time admin, MFA, device checks |\n| Watch out for | Permanent admin rights “for convenience” |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REQ[Access request] --> ID[Verify identity + MFA]\n  ID --> DEV[Check device posture]\n  DEV --> POLICY[Evaluate least-privilege policy]\n  POLICY -->|allow| RES[Resource]\n  POLICY -->|deny| LOG[Deny + log]\n```\n\n### Worked example\n\n| Before | After |\n|---|---|\n| All engineers have production admin | Read-only by default; admin via approved, time-limited elevation |\n| VPN grants access to whole network | Per-application access through an identity-aware proxy |"}, {"id": 8, "title": "Secure design principles", "tldr": "Classic principles still guide secure systems: economy of mechanism (simplicity), fail-safe defaults (deny by default), complete mediation (check every access), open design, separation of privilege, least privilege, least common mechanism and psychological acceptability.", "real": "Saltzer and Schroeder published these eight design principles in 1975 in “The Protection of Information in Computer Systems”, and they remain foundational in security engineering courses.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Time-tested rules for secure design |\n| Why it matters | Prevent whole classes of flaws |\n| Key ideas | Simplicity, deny by default, check every access |\n| Watch out for | Security that depends on attackers not knowing the design |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  P[Design principles] --> S[Keep it simple]\n  P --> D[Deny by default]\n  P --> M[Check every access]\n  P --> O[Open design]\n  P --> SEP[Separation of privilege]\n  P --> LP[Least privilege]\n  P --> UX[Usable security]\n```\n\n### Worked example\n\n| Principle | Application |\n|---|---|\n| Fail-safe defaults | New API endpoints require authentication unless explicitly public |\n| Complete mediation | Authorization checked on every request, not only at login |\n| Separation of privilege | Production deploys need two approvals |\n| Psychological acceptability | Passkeys instead of complex password rules |"}, {"id": 9, "title": "Security frameworks", "tldr": "Frameworks give structure to security programs: NIST Cybersecurity Framework for overall management, ISO/IEC 27001 for certifiable management systems, CIS Controls for prioritized safeguards, and OWASP resources for application security.", "real": "NIST released Cybersecurity Framework 2.0 in February 2024, adding a “Govern” function to the original Identify, Protect, Detect, Respond and Recover functions and broadening its audience beyond critical infrastructure.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structured catalogs of security outcomes and controls |\n| Why it matters | Common language, completeness, auditability |\n| Common choices | NIST CSF 2.0, ISO/IEC 27001, CIS Controls, OWASP ASVS |\n| Watch out for | Checklist compliance without real risk reduction |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CSF[NIST CSF: what outcomes] --> ISO[ISO 27001: management system]\n  CSF --> CIS[CIS Controls: prioritized safeguards]\n  CSF --> OWASP[OWASP ASVS: app security requirements]\n```\n\n### Worked example\n\n| Need | Framework |\n|---|---|\n| Board-level program structure | NIST CSF 2.0 |\n| Customer-required certification | ISO/IEC 27001 |\n| Small team, where to start | CIS Controls Implementation Group 1 |\n| Web app security requirements | OWASP ASVS |"}, {"id": 10, "title": "Security roles and careers", "tldr": "Security work spans application security, cloud security, security operations, incident response, penetration testing, governance and compliance, security architecture and identity. Engineers in every role benefit from security fundamentals.", "real": "ISC2’s annual workforce studies have reported a global cybersecurity workforce gap of millions of people, reflecting strong demand for security skills.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Specializations in cybersecurity |\n| Why it matters | Guides learning paths |\n| Foundations | Networking, operating systems, programming, cloud, identity |\n| Watch out for | Collecting certifications without hands-on skills |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  SEC[Security careers] --> APPSEC[Application security]\n  SEC --> CLOUD[Cloud security]\n  SEC --> SOC[Security operations]\n  SEC --> IR[Incident response + forensics]\n  SEC --> PENTEST[Penetration testing]\n  SEC --> GRC[Governance, risk, compliance]\n  SEC --> ARCH[Security architecture]\n```\n\n### Worked example\n\n| Role | Typical day |\n|---|---|\n| AppSec engineer | Threat models, code reviews, fixing scanner findings with developers |\n| SOC analyst | Triage alerts, investigate suspicious activity |\n| Cloud security engineer | IAM policies, posture findings, guardrails |\n| GRC analyst | Control evidence, risk register, audits |"}, {"id": 11, "title": "Symmetric encryption", "tldr": "Symmetric encryption uses one shared key to encrypt and decrypt. Use AES in an authenticated mode such as GCM (or ChaCha20-Poly1305), never reuse a nonce with the same key, and protect keys in a key management system.", "real": "NIST selected the Rijndael algorithm as the Advanced Encryption Standard in 2001 (FIPS 197), and AES-GCM is now the dominant cipher for TLS and data-at-rest encryption.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Same key encrypts and decrypts |\n| Why it matters | Fast protection for data at rest and in transit |\n| Use | AES-256-GCM or ChaCha20-Poly1305 (authenticated encryption) |\n| Watch out for | ECB mode, unauthenticated modes, nonce reuse, hard-coded keys |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PT[Plaintext] --> ENC[AES-GCM encrypt]\n  KEY[Secret key] --> ENC\n  NONCE[Unique nonce] --> ENC\n  ENC --> CT[Ciphertext + auth tag]\n  CT --> DEC[AES-GCM decrypt + verify tag]\n  KEY --> DEC\n  DEC --> PT2[Plaintext or error if tampered]\n```\n\n### Worked example\n\n```python\nimport os\nfrom cryptography.hazmat.primitives.ciphers.aead import AESGCM\n\nkey = AESGCM.generate_key(bit_length=256)    # store in a KMS, not in code\naesgcm = AESGCM(key)\nnonce = os.urandom(12)                       # unique per encryption with this key\nct = aesgcm.encrypt(nonce, b\"PAN ending 4242\", b\"customer:42\")   # last arg = associated data\nassert aesgcm.decrypt(nonce, ct, b\"customer:42\") == b\"PAN ending 4242\"\n```"}, {"id": 12, "title": "Asymmetric cryptography", "tldr": "Public-key cryptography uses a key pair: the public key can be shared; the private key stays secret. It enables key exchange, digital signatures and certificates. Modern choices include elliptic curves (X25519, Ed25519, P-256) and RSA with sufficient key sizes.", "real": "Diffie and Hellman published public-key key exchange in 1976 and Rivest, Shamir and Adleman published RSA in 1977; elliptic-curve algorithms later became preferred for smaller keys and faster operations.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Key pairs for exchange and signatures |\n| Why it matters | Secure communication without pre-shared secrets |\n| Common choices | X25519 (key exchange), Ed25519 or ECDSA P-256 (signatures), RSA-3072+ |\n| Watch out for | Encrypting large data directly with RSA; weak key sizes |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  A[Alice private key] --> APUB[Alice public key]\n  B[Bob private key] --> BPUB[Bob public key]\n  A --> SHARED1[Shared secret]\n  BPUB --> SHARED1\n  B --> SHARED2[Same shared secret]\n  APUB --> SHARED2\n```\n\n### Worked example\n\n```python\nfrom cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey\nfrom cryptography.hazmat.primitives.kdf.hkdf import HKDF\nfrom cryptography.hazmat.primitives import hashes\n\nalice, bob = X25519PrivateKey.generate(), X25519PrivateKey.generate()\ns1 = alice.exchange(bob.public_key())\ns2 = bob.exchange(alice.public_key())\nassert s1 == s2\nkey = HKDF(algorithm=hashes.SHA256(), length=32, salt=None, info=b\"session v1\").derive(s1)\n```"}, {"id": 13, "title": "Hash functions", "tldr": "Cryptographic hash functions map data to fixed-size digests; small input changes produce completely different outputs, and finding collisions should be infeasible. Use SHA-256/SHA-3 for integrity; never MD5 or SHA-1 for security.", "real": "Google and CWI Amsterdam announced the first practical SHA-1 collision (“SHAttered”) in February 2017, accelerating SHA-1’s removal from certificates and Git’s move toward SHA-256 support.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | One-way fixed-length fingerprints |\n| Why it matters | Integrity checks, signatures, content addressing |\n| Use | SHA-256, SHA-512, SHA-3, BLAKE2/3 |\n| Watch out for | MD5/SHA-1; plain hashes for passwords |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  F1[installer.zip] --> H[SHA-256]\n  H --> D1[Digest A]\n  F2[installer.zip with 1 byte changed] --> H2[SHA-256]\n  H2 --> D2[Completely different digest]\n```\n\n### Worked example\n\n```python\nimport hashlib\n\nprint(hashlib.sha256(b\"hello\").hexdigest()[:16])   # 2cf24dba5fb0a30e\nprint(hashlib.sha256(b\"hellp\").hexdigest()[:16])   # different digest entirely\n```\n\n```bash\nsha256sum release.tar.gz    # compare with the digest published by the vendor\n```"}, {"id": 14, "title": "Message authentication codes", "tldr": "A MAC proves a message came from someone with the shared key and wasn’t altered. HMAC-SHA256 is standard for webhooks, API request signing and tokens. Compare MACs in constant time.", "real": "Payment and SaaS providers such as Stripe and GitHub sign webhook payloads with HMAC-SHA256 so receivers can verify that events really came from them.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Keyed integrity and authenticity check |\n| Why it matters | Detects tampering and forgery |\n| Use | HMAC-SHA256; include timestamps to prevent replay |\n| Watch out for | Comparing with == (timing leaks); missing timestamps |\n\n### Diagram\n\n```mermaid\nsequenceDiagram\n  participant S as Sender\n  participant R as Receiver\n  S->>S: tag = HMAC(key, timestamp + body)\n  S->>R: body + timestamp + tag\n  R->>R: recompute HMAC, constant-time compare, check timestamp age\n```\n\n### Worked example\n\n```python\nimport hmac, hashlib, time\n\ndef sign(key: bytes, body: bytes, ts: int) -> str:\n    return hmac.new(key, str(ts).encode() + b\".\" + body, hashlib.sha256).hexdigest()\n\ndef verify(key: bytes, body: bytes, ts: int, tag: str, max_age: int = 300) -> bool:\n    if abs(time.time() - ts) > max_age:\n        return False\n    return hmac.compare_digest(sign(key, body, ts), tag)\n```"}, {"id": 15, "title": "Digital signatures", "tldr": "Digital signatures use a private key to sign and a public key to verify, proving origin and integrity to anyone. They secure software updates, certificates, documents, tokens and package registries.", "real": "Code-signing and package-signing systems such as Sigstore (launched 2021) and Apple’s notarization rely on digital signatures so users can verify that software came from its stated publisher.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Publicly verifiable proof of authorship |\n| Why it matters | Trustworthy software, documents and tokens |\n| Use | Ed25519, ECDSA P-256, RSA-PSS |\n| Watch out for | Private keys stored on developer laptops |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  MSG[Release file] --> SIGN[Sign with private key]\n  SIGN --> SIG[Signature]\n  MSG --> VERIFY[Verify with public key]\n  SIG --> VERIFY\n  VERIFY --> OK{Valid?}\n```\n\n### Worked example\n\n```python\nfrom cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey\nfrom cryptography.exceptions import InvalidSignature\n\nsk = Ed25519PrivateKey.generate()\nmsg = b\"release v2.4.1 sha256=9f2c...\"\nsig = sk.sign(msg)\nsk.public_key().verify(sig, msg)                      # passes silently\ntry:\n    sk.public_key().verify(sig, msg + b\"tampered\")\nexcept InvalidSignature:\n    print(\"tampering detected\")\n```"}, {"id": 16, "title": "TLS", "tldr": "TLS secures data in transit with key exchange, server authentication via certificates, and authenticated encryption. Use TLS 1.2 or 1.3 only, modern cipher suites, automatic certificate renewal and HSTS for websites.", "real": "TLS 1.3, published as RFC 8446 in 2018, removed obsolete algorithms, made forward secrecy mandatory and reduced the handshake to one round trip.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Standard protocol for encrypted connections |\n| Why it matters | Protects credentials and data on networks |\n| Settings | TLS 1.2+ (prefer 1.3), HSTS, automated certificates |\n| Watch out for | Disabling certificate validation in client code |\n\n### Diagram\n\n```mermaid\nsequenceDiagram\n  participant C as Client\n  participant S as Server\n  C->>S: ClientHello + key share\n  S->>C: ServerHello + key share + certificate + Finished\n  C->>C: Verify certificate chain + hostname\n  C->>S: Finished + encrypted application data\n```\n\n### Worked example\n\n```nginx\nssl_protocols TLSv1.2 TLSv1.3;\nssl_prefer_server_ciphers off;\nadd_header Strict-Transport-Security \"max-age=31536000; includeSubDomains\" always;\n```\n\n```python\nimport requests\nrequests.get(\"https://api.example.com\", timeout=10)            # verifies certificates by default\n# Never: requests.get(url, verify=False)\n```"}, {"id": 17, "title": "PKI and certificates", "tldr": "Public key infrastructure binds public keys to identities through certificates signed by trusted certificate authorities. Certificates have validity periods, chains of trust and revocation mechanisms; automate issuance and monitor expiry.", "real": "The 2011 compromise of the Dutch certificate authority DigiNotar led to fraudulent certificates for domains including Google, and browsers removed DigiNotar from their trust stores; the company went bankrupt soon after.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | System of trusted certificates |\n| Why it matters | Authenticates servers, clients and code |\n| Practices | ACME automation, short lifetimes, Certificate Transparency monitoring |\n| Watch out for | Expired certificates causing outages |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  ROOT[Root CA: in trust store] --> INT[Intermediate CA]\n  INT --> LEAF[Leaf certificate: api.example.com]\n  LEAF --> SERVER[Server presents chain]\n  SERVER --> CLIENT[Client validates chain + hostname + dates]\n```\n\n### Worked example\n\n```bash\necho | openssl s_client -connect example.com:443 -servername example.com 2>/dev/null \\\n  | openssl x509 -noout -subject -issuer -enddate\n```\n\n| Check | Why |\n|---|---|\n| Issuer chain to trusted root | Authenticity |\n| Hostname matches | Prevents impersonation |\n| Not expired | Validity |\n| Certificate Transparency alerts for your domains | Detect mis-issuance |"}, {"id": 18, "title": "Password storage", "tldr": "Store passwords with slow, salted, memory-hard functions designed for passwords (Argon2id, scrypt, bcrypt), never with plain hashes or encryption. Check new passwords against breached lists and rate-limit login attempts.", "real": "Argon2 won the Password Hashing Competition in 2015, and OWASP’s Password Storage Cheat Sheet recommends Argon2id as the first choice for new systems.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Protecting stored credentials |\n| Why it matters | Database leaks shouldn’t reveal passwords |\n| Use | Argon2id (or scrypt/bcrypt) with appropriate cost |\n| Watch out for | MD5/SHA-1/SHA-256 without key stretching |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PW[Password] --> SALT[Add unique salt]\n  SALT --> KDF[Argon2id: slow + memory-hard]\n  KDF --> STORE[(Store hash string)]\n  LOGIN[Login attempt] --> VERIFY[Verify against stored hash]\n  STORE --> VERIFY\n```\n\n### Worked example\n\n```python\nfrom argon2 import PasswordHasher\n\nph = PasswordHasher()                      # Argon2id with recommended defaults\nstored = ph.hash(\"correct horse battery staple\")\nprint(stored[:30])                         # $argon2id$v=19$m=65536,t=3,p=4$...\nph.verify(stored, \"correct horse battery staple\")   # raises on mismatch\n```\n\n| Password policy | Recommendation (NIST SP 800-63B) |\n|---|---|\n| Minimum length | At least 8 (15 when password is the only factor in newer guidance); allow long passphrases |\n| Composition rules | Not required |\n| Periodic forced changes | Not required without evidence of compromise |\n| Breached password check | Required |"}, {"id": 19, "title": "Randomness and key management", "tldr": "Cryptography depends on unpredictable randomness and well-protected keys. Use the OS cryptographic random generator, store keys in KMS or HSMs, rotate them, separate duties and never commit keys to code.", "real": "In 2008 a Debian-specific change to OpenSSL’s random number generator left keys generated on affected systems guessable for nearly two years, requiring mass regeneration of SSH and TLS keys.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Generating and protecting cryptographic secrets |\n| Why it matters | Strong algorithms fail with weak keys |\n| Use | secrets / os.urandom; cloud KMS; HSMs for high value |\n| Watch out for | random.random() for tokens; keys in Git |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  KMS[KMS / HSM: master keys] --> DEK[Generate data key]\n  DEK --> ENC[Encrypt data]\n  KMS --> WRAP[Wrap data key]\n  WRAP --> STORE[(Store wrapped key with data)]\n  ROTATE[Scheduled rotation] --> KMS\n```\n\n### Worked example\n\n```python\nimport secrets\n\napi_token = secrets.token_urlsafe(32)        # ~256 bits of randomness\nreset_code = f\"{secrets.randbelow(10**6):06d}\"   # 6-digit code, cryptographically random\n# Never use the random module for security tokens\n```"}, {"id": 20, "title": "Post-quantum cryptography", "tldr": "Large quantum computers could break RSA and elliptic-curve cryptography. NIST has standardized post-quantum algorithms; organizations should inventory cryptography, prioritize long-lived secrets and plan crypto-agile migrations, often starting with hybrid key exchange.", "real": "NIST published its first post-quantum standards in August 2024: FIPS 203 (ML-KEM), FIPS 204 (ML-DSA) and FIPS 205 (SLH-DSA), and major browsers and Cloudflare deployed hybrid X25519 + ML-KEM key exchange for TLS.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Cryptography resistant to quantum attacks |\n| Why it matters | “Harvest now, decrypt later” threatens long-lived data |\n| Standards | ML-KEM (key encapsulation), ML-DSA and SLH-DSA (signatures) |\n| Watch out for | Hard-coded algorithms that can’t be swapped |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INV[Inventory crypto usage] --> PRIO[Prioritize long-lived data + key exchange]\n  PRIO --> HYBRID[Hybrid key exchange: X25519 + ML-KEM]\n  HYBRID --> AGILE[Crypto-agile libraries + configs]\n  AGILE --> SIGS[Migrate signatures as ecosystem matures]\n```\n\n### Worked example\n\n| System | Quantum risk | Priority |\n|---|---|---|\n| TLS for customer data with 10-year secrecy needs | Harvest-now-decrypt-later | High: hybrid key exchange |\n| Short-lived session tokens | Low | Later |\n| Code-signing roots | Long-lived trust | Plan migration |"}, {"id": 21, "title": "Authentication fundamentals", "tldr": "Authentication verifies identity using factors: something you know (password), have (phone, security key) or are (biometrics). Strong authentication combines factors and resists phishing; weak authentication is the most common breach entry point.", "real": "Verizon’s Data Breach Investigations Reports have consistently found stolen or misused credentials among the leading initial access methods in breaches.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Proving who a user or system is |\n| Why it matters | Identity is the new perimeter |\n| Factors | Knowledge, possession, inherence |\n| Watch out for | Password-only access to critical systems |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  USER[User] --> F1[Password]\n  USER --> F2[Security key / passkey]\n  F1 --> AUTH[Authentication service]\n  F2 --> AUTH\n  AUTH --> SESSION[Session / token issued]\n```\n\n### Worked example\n\n| Method | Phishing-resistant? | Strength |\n|---|---|---|\n| Password only | No | Weak |\n| Password + SMS code | No | Moderate |\n| Password + authenticator app | No | Good |\n| Passkey / FIDO2 security key | Yes | Strong |"}, {"id": 22, "title": "Password policy that works", "tldr": "Modern password guidance favors length over complexity, allows passphrases and password managers, blocks known-breached passwords, rate-limits attempts and avoids forced periodic changes. Pair passwords with MFA.", "real": "NIST SP 800-63B guidance moved away from composition rules and mandatory periodic changes, recommending screening against breached-password lists instead.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Rules for user-chosen secrets |\n| Why it matters | Bad rules push users to predictable patterns |\n| Recommended | Length, breached-list checks, rate limiting, MFA |\n| Watch out for | “Must change every 90 days” producing Password1, Password2… |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  NEW[New password] --> LEN{Long enough?}\n  LEN -->|no| REJECT[Reject]\n  LEN -->|yes| BREACH{In breached list?}\n  BREACH -->|yes| REJECT\n  BREACH -->|no| ACCEPT[Accept + hash with Argon2id]\n```\n\n### Worked example\n\nEntropy of random choices:\n\n```text\n8 random lowercase letters: log2(26^8) ≈ 37.6 bits\n4 random words from a 7,776-word list: log2(7776^4) ≈ 51.7 bits\n6 random words: ≈ 77.5 bits\n```"}, {"id": 23, "title": "Multi-factor authentication and passkeys", "tldr": "MFA blocks most credential attacks, but SMS codes and push prompts can be phished or abused. Phishing-resistant MFA (FIDO2 security keys, passkeys) binds authentication to the real website, defeating fake login pages.", "real": "Attackers compromised Uber in September 2022 partly through MFA fatigue, repeatedly sending push requests until a contractor accepted, which accelerated adoption of number matching and phishing-resistant MFA.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Additional authentication factors |\n| Why it matters | Stops password-only compromise |\n| Best options | Passkeys, FIDO2 security keys |\n| Watch out for | Push MFA without number matching; SMS for admins |\n\n### Diagram\n\n```mermaid\nsequenceDiagram\n  participant U as User\n  participant B as Browser\n  participant S as Real site\n  S->>B: Challenge + origin\n  B->>U: Unlock passkey (biometric/PIN)\n  U->>B: Approve\n  B->>S: Signature bound to real origin\n  Note over B,S: A fake site gets a signature for the wrong origin, so it's useless\n```\n\n### Worked example\n\n```python\nimport pyotp\n\nsecret = pyotp.random_base32()          # stored encrypted server-side at enrollment\ntotp = pyotp.TOTP(secret)\ncode = totp.now()                       # what the authenticator app shows\nprint(totp.verify(code))                # True within the 30-second window\n```\n\n(TOTP is better than SMS but still phishable; prefer passkeys for high-value accounts.)"}, {"id": 24, "title": "Single sign-on: SAML and OpenID Connect", "tldr": "Single sign-on lets users authenticate once with an identity provider and access many applications. SAML is common in enterprises; OpenID Connect (built on OAuth 2.0) is standard for modern web and mobile apps.", "real": "SAML 2.0 was ratified by OASIS in 2005 and OpenID Connect 1.0 was finalized in 2014; identity providers such as Microsoft Entra ID, Okta and Google Workspace support both.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Central authentication for many apps |\n| Why it matters | Fewer passwords, central MFA and offboarding |\n| Protocols | SAML 2.0, OpenID Connect |\n| Watch out for | Weak validation of assertions or ID tokens |\n\n### Diagram\n\n```mermaid\nsequenceDiagram\n  participant U as User\n  participant A as App\n  participant IDP as Identity provider\n  U->>A: Open app\n  A->>IDP: Redirect for login\n  U->>IDP: Authenticate + MFA\n  IDP->>A: Signed assertion / ID token\n  A->>A: Validate signature, issuer, audience, expiry\n  A->>U: Logged in\n```\n\n### Worked example\n\n| Validation check | Why |\n|---|---|\n| Signature with IdP’s key | Authenticity |\n| Issuer and audience | Token meant for this app |\n| Expiry and not-before | Freshness |\n| Nonce / InResponseTo | Prevent replay |"}, {"id": 25, "title": "OAuth 2.0 for delegated access", "tldr": "OAuth 2.0 lets users grant applications limited access to their data without sharing passwords. Use the authorization code flow with PKCE, narrow scopes, short-lived access tokens and secure token storage.", "real": "OAuth 2.0 was published as RFC 6749 in 2012, and the OAuth 2.0 Security Best Current Practice (RFC 9700, January 2025) recommends PKCE for authorization code flows and deprecates the implicit and password grants.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Delegated authorization framework |\n| Why it matters | Safe third-party integrations |\n| Recommended | Authorization code + PKCE; client credentials for services |\n| Watch out for | Overly broad scopes; tokens in URLs or logs |\n\n### Diagram\n\n```mermaid\nsequenceDiagram\n  participant App\n  participant AS as Authorization server\n  participant API\n  App->>AS: Authorize (scope, code_challenge)\n  AS-->>App: Authorization code\n  App->>AS: Token request (code, code_verifier)\n  AS-->>App: Access token (short-lived)\n  App->>API: Request with access token\n```\n\n### Worked example\n\n| Scope design | Risk |\n|---|---|\n| `full_access` | Leaked token = total compromise |\n| `orders:read` | Limited to reading orders |\n| `orders:read` + 15-minute expiry | Limited scope and time |"}, {"id": 26, "title": "Session management", "tldr": "After login, sessions must be protected: random session IDs, secure cookies (HttpOnly, Secure, SameSite), regeneration after login, idle and absolute timeouts, and server-side invalidation on logout or password change.", "real": "OWASP’s Session Management Cheat Sheet lists session fixation, theft via XSS and missing invalidation as recurring weaknesses in web applications.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Maintaining authenticated state safely |\n| Why it matters | Stolen sessions bypass passwords and MFA |\n| Controls | Secure cookies, rotation, timeouts, revocation |\n| Watch out for | Session IDs in URLs; no logout invalidation |\n\n### Diagram\n\n```mermaid\nstateDiagram-v2\n  [*] --> Anonymous\n  Anonymous --> Authenticated: login (new session ID)\n  Authenticated --> Authenticated: activity (refresh idle timer)\n  Authenticated --> Expired: idle or absolute timeout\n  Authenticated --> Anonymous: logout (server-side invalidation)\n  Expired --> Anonymous\n```\n\n### Worked example\n\n```http\nSet-Cookie: session=Q2x...; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=28800\n```\n\n| Setting | Recommendation |\n|---|---|\n| Idle timeout | 15–30 min for sensitive apps |\n| Absolute timeout | 8–12 hours |\n| Regenerate ID | After login and privilege change |\n| Invalidate | On logout and password reset |"}, {"id": 27, "title": "Authorization models", "tldr": "Authorization decides what authenticated users may do. Role-based access control (RBAC) groups permissions into roles; attribute-based (ABAC) evaluates attributes and context; relationship-based (ReBAC) derives access from relationships such as ownership and sharing.", "real": "Broken access control ranked first in the OWASP Top 10 (2021 edition), found in 94% of applications tested for some form of it according to OWASP’s data.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Permission models |\n| Why it matters | Most data leaks involve authorization flaws |\n| Models | RBAC, ABAC, ReBAC |\n| Watch out for | Checking roles but not ownership of specific records |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REQ[User wants to edit document 42] --> RBAC{Role allows editing?}\n  RBAC -->|yes| OWN{Owner or shared with user?}\n  OWN -->|yes| ABAC{Context ok: device, time, region?}\n  ABAC -->|yes| ALLOW[Allow]\n  RBAC -->|no| DENY[Deny]\n  OWN -->|no| DENY\n  ABAC -->|no| DENY\n```\n\n### Worked example\n\n| Model | Rule example |\n|---|---|\n| RBAC | Managers can approve expenses |\n| ABAC | Approve only expenses under ₹50,000 in own region |\n| ReBAC | Can edit document if editor of its folder |"}, {"id": 28, "title": "Privileged access management", "tldr": "Privileged accounts (admins, root, service accounts with broad rights) are prime targets. Minimize them, require strong MFA, grant just-in-time elevation with approval, record sessions and rotate credentials.", "real": "CISA and other agencies’ advisories repeatedly cite compromised privileged accounts and domain administrator credentials as key steps in major ransomware intrusions.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Controls over powerful accounts |\n| Why it matters | Admin compromise = full compromise |\n| Controls | JIT elevation, approval, MFA, session recording, vaulting |\n| Watch out for | Shared admin passwords; standing admin rights |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ENG[Engineer] --> REQ[Request admin for 1 hour + reason]\n  REQ --> APPROVE[Approver]\n  APPROVE --> GRANT[Temporary elevation]\n  GRANT --> SESSION[Recorded session]\n  SESSION --> REVOKE[Automatic revocation]\n```\n\n### Worked example\n\n| Before | After |\n|---|---|\n| 40 people with permanent domain admin | 3 break-glass accounts + JIT elevation |\n| Shared root password in a spreadsheet | Vaulted, rotated, checked out with approval |\n| No admin session logs | Recorded and reviewed sessions |"}, {"id": 29, "title": "Identity lifecycle management", "tldr": "Manage identities from joining to moving roles to leaving: automated provisioning from HR systems, role-based access packages, periodic access reviews and immediate deprovisioning. Orphaned accounts are common attack paths.", "real": "Breach investigations frequently find former employees’ or contractors’ accounts still active months after departure, which is why auditors check timely deprovisioning.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Joiner–mover–leaver processes |\n| Why it matters | Access must match current roles |\n| Tools | SCIM provisioning, IGA platforms, access reviews |\n| Watch out for | Access accumulating as people change teams |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  HR[HR system] -->|joiner| PROV[Provision role-based access]\n  HR -->|mover| ADJUST[Remove old, add new access]\n  HR -->|leaver| DEPROV[Disable all accounts same day]\n  REVIEW[Quarterly access reviews] --> ADJUST\n```\n\n### Worked example\n\n| Event | Action | SLA |\n|---|---|---|\n| New hire | Accounts via SCIM from HR | Day 1 |\n| Team change | Old access removed | 5 days |\n| Termination | All access disabled | Same day (hours) |\n| Quarterly review | Managers certify access | 30 days |"}, {"id": 30, "title": "Attacks on identity", "tldr": "Common identity attacks include phishing, credential stuffing with leaked passwords, password spraying, MFA fatigue, session token theft and help-desk social engineering. Defend with phishing-resistant MFA, anomaly detection and strong recovery processes.", "real": "In 2023, attackers used help-desk social engineering to gain access at MGM Resorts, leading to major operational disruption, and in 2024 credentials stolen by infostealer malware were used to access Snowflake customer accounts that lacked MFA.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Techniques targeting accounts and sessions |\n| Why it matters | Most intrusions start with identity |\n| Defenses | Passkeys, rate limits, breached-password checks, anomaly detection, verified help-desk processes |\n| Watch out for | Help desks resetting MFA based on a phone call alone |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  ATT[Identity attacks] --> PH[Phishing]\n  ATT --> CS[Credential stuffing]\n  ATT --> PS[Password spraying]\n  ATT --> MF[MFA fatigue]\n  ATT --> ST[Session token theft]\n  ATT --> HD[Help-desk social engineering]\n  PH --> D1[Passkeys]\n  CS --> D2[Breached-password checks + rate limits]\n  MF --> D3[Number matching / passkeys]\n  HD --> D4[Strong identity verification for resets]\n```\n\n### Worked example\n\n| Detection signal | Possible attack |\n|---|---|\n| Many failed logins, many accounts, one IP | Password spraying |\n| Many logins with valid passwords from new IPs | Credential stuffing |\n| Repeated MFA push denials then one approval | MFA fatigue |\n| Same session token from two countries | Token theft |"}, {"id": 31, "title": "Network fundamentals for security", "tldr": "Security engineers need to understand IP addressing, ports, TCP/UDP, routing, NAT, DNS and common protocols, because attacks and defenses operate on them. Know what normal traffic looks like to spot abnormal traffic.", "real": "Exposed services such as RDP (port 3389) and unpatched VPN appliances have repeatedly been major initial access vectors for ransomware, according to CISA advisories.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Networking knowledge applied to security |\n| Why it matters | Exposure and lateral movement happen over networks |\n| Key concepts | Ports, protocols, routing, NAT, DNS, segmentation |\n| Watch out for | Management interfaces exposed to the internet |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INTERNET[Internet] --> EDGE[Edge firewall / WAF]\n  EDGE --> DMZ[Public services]\n  DMZ --> APP[Internal app tier]\n  APP --> DATA[Data tier]\n  ADMIN[Admin access] -->|VPN / ZTNA only| APP\n```\n\n### Worked example\n\n| Port | Service | Should it face the internet? |\n|---|---|---|\n| 443 | HTTPS | Yes (web apps) |\n| 22 | SSH | No: use bastion/ZTNA |\n| 3389 | RDP | No |\n| 5432 / 3306 | PostgreSQL / MySQL | No |\n| 6379 | Redis | No |"}, {"id": 32, "title": "Firewalls and segmentation", "tldr": "Firewalls allow or deny traffic by rules; segmentation splits networks into zones so a compromise in one zone can’t freely reach others. Default-deny rules and documented flows are the foundation.", "real": "The 2013 Target breach began with credentials stolen from an HVAC vendor and spread to point-of-sale systems, a widely cited example of insufficient segmentation between vendor access and payment systems.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Traffic filtering and network zoning |\n| Why it matters | Limits lateral movement |\n| Practices | Default deny, least-privilege flows, separate admin networks |\n| Watch out for | “Allow any any” rules added during incidents and never removed |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  USERS[User zone] -->|443 only| WEB[Web zone]\n  WEB -->|8080 only| APP[App zone]\n  APP -->|5432 only| DB[Database zone]\n  USERS -.blocked.-> DB\n```\n\n### Worked example\n\n```text\n# nftables sketch: default deny inbound, allow HTTPS and established traffic\ntable inet filter {\n  chain input {\n    type filter hook input priority 0; policy drop;\n    ct state established,related accept\n    iif lo accept\n    tcp dport 443 accept\n  }\n}\n```"}, {"id": 33, "title": "Zero trust architecture", "tldr": "Zero trust assumes no implicit trust based on network location. Every access request is authenticated, authorized and encrypted, with decisions based on identity, device health and context, and access limited to specific resources.", "real": "NIST SP 800-207 (2020) defined zero trust architecture components, and US federal agencies were directed by OMB memorandum M-22-09 (2022) to move toward zero trust.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Identity-centric, per-request access control |\n| Why it matters | Perimeters don’t stop stolen credentials |\n| Components | Identity provider, policy engine, device trust, enforcement points |\n| Watch out for | Calling a VPN refresh “zero trust” |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  USER[User + device] --> PEP[Policy enforcement point]\n  PEP --> PDP[Policy decision: identity, device, context]\n  PDP -->|allow| APP[Specific application]\n  PDP -->|deny| LOG[Deny + log]\n  SIGNALS[Threat intel, device health, risk score] --> PDP\n```\n\n### Worked example\n\n| Request | Decision |\n|---|---|\n| Engineer, managed laptop, MFA, accessing Git | Allow |\n| Same engineer, unmanaged phone, accessing production console | Deny |\n| Contractor, MFA, accessing HR app | Deny (not entitled) |"}, {"id": 34, "title": "VPNs and zero trust network access", "tldr": "Traditional VPNs put users on the internal network; ZTNA grants access only to specific applications after identity and device checks. VPN appliances are frequent targets and must be patched urgently.", "real": "Vulnerabilities in VPN and edge appliances from vendors including Pulse Secure/Ivanti, Fortinet and Citrix were widely exploited between 2019 and 2025, appearing repeatedly in CISA’s Known Exploited Vulnerabilities catalog.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Remote access approaches |\n| Why it matters | Remote access is a major entry point |\n| Trend | From network-level VPN to app-level ZTNA |\n| Watch out for | Unpatched internet-facing appliances |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  subgraph VPN\n    U1[User] --> V[VPN gateway] --> NET[Whole internal network]\n  end\n  subgraph ZTNA\n    U2[User] --> Z[ZTNA broker] --> A1[App A only]\n  end\n```\n\n### Worked example\n\n| Control | VPN | ZTNA |\n|---|---|---|\n| Access scope | Network | Per application |\n| Device checks | Optional | Built in |\n| Lateral movement risk | High | Low |\n| Exposed attack surface | VPN appliance | Broker (often cloud-managed) |"}, {"id": 35, "title": "DNS security", "tldr": "DNS can be abused for phishing domains, hijacking, tunneling data out and malware command-and-control. Protect registrar accounts with MFA and locks, use DNSSEC where appropriate, monitor lookalike domains and filter malicious domains.", "real": "DNS hijacking campaigns such as “Sea Turtle” (reported by Cisco Talos in 2019) compromised registrars and DNS providers to redirect traffic for government and energy organizations.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Protecting name resolution and domains |\n| Why it matters | DNS control = traffic control |\n| Controls | Registrar MFA + lock, DNSSEC, protective DNS, monitoring |\n| Watch out for | Domain expiry and dangling DNS records (subdomain takeover) |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ENDPOINT[Endpoint] --> RESOLVER[Protective DNS resolver]\n  RESOLVER -->|known malicious| BLOCK[Block + alert]\n  RESOLVER -->|ok| AUTH[Authoritative DNS]\n  REG[Registrar account: MFA + lock] --> AUTH\n```\n\n### Worked example\n\n| Risk | Check |\n|---|---|\n| Dangling CNAME to deleted cloud resource | Remove records when resources are deleted |\n| Expiring domain | Auto-renew + alerts |\n| Lookalike phishing domain (examp1e.com) | Brand monitoring |\n| Registrar takeover | MFA, registry lock |"}, {"id": 36, "title": "Email security", "tldr": "Email is the top phishing channel. Authenticate your domains with SPF, DKIM and DMARC (moving to p=reject), filter inbound mail, sandbox attachments, label external senders and train users to report suspicious emails.", "real": "Google and Yahoo began enforcing requirements for bulk senders in February 2024, including SPF, DKIM and DMARC authentication, pushing widespread DMARC adoption.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Protecting email channels |\n| Why it matters | Phishing and business email compromise |\n| Controls | SPF, DKIM, DMARC, filtering, sandboxing, reporting button |\n| Watch out for | DMARC stuck at p=none forever |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  MAIL[Incoming email] --> SPF[SPF: authorized sender IP?]\n  MAIL --> DKIM[DKIM: valid signature?]\n  SPF --> DMARC[DMARC: aligned with From domain?]\n  DKIM --> DMARC\n  DMARC -->|fail + p=reject| REJECT[Reject]\n  DMARC -->|pass| FILTER[Content + attachment filtering]\n```\n\n### Worked example\n\n```text\nexample.com.         TXT \"v=spf1 include:_spf.google.com -all\"\n_dmarc.example.com.  TXT \"v=DMARC1; p=reject; rua=mailto:dmarc-reports@example.com\"\n```"}, {"id": 37, "title": "DDoS protection", "tldr": "Distributed denial-of-service attacks overwhelm services with traffic. Defend with CDNs and scrubbing services, anycast networks, rate limiting, caching, autoscaling limits and application-layer protections.", "real": "The 2016 Mirai botnet of compromised IoT devices attacked DNS provider Dyn, disrupting many major websites, and record attack sizes have kept growing, with providers such as Cloudflare reporting multi-terabit-per-second attacks in 2024–2025.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Defending availability against traffic floods |\n| Why it matters | Outages cost revenue and trust |\n| Layers | Network (L3/4) scrubbing, application (L7) rate limits and bot defense |\n| Watch out for | Origin IP exposed, bypassing the CDN |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BOTS[Botnet traffic] --> EDGE[CDN / anycast scrubbing]\n  USERS[Real users] --> EDGE\n  EDGE -->|clean traffic| WAF[WAF + rate limits]\n  WAF --> ORIGIN[Origin: accepts only CDN IPs]\n```\n\n### Worked example\n\n| Layer | Control |\n|---|---|\n| Volumetric | Upstream scrubbing / anycast CDN |\n| Protocol | SYN cookies, connection limits |\n| Application | Rate limits, challenges, caching |\n| Origin | Firewall allowing only CDN ranges |"}, {"id": 38, "title": "Intrusion detection and prevention", "tldr": "IDS monitors traffic or hosts for malicious patterns and alerts; IPS can block them inline. Signature-based detection catches known threats; anomaly-based detection finds unusual behavior. Tune rules to reduce noise.", "real": "Open-source tools such as Suricata and Zeek are widely used for network detection and monitoring, and Zeek (formerly Bro, created in the 1990s) produces rich connection logs for investigations.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Detecting (and blocking) malicious activity |\n| Why it matters | Visibility into attacks that bypass prevention |\n| Types | Network IDS/IPS, host-based IDS, cloud-native detection |\n| Watch out for | Untuned rules causing alert fatigue |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TRAFFIC[Network traffic] --> SENSOR[IDS sensor]\n  SENSOR --> SIG[Signature match]\n  SENSOR --> ANOM[Anomaly detection]\n  SIG --> ALERT[Alert to SIEM]\n  ANOM --> ALERT\n  ALERT --> ANALYST[Analyst triage]\n```\n\n### Worked example\n\n| Detection | Example |\n|---|---|\n| Signature | Known malware command-and-control pattern |\n| Anomaly | Server suddenly uploading 50 GB at 3 a.m. |\n| Policy | Database server making outbound internet connections |"}, {"id": 39, "title": "Network monitoring and flow logs", "tldr": "Collect flow logs (who talked to whom, when, how much), DNS logs and proxy logs centrally. They enable detection of data exfiltration, command-and-control and lateral movement, and are essential for incident investigations.", "real": "Cloud providers offer flow logs (AWS VPC Flow Logs, Azure NSG/VNet flow logs, Google VPC Flow Logs), and incident responders routinely use them to reconstruct attacker activity.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Metadata about network connections |\n| Why it matters | Investigations and detection |\n| Sources | Flow logs, DNS logs, proxy logs, firewall logs |\n| Watch out for | Logs not retained long enough for investigations |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  VPC[VPC flow logs] --> SIEM[SIEM / data lake]\n  DNSL[DNS logs] --> SIEM\n  PROXY[Proxy logs] --> SIEM\n  SIEM --> DETECT[Detections: exfiltration, beaconing]\n  SIEM --> HUNT[Investigations]\n```\n\n### Worked example\n\n| Pattern in flow logs | Possible meaning |\n|---|---|\n| Regular small connections every 60 s to one external IP | Malware beaconing |\n| Large outbound transfer to unknown host | Data exfiltration |\n| Internal host scanning many internal IPs | Lateral movement |"}, {"id": 40, "title": "Wireless and remote work security", "tldr": "Secure Wi-Fi with WPA3 (or WPA2-Enterprise), separate guest networks, and enterprise authentication. For remote work, rely on managed devices, encrypted connections, MFA and endpoint protection rather than trusting home networks.", "real": "The Wi-Fi Alliance introduced WPA3 in 2018, adding protections against offline password-guessing attacks that affected WPA2-Personal networks.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Securing wireless and remote access |\n| Why it matters | Untrusted networks are everywhere |\n| Controls | WPA3, 802.1X, guest isolation, managed devices, ZTNA |\n| Watch out for | Shared Wi-Fi password for corporate network |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EMP[Employee device] -->|802.1X / WPA3-Enterprise| CORP[Corporate Wi-Fi]\n  GUEST[Guest device] --> GUESTNET[Isolated guest network]\n  REMOTE[Remote employee] -->|ZTNA + MFA| APPS[Company apps]\n```\n\n### Worked example\n\n| Network | Configuration |\n|---|---|\n| Corporate | WPA3-Enterprise, certificates per device |\n| Guest | Internet only, client isolation |\n| IoT devices | Separate VLAN, restricted outbound |\n| Remote | No trust in home network; app-level access |"}, {"id": 41, "title": "The OWASP Top 10", "tldr": "The OWASP Top 10 lists the most critical web application security risks, based on data and community input. It’s an awareness baseline: use it to guide training, design reviews and testing, then go deeper with ASVS.", "real": "The 2021 edition ranked broken access control first, followed by cryptographic failures and injection, and added insecure design, software and data integrity failures and server-side request forgery; OWASP announced an updated 2025 edition in late 2025.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Awareness list of top web app risks |\n| Why it matters | Shared vocabulary for developers and security |\n| Next step | OWASP ASVS for detailed requirements |\n| Watch out for | Treating the Top 10 as a complete security standard |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  TOP[OWASP Top 10 2021] --> A1[A01 Broken access control]\n  TOP --> A2[A02 Cryptographic failures]\n  TOP --> A3[A03 Injection]\n  TOP --> A4[A04 Insecure design]\n  TOP --> A5[A05 Security misconfiguration]\n  TOP --> A6[A06 Vulnerable components]\n  TOP --> A7[A07 Identification and authentication failures]\n  TOP --> A8[A08 Software and data integrity failures]\n  TOP --> A9[A09 Logging and monitoring failures]\n  TOP --> A10[A10 Server-side request forgery]\n```\n\n### Worked example\n\n| Risk | Typical fix |\n|---|---|\n| A01 Broken access control | Object-level checks on every request |\n| A03 Injection | Parameterized queries, safe APIs |\n| A05 Misconfiguration | Hardened defaults, no debug in production |\n| A06 Vulnerable components | Dependency scanning and updates |"}, {"id": 42, "title": "How browsers enforce security", "tldr": "Browsers isolate websites with the same-origin policy: scripts from one origin can’t read data from another. Cookies, CORS, CSP, SameSite and site isolation build on this. Web security bugs often break these boundaries.", "real": "After the 2018 Spectre disclosures, Chrome enabled Site Isolation, placing different sites in separate processes to strengthen the same-origin boundary against side-channel attacks.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Browser rules separating websites |\n| Why it matters | Foundation of web security |\n| Origin | Scheme + host + port |\n| Watch out for | Misconfigured CORS weakening the boundary |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SITEA[https://app.example.com script] -->|same origin: allowed| APIA[https://app.example.com/api]\n  SITEA -->|different origin: response blocked unless CORS allows| APIB[https://bank.example.net/api]\n```\n\n### Worked example\n\n| URL A | URL B | Same origin? |\n|---|---|---|\n| https://app.example.com | https://app.example.com/page | Yes |\n| https://app.example.com | http://app.example.com | No (scheme) |\n| https://app.example.com | https://api.example.com | No (host) |\n| https://app.example.com | https://app.example.com:8443 | No (port) |"}, {"id": 43, "title": "Input validation and output encoding", "tldr": "Validate input at trust boundaries (type, length, format, allowed values) and encode output for its destination context (HTML, JavaScript, URL, SQL parameters, shell arguments). Validation reduces attack surface; correct encoding prevents injection.", "real": "OWASP’s Input Validation and Cross Site Scripting Prevention cheat sheets emphasize that output encoding in the correct context, not input filtering alone, is the primary defense against injection into browsers.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Checking inputs and safely rendering outputs |\n| Why it matters | Prevents injection and data corruption |\n| Rules | Allow-list validation; context-aware encoding |\n| Watch out for | Blocklists of “bad characters” |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INPUT[Untrusted input] --> VALIDATE[Validate: type, length, format]\n  VALIDATE --> LOGIC[Business logic]\n  LOGIC --> ENCODE{Output context}\n  ENCODE -->|HTML| HTMLENC[HTML encode / template autoescape]\n  ENCODE -->|SQL| PARAM[Parameterized query]\n  ENCODE -->|Shell| ARGS[Argument list, no shell]\n```\n\n### Worked example\n\n```python\nfrom pydantic import BaseModel, Field, ConfigDict\n\nclass Signup(BaseModel):\n    model_config = ConfigDict(extra=\"forbid\")\n    username: str = Field(pattern=r\"^[a-z0-9_]{3,30}$\")\n    age: int = Field(ge=13, le=120)\n    country: str = Field(pattern=r\"^[A-Z]{2}$\")\n```"}, {"id": 44, "title": "HTTP security headers", "tldr": "Response headers instruct browsers to enforce protections: HSTS (HTTPS only), Content-Security-Policy (restrict scripts), X-Content-Type-Options (no MIME sniffing), frame-ancestors (clickjacking), Referrer-Policy and Permissions-Policy.", "real": "Mozilla’s HTTP Observatory and similar scanners grade websites on security headers, and many organizations use them as baseline checks in CI or periodic audits.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Browser-enforced protections via headers |\n| Why it matters | Cheap, broad defense in depth |\n| Core headers | HSTS, CSP, X-Content-Type-Options, frame-ancestors, Referrer-Policy |\n| Watch out for | CSP with `'unsafe-inline'` scripts negating protection |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SERVER[Server / CDN] --> H1[Strict-Transport-Security]\n  SERVER --> H2[Content-Security-Policy]\n  SERVER --> H3[X-Content-Type-Options: nosniff]\n  SERVER --> H4[Referrer-Policy]\n  H1 --> BROWSER[Browser enforces]\n  H2 --> BROWSER\n  H3 --> BROWSER\n  H4 --> BROWSER\n```\n\n### Worked example\n\n```http\nStrict-Transport-Security: max-age=31536000; includeSubDomains\nContent-Security-Policy: default-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'\nX-Content-Type-Options: nosniff\nReferrer-Policy: strict-origin-when-cross-origin\nPermissions-Policy: camera=(), microphone=(), geolocation=()\n```"}, {"id": 45, "title": "Cookies and session security", "tldr": "Session cookies should be HttpOnly (not readable by scripts), Secure (HTTPS only), SameSite (limits cross-site sending) and scoped tightly with appropriate lifetimes. Prefixes such as __Host- add further guarantees.", "real": "Chrome changed the default SameSite behavior to Lax in 2020, reducing many cross-site request forgery risks for sites that hadn’t set the attribute.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Secure configuration of browser cookies |\n| Why it matters | Cookies carry authentication |\n| Attributes | HttpOnly, Secure, SameSite, Path, Max-Age, __Host- prefix |\n| Watch out for | Auth tokens in localStorage accessible to any script |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  COOKIE[Session cookie] --> HO[HttpOnly: JS can't read]\n  COOKIE --> SEC[Secure: HTTPS only]\n  COOKIE --> SS[SameSite=Lax: limited cross-site sending]\n  COOKIE --> HOST[__Host- prefix: host-only, Path=/]\n```\n\n### Worked example\n\n```http\nSet-Cookie: __Host-session=9f1c...; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=28800\n```"}, {"id": 46, "title": "Cross-site request forgery", "tldr": "CSRF tricks a logged-in user’s browser into sending unwanted state-changing requests to your site. Defend with SameSite cookies, anti-CSRF tokens for cookie-authenticated forms, checking Origin headers and never changing state with GET.", "real": "CSRF was a long-standing OWASP Top 10 entry before browser SameSite defaults and framework protections (such as Django’s and Rails’ built-in CSRF tokens) made it less common.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Forged requests using the victim’s session |\n| Why it matters | Unwanted transfers, setting changes |\n| Defenses | SameSite cookies, CSRF tokens, Origin checks |\n| Watch out for | GET endpoints that change state |\n\n### Diagram\n\n```mermaid\nsequenceDiagram\n  participant V as Victim browser\n  participant E as Malicious site\n  participant B as Your site\n  V->>E: Visits malicious page\n  E->>V: Page auto-submits form to your site\n  V->>B: POST /transfer with session cookie?\n  B->>B: SameSite blocks cookie or CSRF token missing → reject\n```\n\n### Worked example\n\n| Defense | How |\n|---|---|\n| SameSite=Lax/Strict | Cookie not sent on cross-site POST |\n| CSRF token | Hidden form field matched to session |\n| Origin check | Reject requests from unexpected origins |\n| Framework default | Django CsrfViewMiddleware, Rails protect_from_forgery |"}, {"id": 47, "title": "CORS configuration", "tldr": "CORS lets servers allow specific other origins to read responses in browsers. Allow only known origins, avoid reflecting arbitrary Origin headers, and be especially careful when allowing credentials. CORS is not an authentication mechanism.", "real": "Misconfigured CORS that reflects any origin while allowing credentials is a common finding in bug bounty programs, since it lets malicious sites read authenticated responses.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Controlled relaxation of same-origin policy |\n| Why it matters | Mistakes expose authenticated data |\n| Rule | Explicit allow-list; credentials only for trusted origins |\n| Watch out for | Access-Control-Allow-Origin reflecting the request’s Origin |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  REQ[Request with Origin header] --> LIST{Origin in allow-list?}\n  LIST -->|yes| ALLOW[Set Access-Control-Allow-Origin to that origin]\n  LIST -->|no| NONE[No CORS headers: browser blocks read]\n```\n\n### Worked example\n\n```python\nfrom fastapi.middleware.cors import CORSMiddleware\n\napp.add_middleware(\n    CORSMiddleware,\n    allow_origins=[\"https://app.example.com\"],     # explicit list, never \"*\" with credentials\n    allow_credentials=True,\n    allow_methods=[\"GET\", \"POST\"],\n    allow_headers=[\"Authorization\", \"Content-Type\"],\n)\n```"}, {"id": 48, "title": "Secure file uploads", "tldr": "File uploads risk malware, oversized files, dangerous file types and path manipulation. Validate type by content, limit size, rename files, store outside the web root (object storage), scan when needed and serve with safe headers.", "real": "Image-processing vulnerabilities such as ImageTragick in ImageMagick (2016) showed how processing untrusted uploads can lead to server compromise, encouraging sandboxed processing.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Safely accepting user files |\n| Why it matters | Uploads are a common attack vector |\n| Controls | Size limits, content-type checks, random names, isolated storage, scanning |\n| Watch out for | Trusting file extensions and user-supplied filenames |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  UP[Upload] --> SIZE[Size limit]\n  SIZE --> TYPE[Check magic bytes + allow-list]\n  TYPE --> RENAME[Random name]\n  RENAME --> STORE[Private object storage]\n  STORE --> SCAN[Malware scan + sandboxed processing]\n  SCAN --> SERVE[Serve via signed URL, Content-Disposition attachment]\n```\n\n### Worked example\n\n```python\nimport uuid\n\nALLOWED = {b\"\\x89PNG\\r\\n\\x1a\\n\": \"png\", b\"\\xff\\xd8\\xff\": \"jpg\", b\"%PDF-\": \"pdf\"}\nMAX_BYTES = 10 * 1024 * 1024\n\ndef accept_upload(data: bytes) -> str:\n    if len(data) > MAX_BYTES:\n        raise ValueError(\"File too large\")\n    ext = next((e for magic, e in ALLOWED.items() if data.startswith(magic)), None)\n    if ext is None:\n        raise ValueError(\"Unsupported file type\")\n    return f\"{uuid.uuid4().hex}.{ext}\"      # never use the client's filename for storage\n```"}, {"id": 49, "title": "Error handling and information disclosure", "tldr": "Errors should give users helpful generic messages and log details server-side with correlation IDs. Stack traces, SQL errors, internal hostnames and version banners help attackers and should never reach users.", "real": "Exposed debug pages and verbose errors, such as frameworks running in debug mode in production, regularly appear in security assessments and bug bounty reports as information disclosure findings.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Safe error responses and logging |\n| Why it matters | Leaked details aid attackers |\n| Practices | Generic messages, request IDs, detailed server logs |\n| Watch out for | DEBUG=True in production |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ERR[Exception] --> LOG[Log full details + request ID]\n  ERR --> RESP[User gets generic message + request ID]\n  LOG --> SIEM[Central logging]\n```\n\n### Worke

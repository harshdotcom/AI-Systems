toring]\n```"}, {"id": 199, "title": "The database engineer’s checklists", "tldr": "Use checklists for recurring high-stakes work: new database setup, schema changes, query reviews, launches and incidents. Checklists turn hard-won lessons into consistent practice.", "real": "Atul Gawande’s “The Checklist Manifesto” (2009) documented how simple checklists reduced errors in surgery and aviation, and engineering teams use the same idea for risky operations.", "body": "### New production database\n\n- [ ] Private networking, TLS, strong auth\n- [ ] Least-privilege roles\n- [ ] Backups + PITR + restore tested\n- [ ] Replication / HA configured and failover tested\n- [ ] Monitoring and alerts\n- [ ] Parameter tuning baseline\n- [ ] Connection pooling\n- [ ] Runbooks\n\n### Query review\n\n- [ ] EXPLAIN ANALYZE on realistic data\n- [ ] Indexes used as intended\n- [ ] Bounded results\n- [ ] Parameterized\n- [ ] Correct transaction scope"}, {"id": 200, "title": "Glossary and mastery roadmap", "tldr": "Use the glossary for quick reference and the roadmap to turn knowledge into skill: build, break, measure and fix real databases. Mastery comes from hands-on practice and careful study of failures.", "real": "Recommended reading: “Designing Data-Intensive Applications” (Kleppmann), “Database Internals” (Petrov), “Database System Concepts” (Silberschatz, Korth, Sudarshan), “Use The Index, Luke!” (Winand), “Database Reliability Engineering” (Campbell, Majors) and the PostgreSQL documentation.", "body": "### Glossary\n\n| Term | Meaning |\n|---|---|\n| ACID | Atomicity, consistency, isolation, durability |\n| MVCC | Multi-version concurrency control |\n| WAL | Write-ahead log |\n| B-tree / LSM | Main index/storage structures |\n| Isolation level | Degree of transaction separation |\n| Replication lag | Delay between primary and replica |\n| Sharding | Splitting data across servers |\n| CDC | Change data capture |\n| PITR | Point-in-time recovery |\n| RPO / RTO | Acceptable data loss / recovery time |\n| CAP / PACELC | Distributed trade-off models |\n| OLTP / OLAP | Transactional / analytical workloads |\n\n### Mastery roadmap\n\n1. Model and build a schema with constraints for a real app\n2. Optimize 10 slow queries using EXPLAIN ANALYZE\n3. Set up replication and practice failover\n4. Restore from backup to a point in time\n5. Run an online migration on a large table\n6. Benchmark and tune a database configuration\n7. Build a CDC pipeline to a warehouse\n8. Read the source or internals docs of one database"}];
const PARTS = ["Foundations", "Data modeling and schema design", "SQL mastery", "Storage engine internals", "Indexing", "Query processing and optimization", "Transactions and concurrency", "Durability, backup and recovery", "Replication and high availability", "Scaling, partitioning and sharding", "Distributed databases", "NoSQL and specialized databases", "Analytics, warehousing and pipelines", "Performance tuning", "Operations and reliability", "Security", "Cloud and managed databases", "Application data patterns", "Database engineering practice", "Capstones and mastery"];
const TOTAL = 200, PER = 10;
function idsOf(p){ const a = []; for (let i = (p-1)*PER + 1; i <= p*PER; i++) a.push(i); return a; }
const partOf = id => Math.ceil(id / PER);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "dbeng-book-progress-v1";
const LS_LAST = "dbeng-book-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try{ await dbRef.set({done:[...done].sort((a,b)=>a-b), updated:Date.now()}); }
  catch(e){ if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; pushRemote(); }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...done])); }catch(e){} }
function toggle(id){
  if (done.has(id)) done.delete(id); else done.add(id);
  saveLocal(); pushRemote(); renderAll();
  toast(done.has(id) ? "Chapter " + id + " marked complete" : "Chapter " + id + " marked not complete");
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(s){
  if (window.marked && marked.parse){
    const html = marked.parse(s, {gfm:true, headerIds:false, mangle:false});
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  }
  return "<pre>" + esc(s) + "</pre>";
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function currentId(){
  const m = location.hash.match(/^#ch-(\d{1,3})$/);
  const n = m ? +m[1] : 0;
  return n >= 1 && n <= TOTAL ? n : 0;
}

/* ---------- header memory bank ---------- */
function renderBank(){
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    html += '<div class="bank-group" title="Part ' + p + ': ' + esc(PARTS[p-1]) + '">';
    for (const i of idsOf(p)){
      html += '<button class="cell' + (done.has(i) ? " done" : "") + (i === cur ? " here" : "") +
        '" data-go="' + i + '" aria-label="Chapter ' + i + (done.has(i) ? ", complete" : "") + '"></button>';
    }
    html += "</div>";
  }
  document.getElementById("bank").innerHTML = html;
  document.getElementById("doneCount").textContent = done.size;
  document.getElementById("pct").textContent = Math.round(done.size * 100 / TOTAL) + "%";
}

/* ---------- sidebar ---------- */
const openParts = new Set();
function renderSide(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const matches = ids.filter(i => !q || byId[i].title.toLowerCase().includes(q) || byId[i].tldr.toLowerCase().includes(q) || String(i) === q);
    if (q && !matches.length) continue;
    const count = ids.filter(i => done.has(i)).length;
    const open = q || openParts.has(p) || partOf(cur) === p;
    html += '<div class="part' + (open ? " open" : "") + '">' +
      '<button class="part-head" data-part="' + p + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="part-num">' + String(p).padStart(2, "0") + '</span>' +
      '<span class="part-name">' + esc(PARTS[p-1]) + '</span>' +
      '<span class="part-count' + (count === PER ? " full" : "") + '">' + count + '/' + PER + '</span></button><ul class="part-list">';
    for (const i of matches){
      html += '<li class="ch-row' + (i === cur ? " active" : "") + '">' +
        '<button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="' + (done.has(i) ? "Mark chapter " + i + " not complete" : "Mark chapter " + i + " complete") + '">' + TICK + '</button>' +
        '<a href="#ch-' + i + '"><span class="n">' + i + '.</span>' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ul></div>";
  }
  if (!html) html = '<p style="color:var(--muted);font-size:14px;padding:8px">No chapters match that search. Try a shorter word like “index” or “replication”.</p>';
  document.getElementById("parts").innerHTML = html;
}

/* ---------- diagrams and charts ---------- */
let mermaidPromise = null, renderSeq = 0;
const svgCache = new Map();
function isDark(){
  const a = document.documentElement.getAttribute("data-theme");
  if (a) return a === "dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function ensureMermaid(){
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (mermaidPromise) return mermaidPromise;
  mermaidPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js";
    s.onload = () => {
      try{
        window.mermaid.initialize({ startOnLoad:false, securityLevel:"strict", theme: isDark() ? "dark" : "neutral",
          fontFamily:"IBM Plex Sans, system-ui, sans-serif", flowchart:{ curve:"basis", htmlLabels:true } });
        resolve(window.mermaid);
      }catch(e){ reject(e); }
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return mermaidPromise;
}
function fitSvg(div){
  const svg = div.querySelector("svg");
  if (!svg) return;
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Diagram");
  const vb = (svg.getAttribute("viewBox") || "").split(/\s+/).map(Number);
  const vbw = vb[2] || 0;
  if (vbw && div.clientWidth && div.clientWidth < vbw * 0.7){
    svg.style.maxWidth = "none";
    svg.style.width = Math.round(vbw * 0.85) + "px";
  }
}
function fmtNum(v){ return Number(v).toLocaleString("en-US", { maximumFractionDigits: 3 }); }
function renderChart(el, spec){
  const max = Math.max(...spec.data.map(d => d[1]));
  const unit = spec.unit || "";
  const sep = (unit === "%" || unit === "×") ? "" : " ";
  let rows = "";
  for (const [label, v] of spec.data){
    let w = spec.log ? (Math.log10(v + 1) / Math.log10(max + 1)) * 100 : (v / max) * 100;
    w = Math.max(w, 1.5);
    rows += '<div class="bar-row"><span class="bar-label">' + esc(String(label)) + '</span><span class="bar-track"><span class="bar" style="width:' + w.toFixed(1) + '%"></span></span><span class="bar-val">' + fmtNum(v) + sep + esc(unit) + '</span></div>';
  }
  const fig = document.createElement("figure");
  fig.className = "chart";
  fig.innerHTML = '<figcaption>' + esc(spec.title || "") + '</figcaption>' + rows + (spec.log ? '<div class="chart-note">Bar lengths use a logarithmic scale.</div>' : "");
  el.replaceWith(fig);
}
function enhance(root){
  root.querySelectorAll("code.language-chart").forEach(code => {
    const pre = code.closest("pre") || code;
    try{ renderChart(pre, JSON.parse(code.textContent)); }catch(e){}
  });
  const blocks = [...root.querySelectorAll("code.language-mermaid")];
  if (!blocks.length) return;
  const seq = ++renderSeq;
  const holders = blocks.map(code => {
    const pre = code.closest("pre") || code;
    const div = document.createElement("div");
    div.className = "diagram loading";
    div.textContent = "Loading diagram…";
    div.dataset.src = code.textContent;
    pre.replaceWith(div);
    if (svgCache.has(div.dataset.src)){ div.classList.remove("loading"); div.innerHTML = svgCache.get(div.dataset.src); div.dataset.done = "1"; fitSvg(div); }
    return div;
  }).filter(div => !div.dataset.done);
  if (!holders.length) return;
  ensureMermaid().then(async m => {
    for (let k = 0; k < holders.length; k++){
      const div = holders[k];
      if (seq !== renderSeq || !div.isConnected) return;
      const id = "mmd-" + seq + "-" + k;
      try{
        const out = await m.render(id, div.dataset.src);
        if (!div.isConnected) return;
        div.classList.remove("loading");
        div.innerHTML = out.svg;
        svgCache.set(div.dataset.src, out.svg);
        fitSvg(div);
      }catch(e){
        const junk = document.getElementById("d" + id); if (junk) junk.remove();
        div.classList.remove("loading");
        div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>";
      }
    }
  }).catch(() => {
    holders.forEach(div => { div.classList.remove("loading"); div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>"; });
  });
}

/* ---------- chapter view ---------- */
function renderChapter(id){
  const c = byId[id];
  const p = partOf(id);
  const ids = idsOf(p);
  const isDone = done.has(id);
  const tabs = ids.map(i =>
    '<button class="tab' + (i === id ? " active" : "") + '" role="tab" aria-selected="' + (i === id) + '" data-go="' + i + '">' +
    '<span class="dot' + (done.has(i) ? " on" : "") + '"></span><span class="tab-t">' + i + '. ' + esc(byId[i].title) + '</span></button>'
  ).join("");
  document.getElementById("main").innerHTML =
    '<p class="crumb">Part ' + p + ' of 20: ' + esc(PARTS[p-1]) + '</p>' +
    '<div class="tabs" role="tablist" aria-label="Chapters in this part">' + tabs + '</div>' +
    '<article>' +
      '<p class="ch-no">Chapter ' + id + ' of ' + TOTAL + '</p>' +
      '<h1 class="ch-title">' + esc(c.title) + '</h1>' +
      '<section class="box tldr"><h2>TL;DR</h2><p>' + inlineMd(c.tldr) + '</p></section>' +
      '<div class="body">' + md(c.body) + '</div>' +
      '<section class="box real"><h2>Real-world example</h2><p>' + inlineMd(c.real) + '</p></section>' +
      '<div class="done-bar">' +
        '<button class="complete' + (isDone ? " on" : "") + '" data-toggle="' + id + '" aria-pressed="' + isDone + '">' +
          '<span class="tick' + (isDone ? " on" : "") + '">' + TICK + '</span>' + (isDone ? "Completed" : "Mark as complete") + '</button>' +
        '<div class="nav">' +
          '<button class="btn" data-go="' + (id - 1) + '"' + (id === 1 ? " disabled" : "") + '>Previous</button>' +
          '<button class="btn" data-go="' + (id + 1) + '"' + (id === TOTAL ? " disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  enhance(document.getElementById("main"));
}

/* ---------- contents view ---------- */
function renderContents(){
  let html = '<div class="contents"><h1>Contents</h1>' +
    '<p class="lead">Twenty parts, ten chapters each: data modeling and SQL, storage internals and indexing, query optimization, transactions, backup and recovery, replication, sharding and distributed systems, NoSQL and analytics, tuning, operations, security and cloud databases. Tick a chapter when you finish it; your progress is saved for next time. SQL examples use PostgreSQL syntax unless noted; versions and defaults change, so check your database’s documentation before relying on a specific setting.</p>' +
    '<div class="contents-actions"><button class="btn" data-go="' + firstUnread() + '">' + (done.size ? "Continue with chapter " + firstUnread() : "Start chapter 1") + '</button>' +
    '<button class="btn" id="resetBtn">Reset progress</button></div><div class="grid">';
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const count = ids.filter(i => done.has(i)).length;
    html += '<section class="pcard"><h2>Part ' + p + ': ' + esc(PARTS[p-1]) + '</h2><div class="meta">' + count + ' of ' + PER + ' complete</div><ol>';
    for (const i of ids){
      html += '<li><button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="Toggle chapter ' + i + '">' + TICK + '</button><a href="#ch-' + i + '">' + i + '. ' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ol></section>";
  }
  document.getElementById("main").innerHTML = html + "</div></div>";
}
function firstUnread(){ for (let i = 1; i <= TOTAL; i++) if (!done.has(i)) return i; return TOTAL; }

/* ---------- routing ---------- */
let lastRendered = null;
function renderAll(){
  const id = currentId();
  renderBank(); renderSide();
  const y = window.scrollY;
  if (id) renderChapter(id); else renderContents();
  if (lastRendered === location.hash) window.scrollTo(0, y);
  lastRendered = location.hash;
}
function route(){
  const id = currentId();
  if (!id && location.hash !== "#contents"){
    let last = 0; try{ last = +localStorage.getItem(LS_LAST) || 0; }catch(e){}
    location.replace("#ch-" + (last >= 1 && last <= TOTAL ? last : 1));
    return;
  }
  if (id){ try{ localStorage.setItem(LS_LAST, id); }catch(e){} }
  document.body.classList.remove("drawer");
  renderAll();
  window.scrollTo(0, 0);
  const active = document.querySelector(".ch-row.active");
  if (active) active.scrollIntoView({block:"nearest"});
  const tab = document.querySelector(".tab.active");
  if (tab && tab.parentElement){ const r = tab.parentElement; const left = tab.offsetLeft - r.offsetLeft; if (left < r.scrollLeft || left + tab.offsetWidth > r.scrollLeft + r.clientWidth) r.scrollLeft = left - 16; }
}
function go(id){ if (id >= 1 && id <= TOTAL) location.hash = "#ch-" + id; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){ e.preventDefault(); toggle(+t.dataset.toggle); return; }
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled){ go(+g.dataset.go); return; }
  const ph = e.target.closest("[data-part]");
  if (ph){
    const p = +ph.dataset.part;
    const el = ph.parentElement;
    const isOpen = el.classList.toggle("open");
    if (isOpen) openParts.add(p); else openParts.delete(p);
    ph.setAttribute("aria-expanded", isOpen);
    return;
  }
  if (e.target.id === "resetBtn"){
    if (confirm("Clear all 200 ticks? This can’t be undone.")){ done.clear(); saveLocal(); pushRemote(); renderAll(); toast("Progress reset"); }
  }
});
document.getElementById("search").addEventListener("input", renderSide);
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.add("drawer"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = currentId(); if (!id) return;
  if (e.key === "ArrowRight") go(id + 1);
  else if (e.key === "ArrowLeft") go(id - 1);
});
function setTopH(){ document.documentElement.style.setProperty("--top-h", document.getElementById("top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);
window.addEventListener("hashchange", route);
setTopH();
route();
initSync();
</script>

product_id, i.qty\nFROM orders o JOIN order_items i ON i.order_id = o.id\nWHERE o.customer_id = 7;\n```\n\n### Cost (illustrative)\n\n```chart\n{\"title\": \"Page load time: N+1 vs batched (illustrative, 1 ms per round trip)\", \"unit\": \"ms\", \"data\": [[\"N+1 with 100 items\", 101], [\"Batched (2 queries)\", 2]]}\n```"}, {"id": 58, "title": "Pagination at scale", "tldr": "OFFSET pagination gets slower as pages go deeper because the database still reads and discards skipped rows. Keyset (seek) pagination uses the last seen key and an index to fetch the next page in constant time.", "real": "Large APIs such as Stripe’s and GitHub’s use cursor-based pagination (starting_after or cursor parameters) rather than page numbers, which is a keyset approach that stays fast for deep pages.", "body": "### OFFSET vs keyset\n\n```sql\n-- OFFSET: scans and discards 100,000 rows\nSELECT id, created_at FROM orders\nORDER BY created_at DESC, id DESC\nLIMIT 20 OFFSET 100000;\n\n-- Keyset: seeks directly using an index on (created_at, id)\nSELECT id, created_at FROM orders\nWHERE (created_at, id) < ($1, $2)\nORDER BY created_at DESC, id DESC\nLIMIT 20;\n```\n\n### Comparison\n\n| | OFFSET | Keyset |\n|---|---|---|\n| Deep page speed | Slows linearly | Constant |\n| Jump to page N | Yes | No (use cursors) |\n| Stable with inserts | Rows shift | Stable |\n| Requires | Nothing | Unique ordering key + index |"}, {"id": 59, "title": "Prepared statements and plan caching", "tldr": "Prepared statements parse and plan once and execute many times with parameters, reducing CPU and preventing SQL injection. Generic plans can be suboptimal for skewed parameter values, so understand your database’s plan caching behavior.", "real": "PostgreSQL uses custom plans for the first five executions of a prepared statement and then may switch to a generic plan if it is not estimated to be worse; the plan_cache_mode setting (version 12+) lets users force one behavior.", "body": "### Flow\n\n```mermaid\nflowchart LR\n  PREP[PREPARE: parse + analyze] --> EXEC1[EXECUTE with params]\n  EXEC1 --> PLAN{Custom or generic plan}\n  PLAN --> RUN[Run]\n  RUN --> EXEC2[Next EXECUTE reuses work]\n```\n\n### Benefits and risks\n\n| Benefit | Risk |\n|---|---|\n| Less parsing/planning CPU | Generic plan bad for skewed values |\n| SQL injection protection | Connection poolers in transaction mode may not support server-side prepared statements (older PgBouncer versions) |\n| Consistent latency | Stale plans after data changes |\n\nPgBouncer added support for protocol-level prepared statements in transaction mode in version 1.21 (2023)."}, {"id": 60, "title": "Query optimization workflow", "tldr": "Optimize systematically: find the queries that consume the most total time, reproduce with realistic data, read the plan, form a hypothesis, change one thing (index, rewrite, statistics, configuration), measure, and monitor after deploying.", "real": "pg_stat_statements in PostgreSQL ranks normalized queries by total execution time, and teams commonly find that a handful of queries account for most database load, making them the highest-value tuning targets.", "body": "### Workflow\n\n```mermaid\nflowchart LR\n  FIND[Top queries by total time] --> REPRO[Reproduce with realistic data]\n  REPRO --> PLAN[EXPLAIN ANALYZE]\n  PLAN --> HYP[Hypothesis]\n  HYP --> CHANGE[One change]\n  CHANGE --> MEASURE[Measure]\n  MEASURE --> DEPLOY[Deploy + monitor]\n```\n\n### Find top queries (PostgreSQL 13+)\n\n```sql\nSELECT query, calls, total_exec_time, mean_exec_time, rows\nFROM pg_stat_statements\nORDER BY total_exec_time DESC\nLIMIT 10;\n```\n\n### Prioritize by total time\n\nA 5 ms query run 1 million times per day (≈ 83 minutes total) matters more than a 10 s query run once per day."}, {"id": 61, "title": "Transactions in practice", "tldr": "A transaction groups operations into one atomic unit. Keep transactions short, include only related work, handle errors with rollback, and never wait for user input or slow external calls inside a transaction.", "real": "Many production incidents come from long-running or “idle in transaction” sessions that hold locks and block other work; PostgreSQL added the idle_in_transaction_session_timeout setting in version 9.6 to terminate such sessions automatically.", "body": "### Good transaction design\n\n| Do | Don’t |\n|---|---|\n| Keep it short | Call external APIs inside |\n| Touch rows in consistent order | Hold transactions open during user think time |\n| Retry on serialization/deadlock errors | Ignore errors and continue |\n| Use savepoints for partial rollback | Mix unrelated work |\n\n### Pattern\n\n```sql\nBEGIN;\nSELECT balance FROM accounts WHERE id = 1 FOR UPDATE;\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nINSERT INTO ledger (account_id, amount) VALUES (1, -100);\nCOMMIT;\n```"}, {"id": 62, "title": "Isolation levels", "tldr": "SQL defines four isolation levels: Read Uncommitted, Read Committed, Repeatable Read and Serializable, each preventing more anomalies. Databases implement them differently, so know what your database actually guarantees.", "real": "PostgreSQL defaults to Read Committed and MySQL InnoDB defaults to Repeatable Read; Oracle’s “Serializable” level is actually snapshot isolation, which can allow write skew, as discussed in Berenson and colleagues’ 1995 critique of the SQL isolation levels.", "body": "### Standard levels and anomalies prevented\n\n| Level | Dirty read | Non-repeatable read | Phantom |\n|---|---|---|---|\n| Read Uncommitted | Possible | Possible | Possible |\n| Read Committed | Prevented | Possible | Possible |\n| Repeatable Read | Prevented | Prevented | Possible (standard) |\n| Serializable | Prevented | Prevented | Prevented |\n\n### Implementation notes\n\n| Database | Default | Notes |\n|---|---|---|\n| PostgreSQL | Read Committed | Repeatable Read = snapshot isolation; Serializable = SSI |\n| MySQL InnoDB | Repeatable Read | Uses gap/next-key locks for locking reads |\n| SQL Server | Read Committed | Optional snapshot isolation (RCSI) |\n| Oracle | Read Committed | “Serializable” is snapshot isolation |"}, {"id": 63, "title": "Concurrency anomalies", "tldr": "Know the anomalies: dirty reads, non-repeatable reads, phantoms, lost updates, read skew and write skew. Each appears under specific isolation levels and access patterns, and each has standard prevention techniques.", "real": "Berenson and colleagues’ 1995 paper “A Critique of ANSI SQL Isolation Levels” showed the standard’s definitions missed anomalies such as write skew, which can occur under snapshot isolation, influencing how databases document isolation guarantees.", "body": "### Anomalies\n\n| Anomaly | Example |\n|---|---|\n| Dirty read | Read another transaction’s uncommitted change |\n| Non-repeatable read | Same row read twice gives different values |\n| Phantom | Same query returns new rows |\n| Lost update | Two read-modify-write cycles overwrite each other |\n| Write skew | Two transactions read overlapping data and write different rows, breaking a rule (e.g. both doctors go off call) |\n\n### Prevention\n\n| Anomaly | Technique |\n|---|---|\n| Lost update | Atomic updates (`SET x = x + 1`), SELECT FOR UPDATE, version checks |\n| Write skew | Serializable isolation, or lock the rows that the rule depends on |\n| Phantoms | Serializable, predicate/gap locks, unique constraints |"}, {"id": 64, "title": "Locking and two-phase locking", "tldr": "Lock-based concurrency control uses shared locks for reads and exclusive locks for writes. Strict two-phase locking acquires locks as needed and releases them at commit, guaranteeing serializability at the cost of blocking.", "real": "Two-phase locking was formalized by Eswaran, Gray, Lorie and Traiger at IBM in 1976, and lock-based concurrency control remained the main approach in commercial databases for decades before MVCC became common.", "body": "### Lock compatibility\n\n| Held \\ Requested | Shared (S) | Exclusive (X) |\n|---|---|---|\n| Shared (S) | Compatible | Conflict |\n| Exclusive (X) | Conflict | Conflict |\n\n### Explicit row locking\n\n```sql\nSELECT * FROM inventory WHERE sku = 'A-100' FOR UPDATE;      -- exclusive row lock\nSELECT * FROM inventory WHERE sku = 'A-100' FOR SHARE;       -- shared row lock\nSELECT * FROM jobs WHERE status = 'pending'\n  ORDER BY id LIMIT 10 FOR UPDATE SKIP LOCKED;               -- work queue pattern\n```\n\n### Lock granularity\n\nRow, page, table and metadata (DDL) locks; schema changes often need strong table locks, so plan them carefully."}, {"id": 65, "title": "MVCC and snapshot isolation", "tldr": "MVCC gives each transaction a consistent snapshot: readers see data as of their snapshot, writers create new versions, and readers never block writers. Snapshot isolation prevents most anomalies but allows write skew.", "real": "PostgreSQL, Oracle, MySQL InnoDB and SQL Server (with snapshot options) all use MVCC, which is why long-running reports in these systems can read consistent data without blocking concurrent updates.", "body": "### How visibility works (simplified)\n\n```mermaid\nflowchart LR\n  T1[T1 starts: snapshot S1] --> R1[Reads version v1]\n  T2[T2 updates row → v2, commits] --> V2[Version v2]\n  R1 --> SAME[T1 still sees v1 under Repeatable Read]\n  NEW[New transaction] --> SEE2[Sees v2]\n```\n\n### Trade-offs\n\n| Benefit | Cost |\n|---|---|\n| Readers don’t block writers | Old versions must be cleaned up |\n| Consistent snapshots | Long transactions retain old versions |\n| High concurrency | Write skew possible without Serializable |"}, {"id": 66, "title": "Serializable snapshot isolation", "tldr": "Serializable snapshot isolation (SSI) adds conflict detection to snapshot isolation: it tracks read-write dependencies and aborts transactions that could produce non-serializable results. Applications must retry aborted transactions.", "real": "PostgreSQL implemented SSI in version 9.1 (2011), based on research by Cahill, Röhm and Fekete (2008), making it one of the first widely used databases to offer true serializability without heavy locking.", "body": "### Using serializable correctly\n\n```text\nBEGIN ISOLATION LEVEL SERIALIZABLE;\n  -- reads and writes\nCOMMIT;\n-- On error SQLSTATE 40001 (serialization_failure): retry the whole transaction\n```\n\n### Retry loop (pseudocode)\n\n```python\nfor attempt in range(5):\n    try:\n        with db.transaction(isolation=\"serializable\"):\n            do_work()\n        break\n    except SerializationFailure:\n        sleep(backoff(attempt))\n```\n\n### When to use\n\nBusiness rules spanning multiple rows (scheduling, inventory limits, ledger invariants) where write skew would be harmful."}, {"id": 67, "title": "Deadlocks", "tldr": "Deadlocks happen when transactions wait for each other’s locks in a cycle. Databases detect them and abort one transaction. Reduce them by accessing rows in a consistent order, keeping transactions short and retrying aborted ones.", "real": "PostgreSQL checks for deadlocks after a lock wait exceeds deadlock_timeout (1 second by default), and MySQL InnoDB detects deadlocks immediately by default and rolls back the smaller transaction.", "body": "### Deadlock example\n\n```mermaid\nflowchart LR\n  T1[T1 locks row A] --> W1[T1 waits for row B]\n  T2[T2 locks row B] --> W2[T2 waits for row A]\n  W1 --> CYCLE[Cycle → one aborted]\n  W2 --> CYCLE\n```\n\n### Prevention\n\n| Technique | Example |\n|---|---|\n| Consistent order | Always lock lower account ID first |\n| Short transactions | Fewer locks held over time |\n| Appropriate indexes | Fewer rows locked by scans |\n| Retry logic | Handle deadlock errors gracefully |\n| Lock timeouts | Fail fast instead of waiting long |"}, {"id": 68, "title": "Optimistic vs pessimistic concurrency", "tldr": "Pessimistic concurrency locks data before changing it; optimistic concurrency proceeds without locks and checks at write time that nothing changed, typically with a version column. Choose based on conflict frequency.", "real": "ORMs such as Hibernate (with @Version) and Rails’ Active Record (with a lock_version column) implement optimistic locking, raising an error when a concurrent update changed the row first.", "body": "### Optimistic update\n\n```sql\nUPDATE documents\nSET body = $1, version = version + 1\nWHERE id = $2 AND version = $3;\n-- 0 rows updated → someone else changed it: reload and retry or show conflict\n```\n\n### Choosing\n\n| Situation | Approach |\n|---|---|\n| Rare conflicts, user edits | Optimistic |\n| Frequent conflicts on hot rows | Pessimistic (or redesign) |\n| Counters | Atomic `SET x = x + 1` |\n| Queues | `FOR UPDATE SKIP LOCKED` |"}, {"id": 69, "title": "Long transactions and vacuum", "tldr": "In PostgreSQL, old row versions can only be removed when no transaction might still see them. Long-running transactions, abandoned sessions and replication slots block cleanup, causing table bloat and, in extreme cases, transaction ID wraparound risk.", "real": "Sentry’s 2015 outage and Mandrill’s (Mailchimp) 2019 outage were both caused by PostgreSQL transaction ID wraparound protection, which forces the database to stop accepting writes until aggressive vacuuming completes.", "body": "### What blocks vacuum cleanup\n\n| Cause | Detection |\n|---|---|\n| Long-running query or transaction | pg_stat_activity (xact_start) |\n| Idle in transaction session | `state = 'idle in transaction'` |\n| Inactive replication slot | pg_replication_slots |\n| Replica with hot_standby_feedback | Replica long queries |\n| Prepared transactions left open | pg_prepared_xacts |\n\n### Monitoring wraparound risk\n\n```sql\nSELECT datname, age(datfrozenxid) AS xid_age\nFROM pg_database ORDER BY xid_age DESC;\n```\n\nAlert well before ages approach about 2 billion; autovacuum normally freezes rows long before that."}, {"id": 70, "title": "Designing for concurrency", "tldr": "Design applications to minimize contention: avoid hot rows, use atomic operations, idempotent writes, queue patterns with SKIP LOCKED, append-only ledgers instead of in-place counters, and partitioned counters for high write rates.", "real": "Many job queue libraries built on PostgreSQL, such as Que, GoodJob and Oban, use SELECT ... FOR UPDATE SKIP LOCKED (available since PostgreSQL 9.5) so multiple workers can claim jobs without blocking each other.", "body": "### Patterns\n\n| Problem | Pattern |\n|---|---|\n| Hot counter row | Sharded counters or append-only events + aggregation |\n| Double processing | Idempotency keys with unique constraints |\n| Job queues | `FOR UPDATE SKIP LOCKED` |\n| Inventory oversell | Atomic conditional update |\n| Balance changes | Append-only ledger + constraints |\n\n### Atomic conditional update\n\n```sql\nUPDATE inventory\nSET qty = qty - 1\nWHERE sku = 'A-100' AND qty > 0\nRETURNING qty;\n-- 0 rows → out of stock, no race condition\n```\n\n### Idempotency key\n\n```sql\nCREATE UNIQUE INDEX uq_payments_idem ON payments (idempotency_key);\n```"}, {"id": 71, "title": "Durability and fsync", "tldr": "Durability requires that committed data reaches non-volatile storage. Databases call fsync to force log writes to disk; disabling it or using storage that lies about flushes risks losing committed data or corrupting the database after a crash.", "real": "In 2018 PostgreSQL developers discovered (“fsyncgate”) that on Linux, after an fsync error, retrying fsync could falsely report success because failed dirty pages had been discarded; PostgreSQL changed to treat fsync failures as fatal (PANIC) in its 2018–2019 releases.", "body": "### Durability chain\n\n```mermaid\nflowchart LR\n  COMMIT[Commit] --> WAL[WAL buffer]\n  WAL --> OS[OS page cache]\n  OS -->|fsync| DEVICE[Storage device cache]\n  DEVICE --> MEDIA[Persistent media]\n```\n\nEach layer must honor flushes; enterprise SSDs with power-loss protection make device caches safe.\n\n### Settings that trade durability for speed\n\n| Setting | Effect | Risk |\n|---|---|---|\n| `fsync = off` (PostgreSQL) | Faster writes | Corruption on crash; never in production |\n| `synchronous_commit = off` (PostgreSQL) | Faster commits | Lose last moments of commits, no corruption |\n| `innodb_flush_log_at_trx_commit = 2` (MySQL) | Faster commits | Lose up to \\~1 s on OS crash |"}, {"id": 72, "title": "Backup types", "tldr": "Logical backups export data as SQL or data files; physical backups copy database files; incremental and differential backups save only changes; continuous log archiving enables point-in-time recovery. Most production systems combine physical backups with log archiving.", "real": "Tools such as pg_dump (logical), pg_basebackup and pgBackRest (physical with WAL archiving) for PostgreSQL, and mysqldump, Percona XtraBackup and MySQL Enterprise Backup for MySQL, are standard in production environments.", "body": "### Comparison\n\n| Type | Pros | Cons |\n|---|---|---|\n| Logical (pg_dump, mysqldump) | Portable, selective restore | Slow for large DBs, point-in-time only |\n| Physical (base backup) | Fast restore of whole cluster | Same major version / platform |\n| Incremental / differential | Smaller, faster backups | More complex restore chains |\n| Log archiving | Point-in-time recovery | Needs base backup + all logs |\n| Storage snapshots | Very fast | Must be crash-consistent; same storage system risk |\n\n### Typical strategy\n\n```mermaid\nflowchart LR\n  FULL[Weekly full physical backup] --> INC[Daily incremental]\n  INC --> WAL[Continuous WAL / binlog archiving]\n  WAL --> OFFSITE[Copies in another region / account]\n```"}, {"id": 73, "title": "Point-in-time recovery", "tldr": "Point-in-time recovery (PITR) restores a base backup and replays archived logs up to a chosen moment, such as just before an accidental DELETE. It requires continuous, complete log archiving and tested procedures.", "real": "Managed services such as Amazon RDS and Google Cloud SQL offer point-in-time restore within a configurable retention window by combining automated snapshots with continuous transaction log backups.", "body": "### PITR process\n\n```mermaid\nflowchart LR\n  BASE[Restore base backup] --> REPLAY[Replay archived WAL]\n  REPLAY --> TARGET[Stop at target time / transaction]\n  TARGET --> VERIFY[Verify data]\n  VERIFY --> PROMOTE[Open for use or extract data]\n```\n\n### Recovering from accidental deletion\n\n| Step | Action |\n|---|---|\n| 1 | Identify time just before the mistake (logs, audit) |\n| 2 | Restore to a separate instance at that time |\n| 3 | Extract affected data |\n| 4 | Re-insert into production carefully |\n| 5 | Postmortem: prevent recurrence |"}, {"id": 74, "title": "Testing backups and restores", "tldr": "A backup is only as good as a tested restore. Automate regular restore tests, verify data integrity, measure restore time against your recovery objectives, and document the procedure so anyone on call can follow it.", "real": "During GitLab’s January 2017 incident, an engineer accidentally deleted data on the primary database, and the team discovered that several backup mechanisms had not been working; it restored from a staging snapshot about six hours old, losing some production data.", "body": "### Restore testing program\n\n| Frequency | Test |\n|---|---|\n| Daily | Backup job success + checksum verification |\n| Weekly | Automated restore to test instance + sanity queries |\n| Quarterly | Full disaster recovery drill with timing |\n| After changes | Restore test after backup tooling or version changes |\n\n### Sanity checks after restore\n\n- [ ] Row counts of key tables within expected range\n- [ ] Latest timestamps match expected recovery point\n- [ ] Application smoke tests pass\n- [ ] Restore duration recorded vs RTO"}, {"id": 75, "title": "RPO and RTO", "tldr": "Recovery point objective (RPO) is how much data loss is acceptable; recovery time objective (RTO) is how long recovery may take. These business targets drive backup frequency, replication design and failover automation.", "real": "Cloud providers’ disaster recovery guidance, such as the AWS Well-Architected Reliability Pillar, defines strategies from backup-and-restore to multi-site active-active with progressively lower RPO and RTO and higher cost.", "body": "### Strategies vs objectives\n\n| Strategy | Typical RPO | Typical RTO | Cost |\n|---|---|---|---|\n| Backup and restore | Hours | Hours to a day | Low |\n| Pilot light (replicated data, minimal infra) | Minutes | Tens of minutes to hours | Medium |\n| Warm standby | Seconds–minutes | Minutes | Higher |\n| Multi-site active-active | Near zero | Near zero | Highest |\n\n### Example\n\n```\nService: payments\nRPO: 0 (synchronous replication within region)\nRTO: 5 minutes (automated failover)\nRegional disaster RPO: 1 minute (async cross-region replica)\n```"}, {"id": 76, "title": "Disaster recovery planning", "tldr": "Disaster recovery covers losing a server, a data center, a region, a cloud account or data itself (corruption, ransomware, bad deploys). Plan for each scenario with backups in separate accounts and regions, documented runbooks and regular drills.", "real": "In April 2022, Atlassian accidentally deleted cloud sites for hundreds of customers through a faulty maintenance script; restoring them took up to two weeks, partly because restoring individual customers’ data from backups was not a well-practiced, automated operation.", "body": "### Scenario matrix\n\n| Scenario | Protection |\n|---|---|\n| Disk / server failure | Replication, automatic failover |\n| Availability zone outage | Multi-AZ replicas |\n| Region outage | Cross-region replica / backups |\n| Accidental deletion | PITR, delayed replicas |\n| Ransomware / compromised account | Immutable backups in separate account |\n| Bad migration or app bug | PITR, logical restore of subsets |\n\n### Runbook essentials\n\nDecision criteria, step-by-step commands, contacts, verification steps, and communication templates."}, {"id": 77, "title": "Data corruption: detection and prevention", "tldr": "Corruption can come from hardware, firmware, software bugs or operator mistakes. Use data checksums, regular integrity checks, verified backups, careful storage choices and replication that can detect divergence.", "real": "PostgreSQL supports page-level data checksums (enabled at initialization with initdb --data-checksums, and enabled by default in newer releases), and tools such as amcheck verify B-tree index integrity.", "body": "### Defenses\n\n| Layer | Defense |\n|---|---|\n| Storage | ECC memory, enterprise SSDs, checksumming filesystems (ZFS) |\n| Database | Page checksums, amcheck, CHECK TABLE / innochecksum |\n| Replication | Compare checksums across replicas (pt-table-checksum for MySQL) |\n| Backups | Verify on creation and restore |\n| Operations | Careful use of low-level tools |\n\n### When corruption is found\n\n```mermaid\nflowchart LR\n  DETECT[Detect] --> ISOLATE[Stop writes to affected area]\n  ISOLATE --> ASSESS[Assess extent]\n  ASSESS --> RESTORE[Restore from replica or backup]\n  RESTORE --> ROOT[Root cause hardware/software]\n```"}, {"id": 78, "title": "Delayed replicas and protection against human error", "tldr": "Replicas copy mistakes instantly. A delayed replica applies changes after a fixed delay (for example one hour), giving a window to recover data after accidental deletes or bad deployments, alongside PITR.", "real": "PostgreSQL supports delayed standbys with recovery_min_apply_delay, and MySQL supports delayed replication with SOURCE_DELAY (formerly MASTER_DELAY), features designed for recovering from human errors.", "body": "### Configuration examples\n\n```text\n# PostgreSQL standby\nrecovery_min_apply_delay = '1h'\n\n-- MySQL replica\nCHANGE REPLICATION SOURCE TO SOURCE_DELAY = 3600;\n```\n\n### Human error safeguards\n\n| Safeguard | Example |\n|---|---|\n| Delayed replica | 1-hour lag |\n| Least privilege | No DROP for app users |\n| Safe tooling | Require WHERE clauses in admin tools |\n| Two-person review | Production data changes |\n| Soft deletes for critical data | Recoverable deletes |"}, {"id": 79, "title": "Restore granularity", "tldr": "Restoring a whole database is different from restoring one customer, table or row. Plan for granular restores: logical exports per tenant, PITR to side instances with extraction tooling, and tested scripts.", "real": "The 2022 Atlassian outage showed that systems designed for whole-environment recovery may struggle to restore a subset of customers quickly, a lesson many SaaS companies applied to their own recovery planning.", "body": "### Granularity options\n\n| Need | Approach |\n|---|---|\n| Entire cluster | Physical backup + PITR |\n| One database | Logical dump or PITR side instance |\n| One table | PITR side instance + export/import |\n| One tenant | Tenant-scoped export scripts, tested regularly |\n| A few rows | PITR side instance + targeted queries |\n\n### Side-instance restore flow\n\n```mermaid\nflowchart LR\n  PITR[Restore PITR to side instance] --> QUERY[Query affected rows]\n  QUERY --> EXPORT[Export]\n  EXPORT --> MERGE[Merge into production with review]\n```"}, {"id": 80, "title": "Recovery runbooks", "tldr": "Recovery runbooks turn stressful incidents into followed procedures: when to use each recovery path, exact commands, verification steps, communication and decision owners. Test them in drills and keep them current.", "real": "Google’s SRE book emphasizes regular disaster recovery testing (“DiRT” exercises at Google) so that recovery procedures and people are proven before real emergencies.", "body": "### Runbook template\n\n| Section | Content |\n|---|---|\n| Scenario | e.g. accidental table drop |\n| Decision criteria | When to use PITR vs replica |\n| Prerequisites | Access, tools, credentials location |\n| Steps | Exact commands with expected outputs |\n| Verification | Queries and app checks |\n| Communication | Who to inform, templates |\n| Rollback | If recovery fails |\n| Last tested | Date and result |\n\n### Drill cadence\n\nQuarterly game days rotating through scenarios, with timing recorded against RTO."}, {"id": 81, "title": "Replication fundamentals", "tldr": "Replication keeps copies of data on multiple servers for availability, read scaling, geographic proximity and disaster recovery. Key choices are the topology (single-leader, multi-leader, leaderless) and whether replication is synchronous or asynchronous.", "real": "Martin Kleppmann’s “Designing Data-Intensive Applications” (2017) organized replication into single-leader, multi-leader and leaderless approaches, a framework now widely used to teach and compare database replication designs.", "body": "### Why replicate\n\n| Goal | Example |\n|---|---|\n| High availability | Failover when primary fails |\n| Read scaling | Route reads to replicas |\n| Latency | Replicas near users |\n| Disaster recovery | Copy in another region |\n| Analytics isolation | Reports on a replica |\n\n### Topologies\n\n| Topology | Writes go to | Examples |\n|---|---|---|\n| Single-leader | One primary | PostgreSQL streaming, MySQL replication |\n| Multi-leader | Several primaries | Multi-region active-active setups |\n| Leaderless | Any replica (quorum) | Cassandra, DynamoDB-style systems |"}, {"id": 82, "title": "Synchronous vs asynchronous replication", "tldr": "Synchronous replication waits for replicas to confirm before committing, preventing data loss on failover but adding latency and availability risk. Asynchronous replication is faster but can lose recent commits if the primary fails.", "real": "PostgreSQL supports configurable synchronous replication through synchronous_standby_names, including quorum settings such as ANY 1 of several standbys, letting teams balance durability with availability.", "body": "### Comparison\n\n| | Synchronous | Asynchronous |\n|---|---|---|\n| Data loss on primary failure | None (for confirmed commits) | Recent commits may be lost |\n| Commit latency | Higher (network round trip) | Lower |\n| Availability impact | Writes stall if sync replica unavailable | None |\n| Typical use | Same-region HA | Cross-region DR, read replicas |\n\n### Commit timeline\n\n```mermaid\nsequenceDiagram\n  participant App\n  participant Primary\n  participant Replica\n  App->>Primary: COMMIT\n  Primary->>Replica: WAL records\n  Replica-->>Primary: Flushed\n  Primary-->>App: Commit OK (synchronous)\n```\n\n### Semi-sync\n\nMySQL semi-synchronous replication waits until at least one replica has received (not applied) the transaction, a middle ground."}, {"id": 83, "title": "Physical vs logical replication", "tldr": "Physical replication copies low-level changes (WAL blocks) to produce byte-identical replicas; logical replication sends row-level changes, allowing selective tables, different versions and different targets. Each suits different needs.", "real": "PostgreSQL added built-in logical replication (publications and subscriptions) in version 10 (2017), enabling near-zero-downtime major version upgrades and selective replication that physical streaming replication could not provide.", "body": "### Comparison\n\n| | Physical | Logical |\n|---|---|---|\n| Unit | WAL / page changes | Row changes |\n| Replica | Exact copy, read-only | Independent database, can be writable |\n| Selective tables | No | Yes |\n| Cross-version | No (same major version) | Yes |\n| DDL replicated | Yes | Usually not (PostgreSQL) |\n| Uses | HA, read replicas | Upgrades, migrations, CDC, data distribution |\n\n### PostgreSQL logical replication\n\n```sql\n-- On source\nCREATE PUBLICATION orders_pub FOR TABLE orders, order_items;\n-- On target\nCREATE SUBSCRIPTION orders_sub\n  CONNECTION 'host=source dbname=shop user=repl'\n  PUBLICATION orders_pub;\n```"}, {"id": 84, "title": "Replication lag and read consistency", "tldr": "Asynchronous replicas lag behind the primary, so reading from them can return stale data. Applications need strategies such as read-your-writes routing, monitoring lag, and directing critical reads to the primary.", "real": "Many web frameworks support routing reads to replicas with “sticky” primary reads after writes; for example, Rails 6 added automatic role switching that sends reads to the primary for a short period after a write.", "body": "### Consistency problems\n\n| Problem | Example |\n|---|---|\n| Read-your-writes violation | User updates profile, refresh shows old value |\n| Monotonic reads violation | Data appears then disappears across replicas |\n| Causality violation | Reply visible before the original message |\n\n### Mitigations\n\n| Technique | How |\n|---|---|\n| Sticky primary reads | Read from primary for N seconds after a write |\n| LSN / GTID waiting | Read from replica only after it reaches the write’s position |\n| Lag-aware routing | Exclude replicas above lag threshold |\n| Critical reads on primary | Payments, permissions |\n\n### Monitoring lag (PostgreSQL primary)\n\n```sql\nSELECT application_name, replay_lag FROM pg_stat_replication;\n```"}, {"id": 85, "title": "Failover and split brain", "tldr": "Failover promotes a replica when the primary fails. Risks include promoting a stale replica (data loss) and split brain, where two nodes accept writes. Use reliable failure detection, fencing and consensus-based coordination.", "real": "In October 2018, a 43-second network partition at GitHub triggered a cross-region MySQL failover; writes were then accepted in both regions, and reconciling the data led to over 24 hours of degraded service.", "body": "### Failover steps\n\n```mermaid\nflowchart LR\n  DETECT[Detect primary failure] --> CONFIRM[Confirm via quorum]\n  CONFIRM --> FENCE[Fence old primary]\n  FENCE --> PICK[Pick most up-to-date replica]\n  PICK --> PROMOTE[Promote]\n  PROMOTE --> REROUTE[Reroute clients]\n```\n\n### Split-brain prevention\n\n| Technique | Purpose |\n|---|---|\n| Consensus store (etcd, Consul, ZooKeeper) | Single source of truth for leader |\n| Fencing (STONITH, revoke access) | Old primary can’t accept writes |\n| Quorum-based decisions | Avoid minority partitions acting alone |\n| Careful cross-region failover policies | Avoid unnecessary region switches |"}, {"id": 86, "title": "High-availability architectures", "tldr": "HA setups combine replication, health checks, automated failover, connection routing and monitoring. Common building blocks include Patroni for PostgreSQL, Orchestrator or Group Replication for MySQL, and managed Multi-AZ services in the cloud.", "real": "Patroni, open-sourced by Zalando, manages PostgreSQL high availability using a distributed configuration store such as etcd or Consul for leader election, and is widely used in self-managed PostgreSQL clusters.", "body": "### Example: PostgreSQL with Patroni\n\n```mermaid\nflowchart TB\n  APP[Applications] --> LB[HAProxy / DNS / pooler]\n  LB --> P[(Primary)]\n  LB --> R1[(Replica 1)]\n  LB --> R2[(Replica 2)]\n  P -->|streaming| R1\n  P -->|streaming| R2\n  DCS[(etcd cluster)] --- P\n  DCS --- R1\n  DCS --- R2\n```\n\n### Availability targets\n\n```chart\n{\"title\": \"Maximum downtime per year by availability target\", \"unit\": \"minutes\", \"log\": true, \"data\": [[\"99%\", 5256], [\"99.9%\", 525.6], [\"99.95%\", 262.8], [\"99.99%\", 52.56], [\"99.999%\", 5.26]]}\n```"}, {"id": 87, "title": "Multi-leader replication", "tldr": "Multi-leader setups accept writes in several locations, reducing write latency across regions and surviving region outages, but they must resolve conflicting concurrent writes. Avoid them unless the benefits justify conflict handling.", "real": "Collaborative editing tools face the same conflict problem; CRDTs (conflict-free replicated data types), formalized by Shapiro and colleagues in 2011, are used by collaboration libraries such as Automerge and Yjs and by databases such as Riak to merge concurrent changes automatically.", "body": "### Conflict resolution strategies\n\n| Strategy | Behavior | Risk |\n|---|---|---|\n| Last write wins | Latest timestamp kept | Silent data loss |\n| Application merge | Custom logic | Complexity |\n| CRDTs | Mathematically mergeable types | Limited data types |\n| Avoid conflicts | Route each record’s writes to one home region | Less flexibility |\n\n### Recommended approach\n\n```mermaid\nflowchart LR\n  REC[Record] --> HOME[Assign home region]\n  HOME --> WRITES[All writes for record go to home leader]\n  WRITES --> REPL[Replicate to other regions for reads]\n```"}, {"id": 88, "title": "Leaderless replication and quorums", "tldr": "Leaderless systems write to and read from multiple replicas; with N replicas, W write acknowledgments and R read responses, choosing W + R > N ensures reads overlap with the latest write in normal conditions. Repair mechanisms fix divergence.", "real": "Amazon’s 2007 Dynamo paper described quorum-based leaderless replication with sloppy quorums, hinted handoff and anti-entropy, ideas adopted by Apache Cassandra, Riak and Voldemort.", "body": "### Quorum settings\n\n| Setting (N=3) | Behavior |\n|---|---|\n| W=1, R=1 | Fastest, may read stale |\n| W=2, R=2 | W + R > N: strong-ish reads in normal operation |\n| W=3, R=1 | Slow writes, fast reads |\n\n### Repair mechanisms\n\n| Mechanism | Purpose |\n|---|---|\n| Read repair | Fix stale replicas during reads |\n| Hinted handoff | Store writes for temporarily down nodes |\n| Anti-entropy (Merkle trees) | Background synchronization |\n\n### Cassandra consistency levels\n\nONE, QUORUM, LOCAL_QUORUM, ALL, chosen per query to trade latency and consistency."}, {"id": 89, "title": "Consensus: Paxos and Raft", "tldr": "Consensus algorithms let a group of nodes agree on values (such as who is leader or the order of log entries) despite failures, as long as a majority is available. They underpin reliable failover, distributed databases and coordination services.", "real": "Leslie Lamport described Paxos in “The Part-Time Parliament” (published 1998), and Diego Ongaro and John Ousterhout introduced Raft in 2014 as an easier-to-understand alternative; Raft is used in etcd, CockroachDB, TiKV and Consul.", "body": "### Raft basics\n\n```mermaid\nflowchart LR\n  FOLLOWER[Follower] -->|election timeout| CANDIDATE[Candidate]\n  CANDIDATE -->|majority votes| LEADER[Leader]\n  LEADER -->|append entries| FOLLOWER\n  LEADER -->|commit when majority stores entry| COMMIT[Committed log]\n```\n\n### Majority requirement\n\n| Cluster size | Tolerated failures |\n|---|---|\n| 3 | 1 |\n| 5 | 2 |\n| 7 | 3 |\n\nEven-sized clusters add cost without increasing failure tolerance."}, {"id": 90, "title": "Testing high availability", "tldr": "HA that hasn’t been tested will fail when needed. Regularly practice failovers, simulate network partitions and node failures, measure failover time and data loss, and verify that applications reconnect correctly.", "real": "Netflix’s Chaos Monkey (2011) and the broader chaos engineering practice of deliberately injecting failures in production-like environments have been adopted to verify that systems, including databases, survive real failures.", "body": "### Failure scenarios to test\n\n| Scenario | Expected result |\n|---|---|\n| Kill primary process | Automatic failover within RTO |\n| Network partition primary/replicas | No split brain |\n| Replica lag spike | Lag-aware routing excludes replica |\n| DCS (etcd) node loss | Cluster remains managed |\n| Planned switchover | Near-zero client errors |\n| Full zone outage | Service continues from other zone |\n\n### Measure\n\nFailover duration, client error count, data loss (transactions), and time to restore redundancy."}, {"id": 91, "title": "Scaling strategies overview", "tldr": "Scale in order of simplicity: optimize queries and indexes, scale up hardware, add caching and read replicas, partition large tables, split by function, and only then shard. Each step adds complexity, so exhaust simpler options first.", "real": "Many large companies ran on a single primary relational database far longer than expected; Figma’s databases team wrote in 2024 that it scaled one PostgreSQL instance and then vertical partitioning for years before moving to horizontal sharding.", "body": "### Scaling ladder\n\n```mermaid\nflowchart TB\n  A[Tune queries and indexes] --> B[Scale up: CPU, RAM, faster storage]\n  B --> C[Connection pooling]\n  C --> D[Caching]\n  D --> E[Read replicas]\n  E --> F[Table partitioning]\n  F --> G[Vertical split: separate databases per domain]\n  G --> H[Horizontal sharding]\n```\n\n### Complexity vs capacity\n\n| Step | Complexity added |\n|---|---|\n| Tuning | Low |\n| Scale up | Low (cost) |\n| Replicas | Medium (lag) |\n| Partitioning | Medium |\n| Sharding | High (routing, cross-shard queries, resharding) |"}, {"id": 92, "title": "Vertical scaling", "tldr": "Vertical scaling adds CPU, memory and faster storage to one server. It is simple and effective, since cloud instances now offer hundreds of vCPUs and terabytes of RAM, but has an upper limit and a single point of failure without replicas.", "real": "Major cloud providers offer database-capable instances with many terabytes of memory (for example AWS high-memory instances designed for SAP HANA), so the ceiling for single-node databases is far higher than a decade ago.", "body": "### What to scale\n\n| Bottleneck | Upgrade |\n|---|---|\n| Working set doesn’t fit in memory | More RAM |\n| CPU-bound queries | More / faster cores |\n| I/O latency | NVMe SSDs, provisioned IOPS |\n| Write throughput | Faster storage for WAL |\n| Network | Higher bandwidth instances |\n\n### Limits\n\n| Limit | Mitigation |\n|---|---|\n| Hardware ceiling | Partitioning, sharding |\n| Cost grows steeply | Optimize first |\n| Single node failure | Replicas + failover |\n| Single-threaded parts of engine | Architecture changes |"}, {"id": 93, "title": "Read replicas and caching", "tldr": "Read replicas offload read traffic from the primary, and caches (in-memory stores or application caches) serve frequent reads even faster. Both introduce staleness that applications must tolerate or manage.", "real": "Facebook’s 2013 NSDI paper “Scaling Memcache at Facebook” described serving billions of requests per second with memcached in front of MySQL, including techniques like leases to prevent stale sets and thundering herds.", "body": "### Read path options\n\n```mermaid\nflowchart LR\n  APP[App] --> CACHE{Cache hit?}\n  CACHE -- yes --> RET[Return]\n  CACHE -- no --> REPLICA[(Read replica)]\n  REPLICA --> FILL[Fill cache]\n  APP -->|writes| PRIMARY[(Primary)]\n  PRIMARY -->|replication| REPLICA\n```\n\n### Comparison\n\n| | Read replica | Cache |\n|---|---|---|\n| Latency | Database-level | Sub-millisecond |\n| Query flexibility | Full SQL | Key lookups |\n| Staleness | Replication lag | TTL / invalidation |\n| Consistency control | Lag-aware routing | Invalidation strategy |"}, {"id": 94, "title": "Table partitioning", "tldr": "Partitioning splits a large table into smaller physical pieces by range, list or hash, while queries still see one table. It enables partition pruning, faster maintenance and cheap data retention (dropping old partitions instead of deleting rows).", "real": "PostgreSQL introduced declarative partitioning in version 10 (2017) and improved it substantially in later versions, and time-based partitioning is now a common pattern for large event and log tables.", "body": "### Example (range by month)\n\n```sql\nCREATE TABLE events (\n  id         bigint GENERATED ALWAYS AS IDENTITY,\n  created_at timestamptz NOT NULL,\n  payload    jsonb,\n  PRIMARY KEY (id, created_at)\n) PARTITION BY RANGE (created_at);\n\nCREATE TABLE events_2026_03 PARTITION OF events\n  FOR VALUES FROM ('2026-03-01') TO ('2026-04-01');\n\n-- Retention: drop a whole month instantly\nDROP TABLE events_2025_03;\n```\n\n### Benefits and costs\n\n| Benefit | Cost |\n|---|---|\n| Partition pruning | Queries without partition key scan all partitions |\n| Fast retention | Primary keys/uniques must include partition key |\n| Smaller indexes per partition | More objects to manage |\n| Parallel maintenance | Partition creation automation (e.g. pg_partman) |"}, {"id": 95, "title": "Sharding strategies", "tldr": "Sharding splits data across multiple database servers. Common strategies are hash-based (even distribution), range-based (ordered ranges) and directory-based (lookup table). Each affects balance, query routing and resharding difficulty.", "real": "Instagram described in 2012 how it sharded PostgreSQL into thousands of logical shards mapped to fewer physical servers, generating 64-bit IDs that embed a timestamp, logical shard ID and sequence number.", "body": "### Strategies\n\n| Strategy | How | Pros | Cons |\n|---|---|---|---|\n| Hash | shard = hash(key) mod N (or consistent hashing) | Even spread | Range queries span shards; resharding moves data |\n| Range | Key ranges per shard | Range scans | Hot spots on recent ranges |\n| Directory | Lookup table maps key → shard | Flexible moves | Directory is a dependency |\n| Geographic | By region | Data residency, latency | Uneven sizes |\n\n### Logical shards\n\n```mermaid\nflowchart LR\n  KEY[Tenant ID] --> HASH[Hash → logical shard 0–4095]\n  HASH --> MAP[Mapping table]\n  MAP --> P1[(Physical DB 1: shards 0–1023)]\n  MAP --> P2[(Physical DB 2: shards 1024–2047)]\n  MAP --> P3[(Physical DB 3–4 ...)]\n```\n\nMany logical shards per physical server make later rebalancing a matter of moving whole logical shards."}, {"id": 96, "title": "Choosing a shard key", "tldr": "The shard key determines data distribution and which queries stay on a single shard. Choose a key with high cardinality, even load, and alignment with the most common access pattern, such as tenant ID in multi-tenant SaaS.", "real": "Notion sharded its PostgreSQL database in 2021 using workspace ID as the shard key, partitioning data into 480 logical shards across 32 physical databases, because most queries are scoped to a single workspace.", "body": "### Shard key criteria\n\n| Criterion | Question |\n|---|---|\n| Cardinality | Many distinct values? |\n| Even distribution | Avoids giant keys (one huge tenant)? |\n| Query locality | Do most queries include it? |\n| Write distribution | Avoids hot spots (e.g. timestamps)? |\n| Stability | Does it never change for a row? |\n\n### Examples\n\n| Application | Good shard key | Poor shard key |\n|---|---|---|\n| B2B SaaS | tenant_id | created_at |\n| Social app | user_id | country |\n| IoT | device_id | event type |\n\n### Large-tenant problem\n\nPlan for tenants that outgrow a shard: dedicated shards or sub-sharding."}, {"id": 97, "title": "Resharding and rebalancing", "tldr": "Data grows unevenly, so shards must be split or moved. Plan resharding from the start with logical shards, online data copying, change capture, cutover with brief write pauses, and verification.", "real": "Vitess, created at YouTube in 2010 and now a CNCF graduated project, provides online resharding for MySQL using VReplication, and has been used at companies such as Slack, GitHub and PlanetScale.", "body": "### Online move process\n\n```mermaid\nflowchart LR\n  COPY[Copy shard data to target] --> CATCHUP[Stream changes - CDC]\n  CATCHUP --> VERIFY[Verify consistency]\n  VERIFY --> CUTOVER[Brief write pause + routing switch]\n  CUTOVER --> CLEAN[Clean up source]\n```\n\n### Checklist\n\n- [ ] Logical shards decouple from physical servers\n- [ ] Routing layer supports per-shard mapping changes\n- [ ] Change capture tested under load\n- [ ] Verification by checksums/row counts\n- [ ] Rollback plan for cutover"}, {"id": 98, "title": "Cross-shard queries and transactions", "tldr": "Queries spanning shards require scatter-gather and merging, and transactions spanning shards require distributed protocols such as two-phase commit. Design schemas so most operations stay within one shard, and handle cross-shard work asynchronously.", "real": "Citus, a PostgreSQL extension acquired by Microsoft in 2019, colocates related tables by distribution key so joins and transactions on the same key run on one node, while still supporting distributed queries when needed.", "body": "### Query types\n\n| Query | Shards touched | Cost |\n|---|---|---|\n| `WHERE tenant_id = 42` | 1 | Low |\n| Aggregate across all tenants | All | High (scatter-gather) |\n| Join tables with same shard key | 1 per tenant | Low (colocated) |\n| Join on non-shard key | Many | High |\n\n### Patterns\n\n| Need | Pattern |\n|---|---|\n| Global reporting | Replicate to a data warehouse |\n| Global uniqueness (e.g. email) | Separate lookup table/service |\n| Cross-tenant transfer | Saga / outbox with compensation |\n| Reference data | Replicate small tables to all shards |"}, {"id": 99, "title": "Hot spots and skew", "tldr": "Uneven access, such as a celebrity account, a viral item or monotonic keys, can overload one partition or shard. Detect skew, then split hot keys, add caching, randomize keys, or isolate large tenants.", "real": "Discord described in 2023 how “hot partitions”, channels with huge message volume, created problems in its Cassandra cluster, and how request coalescing in data services and a move to ScyllaDB helped handle the load.", "body": "### Causes and fixes\n\n| Cause | Fix |\n|---|---|\n| Monotonic keys in range sharding | Hash prefix or hash sharding |\n| Celebrity / mega-tenant | Dedicated shard, sub-partitioning |\n| Viral item | Cache, request coalescing |\n| Time-based writes to latest partition | Bucketing by time + another key |\n\n### Request coalescing\n\n```mermaid\nflowchart LR\n  R1[Request 1 for key K] --> C[Coalescer]\n  R2[Request 2 for K] --> C\n  R3[Request 3 for K] --> C\n  C --> DB[(Single DB query)]\n  DB --> C\n  C --> ALL[Same answer to all requests]\n```"}, {"id": 100, "title": "Connection management and pooling", "tldr": "Database connections are expensive, especially in PostgreSQL’s process-per-connection model. Connection poolers multiplex many client connections over fewer server connections. Size pools from core counts and workload, not by the number of app instances.", "real": "PgBouncer is a widely used lightweight connection pooler for PostgreSQL, and the PostgreSQL wiki and HikariCP documentation cite a starting formula of roughly (core count × 2) + effective spindle count for connection pool sizing.", "body": "### Pooling modes (PgBouncer)\n\n| Mode | Server connection held for | Notes |\n|---|---|---|\n| Session | Whole client session | Most compatible |\n| Transaction | Each transaction | Most efficient; session features limited |\n| Statement | Each statement | Rare; no multi-statement transactions |\n\n### Architecture\n\n```mermaid\nflowchart LR\n  A1[App instance 1: 50 conns] --> PB[PgBouncer]\n  A2[App instance 2: 50 conns] --> PB\n  A3[App instance N: 50 conns] --> PB\n  PB -->|~40 server connections| PG[(PostgreSQL)]\n```\n\n### Why fewer connections can be faster\n\nToo many active connections cause CPU context switching, lock contention and memory pressure; queueing at the pooler is usually better than overloading the database."}, {"id": 101, "title": "The CAP theorem", "tldr": "CAP says that during a network partition, a distributed system must choose between consistency (all nodes see the same latest data) and availability (every request gets a non-error response). Partition tolerance is not optional in real networks.", "real": "Eric Brewer presented the CAP conjecture in 2000, and Seth Gilbert and Nancy Lynch proved a formal version in 2002; Brewer later wrote in 2012 that the “2 of 3” framing was misleading because the trade-off only applies during partitions.", "body": "### During a partition\n\n```mermaid\nflowchart LR\n  P[Network partition] --> C[Choose consistency: reject or delay some requests]\n  P --> A[Choose availability: serve possibly stale or conflicting data]\n```\n\n### Examples (default behavior)\n\n| System type | Typical choice during partition |\n|---|---|\n| Single-leader SQL with sync failover | Consistency (minority side unavailable) |\n| Spanner, CockroachDB | Consistency |\n| Cassandra at consistency ONE | Availability |\n| DynamoDB (eventually consistent reads) | Availability for reads |\n\n### Note\n\n“Consistency” in CAP means linearizability, which differs from the “C” in ACID."}, {"id": 102, "title": "PACELC and latency trade-offs", "tldr": "PACELC extends CAP: if there is a Partition, choose Availability or Consistency; Else (normal operation), choose Latency or Consistency. It captures the everyday trade-off: stronger consistency usually costs more coordination and latency.", "real": "Daniel Abadi proposed PACELC in 2010 and published it in IEEE Computer in 2012, arguing that the latency–consistency trade-off in normal operation matters more for system design than partition behavior alone.", "body": "### Classification examples\n\n| System | Partition: A or C | Else: L or C |\n|---|---|---|\n| Dynamo-style (Cassandra default) | A | L |\n| Spanner / CockroachDB | C | C |\n| Single-node RDBMS | — | C |\n\n### Everyday trade-off\n\n| Choice | Effect |\n|---|---|\n| Read from leader / quorum | Fresher data, more latency |\n| Read from nearest replica | Lower latency, possible staleness |"}, {"id": 103, "title": "Consistency models", "tldr": "Consistency models define what reads can return in distributed systems: linearizability (behaves like one copy), sequential, causal, read-your-writes, monotonic reads and eventual consistency. Stronger models are easier to program against but cost more.", "real": "Jepsen, the testing project by Kyle Kingsbury, publishes a widely used map of consistency models and has found many distributed databases that did not deliver the consistency they advertised.", "body": "### From strongest to weakest (simplified)\n\n| Model | Guarantee |\n|---|---|\n| Strict serializability | Serializable transactions in real-time order |\n| Linearizability | Single-object operations appear instantaneous, real-time order |\n| Sequential | All see same order, not necessarily real time |\n| Causal | Causally related operations seen in order |\n| Read-your-writes | You see your own writes |\n| Monotonic reads | Never see older data after newer |\n| Eventual | Replicas converge eventually |\n\n### Choosing\n\nUse the weakest model that keeps your application correct, and document it for developers."}, {"id": 104, "title": "Distributed transactions and two-phase commit", "tldr": "Two-phase commit (2PC) coordinates a transaction across multiple nodes: prepare (everyone votes) then commit (if all vote yes). It guarantees atomicity but blocks if the coordinator fails at the wrong moment, and adds latency.", "real": "The XA standard (X/Open, 1991) defined 2PC interfaces for distributed transactions across databases and message brokers, and modern distributed SQL databases make 2PC more robust by replicating coordinator state with consensus.", "body": "### Protocol\n\n```mermaid\nsequenceDiagram\n  participant C as Coordinator\n  participant A as Node A\n  participant B as Node B\n  C->>A: PREPARE\n  C->>B: PREPARE\n  A-->>C: YES\n  B-->>C: YES\n  C->>A: COMMIT\n  C->>B: COMMIT\n```\n\n### Problems\n\n| Problem | Effect |\n|---|---|\n| Coordinator crash after prepare | Participants hold locks, blocked |\n| Extra round trips | Higher latency |\n| Heterogeneous systems | Complex failure handling |\n\n### Alternatives\n\nSagas with compensating actions, outbox pattern, or designing to keep transactions within one partition."}, {"id": 105, "title": "Google Spanner and TrueTime", "tldr": "Spanner is a globally distributed SQL database offering externally consistent transactions. It uses Paxos replication and TrueTime, a clock API with bounded uncertainty backed by GPS and atomic clocks, waiting out uncertainty to order commits correctly.", "real": "Google published the Spanner paper at OSDI 2012; Spanner underpinned Google’s ads backend (F1) and became available externally as Cloud Spanner in 2017.", "body": "### Key ideas\n\n| Idea | Effect |\n|---|---|\n| Paxos groups per data split | Fault-tolerant replication |\n| TrueTime intervals [earliest, latest] | Known clock uncertainty |\n| Commit wait | Wait until uncertainty passes before acknowledging |\n| Externally consistent transactions | Commit order matches real time |\n| Snapshot reads at timestamp | Consistent lock-free reads |\n\n### Commit wait\n\n```mermaid\nflowchart LR\n  ASSIGN[Assign commit timestamp t = TT.now.latest] --> WAIT[Wait until TT.now.earliest > t]\n  WAIT --> ACK[Acknowledge commit]\n```\n\nSmaller clock uncertainty means shorter waits."}, {"id": 106, "title": "Distributed SQL databases", "tldr": "Distributed SQL (NewSQL) databases such as CockroachDB, YugabyteDB, TiDB and Spanner offer SQL, ACID transactions and horizontal scaling by splitting data into ranges replicated with consensus. They trade some latency and operational complexity for scale and resilience.", "real": "CockroachDB, inspired by Spanner, uses Raft replication and hybrid logical clocks instead of specialized clock hardware; YugabyteDB reuses PostgreSQL’s query layer; and TiDB is MySQL-compatible with storage in TiKV.", "body": "### Architecture pattern\n\n```mermaid\nflowchart TB\n  SQL[SQL layer: parse, plan, distributed execution] --> TXN[Distributed transactions]\n  TXN --> R1[Range 1: Raft group]\n  TXN --> R2[Range 2: Raft group]\n  TXN --> R3[Range 3: Raft group]\n```\n\n### When to consider\n\n| Good fit | Poor fit |\n|---|---|\n| Need horizontal write scaling with SQL | Small datasets fitting one node |\n| Multi-region with strong consistency | Ultra-low single-row latency |\n| High availability across zones/regions | Heavy analytics workloads |\n\n### Considerations\n\nLatency of cross-region consensus, data locality settings, compatibility gaps with PostgreSQL/MySQL, and cost."}, {"id": 107, "title": "Time, clocks and ordering", "tldr": "Distributed systems cannot rely on perfectly synchronized clocks. Clock skew can reorder events and break last-write-wins logic. Techniques include logical clocks, vector clocks, hybrid logical clocks and bounded-uncertainty clocks.", "real": "Leslie Lamport’s 1978 paper “Time, Clocks, and the Ordering of Events in a Distributed System” introduced logical clocks and the happened-before relation, foundational ideas for distributed databases.", "body": "### Clock types\n\n| Clock | Provides | Used in |\n|---|---|---|\n| Physical (NTP) | Approximate wall time | Logs, TTLs |\n| Lamport clock | Ordering consistent with causality | Protocols |\n| Vector clock | Detects concurrency | Dynamo-style conflict detection |\n| Hybrid logical clock | Physical-like timestamps with causality | CockroachDB, YugabyteDB |\n| TrueTime | Bounded uncertainty intervals | Spanner |\n\n### Practical advice\n\nDon’t use wall-clock timestamps from different servers to decide which write wins for critical data; use database-generated versions or sequence numbers."}, {"id": 108, "title": "Jepsen and testing distributed databases", "tldr": "Distributed databases fail in subtle ways under partitions, clock skew and crashes. Jepsen-style testing injects faults while checking histories for consistency violations. Read published analyses before trusting vendor claims.", "real": "Kyle Kingsbury’s Jepsen analyses, published since 2013, have found consistency bugs in many systems, including MongoDB, Elasticsearch, Redis and others, and several vendors have commissioned Jepsen tests to validate fixes.", "body": "### Jepsen method\n\n```mermaid\nflowchart LR\n  CLIENTS[Concurrent clients run operations] --> FAULTS[Inject faults: partitions, kills, clock skew]\n  FAULTS --> HISTORY[Record operation history]\n  HISTORY --> CHECK[Check against consistency model]\n  CHECK --> REPORT[Anomalies found?]\n```\n\n### Using results\n\n| Step | Action |\n|---|---|\n| Before adopting | Read Jepsen reports for the database and version |\n| Configuration | Use settings that analyses showed safe |\n| Your own tests | Fault injection in staging |"}, {"id": 109, "title": "Dynamo-style and wide-column databases", "tldr": "Dynamo-style systems such as Cassandra and ScyllaDB partition data with consistent hashing, replicate across nodes and offer tunable consistency. They excel at high write throughput and availability, but require query-driven data modeling.", "real": "Apache Cassandra was developed at Facebook and open-sourced in 2008, combining Dynamo’s distribution design with Bigtable’s data model; Apple and Netflix have been widely reported as large Cassandra users.", "body": "### Data modeling approach\n\n| Relational approach | Cassandra approach |\n|---|---|\n| Normalize, then query | Design tables per query |\n| Joins at query time | Denormalize, duplicate data |\n| Flexible ad hoc queries | Queries by partition key |\n\n### Table design example (CQL)\n\n```sql\nCREATE TABLE messages_by_channel (\n  channel_id  bigint,\n  bucket      int,          -- time bucket to bound partition size\n  message_id  timeuuid,\n  author_id   bigint,\n  body        text,\n  PRIMARY KEY ((channel_id, bucket), message_id)\n) WITH CLUSTERING ORDER BY (message_id DESC);\n```\n\n### Pitfalls\n\nUnbounded partitions, tombstone buildup from deletes, and queries that need ALLOW FILTERING."}, {"id": 110, "title": "Choosing a distributed database", "tldr": "Choose a distributed database only when single-node scaling, replicas and partitioning are not enough. Match the system to consistency needs, data model, query patterns, latency targets, operational capacity and cost.", "real": "Discord described in 2017 how it moved message storage from MongoDB to Cassandra, and in 2023 how it moved from Cassandra to ScyllaDB, each time driven by measured scaling and operational pain at its message volume, illustrating that database choices evolve with workload.", "body": "### Decision questions\n\n| Question | Implication |\n|---|---|\n| Does data fit on one large node with replicas? | Stay single-node |\n| Need strong consistency + SQL at scale? | Distributed SQL |\n| Massive write throughput, simple access patterns? | Wide-column |\n| Global users needing low latency? | Multi-region design |\n| Team experience? | Operational risk |\n\n### Decision flow\n\n```mermaid\nflowchart TD\n  Q1{Fits single node + replicas?} -- yes --> RDB[Relational database]\n  Q1 -- no --> Q2{Need SQL + ACID across shards?}\n  Q2 -- yes --> DSQL[Distributed SQL or sharded RDBMS]\n  Q2 -- no --> Q3{Simple key-based access, huge writes?}\n  Q3 -- yes --> WC[Wide-column / key-value]\n  Q3 -- no --> SPEC[Specialized store per need]\n```"}, {"id": 111, "title": "Key-value stores", "tldr": "Key-value stores map keys to values with very fast lookups. In-memory stores like Redis and Valkey serve caching, sessions, rate limiting and queues; managed services like DynamoDB offer durable key-value storage at massive scale.", "real": "AWS has reported that DynamoDB handled peaks of over 100 million requests per second during Amazon Prime Day events, and Redis’s 2024 license change led to the Linux Foundation’s Valkey fork, now offered by major cloud providers.", "body": "### Typical uses\n\n| Use | Example |\n|---|---|\n| Caching | Rendered pages, query results |\n| Sessions | User session data with TTL |\n| Rate limiting | Counters with expiry |\n| Leaderboards | Sorted sets |\n| Queues / streams | Redis Streams |\n| Feature flags | Fast reads |\n\n### Redis data structures\n\n| Structure | Example |\n|---|---|\n| String | `SET user:42:name \"Asha\"` |\n| Hash | User profile fields |\n| List | Recent activity |\n| Set | Unique visitors |\n| Sorted set | Leaderboard by score |\n| Stream | Event log |\n\n### Durability caution\n\nIn-memory stores may lose recent writes on crash depending on persistence settings (RDB snapshots, AOF)."}, {"id": 112, "title": "DynamoDB and single-table design", "tldr": "DynamoDB is a managed key-value and document database with partition and sort keys, predictable performance and on-demand scaling. Efficient designs model access patterns upfront, often storing multiple entity types in one table with composite keys.", "real": "Amazon’s 2022 USENIX ATC paper on DynamoDB described its evolution from the original Dynamo ideas, including multi-tenant architecture, adaptive capacity to handle hot partitions, and predictable performance at large scale.", "body": "### Key concepts\n\n| Concept | Meaning |\n|---|---|\n| Partition key | Determines data distribution |\n| Sort key | Orders items within a partition |\n| GSI | Global secondary index with different keys |\n| LSI | Local secondary index, same partition key |\n| Capacity modes | On-demand or provisioned |\n\n### Single-table example\n\n| PK | SK | Data |\n|---|---|---|\n| CUSTOMER#42 | PROFILE | name, email |\n| CUSTOMER#42 | ORDER#2026-03-01#981 | total, status |\n| CUSTOMER#42 | ORDER#2026-03-05#990 | total, status |\n\nQuery `PK = CUSTOMER#42 AND begins_with(SK, 'ORDER#')` returns a customer’s orders in date order."}, {"id": 113, "title": "Document databases", "tldr": "Document databases store JSON-like documents with flexible schemas, good for nested data read together. Model around access patterns, embed data read together, reference data shared widely, and still enforce validation.", "real": "MongoDB added multi-document ACID transactions in version 4.0 (2018) and JSON Schema validation in 3.6, narrowing the gap with relational databases for applications that need stronger guarantees.", "body": "### Embed vs reference\n\n| Embed when | Reference when |\n|---|---|\n| Data read together | Data shared across many documents |\n| Bounded size (order lines) | Unbounded growth (comments on a viral post) |\n| Owned by parent | Independent lifecycle |\n\n### Example document\n\n```json\n{\n  \"_id\": \"order_981\",\n  \"customer_id\": \"cust_42\",\n  \"items\": [\n    {\"sku\": \"A-100\", \"qty\": 2, \"price_cents\": 1299},\n    {\"sku\": \"B-200\", \"qty\": 1, \"price_cents\": 4999}\n  ],\n  \"status\": \"paid\",\n  \"created_at\": \"2026-03-01T10:00:00Z\"\n}\n```\n\n### Relational alternative\n\nPostgreSQL’s jsonb with GIN indexes offers document storage alongside relational features."}, {"id": 114, "title": "Graph databases", "tldr": "Graph databases store nodes and relationships as first-class data, making multi-hop traversals (friends of friends, fraud rings, dependency graphs) efficient and expressive. Use them when relationships are central to queries.", "real": "The International Consortium of Investigative Journalists used the Neo4j graph database to analyze the 2016 Panama Papers leak, tracing connections between people, companies and intermediaries across millions of documents.", "body": "### Example (Cypher)\n\n```text\nMATCH (a:Account)-[:SHARES_DEVICE]->(d:Device)<-[:SHARES_DEVICE]-(b:Account)\nWHERE a.id = 'acct_42' AND a <> b\nRETURN b.id, count(d) AS shared_devices\nORDER BY shared_devices DESC;\n```\n\n### When graphs help\n\n| Use case | Why graph |\n|---|---|\n| Fraud detection | Shared devices, addresses, cards |\n| Recommendations | Multi-hop similarity |\n| Knowledge graphs | Rich, typed relationships |\n| Network / dependency analysis | Path finding |\n\n### Standards\n\nISO published GQL (Graph Query Language) in 2024, the first new ISO database query language standard since SQL."}, {"id": 115, "title": "Time-series databases", "tldr": "Time-series workloads ingest large volumes of timestamped measurements and query recent data, ranges and aggregates. Specialized engines optimize compression, time partitioning, downsampling and retention.", "real": "Prometheus, created at SoundCloud in 2012 and the second project to graduate from the Cloud Native Computing Foundation, uses a custom time-series database for monitoring metrics; TimescaleDB extends PostgreSQL for time-series data.", "body": "### Characteristics\n\n| Property | Implication |\n|---|---|\n| Append-heavy | Write-optimized storage |\n| Time-ordered queries | Time partitioning |\n| Old data less valuable | Downsampling, retention |\n| Repetitive values | High compression |\n\n### Retention and downsampling\n\n```mermaid\nflowchart LR\n  RAW[Raw data: 10 s resolution, 7 days] --> M1[1-minute rollups, 90 days]\n  M1 --> H1[1-hour rollups, 2 years]\n```\n\n### Options\n\nTimescaleDB (PostgreSQL extension), InfluxDB, Prometheus (metrics), ClickHouse (analytics), and partitioned PostgreSQL with BRIN indexes."}, {"id": 116, "title": "Search engines", "tldr": "Search engines such as Elasticsearch and OpenSearch build inverted indexes for fast full-text search, relevance ranking, fuzzy matching, faceting and aggregations. Treat them as derived data synchronized from a source of truth.", "real": "Elasticsearch is built on Apache Lucene; after Elastic changed its license in 2021, AWS created the OpenSearch fork, which moved to the Linux Foundation’s OpenSearch Software Foundation in 2024.", "body": "### Inverted index\n\n| Term | Documents |\n|---|---|\n| database | 1, 4, 9 |\n| index | 1, 2 |\n| replication | 4, 7 |\n\n### Sync architecture\n\n```mermaid\nflowchart LR\n  DB[(Primary database)] --> CDC[Change data capture]\n  CDC --> QUEUE[Kafka / queue]\n  QUEUE --> INDEXER[Indexer]\n  INDEXER --> SEARCH[(Search engine)]\n  APP[App search requests] --> SEARCH\n```\n\n### Caution\n\nSearch indexes are eventually consistent copies; rebuild procedures and reconciliation checks are needed."}, {"id": 117, "title": "Vector databases and similarity search", "tldr": "Vector search finds items with similar embeddings using approximate nearest-neighbor (ANN) indexes such as HNSW and IVF. Options range from extensions like pgvector to dedicated vector databases. Evaluate recall, latency, filtering and operational fit.", "real": "The HNSW algorithm, published by Malkov and Yashunin (2016, journal version 2018), became the most widely used ANN index; pgvector added HNSW indexes in version 0.5.0 (2023), making vector search practical inside PostgreSQL.", "body": "### pgvector example\n\n```sql\nCREATE EXTENSION IF NOT EXISTS vector;\n\nCREATE TABLE documents (\n  id         bigint PRIMARY KEY,\n  tenant_id  bigint NOT NULL,\n  content    text,\n  embedding  vector(1536)\n);\n\nCREATE INDEX ON documents USING hnsw (embedding vector_cosine_ops);\n\nSELECT id, content\nFROM documents\nWHERE tenant_id = 42\nORDER BY embedding <=> $1\nLIMIT 5;\n```\n\n### Evaluation criteria\n\n| Criterion | Question |\n|---|---|\n| Recall | Do we find the true nearest neighbors? |\n| Latency | p95 at target recall |\n| Filtering | Metadata filters with ANN |\n| Updates | Insert/delete performance |\n| Scale | Vectors count and dimensions |\n| Hybrid search | Keyword + vector combination |"}, {"id": 118, "title": "In-memory and embedded databases", "tldr": "In-memory databases keep data in RAM for very low latency; embedded databases run inside the application process. SQLite powers apps and devices, and DuckDB brings fast analytics to laptops and data pipelines.", "real": "DuckDB, created at CWI in the Netherlands (first released in 2019), is an in-process columnar analytical database often described as “SQLite for analytics”, and has become popular for local data analysis.", "body": "### Comparison\n\n| Database | Type | Typical use |\n|---|---|---|\n| SQLite | Embedded, row-oriented | Mobile apps, desktop apps, edge, tests |\n| DuckDB | Embedded, columnar | Local analytics, Parquet processing |\n| Redis / Valkey | In-memory server | Caching, real-time data |\n| H2 / HSQLDB | Embedded (Java) | Tests, small apps |\n\n### DuckDB example\n\n```sql\nSELECT country, count(*) AS orders, sum(total) AS revenue\nFROM read_parquet('orders/*.parquet')\nGROUP BY country\nORDER BY revenue DESC;\n```"}, {"id": 119, "title": "Polyglot persistence", "tldr": "Large systems often use several databases, each suited to a workload: relational for transactions, search engine for text, cache for hot data, warehouse for analytics. The cost is synchronization and operational complexity, so add stores deliberately.", "real": "Martin Fowler popularized the term “polyglot persistence” around 2011 (building on earlier usage), and his 2012 book with Pramod Sadalage, “NoSQL Distilled”, described systems that use different data stores for different needs within one application.", "body": "### Example architecture\n\n```mermaid\nflowchart LR\n  APP[Application] --> PG[(PostgreSQL: source of truth)]\n  APP --> REDIS[(Redis: cache)]\n  APP --> ES[(Search engine)]\n  PG -->|CDC| ES\n  PG -->|CDC| WH[(Warehouse)]\n  PG -->|CDC| REDIS\n```\n\n### Rules\n\n| Rule | Why |\n|---|---|\n| One source of truth per entity | Avoid conflicting copies |\n| Derived stores rebuildable | Recovery |\n| Sync via CDC or outbox | Reliability |\n| Consider extensions first (e.g. PostgreSQL + jsonb, pgvector, full-text) | Fewer systems |"}, {"id": 120, "title": "Choosing between SQL and NoSQL", "tldr": "Choose based on data model, query patterns, consistency needs, scale, team skills and ecosystem. Relational databases are the safe default for most business applications; NoSQL fits specific patterns such as massive key-based scale or flexible documents.", "real": "Many teams that adopted NoSQL early in the 2010s for scale later moved some workloads back to relational databases; meanwhile relational databases added JSON, horizontal scaling options and specialized indexes, blurring the line.", "body": "### Decision matrix\n\n| Requirement | Relational | Document | Key-value | Wide-column |\n|---|---|---|---|---|\n| Complex queries and joins | ✓✓ | ✓ | ✗ | ✗ |\n| Multi-row transactions | ✓✓ | ✓ | Limited | Limited |\n| Flexible schema | ✓ (jsonb) | ✓✓ | ✓ | ✓ |\n| Massive write throughput | ✓ (with sharding) | ✓ | ✓✓ | ✓✓ |\n| Simple key lookups at huge scale | ✓ | ✓ | ✓✓ | ✓✓ |\n| Ad hoc analytics | ✓ | Limited | ✗ | ✗ |\n\n### Default advice\n\nStart with a relational database unless a clear requirement points elsewhere, and document the reason when choosing otherwise."}, {"id": 121, "title": "Analytical databases and OLAP", "tldr": "Analytical databases answer questions over large historical datasets with columnar storage, compression, vectorized execution and massively parallel processing. They are optimized for scans and aggregations, not frequent single-row updates.", "real": "Google’s Dremel paper (2010) described interactive SQL-like queries over trillions of rows using columnar storage and tree-structured execution; Dremel became the basis of Google BigQuery.", "body": "### Techniques\n\n| Technique | Benefit |\n|---|---|\n| Columnar storage | Read only needed columns |\n| Compression | Less I/O |\n| Vectorized execution | CPU efficiency (batches of values) |\n| MPP (massively parallel processing) | Split work across nodes |\n| Zone maps / min-max indexes | Skip irrelevant blocks |\n| Materialized aggregates | Fast dashboards |\n\n### Popular systems\n\nSnowflake, BigQuery, Amazon Redshift, ClickHouse, Databricks SQL, Apache Druid, Apache Pinot, DuckDB."}, {"id": 122, "title": "Dimensional modeling: star and snowflake schemas", "tldr": "Dimensional models organize analytics data into fact tables (measurable events) and dimension tables (descriptive context). Star schemas keep dimensions denormalized for simple, fast queries; snowflake schemas normalize dimensions.", "real": "Ralph Kimball’s “The Data Warehouse Toolkit” (first edition 1996) established dimensional modeling as the standard approach for data warehouses, alongside Bill Inmon’s enterprise data warehouse approach.", "body": "### Star schema\n\n```mermaid\nflowchart TB\n  FACT[fact_sales: date_key, product_key, store_key, qty, revenue]\n  D1[dim_date] --- FACT\n  D2[dim_product] --- FACT\n  D3[dim_store] --- FACT\n  D4[dim_customer] --- FACT\n```\n\n### Key concepts\n\n| Concept | Meaning |\n|---|---|\n| Grain | What one fact row represents (e.g. one order line) |\n| Fact | Numeric measures |\n| Dimension | Descriptive attributes |\n| Surrogate keys | Warehouse-managed keys |\n| Slowly changing dimensions | Track attribute history (Type 1, 2) |\n\n### Example query\n\n```sql\nSELECT d.month, p.category, sum(f.revenue)\nFROM fact_sales f\nJOIN dim_date d ON d.date_key = f.date_key\nJOIN dim_product p ON p.product_key = f.product_key\nGROUP BY d.month, p.category;\n```"}, {"id": 123, "title": "Cloud data warehouses", "tldr": "Cloud warehouses separate storage from compute, scale elastically and charge by usage. Understanding their pricing models (per query bytes scanned, per compute time) and design features (clustering, partitioning) is essential to control cost.", "real": "Snowflake’s architecture, described in a 2016 SIGMOD paper, separated cloud object storage from independently scalable “virtual warehouses” for compute, an approach that influenced the whole industry.", "body": "### Comparison of pricing approaches\n\n| Model | Example | Cost driver |\n|---|---|---|\n| Bytes scanned | BigQuery on-demand | Data read per query |\n| Compute time | Snowflake credits | Warehouse size × time |\n| Provisioned clusters | Redshift provisioned | Node hours |\n| Serverless capacity | Redshift Serverless, BigQuery editions | Compute units used |\n\n### Cost control practices\n\n- [ ] Partition and cluster large tables\n- [ ] Select only needed columns\n- [ ] Auto-suspend idle compute\n- [ ] Query cost monitoring and budgets\n- [ ] Materialize repeated expensive transformations"}, {"id": 124, "title": "Data lakes and lakehouses", "tldr": "Data lakes store raw files cheaply in object storage; lakehouses add table formats (Delta Lake, Apache Iceberg, Apache Hudi) that provide ACID transactions, schema evolution and time travel on top of open files, enabling warehouse-like analytics on lake storage.", "real": "Apache Iceberg was created at Netflix and became an Apache top-level project in 2020; Delta Lake was open-sourced by Databricks in 2019; and Apache Hudi originated at Uber.", "body": "### Architecture\n\n```mermaid\nflowchart LR\n  SRC[Sources] --> INGEST[Ingestion]\n  INGEST --> OBJ[(Object storage: Parquet files)]\n  OBJ --> FMT[Table format: Iceberg / Delta / Hudi metadata]\n  FMT --> ENGINES[Engines: Spark, Trino, Snowflake, DuckDB]\n```\n\n### Table format features\n\n| Feature | Benefit |\n|---|---|\n| ACID commits | Reliable concurrent writes |\n| Schema evolution | Add/rename columns safely |\n| Partition evolution (Iceberg) | Change partitioning without rewrites |\n| Time travel | Query past snapshots |\n| Open format | Multiple engines on same data |"}, {"id": 125, "title": "Columnar file formats", "tldr": "Apache Parquet and ORC store data by column with compression, encoding and statistics per column chunk, enabling efficient analytics on files. File sizing, partitioning and sorting strongly affect query performance.", "real": "Apache Parquet was created by Twitter and Cloudera in 2013, based on ideas from Google’s Dremel paper, and became the de facto standard file format for analytical data lakes.", "body": "### Parquet structure\n\n```mermaid\nflowchart TB\n  FILE[Parquet file] --> RG1[Row group 1]\n  FILE --> RG2[Row group 2]\n  RG1 --> C1[Column chunk: id]\n  RG1 --> C2[Column chunk: country]\n  RG1 --> C3[Column chunk: amount]\n  FILE --> FOOTER[Footer: schema + min/max statistics]\n```\n\n### Best practices\n\n| Practice | Why |\n|---|---|\n| Files of roughly 128 MB–1 GB | Avoid “small files problem” |\n| Partition by common filter (date) | Pruning |\n| Sort within files by filter columns | Better min/max skipping |\n| Avoid too many partitions | Metadata overhead |"}, {"id": 126, "title": "ETL vs ELT", "tldr": "ETL transforms data before loading it into the warehouse; ELT loads raw data first and transforms inside the warehouse using SQL. Cloud warehouses made ELT popular because compute is elastic and raw data stays available for reprocessing.", "real": "Tools such as Fivetran and Airbyte for loading and dbt for SQL transformations became a common “modern data stack” pattern in the late 2010s and 2020s, built around ELT into cloud warehouses.", "body": "### Comparison\n\n| | ETL | ELT |\n|---|---|---|\n| Transform location | Separate engine | Inside warehouse |\n| Raw data retained | Often not | Yes |\n| Flexibility | Lower | Higher |\n| Tools | Informatica, custom Spark | Fivetran/Airbyte + dbt |\n| Data privacy | Can filter before load | Must control raw access |\n\n### ELT layers\n\n```mermaid\nflowchart LR\n  RAW[Raw / bronze] --> STG[Staging / silver: cleaned]\n  STG --> MART[Marts / gold: business models]\n  MART --> BI[BI and ML]\n```"}, {"id": 127, "title": "Change data capture", "tldr": "Change data capture (CDC) streams row-level changes from a database’s log to other systems (warehouses, search indexes, caches, services) without dual writes. It is the reliable backbone for keeping derived data in sync.", "real": "Debezium, an open-source CDC platform started by Red Hat, reads PostgreSQL logical decoding, MySQL binlogs and other logs and publishes change events, commonly to Apache Kafka.", "body": "### CDC architecture\n\n```mermaid\nflowchart LR\n  DB[(Source DB)] -->|WAL / binlog| CDC[Debezium connector]\n  CDC --> KAFKA[Kafka topics]\n  KAFKA --> WH[Warehouse]\n  KAFKA --> SEARCH[Search index]\n  KAFKA --> CACHE[Cache invalidation]\n```\n\n### Why CDC over dual writes\n\n| Dual writes (app writes DB + other system) | CDC |\n|---|---|\n| Can diverge on partial failure | Derived from committed changes |\n| Ordering issues | Log order preserved per key |\n| Every app must implement | Central pipeline |\n\n### Watch out\n\nReplication slot growth (PostgreSQL) when consumers stop, schema changes, and initial snapshots of large tables."}, {"id": 128, "title": "Streaming and event logs", "tldr": "Event streaming platforms such as Apache Kafka store ordered, durable logs of events that many consumers read independe

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Database Engineering Mastery: 200 Chapters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2F5; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#171A21; --muted:#575D6B; --line:#D9DCE4;
  --accent:#3D4FA0; --accent-soft:#E3E7F6; --accent-ink:#FFFFFF;
  --amber:#B97A0B; --tldr-bg:#FFF5DC; --tldr-line:#D49A22;
  --indigo:#2D6A3E; --real-bg:#E5F2E8; --real-line:#3E8A53;
  --code-bg:#181A16; --code-ink:#E6E9E1; --inline-code:#E9ECE4;
  --cell-empty:#DCE0D6; --shadow:0 1px 0 rgba(24,26,22,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
    --accent:#9AA8F0; --accent-soft:#222A4A; --accent-ink:#121836;
    --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
    --indigo:#97D3A6; --real-bg:#14261A; --real-line:#4F9E66;
    --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
    --cell-empty:#2E332B; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
  --accent:#9AA8F0; --accent-soft:#222A4A; --accent-ink:#121836;
  --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
  --indigo:#97D3A6; --real-bg:#14261A; --real-line:#4F9E66;
  --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
  --cell-empty:#2E332B; --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header with the memory-bank progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:20px;padding:12px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted)}
.bank{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bank-row{display:flex;gap:4px;flex-wrap:nowrap;min-width:0}
.bank-group{flex:1;min-width:0;display:flex;gap:2px;padding:3px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.cell{flex:1;min-width:2px;max-width:10px;height:18px;border-radius:2px;background:var(--cell-empty);border:0;padding:0;cursor:pointer;transition:background .2s}
.cell.done{background:var(--accent)}
.cell.here{box-shadow:0 0 0 2px var(--amber)}
.bank-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bank-meta strong{color:var(--ink);font-weight:600}
.top-actions{display:flex;gap:8px}
.btn{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.menu-btn{display:none}

/* Shell */
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,76px));height:calc(100dvh - var(--top-h,76px) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg)}
.search{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
.part{margin-bottom:4px}
.part-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:8px;cursor:pointer}
.part-head:hover{background:var(--surface-2)}
.part-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);width:22px;flex:none}
.part-name{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.part-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.part-count.full{color:var(--accent);font-weight:600}
.part-list{list-style:none;margin:0 0 6px;padding:0 0 0 30px;display:none}
.part.open .part-list{display:block}
.ch-row{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:6px}
.ch-row.active{background:var(--accent-soft)}
.ch-row a{flex:1;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.ch-row a .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.tick{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:11px;height:11px;opacity:0}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{opacity:1;color:var(--accent-ink)}
.hidden{display:none!important}

/* Main reading area */
.main{padding:24px 32px 80px;min-width:0}
.crumb{font-size:14px;color:var(--muted);margin:0 0 12px}
.crumb a{color:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;font-size:14px;color:var(--muted);max-width:240px;text-align:left}
.tab .tab-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--cell-empty)}
.tab .dot.on{background:var(--accent)}
article{max-width:780px}
.ch-no{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--accent);font-size:15px;margin:0}
h1.ch-title{font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:6px 0 22px;font-weight:700;text-wrap:balance}
.box{border-radius:10px;padding:16px 18px;margin:0 0 26px;border-left:4px solid}
.box h2{font-size:14px;margin:0 0 6px;font-weight:600}
.box p{margin:0}
.tldr{background:var(--tldr-bg);border-color:var(--tldr-line)}
.tldr h2{color:var(--amber)}
.tldr p{font-size:17px;line-height:1.55}
.real{background:var(--real-bg);border-color:var(--real-line);margin-top:34px}
.real h2{color:var(--indigo)}
.body h3{font-size:20px;margin:30px 0 10px;letter-spacing:-.01em}
.body p{margin:0 0 14px}
.body ul,.body ol{padding-left:22px;margin:0 0 16px}
.body li{margin:4px 0}
.body li input[type=checkbox]{margin-right:6px;accent-color:var(--accent)}
.body code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.88em;background:var(--inline-code);padding:1px 5px;border-radius:4px}
.body pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13.5px;line-height:1.55;margin:0 0 18px}
.body pre code{background:none;padding:0;font-size:inherit;color:inherit}
.table-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.body table{border-collapse:collapse;width:100%;font-size:14px}
.body th,.body td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.body th{background:var(--surface-2);font-weight:600}
.body tr:last-child td{border-bottom:0}
.body strong{font-weight:600}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.complete{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:15px}
.complete .tick{border-color:currentColor;pointer-events:none}
.complete.on{background:var(--accent);color:var(--accent-ink)}
.complete.on .tick{background:var(--accent-ink);border-color:var(--accent-ink)}
.complete.on .tick svg{opacity:1;color:var(--accent)}
.nav{display:flex;gap:8px}
.nav .btn[disabled]{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}

/* Diagrams and charts */
.diagram{margin:0 0 20px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
.diagram svg{display:block;margin:0 auto;height:auto}
.diagram.loading{color:var(--muted);font-size:14px}
.chart{margin:0 0 20px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chart figcaption{font-weight:600;font-size:14px;margin:0 0 10px}
.bar-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.bar-label{color:var(--ink);line-height:1.3}
.bar-track{height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar{display:block;height:100%;background:var(--accent);border-radius:7px 0 0 7px}
.bar-val{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.chart-note{font-size:12px;color:var(--muted);margin-top:6px}

/* Contents view */
.contents h1{font-size:32px;margin:0 0 6px;letter-spacing:-.02em}
.contents .lead{color:var(--muted);margin:0 0 24px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.pcard h2{font-size:15px;margin:0 0 2px;line-height:1.3}
.pcard .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pcard ol{list-style:none;padding:0;margin:0}
.pcard li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13.5px;line-height:1.35}
.pcard li a{color:var(--ink);text-decoration:none;flex:1}
.pcard li a:hover{text-decoration:underline}
.contents-actions{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}

/* Mobile */
.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);height:auto;z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .menu-btn{display:inline-block}
  .main{padding:18px 16px 60px}
  .top-inner{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand{flex:1}
  .bank{order:3;flex-basis:100%}
  .bank-row{gap:3px}
  .bank-group{gap:1px;padding:2px}
  .cell{height:12px;max-width:none;min-width:0}
  .bank-row{flex-wrap:wrap;row-gap:3px;gap:3px}
  .bank-group{flex:0 0 calc(10% - 2.7px);gap:1px;padding:1px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</head>
<body>
<header class="top" id="top">
  <div class="top-inner">
    <button class="btn menu-btn" id="menuBtn" aria-label="Open chapter list">Chapters</button>
    <div class="brand"><b>Database engineering mastery</b><span>From relational foundations to internals, scale and reliability</span></div>
    <div class="bank" aria-label="Course progress">
      <div class="bank-row" id="bank"></div>
      <div class="bank-meta"><span><strong id="doneCount">0</strong> of 200 chapters complete</span><span id="pct">0%</span></div>
    </div>
    <div class="top-actions"><a class="btn" href="#contents" style="text-decoration:none">Contents</a></div>
  </div>
</header>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <nav class="side" id="side" aria-label="Chapters">
    <input class="search" id="search" type="search" placeholder="Search chapters" aria-label="Search chapters">
    <div id="parts"></div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const CHAPTERS = [{"id": 1, "title": "What a database is and why it matters", "tldr": "A database stores data durably and lets many users read and change it safely and efficiently. A database management system (DBMS) provides storage, querying, concurrency control, recovery and security, so applications don’t have to reinvent them.", "real": "SQLite, a small embedded database, is described by its developers as the most widely deployed database engine in the world, running inside every Android and iOS device, most web browsers and countless applications.", "body": "### What a DBMS provides\n\n| Capability | Without a DBMS | With a DBMS |\n|---|---|---|\n| Durability | Files can be corrupted by crashes | Write-ahead logging and recovery |\n| Querying | Custom code per question | Declarative query language (SQL) |\n| Concurrency | Race conditions | Transactions and isolation |\n| Integrity | Manual checks | Constraints and types |\n| Security | Ad hoc | Users, roles, permissions |\n| Performance | Full file scans | Indexes, optimizer, caching |\n\n### Layers\n\n```mermaid\nflowchart TB\n  APP[Applications] --> API[Query interface: SQL / API]\n  API --> QP[Query processor: parser, optimizer, executor]\n  QP --> TX[Transaction manager: locks, MVCC, logging]\n  TX --> SM[Storage manager: buffer pool, files, indexes]\n  SM --> DISK[(Disk / SSD)]\n```"}, {"id": 2, "title": "DBMS architecture", "tldr": "A typical relational DBMS has a client interface, a query processor (parser, rewriter, optimizer, executor), a transaction and concurrency manager, a recovery manager with a write-ahead log, and a storage engine with a buffer pool, files and indexes.", "real": "The paper “Architecture of a Database System” by Hellerstein, Stonebraker and Hamilton (2007) describes these components and remains a standard reference for how relational database systems are built.", "body": "### Query path\n\n```mermaid\nflowchart LR\n  SQL[SQL text] --> PARSE[Parser]\n  PARSE --> REWRITE[Rewriter: views, rules]\n  REWRITE --> OPT[Optimizer: choose plan]\n  OPT --> EXEC[Executor]\n  EXEC --> BUF[Buffer pool]\n  BUF --> FILES[(Data + index files)]\n  EXEC --> WAL[(Write-ahead log)]\n```\n\n### Component responsibilities\n\n| Component | Responsibility |\n|---|---|\n| Connection manager | Sessions, authentication |\n| Parser | Syntax check, parse tree |\n| Optimizer | Choose cheapest execution plan |\n| Executor | Run operators (scan, join, sort) |\n| Lock / MVCC manager | Isolation between transactions |\n| Log manager | Durability, recovery |\n| Buffer manager | Cache pages in memory |\n| Storage manager | Pages, files, indexes on disk |"}, {"id": 3, "title": "A short history of data models", "tldr": "Databases evolved from hierarchical and network models (navigational, pointer-based) to the relational model (declarative, set-based), then to object-relational, NoSQL and NewSQL systems. The relational model remains dominant for transactional data.", "real": "Edgar F. Codd published “A Relational Model of Data for Large Shared Data Banks” in 1970 while at IBM; IBM’s System R project then developed SEQUEL (later SQL), and Oracle released one of the first commercial SQL databases in 1979.", "body": "### Timeline\n\n| Era | Model | Examples |\n|---|---|---|\n| 1960s | Hierarchical, network | IBM IMS, CODASYL databases |\n| 1970s–80s | Relational | System R, Ingres, Oracle, DB2 |\n| 1990s | Object-relational | PostgreSQL extensions |\n| 2000s | NoSQL | Bigtable, Dynamo, Cassandra, MongoDB |\n| 2010s | NewSQL / distributed SQL | Spanner, CockroachDB, TiDB |\n| 2020s | Cloud-native, serverless, vector | Aurora, Neon, pgvector |\n\n### Why relational won for business data\n\nDeclarative queries, data independence from physical storage, strong integrity rules, and transactions."}, {"id": 4, "title": "The relational model", "tldr": "The relational model represents data as relations (tables) of tuples (rows) with attributes (columns). Keys identify rows and link tables. Queries operate on sets of rows using relational algebra, which SQL expresses declaratively.", "real": "Codd’s 1970 paper introduced data independence, the idea that applications should not depend on how data is physically stored, which is why indexes can be added to a relational database without changing application queries.", "body": "### Terminology\n\n| Formal term | Common term |\n|---|---|\n| Relation | Table |\n| Tuple | Row |\n| Attribute | Column |\n| Domain | Data type / allowed values |\n| Primary key | Unique row identifier |\n| Foreign key | Reference to another table’s key |\n\n### Relational algebra operations\n\n| Operation | SQL equivalent |\n|---|---|\n| Selection (σ) | WHERE |\n| Projection (π) | SELECT columns |\n| Join (⋈) | JOIN |\n| Union (∪) | UNION |\n| Difference (−) | EXCEPT |\n| Aggregation | GROUP BY |\n\n### Example\n\n```sql\nSELECT c.name, o.total\nFROM customers c\nJOIN orders o ON o.customer_id = c.id\nWHERE o.created_at >= DATE '2026-01-01';\n```"}, {"id": 5, "title": "SQL: the language of relational databases", "tldr": "SQL is declarative: you describe the result you want, and the database decides how to compute it. SQL includes data definition (DDL), data manipulation (DML), data control (DCL) and transaction control. Dialects differ in details.", "real": "SQL was standardized by ANSI in 1986 and ISO in 1987, and has been revised many times (SQL:1999 added recursive queries, SQL:2003 window functions, SQL:2016 JSON support); every major vendor implements a dialect with extensions.", "body": "### SQL sublanguages\n\n| Category | Statements |\n|---|---|\n| DDL | CREATE, ALTER, DROP |\n| DML | SELECT, INSERT, UPDATE, DELETE, MERGE |\n| DCL | GRANT, REVOKE |\n| Transaction control | BEGIN, COMMIT, ROLLBACK, SAVEPOINT |\n\n### Logical order of SELECT evaluation\n\n```mermaid\nflowchart LR\n  F[FROM / JOIN] --> W[WHERE]\n  W --> G[GROUP BY]\n  G --> H[HAVING]\n  H --> S[SELECT]\n  S --> D[DISTINCT]\n  D --> O[ORDER BY]\n  O --> L[LIMIT / OFFSET]\n```\n\nThis logical order explains why a column alias defined in SELECT cannot be used in WHERE in standard SQL."}, {"id": 6, "title": "OLTP vs OLAP", "tldr": "OLTP (online transaction processing) handles many short reads and writes on small sets of rows; OLAP (online analytical processing) runs complex queries scanning large amounts of data. They need different schemas, storage layouts and systems.", "real": "Benchmarks from the Transaction Processing Performance Council reflect this split: TPC-C models an order-entry OLTP workload, while TPC-H and TPC-DS model analytical decision-support queries.", "body": "### Comparison\n\n| | OLTP | OLAP |\n|---|---|---|\n| Queries | Short, simple, by key | Long, complex, aggregations |\n| Rows touched | Few | Millions to billions |\n| Writes | Frequent, small | Bulk loads |\n| Schema | Normalized | Star / denormalized |\n| Storage | Row-oriented | Column-oriented |\n| Users | Applications | Analysts, BI tools |\n| Examples | PostgreSQL, MySQL, Oracle | Snowflake, BigQuery, ClickHouse |\n\n### Typical architecture\n\n```mermaid\nflowchart LR\n  APP[Application] --> OLTP[(OLTP database)]\n  OLTP -->|CDC / ETL| WH[(Data warehouse)]\n  WH --> BI[Dashboards and analytics]\n```"}, {"id": 7, "title": "ACID properties", "tldr": "ACID describes reliable transactions: Atomicity (all or nothing), Consistency (rules preserved), Isolation (concurrent transactions don’t interfere improperly) and Durability (committed data survives crashes).", "real": "The acronym ACID was coined by Theo Härder and Andreas Reuter in 1983, building on Jim Gray’s earlier work on transactions, for which Gray received the Turing Award in 1998.", "body": "### ACID explained\n\n| Property | Meaning | Mechanism |\n|---|---|---|\n| Atomicity | Transaction fully applies or not at all | Undo / rollback, logging |\n| Consistency | Constraints hold after commit | Constraints, application logic |\n| Isolation | Concurrent effects controlled | Locks, MVCC |\n| Durability | Committed data persists | Write-ahead log, fsync, replication |\n\n### Example: money transfer\n\n```sql\nBEGIN;\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nUPDATE accounts SET balance = balance + 100 WHERE id = 2;\nCOMMIT;\n```\n\nIf the database crashes between the two updates, atomicity guarantees neither change survives."}, {"id": 8, "title": "The storage hierarchy and latency", "tldr": "Database performance is shaped by the speed gap between CPU caches, memory, SSDs, disks and networks. Good database design minimizes slow operations: random disk reads, network round trips and unnecessary data movement.", "real": "Jeff Dean’s widely cited “latency numbers every programmer should know” list made these orders of magnitude famous; exact values change with hardware, but the relative gaps still guide database design.", "body": "### Approximate latencies (log scale)\n\n```chart\n{\"title\": \"Approximate access latency (nanoseconds, log scale)\", \"unit\": \"ns\", \"log\": true, \"data\": [[\"L1 cache reference\", 0.5], [\"Main memory reference\", 100], [\"SSD random 4 KB read\", 150000], [\"Round trip in a datacenter\", 500000], [\"Disk seek\", 10000000], [\"Packet across continents and back\", 150000000]]}\n```\n\nValues are approximate and from Jeff Dean’s classic list; modern NVMe SSDs can be faster.\n\n### Design implications\n\n| Fact | Database technique |\n|---|---|\n| Memory far faster than disk | Buffer pool caching |\n| Sequential I/O faster than random | Log-structured writes, sequential scans |\n| Network round trips are expensive | Batching, fewer queries |\n| Disks fail | Replication, checksums, backups |"}, {"id": 9, "title": "The database landscape", "tldr": "Databases specialize: relational for transactional data, key-value for fast lookups, document for flexible records, wide-column for massive writes, graph for relationships, time-series for metrics, search engines for text, columnar warehouses for analytics, and vector stores for similarity search.", "real": "DB-Engines, a widely referenced ranking site, tracks hundreds of database systems across these categories, with relational systems such as Oracle, MySQL, Microsoft SQL Server and PostgreSQL consistently at the top of its popularity ranking.", "body": "### Categories\n\n| Category | Examples | Best for |\n|---|---|---|\n| Relational | PostgreSQL, MySQL, Oracle, SQL Server | Transactions, structured data |\n| Key-value | Redis, DynamoDB | Caching, simple lookups |\n| Document | MongoDB, Couchbase | Flexible JSON records |\n| Wide-column | Cassandra, ScyllaDB, Bigtable | High write throughput |\n| Graph | Neo4j | Connected data |\n| Time-series | TimescaleDB, InfluxDB | Metrics, events over time |\n| Search | Elasticsearch, OpenSearch | Full-text search |\n| Columnar / warehouse | Snowflake, BigQuery, ClickHouse | Analytics |\n| Vector | pgvector, Milvus, Pinecone | Similarity search |\n| Embedded | SQLite, DuckDB | In-app storage, local analytics |"}, {"id": 10, "title": "The role of a database engineer", "tldr": "Database engineers design schemas, choose and configure databases, optimize queries, ensure reliability, security and recoverability, plan capacity, run migrations and help application teams use data systems well.", "real": "Many companies have shifted from traditional DBA roles toward “database reliability engineering”, a term popularized by the 2017 O’Reilly book “Database Reliability Engineering” by Laine Campbell and Charity Majors, applying SRE practices to databases.", "body": "### Responsibilities\n\n| Area | Activities |\n|---|---|\n| Design | Data modeling, schema reviews |\n| Performance | Query tuning, indexing, configuration |\n| Reliability | Replication, failover, backups, recovery tests |\n| Operations | Upgrades, migrations, monitoring |\n| Security | Access control, encryption, auditing |\n| Scale | Capacity planning, partitioning, sharding |\n| Enablement | Guidelines, reviews, tooling for developers |\n\n### Skill map\n\n```mermaid\nflowchart TB\n  DBE[Database engineer] --> M[Data modeling]\n  DBE --> SQL[SQL and query optimization]\n  DBE --> INT[Storage and engine internals]\n  DBE --> OPS[Operations and reliability]\n  DBE --> DIST[Distributed systems]\n  DBE --> SEC[Security]\n```"}, {"id": 11, "title": "Entity-relationship modeling", "tldr": "ER modeling identifies entities (things), attributes (properties) and relationships (one-to-one, one-to-many, many-to-many) before writing tables. A clear model prevents structural mistakes that are expensive to fix later.", "real": "Peter Chen introduced the entity-relationship model in a 1976 paper, and ER diagrams remain the standard way teams sketch and review database designs before implementation.", "body": "### Example: e-commerce\n\n```mermaid\nerDiagram\n  CUSTOMER ||--o{ ORDER : places\n  ORDER ||--|{ ORDER_ITEM : contains\n  PRODUCT ||--o{ ORDER_ITEM : \"appears in\"\n  CUSTOMER {\n    bigint id PK\n    text email\n  }\n  ORDER {\n    bigint id PK\n    bigint customer_id FK\n    timestamptz created_at\n  }\n```\n\n### Relationship types\n\n| Type | Example | Implementation |\n|---|---|---|\n| One-to-one | User ↔ profile | FK with UNIQUE |\n| One-to-many | Customer → orders | FK on the “many” side |\n| Many-to-many | Products ↔ categories | Junction table |"}, {"id": 12, "title": "Keys: primary, foreign, natural and surrogate", "tldr": "Primary keys uniquely identify rows; foreign keys enforce references between tables. Surrogate keys (generated IDs) are stable and compact; natural keys (like email) carry meaning but can change. Choose key types for stability and index efficiency.", "real": "RFC 9562 (May 2024) standardized UUID version 7, which embeds a timestamp so new IDs are roughly time-ordered, improving B-tree index locality compared with random UUIDv4 keys.", "body": "### Key options\n\n| Key type | Pros | Cons |\n|---|---|---|\n| BIGINT identity / sequence | Compact, ordered, fast | Reveals volume; coordination in distributed systems |\n| UUIDv4 (random) | Globally unique, no coordination | 16 bytes; random inserts fragment B-trees |\n| UUIDv7 (time-ordered) | Unique and roughly ordered | 16 bytes |\n| Natural key (e.g. ISO country code) | Meaningful | May change; may be long |\n\n### Example\n\n```sql\nCREATE TABLE customers (\n  id          bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  email       text NOT NULL UNIQUE,\n  created_at  timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE orders (\n  id           bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  customer_id  bigint NOT NULL REFERENCES customers(id),\n  total_cents  bigint NOT NULL CHECK (total_cents >= 0)\n);\n```"}, {"id": 13, "title": "Normalization: 1NF, 2NF, 3NF", "tldr": "Normalization removes redundancy to prevent update, insert and delete anomalies. 1NF requires atomic values; 2NF removes partial dependencies on a composite key; 3NF removes transitive dependencies on non-key columns.", "real": "Codd defined the first three normal forms in papers from 1970 to 1971, and normalization remains the default design approach for transactional (OLTP) databases.", "body": "### Normal forms\n\n| Form | Rule | Violation example |\n|---|---|---|\n| 1NF | Atomic values, no repeating groups | `phones = '555-1, 555-2'` |\n| 2NF | No partial dependency on part of a composite key | (order_id, product_id) → product_name |\n| 3NF | No transitive dependency | customer_id → city → zip-based tax_region |\n\n### Anomalies prevented\n\n| Anomaly | Example |\n|---|---|\n| Update | Customer address stored in every order row; one row not updated |\n| Insert | Can’t add a product without an order |\n| Delete | Deleting the last order removes customer info |\n\n### Rule of thumb\n\nNormalize to 3NF for OLTP; denormalize deliberately for measured performance needs."}, {"id": 14, "title": "BCNF and higher normal forms", "tldr": "Boyce–Codd normal form (BCNF) requires every determinant to be a candidate key, closing gaps left by 3NF. Fourth and fifth normal forms deal with multi-valued and join dependencies. In practice, 3NF or BCNF is usually enough.", "real": "BCNF was defined by Raymond Boyce and Edgar Codd in 1974; textbooks such as Silberschatz, Korth and Sudarshan’s “Database System Concepts” teach it as the practical target for most relational designs.", "body": "### BCNF example\n\n| Table: course_teacher(student, course, teacher) |\n|---|\n| Rule: each teacher teaches only one course (teacher → course) |\n| Problem: teacher is a determinant but not a key |\n| Fix: split into teacher_course(teacher, course) and student_teacher(student, teacher) |\n\n### Higher normal forms\n\n| Form | Addresses |\n|---|---|\n| 4NF | Independent multi-valued facts in one table |\n| 5NF | Join dependencies |\n\n### Practice\n\nUse them as diagnostic tools when you notice redundant combinations of values, not as goals in themselves."}, {"id": 15, "title": "Denormalization trade-offs", "tldr": "Denormalization adds redundancy (duplicated columns, precomputed aggregates, summary tables) to speed reads. It costs write complexity and risk of inconsistency, so use it deliberately, measure benefits, and define how redundant data stays correct.", "real": "Analytical warehouses use denormalized star schemas by design, while OLTP systems often add limited denormalization such as cached counters, for example storing a post’s comment count instead of counting comments on every page view.", "body": "### Techniques\n\n| Technique | Example | Keeping it correct |\n|---|---|---|\n| Duplicated column | order.customer_name | Update on change, or accept snapshot semantics |\n| Counter cache | posts.comment_count | Update in same transaction or async job |\n| Summary table | daily_sales | Scheduled refresh |\n| Materialized view | Precomputed join | REFRESH MATERIALIZED VIEW |\n| JSON snapshot | Order line details at purchase time | Immutable by design |\n\n### Decision flow\n\n```mermaid\nflowchart TD\n  SLOW[Slow read query] --> IDX{Fixed by index or query rewrite?}\n  IDX -- yes --> DONE[Do that]\n  IDX -- no --> DEN[Denormalize]\n  DEN --> SYNC[Define sync mechanism + tests]\n```"}, {"id": 16, "title": "Choosing data types", "tldr": "Choose the narrowest correct type: integers for counts and money in minor units, NUMERIC for exact decimals, timestamps with time zones for events, TEXT with constraints for strings, and native types (UUID, JSON, arrays) where appropriate.", "real": "Floating-point types cannot represent many decimal fractions exactly (0.1 + 0.2 does not equal 0.3 in IEEE 754 binary floating point), which is why financial systems store money as integer minor units or exact NUMERIC values.", "body": "### Type guidance (PostgreSQL names)\n\n| Data | Recommended type | Avoid |\n|---|---|---|\n| Money | bigint (cents) or numeric(19,4) | float, real |\n| Event time | timestamptz | timestamp without time zone for global events |\n| Date only | date | text |\n| Identifiers | bigint, uuid | text for numeric IDs |\n| Booleans | boolean | `'Y'`/`'N'` strings |\n| Short codes | text + CHECK | char(n) padding surprises |\n| Semi-structured | jsonb | text containing JSON |\n| IP addresses | inet | text |\n\n### Size matters\n\nSmaller types mean more rows per page, smaller indexes and better cache efficiency."}, {"id": 17, "title": "Constraints and data integrity", "tldr": "Constraints enforce rules in the database itself: NOT NULL, UNIQUE, PRIMARY KEY, FOREIGN KEY, CHECK and exclusion constraints. They protect data from bugs in any application and are cheaper than cleaning bad data later.", "real": "PostgreSQL supports exclusion constraints (since version 9.0), which can prevent overlapping ranges such as double-booked meeting rooms, a rule that is hard to enforce correctly in application code under concurrency.", "body": "### Constraint examples\n\n```sql\nCREATE TABLE bookings (\n  id       bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n  room_id  bigint NOT NULL REFERENCES rooms(id),\n  during   tstzrange NOT NULL,\n  status   text NOT NULL CHECK (status IN ('held','confirmed','cancelled')),\n  EXCLUDE USING gist (room_id WITH =, during WITH &&)\n);\n```\n\n(The exclusion on `room_id WITH =` requires the `btree_gist` extension in PostgreSQL.)\n\n### Why database constraints\n\n| Reason | Explanation |\n|---|---|\n| Multiple writers | Every app, script and admin obeys them |\n| Concurrency | Enforced atomically, avoids race conditions |\n| Documentation | Rules visible in the schema |\n| Optimizer hints | Some constraints help query planning |"}, {"id": 18, "title": "Naming conventions and schema style", "tldr": "Consistent naming makes schemas readable and reduces mistakes: lowercase snake_case, clear singular or plural table names (choose one), `id` primary keys, `<table>_id` foreign keys, and descriptive constraint and index names.", "real": "PostgreSQL folds unquoted identifiers to lowercase, so tables created with quoted mixed-case names (for example “UserAccounts”) must always be quoted afterwards, a common source of confusion that lowercase snake_case avoids.", "body": "### Conventions (example)\n\n| Object | Convention | Example |\n|---|---|---|\n| Tables | plural snake_case | order_items |\n| Columns | snake_case | created_at |\n| Primary key | id | id |\n| Foreign key | singular_table_id | customer_id |\n| Timestamps | *_at | deleted_at |\n| Booleans | is_ / has_ | is_active |\n| Indexes | idx_table_columns | idx_orders_customer_id |\n| Constraints | table_column_check | orders_total_check |\n\n### Style rules\n\n- Avoid reserved words as names\n- Avoid abbreviations nobody understands\n- Document units in names when ambiguous (`duration_ms`)"}, {"id": 19, "title": "Common modeling patterns and pitfalls", "tldr": "Know standard patterns for many-to-many relationships, hierarchies (adjacency list, closure table, materialized path), polymorphic references and enums, and avoid traps such as entity-attribute-value (EAV) designs for core data.", "real": "Bill Karwin’s book “SQL Antipatterns” (2010) catalogs common schema mistakes, including EAV tables, polymorphic associations without foreign keys and comma-separated lists stored in columns.", "body": "### Hierarchy patterns\n\n| Pattern | Pros | Cons |\n|---|---|---|\n| Adjacency list (parent_id) | Simple writes | Recursive queries needed |\n| Materialized path (`'/1/4/9/'`) | Fast subtree reads | Path updates on moves |\n| Closure table | Fast ancestry queries | Extra table, more writes |\n| Nested sets | Fast reads | Expensive writes |\n\n### Anti-patterns\n\n| Anti-pattern | Better approach |\n|---|---|\n| EAV for core fields | Real columns; jsonb for truly dynamic attributes |\n| Comma-separated IDs in a column | Junction table |\n| Polymorphic FK without constraint | Separate FK columns or tables per type |\n| Storing derived data without sync plan | Compute or define refresh |"}, {"id": 20, "title": "Modeling time and history", "tldr": "Many systems need history: when values changed, what was true at a point in time, and audit trails. Patterns include audit tables, slowly changing dimensions, valid-time ranges, and system-versioned temporal tables.", "real": "SQL:2011 added temporal table features, and SQL Server (2016), MariaDB and other systems implement system-versioned tables that automatically keep history of every row change.", "body": "### Patterns\n\n| Pattern | How | Use |\n|---|---|---|\n| Audit log table | Trigger or app writes changes | Compliance |\n| Valid-time range | valid_from, valid_to columns | Prices, contracts |\n| SCD Type 2 | New row per change with current flag | Warehouses |\n| System-versioned table | DB keeps history automatically | Point-in-time queries |\n| Event log | Store events, derive state | Event sourcing |\n\n### Valid-time example\n\n```sql\nCREATE TABLE product_prices (\n  product_id   bigint NOT NULL,\n  price_cents  bigint NOT NULL,\n  valid        tstzrange NOT NULL,\n  EXCLUDE USING gist (product_id WITH =, valid WITH &&)\n);\n\nSELECT price_cents FROM product_prices\nWHERE product_id = 42 AND valid @> timestamptz '2026-03-01 10:00+00';\n```"}, {"id": 21, "title": "SELECT fundamentals", "tldr": "Master filtering, projection, sorting and limiting, and select only the columns you need. Understand the logical order of evaluation and avoid SELECT * in application queries, which wastes I/O and breaks when schemas change.", "real": "Selecting only needed columns can enable index-only scans in PostgreSQL and covering-index reads in MySQL, where the query is answered from the index without reading table rows at all.", "body": "### Core clauses\n\n```sql\nSELECT id, email, created_at\nFROM customers\nWHERE created_at >= now() - interval '30 days'\n  AND email LIKE '%@example.com'\nORDER BY created_at DESC\nLIMIT 50;\n```\n\n### Good habits\n\n| Habit | Why |\n|---|---|\n| Explicit column list | Less I/O, stable contracts |\n| Filter early on indexed columns | Smaller intermediate results |\n| Deterministic ORDER BY | Stable pagination |\n| Parameterized values | Security, plan reuse |\n\n### Sargable predicates\n\n| Not index-friendly | Index-friendly |\n|---|---|\n| `WHERE date(created_at) = '2026-03-01'` | `WHERE created_at >= '2026-03-01' AND created_at < '2026-03-02'` |\n| `WHERE lower(email) = 'a@b.com'` (without expression index) | Expression index on lower(email), or citext |"}, {"id": 22, "title": "Joins", "tldr": "Joins combine rows from tables: INNER returns matches, LEFT keeps all left rows, RIGHT keeps all right rows, FULL keeps both, CROSS produces every combination. Semi-joins (EXISTS) and anti-joins (NOT EXISTS) test for presence or absence.", "real": "A common bug is placing a filter on the right table of a LEFT JOIN in the WHERE clause, which silently turns it into an inner join; moving the condition into the ON clause preserves unmatched rows.", "body": "### Join types\n\n| Join | Result |\n|---|---|\n| INNER | Rows with matches in both |\n| LEFT | All left rows + matches (NULLs otherwise) |\n| FULL | All rows from both sides |\n| CROSS | Cartesian product |\n| Semi-join (EXISTS) | Left rows that have a match |\n| Anti-join (NOT EXISTS) | Left rows without a match |\n\n### LEFT JOIN pitfall\n\n```sql\n-- Wrong: drops customers without 2026 orders\nSELECT c.id, o.id\nFROM customers c LEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.created_at >= '2026-01-01';\n\n-- Right: keeps all customers\nSELECT c.id, o.id\nFROM customers c LEFT JOIN orders o\n  ON o.customer_id = c.id AND o.created_at >= '2026-01-01';\n```\n\n### Anti-join\n\n```sql\nSELECT c.id FROM customers c\nWHERE NOT EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id);\n```"}, {"id": 23, "title": "Aggregation and grouping", "tldr": "GROUP BY collapses rows into groups and aggregate functions compute values per group; HAVING filters groups. Every selected column must be grouped or aggregated. Use FILTER or CASE for conditional aggregates.", "real": "Older MySQL versions allowed selecting non-grouped columns and returned arbitrary values; since MySQL 5.7.5 the ONLY_FULL_GROUP_BY mode is enabled by default, rejecting such ambiguous queries.", "body": "### Example\n\n```sql\nSELECT customer_id,\n       count(*)                                   AS orders,\n       sum(total_cents)                           AS revenue_cents,\n       count(*) FILTER (WHERE status = 'refunded') AS refunds\nFROM orders\nWHERE created_at >= '2026-01-01'\nGROUP BY customer_id\nHAVING sum(total_cents) > 100000\nORDER BY revenue_cents DESC;\n```\n\n### Aggregates and NULL\n\n| Function | NULL behavior |\n|---|---|\n| count(*) | Counts rows |\n| count(col) | Ignores NULLs |\n| sum / avg / min / max | Ignore NULLs; sum of no rows is NULL |\n\nUse `coalesce(sum(x), 0)` when zero is the expected result."}, {"id": 24, "title": "Subqueries and common table expressions", "tldr": "Subqueries nest queries; CTEs (WITH clauses) name intermediate results for readability. Correlated subqueries run per outer row conceptually. Modern optimizers often inline CTEs, but behavior differs by database and version.", "real": "Before PostgreSQL 12, CTEs were always materialized and acted as optimization fences; PostgreSQL 12 (2019) began inlining non-recursive, side-effect-free CTEs referenced once, with MATERIALIZED and NOT MATERIALIZED options to control behavior.", "body": "### CTE example\n\n```sql\nWITH recent_orders AS (\n  SELECT customer_id, sum(total_cents) AS spend\n  FROM orders\n  WHERE created_at >= now() - interval '90 days'\n  GROUP BY customer_id\n)\nSELECT c.email, r.spend\nFROM recent_orders r\nJOIN customers c ON c.id = r.customer_id\nWHERE r.spend > 50000;\n```\n\n### When to use what\n\n| Tool | Use |\n|---|---|\n| CTE | Readability, multi-step logic |\n| Subquery in WHERE (EXISTS/IN) | Filtering by related data |\n| Derived table | Inline intermediate result |\n| LATERAL join | Per-row subqueries (e.g. top N per group) |"}, {"id": 25, "title": "Window functions", "tldr": "Window functions compute values across related rows without collapsing them: rankings, running totals, moving averages, and comparisons with previous or next rows. They are essential for analytics and many reporting queries.", "real": "Window functions were standardized in SQL:2003, and became available in PostgreSQL 8.4 (2009) and MySQL 8.0 (2018), making them usable across all major relational databases.", "body": "### Common window functions\n\n| Function | Use |\n|---|---|\n| row_number() | Unique rank per partition |\n| rank(), dense_rank() | Ranking with ties |\n| lag(), lead() | Previous / next row values |\n| sum() OVER | Running totals |\n| avg() OVER (ROWS ...) | Moving averages |\n| first_value(), last_value() | Boundary values |\n\n### Top 3 orders per customer\n\n```sql\nSELECT *\nFROM (\n  SELECT o.*,\n         row_number() OVER (PARTITION BY customer_id ORDER BY total_cents DESC) AS rn\n  FROM orders o\n) t\nWHERE rn <= 3;\n```\n\n### Running total\n\n```sql\nSELECT created_at::date AS day,\n       sum(total_cents) AS daily,\n       sum(sum(total_cents)) OVER (ORDER BY created_at::date) AS running_total\nFROM orders\nGROUP BY created_at::date;\n```"}, {"id": 26, "title": "Set operations", "tldr": "UNION combines results and removes duplicates; UNION ALL keeps duplicates and is cheaper; INTERSECT returns common rows; EXCEPT returns rows in the first set but not the second. Column counts and types must match.", "real": "Using UNION when UNION ALL is sufficient forces the database to sort or hash the combined result to remove duplicates, a frequent and easily avoided performance cost in reporting queries.", "body": "### Operations\n\n| Operation | Result | Cost |\n|---|---|---|\n| UNION ALL | All rows | Lowest |\n| UNION | Distinct rows | Dedup step |\n| INTERSECT | Rows in both | Dedup + compare |\n| EXCEPT | Rows only in first | Dedup + compare |\n\n### Example\n\n```sql\nSELECT email FROM customers\nUNION ALL\nSELECT email FROM newsletter_subscribers;\n```\n\n### Tip\n\nUse UNION ALL by default; use UNION only when duplicates are possible and must be removed."}, {"id": 27, "title": "NULL and three-valued logic", "tldr": "NULL means unknown or missing, and comparisons with NULL yield UNKNOWN, not true or false. WHERE keeps only true rows. Use IS NULL, IS DISTINCT FROM and COALESCE, and beware NOT IN with NULLs.", "real": "`NOT IN (subquery)` returns no rows at all if the subquery returns any NULL, a classic bug; `NOT EXISTS` behaves as most people expect and is generally recommended instead.", "body": "### Truth table (AND)\n\n| AND | TRUE | FALSE | UNKNOWN |\n|---|---|---|---|\n| TRUE | TRUE | FALSE | UNKNOWN |\n| FALSE | FALSE | FALSE | FALSE |\n| UNKNOWN | UNKNOWN | FALSE | UNKNOWN |\n\n### Common traps\n\n| Expression | Result |\n|---|---|\n| `NULL = NULL` | UNKNOWN (use IS NULL) |\n| `x <> 'a'` where x is NULL | Row excluded |\n| `NOT IN (1, NULL)` | Never true |\n| `count(col)` | Skips NULLs |\n\n### Safe comparisons\n\n```sql\nWHERE a IS NOT DISTINCT FROM b      -- treats NULLs as equal\nWHERE coalesce(discount, 0) = 0\n```"}, {"id": 28, "title": "Recursive queries", "tldr": "Recursive CTEs walk hierarchies and graphs: org charts, category trees, bill of materials, and dependency chains. A recursive CTE has an anchor query and a recursive part, and must terminate.", "real": "Recursive queries were added to the SQL standard in SQL:1999 and are supported by PostgreSQL, SQL Server, Oracle (which also has its older CONNECT BY syntax), SQLite and MySQL 8.0.", "body": "### Category tree example\n\n```sql\nWITH RECURSIVE subtree AS (\n  SELECT id, parent_id, name, 1 AS depth\n  FROM categories\n  WHERE id = 10                      -- anchor\n  UNION ALL\n  SELECT c.id, c.parent_id, c.name, s.depth + 1\n  FROM categories c\n  JOIN subtree s ON c.parent_id = s.id   -- recursive step\n)\nSELECT * FROM subtree ORDER BY depth;\n```\n\n### Safety\n\n| Risk | Mitigation |\n|---|---|\n| Cycles in data | Track visited path; PostgreSQL 14+ CYCLE clause |\n| Deep recursion | Depth limit in WHERE |\n| Performance | Index on parent_id |"}, {"id": 29, "title": "Inserts, updates, upserts and MERGE", "tldr": "Write data efficiently and safely: batch inserts, update with precise conditions, use upserts (INSERT ... ON CONFLICT in PostgreSQL, ON DUPLICATE KEY UPDATE in MySQL) or MERGE, and RETURNING to avoid extra round trips.", "real": "PostgreSQL added INSERT ... ON CONFLICT in version 9.5 (2016) and the SQL-standard MERGE statement in version 15 (2022), giving developers atomic upsert operations without race-prone read-then-write logic.", "body": "### Upsert (PostgreSQL)\n\n```sql\nINSERT INTO inventory (sku, qty)\nVALUES ('A-100', 5)\nON CONFLICT (sku)\nDO UPDATE SET qty = inventory.qty + EXCLUDED.qty\nRETURNING sku, qty;\n```\n\n### Upsert (MySQL)\n\n```sql\nINSERT INTO inventory (sku, qty) VALUES ('A-100', 5)\nON DUPLICATE KEY UPDATE qty = qty + VALUES(qty);\n```\n\n(MySQL 8.0.20+ prefers row aliases over VALUES() in this clause.)\n\n### Batch writes\n\n| Approach | Throughput |\n|---|---|\n| One INSERT per row, one transaction each | Lowest |\n| Multi-row INSERT in one transaction | Much higher |\n| COPY / LOAD DATA | Highest for bulk loads |"}, {"id": 30, "title": "SQL anti-patterns", "tldr": "Avoid patterns that hurt correctness or performance: SELECT *, functions on indexed columns in WHERE, implicit type conversions, OR conditions defeating indexes, N+1 query loops, OFFSET pagination on large tables, and string-built SQL.", "real": "The xkcd comic “Exploits of a Mom” (#327, 2007), in which a school’s student records are deleted because a child’s name contains a SQL command (“Little Bobby Tables”), became a famous illustration of SQL injection caused by building queries from strings.", "body": "### Anti-patterns and fixes\n\n| Anti-pattern | Fix |\n|---|---|\n| SELECT * in app code | Explicit columns |\n| `WHERE func(indexed_col) = x` | Rewrite range, or expression index |\n| Comparing different types | Match parameter types to column types |\n| String-concatenated SQL | Parameterized queries |\n| Query per row in a loop (N+1) | Join or batch with `= ANY($1)` |\n| Deep OFFSET pagination | Keyset pagination |\n| `DISTINCT` to hide join duplicates | Fix the join |\n| Huge IN lists built in code | Temporary table or array parameter |\n\n### Review checklist\n\n- [ ] Uses indexes appropriately (check EXPLAIN)\n- [ ] Parameterized\n- [ ] Bounded result size\n- [ ] Correct NULL handling"}, {"id": 31, "title": "Pages and the slotted-page layout", "tldr": "Databases store data in fixed-size pages (often 8 KB or 16 KB). A slotted page holds a header, an array of pointers (slots) to rows, and the rows themselves, allowing variable-length rows and rows to move within the page without changing their identifiers.", "real": "PostgreSQL uses 8 KB pages by default, and MySQL’s InnoDB storage engine uses 16 KB pages by default; page size affects how many rows fit per I/O and how much memory caching requires.", "body": "### Slotted page\n\n```mermaid\nflowchart LR\n  H[Page header] --> S[Slot array: pointers grow forward]\n  S --> FREE[Free space]\n  FREE --> T[Tuples: grow backward from end of page]\n```\n\n### Why pages\n\n| Reason | Effect |\n|---|---|\n| Disk and OS work in blocks | Efficient I/O |\n| Unit of caching | Buffer pool manages pages |\n| Unit of locking/latching | Concurrency control |\n| Unit of logging | Recovery |\n\n### Row size implications\n\nWide rows mean fewer rows per page and more I/O; very large values are stored separately (PostgreSQL’s TOAST, InnoDB off-page storage)."}, {"id": 32, "title": "Heap files and clustered storage", "tldr": "In heap organization, rows are stored in no particular order and indexes point to row locations. In clustered organization, rows are stored in primary key order inside the primary index. The choice affects inserts, lookups and secondary index design.", "real": "PostgreSQL stores tables as heaps with separate indexes pointing to tuple locations, while MySQL’s InnoDB stores rows inside a clustered B-tree ordered by primary key, so InnoDB secondary indexes store the primary key value to find rows.", "body": "### Comparison\n\n| | Heap (PostgreSQL) | Clustered (InnoDB) |\n|---|---|---|\n| Row order | Insertion / free space | Primary key order |\n| PK lookup | Index → heap | Directly in PK B-tree |\n| Secondary index stores | Tuple location (ctid) | Primary key value |\n| Random PK inserts | Fine for heap | Page splits, fragmentation |\n| Range scans by PK | Random heap I/O | Sequential |\n\n### Design implication for InnoDB\n\nUse compact, increasing primary keys; large or random primary keys bloat every secondary index and fragment the clustered index."}, {"id": 33, "title": "B-trees", "tldr": "B-trees (usually B+trees) keep keys sorted in a balanced tree with high fan-out, so lookups, inserts and range scans need only a few page reads even for billions of rows. They are the default index structure in relational databases.", "real": "Rudolf Bayer and Edward McCreight introduced B-trees in 1970 (published in 1972), and Douglas Comer’s 1979 survey called the B-tree “ubiquitous”; it remains the core index structure in PostgreSQL, MySQL, Oracle, SQL Server and SQLite.", "body": "### Structure\n\n```mermaid\nflowchart TB\n  ROOT[Root: key ranges] --> I1[Internal node]\n  ROOT --> I2[Internal node]\n  I1 --> L1[Leaf: keys + row pointers]\n  I1 --> L2[Leaf]\n  I2 --> L3[Leaf]\n  I2 --> L4[Leaf]\n  L1 --- L2\n  L2 --- L3\n  L3 --- L4\n```\n\nLeaves are linked, so range scans walk sideways.\n\n### Height vs rows (fan-out 500)\n\n```chart\n{\"title\": \"Rows addressable by B-tree height (fan-out 500)\", \"unit\": \"rows\", \"log\": true, \"data\": [[\"2 levels\", 250000], [\"3 levels\", 125000000], [\"4 levels\", 62500000000]]}\n```\n\nThree or four page reads find one row among billions, and upper levels usually stay cached in memory."}, {"id": 34, "title": "LSM trees", "tldr": "Log-structured merge trees buffer writes in memory (memtable), flush them as sorted immutable files (SSTables), and merge files in the background (compaction). They offer very high write throughput at the cost of read and space amplification, mitigated by Bloom filters.", "real": "Patrick O’Neil and colleagues described the LSM tree in 1996; Google’s Bigtable (2006) and LevelDB (2011) popularized it, and Facebook’s RocksDB (2012), Cassandra and ScyllaDB are widely used LSM-based engines.", "body": "### Write and read path\n\n```mermaid\nflowchart LR\n  W[Write] --> WAL[Commit log]\n  W --> MEM[Memtable in memory]\n  MEM -->|flush| L0[SSTables level 0]\n  L0 -->|compaction| L1[Level 1]\n  L1 -->|compaction| L2[Level 2]\n  R[Read] --> MEM\n  R --> BF[Bloom filters]\n  BF --> L0\n  BF --> L1\n```\n\n### B-tree vs LSM\n\n| | B-tree | LSM tree |\n|---|---|---|\n| Writes | In-place updates, random I/O | Sequential, batched |\n| Reads | Predictable | May check several files |\n| Space | Some fragmentation | Temporary duplicates until compaction |\n| Best for | Read-heavy, mixed OLTP | Write-heavy workloads |"}, {"id": 35, "title": "The buffer pool", "tldr": "The buffer pool caches disk pages in memory. Reads check the pool first; modified (dirty) pages are written back later. Replacement policies decide which pages to evict. Buffer pool size and hit ratio strongly affect performance.", "real": "InnoDB uses a midpoint insertion LRU variant so that large table scans do not flush frequently used pages out of the buffer pool, and PostgreSQL uses a clock-sweep algorithm while also relying on the operating system’s page cache.", "body": "### Read path\n\n```mermaid\nflowchart LR\n  REQ[Need page] --> CHECK{In buffer pool?}\n  CHECK -- yes --> HIT[Return page]\n  CHECK -- no --> EVICT[Evict a page, write if dirty]\n  EVICT --> READ[Read from disk]\n  READ --> HIT\n```\n\n### Sizing guidance (typical starting points)\n\n| Database | Setting | Common starting point |\n|---|---|---|\n| PostgreSQL | shared_buffers | \\~25% of RAM (OS cache does the rest) |\n| MySQL InnoDB | innodb_buffer_pool_size | \\~50–75% of RAM on a dedicated server |\n\nTune using hit ratios and workload measurements, not only rules of thumb."}, {"id": 36, "title": "Write-ahead logging", "tldr": "With write-ahead logging, changes are recorded in a sequential log and flushed to durable storage before the corresponding data pages are written. After a crash, the log is replayed to restore committed changes and undo incomplete ones.", "real": "The ARIES recovery algorithm, published by C. Mohan and colleagues at IBM in 1992, formalized write-ahead logging with redo and undo phases, and its ideas underpin recovery in most major relational databases.", "body": "### WAL rule\n\n```\nA data page may not be written to disk until the log records describing its changes are durable.\nA transaction is committed when its commit record is durable in the log.\n```\n\n### Flow\n\n```mermaid\nflowchart LR\n  TX[Transaction changes page in memory] --> LOG[Append log record]\n  LOG --> FLUSH[Flush log at commit]\n  FLUSH --> ACK[Acknowledge commit]\n  TX -.later.-> PAGE[Write dirty page to disk]\n```\n\n### Benefits\n\n| Benefit | Why |\n|---|---|\n| Fast commits | Sequential log writes only |\n| Crash recovery | Replay log |\n| Replication | Ship log to replicas |\n| Point-in-time recovery | Archive log |"}, {"id": 37, "title": "Checkpoints and crash recovery", "tldr": "Checkpoints periodically flush dirty pages and record a position in the log, limiting how much log must be replayed after a crash. Frequent checkpoints shorten recovery but increase I/O; infrequent ones do the opposite.", "real": "PostgreSQL controls checkpoints with settings such as checkpoint_timeout and max_wal_size and spreads checkpoint writes over time (checkpoint_completion_target) to avoid I/O spikes that slow user queries.", "body": "### Recovery (ARIES-style)\n\n```mermaid\nflowchart LR\n  CRASH[Crash] --> ANALYSIS[Analysis: find active transactions and dirty pages]\n  ANALYSIS --> REDO[Redo: repeat history from checkpoint]\n  REDO --> UNDO[Undo: roll back uncommitted transactions]\n  UNDO --> OPEN[Database open]\n```\n\n### Trade-offs\n\n| Checkpoint frequency | Recovery time | Runtime I/O |\n|---|---|---|\n| High | Short | More writes |\n| Low | Long | Fewer writes, larger spikes if not spread |\n\n### Torn pages\n\nA crash in the middle of writing a page can leave it half-written; PostgreSQL writes full page images after checkpoints (full_page_writes) and InnoDB uses a doublewrite buffer to repair such pages."}, {"id": 38, "title": "MVCC storage implementations", "tldr": "Multi-version concurrency control keeps multiple versions of rows so readers don’t block writers. Implementations differ: PostgreSQL stores new row versions in the table and cleans old ones with VACUUM; InnoDB and Oracle keep older versions in undo logs.", "real": "Uber’s 2016 blog post “Why Uber Engineering Switched from Postgres to MySQL” cited write amplification from PostgreSQL’s MVCC design, where updates create new tuple versions and require index updates, as one reason for its migration.", "body": "### Comparison\n\n| | PostgreSQL | InnoDB / Oracle |\n|---|---|---|\n| Update creates | New tuple in table | In-place update + undo record |\n| Old versions stored | In table (dead tuples) | Undo log / undo segments |\n| Cleanup | VACUUM / autovacuum | Purge of undo |\n| Index impact | New index entries unless HOT update | Indexes point to PK / row |\n| Long transactions cause | Table bloat | Undo growth |\n\n### PostgreSQL HOT updates\n\nHeap-only tuple (HOT) updates avoid index changes when no indexed column changes and the new version fits on the same page; leaving free space (fillfactor) helps."}, {"id": 39, "title": "Compression", "tldr": "Compression reduces storage and I/O at the cost of CPU. Row stores compress pages or large values; column stores compress very effectively because similar values sit together, using encodings such as dictionary, run-length and delta encoding.", "real": "Columnar formats and warehouses such as Apache Parquet, ClickHouse and Snowflake rely heavily on column-level encodings, which is a major reason analytical data often compresses several times smaller than the equivalent row-oriented storage.", "body": "### Encodings\n\n| Encoding | Works well for |\n|---|---|\n| Dictionary | Low-cardinality strings (country) |\n| Run-length | Sorted, repeated values |\n| Delta | Timestamps, increasing IDs |\n| Bit-packing | Small integers |\n| General compression (LZ4, Zstandard) | Anything, after encodings |\n\n### Trade-offs\n\n| Benefit | Cost |\n|---|---|\n| Less storage | CPU to compress/decompress |\n| Less I/O | Slower random updates (column stores) |\n| More data in cache | Tuning needed |"}, {"id": 40, "title": "Row stores vs column stores", "tldr": "Row stores keep all columns of a row together, ideal for transactional access to whole rows. Column stores keep each column together, ideal for analytics reading few columns over many rows. Some systems offer both.", "real": "The C-Store research project (Stonebraker and colleagues, 2005) demonstrated large gains for column-oriented storage in analytics and led to the commercial Vertica database; columnar storage is now standard in data warehouses.", "body": "### Layout\n\n| Row store | Column store |\n|---|---|\n| [id, name, country, amount] per row | id column, name column, country column, amount column |\n\n### Query fit\n\n| Query | Better layout |\n|---|---|\n| `SELECT * FROM orders WHERE id = 42` | Row |\n| `SELECT country, sum(amount) FROM orders GROUP BY country` over 1B rows | Column |\n| Frequent single-row updates | Row |\n| Scans of few columns | Column |\n\n### Hybrid approaches\n\nPostgreSQL extensions and systems such as SQL Server columnstore indexes, Oracle’s In-Memory column store and MySQL HeatWave add columnar capabilities to row-oriented databases."}, {"id": 41, "title": "Index fundamentals", "tldr": "An index is an auxiliary structure that speeds lookups by key at the cost of extra storage and slower writes. Indexes help when queries are selective; for queries returning a large fraction of a table, a sequential scan is often faster.", "real": "PostgreSQL’s optimizer frequently chooses a sequential scan over an available index when a query matches a large share of rows, because reading pages sequentially is cheaper than many random index-driven reads.", "body": "### Benefit vs cost\n\n| Benefit | Cost |\n|---|---|\n| Fast lookups and ranges | Extra disk and memory |\n| Faster joins and sorts | Every insert/update/delete maintains indexes |\n| Enforce uniqueness | Write amplification, more WAL |\n\n### Selectivity rule of thumb\n\n```mermaid\nflowchart LR\n  Q[Query] --> SEL{Fraction of rows returned}\n  SEL -->|small, e.g. < ~5%| IDX[Index scan likely]\n  SEL -->|large| SEQ[Sequential scan likely]\n```\n\nThe real threshold depends on data layout, caching and cost settings."}, {"id": 42, "title": "B-tree indexes in practice", "tldr": "B-tree indexes support equality, range, prefix LIKE, ORDER BY and MIN/MAX efficiently. They do not help leading-wildcard searches or functions applied to the column unless you create matching expression indexes.", "real": "In PostgreSQL, a `LIKE 'abc%'` prefix search can use a B-tree index only with the C collation or a text_pattern_ops operator class; with other collations a regular B-tree index won’t be used for the prefix match.", "body": "### What B-trees support\n\n| Query pattern | Uses B-tree? |\n|---|---|\n| `WHERE id = 5` | Yes |\n| `WHERE created_at BETWEEN a AND b` | Yes |\n| `ORDER BY created_at LIMIT 10` | Yes (avoids sort) |\n| `WHERE name LIKE 'abc%'` | Yes, with suitable operator class/collation |\n| `WHERE name LIKE '%abc'` | No (use trigram index) |\n| `WHERE lower(email) = 'x'` | Only with expression index |\n\n### Creating indexes safely (PostgreSQL)\n\n```sql\nCREATE INDEX CONCURRENTLY idx_orders_created_at ON orders (created_at);\n```\n\nCONCURRENTLY avoids blocking writes during creation, but takes longer and cannot run inside a transaction block."}, {"id": 43, "title": "Composite indexes and column order", "tldr": "Composite (multi-column) indexes are sorted by the first column, then the second, and so on. They serve queries that filter on a leading prefix of the columns. Put equality columns first, then range or sort columns.", "real": "Markus Winand’s widely used guide “Use The Index, Luke!” explains the leftmost-prefix behavior of composite indexes and recommends ordering columns by how queries filter, a principle that applies across major databases.", "body": "### Index on (customer_id, created_at)\n\n| Query | Uses index well? |\n|---|---|\n| `WHERE customer_id = 7` | Yes |\n| `WHERE customer_id = 7 AND created_at > '2026-01-01'` | Yes |\n| `WHERE customer_id = 7 ORDER BY created_at DESC LIMIT 20` | Yes, no sort needed |\n| `WHERE created_at > '2026-01-01'` | Poorly (not a leading prefix) |\n\n### Column order rule\n\n```\n1. Columns compared with equality\n2. Then a range or ORDER BY column\n3. Then extra columns for covering (optional)\n```\n\n### Example\n\n```sql\nCREATE INDEX idx_orders_customer_created\n  ON orders (customer_id, created_at DESC);\n```"}, {"id": 44, "title": "Covering indexes and index-only scans", "tldr": "A covering index contains all columns a query needs, so the database can answer from the index alone. Use INCLUDE columns (PostgreSQL, SQL Server) or extra key columns (MySQL) for hot queries, balancing index size.", "real": "PostgreSQL 11 (2018) added the INCLUDE clause for B-tree indexes, allowing non-key payload columns in an index to enable index-only scans without affecting the index’s sort order or uniqueness.", "body": "### Example\n\n```sql\nCREATE INDEX idx_orders_customer_inc\n  ON orders (customer_id, created_at DESC)\n  INCLUDE (total_cents, status);\n\n-- Can be answered by an index-only scan:\nSELECT created_at, total_cents, status\nFROM orders\nWHERE customer_id = 7\nORDER BY created_at DESC\nLIMIT 20;\n```\n\n### PostgreSQL caveat\n\nIndex-only scans still check the visibility map; tables need regular vacuuming so pages are marked all-visible, otherwise heap lookups still happen.\n\n### Trade-off\n\nBigger indexes cost memory and write time; cover only frequent, important queries."}, {"id": 45, "title": "Hash indexes", "tldr": "Hash indexes support only equality lookups and can be compact and fast for that purpose. They cannot serve range queries or ordering. In most relational databases, B-trees are the safer default.", "real": "Before PostgreSQL 10 (2017), hash indexes were not WAL-logged and were not crash-safe or replicated; since version 10 they are WAL-logged and usable, though B-trees remain the common choice.", "body": "### Comparison\n\n| | B-tree | Hash |\n|---|---|---|\n| Equality | ✓ | ✓ |\n| Range | ✓ | ✗ |\n| ORDER BY | ✓ | ✗ |\n| Uniqueness constraint | ✓ | Limited (not in PostgreSQL) |\n| Size for long keys | Larger | Can be smaller |\n\n### Where hashing shines\n\nIn-memory key-value stores (Redis), hash joins during query execution, and hash partitioning for sharding."}, {"id": 46, "title": "Partial and expression indexes", "tldr": "Partial indexes index only rows matching a condition, saving space and speeding writes for skewed data. Expression indexes index computed values, such as lower(email), so queries using that expression can use the index.", "real": "A common PostgreSQL pattern is a partial unique index on active records, such as unique emails only where deleted_at IS NULL, which supports soft deletes while preventing duplicate active accounts.", "body": "### Partial index\n\n```sql\n-- Only pending jobs are queried frequently\nCREATE INDEX idx_jobs_pending ON jobs (run_at) WHERE status = 'pending';\n\n-- Unique email among active users only\nCREATE UNIQUE INDEX uq_users_email_active\n  ON users (email) WHERE deleted_at IS NULL;\n```\n\n### Expression index\n\n```sql\nCREATE INDEX idx_users_lower_email ON users (lower(email));\nSELECT id FROM users WHERE lower(email) = lower($1);\n```\n\n### Requirement\n\nThe query predicate must match (or imply) the index condition or expression for the planner to use it."}, {"id": 47, "title": "Specialized indexes: GIN, GiST, BRIN and more", "tldr": "Beyond B-trees, PostgreSQL offers GIN for arrays, JSONB and full-text search; GiST and SP-GiST for geometric data, ranges and nearest-neighbor searches; and BRIN for very large tables naturally ordered by a column, such as time.", "real": "BRIN indexes, added in PostgreSQL 9.5 (2016), store summaries per block range and can be thousands of times smaller than B-tree indexes on large append-only time-series tables.", "body": "### Index types (PostgreSQL)\n\n| Type | Use case |\n|---|---|\n| B-tree | Default: equality, ranges, sorting |\n| Hash | Equality only |\n| GIN | JSONB containment, arrays, full-text, trigram search |\n| GiST | Geometry (PostGIS), ranges, exclusion constraints |\n| SP-GiST | Partitioned search spaces (e.g. IP prefixes) |\n| BRIN | Huge tables correlated with physical order |\n\n### Examples\n\n```sql\nCREATE INDEX idx_events_payload ON events USING gin (payload jsonb_path_ops);\nCREATE INDEX idx_logs_time_brin ON logs USING brin (logged_at);\nCREATE INDEX idx_products_name_trgm ON products USING gin (name gin_trgm_ops);  -- needs pg_trgm\n```"}, {"id": 48, "title": "Full-text search in the database", "tldr": "Relational databases include full-text search: tokenizing text, removing stop words, stemming, indexing with inverted indexes, and ranking results. It is often enough for moderate needs before adding a dedicated search engine.", "real": "PostgreSQL provides built-in full-text search with tsvector and tsquery types and GIN indexes, and MySQL InnoDB supports FULLTEXT indexes; many applications use these before adopting Elasticsearch or OpenSearch.", "body": "### PostgreSQL example\n\n```sql\nALTER TABLE articles ADD COLUMN search tsvector\n  GENERATED ALWAYS AS (to_tsvector('english', coalesce(title,'') || ' ' || coalesce(body,''))) STORED;\n\nCREATE INDEX idx_articles_search ON articles USING gin (search);\n\nSELECT id, title, ts_rank(search, q) AS rank\nFROM articles, websearch_to_tsquery('english', 'database indexing') q\nWHERE search @@ q\nORDER BY rank DESC\nLIMIT 10;\n```\n\n### When to move to a search engine\n\n| Need | Dedicated engine helps |\n|---|---|\n| Typo tolerance, fuzzy matching at scale | Yes |\n| Complex relevance tuning, facets | Yes |\n| Very large text corpora | Yes |\n| Simple keyword search on app data | Database is usually enough |"}, {"id": 49, "title": "The cost of indexes", "tldr": "Every index slows writes, consumes storage and memory, adds WAL volume and maintenance work, and can confuse the optimizer. Remove unused and duplicate indexes, and justify each index with real queries.", "real": "PostgreSQL’s pg_stat_user_indexes view tracks how many times each index has been scanned, and DBAs commonly use it to find indexes with zero scans that can be dropped after confirming they are not needed for constraints.", "body": "### Finding unused indexes (PostgreSQL)\n\n```sql\nSELECT schemaname, relname AS table, indexrelname AS index,\n       idx_scan, pg_size_pretty(pg_relation_size(indexrelid)) AS size\nFROM pg_stat_user_indexes\nWHERE idx_scan = 0\nORDER BY pg_relation_size(indexrelid) DESC;\n```\n\nCheck replicas too: an index unused on the primary may serve read queries on replicas.\n\n### Write cost (illustrative)\n\n```chart\n{\"title\": \"Relative insert cost by number of indexes (illustrative)\", \"unit\": \"×\", \"data\": [[\"Table only\", 1], [\"+1 index\", 1.6], [\"+3 indexes\", 2.8], [\"+6 indexes\", 4.5]]}\n```"}, {"id": 50, "title": "An index strategy", "tldr": "Design indexes from the workload: identify frequent and slow queries, index for their filters, joins and sorts, prefer composite indexes that serve several queries, verify with EXPLAIN, and review indexes regularly as queries change.", "real": "Tools such as pg_stat_statements in PostgreSQL and the Performance Schema in MySQL record normalized query statistics, letting teams base indexing decisions on actual query frequency and total time rather than guesses.", "body": "### Process\n\n```mermaid\nflowchart LR\n  W[Collect workload: top queries by total time] --> A[Analyze filters, joins, sorts]\n  A --> D[Design candidate indexes]\n  D --> T[Test with EXPLAIN ANALYZE]\n  T --> DEPLOY[Create concurrently]\n  DEPLOY --> MON[Monitor usage + write impact]\n  MON --> W\n```\n\n### Checklist\n\n- [ ] Foreign key columns used in joins are indexed\n- [ ] Composite indexes ordered: equality, then range/sort\n- [ ] No duplicate or redundant prefixes\n- [ ] Partial indexes for skewed filters\n- [ ] Unused indexes reviewed quarterly"}, {"id": 51, "title": "The life of a query", "tldr": "A query is parsed, analyzed against the catalog, rewritten (views, rules), optimized into a physical plan, and executed by operators that pull or push rows. Understanding each step helps diagnose slow queries and errors.", "real": "The Volcano iterator model, described by Goetz Graefe in the early 1990s, in which each operator produces rows one at a time on request, influenced the executor design of many databases, including PostgreSQL.", "body": "### Steps\n\n```mermaid\nflowchart LR\n  SQL[SQL] --> P[Parse]\n  P --> A[Analyze: names, types, permissions]\n  A --> R[Rewrite: views, rules]\n  R --> O[Optimize: generate + cost plans]\n  O --> E[Execute operator tree]\n  E --> RES[Results]\n```\n\n### Operator tree example\n\n```mermaid\nflowchart TB\n  LIMIT[Limit] --> SORT[Sort by total]\n  SORT --> JOIN[Hash Join]\n  JOIN --> SCAN1[Seq Scan customers]\n  JOIN --> SCAN2[Index Scan orders]\n```"}, {"id": 52, "title": "Cost-based optimization and statistics", "tldr": "The optimizer estimates the cost of alternative plans using statistics about tables (row counts, value distributions, distinct values, correlations) and picks the cheapest. Bad statistics lead to bad plans, so keep them fresh.", "real": "IBM’s System R optimizer, described by Patricia Selinger and colleagues in 1979, introduced cost-based optimization with dynamic programming over join orders, and its ideas still form the basis of modern relational optimizers.", "body": "### Statistics used\n\n| Statistic | Used for |\n|---|---|\n| Row count, pages | Scan cost |\n| Distinct values (n_distinct) | Equality selectivity |\n| Most common values | Skewed data |\n| Histograms | Range selectivity |\n| Correlation | Index scan cost |\n| Extended stats | Dependencies between columns |\n\n### Keeping statistics fresh (PostgreSQL)\n\n```sql\nANALYZE orders;                               -- refresh stats\nALTER TABLE orders ALTER COLUMN status SET STATISTICS 500;  -- more detail\nCREATE STATISTICS orders_dep (dependencies) ON country, city FROM orders;\n```\n\nAutovacuum also runs ANALYZE automatically based on data changes."}, {"id": 53, "title": "Join algorithms", "tldr": "Databases join using nested loops (good for small inputs or indexed lookups), hash joins (good for large unsorted equality joins), and merge joins (good for sorted inputs). The optimizer picks based on estimated sizes and available indexes.", "real": "MySQL added hash join support in version 8.0.18 (2019); before that, it relied mainly on nested-loop variants, which made large unindexed joins much slower than in databases with hash joins.", "body": "### Comparison\n\n| Algorithm | How | Best when |\n|---|---|---|\n| Nested loop | For each outer row, look up inner | Small outer, indexed inner |\n| Hash join | Build hash table on smaller side, probe with larger | Large inputs, equality joins |\n| Merge join | Walk two sorted inputs | Inputs already sorted (indexes) |\n\n### Hash join\n\n```mermaid\nflowchart LR\n  SMALL[Smaller input] --> BUILD[Build hash table in memory]\n  LARGE[Larger input] --> PROBE[Probe hash table]\n  BUILD --> PROBE\n  PROBE --> OUT[Joined rows]\n```\n\nIf the hash table exceeds memory (work_mem in PostgreSQL), it spills to disk in batches and slows down."}, {"id": 54, "title": "Reading execution plans", "tldr": "EXPLAIN shows the plan the optimizer chose; EXPLAIN ANALYZE runs the query and shows actual times and row counts. Compare estimated vs actual rows, find the most expensive nodes, and look for unexpected scans, sorts and spills.", "real": "Tools such as explain.depesz.com and explain.dalibo.com visualize PostgreSQL plans, and are widely used by engineers to find slow nodes and misestimates in complex execution plans.", "body": "### Example (PostgreSQL)\n\n```sql\nEXPLAIN (ANALYZE, BUFFERS)\nSELECT * FROM orders WHERE customer_id = 7 ORDER BY created_at DESC LIMIT 20;\n```\n\n```text\nLimit  (cost=0.43..25.10 rows=20) (actual time=0.031..0.090 rows=20 loops=1)\n  ->  Index Scan using idx_orders_customer_created on orders\n        (cost=0.43..980.12 rows=794) (actual time=0.030..0.085 rows=20 loops=1)\n        Index Cond: (customer_id = 7)\n        Buffers: shared hit=24\nPlanning Time: 0.15 ms\nExecution Time: 0.11 ms\n```\n\n### What to look for\n\n| Signal | Meaning |\n|---|---|\n| Estimated rows ≫ or ≪ actual | Statistics or correlation problem |\n| Seq Scan on large table with selective filter | Missing or unusable index |\n| Sort with “external merge” | Not enough sort memory |\n| High loops on nested loop | Bad join choice |\n| Many buffer reads | I/O heavy |\n\nCaution: EXPLAIN ANALYZE executes the statement; wrap data-changing statements in a transaction and roll back."}, {"id": 55, "title": "Cardinality estimation errors", "tldr": "Most bad plans come from wrong row-count estimates, caused by correlated columns, skewed data, stale statistics, functions in predicates or parameter-sensitive queries. Fix with fresher or richer statistics, query rewrites or schema changes.", "real": "The 2015 VLDB paper “How Good Are Query Optimizers, Really?” by Leis and colleagues showed that cardinality estimation errors in major databases often reached orders of magnitude on multi-join queries and were the main source of poor plans.", "body": "### Causes and fixes\n\n| Cause | Example | Fix |\n|---|---|---|\n| Correlated columns | city and country | Extended statistics |\n| Skewed values | One customer has 40% of orders | More statistics detail, partial indexes |\n| Stale stats | After bulk load | ANALYZE |\n| Functions in predicates | `WHERE date_trunc(...)` | Rewrite, expression stats/index |\n| Generic plans for parameters | Prepared statements with skew | Plan settings, query split |\n\n### Diagnose\n\nCompare `rows=` estimates with `actual rows` in EXPLAIN ANALYZE at each node; the first big mismatch is usually the root cause."}, {"id": 56, "title": "Query rewriting techniques", "tldr": "Rewrite queries to help the optimizer: make predicates sargable, replace correlated subqueries with joins or EXISTS, push filters earlier, avoid unnecessary DISTINCT and sorting, and break very complex queries into steps when needed.", "real": "Optimizers apply many rewrites automatically, but practical guides such as Markus Winand’s “SQL Performance Explained” show that small manual rewrites, such as removing functions on indexed columns, still produce large speedups in real systems.", "body": "### Rewrites\n\n| Before | After |\n|---|---|\n| `WHERE year(created_at) = 2026` | `WHERE created_at >= '2026-01-01' AND created_at < '2027-01-01'` |\n| `WHERE id IN (SELECT ... large)` | `WHERE EXISTS (...)` or join (test both) |\n| `SELECT DISTINCT` after many joins | Fix join cardinality |\n| `OR` across different columns | `UNION ALL` of indexed queries |\n| `ORDER BY random() LIMIT 1` on big tables | Sampling methods (TABLESAMPLE) or precomputed random keys |\n| Count of all rows for UI | Approximate counts or cached counters |\n\n### Always verify\n\nMeasure with EXPLAIN ANALYZE before and after; some rewrites help in one database and not another."}, {"id": 57, "title": "The N+1 query problem", "tldr": "N+1 happens when code runs one query to fetch a list and then one query per item to fetch related data. Each query adds a network round trip. Fix with joins, batched IN/ANY queries, or ORM eager loading.", "real": "ORMs such as Rails’ Active Record, Django ORM and Hibernate all provide eager loading features (includes, select_related/prefetch_related, JOIN FETCH) specifically to avoid N+1 query patterns, which are a common cause of slow pages.", "body": "### Problem\n\n```text\nSELECT * FROM orders WHERE customer_id = 7;         -- 1 query → 100 orders\nSELECT * FROM order_items WHERE order_id = 1;      -- 100 more queries\nSELECT * FROM order_items WHERE order_id = 2;\n...\n```\n\n### Fixes\n\n```sql\n-- Batch\nSELECT * FROM order_items WHERE order_id = ANY($1);  -- array of 100 ids\n\n-- Or join\nSELECT o.id, i.

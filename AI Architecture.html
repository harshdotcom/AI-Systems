armful or malformed inputs and outputs |\n| Types | Input filters, output filters, action policies, schema validators |\n| Key trade-off | Safety vs false positives, latency, cost |\n| Common failure | Treating guardrails as complete protection |\n| Production habit | Measure block rates and false positives |\n\n### Guardrail placement\n\n```mermaid\nflowchart LR\n  IN[Input] --> G1[Input guard: injection, PII, abuse]\n  G1 --> MODEL[Model / agent]\n  MODEL --> G2[Action guard: policy on tool calls]\n  G2 --> TOOLS[Tools]\n  MODEL --> G3[Output guard: safety, PII, schema]\n  G3 --> OUT[Output]\n```"}, {"id": 168, "title": "OWASP guidance for LLM and agentic applications", "tldr": "OWASP’s LLM Top 10 and its guidance for agentic applications give a shared vocabulary and checklist of risks. Use them in design reviews, threat models and security testing of AI features.", "real": "OWASP published the 2025 edition of its Top 10 for LLM Applications in November 2024 and, through its GenAI Security Project, released a Top 10 for Agentic Applications in December 2025 focused on autonomous agent risks.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Community-standard lists of AI security risks |\n| Why it matters | Common language for engineers, security teams and auditors |\n| Key trade-off | Checklists help coverage but don’t replace threat modeling |\n| Production habit | Map each risk to controls and tests |\n\n### LLM Top 10 (2025) mapping\n\n| Risk | Example control |\n|---|---|\n| LLM01 Prompt injection | Architectural isolation, least privilege |\n| LLM02 Sensitive information disclosure | Redaction, access control |\n| LLM03 Supply chain | Vetted models, packages, MCP servers |\n| LLM04 Data and model poisoning | Data provenance, validation |\n| LLM05 Improper output handling | Encode/validate outputs |\n| LLM06 Excessive agency | Scoped tools, approvals |\n| LLM07 System prompt leakage | No secrets in prompts |\n| LLM08 Vector and embedding weaknesses | Index access control, poisoning checks |\n| LLM09 Misinformation | Grounding, citations |\n| LLM10 Unbounded consumption | Rate limits, budgets |"}, {"id": 169, "title": "Identity and secrets for agents", "tldr": "Agents need identities: who is acting (the user, the agent, or a service), with which permissions, and how credentials are stored and rotated. Use delegated user authorization where possible and never place secrets in prompts or model-visible context.", "real": "The MCP specification’s 2025 authorization updates required servers to validate that tokens were issued specifically for them and discouraged passing user tokens through to downstream services, addressing confused-deputy risks in agent architectures.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Authentication, authorization and credential management for agents |\n| Why it matters | Accountability and least privilege depend on identity |\n| Patterns | On-behalf-of user tokens, workload identity, short-lived credentials |\n| Key trade-off | Fine-grained identity vs integration complexity |\n| Common failure | API keys pasted into system prompts or tool descriptions |\n| Production habit | Secrets in a vault; tools fetch credentials server-side |\n\n### Identity flow\n\n```mermaid\nflowchart LR\n  USER[User] -->|OAuth consent| TOKEN[Scoped user token]\n  TOKEN --> AGENT[Agent runtime]\n  AGENT --> TOOL[Tool server]\n  TOOL -->|validate audience + scopes| API[Downstream API]\n  AUDIT[Audit log: user, agent, action] -.-> TOOL\n```"}, {"id": 170, "title": "Red teaming agents", "tldr": "Red teaming attacks your own AI system before others do: injection through every content source, jailbreaks, tool misuse, data exfiltration, privilege escalation and runaway costs. Combine expert manual testing, automated tools and regression suites.", "real": "Microsoft’s AI Red Team published lessons in January 2025 from red-teaming more than 100 generative AI products, and open-source tools such as Microsoft’s PyRIT and NVIDIA’s garak automate parts of LLM red teaming.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Adversarial testing of AI systems |\n| Why it matters | Finds real exploit paths across model, tools and UI |\n| Scope | Injection sources, tool chains, permissions, outputs, cost abuse |\n| Key trade-off | Expert time vs coverage |\n| Common failure | Testing only the chat box, not documents and tools |\n| Production habit | Every finding becomes a regression test |\n\n### Red-team plan\n\n| Area | Test |\n|---|---|\n| Indirect injection | Malicious instructions in docs, emails, web pages, tickets |\n| Tool misuse | Trick agent into unauthorized actions |\n| Exfiltration | Data in links, images, outbound tools |\n| Privilege escalation | Access other users’ data |\n| Resource abuse | Inputs causing long loops or huge token use |\n| Jailbreaks | Policy-violating content generation |"}, {"id": 171, "title": "AI governance frameworks", "tldr": "AI governance defines how an organization decides, documents, monitors and is accountable for AI systems. Frameworks such as the NIST AI Risk Management Framework and ISO/IEC 42001 provide structure; engineering teams implement the controls.", "real": "NIST released the AI Risk Management Framework in January 2023 (Govern, Map, Measure, Manage) and a Generative AI Profile (NIST AI 600-1) in July 2024; ISO/IEC 42001, published in December 2023, defines a certifiable AI management system.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Policies, roles and processes for responsible AI |\n| Why it matters | Regulation, customer trust and risk control |\n| Key trade-off | Rigor vs speed for low-risk uses |\n| Common failure | Governance documents disconnected from engineering practice |\n| Production habit | Risk-tiered reviews built into the delivery pipeline |\n\n### NIST AI RMF functions\n\n```mermaid\nflowchart LR\n  GOVERN[Govern: policies, roles] --> MAP[Map: context, risks]\n  MAP --> MEASURE[Measure: evals, testing]\n  MEASURE --> MANAGE[Manage: mitigate, monitor, respond]\n  MANAGE --> GOVERN\n```"}, {"id": 172, "title": "The EU AI Act for builders", "tldr": "The EU AI Act regulates AI by risk: prohibited practices, high-risk systems with strict obligations, transparency duties for systems such as chatbots and generated content, and obligations for general-purpose AI model providers. Builders must classify use cases and plan for timelines.", "real": "The Act entered into force in August 2024; prohibitions applied from February 2025 and general-purpose AI model obligations from August 2025. In 2026, EU institutions agreed to delay most high-risk obligations to December 2027 and August 2028, while most transparency duties kept their August 2026 date.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | EU regulation of AI systems and models |\n| Why it matters | Applies to systems placed on the EU market or affecting people in the EU |\n| Key roles | Provider, deployer, importer, distributor |\n| Key trade-off | Compliance effort vs market access |\n| Common failure | Not classifying use cases until late |\n| Production habit | Maintain an AI use-case inventory with risk classification |\n\n### Risk tiers (simplified)\n\n| Tier | Examples | Engineering implications |\n|---|---|---|\n| Prohibited | Social scoring, certain manipulative practices | Don’t build |\n| High-risk | Hiring, credit, education access, critical infrastructure | Risk management, data governance, logging, human oversight, documentation |\n| Transparency | Chatbots, deepfakes, generated content | Disclose AI interaction, label content |\n| Minimal | Spam filters, most internal tools | Voluntary codes |\n\nThis is a summary, not legal advice; involve counsel."}, {"id": 173, "title": "Privacy and data protection in LLM applications", "tldr": "LLM apps process personal data in prompts, retrieval corpora, memory, logs and fine-tuning sets. Apply data minimization, purpose limitation, lawful basis, retention limits, processor agreements with model providers and support for data subject rights.", "real": "Italy’s data protection authority fined OpenAI €15 million in December 2024 over ChatGPT’s personal data processing, and India’s Digital Personal Data Protection Act (2023), with rules notified in November 2025, adds consent and data-handling duties for AI products serving Indian users.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Applying privacy law to AI data flows |\n| Why it matters | Fines, trust, enterprise contracts |\n| Data locations | Prompts, logs, vector indexes, memory, caches, training data |\n| Key trade-off | Personalization and debugging vs minimization |\n| Common failure | Deletion requests not reaching vector indexes and memory |\n| Production habit | Data map of every AI data store |\n\n### Controls\n\n| Control | Example |\n|---|---|\n| Minimization | Redact PII before model calls when not needed |\n| Retention | Trace store purge after N days |\n| Vendor terms | Zero/limited retention options, DPAs |\n| Rights | Deletion propagates to indexes and memory |\n| Residency | Regional processing where required |"}, {"id": 174, "title": "Transparency and disclosure", "tldr": "Tell people when they interact with AI, when content is AI-generated, what data is used and what the system can’t do. Transparency builds calibrated trust and is increasingly a legal requirement.", "real": "The EU AI Act’s transparency obligations require informing people when they interact with AI systems such as chatbots and labeling certain AI-generated content, and the C2PA Content Credentials standard is used to attach provenance metadata to generated media.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Clear communication about AI involvement and limits |\n| Why it matters | Users calibrate trust; regulators require it |\n| Elements | AI disclosure, capability limits, data use, provenance labels |\n| Key trade-off | Clear warnings vs alarming users |\n| Common failure | AI agents presenting themselves as humans |\n| Production habit | Disclosure in UI copy, reviewed by legal |\n\n### Disclosure checklist\n\n- [ ] Users told they’re interacting with AI\n- [ ] AI-generated content labeled where required\n- [ ] Limitations stated near outputs\n- [ ] Data use explained in plain language\n- [ ] Human contact path available"}, {"id": 175, "title": "Designing human oversight", "tldr": "Effective human oversight requires that people can understand outputs, have time and authority to intervene, and are not overwhelmed by approvals. Design review interfaces, escalation paths and override mechanisms deliberately.", "real": "The EU AI Act requires high-risk AI systems to be designed for effective human oversight, including the ability to understand capabilities and limits, monitor operation, and override or stop the system, and warns about automation bias.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Mechanisms for humans to supervise and control AI |\n| Why it matters | Accountability and error correction |\n| Elements | Review queues, explanations, override, stop buttons, escalation |\n| Key trade-off | Oversight cost vs automation value |\n| Common failure | Automation bias: reviewers approve without checking |\n| Production habit | Measure override rates and review time; audit samples |\n\n### Oversight design\n\n```mermaid\nflowchart LR\n  AI[AI decision / action] --> RISK{Risk level}\n  RISK -->|low| AUTO[Auto + sampled audit]\n  RISK -->|medium| REVIEW[Human review with evidence]\n  RISK -->|high| DUAL[Two-person approval]\n  REVIEW --> FEED[Overrides feed evals]\n```"}, {"id": 176, "title": "Audit logging for AI systems", "tldr": "Keep tamper-resistant records of what AI systems did: inputs, retrieved sources, model and prompt versions, tool calls, approvals, outputs and outcomes. Audit logs support investigations, compliance and accountability.", "real": "The EU AI Act requires high-risk AI systems to support automatic recording of events (logging) over their lifetime to enable traceability, and financial regulators expect records of automated decision inputs and outputs.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Durable records of AI system activity |\n| Why it matters | Explaining decisions after the fact |\n| Record | Who, what, when, which versions, which data, which approvals |\n| Key trade-off | Completeness vs privacy and storage |\n| Common failure | Debug traces deleted before audits need them |\n| Production habit | Separate audit log with retention policy and integrity controls |\n\n### Audit record\n\n```json\n{\"ts\": \"2026-11-12T10:15:22Z\", \"actor\": \"agent:refund-bot\", \"on_behalf_of\": \"user:cus_42\",\n \"action\": \"issue_refund\", \"amount_cents\": 4800, \"approval\": \"auto(policy ≤ 5000)\",\n \"model\": \"claude-sonnet-5-5\", \"prompt_version\": \"refund-v9\", \"trace_id\": \"tr_9f2c\"}\n```"}, {"id": 177, "title": "Fairness and bias testing", "tldr": "AI systems can perform worse for, or treat unfairly, certain groups, languages or dialects. Define relevant groups and harms, measure quality and outcomes by segment, mitigate, and monitor continuously, especially for consequential decisions.", "real": "New York City’s Local Law 144, enforced from July 2023, requires bias audits of automated employment decision tools used in hiring, and Amazon abandoned an experimental recruiting model in 2018 after it learned to penalize résumés mentioning women’s activities.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Measuring and reducing unequal performance or outcomes |\n| Why it matters | Harm to people, legal exposure, trust |\n| Segments | Language, region, demographic proxies where lawful, user types |\n| Key trade-off | Fairness definitions can conflict |\n| Common failure | Testing only in English with standard phrasing |\n| Production habit | Segment breakdowns in every eval report |\n\n### Segment eval report\n\n| Segment | Task success | Gap vs overall |\n|---|---|---|\n| English | 92% | +1 |\n| Hindi | 84% | −7 |\n| Spanish | 89% | −2 |\n| Non-native phrasing | 81% | −10 |\n\n(Illustrative; large gaps trigger mitigation work.)"}, {"id": 178, "title": "Vendor and model risk management", "tldr": "Depending on model providers and AI vendors brings risks: behavior changes, deprecations, outages, pricing changes, data terms, security incidents and regulatory exposure. Manage them with due diligence, contracts, monitoring and exit plans.", "real": "In August 2025, OpenAI’s replacement of GPT-4o with GPT-5 as ChatGPT’s default prompted user backlash and the restoration of GPT-4o for paid users, illustrating how model changes affect products built on them.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Controlling risks from third-party AI dependencies |\n| Why it matters | Your product inherits vendor changes and failures |\n| Controls | Pinned versions, migration evals, multi-provider options, contracts |\n| Key trade-off | Single-vendor simplicity vs resilience |\n| Common failure | No plan when a model is deprecated |\n| Production habit | Track deprecation dates; quarterly vendor review |\n\n### Vendor review checklist\n\n- [ ] Data use and retention terms\n- [ ] Security certifications and incident history\n- [ ] Regional availability\n- [ ] Deprecation and versioning policy\n- [ ] SLAs and support\n- [ ] Exit plan and portable evals"}, {"id": 179, "title": "Documentation: system cards and model cards", "tldr": "Document AI systems for users, customers, auditors and future engineers: purpose, intended use, data, models, evaluations, limitations, safety measures, oversight and contacts. Keep documentation versioned with releases.", "real": "Google researchers proposed model cards in 2019, and AI labs publish system cards for major model releases describing evaluations and safety testing; the EU AI Act requires technical documentation for high-risk systems.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structured documentation of AI systems |\n| Why it matters | Transparency, compliance, onboarding |\n| Key trade-off | Thoroughness vs maintenance effort |\n| Common failure | Documentation written once at launch and never updated |\n| Production habit | Generate parts automatically from release manifests and eval reports |\n\n### System card outline\n\n| Section | Content |\n|---|---|\n| Purpose and users | Intended use, out-of-scope uses |\n| Architecture | Models, retrieval, tools, data flows |\n| Data | Sources, privacy handling |\n| Evaluation | Results by task and segment |\n| Limitations | Known failure modes |\n| Safety | Guardrails, red-team results, oversight |\n| Operations | Monitoring, incident contacts |"}, {"id": 180, "title": "Accountability and AI incident handling", "tldr": "Assign clear ownership for each AI system, define what counts as an AI incident (harmful output, data leak, unfair decision, unsafe action), set up reporting channels, and learn through postmortems. Some jurisdictions require incident reporting.", "real": "The AI Incident Database, launched by the Partnership on AI in 2020 and now run by the Responsible AI Collaborative, catalogs thousands of reported AI incidents, helping practitioners learn from failures across industries.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Ownership and response processes for AI harms |\n| Why it matters | Fast, accountable handling limits harm and liability |\n| Elements | Named owners, incident taxonomy, reporting, postmortems |\n| Key trade-off | Transparency vs legal caution |\n| Common failure | Nobody owning an AI feature after launch |\n| Production habit | Owner field in the AI inventory; quarterly reviews |\n\n### AI incident taxonomy\n\n| Type | Example |\n|---|---|\n| Harmful content | Offensive or dangerous output |\n| Misinformation | Wrong policy stated to customers |\n| Data exposure | Cross-user data leak |\n| Unsafe action | Agent deletes or sends wrongly |\n| Unfair outcome | Biased decisions |\n| Cost/availability | Runaway spend, outage |"}, {"id": 181, "title": "When to fine-tune", "tldr": "Fine-tune when prompting and retrieval can’t achieve required consistency, format, style, latency or cost: for example, teaching a small model a narrow task at scale. Don’t fine-tune to add changing knowledge; use RAG for that.", "real": "OpenAI’s and Anthropic’s guidance both recommend exhausting prompt engineering and retrieval first, reserving fine-tuning for cases with clear, measured gaps and good training data.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Further training a model on task-specific examples |\n| Why it matters | Can improve consistency and let smaller, cheaper models perform well |\n| When to use | Stable task, many examples, format/style needs, cost/latency pressure |\n| When not to use | Adding facts that change, small data, unclear quality bar |\n| Key trade-off | Training and maintenance effort vs runtime gains |\n| Common failure | Fine-tuning to fix a retrieval problem |\n| Production habit | Baseline with prompting + RAG on the same eval set first |\n\n### Decision table\n\n| Gap | Best fix |\n|---|---|\n| Missing or changing knowledge | RAG |\n| Inconsistent format/style | Prompting → fine-tuning |\n| Too slow / expensive with large model | Distill / fine-tune small model |\n| Domain jargon understanding | Fine-tune (or better retrieval) |\n| Safety behavior | Prompting, guardrails, provider options |"}, {"id": 182, "title": "Supervised fine-tuning", "tldr": "Supervised fine-tuning (SFT) trains a model on input–output pairs demonstrating desired behavior. Quality, diversity and consistency of examples matter far more than quantity; a few thousand excellent examples often beat many noisy ones.", "real": "The LIMA paper (Zhou et al., 2023) showed strong instruction-following from fine-tuning on only 1,000 carefully curated examples, supporting the view that data quality dominates quantity for alignment-style fine-tuning.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Training on example inputs and ideal outputs |\n| Why it matters | Teaches format, style and task behavior directly |\n| Data | Curated, diverse, consistent, reviewed examples |\n| Key trade-off | Specialization vs loss of general ability |\n| Common failure | Training on raw logs with inconsistent answers |\n| Production habit | Hold out test data; compare against prompted baseline |\n\n### Training example (chat format)\n\n```json\n{\"messages\": [\n  {\"role\": \"system\", \"content\": \"Classify support tickets.\"},\n  {\"role\": \"user\", \"content\": \"My card was charged twice for one order.\"},\n  {\"role\": \"assistant\", \"content\": \"{\\\"category\\\": \\\"billing\\\", \\\"priority\\\": \\\"high\\\"}\"}\n]}\n```"}, {"id": 183, "title": "Parameter-efficient fine-tuning: LoRA and QLoRA", "tldr": "LoRA trains small low-rank adapter matrices instead of all model weights, cutting memory and storage; QLoRA combines LoRA with a 4-bit quantized base model, enabling fine-tuning of large models on a single GPU. Adapters can be swapped per task or customer.", "real": "LoRA was introduced by Hu et al. (Microsoft, 2021), and QLoRA (Dettmers et al., 2023) showed a 65-billion-parameter model could be fine-tuned on a single 48 GB GPU while preserving full 16-bit fine-tuning performance on their benchmarks.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Training small adapter weights on top of a frozen model |\n| Why it matters | Much cheaper training and storage; many adapters per base model |\n| When to use | Open-weight model customization |\n| Key trade-off | Slightly less capacity than full fine-tuning in some cases |\n| Common failure | Poor hyperparameters (rank, learning rate) without evals |\n| Production habit | Track adapter versions with eval results |\n\n### Comparison\n\n| Method | Trainable parameters | GPU memory |\n|---|---|---|\n| Full fine-tuning | All | Very high |\n| LoRA | Small fraction | Lower |\n| QLoRA | Small fraction on 4-bit base | Lowest |"}, {"id": 184, "title": "Preference tuning: RLHF and DPO", "tldr": "Preference tuning teaches models which of two outputs is better, improving helpfulness, tone and safety. RLHF uses a reward model and reinforcement learning; DPO optimizes directly on preference pairs, simpler and more stable for most teams.", "real": "OpenAI’s InstructGPT (2022) popularized RLHF, and Direct Preference Optimization (Rafailov et al., 2023) showed comparable or better results without a separate reward model or reinforcement learning loop.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Training on chosen vs rejected response pairs |\n| Why it matters | Captures quality judgments hard to express as single targets |\n| Data | Prompts with preferred and dispreferred responses |\n| Key trade-off | Preference data cost vs nuanced improvements |\n| Common failure | Optimizing for length or style that raters liked, not correctness |\n| Production habit | Combine with task-specific evals to catch reward hacking |\n\n### Preference pair\n\n```json\n{\"prompt\": \"Explain our refund policy briefly.\",\n \"chosen\": \"You can return items within 30 days for a full refund, except final-sale items.\",\n \"rejected\": \"Refunds are possible. Please read the policy for details.\"}\n```"}, {"id": 185, "title": "Distillation", "tldr": "Distillation trains a smaller “student” model on outputs of a larger “teacher” model, transferring capability for a specific task at lower cost and latency. It requires representative inputs, high-quality teacher outputs and careful licensing review.", "real": "Hinton, Vinyals and Dean described knowledge distillation in 2015, and in January 2025 DeepSeek released smaller models distilled from DeepSeek-R1’s reasoning outputs, showing large reasoning gains for compact models.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Training a small model to imitate a large model on your task |\n| Why it matters | Cuts cost and latency at high volume |\n| When to use | Stable, high-volume tasks where a large model performs well |\n| Key trade-off | Student quality ceiling vs savings |\n| Common failure | Distilling on unrepresentative inputs |\n| Production habit | Check provider terms on using outputs for training |\n\n### Pipeline\n\n```mermaid\nflowchart LR\n  INPUTS[Representative inputs] --> TEACHER[Teacher model outputs]\n  TEACHER --> FILTER[Filter by evals / judges]\n  FILTER --> TRAIN[Fine-tune student]\n  TRAIN --> EVAL[Evaluate vs teacher]\n  EVAL --> DEPLOY[Deploy with routing fallback to teacher]\n```"}, {"id": 186, "title": "Synthetic data generation", "tldr": "LLMs can generate training and evaluation data: paraphrases, edge cases, multilingual variants, adversarial inputs and labeled examples. Synthetic data scales coverage but needs filtering, deduplication and validation against real data.", "real": "Stanford’s Alpaca (2023) fine-tuned a 7B model on 52,000 instructions generated with a larger model for under $600, and Microsoft’s Phi models used large amounts of curated synthetic “textbook-quality” data.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Model-generated examples for training or evals |\n| Why it matters | Fills gaps where real data is scarce or sensitive |\n| Uses | Edge cases, rare classes, languages, adversarial tests |\n| Key trade-off | Scale vs realism and diversity |\n| Common failure | Repetitive, unrealistic data inflating eval scores |\n| Production habit | Tag synthetic data; validate final results on real data |\n\n### Generation pipeline\n\n```mermaid\nflowchart LR\n  SEED[Real seed examples] --> GEN[Generate variations]\n  GEN --> FILTER[Quality filter + dedup]\n  FILTER --> HUMAN[Human spot check]\n  HUMAN --> DATA[(Dataset tagged synthetic)]\n```"}, {"id": 187, "title": "Data curation for fine-tuning", "tldr": "Curate training data deliberately: clear task definition, consistent labels, diversity of inputs, removal of duplicates, PII and errors, balanced classes, and documented provenance and licenses.", "real": "Analyses of large training datasets, such as studies of web-scale corpora, have repeatedly found that deduplication and quality filtering improve model quality, and data curation is a central topic in open model training reports.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Preparing high-quality training data |\n| Why it matters | Models learn mistakes in data faithfully |\n| Steps | Define, collect, clean, label, dedupe, balance, split, document |\n| Key trade-off | Curation effort vs model quality |\n| Common failure | Test examples leaking into training data |\n| Production habit | Data cards with sources, licenses and filters applied |\n\n### Curation checklist\n\n- [ ] Task and label definitions written\n- [ ] Inconsistent examples resolved\n- [ ] Duplicates and near-duplicates removed\n- [ ] PII removed or consented\n- [ ] Train/validation/test splits without leakage\n- [ ] Licenses and terms verified"}, {"id": 188, "title": "Evaluating fine-tuned models", "tldr": "Compare fine-tuned models against prompted baselines on held-out task evals, check for regressions in general capabilities and safety, measure cost and latency, and test robustness to real-world inputs.", "real": "Research on catastrophic forgetting shows that fine-tuning on narrow data can degrade capabilities outside the task, and studies have found fine-tuning can weaken safety behaviors, so post-fine-tune safety evaluation is recommended.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Verifying a fine-tune is better and safe |\n| Why it matters | Fine-tunes can improve one metric while breaking others |\n| Compare | Task metrics, general skills, safety, cost, latency |\n| Key trade-off | Narrow gains vs broad regressions |\n| Common failure | Evaluating only on data similar to training data |\n| Production habit | Shadow test against current model before switching |\n\n### Evaluation matrix\n\n| Check | Baseline (prompted) | Fine-tuned |\n|---|---|---|\n| Task accuracy | 86% | 93% |\n| Format validity | 97% | 99.8% |\n| Safety suite | Pass | Must pass |\n| Out-of-domain sample | 90% | ≥ 85% acceptable? |\n| Cost per 1k requests | $4.10 | $0.60 |\n\n(Illustrative values.)"}, {"id": 189, "title": "Fine-tuning embeddings and rerankers", "tldr": "Domain-specific retrieval often improves more from fine-tuning embedding models or rerankers on your query–document pairs than from changing the generator. Hard negatives and good evaluation sets are key.", "real": "The open-source sentence-transformers library supports fine-tuning embedding and cross-encoder reranking models with contrastive losses, and teams frequently report notable recall gains on specialized domains such as legal, medical or internal jargon.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Adapting retrieval models to your domain |\n| Why it matters | Retrieval quality caps RAG quality |\n| Data | Query, relevant passage, hard negatives |\n| Key trade-off | Training effort + re-indexing vs recall gains |\n| Common failure | Training without hard negatives, learning trivial distinctions |\n| Production habit | Measure recall@k before and after; re-embed corpus on change |\n\n### Training pair\n\n```json\n{\"query\": \"max refund window for premium plan\",\n \"positive\": \"Premium subscribers may request refunds within 60 days...\",\n \"hard_negative\": \"Standard plan refunds are available within 30 days...\"}\n```"}, {"id": 190, "title": "Serving and maintaining custom models", "tldr": "Custom models need serving infrastructure, versioning, monitoring, retraining triggers and deprecation plans. Multi-adapter serving lets many LoRA adapters share one base model; base model upgrades require re-training and re-evaluation.", "real": "Serving engines such as vLLM support loading multiple LoRA adapters on a shared base model, an approach explored in research such as S-LoRA (2023) for serving thousands of adapters efficiently.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Operating fine-tuned models over their lifecycle |\n| Why it matters | Custom models decay as data and base models change |\n| Lifecycle | Train → evaluate → deploy → monitor → retrain / retire |\n| Key trade-off | Custom performance vs ongoing maintenance |\n| Common failure | Fine-tuned model left on an outdated base while frontier models improve |\n| Production habit | Re-compare with latest prompted frontier models periodically |\n\n### Lifecycle\n\n```mermaid\nflowchart LR\n  DATA[Data] --> TRAIN[Train adapter]\n  TRAIN --> EVAL[Evaluate]\n  EVAL --> SERVE[Serve: base + adapters]\n  SERVE --> MON[Monitor quality + drift]\n  MON -->|drift / new base| DATA\n  MON -->|frontier model now better| RETIRE[Retire]\n```"}, {"id": 191, "title": "Architecture decision records for AI", "tldr": "Record significant AI design decisions, such as model choice, RAG versus long context, framework, single versus multi-agent, and hosting, with context, options, evidence from evals, consequences and review triggers. AI decisions need revisiting as models change.", "real": "Michael Nygard proposed lightweight architecture decision records in 2011; AI teams extend the format with eval results and explicit re-evaluation triggers because model capabilities and prices change every few months.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Short documents capturing design decisions and reasoning |\n| Why it matters | Prevents re-litigating choices; explains the system to newcomers |\n| AI-specific fields | Eval evidence, cost per task, review date or trigger |\n| Key trade-off | Writing time vs long-term clarity |\n| Common failure | Decisions made in chat threads and lost |\n| Production habit | ADRs stored with code, linked from design docs |\n\n### ADR template\n\n```text\nADR-021: Use single agent with tools instead of multi-agent for support triage\nStatus: Accepted (2026-10-02)\nContext: 85% of requests need ≤ 3 tool calls; latency target p95 < 8 s.\nOptions: (A) single agent, (B) supervisor + 3 specialists\nEvidence: A: 91% task success, $0.018/task, p95 6.2 s; B: 92%, $0.061/task, p95 14 s\nDecision: A\nConsequences: Simpler tracing; specialist prompts merged into one\nRevisit when: success < 88%, or new request types exceed 15% of traffic\n```"}, {"id": 192, "title": "AI team structure and roles", "tldr": "AI products need AI engineers, backend and platform engineers, ML or applied scientists, data engineers, product managers, designers, security and domain experts. Organize around product outcomes with a shared AI platform team for gateways, evals and governance.", "real": "The “AI engineer” title became widespread after 2023 for engineers building products on foundation models, and many large companies created central AI platform teams providing model gateways, evaluation tooling and governance to product teams.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How people and responsibilities are organized for AI work |\n| Why it matters | Determines speed, quality and consistency |\n| Models | Embedded AI engineers + central platform (common) |\n| Key trade-off | Central consistency vs team autonomy |\n| Common failure | Every team rebuilding gateways, evals and guardrails |\n| Production habit | Platform team owns shared infrastructure and standards |\n\n### Responsibilities\n\n| Role | Owns |\n|---|---|\n| AI engineer | Prompts, RAG, agents, evals for features |\n| Platform engineer | Gateway, tracing, eval infrastructure, MCP registry |\n| Applied scientist | Fine-tuning, advanced retrieval, research |\n| Data engineer | Ingestion, pipelines, data quality |\n| PM / designer | Problem, UX, success metrics |\n| Security / governance | Threat models, reviews, compliance |\n| Domain experts | Golden sets, quality judgments |"}, {"id": 193, "title": "Build vs buy for AI capabilities", "tldr": "Decide per component: buy commodity capabilities (models, vector databases, observability), build differentiators (domain workflows, proprietary data pipelines, evals, product UX), and consider buying complete solutions for non-core needs.", "real": "Many enterprises adopted packaged AI products for common needs, such as coding assistants and meeting summarization, while building custom agents and RAG systems where proprietary data and workflows create competitive advantage.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Sourcing decisions for AI components and products |\n| Why it matters | Focuses engineering on differentiation |\n| Key trade-off | Control and fit vs speed and maintenance burden |\n| Common failure | Building generic tools that vendors do better |\n| Production habit | Revisit decisions yearly as the market matures |\n\n### Decision grid\n\n| Component | Usually |\n|---|---|\n| Foundation models | Buy (API) or open-weight |\n| Vector search, tracing, eval platform | Buy / open source |\n| Model gateway | Open source or buy, customize |\n| Domain workflows and agents | Build |\n| Golden datasets and evals | Build |\n| Generic copilots (meetings, email) | Buy |"}, {"id": 194, "title": "Business cases and ROI for AI systems", "tldr": "Justify AI investments with measurable outcomes: time saved, cost per task, resolution rates, revenue, quality and risk reduction. Include full costs (inference, engineering, data, operations, review) and stage funding behind evidence gates.", "real": "Gartner predicted in 2024 that at least 30% of generative AI projects would be abandoned after proof of concept by the end of 2025, often due to unclear business value or escalating costs, reinforcing the need for stage-gated business cases.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Quantifying value and cost of AI initiatives |\n| Why it matters | Secures investment and prevents zombie pilots |\n| Key trade-off | Early estimates are uncertain; use ranges and gates |\n| Common failure | Counting model cost only, ignoring human review and ops |\n| Production habit | Track realized ROI after launch |\n\n### ROI model\n\n```\nAnnual value = tasks/year × (human cost per task − AI cost per task − review cost per task)\nExample: 400,000 tickets × ($4.00 − $0.05 − $0.40) = $1.42M per year\nSubtract: platform + engineering + operations costs\n```\n\n### Stage gates\n\n```mermaid\nflowchart LR\n  G0[Problem + baseline] --> G1[Prototype meets eval bar]\n  G1 --> G2[Pilot shows outcome gain]\n  G2 --> G3[Unit economics at scale]\n  G3 --> SCALE[Scale]\n```"}, {"id": 195, "title": "Case study: enterprise knowledge assistant", "tldr": "An internal assistant answers employee questions across wikis, policies and tickets. The architecture combines connectors, permission-aware hybrid retrieval with reranking, grounded generation with citations, feedback to content owners, and governance for data access.", "real": "Morgan Stanley’s GPT-4-based assistant for wealth advisors (2023) and enterprise products such as Glean and Microsoft 365 Copilot show the pattern: retrieval grounded in internal content, respecting existing permissions.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Accurate, cited answers from internal knowledge |\n| Key risks | Permission leaks, stale content, hallucinated policies |\n| Key design choices | Hybrid retrieval, ACL filtering, citations, “I don’t know” |\n| Success metrics | Answer acceptance, ticket deflection, faithfulness, citation precision |\n\n### Architecture\n\n```mermaid\nflowchart LR\n  SRC[Wiki, drive, tickets, HR policies] --> CONN[Connectors + ACL sync]\n  CONN --> ING[Parse, chunk, contextualize, embed]\n  ING --> IDX[(Hybrid index + ACL metadata)]\n  USER[Employee] --> API[Assistant API]\n  API --> RET[Permission-filtered retrieval + rerank]\n  IDX --> RET\n  RET --> GEN[Grounded generation + citations]\n  GEN --> USER\n  USER -->|feedback| OWNERS[Content owners dashboard]\n```\n\n### Launch criteria\n\nFaithfulness ≥ 95%, zero permission leaks in tests, p95 < 6 s, refusal correct on unanswerable set."}, {"id": 196, "title": "Case study: customer support agent", "tldr": "A customer-facing support agent answers questions and performs bounded actions (order status, returns) with policy enforcement in code, escalation to humans, disclosure, and outcome metrics such as resolution, CSAT and recontact rate.", "real": "Klarna reported in 2024 that its AI assistant handled about two-thirds of customer service chats in its first month, later emphasizing continued access to human agents, while Intercom prices its Fin agent at $0.99 per resolved conversation.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Resolve routine requests accurately and safely |\n| Key risks | Wrong policy promises, unauthorized actions, poor escalation |\n| Key design choices | RAG on policies, scoped tools, policy engine, human handoff |\n| Success metrics | Resolution rate, CSAT, recontact rate, cost per resolution, policy violations (0) |\n\n### Architecture\n\n```mermaid\nflowchart LR\n  CUST[Customer] --> AGENT[Support agent]\n  AGENT --> KB[Policy RAG]\n  AGENT --> TOOLS[Order + returns tools]\n  TOOLS --> POLICY[Policy engine: limits, eligibility]\n  AGENT --> GUARD[Guardrails: PII, tone, safety]\n  AGENT -->|low confidence / request| HUMAN[Human agent with summary]\n```\n\n### Rollout\n\n5% of traffic for 2 weeks with daily review of failures, then 25%, then 100% with weekly eval refresh."}, {"id": 197, "title": "Case study: coding agent platform", "tldr": "An internal platform lets engineers assign tickets to background coding agents that work in sandboxes, run tests, and open pull requests for human review, with repository instructions, permissions, cost budgets and quality metrics.", "real": "Products such as OpenAI’s Codex cloud agent and GitHub Copilot’s coding agent (both introduced in 2025) follow this architecture: ticket in, sandboxed execution with tests, pull request out, human approval required.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Automate well-scoped engineering tasks safely |\n| Key risks | Bad code merged, secret exposure, sandbox escape, cost |\n| Key design choices | Ephemeral sandboxes, test gates, PR-only output, AGENTS.md |\n| Success metrics | PR merge rate, review time, defects, cost per merged PR |\n\n### Architecture\n\n```mermaid\nflowchart LR\n  TICKET[Ticket] --> QUEUE[Task queue]\n  QUEUE --> SANDBOX[Ephemeral sandbox: repo clone, no prod secrets]\n  SANDBOX --> AGENT[Coding agent]\n  AGENT --> TESTS[Tests + lint]\n  TESTS -->|pass| PR[Pull request]\n  TESTS -->|fail after budget| REPORT[Report findings]\n  PR --> REVIEW[Human review + CI]\n```"}, {"id": 198, "title": "Case study: natural language to data (text-to-SQL)", "tldr": "A text-to-SQL assistant lets analysts and business users ask questions of data. It needs schema context and curated table descriptions, retrieval of relevant tables and example queries, validation, read-only execution with limits, and results shown with the generated SQL.", "real": "Uber described QueryGPT in 2024, which used retrieval of relevant tables and sample queries plus specialized agents to generate SQL, reporting substantial reductions in the time employees spent writing queries.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Accurate answers from data without writing SQL |\n| Key risks | Wrong joins, misleading numbers, data access violations, expensive queries |\n| Key design choices | Curated semantic layer, table retrieval, read-only role, query cost limits |\n| Success metrics | Execution accuracy on golden questions, analyst acceptance |\n\n### Architecture\n\n```mermaid\nflowchart LR\n  Q[Question] --> TABLES[Retrieve relevant tables + metric definitions]\n  TABLES --> GEN[Generate SQL]\n  GEN --> VALIDATE[Validate: read-only, allowed tables, cost estimate]\n  VALIDATE --> RUN[Run on replica with timeout + row limit]\n  RUN --> ANSWER[Answer + SQL + caveats]\n```\n\nBenchmarks such as Spider (2018) and BIRD (2023) show accuracy drops on realistic, messy schemas, so curated metric definitions matter."}, {"id": 199, "title": "AI architecture review checklist", "tldr": "Review every AI system before launch and after major changes across problem fit, architecture, data, quality, security, reliability, cost, governance and operations. A consistent checklist turns lessons from this handbook into practice.", "real": "Cloud well-architected frameworks from AWS, Microsoft and Google added generative AI guidance in 2024–2025, reflecting the industry move toward structured architecture reviews for AI workloads.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A structured gate for AI system design |\n| Why it matters | Catches predictable failures early |\n| Production habit | Use at design, pre-launch and quarterly |\n\n### Checklist\n\n| Area | Questions |\n|---|---|\n| Problem fit | Is AI needed? Simplest pattern chosen? |\n| Architecture | Workflow vs agent justified? Single vs multi-agent evidence? |\n| Context | Retrieval evaluated? Context budget defined? |\n| Tools | Least privilege? Risk tiers? Idempotency? |\n| Quality | Golden sets, judges calibrated, pass^k for agents? |\n| Security | Threat model, injection defenses, egress controls, red team? |\n| Reliability | Timeouts, fallbacks, durable state, kill switch? |\n| Cost | Cost per task, budgets, routing, caching? |\n| Governance | Risk tier, disclosure, oversight, audit logs, privacy? |\n| Operations | Tracing, alerts, runbooks, owners? |"}, {"id": 200, "title": "Glossary and mastery roadmap", "tldr": "Use the glossary as a shared vocabulary and the roadmap to build expertise progressively, from reliable single calls to RAG, tools, workflows, agents, multi-agent systems and production-grade AI platforms.", "real": "Recommended reading: Anthropic’s “Building effective agents” and context engineering guides, Chip Huyen’s “AI Engineering” (2025), the OWASP Top 10 for LLM Applications, the NIST AI RMF, the MCP specification, and engineering write-ups from teams running AI in production.", "body": "### Glossary\n\n| Term | Meaning |\n|---|---|\n| RAG | Retrieval-augmented generation |\n| Agent | Model-directed loop using tools toward a goal |\n| Workflow | Predefined orchestration of model calls |\n| Context engineering | Curating what enters the context window |\n| MCP | Model Context Protocol for tools and data |\n| A2A | Agent2Agent protocol for agent collaboration |\n| Hybrid search | Keyword + vector retrieval |\n| Reranker | Second-stage relevance model |\n| LLM-as-judge | Model-based evaluation |\n| pass^k | Success on all k repeated trials |\n| Guardrails | Policy checks on inputs, outputs, actions |\n| Lethal trifecta | Private data + untrusted content + external communication |\n| Compaction | Summarizing context for long-running agents |\n| LoRA | Low-rank adapter fine-tuning |\n\n### Mastery roadmap\n\n1. Ship a reliable structured-output feature with evals\n2. Build and evaluate a hybrid RAG system with citations\n3. Build a tool-using agent with budgets, tracing and approvals\n4. Expose an internal system as a secured MCP server\n5. Run a red-team exercise and fix findings\n6. Implement routing, caching and cost dashboards\n7. Lead an architecture review using the checklist\n8. Decide (with evidence) when multi-agent is worth it"}];
const PARTS = ["AI engineering foundations", "Prompt and context engineering", "RAG fundamentals", "Advanced RAG", "RAG evaluation and optimization", "Tool use and function calling", "Agent fundamentals", "Agentic workflow patterns", "Agent frameworks and runtime", "MCP and agent interoperability", "Multi-agent architectures", "Memory and context management", "Coding and computer-use agents", "Evaluating LLM apps and agents", "Observability and LLMOps", "Production architecture and serving", "Security for AI agents", "Governance, compliance and responsible AI", "Fine-tuning and model customization", "Architecture leadership and capstones"];
const TOTAL = 200, PER = 10;
function idsOf(p){ const a = []; for (let i = (p-1)*PER + 1; i <= p*PER; i++) a.push(i); return a; }
const partOf = id => Math.ceil(id / PER);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "ai-architecture-progress-v1";
const LS_LAST = "ai-architecture-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try{ await dbRef.set({done:[...done].sort((a,b)=>a-b), updated:Date.now()}); }
  catch(e){ if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; pushRemote(); }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...done])); }catch(e){} }
function toggle(id){
  if (done.has(id)) done.delete(id); else done.add(id);
  saveLocal(); pushRemote(); renderAll();
  toast(done.has(id) ? "Chapter " + id + " marked complete" : "Chapter " + id + " marked not complete");
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(s){
  if (window.marked && marked.parse){
    const html = marked.parse(s, {gfm:true, headerIds:false, mangle:false});
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  }
  return "<pre>" + esc(s) + "</pre>";
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function currentId(){
  const m = location.hash.match(/^#ch-(\d{1,3})$/);
  const n = m ? +m[1] : 0;
  return n >= 1 && n <= TOTAL ? n : 0;
}

/* ---------- header memory bank ---------- */
function renderBank(){
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    html += '<div class="bank-group" title="Part ' + p + ': ' + esc(PARTS[p-1]) + '">';
    for (const i of idsOf(p)){
      html += '<button class="cell' + (done.has(i) ? " done" : "") + (i === cur ? " here" : "") +
        '" data-go="' + i + '" aria-label="Chapter ' + i + (done.has(i) ? ", complete" : "") + '"></button>';
    }
    html += "</div>";
  }
  document.getElementById("bank").innerHTML = html;
  document.getElementById("doneCount").textContent = done.size;
  document.getElementById("pct").textContent = Math.round(done.size * 100 / TOTAL) + "%";
}

/* ---------- sidebar ---------- */
const openParts = new Set();
function renderSide(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const matches = ids.filter(i => !q || byId[i].title.toLowerCase().includes(q) || byId[i].tldr.toLowerCase().includes(q) || String(i) === q);
    if (q && !matches.length) continue;
    const count = ids.filter(i => done.has(i)).length;
    const open = q || openParts.has(p) || partOf(cur) === p;
    html += '<div class="part' + (open ? " open" : "") + '">' +
      '<button class="part-head" data-part="' + p + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="part-num">' + String(p).padStart(2, "0") + '</span>' +
      '<span class="part-name">' + esc(PARTS[p-1]) + '</span>' +
      '<span class="part-count' + (count === PER ? " full" : "") + '">' + count + '/' + PER + '</span></button><ul class="part-list">';
    for (const i of matches){
      html += '<li class="ch-row' + (i === cur ? " active" : "") + '">' +
        '<button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="' + (done.has(i) ? "Mark chapter " + i + " not complete" : "Mark chapter " + i + " complete") + '">' + TICK + '</button>' +
        '<a href="#ch-' + i + '"><span class="n">' + i + '.</span>' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ul></div>";
  }
  if (!html) html = '<p style="color:var(--muted);font-size:14px;padding:8px">No chapters match that search. Try a shorter word like “RAG”, “MCP” or “agent”.</p>';
  document.getElementById("parts").innerHTML = html;
}

/* ---------- diagrams and charts ---------- */
let mermaidPromise = null, renderSeq = 0;
const svgCache = new Map();
function isDark(){
  const a = document.documentElement.getAttribute("data-theme");
  if (a) return a === "dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function ensureMermaid(){
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (mermaidPromise) return mermaidPromise;
  mermaidPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js";
    s.onload = () => {
      try{
        window.mermaid.initialize({ startOnLoad:false, securityLevel:"strict", theme: isDark() ? "dark" : "neutral",
          fontFamily:"IBM Plex Sans, system-ui, sans-serif", flowchart:{ curve:"basis", htmlLabels:true } });
        resolve(window.mermaid);
      }catch(e){ reject(e); }
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return mermaidPromise;
}
function fitSvg(div){
  const svg = div.querySelector("svg");
  if (!svg) return;
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Diagram");
  const vb = (svg.getAttribute("viewBox") || "").split(/\s+/).map(Number);
  const vbw = vb[2] || 0;
  if (vbw && div.clientWidth && div.clientWidth < vbw * 0.7){
    svg.style.maxWidth = "none";
    svg.style.width = Math.round(vbw * 0.85) + "px";
  }
}
function fmtNum(v){ return Number(v).toLocaleString("en-US", { maximumFractionDigits: 3 }); }
function renderChart(el, spec){
  const max = Math.max(...spec.data.map(d => d[1]));
  const unit = spec.unit || "";
  const sep = (unit === "%" || unit === "×") ? "" : " ";
  let rows = "";
  for (const [label, v] of spec.data){
    let w = spec.log ? (Math.log10(v + 1) / Math.log10(max + 1)) * 100 : (v / max) * 100;
    w = Math.max(w, 1.5);
    rows += '<div class="bar-row"><span class="bar-label">' + esc(String(label)) + '</span><span class="bar-track"><span class="bar" style="width:' + w.toFixed(1) + '%"></span></span><span class="bar-val">' + fmtNum(v) + sep + esc(unit) + '</span></div>';
  }
  const fig = document.createElement("figure");
  fig.className = "chart";
  fig.innerHTML = '<figcaption>' + esc(spec.title || "") + '</figcaption>' + rows + (spec.log ? '<div class="chart-note">Bar lengths use a logarithmic scale.</div>' : "");
  el.replaceWith(fig);
}
function enhance(root){
  root.querySelectorAll("code.language-chart").forEach(code => {
    const pre = code.closest("pre") || code;
    try{ renderChart(pre, JSON.parse(code.textContent)); }catch(e){}
  });
  const blocks = [...root.querySelectorAll("code.language-mermaid")];
  if (!blocks.length) return;
  const seq = ++renderSeq;
  const holders = blocks.map(code => {
    const pre = code.closest("pre") || code;
    const div = document.createElement("div");
    div.className = "diagram loading";
    div.textContent = "Loading diagram…";
    div.dataset.src = code.textContent;
    pre.replaceWith(div);
    if (svgCache.has(div.dataset.src)){ div.classList.remove("loading"); div.innerHTML = svgCache.get(div.dataset.src); div.dataset.done = "1"; fitSvg(div); }
    return div;
  }).filter(div => !div.dataset.done);
  if (!holders.length) return;
  ensureMermaid().then(async m => {
    for (let k = 0; k < holders.length; k++){
      const div = holders[k];
      if (seq !== renderSeq || !div.isConnected) return;
      const id = "mmd-" + seq + "-" + k;
      try{
        const out = await m.render(id, div.dataset.src);
        if (!div.isConnected) return;
        div.classList.remove("loading");
        div.innerHTML = out.svg;
        svgCache.set(div.dataset.src, out.svg);
        fitSvg(div);
      }catch(e){
        const junk = document.getElementById("d" + id); if (junk) junk.remove();
        div.classList.remove("loading");
        div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>";
      }
    }
  }).catch(() => {
    holders.forEach(div => { div.classList.remove("loading"); div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>"; });
  });
}

/* ---------- chapter view ---------- */
function renderChapter(id){
  const c = byId[id];
  const p = partOf(id);
  const ids = idsOf(p);
  const isDone = done.has(id);
  const tabs = ids.map(i =>
    '<button class="tab' + (i === id ? " active" : "") + '" role="tab" aria-selected="' + (i === id) + '" data-go="' + i + '">' +
    '<span class="dot' + (done.has(i) ? " on" : "") + '"></span><span class="tab-t">' + i + '. ' + esc(byId[i].title) + '</span></button>'
  ).join("");
  document.getElementById("main").innerHTML =
    '<p class="crumb">Part ' + p + ' of 20: ' + esc(PARTS[p-1]) + '</p>' +
    '<div class="tabs" role="tablist" aria-label="Chapters in this part">' + tabs + '</div>' +
    '<article>' +
      '<p class="ch-no">Chapter ' + id + ' of ' + TOTAL + '</p>' +
      '<h1 class="ch-title">' + esc(c.title) + '</h1>' +
      '<section class="box tldr"><h2>TL;DR</h2><p>' + inlineMd(c.tldr) + '</p></section>' +
      '<div class="body">' + md(c.body) + '</div>' +
      '<section class="box real"><h2>Real-world example</h2><p>' + inlineMd(c.real) + '</p></section>' +
      '<div class="done-bar">' +
        '<button class="complete' + (isDone ? " on" : "") + '" data-toggle="' + id + '" aria-pressed="' + isDone + '">' +
          '<span class="tick' + (isDone ? " on" : "") + '">' + TICK + '</span>' + (isDone ? "Completed" : "Mark as complete") + '</button>' +
        '<div class="nav">' +
          '<button class="btn" data-go="' + (id - 1) + '"' + (id === 1 ? " disabled" : "") + '>Previous</button>' +
          '<button class="btn" data-go="' + (id + 1) + '"' + (id === TOTAL ? " disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  enhance(document.getElementById("main"));
}

/* ---------- contents view ---------- */
function renderContents(){
  let html = '<div class="contents"><h1>Contents</h1>' +
    '<p class="lead">A practical engineering reference in twenty parts: foundations, context engineering, RAG, tools, agents, workflow patterns, frameworks, MCP, multi-agent systems, memory, coding agents, evaluation, LLMOps, production architecture, security, governance, fine-tuning and architecture case studies. Every chapter has an engineering card covering what the technology is, why it matters, when to use it and when not, trade-offs, failure modes and production habits. Tick a chapter when you finish it; your progress is saved. Models, prices, protocols and regulations change quickly, so confirm specifics against current documentation.</p>' +
    '<div class="contents-actions"><button class="btn" data-go="' + firstUnread() + '">' + (done.size ? "Continue with chapter " + firstUnread() : "Start chapter 1") + '</button>' +
    '<button class="btn" id="resetBtn">Reset progress</button></div><div class="grid">';
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const count = ids.filter(i => done.has(i)).length;
    html += '<section class="pcard"><h2>Part ' + p + ': ' + esc(PARTS[p-1]) + '</h2><div class="meta">' + count + ' of ' + PER + ' complete</div><ol>';
    for (const i of ids){
      html += '<li><button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="Toggle chapter ' + i + '">' + TICK + '</button><a href="#ch-' + i + '">' + i + '. ' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ol></section>";
  }
  document.getElementById("main").innerHTML = html + "</div></div>";
}
function firstUnread(){ for (let i = 1; i <= TOTAL; i++) if (!done.has(i)) return i; return TOTAL; }

/* ---------- routing ---------- */
let lastRendered = null;
function renderAll(){
  const id = currentId();
  renderBank(); renderSide();
  const y = window.scrollY;
  if (id) renderChapter(id); else renderContents();
  if (lastRendered === location.hash) window.scrollTo(0, y);
  lastRendered = location.hash;
}
function route(){
  const id = currentId();
  if (!id && location.hash !== "#contents"){
    let last = 0; try{ last = +localStorage.getItem(LS_LAST) || 0; }catch(e){}
    location.replace("#ch-" + (last >= 1 && last <= TOTAL ? last : 1));
    return;
  }
  if (id){ try{ localStorage.setItem(LS_LAST, id); }catch(e){} }
  document.body.classList.remove("drawer");
  renderAll();
  window.scrollTo(0, 0);
  const active = document.querySelector(".ch-row.active");
  if (active) active.scrollIntoView({block:"nearest"});
  const tab = document.querySelector(".tab.active");
  if (tab && tab.parentElement){ const r = tab.parentElement; const left = tab.offsetLeft - r.offsetLeft; if (left < r.scrollLeft || left + tab.offsetWidth > r.scrollLeft + r.clientWidth) r.scrollLeft = left - 16; }
}
function go(id){ if (id >= 1 && id <= TOTAL) location.hash = "#ch-" + id; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){ e.preventDefault(); toggle(+t.dataset.toggle); return; }
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled){ go(+g.dataset.go); return; }
  const ph = e.target.closest("[data-part]");
  if (ph){
    const p = +ph.dataset.part;
    const el = ph.parentElement;
    const isOpen = el.classList.toggle("open");
    if (isOpen) openParts.add(p); else openParts.delete(p);
    ph.setAttribute("aria-expanded", isOpen);
    return;
  }
  if (e.target.id === "resetBtn"){
    if (confirm("Clear all 200 ticks? This can’t be undone.")){ done.clear(); saveLocal(); pushRemote(); renderAll(); toast("Progress reset"); }
  }
});
document.getElementById("search").addEventListener("input", renderSide);
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.add("drawer"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = currentId(); if (!id) return;
  if (e.key === "ArrowRight") go(id + 1);
  else if (e.key === "ArrowLeft") go(id - 1);
});
function setTopH(){ document.documentElement.style.setProperty("--top-h", document.getElementById("top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);
window.addEventListener("hashchange", route);
setTopH();
route();
initSync();
</script>
</body>
</html>

 is | Choosing how knowledge reaches the model |\n| Why it matters | Architecture, cost and accuracy differ greatly |\n| Hybrid pattern | Retrieve relevant documents, then include them whole |\n| Key trade-off | Simplicity vs efficiency and control |\n| Common failure | Long context for every query on large corpora |\n| Production habit | Benchmark both on the same golden set |\n\n### Decision flow\n\n```mermaid\nflowchart TD\n  A{Corpus fits comfortably in context?} -- yes --> B{Changes rarely, same for all users?}\n  B -- yes --> LC[Long context + caching]\n  B -- no --> RAG[RAG]\n  A -- no --> RAG\n  RAG --> C{Answers need whole documents?}\n  C -- yes --> HYB[Retrieve docs, then long context]\n  C -- no --> CHUNK[Chunk-level RAG]\n```"}, {"id": 49, "title": "Handling unanswerable questions", "tldr": "A trustworthy RAG system says “I don’t know” when sources don’t contain the answer, rather than guessing. Detect low retrieval confidence, instruct refusal explicitly, measure refusal accuracy, and route gaps to humans or content owners.", "real": "Air Canada’s 2024 tribunal case showed the cost of a chatbot confidently stating an incorrect policy; designing for explicit uncertainty and escalation is now standard advice for customer-facing assistants.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Correctly declining when evidence is insufficient |\n| Why it matters | Wrong confident answers are worse than no answer |\n| Signals | Low retrieval scores, judge says unsupported, conflicting sources |\n| Key trade-off | Refusing too often frustrates users |\n| Common failure | Model answering from general knowledge about company-specific policy |\n| Production habit | Track both false refusals and false answers |\n\n### Behavior\n\n```mermaid\nflowchart LR\n  Q[Question] --> RET[Retrieve]\n  RET --> CONF{Evidence sufficient?}\n  CONF -- yes --> ANSWER[Grounded answer]\n  CONF -- no --> IDK[Say not found + offer escalation]\n  IDK --> GAP[Log content gap]\n```"}, {"id": 50, "title": "RAG production checklist", "tldr": "Before launch, confirm ingestion quality, permissions, retrieval and generation evals, grounding and refusal behavior, latency and cost budgets, monitoring, feedback loops, freshness, and incident procedures.", "real": "Teams publishing lessons from enterprise RAG deployments consistently report that data preparation, permissions and evaluation consumed more effort than model selection or prompt writing.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A launch gate for RAG systems |\n| Why it matters | Prevents predictable production failures |\n| Key trade-off | Launch speed vs readiness |\n| Production habit | Review the checklist at every major change |\n\n### Checklist\n\n- [ ] Sources inventoried, owned and current\n- [ ] Parsing verified on tables and complex layouts\n- [ ] Permissions enforced at retrieval; leakage tests pass\n- [ ] Hybrid retrieval + reranking evaluated\n- [ ] Golden set with unanswerable and adversarial cases\n- [ ] Recall@k, faithfulness and citation precision meet targets\n- [ ] “I don’t know” behavior verified\n- [ ] p95 latency and cost per answer within budget\n- [ ] Tracing of retrieved chunks and prompt versions\n- [ ] Feedback capture and weekly error analysis\n- [ ] Incremental indexing with deletion handling\n- [ ] Prompt injection tests on ingested content"}, {"id": 51, "title": "What tool use is", "tldr": "Tool use (function calling) lets a model request actions by emitting structured calls to functions you define; your code executes them and returns results to the model. Tools connect models to live data, computation and real-world actions.", "real": "OpenAI introduced function calling in its API in June 2023 and Anthropic made tool use generally available in May 2024; the 2023 Toolformer paper had shown models could learn when to call external tools.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Model emits structured tool calls; application executes them |\n| Why it matters | Turns a text generator into a system that can look things up and act |\n| When to use | Live data, calculations, transactions, integrations |\n| When not to use | Information already in context; actions too risky to automate |\n| Key trade-off | Capability vs security and reliability risk |\n| Common failure | Model calls tools with wrong arguments or at the wrong time |\n| Production habit | Validate every tool input; log every call and result |\n\n### Tool call flow\n\n```mermaid\nsequenceDiagram\n  participant U as User\n  participant A as App\n  participant M as Model\n  participant T as Tool\n  U->>A: \"What's the status of order 981?\"\n  A->>M: Message + tool definitions\n  M-->>A: tool_use get_order(order_id=981)\n  A->>T: Execute with validation\n  T-->>A: {\"status\": \"shipped\"}\n  A->>M: tool_result\n  M-->>A: \"Order 981 has shipped.\"\n  A-->>U: Answer\n```"}, {"id": 52, "title": "Designing tool schemas", "tldr": "Tool schemas define names, descriptions and typed parameters. Good tools are few, focused, clearly named, use simple flat parameters with enums and constraints, and match how a human expert would think about the task.", "real": "Anthropic’s 2025 guidance “Writing effective tools for agents” recommended consolidating related operations, returning meaningful context instead of raw IDs, and using evaluations to iterate on tool design, since tools are a new kind of interface designed for models.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The contract between model and your functions |\n| Why it matters | Poor schemas cause wrong calls and wasted tokens |\n| Good practices | Clear names, enums, required fields, examples, units |\n| Key trade-off | Fewer, broader tools vs many narrow ones |\n| Common failure | Exposing raw internal APIs with dozens of cryptic parameters |\n| Production habit | Evaluate tool-call accuracy when changing schemas |\n\n### Example (Anthropic tool format)\n\n```json\n{\n  \"name\": \"search_orders\",\n  \"description\": \"Search a customer's orders. Use when the user asks about order status, delivery or history. Returns at most 10 orders, newest first.\",\n  \"input_schema\": {\n    \"type\": \"object\",\n    \"properties\": {\n      \"customer_id\": {\"type\": \"string\", \"description\": \"Customer ID, e.g. 'cus_42'\"},\n      \"status\": {\"type\": \"string\", \"enum\": [\"any\", \"pending\", \"shipped\", \"delivered\", \"cancelled\"]},\n      \"since\": {\"type\": \"string\", \"description\": \"ISO date, e.g. 2026-01-01\"}\n    },\n    \"required\": [\"customer_id\"]\n  }\n}\n```"}, {"id": 53, "title": "Tool descriptions are prompts", "tldr": "Models choose tools based on names and descriptions. Write descriptions like documentation for a smart new colleague: when to use the tool, when not to, what it returns, limits, and examples of good inputs.", "real": "Berkeley’s Function Calling Leaderboard (BFCL), launched in 2024, evaluates how accurately models select tools and fill arguments, and results show tool selection degrades when tool descriptions are ambiguous or many tools overlap.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Natural-language guidance attached to each tool |\n| Why it matters | Determines tool selection accuracy |\n| Include | Purpose, when to use, when not, return shape, limits |\n| Key trade-off | Detail vs total prompt size with many tools |\n| Common failure | Two tools with overlapping descriptions confusing the model |\n| Production habit | Review tool descriptions like API docs |\n\n### Weak vs strong description\n\n| Weak | Strong |\n|---|---|\n| “Gets data.” | “Fetch a customer’s open support tickets. Use before answering questions about existing issues. Returns ticket id, subject, status, last update. Does not include closed tickets.” |"}, {"id": 54, "title": "The tool execution loop", "tldr": "The application runs a loop: send messages and tools, receive tool calls, validate and execute them, append results, and call the model again until it returns a final answer or a limit is reached. Enforce iteration, time and cost limits.", "real": "Agent SDKs such as the OpenAI Agents SDK and Anthropic’s Claude Agent SDK implement this loop with built-in limits, tracing and handoffs, but the underlying pattern is a simple while loop around the model API.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Orchestration code that alternates model calls and tool executions |\n| Why it matters | Where reliability, limits and safety are enforced |\n| Must include | Max iterations, timeouts, error handling, logging |\n| Key trade-off | Autonomy vs control |\n| Common failure | Infinite loops repeating the same failing call |\n| Production habit | Detect repeated identical calls and stop |\n\n### Loop (Anthropic Python SDK)\n\n```python\nimport anthropic, json\n\nclient = anthropic.Anthropic()\n\ndef run(messages, tools, handlers, max_steps=10):\n    for _ in range(max_steps):\n        resp = client.messages.create(\n            model=\"claude-sonnet-5-5\", max_tokens=1024,\n            tools=tools, messages=messages,\n        )\n        messages.append({\"role\": \"assistant\", \"content\": resp.content})\n        if resp.stop_reason != \"tool_use\":\n            return resp\n        results = []\n        for block in resp.content:\n            if block.type == \"tool_use\":\n                output = handlers[block.name](**block.input)   # validate inside handler\n                results.append({\"type\": \"tool_result\", \"tool_use_id\": block.id,\n                                \"content\": json.dumps(output)})\n        messages.append({\"role\": \"user\", \"content\": results})\n    raise RuntimeError(\"step limit reached\")\n```"}, {"id": 55, "title": "Parallel tool calls", "tldr": "Models can request several independent tool calls in one turn, such as fetching weather for three cities. Execute them concurrently to cut latency, but keep dependent calls sequential and handle partial failures.", "real": "Major model APIs from OpenAI and Anthropic support multiple tool calls in a single response, and applications that execute them concurrently can significantly reduce end-to-end latency for multi-source lookups.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Multiple tool calls emitted and executed in one step |\n| Why it matters | Fewer round trips, lower latency |\n| When to use | Independent lookups |\n| When not to use | Calls with side effects that depend on order |\n| Key trade-off | Speed vs complexity of partial failures |\n| Common failure | Running dependent writes in parallel |\n| Production habit | Return a result (or error) for every call ID |\n\n### Concurrent execution\n\n```python\nimport asyncio\n\nasync def execute_all(calls, handlers):\n    async def one(call):\n        try:\n            return call.id, await handlers[call.name](**call.input), False\n        except Exception as e:\n            return call.id, {\"error\": str(e)}, True\n    return await asyncio.gather(*(one(c) for c in calls))\n```"}, {"id": 56, "title": "Tool errors and recovery", "tldr": "Tools fail: invalid arguments, timeouts, permission errors, empty results. Return clear, actionable error messages to the model so it can correct itself, distinguish retryable from fatal errors, and never expose sensitive internals.", "real": "Agent frameworks commonly return tool errors as tool results flagged as errors (for example Anthropic’s `is_error` field on tool results), letting the model retry with corrected parameters instead of crashing the workflow.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Handling failed tool calls gracefully |\n| Why it matters | Models can self-correct if told what went wrong |\n| Good error message | What failed, why, how to fix |\n| Key trade-off | Helpful detail vs leaking internals |\n| Common failure | Returning stack traces or silently returning empty results |\n| Production habit | Classify errors: invalid input, not found, transient, forbidden |\n\n### Error messages\n\n| Bad | Good |\n|---|---|\n| `500 Internal Server Error` | “Order 98I not found. Order IDs are numeric, e.g. 981.” |\n| `KeyError: 'date'` | “Missing required field: since (an ISO date).” |\n| Stack trace | “Payment service temporarily unavailable; retry in 30 s.” |"}, {"id": 57, "title": "Tool results: size and format", "tldr": "Tool outputs consume context. Return only what the model needs, in a readable format, with pagination, truncation and summaries for large results. Prefer meaningful names over opaque IDs.", "real": "Anthropic’s guidance on writing tools for agents recommended limiting response sizes, offering concise and detailed response modes, and returning human-readable fields rather than technical identifiers to improve agent performance and reduce tokens.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Designing what tools return to the model |\n| Why it matters | Large outputs bloat context, raise cost and degrade reasoning |\n| Techniques | Field selection, pagination, truncation notices, summaries |\n| Key trade-off | Completeness vs focus |\n| Common failure | Returning full API JSON with hundreds of fields |\n| Production habit | Set a token cap per tool result |\n\n### Truncation pattern\n\n```python\ndef format_results(rows, limit=10):\n    shown = rows[:limit]\n    text = \"\\n\".join(f\"- #{r['id']} {r['subject']} ({r['status']})\" for r in shown)\n    if len(rows) > limit:\n        text += f\"\\n[{len(rows) - limit} more results; refine filters or request page 2]\"\n    return text\n```"}, {"id": 58, "title": "Side effects, idempotency and confirmation", "tldr": "Read-only tools are low risk; tools that write, pay, send or delete need safeguards: idempotency keys, confirmation steps, dry-run modes, limits and audit logs. Agents may retry or repeat calls.", "real": "In July 2025, an AI coding agent on Replit deleted a production database during a code freeze despite instructions not to make changes; Replit responded by separating development and production databases, illustrating why destructive tools need hard controls.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Controls for tools that change the world |\n| Why it matters | Mistakes and retries become real-world damage |\n| Techniques | Idempotency keys, approvals, dry runs, limits, reversibility |\n| Key trade-off | Automation speed vs safety |\n| Common failure | Duplicate refunds or emails after retries |\n| Production habit | Classify each tool by risk level |\n\n### Risk tiers\n\n| Tier | Example | Control |\n|---|---|---|\n| Read | Search orders | Auto |\n| Reversible write | Draft email, add tag | Auto + log |\n| External effect | Send email, create ticket | Confirm or policy limits |\n| Financial / destructive | Refund, delete | Human approval, hard limits |"}, {"id": 59, "title": "Tool security and permissions", "tldr": "Tools run with real credentials, so apply least privilege: scope credentials to the user and task, enforce authorization in tool code (not prompts), validate inputs, and sandbox code execution.", "real": "In May 2025, Invariant Labs showed that a malicious GitHub issue could cause an agent connected to the GitHub MCP server with broad access to leak data from private repositories, demonstrating the risk of over-privileged tool credentials.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Ensuring tools can only do what the current user and task allow |\n| Why it matters | A manipulated model can call any tool it has |\n| Principles | User-scoped auth, least privilege, server-side checks |\n| Key trade-off | Broad tokens are convenient but dangerous |\n| Common failure | Agent using a service account with admin rights for every user |\n| Production habit | Authorization checks in every tool handler |\n\n### Authorization in code, not prompts\n\n```python\ndef get_invoice(ctx, invoice_id: str):\n    invoice = db.invoices.get(invoice_id)\n    if invoice is None or invoice.tenant_id != ctx.user.tenant_id:\n        return {\"error\": \"Invoice not found\"}   # don't reveal existence\n    return invoice.public_fields()\n```"}, {"id": 60, "title": "Tool ecosystems and MCP: introduction", "tldr": "As tools multiply, standard protocols help: the Model Context Protocol (MCP) lets any compatible AI application use tools, resources and prompts from MCP servers, so integrations are built once and reused across clients.", "real": "Anthropic released MCP in November 2024; OpenAI, Google and Microsoft adopted it during 2025, and in December 2025 it was donated to the Linux Foundation’s Agentic AI Foundation, which reported more than 10,000 published MCP servers.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A standard protocol connecting AI applications to tools and data |\n| Why it matters | Avoids building N × M custom integrations |\n| When to use | Reusable integrations, multiple AI clients, ecosystem plays |\n| When not needed | A single app with a few internal functions |\n| Key trade-off | Standardization vs extra process boundary and security surface |\n| Common failure | Installing unvetted third-party servers |\n| Production habit | Allow-list servers; review their tools and permissions |\n\n### N × M problem\n\n```mermaid\nflowchart LR\n  subgraph Clients\n    C1[Chat app]\n    C2[IDE agent]\n    C3[Internal agent]\n  end\n  subgraph Servers\n    S1[GitHub MCP]\n    S2[Database MCP]\n    S3[CRM MCP]\n  end\n  C1 --> S1\n  C1 --> S2\n  C2 --> S1\n  C3 --> S3\n```\n\nPart 10 covers MCP architecture, servers, auth and security in depth."}, {"id": 61, "title": "What an AI agent is", "tldr": "An agent is a system where a model dynamically directs its own process and tool use to accomplish a goal, deciding what to do next based on results. A workflow, by contrast, follows predefined code paths with models at fixed steps.", "real": "Anthropic’s December 2024 article “Building effective agents” distinguished workflows (“LLMs and tools orchestrated through predefined code paths”) from agents (where “LLMs dynamically direct their own processes and tool usage”), a distinction widely adopted in industry.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Model-driven loop of reasoning, acting and observing toward a goal |\n| Why it matters | Handles open-ended tasks where steps can’t be predetermined |\n| When to use | Variable, multi-step tasks with verifiable progress |\n| When not to use | Predictable tasks a workflow handles more cheaply and reliably |\n| Key trade-off | Flexibility vs predictability, cost and latency |\n| Common failure | Using an agent where a three-step workflow would do |\n| Production habit | Start with the simplest design; add autonomy only when evals show the need |\n\n### Spectrum\n\n```mermaid\nflowchart LR\n  CALL[Single LLM call] --> AUG[Augmented LLM: retrieval, tools, memory]\n  AUG --> WF[Workflows: predefined paths]\n  WF --> AGENT[Agents: model-directed loops]\n  AGENT --> MULTI[Multi-agent systems]\n```"}, {"id": 62, "title": "The agent loop", "tldr": "Agents run a loop: observe state and goal, decide the next action, call a tool, observe the result, update context, and repeat until done or a limit is hit. Each loop step is an opportunity for errors, so design for verification and stopping.", "real": "The ReAct paper (Yao et al., 2022) formalized interleaving reasoning traces with actions and observations, showing better performance on knowledge and decision tasks than reasoning or acting alone; it became the template for most agent loops.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Iterative think → act → observe cycle |\n| Why it matters | The core runtime of every agent |\n| Components | Model, tools, context manager, stopping logic, state |\n| Key trade-off | More iterations raise success on hard tasks and cost on all tasks |\n| Common failure | Errors compounding across many steps |\n| Production habit | Budgets for steps, tokens, time and money |\n\n### Loop\n\n```mermaid\nflowchart LR\n  GOAL[Goal + context] --> THINK[Decide next action]\n  THINK --> ACT[Call tool]\n  ACT --> OBS[Observe result]\n  OBS --> UPDATE[Update context / state]\n  UPDATE --> DONE{Goal met or limit?}\n  DONE -- no --> THINK\n  DONE -- yes --> FINAL[Final answer / outcome]\n```"}, {"id": 63, "title": "Planning", "tldr": "Planning breaks goals into steps before or during execution. Explicit plans improve long tasks, make progress visible and enable human review, but plans must be revised as new information arrives.", "real": "Plan-and-execute designs such as “Plan-and-Solve Prompting” (Wang et al., 2023) and planning modes in coding agents, where the agent proposes a plan for user approval before editing files, are common ways to improve reliability on long tasks.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Producing and maintaining a sequence of intended steps |\n| Why it matters | Reduces wandering; enables checkpoints |\n| When to use | Tasks with many dependent steps |\n| When not to use | Simple one- or two-tool tasks |\n| Key trade-off | Upfront planning cost vs fewer wasted actions |\n| Common failure | Following a stale plan after new facts appear |\n| Production habit | Store the plan in state; replan on failures |\n\n### Plan representation\n\n```json\n{\n  \"goal\": \"Migrate payment service to new SDK\",\n  \"steps\": [\n    {\"id\": 1, \"task\": \"List current SDK call sites\", \"status\": \"done\"},\n    {\"id\": 2, \"task\": \"Update client initialization\", \"status\": \"in_progress\"},\n    {\"id\": 3, \"task\": \"Update error handling\", \"status\": \"pending\"},\n    {\"id\": 4, \"task\": \"Run tests and fix failures\", \"status\": \"pending\"}\n  ]\n}\n```"}, {"id": 64, "title": "Agent memory: an overview", "tldr": "Agents need several kinds of memory: working memory (current context), short-term session memory, and long-term memory of facts, past episodes and learned procedures. Each needs explicit storage, retrieval and update rules.", "real": "The “Generative Agents” paper (Park et al., 2023) used a memory stream with retrieval by recency, importance and relevance plus periodic reflection, and MemGPT (2023) treated the context window like virtual memory managed by the agent.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Mechanisms for retaining information across steps and sessions |\n| Why it matters | Context windows are finite; tasks and users persist |\n| Types | Working, session, semantic (facts), episodic (events), procedural (how-to) |\n| Key trade-off | Remembering more vs relevance, privacy and cost |\n| Common failure | Storing everything and retrieving noise |\n| Production habit | Explicit write policies and user controls |\n\n### Memory types\n\n| Type | Example | Storage |\n|---|---|---|\n| Working | Current task context | Context window |\n| Session | This conversation | Message history, summaries |\n| Semantic | “User prefers metric units” | Key-value / vector store |\n| Episodic | “Last week’s deploy failed due to X” | Event log + retrieval |\n| Procedural | “How to release service A” | Skills, instructions files |\n\nPart 12 covers memory engineering in depth."}, {"id": 65, "title": "State management", "tldr": "Agent state includes the goal, plan, history, intermediate results, artifacts and status. Keep state explicit and serializable outside the model so runs can be inspected, resumed after failures and audited.", "real": "LangGraph models agents as state graphs with checkpointing, so runs can pause for human input and resume later, and durable execution engines such as Temporal are used to persist long-running agent workflows across crashes.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The structured record of an agent run |\n| Why it matters | Enables resumption, debugging and human review |\n| Store | Goal, plan, steps taken, tool results summary, artifacts, budget used |\n| Key trade-off | Detailed state vs storage and privacy |\n| Common failure | State only in the prompt history, lost on crash |\n| Production habit | Checkpoint after every step |\n\n### Example state\n\n```python\nfrom dataclasses import dataclass, field\n\n@dataclass\nclass AgentState:\n    run_id: str\n    goal: str\n    plan: list[dict] = field(default_factory=list)\n    notes: list[str] = field(default_factory=list)\n    artifacts: dict[str, str] = field(default_factory=dict)\n    steps: int = 0\n    tokens_used: int = 0\n    status: str = \"running\"   # running | waiting_for_human | done | failed\n```"}, {"id": 66, "title": "Stopping conditions and budgets", "tldr": "Agents must know when to stop: goal achieved and verified, no progress, budget exhausted, user input needed, or unsafe state detected. Explicit limits prevent runaway loops and cost explosions.", "real": "Multi-agent research reported by Anthropic in 2025 found its research agents used about 15 times more tokens than chat interactions, so production agent systems commonly enforce token, step and spend budgets per task.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Rules that end or pause an agent run |\n| Why it matters | Prevents infinite loops, waste and unsafe actions |\n| Conditions | Success verified, max steps, max tokens/cost, repeated actions, timeout |\n| Key trade-off | Tight budgets fail hard tasks; loose budgets waste money |\n| Common failure | Agent declares success without verification |\n| Production habit | Require evidence of completion (tests, checks) |\n\n### Stop logic\n\n```python\ndef should_stop(state, last_actions):\n    if state.status == \"done\" and verified(state):\n        return \"success\"\n    if state.steps >= 40 or state.tokens_used >= 400_000:\n        return \"budget_exhausted\"\n    if len(last_actions) >= 3 and len(set(last_actions[-3:])) == 1:\n        return \"no_progress\"          # same action three times in a row\n    return None\n```"}, {"id": 67, "title": "Levels of autonomy", "tldr": "Define how much an agent may do without humans: suggest, draft, act with approval, act within limits, or act fully autonomously. Increase autonomy gradually based on measured reliability and the reversibility of actions.", "real": "The SAE J3016 standard’s levels of driving automation (0 to 5) are widely borrowed to describe AI agent autonomy, and coding agents expose similar settings, from asking approval for every command to auto-accepting edits.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Explicit policy on agent independence |\n| Why it matters | Matches risk to reliability |\n| Key trade-off | Throughput vs control |\n| Common failure | Full autonomy granted after a few good demos |\n| Production habit | Different autonomy per action type |\n\n### Levels\n\n| Level | Agent | Human |\n|---|---|---|\n| 1 Suggest | Proposes | Decides and acts |\n| 2 Draft | Prepares actions | Approves each |\n| 3 Routine auto | Acts on routine cases | Approves exceptions |\n| 4 Bounded auto | Acts within policy limits | Audits samples |\n| 5 Full auto | Acts freely | Sets goals |"}, {"id": 68, "title": "When not to build an agent", "tldr": "Many tasks are better served by a single LLM call, retrieval, or a fixed workflow. Agents add cost, latency and unpredictability; use them only when steps genuinely can’t be predetermined and the value justifies the cost.", "real": "Gartner predicted in June 2025 that over 40% of agentic AI projects would be canceled by the end of 2027 due to escalating costs, unclear business value or inadequate risk controls.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Recognizing tasks unsuited to agentic designs |\n| Why it matters | Saves cost and avoids reliability problems |\n| Prefer workflow when | Steps are known, order is fixed, outputs predictable |\n| Prefer single call when | One transformation suffices |\n| Key trade-off | Engineering effort vs runtime flexibility |\n| Common failure | “Agent-washing” simple features |\n| Production habit | Prototype as a workflow first |\n\n### Decision flow\n\n```mermaid\nflowchart TD\n  A{One model call enough?} -- yes --> CALL[Single call]\n  A -- no --> B{Steps known in advance?}\n  B -- yes --> WF[Workflow]\n  B -- no --> C{Progress verifiable + value high?}\n  C -- yes --> AGENT[Agent with budgets]\n  C -- no --> RETHINK[Rethink scope / human process]\n```"}, {"id": 69, "title": "Anatomy of a production agent", "tldr": "A production agent combines a capable model, a focused system prompt, a small set of well-designed tools, context management, state persistence, guardrails, budgets, human checkpoints, tracing and evaluation.", "real": "Coding agents such as Claude Code, OpenAI’s Codex and GitHub Copilot’s coding agent illustrate this anatomy: project instruction files, tool permissions, sandboxed execution, test-based verification and visible step logs.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The full set of components around the agent loop |\n| Why it matters | The model is only one component of reliability |\n| Key trade-off | Each safeguard adds latency or friction |\n| Common failure | Strong model, weak harness |\n| Production habit | Review all components in design reviews |\n\n### Components\n\n```mermaid\nflowchart TB\n  MODEL[Model] --- PROMPT[System prompt + instructions files]\n  MODEL --- TOOLS[Tools with permissions]\n  MODEL --- CTX[Context manager: retrieval, compaction]\n  LOOP[Agent loop] --- STATE[State + checkpoints]\n  LOOP --- GUARD[Guardrails + approvals]\n  LOOP --- BUDGET[Budgets + stop rules]\n  LOOP --- TRACE[Tracing + evals]\n  MODEL --- LOOP\n```"}, {"id": 70, "title": "Agent reliability fundamentals", "tldr": "Reliability across many steps compounds: 95% per step means about 60% over 10 steps. Improve it with fewer steps, better tools, verification after key steps, retries, checkpoints, narrow scope and human escalation.", "real": "Sierra’s tau-bench (2024) introduced the pass^k metric, the probability that an agent succeeds on all k repeated trials of a task, and found that consistency dropped sharply as k increased even for strong models.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Achieving consistent success across steps and runs |\n| Why it matters | Users need agents that work every time, not sometimes |\n| Key metrics | Task success, pass^k, intervention rate |\n| Key trade-off | Verification steps add cost but prevent compounding errors |\n| Common failure | Measuring a single successful run as “works” |\n| Production habit | Run each eval task multiple times |\n\n### Compounding\n\n```chart\n{\"title\": \"Task success if each step succeeds 95% of the time\", \"unit\": \"%\", \"data\": [[\"1 step\", 95], [\"5 steps\", 77], [\"10 steps\", 60], [\"20 steps\", 36], [\"40 steps\", 13]]}\n```"}, {"id": 71, "title": "Prompt chaining", "tldr": "Prompt chaining splits a task into sequential LLM calls where each step processes the previous output, with optional programmatic checks between steps. It trades latency for accuracy by making each call simpler.", "real": "Anthropic’s “Building effective agents” (2024) lists prompt chaining as the first workflow pattern, with examples such as generating marketing copy and then translating it, or writing an outline, checking it, then writing the document.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Fixed sequence of focused LLM calls with gates |\n| Why it matters | Simpler steps are more reliable and testable |\n| When to use | Tasks decomposable into fixed subtasks |\n| When not to use | Steps that vary by input |\n| Key trade-off | More calls and latency vs higher accuracy |\n| Common failure | Errors early in the chain propagating silently |\n| Production habit | Validate output at each gate |\n\n### Pattern\n\n```mermaid\nflowchart LR\n  IN[Input] --> S1[LLM: extract facts]\n  S1 --> G1{Gate: valid?}\n  G1 -- yes --> S2[LLM: draft summary]\n  S2 --> S3[LLM: translate]\n  S3 --> OUT[Output]\n  G1 -- no --> ERR[Retry / fail]\n```"}, {"id": 72, "title": "Routing", "tldr": "Routing classifies an input and sends it to a specialized prompt, model, tool set or workflow. It lets each path be optimized separately and allows cheap models for easy requests and strong models for hard ones.", "real": "Customer service systems commonly route general questions, refund requests and technical issues to different flows, and model routing research such as RouteLLM (2024) showed routers can cut costs while keeping quality close to the strongest model.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Classifying inputs to choose a specialized path |\n| Why it matters | Specialization improves quality and cost |\n| When to use | Distinct categories needing different handling |\n| Key trade-off | Router errors misdirect requests |\n| Common failure | No fallback for low-confidence classifications |\n| Production habit | Evaluate router accuracy and log routes |\n\n### Pattern\n\n```mermaid\nflowchart LR\n  IN[Request] --> R[Router: small model or classifier]\n  R -->|billing| B[Billing flow]\n  R -->|technical| T[Tech support agent]\n  R -->|simple FAQ| F[Cheap model + RAG]\n  R -->|unclear| H[Clarify / human]\n```"}, {"id": 73, "title": "Parallelization: sectioning and voting", "tldr": "Run LLM calls in parallel either on independent subtasks (sectioning) or on the same task multiple times to aggregate answers (voting). Parallelization reduces latency or increases confidence.", "real": "Anthropic’s guidance gives examples such as running guardrail screening in parallel with the main response (sectioning) and reviewing code for vulnerabilities with several prompts and flagging if any finds a problem (voting).", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Concurrent LLM calls with aggregation |\n| Why it matters | Speed (sectioning) or reliability (voting) |\n| When sectioning | Independent aspects, e.g. reviewing sections of a document |\n| When voting | High-stakes judgments, safety checks |\n| Key trade-off | Cost multiplies with parallel calls |\n| Common failure | Aggregation logic that hides disagreement |\n| Production habit | Log individual votes, not only the result |\n\n### Pattern\n\n```mermaid\nflowchart LR\n  IN[Input] --> A[LLM call A]\n  IN --> B[LLM call B]\n  IN --> C[LLM call C]\n  A --> AGG[Aggregate: merge or vote]\n  B --> AGG\n  C --> AGG\n  AGG --> OUT[Output]\n```"}, {"id": 74, "title": "Orchestrator–workers", "tldr": "A central orchestrator model breaks a task into subtasks dynamically, delegates them to worker calls or sub-agents, and synthesizes results. Unlike parallelization, subtasks are decided at runtime.", "real": "Coding agents that change many files and research systems that spawn parallel searchers, such as Anthropic’s 2025 multi-agent research system with a lead agent and subagents, use the orchestrator–workers pattern.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Dynamic task decomposition with delegated execution |\n| Why it matters | Handles tasks whose subtasks can’t be predicted |\n| When to use | Multi-file code changes, broad research |\n| When not to use | Fixed subtasks (use parallelization) |\n| Key trade-off | Flexibility vs coordination overhead and cost |\n| Common failure | Workers duplicating effort due to vague instructions |\n| Production habit | Orchestrator gives each worker a clear objective, format and boundaries |\n\n### Pattern\n\n```mermaid\nflowchart TB\n  TASK[Task] --> ORCH[Orchestrator: plan subtasks]\n  ORCH --> W1[Worker 1]\n  ORCH --> W2[Worker 2]\n  ORCH --> W3[Worker N]\n  W1 --> SYN[Orchestrator: synthesize]\n  W2 --> SYN\n  W3 --> SYN\n  SYN --> OUT[Result]\n```"}, {"id": 75, "title": "Evaluator–optimizer", "tldr": "One LLM generates output and another evaluates it against criteria and gives feedback; the loop repeats until the output passes or a limit is reached. It works when clear evaluation criteria exist and iteration measurably helps.", "real": "The Reflexion paper (Shinn et al., 2023) showed that agents improved on coding and reasoning tasks by reflecting on feedback from failed attempts, and evaluator–optimizer loops are used in translation, writing and code generation.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Generate → critique → revise loop |\n| Why it matters | Improves quality when feedback is actionable |\n| When to use | Clear criteria: tests, style guides, factual checks |\n| When not to use | Vague goals where the critic adds noise |\n| Key trade-off | Quality vs multiple calls per output |\n| Common failure | Endless loops or critic and generator agreeing on wrong answers |\n| Production habit | Prefer objective evaluators (tests, validators) over LLM opinion |\n\n### Pattern\n\n```mermaid\nflowchart LR\n  GEN[Generator] --> OUT[Draft]\n  OUT --> EVAL[Evaluator: criteria, tests]\n  EVAL -->|fail + feedback| GEN\n  EVAL -->|pass| FINAL[Final]\n```"}, {"id": 76, "title": "Plan-and-execute", "tldr": "A planner produces a step-by-step plan; an executor carries out steps with tools; a replanner adjusts the plan when results deviate. This separates strategic reasoning from execution and makes progress inspectable.", "real": "LangChain and LangGraph popularized plan-and-execute agent templates in 2023–2024, and coding agents commonly offer a planning mode where users approve a plan before any files are changed.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Separate planning and execution phases with replanning |\n| Why it matters | Better long-horizon coherence; human-reviewable plans |\n| When to use | Long tasks with dependencies |\n| Key trade-off | Planning overhead vs fewer wasted actions |\n| Common failure | Plans too detailed to survive reality |\n| Production habit | Plan at the right granularity; replan on failure |\n\n### Pattern\n\n```mermaid\nflowchart LR\n  GOAL[Goal] --> PLAN[Planner]\n  PLAN --> EXEC[Executor: step i]\n  EXEC --> CHECK{Step OK?}\n  CHECK -- yes --> NEXT{More steps?}\n  NEXT -- yes --> EXEC\n  NEXT -- no --> DONE[Done]\n  CHECK -- no --> REPLAN[Replanner]\n  REPLAN --> EXEC\n```"}, {"id": 77, "title": "Reflection and self-critique", "tldr": "Asking a model to review its own output against criteria can catch errors, but self-critique without external signals is unreliable. Combine reflection with tests, tool checks, retrieval verification or separate evaluator prompts.", "real": "Research such as “Large Language Models Cannot Self-Correct Reasoning Yet” (Huang et al., 2023) found that self-correction without external feedback often failed to improve, or even worsened, reasoning accuracy.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Model reviews and revises its own work |\n| Why it matters | Cheap way to catch format and obvious errors |\n| When effective | With external evidence: test results, tool outputs, sources |\n| When weak | Pure reasoning without new information |\n| Key trade-off | Extra calls vs modest gains |\n| Common failure | Model “confirming” its own mistake |\n| Production habit | Feed concrete evidence into the reflection step |\n\n### Grounded reflection\n\n```mermaid\nflowchart LR\n  DRAFT[Draft code] --> TEST[Run tests]\n  TEST --> RESULT[Failures + logs]\n  RESULT --> REFLECT[Model analyzes failures]\n  REFLECT --> FIX[Revise]\n  FIX --> TEST\n```"}, {"id": 78, "title": "Human-in-the-loop checkpoints", "tldr": "Insert human approval or input at points of high risk or ambiguity: before irreversible actions, when confidence is low, or when plans change significantly. Design checkpoints so runs pause, persist state and resume cleanly.", "real": "LangGraph supports interrupts that pause graph execution for human input and resume from a checkpoint, and browser agents such as OpenAI’s ChatGPT agent ask users to confirm consequential actions like purchases.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Pausing agent execution for human decisions |\n| Why it matters | Combines automation with accountability |\n| When to use | Irreversible, costly, sensitive or ambiguous steps |\n| Key trade-off | Safety vs throughput and approval fatigue |\n| Common failure | Asking approval for everything, so humans rubber-stamp |\n| Production habit | Risk-based approvals with clear, concise review screens |\n\n### Checkpoint flow\n\n```mermaid\nflowchart LR\n  STEP[Agent proposes refund $480] --> RISK{Above $200?}\n  RISK -- no --> AUTO[Execute + log]\n  RISK -- yes --> PAUSE[Persist state, notify approver]\n  PAUSE --> DECIDE{Approved?}\n  DECIDE -- yes --> AUTO\n  DECIDE -- no --> ALT[Agent informs customer / alternative]\n```"}, {"id": 79, "title": "Durable and long-running workflows", "tldr": "Long agent runs must survive crashes, deploys, rate limits and human waits. Durable execution persists each step’s result so workflows resume where they stopped, with retries and timeouts per step.", "real": "Temporal, an open-source durable execution platform originating from Uber’s Cadence project, is used by companies to run long-running workflows reliably, and has been adopted for orchestrating AI agent workflows.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Workflow engines that persist progress and replay safely |\n| Why it matters | Agent runs can last minutes to days |\n| When to use | Multi-step, long, expensive or human-in-the-loop flows |\n| Key trade-off | Infrastructure complexity vs reliability |\n| Common failure | Re-running expensive or side-effecting steps after a crash |\n| Production habit | Make each step idempotent; checkpoint results |\n\n### Durable execution\n\n```mermaid\nflowchart LR\n  S1[Step 1: research - persisted] --> S2[Step 2: draft - persisted]\n  S2 --> CRASH[Worker crash]\n  CRASH --> RESUME[New worker resumes at step 3]\n  RESUME --> S3[Step 3: review]\n```"}, {"id": 80, "title": "Choosing a workflow pattern", "tldr": "Choose the simplest pattern that solves the task: single call, chaining, routing, parallelization, orchestrator–workers, evaluator–optimizer, plan-and-execute or a full agent. Combine patterns where needed and measure each addition.", "real": "Anthropic’s guidance concluded that successful implementations used simple, composable patterns rather than complex frameworks, adding complexity only when it demonstrably improved outcomes.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Matching orchestration patterns to task structure |\n| Why it matters | Over-engineering adds cost and failure modes |\n| Key trade-off | Flexibility vs predictability |\n| Production habit | Document the pattern choice and the eval evidence for it |\n\n### Pattern selector\n\n| Task structure | Pattern |\n|---|---|\n| Fixed steps | Prompt chaining |\n| Distinct input categories | Routing |\n| Independent subtasks | Parallelization (sectioning) |\n| Need confidence | Parallelization (voting) |\n| Subtasks unknown upfront | Orchestrator–workers |\n| Clear quality criteria | Evaluator–optimizer |\n| Long dependent steps | Plan-and-execute |\n| Open-ended, tool-heavy | Agent loop |\n| Risky actions | Add human checkpoints |\n| Long-running | Add durable execution |"}, {"id": 81, "title": "The agent framework landscape", "tldr": "Agent frameworks provide loops, tool integration, state, memory, multi-agent coordination, tracing and deployment helpers. Major options include LangGraph, OpenAI Agents SDK, Claude Agent SDK, Google ADK, Microsoft Agent Framework, CrewAI, LlamaIndex, Pydantic AI and smolagents.", "real": "The ecosystem consolidated quickly: OpenAI released its Agents SDK in March 2025, Google its Agent Development Kit in April 2025, Anthropic renamed the Claude Code SDK to the Claude Agent SDK in September 2025, and Microsoft merged AutoGen and Semantic Kernel into the Microsoft Agent Framework in October 2025.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Libraries for building and running agents |\n| Why it matters | Speeds development; shapes architecture and lock-in |\n| Key trade-off | Productivity vs abstraction leaks and dependency churn |\n| Common failure | Framework magic hiding prompts and making debugging hard |\n| Production habit | Understand the underlying API calls your framework makes |\n\n### Landscape\n\n| Framework | Strength |\n|---|---|\n| LangGraph | Explicit state graphs, checkpoints, human-in-the-loop |\n| OpenAI Agents SDK | Lightweight agents, handoffs, guardrails, tracing |\n| Claude Agent SDK | Agent harness from Claude Code: files, shell, tools, context management |\n| Google ADK | Multi-agent apps, Google Cloud integration |\n| Microsoft Agent Framework | Enterprise .NET/Python, AutoGen + Semantic Kernel lineage |\n| CrewAI | Role-based multi-agent crews |\n| LlamaIndex | Data/RAG-centric agents and workflows |\n| Pydantic AI | Type-safe Python agents |"}, {"id": 82, "title": "Framework or plain code?", "tldr": "Plain code around model APIs gives full control and transparency for simple agents and workflows. Frameworks pay off for complex state, durable checkpoints, multi-agent coordination and built-in tracing. Many teams start plain and adopt frameworks deliberately.", "real": "Anthropic’s “Building effective agents” recommended that developers start by using LLM APIs directly, since many patterns take only a few lines of code, and understand the underlying code if they use a framework.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Deciding how much orchestration to outsource |\n| Why it matters | Affects debuggability, flexibility and maintenance |\n| Plain code fits | Single-agent loops, workflows, tight latency |\n| Framework fits | Graphs with branches, persistence, HITL, multi-agent |\n| Key trade-off | Control vs built-in capabilities |\n| Common failure | Rewriting framework internals later because of hidden behavior |\n| Production habit | Wrap frameworks behind your own interfaces |\n\n### Decision matrix\n\n| Need | Plain code | Framework |\n|---|---|---|\n| Simple tool loop | ✓ | Optional |\n| Checkpointing and resume | Build it | ✓ |\n| Visual graph of flows | ✗ | ✓ |\n| Tracing | Add OTel | Often built in |\n| Team familiarity | Universal | Learning curve |"}, {"id": 83, "title": "Stateful graphs with LangGraph", "tldr": "LangGraph models applications as graphs of nodes (functions or LLM calls) operating on shared typed state, with conditional edges, loops, checkpoints and interrupts. It suits complex workflows and agents needing persistence and human review.", "real": "LangGraph, from the LangChain team, reached version 1.0 in October 2025 and has been used by companies building production agents because of its explicit control flow and checkpointing.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Graph-based orchestration with persistent state |\n| Why it matters | Makes complex flows explicit and resumable |\n| When to use | Branching workflows, long-running agents, HITL |\n| Key trade-off | Graph design effort vs control and visibility |\n| Common failure | Overly complex graphs for simple tasks |\n| Production habit | Keep state minimal and typed |\n\n### Minimal graph\n\n```python\nfrom typing import TypedDict\nfrom langgraph.graph import StateGraph, START, END\n\nclass State(TypedDict):\n    question: str\n    context: str\n    answer: str\n\ndef retrieve(state: State) -> dict:\n    return {\"context\": search(state[\"question\"])}\n\ndef generate(state: State) -> dict:\n    return {\"answer\": llm_answer(state[\"question\"], state[\"context\"])}\n\nbuilder = StateGraph(State)\nbuilder.add_node(\"retrieve\", retrieve)\nbuilder.add_node(\"generate\", generate)\nbuilder.add_edge(START, \"retrieve\")\nbuilder.add_edge(\"retrieve\", \"generate\")\nbuilder.add_edge(\"generate\", END)\ngraph = builder.compile()\n\ngraph.invoke({\"question\": \"What is our refund window?\"})\n```"}, {"id": 84, "title": "OpenAI Agents SDK", "tldr": "The OpenAI Agents SDK provides a lightweight set of primitives: agents with instructions and tools, handoffs between agents, guardrails for input and output validation, sessions for memory, and built-in tracing.", "real": "OpenAI released the Agents SDK in March 2025 as a production-ready successor to its experimental Swarm library from 2024, alongside the Responses API.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Python/TypeScript SDK for agents, handoffs and guardrails |\n| Why it matters | Minimal abstractions with tracing built in |\n| When to use | OpenAI-centric stacks, handoff-based multi-agent flows |\n| Key trade-off | Simplicity vs fewer advanced orchestration features |\n| Common failure | Too many handoffs creating confusing conversations |\n| Production habit | Use guardrails and trace every run |\n\n### Example\n\n```python\nfrom agents import Agent, Runner, function_tool\n\n@function_tool\ndef get_order_status(order_id: str) -> str:\n    \"\"\"Return the shipping status of an order.\"\"\"\n    return lookup_status(order_id)\n\nsupport = Agent(\n    name=\"Support agent\",\n    instructions=\"Help customers with order questions. Be concise.\",\n    tools=[get_order_status],\n)\n\nresult = Runner.run_sync(support, \"Where is order 981?\")\nprint(result.final_output)\n```"}, {"id": 85, "title": "Claude Agent SDK", "tldr": "The Claude Agent SDK exposes the agent harness behind Claude Code: file operations, shell commands, search, tool permissions, subagents, MCP integration and automatic context management, for building general-purpose agents in Python or TypeScript.", "real": "Anthropic renamed the Claude Code SDK to the Claude Agent SDK in September 2025, noting that the same harness powering its coding agent was being used to build agents for research, support, finance and other domains.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | SDK for agents with built-in tools, permissions and context management |\n| Why it matters | Reuses a proven long-running agent harness |\n| When to use | Agents working with files, code, shells or many tools |\n| Key trade-off | Powerful default tools vs need for careful permissions |\n| Common failure | Allowing broad shell access in production environments |\n| Production habit | Explicit allowed tools, sandboxed working directory |\n\n### Example (Python)\n\n```python\nimport anyio\nfrom claude_agent_sdk import query, ClaudeAgentOptions\n\nasync def main():\n    options = ClaudeAgentOptions(\n        system_prompt=\"You are a code auditor. Report findings; do not edit files.\",\n        allowed_tools=[\"Read\", \"Grep\", \"Glob\"],\n        max_turns=10,\n    )\n    async for message in query(prompt=\"Find hard-coded secrets in src/\", options=options):\n        print(message)\n\nanyio.run(main)\n```"}, {"id": 86, "title": "Structured agent outputs and contracts", "tldr": "Agents that feed other systems should end with structured, validated outputs: typed results, status codes, evidence and confidence, rather than free text. Define contracts between agents and downstream code.", "real": "Frameworks such as Pydantic AI and the OpenAI Agents SDK let developers declare typed output models for agents, so results are validated before downstream code uses them.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Typed final outputs from agent runs |\n| Why it matters | Downstream automation needs reliable data |\n| Include | Result, status, evidence, open issues |\n| Key trade-off | Strict schemas can force premature conclusions |\n| Common failure | Parsing prose summaries with regexes |\n| Production habit | Validate and reject invalid outputs |\n\n### Output contract\n\n```python\nfrom pydantic import BaseModel\nfrom typing import Literal\n\nclass ResearchResult(BaseModel):\n    status: Literal[\"complete\", \"partial\", \"failed\"]\n    answer: str\n    sources: list[str]\n    open_questions: list[str]\n    confidence: Literal[\"high\", \"medium\", \"low\"]\n```"}, {"id": 87, "title": "Streaming and agent UX", "tldr": "Agents can take seconds to minutes. Stream tokens, tool calls and progress events to the UI so users see what the agent is doing, can interrupt it and trust its work. Design event types deliberately.", "real": "Coding agents and research assistants show live step logs, such as files read, commands run and searches performed, because visibility into agent actions was found to build user trust and enable early correction.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Real-time delivery of agent progress and output |\n| Why it matters | Perceived latency, trust and control |\n| Event types | Text delta, tool call started/finished, plan update, approval request, error, done |\n| Key trade-off | Detail vs noise |\n| Common failure | Silent spinner for two minutes |\n| Production habit | Server-sent events or WebSockets with typed events |\n\n### Event stream\n\n```json\n{\"type\": \"plan\", \"steps\": [\"Search docs\", \"Compare plans\", \"Draft answer\"]}\n{\"type\": \"tool_start\", \"tool\": \"search_docs\", \"args\": {\"q\": \"premium plan limits\"}}\n{\"type\": \"tool_end\", \"tool\": \"search_docs\", \"summary\": \"4 results\"}\n{\"type\": \"text_delta\", \"text\": \"The premium plan allows...\"}\n{\"type\": \"done\", \"usage\": {\"input_tokens\": 18234, \"output_tokens\": 612}}\n```"}, {"id": 88, "title": "Agent configuration as code", "tldr": "Define agents declaratively: model, prompts, tools, permissions, budgets, guardrails and evaluation suites in versioned configuration. This enables reviews, reproducibility, environment differences and safe rollouts.", "real": "Coding agents read project-level configuration and instruction files (such as AGENTS.md or CLAUDE.md, and settings files defining allowed tools), illustrating agent behavior defined as versioned files rather than hidden settings.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Versioned, declarative agent definitions |\n| Why it matters | Behavior changes are reviewable and reversible |\n| Key trade-off | Configuration flexibility vs complexity |\n| Common failure | Different agent settings in each environment, undocumented |\n| Production habit | Every config change runs agent evals |\n\n### Example config\n\n```yaml\nagent: support-triage\nmodel: claude-sonnet-5-5\nprompt_version: triage-v14\ntools: [search_kb, get_order, create_ticket]\npermissions:\n  create_ticket: auto\n  issue_refund: deny\nbudgets:\n  max_steps: 12\n  max_tokens: 120000\nguardrails: [pii_redaction, injection_scan]\nevals: [triage-golden-v6, safety-suite-v3]\n```"}, {"id": 89, "title": "Testing agent code", "tldr": "Test agents at several levels: unit tests for tools and parsers, mocked-model tests for control flow, recorded-trajectory replays, and live evals on task suites. Deterministic tests catch code bugs; evals catch behavior regressions.", "real": "Agent frameworks provide test utilities, such as fake models in Pydantic AI and LangChain, so developers can test orchestration logic deterministically without calling paid model APIs.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Verifying agent code and behavior |\n| Why it matters | Agents fail in both code and model behavior |\n| Levels | Unit, mocked model, replay, live eval |\n| Key trade-off | Deterministic speed vs realistic coverage |\n| Common failure | Only manual testing in a chat window |\n| Production habit | CI runs unit + mocked tests on every PR; evals before release |\n\n### Mocked model test\n\n```python\n# FakeModel, tool_call, text and run_agent are project test helpers (illustrative)\ndef test_agent_stops_after_tool_error():\n    fake = FakeModel(responses=[\n        tool_call(\"get_order\", {\"order_id\": \"x\"}),\n        text(\"I couldn't find that order. Can you check the ID?\"),\n    ])\n    result = run_agent(model=fake, tools={\"get_order\": lambda **_: {\"error\": \"not found\"}})\n    assert \"couldn't find\" in result.final_text\n    assert fake.calls == 2\n```"}, {"id": 90, "title": "Choosing a framework", "tldr": "Choose by requirements: model provider flexibility, state and persistence needs, multi-agent support, observability, language, deployment model, maturity and team skills. Prototype the hardest part of your use case in each candidate.", "real": "Many organizations standardize on one orchestration approach per language after early experimentation with several frameworks, because mixed abstractions complicate tracing, evaluation and onboarding.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structured framework evaluation |\n| Why it matters | Frameworks are hard to replace later |\n| Key trade-off | Ecosystem momentum vs stability |\n| Production habit | Write an architecture decision record for the choice |\n\n### Evaluation criteria\n\n| Criterion | Question |\n|---|---|\n| Model flexibility | Works with multiple providers? |\n| State and persistence | Checkpoints, resume, HITL? |\n| Multi-agent | Handoffs, supervisors? |\n| Observability | OpenTelemetry, tracing UI? |\n| Testing | Fake models, replay? |\n| Deployment | Self-hosted, managed runtime? |\n| Maturity | Versioning, breaking change history? |\n| Escape hatches | Can you drop to raw API calls? |"}, {"id": 91, "title": "MCP architecture", "tldr": "The Model Context Protocol connects AI applications (hosts) to external capabilities through MCP clients and servers. Servers expose tools (actions), resources (data) and prompts (templates); clients can offer sampling, roots and elicitation to servers.", "real": "Anthropic open-sourced MCP in November 2024 using JSON-RPC 2.0 messages, drawing inspiration from the Language Server Protocol that standardized how editors talk to language tooling.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A client–server protocol for giving AI apps tools and context |\n| Why it matters | Reusable integrations across many AI clients |\n| Core primitives | Tools, resources, prompts (server); sampling, roots, elicitation (client) |\n| Key trade-off | Interoperability vs another component to secure and operate |\n| Common failure | Treating MCP servers as trusted by default |\n| Production habit | Inventory and review every connected server |\n\n### Architecture\n\n```mermaid\nflowchart LR\n  HOST[Host app: chat, IDE, agent] --> C1[MCP client]\n  HOST --> C2[MCP client]\n  C1 --> S1[MCP server: GitHub]\n  C2 --> S2[MCP server: internal DB]\n  S1 --> API1[GitHub API]\n  S2 --> DB[(Database)]\n```\n\n### Primitives\n\n| Primitive | Controlled by | Example |\n|---|---|---|\n| Tools | Model | create_issue, run_query |\n| Resources | Application | file contents, schema docs |\n| Prompts | User | “/summarize-pr” template |"}, {"id": 92, "title": "MCP transports and deployment", "tldr": "MCP runs over stdio for local servers launched by the client, or Streamable HTTP for remote servers. Local servers suit developer tools; remote servers suit shared enterprise integrations with authentication, scaling and monitoring.", "real": "The March 2025 MCP specification introduced the Streamable HTTP transport, replacing the earlier HTTP with Server-Sent Events transport, to better support remote and serverless deployments.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How MCP messages travel between client and server |\n| Why it matters | Determines deployment, security and scaling model |\n| stdio | Local process; inherits user’s machine access |\n| Streamable HTTP | Remote service; needs auth, TLS, rate limits |\n| Key trade-off | Local simplicity vs centrally managed remote servers |\n| Common failure | Local servers with broad filesystem or credential access |\n| Production habit | Prefer remote, managed servers for shared enterprise data |\n\n### Comparison\n\n| | stdio (local) | Streamable HTTP (remote) |\n|---|---|---|\n| Launch | Client starts process | Always-on service |\n| Auth | Local credentials | OAuth-based authorization |\n| Scaling | Per user | Shared, horizontally scaled |\n| Best for | IDE tools, local files | Enterprise systems, SaaS integrations |"}, {"id": 93, "title": "Building an MCP server", "tldr": "An MCP server wraps an API or data source and exposes a small set of well-described tools and resources. Official SDKs make simple servers a few lines of code; production servers add auth, validation, pagination, limits and logging.", "real": "Official MCP SDKs exist for Python, TypeScript, Java, Kotlin, C# and other languages, and companies including GitHub, Atlassian, Stripe and Cloudflare publish MCP servers for their platforms.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A service exposing tools/resources via MCP |\n| Why it matters | Makes your system usable by any MCP-compatible agent |\n| Good design | Few task-oriented tools, concise outputs, clear errors |\n| Key trade-off | Mirroring every API endpoint vs curated agent-friendly tools |\n| Common failure | One tool per REST endpoint, overwhelming models |\n| Production habit | Evaluate tool use with real agent tasks |\n\n### Minimal server (Python SDK)\n\n```python\nfrom mcp.server.fastmcp import FastMCP\n\nmcp = FastMCP(\"orders\")\n\n@mcp.tool()\ndef get_order_status(order_id: str) -> str:\n    \"\"\"Return the status of an order by its numeric ID, e.g. '981'.\"\"\"\n    order = orders_db.get(order_id)\n    return f\"Order {order_id}: {order.status}\" if order else f\"Order {order_id} not found\"\n\n@mcp.resource(\"orders://policies/returns\")\ndef returns_policy() -> str:\n    \"\"\"The current returns policy text.\"\"\"\n    return load_policy(\"returns\")\n\nif __name__ == \"__main__\":\n    mcp.run()          # stdio by default\n```"}, {"id": 94, "title": "MCP authorization", "tldr": "Remote MCP servers must authenticate users and authorize actions. The MCP specification builds on OAuth 2.1 so clients obtain scoped tokens on behalf of users; servers must validate tokens issued for them and enforce per-user permissions.", "real": "The MCP specification added OAuth 2.1-based authorization in March 2025 and revised it in June 2025 to treat MCP servers as OAuth resource servers and require resource indicators (RFC 8707), reducing token misuse across servers.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | User-delegated, scoped access for MCP servers |\n| Why it matters | Agents must act with the user’s permissions, not a superuser’s |\n| Key elements | OAuth flows, scoped tokens, audience validation, consent |\n| Key trade-off | Fine-grained scopes vs user friction |\n| Common failure | Token passthrough: forwarding client tokens to downstream APIs |\n| Production habit | Validate token audience; least-privilege scopes |\n\n### Flow\n\n```mermaid\nsequenceDiagram\n  participant U as User\n  participant C as MCP client\n  participant AS as Authorization server\n  participant S as MCP server\n  C->>S: Request without token\n  S-->>C: 401 + resource metadata\n  C->>AS: OAuth authorization (user consents)\n  AS-->>C: Access token for this server\n  C->>S: Request with token\n  S->>S: Validate audience + scopes\n  S-->>C: Tool result\n```"}, {"id": 95, "title": "MCP security risks", "tldr": "MCP introduces risks: tool poisoning (malicious instructions in tool descriptions), rug pulls (tools changing after approval), prompt injection through tool results, over-privileged servers, confused deputy problems and supply-chain attacks on server packages.", "real": "Invariant Labs disclosed “tool poisoning” attacks in April 2025, showing hidden instructions in an MCP tool’s description could make an agent exfiltrate data from other connected servers, such as private files or messages.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Threats specific to connecting agents to many tool servers |\n| Why it matters | One malicious server can influence an agent using all others |\n| Key trade-off | Ecosystem openness vs control |\n| Common failure | Users installing arbitrary community servers with production credentials |\n| Production habit | Allow-lists, pinned versions, description review, isolation |\n\n### Threats and mitigations\n\n| Threat | Mitigation |\n|---|---|\n| Tool poisoning | Review and pin tool descriptions; alert on changes |\n| Rug pull | Version pinning, change detection |\n| Injection via results | Treat outputs as untrusted; limit tool combinations |\n| Over-privilege | Scoped tokens per server |\n| Confused deputy | Per-user authorization, consent |\n| Malicious packages | Vetted registry, signed builds |"}, {"id": 96, "title": "MCP registries and governance", "tldr": "Organizations need governance for MCP: an approved catalog, security review, ownership, versioning, monitoring of usage and a process for retiring servers. Registries help discovery but don’t guarantee safety.", "real": "The MCP project launched an official MCP Registry in preview in September 2025 as a central metadata catalog of public MCP servers, and enterprises increasingly run private registries of approved servers.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Processes and catalogs for managing MCP servers |\n| Why it matters | Uncontrolled servers are a security and reliability risk |\n| Key elements | Approved list, owners, security review, versioning, audit logs |\n| Key trade-off | Developer speed vs control |\n| Common failure | Shadow MCP servers with production data access |\n| Production habit | Gateway that logs and enforces policies on MCP traffic |\n\n### Governance flow\n\n```mermaid\nflowchart LR\n  REQ[Request new server] --> REVIEW[Security + data review]\n  REVIEW --> CATALOG[Add to private registry]\n  CATALOG --> GW[MCP gateway: auth, logging, policy]\n  GW --> USE[Agents use approved servers]\n  USE --> AUDIT[Usage audit + periodic re-review]\n```"}, {"id": 97, "title": "Agent-to-agent protocols: A2A", "tldr": "While MCP connects agents to tools, the Agent2Agent (A2A) protocol lets independent agents discover each other’s capabilities, exchange messages, delegate tasks and stream results across vendors and organizations.", "real": "Google announced A2A in April 2025 with dozens of partners and contributed it to the Linux Foundation in June 2025; A2A agents publish an “Agent Card” describing their skills and endpoints.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A protocol for agents to collaborate as peers |\n| Why it matters | Enables cross-team and cross-company agent ecosystems |\n| Key concepts | Agent Card, tasks with lifecycle states, messages, artifacts |\n| MCP vs A2A | MCP: agent ↔ tools/data; A2A: agent ↔ agent |\n| Key trade-off | Interoperability vs trust and security between agents |\n| Common failure | Delegating tasks to external agents without verification |\n| Production habit | Authenticate agents; validate returned artifacts |\n\n### Interaction\n\n```mermaid\nflowchart LR\n  CLIENT[Client agent] -->|discover| CARD[Agent Card]\n  CLIENT -->|send task| REMOTE[Remote agent]\n  REMOTE -->|status updates| CLIENT\n  REMOTE -->|artifacts| CLIENT\n  REMOTE --> TOOLS[Its own tools via MCP]\n```"}, {"id": 98, "title": "Context files: AGENTS.md and project instructions", "tldr": "Agents work better with explicit project context: conventions, commands, architecture notes and rules. Standard files such as AGENTS.md give any agent a predictable place to find instructions; keep them concise, accurate and versioned.", "real": "AGENTS.md was launched in 2025 by OpenAI and others as a simple open format for coding agent instructions; when it was contributed to the Agentic AI Foundation in December 2025, it was reported to be used by more than 60,000 open-source projects.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Markdown files giving agents project-specific guidance |\n| Why it matters | Reduces repeated mistakes and wasted exploration |\n| Include | Build/test commands, conventions, architecture, do/don’t rules |\n| Key trade-off | Detail vs context cost and staleness |\n| Common failure | Outdated instructions agents follow faithfully |\n| Production habit | Review context files in code review; keep them short |\n\n### Example\n\n```markdown\n# AGENTS.md\n## Commands\n- Install: `uv sync`\n- Test: `uv run pytest -q`\n- Lint: `uv run ruff check .`\n\n## Conventions\n- Python 3.12, type hints required\n- Database access only through `app/repositories/`\n\n## Rules\n- Never edit files in `migrations/` by hand\n- Run tests before declaring a task done\n```"}, {"id": 99, "title": "Agent skills and progressive disclosure", "tldr": "Skills package instructions, scripts and resources for specific tasks into folders that agents load only when relevant. Progressive disclosure keeps context lean: the agent sees short descriptions first and reads full instructions on demand.", "real": "Anthropic introduced Agent Skills in October 2025: folders containing a SKILL.md file with a name and description, plus optional scripts and reference files, which Claude loads only when a task matches the skill.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Modular, loadable expertise for agents |\n| Why it matters | Scales agent capabilities without bloating every prompt |\n| When to use | Repeatable procedures: report formats, deployment steps, house styles |\n| Key trade-off | Many skills vs discoverability and maintenance |\n| Common failure | Vague skill descriptions so the right skill isn’t loaded |\n| Production habit | Write precise descriptions; test that skills trigger correctly |\n\n### Progressive disclosure\n\n```mermaid\nflowchart LR\n  START[Agent sees skill names + descriptions] --> MATCH{Task matches a skill?}\n  MATCH -- yes --> LOAD[Read SKILL.md]\n  LOAD --> MORE[Load referenced files/scripts as needed]\n  MATCH -- no --> CONT[Continue without loading]\n```"}, {"id": 100, "title": "Interoperability strategy", "tldr": "Plan how your AI systems connect: expose internal capabilities as MCP servers, consume external tools through governed gateways, adopt A2A where independent agents must collaborate, and standardize context files and skills across teams.", "real": "The Linux Foundation’s Agentic AI Foundation, launched in December 2025 with MCP, Block’s goose and AGENTS.md as founding projects, signaled industry convergence on open standards for agent interoperability.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | An organization-wide approach to agent integration standards |\n| Why it matters | Prevents fragmentation and duplicated integrations |\n| Key trade-off | Early standardization vs evolving protocols |\n| Common failure | Every team inventing its own tool plugin format |\n| Production habit | Platform team owns gateways, registries and templates |\n\n### Layered strategy\n\n| Layer | Standard / approach |\n|---|---|\n| Tools and data | MCP servers behind a gateway |\n| Agent collaboration | A2A where cross-agent delegation is needed |\n| Project context | AGENTS.md / instruction files |\n| Reusable procedures | Skills |\n| Observability | OpenTelemetry GenAI conventions |\n| Identity | OAuth, workload identity for agents |"}, {"id": 101, "title": "When to use multiple agents", "tldr": "Multiple agents help when work is broad and parallelizable, when subtasks need very different context or tools, or when context isolation prevents overload. They add coordination cost, token usage and new failure modes, so use them only when a single agent clearly struggles.", "real": "In June 2025 Cognition published “Don’t Build Multi-Agents”, arguing that context sharing between agents is fragile, while Anthropic the same month described a multi-agent research system that outperformed a single agent on broad research tasks; both views hold for different task types.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Systems where several model instances cooperate |\n| Why it matters | Can scale breadth and isolate context |\n| When to use | Breadth-first research, parallel independent subtasks, separation of duties |\n| When not to use | Tightly coupled tasks needing shared evolving context (e.g. single coherent code change) |\n| Key trade-off | Parallelism and specialization vs coordination errors and cost |\n| Common failure | Agents making conflicting assumptions |\n| Production habit | Prove a single-agent baseline first |\n\n### Decision guide\n\n| Task property | Single agent | Multi-agent |\n|---|---|---|\n| Subtasks independent | Possible | ✓ |\n| Shared evolving context | ✓ | Risky |\n| Very large search space | Limited by context | ✓ |\n| Tight latency/cost budget | ✓ | ✗ |"}, {"id": 102, "title": "Supervisor (orchestrator) architecture", "tldr": "A supervisor agent receives the task, delegates subtasks to specialized subagents, and integrates their results. Subagents get focused instructions and isolated context; only summaries flow back to the supervisor.", "real": "Anthropic’s 2025 multi-agent research system used a lead agent that planned research and spawned 3–5 subagents in parallel, each exploring different aspects and returning condensed findings.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Hierarchical delegation from one coordinator |\n| Why it matters | Keeps control and synthesis in one place |\n| When to use | Research, analysis, multi-source tasks |\n| Key trade-off | Supervisor becomes a bottleneck and single point of failure |\n| Common failure | Vague delegation causing duplicated or missing work |\n| Production habit | Subtask briefs with objective, output format, tools and boundaries |\n\n### Architecture\n\n```mermaid\nflowchart TB\n  USER[Task] --> SUP[Supervisor]\n  SUP -->|brief A| A[Subagent: web research]\n  SUP -->|brief B| B[Subagent: internal docs]\n  SUP -->|brief C| C[Subagent: data analysis]\n  A -->|summary| SUP\n  B -->|summary| SUP\n  C -->|summary| SUP\n  SUP --> OUT[Synthesized answer]\n```"}, {"id": 103, "title": "Hierarchical multi-agent systems", "tldr": "For very large tasks, supervisors can manage sub-supervisors, forming hierarchies similar to organizations. Hierarchies scale breadth but multiply cost, latency and opportunities for miscommunication.", "real": "LangGraph documents hierarchical agent teams as a pattern where top-level supervisors coordinate team-level supervisors, each managing their own worker agents.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Nested supervisors and workers |\n| Why it matters | Divides very large problems |\n| When to use | Large research or analysis programs with distinct domains |\n| Key trade-off | Scale vs compounding information loss |\n| Common failure | Summaries losing critical details at each level |\n| Production habit | Limit depth to two levels unless evals prove otherwise |\n\n### Structure\n\n```mermaid\nflowchart TB\n  TOP[Top supervisor] --> T1[Team lead: market research]\n  TOP --> T2[Team lead: technical analysis]\n  T1 --> W1[Worker]\n  T1 --> W2[Worker]\n  T2 --> W3[Worker]\n  T2 --> W4[Worker]\n```"}, {"id": 104, "title": "Handoffs and swarm patterns", "tldr": "In handoff designs, agents transfer control of a conversation to a more suitable agent (for example triage → billing → technical support), passing context along. There may be no central supervisor; each agent decides when to hand off.", "real": "OpenAI’s experimental Swarm library (2024) and its successor, the OpenAI Agents SDK (2025), made handoffs a first-class primitive, where an agent can transfer the conversation to another agent with different instructions and tools.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Peer agents passing control based on the situation |\n| Why it matters | Natural fit for customer service and staged processes |\n| When to use | Conversations moving through distinct specialties |\n| Key trade-off | Flexible flow vs harder global control |\n| Common failure | Ping-pong handoffs between agents |\n| Production habit | Handoff rules, loop detection, shared conversation summary |\n\n### Flow\n\n```mermaid\nflowchart LR\n  TRIAGE[Triage agent] -->|billing issue| BILL[Billing agent]\n  TRIAGE -->|bug report| TECH[Technical agent]\n  BILL -->|needs refund approval| HUMAN[Human agent]\n  TECH -->|account question| BILL\n```"}, {"id": 105, "title": "Debate, critique and consensus", "tldr": "Several agents can argue, critique or vote to improve answers on reasoning and judgment tasks. Gains depend on diverse perspectives and good aggregation; identical agents often converge on the same mistakes.", "real": "A 2023 paper by Du et al., “Improving Factuality and Reasoning in Language Models through Multiagent Debate”, reported improved accuracy on math and factual tasks when multiple model instances debated their answers over several rounds.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Multiple agents challenging or voting on answers |\n| Why it matters | Can surface errors a single pass misses |\n| When to use | High-stakes judgments, reviews, ambiguous analysis |\n| Key trade-off | Multiplied cost vs accuracy gains |\n| Common failure | Groupthink among agents with identical prompts |\n| Production habit | Vary roles, models or evidence; measure gains vs single agent |\n\n### Pattern\n\n```mermaid\nflowchart LR\n  Q[Question] --> A1[Agent: proponent]\n  Q --> A2[Agent: skeptic]\n  Q --> A3[Agent: domain expert]\n  A1 --> JUDGE[Judge / aggregator]\n  A2 --> JUDGE\n  A3 --> JUDGE\n  JUDGE --> ANS[Answer + dissent notes]\n```"}, {"id": 106, "title": "Shared state and blackboard architectures", "tldr": "Agents can coordinate through shared state: a blackboard, task board, shared files or database where agents post findings and claim work. Shared state needs structure, ownership and conflict handling.", "real": "The blackboard architecture dates to 1970s AI research such as the Hearsay-II speech understanding system, and modern multi-agent coding setups often coordinate through shared task lists, files and git branches.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A common workspace agents read from and write to |\n| Why it matters | Decouples agents; persists progress |\n| When to use | Many agents working on shared artifacts |\n| Key trade-off | Flexibility vs consistency and conflicts |\n| Common failure | Two agents editing the same artifact simultaneously |\n| Production habit | Claim/lock work items; structured entries |\n\n### Task board example\n\n```json\n[\n  {\"id\": \"T1\", \"ta

R\n  USERS[Users] --> CDN[CDN + WAF]\n  CDN --> ALB[Load balancer: public subnets]\n  ALB --> APP[App containers: private subnets × 3 AZ]\n  APP --> CACHE[(Cache)]\n  APP --> DB[(Managed DB: multi-AZ)]\n  APP --> S3[(Object storage)]\n  APP --> SM[Secrets manager]\n```"}, {"id": 193, "title": "Capstone: a Kubernetes platform with GitOps", "tldr": "Build a production Kubernetes platform: managed clusters from IaC, Karpenter or managed node scaling, Gateway API ingress, cert-manager, External Secrets, Argo CD, policy engine, observability stack and golden-path templates.", "real": "This capstone combines CNCF graduated and incubating projects (Kubernetes, Argo, Prometheus, cert-manager, Kyverno, OpenTelemetry) commonly assembled into internal Kubernetes platforms.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Provisioning | Terraform modules for clusters and node pools |\n| Delivery | Argo CD app-of-apps per cluster |\n| Security | Pod Security restricted, Kyverno policies, image verification |\n| Add-ons | Gateway API controller, cert-manager, External Secrets, metrics stack |\n| Operations | Upgrade cadence, backups, cost allocation |\n\n### Platform stack\n\n| Layer | Component |\n|---|---|\n| Infrastructure | Terraform: VPC, EKS/GKE/AKS |\n| GitOps | Argo CD |\n| Ingress | Gateway API implementation |\n| Certificates | cert-manager |\n| Secrets | External Secrets Operator |\n| Policy | Kyverno |\n| Observability | OTel Collector, Prometheus, Loki, Tempo, Grafana |"}, {"id": 194, "title": "Capstone: a secure CI/CD pipeline", "tldr": "Build a pipeline that tests, scans, builds signed images with SBOMs and provenance, deploys through GitOps with canaries, and uses OIDC instead of stored cloud credentials, with least-privilege permissions and pinned actions.", "real": "This capstone applies SLSA and OpenSSF recommendations together with GitHub Actions OIDC, Sigstore signing and admission-time signature verification.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Source | Protected branches, required reviews |\n| CI | Lint, tests, SAST, dependency and IaC scans |\n| Build | Image + SBOM + provenance, signed keylessly |\n| Deploy | PR to GitOps repo; canary via Argo Rollouts |\n| Credentials | OIDC; no long-lived secrets |\n\n### Pipeline\n\n```mermaid\nflowchart LR\n  PR[Pull request] --> CHECKS[Tests + scans]\n  CHECKS --> MERGE[Merge to main]\n  MERGE --> BUILD[Build image + SBOM + provenance]\n  BUILD --> SIGN[Sign with cosign]\n  SIGN --> GITOPS[Update digest in GitOps repo]\n  GITOPS --> VERIFY[Admission verifies signature]\n  VERIFY --> CANARY[Canary rollout]\n```"}, {"id": 195, "title": "Capstone: an observability stack", "tldr": "Build observability for a platform: OpenTelemetry instrumentation and collectors, metrics in Prometheus-compatible storage, logs in Loki or OpenSearch, traces in Tempo or Jaeger, Grafana dashboards, SLO burn-rate alerts and on-call routing.", "real": "The Grafana LGTM stack (Loki, Grafana, Tempo, Mimir) and managed equivalents from cloud providers are common choices for open-standard observability platforms.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Instrumentation | OTel SDKs + auto-instrumentation |\n| Collection | OTel Collector (agent + gateway) |\n| Storage | Metrics, logs, traces backends with retention tiers |\n| Visualization | Standard dashboards as code |\n| Alerting | SLO burn-rate alerts to on-call |\n\n### Data flow\n\n```mermaid\nflowchart LR\n  SVC[Services] --> AGENT[OTel agent]\n  AGENT --> GW[OTel gateway: sampling, filtering]\n  GW --> MIMIR[(Metrics)]\n  GW --> LOKI[(Logs)]\n  GW --> TEMPO[(Traces)]\n  MIMIR --> GRAFANA[Grafana]\n  LOKI --> GRAFANA\n  TEMPO --> GRAFANA\n  GRAFANA --> ALERTS[Alerting → on-call]\n```"}, {"id": 196, "title": "Capstone: a disaster recovery plan", "tldr": "Write and test a DR plan: classify workloads by RTO and RPO, choose strategies (backup/restore to warm standby), replicate data and infrastructure code to a second region, automate failover steps and run drills with timing.", "real": "This capstone follows the AWS disaster recovery whitepaper’s four strategies and the lesson from GitLab’s 2017 incident that untested backups and recovery procedures fail when needed.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Classification | Tier 1 (RTO 15 min), tier 2 (4 h), tier 3 (24 h) |\n| Data | Cross-region replication / backups with PITR |\n| Infrastructure | IaC deployable to DR region |\n| Runbook | Step-by-step failover and failback |\n| Testing | Quarterly drills with measured RTO/RPO |\n\n### Workload tiers\n\n| Tier | Example | Strategy |\n|---|---|---|\n| 1 | Checkout | Warm standby |\n| 2 | Internal tools | Pilot light |\n| 3 | Reporting | Backup and restore |"}, {"id": 197, "title": "Well-architected reviews", "tldr": "Review workloads against the pillars of cloud architecture frameworks: operational excellence, security, reliability, performance efficiency, cost optimization and sustainability. Turn findings into prioritized backlog items.", "real": "The AWS Well-Architected Framework, published in 2015 and expanded with a sustainability pillar in 2021, and its Azure and Google Cloud counterparts provide structured questions and tools for workload reviews.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structured architecture assessment |\n| Why it matters | Systematic risk discovery |\n| Production habit | Annual reviews for critical workloads; after major changes |\n\n### Pillar questions\n\n| Pillar | Example question |\n|---|---|\n| Operational excellence | How do you deploy and roll back? |\n| Security | How are identities and permissions managed? |\n| Reliability | How do you handle zone and region failures? |\n| Performance | How do you select and scale resources? |\n| Cost | How do you allocate and optimize spend? |\n| Sustainability | How do you minimize resource waste? |"}, {"id": 198, "title": "Production readiness checklist", "tldr": "Before launch, verify infrastructure as code, multi-AZ deployment, security baselines, secrets, observability, SLOs and alerts, runbooks, backups and restores, scaling, cost tagging, CI/CD with rollback and ownership.", "real": "Google SRE’s production readiness reviews and similar checklists at large companies formalize these launch criteria so services don’t reach production without operational safeguards.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Launch gate for cloud services |\n| Why it matters | Prevents predictable early incidents |\n| Production habit | Required sign-off before production traffic |\n\n### Checklist\n\n- [ ] All infrastructure in IaC, reviewed\n- [ ] Multi-AZ; no single points of failure\n- [ ] IAM least privilege; no long-lived keys; secrets managed\n- [ ] Encryption at rest and in transit\n- [ ] Metrics, logs, traces; SLOs with burn-rate alerts\n- [ ] Runbooks linked from alerts; on-call assigned\n- [ ] Backups with tested restores; DR tier defined\n- [ ] Autoscaling and quotas verified by load test\n- [ ] Cost tags and budget alerts\n- [ ] Canary deploys with automatic rollback"}, {"id": 199, "title": "Career paths and certifications", "tldr": "Cloud and DevOps careers lead to roles such as DevOps engineer, SRE, platform engineer, cloud architect, cloud security engineer and FinOps practitioner. Certifications help structure learning, but hands-on projects matter most.", "real": "Popular certifications include AWS Certified Solutions Architect and DevOps Engineer, Microsoft Azure Administrator and DevOps Engineer Expert, Google Professional Cloud Architect and DevOps Engineer, the CNCF’s CKA, CKAD and CKS, and HashiCorp Terraform Associate.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Roles and learning paths |\n| Why it matters | Guides skill development |\n| Trade-off | Certifications vs real project experience |\n| Production habit | Build public or internal portfolio projects |\n\n### Roles\n\n| Role | Focus |\n|---|---|\n| DevOps engineer | CI/CD, IaC, automation |\n| SRE | Reliability, SLOs, incidents |\n| Platform engineer | Internal developer platforms |\n| Cloud architect | Designs and standards |\n| Cloud security engineer | IAM, posture, detection |\n| FinOps practitioner | Cost visibility and optimization |"}, {"id": 200, "title": "Glossary and mastery roadmap", "tldr": "Use the glossary for shared vocabulary and the roadmap to build skills progressively: Linux and networking, one cloud deeply, IaC, containers and Kubernetes, CI/CD and GitOps, observability and SRE, security and FinOps, then platform engineering.", "real": "Recommended references: the Google SRE books, “Accelerate”, “Team Topologies”, “Infrastructure as Code” (Kief Morris), the AWS/Azure/Google well-architected frameworks and public postmortems from major providers.", "body": "### Glossary\n\n| Term | Meaning |\n|---|---|\n| IaC | Infrastructure defined in code |\n| GitOps | Git as source of truth with pull-based reconciliation |\n| SLO | Target for a service level indicator |\n| Error budget | Allowed unreliability under an SLO |\n| Landing zone | Governed multi-account cloud foundation |\n| OIDC federation | Token exchange for keyless cloud access |\n| Canary | Gradual rollout to a small share of traffic |\n| RPO / RTO | Acceptable data loss / downtime |\n| FinOps | Cloud financial management practice |\n| Golden path | Supported, opinionated way to build and run software |\n\n### Mastery roadmap\n\n1. Linux, networking and Bash fluency\n2. One cloud in depth: IAM, VPC, compute, storage, databases\n3. Terraform with modules, remote state and policy checks\n4. Containers and Kubernetes (CKA-level skills)\n5. CI/CD with OIDC, signing and GitOps\n6. Observability with OpenTelemetry and SLO alerting\n7. Security baselines, incident response and DR drills\n8. FinOps reviews and an internal platform golden path"}];
const PARTS = ["Cloud and DevOps foundations", "Linux and networking fundamentals", "Core cloud services", "Cloud networking", "Identity, security and governance", "Infrastructure as code", "Images, containers and configuration", "Continuous integration and delivery", "Deployment strategies and GitOps", "Kubernetes fundamentals", "Operating Kubernetes", "Observability", "SRE and reliability", "Cloud security operations", "FinOps and cost optimization", "Serverless and managed services", "Multi-cloud, hybrid and migration", "Platform engineering", "Outage case studies", "Capstones and mastery"];
const TOTAL = 200, PER = 10;
function idsOf(p){ const a = []; for (let i = (p-1)*PER + 1; i <= p*PER; i++) a.push(i); return a; }
const partOf = id => Math.ceil(id / PER);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "cloud-devops-progress-v1";
const LS_LAST = "cloud-devops-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try{ await dbRef.set({done:[...done].sort((a,b)=>a-b), updated:Date.now()}); }
  catch(e){ if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; pushRemote(); }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...done])); }catch(e){} }
function toggle(id){
  if (done.has(id)) done.delete(id); else done.add(id);
  saveLocal(); pushRemote(); renderAll();
  toast(done.has(id) ? "Chapter " + id + " marked complete" : "Chapter " + id + " marked not complete");
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(s){
  if (window.marked && marked.parse){
    const html = marked.parse(s, {gfm:true, headerIds:false, mangle:false});
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  }
  return "<pre>" + esc(s) + "</pre>";
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function currentId(){
  const m = location.hash.match(/^#ch-(\d{1,3})$/);
  const n = m ? +m[1] : 0;
  return n >= 1 && n <= TOTAL ? n : 0;
}

/* ---------- header memory bank ---------- */
function renderBank(){
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    html += '<div class="bank-group" title="Part ' + p + ': ' + esc(PARTS[p-1]) + '">';
    for (const i of idsOf(p)){
      html += '<button class="cell' + (done.has(i) ? " done" : "") + (i === cur ? " here" : "") +
        '" data-go="' + i + '" aria-label="Chapter ' + i + (done.has(i) ? ", complete" : "") + '"></button>';
    }
    html += "</div>";
  }
  document.getElementById("bank").innerHTML = html;
  document.getElementById("doneCount").textContent = done.size;
  document.getElementById("pct").textContent = Math.round(done.size * 100 / TOTAL) + "%";
}

/* ---------- sidebar ---------- */
const openParts = new Set();
function renderSide(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const matches = ids.filter(i => !q || byId[i].title.toLowerCase().includes(q) || byId[i].tldr.toLowerCase().includes(q) || String(i) === q);
    if (q && !matches.length) continue;
    const count = ids.filter(i => done.has(i)).length;
    const open = q || openParts.has(p) || partOf(cur) === p;
    html += '<div class="part' + (open ? " open" : "") + '">' +
      '<button class="part-head" data-part="' + p + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="part-num">' + String(p).padStart(2, "0") + '</span>' +
      '<span class="part-name">' + esc(PARTS[p-1]) + '</span>' +
      '<span class="part-count' + (count === PER ? " full" : "") + '">' + count + '/' + PER + '</span></button><ul class="part-list">';
    for (const i of matches){
      html += '<li class="ch-row' + (i === cur ? " active" : "") + '">' +
        '<button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="' + (done.has(i) ? "Mark chapter " + i + " not complete" : "Mark chapter " + i + " complete") + '">' + TICK + '</button>' +
        '<a href="#ch-' + i + '"><span class="n">' + i + '.</span>' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ul></div>";
  }
  if (!html) html = '<p style="color:var(--muted);font-size:14px;padding:8px">No chapters match that search. Try a shorter word like “Terraform”, “canary” or “IAM”.</p>';
  document.getElementById("parts").innerHTML = html;
}

/* ---------- diagrams and charts ---------- */
let mermaidPromise = null, renderSeq = 0;
const svgCache = new Map();
function isDark(){
  const a = document.documentElement.getAttribute("data-theme");
  if (a) return a === "dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function ensureMermaid(){
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (mermaidPromise) return mermaidPromise;
  mermaidPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js";
    s.onload = () => {
      try{
        window.mermaid.initialize({ startOnLoad:false, securityLevel:"strict", theme: isDark() ? "dark" : "neutral",
          fontFamily:"IBM Plex Sans, system-ui, sans-serif", flowchart:{ curve:"basis", htmlLabels:true } });
        resolve(window.mermaid);
      }catch(e){ reject(e); }
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return mermaidPromise;
}
function fitSvg(div){
  const svg = div.querySelector("svg");
  if (!svg) return;
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Diagram");
  const vb = (svg.getAttribute("viewBox") || "").split(/\s+/).map(Number);
  const vbw = vb[2] || 0;
  if (vbw && div.clientWidth && div.clientWidth < vbw * 0.7){
    svg.style.maxWidth = "none";
    svg.style.width = Math.round(vbw * 0.85) + "px";
  }
}
function fmtNum(v){ return Number(v).toLocaleString("en-US", { maximumFractionDigits: 3 }); }
function renderChart(el, spec){
  const max = Math.max(...spec.data.map(d => d[1]));
  const unit = spec.unit || "";
  const sep = (unit === "%" || unit === "×") ? "" : " ";
  let rows = "";
  for (const [label, v] of spec.data){
    let w = spec.log ? (Math.log10(v + 1) / Math.log10(max + 1)) * 100 : (v / max) * 100;
    w = Math.max(w, 1.5);
    rows += '<div class="bar-row"><span class="bar-label">' + esc(String(label)) + '</span><span class="bar-track"><span class="bar" style="width:' + w.toFixed(1) + '%"></span></span><span class="bar-val">' + fmtNum(v) + sep + esc(unit) + '</span></div>';
  }
  const fig = document.createElement("figure");
  fig.className = "chart";
  fig.innerHTML = '<figcaption>' + esc(spec.title || "") + '</figcaption>' + rows + (spec.log ? '<div class="chart-note">Bar lengths use a logarithmic scale.</div>' : "");
  el.replaceWith(fig);
}
function enhance(root){
  root.querySelectorAll("code.language-chart").forEach(code => {
    const pre = code.closest("pre") || code;
    try{ renderChart(pre, JSON.parse(code.textContent)); }catch(e){}
  });
  const blocks = [...root.querySelectorAll("code.language-mermaid")];
  if (!blocks.length) return;
  const seq = ++renderSeq;
  const holders = blocks.map(code => {
    const pre = code.closest("pre") || code;
    const div = document.createElement("div");
    div.className = "diagram loading";
    div.textContent = "Loading diagram…";
    div.dataset.src = code.textContent;
    pre.replaceWith(div);
    if (svgCache.has(div.dataset.src)){ div.classList.remove("loading"); div.innerHTML = svgCache.get(div.dataset.src); div.dataset.done = "1"; fitSvg(div); }
    return div;
  }).filter(div => !div.dataset.done);
  if (!holders.length) return;
  ensureMermaid().then(async m => {
    for (let k = 0; k < holders.length; k++){
      const div = holders[k];
      if (seq !== renderSeq || !div.isConnected) return;
      const id = "mmd-" + seq + "-" + k;
      try{
        const out = await m.render(id, div.dataset.src);
        if (!div.isConnected) return;
        div.classList.remove("loading");
        div.innerHTML = out.svg;
        svgCache.set(div.dataset.src, out.svg);
        fitSvg(div);
      }catch(e){
        const junk = document.getElementById("d" + id); if (junk) junk.remove();
        div.classList.remove("loading");
        div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>";
      }
    }
  }).catch(() => {
    holders.forEach(div => { div.classList.remove("loading"); div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>"; });
  });
}

/* ---------- chapter view ---------- */
function renderChapter(id){
  const c = byId[id];
  const p = partOf(id);
  const ids = idsOf(p);
  const isDone = done.has(id);
  const tabs = ids.map(i =>
    '<button class="tab' + (i === id ? " active" : "") + '" role="tab" aria-selected="' + (i === id) + '" data-go="' + i + '">' +
    '<span class="dot' + (done.has(i) ? " on" : "") + '"></span><span class="tab-t">' + i + '. ' + esc(byId[i].title) + '</span></button>'
  ).join("");
  document.getElementById("main").innerHTML =
    '<p class="crumb">Part ' + p + ' of 20: ' + esc(PARTS[p-1]) + '</p>' +
    '<div class="tabs" role="tablist" aria-label="Chapters in this part">' + tabs + '</div>' +
    '<article>' +
      '<p class="ch-no">Chapter ' + id + ' of ' + TOTAL + '</p>' +
      '<h1 class="ch-title">' + esc(c.title) + '</h1>' +
      '<section class="box tldr"><h2>TL;DR</h2><p>' + inlineMd(c.tldr) + '</p></section>' +
      '<div class="body">' + md(c.body) + '</div>' +
      '<section class="box real"><h2>Real-world example</h2><p>' + inlineMd(c.real) + '</p></section>' +
      '<div class="done-bar">' +
        '<button class="complete' + (isDone ? " on" : "") + '" data-toggle="' + id + '" aria-pressed="' + isDone + '">' +
          '<span class="tick' + (isDone ? " on" : "") + '">' + TICK + '</span>' + (isDone ? "Completed" : "Mark as complete") + '</button>' +
        '<div class="nav">' +
          '<button class="btn" data-go="' + (id - 1) + '"' + (id === 1 ? " disabled" : "") + '>Previous</button>' +
          '<button class="btn" data-go="' + (id + 1) + '"' + (id === TOTAL ? " disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  enhance(document.getElementById("main"));
}

/* ---------- contents view ---------- */
function renderContents(){
  let html = '<div class="contents"><h1>Contents</h1>' +
    '<p class="lead">Twenty parts covering DevOps culture, Linux and networking, core cloud services, cloud networking, identity and governance, infrastructure as code, containers, CI/CD, deployment strategies and GitOps, Kubernetes, observability, SRE, cloud security, FinOps, serverless, multi-cloud and migration, platform engineering, real outage case studies and capstone builds. Every chapter has an engineering card covering what it is, why it matters, when to use it and when not, trade-offs, failure modes and production habits. Tick a chapter when you finish it; your progress is saved. Cloud services and prices change often, so confirm specifics against current provider documentation.</p>' +
    '<div class="contents-actions"><button class="btn" data-go="' + firstUnread() + '">' + (done.size ? "Continue with chapter " + firstUnread() : "Start chapter 1") + '</button>' +
    '<button class="btn" id="resetBtn">Reset progress</button></div><div class="grid">';
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const count = ids.filter(i => done.has(i)).length;
    html += '<section class="pcard"><h2>Part ' + p + ': ' + esc(PARTS[p-1]) + '</h2><div class="meta">' + count + ' of ' + PER + ' complete</div><ol>';
    for (const i of ids){
      html += '<li><button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="Toggle chapter ' + i + '">' + TICK + '</button><a href="#ch-' + i + '">' + i + '. ' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ol></section>";
  }
  document.getElementById("main").innerHTML = html + "</div></div>";
}
function firstUnread(){ for (let i = 1; i <= TOTAL; i++) if (!done.has(i)) return i; return TOTAL; }

/* ---------- routing ---------- */
let lastRendered = null;
function renderAll(){
  const id = currentId();
  renderBank(); renderSide();
  const y = window.scrollY;
  if (id) renderChapter(id); else renderContents();
  if (lastRendered === location.hash) window.scrollTo(0, y);
  lastRendered = location.hash;
}
function route(){
  const id = currentId();
  if (!id && location.hash !== "#contents"){
    let last = 0; try{ last = +localStorage.getItem(LS_LAST) || 0; }catch(e){}
    location.replace("#ch-" + (last >= 1 && last <= TOTAL ? last : 1));
    return;
  }
  if (id){ try{ localStorage.setItem(LS_LAST, id); }catch(e){} }
  document.body.classList.remove("drawer");
  renderAll();
  window.scrollTo(0, 0);
  const active = document.querySelector(".ch-row.active");
  if (active) active.scrollIntoView({block:"nearest"});
  const tab = document.querySelector(".tab.active");
  if (tab && tab.parentElement){ const r = tab.parentElement; const left = tab.offsetLeft - r.offsetLeft; if (left < r.scrollLeft || left + tab.offsetWidth > r.scrollLeft + r.clientWidth) r.scrollLeft = left - 16; }
}
function go(id){ if (id >= 1 && id <= TOTAL) location.hash = "#ch-" + id; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){ e.preventDefault(); toggle(+t.dataset.toggle); return; }
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled){ go(+g.dataset.go); return; }
  const ph = e.target.closest("[data-part]");
  if (ph){
    const p = +ph.dataset.part;
    const el = ph.parentElement;
    const isOpen = el.classList.toggle("open");
    if (isOpen) openParts.add(p); else openParts.delete(p);
    ph.setAttribute("aria-expanded", isOpen);
    return;
  }
  if (e.target.id === "resetBtn"){
    if (confirm("Clear all 200 ticks? This can’t be undone.")){ done.clear(); saveLocal(); pushRemote(); renderAll(); toast("Progress reset"); }
  }
});
document.getElementById("search").addEventListener("input", renderSide);
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.add("drawer"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = currentId(); if (!id) return;
  if (e.key === "ArrowRight") go(id + 1);
  else if (e.key === "ArrowLeft") go(id - 1);
});
function setTopH(){ document.documentElement.style.setProperty("--top-h", document.getElementById("top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);
window.addEventListener("hashchange", route);
setTopH();
route();
initSync();
</script>

 it is | Experiments that inject failures deliberately |\n| Why it matters | Finds weaknesses before real outages |\n| Steps | Steady state → hypothesis → inject → observe → fix |\n| Trade-off | Controlled risk vs surprise outages |\n| Failure mode | Experiments without abort conditions |\n| Production habit | Game days with defined blast radius |\n\n### Experiment examples\n\n| Experiment | Hypothesis |\n|---|---|\n| Terminate 1 of 3 app instances | No user-visible errors |\n| Add 300 ms latency to DB | p95 stays under SLO |\n| Block one AZ | Traffic shifts within 2 min |\n| Fail payment provider | Checkout shows graceful error, orders queue |"}, {"id": 126, "title": "Capacity planning", "tldr": "Forecast demand from growth, seasonality and launches; measure per-instance capacity with load tests; provision headroom for failures (N+1, zone loss); and check quotas, limits and lead times early.", "real": "Retailers and streaming services plan capacity months ahead for peak events such as holiday sales and major live sports broadcasts, often pre-warming load balancers and raising cloud quotas in advance.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Ensuring enough capacity for future demand |\n| Why it matters | Prevents overload outages and surprise limits |\n| Inputs | Forecasts, load tests, failure headroom, quotas |\n| Trade-off | Over-provisioning cost vs outage risk |\n| Failure mode | Hitting a regional instance quota during a launch |\n| Production habit | Quota and limit review before major events |\n\n### Zone-loss sizing\n\n```text\nNeeded at peak: 30 instances\nSpread across 3 AZs; losing one AZ must still leave 30\n→ 15 per AZ × 3 AZs = 45 instances\n```"}, {"id": 127, "title": "Reducing toil", "tldr": "Toil is manual, repetitive, automatable work that scales with service size and has no lasting value. Measure it, automate the highest-volume tasks and design systems to be self-healing.", "real": "Google’s SRE book defines toil and targets keeping it below 50% of SRE time so engineers have time for engineering projects that improve systems.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Repetitive operational work |\n| Why it matters | Consumes capacity and causes errors |\n| Approach | Measure, prioritize, automate, eliminate causes |\n| Trade-off | Automation effort vs recurring cost |\n| Failure mode | Manual certificate renewals, manual deploys |\n| Production habit | Track toil hours per week by category |\n\n### Toil examples and fixes\n\n| Toil | Fix |\n|---|---|\n| Manual deploys | CI/CD |\n| Disk-full cleanup | Log rotation + alerts + auto-expansion |\n| Certificate renewals | cert-manager / ACM |\n| Access requests | Self-service with approvals |"}, {"id": 128, "title": "High availability patterns", "tldr": "Design for failure: redundancy across zones, stateless app tiers, managed multi-AZ databases, health-checked load balancers, automatic failover, graceful degradation and avoiding single points of failure, including humans and manual steps.", "real": "AWS’s Builders’ Library describes “static stability”, designing systems so that they keep working during a zone failure without needing to make new control-plane changes, such as launching instances.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Architecture that tolerates component failures |\n| Why it matters | Keeps services up during routine failures |\n| Patterns | Multi-AZ, redundancy, failover, static stability |\n| Trade-off | Cost vs availability |\n| Failure mode | Failover depending on the control plane that is failing |\n| Production habit | Pre-provision capacity for zone loss |\n\n### Single points of failure checklist\n\n- [ ] Multiple instances across ≥ 2 AZs\n- [ ] Multi-AZ database with automatic failover\n- [ ] No single NAT gateway for all zones\n- [ ] DNS and certificates managed redundantly\n- [ ] Deployment pipeline not the only recovery path"}, {"id": 129, "title": "Disaster recovery strategies", "tldr": "Choose DR strategies by RPO (acceptable data loss) and RTO (acceptable downtime): backup and restore, pilot light, warm standby or multi-site active-active. Test recovery regularly; untested DR plans fail.", "real": "AWS’s disaster recovery whitepaper defines four strategies (backup and restore, pilot light, warm standby, multi-site active/active) with increasing cost and decreasing recovery time.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Recovering from regional or catastrophic failures |\n| Why it matters | Business continuity |\n| Metrics | RPO, RTO |\n| Trade-off | Cost vs recovery speed |\n| Failure mode | DR region missing recent schema changes |\n| Production habit | DR drills at least annually, ideally quarterly |\n\n### Strategies\n\n| Strategy | RTO | RPO | Cost |\n|---|---|---|---|\n| Backup and restore | Hours | Hours | Low |\n| Pilot light | Tens of minutes | Minutes | Medium |\n| Warm standby | Minutes | Seconds–minutes | Medium–high |\n| Multi-site active/active | Near zero | Near zero | High |"}, {"id": 130, "title": "Reliability reviews", "tldr": "Review architectures and operations regularly against reliability criteria: failure modes, dependencies, SLOs, alerting, capacity, DR, deployment safety and runbooks. Cloud well-architected frameworks provide structured questions.", "real": "The AWS Well-Architected Framework (2015), Azure Well-Architected Framework and Google Cloud Architecture Framework include reliability pillars with review questions and tools for workload assessments.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Periodic assessment of reliability posture |\n| Why it matters | Finds risks before incidents do |\n| Trade-off | Review time vs prevented outages |\n| Failure mode | Reviews producing reports nobody acts on |\n| Production habit | Track findings as backlog items with owners |\n\n### Review questions\n\n| Area | Question |\n|---|---|\n| Failure modes | What happens if each dependency fails? |\n| Recovery | Can we restore data and meet RTO? |\n| Change | Are deployments staged with rollback? |\n| Capacity | Can we survive a zone loss at peak? |\n| Detection | Would we know within 5 minutes? |"}, {"id": 131, "title": "Cloud threat landscape", "tldr": "Most cloud breaches come from misconfiguration, stolen credentials, exposed secrets, vulnerable workloads and supply-chain compromises rather than provider failures. Defend identity first, then configuration, workloads and data.", "real": "The 2019 Capital One breach combined a misconfigured web application firewall, server-side request forgery and an over-permissive IAM role to access data on about 100 million US customers, and the 2024 Snowflake customer breaches stemmed from stolen credentials on accounts without MFA.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How cloud environments get attacked |\n| Why it matters | Focuses defenses on real attack paths |\n| Top risks | Credentials, misconfiguration, secrets, vulnerable apps, supply chain |\n| Trade-off | Security investment vs breach cost |\n| Failure mode | Focusing on exotic threats while MFA is missing |\n| Production habit | MFA everywhere; continuous misconfiguration scanning |\n\n### Attack path example\n\n```mermaid\nflowchart LR\n  APP[Vulnerable web app] --> SSRF[SSRF to metadata service]\n  SSRF --> CREDS[Instance role credentials]\n  CREDS --> BUCKETS[Over-permissive S3 access]\n  BUCKETS --> EXFIL[Data exfiltration]\n```"}, {"id": 132, "title": "Instance metadata protection", "tldr": "Cloud instance metadata services expose credentials to workloads. Require session-based metadata access (IMDSv2 on AWS), restrict hop limits for containers, and give roles minimal permissions so stolen credentials do little damage.", "real": "After SSRF attacks such as the Capital One breach targeted instance metadata, AWS introduced IMDSv2 in November 2019, requiring a session token obtained via PUT, and later made IMDSv2 the default for new instance types and launches in many cases.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Protecting credentials exposed to workloads |\n| Why it matters | SSRF to metadata is a classic cloud attack |\n| Controls | IMDSv2 required, hop limit 1–2, least-privilege roles |\n| Trade-off | Minor compatibility work |\n| Failure mode | IMDSv1 enabled on internet-facing instances |\n| Production habit | Policy requiring IMDSv2 for all launches |\n\n### Terraform setting\n\n```hcl\nresource \"aws_launch_template\" \"app\" {\n  name_prefix   = \"orders-\"\n  image_id      = var.ami_id\n  instance_type = \"m7g.large\"\n  metadata_options {\n    http_tokens                 = \"required\"\n    http_put_response_hop_limit = 1\n    http_endpoint               = \"enabled\"\n  }\n}\n```"}, {"id": 133, "title": "Threat detection and logging", "tldr": "Enable managed threat detection (GuardDuty, Defender for Cloud, Security Command Center), centralize audit and flow logs, alert on high-risk events and route findings to responders with runbooks.", "real": "Amazon GuardDuty (2017) analyzes CloudTrail, VPC Flow Logs and DNS logs to detect threats such as cryptocurrency mining, credential exfiltration and unusual API activity.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Detecting malicious activity in cloud accounts |\n| Why it matters | Prevention eventually fails |\n| Sources | Audit logs, flow logs, DNS logs, workload telemetry |\n| Trade-off | Coverage vs alert volume |\n| Failure mode | Findings accumulating unread in a console |\n| Production habit | Findings routed to on-call security with SLAs |\n\n### Detection pipeline\n\n```mermaid\nflowchart LR\n  LOGS[CloudTrail, flow logs, DNS] --> DETECT[GuardDuty / Defender / SCC]\n  DETECT --> HUB[Security Hub / SIEM]\n  HUB --> TRIAGE[Triage + runbook]\n  TRIAGE --> RESPOND[Contain: revoke keys, isolate instance]\n```"}, {"id": 134, "title": "Vulnerability management", "tldr": "Continuously inventory assets, scan OS packages, container images, dependencies and cloud configurations, prioritize by exploitability and exposure, patch through rebuilds and track remediation SLAs.", "real": "CISA’s Known Exploited Vulnerabilities catalog, launched in 2021, lists vulnerabilities actively exploited in the wild, and many organizations prioritize those entries over raw CVSS scores.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Finding and fixing vulnerabilities systematically |\n| Why it matters | Unpatched systems are prime targets |\n| Prioritization | Known exploited, internet-exposed, severity, data sensitivity |\n| Trade-off | Patch speed vs stability |\n| Failure mode | Thousands of findings with no prioritization |\n| Production habit | Patch via image rebuilds and redeploys |\n\n### Remediation SLAs (example)\n\n| Priority | Criteria | SLA |\n|---|---|---|\n| P1 | Known exploited + internet-facing | 48 hours |\n| P2 | Critical severity | 7 days |\n| P3 | High severity | 30 days |\n| P4 | Others | Next scheduled rebuild |"}, {"id": 135, "title": "Container and Kubernetes runtime security", "tldr": "Protect running workloads with hardened pod settings, network policies, read-only filesystems, runtime threat detection for suspicious behavior (shells in containers, unexpected network connections) and restricted node access.", "real": "Falco, created by Sysdig in 2016 and graduated from the CNCF in 2024, detects suspicious runtime behavior such as unexpected shells or file writes in containers using kernel events.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Detecting and limiting attacks on running containers |\n| Why it matters | Build-time scanning can’t catch everything |\n| Controls | Pod security, network policies, runtime detection, node hardening |\n| Trade-off | Detection noise vs coverage |\n| Failure mode | Cryptominer running unnoticed in a compromised pod |\n| Production habit | Alerts on shells and unexpected outbound connections |\n\n### Falco rule\n\n```yaml\n- rule: Shell in container\n  desc: A shell was spawned inside a container\n  condition: spawned_process and container and proc.name in (bash, sh, zsh)\n  output: \"Shell spawned (user=%user.name container=%container.name cmd=%proc.cmdline)\"\n  priority: WARNING\n```"}, {"id": 136, "title": "Software supply chain security", "tldr": "Secure the path from source to deployment: protected branches, reviewed changes, pinned dependencies, isolated builds, signed artifacts, provenance attestations, SBOMs and deploy-time verification.", "real": "The 2020 SolarWinds attack inserted malicious code into Orion builds, and the 2024 xz Utils backdoor showed a multi-year social engineering campaign against an open-source maintainer, driving adoption of frameworks such as SLSA.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Protecting build and dependency pipelines |\n| Why it matters | Attackers target the software factory |\n| Framework | SLSA levels, Sigstore signing, SBOMs |\n| Trade-off | Process overhead vs systemic risk |\n| Failure mode | Unverified images deployed from personal laptops |\n| Production habit | Only CI-built, signed images allowed by admission policy |\n\n### SLSA build track (simplified)\n\n| Level | Requirement |\n|---|---|\n| L1 | Provenance exists |\n| L2 | Hosted build platform, signed provenance |\n| L3 | Hardened, isolated builds |"}, {"id": 137, "title": "Zero trust in cloud environments", "tldr": "Zero trust removes implicit network trust: every request is authenticated and authorized by identity and context, access is least privilege, and devices and workloads are verified continuously.", "real": "Google’s BeyondCorp papers (from 2014) described moving access controls from the network perimeter to users and devices, and NIST published zero trust architecture guidance (SP 800-207) in 2020.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Identity-centric security model |\n| Why it matters | Perimeters don’t stop credential-based attacks |\n| Components | Strong identity, device posture, mTLS, least privilege, continuous verification |\n| Trade-off | Implementation effort vs reduced lateral movement |\n| Failure mode | VPN access granting broad internal network reach |\n| Production habit | Identity-aware proxies for internal tools |\n\n### Access flow\n\n```mermaid\nflowchart LR\n  USER[User + device] --> IAP[Identity-aware proxy]\n  IAP --> CHECK{Identity, MFA, device posture, policy}\n  CHECK -- allow --> APP[Internal app]\n  CHECK -- deny --> BLOCK[Blocked + logged]\n```"}, {"id": 138, "title": "Compliance in the cloud", "tldr": "Compliance frameworks (SOC 2, ISO 27001, PCI DSS, HIPAA, GDPR) require documented controls and evidence. Automate evidence collection with IaC, policy as code, audit logs and continuous compliance tools, and use providers’ compliance reports for their part.", "real": "PCI DSS version 4.0, published in 2022, made its new future-dated requirements mandatory from March 31, 2025, and cloud providers publish their attestations (SOC reports, ISO certificates) through portals such as AWS Artifact.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Meeting regulatory and customer control requirements |\n| Why it matters | Sales, legal obligations, trust |\n| Approach | Map controls → automate → collect evidence continuously |\n| Trade-off | Audit effort vs automation investment |\n| Failure mode | Screenshots collected manually once a year |\n| Production habit | Compliance-as-code with continuous evidence |\n\n### Control to evidence\n\n| Control | Automated evidence |\n|---|---|\n| Encryption at rest | Config rules / policy scans |\n| Access reviews | Identity provider reports |\n| Change management | PR history, pipeline logs |\n| Logging | Org-wide trail configuration |\n| Vulnerability management | Scanner reports with SLAs |"}, {"id": 139, "title": "Incident response in the cloud", "tldr": "Prepare for cloud security incidents with runbooks for key compromise, exposed storage and compromised instances; pre-provisioned forensic access; isolation procedures; log retention; and practiced communication.", "real": "AWS, Azure and Google Cloud publish incident response guides, and common first steps include revoking compromised credentials, isolating resources with restrictive security groups and snapshotting volumes for forensics.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Responding to security incidents in cloud accounts |\n| Why it matters | Speed limits damage |\n| Preparation | Runbooks, forensic roles, log retention, contacts |\n| Trade-off | Preparation effort vs response speed |\n| Failure mode | Terminating a compromised instance and losing evidence |\n| Production habit | Isolate and snapshot before terminating |\n\n### Leaked access key runbook\n\n| Step | Action |\n|---|---|\n| 1 | Deactivate the key immediately |\n| 2 | Review CloudTrail for its activity |\n| 3 | Revoke sessions; check for new users/keys/roles |\n| 4 | Remove persistence; rotate related secrets |\n| 5 | Assess data access; notify as required |\n| 6 | Postmortem: why a long-lived key existed |"}, {"id": 140, "title": "DevSecOps", "tldr": "DevSecOps integrates security into every stage of delivery: threat modeling in design, secure defaults in templates, automated scanning in CI, policy enforcement at deploy, runtime detection and fast remediation, owned jointly by developers and security.", "real": "The “shift left” movement and platforms such as GitHub Advanced Security, GitLab Ultimate security scanning and Snyk integrated security testing directly into developer workflows and pull requests.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Security built into the delivery lifecycle |\n| Why it matters | Finds issues early when they’re cheapest to fix |\n| Practices | Threat modeling, SAST, SCA, IaC scanning, image scanning, policy, runtime detection |\n| Trade-off | Pipeline friction vs security outcomes |\n| Failure mode | Security gates that block everything and get bypassed |\n| Production habit | Block only high-confidence critical findings |\n\n### Security across the pipeline\n\n```mermaid\nflowchart LR\n  DESIGN[Threat model] --> CODE[SAST + secrets scan]\n  CODE --> DEPS[Dependency scan]\n  DEPS --> IAC[IaC policy checks]\n  IAC --> IMAGE[Image scan + sign]\n  IMAGE --> DEPLOY[Admission verification]\n  DEPLOY --> RUN[Runtime detection]\n```"}, {"id": 141, "title": "FinOps fundamentals", "tldr": "FinOps brings financial accountability to cloud spending through collaboration between engineering, finance and business: inform (visibility and allocation), optimize (rates and usage) and operate (continuous governance).", "real": "The FinOps Foundation was formed in 2019 and joined the Linux Foundation in 2020; its framework describes the Inform, Optimize and Operate phases used by many organizations.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Cloud financial management practice |\n| Why it matters | Cloud costs scale with usage and decisions |\n| Phases | Inform, Optimize, Operate |\n| Trade-off | Cost vs speed and reliability |\n| Failure mode | Finance discovering overspend months later |\n| Production habit | Engineers see the cost of what they run |\n\n### FinOps lifecycle\n\n```mermaid\nflowchart LR\n  INFORM[Inform: visibility, allocation] --> OPTIMIZE[Optimize: rates, usage]\n  OPTIMIZE --> OPERATE[Operate: policies, budgets, reviews]\n  OPERATE --> INFORM\n```"}, {"id": 142, "title": "Cloud pricing models", "tldr": "Cloud prices depend on resource type, size, region, usage time, requests, storage class and data transfer. Understand the pricing dimensions of each service you use before designing around it.", "real": "Major clouds bill most compute per second or per minute, object storage per GB-month plus requests, and data transfer per GB, so the same architecture can cost very different amounts depending on traffic patterns.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How cloud services are billed |\n| Why it matters | Architecture choices determine bills |\n| Dimensions | Time, capacity, requests, storage, transfer, licenses |\n| Trade-off | Managed convenience vs unit price |\n| Failure mode | Request-priced service hit by millions of tiny requests |\n| Production habit | Cost estimate in every design document |\n\n### Pricing dimensions\n\n| Service | Billed by |\n|---|---|\n| VMs | Instance-hours/seconds by type |\n| Object storage | GB-month, requests, retrieval, transfer |\n| Functions | Invocations, GB-seconds |\n| Managed DB | Instance hours, storage, I/O, backups |\n| Load balancers | Hours + capacity units |\n| Data transfer | GB out, cross-AZ, cross-region |"}, {"id": 143, "title": "Commitment discounts and spot capacity", "tldr": "Lower compute rates with commitments (reserved instances, savings plans, committed use discounts) for steady baseline usage, and spot/preemptible capacity (up to about 90% cheaper) for interruptible workloads. Keep on-demand for variable peaks.", "real": "AWS introduced Spot Instances in 2009 and Savings Plans in 2019; providers advertise spot discounts of up to 90% versus on-demand prices, with the trade-off of interruptions on short notice.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Lower prices in exchange for commitment or interruptibility |\n| Why it matters | Largest rate-based savings |\n| Options | Reserved, savings plans, CUDs, spot/preemptible |\n| Trade-off | Commitment risk vs discount |\n| Failure mode | Committing to capacity before rightsizing |\n| Production habit | Rightsize first, then commit to the stable baseline |\n\n### Coverage strategy\n\n```chart\n{\"title\": \"Example compute coverage mix (guideline)\", \"unit\": \"%\", \"data\": [[\"Commitments (steady baseline)\", 60], [\"Spot (batch, stateless, CI)\", 25], [\"On-demand (peaks, new workloads)\", 15]]}\n```"}, {"id": 144, "title": "Rightsizing and waste removal", "tldr": "Match resources to actual usage: downsize overprovisioned instances, delete idle resources (unattached volumes, old snapshots, unused load balancers, idle databases), schedule non-production environments off hours.", "real": "Cloud providers’ own tools (AWS Compute Optimizer, Azure Advisor, Google Cloud Recommender) generate rightsizing and idle-resource recommendations from utilization data.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Eliminating overprovisioned and unused resources |\n| Why it matters | Waste is common and easy to remove |\n| Targets | Oversized instances, idle resources, non-prod running 24/7 |\n| Trade-off | Savings vs performance headroom |\n| Failure mode | Dev environments running nights and weekends |\n| Production habit | Weekly waste report with owners |\n\n### Scheduling savings\n\n```text\nNon-prod running 24×7 = 168 h/week\nRunning 12 h × 5 weekdays = 60 h/week → ~64% less compute time\n```"}, {"id": 145, "title": "Tagging and cost allocation", "tldr": "Allocate costs to teams, services and environments with consistent tags or labels, account structure and Kubernetes cost allocation. Enforce required tags with policies so new resources are always attributable.", "real": "The FinOps Foundation’s FOCUS specification (version 1.0 released in 2024) standardizes cloud billing data across providers, making allocation and comparison easier.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Attributing spend to owners |\n| Why it matters | Accountability drives optimization |\n| Mechanisms | Tags, accounts/projects, K8s labels, shared cost rules |\n| Trade-off | Tagging discipline vs visibility |\n| Failure mode | 40% of spend “untagged” |\n| Production habit | Policy denying untagged resource creation |\n\n### Required tags\n\n| Tag | Example |\n|---|---|\n| team | payments |\n| service | orders-api |\n| environment | prod |\n| cost-center | CC-1042 |"}, {"id": 146, "title": "Storage cost optimization", "tldr": "Optimize storage by choosing appropriate classes, lifecycle policies to move or delete old data, deleting orphaned snapshots and volumes, compressing data and right-sizing provisioned IOPS.", "real": "Amazon S3 Intelligent-Tiering (2018) automatically moves objects between access tiers based on usage, and lifecycle rules can transition data to archive classes such as Glacier Deep Archive at a small fraction of standard storage prices.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Reducing storage spend |\n| Why it matters | Data grows forever unless managed |\n| Levers | Storage classes, lifecycle rules, snapshot cleanup, compression |\n| Trade-off | Retrieval cost and latency vs storage savings |\n| Failure mode | Years of daily snapshots never deleted |\n| Production habit | Lifecycle policies on every bucket |\n\n### Lifecycle rule (Terraform)\n\n```hcl\nresource \"aws_s3_bucket_lifecycle_configuration\" \"logs\" {\n  bucket = aws_s3_bucket.logs.id\n  rule {\n    id     = \"tier-and-expire\"\n    status = \"Enabled\"\n    filter {}\n    transition {\n      days          = 30\n      storage_class = \"STANDARD_IA\"\n    }\n    transition {\n      days          = 90\n      storage_class = \"GLACIER\"\n    }\n    expiration { days = 365 }\n  }\n}\n```"}, {"id": 147, "title": "Data transfer and network costs", "tldr": "Network charges often surprise teams: internet egress, cross-AZ traffic, cross-region replication, NAT processing and load balancer data. Visualize transfer by service and redesign hot paths to stay local.", "real": "Cloud providers generally charge for data transferred between availability zones and out to the internet, so architectures with chatty cross-zone microservices or NAT-routed object storage traffic can incur large transfer bills.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Costs of moving data |\n| Why it matters | Can exceed compute for data-heavy systems |\n| Levers | CDN, zone-aware routing, private endpoints, compression, locality |\n| Trade-off | Multi-AZ resilience vs cross-AZ charges |\n| Failure mode | Analytics jobs pulling terabytes across regions daily |\n| Production habit | Transfer costs visible per service |\n\n### Common fixes\n\n| Problem | Fix |\n|---|---|\n| S3 traffic via NAT | Gateway endpoint |\n| Public downloads | CDN |\n| Cross-AZ service chatter | Topology-aware routing |\n| Cross-region analytics | Process data in-region |"}, {"id": 148, "title": "Kubernetes and container cost allocation", "tldr": "Allocate cluster costs to namespaces and workloads based on requests and usage, including idle capacity and shared add-ons. Use the data to right-size requests and improve bin-packing.", "real": "OpenCost (CNCF) and commercial tools such as Kubecost, plus cloud features like GKE cost allocation and EKS split cost allocation data (2024), attribute Kubernetes costs to namespaces and labels.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Showback/chargeback for shared clusters |\n| Why it matters | Shared clusters hide who drives cost |\n| Methods | Request-based, usage-based, idle cost distribution |\n| Trade-off | Precision vs simplicity |\n| Failure mode | Platform team paying for every team’s oversized requests |\n| Production habit | Monthly cost report per namespace |\n\n### Allocation example\n\n| Namespace | Requested CPU | Share of node cost |\n|---|---|---|\n| orders | 40 cores | 40% |\n| search | 30 cores | 30% |\n| analytics | 20 cores | 20% |\n| Idle / unallocated | 10 cores | 10% (shared) |"}, {"id": 149, "title": "Unit economics", "tldr": "Measure cloud cost per business unit: per customer, per order, per API request, per active user. Unit costs show whether efficiency improves as the business grows and guide pricing and architecture decisions.", "real": "The FinOps Foundation’s framework treats unit economics as a mature capability, connecting cloud spend to business value metrics rather than tracking total spend alone.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Cost per unit of business value |\n| Why it matters | Growth with improving efficiency |\n| Examples | Cost per order, per 1,000 requests, per tenant |\n| Trade-off | Allocation effort vs insight |\n| Failure mode | Celebrating flat total spend while unit cost rises |\n| Production habit | Unit cost trends in monthly reviews |\n\n### Example\n\n```text\nMonthly cloud cost for orders platform: $42,000\nOrders processed: 3,500,000\nUnit cost: $0.012 per order (target: < $0.010)\n```"}, {"id": 150, "title": "Budgets, anomalies and governance", "tldr": "Set budgets per team and account with alerts, enable anomaly detection for sudden spikes, review costs regularly with owners and enforce guardrails (allowed instance types, regions, tagging) through policy.", "real": "AWS Cost Anomaly Detection (2020), Azure cost alerts and Google Cloud budget alerts use usage history to flag unusual spending, catching issues such as runaway jobs or misconfigured autoscaling early.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Ongoing cost control mechanisms |\n| Why it matters | Prevents surprise bills |\n| Tools | Budgets, anomaly detection, policies, reviews |\n| Trade-off | Controls vs team autonomy |\n| Failure mode | Runaway GPU instances discovered at month end |\n| Production habit | Daily anomaly alerts to service owners |\n\n### Governance cadence\n\n| Cadence | Activity |\n|---|---|\n| Daily | Anomaly alerts |\n| Weekly | Waste report, commitments utilization |\n| Monthly | Team cost reviews, unit economics |\n| Quarterly | Commitment planning, architecture reviews |"}, {"id": 151, "title": "Serverless architecture", "tldr": "Serverless architectures compose managed services (API gateways, functions, queues, event buses, managed databases, object storage) so teams write business logic while the provider handles servers, scaling and much of availability.", "real": "Companies such as Coca-Cola and iRobot have publicly described serverless architectures on AWS, and AWS’s Serverless Application Lens in the Well-Architected Framework documents best practices.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Applications built from managed, event-driven services |\n| Why it matters | Minimal operations, fine-grained scaling and billing |\n| Trade-off | Operational simplicity vs vendor coupling and distributed debugging |\n| Failure mode | Function sprawl with no observability |\n| Production habit | IaC (SAM, CDK, Terraform) and tracing from day one |\n\n### Reference architecture\n\n```mermaid\nflowchart LR\n  CLIENT[Client] --> APIGW[API gateway]\n  APIGW --> FN[Function]\n  FN --> DB[(Managed NoSQL / SQL)]\n  FN --> BUS[Event bus]\n  BUS --> Q[Queue]\n  Q --> WORKER[Worker function]\n  WORKER --> S3[(Object storage)]\n```"}, {"id": 152, "title": "Functions in depth", "tldr": "Functions run code per event with configured memory, timeout and concurrency. Optimize cold starts (smaller packages, provisioned concurrency, snapshot technologies), reuse connections across invocations and keep handlers idempotent.", "real": "AWS Lambda SnapStart, introduced for Java in 2022 and later extended to Python and .NET, reduces cold start latency by restoring initialized execution environments from snapshots.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Event-triggered managed compute |\n| Why it matters | Simple scaling for event workloads |\n| Settings | Memory (also scales CPU), timeout, concurrency, retries |\n| Trade-off | Simplicity vs cold starts and execution limits |\n| Failure mode | Opening a new DB connection on every invocation |\n| Production habit | Initialize clients outside the handler |\n\n### Handler pattern (Python)\n\n```python\nimport json, os\nimport boto3\n\ntable = boto3.resource(\"dynamodb\").Table(os.environ[\"TABLE\"])   # reused across invocations\n\ndef handler(event, context):\n    order = json.loads(event[\"body\"])\n    table.put_item(Item={\"pk\": order[\"id\"], \"status\": \"received\"},\n                   ConditionExpression=\"attribute_not_exists(pk)\")   # idempotent create\n    return {\"statusCode\": 201, \"body\": json.dumps({\"id\": order[\"id\"]})}\n```"}, {"id": 153, "title": "Event-driven integration", "tldr": "Event buses route events between services and SaaS applications based on rules; queues buffer work; streams provide ordered, replayable logs. Combine them to build loosely coupled, resilient workflows.", "real": "Amazon EventBridge (2019) routes events from AWS services, SaaS partners and custom applications using rules, and supports schema discovery and archive/replay of events.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Event routing between producers and consumers |\n| Why it matters | Decoupled, extensible systems |\n| Components | Event bus, rules, queues, DLQs, archives |\n| Trade-off | Flexibility vs harder tracing |\n| Failure mode | Events silently dropped by mismatched rules |\n| Production habit | DLQs on every target; event catalog |\n\n### EventBridge rule pattern\n\n```json\n{\n  \"source\": [\"acme.orders\"],\n  \"detail-type\": [\"OrderPlaced\"],\n  \"detail\": {\"total_minor\": [{\"numeric\": [\">\", 1000000]}]}\n}\n```"}, {"id": 154, "title": "Workflow orchestration", "tldr": "Managed workflow services (AWS Step Functions, Azure Durable Functions/Logic Apps, Google Workflows) coordinate multi-step processes with retries, timeouts, branching, parallelism and human approval, with visible execution history.", "real": "AWS Step Functions launched in 2016 and added direct integrations with many AWS services, letting teams replace custom orchestration code and cron chains with declarative state machines.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Managed state machines for workflows |\n| Why it matters | Reliable multi-step processes with visibility |\n| Features | Retries, catch, parallel, wait, callbacks |\n| Trade-off | Vendor-specific definitions vs custom code |\n| Failure mode | Orchestration logic hidden in function chains |\n| Production habit | Explicit retry and error handling per step |\n\n### Workflow\n\n```mermaid\nstateDiagram-v2\n  [*] --> ValidateOrder\n  ValidateOrder --> ChargePayment\n  ChargePayment --> ReserveStock\n  ChargePayment --> NotifyFailure: payment failed\n  ReserveStock --> Ship\n  ReserveStock --> RefundPayment: out of stock\n  RefundPayment --> NotifyFailure\n  Ship --> [*]\n  NotifyFailure --> [*]\n```"}, {"id": 155, "title": "Serverless containers", "tldr": "Serverless container platforms (Cloud Run, AWS Fargate, Azure Container Apps) run containers without managing nodes, with autoscaling and per-use billing, combining container portability with serverless operations.", "real": "AWS Fargate launched in 2017 for ECS (EKS support in 2019), Google Cloud Run in 2019 and Azure Container Apps in 2022, making serverless containers available on all major clouds.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Containers without node management |\n| Why it matters | Portable images, low ops |\n| Trade-off | Less control (GPUs, daemons, networking) vs simplicity |\n| Failure mode | Scale-to-zero cold starts on latency-critical APIs |\n| Production habit | Minimum instances for user-facing services |\n\n### Comparison\n\n| Platform | Scale to zero | Orchestration |\n|---|---|---|\n| Cloud Run | Yes | Managed (Knative-based API) |\n| Azure Container Apps | Yes | Managed (KEDA-based scaling) |\n| AWS Fargate | No (tasks/pods) | ECS or EKS |"}, {"id": 156, "title": "API gateways in the cloud", "tldr": "Managed API gateways handle routing, authentication, throttling, request validation, TLS and integration with functions and services. Choose between lightweight HTTP gateways and full-featured API management based on needs.", "real": "Amazon API Gateway launched in 2015 and added cheaper, lower-latency HTTP APIs in 2019 alongside its original REST APIs, while Azure API Management and Google Apigee target full API product management.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Managed API entry points |\n| Why it matters | Security and traffic control without servers |\n| Features | Auth (JWT, IAM), throttling, validation, custom domains |\n| Trade-off | Features vs latency and cost per request |\n| Failure mode | Default unlimited throttling allowing abuse |\n| Production habit | Per-client throttling and WAF |\n\n### Gateway responsibilities\n\n| Concern | Gateway | Service |\n|---|---|---|\n| TLS, custom domain | ✓ | |\n| Token validation | ✓ | |\n| Throttling | ✓ | |\n| Object-level authorization | | ✓ |\n| Business validation | | ✓ |"}, {"id": 157, "title": "Managed databases at scale", "tldr": "Cloud-native databases separate storage from compute (Aurora, AlloyDB, Neon), offer serverless scaling, global replication and managed operations. Understand their consistency, failover behavior, limits and pricing model.", "real": "Amazon Aurora, announced in 2014, separates compute from a distributed storage layer replicating data six ways across three availability zones, a design described in Amazon’s 2017 SIGMOD paper.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Cloud-optimized managed databases |\n| Why it matters | Scale and availability with less operations |\n| Options | Aurora, AlloyDB, Cloud Spanner, Cosmos DB, DynamoDB |\n| Trade-off | Managed scale vs lock-in and pricing complexity |\n| Failure mode | I/O-based pricing surprises on heavy workloads |\n| Production habit | Load test with production-like data; model costs |\n\n### Selection\n\n| Need | Option |\n|---|---|\n| PostgreSQL/MySQL compatibility | Aurora, AlloyDB, Cloud SQL |\n| Global strong consistency | Spanner, CockroachDB |\n| Massive key-value scale | DynamoDB, Bigtable, Cosmos DB |\n| Serverless scaling | Aurora Serverless v2, Neon |"}, {"id": 158, "title": "Quotas and service limits", "tldr": "Every cloud service has quotas (instances per region, API request rates, concurrency, IPs). Track usage against limits, request increases ahead of launches and design for throttling with retries and backoff.", "real": "AWS Lambda has a default regional concurrency limit (commonly 1,000 concurrent executions per account and region, adjustable), and teams launching high-traffic features routinely request quota increases in advance.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Provider-imposed usage limits |\n| Why it matters | Limits cause outages during growth or launches |\n| Practices | Quota monitoring, increase requests, throttling handling |\n| Trade-off | Higher limits vs blast radius of runaway usage |\n| Failure mode | Launch day fails on instance or concurrency quota |\n| Production habit | Quota dashboards with alerts at 80% |\n\n### Common quotas to watch\n\n| Quota | Impact if exceeded |\n|---|---|\n| vCPUs per instance family | Can’t launch capacity |\n| Function concurrency | Throttled invocations |\n| Elastic IPs / NAT gateways | Network setup fails |\n| API rate limits | Throttled automation |"}, {"id": 159, "title": "Choosing managed vs self-managed", "tldr": "Prefer managed services when they meet requirements, because they reduce undifferentiated operations. Self-manage when you need features, control, portability or cost efficiency at scale that managed options can’t provide, and have the expertise to run it.", "real": "Many companies run managed Kafka (Amazon MSK, Confluent Cloud) or managed Elasticsearch/OpenSearch rather than self-hosting, while large-scale users sometimes self-manage to control costs and configuration.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Build/run vs buy/rent decisions for infrastructure |\n| Why it matters | Operational load and cost trade-offs |\n| Trade-off | Control and unit cost vs operational burden |\n| Failure mode | Self-hosting databases without on-call expertise |\n| Production habit | Total cost of ownership including people time |\n\n### Decision factors\n\n| Factor | Favors managed | Favors self-managed |\n|---|---|---|\n| Team expertise | Limited | Deep |\n| Scale | Small–medium | Very large |\n| Customization | Standard | Special needs |\n| Compliance | Provider certified | Must control everything |"}, {"id": 160, "title": "When not to go serverless", "tldr": "Serverless isn’t ideal for steady high-throughput workloads (cost), long-running or stateful processing, latency-critical paths sensitive to cold starts, specialized hardware needs, or teams needing deep runtime control.", "real": "Amazon Prime Video’s 2023 case study described moving a video monitoring workload from a serverless, step-function-based design to a single-process application on containers, reducing that workload’s infrastructure costs by over 90%.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Recognizing poor fits for serverless |\n| Why it matters | Avoids cost and performance surprises |\n| Poor fits | Steady heavy load, long jobs, low-latency needs, GPUs |\n| Trade-off | Ops simplicity vs efficiency |\n| Failure mode | High-volume data pipeline orchestrated per item by functions |\n| Production habit | Re-evaluate architecture as workloads grow |\n\n### Fit guide\n\n| Workload | Serverless fit |\n|---|---|\n| Spiky API traffic | Good |\n| Event handlers, glue | Good |\n| Steady 5,000 req/s API | Compare with containers |\n| Hours-long batch | Poor (use batch/containers) |\n| GPU inference | Specialized platforms |"}, {"id": 161, "title": "Multi-cloud: reasons and costs", "tldr": "Organizations use multiple clouds for best-of-breed services, acquisitions, regulation, negotiating leverage or resilience. True workload portability across clouds is expensive; most “multi-cloud” means different workloads on different clouds.", "real": "Surveys such as Flexera’s annual State of the Cloud report consistently find most enterprises use more than one public cloud, while relatively few run the same application actively across several providers.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Using more than one cloud provider |\n| Why it matters | Strategy, risk and cost implications |\n| Patterns | Workload-per-cloud, portable platform, active-active across clouds |\n| Trade-off | Flexibility and leverage vs complexity and lowest-common-denominator design |\n| Failure mode | Abstracting every service to stay portable and losing managed-service benefits |\n| Production habit | Decide per workload; avoid portability for its own sake |\n\n### Patterns\n\n| Pattern | Effort | Benefit |\n|---|---|---|\n| Different workloads on different clouds | Low–medium | Best-of-breed |\n| Portable platform (Kubernetes + Terraform) | Medium–high | Easier moves |\n| Same app active on two clouds | Very high | Provider-level resilience |"}, {"id": 162, "title": "Hybrid cloud", "tldr": "Hybrid cloud combines on-premises infrastructure with public cloud, often for data residency, latency to factories or stores, existing investments or gradual migration. Consistent identity, networking, tooling and operations are the hard parts.", "real": "Providers offer hybrid platforms such as AWS Outposts (2019), Azure Arc and Azure Stack, and Google Distributed Cloud, extending cloud APIs and management to on-premises locations.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | On-premises + cloud operating together |\n| Why it matters | Many enterprises can’t move everything |\n| Challenges | Networking, identity, consistent tooling, operations |\n| Trade-off | Flexibility vs complexity |\n| Failure mode | Two completely separate operating models |\n| Production habit | Same IaC, GitOps and observability across both |\n\n### Hybrid architecture\n\n```mermaid\nflowchart LR\n  ONPREM[On-prem: factories, legacy systems] <-->|Direct Connect / ExpressRoute| CLOUD[Cloud VPCs]\n  IDP[Central identity provider] --> ONPREM\n  IDP --> CLOUD\n  GITOPS[GitOps + IaC] --> ONPREM\n  GITOPS --> CLOUD\n```"}, {"id": 163, "title": "Portability tools and their limits", "tldr": "Kubernetes, containers, Terraform and open-source databases improve portability, but data, managed services, IAM, networking and operational tooling still differ per cloud. Plan portability where it matters (data formats, exit plans) rather than everywhere.", "real": "Kubernetes provides a consistent workload API across EKS, AKS and GKE, but each managed offering integrates differently with its cloud’s identity, networking, load balancers and storage.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Reducing switching costs between providers |\n| Why it matters | Negotiation leverage and risk management |\n| Portable | Containers, Kubernetes manifests, Terraform patterns, open formats |\n| Less portable | IAM, networking, managed databases, serverless, data |\n| Trade-off | Portability vs using best native services |\n| Failure mode | Paying a large portability tax for a move that never happens |\n| Production habit | Documented exit plan for critical workloads |\n\n### Portability by layer\n\n| Layer | Portability |\n|---|---|\n| Application code | High |\n| Containers | High |\n| Kubernetes workloads | Medium–high |\n| Managed data services | Low–medium |\n| IAM and networking | Low |"}, {"id": 164, "title": "Data gravity", "tldr": "Large datasets attract applications and services because moving data is slow and costly. Place compute near data, minimize cross-region and cross-cloud transfer, and consider data location early in architecture decisions.", "real": "Dave McCrory coined the term “data gravity” in 2010, and cloud egress pricing reinforces it: moving petabytes between clouds can take weeks and cost significant transfer fees, though several providers reduced or waived egress fees for customers leaving in 2024.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The pull of large datasets on where systems run |\n| Why it matters | Determines feasible architectures and migrations |\n| Trade-off | Central data vs distributed compute |\n| Failure mode | Analytics in one cloud, data in another, paying egress daily |\n| Production habit | Co-locate compute with primary data |\n\n### Transfer time for 1 PB\n\n```text\nAt 10 Gbps sustained: 1 PB ≈ 8 × 10^15 bits / 10^10 bit/s ≈ 800,000 s ≈ 9.3 days\nAt 1 Gbps: ≈ 93 days → offline transfer devices may be faster\n```"}, {"id": 165, "title": "Sovereign cloud and data residency", "tldr": "Data residency and sovereignty requirements dictate where data is stored and processed and who can access it. Options include regional deployments, sovereign cloud offerings operated by local entities, encryption with customer-held keys and on-premises deployments.", "real": "AWS launched its European Sovereign Cloud in Germany in January 2026, and Microsoft and Google offer sovereign cloud programs, responding to European requirements around data control and foreign access.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Controls on data location and jurisdiction |\n| Why it matters | Legal compliance and customer trust |\n| Options | Region pinning, sovereign clouds, customer-managed keys, local providers |\n| Trade-off | Compliance vs feature availability and cost |\n| Failure mode | Backups or logs replicated to non-compliant regions |\n| Production habit | Policies restricting regions; data flow maps |\n\n### Controls\n\n| Control | Example |\n|---|---|\n| Region restriction | Organization policy allowing only EU regions |\n| Key control | Customer-managed or external keys |\n| Access control | Local operator requirements |\n| Data flows | Logs and backups kept in region |"}, {"id": 166, "title": "Edge computing", "tldr": "Edge computing runs workloads close to users or devices: CDN edge functions, regional edge zones, and on-premises edge for factories and retail. It reduces latency and bandwidth but adds distributed operations challenges.", "real": "Cloudflare Workers (2017), AWS Lambda@Edge (2017) and CloudFront Functions (2021), plus AWS Local Zones and Wavelength, extend compute to locations closer to end users.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Compute near users or devices |\n| Why it matters | Latency, bandwidth, offline operation |\n| Types | CDN edge functions, local zones, on-prem edge clusters |\n| Trade-off | Latency vs operational complexity and limits |\n| Failure mode | Edge code depending on a distant central database |\n| Production habit | GitOps for fleets of edge locations |\n\n### Edge placement\n\n| Workload | Location |\n|---|---|\n| Request routing, auth checks | CDN edge |\n| Real-time gaming / media | Local zones |\n| Factory machine data | On-prem edge cluster |\n| Core transactions | Regional cloud |"}, {"id": 167, "title": "Cloud migration strategies", "tldr": "Choose a strategy per application from the “7 Rs”: retire, retain, rehost (lift and shift), relocate, repurchase (SaaS), replatform (lift and reshape) and refactor (re-architect). Portfolio analysis decides which applies.", "real": "Gartner described the original “5 Rs” of cloud migration in 2010, and AWS expanded them to the 6 and later 7 Rs, adding retire, retain and relocate.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Per-application migration approaches |\n| Why it matters | Balances speed, cost and benefits |\n| Trade-off | Fast rehosting vs long-term cloud-native benefits |\n| Failure mode | Refactoring everything before moving anything |\n| Production habit | Portfolio assessment with business priorities |\n\n### The 7 Rs\n\n| Strategy | Meaning |\n|---|---|\n| Retire | Decommission |\n| Retain | Keep on-premises for now |\n| Rehost | Move VMs as-is |\n| Relocate | Move hypervisor-level (e.g. VMware Cloud) |\n| Repurchase | Switch to SaaS |\n| Replatform | Small optimizations (managed DB) |\n| Refactor | Re-architect for cloud-native |"}, {"id": 168, "title": "Executing a migration", "tldr": "Migrate in waves: discover dependencies, build the landing zone, pilot low-risk apps, migrate data with replication and minimal cutover windows, validate, then decommission sources. Track progress and costs throughout.", "real": "Netflix’s migration to AWS, begun after a 2008 database corruption and completed in January 2016, proceeded incrementally over years, moving and re-architecting services in stages.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Planning and running migrations |\n| Why it matters | Migrations fail from hidden dependencies and data issues |\n| Phases | Assess, mobilize, migrate in waves, optimize |\n| Trade-off | Speed vs risk |\n| Failure mode | Cutover reveals an undocumented dependency |\n| Production habit | Dependency mapping and rehearsed cutovers |\n\n### Migration waves\n\n```mermaid\nflowchart LR\n  ASSESS[Assess portfolio + dependencies] --> LZ[Landing zone]\n  LZ --> PILOT[Pilot wave: low risk]\n  PILOT --> WAVES[Waves 2..n]\n  WAVES --> OPT[Optimize: rightsizing, modernization]\n  WAVES --> DECOM[Decommission old infra]\n```"}, {"id": 169, "title": "Database migrations to the cloud", "tldr": "Move databases with replication-based approaches (native replication, CDC services) to keep downtime minimal: full load, continuous sync, validation, brief write freeze, cutover and rollback plan.", "real": "AWS Database Migration Service, Azure Database Migration Service and Google’s Database Migration Service support full load plus ongoing change replication, allowing cutovers with short downtime windows.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Moving data stores with minimal downtime |\n| Why it matters | Data is the riskiest part of migration |\n| Steps | Schema prep, full load, CDC sync, validation, cutover |\n| Trade-off | Downtime vs complexity |\n| Failure mode | Cutover without row-count and checksum validation |\n| Production habit | Rehearse cutover with timing |\n\n### Cutover plan\n\n| Step | Duration target |\n|---|---|\n| Stop writes (maintenance mode) | 0 min |\n| Wait for replication lag = 0 | < 5 min |\n| Validate counts/checksums | < 10 min |\n| Switch connection strings | < 5 min |\n| Smoke tests, reopen | < 10 min |"}, {"id": 170, "title": "Cloud repatriation", "tldr": "Some organizations move workloads from public cloud back to owned or colocated infrastructure, usually for steady, large-scale workloads where owning hardware is cheaper. It requires strong operations capabilities and honest total-cost comparisons.", "real": "37signals (makers of Basecamp and HEY) moved most of its workloads out of the cloud in 2022–2023 and publicly estimated savings of millions of dollars per year, while Dropbox’s earlier move off AWS saved about $75 million over two years.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Moving workloads out of public cloud |\n| Why it matters | Cost or control at large steady scale |\n| When it can make sense | Predictable load, large scale, strong ops team |\n| Trade-off | Lower unit costs vs agility and managed services |\n| Failure mode | Comparing hardware cost only, ignoring people and opportunity costs |\n| Production habit | Full TCO model including staffing and refresh cycles |\n\n### TCO comparison inputs\n\n| Cost | Cloud | Owned |\n|---|---|---|\n| Compute/storage | Usage-based | Hardware + depreciation |\n| Facilities | Included | Colocation, power |\n| People | Fewer ops staff | More ops staff |\n| Elasticity | High | Low (buy for peak) |\n| Managed services | Available | Build/run yourself |"}, {"id": 171, "title": "Internal developer platforms", "tldr": "An internal developer platform (IDP) bundles infrastructure, deployment, environments, observability and security into self-service capabilities so product teams ship without becoming infrastructure experts.", "real": "The CNCF’s 2023 Platforms White Paper described platforms as integrated collections of capabilities offered as products to internal users, and companies such as Spotify, Zalando and Mercado Libre have published accounts of their internal platforms.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Self-service internal infrastructure product |\n| Why it matters | Reduces cognitive load; standardizes good practice |\n| Capabilities | Service creation, CI/CD, environments, infra, observability, security |\n| Trade-off | Platform investment vs fragmented DIY |\n| Failure mode | Platform as a ticket queue rather than self-service |\n| Production habit | Measure time to first deploy for new services |\n\n### Platform layers\n\n```mermaid\nflowchart TB\n  PORTAL[Developer portal + CLI] --> ORCH[Platform orchestration: templates, workflows]\n  ORCH --> CICD[CI/CD + GitOps]\n  ORCH --> INFRA[IaC modules + cloud accounts]\n  ORCH --> RUNTIME[Kubernetes / serverless runtime]\n  ORCH --> OBS[Observability + security defaults]\n```"}, {"id": 172, "title": "Golden paths", "tldr": "Golden paths are opinionated, supported ways to build and run common kinds of software (a REST service, a data pipeline, a frontend) with templates, defaults and documentation. They’re recommended, not mandatory.", "real": "Spotify popularized the term “golden path” for its supported, documented ways of building services, which reduced fragmentation as its engineering organization grew.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Paved, supported routes for common tasks |\n| Why it matters | Fast starts with security and operability built in |\n| Contents | Template repo, pipeline, IaC, dashboards, alerts, docs |\n| Trade-off | Standardization vs flexibility |\n| Failure mode | Golden paths so rigid teams avoid them |\n| Production habit | Version golden paths; migrate existing services gradually |\n\n### Golden path for a service\n\n| Included | Example |\n|---|---|\n| Repository template | Language, tests, linting |\n| CI/CD | Build, scan, sign, deploy |\n| Infrastructure | Namespace, database module |\n| Observability | Dashboards, SLO, alerts |\n| Docs | README, runbook template |"}, {"id": 173, "title": "Developer portals and Backstage", "tldr": "Developer portals provide a software catalog (services, owners, APIs, dependencies), templates for new components, documentation and plugins for CI/CD, cloud and observability views in one place.", "real": "Spotify open-sourced Backstage in 2020; it joined the CNCF and became an incubating project in 2022, with adoption by many organizations as the basis of their developer portals.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Single front door for developers |\n| Why it matters | Discoverability and ownership |\n| Features | Catalog, scaffolder, TechDocs, plugins |\n| Trade-off | Portal maintenance vs scattered information |\n| Failure mode | Stale catalog nobody trusts |\n| Production habit | Catalog entries generated from repositories |\n\n### Catalog entry\n\n```yaml\napiVersion: backstage.io/v1alpha1\nkind: Component\nmetadata:\n  name: orders-api\n  annotations:\n    github.com/project-slug: acme/orders-api\nspec:\n  type: service\n  lifecycle: production\n  owner: team-commerce\n  providesApis: [orders-rest-api]\n  dependsOn: [resource:orders-db]\n```"}, {"id": 174, "title": "Self-service infrastructure", "tldr": "Let developers provision approved infrastructure (databases, queues, buckets, environments) through templates, IaC modules, portals or Kubernetes APIs, with guardrails, cost visibility and ownership built in.", "real": "Crossplane, created by Upbound in 2018 and a CNCF project, lets platform teams expose cloud infrastructure as Kubernetes custom resources, so developers request databases with YAML while platform policies apply.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | On-demand infrastructure with guardrails |\n| Why it matters | Removes ticket queues |\n| Mechanisms | IaC modules, portal templates, Crossplane compositions |\n| Trade-off | Freedom vs governance |\n| Failure mode | Self-service without cost or security controls |\n| Production habit | Policy checks and tags applied automatically |\n\n### Crossplane claim\n\n```yaml\napiVersion: platform.acme.io/v1alpha1\nkind: PostgresInstance\nmetadata: {name: orders-db, namespace: team-commerce}\nspec:\n  parameters:\n    size: medium\n    environment: prod\n    backupRetentionDays: 14\n```\n\n(The platform team’s Composition maps this claim to cloud resources with approved defaults.)"}, {"id": 175, "title": "Measuring developer experience", "tldr": "Measure platform success with delivery metrics (DORA), developer satisfaction surveys, time to first deploy, onboarding time, cognitive load and adoption of golden paths. Combine quantitative and qualitative data.", "real": "The SPACE framework (2021) by Forsgren and colleagues proposed measuring developer productivity across satisfaction, performance, activity, communication and efficiency, warning against single metrics.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Assessing how effectively developers can work |\n| Why it matters | Platform value must be demonstrated |\n| Metrics | DORA, onboarding time, survey scores, golden path adoption |\n| Trade-off | Measurement effort vs insight |\n| Failure mode | Measuring lines of code or commits |\n| Production habit | Quarterly developer survey plus system metrics |\n\n### Platform scorecard\n\n| Metric | Target trend |\n|---|---|\n| Time to first production deploy (new service) | Down |\n| Lead time for changes | Down |\n| Developer satisfaction with platform | Up |\n| Golden path adoption | Up |\n| Platform-related tickets | Down |"}, {"id": 176, "title": "Platform as a product", "tldr": "Run the platform like a product: understand developer users, prioritize by impact, publish a roadmap, provide documentation and support, measure adoption and retire unused capabilities.", "real": "“Team Topologies” (2019) described platform teams as providing a “thinnest viable platform” offered as an internal product, a principle widely adopted in platform engineering.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Product management applied to internal platforms |\n| Why it matters | Platforms fail when built for imagined needs |\n| Practices | User research, roadmap, docs, SLAs, feedback channels |\n| Trade-off | Product overhead vs adoption |\n| Failure mode | Mandating a platform nobody wants to use |\n| Production habit | Platform product manager and user interviews |\n\n### Product practices\n\n| Practice | Example |\n|---|---|\n| Discovery | Interview teams about deployment pain |\n| Thinnest viable platform | Start with templates + docs |\n| SLAs | Platform availability and support response |\n| Deprecation | Communicate and migrate users |"}, {"id": 177, "title": "Environments on demand", "tldr": "Provide ephemeral environments per pull request or feature, created from IaC and GitOps with seeded data, and destroyed automatically. They speed reviews and testing while controlling cost with time limits.", "real": "Tools such as Argo CD ApplicationSets with pull request generators, vCluster and preview environment platforms make per-PR Kubernetes environments practical.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Short-lived environments for testing changes |\n| Why it matters | Parallel testing without shared staging conflicts |\n| Trade-off | Infrastructure cost vs faster feedback |\n| Failure mode | Environments never cleaned up |\n| Production habit | TTL and auto-deletion on PR close |\n\n### Lifecycle\n\n```mermaid\nflowchart LR\n  PR[PR opened] --> CREATE[Create namespace + deploy]\n  CREATE --> SEED[Seed test data]\n  SEED --> TEST[Automated + manual testing]\n  TEST --> CLOSE[PR merged/closed]\n  CLOSE --> DELETE[Destroy environment]\n```"}, {"id": 178, "title": "Platform team structure", "tldr": "Platform teams combine infrastructure, developer tooling, security and SRE skills, organized around platform capabilities (compute, data, CI/CD, observability). They collaborate with product teams, using enabling teams to drive adoption.", "real": "“Team Topologies” describes interaction modes (collaboration, X-as-a-service, facilitating) that platform teams use with stream-aligned teams depending on capability maturity.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Organizing the people who build platforms |\n| Why it matters | Structure determines what the platform becomes |\n| Trade-off | Central expertise vs closeness to product teams |\n| Failure mode | Platform team overloaded with tickets |\n| Production habit | Clear service catalog of what the platform offers |\n\n### Interaction modes\n\n| Mode | When |\n|---|---|\n| Collaboration | New capability being designed with a team |\n| X-as-a-service | Mature, self-service capability |\n| Facilitating | Helping teams adopt practices |"}, {"id": 179, "title": "Templates and scaffolding", "tldr": "Templates create new services, pipelines and infrastructure consistently. Keep templates small, tested and versioned, provide upgrade paths for existing services and avoid copy-paste divergence.", "real": "Backstage’s Software Templates, Cookiecutter and Yeoman generate projects from templates, and tools such as Renovate keep generated services’ dependencies current after creation.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Generators for standard projects |\n| Why it matters | Consistency from day one |\n| Trade-off | Template maintenance vs drift |\n| Failure mode | Services created years ago never updated |\n| Production habit | Shared libraries and reusable workflows instead of copied code |\n\n### What templates include\n\n| Layer | Example |\n|---|---|\n| Code | Service skeleton, health endpoints, logging |\n| CI | Reusable workflow reference |\n| Deploy | Helm/Kustomize base, GitOps registration |\n| Ops | Dashboard, alerts, runbook stub |\n| Catalog | catalog-info.yaml |"}, {"id": 180, "title": "Measuring platform success", "tldr": "A successful platform shows adoption, faster delivery, fewer incidents from misconfiguration, lower cost per service and satisfied developers. Report outcomes regularly and adjust the roadmap based on evidence.", "real": "Gartner’s 2022 prediction that 80% of large software engineering organizations would have platform teams by 2026 increased pressure on platform teams to demonstrate measurable value.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Evaluating platform outcomes |\n| Why it matters | Justifies investment and guides priorities |\n| Trade-off | Measurement effort vs credibility |\n| Failure mode | Reporting features shipped instead of outcomes |\n| Production habit | Quarterly platform review with stakeholders |\n\n### Outcome metrics\n\n| Outcome | Metric |\n|---|---|\n| Speed | Lead time, time to first deploy |\n| Reliability | Change failure rate, incidents from config |\n| Security | Critical findings on golden path vs off-path |\n| Cost | Cost per service, idle resources |\n| Satisfaction | Developer survey score |"}, {"id": 181, "title": "Case study: the 2017 Amazon S3 outage", "tldr": "An operator command intended to remove a small number of S3 servers in us-east-1 removed a larger set, including subsystems that needed full restarts. Many services depending on S3, including parts of AWS itself, were disrupted for hours.", "real": "AWS’s post-event summary for February 28, 2017 explained that the restart took longer than expected because the subsystems had not been fully restarted in years, and AWS added safeguards so capacity could be removed only slowly and not below minimum levels.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Trigger | Mistyped input in an operational command |\n| Amplifier | Large blast radius; slow subsystem restarts |\n| Lessons | Rate-limit destructive tools; test full restarts; reduce dependencies on a single region |\n| Production habit | Guardrails in operational tooling |\n\n### Lessons\n\n| Lesson | Practice |\n|---|---|\n| Tools can remove too much | Minimum capacity checks in tooling |\n| Restarts untested at scale | Regular recovery drills |\n| Status page depended on S3 | Independent status infrastructure |"}, {"id": 182, "title": "Case study: AWS us-east-1, December 2021", "tldr": "An automated scaling activity triggered unexpected behavior in AWS’s internal network, causing congestion between internal and main networks that impaired many services and AWS’s own monitoring and tooling for hours.", "real": "AWS’s December 7, 2021 summary noted that the congestion also affected its internal monitoring, slowing diagnosis, and that customers’ multi-AZ applications using affected control-plane APIs (such as launching instances) saw impact.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Trigger | Automated scaling in internal network |\n| Amplifier | Monitoring and control planes affected |\n| Lessons | Static stability; avoid relying on control-plane actions during incidents |\n| Production habit | Pre-provisioned capacity rather than launching during failures |\n\n### Static stability\n\n```mermaid\nflowchart LR\n  NORMAL[Normal: 3 AZs, pre-provisioned capacity] --> FAIL[Control plane impaired]\n  FAIL --> OK[Existing capacity keeps serving: no new launches needed]\n```"}, {"id": 183, "title": "Case study: AWS DynamoDB DNS, October 2025", "tldr": "A latent race condition in DynamoDB’s automated DNS management left the regional endpoint with an empty DNS record in us-east-1, making DynamoDB unreachable and cascading to many AWS services and customer applications that depended on it.", "real": "AWS’s post-event summary for October 20, 2025 described how two DNS automation components interacted to delete the active DNS plan, and how recovery of dependent services such as EC2 instance launches took many additional hours.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Trigger | Race condition in DNS automation |\n| Amplifier | Foundational service dependency; slow recovery of dependent systems |\n| Lessons | Guard automation against concurrent updates; map dependencies; plan regional independence |\n| Production habit | Dependency maps for critical services |\n\n### Lessons for your systems\n\n| Lesson | Practice |\n|---|---|\n| Automation can cause outages | Safety checks, staged automation changes |\n| Hidden dependencies | Map transitive dependencies on cloud services |\n| Recovery takes longer than failure | Practice recovery from cold states |"}, {"id": 184, "title": "Case study: Google Cloud, June 2025", "tldr": "A new feature in Google Cloud’s Service Control system, deployed without a feature flag, crashed when it encountered a policy containing unexpected blank fields, causing widespread API failures across Google Cloud and dependent services globally.", "real": "Google’s incident report for June 12, 2025 explained that the faulty code path was triggered by a policy change replicated globally within seconds, and committed to feature-flagging new functionality and improving error handling.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Trigger | Policy data with blank fields hitting unflagged new code |\n| Amplifier | Global, near-instant replication of configuration |\n| Lessons | Feature flags for new code paths; fail open safely; staged config propagation |\n| Production habit | Validate config inputs; stage global data changes |\n\n### Defense in depth\n\n```mermaid\nflowchart LR\n  CODE[New code path] --> FLAG[Behind feature flag]\n  CONFIG[Config/policy change] --> VALIDATE[Schema validation]\n  VALIDATE --> STAGE[Regional staged rollout]\n  FLAG --> SAFE[Graceful handling of bad input]\n```"}, {"id": 185, "title": "Case study: CrowdStrike, July 2024", "tldr": "A faulty content configuration update for CrowdStrike’s Falcon sensor caused Windows systems to crash on boot worldwide, affecting about 8.5 million devices and disrupting airlines, hospitals and banks; recovery often required manual fixes per machine.", "real": "Microsoft estimated about 8.5 million Windows devices were affected on July 19, 2024, and CrowdStrike committed to staged deployment of content updates with customer control over timing.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Trigger | Faulty content update with out-of-bounds read |\n| Amplifier | Simultaneous global rollout; kernel-level component |\n| Lessons | Staged rollouts for all updates, including content/config |\n| Production habit | Canary groups for every update channel |\n\n### Rollout rings\n\n| Ring | Scope |\n|---|---|\n| 0 | Internal machines |\n| 1 | Early adopters (small %) |\n| 2 | Broader population |\n| 3 | Everyone (critical systems last) |"}, {"id": 186, "title": "Case study: Cloudflare, November 2025", "tldr": "A database permissions change caused a query generating Cloudflare’s Bot Management feature file to return duplicate rows, doubling the file’s size beyond a hard limit in its proxy software, which then failed and returned errors for a large share of traffic.", "real": "Cloudflare’s postmortem for November 18, 2025 described the file being regenerated every few minutes, causing the system to fluctuate between good and bad states before engineers stopped propagation and restored a known-good file.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Trigger | Permissions change altering a query’s results |\n| Amplifier | Generated configuration propagated globally; hard limit caused failure |\n| Lessons | Validate generated config like code; fail safely on oversized input |\n| Production habit | Size and schema checks before distributing config |\n\n### Safe config generation\n\n| Check | Purpose |\n|---|---|\n| Schema validation | Reject malformed data |\n| Size limits checked before publish | Catch growth anomalies |\n| Canary propagation | Limit blast radius |\n| Last-known-good fallback | Keep serving safely |"}, {"id": 187, "title": "Case study: Facebook BGP, October 2021", "tldr": "A command during routine maintenance unintentionally disconnected Facebook’s backbone; its DNS servers then withdrew BGP routes as designed when they lost backbone connectivity, making Facebook, Instagram and WhatsApp unreachable for about six hours.", "real": "Facebook’s engineering post explained that engineers needed physical access to datacenters because remote tools depended on the network that was down, and that physical security measures slowed access.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Trigger | Maintenance command; audit tool bug didn’t stop it |\n| Amplifier | DNS withdrawal; recovery tools dependent on the same network |\n| Lessons | Out-of-band access; recovery paths independent of production |\n| Production habit | Break-glass procedures tested regularly |\n\n### Recovery independence\n\n| Recovery need | Independent path |\n|---|---|\n| Network access | Out-of-band management network |\n| Communication | Chat/status outside main infrastructure |\n| Credentials | Break-glass accounts |"}, {"id": 188, "title": "Case study: GitLab database incident, 2017", "tldr": "During a database replication problem, an engineer accidentally deleted data on the primary database; several backup mechanisms turned out not to be working, and about six hours of production data were lost.", "real": "GitLab’s January 31, 2017 postmortem, written and live-streamed transparently, listed backup procedures that had silently failed and led to restore testing becoming a standard recommendation across the industry.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Trigger | Command run on the wrong server during an incident |\n| Amplifier | Untested, broken backups |\n| Lessons | Test restores; distinguish environments clearly; limit destructive commands |\n| Production habit | Automated restore tests with alerts |\n\n### Backup verification\n\n```mermaid\nflowchart LR\n  BACKUP[Scheduled backup] --> RESTORE[Automated restore to test instance]\n  RESTORE --> CHECK[Row counts + app checks]\n  CHECK -->|fail| ALERT[Alert owners]\n  CHECK -->|pass| RECORD[Record restore time]\n```"}, {"id": 189, "title": "Case study: Knight Capital, 2012", "tldr": "A deployment updated only seven of eight servers; a repurposed feature flag activated obsolete code on the remaining server, which sent millions of erroneous orders. Knight Capital lost about $440 million in 45 minutes.", "real": "The US SEC’s 2013 order against Knight Capital described the incomplete manual deployment, the reused flag and the lack of adequate controls, making it a classic case study in deployment safety.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Trigger | Incomplete manual deployment + repurposed flag |\n| Amplifier | No automated kill switch or verification |\n| Lessons | Automated, verified deployments; never reuse flags; kill switches |\n| Production habit | Deployment verification that all instances run the same version |\n\n### Controls that would help\n\n| Control | Effect |\n|---|---|\n| Automated deployments | No missed servers |\n| Version consistency checks | Detect mismatched fleet |\n| Flag hygiene | No repurposed flags |\n| Circuit breakers / kill switch | Stop runaway behavior quickly |"}, {"id": 190, "title": "Common threads in major outages", "tldr": "Across major incidents, recurring themes appear: configuration and automation changes, global propagation without staging, hidden dependencies, recovery tooling depending on failed systems, untested recovery and slow detection.", "real": "Public postmortems from AWS, Google Cloud, Cloudflare, Facebook, CrowdStrike and GitLab repeatedly cite staged rollouts, dependency awareness and tested recovery as their main corrective actions.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Patterns across industry incidents |\n| Why it matters | Learn from others’ expensive lessons |\n| Production habit | Review notable postmortems as a team quarterly |\n\n### Themes and defenses\n\n| Theme | Defense |\n|---|---|\n| Changes trigger most outages | Staged rollouts for code, config and data |\n| Global propagation | Regional rings, validation, kill switches |\n| Hidden dependencies | Dependency mapping, static stability |\n| Recovery tools fail too | Out-of-band, independent recovery paths |\n| Backups untested | Automated restore tests |\n| Slow detection | User-centric SLO alerts, synthetics |"}, {"id": 191, "title": "Capstone: a secure landing zone", "tldr": "Build a multi-account foundation: organization structure, SSO with MFA, centralized logging and security accounts, network hub, guardrails (region restrictions, logging protection), baseline security services and account vending through IaC.", "real": "AWS Control Tower, Azure landing zone accelerators and Google Cloud’s foundation blueprints implement these elements, and many organizations extend them with Terraform-based account vending.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Accounts | Management, log archive, security tooling, network, workloads (prod/non-prod), sandbox |\n| Identity | SSO, MFA, permission sets by role |\n| Guardrails | Region allow-list, deny log tampering, deny public storage |\n| Security | Org-wide audit logs, threat detection, posture management |\n| Delivery | Account vending via IaC pipeline |\n\n### Structure\n\n```mermaid\nflowchart TB\n  ORG[Organization] --> SEC[Security OU: log archive + audit]\n  ORG --> INF[Infrastructure OU: network hub]\n  ORG --> WL[Workloads OU]\n  WL --> P[Prod accounts]\n  WL --> NP[Non-prod accounts]\n  ORG --> SB[Sandbox OU: budgets + auto-cleanup]\n```"}, {"id": 192, "title": "Capstone: a three-tier web application", "tldr": "Deploy a production web application: CDN and WAF, load balancer in public subnets, containerized app in private subnets across three AZs, managed multi-AZ database, cache, object storage, secrets manager, autoscaling, observability and CI/CD.", "real": "This capstone follows reference architectures published in the AWS, Azure and Google Cloud architecture centers for highly available web applications.", "body": "### Engineering card\n\n| Aspect | Detail |\n|---|---|\n| Availability | 3 AZs, multi-AZ database, autoscaling |\n| Security | WAF, private subnets, IAM roles, secrets manager, TLS |\n| Delivery | IaC + CI/CD with canary deploys |\n| Observability | Metrics, logs, traces, SLO alerts |\n| Cost | Rightsized instances, savings plans for baseline |\n\n### Architecture\n\n```mermaid\nflowchart L

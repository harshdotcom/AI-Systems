approval pending |\n\n### Capacity chart (example)\n\n```chart\n{\"title\": \"Sprint capacity allocation (example, person-days)\", \"unit\": \"days\", \"data\": [[\"Committed engineering\", 24], [\"Experiments\", 8], [\"Interrupts / on-call\", 7], [\"Tech debt\", 5], [\"Buffer\", 2]]}\n```"}, {"id": 63, "title": "Definition of done for AI work", "tldr": "A definition of done for AI features includes code quality and tests plus eval results, monitoring, cost checks, documentation and safety review. Without it, “done” models and prompts often fail in production.", "real": "Scrum formalizes the “Definition of Done” as a shared quality standard for completed work, and AI teams extend it with eval and monitoring criteria because passing unit tests says little about model output quality.", "body": "### Definition of done checklist\n\n- [ ] Code reviewed and merged\n- [ ] Unit and integration tests passing\n- [ ] Eval suite run; meets quality bar; no regressions\n- [ ] Safety / red-team cases pass\n- [ ] Latency and cost per request within targets\n- [ ] Logging and monitoring in place\n- [ ] Feature flag and rollback plan\n- [ ] Documentation and runbook updated\n- [ ] Prompt and model versions recorded\n\n### Done vs “works on my machine”\n\n| Not done | Done |\n|---|---|\n| Prompt looks good on 5 examples | Passes 200-case eval set |\n| Model deployed | Model deployed with monitoring and rollback |"}, {"id": 64, "title": "Backlog management", "tldr": "A healthy backlog is prioritized, small at the top, and regularly pruned. For AI teams, include experiments, eval improvements, data tasks and tech debt alongside features, with clear acceptance criteria.", "real": "Many teams follow the guideline of refining only the next two to three sprints of work in detail, a practice common in agile coaching, because detailed planning far ahead is often wasted as priorities change.", "body": "### Backlog structure\n\n| Section | Content |\n|---|---|\n| Ready (top) | Refined, estimated, acceptance criteria |\n| Next | Understood, needs refinement |\n| Later | Ideas, rough |\n| Icebox | Not planned; review quarterly |\n\n### Ticket template for AI tasks\n\n```\nTitle: Improve groundedness for policy questions\nWhy: 8% of policy answers include unsupported claims\nAcceptance: groundedness ≥ 95% on policy eval subset; no latency increase > 200 ms\nType: Quality iteration (time-box 1 week)\nOwner: Asha\n```\n\n### Pruning rule\n\nDelete or archive items untouched for six months unless still strategic."}, {"id": 65, "title": "Integrating experiments into delivery", "tldr": "Track experiments like work items, with hypotheses, owners, time boxes, results and decisions. Record results in a shared experiment log so learnings are not lost and failed ideas are not repeated.", "real": "Experiment tracking tools such as MLflow (open-sourced by Databricks in 2018) and Weights & Biases record parameters, metrics and artifacts for each run, making experiments reproducible and comparable across team members.", "body": "### Experiment lifecycle\n\n```mermaid\nflowchart LR\n  H[Hypothesis] --> P[Plan + time box]\n  P --> R[Run + track]\n  R --> A[Analyze]\n  A --> D[Decision]\n  D --> LOG[Experiment log]\n```\n\n### Experiment log entry\n\n| Field | Example |\n|---|---|\n| ID | EXP-042 |\n| Hypothesis | Hybrid search improves recall |\n| Result | Recall@5 0.78 → 0.86 |\n| Cost impact | +4% |\n| Decision | Adopt |\n| Links | Run IDs, eval report |"}, {"id": 66, "title": "Retrospectives", "tldr": "Retrospectives help the team improve its process regularly. Create safety, look at data and events, find root causes, and commit to one or two concrete improvements. Follow up on previous actions.", "real": "Norm Kerth’s “Project Retrospectives” (2001) introduced the retrospective “prime directive”, the assumption that everyone did the best job they could given what they knew at the time, which many teams read at the start of retros.", "body": "### Format (60 minutes)\n\n| Minutes | Activity |\n|---|---|\n| 5 | Prime directive, check previous actions |\n| 10 | Data: metrics, timeline of events |\n| 20 | What went well / what didn’t / puzzles |\n| 15 | Root causes for top issue |\n| 10 | 1–2 actions with owners |\n\n### Useful formats\n\n| Format | Use |\n|---|---|\n| Start / stop / continue | General |\n| Timeline | After incidents or launches |\n| Sailboat (wind, anchors, rocks) | Team dynamics |\n| 5 whys | Root cause |"}, {"id": 67, "title": "Demos and sharing results", "tldr": "Regular demos show progress, create accountability and celebrate work. For AI teams, demo real outputs including failures, show eval results, and explain what was learned from experiments.", "real": "Agile sprint reviews were designed to inspect working results with stakeholders, and AI teams commonly add “eval reviews” where they walk through example outputs and metrics rather than polished slides.", "body": "### Demo agenda (30 minutes)\n\n| Minutes | Content |\n|---|---|\n| 5 | Goal and metrics recap |\n| 15 | Live demos of shipped work |\n| 5 | Experiment results (wins and failures) |\n| 5 | Questions and feedback |\n\n### Demo good practices\n\n- Show real examples, including failure cases\n- Use the team member who built it as presenter\n- Show eval numbers, not only cherry-picked outputs\n- Record for remote stakeholders"}, {"id": 68, "title": "Balancing research and delivery cadence", "tldr": "Research needs long, uninterrupted exploration; delivery needs frequent shipping. Protect research time with dedicated people or periods, define decision points, and connect research to product goals.", "real": "Many AI organizations separate longer-horizon research teams from applied product teams, while connecting them through shared roadmaps and “research-to-production” handoffs, so research progress can reach products.", "body": "### Options\n\n| Model | How |\n|---|---|\n| Dedicated researcher | One person focuses on research track |\n| Research weeks | Rotating research periods |\n| 20% exploration | Fixed slice for everyone |\n| Research spikes | Time-boxed when needed |\n\n### Research-to-delivery flow\n\n```mermaid\nflowchart LR\n  R[Research prototype] --> E[Eval proof]\n  E --> H[Handoff design review]\n  H --> P[Productionize]\n  P --> M[Monitor]\n```"}, {"id": 69, "title": "Roadmaps with stakeholders", "tldr": "Share roadmaps that show goals and confidence levels: committed near-term work, likely next work and exploratory later bets. Update regularly and explain changes. Avoid fixed dates for uncertain AI capabilities.", "real": "“Now, next, later” roadmap formats became popular in product teams as an alternative to date-driven Gantt charts, because they communicate priority and confidence without false precision.", "body": "### Roadmap format\n\n| Horizon | Item | Confidence |\n|---|---|---|\n| Now (this month) | Billing assistant beta | High |\n| Next (1–3 months) | Refund actions with approval | Medium |\n| Later (3–6 months) | Proactive support agent | Low |\n\n### Update rhythm\n\nMonthly roadmap review with stakeholders; explain what moved and why."}, {"id": 70, "title": "Delivery metrics", "tldr": "Measure delivery health with a small set of metrics: deployment frequency, lead time for changes, change failure rate and recovery time (DORA metrics), plus AI-specific ones such as eval pass rate, experiment cycle time and cost per request.", "real": "The DORA research program identified four key software delivery metrics. Its 2024 report also found that increased AI adoption was associated with estimated decreases in delivery throughput and stability, a reminder to measure rather than assume AI gains.", "body": "### DORA metrics\n\n| Metric | Measures |\n|---|---|\n| Deployment frequency | How often you ship |\n| Lead time for changes | Commit to production time |\n| Change failure rate | % of changes causing failures |\n| Recovery time | Time to restore after failure |\n\n### AI-specific additions\n\n| Metric | Measures |\n|---|---|\n| Eval pass rate trend | Quality |\n| Experiment cycle time | Learning speed |\n| Model/prompt rollback count | Release quality |\n| Cost per request | Efficiency |\n\n### Caution\n\nUse metrics to improve the system, never to rank individuals."}, {"id": 71, "title": "Engineering standards", "tldr": "Standards define how the team builds: code style, testing, reviews, documentation, eval requirements, security and deployment. Write them down, automate enforcement where possible, and keep them short and agreed by the team.", "real": "Google published its engineering practices documentation for code review in 2019, describing standards for reviewers and authors, which many teams adopted as a reference for their own guidelines.", "body": "### Standards document (outline)\n\n| Area | Example standard |\n|---|---|\n| Code style | Formatter and linter enforced in CI |\n| Testing | Unit tests for logic; integration tests for APIs |\n| Evals | Required for prompt/model/retrieval changes |\n| Reviews | One approval; two for critical paths |\n| Docs | Design doc for changes over 1 week |\n| Security | No secrets in code; dependency scanning |\n| Deployment | Feature flags, staged rollouts |\n| Observability | Logs, metrics, traces for every service |\n\n### Automation first\n\n```mermaid\nflowchart LR\n  COMMIT[Commit] --> LINT[Lint + format]\n  LINT --> TEST[Tests]\n  TEST --> EVAL[Evals if AI change]\n  EVAL --> SCAN[Security scan]\n  SCAN --> REVIEW[Human review]\n```"}, {"id": 72, "title": "Code review culture", "tldr": "Code review improves quality, spreads knowledge and maintains standards. Keep reviews fast, kind and focused on important issues; use checklists; automate style checks; and review AI-generated code with extra care.", "real": "A 2013 Microsoft study by Bacchelli and Bird found that while developers expect code review mainly to find defects, much of its actual value comes from knowledge transfer, team awareness and finding alternative solutions.", "body": "### Review guidelines\n\n| For authors | For reviewers |\n|---|---|\n| Small PRs (< 400 lines) | Respond within 1 working day |\n| Clear description and test evidence | Focus on correctness, design, risk |\n| Self-review first | Explain the “why” behind comments |\n| Mark AI-generated parts if policy requires | Distinguish blocking vs optional comments |\n\n### Review checklist for AI changes\n\n- [ ] Eval results attached; no regressions\n- [ ] Prompt changes versioned\n- [ ] Error handling for model failures and timeouts\n- [ ] Cost and latency impact considered\n- [ ] No sensitive data in logs or prompts\n- [ ] Input from external content treated as untrusted"}, {"id": 73, "title": "Testing ML and LLM systems", "tldr": "Test AI systems at several levels: unit tests for code, data validation tests, model and eval tests, integration tests with mocked or real model calls, and production monitoring. Deterministic tests cover code; evals cover model behavior.", "real": "Google’s “ML Test Score” paper (Breck et al., 2017) proposed a rubric of tests for production ML systems covering data, model development, infrastructure and monitoring, used by teams to assess production readiness.", "body": "### Test pyramid for AI systems\n\n```mermaid\nflowchart TB\n  MON[Production monitoring] --> E2E[End-to-end tests with real models: few]\n  E2E --> EVAL[Eval suites: quality, safety, regression]\n  EVAL --> INT[Integration tests with mocked models]\n  INT --> DATA[Data validation tests]\n  DATA --> UNIT[Unit tests: many]\n```\n\n### What each level catches\n\n| Level | Catches |\n|---|---|\n| Unit | Logic bugs, parsing |\n| Data validation | Schema changes, missing values |\n| Integration (mocked) | Wiring, error handling |\n| Evals | Quality and safety regressions |\n| End-to-end | Real system behavior |\n| Monitoring | Drift, live failures |"}, {"id": 74, "title": "CI/CD for AI systems", "tldr": "Continuous integration and delivery for AI includes running evals automatically, versioning prompts, models and data, gating releases on quality thresholds, deploying gradually and rolling back quickly.", "real": "The July 2024 CrowdStrike incident, in which a faulty content update caused about 8.5 million Windows devices to crash, led to widespread discussion of staged rollouts and validation gates, practices that apply equally to model and prompt updates.", "body": "### Pipeline\n\n```mermaid\nflowchart LR\n  PR[Pull request] --> CI[Tests + evals]\n  CI --> GATE{Quality gates pass?}\n  GATE -- yes --> STAGE[Staging]\n  STAGE --> CANARY[Canary 5%]\n  CANARY --> FULL[Full rollout]\n  GATE -- no --> BLOCK[Blocked]\n  FULL --> MON[Monitoring + auto-rollback]\n```\n\n### Versioned artifacts\n\n| Artifact | Versioning |\n|---|---|\n| Code | Git |\n| Prompts | Git, with version IDs logged |\n| Models | Model registry |\n| Datasets / eval sets | Data versioning tools |\n| Config | Git, environment-specific |"}, {"id": 75, "title": "Reproducibility", "tldr": "AI work must be reproducible: same data, code, configuration and seeds should produce comparable results. Track experiments, version data and environments, and document how results were produced.", "real": "Concerns about reproducibility in machine learning research led conferences such as NeurIPS to introduce reproducibility checklists for paper submissions from 2019 onward.", "body": "### Reproducibility checklist\n\n- [ ] Code commit recorded\n- [ ] Data version or snapshot recorded\n- [ ] Config and hyperparameters logged\n- [ ] Random seeds set where possible\n- [ ] Environment pinned (containers, dependency locks)\n- [ ] Model and prompt versions recorded\n- [ ] Eval set version recorded\n- [ ] Results stored with run ID\n\n### Note on LLMs\n\nAPI models can change behavior over time and sampling adds randomness; pin model versions, set temperature appropriately, and run evals multiple times when comparing close results."}, {"id": 76, "title": "Design docs and RFCs", "tldr": "Design docs explain a significant technical change: context, goals, non-goals, proposed design, alternatives, risks and rollout. They improve decisions, involve reviewers early and record reasoning for the future.", "real": "Google’s engineering culture is known for design documents written before significant implementation work, and many companies run RFC (request for comments) processes where engineers propose changes for team review.", "body": "### Design doc template\n\n| Section | Content |\n|---|---|\n| Context | Problem and background |\n| Goals / non-goals | What’s in and out of scope |\n| Proposal | Architecture, data flow, APIs |\n| Alternatives | Options considered and why rejected |\n| Evaluation plan | How quality will be measured |\n| Risks | Technical, security, cost |\n| Rollout | Phases, flags, rollback |\n| Open questions | Items needing input |\n\n### When to write one\n\n| Change | Design doc? |\n|---|---|\n| Bug fix | No |\n| Small feature | Short note |\n| New service, model approach or vendor | Yes |\n| Cross-team change | Yes, with wider review |"}, {"id": 77, "title": "Architecture decision records", "tldr": "Architecture decision records (ADRs) are short documents capturing a decision, its context, options and consequences. They prevent repeated debates and help new team members understand why the system is the way it is.", "real": "Michael Nygard proposed lightweight architecture decision records in a 2011 blog post, and the practice has since been widely adopted, including in government digital services and open-source projects.", "body": "### ADR template\n\n```\nADR-012: Use hybrid search (BM25 + embeddings) for retrieval\nStatus: Accepted (2026-03-10)\nContext: Pure vector search missed exact product codes and policy numbers.\nDecision: Combine keyword and vector search with reranking.\nAlternatives: Vector-only (lower recall on codes); keyword-only (poor semantic match).\nConsequences: +15 ms latency; two indexes to maintain; recall@5 0.78 → 0.86.\n```\n\n### Practices\n\n- Store ADRs in the repository\n- Number them sequentially\n- Never delete; supersede with new ADRs\n- Link from design docs and code"}, {"id": 78, "title": "Managing technical debt", "tldr": "Technical debt is the future cost of shortcuts. Make it visible, quantify its impact, allocate fixed capacity to pay it down, and prioritize debt that slows the team or creates risk. AI systems accumulate prompt, data and eval debt too.", "real": "Ward Cunningham coined the “technical debt” metaphor in 1992, and Google’s 2015 paper on hidden technical debt in ML systems extended it to ML-specific issues such as entangled data dependencies and pipeline jungles.", "body": "### Debt register\n\n| Item | Impact | Effort | Priority |\n|---|---|---|---|\n| No eval suite for summarizer | Regressions undetected | 1 week | High |\n| Hard-coded model provider | Can’t switch vendors | 2 weeks | Medium |\n| Undocumented data pipeline | Bus factor 1 | 3 days | High |\n| Duplicate prompt templates | Inconsistent behavior | 2 days | Medium |\n\n### Allocation\n\nCommonly 10–20% of each sprint, plus dedicated time after major launches.\n\n### Explaining debt to stakeholders\n\n“This shortcut costs us about 2 days every sprint in manual fixes; fixing it takes 1 week.”"}, {"id": 79, "title": "Security basics for AI teams", "tldr": "AI teams must handle classic security (secrets, access control, dependencies) plus AI-specific risks: prompt injection, data leakage through models, insecure tool use, poisoned data, and unsafe AI-generated code. Make security part of normal work.", "real": "OWASP publishes a Top 10 for LLM applications (2025 edition) covering risks such as prompt injection, sensitive information disclosure, supply chain risks, excessive agency and system prompt leakage, which many teams use as a checklist.", "body": "### Security checklist\n\n| Area | Practice |\n|---|---|\n| Secrets | Vault or secret manager; no keys in code or prompts |\n| Access | Least privilege for data, models and tools |\n| Dependencies | Scanning, pinned versions |\n| Prompt injection | Treat external content as untrusted |\n| Tools / agents | Limited permissions, confirmations |\n| Data | Encryption, PII handling, retention |\n| AI-generated code | Review for vulnerabilities |\n| Logging | No sensitive data in logs |\n\n### Team habits\n\nThreat model new features, include security cases in evals, and run periodic red-team sessions."}, {"id": 80, "title": "Quality gates and release readiness", "tldr": "Quality gates are explicit criteria that must be met before code, models or prompts reach users. Gates combine automated checks (tests, evals, security scans) with human reviews for high-risk changes.", "real": "Knight Capital lost about $440 million in roughly 45 minutes in 2012 after a faulty deployment activated old code on one of its servers, a widely cited case for disciplined deployment processes and release checks.", "body": "### Gate checklist\n\n| Gate | Criteria |\n|---|---|\n| Code | Tests pass, review approved |\n| Quality | Eval thresholds met, no critical regressions |\n| Safety | Red-team suite passes |\n| Performance | Latency and cost within targets |\n| Security | Scans clean, secrets check |\n| Operations | Monitoring, alerts, rollback tested |\n| Communication | Release notes, support informed |\n\n### Release flow\n\n```mermaid\nflowchart LR\n  READY[Change ready] --> AUTO[Automated gates]\n  AUTO --> HUMAN{High risk?}\n  HUMAN -- yes --> REVIEW[Lead / security review]\n  HUMAN -- no --> DEPLOY[Deploy with flag]\n  REVIEW --> DEPLOY\n```"}, {"id": 81, "title": "The AI coding tool landscape", "tldr": "AI development tools range from inline completion to chat assistants in the IDE, code review bots and autonomous coding agents that edit files, run tests and open pull requests. Leads must choose tools, set policies and adapt workflows.", "real": "GitHub Copilot launched in 2021 as an inline completion tool; by 2025, agentic tools such as Claude Code, Cursor’s agent, OpenAI’s Codex and GitHub Copilot’s coding agent could carry out multi-step tasks and open pull requests. Google’s CEO said in October 2024 that more than a quarter of new code at Google was generated by AI.", "body": "### Tool categories\n\n| Category | What it does | Typical use |\n|---|---|---|\n| Inline completion | Suggests next lines | Everyday coding |\n| IDE chat | Explains, edits, generates | Exploration, refactors |\n| Coding agents | Multi-file changes, runs commands | Features, migrations, fixes |\n| AI code review | Comments on PRs | First-pass review |\n| Test generation | Writes tests | Coverage |\n| Docs generation | Drafts documentation | Maintenance |\n\n### Adoption path\n\n```mermaid\nflowchart LR\n  PILOT[Pilot with volunteers] --> POLICY[Team policy]\n  POLICY --> TRAIN[Shared practices]\n  TRAIN --> MEASURE[Measure impact]\n  MEASURE --> SCALE[Scale or adjust]\n```"}, {"id": 82, "title": "A team policy for AI tools", "tldr": "Write a short AI tool policy covering approved tools, data that may and may not be shared, review requirements, licensing and IP rules, security practices and disclosure norms. Make it practical, not prohibitive.", "real": "In 2023 Samsung restricted employee use of generative AI tools after engineers pasted confidential source code and meeting notes into ChatGPT, an example of why teams need clear data-sharing rules for AI tools.", "body": "### Policy outline\n\n| Section | Example |\n|---|---|\n| Approved tools | Company-licensed assistants with no-training terms |\n| Data rules | No customer data or secrets in prompts unless tool is approved for it |\n| Review | All AI-generated code reviewed like human code |\n| Ownership | Author is responsible for code they submit |\n| Security | Scan generated code; verify dependencies exist |\n| Licensing | Enable duplicate/public code filters where available |\n| Disclosure | Note significant AI use in PR description (if team agrees) |\n\n### Keep it alive\n\nReview the policy quarterly as tools and terms change."}, {"id": 83, "title": "Reviewing AI-generated code", "tldr": "AI-generated code can look correct while hiding subtle bugs, security issues, outdated APIs or invented dependencies. The author must understand and test it; reviewers should focus on logic, edge cases, security and fit with the codebase.", "real": "Research on “package hallucination” (2024–2025) found that code-generating models frequently suggest software packages that do not exist, which attackers can exploit by publishing malicious packages under those names, a risk called “slopsquatting”.", "body": "### Review focus areas\n\n| Area | Question |\n|---|---|\n| Understanding | Can the author explain every line? |\n| Correctness | Edge cases, error handling |\n| Security | Injection, auth, secrets, unsafe defaults |\n| Dependencies | Do packages exist and are they trusted? |\n| Consistency | Follows team patterns? |\n| Tests | Meaningful, not just generated to pass |\n| Size | Is the diff small enough to review well? |\n\n### Rule\n\n“The AI wrote it” is never an explanation for a bug. The submitter owns the code."}, {"id": 84, "title": "The productivity reality of AI tools", "tldr": "AI tools can speed some work dramatically and slow other work. Effects depend on task type, codebase familiarity, tool skill and review overhead. Measure your team’s results rather than relying on vendor claims or personal impressions.", "real": "METR’s 2025 randomized study found experienced open-source developers were 19% slower using AI tools on their own repositories, while believing they were faster; the DORA 2024 report found AI adoption associated with higher individual productivity reports but lower delivery stability on average.", "body": "### Perception vs measurement (METR 2025)\n\n| What was compared | Result |\n|---|---|\n| Developers’ forecast before the tasks | Expected to be 24% faster |\n| Developers’ own estimate afterwards | Believed they were 20% faster |\n| Measured result | 19% slower |\n\n### What to measure\n\n| Metric | Why |\n|---|---|\n| Cycle time by task type | Real speed effect |\n| Change failure rate | Quality effect |\n| Review time | Hidden cost |\n| Rework / reverts | Quality |\n| Developer satisfaction | Experience |\n\n### Lead stance\n\nEncourage use, share what works, and judge by outcomes."}, {"id": 85, "title": "Context files and agent instructions", "tldr": "Coding agents work better with explicit project context: architecture, commands, conventions, testing rules and pitfalls, written in files such as AGENTS.md or CLAUDE.md. Treat these files as team documentation and keep them current.", "real": "AGENTS.md, an open format for instructions to coding agents, was reported to be used by more than 60,000 open-source projects when it was contributed to the Linux Foundation’s Agentic AI Foundation in December 2025.", "body": "### AGENTS.md outline\n\n```markdown\n# Project overview\nRAG assistant service (Python 3.12, FastAPI)\n\n# Commands\n- Install: `uv sync`\n- Test: `pytest -q`\n- Evals: `python -m evals.run --suite smoke`\n\n# Conventions\n- Type hints required; ruff formatting\n- Prompts live in /prompts with version headers\n\n# Rules\n- Never commit secrets or customer data\n- Run smoke evals before proposing prompt changes\n```\n\n### Maintenance\n\nUpdate when tooling or conventions change; review in code review like any other file."}, {"id": 86, "title": "Agentic workflows in the team", "tldr": "Coding agents can take on well-defined tasks: bug fixes, tests, migrations, documentation, small features. Define which tasks suit agents, require tests and review, keep changes small, and keep humans responsible for design decisions.", "real": "In July 2025 a coding agent on Replit deleted a user’s production database during a code freeze; Replit then added stronger separation between development and production environments. The incident shows why agents need sandboxed environments and limited permissions.", "body": "### Good vs poor agent tasks\n\n| Good fit | Poor fit |\n|---|---|\n| Clear, testable changes | Ambiguous product decisions |\n| Repetitive migrations | Security-critical design |\n| Adding tests | Large cross-cutting refactors without review |\n| Fixing well-reproduced bugs | Production operations |\n\n### Safe agent setup\n\n| Control | Example |\n|---|---|\n| Sandbox | Dev containers, no production credentials |\n| Permissions | Read-only for sensitive systems |\n| Approvals | Human confirms destructive commands |\n| Small PRs | Easier review |\n| CI gates | Tests and evals must pass |"}, {"id": 87, "title": "Security and IP concerns with AI tools", "tldr": "AI tools introduce risks: leaking code or data to vendors, generated code with vulnerabilities, license issues from copied code, prompt injection through repositories or documents, and compromised tool extensions. Mitigate with approved tools, scanning and review.", "real": "In July 2025 a malicious prompt instructing destructive actions was inserted into a release of the Amazon Q Developer extension for VS Code; AWS removed the version and said the code would not have executed as intended. This highlights supply-chain risks in AI developer tools.", "body": "### Risk and mitigation\n\n| Risk | Mitigation |\n|---|---|\n| Data leakage to vendor | Enterprise plans with no training, data controls |\n| Vulnerable generated code | SAST scanning, review |\n| License contamination | Public code filters, license scanning |\n| Hallucinated packages | Verify dependencies, lockfiles |\n| Prompt injection via files | Caution with untrusted repos and docs |\n| Malicious extensions | Approved extension list, updates monitored |"}, {"id": 88, "title": "Developing skills when AI writes code", "tldr": "If juniors rely on AI without understanding, they may not build fundamentals. Encourage learning modes: explain-before-accept, writing key parts by hand, pairing with seniors, and reviews that ask “why”. Seniors must also keep deep skills sharp.", "real": "A 2025 Microsoft Research and Carnegie Mellon survey of 319 knowledge workers found that higher confidence in generative AI was associated with less critical thinking effort, while higher self-confidence was associated with more critical thinking.", "body": "### Learning practices\n\n| Practice | Purpose |\n|---|---|\n| Explain before accepting | Understanding, not copying |\n| “No-AI” exercises for core concepts | Fundamentals |\n| Pair programming with seniors | Judgment and design |\n| Review questions: “Why this approach?” | Critical thinking |\n| Debugging without AI first | Problem-solving skill |\n| Read the docs for key APIs | Accurate knowledge |\n\n### Lead role\n\nSet growth goals that include understanding systems deeply, not only shipping tickets."}, {"id": 89, "title": "Measuring AI tool impact", "tldr": "Evaluate AI tools with a mix of delivery metrics, quality metrics, developer experience surveys and controlled comparisons where possible. Look for real outcomes over several months, not first-week enthusiasm.", "real": "The SPACE framework (Forsgren, Storey and colleagues, 2021) recommends measuring developer productivity across satisfaction, performance, activity, communication and efficiency, rather than using a single metric such as lines of code.", "body": "### SPACE-based measurement\n\n| Dimension | Example metric |\n|---|---|\n| Satisfaction | Survey: “AI tools help me do better work” |\n| Performance | Change failure rate, bugs found |\n| Activity | PRs merged (context only) |\n| Communication | Review turnaround |\n| Efficiency | Cycle time, time in review |\n\n### Comparison approach\n\n```mermaid\nflowchart LR\n  BASE[Baseline 2-3 months] --> ADOPT[Adopt tool]\n  ADOPT --> AFTER[Measure 2-3 months]\n  AFTER --> COMPARE[Compare by task type]\n  COMPARE --> DECIDE[Keep, adjust, drop]\n```\n\n### Avoid\n\nLines of code, number of AI suggestions accepted as success metrics on their own."}, {"id": 90, "title": "Team norms for working with AI", "tldr": "Agree team norms for AI use: when to use it, how to verify outputs, how to share good prompts and workflows, how to disclose AI use, and how to keep humans accountable. Norms reduce confusion and spread best practices.", "real": "Shopify’s April 2025 CEO memo made AI usage a baseline expectation and asked teams to show why AI could not do a job before requesting more headcount, while other companies have published guidelines emphasizing human accountability for AI-assisted work.", "body": "### Example team norms\n\n| Norm | Detail |\n|---|---|\n| Use AI freely for drafts | Code, tests, docs |\n| Verify everything | Tests, reviews, eval runs |\n| Own your output | Submitter accountable |\n| Share learnings | Weekly 10-minute “AI tips” slot |\n| Protect data | Follow data rules |\n| Respect choice | No forced tool use for every task |\n\n### Shared prompt library\n\nKeep useful prompts, agent instructions and workflows in the repository so the whole team benefits."}, {"id": 91, "title": "Framing AI problems", "tldr": "Start every AI project with a clear problem statement: user, decision or task, success metric, constraints and the simplest baseline. Many AI projects fail because the problem was vague or AI was not needed.", "real": "Google’s “Rules of Machine Learning” begins with the rule “Don’t be afraid to launch a product without machine learning”, advising teams to start with simple heuristics when they work well enough.", "body": "### Problem framing template\n\n| Field | Example |\n|---|---|\n| User | Support agents |\n| Task | Answer billing questions |\n| Current process | Search wiki, 8 minutes per question |\n| Success metric | Handling time −30%, accuracy ≥ 92% |\n| Constraints | Latency < 5 s, cost < $0.03/answer, EU data only |\n| Simplest baseline | Better keyword search over wiki |\n| AI approach | RAG assistant with citations |\n\n### Go / no-go questions\n\n- Is the problem worth solving?\n- Does a simpler solution work?\n- Do we have the data and access?\n- Can we measure quality?"}, {"id": 92, "title": "Data work leadership", "tldr": "Data quality determines AI quality. Plan data collection, cleaning, labeling, access approvals and versioning as real work with owners and estimates. Leads should protect time for data work, which is often underestimated.", "real": "Andrew Ng promoted “data-centric AI” from 2021, arguing that systematically improving data quality often improves results more than changing models, and organized competitions where teams improved data while keeping the model fixed.", "body": "### Data work breakdown\n\n| Task | Typical effort |\n|---|---|\n| Access approvals | Days to weeks (start early) |\n| Collection and ingestion | Days |\n| Cleaning and deduplication | Days |\n| Labeling guidelines | Days |\n| Labeling | Weeks (depends on volume) |\n| Validation and versioning | Days |\n\n### Data quality checks\n\n- [ ] Coverage of real use cases\n- [ ] Label accuracy (spot checks, agreement)\n- [ ] Freshness\n- [ ] No sensitive data where not allowed\n- [ ] Documented source and license"}, {"id": 93, "title": "Baselines first", "tldr": "Before complex solutions, build simple baselines: rules, keyword search, a single prompt, a small model. Baselines show whether complexity is justified and give a reference point for every improvement.", "real": "Machine learning practitioners commonly report that strong simple baselines, such as BM25 keyword search in retrieval or logistic regression in classification, are surprisingly hard to beat, which is why benchmark papers routinely compare against them.", "body": "### Baseline ladder\n\n```mermaid\nflowchart LR\n  B0[Rules / heuristics] --> B1[Keyword search or simple model]\n  B1 --> B2[Single prompt with a strong model]\n  B2 --> B3[RAG / fine-tuning]\n  B3 --> B4[Agents / complex pipelines]\n```\n\n### Baseline comparison (illustrative)\n\n| Approach | Accuracy | Cost/answer | Build time |\n|---|---|---|---|\n| Keyword search + template | 61% | $0.000 | 2 days |\n| Prompt with full article | 78% | $0.020 | 3 days |\n| RAG + reranking | 89% | $0.012 | 3 weeks |\n\nMove up the ladder only when evidence shows a meaningful gain."}, {"id": 94, "title": "Running experiments well", "tldr": "Good experiments have a clear hypothesis, controlled changes, a fixed eval set, tracked runs, and honest reporting including failures. Change one thing at a time when possible, and check results for statistical noise.", "real": "Ronny Kohavi and colleagues’ book “Trustworthy Online Controlled Experiments” (2020) documents common experimentation pitfalls at companies such as Microsoft, Google and LinkedIn, including misleading results from flawed setups.", "body": "### Experiment hygiene\n\n| Practice | Why |\n|---|---|\n| One main change per run | Clear attribution |\n| Fixed eval set version | Comparable results |\n| Multiple runs for noisy results | Confidence |\n| Track everything | Reproducibility |\n| Report failures | Avoid repeated work |\n| Peer review of conclusions | Catch errors |\n\n### Experiment report\n\n```\nHypothesis: smaller chunks improve recall\nChange: chunk size 1,000 → 400 tokens\nResult: recall@5 0.81 → 0.84 (3 runs, range ±0.01)\nSide effects: index size +2.1×, latency +8 ms\nDecision: adopt for policy docs only\n```"}, {"id": 95, "title": "Evaluation as a team discipline", "tldr": "Evals are the team’s shared definition of quality. Assign eval ownership, build golden sets with domain experts, automate eval runs in CI, review failures weekly, and grow eval sets from production failures.", "real": "Hamel Husain’s widely shared 2024 post “Your AI Product Needs Evals” argued that systematic evaluation, rather than intuition-based “vibe checks”, separates successful LLM products from those that stall after a prototype.", "body": "### Eval system\n\n```mermaid\nflowchart LR\n  EXPERTS[Domain experts] --> GOLDEN[Golden set]\n  PROD[Production failures] --> GOLDEN\n  GOLDEN --> CI[Automated eval runs in CI]\n  CI --> DASH[Dashboard]\n  DASH --> REVIEW[Weekly failure review]\n  REVIEW --> FIX[Fixes]\n```\n\n### Eval ownership\n\n| Role | Responsibility |\n|---|---|\n| Eval owner | Maintains suites, thresholds |\n| Every engineer | Runs evals for their changes |\n| Domain experts | Validate reference answers |\n| Lead | Enforces eval gates |"}, {"id": 96, "title": "From prototype to production", "tldr": "Prototypes prove possibility; production requires reliability, monitoring, security, cost control, scalability, documentation and support. Plan the productionization work explicitly; it is usually larger than the prototype.", "real": "Gartner predicted in 2024 that at least 30% of generative AI projects would be abandoned after proof of concept by the end of 2025, often due to data quality, risk controls, costs or unclear value, all issues that surface during productionization.", "body": "### Prototype vs production\n\n| Aspect | Prototype | Production |\n|---|---|---|\n| Quality | Good examples | Measured on eval sets |\n| Errors | Ignored | Handled, retried, fallbacks |\n| Security | Minimal | Reviewed, tested |\n| Cost | Unknown | Budgeted, monitored |\n| Scale | Few users | Load tested |\n| Ops | None | Monitoring, on-call, runbooks |\n\n### Productionization checklist\n\n- [ ] Eval gates in CI\n- [ ] Error handling and fallbacks\n- [ ] Load and latency testing\n- [ ] Security and privacy review\n- [ ] Cost dashboards and alerts\n- [ ] Monitoring and on-call\n- [ ] Documentation and runbook"}, {"id": 97, "title": "Deployment strategies", "tldr": "Deploy AI changes gradually: shadow mode, internal users, canary percentages, A/B tests, then full rollout, with rollback ready. Model and prompt changes deserve the same caution as code changes.", "real": "Large technology companies commonly release model changes through staged rollouts and online experiments; OpenAI’s April 2025 rollback of a GPT-4o update after sycophantic behavior showed the value of being able to revert quickly.", "body": "### Rollout options\n\n| Strategy | Use |\n|---|---|\n| Shadow mode | New model runs silently; compare outputs |\n| Internal dogfood | Team and company users first |\n| Canary | Small % of traffic |\n| A/B test | Measure impact |\n| Gradual rollout | Increase stepwise |\n\n### Flow\n\n```mermaid\nflowchart LR\n  SHADOW[Shadow] --> DOG[Dogfood]\n  DOG --> CANARY[Canary 5%]\n  CANARY --> AB[A/B 50%]\n  AB --> FULL[100%]\n  FULL -->|issue| ROLLBACK[Rollback]\n```"}, {"id": 98, "title": "Monitoring AI systems", "tldr": "Monitor AI systems for technical health (latency, errors, throughput), quality (sampled evals, feedback), data and input drift, cost and safety signals. Alert on meaningful changes and review dashboards regularly.", "real": "Instacart reported that during the early COVID-19 pandemic in 2020, its item availability prediction accuracy dropped from about 93% to 61% as shopping behavior changed, a clear example of why monitoring for drift is essential.", "body": "### Monitoring layers\n\n| Layer | Metrics |\n|---|---|\n| Infrastructure | Uptime, latency, errors, GPU utilization |\n| Model calls | Token usage, timeouts, provider errors |\n| Quality | Sampled eval scores, user feedback |\n| Data | Input distribution, retrieval miss rate |\n| Safety | Flagged outputs, policy violations |\n| Cost | Cost per request, daily spend |\n\n### Alert examples\n\n| Alert | Threshold |\n|---|---|\n| p95 latency | > 6 s for 10 minutes |\n| Thumbs-down rate | +50% vs 7-day average |\n| Daily spend | > 120% of budget |\n| Retrieval empty results | > 5% of queries |"}, {"id": 99, "title": "Handling failed projects", "tldr": "Some AI projects will fail: quality not reachable, data unavailable, costs too high, or users uninterested. Decide early using checkpoints, communicate honestly, capture learnings, and redeploy people with respect.", "real": "Zillow shut down its Zillow Offers home-buying business in 2021 after its pricing algorithms and operations led to large losses on purchased homes, and the company announced it would reduce its workforce by about 25%, a high-profile example of an ML-driven business failing.", "body": "### Kill criteria (set upfront)\n\n| Criterion | Example |\n|---|---|\n| Quality | < 80% on evals after 6 weeks |\n| Economics | Cost per task > 3× target |\n| Adoption | < 10% of pilot users weekly |\n| Risk | Unresolvable compliance issues |\n\n### Closing a project well\n\n```mermaid\nflowchart LR\n  DECIDE[Decide with data] --> COMM[Communicate honestly]\n  COMM --> LEARN[Write learnings report]\n  LEARN --> REUSE[Keep reusable assets: evals, data, code]\n  REUSE --> REDEPLOY[Redeploy team thoughtfully]\n```\n\n### Message to the team\n\nFailed projects with clear learnings are a success of process; thank people for the work."}, {"id": 100, "title": "Lifecycle checklist for AI projects", "tldr": "Use a lifecycle checklist so nothing important is skipped: problem framing, data, baseline, evals, experiments, production readiness, deployment, monitoring and iteration.", "real": "The CRISP-DM process model (Cross-Industry Standard Process for Data Mining), published in 2000, defined phases from business understanding to deployment and remains a common reference for structuring data and ML projects.", "body": "### Lifecycle\n\n```mermaid\nflowchart LR\n  FRAME[Frame problem] --> DATA[Data]\n  DATA --> BASE[Baseline]\n  BASE --> EVAL[Evals]\n  EVAL --> EXP[Experiments]\n  EXP --> PROD[Productionize]\n  PROD --> DEPLOY[Deploy]\n  DEPLOY --> MON[Monitor]\n  MON --> ITER[Iterate]\n  ITER --> EXP\n```\n\n### Phase gate questions\n\n| Phase | Gate question |\n|---|---|\n| Frame | Clear metric and baseline? |\n| Data | Access, quality, rights confirmed? |\n| Evals | Golden set agreed with stakeholders? |\n| Experiments | Quality bar reached? |\n| Production | Readiness checklist complete? |\n| Deploy | Rollout and rollback plan? |\n| Monitor | Dashboards and alerts live? |"}, {"id": 101, "title": "Infrastructure decisions for AI teams", "tldr": "Leads guide infrastructure choices: hosted model APIs vs self-hosted models, cloud GPU options, orchestration, storage and observability tools. Decide based on team skills, scale, cost, data requirements and how fast you need to move.", "real": "Many teams start with hosted model APIs and managed platforms such as Amazon Bedrock, Azure AI Foundry or Google Vertex AI, and move some workloads to self-hosted open-weight models with serving engines such as vLLM when volume, cost or data control justify it.", "body": "### Decision factors\n\n| Factor | Hosted API | Self-hosted |\n|---|---|---|\n| Speed to start | Fast | Slow |\n| Team skills needed | Low | High (GPU, serving) |\n| Cost at low volume | Low | High |\n| Cost at high, steady volume | Can be high | Can be lower |\n| Data control | Contractual | Full |\n| Customization | Limited | Full |\n\n### Rule\n\nDefault to managed services until a clear need (cost, control, latency) justifies operating your own infrastructure."}, {"id": 102, "title": "Experiment tracking and model registry", "tldr": "Experiment tracking records runs, parameters, metrics and artifacts; a model registry manages approved model versions and their stages. Together they make work reproducible, comparable and auditable.", "real": "MLflow, released as open source by Databricks in 2018, provides experiment tracking and a model registry, and is one of the most widely used open-source MLOps tools, alongside commercial tools such as Weights & Biases.", "body": "### Workflow\n\n```mermaid\nflowchart LR\n  RUN[Training / prompt run] --> TRACK[Tracked: params, metrics, artifacts]\n  TRACK --> COMPARE[Compare runs]\n  COMPARE --> REGISTER[Register best version]\n  REGISTER --> STAGE[Staging]\n  STAGE --> PROD[Production]\n```\n\n### What to record\n\n| Item | Example |\n|---|---|\n| Code version | Git commit |\n| Data version | Dataset snapshot ID |\n| Parameters | Learning rate, prompt version, temperature |\n| Metrics | Eval scores, latency, cost |\n| Artifacts | Model weights, eval reports |\n| Owner and notes | Who and why |"}, {"id": 103, "title": "Data and feature pipelines", "tldr": "Reliable pipelines move and transform data for training, retrieval and features. Leads ensure pipelines are owned, tested, monitored, versioned and documented, with data contracts between producers and consumers.", "real": "Workflow orchestrators such as Apache Airflow (created at Airbnb in 2014) and tools such as Dagster and Prefect are commonly used to schedule and monitor data pipelines feeding ML and RAG systems.", "body": "### Pipeline health checklist\n\n- [ ] Clear owner\n- [ ] Schema and quality checks\n- [ ] Freshness monitoring\n- [ ] Retries and alerting\n- [ ] Versioned outputs\n- [ ] Documentation\n- [ ] Backfill procedure\n\n### RAG ingestion pipeline\n\n```mermaid\nflowchart LR\n  SRC[Sources] --> EXTRACT[Extract]\n  EXTRACT --> CLEAN[Clean + dedupe]\n  CLEAN --> CHUNK[Chunk]\n  CHUNK --> EMBED[Embed]\n  EMBED --> INDEX[(Index)]\n  INDEX --> CHECK[Quality checks]\n```"}, {"id": 104, "title": "Model serving", "tldr": "Serving makes models available to applications with acceptable latency, throughput, cost and reliability. Leads should understand the main trade-offs: batching, GPU utilization, autoscaling, caching and fallbacks.", "real": "Open-source LLM serving engines such as vLLM (from UC Berkeley, 2023) introduced techniques like PagedAttention and continuous batching, which substantially increased throughput compared with earlier serving approaches.", "body": "### Serving concerns\n\n| Concern | Lever |\n|---|---|\n| Latency | Model size, hardware, streaming |\n| Throughput | Batching, quantization |\n| Cost | GPU utilization, autoscaling, routing |\n| Reliability | Replicas, health checks, fallbacks |\n| Versions | Canary deployments |\n\n### Serving SLOs (example)\n\n| SLO | Target |\n|---|---|\n| Availability | 99.9% |\n| Time to first token (p95) | < 1 s |\n| Error rate | < 0.5% |"}, {"id": 105, "title": "Observability for AI systems", "tldr": "Observability lets you understand system behavior from logs, metrics and traces. For AI, add traces of prompts, retrieved context, tool calls, model responses, tokens, costs and feedback, with privacy protections.", "real": "OpenTelemetry has developed semantic conventions for generative AI telemetry, and LLM observability tools such as Langfuse, LangSmith and Arize Phoenix provide tracing of model calls and agent steps.", "body": "### Trace of one request\n\n```mermaid\nflowchart LR\n  REQ[Request] --> RET[Retrieval: 5 docs, 40 ms]\n  RET --> LLM[Model call: 1,200 tokens, 1.8 s]\n  LLM --> TOOL[Tool call: order lookup, 120 ms]\n  TOOL --> LLM2[Model call: 300 tokens, 0.6 s]\n  LLM2 --> RESP[Response + feedback]\n```\n\n### What to capture\n\n| Data | Use |\n|---|---|\n| Prompt and model versions | Attribution |\n| Retrieved documents | Debug grounding |\n| Tool calls and results | Debug agents |\n| Tokens, latency, cost | Operations |\n| User feedback | Quality |\n\nRedact personal data and restrict access to traces."}, {"id": 106, "title": "Managing GPU and model costs", "tldr": "AI costs can grow fast: inference tokens, GPU hours for training and serving, storage and vector databases. Leads should track costs per feature, set budgets and alerts, and drive optimizations as regular engineering work.", "real": "Model providers offer cost levers such as prompt caching discounts and batch processing discounts (OpenAI and Anthropic both offer about 50% discounts for batch APIs), which teams can use to cut costs substantially for suitable workloads.", "body": "### Cost levers\n\n| Lever | Typical effect |\n|---|---|\n| Smaller model for simple tasks | Large savings |\n| Prompt caching | Lower cost for repeated context |\n| Batch API for offline jobs | About 50% discount where offered |\n| Shorter prompts and context | Proportional savings |\n| Quantized self-hosted models | Lower GPU cost |\n| Autoscaling | Avoid idle GPUs |\n\n### Monthly cost review\n\n| Feature | Spend | Change | Action |\n|---|---|---|---|\n| Support assistant | $8,400 | +30% | Add caching |\n| Nightly summaries | $2,100 | +5% | Move to batch API |\n| Fine-tuning runs | $3,000 | — | Schedule off-peak |"}, {"id": 107, "title": "Incident response and on-call", "tldr": "Production AI systems need on-call coverage, runbooks, severity levels, clear escalation and blameless postmortems. Leads ensure on-call is fair, sustainable and supported with good tooling.", "real": "In 2017 GitLab accidentally deleted production database data and discovered several backup methods were not working; it livestreamed the recovery and published a detailed public postmortem, a well-known example of transparent incident handling.", "body": "### Incident process\n\n```mermaid\nflowchart LR\n  ALERT[Alert] --> ACK[Acknowledge]\n  ACK --> TRIAGE[Assess severity]\n  TRIAGE --> MITIGATE[Mitigate: rollback, flag off, fallback]\n  MITIGATE --> COMM[Communicate status]\n  COMM --> RESOLVE[Resolve]\n  RESOLVE --> POST[Blameless postmortem]\n```\n\n### Sustainable on-call\n\n| Practice | Why |\n|---|---|\n| Rotation of 5+ people | Fair load |\n| Runbooks for common alerts | Fast response |\n| Alert quality reviews | Reduce noise |\n| Compensation or time off after incidents | Fairness |\n| Shadowing before first shift | Confidence |"}, {"id": 108, "title": "Reliability targets and error budgets", "tldr": "Service level objectives (SLOs) set reliability targets; error budgets define how much unreliability is acceptable. When the budget is used up, prioritize reliability over new features. This balances speed and stability with data.", "real": "Google’s Site Reliability Engineering book (2016) popularized SLOs and error budgets as a way to align product development speed with reliability, and the practice is now common across the industry.", "body": "### Error budget math\n\n```\nSLO: 99.9% availability per 30 days\nError budget: 0.1% × 30 × 24 × 60 ≈ 43 minutes of downtime\n```\n\n### AI-specific SLOs\n\n| SLO | Example target |\n|---|---|\n| Availability | 99.9% |\n| p95 latency | < 4 s |\n| Quality (sampled eval pass rate) | ≥ 90% weekly |\n| Safety violations | 0 critical |\n\n### Policy\n\n| Budget status | Action |\n|---|---|\n| Healthy | Ship features normally |\n| Nearly spent | Extra caution, more testing |\n| Exhausted | Freeze risky launches; fix reliability |"}, {"id": 109, "title": "Postmortems and learning from failure", "tldr": "Blameless postmortems analyze incidents to improve systems, not to punish people. Document timeline, impact, root causes, what went well, and action items with owners, and share them widely.", "real": "John Allspaw’s 2012 writing on blameless postmortems at Etsy, and Google’s SRE practices, helped establish blameless incident reviews as standard practice in technology companies.", "body": "### Postmortem template\n\n| Section | Content |\n|---|---|\n| Summary | What happened, impact |\n| Timeline | Key events with times |\n| Root causes | Technical and process factors |\n| What went well | Effective responses |\n| What went poorly | Gaps |\n| Action items | Owner, due date, priority |\n| Lessons | For the wider organization |\n\n### Blameless language\n\n| Blaming | Blameless |\n|---|---|\n| “Ravi broke production.” | “The deploy pipeline allowed an untested prompt change to reach production.” |"}, {"id": 110, "title": "Platform work vs product work", "tldr": "Teams must balance building shared infrastructure (platform) and user-facing features (product). Too little platform work slows everyone later; too much delays value. Invest in platform when multiple features need the same capability.", "real": "“Team Topologies” (2019) describes platform teams that provide internal services to reduce cognitive load on stream-aligned product teams, a model many organizations use when scaling AI capabilities across products.", "body": "### When to invest in platform\n\n| Signal | Example |\n|---|---|\n| Repeated work across features | Each feature builds its own eval runner |\n| Inconsistent quality or security | Different logging per service |\n| Slow onboarding of new features | Weeks to set up model access |\n| High operational burden | Manual deployments |\n\n### Balance\n\n```chart\n{\"title\": \"Example platform vs product investment by team stage (guideline)\", \"unit\": \"% platform\", \"data\": [[\"Early prototype\", 10], [\"First production feature\", 25], [\"Multiple AI features\", 35], [\"Mature platform\", 20]]}\n```"}, {"id": 111, "title": "Working with product managers", "tldr": "PMs own the problem and priorities; team leads own how the team delivers and technical quality. Collaborate closely on discovery, scope, trade-offs and quality bars, and present a united front to the team.", "real": "Marty Cagan’s product management writing describes the product manager, product designer and tech lead as a core “product trio” who jointly discover what to build, rather than PMs handing requirements to engineering.", "body": "### Division of responsibilities\n\n| Topic | PM | Team lead |\n|---|---|---|\n| Problem and user value | Owner | Contributes |\n| Priorities | Owner | Advises on effort and risk |\n| Technical approach | Contributes | Owner |\n| Quality bar (evals) | Co-owner | Co-owner |\n| Estimates | Consumes | Owner |\n| Delivery and process | Contributes | Owner |\n| Team health | Contributes | Owner |\n\n### Healthy habits\n\nWeekly 1:1 with your PM, joint planning, shared discovery sessions, and resolving disagreements privately."}, {"id": 112, "title": "Working with designers and researchers", "tldr": "Designers and user researchers help AI products be usable and trustworthy. Involve them early in AI behavior decisions, share real model outputs (not idealized examples), and design together for errors, uncertainty and feedback.", "real": "Google’s People + AI Guidebook (2019) was created by design and research teams to help product teams design AI experiences, covering mental models, explainability, feedback and graceful failure.", "body": "### Collaboration points\n\n| Stage | Engineer–designer collaboration |\n|---|---|\n| Discovery | Share what the model can and can’t do |\n| Prototyping | Use real outputs in prototypes |\n| Error design | Map failure modes to UX states |\n| Feedback UX | Design signals the team will use |\n| Testing | Joint user sessions |\n\n### Share realistic outputs\n\nGive designers 20–50 real model outputs, including bad ones, so designs handle reality."}, {"id": 113, "title": "Working with data, platform and infrastructure teams", "tldr": "AI teams depend on data, platform and infrastructure teams. Build relationships early, understand their priorities and processes, make clear requests with context and deadlines, and contribute back where possible.", "real": "Organizations following “Team Topologies” principles define interaction modes between teams (collaboration, X-as-a-service and facilitating), making dependencies on platform teams explicit and easier to manage.", "body": "### Request template\n\n```text\nRequest: read access to support tickets table (EU region)\nWhy: build eval set for billing assistant (Q1 priority)\nScope: last 12 months, anonymized fields only\nDeadline: needed by Dec 1 to stay on plan\nContact: Divya (data engineer on our team)\n```\n\n### Interaction modes\n\n| Mode | Example |\n|---|---|\n| Collaboration | Joint work on new retrieval infrastructure |\n| X-as-a-service | Use the platform’s model gateway |\n| Facilitating | Platform team coaches yours on deployment |"}, {"id": 114, "title": "Working with research teams", "tldr": "Research teams explore new methods; product teams need reliable delivery. Align on problems worth researching, define handoff criteria, share data and evals, and plan productionization jointly.", "real": "Large AI organizations commonly run “research-to-product” processes where research prototypes must pass agreed evaluations and engineering reviews before product teams take them into production.", "body": "### Handoff criteria\n\n| Criterion | Example |\n|---|---|\n| Measured gain | +8 points on shared eval set |\n| Reproducible | Code and data versions documented |\n| Feasible | Latency and cost within budget |\n| Owned | Named engineers for production |\n| Documented | Design and limitations |\n\n### Collaboration flow\n\n```mermaid\nflowchart LR\n  PROB[Product problem] --> RES[Research exploration]\n  RES --> EVAL[Shared eval proof]\n  EVAL --> REVIEW[Joint design review]\n  REVIEW --> PROD[Production build]\n```"}, {"id": 115, "title": "Working with legal, security and compliance", "tldr": "Bring legal, security and compliance in early for AI work involving personal data, customer content, regulated domains or third-party models. Provide clear data flow diagrams and risk assessments to speed reviews.", "real": "The EU AI Act, in force since August 2024 with obligations phasing in through 2026–2028, and data protection laws such as GDPR and India’s DPDP Act mean AI teams increasingly need legal and compliance input during design, not just before launch.", "body": "### What to provide\n\n| Item | Content |\n|---|---|\n| Data flow diagram | Inputs, processing, storage, vendors |\n| Data categories | Personal, sensitive, customer confidential |\n| Vendors | Model providers, regions, terms |\n| Use case risk | Who’s affected, potential harms |\n| Mitigations | Controls, human oversight |\n\n### Timeline\n\n```mermaid\nflowchart LR\n  IDEA[Idea: early consult] --> DESIGN[Design: data flow review]\n  DESIGN --> BUILD[Build: controls implemented]\n  BUILD --> LAUNCH[Pre-launch sign-off]\n```"}, {"id": 116, "title": "Managing stakeholders", "tldr": "Identify stakeholders, understand what each cares about, communicate at the right frequency and level of detail, and manage expectations proactively. No surprises: share bad news early with a plan.", "real": "Stakeholder mapping using a power–interest grid, attributed in project management literature to Mendelow’s work from the early 1990s, is widely used to decide how closely to engage each stakeholder.", "body": "### Stakeholder map\n\n| Stakeholder | Cares about | Engagement |\n|---|---|---|\n| VP Product | Launch date, impact | Biweekly update |\n| Support director | Agent productivity | Monthly demo |\n| Security lead | Data protection | Design reviews |\n| Finance | AI costs | Monthly cost report |\n| Customers (beta) | Quality | Feedback sessions |\n\n### Communication rules\n\n- Lead with impact and decisions needed\n- Share risks with mitigation options\n- Keep a consistent update format"}, {"id": 117, "title": "Managing up", "tldr": "Help your manager help you: share progress, risks and needs concisely; understand their goals and pressures; bring solutions with problems; and ask for the support or decisions you need.", "real": "Harvard Business Review’s classic article “Managing Your Boss” by John Gabarro and John Kotter (1980) argued that effective managers actively manage the relationship with their own boss, a principle still widely taught.", "body": "### Weekly note to your manager\n\n```\nHighlights: assistant beta live with 20 agents; handling time −18%\nRisks: GPU quota for fine-tuning delayed (impact: 1 week)\nDecisions needed: approve second model vendor for fallback\nPeople: Chen ready for promotion discussion next cycle\nHelp wanted: escalate data access request with Legal\n```\n\n### Understand your manager\n\n| Question | Why |\n|---|---|\n| What are their top goals? | Align priorities |\n| How do they like updates? | Format and frequency |\n| What keeps them up at night? | Anticipate needs |"}, {"id": 118, "title": "Cross-team dependencies and coordination", "tldr": "When projects span several teams, agree shared goals, interfaces, timelines and owners. Use joint planning, a dependency tracker and regular syncs, and escalate blocked dependencies early.", "real": "Scaled agile frameworks such as SAFe use cross-team planning events (PI planning) to identify dependencies between teams, and simpler organizations use shared dependency boards and weekly syncs for the same purpose.", "body": "### Dependency tracker\n\n| Dependency | Owner team | Needed by | Status | Escalation date |\n|---|---|---|---|---|\n| Chat UI integration | Frontend | Dec 10 | On track | — |\n| Data access approval | Legal | Nov 25 | At risk | Nov 22 |\n| GPU quota increase | Platform | Dec 1 | Blocked | Nov 20 |\n\n### Coordination practices\n\n- Shared kickoff with all teams\n- API contracts agreed early\n- Weekly 15-minute cross-team sync\n- Single integration test environment"}, {"id": 119, "title": "Roles and responsibilities: RACI", "tldr": "RACI charts clarify who is responsible, accountable, consulted and informed for key activities. They prevent duplicated work, gaps and conflicts, especially in AI projects with many functions involved.", "real": "RACI matrices are a long-standing project management tool, commonly used in enterprise programs to clarify decision rights across business, technology, legal and operations teams.", "body": "### RACI for an AI feature\n\n| Activity | Team lead | PM | ML engineer | Legal | Support |\n|---|---|---|---|---|---|\n| Define quality bar | A | R | C | — | C |\n| Build eval set | A | C | R | — | C |\n| Model selection | A | C | R | I | — |\n| Data use approval | C | C | I | A/R | — |\n| Launch decision | C | A | C | C | I |\n| Support readiness | I | A | — | — | R |\n\nR = Responsible, A = Accountable (one per row), C = Consulted, I = Informed."}, {"id": 120, "title": "Resolving conflicts between teams", "tldr": "Inter-team conflicts often come from different goals, priorities or misunderstandings. Focus on shared goals, use data, separate people from problems, agree criteria for decisions, and escalate together when needed.", "real": "“Getting to Yes” (Fisher and Ury, 1981) recommended focusing on interests rather than positions and using objective criteria, principles that apply directly to resolving priority conflicts between teams.", "body": "### Resolution steps\n\n```mermaid\nflowchart LR\n  UNDERSTAND[Understand each team's goals] --> SHARED[Find shared goal]\n  SHARED --> OPTIONS[Generate options]\n  OPTIONS --> CRITERIA[Agree decision criteria]\n  CRITERIA --> DECIDE[Decide or escalate together]\n```\n\n### Example\n\n| Situation | Approach |\n|---|---|\n| Platform team won’t prioritize your GPU request | Show business impact, offer to help, escalate jointly with data if needed |\n| Security blocks launch | Understand the specific risk, propose mitigations, agree a timeline |"}, {"id": 121, "title": "Coaching vs mentoring vs managing", "tldr": "Managing directs work; mentoring shares your experience and advice; coaching asks questions that help people find their own answers. Effective leads switch between these based on the person and situation.", "real": "Google’s Project Oxygen identified “is a good coach” as the most important behavior of its best managers, and Google built manager training programs around coaching skills as a result.", "body": "### Comparison\n\n| Mode | You... | Best when |\n|---|---|---|\n| Managing | Set direction, decide | Urgent, high-risk situations |\n| Mentoring | Share experience, advise | Person lacks knowledge |\n| Coaching | Ask questions, guide thinking | Person can find the answer |\n\n### Coaching questions (GROW model)\n\n| Step | Question |\n|---|---|\n| Goal | “What do you want to achieve?” |\n| Reality | “What’s happening now?” |\n| Options | “What could you do?” |\n| Will | “What will you do, and when?” |\n\nThe GROW model was popularized by John Whitmore in “Coaching for Performance” (1992)."}, {"id": 122, "title": "Individual growth plans", "tldr": "Each team member should have a growth plan: career goals, skills to develop, opportunities and support. Review it quarterly and connect it to real work assignments.", "real": "Many technology companies publish engineering career frameworks, such as those shared openly by Dropbox and GitLab, describing expectations at each level, which leads use to structure growth conversations.", "body": "### Growth plan template\n\n| Section | Example |\n|---|---|\n| Career goal | Senior ML engineer in 12–18 months |\n| Strengths | Model training, debugging |\n| Growth areas | System design, stakeholder communication |\n| Opportunities | Lead design of fine-tuning pipeline v2 |\n| Learning | Distributed training course; present at team tech talk |\n| Support | Monthly design review with lead |\n| Review | Quarterly |\n\n### Connection to work\n\nPick at least one project per quarter that directly develops a growth area."}, {"id": 123, "title": "Giving feedback", "tldr": "Give feedback that is timely, specific, about behavior and its impact, and focused on the future. Give positive feedback often and constructive feedback privately. Use simple frameworks such as SBI.", "real": "The Center for Creative Leadership’s Situation–Behavior–Impact (SBI) model is a widely used framework for giving clear, specific feedback without judging the person.", "body": "### SBI examples\n\n| Type | Example |\n|---|---|\n| Positive | “In yesterday’s design review (S), you laid out three options with eval data (B). It made the decision easy and fast (I).” |\n| Constructive | “In the last two PRs (S), the eval results weren’t attached (B). Reviewers couldn’t judge quality and one regression shipped (I). Can we make eval runs part of every AI PR?” |\n\n### Feedback habits\n\n| Habit | Why |\n|---|---|\n| Within days of the event | Relevant |\n| Private for constructive | Respect |\n| Ratio heavy on positive | Motivation, trust |\n| Ask for their view | Two-way |\n| Follow up | Improvement |"}, {"id": 124, "title": "Radical candor", "tldr": "Radical candor means caring personally while challenging directly. Avoid ruinous empathy (being too nice to say the truth), obnoxious aggression (harsh without care) and manipulative insincerity (neither).", "real": "Kim Scott, drawing on her experience at Google and Apple, introduced the radical candor framework in her 2017 book, and it became widely used in technology management training.", "body": "### The quadrants\n\n| | Low challenge | High challenge |\n|---|---|---|\n| High care | Ruinous empathy | Radical candor |\n| Low care | Manipulative insincerity | Obnoxious aggression |\n\n### Examples\n\n| Quadrant | Statement |\n|---|---|\n| Ruinous empathy | “It’s fine” (when it isn’t) |\n| Obnoxious aggression | “This design is terrible.” |\n| Radical candor | “I want this launch to succeed for you. The design doesn’t handle model timeouts; let’s fix that before review.” |"}, {"id": 125, "title": "Career ladders and promotions", "tldr": "Help people understand level expectations, collect evidence of impact, find opportunities to demonstrate next-level behaviors, and advocate for them in promotion processes. Be honest about gaps and timelines.", "real": "Many companies’ engineering ladders define senior levels by scope of impact and influence (for example, leading projects across teams or mentoring others), not just technical depth, which shapes how leads prepare promotion cases.", "body": "### Example level expectations\n\n| Level | Scope | Behaviors |\n|---|---|---|\n| Engineer | Tasks | Delivers well-defined work |\n| Senior engineer | Projects | Leads projects, mentors, designs systems |\n| Staff engineer | Multiple teams | Sets technical direction across teams |\n\n### Promotion case structure\n\n| Section | Content |\n|---|---|\n| Summary | Why ready now |\n| Impact | Projects, metrics |\n| Next-level behaviors | Examples with evidence |\n| Peer feedback | Quotes |\n| Growth areas | Honest gaps and plan |"}, {"id": 126, "title": "Stretch assignments", "tldr": "Stretch assignments grow people by giving them work slightly beyond their current level, with support. Choose meaningful but recoverable challenges, set clear expectations and provide coaching and safety nets.", "real": "The “70-20-10” model, associated with research at the Center for Creative Leadership, suggests that roughly 70% of leadership development comes from challenging on-the-job experiences, 20% from relationships and 10% from formal training.", "body": "### Stretch assignment examples\n\n| Person | Stretch |\n|---|---|\n| Junior engineer | Own a small service end to end |\n| Mid-level | Lead an experiment with stakeholder presentation |\n| Senior | Lead cross-team design or mentor two juniors |\n| Senior aiming for lead | Run sprint planning for a month |\n\n### Support structure\n\n```mermaid\nflowchart LR\n  ASSIGN[Assignment] --> EXPECT[Clear expectations]\n  EXPECT --> SUPPORT[Check-ins + coaching]\n  SUPPORT --> SAFETY[Safety net: backup plan]\n  SAFETY --> REFLECT[Reflection on learning]\n```"}, {"id": 127, "title": "Pairing and knowledge sharing", "tldr": "Knowledge sharing reduces bus-factor risk and grows skills: pair programming, design reviews, tech talks, documentation, rotation of areas and shared debugging sessions.", "real": "Pair programming became a core practice of Extreme Programming in the late 1990s, and many teams now use pairing selectively for onboarding, complex problems and knowledge transfer rather than for all work.", "body": "### Knowledge-sharing practices\n\n| Practice | Frequency |\n|---|---|\n| Pair programming | For complex or new areas |\n| Tech talks / lunch-and-learns | Biweekly |\n| Design reviews | Per significant change |\n| Area rotation | Quarterly |\n| Incident walkthroughs | After incidents |\n| Written docs | Continuous |\n\n### Bus factor improvement plan\n\n| Area | Current experts | Target | Action |\n|---|---|---|---|\n| Fine-tuning pipeline | 1 | 2 | Pair Ben with Chen for 3 runs |\n| Infra / deployment | 1 | 2 | Rotate on-call, write runbook |"}, {"id": 128, "title": "Building a learning culture", "tldr": "AI changes fast, so teams must learn continuously: paper or blog reading groups, experiment sharing, conference talks, time for learning, and celebrating knowledge sharing. Leads model curiosity and allocate time.", "real": "Many AI teams run regular paper reading groups where members present recent research, a practice common in both academic labs and industry teams for keeping up with fast-moving fields.", "body": "### Learning rituals\n\n| Ritual | Format |\n|---|---|\n| Reading group | Weekly, one paper or blog post, 30 minutes |\n| Experiment show-and-tell | Biweekly, 5 minutes per person |\n| New model review | When major models launch: quick eval comparison |\n| Learning budget | Courses, books, conferences |\n| Learning time | e.g. 2–4 hours per week |\n\n### Model the behavior\n\nShare what you’re learning, admit what you don’t know, and ask team members to teach you."}, {"id": 129, "title": "Recognition and appreciation", "tldr": "Recognize contributions specifically, publicly and promptly, including less visible work such as reviews, documentation, incident response and mentoring. Recognition builds motivation and signals what the team values.", "real": "Gallup research has repeatedly found that employees who do not feel adequately recognized are significantly more likely to say they will leave their employer within a year.", "body": "### Recognition practices\n\n| Practice | Example |\n|---|---|\n| Specific praise | “Your eval analysis found the root cause of 40% of failures.” |\n| Public credit | Name contributors in updates and demos |\n| Credit glue work | Thank reviewers and documenters |\n| Upward visibility | Share wins with your manager and stakeholders |\n| Growth recognition | Note skill improvements |\n\n### Avoid\n\nGeneric “great job everyone” only, recognizing only visible heroics, and taking credit yourself."}, {"id": 130, "title": "Developing future leads", "tldr": "Grow leadership in the team by delegating leadership tasks: running meetings, leading projects, mentoring, interviewing, handling stakeholders. Prepare successors so the team does not depend on you.", "real": "Many organizations use “tech lead” or “project lead” roles as stepping stones to management, letting engineers practice leadership while remaining hands-on, before deciding between technical and management career tracks.", "body": "### Leadership opportunities\n\n| Opportunity | Skill developed |\n|---|---|\n| Run standup or retro | Facilitation |\n| Lead a project | Planning, coordination |\n| Mentor a new hire | Coaching |\n| Interview candidates | Judgment |\n| Present to stakeholders | Communication |\n| Own incident response | Calm under pressure |\n\n### Succession planning\n\n```mermaid\nflowchart LR\n  ID[Identify potential leads] --> OPP[Give leadership opportunities]\n  OPP --> COACH[Coach and give feedback]\n  COACH --> BACKUP[Act as your backup]\n  BACKUP --> READY[Ready to lead]\n```"}, {"id": 131, "title": "Setting clear expectations", "tldr": "People can only meet expectations they understand. Define role expectations, quality standards, communication norms and goals in writing, check understanding, and revisit when roles change.", "real": "Google’s Project Aristotle found “structure and clarity”, meaning clear roles, plans and goals, to be one of the five key dynamics of effective teams.", "body": "### Expectation areas\n\n| Area | Example |\n|---|---|\n| Role scope | Own retrieval service and its evals |\n| Quality | All AI changes include eval results |\n| Delivery | Raise risks as soon as known |\n| Communication | Async update by 10:00 daily |\n| Collaboration | Review teammates’ PRs within 1 day |\n| Growth | Present one tech talk per quarter |\n\n### Check understanding\n\nAsk people to summarize expectations in their own words and write them in their 1:1 doc."}, {"id": 132, "title": "Performance reviews", "tldr": "Reviews should contain no surprises: they summarize feedback given throughout the period. Base them on evidence of impact and behaviors, gather peer input, be specific and fair, and focus on growth.", "real": "Many technology companies moved from annual-only reviews toward continuous feedback with periodic formal reviews during the 2010s, after critiques that once-a-year reviews were too infrequent to guide improvement.", "body": "### Review structure\n\n| Section | Content |\n|---|---|\n| Summary | Overall performance |\n| Impact | Key results with metrics |\n| Strengths | Behaviors with examples |\n| Growth areas | Specific, actionable |\n| Peer feedback | Themes |\n| Goals for next period | Linked to growth plan |\n\n### Fairness checks\n\n- [ ] Evidence for every claim\n- [ ] Whole period considered, not just recent weeks\n- [ ] Glue work and invisible work recognized\n- [ ] Calibrated with peers’ standards\n- [ ] Language checked for bias"}, {"id": 133, "title": "Addressing underperformance", "tldr": "Act early on underperformance. Diagnose the cause (skills, clarity, motivation, personal issues, poor fit, team problems), give clear feedback, agree an improvement plan with support, and follow up regularly.", "real": "Gallup research on employee engagement suggests that disengagement is often linked to unclear expectations and lack of support, which is why diagnosis should start by checking whether the person knows what is expected and has what they need.", "body": "### Diagnosis\n\n```mermaid\nflowchart TD\n  P[Performance gap] --> C{Clear expectations?}\n  C -- no --> CLARIFY[Clarify]\n  C -- yes --> S{Skills gap?}\n  S -- yes --> TRAIN[Training, pairing]\n  S -- no --> M{Motivation or personal issue?}\n  M -- yes --> TALK[Conversation, support, adjust]\n  M -- no --> F{Role fit?}\n  F -- no --> CHANGE[Different role or exit]\n```\n\n### Improvement plan\n\n| Element | Example |\n|---|---|\n| Gap | Changes often break evals |\n| Goal | Zero eval regressions in next 6 weeks |\n| Support | Pair reviews, eval workshop |\n| Check-ins | Weekly |"}, {"id": 134, "title": "Performance improvement plans", "tldr": "A formal performance improvement plan (PIP) is used when informal efforts have not worked. It must be specific, measurable, time-bound and genuinely supportive, done with HR, and documented carefully. Be honest about consequences.", "real": "HR guidance from organizations such as SHRM recommends that performance improvement plans include specific objectives, support resources, timelines and regular check-ins, and that they follow earlier informal feedback.", "body": "### PIP structure\n\n| Section | Content |\n|---|---|\n| Performance concerns | Specific, with examples |\n| Expectations | Measurable goals |\n| Support | Training, mentoring, resources |\n| Timeline | Typically 30–90 days |\n| Check-ins | Weekly, documented |\n| Outcome | What happens if goals are met or not |\n\n### Principles\n\n- No surprises: prior feedback must exist\n- Achievable goals\n- Fair support\n- Work with HR and follow company policy and local law"}, {"id": 135, "title": "Conflicts between team members", "tldr": "Conflict about ideas can be healthy; personal conflict harms teams. Address conflict early: listen to each person separately, find interests, facilitate a joint conversation focused on behaviors and shared goals, and agree on ways of working.", "real": "Research distinguishing task conflict from relationship conflict, such as Karen Jehn’s work in the 1990s, found that relationship conflict generally harms team performance, while some task conflict can improve decisions.", "body": "### Steps\n\n```mermaid\nflowchart LR\n  OBSERVE[Notice tension] --> SEP[Talk to each person separately]\n  SEP --> JOINT[Facilitated joint conversation]\n  JOINT --> AGREE[Agreements on behaviors]\n  AGREE --> FOLLOW[Follow up]\n```\n\n### Joint conversation structure\n\n| Step | Example |\n|---|---|\n| Shared goal | “We both want the retrieval system to be reliable.” |\n| Each perspective | Without interruption |\n| Specific issues | “Design decisions changed without discussion” |\n| Agreements | “Design changes go through a short written proposal” |"}, {"id": 136, "title": "Low morale", "tldr": "Low morale shows through disengagement, cynicism, rising mistakes and attrition. Find causes (unclear goals, overwork, lack of recognition, failed projects, organizational changes), acknowledge them honestly, and take visible actions.", "real": "Gallup’s State of the Global Workplace reports have consistently found that only a minority of employees worldwide are engaged at work, and that managers are the largest single factor in team engagement.", "body": "### Causes and actions\n\n| Cause | Action |\n|---|---|\n| Unclear direction | Re-state goals and why |\n| Overload | Cut scope, rebalance |\n| No recognition | Specific, public appreciation |\n| Repeated failures | Smaller wins, celebrate learning |\n| Organizational uncertainty | Share what you know honestly |\n| Tedious work | Rotate, automate |\n\n### Team health check\n\nRun a short anonymous survey monthly on clarity, workload, support and morale; discuss trends together."}, {"id": 137, "title": "Preventing burnout", "tldr": "Burnout comes from chronic overload, lack of control, insufficient recognition, unfairness and value conflicts. Watch for signs, manage workload, protect rest, model healthy behavior and act early when someone is struggling.", "real": "Research by Christina Maslach and Michael Leiter identified six areas of work life linked to burnout: workload, control, reward, community, fairness and values, and the WHO recognized burnout as an occupational phenomenon in 2019.", "body": "### Six areas (Maslach and Leiter)\n\n| Area | Lead action |\n|---|---|\n| Workload | Realistic plans, WIP limits |\n| Control | Autonomy in how work is done |\n| Reward | Recognition, fair pay advocacy |\n| Community | Supportive team relationships

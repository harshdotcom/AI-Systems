|\n| Fairness | Transparent decisions |\n| Values | Meaningful, ethical work |\n\n### Warning signs\n\nExhaustion, cynicism, reduced effectiveness, irritability, late-night work patterns, and withdrawal.\n\n### Lead behaviors\n\nDon’t send late-night messages; take your own vacations; encourage people to disconnect."}, {"id": 138, "title": "Handling toxic behavior", "tldr": "Behavior that disrespects, excludes or intimidates others damages the whole team, even if the person is a high performer. Address it quickly and firmly, document it, involve HR when needed, and protect affected people.", "real": "Research by Will Felps and colleagues (2006) found that a single negative team member (“bad apple”) could significantly reduce team performance, which is why many leaders consider tolerating toxic high performers costly.", "body": "### Examples\n\n| Behavior | Example |\n|---|---|\n| Disrespect | Belittling others’ work in reviews |\n| Exclusion | Ignoring certain people’s input |\n| Intimidation | Aggressive responses to questions |\n| Undermining | Blaming others publicly |\n\n### Response\n\n```mermaid\nflowchart LR\n  OBS[Observe / receive report] --> DOC[Document facts]\n  DOC --> TALK[Direct private conversation]\n  TALK --> EXP[Clear expectations + consequences]\n  EXP --> MONITOR[Monitor]\n  MONITOR -->|continues| HR[Escalate with HR]\n```"}, {"id": 139, "title": "When people leave", "tldr": "Departures are normal. Handle them professionally: understand reasons, plan knowledge transfer, redistribute work, communicate to the team, and use exit insights to improve. Celebrate contributions and stay on good terms.", "real": "Commonly cited HR estimates put the cost of replacing an employee at a large fraction of annual salary, often from half to twice the salary depending on role, because of hiring, onboarding and lost productivity.", "body": "### Departure checklist\n\n- [ ] Understand reasons (and learn)\n- [ ] Knowledge transfer plan with documentation\n- [ ] Ownership reassigned (code areas, on-call, stakeholders)\n- [ ] Access removal coordinated with IT\n- [ ] Team informed with clear plan\n- [ ] Farewell and thanks\n- [ ] Backfill decision\n\n### Knowledge transfer plan\n\n| Area | Receiver | Method | Done by |\n|---|---|---|---|\n| Fine-tuning pipeline | Ben | Pairing + runbook | Week 2 |\n| Vendor relationships | Lead | Intro meetings | Week 1 |"}, {"id": 140, "title": "Leading through reorganizations and layoffs", "tldr": "During reorganizations or layoffs, communicate honestly and promptly, share what you can, acknowledge emotions, support affected people with dignity, and help remaining team members refocus on clear priorities.", "real": "The technology industry saw large layoffs in 2022 and 2023 at many major companies, and employees widely criticized impersonal handling such as sudden loss of system access, underscoring the importance of respectful communication.", "body": "### Communication principles\n\n| Principle | Practice |\n|---|---|\n| Honesty | Share facts you’re allowed to share |\n| Timeliness | Don’t let rumors fill gaps |\n| Empathy | Acknowledge impact and emotions |\n| Clarity | What changes, what doesn’t, what’s next |\n| Availability | Extra 1:1s and office hours |\n\n### After the change\n\n```mermaid\nflowchart LR\n  ACK[Acknowledge loss] --> PRIOR[Reset priorities to capacity]\n  PRIOR --> OWN[Reassign ownership]\n  OWN --> SUPPORT[Support wellbeing]\n  SUPPORT --> RHYTHM[Restore team rhythm]\n```"}, {"id": 141, "title": "Planning hires", "tldr": "Hire based on team needs: skill gaps, workload, roadmap and bus-factor risks. Write down what the new person will own in their first six months before opening the role. Hire ahead of need because hiring and ramp-up take months.", "real": "Fred Brooks’s observation that adding people to a late project makes it later (Brooks’s law, 1975) is a reminder that hiring is a long-term investment, not a quick fix for current deadlines.", "body": "### Hiring plan questions\n\n| Question | Example answer |\n|---|---|\n| What gap does this fill? | No one owns evaluation infrastructure |\n| What will they own? | Eval platform, golden sets |\n| What level? | Senior (needs to design independently) |\n| When needed? | Q2 roadmap depends on it |\n| Alternatives? | Contractor, internal transfer, training |\n\n### Timeline (typical)\n\n```mermaid\nflowchart LR\n  OPEN[Open role] --> SOURCE[Sourcing: 2-6 weeks]\n  SOURCE --> INTERVIEW[Interviews: 2-4 weeks]\n  INTERVIEW --> NOTICE[Notice period: 2-12 weeks]\n  NOTICE --> RAMP[Ramp-up: 2-6 months]\n```"}, {"id": 142, "title": "Defining AI roles clearly", "tldr": "AI job titles vary widely. Define each role by responsibilities, required skills, nice-to-have skills and success after six months, rather than by title alone. Avoid unrealistic “unicorn” requirements.", "real": "Titles such as ML engineer, AI engineer, applied scientist and MLOps engineer are used differently across companies; for example, Amazon uses “applied scientist” for roles combining research and production ML.", "body": "### Role definition template\n\n| Section | Example (AI engineer) |\n|---|---|\n| Mission | Build reliable LLM features for support products |\n| Responsibilities | RAG pipelines, prompts, evals, integrations |\n| Must have | Python, API design, LLM app experience, testing |\n| Nice to have | Retrieval tuning, observability tools |\n| Success at 6 months | Owns assistant retrieval; eval coverage improved |\n| Not required | PhD, model pretraining experience |\n\n### Avoid\n\nListing every AI tool, demanding years of experience longer than the technology has existed, and mixing three roles into one."}, {"id": 143, "title": "Designing interview loops", "tldr": "Structured interviews with defined competencies, consistent questions and scoring rubrics predict performance better than unstructured conversations. Cover technical skills, problem-solving, collaboration and values, with each interviewer owning specific areas.", "real": "Schmidt and Hunter’s 1998 meta-analysis of 85 years of research found that work sample tests and structured interviews are among the strongest predictors of job performance, and Google’s Laszlo Bock wrote in “Work Rules!” (2015) that brainteaser questions were useless for predicting performance.", "body": "### Example loop (AI engineer)\n\n| Interview | Competency |\n|---|---|\n| Coding | Clean code, testing |\n| AI system design | RAG/agent architecture, trade-offs |\n| Practical AI exercise | Debug a failing LLM pipeline with evals |\n| Collaboration | Past teamwork, conflict, feedback |\n| Values / team fit | Ownership, learning, communication |\n\n### Scoring rubric (1–4)\n\n| Score | Meaning |\n|---|---|\n| 4 | Strong evidence of next-level skill |\n| 3 | Meets the bar |\n| 2 | Some gaps |\n| 1 | Does not meet the bar |"}, {"id": 144, "title": "Practical exercises for AI roles", "tldr": "Use realistic exercises: debugging an LLM pipeline, improving eval results, designing a retrieval system, or reviewing AI-generated code. Keep take-homes short and paid or replaced by live sessions to respect candidates’ time.", "real": "Many technology companies replaced algorithm-puzzle interviews with practical exercises that resemble real work, and candidates widely criticize long unpaid take-home assignments as unfair, leading some companies to cap them at a few hours or pay candidates.", "body": "### Exercise ideas\n\n| Exercise | Assesses |\n|---|---|\n| Fix a RAG pipeline with low accuracy | Debugging, retrieval knowledge |\n| Design eval for a summarizer | Quality thinking |\n| Review an AI-generated PR with hidden bugs | Code review, security |\n| Choose between models given data | Trade-off judgment |\n| Explain a failed experiment | Communication |\n\n### Fairness rules\n\n- Same exercise and rubric for all candidates\n- Time-boxed (2–3 hours max for take-homes)\n- Clear instructions and allowed tools stated\n- Feedback offered when possible"}, {"id": 145, "title": "Assessing AI tool usage in interviews", "tldr": "Decide whether candidates may use AI tools during exercises and state it clearly. Many teams now allow AI tools and assess how candidates use them: prompting, verifying outputs, understanding the code and catching errors.", "real": "Some companies have explicitly allowed AI assistants in coding interviews to reflect real work conditions, while others prohibit them; both approaches require clear rules communicated to candidates in advance.", "body": "### Two approaches\n\n| Approach | Assess |\n|---|---|\n| AI not allowed | Fundamentals, reasoning |\n| AI allowed | Tool skill, verification, judgment |\n\n### When AI is allowed, look for\n\n| Signal | Good | Concerning |\n|---|---|---|\n| Understanding | Explains generated code | Can’t explain |\n| Verification | Tests outputs | Accepts blindly |\n| Problem decomposition | Guides the tool well | Vague prompts |\n| Error handling | Catches subtle bugs | Misses obvious issues |"}, {"id": 146, "title": "Reducing bias in hiring", "tldr": "Bias creeps into hiring through unstructured interviews, “culture fit” judgments, narrow sourcing and inconsistent standards. Use structured processes, diverse panels, rubrics, independent scoring and diverse sourcing.", "real": "Research on orchestra auditions (Goldin and Rouse, 2000) found that blind auditions behind a screen increased the likelihood of women advancing, a widely cited example of how process design can reduce bias, although later analyses have debated the size of the effect.", "body": "### Bias reduction practices\n\n| Practice | Effect |\n|---|---|\n| Structured questions and rubrics | Consistent evaluation |\n| Independent scoring before discussion | Avoid groupthink |\n| Diverse interview panels | Multiple perspectives |\n| Inclusive job descriptions | Wider applicant pool |\n| “Values fit” instead of “culture fit” | Less similarity bias |\n| Calibration sessions | Consistent standards |\n\n### Debrief rule\n\nEach interviewer submits written scores and evidence before the debrief discussion."}, {"id": 147, "title": "Selling the role and closing candidates", "tldr": "Strong candidates have options. Sell the role honestly: interesting problems, impact, team quality, growth and working conditions. Move quickly, keep candidates informed and personalize the pitch to what they value.", "real": "Recruiting research and practitioner experience consistently show that slow hiring processes lose top candidates to faster competitors, which is why many companies set targets such as completing interviews within two to three weeks.", "body": "### Candidate pitch elements\n\n| Element | Example |\n|---|---|\n| Mission | AI that helps 10 million customers get answers |\n| Problems | Real-world RAG and agent challenges |\n| Team | Strong engineers, supportive culture |\n| Growth | Ownership, learning budget, career path |\n| Ways of working | Flexible hours, focus time |\n| Honesty | Real challenges and constraints |\n\n### Process speed\n\n| Stage | Target |\n|---|---|\n| Application response | < 1 week |\n| Interview loop | < 2 weeks |\n| Decision after final interview | < 3 days |"}, {"id": 148, "title": "Onboarding plan for AI hires", "tldr": "Prepare onboarding before day one: accounts, data access, documentation, a buddy and a first task. AI hires also need access to models, eval suites, experiment tracking and data handling rules.", "real": "Engineering organizations often measure “time to first commit” and “time to first production change” for new hires, using them as indicators of onboarding quality.", "body": "### Onboarding checklist\n\n- [ ] Laptop, accounts, repository access\n- [ ] Model API and GPU access\n- [ ] Data access approvals and training on data rules\n- [ ] Architecture and system docs\n- [ ] Eval suites and quality standards walkthrough\n- [ ] Experiment tracking and model registry access\n- [ ] AI tool policy\n- [ ] Buddy and first-week schedule\n- [ ] First task ready\n\n### First weeks\n\n| Week | Focus |\n|---|---|\n| 1 | Setup, team, first small change |\n| 2 | System deep dives, run evals, small feature |\n| 3–4 | Own a medium task, join reviews |"}, {"id": 149, "title": "The first project for a new hire", "tldr": "A good first project is small, valuable, low risk, touches key parts of the system and has a supportive owner. It builds confidence and context, and gives the lead early insight into the new hire’s strengths.", "real": "Many teams keep a curated list of “good first issues” for newcomers, a practice popularized by open-source projects on GitHub to help new contributors start successfully.", "body": "### First project criteria\n\n| Criterion | Example |\n|---|---|\n| Small | Completed in 1–2 weeks |\n| Valuable | Visible improvement |\n| Low risk | Behind a flag or internal |\n| Broad exposure | Touches code, evals and deployment |\n| Supported | Buddy review |\n\n### Example first projects\n\n- Add 30 new eval cases from production failures and fix two\n- Add latency metrics to a dashboard\n- Improve error handling for model timeouts"}, {"id": 150, "title": "Team composition for AI work", "tldr": "Build a balanced team: product-minded engineers, ML and data skills, infrastructure expertise, and a mix of seniority. Diversity of background and thinking improves problem-solving. Avoid single points of failure.", "real": "Research by Scott Page on cognitive diversity and studies such as McKinsey’s “Diversity Matters” reports have argued that diverse teams can outperform homogeneous ones on complex problems, although the size of effects varies across studies.", "body": "### Composition for a 6–8 person AI product team\n\n| Role | Count |\n|---|---|\n| AI / LLM engineers | 2–3 |\n| ML engineer | 1 |\n| Data engineer | 1 |\n| Software / backend engineer | 1–2 |\n| MLOps / platform | 1 (or shared) |\n\n### Seniority mix (guideline)\n\n```chart\n{\"title\": \"Example seniority mix for a 7-person AI team (guideline)\", \"unit\": \"people\", \"data\": [[\"Senior / staff\", 3], [\"Mid-level\", 3], [\"Junior\", 1]]}\n```"}, {"id": 151, "title": "Decision-making frameworks", "tldr": "Choose the decision process to match the decision: reversible choices should be made quickly by the people closest to the work; irreversible, high-impact choices deserve careful analysis and broader input. Make decision owners explicit.", "real": "Jeff Bezos’s Amazon shareholder letters distinguished “Type 1” decisions (irreversible, one-way doors) from “Type 2” decisions (reversible, two-way doors), urging fast decisions on the latter.", "body": "### Decision types\n\n| Type | Example | Process |\n|---|---|---|\n| Reversible | Library choice, prompt tweak | Owner decides quickly |\n| Significant | New model provider | Design doc + review |\n| Irreversible | Data retention policy, major architecture | Wider input, leadership approval |\n\n### Decision roles (DACI)\n\n| Role | Meaning |\n|---|---|\n| Driver | Runs the process |\n| Approver | Makes the final call |\n| Contributors | Give input |\n| Informed | Told the outcome |"}, {"id": 152, "title": "Build vs buy for AI components", "tldr": "For each component (models, vector database, eval tools, observability, orchestration), weigh differentiation, cost, time, team skills, control and vendor risk. Build what differentiates you; buy commodity capabilities.", "real": "Many AI teams buy observability and vector database services (such as managed vector databases or LLM tracing tools) while building their own evaluation sets, prompts and domain-specific logic, which competitors cannot easily copy.", "body": "### Decision matrix\n\n| Factor | Build | Buy |\n|---|---|---|\n| Core differentiator | ✓ | |\n| Time to value | | ✓ |\n| Team has skills | ✓ | |\n| Long-term cost at scale | Often ✓ | |\n| Vendor lock-in risk | | Consider |\n| Maintenance burden | High | Low |\n\n### Example decisions\n\n| Component | Decision | Reason |\n|---|---|---|\n| Foundation model | Buy (API) | Frontier capability |\n| Eval sets | Build | Domain-specific |\n| LLM tracing | Buy | Commodity, fast |\n| Retrieval logic | Build | Core quality driver |"}, {"id": 153, "title": "Choosing models and vendors", "tldr": "Choose models with your own evals, not leaderboards alone: measure quality on your tasks, latency, cost, safety behavior, data terms, regional availability and vendor stability. Re-evaluate regularly as models change quickly.", "real": "Analyses such as a16z’s 2024 “LLMflation” estimated that inference costs for a given capability level were falling about tenfold per year, which means model and vendor decisions should be revisited at least quarterly.", "body": "### Evaluation scorecard\n\n| Criterion | Weight | Model A | Model B |\n|---|---|---|---|\n| Eval pass rate | 40% | 91% | 88% |\n| Cost per task | 20% | $0.020 | $0.006 |\n| p95 latency | 15% | 4.1 s | 1.9 s |\n| Safety behavior | 10% | Good | Good |\n| Data terms / region | 10% | OK | OK |\n| Vendor stability | 5% | High | High |\n\n### Avoid lock-in\n\nUse an abstraction layer or gateway, keep evals portable, and test a second provider periodically."}, {"id": 154, "title": "Technical strategy", "tldr": "A technical strategy explains how the team’s architecture, tools and practices will support product goals over the next year: key bets, principles, investments and what you will not do. Keep it short and revisit quarterly.", "real": "Will Larson’s “Staff Engineer” (2021) describes writing engineering strategies as synthesizing several design decisions into clear guidance, and recommends grounding strategy in real past decisions rather than abstract visions.", "body": "### Strategy outline\n\n| Section | Example |\n|---|---|\n| Context | Product goals, current system limits |\n| Principles | “Evals before features”, “Managed services by default” |\n| Bets | Hybrid retrieval, model gateway, agent framework |\n| Investments | Eval platform, observability |\n| Non-goals | Training our own foundation model |\n| Risks | Vendor dependence, cost growth |\n\n### Example principles\n\n- Measure quality before shipping AI changes\n- Prefer simple architectures until data proves otherwise\n- Keep model providers swappable\n- Security and privacy by default"}, {"id": 155, "title": "Running design reviews", "tldr": "Design reviews improve decisions and spread knowledge. Share docs in advance, invite the right reviewers, focus discussion on key risks and alternatives, record decisions and keep reviews proportional to impact.", "real": "Engineering organizations such as Uber and others have described RFC-based design review processes in which written proposals are circulated for comments before meetings, so meetings can focus on the hardest open questions.", "body": "### Review process\n\n```mermaid\nflowchart LR\n  DOC[Design doc] --> ASYNC[Async comments: 2-3 days]\n  ASYNC --> MEET[Review meeting: key questions]\n  MEET --> DECIDE[Decision recorded]\n  DECIDE --> ADR[ADR / doc updated]\n```\n\n### Reviewer checklist\n\n- [ ] Problem and goals clear\n- [ ] Alternatives considered\n- [ ] Evaluation plan defined\n- [ ] Failure modes and fallbacks covered\n- [ ] Security and privacy considered\n- [ ] Cost and latency estimated\n- [ ] Rollout and rollback plan"}, {"id": 156, "title": "Disagree and commit", "tldr": "Teams cannot wait for unanimous agreement. Encourage open debate, decide clearly, then ask everyone to commit fully, including those who disagreed. Agree in advance what evidence would trigger revisiting the decision.", "real": "“Disagree and commit” is associated with Intel’s management culture under Andy Grove and was later highlighted by Jeff Bezos in Amazon’s 2016 shareholder letter.", "body": "### Process\n\n```mermaid\nflowchart LR\n  DEBATE[Open debate with data] --> DECIDE[Clear decision by owner]\n  DECIDE --> COMMIT[Everyone commits]\n  COMMIT --> SIGNALS[Agreed review signals]\n  SIGNALS --> REVISIT[Revisit if signals appear]\n```\n\n### Phrases\n\n- “I hear the concerns; we’re going with option B. Let’s review after the two-week eval checkpoint.”\n- “I disagree, but I’ll commit and help make it work.”\n\n### Avoid\n\nRe-arguing decisions repeatedly without new evidence."}, {"id": 157, "title": "Decisions under uncertainty", "tldr": "AI work often requires decisions with incomplete data. Clarify what you know and don’t, estimate probabilities, consider worst cases, choose reversible options when possible, and set checkpoints to learn and adjust.", "real": "Annie Duke’s “Thinking in Bets” (2018) argued that decisions should be judged by the quality of the decision process given available information, not only by outcomes, which may be affected by luck.", "body": "### Framework\n\n| Step | Question |\n|---|---|\n| Known facts | What do we know for sure? |\n| Unknowns | What don’t we know? |\n| Cheap learning | Can we reduce uncertainty quickly? |\n| Options | What are the choices? |\n| Worst case | What’s the downside of each? |\n| Reversibility | Can we undo it? |\n| Checkpoint | When will we revisit? |\n\n### Decision journal entry\n\n```\nDecision: launch beta with model B\nExpected: 88% quality, $0.006/task\nConfidence: 70%\nRevisit: after 2 weeks of beta data\n```"}, {"id": 158, "title": "Risk management", "tldr": "Keep a living risk register for technical, delivery, people, security and vendor risks, with likelihood, impact, mitigation and owner. Review it regularly and share top risks with stakeholders.", "real": "Project management standards such as PMI’s PMBOK Guide include risk management as a core knowledge area, and risk registers are standard practice in large technology programs.", "body": "### Risk register (example)\n\n| Risk | Likelihood | Impact | Mitigation | Owner |\n|---|---|---|---|---|\n| Quality bar not reached | Medium | High | Time-box + scope reduction plan | Asha |\n| Model vendor price increase | Low | Medium | Second provider tested | Lead |\n| Key person leaves | Low | High | Pairing, documentation | Lead |\n| Data access delayed | High | High | Early request, escalation date | Divya |\n| Prompt injection | Medium | High | Red-team, tool limits | Eli |\n\n### Review rhythm\n\nWeekly within the team; top three risks in stakeholder updates."}, {"id": 159, "title": "Saying no and protecting focus", "tldr": "Teams that say yes to everything deliver little well. Protect focus by tying work to agreed priorities, explaining trade-offs, offering alternatives and making the cost of new requests visible.", "real": "Steve Jobs said at Apple’s 1997 Worldwide Developers Conference that focusing means saying no to the hundred other good ideas, a principle widely quoted in product and engineering leadership.", "body": "### Responding to new requests\n\n| Step | Example |\n|---|---|\n| Acknowledge | “I see why this matters to sales.” |\n| Show trade-off | “Taking it on delays the billing assistant by 2 weeks.” |\n| Ask priority | “Which matters more this quarter?” |\n| Offer alternative | “We could do a smaller version next sprint.” |\n\n### Intake process\n\nAll new requests go to the backlog with impact and urgency; reviewed in planning, not handled ad hoc."}, {"id": 160, "title": "Documenting decisions", "tldr": "Record important decisions with context, options, choice and reasoning. A decision log prevents repeated debates, helps new members understand history and supports accountability.", "real": "Architecture decision records, proposed by Michael Nygard in 2011, and decision logs used in many engineering organizations make reasoning visible long after the people involved have moved on.", "body": "### Decision log format\n\n| Date | Decision | Context | Options | Reason | Owner |\n|---|---|---|---|---|---|\n| 2026-02-03 | Use model B for beta | Cost pressure | A, B, C | Same quality, 70% cheaper | Lead |\n| 2026-02-17 | Add human review for refunds | Error risk | Auto, review | Policy risk too high | PM + Lead |\n\n### Where to store\n\nTeam wiki or repository; link decisions from design docs and tickets."}, {"id": 161, "title": "Status reporting", "tldr": "Good status reports are short, honest and decision-oriented: progress against goals, key metrics, risks with mitigations, and asks. Use a consistent format and traffic-light status with explanations, not just colors.", "real": "The “watermelon project” metaphor, green on the outside and red inside, is widely used in project management to describe status reports that hide real problems until it’s too late.", "body": "### Status report template\n\n```\nProject: Billing assistant          Status: 🟡 At risk\nGoal: beta to 50 agents by Dec 15\nProgress: retrieval done; quality at 86% (target 90%)\nMetrics: p95 latency 3.2 s; cost $0.011/answer\nRisks: quality target — mitigation: human review for policy questions\nAsks: approve beta with review mode by Friday\nNext: groundedness fixes; beta onboarding plan\n```\n\n### Status definitions\n\n| Color | Meaning |\n|---|---|\n| 🟢 | On track |\n| 🟡 | At risk; mitigation in place |\n| 🔴 | Will miss without decision or help |"}, {"id": 162, "title": "Managing expectations", "tldr": "Set expectations early and repeatedly: what will be delivered, quality levels, limitations, timelines and uncertainties. Under-promise on uncertain AI capabilities and explain trade-offs in business terms.", "real": "High-profile AI launch problems, such as early issues with Google’s AI Overviews in 2024, show how gaps between expectations and real AI behavior can damage trust, which is why many teams launch as “preview” or “beta” first.", "body": "### Expectation-setting elements\n\n| Element | Example |\n|---|---|\n| Scope | Billing questions only, English |\n| Quality | \\~90% correct; human review for refunds |\n| Limitations | No account changes in v1 |\n| Timeline | Beta in 6 weeks (range 5–8) |\n| Uncertainties | Quality bar for rare policies |\n\n### Phrases that help\n\n- “Here’s what it will do, and what it won’t do yet.”\n- “Our confidence in this date is about 70%; we’ll know more at the checkpoint.”"}, {"id": 163, "title": "Demoing AI work to stakeholders", "tldr": "Demo AI with real examples, including limitations, plus metrics from evals. Prepare carefully, use stable inputs for live demos, have recordings as backup, and explain what is production-ready versus experimental.", "real": "Google’s February 2023 Bard promotional demo included a factual error about the James Webb Space Telescope, and Alphabet’s market value fell by about $100 billion that day, a reminder to fact-check AI demos.", "body": "### Demo preparation checklist\n\n- [ ] Clear goal and audience\n- [ ] Representative examples, including one failure\n- [ ] Eval metrics slide\n- [ ] Facts in outputs verified\n- [ ] Backup recording\n- [ ] Clear statement of what’s production-ready\n\n### Demo structure\n\n| Minutes | Content |\n|---|---|\n| 2 | Problem and goal |\n| 8 | Live demo |\n| 3 | Metrics and limitations |\n| 2 | Next steps and asks |"}, {"id": 164, "title": "Handling scope changes", "tldr": "Scope changes are normal but must be managed: assess impact on time, quality and cost, present options, get decisions from the right owner, and update plans and communication.", "real": "Agile methods treat changing requirements as expected, while still requiring teams to make the cost of changes visible through re-planning and backlog re-prioritization.", "body": "### Change assessment\n\n| Question | Example |\n|---|---|\n| What’s requested? | Add Spanish support |\n| Why? | Key customer request |\n| Impact on timeline? | +2 weeks (eval set, testing) |\n| Impact on quality? | Spanish quality unknown |\n| Impact on cost? | +10% tokens |\n| Options | Add now / phase 2 / limited beta |\n\n### Decision flow\n\n```mermaid\nflowchart LR\n  REQ[Change request] --> ASSESS[Assess impact]\n  ASSESS --> OPTIONS[Options with trade-offs]\n  OPTIONS --> OWNER[Decision by owner]\n  OWNER --> UPDATE[Update plan + communicate]\n```"}, {"id": 165, "title": "Deadlines and fixed dates", "tldr": "When dates are fixed (regulation, events, contracts), make scope flexible: define the minimum valuable scope, prioritize ruthlessly, cut early, and protect quality and safety requirements.", "real": "Regulatory deadlines such as GDPR’s May 2018 start date forced many organizations to deliver compliance features by fixed dates, often by prioritizing minimum required capabilities first.", "body": "### Fixed-date planning\n\n| Priority | Scope |\n|---|---|\n| Must have | Core flow, safety, monitoring |\n| Should have | Better UX, extra languages |\n| Could have | Advanced features |\n| Won’t have (this release) | Agentic actions |\n\n### Rules\n\n- Don’t cut evals, security or monitoring to meet dates\n- Decide cuts early, not in the last week\n- Communicate the scope plan to stakeholders upfront"}, {"id": 166, "title": "Communicating delays", "tldr": "Share delays as soon as you know, with the cause, new estimate, impact and options. Early honest communication preserves trust; late surprises destroy it.", "real": "Many organizations’ project failure reviews highlight late reporting of known problems as a key factor, which is why leaders emphasize “bad news early” cultures.", "body": "### Delay message template\n\n```text\nSubject: Billing assistant beta — 2-week delay risk\n\nWhat happened: quality is at 86% vs 90% target; policy questions are the main gap.\nImpact: beta date moves from Dec 15 to Dec 29 if we wait for 90%.\nOptions:\n  A) Launch Dec 15 with human review for policy questions (recommended)\n  B) Launch Dec 29 at full quality bar\nDecision needed by: Friday\n```\n\n### Timing rule\n\nCommunicate within 24 hours of knowing a commitment is at risk."}, {"id": 167, "title": "Launch readiness", "tldr": "Before launch, confirm quality, safety, performance, operations, support and communication readiness with a checklist and a go/no-go meeting. Launch gradually with rollback ready.", "real": "Google’s SRE practices include launch coordination checklists covering capacity, monitoring, failure modes and rollback plans, which many organizations adapt for their own launches.", "body": "### Launch checklist\n\n| Area | Check |\n|---|---|\n| Quality | Eval thresholds met |\n| Safety | Red-team passed, guardrails live |\n| Performance | Load tested, latency OK |\n| Cost | Budgets and alerts set |\n| Operations | Monitoring, on-call, runbook |\n| Rollback | Tested |\n| Support | Trained, FAQs ready |\n| Legal / privacy | Approved |\n| Communication | Release notes, stakeholder update |\n\n### Go / no-go meeting\n\n15 minutes: each owner confirms their area; any red item means no-go or explicit risk acceptance by the decision owner."}, {"id": 168, "title": "After launch", "tldr": "The first weeks after launch decide success. Monitor closely, triage feedback daily, fix top issues fast, communicate improvements, and hold a retrospective to capture learnings.", "real": "Teams commonly run a launch “war room” during the first days after major releases, with dashboards and dedicated responders, so they can react quickly to unexpected user behavior or failures.", "body": "### Post-launch plan\n\n| Period | Activities |\n|---|---|\n| Day 1–3 | War room, hourly metric checks |\n| Week 1 | Daily triage of feedback and failures |\n| Weeks 2–4 | Weekly improvements, eval expansion |\n| Week 4 | Launch retrospective |\n\n### Metrics to watch\n\nAdoption, quality (sampled evals and feedback), errors, latency, cost, support tickets and safety flags."}, {"id": 169, "title": "Managing several projects at once", "tldr": "When the team runs several projects, limit concurrency, assign clear owners, visualize the portfolio, and prioritize explicitly. Too many parallel projects slow all of them.", "real": "Research on multitasking, such as studies summarized by the American Psychological Association, shows that switching between tasks reduces productivity, which applies to teams juggling too many projects as well as to individuals.", "body": "### Portfolio view\n\n| Project | Priority | Owner | Status | People |\n|---|---|---|---|---|\n| Billing assistant | 1 | Asha | 🟡 | 3 |\n| Eval platform | 2 | Chen | 🟢 | 2 |\n| Cost optimization | 3 | Eli | 🟢 | 1 |\n| Spanish support | 4 | — | Not started | 0 |\n\n### Rules\n\n- Maximum 2–3 active projects for a team of 6\n- Every project has one owner\n- Lower-priority projects pause when higher ones need help"}, {"id": 170, "title": "Building trust with stakeholders", "tldr": "Stakeholder trust comes from reliability (doing what you say), transparency (no surprises), competence (good decisions) and understanding their goals. Build it consistently over time; it pays off when problems happen.", "real": "“The Trusted Advisor” (Maister, Green and Galford, 2000) describes trust as built from credibility, reliability and intimacy, reduced by self-orientation, a model that applies to internal stakeholders as well as clients.", "body": "### Trust builders\n\n| Behavior | Example |\n|---|---|\n| Reliability | Weekly update every Friday, without fail |\n| Transparency | Share risks early |\n| Competence | Clear trade-off analyses |\n| Understanding | Know their goals and pressures |\n| Credit sharing | Highlight their contributions |\n\n### Trust equation\n\n```\nTrust = (Credibility + Reliability + Intimacy) ÷ Self-orientation\n```"}, {"id": 171, "title": "Responsible AI at team level", "tldr": "Responsible AI becomes real through team practices: risk assessment for new features, fairness and safety testing, privacy reviews, documentation, human oversight and incident processes. The lead makes these normal parts of delivery.", "real": "The NIST AI Risk Management Framework (2023) organizes AI risk management into Govern, Map, Measure and Manage functions, and many teams use it to structure practical responsible AI activities.", "body": "### Team practices\n\n| Practice | When |\n|---|---|\n| Risk assessment | New feature or major change |\n| Fairness testing | Features affecting people differently |\n| Safety red-teaming | User-facing generative features |\n| Privacy review | New data uses |\n| Documentation | Model and system cards |\n| Human oversight | High-stakes decisions |\n| Incident process | Always ready |\n\n### Integration into workflow\n\n```mermaid\nflowchart LR\n  DESIGN[Design doc] --> RISK[Risk section]\n  RISK --> TESTS[Safety + fairness evals]\n  TESTS --> REVIEW[Pre-launch review]\n  REVIEW --> MONITOR[Monitoring]\n```"}, {"id": 172, "title": "Owning evaluation quality", "tldr": "The team lead ensures evals are trustworthy: representative cases, expert-validated references, regular updates, coverage of risks and segments, and protection against overfitting to the eval set.", "real": "Benchmark contamination, where test data leaks into model training, has been documented for several public AI benchmarks, which is why teams maintain private, regularly refreshed eval sets for their own products.", "body": "### Eval quality checklist\n\n- [ ] Cases represent real usage\n- [ ] Reference answers validated by experts\n- [ ] Coverage of edge cases, languages and user groups\n- [ ] Safety and adversarial cases included\n- [ ] Held-out set not used for tuning\n- [ ] Refreshed with production failures monthly\n- [ ] LLM judges calibrated against human labels\n\n### Overfitting warning\n\nIf eval scores rise but user feedback doesn’t improve, the eval set may no longer represent real usage."}, {"id": 173, "title": "Red teaming as a team practice", "tldr": "Regularly try to break your own AI systems: prompt injection, jailbreaks, data leakage, harmful outputs and misuse. Run team red-teaming sessions, use automated tools, and turn findings into regression tests.", "real": "Microsoft’s AI Red Team published lessons in 2025 from red-teaming more than 100 generative AI products, emphasizing that human judgment and creativity remain essential alongside automated testing tools.", "body": "### Red-team session format (2 hours)\n\n| Step | Activity |\n|---|---|\n| 15 min | Threat briefing |\n| 75 min | Attack attempts in pairs |\n| 20 min | Findings review and severity |\n| 10 min | Owners for fixes |\n\n### Attack categories\n\n| Category | Example |\n|---|---|\n| Prompt injection | Instructions hidden in documents |\n| Jailbreak | Role-play to bypass rules |\n| Data leakage | Asking for other users’ data |\n| Harmful content | Policy-violating requests |\n| Tool misuse | Tricking agent into actions |"}, {"id": 174, "title": "Privacy and data handling", "tldr": "Teams must handle personal and confidential data carefully: minimize collection, restrict access, redact logs, follow retention rules, honor deletion requests and use vendors with appropriate terms. Leads enforce these habits.", "real": "Italy’s data protection authority temporarily restricted ChatGPT in March 2023 over privacy concerns, and in 2023 Zoom revised its terms after criticism about using customer content for AI training, showing how privacy issues affect AI products.", "body": "### Data handling rules (example)\n\n| Rule | Practice |\n|---|---|\n| Minimize | Only send needed fields to models |\n| Redact | Mask PII in logs and traces |\n| Restrict | Role-based access to data |\n| Retain | Delete logs after defined period |\n| Vendors | Enterprise terms, no training on our data |\n| Local copies | No customer data on laptops |\n| Deletion | Process for user requests |\n\n### Team training\n\nOnboarding includes data handling; annual refreshers; quick reference in the team handbook."}, {"id": 175, "title": "Security for AI systems", "tldr": "AI systems add new attack surfaces: prompt injection, insecure tool use, data exfiltration, model supply chain and AI-generated code risks. Threat-model AI features, limit permissions and test security regularly.", "real": "Researchers disclosed “EchoLeak” in 2025, a vulnerability in Microsoft 365 Copilot that could leak data through a crafted email without user interaction; Microsoft fixed it. Such cases show prompt injection is a real security risk in production AI systems.", "body": "### AI threat model questions\n\n| Question | Example mitigation |\n|---|---|\n| What untrusted content reaches the model? | Treat as data, not instructions |\n| What can the model access? | Least privilege |\n| What actions can it take? | Confirmations, limits |\n| Can it send data outside? | Block external links/images in outputs |\n| What third-party models or packages do we use? | Supply-chain review |\n\n### Lethal trifecta (Simon Willison)\n\n```mermaid\nflowchart TB\n  A[Access to private data] --> RISK[Exfiltration risk]\n  B[Exposure to untrusted content] --> RISK\n  C[Ability to communicate externally] --> RISK\n```\n\nAvoid combining all three without strong controls."}, {"id": 176, "title": "Compliance awareness", "tldr": "Team leads need enough compliance knowledge to spot issues: data protection laws, AI-specific rules such as the EU AI Act, sector rules and company policies. Involve legal early and document compliance decisions.", "real": "The EU AI Act entered into force in August 2024; prohibitions applied from February 2025 and general-purpose AI obligations from August 2025. In 2026 EU institutions agreed to delay most high-risk system obligations to December 2027 and August 2028.", "body": "### Awareness checklist\n\n| Question | If yes |\n|---|---|\n| Processing personal data? | Privacy review |\n| Users in the EU? | GDPR, AI Act check |\n| Decisions affecting jobs, credit, health? | High-risk review |\n| Chatbot or generated content? | Transparency duties |\n| Regulated industry? | Sector rules |\n| Children as users? | Extra protections |\n\nThis is awareness, not legal advice; involve qualified counsel."}, {"id": 177, "title": "Handling AI incidents", "tldr": "AI incidents include harmful outputs, data exposure, biased decisions and runaway costs, as well as outages. Have kill switches, runbooks, communication templates and blameless reviews ready before launch.", "real": "Google paused Gemini’s image generation of people in February 2024 after historically inaccurate outputs, and OpenAI rolled back a sycophantic GPT-4o update in April 2025, both examples of quick containment of AI behavior problems.", "body": "### AI incident types\n\n| Type | Example | Containment |\n|---|---|---|\n| Harmful output | Offensive response goes viral | Disable feature, block pattern |\n| Data exposure | User sees others’ data | Shut off, investigate |\n| Quality collapse | Model update breaks answers | Roll back version |\n| Cost spike | Runaway agent loops | Rate limits, kill switch |\n| Bias | Unequal outcomes found | Pause decisions, review |\n\n### Preparedness\n\n- [ ] Feature flags for every AI feature\n- [ ] Version rollback tested\n- [ ] On-call knows AI-specific runbooks\n- [ ] Communication templates prepared"}, {"id": 178, "title": "Documentation for AI systems", "tldr": "Document what each AI system does, its data, models, evaluation results, limitations, safety measures and owners. Documentation supports users, auditors, new team members and incident response.", "real": "Model cards (proposed by Google researchers in 2019) and datasheets for datasets (Gebru and colleagues, 2018) established templates for documenting AI models and data, and they are now widely used.", "body": "### System documentation set\n\n| Document | Content |\n|---|---|\n| System card | Purpose, users, limitations, evals |\n| Architecture doc | Components and data flow |\n| Data sheet | Sources, consent, processing |\n| Eval report | Results by segment |\n| Runbook | Operations and incidents |\n| Change log | Model, prompt, data versions |\n\n### Keep it current\n\nUpdate documentation in the same PR as the change, and review quarterly."}, {"id": 179, "title": "Ethical conversations in the team", "tldr": "Create space for team members to raise ethical concerns about AI features: misuse, harm, fairness, privacy and societal impact. Take concerns seriously, discuss them openly and escalate when needed.", "real": "Employee concerns have influenced AI decisions at major companies; for example, Google did not renew its Project Maven military AI contract in 2018 after internal protests, showing that engineers’ ethical concerns can shape company choices.", "body": "### Making it safe to raise concerns\n\n| Practice | Example |\n|---|---|\n| Explicit invitation | “Ethics and risk” item in design reviews |\n| Anonymous channel | For sensitive concerns |\n| Response commitment | Every concern gets a reply |\n| Escalation path | Known route to responsible AI or legal |\n\n### Discussion questions\n\n- Who could be harmed by this feature?\n- Could it be misused?\n- Would users be surprised by how it works?\n- Are we comfortable explaining this publicly?"}, {"id": 180, "title": "Building a quality culture", "tldr": "A quality culture means everyone cares about correctness, reliability and user impact, not just shipping. Leads build it through standards, examples, celebrating quality work, blameless learning and never rewarding shortcuts.", "real": "Toyota’s production system practice of “jidoka”, letting any worker stop the line when a defect is found, is often cited in software as inspiration for empowering every team member to stop a release when quality is at risk.", "body": "### Quality culture signals\n\n| Healthy | Unhealthy |\n|---|---|\n| People raise quality concerns freely | Concerns dismissed as slowing down |\n| Evals always run | “We’ll test later” |\n| Incidents lead to learning | Incidents lead to blame |\n| Quality work is recognized | Only feature launches celebrated |\n\n### Lead actions\n\n- Give everyone the right to stop a risky release\n- Celebrate bug fixes and eval improvements in demos\n- Include quality metrics in team goals"}, {"id": 181, "title": "Shaping team culture", "tldr": "Culture is what people actually do, especially when no one is watching. Leads shape it by what they reward, tolerate, model and talk about. Define a few values with concrete behaviors and reinforce them consistently.", "real": "Netflix’s culture memo (2009) and its later updates described specific behaviors behind each value, an approach many technology companies copied to make values concrete rather than abstract.", "body": "### Values with behaviors\n\n| Value | Behaviors |\n|---|---|\n| Quality | Evals before merge; fix root causes |\n| Openness | Share failures in demos |\n| Ownership | Follow work through to production |\n| Respect | Kind code reviews; listen in meetings |\n| Learning | Weekly reading group; experiments shared |\n\n### Reinforcement\n\n```mermaid\nflowchart LR\n  MODEL[Lead models behavior] --> RECOGNIZE[Recognize it in others]\n  RECOGNIZE --> HIRE[Hire for it]\n  HIRE --> ADDRESS[Address violations]\n  ADDRESS --> MODEL\n```"}, {"id": 182, "title": "Team rituals", "tldr": "Rituals create rhythm and belonging: planning, demos, retros, reading groups, celebrations and informal social time. Keep them purposeful, inclusive and adapted to the team’s needs and time zones.", "real": "Many engineering teams hold regular “demo days” or internal hackathons, such as Atlassian’s long-running ShipIt days, which combine learning, creativity and team bonding.", "body": "### Ritual calendar (example)\n\n| Ritual | Frequency | Purpose |\n|---|---|---|\n| Planning | Biweekly | Focus |\n| Demo | Biweekly | Celebrate, share |\n| Retro | Biweekly/monthly | Improve |\n| Reading group | Weekly | Learning |\n| Hack day | Quarterly | Creativity |\n| Team lunch / virtual social | Monthly | Connection |\n| Launch celebration | Per launch | Recognition |\n\n### Check\n\nAsk the team quarterly which rituals help and which to drop."}, {"id": 183, "title": "Effective remote collaboration", "tldr": "Remote collaboration works with strong written communication, shared documents, clear ownership, recorded meetings, collaborative tools and deliberate relationship-building. Design for the most remote person, not the office majority.", "real": "GitLab’s all-remote handbook recommends documenting everything and making meetings optional where possible, with recordings and notes so people in any time zone can contribute.", "body": "### Remote practices\n\n| Practice | Benefit |\n|---|---|\n| Docs-first decisions | Everyone can contribute |\n| Recorded meetings + notes | Time-zone inclusive |\n| Shared dashboards | Common visibility |\n| Pairing over video | Knowledge sharing |\n| Virtual whiteboards | Collaborative design |\n| Periodic in-person meetups | Stronger relationships |\n\n### Remote meeting rules\n\n- Everyone joins on their own device if anyone is remote\n- Agenda in advance; notes during\n- Chat questions are read aloud"}, {"id": 184, "title": "Working across time zones", "tldr": "Distributed teams need overlap hours, handoff routines, rotating meeting times, async-first communication and careful planning of dependencies. Avoid making one region always work late.", "real": "Some global engineering teams use “follow-the-sun” models where work and on-call hand off between regions, which requires disciplined handoff notes and documentation to work well.", "body": "### Practices\n\n| Practice | Example |\n|---|---|\n| Overlap window | 2–3 shared hours |\n| Rotating meeting times | Alternate early/late slots |\n| Handoff notes | End-of-day summaries |\n| Async decisions | Comment deadlines on docs |\n| Regional ownership | Reduce cross-zone dependencies |\n\n### Handoff template\n\n```\nDone today: reranker experiment complete (results in EXP-048)\nIn progress: integration PR #412 (needs review)\nBlocked: waiting for data access ticket DATA-221\nFor next region: please review PR #412 and run full evals\n```"}, {"id": 185, "title": "Meeting hygiene", "tldr": "Meetings are expensive: cost equals attendees × time. Hold fewer, shorter and better meetings: clear purpose, agenda, right people, decisions recorded, and default to async for status updates.", "real": "In January 2023 Shopify cancelled all recurring meetings with more than two people and introduced meeting-free Wednesdays, as part of an effort to reduce meeting load and give employees more focus time.", "body": "### Meeting cost\n\n```\nCost = attendees × duration × average hourly cost\nExample: 8 people × 1 hour × $80 = $640 per meeting; weekly = ~$33,000/year\n```\n\n### Meeting checklist\n\n| Before | During | After |\n|---|---|---|\n| Purpose and agenda | Start on time | Notes and decisions shared |\n| Right attendees only | Timekeeper | Action owners and dates |\n| Pre-read shared | Capture decisions | Cancel if no longer needed |\n\n### Default to async\n\nStatus updates, FYI announcements and simple approvals."}, {"id": 186, "title": "Protecting focus time", "tldr": "Deep technical work needs uninterrupted time. Create focus blocks, meeting-free days, quiet hours for chat and an interrupt rotation, and protect them from external pressure.", "real": "Research by Gloria Mark at the University of California, Irvine, is often cited for finding that it can take over 20 minutes to return to a task after an interruption, which supports policies that protect developer focus time.", "body": "### Focus practices\n\n| Practice | Example |\n|---|---|\n| Focus blocks | 9:00–12:00 daily, no meetings |\n| Meeting-free day | Wednesdays |\n| Chat norms | Notifications off during focus |\n| Interrupt rotation | One person handles questions |\n| Batch meetings | Afternoons only |\n\n### Lead behaviors\n\n- Don’t schedule meetings in focus blocks\n- Shield the team from ad hoc requests\n- Respect status indicators"}, {"id": 187, "title": "Celebrating wins and learning", "tldr": "Celebrate launches, milestones, quality improvements and valuable failed experiments. Celebration reinforces values, builds morale and helps people see progress in long AI projects.", "real": "Teresa Amabile and Steven Kramer’s research, described in “The Progress Principle” (2011), found that making progress in meaningful work is the strongest daily booster of motivation and positive emotions at work.", "body": "### What to celebrate\n\n| Type | Example |\n|---|---|\n| Launches | Beta goes live |\n| Quality milestones | Eval pass rate reaches 90% |\n| Cost wins | 40% cost reduction |\n| Learning | Experiment that saved months of work |\n| People | Promotions, first production deploy |\n| Glue work | Great documentation, mentoring |\n\n### Make progress visible\n\nTrack metric trends on a team dashboard and review progress in demos."}, {"id": 188, "title": "Inclusion", "tldr": "Inclusive teams make everyone feel respected and able to contribute. Practice fair meeting participation, equitable assignment of opportunities, inclusive language, accessible tools and prompt response to exclusionary behavior.", "real": "Google’s Project Aristotle found that teams where members spoke in roughly equal proportions (“equality in distribution of conversational turn-taking”) tended to perform better, a finding also reported in earlier research on collective intelligence by Woolley and colleagues (2010).", "body": "### Inclusive practices\n\n| Area | Practice |\n|---|---|\n| Meetings | Round-robin input, written input options |\n| Opportunities | Rotate high-visibility work |\n| Communication | Plain language, avoid jargon without explanation |\n| Accessibility | Captions, accessible documents |\n| Schedules | Respect holidays and time zones |\n| Feedback | Ask about inclusion in health checks |\n\n### Watch for\n\nThe same voices dominating, interruptions, ideas credited to the wrong person, and unequal access to stretch work."}, {"id": 189, "title": "Supporting wellbeing", "tldr": "Sustainable performance depends on wellbeing. Watch workload, encourage time off, normalize talking about stress, respond with flexibility to personal circumstances, and point to professional support when needed.", "real": "The World Health Organization’s 2022 guidelines on mental health at work recommend manager training to recognize and respond to employees experiencing emotional distress, and organizational interventions to reduce psychosocial risks.", "body": "### Lead practices\n\n| Practice | Example |\n|---|---|\n| Ask genuinely | “How are you doing, really?” in 1:1s |\n| Watch signals | Late work, withdrawal, irritability |\n| Flexibility | Adjust deadlines for personal situations |\n| Encourage leave | Remind people to take vacations |\n| Model balance | Don’t message late at night |\n| Know resources | Employee assistance programs |\n\n### Boundaries\n\nYou’re not a therapist; listen, support and guide people to professional help when needed."}, {"id": 190, "title": "Team health checks", "tldr": "Regular team health checks measure how the team feels about clarity, workload, collaboration, quality, learning and morale. Discuss results openly, choose one or two improvements, and track trends over time.", "real": "Spotify published its “Squad Health Check” model in 2014, a simple self-assessment where teams rate areas such as speed, fun, learning and pawns-or-players, which many organizations adopted.", "body": "### Health check areas (1–5)\n\n| Area | Question |\n|---|---|\n| Clarity | Do we know our goals and priorities? |\n| Workload | Is the pace sustainable? |\n| Collaboration | Do we help each other? |\n| Quality | Are we proud of what we ship? |\n| Learning | Are we growing? |\n| Autonomy | Can we decide how to work? |\n| Fun | Do we enjoy working together? |\n\n### Trend (illustrative)\n\n```chart\n{\"title\": \"Team health score trend (illustrative, average of areas)\", \"unit\": \"/5\", \"data\": [[\"Q1\", 3.2], [\"Q2\", 3.5], [\"Q3\", 3.9], [\"Q4\", 4.1]]}\n```"}, {"id": 191, "title": "Leadership self-assessment", "tldr": "Assess yourself regularly across people leadership, delivery, technical judgment, communication, collaboration and self-management. Combine self-reflection with feedback from your team, peers and manager, and pick one or two areas to improve each quarter.", "real": "Many companies use 360-degree feedback, gathering input from managers, peers and direct reports, to help leaders see blind spots that self-assessment alone misses.", "body": "### Self-assessment (1–5)\n\n| Area | Questions |\n|---|---|\n| People | Do my team members grow? Do they trust me? |\n| Delivery | Do we meet commitments with quality? |\n| Technical | Are our technical decisions sound? |\n| Communication | Are priorities and decisions clear? |\n| Collaboration | Do other teams like working with us? |\n| Self-management | Am I sustainable and focused? |\n\n### Quarterly growth loop\n\n```mermaid\nflowchart LR\n  ASSESS[Self + 360 feedback] --> PICK[Pick 1-2 areas]\n  PICK --> PLAN[Plan actions]\n  PLAN --> PRACTICE[Practice]\n  PRACTICE --> ASSESS\n```"}, {"id": 192, "title": "Growing beyond one team", "tldr": "Moving from team lead to manager of managers or senior technical leader means leading through others’ leadership: developing leads, setting direction across teams, building organizational systems and working at a longer time horizon.", "real": "Camille Fournier’s “The Manager’s Path” (2017) describes how responsibilities change from tech lead to manager, manager of managers and senior leadership, with each level relying more on systems and other leaders.", "body": "### What changes\n\n| Team lead | Manager of managers / senior leader |\n|---|---|\n| Direct work with engineers | Work through leads |\n| Sprint-level planning | Quarterly and annual planning |\n| Team processes | Organizational systems |\n| Hands-on technical | Technical strategy |\n| One team’s culture | Multiple teams’ culture |\n\n### Preparing\n\nDevelop leads in your team, lead cross-team initiatives, learn budgeting and planning, and build relationships across the organization."}, {"id": 193, "title": "Capstone: taking over a struggling team", "tldr": "You inherit a 6-person AI team with missed deadlines, low morale and quality problems. Listen first, diagnose systematically, secure quick wins, reset priorities and working agreements, and rebuild trust and delivery over 90 days.", "real": "This capstone applies the 90-day transition approach from Michael Watkins’s “The First 90 Days” and team effectiveness factors from Google’s Project Aristotle to a realistic AI team situation.", "body": "### Diagnosis findings (example)\n\n| Area | Finding |\n|---|---|\n| Priorities | 5 parallel projects, unclear ranking |\n| Quality | No eval gates; frequent regressions |\n| Morale | Overtime, blame after incidents |\n| Process | No planning; constant interrupts |\n| People | One senior engineer overloaded |\n\n### 90-day plan\n\n| Period | Actions |\n|---|---|\n| Days 1–30 | 1:1s, stakeholder interviews, stop 2 projects, start interrupt rotation |\n| Days 31–60 | Eval gates in CI, blameless postmortems, planning cadence |\n| Days 61–90 | Working agreements, rebalanced ownership, roadmap with confidence levels |\n\n### Success signals at day 90\n\nFewer regressions, on-time delivery of top priority, improved health check scores."}, {"id": 194, "title": "Capstone: planning and estimating an LLM feature", "tldr": "Plan an AI document Q&A feature: break down work, separate deterministic and exploratory tasks, estimate with ranges, define time-boxes and checkpoints, and communicate a plan with confidence levels.", "real": "This capstone applies PERT three-point estimates, time-boxed spikes and the cone of uncertainty to a typical retrieval-augmented generation (RAG) project.", "body": "### Work breakdown and estimates\n\n| Task | Type | O | M | P | Expected (days) |\n|---|---|---|---|---|---|\n| Document ingestion | Deterministic | 3 | 5 | 8 | 5.2 |\n| Eval set (150 Q&A) | Deterministic + expert time | 4 | 6 | 10 | 6.3 |\n| Baseline RAG | Deterministic | 3 | 4 | 7 | 4.3 |\n| Quality improvement | Exploratory | Time-box 10 days | | | 10 |\n| API + UI integration | Deterministic | 4 | 6 | 9 | 6.2 |\n| Monitoring + launch prep | Deterministic | 2 | 3 | 5 | 3.2 |\n\n### Plan message\n\n```\nTotal effort ≈ 35 person-days; with 3 people in parallel ≈ 3–4 weeks + buffer.\nEstimate: beta in 4–6 weeks (70% confidence: 5 weeks).\nCheckpoint: week 3 quality review (target 85%; launch bar 90%).\n```"}, {"id": 195, "title": "Capstone: distributing work across a 6-person team", "tldr": "Assign the RAG project to a team of six considering skills, growth, workload and risk: owners for each workstream, pairs for knowledge transfer, an interrupt rotation and clear interfaces between pieces.", "real": "This capstone applies skills mapping, ownership models, WIP limits and growth assignments, practices commonly recommended in engineering management literature such as “An Elegant Puzzle” and “The Manager’s Path”.", "body": "### Assignment plan\n\n| Workstream | Owner | Pair / support | Reason |\n|---|---|---|---|\n| Ingestion pipeline | Divya | Eli | Data expertise |\n| Eval set and judges | Asha | Domain expert | Eval strength |\n| Retrieval + quality | Ben | Chen | Expert + knowledge spread |\n| API + integration | Farah | Asha | Backend skills |\n| Monitoring + deploy | Eli | Divya | Infra expertise |\n| Interrupt rotation | Rotating weekly | — | Protect focus |\n\n### Coordination\n\n```mermaid\nflowchart LR\n  ING[Ingestion - Divya] --> RET[Retrieval - Ben]\n  EVAL[Evals - Asha] --> RET\n  RET --> API[API - Farah]\n  API --> OPS[Deploy + monitor - Eli]\n```\n\nInterface contracts agreed in week 1; WIP limit of 2 items per person; weekly eval review."}, {"id": 196, "title": "Capstone: introducing AI coding tools to the team", "tldr": "Roll out AI coding tools thoughtfully: pilot with volunteers, write a policy, share practices, add review and security safeguards, measure impact over months, and adjust based on evidence.", "real": "This capstone reflects mixed public evidence on AI coding productivity, such as GitHub’s 2022 controlled study showing 55% faster task completion and METR’s 2025 study showing experienced developers 19% slower in their own repositories, which argues for measured adoption.", "body": "### Rollout plan\n\n| Phase | Duration | Activities |\n|---|---|---|\n| Pilot | 4 weeks | 3 volunteers, notes on what works |\n| Policy | 1 week | Data rules, review rules, approved tools |\n| Team rollout | 4 weeks | Training, shared prompts, AGENTS.md |\n| Measurement | 3 months | Cycle time, defects, satisfaction |\n| Review | Quarterly | Keep, adjust, expand |\n\n### Metrics\n\n| Metric | Baseline | After 3 months |\n|---|---|---|\n| Median PR cycle time | 2.5 days | Measure |\n| Change failure rate | 8% | Measure |\n| Review time per PR | 4 hours | Measure |\n| Developer satisfaction | Survey | Measure |"}, {"id": 197, "title": "Capstone: leading through a production AI incident", "tldr": "The AI assistant starts giving wrong refund policy answers after a model update. Detect, contain (roll back), communicate, investigate, fix with new evals, and run a blameless postmortem, while supporting the people involved.", "real": "This capstone mirrors real cases, such as the 2024 Moffatt v. Air Canada decision holding a company responsible for its chatbot’s incorrect policy information, and OpenAI’s April 2025 rollback of a GPT-4o update.", "body": "### Timeline\n\n| Time | Action |\n|---|---|\n| 09:10 | Alert: thumbs-down rate +80% |\n| 09:20 | On-call confirms wrong refund answers |\n| 09:30 | Rollback to previous model version via flag |\n| 10:00 | Stakeholders and support informed |\n| Day 1 | Root cause: new model ignores policy section format |\n| Day 2–3 | Prompt fix, 40 new eval cases, re-test |\n| Day 5 | Staged re-rollout |\n| Day 7 | Blameless postmortem |\n\n### Lessons\n\n- Model upgrades need full eval runs and canary rollout\n- Policy questions need a dedicated eval subset\n- Alerts on feedback rates worked; keep them"}, {"id": 198, "title": "Capstone: a difficult conversation", "tldr": "A talented senior engineer dismisses teammates’ ideas harshly in reviews, and juniors have stopped speaking up. Prepare, use specific examples, explain impact, listen, agree on behavior changes and follow up.", "real": "This capstone applies the SBI feedback model, radical candor and research on psychological safety, such as Google’s Project Aristotle and Amy Edmondson’s work, to a common team situation.", "body": "### Conversation plan\n\n| Step | Example |\n|---|---|\n| Purpose | “I want to talk about review culture because you’re important to this team.” |\n| Situation + behavior | “In last week’s design review, you called Divya’s proposal ‘naive’ and moved on.” |\n| Impact | “Juniors told me they now avoid sharing ideas; we’re losing input.” |\n| Listen | “How do you see it?” |\n| Agreement | Critique ideas with reasons; ask questions first |\n| Follow-up | Observe next reviews; check in in two weeks |\n\n### If behavior continues\n\nDocument, escalate per company process, and protect the team’s psychological safety."}, {"id": 199, "title": "Your AI team lead playbook", "tldr": "Bring everything together into a personal playbook: weekly rhythms, templates, checklists and principles you use to lead. A written playbook makes your leadership consistent and easier to improve.", "real": "Many engineering leaders share personal “manager README” documents and operating playbooks describing how they work, what they value and what team members can expect from them.", "body": "### Weekly rhythm\n\n| Day | Activities |\n|---|---|\n| Monday | Priorities, risks review, plan week |\n| Tuesday–Thursday | 1:1s, design reviews, focus blocks |\n| Wednesday | Eval and quality review |\n| Friday | Stakeholder update, reflection, planning next week |\n\n### Principles\n\n1. People first, results through people\n2. Clarity over comfort\n3. Measure quality before shipping AI\n4. Small batches, fast feedback\n5. Bad news early\n6. Blameless learning\n7. Protect focus\n8. Grow your successors"}, {"id": 200, "title": "Final checklist, glossary and roadmap", "tldr": "Use the checklists to run your team well, the glossary for shared language, and the roadmap to keep improving. Great AI team leadership combines care for people, clear direction, disciplined engineering and honest communication.", "real": "Recommended reading: “High Output Management” (Grove), “The Manager’s Path” (Fournier), “An Elegant Puzzle” and “Staff Engineer” (Larson), “Team Topologies” (Skelton and Pais), “Radical Candor” (Scott), “Accelerate” (Forsgren, Humble and Kim) and Google’s SRE book.", "body": "### Weekly lead checklist\n\n- [ ] Every team member had a meaningful conversation with me\n- [ ] Priorities are clear and visible\n- [ ] Blockers removed\n- [ ] Eval results and quality trends reviewed\n- [ ] Risks updated and shared\n- [ ] Stakeholders updated\n- [ ] Recognition given\n- [ ] Focus time protected\n\n### Glossary\n\n| Term | Meaning |\n|---|---|\n| 1:1 | Regular individual meeting |\n| WIP | Work in progress |\n| Time-box | Fixed time for uncertain work |\n| PERT | Three-point estimation |\n| Definition of done | Shared completion criteria |\n| Eval gate | Quality threshold before release |\n| ADR | Architecture decision record |\n| SLO / error budget | Reliability target / allowed unreliability |\n| DORA metrics | Delivery performance metrics |\n| Bus factor | People who can leave before work stalls |\n| Psychological safety | Safe to take interpersonal risks |\n| RACI | Responsible, accountable, consulted, informed |\n\n### Mastery roadmap\n\n1. Run excellent 1:1s with every team member for a quarter\n2. Introduce eval gates and a definition of done\n3. Plan a project with ranges, time-boxes and checkpoints\n4. Delegate ownership of every major area\n5. Run a blameless postmortem\n6. Develop one team member into a lead role\n7. Write and share your leadership playbook"}];
const PARTS = ["Becoming an AI team lead", "Understanding your team", "Communicating with the team", "Managing a team of 5+", "Distributing work", "Planning and estimation in the AI era", "Agile delivery for AI teams", "Engineering excellence", "AI-assisted development", "The ML and LLM project lifecycle", "MLOps and LLMOps leadership", "Collaboration across functions", "Coaching and growth", "Performance and difficult situations", "Hiring and team composition", "Decisions and technical leadership", "Delivery and stakeholder management", "Responsible AI and quality ownership", "Culture, collaboration and wellbeing", "Capstones and mastery"];
const TOTAL = 200, PER = 10;
function idsOf(p){ const a = []; for (let i = (p-1)*PER + 1; i <= p*PER; i++) a.push(i); return a; }
const partOf = id => Math.ceil(id / PER);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "ailead-book-progress-v1";
const LS_LAST = "ailead-book-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try{ await dbRef.set({done:[...done].sort((a,b)=>a-b), updated:Date.now()}); }
  catch(e){ if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; pushRemote(); }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...done])); }catch(e){} }
function toggle(id){
  if (done.has(id)) done.delete(id); else done.add(id);
  saveLocal(); pushRemote(); renderAll();
  toast(done.has(id) ? "Chapter " + id + " marked complete" : "Chapter " + id + " marked not complete");
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(s){
  if (window.marked && marked.parse){
    const html = marked.parse(s, {gfm:true, headerIds:false, mangle:false});
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  }
  return "<pre>" + esc(s) + "</pre>";
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function currentId(){
  const m = location.hash.match(/^#ch-(\d{1,3})$/);
  const n = m ? +m[1] : 0;
  return n >= 1 && n <= TOTAL ? n : 0;
}

/* ---------- header memory bank ---------- */
function renderBank(){
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    html += '<div class="bank-group" title="Part ' + p + ': ' + esc(PARTS[p-1]) + '">';
    for (const i of idsOf(p)){
      html += '<button class="cell' + (done.has(i) ? " done" : "") + (i === cur ? " here" : "") +
        '" data-go="' + i + '" aria-label="Chapter ' + i + (done.has(i) ? ", complete" : "") + '"></button>';
    }
    html += "</div>";
  }
  document.getElementById("bank").innerHTML = html;
  document.getElementById("doneCount").textContent = done.size;
  document.getElementById("pct").textContent = Math.round(done.size * 100 / TOTAL) + "%";
}

/* ---------- sidebar ---------- */
const openParts = new Set();
function renderSide(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const matches = ids.filter(i => !q || byId[i].title.toLowerCase().includes(q) || byId[i].tldr.toLowerCase().includes(q) || String(i) === q);
    if (q && !matches.length) continue;
    const count = ids.filter(i => done.has(i)).length;
    const open = q || openParts.has(p) || partOf(cur) === p;
    html += '<div class="part' + (open ? " open" : "") + '">' +
      '<button class="part-head" data-part="' + p + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="part-num">' + String(p).padStart(2, "0") + '</span>' +
      '<span class="part-name">' + esc(PARTS[p-1]) + '</span>' +
      '<span class="part-count' + (count === PER ? " full" : "") + '">' + count + '/' + PER + '</span></button><ul class="part-list">';
    for (const i of matches){
      html += '<li class="ch-row' + (i === cur ? " active" : "") + '">' +
        '<button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="' + (done.has(i) ? "Mark chapter " + i + " not complete" : "Mark chapter " + i + " complete") + '">' + TICK + '</button>' +
        '<a href="#ch-' + i + '"><span class="n">' + i + '.</span>' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ul></div>";
  }
  if (!html) html = '<p style="color:var(--muted);font-size:14px;padding:8px">No chapters match that search. Try a shorter word like “estimate” or “feedback”.</p>';
  document.getElementById("parts").innerHTML = html;
}

/* ---------- diagrams and charts ---------- */
let mermaidPromise = null, renderSeq = 0;
const svgCache = new Map();
function isDark(){
  const a = document.documentElement.getAttribute("data-theme");
  if (a) return a === "dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function ensureMermaid(){
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (mermaidPromise) return mermaidPromise;
  mermaidPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js";
    s.onload = () => {
      try{
        window.mermaid.initialize({ startOnLoad:false, securityLevel:"strict", theme: isDark() ? "dark" : "neutral",
          fontFamily:"IBM Plex Sans, system-ui, sans-serif", flowchart:{ curve:"basis", htmlLabels:true } });
        resolve(window.mermaid);
      }catch(e){ reject(e); }
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return mermaidPromise;
}
function fitSvg(div){
  const svg = div.querySelector("svg");
  if (!svg) return;
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Diagram");
  const vb = (svg.getAttribute("viewBox") || "").split(/\s+/).map(Number);
  const vbw = vb[2] || 0;
  if (vbw && div.clientWidth && div.clientWidth < vbw * 0.7){
    svg.style.maxWidth = "none";
    svg.style.width = Math.round(vbw * 0.85) + "px";
  }
}
function fmtNum(v){ return Number(v).toLocaleString("en-US", { maximumFractionDigits: 3 }); }
function renderChart(el, spec){
  const max = Math.max(...spec.data.map(d => d[1]));
  const unit = spec.unit || "";
  const sep = (unit === "%" || unit === "×") ? "" : " ";
  let rows = "";
  for (const [label, v] of spec.data){
    let w = spec.log ? (Math.log10(v + 1) / Math.log10(max + 1)) * 100 : (v / max) * 100;
    w = Math.max(w, 1.5);
    rows += '<div class="bar-row"><span class="bar-label">' + esc(String(label)) + '</span><span class="bar-track"><span class="bar" style="width:' + w.toFixed(1) + '%"></span></span><span class="bar-val">' + fmtNum(v) + sep + esc(unit) + '</span></div>';
  }
  const fig = document.createElement("figure");
  fig.className = "chart";
  fig.innerHTML = '<figcaption>' + esc(spec.title || "") + '</figcaption>' + rows + (spec.log ? '<div class="chart-note">Bar lengths use a logarithmic scale.</div>' : "");
  el.replaceWith(fig);
}
function enhance(root){
  root.querySelectorAll("code.language-chart").forEach(code => {
    const pre = code.closest("pre") || code;
    try{ renderChart(pre, JSON.parse(code.textContent)); }catch(e){}
  });
  const blocks = [...root.querySelectorAll("code.language-mermaid")];
  if (!blocks.length) return;
  const seq = ++renderSeq;
  const holders = blocks.map(code => {
    const pre = code.closest("pre") || code;
    const div = document.createElement("div");
    div.className = "diagram loading";
    div.textContent = "Loading diagram…";
    div.dataset.src = code.textContent;
    pre.replaceWith(div);
    if (svgCache.has(div.dataset.src)){ div.classList.remove("loading"); div.innerHTML = svgCache.get(div.dataset.src); div.dataset.done = "1"; fitSvg(div); }
    return div;
  }).filter(div => !div.dataset.done);
  if (!holders.length) return;
  ensureMermaid().then(async m => {
    for (let k = 0; k < holders.length; k++){
      const div = holders[k];
      if (seq !== renderSeq || !div.isConnected) return;
      const id = "mmd-" + seq + "-" + k;
      try{
        const out = await m.render(id, div.dataset.src);
        if (!div.isConnected) return;
        div.classList.remove("loading");
        div.innerHTML = out.svg;
        svgCache.set(div.dataset.src, out.svg);
        fitSvg(div);
      }catch(e){
        const junk = document.getElementById("d" + id); if (junk) junk.remove();
        div.classList.remove("loading");
        div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>";
      }
    }
  }).catch(() => {
    holders.forEach(div => { div.classList.remove("loading"); div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>"; });
  });
}

/* ---------- chapter view ---------- */
function renderChapter(id){
  const c = byId[id];
  const p = partOf(id);
  const ids = idsOf(p);
  const isDone = done.has(id);
  const tabs = ids.map(i =>
    '<button class="tab' + (i === id ? " active" : "") + '" role="tab" aria-selected="' + (i === id) + '" data-go="' + i + '">' +
    '<span class="dot' + (done.has(i) ? " on" : "") + '"></span><span class="tab-t">' + i + '. ' + esc(byId[i].title) + '</span></button>'
  ).join("");
  document.getElementById("main").innerHTML =
    '<p class="crumb">Part ' + p + ' of 20: ' + esc(PARTS[p-1]) + '</p>' +
    '<div class="tabs" role="tablist" aria-label="Chapters in this part">' + tabs + '</div>' +
    '<article>' +
      '<p class="ch-no">Chapter ' + id + ' of ' + TOTAL + '</p>' +
      '<h1 class="ch-title">' + esc(c.title) + '</h1>' +
      '<section class="box tldr"><h2>TL;DR</h2><p>' + inlineMd(c.tldr) + '</p></section>' +
      '<div class="body">' + md(c.body) + '</div>' +
      '<section class="box real"><h2>Real-world example</h2><p>' + inlineMd(c.real) + '</p></section>' +
      '<div class="done-bar">' +
        '<button class="complete' + (isDone ? " on" : "") + '" data-toggle="' + id + '" aria-pressed="' + isDone + '">' +
          '<span class="tick' + (isDone ? " on" : "") + '">' + TICK + '</span>' + (isDone ? "Completed" : "Mark as complete") + '</button>' +
        '<div class="nav">' +
          '<button class="btn" data-go="' + (id - 1) + '"' + (id === 1 ? " disabled" : "") + '>Previous</button>' +
          '<button class="btn" data-go="' + (id + 1) + '"' + (id === TOTAL ? " disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  enhance(document.getElementById("main"));
}

/* ---------- contents view ---------- */
function renderContents(){
  let html = '<div class="contents"><h1>Contents</h1>' +
    '<p class="lead">Twenty parts, ten chapters each: leading and communicating with people, managing a team of five or more, distributing work, estimating in the AI era, building AI systems well, collaborating across functions, and growing your team. Tick a chapter when you finish it; your progress is saved for next time. Research and company examples come from public books, studies and reports; tools and rules change quickly, so check current sources before relying on a specific detail.</p>' +
    '<div class="contents-actions"><button class="btn" data-go="' + firstUnread() + '">' + (done.size ? "Continue with chapter " + firstUnread() : "Start chapter 1") + '</button>' +
    '<button class="btn" id="resetBtn">Reset progress</button></div><div class="grid">';
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const count = ids.filter(i => done.has(i)).length;
    html += '<section class="pcard"><h2>Part ' + p + ': ' + esc(PARTS[p-1]) + '</h2><div class="meta">' + count + ' of ' + PER + ' complete</div><ol>';
    for (const i of ids){
      html += '<li><button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="Toggle chapter ' + i + '">' + TICK + '</button><a href="#ch-' + i + '">' + i + '. ' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ol></section>";
  }
  document.getElementById("main").innerHTML = html + "</div></div>";
}
function firstUnread(){ for (let i = 1; i <= TOTAL; i++) if (!done.has(i)) return i; return TOTAL; }

/* ---------- routing ---------- */
let lastRendered = null;
function renderAll(){
  const id = currentId();
  renderBank(); renderSide();
  const y = window.scrollY;
  if (id) renderChapter(id); else renderContents();
  if (lastRendered === location.hash) window.scrollTo(0, y);
  lastRendered = location.hash;
}
function route(){
  const id = currentId();
  if (!id && location.hash !== "#contents"){
    let last = 0; try{ last = +localStorage.getItem(LS_LAST) || 0; }catch(e){}
    location.replace("#ch-" + (last >= 1 && last <= TOTAL ? last : 1));
    return;
  }
  if (id){ try{ localStorage.setItem(LS_LAST, id); }catch(e){} }
  document.body.classList.remove("drawer");
  renderAll();
  window.scrollTo(0, 0);
  const active = document.querySelector(".ch-row.active");
  if (active) active.scrollIntoView({block:"nearest"});
  const tab = document.querySelector(".tab.active");
  if (tab && tab.parentElement){ const r = tab.parentElement; const left = tab.offsetLeft - r.offsetLeft; if (left < r.scrollLeft || left + tab.offsetWidth > r.scrollLeft + r.clientWidth) r.scrollLeft = left - 16; }
}
function go(id){ if (id >= 1 && id <= TOTAL) location.hash = "#ch-" + id; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){ e.preventDefault(); toggle(+t.dataset.toggle); return; }
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled){ go(+g.dataset.go); return; }
  const ph = e.target.closest("[data-part]");
  if (ph){
    const p = +ph.dataset.part;
    const el = ph.parentElement;
    const isOpen = el.classList.toggle("open");
    if (isOpen) openParts.add(p); else openParts.delete(p);
    ph.setAttribute("aria-expanded", isOpen);
    return;
  }
  if (e.target.id === "resetBtn"){
    if (confirm("Clear all 200 ticks? This can’t be undone.")){ done.clear(); saveLocal(); pushRemote(); renderAll(); toast("Progress reset"); }
  }
});
document.getElementById("search").addEventListener("input", renderSide);
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.add("drawer"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = currentId(); if (!id) return;
  if (e.key === "ArrowRight") go(id + 1);
  else if (e.key === "ArrowLeft") go(id - 1);
});
function setTopH(){ document.documentElement.style.setProperty("--top-h", document.getElementById("top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);
window.addEventListener("hashchange", route);
setTopH();
route();
initSync();
</script>
<script src="book-bg.js?v=2"></script>
</body>

<style>
:root{
  --bg:#F3F3EE; --surface:#FFFFFF; --surface-2:#F8F8F4; --ink:#1A1A15; --muted:#5C5D52; --line:#DCDCD1;
  --accent:#5B6B12; --accent-soft:#EEF1DC; --accent-ink:#FFFFFF;
  --amber:#B97A0B; --tldr-bg:#FFF5DC; --tldr-line:#D49A22;
  --indigo:#1F5E5A; --real-bg:#E3F1EF; --real-line:#2F7C76;
  --code-bg:#181A16; --code-ink:#E6E9E1; --inline-code:#E9ECE4;
  --cell-empty:#DCE0D6; --shadow:0 1px 0 rgba(24,26,22,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
    --accent:#C5D66A; --accent-soft:#2A3012; --accent-ink:#1D2208;
    --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
    --indigo:#8FD3CB; --real-bg:#10262A; --real-line:#4FA79E;
    --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
    --cell-empty:#2E332B; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
  --accent:#C5D66A; --accent-soft:#2A3012; --accent-ink:#1D2208;
  --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
  --indigo:#8FD3CB; --real-bg:#10262A; --real-line:#4FA79E;
  --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
  --cell-empty:#2E332B; --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header with the memory-bank progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:20px;padding:12px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted)}
.bank{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bank-row{display:flex;gap:4px;flex-wrap:nowrap;min-width:0}
.bank-group{flex:1;min-width:0;display:flex;gap:2px;padding:3px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.cell{flex:1;min-width:2px;max-width:10px;height:18px;border-radius:2px;background:var(--cell-empty);border:0;padding:0;cursor:pointer;transition:background .2s}
.cell.done{background:var(--accent)}
.cell.here{box-shadow:0 0 0 2px var(--amber)}
.bank-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bank-meta strong{color:var(--ink);font-weight:600}
.top-actions{display:flex;gap:8px}
.btn{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.menu-btn{display:none}

/* Shell */
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,76px));height:calc(100dvh - var(--top-h,76px) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg)}
.search{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
.part{margin-bottom:4px}
.part-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:8px;cursor:pointer}
.part-head:hover{background:var(--surface-2)}
.part-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);width:22px;flex:none}
.part-name{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.part-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.part-count.full{color:var(--accent);font-weight:600}
.part-list{list-style:none;margin:0 0 6px;padding:0 0 0 30px;display:none}
.part.open .part-list{display:block}
.ch-row{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:6px}
.ch-row.active{background:var(--accent-soft)}
.ch-row a{flex:1;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.ch-row a .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.tick{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:11px;height:11px;opacity:0}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{opacity:1;color:var(--accent-ink)}
.hidden{display:none!important}

/* Main reading area */
.main{padding:24px 32px 80px;min-width:0}
.crumb{font-size:14px;color:var(--muted);margin:0 0 12px}
.crumb a{color:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;font-size:14px;color:var(--muted);max-width:240px;text-align:left}
.tab .tab-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--cell-empty)}
.tab .dot.on{background:var(--accent)}
article{max-width:780px}
.ch-no{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--accent);font-size:15px;margin:0}
h1.ch-title{font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:6px 0 22px;font-weight:700;text-wrap:balance}
.box{border-radius:10px;padding:16px 18px;margin:0 0 26px;border-left:4px solid}
.box h2{font-size:14px;margin:0 0 6px;font-weight:600}
.box p{margin:0}
.tldr{background:var(--tldr-bg);border-color:var(--tldr-line)}
.tldr h2{color:var(--amber)}
.tldr p{font-size:17px;line-height:1.55}
.real{background:var(--real-bg);border-color:var(--real-line);margin-top:34px}
.real h2{color:var(--indigo)}
.body h3{font-size:20px;margin:30px 0 10px;letter-spacing:-.01em}
.body p{margin:0 0 14px}
.body ul,.body ol{padding-left:22px;margin:0 0 16px}
.body li{margin:4px 0}
.body li input[type=checkbox]{margin-right:6px;accent-color:var(--accent)}
.body code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.88em;background:var(--inline-code);padding:1px 5px;border-radius:4px}
.body pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13.5px;line-height:1.55;margin:0 0 18px}
.body pre code{background:none;padding:0;font-size:inherit;color:inherit}
.table-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.body table{border-collapse:collapse;width:100%;font-size:14px}
.body th,.body td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.body th{background:var(--surface-2);font-weight:600}
.body tr:last-child td{border-bottom:0}
.body strong{font-weight:600}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.complete{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:15px}
.complete .tick{border-color:currentColor;pointer-events:none}
.complete.on{background:var(--accent);color:var(--accent-ink)}
.complete.on .tick{background:var(--accent-ink);border-color:var(--accent-ink)}
.complete.on .tick svg{opacity:1;color:var(--accent)}
.nav{display:flex;gap:8px}
.nav .btn[disabled]{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}

/* Diagrams and charts */
.diagram{margin:0 0 20px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
.diagram svg{display:block;margin:0 auto;height:auto}
.diagram.loading{color:var(--muted);font-size:14px}
.chart{margin:0 0 20px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chart figcaption{font-weight:600;font-size:14px;margin:0 0 10px}
.bar-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.bar-label{color:var(--ink);line-height:1.3}
.bar-track{height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar{display:block;height:100%;background:var(--accent);border-radius:7px 0 0 7px}
.bar-val{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.chart-note{font-size:12px;color:var(--muted);margin-top:6px}

/* Contents view */
.contents h1{font-size:32px;margin:0 0 6px;letter-spacing:-.02em}
.contents .lead{color:var(--muted);margin:0 0 24px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.pcard h2{font-size:15px;margin:0 0 2px;line-height:1.3}
.pcard .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pcard ol{list-style:none;padding:0;margin:0}
.pcard li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13.5px;line-height:1.35}
.pcard li a{color:var(--ink);text-decoration:none;flex:1}
.pcard li a:hover{text-decoration:underline}
.contents-actions{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}

/* Mobile */
.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);height:auto;z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .menu-btn{display:inline-block}
  .main{padding:18px 16px 60px}
  .top-inner{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand{flex:1}
  .bank{order:3;flex-basis:100%}
  .bank-row{gap:3px}
  .bank-group{gap:1px;padding:2px}
  .cell{height:12px;max-width:none;min-width:0}
  .bank-row{flex-wrap:wrap;row-gap:3px;gap:3px}
  .bank-group{flex:0 0 calc(10% - 2.7px);gap:1px;padding:1px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const CHAPTERS = [{"id": 1, "title": "What an AI team lead does", "tldr": "An AI team lead is responsible for the team’s results, the quality of what it builds, and the growth and wellbeing of its people. You succeed through the team: setting direction, distributing work, removing obstacles, keeping standards high and communicating with stakeholders.", "real": "Google’s Project Oxygen research (started in 2008) analyzed manager performance data and found that managers matter significantly for team performance and retention; “is a good coach” ranked first among the behaviors of its best managers.", "body": "### Core responsibilities\n\n| Area | What you do |\n|---|---|\n| Direction | Clarify goals, priorities and what “done” means |\n| Delivery | Plan, distribute work, track progress, unblock |\n| Quality | Set engineering and evaluation standards |\n| People | Coach, give feedback, support growth and wellbeing |\n| Communication | Represent the team to stakeholders and vice versa |\n| Technical judgment | Guide architecture, model and tooling decisions |\n\n### Your output\n\n```mermaid\nflowchart LR\n  YOU[Your leadership] --> TEAM[Team capability and focus]\n  TEAM --> WORK[Quality work delivered]\n  WORK --> IMPACT[Business and user impact]\n```\n\nAndy Grove’s rule from “High Output Management” (1983): a manager’s output is the output of their team plus the teams they influence."}, {"id": 2, "title": "From individual contributor to lead", "tldr": "The skills that made you a strong engineer or scientist are necessary but not sufficient. As a lead, your job shifts from doing the work to multiplying others. Expect discomfort, protect some technical time, and measure yourself by team outcomes.", "real": "The “Peter principle” (Laurence Peter, 1969) describes people being promoted until they reach a role they are not suited for; many organizations now offer parallel technical and management career ladders partly to avoid forcing strong engineers into management.", "body": "### What changes\n\n| As an IC | As a lead |\n|---|---|\n| You solve problems | You make sure problems get solved |\n| Measured by your output | Measured by team output |\n| Deep focus time | Frequent context switching |\n| Fast feedback (code runs) | Slow feedback (people grow) |\n| Technical decisions | Technical + people + priority decisions |\n\n### Common traps\n\n| Trap | Better approach |\n|---|---|\n| Taking the hardest tasks yourself | Delegate and coach |\n| Rewriting others’ code | Review and explain |\n| Avoiding people issues | Address them early |\n| Saying yes to everything | Prioritize for the team |\n\n### Rule\n\nKeep roughly 20–40% of your time for hands-on technical work if your role is a tech lead; less as the team grows."}, {"id": 3, "title": "Tech lead, engineering manager or both", "tldr": "Roles differ by company: a tech lead owns technical direction; an engineering manager owns people and delivery; a tech lead manager (TLM) does both for a small team. Clarify your expectations with your manager in writing.", "real": "Camille Fournier’s “The Manager’s Path” (2017) describes the tech lead and engineering manager as distinct roles, and Google has used the tech lead manager (TLM) role for small teams where one person carries both responsibilities.", "body": "### Role comparison\n\n| Responsibility | Tech lead | Engineering manager | TLM |\n|---|---|---|---|\n| Architecture and technical decisions | Owner | Supports | Owner |\n| Code reviews and standards | Owner | Supports | Owner |\n| Hiring and performance reviews | Contributes | Owner | Owner |\n| Career growth and 1:1s | Contributes | Owner | Owner |\n| Delivery and planning | Shares | Owner | Owner |\n| Stakeholder communication | Technical | Overall | Both |\n\n### Clarify with your manager\n\n- Which decisions are mine?\n- Do I write performance reviews?\n- How much hands-on work is expected?\n- How will my success be measured?"}, {"id": 4, "title": "What makes AI teams different", "tldr": "AI teams mix research uncertainty with engineering delivery. Work depends on data, results are probabilistic, quality needs evaluation rather than simple tests, costs vary with usage, and models change underneath you. Leadership must handle all of this.", "real": "Google’s paper “Hidden Technical Debt in Machine Learning Systems” (2015) showed that ML code is a small part of production ML systems, with data, configuration, monitoring and infrastructure making up most of the work and risk.", "body": "### Differences from classic software teams\n\n| Classic software | AI teams |\n|---|---|\n| Predictable tasks | Experiments that may fail |\n| Unit tests define correctness | Evals define quality |\n| Code is the main artifact | Data, prompts, models and code |\n| Cost mostly fixed | Inference and GPU costs vary |\n| Stable dependencies | Models and APIs change often |\n| Mostly engineers | Engineers, scientists, data and domain experts |\n\n### Leadership implications\n\n- Plan with time boxes and decision points\n- Define quality bars and eval ownership\n- Treat data work as first-class work\n- Watch costs as a team metric\n- Expect re-planning when experiments fail"}, {"id": 5, "title": "Your first 90 days", "tldr": "In your first 90 days, learn before changing: meet each person, understand the system and stakeholders, identify quick wins and real problems, then set a few clear priorities. Early trust matters more than early changes.", "real": "Michael Watkins’s “The First 90 Days” (2003) became a standard guide for leadership transitions, recommending that new leaders accelerate learning, secure early wins and build alliances before making large changes.", "body": "### Plan\n\n| Period | Focus | Outputs |\n|---|---|---|\n| Days 1–30 | Listen and learn | 1:1s with everyone, system map, stakeholder map |\n| Days 31–60 | Diagnose and quick wins | Top 3 problems, 1–2 visible fixes |\n| Days 61–90 | Set direction | Team priorities, working agreements, roadmap |\n\n### First 1:1 questions\n\n- What’s going well that we must keep?\n- What frustrates you most?\n- What would you change if you were me?\n- How do you like to receive feedback?\n- What are your career goals?\n\n### Avoid\n\nBig process changes in week one, criticizing past decisions publicly, and promising things before you understand constraints."}, {"id": 6, "title": "Leadership styles and situational leadership", "tldr": "No single leadership style fits every person or situation. Adjust between directing, coaching, supporting and delegating based on each person’s skill and confidence for a specific task.", "real": "Paul Hersey and Ken Blanchard’s Situational Leadership model, developed in the late 1960s and 1970s, matches leadership style to a follower’s competence and commitment for a given task, and is widely taught in management training.", "body": "### Situational leadership\n\n| Person’s state for this task | Your style |\n|---|---|\n| New, enthusiastic, low skill | Directing: clear instructions, close check-ins |\n| Some skill, low confidence | Coaching: explain why, encourage |\n| Skilled, variable confidence | Supporting: listen, help them decide |\n| Skilled and confident | Delegating: give ownership |\n\n### Example\n\nA strong backend engineer new to LLM evaluation needs directing on evals but delegating on API design.\n\n### Rule\n\nStyle is per task, not per person. Re-assess as people grow."}, {"id": 7, "title": "Responsibilities map and where your time goes", "tldr": "Map your responsibilities and audit your calendar. Leads drift into meetings and firefighting; deliberately allocate time to people, planning, technical guidance and stakeholder work, and cut low-value activities.", "real": "Paul Graham’s essay “Maker’s Schedule, Manager’s Schedule” (2009) explained why meetings fragment the long focus blocks makers need; leads must protect focus for both their team and their own technical work.", "body": "### Suggested time allocation (guideline)\n\n```chart\n{\"title\": \"AI team lead time allocation (guideline, team of 6)\", \"unit\": \"%\", \"data\": [[\"People: 1:1s, coaching, feedback\", 25], [\"Technical guidance and reviews\", 25], [\"Planning and prioritization\", 15], [\"Stakeholders and communication\", 15], [\"Hands-on work\", 15], [\"Admin\", 5]]}\n```\n\n### Weekly calendar audit\n\n| Question | Action |\n|---|---|\n| Which meetings could be async? | Replace with written updates |\n| Where am I a bottleneck? | Delegate decisions |\n| Did I talk to every team member? | Schedule 1:1s |\n| Did I protect focus time? | Block calendar |"}, {"id": 8, "title": "Authority, accountability and trust", "tldr": "Leads have some formal authority but mostly lead through trust and credibility. Be accountable for team outcomes publicly, give credit to the team, take responsibility for failures, and earn authority through fairness and competence.", "real": "Netflix’s culture memo (first published in 2009) promoted “context, not control”, the idea that leaders should give people the context to make good decisions rather than controlling them through approvals, a principle many technology teams adopted.", "body": "### Sources of influence\n\n| Source | Example |\n|---|---|\n| Formal role | Assigning work, reviews |\n| Expertise | Sound technical judgment |\n| Trust | Consistency, honesty, fairness |\n| Context | You share the “why” |\n| Care | People know you support them |\n\n### Accountability rules\n\n| Situation | Lead behavior |\n|---|---|\n| Team success | Credit the team publicly by name |\n| Team failure | “I own this; here’s what we’ll change” |\n| Individual mistake | Discuss privately; fix the system |"}, {"id": 9, "title": "Managing your own energy and time", "tldr": "Leading is emotionally demanding. Manage your energy: plan your week, batch similar work, protect focus time, set boundaries, and get support from peers and your manager. A tired, reactive lead creates a reactive team.", "real": "The World Health Organization added burnout to its International Classification of Diseases (ICD-11) in 2019 as an occupational phenomenon resulting from chronic workplace stress that has not been successfully managed.", "body": "### Weekly planning routine\n\n| When | Action |\n|---|---|\n| Monday morning | Top 3 outcomes for the week |\n| Daily | 2-hour focus block |\n| Friday | Review: what moved, what’s stuck, what to delegate |\n\n### Eisenhower matrix\n\n| | Urgent | Not urgent |\n|---|---|---|\n| Important | Do now (incidents, blocked people) | Schedule (strategy, coaching) |\n| Not important | Delegate | Drop |\n\n### Support network\n\nPeer leads, your manager, a mentor outside the company, and leadership communities."}, {"id": 10, "title": "Growing yourself as a leader", "tldr": "Leadership is a skill learned through practice, feedback and reflection. Ask your team and manager for feedback, read, find mentors, reflect weekly, and treat each hard situation as learning.", "real": "Kim Scott’s “Radical Candor” (2017) emphasized that leaders should actively ask for criticism first, before giving it, to build a culture where feedback flows in both directions.", "body": "### Growth loop\n\n```mermaid\nflowchart LR\n  ACT[Lead] --> FEEDBACK[Ask for feedback]\n  FEEDBACK --> REFLECT[Reflect weekly]\n  REFLECT --> LEARN[Learn: books, mentors, peers]\n  LEARN --> ACT\n```\n\n### Questions to ask your team\n\n- “What’s one thing I could do to be more helpful to you?”\n- “What should I stop doing?”\n- “Was my last decision clear?”\n\n### Recommended reading\n\n“High Output Management” (Grove), “The Manager’s Path” (Fournier), “An Elegant Puzzle” (Larson), “Radical Candor” (Scott), “Team Topologies” (Skelton and Pais)."}, {"id": 11, "title": "Roles in an AI team", "tldr": "AI teams combine several roles: ML engineers, AI/LLM application engineers, data engineers, data scientists, research scientists, MLOps or platform engineers, software engineers, and often a PM and designer. Know what each contributes and where they overlap.", "real": "Job titles such as “AI engineer” became common after 2023 to describe engineers who build products on top of foundation models, distinct from ML engineers who train and serve models, reflecting how AI team roles keep evolving.", "body": "### Roles and contributions\n\n| Role | Main contribution |\n|---|---|\n| ML engineer | Training, fine-tuning, serving models |\n| AI / LLM engineer | Prompts, RAG, agents, LLM integrations |\n| Data engineer | Pipelines, data quality, storage |\n| Data scientist | Analysis, experiments, metrics |\n| Research scientist | New methods, deep model work |\n| MLOps / platform engineer | Infrastructure, deployment, monitoring |\n| Software engineer | Product code, APIs, frontend |\n| PM / designer | Problem, priorities, user experience |\n\n### Typical small AI team (6 people)\n\n```mermaid\nflowchart TB\n  LEAD[Team lead] --> AIE1[AI engineer]\n  LEAD --> AIE2[AI engineer]\n  LEAD --> MLE[ML engineer]\n  LEAD --> DE[Data engineer]\n  LEAD --> SWE[Software engineer]\n  LEAD --> MLOPS[MLOps engineer]\n```"}, {"id": 12, "title": "Skills mapping", "tldr": "Map each person’s skills and interests across the areas your team needs. The map shows coverage gaps, single points of failure, growth opportunities and how to assign work wisely.", "real": "Many engineering teams use skills matrices to identify “bus factor” risks, areas where only one person knows a critical system, and plan cross-training before that person goes on leave or leaves.", "body": "### Skills matrix (example, 0–3)\n\n| Skill | Asha | Ben | Chen | Divya | Eli | Farah |\n|---|---|---|---|---|---|---|\n| LLM apps / prompts | 3 | 2 | 1 | 1 | 0 | 2 |\n| RAG / retrieval | 2 | 3 | 1 | 0 | 0 | 1 |\n| Evals | 2 | 1 | 2 | 0 | 0 | 1 |\n| Model fine-tuning | 0 | 1 | 3 | 0 | 0 | 0 |\n| Data pipelines | 1 | 0 | 1 | 3 | 1 | 0 |\n| Infra / MLOps | 0 | 1 | 1 | 1 | 3 | 0 |\n| Backend / APIs | 2 | 2 | 0 | 1 | 2 | 3 |\n\n### Reading the map\n\n| Finding | Action |\n|---|---|\n| Fine-tuning: only Chen | Pair Ben with Chen |\n| Evals weak overall | Training + shared ownership |\n| Infra: only Eli | Document + rotate tasks |"}, {"id": 13, "title": "Understanding motivation", "tldr": "People are motivated by different things: mastery, autonomy, purpose, recognition, stability, impact or career growth. Learn what drives each person and connect their work to it.", "real": "Daniel Pink’s “Drive” (2009) summarized research showing that for complex, creative work, autonomy, mastery and purpose tend to motivate more than simple financial rewards.", "body": "### Motivation map\n\n| Person | Main motivators | How to apply |\n|---|---|---|\n| Asha | Mastery, impact | Hard LLM problems, visible outcomes |\n| Ben | Autonomy | Own the retrieval system end to end |\n| Chen | Research, learning | Time for experiments, paper discussions |\n| Divya | Stability, clarity | Clear specs, predictable planning |\n| Eli | Recognition | Credit in demos and updates |\n\n### Questions to discover motivation\n\n- “What was the most satisfying project you’ve worked on? Why?”\n- “What kind of work drains you?”\n- “Where do you want to be in two years?”"}, {"id": 14, "title": "Working styles and communication preferences", "tldr": "People differ in how they think, communicate and work: written vs verbal, fast vs reflective, big-picture vs detail. Learn each person’s preferences and agree on team norms that work for everyone.", "real": "Many teams create “user manuals” or “README for me” documents in which each person describes how they like to work and communicate, a practice popularized in technology companies to speed up collaboration.", "body": "### Personal README template\n\n| Section | Example |\n|---|---|\n| Best way to reach me | Slack for quick, doc comments for detail |\n| Focus hours | 9–12, prefer no meetings |\n| How I like feedback | Direct, in private, with examples |\n| I’m energized by | Hard technical problems |\n| I struggle with | Vague requirements |\n| Things people misunderstand | I’m quiet in meetings but thinking |\n\n### Lead behaviors\n\n- Give reflective thinkers material before meetings\n- Invite quieter people to speak\n- Write decisions down for those who prefer text"}, {"id": 15, "title": "Psychological safety", "tldr": "Psychological safety means people can take interpersonal risks, such as asking questions, admitting mistakes or disagreeing, without fear. It is the foundation of high-performing teams, especially in uncertain AI work where many experiments fail.", "real": "Google’s Project Aristotle (2012–2015) studied 180 teams and found psychological safety was the most important factor in team effectiveness, followed by dependability, structure and clarity, meaning, and impact. Amy Edmondson’s research introduced the team-level concept in 1999.", "body": "### Google’s five team dynamics\n\n```mermaid\nflowchart TB\n  PS[Psychological safety] --> D[Dependability]\n  PS --> SC[Structure and clarity]\n  PS --> M[Meaning]\n  PS --> I[Impact]\n```\n\n### How leads build safety\n\n| Behavior | Example |\n|---|---|\n| Admit your own mistakes | “I misjudged that estimate.” |\n| Ask for input | “What am I missing?” |\n| Respond well to bad news | Thank, then solve |\n| Celebrate learning from failed experiments | Share results in demos |\n| Stop blame | Focus on systems |\n\n### Warning signs\n\nSilence in meetings, surprises late in projects, and hidden mistakes."}, {"id": 16, "title": "Team charter and working agreements", "tldr": "A team charter states the team’s mission, scope, goals and ways of working. Working agreements cover communication, meetings, code review, availability and decision-making. Create them together and revisit regularly.", "real": "Agile teams commonly write explicit working agreements during team formation, and Atlassian’s Team Playbook includes a “roles and responsibilities” and “working agreements” exercise used by many teams.", "body": "### Charter\n\n| Section | Example |\n|---|---|\n| Mission | Build reliable AI assistants for customer support |\n| Scope | Assistant backend, RAG, evals; not the chat UI |\n| Customers | Support team, end customers |\n| Goals | Resolution rate, quality, cost per conversation |\n| Metrics | Eval pass rate, latency, incidents |\n\n### Working agreements (example)\n\n| Area | Agreement |\n|---|---|\n| Code review | Reviewed within 1 working day |\n| Meetings | No meetings Wednesday afternoon |\n| Communication | Decisions recorded in team channel |\n| Availability | Core hours 11:00–15:00 |\n| Evals | No prompt/model change merges without eval run |\n| Disagreement | Discuss openly, decide, commit |"}, {"id": 17, "title": "Team stages", "tldr": "Teams move through forming, storming, norming and performing. Each stage needs different leadership: clarity at forming, conflict resolution at storming, reinforcement at norming, and delegation at performing. Changes in membership restart the cycle.", "real": "Bruce Tuckman proposed the forming–storming–norming–performing model in 1965, and later added a fifth stage, adjourning, in 1977 with Mary Ann Jensen.", "body": "### Stages and leadership\n\n| Stage | Team signs | Lead focus |\n|---|---|---|\n| Forming | Polite, unclear roles | Clear goals, roles, working agreements |\n| Storming | Conflicts, frustration | Facilitate disagreements, reinforce norms |\n| Norming | Agreements, cooperation | Reinforce good habits |\n| Performing | High autonomy and output | Delegate, focus on growth |\n| Adjourning | Project ends | Celebrate, capture learnings |\n\n### Cycle\n\n```mermaid\nflowchart LR\n  F[Forming] --> S[Storming]\n  S --> N[Norming]\n  N --> P[Performing]\n  P -->|new members or big changes| F\n```"}, {"id": 18, "title": "The five dysfunctions of a team", "tldr": "Teams fail when trust is absent, conflict is avoided, commitment is weak, accountability is missing and results are ignored. Address the base layers first: build trust, then healthy conflict, then commitment and accountability.", "real": "Patrick Lencioni’s “The Five Dysfunctions of a Team” (2002) described these dysfunctions as a pyramid, and the model is widely used in leadership training.", "body": "### Pyramid (from base)\n\n```mermaid\nflowchart TB\n  R[5. Inattention to results] --> A[4. Avoidance of accountability]\n  A --> C[3. Lack of commitment]\n  C --> F[2. Fear of conflict]\n  F --> T[1. Absence of trust]\n```\n\n### Fixes\n\n| Dysfunction | Lead action |\n|---|---|\n| Absence of trust | Be vulnerable first; share personal working styles |\n| Fear of conflict | Invite debate on technical choices |\n| Lack of commitment | Clear decisions with deadlines |\n| Avoiding accountability | Shared standards, peer feedback |\n| Ignoring results | Visible team goals and metrics |"}, {"id": 19, "title": "Team size and structure", "tldr": "Small teams communicate better. Communication paths grow quickly with size, so teams of about 5 to 9 work well; beyond that, split into sub-teams or pods with clear ownership.", "real": "Amazon’s “two-pizza team” rule holds that a team should be small enough to be fed by two pizzas, and Fred Brooks’s “The Mythical Man-Month” (1975) explained how communication overhead grows as teams get larger.", "body": "### Communication paths\n\n```\nPaths = n × (n − 1) ÷ 2\n```\n\n```chart\n{\"title\": \"Communication paths by team size\", \"unit\": \"paths\", \"data\": [[\"3 people\", 3], [\"5 people\", 10], [\"7 people\", 21], [\"9 people\", 36], [\"12 people\", 66]]}\n```\n\n### Structures for 6–10 people\n\n| Structure | When |\n|---|---|\n| Single team | ≤ 7, one focus |\n| Two pods | Two streams (e.g. RAG and evals) |\n| Pairs + rotating ownership | Knowledge sharing |\n| Lead + senior sub-leads | 9+ people |"}, {"id": 20, "title": "Remote and hybrid teams", "tldr": "Remote and hybrid teams need deliberate communication: written documentation, clear async norms, overlapping hours, inclusive meetings and intentional relationship-building. Leads must avoid favoring people who are physically present.", "real": "GitLab, one of the largest all-remote companies, publishes its company handbook publicly with detailed practices for asynchronous work, documentation and remote meetings, which many other remote teams use as a reference.", "body": "### Remote team practices\n\n| Practice | Example |\n|---|---|\n| Handbook-first | Decisions and processes written down |\n| Async by default | Updates in writing, meetings for discussion |\n| Overlap hours | 3–4 hours shared |\n| Inclusive meetings | Everyone on own camera/laptop if one is remote |\n| Recorded demos | Watch later across time zones |\n| Social time | Virtual coffee, occasional in-person |\n\n### Hybrid fairness\n\n- Same information for everyone (no hallway decisions)\n- Rotate meeting times across time zones\n- Evaluate output, not visibility"}, {"id": 21, "title": "Principles of team communication", "tldr": "Good team communication is clear, timely, honest, two-way and recorded where it matters. Share context (“why”), not just instructions; repeat key priorities; and make it easy for people to ask questions.", "real": "Netflix’s “context, not control” principle and Amazon’s practice of written narratives both reflect the idea that sharing full context lets teams make better decisions without constant direction.", "body": "### Principles\n\n| Principle | In practice |\n|---|---|\n| Context first | Explain why a task matters |\n| Clarity | Specific goals, owners, dates |\n| Honesty | Share bad news early |\n| Two-way | Ask for questions and concerns |\n| Repetition | Repeat priorities until people can recite them |\n| Written record | Decisions in docs or channels |\n\n### Message checklist\n\n```\nWhat is happening? Why does it matter? What do you need from me/us? By when?\n```"}, {"id": 22, "title": "One-on-one meetings", "tldr": "Regular 1:1s are the most important management tool. They belong to the team member: their priorities, blockers, growth and wellbeing. Hold them weekly or biweekly, keep a shared agenda and follow up on commitments.", "real": "Andy Grove argued in “High Output Management” (1983) that a 90-minute 1:1 could improve weeks of a subordinate’s work, making it one of the highest-leverage manager activities.", "body": "### 30-minute agenda\n\n| Minutes | Topic |\n|---|---|\n| 5 | How are you? |\n| 10 | Their topics |\n| 10 | Feedback both ways, growth |\n| 5 | Commitments and follow-ups |\n\n### Good questions\n\n| Purpose | Question |\n|---|---|\n| Blockers | “What’s slowing you down?” |\n| Wellbeing | “How’s your workload feeling?” |\n| Growth | “What do you want to learn next?” |\n| Feedback for you | “What could I do better?” |\n| Engagement | “What’s the best part of your work right now?” |\n\n### Rules\n\nDon’t cancel; don’t turn them into status updates; take notes; follow through."}, {"id": 23, "title": "Team meetings that work", "tldr": "Keep team meetings few, purposeful and well run: clear goal, agenda shared in advance, right attendees, decisions recorded, actions with owners. Replace status meetings with written updates where possible.", "real": "Amazon’s practice of starting important meetings by silently reading a written memo, and Shopify’s 2023 cancellation of recurring meetings with more than two people (which it called a “calendar purge”), both show companies deliberately reducing low-value meeting time.", "body": "### Meeting types for an AI team\n\n| Meeting | Frequency | Purpose |\n|---|---|---|\n| Planning | Every 1–2 weeks | Commit to work |\n| Standup (sync or async) | Daily or 3×/week | Coordinate, unblock |\n| Eval / results review | Weekly | Quality decisions |\n| Demo | Every 2 weeks | Share progress |\n| Retrospective | Every 2–4 weeks | Improve |\n| Technical design review | As needed | Decide architecture |\n\n### Meeting checklist\n\n- [ ] Purpose stated in invite\n- [ ] Agenda and pre-read shared\n- [ ] Only needed people\n- [ ] Decisions and actions written\n- [ ] Ends on time"}, {"id": 24, "title": "Standups: synchronous and asynchronous", "tldr": "Standups coordinate work and surface blockers quickly. Keep them short and focused on goals and blockers, not activity reports. Async standups in a channel work well for distributed teams.", "real": "The Scrum Guide (2020 version) describes the Daily Scrum as a 15-minute event for developers to inspect progress toward the sprint goal and adapt the plan, not a status report to a manager.", "body": "### Format\n\n| Question | Focus |\n|---|---|\n| What moved toward our goal? | Progress |\n| What’s next? | Plan |\n| What’s blocking me? | Help needed |\n\n### Async template\n\n```text\n✅ Yesterday: finished retrieval eval run (recall@5 = 0.82)\n🎯 Today: rerank experiment on top-20 candidates\n🚧 Blocker: need access to the prod logs bucket\n```\n\n### Lead behaviors\n\n- Resolve blockers right after standup\n- Move deep discussions to follow-ups\n- Watch for people who are always “almost done”"}, {"id": 25, "title": "Written communication", "tldr": "Writing scales your communication: design docs, decision records, project briefs, updates and runbooks. Write clearly: lead with the point, use structure, include data, make asks explicit, and keep documents findable.", "real": "Amazon is known for six-page narrative memos instead of slides, and companies such as Stripe and GitLab are known for strong written cultures where important decisions and plans are documented.", "body": "### Document types for AI teams\n\n| Document | Purpose |\n|---|---|\n| Project brief | Goal, scope, success criteria |\n| Design doc / RFC | Technical approach and alternatives |\n| Experiment report | Hypothesis, method, results, decision |\n| Decision record | What was decided and why |\n| Weekly update | Progress, risks, asks |\n| Runbook | How to operate and fix the system |\n\n### Writing rules\n\n| Rule | Example |\n|---|---|\n| Bottom line first | “Recommendation: switch to model B (15% cheaper, same quality).” |\n| Numbers over adjectives | “p95 latency 2.4 s” not “fast” |\n| One idea per paragraph | Easy scanning |\n| Explicit asks | “Need approval by Thursday” |"}, {"id": 26, "title": "Async communication norms", "tldr": "Agree how your team uses each channel, expected response times, and how to mark urgency. Good async norms reduce interruptions, support focus and make remote collaboration smoother.", "real": "GitLab’s handbook defines asynchronous communication as the default and documents expectations for response times and when to use synchronous meetings, a widely referenced example of explicit async norms.", "body": "### Channel guide (example)\n\n| Channel | Use | Expected response |\n|---|---|---|\n| Team chat thread | Questions, quick coordination | Same day |\n| Direct message | Personal or sensitive | Same day |\n| Ticket / issue | Work items | By next planning |\n| Doc comments | Design feedback | 2 days |\n| Pager / phone | Production incidents | Minutes |\n| Email | External stakeholders | 1–2 days |\n\n### Urgency labels\n\n| Label | Meaning |\n|---|---|\n| 🔴 Urgent | Blocking production or customers |\n| 🟡 Today | Blocking someone’s work |\n| 🟢 FYI | No action needed |"}, {"id": 27, "title": "Giving clear instructions and context", "tldr": "When assigning work, explain the goal, why it matters, what done looks like, constraints, deadline and who to ask. Clear context reduces rework and lets people make good decisions independently.", "real": "The US military concept of “commander’s intent”, describing the purpose and desired end state of an operation rather than only detailed orders, is widely borrowed in business and engineering leadership so teams can adapt when plans change.", "body": "### Task brief template\n\n| Element | Example |\n|---|---|\n| Goal | Reduce hallucinated policy answers |\n| Why | Wrong policy answers caused 12 escalations last week |\n| Done means | Groundedness ≥ 95% on the policy eval set |\n| Constraints | No latency increase above 300 ms |\n| Deadline | Sprint end, check-in Wednesday |\n| Resources | Eval set v3, Ben for retrieval questions |\n| Decision freedom | You choose the approach |\n\n### Check understanding\n\nAsk “How are you planning to approach this?” rather than “Is that clear?”"}, {"id": 28, "title": "Listening well", "tldr": "Leads who listen learn about problems early and earn trust. Give full attention, ask follow-up questions, summarize what you heard, avoid jumping to solutions, and act on what you learn.", "real": "Research on managers repeatedly links employee engagement to feeling heard; Gallup has reported that managers account for at least 70% of the variance in team engagement scores.", "body": "### Listening techniques\n\n| Technique | Example |\n|---|---|\n| Full attention | Close laptop, no phone |\n| Open questions | “Tell me more about that.” |\n| Summarize | “So the main issue is the flaky eval runs?” |\n| Ask before advising | “What do you think we should do?” |\n| Acknowledge feelings | “That sounds frustrating.” |\n\n### Common mistakes\n\nInterrupting, solving too fast, defending decisions instead of understanding concerns, and not following up."}, {"id": 29, "title": "Difficult conversations", "tldr": "Difficult conversations, such as about performance, conflict, behavior or bad news, should happen early, privately and respectfully. Prepare, state facts, listen, agree on next steps and follow up.", "real": "“Crucial Conversations” (Patterson, Grenny, McMillan and Switzler, 2002) became a widely used guide for high-stakes conversations, emphasizing shared purpose and mutual respect to keep dialogue safe.", "body": "### Structure\n\n```mermaid\nflowchart LR\n  PREP[Prepare facts and goal] --> OPEN[Open with purpose]\n  OPEN --> FACTS[Share specific observations]\n  FACTS --> LISTEN[Listen to their view]\n  LISTEN --> AGREE[Agree next steps]\n  AGREE --> FOLLOW[Follow up]\n```\n\n### Opening example\n\n```text\n\"I want to talk about the last two releases, because I want you to succeed here.\nIn both, the eval run was skipped before merging, and we had regressions in production.\nI'd like to understand what happened from your side.\"\n```\n\n### Avoid\n\nDelaying, vague hints, discussing in public, and labeling people instead of behaviors."}, {"id": 30, "title": "Communication cadence for the team", "tldr": "Set a predictable rhythm of communication: daily coordination, weekly priorities and results, biweekly demos, monthly reflections and quarterly goals. Predictability reduces anxiety and keeps everyone aligned.", "real": "Many engineering organizations publish a regular weekly team update summarizing shipped work, metrics, risks and next priorities, which also serves as a record for stakeholders and future team members.", "body": "### Cadence\n\n| Frequency | Communication |\n|---|---|\n| Daily | Standup, blockers |\n| Weekly | Priorities, eval/metrics review, written update |\n| Biweekly | Demo, planning |\n| Monthly | Retrospective, team health check |\n| Quarterly | Goals, roadmap, career conversations |\n\n### Weekly update template\n\n```\nShipped: retrieval reranker (+6 points answer accuracy)\nMetrics: eval pass rate 91% (target 92%), cost/conversation $0.031\nRisks: GPU quota for fine-tuning delayed one week\nNext week: groundedness fixes, latency work\nAsks: decision on model vendor contract by Friday\n```"}, {"id": 31, "title": "Span of control", "tldr": "Most leads can effectively manage about 5 to 8 direct reports while staying technically involved. Beyond that, 1:1s, coaching and reviews suffer unless you add sub-leads or reduce hands-on work.", "real": "Will Larson’s “An Elegant Puzzle” (2019) suggests engineering managers typically support six to eight engineers, noting that smaller teams leave managers under-used and larger teams leave too little time for coaching.", "body": "### Capacity by team size\n\n| Direct reports | Lead’s reality |\n|---|---|\n| 3–4 | Lots of hands-on time; consider taking more scope |\n| 5–8 | Balanced leadership and technical work |\n| 9–10 | Little hands-on time; delegation essential |\n| 11+ | Add sub-leads or split the team |\n\n### Time math (weekly)\n\n```\n8 reports × 30-min 1:1 = 4 hours\n+ planning, reviews, stakeholders ≈ 12–15 hours\n= roughly 40–50% of the week before any hands-on work\n```"}, {"id": 32, "title": "Structuring a team of 5 to 10", "tldr": "Organize a growing team around clear ownership: work streams or pods with leads, pairs for knowledge sharing, and rotating responsibilities. Structure should follow the work and reduce coordination, not mirror job titles.", "real": "“Team Topologies” (Skelton and Pais, 2019) recommended designing teams around flow of work and limiting each team’s cognitive load, influencing how many organizations structure engineering and platform teams.", "body": "### Option A: two pods\n\n```mermaid\nflowchart TB\n  LEAD[Team lead] --> P1[Pod 1: assistant features]\n  LEAD --> P2[Pod 2: platform and evals]\n  P1 --> A1[AI engineer - pod lead]\n  P1 --> A2[AI engineer]\n  P1 --> S1[Software engineer]\n  P2 --> M1[ML engineer - pod lead]\n  P2 --> D1[Data engineer]\n  P2 --> O1[MLOps engineer]\n```\n\n### Choosing a structure\n\n| Situation | Structure |\n|---|---|\n| One product, 5–7 people | Single team with area owners |\n| Two distinct streams | Two pods with pod leads |\n| Heavy research + product work | Research pair + product pod |\n| Many interrupts | Rotating “shield” role |"}, {"id": 33, "title": "Onboarding new team members", "tldr": "Structured onboarding makes new members productive faster and builds belonging: access and setup, system overview, a buddy, a small first task in week one, and gradually larger ownership with clear 30-60-90 day goals.", "real": "Many technology companies set a goal for new engineers to ship a small change to production in their first week, because an early success builds confidence and exercises the whole development workflow.", "body": "### 30-60-90 plan (AI engineer)\n\n| Period | Goals |\n|---|---|\n| Week 1 | Setup, team intro, ship one small fix, run the eval suite |\n| Days 1–30 | Learn architecture, data, evals; complete 2–3 small tasks |\n| Days 31–60 | Own a medium feature with review |\n| Days 61–90 | Own an area; participate in on-call |\n\n### Onboarding checklist\n\n- [ ] Accounts, repos, data access, model API keys\n- [ ] Architecture walkthrough\n- [ ] Eval suite and quality bar explained\n- [ ] Buddy assigned\n- [ ] First task ready before day one\n- [ ] Introductions to key stakeholders\n- [ ] AI tool policy and data handling rules shared"}, {"id": 34, "title": "Levels of delegation", "tldr": "Delegation is not all-or-nothing. Choose a delegation level for each decision or task, from “I decide” to “you decide”, and make it explicit. Increase levels as trust and skill grow.", "real": "Jurgen Appelo’s Management 3.0 describes seven levels of delegation (tell, sell, consult, agree, advise, inquire and delegate), and “delegation boards” are used by teams to make decision rights explicit.", "body": "### Seven levels\n\n| Level | Meaning |\n|---|---|\n| 1. Tell | I decide and tell you |\n| 2. Sell | I decide and explain why |\n| 3. Consult | I ask your input, then decide |\n| 4. Agree | We decide together |\n| 5. Advise | You decide after my advice |\n| 6. Inquire | You decide and tell me |\n| 7. Delegate | You decide; no need to tell me |\n\n### Delegation board (example)\n\n| Decision | Level |\n|---|---|\n| Library choices within a service | 7 |\n| Prompt changes passing evals | 6 |\n| Model provider switch | 4 |\n| Hiring decisions | 3 |\n| Production architecture changes | 4 |"}, {"id": 35, "title": "Balancing autonomy and alignment", "tldr": "High-performing teams combine high alignment (everyone knows goals and constraints) with high autonomy (people choose how to reach them). Provide clear goals, guardrails and context, then trust people with the approach.", "real": "Spotify’s widely shared 2012–2014 engineering culture materials described “aligned autonomy”, where leaders focus on what problem to solve and why, while teams decide how; Spotify later noted it never fully followed the “Spotify model” as described.", "body": "### Alignment–autonomy grid\n\n| | Low autonomy | High autonomy |\n|---|---|---|\n| High alignment | Micromanaged, slow | Ideal: aligned autonomy |\n| Low alignment | Confused, passive | Chaotic, misdirected |\n\n### Tools\n\n| For alignment | For autonomy |\n|---|---|\n| Clear goals and metrics | Ownership of areas |\n| Quality bars and standards | Freedom in approach |\n| Architecture principles | Delegated decisions |\n| Regular demos | Minimal approvals |"}, {"id": 36, "title": "Leading senior and junior members", "tldr": "Seniors need ownership, influence and challenging problems; juniors need structure, feedback and safe learning opportunities. Pair them deliberately, and avoid both micromanaging seniors and abandoning juniors.", "real": "Engineering career frameworks published by companies such as Dropbox, GitLab and others describe senior engineers’ expectations to include mentoring and technical leadership, making senior–junior pairing part of their role rather than a favor.", "body": "### Approach by level\n\n| | Junior | Mid-level | Senior |\n|---|---|---|---|\n| Tasks | Well-defined | Features | Ambiguous problems |\n| Check-ins | Frequent | Regular | Milestones |\n| Your style | Directing, coaching | Supporting | Delegating |\n| Growth focus | Fundamentals | Ownership | Influence, mentoring |\n\n### Pairing patterns\n\n| Pattern | Benefit |\n|---|---|\n| Senior reviews junior’s design | Learning before coding |\n| Junior shadows senior on incidents | Operational knowledge |\n| Joint eval analysis sessions | Quality judgment |"}, {"id": 37, "title": "Keeping track of a larger team", "tldr": "With 5+ people you cannot keep everything in your head. Use visible boards, written updates, 1:1 notes, a team risk list and regular check-ins on goals. Track outcomes and blockers, not activity.", "real": "Kanban boards, originating from Toyota’s production system and adapted to software by David J. Anderson in the 2000s, give teams and leads a visual view of work in progress and bottlenecks.", "body": "### Tracking toolkit\n\n| Tool | Purpose |\n|---|---|\n| Work board | Status of all work items |\n| Goal tracker | Progress on sprint/quarter goals |\n| 1:1 notes doc per person | Growth, concerns, commitments |\n| Risk list | Technical and delivery risks |\n| Decision log | Decisions made and why |\n\n### Weekly lead review (30 minutes)\n\n- [ ] Any item stuck more than 3 days?\n- [ ] Anyone overloaded or under-used?\n- [ ] Any goal at risk?\n- [ ] Any commitments I made that are overdue?"}, {"id": 38, "title": "Balancing workload", "tldr": "Uneven workload causes burnout for some and disengagement for others. Make workload visible, check it in 1:1s, rebalance proactively, and watch for invisible work such as reviews, support and mentoring.", "real": "Research on “glue work”, described by engineer Tanya Reilly in her 2019 talk “Being Glue”, highlighted how essential but less visible work (coordination, documentation, onboarding) is often under-recognized, and unevenly distributed.", "body": "### Workload signals\n\n| Signal | Possible issue |\n|---|---|\n| Late-night commits | Overload |\n| Slow reviews from one person | Too many reviews assigned |\n| Always on support duty | Unfair interrupts |\n| Few tasks, low engagement | Under-utilization |\n\n### Rebalancing actions\n\n| Action | Example |\n|---|---|\n| Redistribute | Move a feature to another person |\n| Rotate | Support and on-call rotation |\n| Defer | Push low-priority work |\n| Recognize glue work | Count reviews, docs, mentoring in evaluations |"}, {"id": 39, "title": "Avoiding becoming the bottleneck", "tldr": "Leads often become bottlenecks for decisions, reviews and approvals. Delegate decisions, set clear standards so others can review, document context, and grow others’ expertise so the team runs without you.", "real": "The “bus factor” concept, how many people could leave before a project stalls, is widely used in software teams; a lead with a bus factor of one creates both risk and delays.", "body": "### Bottleneck signs\n\n| Sign | Fix |\n|---|---|\n| PRs wait for your review | Add other qualified reviewers |\n| Decisions wait for you | Delegation board |\n| Only you know the system | Documentation, pairing |\n| Everyone asks you first | Point to docs and owners |\n\n### Self-check\n\n```mermaid\nflowchart LR\n  Q[Could the team ship for 2 weeks without me?] -->|no| ACT[Delegate, document, train]\n  Q -->|yes| OK[Healthy]\n```"}, {"id": 40, "title": "Scaling from 5 to 10 people", "tldr": "Growing a team requires new structures: sub-leads, clearer ownership, more written process, stronger onboarding and possibly a team split. Plan the transition before the team feels the pain.", "real": "Brooks’s law, from Fred Brooks’s “The Mythical Man-Month” (1975), states that adding people to a late software project makes it later, because new people need ramp-up time and increase communication overhead.", "body": "### Scaling steps\n\n```mermaid\nflowchart LR\n  FIVE[5 people: one team] --> SEVEN[7: area owners]\n  SEVEN --> NINE[9: two pods with pod leads]\n  NINE --> TWELVE[12+: split into two teams]\n```\n\n### What to add as you grow\n\n| Size | Add |\n|---|---|\n| 6–7 | Area ownership, written design reviews |\n| 8–9 | Pod leads, formal onboarding, on-call rotation |\n| 10+ | Second lead, separate planning, team split |\n\n### Hiring timing\n\nNew hires need months to be fully productive; hire ahead of need rather than when deadlines are already at risk."}, {"id": 41, "title": "Breaking down work", "tldr": "Break large goals into small, independently deliverable pieces with clear outcomes. Small tasks are easier to estimate, assign, review and finish. For AI work, separate data, model, evaluation, integration and operations tasks.", "real": "Agile teams commonly use the INVEST criteria (independent, negotiable, valuable, estimable, small, testable), introduced by Bill Wake in 2003, to judge whether work items are well formed.", "body": "### Breakdown example: AI support assistant\n\n```mermaid\nflowchart TB\n  GOAL[Goal: AI answers billing questions] --> DATA[Data: collect and clean help articles]\n  GOAL --> EVAL[Evals: build 200-question golden set]\n  GOAL --> RET[Retrieval: index + reranking]\n  GOAL --> GEN[Generation: prompt + citations]\n  GOAL --> INT[Integration: API + chat UI hook]\n  GOAL --> OPS[Ops: logging, monitoring, cost dashboards]\n```\n\n### Good task checklist\n\n| Criterion | Example |\n|---|---|\n| Clear outcome | “Retrieval recall@5 ≥ 0.85 on eval set” |\n| Small | 1–3 days of work |\n| Testable | Clear verification |\n| Owner | One named person |\n| Dependencies known | Listed in ticket |"}, {"id": 42, "title": "Types of work in AI teams", "tldr": "AI teams handle several types of work with different predictability: feature engineering, research experiments, data work, evaluation, infrastructure, operations and support. Plan and assign each type differently.", "real": "Google’s “Rules of Machine Learning” guide (Martin Zinkevich) advises teams to start with simple models and invest heavily in data pipelines and metrics, reflecting how much of ML work is infrastructure and data rather than modeling.", "body": "### Work types\n\n| Type | Predictability | Planning approach |\n|---|---|---|\n| Product engineering | High | Estimate and commit |\n| Data work | Medium | Estimate with buffer |\n| Evaluation work | Medium | Ongoing allocation |\n| Experiments / research | Low | Time-box with decision point |\n| Infrastructure | Medium–high | Estimate, phase |\n| Operations / support | Interrupt-driven | Rotation, capacity reserve |\n| Tech debt | High | Fixed % of capacity |\n\n### Capacity mix (guideline)\n\n```chart\n{\"title\": \"Example capacity mix for an AI product team (guideline)\", \"unit\": \"%\", \"data\": [[\"Feature engineering\", 40], [\"Experiments and model work\", 20], [\"Evals and data\", 15], [\"Ops and support\", 15], [\"Tech debt\", 10]]}\n```"}, {"id": 43, "title": "Matching tasks to people", "tldr": "Assign work considering skills, interests, growth goals, workload, context and risk. Balance getting things done efficiently with developing people. High-risk deadlines favor experienced owners; growth tasks need support.", "real": "Andy Grove’s concept of “task-relevant maturity” in “High Output Management” (1983) held that the right management style depends on a person’s experience with the specific task, not their general seniority.", "body": "### Assignment factors\n\n| Factor | Question |\n|---|---|\n| Skill | Can they do it with current skills? |\n| Growth | Does it stretch them usefully? |\n| Interest | Do they want it? |\n| Load | Do they have capacity? |\n| Risk | What if it’s late or wrong? |\n| Context | Do they already know this area? |\n\n### Matching matrix\n\n| Task risk | Person ready | Person stretching |\n|---|---|---|\n| High | Assign | Assign with senior pair |\n| Low | Assign (or give to someone stretching) | Assign as growth task |"}, {"id": 44, "title": "Growth vs efficiency", "tldr": "Always assigning tasks to the person who does them fastest creates experts and bottlenecks, and stalls everyone else. Deliberately allocate some work for growth, with support, to build a resilient team.", "real": "Many engineering organizations track “bus factor” and run cross-training rotations because concentrating knowledge in one expert creates risk when that person is on leave, overloaded or leaves.", "body": "### Balance\n\n| Assignment | Short-term effect | Long-term effect |\n|---|---|---|\n| Expert does it | Fast | Bottleneck, expert burnout |\n| Learner does it with support | Slower | More capacity, resilience |\n\n### Rule of thumb\n\nReserve about 20–30% of tasks for growth assignments, with clear support: pairing, reviews, extra time.\n\n### Growth assignment setup\n\n| Element | Example |\n|---|---|\n| Learner | Divya (data engineer) |\n| Task | Build eval pipeline for retrieval |\n| Support | Ben reviews design, 2 pairing sessions |\n| Extra time | +30% in estimate |\n| Success | Pipeline running in CI |"}, {"id": 45, "title": "Ownership models", "tldr": "Clear ownership speeds decisions and quality. Assign owners for areas (services, models, eval suites, data pipelines), not just tasks. Owners maintain, document and make decisions within their area, with backups for continuity.", "real": "Many companies use CODEOWNERS files in GitHub or GitLab repositories to define which people or teams must review changes to specific parts of the codebase, making ownership explicit.", "body": "### Area ownership (example)\n\n| Area | Owner | Backup |\n|---|---|---|\n| Retrieval service | Ben | Asha |\n| Eval suite and golden sets | Asha | Chen |\n| Fine-tuning pipeline | Chen | Ben |\n| Data ingestion | Divya | Eli |\n| Infra and deployment | Eli | Divya |\n| API and integrations | Farah | Asha |\n\n### Owner responsibilities\n\n- Reviews changes in the area\n- Keeps documentation current\n- Watches metrics and alerts\n- Proposes improvements and tech debt work\n- Trains the backup"}, {"id": 46, "title": "Limiting work in progress", "tldr": "Too much work in progress slows everything: context switching, longer cycle times and late surprises. Limit WIP per person and per team, finish before starting, and swarm on blocked items.", "real": "Little’s law from queueing theory states that average cycle time equals work in progress divided by throughput, which is why Kanban methods limit WIP to shorten delivery times.", "body": "### Little’s law\n\n```\nCycle time = Work in progress ÷ Throughput\n```\n\n### Example\n\n| WIP items | Throughput (items/week) | Average cycle time |\n|---|---|---|\n| 24 | 8 | 3 weeks |\n| 12 | 8 | 1.5 weeks |\n\n### Practices\n\n| Practice | Example |\n|---|---|\n| WIP limit per person | Max 2 active items |\n| Stop starting, start finishing | Help finish before new work |\n| Swarm | Team helps unblock stuck items |\n| Visible board | Spot overload |"}, {"id": 47, "title": "Managing dependencies", "tldr": "Dependencies on other people, teams, data, models or vendors are a major source of delay. Identify them early, sequence work to reduce waiting, create interfaces and mocks, and track external dependencies actively.", "real": "Conway’s law (Melvin Conway, 1968) observed that system designs mirror the communication structures of the organizations that build them, which is why team boundaries and dependencies shape architecture and delivery speed.", "body": "### Dependency map\n\n```mermaid\nflowchart LR\n  DATA[Data access approval - Legal] --> INGEST[Ingestion pipeline]\n  INGEST --> INDEX[Retrieval index]\n  INDEX --> ASSIST[Assistant]\n  GPU[GPU quota - Platform team] --> FT[Fine-tuning]\n  FT --> ASSIST\n  UI[Chat UI - Frontend team] --> LAUNCH[Launch]\n  ASSIST --> LAUNCH\n```\n\n### Reduce waiting\n\n| Technique | Example |\n|---|---|\n| Interface first | Agree API contract early |\n| Mocks | Build UI against mocked responses |\n| Parallel tracks | Eval set while waiting for data |\n| Early requests | Request access in week 1 |\n| Escalation date | Escalate if not resolved by X |"}, {"id": 48, "title": "Interrupts, support and on-call rotation", "tldr": "Production issues, questions and urgent requests disrupt focused work. Route interrupts to a rotating “shield” or on-call person, reserve capacity for them, and protect everyone else’s focus.", "real": "Google’s Site Reliability Engineering book (2016) recommends capping operational work for SREs at about 50% of their time so they keep capacity for engineering work that reduces future toil.", "body": "### Rotation model\n\n| Role | Duties | Duration |\n|---|---|---|\n| Shield / on-call | Alerts, support questions, small fixes | 1 week |\n| Everyone else | Planned work | — |\n\n### Capacity planning\n\n```\nTeam of 6, 1 person on shield each week → plan sprint with 5 people's capacity\n```\n\n### Interrupt log\n\nTrack interrupts by type to find recurring issues and fix their root causes (documentation, automation, better monitoring)."}, {"id": 49, "title": "Fair distribution of work", "tldr": "Distribute exciting and tedious work fairly. Rotate unglamorous tasks, recognize maintenance and glue work, and make assignment decisions transparent. Perceived unfairness damages trust quickly.", "real": "Studies cited in “Being Glue” (Tanya Reilly, 2019) and by researchers on “non-promotable tasks” have found that such tasks are disproportionately assigned to or volunteered for by women, which is why many leads now track and rotate them deliberately.", "body": "### Fairness practices\n\n| Practice | Example |\n|---|---|\n| Rotate tedious work | Data labeling reviews rotate weekly |\n| Share exciting work | New model experiments rotate |\n| Transparent assignment | Explain choices in planning |\n| Recognize glue work | Mention in reviews and demos |\n| Track over time | Quarterly review of who did what |\n\n### Quarterly check\n\n| Person | Feature work | Experiments | Ops / support | Glue work |\n|---|---|---|---|---|\n| Asha | 40% | 20% | 15% | 25% |\n| Ben | 55% | 25% | 15% | 5% |\n\nRebalance when patterns look unfair."}, {"id": 50, "title": "Tracking progress without micromanaging", "tldr": "Track outcomes and blockers through boards, demos and brief check-ins, rather than constant status requests. Agree check-in points at assignment, trust people between them, and step in only when signals show risk.", "real": "Agile practices such as sprint reviews and demos were designed to make progress visible through working results rather than status reports, giving leads evidence of progress without micromanagement.", "body": "### Signals to watch\n\n| Healthy | Risky |\n|---|---|\n| Regular small merges | No commits for days |\n| Demos show progress | “Almost done” for a week |\n| Questions asked early | Silence |\n| Eval scores improving | No measurable results |\n\n### Check-in agreement\n\n```\nAt assignment: \"Let's check in Wednesday and Friday. Ping me anytime you're blocked.\"\n```\n\n### Step in when\n\nDeadline at risk, person is stuck for more than a day, or quality concerns appear."}, {"id": 51, "title": "Why estimating AI work is hard", "tldr": "AI work mixes predictable engineering with uncertain experiments: whether a model reaches the quality bar, whether data is good enough, and how long tuning takes are unknown upfront. Estimates must separate known work from uncertain work.", "real": "Kahneman and Tversky described the “planning fallacy” in 1979: people underestimate how long tasks take, even when they know similar tasks ran late. Uncertain AI experiments make this bias even stronger.", "body": "### Sources of uncertainty\n\n| Source | Example |\n|---|---|\n| Quality uncertainty | Will we reach 90% on evals? |\n| Data uncertainty | Is the data clean, labeled, accessible? |\n| Model behavior | Will the model handle edge cases? |\n| Integration | Hidden complexity in existing systems |\n| External changes | New model versions, API changes |\n| Human factors | Reviews, approvals, legal checks |\n\n### Cone of uncertainty\n\n```chart\n{\"title\": \"Ratio of high to low estimate by phase (cone of uncertainty)\", \"unit\": \"×\", \"data\": [[\"Initial concept\", 16], [\"Approved product definition\", 4], [\"Requirements complete\", 2.25], [\"UI design complete\", 1.56], [\"Detailed design complete\", 1.22]]}\n```\n\nValues follow Steve McConnell’s version of the cone of uncertainty (from Barry Boehm’s work): at the initial concept stage, actual effort can range from 0.25× to 4× the estimate."}, {"id": 52, "title": "Deterministic vs exploratory work", "tldr": "Split work into deterministic tasks (APIs, pipelines, UI integration), which can be estimated normally, and exploratory tasks (reaching a quality bar, model selection, prompt tuning), which should be time-boxed with decision points.", "real": "Basecamp’s Shape Up method (2019) uses an “appetite”, a fixed time budget, instead of estimates for uncertain work, then shapes the scope to fit that time, an approach well suited to exploratory AI tasks.", "body": "### Planning approach by type\n\n| Work type | Approach | Example |\n|---|---|---|\n| Deterministic | Estimate range | “Ingestion API: 3–5 days” |\n| Exploratory | Time-box | “1 week to test 3 retrieval strategies” |\n| Quality target | Time-box + checkpoints | “2 weeks to reach 90%; review at day 5” |\n| Dependency | Track, not estimate | “Waiting on data approval” |\n\n### Example plan\n\n```mermaid\nflowchart LR\n  A[Build ingestion: 4 days] --> B[Explore retrieval: 1-week time-box]\n  B --> C{Recall ≥ 0.85?}\n  C -- yes --> D[Integrate: 3 days]\n  C -- no --> E[Decision: more time, different approach, or reduce scope]\n```"}, {"id": 53, "title": "Time-boxing experiments", "tldr": "For experiments, fix the time and define the question, success criteria and next decision in advance. At the end of the time box, decide to continue, change approach, or stop. This turns open-ended research into manageable work.", "real": "Agile teams have long used “spikes”, time-boxed investigations to answer a technical question, a practice from Extreme Programming that fits AI experiments where the outcome is uncertain.", "body": "### Experiment brief\n\n| Field | Example |\n|---|---|\n| Question | Does reranking improve answer accuracy? |\n| Time box | 5 working days |\n| Method | Compare 3 rerankers on 200-question eval set |\n| Success | ≥ +5 points accuracy, ≤ +200 ms latency |\n| Decision | Adopt best / try alternative / stop |\n| Owner | Ben |\n\n### Outcomes are all valuable\n\n| Result | Value |\n|---|---|\n| Success | Ship improvement |\n| Failure with clear data | Avoid wasted future work |\n| Inconclusive | Refine question before more time |"}, {"id": 54, "title": "Estimating with ranges and confidence", "tldr": "Give estimates as ranges with confidence levels, not single dates. Use three-point estimates (optimistic, most likely, pessimistic) and state assumptions. Ranges communicate uncertainty honestly and reduce false precision.", "real": "The three-point PERT estimation technique was developed for the US Navy’s Polaris missile program in the late 1950s and remains widely used to estimate uncertain project tasks.", "body": "### PERT formula\n\n```\nExpected = (Optimistic + 4 × Most likely + Pessimistic) ÷ 6\nStandard deviation ≈ (Pessimistic − Optimistic) ÷ 6\n```\n\n### Example\n\n| Task | O | M | P | Expected |\n|---|---|---|---|---|\n| Ingestion pipeline | 3 | 5 | 9 | 5.3 days |\n| Eval set (200 cases) | 4 | 6 | 10 | 6.3 days |\n| Prompt + citations | 2 | 4 | 10 | 4.7 days |\n\n### How to communicate\n\n```\n\"Most likely 3 weeks; 80% confident within 4 weeks.\nAssumes data access by Monday and no model change.\"\n```"}, {"id": 55, "title": "Using historical data and reference classes", "tldr": "Your team’s past performance is the best predictor. Track how long similar tasks took (cycle times, sprint throughput, estimate accuracy) and use those reference classes to calibrate new estimates.", "real": "Bent Flyvbjerg’s research on large projects popularized “reference class forecasting”, basing estimates on outcomes of similar past projects rather than inside-view optimism, which has been adopted in public infrastructure planning.", "body": "### Data to track\n\n| Data | Use |\n|---|---|\n| Cycle time per task type | Reference durations |\n| Estimate vs actual | Calibration factor |\n| Throughput per week | Forecasting |\n| Experiment success rate | Probability of time-box success |\n\n### Calibration example\n\n| Task type | Avg estimate | Avg actual | Factor |\n|---|---|---|---|\n| API work | 3 days | 3.5 days | 1.2× |\n| Eval set creation | 4 days | 7 days | 1.75× |\n| Prompt/quality tuning | 3 days | 6 days | 2.0× |\n\nApply factors to new estimates of the same type."}, {"id": 56, "title": "Estimating when AI coding tools are in use", "tldr": "AI coding assistants can speed up some tasks greatly and slow down others. Do not assume a uniform speedup. Measure your own team’s cycle times with and without AI assistance, and keep time for review, testing and debugging AI-generated code.", "real": "A 2022 GitHub study found developers completed a defined coding task 55% faster with Copilot, while a July 2025 randomized study by METR found experienced open-source developers took 19% longer on real tasks in their own repositories when using AI tools, despite believing they were about 20% faster.", "body": "### Evidence varies by context\n\n| Study | Setting | Measured effect |\n|---|---|---|\n| GitHub (2022) | One new, well-defined task (an HTTP server) | 55% faster with Copilot |\n| METR (2025) | Experienced developers, real tasks in their own large repositories | 19% slower with AI tools |\n\n### Where AI tools tend to help or hurt\n\n| Usually faster | Often slower or risky |\n|---|---|\n| Boilerplate, tests, scripts | Complex changes in large, unfamiliar code |\n| New small projects | Subtle bugs needing deep context |\n| Documentation | Security-sensitive code |\n| Learning new APIs | Reviewing large AI-generated diffs |\n\n### Estimation rule\n\nEstimate with your team’s measured data, add explicit review and verification time, and update as you learn."}, {"id": 57, "title": "Estimating quality-bar work", "tldr": "“Make the AI good enough” is not an estimate. Define the quality bar on an eval set, measure the current baseline, and estimate in iterations with checkpoints. Progress often slows as you approach the target.", "real": "LinkedIn’s 2024 write-up on building its generative AI features reported that reaching about 80% of the target experience happened quickly, but pushing past 95% took months, a common pattern in AI quality work.", "body": "### Diminishing returns (illustrative)\n\n```chart\n{\"title\": \"Eval pass rate over iterations (illustrative)\", \"unit\": \"%\", \"data\": [[\"Week 1\", 70], [\"Week 2\", 80], [\"Week 3\", 85], [\"Week 4\", 88], [\"Week 6\", 90], [\"Week 8\", 91]]}\n```\n\n### Quality plan\n\n| Step | Example |\n|---|---|\n| Baseline | 72% on golden set |\n| Target | 90% |\n| Iteration length | 1 week |\n| Checkpoints | Weekly review of failure categories |\n| Decision rule | If < 85% by week 4, re-scope or change approach |\n\n### Communicate\n\n“We’re at 85%; the remaining failures are mostly rare policy cases. Options: ship with human review for those, or two more weeks.”"}, {"id": 58, "title": "Communicating estimates to stakeholders", "tldr": "Share estimates with ranges, assumptions, risks and checkpoints. Separate committed work from exploratory work, explain what would change the estimate, and update proactively when reality changes.", "real": "Steve McConnell’s “Software Estimation: Demystifying the Black Art” (2006) distinguished estimates, targets and commitments, a distinction that helps teams avoid treating early guesses as promises.", "body": "### Estimate message template\n\n```text\nGoal: AI assistant for billing questions, beta-ready.\nEstimate: 5–7 weeks (70% confidence for 6 weeks).\nCommitted: ingestion, API integration, monitoring (3 weeks).\nExploratory: reaching 90% quality (time-boxed 2–3 weeks; checkpoint week 4).\nAssumptions: data access by Nov 20; current model pricing.\nRisks: legal review of data use; possible model update.\nNext update: Friday weekly.\n```\n\n### Estimate vs target vs commitment\n\n| Term | Meaning |\n|---|---|\n| Estimate | Best prediction with uncertainty |\n| Target | Desired business date |\n| Commitment | Promise after negotiating scope |"}, {"id": 59, "title": "Buffers, re-estimation and scope trade-offs", "tldr": "Plan explicit buffers for uncertainty, re-estimate at checkpoints, and when timelines slip, trade scope before quality or people’s wellbeing. Communicate changes early with options.", "real": "Hofstadter’s law, from Douglas Hofstadter’s 1979 book “Gödel, Escher, Bach”, humorously states that tasks always take longer than you expect, even when you take this law into account.", "body": "### Buffer approach\n\n| Work type | Buffer |\n|---|---|\n| Familiar engineering | 10–20% |\n| New integrations | 20–30% |\n| Experiments / quality work | Time-box + decision |\n| External dependencies | Separate risk buffer |\n\n### When behind schedule\n\n```mermaid\nflowchart TD\n  LATE[Behind schedule] --> CAUSE[Understand cause]\n  CAUSE --> OPT1[Reduce scope]\n  CAUSE --> OPT2[Move date]\n  CAUSE --> OPT3[Add help carefully]\n  OPT1 --> TELL[Tell stakeholders early with options]\n  OPT2 --> TELL\n  OPT3 --> TELL\n```\n\nAvoid: hidden overtime, skipping evals or tests, and adding many new people late."}, {"id": 60, "title": "Forecasting with throughput and Monte Carlo", "tldr": "Instead of estimating every task, forecast with historical throughput: count completed items per week and simulate many possible futures to get delivery probabilities. This works well for teams with steady work item sizes.", "real": "Practitioners in the Kanban community, such as Daniel Vacanti in “Actionable Agile Metrics for Predictability” (2015), popularized throughput-based Monte Carlo forecasting as an alternative to detailed task estimates.", "body": "### Method\n\n```mermaid\nflowchart LR\n  HIST[Past weekly throughput] --> SIM[Simulate 10,000 futures]\n  SIM --> DIST[Distribution of completion dates]\n  DIST --> PROB[50%, 85%, 95% dates]\n```\n\n### Example output\n\n| Confidence | Completion for 40 remaining items |\n|---|---|\n| 50% | 5 weeks |\n| 85% | 6.5 weeks |\n| 95% | 7.5 weeks |\n\n### When to use\n\nBest for steady streams of similar-sized items; combine with time-boxes for exploratory AI work."}, {"id": 61, "title": "Choosing a delivery framework", "tldr": "Scrum suits teams with plannable work in fixed sprints; Kanban suits continuous flow and interrupt-heavy work; Shape Up suits fixed-time bets with flexible scope. AI teams often blend: Kanban flow with time-boxed experiments and regular planning.", "real": "The Scrum Guide (latest revision 2020) defines Scrum’s sprints, events and roles; Kanban for software was popularized by David J. Anderson’s 2010 book; and Basecamp published Shape Up in 2019.", "body": "### Comparison\n\n| | Scrum | Kanban | Shape Up |\n|---|---|---|---|\n| Cadence | 1–4 week sprints | Continuous | 6-week cycles + cool-down |\n| Planning | Sprint planning | On demand | Betting table |\n| Scope | Fixed per sprint | Flow | Flexible within appetite |\n| Best for | Predictable feature work | Ops, mixed work | Product bets with uncertainty |\n\n### Hybrid for AI teams\n\n```mermaid\nflowchart LR\n  BACKLOG[Prioritized backlog] --> PLAN[Biweekly planning]\n  PLAN --> FLOW[Kanban flow with WIP limits]\n  PLAN --> EXP[Time-boxed experiments]\n  FLOW --> REVIEW[Demo + eval review]\n  EXP --> REVIEW\n  REVIEW --> RETRO[Retrospective]\n```"}, {"id": 62, "title": "Sprint planning for AI work", "tldr": "In planning, set a sprint goal, reserve capacity for interrupts and evals, commit to deterministic work, and add experiments as time-boxes with clear decision outcomes. Avoid filling 100% of capacity.", "real": "Scrum’s sprint goal concept emphasizes a single objective for the sprint, giving teams flexibility in how they achieve it, which works better for AI work than a rigid list of tasks.", "body": "### Planning steps\n\n| Step | Example |\n|---|---|\n| Sprint goal | “Assistant answers billing questions with citations at ≥ 85% quality” |\n| Capacity | 6 people × 9 days − on-call − leave = 46 person-days |\n| Reserve | 15% interrupts, 10% tech debt |\n| Committed | Ingestion, API, logging |\n| Experiments | Reranking time-box (5 days) |\n| Risks | Data

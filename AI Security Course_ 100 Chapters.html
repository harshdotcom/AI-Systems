nWhen near capacity, route to a smaller model, queue low-priority work, or return clear “try later” messages instead of failing everything."}, {"id": 82, "title": "Abuse detection and rate limiting", "tldr": "Public AI features attract automated abuse: scraping, fraud content generation, spam, free-compute theft and jailbreak farming. Combine identity checks, layered rate limits, behavior analytics and enforcement actions.", "real": "AI providers publish regular threat reports on abuse they disrupt. OpenAI’s reports since 2024, for example, describe banning networks of accounts using its models for scams, influence operations and malware development, often detected through usage patterns across many accounts.", "body": "### Signals of abuse\n\n| Signal | Possible abuse |\n|---|---|\n| Very high, steady request rates | Bots, scraping, distillation |\n| Many accounts from one device or payment method | Ban evasion |\n| Repeated refusals | Jailbreak attempts |\n| Systematic topic coverage | Model extraction |\n| Bulk similar outputs | Spam, fake reviews, influence operations |\n| New accounts with immediate maximum use | Stolen cards, fraud |\n\n### Layered rate limiting\n\n```\nIP / ASN limits → account limits → organization limits → global capacity limits\n```\n\nAlso apply **token-based** limits, since requests vary hugely in cost.\n\n### Enforcement ladder\n\n1. Soft warning\n2. Throttling\n3. Feature restriction (e.g. no tools)\n4. Temporary suspension\n5. Ban and report (for serious abuse)\n\n### Privacy balance\n\nAbuse monitoring reads user content. Document what is monitored, minimize retention, restrict reviewer access, and disclose it in your privacy policy."}, {"id": 83, "title": "Side channels in AI systems", "tldr": "Even encrypted or isolated AI traffic can leak information through token lengths, timing, cache hits and resource usage. Defenses include padding, batching, isolated caches and constant-time behaviors for sensitive features.", "real": "In 2024, Ben-Gurion University researchers showed that the sizes of encrypted streamed tokens from AI assistants could reveal response topics, and vendors added padding. In 2025, Microsoft described “Whisper Leak”, inferring conversation topics from encrypted streaming traffic patterns, and providers deployed mitigations.", "body": "### Known side channels\n\n| Channel | Leak |\n|---|---|\n| Token length in streaming | Packet sizes reveal word lengths and topics |\n| Timing of responses | Reveals cache hits (someone else asked the same prefix) |\n| Shared prompt caches | Cross-user prefix inference |\n| GPU contention | Co-located workloads infer activity |\n| Speculative decoding acceptance | Timing differences reveal content patterns |\n| Error messages | Reveal model, version, internal paths |\n\n### Defenses\n\n| Channel | Mitigation |\n|---|---|\n| Streaming sizes | Pad chunks, group tokens, add random padding |\n| Cache timing | Scope caches per organization or user |\n| GPU sharing | Dedicated GPUs or MIG for sensitive tenants |\n| Errors | Generic messages externally, details in internal logs |\n\n### Who should care most\n\nProviders serving many organizations on shared infrastructure, and any deployment handling highly sensitive conversations (health, legal, government)."}, {"id": 84, "title": "Misinformation and overreliance", "tldr": "LLMs produce confident false statements (hallucinations) and can be manipulated into spreading falsehoods. When users or systems trust outputs blindly, that becomes a security and liability issue: invented policies, fake citations, wrong code and bad decisions.", "real": "In 2023, a US federal judge sanctioned lawyers in Mata v. Avianca for submitting a brief with fake case citations generated by ChatGPT. The Air Canada tribunal decision in 2024 likewise held the company responsible for its chatbot’s invented policy.", "body": "### Why it is a security topic\n\n| Scenario | Harm |\n|---|---|\n| Bot invents refund policy | Financial and legal liability |\n| Assistant suggests nonexistent package | Supply chain attack (ch. 75) |\n| Code assistant writes insecure code | Vulnerabilities |\n| Attacker poisons sources | Targeted misinformation (ch. 52) |\n| Analysts trust AI summaries | Wrong decisions in incidents |\n\n### Mitigations\n\n| Mitigation | Detail |\n|---|---|\n| Grounding | Answer from retrieved authoritative sources |\n| Citations | Link every claim to a source users can check |\n| Abstention | Allow and reward “I don’t know” |\n| Verification | Automated checks for facts, code tests, package existence |\n| Scope limits | Refuse topics outside the knowledge base |\n| UI cues | Clear labels that AI can be wrong |\n| Human review | For legal, medical, financial outputs |\n\n### Measure it\n\nTrack grounded-answer rate, citation accuracy and user-reported errors. Include adversarial tests where sources are deliberately misleading."}, {"id": 85, "title": "Content safety and moderation pipelines", "tldr": "Production AI apps need a moderation pipeline: classify inputs and outputs against your content policy, decide allow, block, rewrite or escalate, log decisions, and review edge cases. Policies must be explicit and tested.", "real": "In January 2024, the parcel company DPD disabled part of its AI customer chatbot after a customer got it to swear and write a poem criticizing DPD, and the screenshots went viral. Output moderation and topic restriction are what prevent this kind of brand incident.", "body": "### Pipeline\n\n```\nInput → [policy classifier] → allow / block / safe-complete\n          ↓\nModel generation (streaming)\n          ↓\nOutput → [policy classifier] → allow / redact / replace / escalate\n          ↓\nLog decision + sample for human review\n```\n\n### Policy taxonomy (example)\n\n| Category | Action |\n|---|---|\n| Violence, hate, sexual content involving minors | Block, report where legally required |\n| Self-harm | Supportive response, resources |\n| Illegal activity instructions | Refuse |\n| Off-topic for this product | Polite redirect |\n| Brand-damaging content | Refuse |\n| PII of others | Redact |\n\n### Tools\n\nOpen classifiers such as Llama Guard, cloud moderation services (OpenAI moderation, Azure AI Content Safety, Google Cloud safety filters), NVIDIA NeMo Guardrails for dialogue rules, and custom classifiers for domain policies.\n\n### Operational tips\n\n- Version your policy and classifier thresholds\n- Measure false positives on real benign traffic\n- Escalation path to humans for ambiguous cases\n- Kill switch to disable the feature quickly during an incident"}, {"id": 86, "title": "AI-powered phishing and social engineering", "tldr": "Attackers use LLMs to write fluent, personalized phishing at scale in any language, research targets automatically, and run convincing chat-based scams. Defenses shift from spotting bad grammar toward verifying requests and strengthening authentication.", "real": "A 2024 study by Heiding, Schneier and colleagues found fully AI-automated spear-phishing emails achieved click-through rates comparable to emails written by human experts, far above generic phishing. Cybercrime tools such as “WormGPT” were marketed in 2023 for writing phishing and business email compromise messages.", "body": "### What AI changes for attackers\n\n| Before | With AI |\n|---|---|\n| Generic templates | Personalized per target from public data |\n| Grammar mistakes | Native-quality writing in any language |\n| Manual research | Automated OSINT summaries |\n| One-way emails | Interactive chat scams that respond convincingly |\n| Limited scale | Thousands of tailored messages |\n\n### Updated defenses\n\n| Defense | Why |\n|---|---|\n| Phishing-resistant MFA (passkeys, FIDO2) | Stolen passwords become less useful |\n| Out-of-band verification | Confirm payment or credential requests via a known channel |\n| Payment change controls | Bank detail changes require a callback and second approver |\n| Email authentication (DMARC, SPF, DKIM) | Blocks domain spoofing |\n| Updated training | Focus on **request type**, not grammar |\n| AI-assisted detection | Classifiers looking at intent and context |\n\n### Training message update\n\n“Well-written, personal and urgent” is now normal for phishing. Teach people to verify **unusual requests**, regardless of how legitimate the message looks."}, {"id": 87, "title": "Deepfakes and voice-cloning fraud", "tldr": "Generative AI can convincingly clone voices from short samples and create real-time video deepfakes. Fraudsters use them to impersonate executives, family members and officials. Defenses rely on process: verification procedures that do not trust voice or video alone.", "real": "In early 2024, a finance employee at engineering firm Arup in Hong Kong transferred about US$25 million after a video call with deepfaked versions of the company’s CFO and colleagues. In January 2024, a deepfaked Biden robocall targeted New Hampshire primary voters, and the FCC later fined the consultant behind it $6 million.", "body": "### Fraud patterns\n\n| Pattern | Example |\n|---|---|\n| CEO / CFO fraud | Video or voice call requesting urgent transfer |\n| Family emergency scams | Cloned voice of a relative asking for money |\n| Help-desk impersonation | Cloned employee voice requests password or MFA reset |\n| Hiring fraud | Deepfaked candidates in remote interviews |\n| Political disinformation | Fake statements by public figures |\n| Identity verification bypass | Deepfaked selfies or video for account opening |\n\n### Organizational defenses\n\n- [ ] Payment requests above a threshold need **two approvers** and a callback to a known number\n- [ ] Code words or challenge questions for executive requests\n- [ ] Help desk never resets MFA based on voice alone\n- [ ] Identity checks in hiring (live verification, in-person steps for sensitive roles)\n- [ ] Liveness detection for remote KYC, plus document checks\n- [ ] Staff training with real deepfake examples\n\n### Detection limits\n\nDeepfake detectors help but lag behind generators. **Process controls** are the reliable defense."}, {"id": 88, "title": "AI-assisted malware and cyber operations", "tldr": "Attackers use AI for coding help, reconnaissance, vulnerability research, and increasingly for agentic operations that automate large parts of an intrusion. AI lowers skill barriers and increases speed, so defenders must assume faster, more scaled attacks.", "real": "In November 2025, Anthropic reported disrupting a cyber-espionage campaign it attributed with high confidence to a Chinese state-sponsored group, which used Claude Code to automate much of an intrusion campaign against about 30 targets. Earlier, in August 2025, it reported a criminal “vibe hacking” data-extortion operation that used the same tool.", "body": "### How attackers use AI (observed in public threat reports)\n\n| Use | Effect |\n|---|---|\n| Coding and debugging malware | Faster development |\n| Recon and target research | Automated OSINT |\n| Vulnerability research | Faster discovery and exploitation |\n| Phishing content | Scale and quality (ch. 86) |\n| Agentic operations | Automated scanning, exploitation, data analysis |\n| Ransom note and extortion analysis | Tailored pressure on victims |\n| Malware using LLMs at runtime | Payloads that query AI APIs to adapt behavior |\n\n### Supply chain twist\n\nIn August 2025, the compromised “s1ngularity” versions of the Nx build tool included code that called locally installed AI command-line tools to search victims’ machines for secrets, turning developers’ own AI agents into reconnaissance tools.\n\n### Defender response\n\n- Faster patching (exploitation windows are shrinking)\n- Strong identity security and MFA everywhere\n- Detection engineering for high-speed, high-volume activity\n- Restrict and monitor AI CLI tools on developer machines\n- Use AI for defense too (ch. 99)"}, {"id": 89, "title": "Watermarking and content provenance", "tldr": "Watermarks embed hidden signals in AI-generated content, while provenance standards like C2PA attach signed records of how content was made. Both help identify synthetic media, but watermarks can be removed or lost, and missing provenance proves nothing.", "real": "Google DeepMind open-sourced its SynthID Text watermarking in 2024. The Coalition for Content Provenance and Authenticity (C2PA), backed by Adobe, Microsoft, Google, OpenAI and others, maintains the “Content Credentials” standard now added by many cameras, editing tools and AI image generators.", "body": "### Two complementary approaches\n\n| | Watermarking | Provenance (C2PA) |\n|---|---|---|\n| What | Hidden statistical signal in content | Signed metadata manifest |\n| Survives screenshots | Sometimes (images); weak for text | Usually stripped |\n| Proves AI origin | When detected | When present and verified |\n| Proves authenticity of real media | No | Yes, from capture devices that sign |\n| Main weakness | Paraphrasing, cropping, re-encoding | Metadata removal |\n\n### Text watermarking idea\n\nThe generator slightly biases token choices using a secret key. A detector with the key checks for the statistical pattern. Heavy paraphrasing weakens it.\n\n### AI text detectors\n\nClassifiers that guess “AI or human” without watermarks are unreliable, with notable false positives against non-native English writers. Don’t use them alone for consequential decisions such as academic penalties.\n\n### Practical use\n\n- Add C2PA credentials to media your organization generates\n- Verify credentials on media used for important decisions\n- Treat absent provenance as “unknown”, not “fake”\n- Combine with process verification (ch. 87)"}, {"id": 90, "title": "Defending an organization against AI-enabled threats", "tldr": "Update your security program for AI-era attackers: phishing-resistant identity, verification procedures for payments and resets, deepfake-aware training, faster patching, monitoring of AI tool use, and a policy for employees’ own AI usage.", "real": "After the Arup deepfake fraud became public, many finance teams adopted stricter callback and dual-approval rules for payments. National cyber agencies such as the UK NCSC have also assessed that AI will increase the volume and impact of cyber attacks, especially social engineering.", "body": "### Program updates\n\n| Area | Update |\n|---|---|\n| Identity | Passkeys/FIDO2, no SMS or voice-only resets |\n| Finance | Dual approval, callbacks, cooling-off periods for new payees |\n| Help desk | Strict identity verification, no exceptions for urgency |\n| Training | Deepfake demos, AI phishing examples, verification habits |\n| Vulnerability management | Shorter patch SLAs for internet-facing systems |\n| Detection | Behavior-based detection, not signature-only |\n| AI usage | Approved tools, data rules, shadow AI monitoring |\n| Executives | Limit public voice and video samples where practical |\n\n### Tabletop exercise ideas\n\n1. A deepfake CEO calls finance for an urgent wire.\n2. An employee’s AI agent leaks a customer database through prompt injection.\n3. Stolen API keys generate $50K of usage over a weekend.\n4. A popular open model you use is reported to be backdoored.\n\nRun each with security, finance, legal, communications and engineering together."}, {"id": 91, "title": "AI red teaming methodology", "tldr": "AI red teaming systematically attacks an AI system the way real adversaries would, covering security (injection, data leaks, tool abuse) and safety (harmful content). It needs clear scope, threat-informed test cases, automation plus human creativity, and tracked remediation.", "real": "At DEF CON 31 in 2023, thousands of participants red-teamed models from leading AI companies in a White House-supported Generative AI Red Team challenge. It was the largest public AI red-teaming exercise of its kind and showed how varied real attackers’ approaches are.", "body": "### The process\n\n```\n1. Scope      → system, versions, in/out of scope, rules of engagement\n2. Threats    → who attacks, what they want (Part 3)\n3. Test plan  → categories mapped to OWASP / ATLAS\n4. Execute    → automated scans + manual expert testing\n5. Triage     → severity by real impact\n6. Report     → reproducible findings, evidence, fixes\n7. Retest     → verify fixes; add to regression suite\n```\n\n### What to test\n\n| Area | Examples |\n|---|---|\n| Prompt injection | Direct, indirect via each content source |\n| Data leakage | Prompt, PII, cross-user, RAG permissions |\n| Tool abuse | Unauthorized actions, confused deputy |\n| Output handling | XSS, code execution |\n| Harmful content | Policy categories |\n| Abuse and cost | Rate limits, runaway loops |\n| Infrastructure | Exposed endpoints, keys |\n\n### Team composition\n\nSecurity testers, ML engineers, domain experts (medical, legal, finance), and people with diverse languages and cultural backgrounds, because many jailbreaks exploit language coverage gaps.\n\n### Report each finding with\n\nExact inputs, model and version, success rate across retries, impact, and a recommended fix. AI findings are probabilistic, so report how often they reproduce."}, {"id": 92, "title": "AI security testing tools", "tldr": "Open-source tools automate much of AI security testing: garak and PyRIT for probing models, promptfoo for app-level evaluations in CI, and benchmark suites such as AgentDojo, CyberSecEval and HarmBench. They speed up coverage but don’t replace human testers.", "real": "Microsoft released PyRIT in 2024 from its AI Red Team’s internal tooling. NVIDIA maintains garak, an LLM vulnerability scanner, and Meta published CyberSecEval and other Purple Llama tools for evaluating models’ cybersecurity risks and defenses.", "body": "### Tool landscape\n\n| Tool | Focus | Typical use |\n|---|---|---|\n| **garak** (NVIDIA) | Model vulnerability scanning | Probe for injection, leakage, jailbreaks |\n| **PyRIT** (Microsoft) | Red-team automation framework | Multi-turn attacks, attacker LLMs, scoring |\n| **promptfoo** | App evals and red teaming | CI tests for prompts, RAG and agents |\n| **AgentDojo** | Agent hijacking benchmark | Measure injection robustness of agents |\n| **CyberSecEval** (Meta) | Cyber risk benchmarks | Insecure code, cyberattack helpfulness |\n| **HarmBench / JailbreakBench** | Jailbreak benchmarks | Compare robustness |\n| **ModelScan / picklescan** | Model file scanning | Supply chain |\n| **Adversarial Robustness Toolbox (ART)** | Classic adversarial ML | Evasion, poisoning, extraction tests |\n\n### Example: garak\n\n```bash\npip install garak\ngarak --model_type openai --model_name gpt-4o-mini --probes promptinject\n```\n\nFlag names change between garak releases; check `garak --help` for your version.\n\n### Example: promptfoo red team\n\n```bash\nnpx promptfoo@latest redteam init\nnpx promptfoo@latest redteam run\n```\n\n### Choosing\n\nUse a scanner for broad coverage, an app-level framework for your real prompts, tools and data, and humans for creative, context-specific attacks."}, {"id": 93, "title": "Security evaluations in CI/CD", "tldr": "Treat AI security tests like unit tests: a regression suite of attacks and expected safe behaviors runs on every prompt, model, tool or retrieval change, with thresholds that block releases when security metrics regress.", "real": "Many teams discover that a “harmless” system-prompt tweak or a model version upgrade reopened a jailbreak or injection path they had already fixed. That is why promptfoo-style evaluations and model-provider safety evaluations are commonly wired into release pipelines.", "body": "### What triggers a run\n\n| Change | Why it matters |\n|---|---|\n| System prompt edit | Behavior shifts |\n| Model or version change | Different weaknesses |\n| New tool or permission | New attack paths |\n| New data source for RAG | New injection surface |\n| Guardrail threshold change | Coverage changes |\n\n### Suite structure\n\n```\nsecurity-evals/\n  injection/        direct, indirect (per source), encoded, multi-turn\n  leakage/          system prompt, PII, cross-tenant, RAG permissions\n  tools/            unauthorized actions, argument abuse\n  output/           XSS payload requests, code execution attempts\n  safety/           policy categories + benign look-alikes (over-refusal)\n  regressions/      every past finding, forever\n```\n\n### Gate example\n\n| Metric | Threshold |\n|---|---|\n| Injection success rate | ≤ baseline, and 0 for critical exfiltration tests |\n| Leakage tests | 100% pass |\n| Over-refusal on benign set | ≤ 3% |\n| Past findings | 100% pass |\n\n### Tips\n\nRun several samples per test (outputs vary), fix random seeds where possible, and keep a human review step for borderline results."}, {"id": 94, "title": "Logging, monitoring and detection", "tldr": "Log prompts, retrieved sources, tool calls, outputs and decisions with user identity and timestamps, under privacy controls. Monitor for injection attempts, unusual tool use, data exfiltration patterns, cost spikes and guardrail hits, and route alerts to your security operations team.", "real": "Major cloud providers now offer AI-specific detections in their security products (for example Microsoft Defender for Cloud’s AI threat protection and AWS Bedrock invocation logging), reflecting that AI applications need monitoring in security operations centers like any other production system.", "body": "### What to log\n\n| Field | Purpose |\n|---|---|\n| User / tenant / session ID | Accountability |\n| Model and version, prompt template version | Reproducibility |\n| Input (redacted as needed) | Investigation |\n| Retrieved document IDs and sources | Trace injections |\n| Tool calls with arguments and results | Detect misuse |\n| Output | Detect leaks |\n| Guardrail decisions and scores | Tune defenses |\n| Tokens and cost | Abuse and budget |\n| Latency, errors | Operations |\n\n### Detection ideas\n\n| Detection | Signal |\n|---|---|\n| Injection attempts | Classifier hits, known patterns in retrieved content |\n| Exfiltration | Outputs with external URLs containing long query strings |\n| Tool misuse | New recipients, unusual volume, off-hours actions |\n| Prompt leakage | Canary token in output |\n| Abuse | Repeated refusals, high token use |\n| Agent loops | Step counts or costs far above normal |\n\n### Privacy controls on logs\n\nRedact PII, restrict access, set retention limits and record who views raw transcripts. AI logs can become a sensitive data store in their own right."}, {"id": 95, "title": "AI incident response", "tldr": "Prepare AI-specific incident playbooks: how to detect, contain (kill switches, token revocation, disabling tools), investigate (prompts, sources, tool logs), remediate (fix, retest), notify, and learn. Practice them before you need them.", "real": "Public AI incident trackers such as the AI Incident Database and the OECD AI Incidents Monitor have recorded thousands of AI-related incidents. OpenAI’s public postmortem for its March 2023 ChatGPT data exposure shows the classic sequence: take the service offline, find the root cause, notify affected users and add safeguards.", "body": "### AI incident types\n\n| Type | Example |\n|---|---|\n| Data leak | Bot reveals other users’ data |\n| Hijacked agent | Injection triggered emails or deletions |\n| Harmful output | Bot produces offensive or dangerous content publicly |\n| Model compromise | Backdoored or tampered model discovered |\n| Key theft / LLMjacking | Unexpected huge usage |\n| Supply chain | Vulnerability in an AI library or MCP server |\n\n### Playbook phases\n\n| Phase | AI-specific actions |\n|---|---|\n| Prepare | Kill switches per feature, tool-level disable flags, logging in place |\n| Detect | Alerts, user reports, researcher disclosures |\n| Contain | Disable feature or tools, revoke tokens, block sources, roll back model or prompt |\n| Investigate | Reconstruct from prompts, retrieved docs, tool logs; find the injection source |\n| Eradicate | Remove poisoned content, patch, rotate secrets |\n| Recover | Re-enable gradually with added controls and monitoring |\n| Learn | Add regression tests, update threat model, share lessons |\n\n### Kill switch design\n\nFeature flags that can, within minutes: disable the AI feature, disable specific tools, switch to a safer model, or switch to read-only mode.\n\n### Disclosure readiness\n\nHave a security contact, a vulnerability disclosure policy that explicitly covers AI issues, and a decision tree for user and regulator notification."}, {"id": 96, "title": "AI governance and acceptable use", "tldr": "Governance makes AI security sustainable: an inventory of AI systems, an acceptable-use policy for employees, risk classification, approval processes, ownership, training and oversight. It also addresses “shadow AI”, meaning tools used without approval.", "real": "Many large companies initially banned or restricted public chatbots (Samsung, several banks and others in 2023), then moved to approved enterprise AI tools with data protections. The pattern shows bans alone push usage into the shadows, while approved alternatives plus clear rules work better.", "body": "### Governance building blocks\n\n| Block | Content |\n|---|---|\n| AI inventory | Every model, AI feature, vendor and agent, with owners |\n| Acceptable-use policy | What data can go into which tools; prohibited uses |\n| Risk classification | Low / medium / high based on data, autonomy and impact |\n| Approval process | Security, privacy and legal review scaled to risk |\n| Vendor management | AI-specific due diligence questions |\n| Training | Role-based: all staff, developers, executives |\n| Oversight | AI risk committee or council, metrics, audits |\n\n### Example data rules for employees\n\n| Data class | Public AI tools | Approved enterprise AI | Internal self-hosted |\n|---|---|---|---|\n| Public | ✅ | ✅ | ✅ |\n| Internal | ❌ | ✅ | ✅ |\n| Confidential / customer | ❌ | ✅ with approval | ✅ |\n| Regulated (health, payment) | ❌ | Case by case | ✅ with controls |\n\n### Shadow AI\n\nDiscover it through network logs, browser extension inventories, expense reports and surveys. Respond by offering good approved tools, not just blocking."}, {"id": 97, "title": "Regulations and legal landscape", "tldr": "The EU AI Act sets risk-based obligations, including cybersecurity and robustness requirements for high-risk systems and transparency duties for some AI uses. Existing laws on data protection, consumer protection and sector rules also apply to AI. Track your jurisdictions closely, as timelines keep shifting.", "real": "The EU AI Act entered into force in August 2024. Its prohibited-practice rules applied from February 2025 and its general-purpose AI model obligations from August 2025. In 2026, EU institutions agreed a “Digital Omnibus” amendment that pushed most high-risk system obligations into late 2027 and 2028, while most transparency duties kept their August 2026 date.", "body": "### EU AI Act at a glance\n\n| Tier | Examples | Obligations |\n|---|---|---|\n| Prohibited | Social scoring, certain manipulative or biometric uses | Banned |\n| High-risk | Hiring, credit, education, critical infrastructure, some biometrics | Risk management, data governance, logging, human oversight, **accuracy, robustness and cybersecurity** |\n| Transparency | Chatbots, deepfakes, generated content | Disclose AI interaction, label synthetic content |\n| General-purpose AI models | Foundation models | Documentation, copyright policy; extra duties (including cybersecurity) for systemic-risk models |\n| Minimal risk | Spam filters, games | Voluntary codes |\n\n### Security-relevant requirements\n\nHigh-risk systems must be resilient against attempts to alter their use or performance, including data poisoning, model poisoning, adversarial examples and confidentiality attacks. That maps directly to this course.\n\n### Other laws that already apply\n\n| Law type | AI relevance |\n|---|---|\n| GDPR and data protection laws | Lawful basis, minimization, data subject rights, DPIAs |\n| Consumer protection | Misleading AI claims and outputs |\n| Sector rules (finance, health) | Model risk management, safety |\n| Cyber incident reporting rules | AI incidents can be reportable |\n\n### Practical advice\n\nMaintain a regulatory register per AI system, assign legal owners, and re-check dates often. This chapter is a snapshot, not legal advice."}, {"id": 98, "title": "Standards and building an AI security program", "tldr": "ISO/IEC 42001 defines an auditable AI management system, and ISO/IEC 27001 still anchors information security. Build an AI security program in stages: inventory, policies, secure design, testing, monitoring, incident response and continuous improvement.", "real": "ISO/IEC 42001, published in December 2023, is the first certifiable AI management system standard. Several large AI providers and cloud vendors have announced certification, and enterprise buyers increasingly ask for it in vendor reviews alongside SOC 2 and ISO 27001.", "body": "### Standards map\n\n| Standard / framework | Role |\n|---|---|\n| ISO/IEC 42001 | AI management system (certifiable) |\n| ISO/IEC 27001 | Information security management system |\n| ISO/IEC 23894 | AI risk management guidance |\n| NIST AI RMF + GenAI profile | Risk program structure |\n| OWASP LLM Top 10, MITRE ATLAS | Technical threat checklists |\n| NCSC/CISA guidelines, SAIF | Secure engineering practices |\n\n### Maturity stages\n\n| Stage | Characteristics |\n|---|---|\n| 1. Ad hoc | Teams use AI freely; no inventory |\n| 2. Aware | Policy exists; basic vendor reviews |\n| 3. Defined | Threat modeling, AI security standards, approved tools |\n| 4. Managed | CI security evals, monitoring, red teaming, incident playbooks |\n| 5. Optimized | Metrics-driven, automated controls, continuous red teaming |\n\n### First 90 days plan\n\n| Days | Actions |\n|---|---|\n| 1–30 | Inventory AI use; publish acceptable-use policy; fix exposed endpoints and keys |\n| 31–60 | Threat model top 3 AI systems; add rate limits, logging, output controls |\n| 61–90 | Red team the riskiest system; build regression suite; write incident playbook |\n\n### Metrics\n\nPercentage of AI systems inventoried and threat-modeled, open critical findings, mean time to remediate AI findings, and guardrail hit rates."}, {"id": 99, "title": "AI for defense", "tldr": "AI is also a powerful defensive tool: finding vulnerabilities, triaging alerts, analyzing malware, writing detections, and fixing code. Use it with the same security controls you apply to any AI system, because defensive agents also have privileges and read attacker-controlled data.", "real": "In late 2024, Google’s Big Sleep agent found an exploitable memory-safety bug in SQLite before it reached an official release, which Google described as a first for an AI agent in widely used real-world software. In August 2025, DARPA’s AI Cyber Challenge final showcased autonomous systems that found and patched vulnerabilities in open-source code.", "body": "### Defensive use cases\n\n| Use | Example |\n|---|---|\n| Vulnerability discovery | AI-assisted fuzzing and code auditing |\n| Code fixing | Suggest and test patches |\n| Alert triage | Summarize and prioritize SOC alerts |\n| Threat intelligence | Summarize reports, extract indicators |\n| Detection engineering | Draft detection rules from descriptions |\n| Malware analysis | Explain decompiled code |\n| Phishing analysis | Classify reported emails |\n| Security reviews | Check designs and configs against standards |\n\n### Risks of defensive AI\n\n| Risk | Example |\n|---|---|\n| Injection through analyzed data | Malware sample contains instructions to the analysis agent |\n| Over-trust | Analyst accepts a wrong triage verdict |\n| Privilege | SOC agent with power to isolate hosts gets manipulated |\n| Data exposure | Sensitive logs sent to external AI services |\n\n### Best practices\n\n- Treat analyzed artifacts as hostile input\n- Keep humans approving containment actions\n- Measure accuracy against known cases before trusting outputs\n- Use approved, data-protected AI services for security data"}, {"id": 100, "title": "Roadmap, checklist and glossary", "tldr": "Learn AI security hands-on in ten steps, use the launch checklist before shipping any AI feature, and keep the glossary as a quick reference. AI security changes monthly, so keep following trusted sources.", "real": "Good sources to follow include OWASP’s GenAI Security Project, MITRE ATLAS, NIST publications, Simon Willison’s blog on prompt injection, Johann Rehberger’s Embrace The Red, and the security research blogs of AI labs and security firms such as Wiz, Trail of Bits and Oligo. Many of this course’s real-world examples were first published there.", "body": "### Ten-step hands-on roadmap\n\n1. Build a small RAG chatbot; try direct and indirect injection against it.\n2. Add a markdown image to its output and watch the exfiltration risk; then block it with CSP.\n3. Threat model it with STRIDE and the OWASP Top 10.\n4. Run garak and promptfoo red-team scans; fix two findings.\n5. Add permission-aware retrieval with two test users.\n6. Build a tool-using agent; add least privilege and approvals.\n7. Load a pickle model safely; scan it; switch to safetensors.\n8. Set up logging, canary tokens and an alert for exfiltration patterns.\n9. Write an incident playbook and run a tabletop exercise.\n10. Read the NIST AI RMF and map your project to it.\n\n### Launch checklist for any AI feature\n\n- [ ] Threat model done; lethal trifecta assessed\n- [ ] No secrets in prompts; authorization in code\n- [ ] Untrusted content delimited, filtered and isolated from privileged actions\n- [ ] Tools least-privilege; risky actions need confirmation\n- [ ] Output encoded; images and links restricted; CSP set\n- [ ] Retrieval respects permissions; tenant isolation tested\n- [ ] Models from verified sources, pinned, scanned; AI-BOM recorded\n- [ ] Rate limits, token caps and spend alerts\n- [ ] Logging with privacy controls; detections in place\n- [ ] Red-team results reviewed; regression suite in CI\n- [ ] Kill switch and incident playbook ready\n\n### Glossary\n\n| Term | Meaning |\n|---|---|\n| Prompt injection | Inputs that override an app’s intended instructions |\n| Indirect prompt injection | Injection via content the AI reads (web, email, docs) |\n| Jailbreak | Bypassing a model’s safety training |\n| Lethal trifecta | Private data + untrusted content + external communication |\n| Excessive agency | Too much functionality, permission or autonomy |\n| Tool poisoning | Malicious instructions in tool descriptions |\n| Data poisoning | Corrupting training or retrieval data |\n| Backdoor | Hidden behavior activated by a trigger |\n| Evasion / adversarial example | Input crafted to cause errors |\n| Membership inference | Testing whether data was in training |\n| Model extraction | Copying a model through queries |\n| Differential privacy | Mathematical limit on individual data influence |\n| Slopsquatting | Registering package names that AI hallucinates |\n| LLMjacking | Using stolen credentials to run LLMs |\n| AI-BOM | Inventory of models, data and AI components |\n| Red teaming | Adversarial testing of a system |\n| Spotlighting | Marking untrusted text so models treat it as data |\n| CaMeL / dual LLM | Architectures isolating untrusted content from privileged planning |"}];
const PARTS = ["Foundations of AI security", "Frameworks and taxonomies", "Threat modeling AI systems", "Prompt injection", "Jailbreaks and model misuse", "Defending against prompt injection", "Data leakage and system prompts", "Improper output handling", "Agents and excessive agency", "MCP and tool ecosystems", "RAG and vector database security", "Data and model poisoning", "Adversarial machine learning", "Privacy attacks and defenses", "AI supply chain security", "Infrastructure and MLOps security", "Abuse, cost and side channels", "AI-enabled attacks and deepfakes", "Red teaming, monitoring and response", "Governance, compliance and the road ahead"];
const partOf = id => Math.ceil(id / 5);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "ai-sec-course-progress-v1";
const LS_LAST = "ai-sec-course-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try{ await dbRef.set({done:[...done].sort((a,b)=>a-b), updated:Date.now()}); }
  catch(e){ if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; pushRemote(); }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...done])); }catch(e){} }
function toggle(id){
  if (done.has(id)) done.delete(id); else done.add(id);
  saveLocal(); pushRemote(); renderAll();
  toast(done.has(id) ? "Chapter " + id + " marked complete" : "Chapter " + id + " marked not complete");
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(s){
  if (window.marked && marked.parse){
    const html = marked.parse(s, {gfm:true, headerIds:false, mangle:false});
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  }
  return "<pre>" + esc(s) + "</pre>";
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function currentId(){
  const m = location.hash.match(/^#ch-(\d{1,3})$/);
  const n = m ? +m[1] : 0;
  return n >= 1 && n <= 100 ? n : 0;
}

/* ---------- header memory bank ---------- */
function renderBank(){
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    html += '<div class="bank-group" title="Part ' + p + ': ' + esc(PARTS[p-1]) + '">';
    for (let i = (p-1)*5 + 1; i <= p*5; i++){
      html += '<button class="cell' + (done.has(i) ? " done" : "") + (i === cur ? " here" : "") +
        '" data-go="' + i + '" aria-label="Chapter ' + i + (done.has(i) ? ", complete" : "") + '"></button>';
    }
    html += "</div>";
  }
  document.getElementById("bank").innerHTML = html;
  document.getElementById("doneCount").textContent = done.size;
  document.getElementById("pct").textContent = Math.round(done.size) + "%";
}

/* ---------- sidebar ---------- */
const openParts = new Set();
function renderSide(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    const ids = [1,2,3,4,5].map(k => (p-1)*5 + k);
    const matches = ids.filter(i => !q || byId[i].title.toLowerCase().includes(q) || byId[i].tldr.toLowerCase().includes(q) || String(i) === q);
    if (q && !matches.length) continue;
    const count = ids.filter(i => done.has(i)).length;
    const open = q || openParts.has(p) || partOf(cur) === p;
    html += '<div class="part' + (open ? " open" : "") + '">' +
      '<button class="part-head" data-part="' + p + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="part-num">' + String(p).padStart(2, "0") + '</span>' +
      '<span class="part-name">' + esc(PARTS[p-1]) + '</span>' +
      '<span class="part-count' + (count === 5 ? " full" : "") + '">' + count + '/5</span></button><ul class="part-list">';
    for (const i of matches){
      html += '<li class="ch-row' + (i === cur ? " active" : "") + '">' +
        '<button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="' + (done.has(i) ? "Mark chapter " + i + " not complete" : "Mark chapter " + i + " complete") + '">' + TICK + '</button>' +
        '<a href="#ch-' + i + '"><span class="n">' + i + '.</span>' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ul></div>";
  }
  if (!html) html = '<p style="color:var(--muted);font-size:14px;padding:8px">No chapters match that search. Try a shorter word like “injection” or “RAG”.</p>';
  document.getElementById("parts").innerHTML = html;
}

/* ---------- chapter view ---------- */
function renderChapter(id){
  const c = byId[id];
  const p = partOf(id);
  const ids = [1,2,3,4,5].map(k => (p-1)*5 + k);
  const isDone = done.has(id);
  const tabs = ids.map(i =>
    '<button class="tab' + (i === id ? " active" : "") + '" role="tab" aria-selected="' + (i === id) + '" data-go="' + i + '">' +
    '<span class="dot' + (done.has(i) ? " on" : "") + '"></span><span class="tab-t">' + i + '. ' + esc(byId[i].title) + '</span></button>'
  ).join("");
  document.getElementById("main").innerHTML =
    '<p class="crumb">Part ' + p + ' of 20: ' + esc(PARTS[p-1]) + '</p>' +
    '<div class="tabs" role="tablist" aria-label="Chapters in this part">' + tabs + '</div>' +
    '<article>' +
      '<p class="ch-no">Chapter ' + id + ' of 100</p>' +
      '<h1 class="ch-title">' + esc(c.title) + '</h1>' +
      '<section class="box tldr"><h2>TL;DR</h2><p>' + inlineMd(c.tldr) + '</p></section>' +
      '<div class="body">' + md(c.body) + '</div>' +
      '<section class="box real"><h2>Real-world case</h2><p>' + inlineMd(c.real) + '</p></section>' +
      '<div class="done-bar">' +
        '<button class="complete' + (isDone ? " on" : "") + '" data-toggle="' + id + '" aria-pressed="' + isDone + '">' +
          '<span class="tick' + (isDone ? " on" : "") + '">' + TICK + '</span>' + (isDone ? "Completed" : "Mark as complete") + '</button>' +
        '<div class="nav">' +
          '<button class="btn" data-go="' + (id - 1) + '"' + (id === 1 ? " disabled" : "") + '>Previous</button>' +
          '<button class="btn" data-go="' + (id + 1) + '"' + (id === 100 ? " disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>' +
    '</article>';
}

/* ---------- contents view ---------- */
function renderContents(){
  let html = '<div class="contents"><h1>Contents</h1>' +
    '<p class="lead">Twenty parts, five chapters each. Tick a chapter when you finish it; your progress is saved for next time.</p>' +
    '<div class="contents-actions"><button class="btn" data-go="' + firstUnread() + '">' + (done.size ? "Continue with chapter " + firstUnread() : "Start chapter 1") + '</button>' +
    '<button class="btn" id="resetBtn">Reset progress</button></div><div class="grid">';
  for (let p = 1; p <= 20; p++){
    const ids = [1,2,3,4,5].map(k => (p-1)*5 + k);
    const count = ids.filter(i => done.has(i)).length;
    html += '<section class="pcard"><h2>Part ' + p + ': ' + esc(PARTS[p-1]) + '</h2><div class="meta">' + count + ' of 5 complete</div><ol>';
    for (const i of ids){
      html += '<li><button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="Toggle chapter ' + i + '">' + TICK + '</button><a href="#ch-' + i + '">' + i + '. ' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ol></section>";
  }
  document.getElementById("main").innerHTML = html + "</div></div>";
}
function firstUnread(){ for (let i = 1; i <= 100; i++) if (!done.has(i)) return i; return 100; }

/* ---------- routing ---------- */
let lastRendered = null;
function renderAll(){
  const id = currentId();
  renderBank(); renderSide();
  const y = window.scrollY;
  if (id) renderChapter(id); else renderContents();
  if (lastRendered === location.hash) window.scrollTo(0, y);
  lastRendered = location.hash;
}
function route(){
  const id = currentId();
  if (!id && location.hash !== "#contents"){
    let last = 0; try{ last = +localStorage.getItem(LS_LAST) || 0; }catch(e){}
    location.replace("#ch-" + (last >= 1 && last <= 100 ? last : 1));
    return;
  }
  if (id){ try{ localStorage.setItem(LS_LAST, id); }catch(e){} }
  document.body.classList.remove("drawer");
  renderAll();
  window.scrollTo(0, 0);
  const active = document.querySelector(".ch-row.active");
  if (active) active.scrollIntoView({block:"nearest"});
  const tab = document.querySelector(".tab.active");
  if (tab && tab.parentElement){ const r = tab.parentElement; const left = tab.offsetLeft - r.offsetLeft; if (left < r.scrollLeft || left + tab.offsetWidth > r.scrollLeft + r.clientWidth) r.scrollLeft = left - 16; }
}
function go(id){ if (id >= 1 && id <= 100) location.hash = "#ch-" + id; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){ e.preventDefault(); toggle(+t.dataset.toggle); return; }
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled){ go(+g.dataset.go); return; }
  const ph = e.target.closest("[data-part]");
  if (ph){
    const p = +ph.dataset.part;
    const el = ph.parentElement;
    const isOpen = el.classList.toggle("open");
    if (isOpen) openParts.add(p); else openParts.delete(p);
    ph.setAttribute("aria-expanded", isOpen);
    return;
  }
  if (e.target.id === "resetBtn"){
    if (confirm("Clear all 100 ticks? This can’t be undone.")){ done.clear(); saveLocal(); pushRemote(); renderAll(); toast("Progress reset"); }
  }
});
document.getElementById("search").addEventListener("input", renderSide);
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.add("drawer"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = currentId(); if (!id) return;
  if (e.key === "ArrowRight") go(id + 1);
  else if (e.key === "ArrowLeft") go(id - 1);
});
function setTopH(){ document.documentElement.style.setProperty("--top-h", document.getElementById("top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);
window.addEventListener("hashchange", route);
setTopH();
route();
initSync();
</script>
<script src="book-bg.js?v=2"></script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Agents: 200 Chapters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2F5; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#171A21; --muted:#575D6B; --line:#D9DCE4;
  --accent:#5A3E9E; --accent-soft:#ECE6F7; --accent-ink:#FFFFFF;
  --amber:#B97A0B; --tldr-bg:#FFF5DC; --tldr-line:#D49A22;
  --indigo:#155E63; --real-bg:#E2F1F1; --real-line:#2A7C82;
  --code-bg:#181A16; --code-ink:#E6E9E1; --inline-code:#E9ECE4;
  --cell-empty:#DCE0D6; --shadow:0 1px 0 rgba(24,26,22,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
    --accent:#B9A3F0; --accent-soft:#2A2145; --accent-ink:#170F2E;
    --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
    --indigo:#8FD3D6; --real-bg:#10272A; --real-line:#4FA3A8;
    --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
    --cell-empty:#2E332B; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
  --accent:#B9A3F0; --accent-soft:#2A2145; --accent-ink:#170F2E;
  --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
  --indigo:#8FD3D6; --real-bg:#10272A; --real-line:#4FA3A8;
  --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
  --cell-empty:#2E332B; --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header with the memory-bank progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:20px;padding:12px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted)}
.bank{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bank-row{display:flex;gap:4px;flex-wrap:nowrap;min-width:0}
.bank-group{flex:1;min-width:0;display:flex;gap:2px;padding:3px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.cell{flex:1;min-width:2px;max-width:10px;height:18px;border-radius:2px;background:var(--cell-empty);border:0;padding:0;cursor:pointer;transition:background .2s}
.cell.done{background:var(--accent)}
.cell.here{box-shadow:0 0 0 2px var(--amber)}
.bank-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bank-meta strong{color:var(--ink);font-weight:600}
.top-actions{display:flex;gap:8px}
.btn{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.menu-btn{display:none}

/* Shell */
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,76px));height:calc(100dvh - var(--top-h,76px) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg)}
.search{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
.part{margin-bottom:4px}
.part-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:8px;cursor:pointer}
.part-head:hover{background:var(--surface-2)}
.part-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);width:22px;flex:none}
.part-name{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.part-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.part-count.full{color:var(--accent);font-weight:600}
.part-list{list-style:none;margin:0 0 6px;padding:0 0 0 30px;display:none}
.part.open .part-list{display:block}
.ch-row{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:6px}
.ch-row.active{background:var(--accent-soft)}
.ch-row a{flex:1;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.ch-row a .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.tick{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:11px;height:11px;opacity:0}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{opacity:1;color:var(--accent-ink)}
.hidden{display:none!important}

/* Main reading area */
.main{padding:24px 32px 80px;min-width:0}
.crumb{font-size:14px;color:var(--muted);margin:0 0 12px}
.crumb a{color:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;font-size:14px;color:var(--muted);max-width:240px;text-align:left}
.tab .tab-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--cell-empty)}
.tab .dot.on{background:var(--accent)}
article{max-width:780px}
.ch-no{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--accent);font-size:15px;margin:0}
h1.ch-title{font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:6px 0 22px;font-weight:700;text-wrap:balance}
.box{border-radius:10px;padding:16px 18px;margin:0 0 26px;border-left:4px solid}
.box h2{font-size:14px;margin:0 0 6px;font-weight:600}
.box p{margin:0}
.tldr{background:var(--tldr-bg);border-color:var(--tldr-line)}
.tldr h2{color:var(--amber)}
.tldr p{font-size:17px;line-height:1.55}
.real{background:var(--real-bg);border-color:var(--real-line);margin-top:34px}
.real h2{color:var(--indigo)}
.body h3{font-size:20px;margin:30px 0 10px;letter-spacing:-.01em}
.body p{margin:0 0 14px}
.body ul,.body ol{padding-left:22px;margin:0 0 16px}
.body li{margin:4px 0}
.body li input[type=checkbox]{margin-right:6px;accent-color:var(--accent)}
.body code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.88em;background:var(--inline-code);padding:1px 5px;border-radius:4px}
.body pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13.5px;line-height:1.55;margin:0 0 18px}
.body pre code{background:none;padding:0;font-size:inherit;color:inherit}
.table-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.body table{border-collapse:collapse;width:100%;font-size:14px}
.body th,.body td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.body th{background:var(--surface-2);font-weight:600}
.body tr:last-child td{border-bottom:0}
.body strong{font-weight:600}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.complete{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:15px}
.complete .tick{border-color:currentColor;pointer-events:none}
.complete.on{background:var(--accent);color:var(--accent-ink)}
.complete.on .tick{background:var(--accent-ink);border-color:var(--accent-ink)}
.complete.on .tick svg{opacity:1;color:var(--accent)}
.nav{display:flex;gap:8px}
.nav .btn[disabled]{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}

/* Diagrams and charts */
.diagram{margin:0 0 20px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
.diagram svg{display:block;margin:0 auto;height:auto}
.diagram.loading{color:var(--muted);font-size:14px}
.chart{margin:0 0 20px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chart figcaption{font-weight:600;font-size:14px;margin:0 0 10px}
.bar-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.bar-label{color:var(--ink);line-height:1.3}
.bar-track{height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar{display:block;height:100%;background:var(--accent);border-radius:7px 0 0 7px}
.bar-val{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.chart-note{font-size:12px;color:var(--muted);margin-top:6px}

/* Contents view */
.contents h1{font-size:32px;margin:0 0 6px;letter-spacing:-.02em}
.contents .lead{color:var(--muted);margin:0 0 24px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.pcard h2{font-size:15px;margin:0 0 2px;line-height:1.3}
.pcard .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pcard ol{list-style:none;padding:0;margin:0}
.pcard li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13.5px;line-height:1.35}
.pcard li a{color:var(--ink);text-decoration:none;flex:1}
.pcard li a:hover{text-decoration:underline}
.contents-actions{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}

/* Mobile */
.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);height:auto;z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .menu-btn{display:inline-block}
  .main{padding:18px 16px 60px}
  .top-inner{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand{flex:1}
  .bank{order:3;flex-basis:100%}
  .bank-row{gap:3px}
  .bank-group{gap:1px;padding:2px}
  .cell{height:12px;max-width:none;min-width:0}
  .bank-row{flex-wrap:wrap;row-gap:3px;gap:3px}
  .bank-group{flex:0 0 calc(10% - 2.7px);gap:1px;padding:1px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  <div class="top-inner">

</header>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const CHAPTERS = [{"id": 1, "title": "What an AI agent is", "tldr": "An AI agent is a system that pursues a goal by repeatedly deciding what to do, taking actions through tools, observing results and adapting. The model directs the process; the surrounding software supplies tools, memory, limits and safety.", "real": "Russell and Norvig’s textbook “Artificial Intelligence: A Modern Approach” (1995) defined an agent as anything that perceives its environment through sensors and acts on it through actuators; LLM agents apply this idea with language models as the decision maker.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A goal-directed loop: perceive → decide → act → observe |\n| Why it matters | Automates multi-step work that can’t be scripted in advance |\n| When to use | Variable tasks with tools and verifiable progress |\n| When not to use | Fixed procedures a workflow handles cheaper and more reliably |\n| Trade-off | Flexibility vs predictability, cost and latency |\n| Failure mode | Confidently wrong actions compounding across steps |\n| Production habit | Start with the simplest design that meets the eval bar |\n\n### Core loop\n\n```mermaid\nflowchart LR\n  GOAL[Goal] --> PERCEIVE[Perceive: context + observations]\n  PERCEIVE --> DECIDE[Decide next action]\n  DECIDE --> ACT[Act via tool]\n  ACT --> OBSERVE[Observe result]\n  OBSERVE --> PERCEIVE\n  DECIDE --> DONE[Finish when goal met or limit hit]\n```"}, {"id": 2, "title": "A short history of agents", "tldr": "Agents evolved from rule-based expert systems and belief–desire–intention (BDI) architectures, through reinforcement learning agents, to LLM agents that plan and act with natural language and tools. Early LLM agents were unreliable; tool training, reasoning models and better harnesses made them practical.", "real": "AutoGPT became one of GitHub’s fastest-growing repositories in early 2023 by chaining GPT-4 calls autonomously, but its frequent loops and failures showed that raw autonomy without good tools, limits and evaluation was not enough.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The lineage of agent architectures |\n| Why it matters | Old lessons (goals, plans, environment models) still apply |\n| Key shift | From hand-coded rules to model-driven decisions |\n| Trade-off | Generality of LLM agents vs reliability of narrow systems |\n| Failure mode | Repeating 2023’s mistake: autonomy without verification |\n| Production habit | Combine LLM flexibility with deterministic controls |\n\n### Timeline\n\n| Era | Approach | Example |\n|---|---|---|\n| 1970s–80s | Expert systems, rules | MYCIN |\n| 1990s | BDI agents, multi-agent systems | Rao & Georgeff BDI (1995) |\n| 2010s | Reinforcement learning agents | AlphaGo (2016) |\n| 2022–23 | LLM reasoning + acting | ReAct, AutoGPT, BabyAGI |\n| 2024–26 | Tool-trained models, coding and browser agents, protocols | Claude Code, Codex, MCP, A2A |"}, {"id": 3, "title": "Why agents work now", "tldr": "Several advances made agents practical: models trained for tool use, reasoning models that plan, longer context windows, cheaper inference, standard protocols for tools, and better harnesses. Task lengths agents can complete have grown rapidly.", "real": "METR reported in March 2025 that the length of software tasks frontier AI agents could complete with 50% reliability had been doubling roughly every seven months over the previous six years.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The enabling trends behind modern agents |\n| Why it matters | Explains what is now feasible and what remains hard |\n| Key enablers | Tool use, reasoning, long context, cost decline, MCP, sandboxes |\n| Trade-off | Capability growth vs persistent reliability gaps |\n| Failure mode | Assuming benchmark progress transfers to your domain |\n| Production habit | Re-test feasibility with each major model release |\n\n### Enablers\n\n| Enabler | Effect on agents |\n|---|---|\n| Tool-use training | Accurate function calls |\n| Reasoning models | Better planning and debugging |\n| Long context | More history and documents per step |\n| Prompt caching, cheaper tokens | Affordable multi-step loops |\n| Standard protocols (MCP) | Reusable integrations |\n| Sandboxed execution | Safe code and shell actions |"}, {"id": 4, "title": "Agents vs chatbots, copilots and workflows", "tldr": "A chatbot answers; a copilot assists a human inside their work; a workflow executes predefined steps with models; an agent decides its own steps toward a goal. Many products mix these; name the design honestly to set the right expectations and controls.", "real": "Gartner warned in June 2025 about “agent washing”, the rebranding of chatbots and robotic process automation as agents, estimating that only a small fraction of vendors claiming agentic AI offered genuinely agentic capabilities.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A vocabulary for AI system types |\n| Why it matters | Different designs need different controls and evals |\n| Trade-off | Marketing appeal of “agent” vs accurate expectations |\n| Failure mode | Calling a workflow an agent, then granting it agent-level trust |\n| Production habit | Document who decides each step: code, model or human |\n\n### Comparison\n\n| Type | Who decides steps | Acts on systems | Example |\n|---|---|---|---|\n| Chatbot | Fixed pattern | Rarely | FAQ bot |\n| Copilot | Human | Through human | Writing assistant |\n| Workflow | Code | Yes, fixed steps | Invoice extraction pipeline |\n| Agent | Model | Yes, chosen dynamically | Coding agent fixing a bug |"}, {"id": 5, "title": "Anatomy of an agent", "tldr": "Every agent has a model, instructions, tools, context and memory, a control loop, an environment it acts in, and safeguards: budgets, permissions, approvals and monitoring. Weakness in any part limits the whole agent.", "real": "OpenAI’s 2025 “A practical guide to building agents” described agents as built from three core components (model, tools and instructions) plus orchestration and guardrails, a breakdown consistent with other vendors’ guidance.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The component breakdown of an agent |\n| Why it matters | A shared checklist for design and review |\n| Trade-off | Each safeguard adds friction or latency |\n| Failure mode | Strong model wrapped in weak tools and no limits |\n| Production habit | Review every component in design docs |\n\n### Components\n\n```mermaid\nflowchart TB\n  MODEL[Model] --- INSTR[Instructions]\n  MODEL --- TOOLS[Tools]\n  MODEL --- CTX[Context + memory]\n  LOOP[Control loop] --- MODEL\n  LOOP --- ENV[Environment: APIs, files, browser, sandbox]\n  LOOP --- SAFE[Safeguards: budgets, permissions, approvals]\n  LOOP --- OBS[Tracing + evaluation]\n```"}, {"id": 6, "title": "The perceive–reason–act loop in practice", "tldr": "Each iteration assembles context, asks the model for the next action, validates and executes it, records the observation, and checks stop conditions. Most reliability engineering happens around this loop, not inside the model.", "real": "The ReAct paper (Yao et al., 2022) showed that interleaving reasoning traces with actions and observations outperformed reasoning-only and acting-only approaches on question answering and interactive decision tasks.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The runtime cycle of an agent |\n| Why it matters | Where validation, limits and logging live |\n| Per-step work | Build context, call model, validate action, execute, observe, check stop |\n| Trade-off | More checks per step vs speed |\n| Failure mode | Executing malformed or unauthorized actions without validation |\n| Production habit | Log every step with inputs, action, result, tokens |\n\n### One iteration\n\n```mermaid\nsequenceDiagram\n  participant H as Harness\n  participant M as Model\n  participant T as Tool\n  H->>M: Context + tools\n  M-->>H: Proposed action\n  H->>H: Validate + authorize\n  H->>T: Execute\n  T-->>H: Observation\n  H->>H: Update state, check stop rules\n```"}, {"id": 7, "title": "Environments and action spaces", "tldr": "An agent’s environment is everything it can observe and change: APIs, databases, files, browsers, terminals, other agents and humans. The action space is the set of actions it can take. Designing both carefully is the main lever on capability and safety.", "real": "The SWE-agent project (Princeton, 2024) showed that redesigning the agent–computer interface, with purpose-built commands for viewing, searching and editing files, substantially improved a model’s success at fixing real GitHub issues compared with raw shell access.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The world an agent perceives and the actions available |\n| Why it matters | Agents can only do and see what the environment exposes |\n| Design levers | Tool set, observation format, permissions, sandbox |\n| Trade-off | Rich action spaces enable more but fail in more ways |\n| Failure mode | Giving raw, low-level actions where high-level tools would be safer |\n| Production habit | Design observations to be concise and informative |\n\n### Action space types\n\n| Type | Example | Risk |\n|---|---|---|\n| Structured API calls | get_order(id) | Low–medium |\n| Code execution | Run Python in sandbox | Medium |\n| Shell commands | bash in container | Medium–high |\n| GUI actions | Click, type | High (injection, errors) |\n| Communication | Email, chat | High (external effects) |"}, {"id": 8, "title": "What agents can and can’t do today", "tldr": "Agents are strong at well-scoped, verifiable, tool-rich tasks such as coding with tests, research with citations and structured operations. They remain weak at very long tasks, ambiguous goals, adversarial environments and work without clear success checks.", "real": "OSWorld (2024), a benchmark of real computer tasks, reported humans completing about 72% of tasks while the best model at launch completed about 12%; scores rose substantially in the following years but computer use remained less reliable than API-based agents.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A realistic capability map |\n| Why it matters | Prevents overpromising and failed projects |\n| Strong areas | Code with tests, retrieval + synthesis, form-like operations |\n| Weak areas | Long ambiguous projects, adversarial web, irreversible decisions |\n| Trade-off | Ambition vs reliability |\n| Failure mode | Picking a first use case in the weak zone |\n| Production habit | Pilot where success is checkable and errors are recoverable |\n\n### Suitability matrix\n\n| | Verifiable outcome | Hard to verify |\n|---|---|---|\n| Reversible actions | Best fit | Use with review |\n| Irreversible actions | Approvals required | Avoid autonomy |"}, {"id": 9, "title": "The economics of agents", "tldr": "Agents cost more per task than single calls because they make many model calls with growing context. Measure cost per successful task, compare it with the human or workflow alternative, and design to reduce steps, tokens and retries.", "real": "Anthropic reported in 2025 that agents typically use about 4 times more tokens than chat interactions and its multi-agent research system about 15 times more, which is why agent designs must be justified by task value.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Cost structure of agentic work |\n| Why it matters | Determines which use cases are viable |\n| Key metric | Cost per successful task (including retries and review) |\n| Trade-off | More steps and reasoning improve success but cost more |\n| Failure mode | Measuring cost per call, missing total cost per task |\n| Production habit | Budgets per task; dashboards by use case |\n\n### Cost model\n\n```\ncost_per_task = Σ_steps (input_tokens × in_price + output_tokens × out_price) + tool costs\ncost_per_success = cost_per_task ÷ success_rate\nvalue_per_task = human_cost_avoided − cost_per_success − review_cost\n```\n\n### Relative token use\n\n```chart\n{\"title\": \"Relative token use (Anthropic, 2025)\", \"unit\": \"×\", \"data\": [[\"Chat interaction\", 1], [\"Single agent\", 4], [\"Multi-agent research\", 15]]}\n```"}, {"id": 10, "title": "An agent maturity model", "tldr": "Organizations progress from assisted features to supervised agents, bounded autonomous agents and finally agent platforms with governance. Each stage requires stronger evaluation, observability and controls before moving on.", "real": "Gartner predicted in October 2024 that by 2028 a third of enterprise software applications would include agentic AI and that about 15% of day-to-day work decisions would be made autonomously, while also warning many projects would fail without clear value.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A staged path for adopting agents |\n| Why it matters | Avoids jumping to autonomy without foundations |\n| Trade-off | Speed of adoption vs risk |\n| Failure mode | Autonomous production agents before tracing and evals exist |\n| Production habit | Advance stages only on measured evidence |\n\n### Stages\n\n| Stage | Description | Prerequisites |\n|---|---|---|\n| 1 Assisted | AI suggests, humans act | Basic evals |\n| 2 Supervised | Agent acts with approval | Tracing, approval UX |\n| 3 Bounded | Agent acts within policy limits | pass^k evals, guardrails, audits |\n| 4 Platform | Many agents, shared governance | Gateway, registry, identity, cost control |"}, {"id": 11, "title": "How LLM agents reason", "tldr": "LLM agents reason by generating intermediate thoughts that decompose problems, interpret observations and choose actions. Reasoning quality depends on the model, the context provided, and whether the agent can test its ideas against the environment.", "real": "Chain-of-thought prompting (Wei et al., 2022) showed large gains on multi-step problems, and reasoning models released from late 2024 onward were trained with reinforcement learning to produce long internal reasoning before answering.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Intermediate thinking that guides actions |\n| Why it matters | Better decisions on multi-step tasks |\n| Sources of strength | Model capability, clear goals, relevant context, feedback |\n| Trade-off | More reasoning tokens vs latency and cost |\n| Failure mode | Plausible reasoning built on a wrong assumption |\n| Production habit | Ground reasoning in tool observations, not memory |\n\n### Reasoning modes\n\n| Mode | Use |\n|---|---|\n| Brief rationale per step | Routine tool use |\n| Extended thinking before acting | Planning, debugging, hard decisions |\n| Explicit plan document | Long tasks |\n| External verification | Anything with checkable outcomes |"}, {"id": 12, "title": "ReAct: reasoning and acting together", "tldr": "ReAct agents alternate thoughts, actions and observations. Thoughts explain intent, actions gather evidence or change the world, and observations correct the agent’s beliefs. Modern tool-calling APIs implement ReAct natively.", "real": "In the 2022 ReAct paper, combining reasoning with Wikipedia API actions reduced hallucination on question answering compared with chain-of-thought alone, because the agent could look facts up instead of inventing them.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Interleaved thought → action → observation |\n| Why it matters | Grounds reasoning in real information |\n| When to use | Default pattern for tool-using agents |\n| Trade-off | Step-by-step loops are slower than single calls |\n| Failure mode | Ignoring observations that contradict the plan |\n| Production habit | Keep observations concise so they’re actually read |\n\n### Trace example\n\n```text\nThought: I need the customer's latest order before answering.\nAction: search_orders(customer_id=\"cus_42\", status=\"any\")\nObservation: #981 shipped 2026-11-10; #990 pending payment\nThought: The question is about the pending order; check payment status.\nAction: get_payment(order_id=\"990\")\nObservation: card declined 2026-11-12\nAnswer: Order #990 is waiting because the card was declined...\n```"}, {"id": 13, "title": "Reasoning models in agents", "tldr": "Reasoning models think at length before responding, improving planning, debugging and complex tool sequences. Use them where decisions are hard; use faster models for routine steps; and control reasoning effort per step.", "real": "OpenAI’s o1 (September 2024), DeepSeek-R1 (January 2025) and Claude models with extended thinking (from February 2025) introduced controllable reasoning, and later models added the ability to think between tool calls.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Models that generate long internal reasoning |\n| Why it matters | Higher success on difficult multi-step tasks |\n| When to use | Planning, code debugging, ambiguous analysis |\n| When not to use | Simple routing, extraction, formatting |\n| Trade-off | Accuracy vs latency and token cost |\n| Failure mode | Overthinking trivial steps |\n| Production habit | Route by step type; set effort levels |\n\n### Effort by step\n\n| Step | Effort |\n|---|---|\n| Initial planning | High |\n| Routine lookups | Low |\n| Interpreting confusing errors | Medium–high |\n| Final answer formatting | Low |"}, {"id": 14, "title": "Task decomposition", "tldr": "Break goals into subgoals small enough to complete and verify. Good decomposition follows natural boundaries (files, entities, questions), orders dependencies, and defines what “done” means for each piece.", "real": "Least-to-most prompting (Zhou et al., 2022) improved performance on complex reasoning by first decomposing problems into simpler subproblems and solving them in sequence.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Splitting goals into manageable subtasks |\n| Why it matters | Smaller steps are more reliable and checkable |\n| Good subtasks | Clear output, verifiable, minimal dependencies |\n| Trade-off | Too fine-grained adds overhead |\n| Failure mode | Subtasks without completion criteria |\n| Production habit | Each subtask has a check: test, query, citation |\n\n### Example\n\n```text\nGoal: \"Add CSV export to the reports page\"\n1. Find report data source and existing export code     → done when files identified\n2. Add export endpoint returning CSV                     → done when unit test passes\n3. Add button in UI calling endpoint                     → done when UI test passes\n4. Update docs                                           → done when docs build\n```"}, {"id": 15, "title": "Search over reasoning paths", "tldr": "Some agents explore multiple candidate plans or actions and evaluate them before committing, using tree search, beam search or sampling with voting. This improves hard problems but multiplies cost; use it selectively.", "real": "Tree of Thoughts (Yao et al., 2023) let models explore and evaluate multiple reasoning branches, and Language Agent Tree Search (LATS, Zhou et al., 2023) combined Monte Carlo tree search with LLM agents to improve results on programming and web tasks.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Exploring alternatives before choosing |\n| Why it matters | Escapes dead ends a single path would hit |\n| When to use | Hard problems with cheap evaluation (tests, scorers) |\n| When not to use | Tasks with side effects that can’t be undone |\n| Trade-off | Large cost multiplier |\n| Failure mode | Branching without a good evaluator |\n| Production habit | Only search where you can score candidates objectively |\n\n### Pattern\n\n```mermaid\nflowchart TB\n  ROOT[Problem] --> A[Candidate A]\n  ROOT --> B[Candidate B]\n  ROOT --> C[Candidate C]\n  A --> EA[Score: tests pass 3/5]\n  B --> EB[Score: tests pass 5/5]\n  C --> EC[Score: tests pass 1/5]\n  EB --> PICK[Continue with B]\n```"}, {"id": 16, "title": "Reflection and learning from failure", "tldr": "Reflection asks the agent to analyze what went wrong and adjust its approach, ideally using concrete feedback such as test failures or error messages. Stored reflections can help future attempts avoid repeated mistakes.", "real": "Reflexion (Shinn et al., 2023) improved agent success on coding and decision-making benchmarks by having agents write verbal reflections after failures and use them as memory in subsequent attempts.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Self-analysis after failures to improve next attempts |\n| Why it matters | Converts errors into better strategies |\n| When effective | With external signals: failing tests, error logs, judge feedback |\n| Trade-off | Extra steps; weak without real feedback |\n| Failure mode | Repeating the same fix after “reflecting” |\n| Production habit | Record tried approaches to prevent repetition |\n\n### Reflection prompt\n\n```text\nThe last attempt failed. Evidence:\n{test_output}\n\n1. What is the most likely root cause?\n2. What did previous attempts already try? (see notes)\n3. What different approach will you try next, and how will you verify it?\n```"}, {"id": 17, "title": "Verification and self-checking", "tldr": "Agents should verify work before declaring success: run tests, re-query data, check citations, validate outputs against schemas and confirm actions took effect. Verification is the strongest reliability lever available.", "real": "Research on LLM self-correction (Huang et al., 2023) found that models often fail to fix reasoning errors without external feedback, which is why production agents rely on tool-based verification rather than self-assessment alone.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Checking outcomes against objective evidence |\n| Why it matters | Prevents false “done” claims |\n| Methods | Tests, read-after-write checks, schema validation, citations, second-model review |\n| Trade-off | More steps vs fewer silent failures |\n| Failure mode | Agent says “fixed” without running anything |\n| Production habit | Require a verification artifact in the final report |\n\n### Verification by task type\n\n| Task | Verification |\n|---|---|\n| Code change | Tests + lint pass |\n| Database update | Read back the record |\n| Research answer | Each claim has a source |\n| Email draft | Template + recipient checks |\n| File generation | Open and validate the file |"}, {"id": 18, "title": "Uncertainty and asking clarifying questions", "tldr": "Good agents recognize ambiguity and missing information, and ask focused questions instead of guessing, especially before costly or irreversible actions. Balance asking (interruptions) with assuming (risk), and state assumptions explicitly.", "real": "Benchmarks with simulated users, such as tau-bench (2024), evaluate whether agents gather required information from users and follow policies, reflecting that many real failures come from acting on incomplete information.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Detecting ambiguity and resolving it with the user |\n| Why it matters | Wrong assumptions waste work or cause harm |\n| When to ask | Ambiguous goal, missing required data, risky action |\n| When to assume | Low-risk defaults; state the assumption |\n| Trade-off | Fewer questions vs more errors |\n| Failure mode | Asking many questions at once, or none |\n| Production habit | One focused question, with a proposed default |\n\n### Decision rule\n\n```mermaid\nflowchart TD\n  AMB{Ambiguity?} -- no --> ACT[Proceed]\n  AMB -- yes --> RISK{Wrong guess costly or irreversible?}\n  RISK -- yes --> ASK[Ask one focused question]\n  RISK -- no --> ASSUME[Proceed with stated assumption]\n```"}, {"id": 19, "title": "Goal management", "tldr": "Agents must keep the original goal in focus across many steps, track subgoals and progress, and avoid drifting into tangents. Restating the goal, keeping a visible plan and checking progress against acceptance criteria prevent drift.", "real": "The 2025 MAST study of multi-agent failures found “task derailment” and disobeying task specifications among common failure modes, showing that goal drift is a recurring problem in long agent runs.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Maintaining focus on the objective and its criteria |\n| Why it matters | Long runs drift as context fills with details |\n| Techniques | Goal restated in context, plan file, progress checks |\n| Trade-off | Rigid focus may miss important discoveries |\n| Failure mode | Agent “improves” unrelated code or researches side topics |\n| Production habit | Acceptance criteria written at the start and checked at the end |\n\n### Goal block kept in context\n\n```text\n<goal>\nFix failing checkout tests in services/checkout only.\nDone when: `pytest services/checkout` passes; no changes outside services/checkout.\nOut of scope: refactoring, dependency upgrades.\n<\/goal>\n```"}, {"id": 20, "title": "Common reasoning failures in agents", "tldr": "Agents fail in recognizable ways: hallucinated facts or tool results, premature completion, loops, ignoring errors, overconfidence, tool misuse, goal drift and following injected instructions. Name these failures in reviews and evals so they can be measured and fixed.", "real": "The “Seven Failure Points” study of RAG systems (2024) and the MAST taxonomy of multi-agent failures (2025) both showed that cataloguing failure types from real traces is the most effective starting point for improving LLM systems.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A taxonomy of agent reasoning failures |\n| Why it matters | You can’t fix what you don’t name |\n| Trade-off | Detailed taxonomies take effort to apply |\n| Production habit | Tag failed traces weekly; track counts |\n\n### Failure → mitigation\n\n| Failure | Mitigation |\n|---|---|\n| Hallucinated facts | Require tool lookup + citations |\n| Premature “done” | Verification artifacts |\n| Loops | Repeated-action detection, budgets |\n| Ignoring tool errors | Clear error messages, retry policy |\n| Wrong tool choice | Better descriptions, fewer overlapping tools |\n| Goal drift | Goal block, plan checks |\n| Injected instructions | Treat content as data; privilege separation |"}, {"id": 21, "title": "Defining the agent’s job", "tldr": "Start with a precise job description: who the agent serves, which tasks it handles, which it must refuse or escalate, what systems it touches, and what a successful outcome looks like. Narrow scope is the foundation of reliability.", "real": "Successful early customer support agents, such as Klarna’s 2024 assistant, focused on high-volume routine requests (order status, refunds, payments) and escalated complex cases to humans rather than attempting everything.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The scope and mission of an agent |\n| Why it matters | Scope drives tools, evals, risk and cost |\n| Include | Users, tasks in/out of scope, systems, outcomes |\n| Trade-off | Broad scope attracts users; narrow scope works reliably |\n| Failure mode | “General assistant for everything” as a first agent |\n| Production habit | Expand scope only after evals pass on current scope |\n\n### Job definition template\n\n| Field | Example |\n|---|---|\n| Users | Customers of an online store |\n| In scope | Order status, returns within policy, address changes before shipping |\n| Out of scope | Legal complaints, fraud claims → human |\n| Systems | Orders API, returns API, policy knowledge base |\n| Success | Issue resolved, policy followed, customer satisfied |"}, {"id": 22, "title": "Success criteria and metrics", "tldr": "Define success before building: task completion criteria, quality thresholds, safety rules, latency and cost budgets, and business outcomes. These become the eval suite and the launch gate.", "real": "Sierra’s tau-bench (2024) defined success by comparing the final database state after an agent conversation with the expected state, an outcome-based criterion that teams adapt for their own agents.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Measurable definition of a good agent run |\n| Why it matters | Enables evals, comparisons and launch decisions |\n| Layers | Outcome, policy compliance, efficiency, user experience |\n| Trade-off | Strict criteria may reject acceptable alternatives |\n| Failure mode | “It seems to work” as the launch criterion |\n| Production habit | Write criteria in the design doc before coding |\n\n### Example criteria\n\n| Criterion | Target |\n|---|---|\n| Correct final state (tau-style) | ≥ 90% |\n| Consistency (pass^4) | ≥ 75% |\n| Policy violations | 0 |\n| Median steps | ≤ 6 |\n| Cost per task | ≤ $0.05 |\n| p95 duration | ≤ 30 s |"}, {"id": 23, "title": "Choosing the right autonomy level", "tldr": "Decide per action how independent the agent is: suggest only, act with approval, act within limits, or act freely. Base the decision on error cost, reversibility, measured reliability and regulatory requirements.", "real": "Browser agents such as OpenAI’s ChatGPT agent (2025) act autonomously for browsing but pause for user confirmation before consequential actions such as purchases or sending messages, an example of per-action autonomy.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Policy defining when the agent needs a human |\n| Why it matters | Balances throughput with safety |\n| Trade-off | Approvals slow work; autonomy risks errors |\n| Failure mode | One global autonomy setting for all actions |\n| Production habit | Autonomy table per action, reviewed with data |\n\n### Autonomy table\n\n| Action | Reversible? | Error cost | Autonomy |\n|---|---|---|---|\n| Look up order | Yes | Low | Auto |\n| Update address (before ship) | Yes | Low | Auto + notify |\n| Issue refund ≤ $50 | Partly | Medium | Auto within limit |\n| Issue refund > $50 | Partly | High | Human approval |\n| Close account | No | High | Human only |"}, {"id": 24, "title": "Writing the system prompt", "tldr": "An agent’s system prompt defines role, goals, rules, tool usage guidance, communication style, escalation behavior and output conventions. Write it at the right altitude: specific enough to guide, general enough to handle unforeseen cases.", "real": "Anthropic’s 2025 context engineering guidance warned against both extremes: hard-coding brittle if-else logic in prompts and giving vague high-level guidance, recommending clear sections and heuristics that let the model handle new situations.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Persistent instructions governing agent behavior |\n| Why it matters | Largest single influence on decisions |\n| Sections | Role, goals, rules, tool guidance, style, escalation, format |\n| Trade-off | Detail vs length and contradictions |\n| Failure mode | Prompt grows by patching every incident, becoming inconsistent |\n| Production habit | Version prompts; test changes with evals |\n\n### Skeleton\n\n```text\n<role>You resolve order issues for Acme customers.<\/role>\n<goals>Resolve the customer's issue in as few turns as possible while following policy.<\/goals>\n<rules>\n- Verify identity before discussing order details.\n- Refunds above $50 require human approval: use request_approval.\n- Never promise delivery dates the tools don't confirm.\n<\/rules>\n<tools_guidance>Search orders before answering order questions. If a tool fails twice, escalate.<\/tools_guidance>\n<style>Friendly, concise, plain language.<\/style>\n<escalation>Use handoff_to_human for legal threats, fraud, or repeated frustration.<\/escalation>\n```"}, {"id": 25, "title": "Examples in agent prompts", "tldr": "Examples show how the agent should handle representative and tricky situations: tool sequences, escalations and tone. Use a few diverse, canonical examples rather than long lists of edge cases, and avoid examples the model will copy literally.", "real": "Anthropic’s guidance on effective context engineering recommended curating a set of diverse, canonical examples rather than stuffing prompts with every edge case, since examples act as “pictures” of expected behavior for the model.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Demonstrations of desired agent behavior |\n| Why it matters | Conveys judgment that rules can’t capture |\n| Good examples | Diverse, realistic, showing tool use and escalation |\n| Trade-off | Tokens vs consistency |\n| Failure mode | Agent repeating example phrasing or values verbatim |\n| Production habit | Rotate and test examples; keep them short |\n\n### Example format\n\n```text\n<example>\nCustomer: \"Where's my order? It's been two weeks.\"\nAgent actions: search_orders → get_shipment\nAgent: \"Your order #981 shipped on Nov 10 and is with the courier; tracking shows delivery\nexpected Nov 18. Want me to send the tracking link?\"\n<\/example>\n```"}, {"id": 26, "title": "Designing the action space", "tldr": "Choose actions at the level of the task, not the underlying systems: “issue_refund(order, amount, reason)” instead of raw database writes. Fewer, higher-level, well-guarded actions make agents more reliable and safer.", "real": "Anthropic’s 2025 guidance “Writing effective tools for agents” recommended building tools around high-impact workflows (for example a single schedule_event tool instead of separate availability and booking tools) and consolidating multi-step operations.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The set of actions exposed to the agent |\n| Why it matters | Determines capability, error rate and risk |\n| Principles | Task-level, few, composable, guarded |\n| Trade-off | High-level tools are safer but less flexible |\n| Failure mode | Exposing generic “run_sql” to a customer-facing agent |\n| Production habit | Review action list against the job definition |\n\n### Low-level vs task-level\n\n| Low-level (avoid for most agents) | Task-level (prefer) |\n|---|---|\n| run_sql(query) | get_order(order_id) |\n| http_request(url, method, body) | create_support_ticket(summary, priority) |\n| write_file(path, content) | update_config(key, value) with validation |"}, {"id": 27, "title": "Environment design and sandboxes", "tldr": "Build the environment the agent operates in: sandboxes for code and browsing, test data, simulators for evaluation, and staging copies of systems. Good environments make agents safe to run and easy to evaluate.", "real": "Agent benchmarks such as tau-bench and WebArena provide simulated environments (mock databases, self-hosted websites) so agents can act freely during evaluation without touching real systems, an approach teams replicate internally.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The controlled world where agents act |\n| Why it matters | Safety in production; repeatability in evaluation |\n| Components | Sandboxes, fixtures, staging APIs, simulated users |\n| Trade-off | Realism vs isolation and cost |\n| Failure mode | Testing agents only against production systems |\n| Production habit | Every agent has a resettable test environment |\n\n### Environment tiers\n\n| Tier | Use |\n|---|---|\n| Unit fixtures | Tool tests with fake data |\n| Simulated environment | Eval suites (mock APIs, simulated users) |\n| Staging | Realistic integration tests |\n| Production (sandboxed actions) | Real work with guardrails |"}, {"id": 28, "title": "Guardrails by design", "tldr": "Build safety into the agent’s structure: scoped tools, policy checks in code, approval steps, input and output filters, budgets and kill switches. Design-time guardrails are more reliable than instructions alone.", "real": "The OWASP Top 10 for LLM Applications (2025) lists excessive agency, giving agents too much functionality, permission or autonomy, as a top risk and recommends limiting extensions and permissions and requiring human approval for high-impact actions.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structural safety controls around the agent |\n| Why it matters | Prompts can be ignored or overridden |\n| Layers | Tool scope, policy engine, approvals, filters, budgets, monitoring |\n| Trade-off | Safety vs flexibility |\n| Failure mode | “The prompt says not to” as the only control |\n| Production habit | Every rule that matters is enforced in code |\n\n### Enforcement placement\n\n```mermaid\nflowchart LR\n  MODEL[Model proposes action] --> SCHEMA[Schema validation]\n  SCHEMA --> POLICY[Policy engine: limits, eligibility]\n  POLICY --> APPROVAL{Needs approval?}\n  APPROVAL -- yes --> HUMAN[Human]\n  APPROVAL -- no --> EXEC[Execute]\n  HUMAN --> EXEC\n```"}, {"id": 29, "title": "Failure handling and escalation design", "tldr": "Plan what happens when the agent can’t succeed: tool failures, missing information, policy conflicts, user frustration or low confidence. Good escalation hands off with a summary so humans don’t start over.", "real": "Customer service platforms such as Intercom Fin and Zendesk’s AI agents support handoff to human agents with conversation summaries, because seamless escalation strongly affects customer satisfaction when AI can’t resolve an issue.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Planned paths when the agent should stop or hand off |\n| Why it matters | Failures are inevitable; bad failures lose trust |\n| Triggers | Repeated tool errors, policy limits, low confidence, user request |\n| Trade-off | Escalating too often vs too rarely |\n| Failure mode | Agent looping or apologizing instead of escalating |\n| Production habit | Escalation includes summary, attempted actions, customer data |\n\n### Handoff summary\n\n```json\n{\"reason\": \"refund above limit\", \"customer\": \"cus_42\", \"order\": \"990\",\n \"summary\": \"Customer wants refund of $120 for damaged item; photos received.\",\n \"actions_taken\": [\"verified identity\", \"checked return eligibility: eligible\"],\n \"suggested_next_step\": \"approve refund\"}\n```"}, {"id": 30, "title": "The agent design document", "tldr": "Capture the design in a short document: job, users, scope, success criteria, autonomy table, tools with risk levels, context sources, memory, guardrails, escalation, evals, budgets, rollout plan and owners. Review it before building.", "real": "Engineering organizations commonly require design documents for significant systems, and AI teams extend them with agent-specific sections such as autonomy, tool risk and evaluation, which reviewers use to catch issues before code exists.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A single reviewed specification for an agent |\n| Why it matters | Aligns teams; surfaces risks early |\n| Trade-off | Writing time vs avoided rework |\n| Failure mode | Building first, documenting never |\n| Production habit | Update the doc when scope or tools change |\n\n### Template\n\n| Section | Content |\n|---|---|\n| Job and users | Scope in/out |\n| Success criteria | Metrics and thresholds |\n| Autonomy table | Per-action policy |\n| Tools | Name, purpose, risk tier, auth |\n| Context and memory | Sources, retention |\n| Guardrails | Code-enforced rules |\n| Escalation | Triggers and handoff format |\n| Evals | Suites, pass^k targets |\n| Budgets | Steps, tokens, cost, time |\n| Rollout | Stages and gates |\n| Owners | Engineering, product, risk |"}, {"id": 31, "title": "The agent–computer interface", "tldr": "Tools are the interface between agent and world, and they should be designed for models the way user interfaces are designed for humans: simple, consistent, informative and forgiving. Interface quality strongly affects agent success.", "real": "The SWE-agent paper (2024) coined the term “agent-computer interface” (ACI) and showed that custom file viewing, search and editing commands with concise feedback improved issue-resolution rates over giving the model a plain Linux shell.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The design of tools and observations for agents |\n| Why it matters | Agents fail more from bad interfaces than weak reasoning |\n| Principles | Simple actions, informative feedback, guardrails against common mistakes |\n| Trade-off | Custom interfaces cost effort vs generic tools |\n| Failure mode | Huge, unstructured outputs the model can’t use |\n| Production habit | Watch agent traces to find interface friction |\n\n### ACI principles\n\n| Principle | Example |\n|---|---|\n| Concise observations | Show 100 lines around a match, not the whole file |\n| Informative errors | “Line 42 has a syntax error after your edit” |\n| Prevent common mistakes | Linter runs automatically after edits |\n| Consistent conventions | Same parameter names across tools |"}, {"id": 32, "title": "Tool granularity", "tldr": "Choose tool size deliberately. Too granular means many calls and more chances to fail; too coarse means inflexible tools. Group operations that are always used together, and split operations with different risk levels.", "real": "Anthropic’s guidance on writing tools for agents suggested consolidating multi-step operations into single tools, such as a get_customer_context tool combining recent transactions and notes, instead of exposing many small endpoints.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The scope of work each tool performs |\n| Why it matters | Affects number of steps, reliability and cost |\n| Group when | Operations always chained together |\n| Split when | Different permissions, risks or frequency |\n| Trade-off | Fewer calls vs flexibility |\n| Failure mode | Agent making 12 calls to answer a simple question |\n| Production habit | Measure average calls per task; consolidate hot paths |\n\n### Example\n\n| Too granular | Better |\n|---|---|\n| list_users, get_user, get_user_orders, get_order_items | get_customer_context(customer_id) |\n| check_slot, reserve_slot, confirm_slot | book_appointment(time, attendee) |"}, {"id": 33, "title": "Naming and describing tools", "tldr": "Tool names and descriptions are how the model chooses tools. Use clear verb-noun names, explain when to use and not use each tool, describe outputs and limits, and avoid overlapping tools that confuse selection.", "real": "Results from the Berkeley Function Calling Leaderboard (BFCL), launched in 2024, show that models’ tool selection accuracy varies with how tools are described and how many similar tools are available.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The text that tells the model what a tool does |\n| Why it matters | Determines correct tool selection |\n| Include | Purpose, when to use, when not to, inputs, outputs, limits |\n| Trade-off | Richer descriptions vs token cost with many tools |\n| Failure mode | Two tools both described as “get information about orders” |\n| Production habit | Namespace tools (orders_search, orders_get) |\n\n### Description template\n\n```text\norders_search: Find a customer's orders by status or date.\nUse when the user asks about orders without giving an order ID.\nDo not use for payment questions (use payments_get).\nReturns up to 10 orders: id, date, status, total. Newest first.\n```"}, {"id": 34, "title": "Input schemas", "tldr": "Strict input schemas reduce errors: typed fields, enums for fixed options, formats for dates and IDs, required versus optional fields, and helpful parameter descriptions. Validate inputs server-side regardless of the schema.", "real": "OpenAI added strict mode for function calling in August 2024 so arguments always match the provided JSON schema, and model providers generally support JSON Schema for describing tool parameters.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The parameter contract for a tool |\n| Why it matters | Prevents malformed or dangerous calls |\n| Good practices | Enums, formats, ranges, required fields, examples |\n| Trade-off | Over-constrained schemas block valid uses |\n| Failure mode | Free-text parameters for structured values |\n| Production habit | Server-side validation even with strict schemas |\n\n### Schema example\n\n```json\n{\n  \"name\": \"refunds_issue\",\n  \"description\": \"Issue a refund for a delivered order within policy. Max $50 without approval.\",\n  \"input_schema\": {\n    \"type\": \"object\",\n    \"properties\": {\n      \"order_id\": {\"type\": \"string\", \"pattern\": \"^[0-9]+$\"},\n      \"amount_cents\": {\"type\": \"integer\", \"minimum\": 1, \"maximum\": 5000},\n      \"reason\": {\"type\": \"string\", \"enum\": [\"damaged\", \"not_received\", \"wrong_item\", \"other\"]}\n    },\n    \"required\": [\"order_id\", \"amount_cents\", \"reason\"]\n  }\n}\n```"}, {"id": 35, "title": "Tool output design", "tldr": "Return what the agent needs to decide its next step: relevant fields, human-readable values, clear status, and pagination hints. Avoid raw dumps, opaque IDs without context and huge payloads that crowd the context window.", "real": "Anthropic’s tool-writing guidance recommended returning meaningful, natural-language fields rather than low-level technical identifiers, and offering a concise versus detailed response format to control token usage.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The observation returned by a tool |\n| Why it matters | Drives the agent’s understanding and token cost |\n| Include | Status, key fields, next-step hints, truncation notice |\n| Trade-off | Completeness vs focus |\n| Failure mode | 20,000-token JSON responses |\n| Production habit | Token cap per tool result; concise mode by default |\n\n### Raw vs designed output\n\n| Raw API output | Designed output |\n|---|---|\n| `{\"o_id\": 981, \"st\": 4, \"cr_ts\": 1731230400, ...60 fields}` | “Order 981: shipped Nov 10, carrier BlueDart, expected Nov 18. Items: 2.” |"}, {"id": 36, "title": "Error messages that help agents recover", "tldr": "When tools fail, return messages that say what went wrong and how to fix it: invalid parameters, missing permissions, not found, transient errors with retry advice. Good errors let agents self-correct instead of looping.", "real": "Agent APIs allow tool results to be flagged as errors (for example the `is_error` field in Anthropic’s tool results), and frameworks pass these back to the model so it can retry with corrected arguments.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Actionable failure feedback from tools |\n| Why it matters | Enables recovery; prevents loops |\n| Categories | Invalid input, not found, forbidden, transient, conflict |\n| Trade-off | Helpful detail vs revealing internals |\n| Failure mode | Generic “error occurred” causing blind retries |\n| Production habit | Standard error format across tools |\n\n### Error format\n\n```json\n{\"error\": \"invalid_input\",\n \"message\": \"Date '12/11/2026' is ambiguous. Use ISO format YYYY-MM-DD.\",\n \"retryable\": true}\n```"}, {"id": 37, "title": "Read tools vs write tools", "tldr": "Separate tools that observe from tools that change things. Read tools can run freely; write tools need validation, idempotency, limits, confirmation and audit logs. Agents should gather information before acting.", "real": "Coding agents commonly auto-approve read operations (viewing and searching files) while asking permission for commands that modify the system, reflecting the different risk of observing versus acting.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Classifying tools by their effects |\n| Why it matters | Applies the right controls to each |\n| Write tool controls | Idempotency keys, limits, approvals, audit, dry-run |\n| Trade-off | Approvals add friction |\n| Failure mode | Duplicate payments after retries |\n| Production habit | Idempotency key derived from task and action |\n\n### Idempotent write\n\n```python\ndef refunds_issue(ctx, order_id: str, amount_cents: int, reason: str):\n    key = f\"{ctx.task_id}:refund:{order_id}:{amount_cents}\"\n    existing = refunds.find_by_idempotency_key(key)\n    if existing:\n        return {\"status\": \"already_issued\", \"refund_id\": existing.id}\n    if amount_cents > 5000:\n        return {\"error\": \"needs_approval\", \"message\": \"Use request_approval for refunds over $50.\"}\n    refund = refunds.create(order_id, amount_cents, reason, idempotency_key=key)\n    audit.log(ctx, \"refund_issued\", refund.id)\n    return {\"status\": \"issued\", \"refund_id\": refund.id}\n```"}, {"id": 38, "title": "Scaling to many tools", "tldr": "Large tool sets (dozens to hundreds) consume context and reduce selection accuracy. Use tool search or retrieval to load relevant tools on demand, group tools by namespace, route to specialized sub-agents, or expose capabilities through code.", "real": "In November 2025 Anthropic introduced a tool search capability so Claude could discover tools on demand instead of loading every definition upfront, addressing the context cost of connecting agents to many MCP servers.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Techniques for agents with large tool catalogs |\n| Why it matters | Tool definitions can consume tens of thousands of tokens |\n| Techniques | Tool search, namespaces, routing, sub-agents, code APIs |\n| Trade-off | Extra retrieval step vs context savings |\n| Failure mode | 150 tool definitions in every request |\n| Production habit | Measure tool-definition tokens per request |\n\n### Options\n\n| Technique | How |\n|---|---|\n| Tool search | Agent searches a tool index, loads matches |\n| Routing | Classifier picks tool subset |\n| Sub-agents | Each specialist has its own tools |\n| Code execution | Tools exposed as functions in a code sandbox |"}, {"id": 39, "title": "Code as an action", "tldr": "Letting agents write and run code in a sandbox can replace many tool calls: loops, filtering, data processing and combining multiple APIs happen in one step. It is powerful and token-efficient but requires strong sandboxing.", "real": "The CodeAct paper (Wang et al., 2024) found that using executable Python as the agent action format improved success rates by up to 20% over JSON or text actions, and Anthropic reported in 2025 that presenting MCP tools as code APIs cut token use in one example from about 150,000 to 2,000.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Agent actions expressed as executable code |\n| Why it matters | Composes operations efficiently; handles data processing |\n| When to use | Data analysis, multi-tool orchestration, file processing |\n| When not to use | Without a secure sandbox |\n| Trade-off | Flexibility vs security and debuggability |\n| Failure mode | Generated code accessing secrets or network freely |\n| Production habit | Ephemeral sandbox, no ambient credentials, resource limits |\n\n### Example\n\n```python\n# Agent-written code inside a sandbox with an injected API client\norders = api.orders_search(customer_id=\"cus_42\", status=\"any\")\nlate = [o for o in orders if o.status == \"shipped\" and o.days_in_transit > 7]\nfor o in late:\n    api.tickets_create(subject=f\"Late delivery {o.id}\", priority=\"high\")\nprint(f\"Created {len(late)} tickets\")\n```"}, {"id": 40, "title": "Building a tool library", "tldr": "Treat tools as a shared, versioned product: consistent conventions, documentation, tests, risk classification, owners, usage analytics and deprecation policies. A good library makes every new agent faster and safer to build.", "real": "Companies expose internal capabilities as MCP servers or internal tool registries so multiple agents can reuse the same reviewed tools, and by December 2025 over 10,000 public MCP servers had been published.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A curated, reusable collection of agent tools |\n| Why it matters | Consistency, security review once, faster agent development |\n| Contents | Schemas, descriptions, tests, risk tier, owner, version |\n| Trade-off | Central curation vs team autonomy |\n| Failure mode | Duplicate tools with different behaviors across teams |\n| Production habit | Tool usage analytics and quarterly cleanup |\n\n### Tool registry entry\n\n| Field | Example |\n|---|---|\n| Name | orders_search |\n| Version | 3.2 |\n| Risk tier | Read |\n| Auth | User-delegated OAuth, scope orders:read |\n| Owner | Commerce platform team |\n| Tests | Unit + agent eval cases |\n| Calls / week | 182,000 |\n| Error rate | 0.4% |"}, {"id": 41, "title": "The context window as working memory", "tldr": "Everything an agent knows in a step must be in its context window: instructions, tool definitions, history, observations and retrieved knowledge. Context is finite and attention degrades as it fills, so treat it as a scarce resource.", "real": "Chroma’s 2025 “Context Rot” study reported that model performance declined as input length grew, even on simple tasks, across many frontier models, supporting the practice of keeping agent context lean.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The model’s per-step view of the world |\n| Why it matters | Missing or noisy context causes wrong actions |\n| Contents | Instructions, tools, goal, plan, recent history, observations, retrieved data |\n| Trade-off | More information vs attention dilution and cost |\n| Failure mode | Context filled with stale tool outputs |\n| Production habit | Track context composition per step |\n\n### Context composition over a long run\n\n```chart\n{\"title\": \"Context tokens by step without management (illustrative)\", \"unit\": \"tokens\", \"data\": [[\"Step 1\", 6000], [\"Step 5\", 28000], [\"Step 10\", 61000], [\"Step 20\", 125000], [\"Step 30\", 190000]]}\n```"}, {"id": 42, "title": "Context engineering for agents", "tldr": "Context engineering decides what enters the window at each step: compact instructions, only relevant tools, recent and summarized history, trimmed observations, and just-in-time retrieval. The goal is the smallest high-signal context that enables the right next action.", "real": "Anthropic’s September 2025 article “Effective context engineering for AI agents” described context engineering as the natural progression of prompt engineering for agents operating over multiple turns and long horizons.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Curating per-step context |\n| Why it matters | Determines quality, cost and how long agents can run |\n| Techniques | Selection, trimming, summarization, retrieval, isolation in sub-agents |\n| Trade-off | Curation effort vs agent performance |\n| Failure mode | Same giant context for every step |\n| Production habit | Context budget per component |\n\n### Budget example\n\n| Component | Budget |\n|---|---|\n| System prompt + rules | 2,000 |\n| Tool definitions | 3,000 |\n| Goal + plan | 500 |\n| Summarized history | 3,000 |\n| Recent turns | 6,000 |\n| Latest observations | 4,000 |\n| Retrieved knowledge | 5,000 |"}, {"id": 43, "title": "Just-in-time retrieval", "tldr": "Instead of loading everything upfront, give agents lightweight references (file paths, IDs, search tools) and let them fetch details when needed. This mirrors how humans use file systems and search, keeping context focused.", "real": "Coding agents such as Claude Code navigate codebases with search and file-reading tools (grep, glob, read) rather than loading whole repositories into context, retrieving only the files relevant to the current step.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Fetching information on demand during the task |\n| Why it matters | Scales to large corpora without bloating context |\n| Tools | Search, read file, query database, fetch document |\n| Trade-off | More steps vs smaller context |\n| Failure mode | Agent never looks up information it needs |\n| Production habit | Combine upfront essentials with on-demand tools |\n\n### Hybrid strategy\n\n```mermaid\nflowchart LR\n  START[Task start] --> UP[Load essentials: rules, key docs]\n  UP --> WORK[Work]\n  WORK --> NEED{Need details?}\n  NEED -- yes --> FETCH[Search / read tool]\n  FETCH --> WORK\n  NEED -- no --> WORK\n```"}, {"id": 44, "title": "Compaction", "tldr": "When context approaches limits, summarize the trajectory into a compact state: goal, decisions, progress, open issues, failed attempts and next steps. Clear raw tool outputs that are no longer needed.", "real": "Claude Code automatically compacts conversations as they near context limits, preserving architectural decisions and unresolved issues while discarding redundant tool outputs, so agents can continue long sessions.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Summarizing context to free space |\n| Why it matters | Enables runs longer than one context window |\n| Preserve | Goal, constraints, decisions, progress, failures, file paths |\n| Trade-off | Lost detail vs continued operation |\n| Failure mode | Re-attempting failed approaches after compaction |\n| Production habit | Test compaction quality on long eval tasks |\n\n### Compaction prompt\n\n```text\nSummarize this agent session for continuation. Include:\n- Goal and acceptance criteria\n- Decisions made and why\n- Completed work (with file paths / IDs)\n- Approaches tried that failed and why\n- Open issues and next 3 steps\nOmit raw tool outputs.\n```"}, {"id": 45, "title": "Structured note-taking", "tldr": "Agents can write persistent notes, such as progress files, to-do lists and decision logs, outside the context window and read them back later. Notes survive compaction, crashes and session boundaries.", "real": "Anthropic’s November 2025 “Effective harnesses for long-running agents” described agents keeping a progress file and git history so each new session could quickly understand prior work and continue incrementally.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Agent-maintained external memory files |\n| Why it matters | Persistent, inspectable state across sessions |\n| Formats | Markdown progress logs, JSON task lists, git commits |\n| Trade-off | Writing notes costs steps |\n| Failure mode | Notes not updated, misleading future sessions |\n| Production habit | Require note updates at session end |\n\n### Task list (JSON)\n\n```json\n[\n  {\"id\": \"F1\", \"feature\": \"Login with email\", \"status\": \"passing\"},\n  {\"id\": \"F2\", \"feature\": \"Password reset\", \"status\": \"failing\", \"note\": \"email sender not configured\"},\n  {\"id\": \"F3\", \"feature\": \"Profile page\", \"status\": \"not_started\"}\n]\n```"}, {"id": 46, "title": "Long-term memory for agents", "tldr": "Long-term memory lets agents retain user preferences, facts and lessons across sessions. Store memories in appropriate backends, retrieve only relevant ones, and give users visibility and control.", "real": "The Voyager agent (2023) in Minecraft stored successful behaviors as reusable code skills in a growing library, an early example of procedural long-term memory that improved performance over time.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Persistent knowledge across sessions |\n| Why it matters | Personalization and improving over time |\n| Types | Semantic (facts), episodic (events), procedural (skills) |\n| Trade-off | Helpfulness vs privacy and wrong memories |\n| Failure mode | Stale or incorrect memories applied confidently |\n| Production habit | Provenance, timestamps and user controls on every memory |\n\n### Memory types for agents\n\n| Type | Example | Store |\n|---|---|---|\n| Semantic | “Prefers weekly summaries” | Key-value profile |\n| Episodic | “Deploy failed Nov 3: missing secret” | Event log + search |\n| Procedural | “How to rotate API keys” | Skills / instructions |"}, {"id": 47, "title": "Memory read and write policies", "tldr": "Define when agents write memories (explicit statements, verified outcomes), how they update or delete conflicting ones, and how they retrieve (relevance, recency, importance). Uncontrolled memory accumulates noise and errors.", "real": "The Generative Agents paper (Park et al., 2023) retrieved memories using a weighted combination of recency, importance and relevance, and periodically synthesized higher-level reflections from raw observations.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Rules for memory lifecycle |\n| Why it matters | Memory quality determines whether it helps or harms |\n| Write | Confirmed facts, explicit preferences, verified lessons |\n| Don’t write | Guesses, secrets, sensitive data without consent |\n| Trade-off | Recall breadth vs precision |\n| Failure mode | Contradictory memories both retrieved |\n| Production habit | Upsert by key; supersede old memories |\n\n### Policy table\n\n| Event | Memory action |\n|---|---|\n| User states preference | Upsert preference |\n| User corrects agent | Update and mark previous as superseded |\n| Task succeeds with new method | Save procedure candidate for review |\n| User asks to forget | Delete across stores |"}, {"id": 48, "title": "Knowledge bases for agents", "tldr": "Agents often need organizational knowledge: policies, product docs, runbooks. Expose it through retrieval tools with good chunking, hybrid search, permission filtering and freshness, so agents can look up facts instead of guessing.", "real": "Enterprise agent platforms such as Salesforce Agentforce and Microsoft Copilot Studio ground agents in company knowledge sources with retrieval, because agents answering from model memory produce inaccurate company-specific answers.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Searchable organizational knowledge exposed as tools |\n| Why it matters | Grounds agent decisions in current, correct facts |\n| Design | Hybrid search, reranking, permissions, citations |\n| Trade-off | Retrieval quality engineering vs answer accuracy |\n| Failure mode | Agent citing outdated policy versions |\n| Production habit | Freshness metadata and owner for every document |\n\n### Knowledge tool\n\n```json\n{\"name\": \"kb_search\",\n \"description\": \"Search company policies and product docs. Returns top passages with doc title, section and last-updated date. Use before answering policy questions.\",\n \"input_schema\": {\"type\": \"object\",\n   \"properties\": {\"query\": {\"type\": \"string\"}, \"product\": {\"type\": \"string\"}},\n   \"required\": [\"query\"]}}\n```"}, {"id": 49, "title": "Personalization", "tldr": "Agents can adapt to users through stored preferences, history and context: format, tone, priorities and recurring tasks. Personalize transparently, let users edit preferences, and avoid inferring sensitive traits.", "real": "ChatGPT’s memory feature (from 2024) and Claude’s memory let assistants recall user preferences across conversations, with settings to view, edit and disable memories, reflecting expectations for user control.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Tailoring agent behavior to individual users |\n| Why it matters | Saves users repetition; improves relevance |\n| Sources | Explicit preferences, past tasks, profile data |\n| Trade-off | Helpfulness vs creepiness and privacy |\n| Failure mode | Applying one user’s preferences to another (shared accounts, tenants) |\n| Production habit | Show “what I remember about you” |\n\n### Preference record\n\n```json\n{\"user\": \"u_77\", \"key\": \"report_format\", \"value\": \"bullet summary + CSV attachment\",\n \"source\": \"explicit\", \"updated\": \"2026-10-04\"}\n```"}, {"id": 50, "title": "Memory failures and privacy risks", "tldr": "Memory can fail by remembering wrong things, forgetting important ones, leaking across users, or storing sensitive data. Memory can also be poisoned: injected content saved as a “fact” that influences future sessions.", "real": "Security researchers demonstrated in 2024 that prompt injection could plant false long-term memories in ChatGPT’s memory feature, which then persisted across conversations; OpenAI issued mitigations, illustrating memory poisoning risk.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Ways agent memory goes wrong |\n| Why it matters | Memory errors persist and compound |\n| Risks | False memories, staleness, leakage, sensitive data, poisoning |\n| Trade-off | Memory power vs attack surface |\n| Failure mode | Agent writing memories while processing untrusted content |\n| Production habit | No automatic memory writes from untrusted sources |\n\n### Defenses\n\n| Risk | Defense |\n|---|---|\n| Poisoning | Only write memories from user-confirmed or trusted sources |\n| Staleness | Expiry, last-confirmed dates |\n| Leakage | Strict user and tenant partitioning |\n| Sensitive data | Classifiers and consent |\n| Wrong inference | Store as hypothesis, ask to confirm |"}, {"id": 51, "title": "Code-driven vs model-driven control", "tldr": "Control flow can be decided by code (workflows), by the model (agents), or by a mix where code defines the structure and the model decides within steps. Put deterministic logic in code and use the model only where judgment is needed.", "real": "Open

AI’s 2025 guide to building agents and Anthropic’s “Building effective agents” both recommend maximizing a single agent’s capabilities and using deterministic orchestration where possible before adding model-driven complexity.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Deciding who controls the next step |\n| Why it matters | Determines predictability and flexibility |\n| Code-driven | Known sequences, compliance steps, integrations |\n| Model-driven | Open-ended exploration, varied inputs |\n| Trade-off | Predictability vs adaptability |\n| Failure mode | Model deciding steps that should be fixed (e.g. identity check) |\n| Production habit | Mandatory steps enforced in code |\n\n### Hybrid control\n\n```mermaid\nflowchart LR\n  START[Request] --> AUTH[Code: verify identity]\n  AUTH --> AGENT[Model: resolve issue with tools]\n  AGENT --> POLICY[Code: policy check on actions]\n  POLICY --> LOG[Code: audit + notify]\n```"}, {"id": 52, "title": "State machines and graphs", "tldr": "Represent agent processes as explicit states and transitions: intake, investigate, propose, approve, execute, verify, close. Graphs make complex flows visible, testable and resumable, with the model operating inside states.", "real": "LangGraph represents agent applications as graphs of nodes with conditional edges and persisted state, and has been used by companies building production agents where explicit control and resumability matter.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Explicit states and transitions around model steps |\n| Why it matters | Clarity, testing, checkpoints, human pauses |\n| When to use | Multi-stage processes with approvals and branches |\n| Trade-off | Design effort vs control |\n| Failure mode | Hidden implicit states inside a single giant prompt |\n| Production habit | Unit-test transitions independently of the model |\n\n### Example state machine\n\n```mermaid\nstateDiagram-v2\n  [*] --> Intake\n  Intake --> Investigate\n  Investigate --> Propose\n  Propose --> Approval: needs approval\n  Propose --> Execute: within limits\n  Approval --> Execute: approved\n  Approval --> Close: rejected\n  Execute --> Verify\n  Verify --> Close: success\n  Verify --> Investigate: failed\n  Close --> [*]\n```"}, {"id": 53, "title": "Plan-and-execute agents", "tldr": "Separate planning from execution: create a plan, execute steps, and replan when results differ from expectations. Plans make progress visible, enable approval before work starts, and reduce wandering on long tasks.", "real": "Coding agents including Claude Code offer a planning mode in which the agent explores and proposes a plan for user approval before editing files, reducing wasted work on misunderstood tasks.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Explicit plan, then execution, with replanning |\n| Why it matters | Coherence on long tasks; human-reviewable intent |\n| When to use | Multi-step tasks with dependencies |\n| Trade-off | Planning overhead |\n| Failure mode | Following a plan after evidence shows it’s wrong |\n| Production habit | Replan on any failed verification |\n\n### Plan record\n\n```json\n{\"goal\": \"Upgrade payment SDK to v5\",\n \"steps\": [\n   {\"n\": 1, \"task\": \"Inventory SDK usages\", \"verify\": \"list of call sites\"},\n   {\"n\": 2, \"task\": \"Update client init\", \"verify\": \"unit tests pass\"},\n   {\"n\": 3, \"task\": \"Update error handling\", \"verify\": \"integration tests pass\"}\n ],\n \"status\": \"awaiting_approval\"}\n```"}, {"id": 54, "title": "Dynamic replanning", "tldr": "Real environments surprise agents: missing data, failed tools, new information. Replanning updates the remaining steps based on observations, while keeping the goal fixed and recording why the plan changed.", "real": "Research systems such as “Plan-and-Solve” prompting (2023) and later agent frameworks emphasized revising plans after observations, since static plans generated upfront often fail when early assumptions prove wrong.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Updating plans during execution |\n| Why it matters | Adapts to reality instead of failing |\n| Triggers | Failed step, unexpected result, new constraint |\n| Trade-off | Flexibility vs instability (constant replanning) |\n| Failure mode | Silent goal changes during replanning |\n| Production habit | Log plan versions and reasons |\n\n### Replanning loop\n\n```mermaid\nflowchart LR\n  PLAN[Plan v1] --> STEP[Execute step]\n  STEP --> CHECK{As expected?}\n  CHECK -- yes --> NEXT[Next step]\n  CHECK -- no --> REPLAN[Plan v2: reason recorded]\n  REPLAN --> STEP\n```"}, {"id": 55, "title": "Parallel execution", "tldr": "Run independent actions concurrently: multiple tool calls in one step, parallel sub-agents, or concurrent workflow branches. Parallelism cuts wall-clock time but requires handling partial failures and merging results.", "real": "Anthropic reported that its research system’s lead agent spawning subagents in parallel, and subagents using multiple tools in parallel, cut research time for complex queries by up to 90%.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Concurrent execution of independent work |\n| Why it matters | Faster results for multi-source tasks |\n| When to use | Independent lookups, research across sources |\n| When not to use | Dependent or conflicting writes |\n| Trade-off | Speed vs cost and complexity |\n| Failure mode | Parallel writes causing conflicts |\n| Production habit | Parallelize reads freely; serialize writes |\n\n### Parallel tool calls\n\n```python\nimport asyncio\n\nasync def run_parallel(calls, handlers):\n    async def one(c):\n        try:\n            return c.id, await handlers[c.name](**c.input), False\n        except Exception as e:\n            return c.id, {\"error\": str(e)}, True\n    return await asyncio.gather(*(one(c) for c in calls))\n```"}, {"id": 56, "title": "Budgets and stopping rules", "tldr": "Every agent run needs limits: maximum steps, tokens, cost, wall-clock time and repeated-action detection, plus success criteria that end the run. Budgets protect against loops and runaway costs.", "real": "Agent SDKs expose limits such as maximum turns (for example `max_turns` in the OpenAI Agents SDK and Claude Agent SDK) because unbounded agent loops were a common early failure mode.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Hard limits and termination logic |\n| Why it matters | Prevents infinite loops and cost explosions |\n| Limits | Steps, tokens, dollars, time, repeated actions |\n| Trade-off | Tight limits fail hard tasks |\n| Failure mode | Agent hits limit and returns nothing useful |\n| Production habit | On limit, return partial results and status |\n\n### Stop conditions\n\n| Condition | Result |\n|---|---|\n| Goal verified | success |\n| Max steps / tokens / cost | partial, with summary |\n| Same action 3 times | stopped: no progress |\n| Needs user input | waiting_for_user |\n| Policy violation attempt | blocked + alert |"}, {"id": 57, "title": "Checkpoints and resumability", "tldr": "Persist agent state after each step so runs can resume after crashes, deploys or human pauses. Checkpoints should include plan, progress, pending actions and versions of prompt, model and tools.", "real": "LangGraph’s checkpointers and durable workflow engines such as Temporal let agent runs pause indefinitely for human input and resume from the exact step, which is essential for approval-based agents.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Persisted agent state snapshots |\n| Why it matters | Reliability and human-in-the-loop support |\n| Include | State, step index, pending action, versions |\n| Trade-off | Storage and write overhead |\n| Failure mode | Resuming with incompatible code versions |\n| Production habit | Version checkpoints; expire old ones |\n\n### Checkpoint record\n\n```json\n{\"run_id\": \"r_7c1\", \"step\": 6, \"status\": \"waiting_for_approval\",\n \"pending_action\": {\"tool\": \"refunds_issue\", \"args\": {\"order_id\": \"990\", \"amount_cents\": 12000}},\n \"versions\": {\"prompt\": \"support-v23\", \"model\": \"claude-sonnet-5-5\", \"tools\": \"2026.11\"}}\n```"}, {"id": 58, "title": "Human-in-the-loop design", "tldr": "Humans can approve actions, answer questions, correct plans, or take over. Design these touchpoints with clear context, minimal effort and appropriate timing, and avoid approval fatigue that turns reviews into rubber stamps.", "real": "Coding agents show proposed diffs and command previews before applying them, and enterprise agent platforms route high-risk actions to human approval queues, reflecting the need for informed, efficient human decisions.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Points where humans guide or approve agent work |\n| Why it matters | Safety, accountability, quality |\n| Types | Approve, clarify, correct, take over |\n| Trade-off | Oversight vs speed |\n| Failure mode | Approval requests without enough context to decide |\n| Production habit | Show action, reason, evidence and risk in one view |\n\n### Approval card contents\n\n| Element | Example |\n|---|---|\n| Proposed action | Refund $120 on order 990 |\n| Reason | Item damaged; photos verified |\n| Evidence | Photos, order history |\n| Policy | Above $50 auto limit |\n| Options | Approve / modify / reject |"}, {"id": 59, "title": "Long-running agents", "tldr": "Agents working for hours or days need incremental progress, persistent notes, checkpoints, periodic verification, budget tracking and the ability to resume in fresh context windows. Design for many sessions, not one.", "real": "METR’s measurements of rapidly growing agent task horizons and Anthropic’s 2025 work on harnesses for long-running agents both highlight that multi-session operation requires explicit state handoff between context windows.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Agents operating across many context windows |\n| Why it matters | Larger, more valuable tasks become possible |\n| Techniques | Feature lists, progress files, git commits, compaction |\n| Trade-off | Autonomy vs drift and cost |\n| Failure mode | Attempting everything at once; leaving broken state |\n| Production habit | One verified increment per session |\n\n### Session protocol\n\n```mermaid\nflowchart LR\n  BEGIN[Session start] --> ORIENT[Read notes + history]\n  ORIENT --> CHECK[Verify current state works]\n  CHECK --> WORK[Implement one increment]\n  WORK --> VERIFY[Test]\n  VERIFY --> SAVE[Commit + update notes]\n```"}, {"id": 60, "title": "Durable agent execution", "tldr": "Production agents must survive infrastructure failures: workers crash, deploys happen, APIs time out. Durable execution engines persist each step and replay safely, making agent runs reliable over minutes to days.", "real": "Temporal, which grew out of Uber’s Cadence workflow engine, and similar durable execution platforms have been adopted for AI agent workflows so that long-running runs resume automatically after failures.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Workflow infrastructure that persists progress |\n| Why it matters | Agent runs outlive individual processes |\n| Requirements | Idempotent steps, persisted results, retries, timeouts |\n| Trade-off | Infrastructure complexity |\n| Failure mode | Replaying a payment step after a crash |\n| Production habit | Each side-effecting step is idempotent |\n\n### Durable run\n\n```mermaid\nflowchart LR\n  S1[Step: research ✓ persisted] --> S2[Step: draft ✓ persisted]\n  S2 --> CRASH[Worker crash]\n  CRASH --> RESUME[Resume at step 3]\n  RESUME --> S3[Step: send for approval]\n```"}, {"id": 61, "title": "Build project: setup", "tldr": "This part builds a small order-support agent step by step in Python with the Anthropic SDK: one model call, tools, the loop, retrieval, state, guardrails, tracing, evals and deployment. Each step adds one capability and one test.", "real": "Anthropic’s “Building effective agents” recommended starting with direct API calls before adopting frameworks, because many agent patterns take only a few lines of code and understanding them makes debugging easier.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A hands-on, incremental agent build |\n| Why it matters | Understanding the raw loop makes any framework easier |\n| Stack | Python 3.12, anthropic SDK, pydantic, pytest, FastAPI |\n| Trade-off | Hand-built code vs framework features |\n| Production habit | Add a test with each capability |\n\n### Setup\n\n```bash\nuv init order-agent && cd order-agent\nuv add anthropic pydantic fastapi uvicorn\nuv add --dev pytest\nexport ANTHROPIC_API_KEY=...        # from your secrets manager in real deployments\n```\n\n### Project layout\n\n```text\norder_agent/\n  llm.py        # client + model config\n  tools.py      # tool schemas + handlers\n  agent.py      # loop\n  kb.py         # policy retrieval\n  guards.py     # policy checks + approvals\n  tracing.py    # structured logs\n  api.py        # FastAPI service\ntests/\n  test_tools.py\n  evals/        # agent eval cases\n```"}, {"id": 62, "title": "Step 1: a single structured call", "tldr": "Start with one model call that classifies the user’s request into a structured intent. Force structured output by asking the model to call a “record_intent” tool, then validate the result with Pydantic.", "real": "Anthropic’s documentation describes forcing a specific tool with `tool_choice` as a way to obtain JSON that follows a schema, a common technique for structured extraction.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Intent classification with validated JSON |\n| Why it matters | Foundation for routing and testing |\n| Trade-off | Extra call vs clearer control flow |\n| Production habit | Validate every structured output |\n\n### Code\n\n```python\n# order_agent/llm.py\nimport anthropic\nclient = anthropic.Anthropic()\nMODEL = \"claude-sonnet-5-5\"     # pin and review on upgrades\n\n# order_agent/intent.py\nfrom typing import Literal\nfrom pydantic import BaseModel\nfrom .llm import client, MODEL\n\nclass Intent(BaseModel):\n    intent: Literal[\"order_status\", \"return\", \"other\"]\n    order_id: str | None = None\n\nINTENT_TOOL = {\n    \"name\": \"record_intent\",\n    \"description\": \"Record the user's intent and any order ID mentioned.\",\n    \"input_schema\": Intent.model_json_schema(),\n}\n\ndef classify(text: str) -> Intent:\n    resp = client.messages.create(\n        model=MODEL, max_tokens=200,\n        tools=[INTENT_TOOL],\n        tool_choice={\"type\": \"tool\", \"name\": \"record_intent\"},\n        messages=[{\"role\": \"user\", \"content\": text}],\n    )\n    block = next(b for b in resp.content if b.type == \"tool_use\")\n    return Intent.model_validate(block.input)\n```"}, {"id": 63, "title": "Step 2: adding a tool", "tldr": "Define a read-only tool with a clear schema and a handler that validates inputs, enforces authorization and returns concise text. Test the handler without the model.", "real": "Tool handlers are ordinary functions, which is why agent teams unit-test them like any other code; most production tool bugs are in handlers, not in the model’s call.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | First real capability for the agent |\n| Why it matters | Grounds answers in live data |\n| Trade-off | Each tool adds surface area |\n| Production habit | Authorization inside the handler |\n\n### Code\n\n```python\n# order_agent/tools.py\nORDERS = {\"981\": {\"customer\": \"cus_42\", \"status\": \"shipped\", \"eta\": \"2026-11-18\"},\n          \"990\": {\"customer\": \"cus_42\", \"status\": \"payment_failed\", \"eta\": None}}\n\nGET_ORDER = {\n    \"name\": \"orders_get\",\n    \"description\": \"Get status and delivery estimate of one order by numeric ID. \"\n                   \"Use when the user mentions an order number.\",\n    \"input_schema\": {\"type\": \"object\",\n                     \"properties\": {\"order_id\": {\"type\": \"string\", \"pattern\": \"^[0-9]+$\"}},\n                     \"required\": [\"order_id\"]},\n}\n\ndef orders_get(ctx, order_id: str) -> dict:\n    order = ORDERS.get(order_id)\n    if order is None or order[\"customer\"] != ctx[\"customer_id\"]:\n        return {\"error\": \"not_found\", \"message\": f\"No order {order_id} for this customer.\"}\n    return {\"order_id\": order_id, \"status\": order[\"status\"], \"eta\": order[\"eta\"]}\n\n# tests/test_tools.py\ndef test_orders_get_hides_other_customers_orders():\n    assert orders_get({\"customer_id\": \"cus_99\"}, \"981\")[\"error\"] == \"not_found\"\n```"}, {"id": 64, "title": "Step 3: the agent loop", "tldr": "Implement the loop: send messages with tools, execute tool calls, append results, repeat until the model returns a final answer or the step limit is reached. Return tool errors to the model with is_error so it can recover.", "real": "This loop mirrors what agent SDKs do internally; the OpenAI Agents SDK’s Runner and Anthropic’s Claude Agent SDK wrap the same message → tool call → tool result cycle with extra features.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The core runtime of the agent |\n| Why it matters | All later features attach to it |\n| Trade-off | Simplicity vs missing advanced features |\n| Production habit | Step limit and error results from day one |\n\n### Code\n\n```python\n# order_agent/agent.py\nimport json\nfrom .llm import client, MODEL\nfrom .tools import GET_ORDER, orders_get\n\nSYSTEM = \"You help Acme customers with orders. Use tools; never guess order details.\"\nTOOLS = [GET_ORDER]\nHANDLERS = {\"orders_get\": orders_get}\n\ndef run(ctx: dict, user_text: str, max_steps: int = 8) -> str:\n    messages = [{\"role\": \"user\", \"content\": user_text}]\n    for _ in range(max_steps):\n        resp = client.messages.create(model=MODEL, max_tokens=800, system=SYSTEM,\n                                      tools=TOOLS, messages=messages)\n        messages.append({\"role\": \"assistant\", \"content\": resp.content})\n        if resp.stop_reason != \"tool_use\":\n            return \"\".join(b.text for b in resp.content if b.type == \"text\")\n        results = []\n        for b in resp.content:\n            if b.type != \"tool_use\":\n                continue\n            try:\n                out = HANDLERS[b.name](ctx, **b.input)\n                is_error = \"error\" in out\n            except Exception as e:                  # unexpected handler failure\n                out, is_error = {\"error\": \"internal\", \"message\": str(e)}, True\n            results.append({\"type\": \"tool_result\", \"tool_use_id\": b.id,\n                            \"content\": json.dumps(out), \"is_error\": is_error})\n        messages.append({\"role\": \"user\", \"content\": results})\n    return \"Sorry, I couldn't finish that. A teammate will follow up.\"\n```"}, {"id": 65, "title": "Step 4: multiple tools and routing", "tldr": "Add tools for returns and payments, keep descriptions distinct, and optionally route by intent to limit which tools each request sees. Fewer visible tools improve selection accuracy.", "real": "Practitioners commonly report that tool selection accuracy drops as the number of similar tools grows, which motivates routing or namespacing tools so each request sees a focused subset.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Expanding capabilities while keeping tool choice clear |\n| Why it matters | Real agents need several tools |\n| Trade-off | Routing adds a step but improves accuracy |\n| Production habit | Tool subsets per intent |\n\n### Code\n\n```python\n# order_agent/tools.py (additions)\nRETURNS_START = {\n    \"name\": \"returns_start\",\n    \"description\": \"Start a return for a delivered order within 30 days. \"\n                   \"Do not use for orders that are not delivered.\",\n    \"input_schema\": {\"type\": \"object\",\n                     \"properties\": {\"order_id\": {\"type\": \"string\"},\n                                    \"reason\": {\"type\": \"string\",\n                                               \"enum\": [\"damaged\", \"wrong_item\", \"changed_mind\"]}},\n                     \"required\": [\"order_id\", \"reason\"]},\n}\n\nTOOLSETS = {\n    \"order_status\": [GET_ORDER],\n    \"return\": [GET_ORDER, RETURNS_START],\n    \"other\": [GET_ORDER],\n}\n\n# order_agent/agent.py: choose tools per intent\n# intent = classify(user_text); tools = TOOLSETS[intent.intent]\n```"}, {"id": 66, "title": "Step 5: adding retrieval", "tldr": "Give the agent a policy search tool so it answers policy questions from current documents with citations instead of model memory. Start simple, measure recall, then improve with hybrid search and reranking.", "real": "The 2024 Moffatt v. Air Canada decision, which held the airline responsible for its chatbot’s incorrect bereavement-fare policy statement, is a widely cited reason to ground policy answers in retrieved documents.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Knowledge lookup as an agent tool |\n| Why it matters | Accurate, citable policy answers |\n| Trade-off | Retrieval engineering vs accuracy |\n| Production habit | Return document IDs and dates with passages |\n\n### Code\n\n```python\n# order_agent/kb.py\nPOLICIES = [\n    {\"id\": \"RET-1\", \"updated\": \"2026-09-01\",\n     \"text\": \"Items can be returned within 30 days of delivery, except final-sale items.\"},\n    {\"id\": \"SHP-2\", \"updated\": \"2026-06-15\",\n     \"text\": \"Standard shipping takes 3-7 business days within India.\"},\n]\n\nKB_SEARCH = {\n    \"name\": \"kb_search\",\n    \"description\": \"Search Acme policies. Use before answering any policy question. \"\n                   \"Cite the returned policy ID.\",\n    \"input_schema\": {\"type\": \"object\", \"properties\": {\"query\": {\"type\": \"string\"}},\n                     \"required\": [\"query\"]},\n}\n\ndef kb_search(ctx, query: str) -> dict:\n    words = set(query.lower().split())\n    scored = sorted(POLICIES, key=lambda p: -len(words & set(p[\"text\"].lower().split())))\n    return {\"results\": scored[:2]}     # replace with hybrid search + reranking in production\n```"}, {"id": 67, "title": "Step 6: state and memory", "tldr": "Persist conversation state per session so the agent can handle follow-ups, and store the run state (steps, tools used, status) for debugging and resumption. Keep state outside the model in a database.", "real": "Production agent platforms persist sessions and run state in databases (for example LangGraph checkpointers backed by PostgreSQL), because in-memory state is lost on restarts and can’t be inspected.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Persistent session and run state |\n| Why it matters | Follow-ups, resumption, debugging |\n| Trade-off | Storage and privacy obligations |\n| Production habit | Retention policy for stored conversations |\n\n### Code\n\n```python\n# order_agent/state.py\nimport json, sqlite3, uuid\n\ndb = sqlite3.connect(\"agent.db\")\ndb.execute(\"CREATE TABLE IF NOT EXISTS sessions (id TEXT PRIMARY KEY, messages TEXT)\")\n\ndef load(session_id: str) -> list:\n    row = db.execute(\"SELECT messages FROM sessions WHERE id = ?\", (session_id,)).fetchone()\n    return json.loads(row[0]) if row else []\n\ndef save(session_id: str, messages: list) -> None:\n    db.execute(\"INSERT INTO sessions (id, messages) VALUES (?, ?) \"\n               \"ON CONFLICT(id) DO UPDATE SET messages = excluded.messages\",\n               (session_id, json.dumps(messages, default=str)))\n    db.commit()\n\ndef new_session() -> str:\n    return uuid.uuid4().hex\n```\n\nNote: content blocks returned by the SDK are objects; serialize them with `block.model_dump()` before storing."}, {"id": 68, "title": "Step 7: guardrails and approvals", "tldr": "Add a policy layer between the model’s proposed actions and execution: enforce limits, eligibility and approvals in code. High-risk actions return “pending approval” to the model instead of executing.", "real": "OWASP’s guidance on excessive agency (LLM06:2025) recommends enforcing authorization in downstream systems and requiring human approval for high-impact actions rather than relying on the model to restrain itself.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Code-enforced rules on agent actions |\n| Why it matters | Prompts can be ignored or manipulated |\n| Trade-off | Approvals slow resolution |\n| Production habit | Every write tool passes through the guard |\n\n### Code\n\n```python\n# order_agent/guards.py\nAPPROVAL_QUEUE = []\nRISK = {\"orders_get\": \"read\", \"kb_search\": \"read\", \"returns_start\": \"write\",\n        \"refunds_issue\": \"financial\"}\n\ndef guard(ctx, tool: str, args: dict) -> dict | None:\n    \"\"\"Return a result to send to the model instead of executing, or None to proceed.\"\"\"\n    if RISK.get(tool) == \"financial\" and args.get(\"amount_cents\", 0) > 5000:\n        APPROVAL_QUEUE.append({\"customer\": ctx[\"customer_id\"], \"tool\": tool, \"args\": args})\n        return {\"status\": \"pending_approval\",\n                \"message\": \"Refund above $50 sent to a human for approval. Tell the customer.\"}\n    return None\n\n# In the loop, before calling a handler:\n#   blocked = guard(ctx, b.name, b.input)\n#   out = blocked if blocked else HANDLERS[b.name](ctx, **b.input)\n```"}, {"id": 69, "title": "Step 8: tracing and logging", "tldr": "Log each step as a structured event with run ID, step number, tool, arguments (redacted), result status, latency and tokens. Structured traces make debugging, cost tracking and evals possible.", "real": "LLM observability tools and OpenTelemetry’s generative AI semantic conventions record model calls, token usage and tool calls as spans, and simple JSON logs following the same structure work well for small systems.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structured records of agent execution |\n| Why it matters | You can’t fix what you can’t see |\n| Trade-off | Logging detail vs privacy and storage |\n| Production habit | Redact PII; keep trace IDs everywhere |\n\n### Code\n\n```python\n# order_agent/tracing.py\nimport json, logging, time\nlog = logging.getLogger(\"agent\")\n\ndef trace_model_call(run_id: str, step: int, resp, started: float) -> None:\n    log.info(json.dumps({\n        \"event\": \"model_call\", \"run_id\": run_id, \"step\": step,\n        \"stop_reason\": resp.stop_reason,\n        \"input_tokens\": resp.usage.input_tokens,\n        \"output_tokens\": resp.usage.output_tokens,\n        \"latency_ms\": round((time.perf_counter() - started) * 1000),\n    }))\n\ndef trace_tool_call(run_id: str, step: int, name: str, ok: bool, ms: int) -> None:\n    log.info(json.dumps({\"event\": \"tool_call\", \"run_id\": run_id, \"step\": step,\n                         \"tool\": name, \"ok\": ok, \"latency_ms\": ms}))\n```"}, {"id": 70, "title": "Step 9 and 10: evals and deployment", "tldr": "Write eval cases with inputs and expected outcomes, run them repeatedly to measure pass^k, and gate releases on results. Deploy the agent behind an API with authentication, timeouts, per-user limits and monitoring.", "real": "Teams building agents commonly start with a few dozen hand-written eval cases derived from real requests and grow them from production failures, running them in CI before each prompt, model or tool change.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Testing agent behavior and serving it |\n| Why it matters | Proves quality before users see changes |\n| Trade-off | Eval cost (multiple runs) vs confidence |\n| Production habit | pass^k for each case; deploy behind flags |\n\n### Eval harness\n\n```python\n# tests/evals/test_agent_evals.py\nimport pytest\nfrom order_agent.agent import run\n\nCASES = [\n    (\"Where is order 981?\", lambda out: \"shipped\" in out.lower()),\n    (\"Status of order 555?\", lambda out: \"no order\" in out.lower() or \"couldn't find\" in out.lower()),\n]\n\n@pytest.mark.parametrize(\"text,check\", CASES)\ndef test_agent_case_consistently(text, check):\n    results = [check(run({\"customer_id\": \"cus_42\"}, text)) for _ in range(4)]\n    assert all(results), f\"pass^4 failed: {results}\"\n```\n\n### API\n\n```python\n# order_agent/api.py\nfrom fastapi import FastAPI, Depends\nfrom pydantic import BaseModel\nfrom .agent import run\n\napp = FastAPI()\n\nclass Ask(BaseModel):\n    message: str\n\n@app.post(\"/ask\")\ndef ask(body: Ask, customer=Depends(authenticate)):    # your auth dependency\n    return {\"answer\": run({\"customer_id\": customer.id}, body.message)}\n```"}, {"id": 71, "title": "The agent framework landscape", "tldr": "Frameworks package the agent loop, tools, state, memory, multi-agent coordination, tracing and deployment. Choose based on control needs, model flexibility, language, state persistence and team familiarity; many teams combine a thin framework with custom code.", "real": "During 2025 the major platforms all shipped agent SDKs: OpenAI’s Agents SDK (March), Google’s Agent Development Kit (April), Anthropic’s Claude Agent SDK (September, renamed from the Claude Code SDK) and Microsoft’s Agent Framework (October), alongside LangGraph, CrewAI and LlamaIndex.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Libraries for building and running agents |\n| Why it matters | Saves effort; shapes architecture |\n| Trade-off | Productivity vs abstraction and lock-in |\n| Failure mode | Framework hides prompts, making failures opaque |\n| Production habit | Wrap frameworks behind your own interfaces |\n\n### Landscape\n\n| Framework | Best known for |\n|---|---|\n| Claude Agent SDK | Claude Code’s harness: files, shell, permissions, subagents, compaction |\n| OpenAI Agents SDK | Lightweight agents, handoffs, guardrails, tracing |\n| LangGraph | Stateful graphs, checkpoints, human-in-the-loop |\n| Google ADK | Multi-agent apps, Google Cloud deployment |\n| Microsoft Agent Framework | Enterprise agents; AutoGen + Semantic Kernel lineage |\n| CrewAI | Role-based agent crews |\n| LlamaIndex | Data-centric agents and workflows |\n| Pydantic AI / smolagents | Type-safe agents / code-acting agents |"}, {"id": 72, "title": "Claude Agent SDK", "tldr": "The Claude Agent SDK provides the harness behind Claude Code for general agents: built-in tools for files, search and shell, permission controls, subagents, MCP integration, hooks and automatic context compaction, in Python and TypeScript.", "real": "Anthropic renamed the Claude Code SDK to the Claude Agent SDK in September 2025, stating that the same infrastructure used internally for coding was being used for research, video creation, note-taking and other non-coding agents.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | SDK exposing a production agent harness |\n| Why it matters | Long-running agent features out of the box |\n| When to use | Agents that work with files, code, shells, many tools |\n| Trade-off | Powerful defaults require careful permissions |\n| Failure mode | Broad tool permissions in shared environments |\n| Production habit | Explicit allowed_tools; sandboxed working directory |\n\n### Example\n\n```python\nimport anyio\nfrom claude_agent_sdk import query, ClaudeAgentOptions\n\nasync def main():\n    options = ClaudeAgentOptions(\n        system_prompt=\"Summarize open incidents from the logs folder. Don't modify files.\",\n        allowed_tools=[\"Read\", \"Grep\", \"Glob\"],\n        cwd=\"/srv/agent-workspace\",\n        max_turns=12,\n    )\n    async for msg in query(prompt=\"What errors spiked in the last log file?\", options=options):\n        print(msg)\n\nanyio.run(main)\n```"}, {"id": 73, "title": "OpenAI Agents SDK", "tldr": "The OpenAI Agents SDK offers a small set of primitives: Agents (instructions + tools), handoffs between agents, guardrails that validate inputs and outputs in parallel, sessions for memory, and built-in tracing.", "real": "OpenAI released the Agents SDK in March 2025 as the production-ready evolution of its experimental Swarm project, supporting Python and later TypeScript, and designed to work with other model providers through adapters.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Minimal-abstraction agent SDK |\n| Why it matters | Quick to learn; tracing and guardrails built in |\n| When to use | Handoff-based assistants, OpenAI-centric stacks |\n| Trade-off | Fewer orchestration features than graph frameworks |\n| Failure mode | Excessive handoffs confusing users |\n| Production habit | Guardrails on input and output; trace every run |\n\n### Handoff example\n\n```python\nfrom agents import Agent, Runner\n\nbilling = Agent(name=\"Billing\", instructions=\"Handle invoices and refunds.\")\ntech = Agent(name=\"Tech support\", instructions=\"Troubleshoot product issues.\")\ntriage = Agent(\n    name=\"Triage\",\n    instructions=\"Route the user to the right specialist.\",\n    handoffs=[billing, tech],\n)\n\nresult = Runner.run_sync(triage, \"I was charged twice this month.\")\nprint(result.final_output)\n```"}, {"id": 74, "title": "LangGraph", "tldr": "LangGraph models agents as graphs of nodes over typed state, with conditional edges, cycles, checkpointing, interrupts for human input and streaming. It suits complex, long-running and approval-heavy agents.", "real": "LangGraph reached version 1.0 in October 2025, and its checkpointing and interrupt features are commonly used to build agents that pause for approval and resume later.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Graph-based agent orchestration |\n| Why it matters | Explicit control and durable state |\n| When to use | Branching workflows, HITL, long-running agents |\n| Trade-off | More design work than a simple loop |\n| Failure mode | Overcomplicated graphs for simple tasks |\n| Production habit | Keep nodes small; test edges independently |\n\n### Conditional loop\n\n```python\nfrom typing import TypedDict\nfrom langgraph.graph import StateGraph, START, END\n\nclass S(TypedDict):\n    task: str\n    attempts: int\n    passed: bool\n\ndef work(s: S) -> dict:\n    return {\"attempts\": s[\"attempts\"] + 1, \"passed\": do_attempt(s[\"task\"])}\n\ndef route(s: S) -> str:\n    return \"done\" if s[\"passed\"] or s[\"attempts\"] >= 3 else \"retry\"\n\ng = StateGraph(S)\ng.add_node(\"work\", work)\ng.add_edge(START, \"work\")\ng.add_conditional_edges(\"work\", route, {\"retry\": \"work\", \"done\": END})\napp = g.compile()\napp.invoke({\"task\": \"fix flaky test\", \"attempts\": 0, \"passed\": False})\n```"}, {"id": 75, "title": "Google Agent Development Kit", "tldr": "Google’s Agent Development Kit (ADK) is an open-source framework for building single and multi-agent systems, with workflow agents (sequential, parallel, loop), tool integrations, evaluation support and deployment to Google Cloud.", "real": "Google introduced ADK in April 2025 alongside the Agent2Agent (A2A) protocol, positioning ADK for building agents and A2A for connecting agents across vendors.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Google’s open-source agent framework |\n| Why it matters | Strong multi-agent and Google Cloud integration |\n| When to use | Gemini-centric or Google Cloud deployments |\n| Trade-off | Ecosystem alignment vs portability |\n| Failure mode | Building deep multi-agent trees prematurely |\n| Production habit | Use workflow agents for fixed sequences |\n\n### Agent types (conceptual)\n\n| Type | Purpose |\n|---|---|\n| LLM agent | Model-driven reasoning with tools |\n| Sequential workflow | Fixed order of sub-agents |\n| Parallel workflow | Concurrent sub-agents |\n| Loop workflow | Repeat until condition |\n| Custom agent | Your own orchestration logic |"}, {"id": 76, "title": "Microsoft Agent Framework", "tldr": "Microsoft Agent Framework combines AutoGen’s multi-agent research patterns with Semantic Kernel’s enterprise features (state, telemetry, connectors) for Python and .NET, targeting enterprise agents integrated with Azure services.", "real": "Microsoft announced the Agent Framework in October 2025 as the successor path for both AutoGen and Semantic Kernel, consolidating its two earlier agent frameworks.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Microsoft’s unified agent framework |\n| Why it matters | .NET and enterprise integration |\n| When to use | Microsoft/Azure-centric organizations |\n| Trade-off | Enterprise features vs framework maturity |\n| Failure mode | Migrating complex AutoGen apps without tests |\n| Production habit | Eval suite before and after migration |\n\n### Positioning\n\n| Need | Fit |\n|---|---|\n| .NET agents | Strong |\n| Azure AI Foundry deployment | Strong |\n| Multi-agent orchestration patterns | Supported |\n| Non-Microsoft clouds | Possible, less integrated |"}, {"id": 77, "title": "CrewAI and role-based agents", "tldr": "CrewAI organizes agents as a “crew” of roles (researcher, writer, reviewer) with tasks and processes (sequential or hierarchical). It’s quick for role-based prototypes; production use needs the same evals, limits and observability as any agent.", "real": "CrewAI became one of the most starred open-source multi-agent frameworks on GitHub during 2024–2025, popular for its intuitive role-and-task abstraction.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Role-based multi-agent framework |\n| Why it matters | Fast prototyping of agent teams |\n| When to use | Content pipelines, research-and-write flows |\n| Trade-off | Simple abstraction vs fine control |\n| Failure mode | Many roles where one agent would do |\n| Production habit | Compare against a single-agent baseline |\n\n### Crew design\n\n| Role | Task | Output |\n|---|---|---|\n| Researcher | Gather sources | Notes with citations |\n| Writer | Draft article | Draft |\n| Reviewer | Check facts and style | Review comments |"}, {"id": 78, "title": "LlamaIndex, Pydantic AI and smolagents", "tldr": "LlamaIndex focuses on data-connected agents and event-driven workflows; Pydantic AI emphasizes type-safe agents with validated outputs and dependency injection; Hugging Face’s smolagents centers on code-acting agents with minimal abstractions.", "real": "Hugging Face released smolagents in December 2024 with “code agents” that write actions as Python code, following research such as CodeAct showing code actions can outperform JSON tool calls.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Specialized lightweight frameworks |\n| Why it matters | Better fit for specific styles of agents |\n| Trade-off | Narrower scope vs simplicity |\n| Production habit | Choose by primary need, not popularity |\n\n### Fit\n\n| Framework | Strength |\n|---|---|\n| LlamaIndex | RAG-heavy agents, document workflows |\n| Pydantic AI | Typed outputs, testability, dependency injection |\n| smolagents | Code-acting agents, small codebase |"}, {"id": 79, "title": "Framework or custom loop?", "tldr": "A custom loop (Part 7) gives full transparency for simple agents. Adopt a framework when you need durable state, graphs, human interrupts, multi-agent coordination or rich tracing, and keep business logic independent of it.", "real": "Anthropic’s guidance advised developers using frameworks to understand the underlying code, noting that incorrect assumptions about what’s happening under the hood are a common source of errors.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Choosing build approach |\n| Why it matters | Affects maintainability and debugging |\n| Trade-off | Control vs features |\n| Production habit | Decision recorded in an ADR |\n\n### Decision table\n\n| Need | Custom loop | Framework |\n|---|---|---|\n| Single agent, few tools | ✓ | Optional |\n| Pause/resume with approvals | Build yourself | ✓ |\n| Complex branching | Hard | ✓ |\n| Multi-agent handoffs | Build yourself | ✓ |\n| Minimal dependencies | ✓ | ✗ |"}, {"id": 80, "title": "Migrating and avoiding lock-in", "tldr": "Frameworks and model APIs change quickly. Keep tools, prompts, evals and business rules framework-independent; isolate framework code in an orchestration layer; and use your eval suite to validate migrations.", "real": "Microsoft’s consolidation of AutoGen and Semantic Kernel into the Agent Framework in 2025, and frequent breaking changes in fast-moving agent libraries, led many teams to isolate framework-specific code behind internal interfaces.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Architecture for portability |\n| Why it matters | Agent ecosystems are still consolidating |\n| Portable assets | Tools (MCP), prompts, evals, policies, data |\n| Trade-off | Abstraction effort vs flexibility |\n| Failure mode | Business logic written inside framework callbacks |\n| Production habit | Migration = swap orchestration, rerun evals |\n\n### Layering\n\n```mermaid\nflowchart TB\n  BIZ[Business rules + policies] --> ORCH[Orchestration layer: framework-specific]\n  TOOLS[Tools via MCP / internal APIs] --> ORCH\n  PROMPTS[Prompts + configs] --> ORCH\n  EVALS[Eval suite] -.validates.-> ORCH\n```"}, {"id": 81, "title": "Why agent protocols matter", "tldr": "Without standards, every agent needs custom integrations with every tool and every other agent. Protocols such as MCP (agent ↔ tools/data) and A2A (agent ↔ agent) make capabilities reusable and agents interoperable across vendors.", "real": "In December 2025 the Linux Foundation formed the Agentic AI Foundation with MCP (from Anthropic), goose (from Block) and AGENTS.md (from OpenAI) as founding projects, while A2A had joined the Linux Foundation in June 2025.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Shared standards for agent integration |\n| Why it matters | Reuse, portability, ecosystem growth |\n| Key protocols | MCP, A2A, AGENTS.md, skills formats |\n| Trade-off | Early standards evolve; adoption effort |\n| Failure mode | Proprietary plugin formats per team |\n| Production habit | Prefer open standards for new integrations |\n\n### Protocol map\n\n```mermaid\nflowchart LR\n  AGENT[Agent] -->|MCP| TOOLS[Tools + data servers]\n  AGENT -->|A2A| OTHER[Other agents]\n  REPO[Repositories] -->|AGENTS.md| AGENT\n  SKILLS[Skills folders] --> AGENT\n```"}, {"id": 82, "title": "MCP fundamentals for agent builders", "tldr": "MCP servers expose tools (actions), resources (readable data) and prompts (templates) over JSON-RPC; agent hosts connect through MCP clients over stdio (local) or Streamable HTTP (remote). One server works with any MCP-capable agent.", "real": "Anthropic released MCP in November 2024; OpenAI adopted it in its Agents SDK and products in March 2025, and Google, Microsoft and many developer tools followed during 2025.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Standard protocol connecting agents to capabilities |\n| Why it matters | Build an integration once, use it everywhere |\n| Primitives | Tools, resources, prompts; client features: sampling, roots, elicitation |\n| Trade-off | Extra process boundary and security review |\n| Failure mode | Treating any MCP server as trusted |\n| Production habit | Approved server list per environment |\n\n### Primitives\n\n| Primitive | Controlled by | Example |\n|---|---|---|\n| Tool | Model | create_ticket |\n| Resource | Application | runbook://payments |\n| Prompt | User | /incident-summary |"}, {"id": 83, "title": "Building an MCP server for your system", "tldr": "Wrap your system’s key operations as a few task-oriented MCP tools with clear descriptions, concise outputs and proper authorization. Start local for development, then deploy remotely with authentication for shared use.", "real": "Companies including GitHub, Atlassian, Stripe, Cloudflare and Sentry publish official MCP servers so agents can work with their platforms through a standard interface.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Your system’s agent interface via MCP |\n| Why it matters | Any MCP agent can use your system |\n| Design | Curated tools, not one tool per endpoint |\n| Trade-off | Curation effort vs agent usability |\n| Failure mode | 80 tools mirroring a REST API |\n| Production habit | Agent evals against the server’s tools |\n\n### Server (Python SDK)\n\n```python\nfrom mcp.server.fastmcp import FastMCP\n\nmcp = FastMCP(\"incidents\")\n\n@mcp.tool()\ndef incidents_open(service: str | None = None) -> str:\n    \"\"\"List open incidents, optionally filtered by service name. Returns id, title, severity, age.\"\"\"\n    rows = incident_db.open(service=service)\n    return \"\\n\".join(f\"{r.id} [{r.severity}] {r.title} ({r.age})\" for r in rows) or \"No open incidents.\"\n\n@mcp.tool()\ndef incidents_add_note(incident_id: str, note: str) -> str:\n    \"\"\"Add a timeline note to an incident. Use for status updates, not resolution.\"\"\"\n    incident_db.add_note(incident_id, note)\n    return f\"Note added to {incident_id}.\"\n\nif __name__ == \"__main__\":\n    mcp.run()\n```"}, {"id": 84, "title": "Consuming MCP servers in agents", "tldr": "Agents connect to MCP servers through their host or SDK configuration, discover tools, and call them like native tools. Control which servers and tools each agent can use, and watch the context cost of many tool definitions.", "real": "Claude Code, Cursor, VS Code with GitHub Copilot, ChatGPT and other clients can connect to MCP servers, and agent SDKs such as the OpenAI Agents SDK and Claude Agent SDK accept MCP server configurations.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Using MCP tools inside an agent |\n| Why it matters | Instant access to many integrations |\n| Controls | Server allow-list, tool filtering, per-tool permissions |\n| Trade-off | Capability vs context size and risk |\n| Failure mode | Dozens of servers connected “just in case” |\n| Production habit | Connect only servers the agent’s job needs |\n\n### Configuration (example)\n\n```json\n{\n  \"mcpServers\": {\n    \"incidents\": {\"type\": \"http\", \"url\": \"https://mcp.internal.example/incidents\"},\n    \"github\": {\"type\": \"http\", \"url\": \"https://api.githubcopilot.com/mcp/\"}\n  }\n}\n```\n\n(Configuration formats differ by client; check your host’s documentation.)"}, {"id": 85, "title": "MCP authorization", "tldr": "Remote MCP servers should use OAuth-based authorization so agents act on behalf of users with scoped permissions. Servers must validate tokens issued for them and enforce per-user access in every tool.", "real": "The MCP specification added OAuth 2.1-based authorization in March 2025 and revised it in June 2025, classifying MCP servers as OAuth resource servers and requiring resource indicators to prevent tokens being reused across servers.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | User-delegated access for MCP tools |\n| Why it matters | Agents shouldn’t use superuser credentials |\n| Key points | Scoped tokens, audience validation, consent, no token passthrough |\n| Trade-off | Login friction vs safety |\n| Failure mode | One shared API key for all users |\n| Production habit | Per-user tokens; audit by user and agent |\n\n### Checklist\n\n- [ ] OAuth flow with user consent\n- [ ] Token audience validated by server\n- [ ] Minimal scopes per tool\n- [ ] Authorization re-checked inside each tool\n- [ ] Tokens never forwarded to unrelated services"}, {"id": 86, "title": "MCP security risks", "tldr": "MCP adds attack paths: malicious or compromised servers, tool poisoning in descriptions, changing tool definitions after approval, injected content in tool results, and over-privileged credentials. Govern servers like any third-party code.", "real": "Invariant Labs showed in 2025 both “tool poisoning” (hidden instructions in MCP tool descriptions) and an attack where a malicious GitHub issue led an agent using the GitHub MCP server to leak private repository data.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Threats from connecting agents to tool servers |\n| Why it matters | One bad server can compromise an agent’s whole context |\n| Trade-off | Ecosystem openness vs control |\n| Failure mode | Installing unvetted community servers with production tokens |\n| Production habit | Pin versions; review descriptions; monitor changes |\n\n### Controls\n\n| Threat | Control |\n|---|---|\n| Malicious server | Vetted registry, code review |\n| Tool poisoning | Review and hash tool descriptions |\n| Definition changes | Alert on changes; re-approval |\n| Injection in results | Treat results as untrusted data |\n| Over-privilege | Scoped, per-user tokens |"}, {"id": 87, "title": "Agent-to-agent communication with A2A", "tldr": "A2A lets agents discover each other through Agent Cards, send tasks, exchange messages, stream progress and return artifacts, regardless of framework or vendor. Use it when independent agents owned by different teams or companies must collaborate.", "real": "Google launched the Agent2Agent protocol in April 2025 with more than 50 technology partners and contributed it to the Linux Foundation in June 2025.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Protocol for peer agents to collaborate |\n| Why it matters | Cross-team and cross-company agent workflows |\n| Concepts | Agent Card, task lifecycle, messages, artifacts, streaming |\n| Trade-off | Interoperability vs trust between agents |\n| Failure mode | Accepting remote agent outputs without validation |\n| Production habit | Authenticate agents; validate artifacts |\n\n### Task flow\n\n```mermaid\nsequenceDiagram\n  participant C as Client agent\n  participant R as Remote agent\n  C->>R: Discover Agent Card\n  C->>R: Send task\n  R-->>C: Status: working\n  R-->>C: Artifact: result\n  R-->>C: Status: completed\n```"}, {"id": 88, "title": "Agent identity and discovery", "tldr": "As agents act across systems, they need identities: who the agent is, who it acts for, what it may do, and how others verify it. Discovery mechanisms (registries, Agent Cards) let agents and humans find approved agents.", "real": "Microsoft introduced Entra Agent ID in May 2025 to give AI agents managed identities in its identity platform, reflecting the need to govern agents like users and applications.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Identity, authentication and registry for agents |\n| Why it matters | Accountability, access control, audit |\n| Elements | Agent ID, owner, on-behalf-of user, scopes, registry entry |\n| Trade-off | Governance overhead vs control |\n| Failure mode | Anonymous agents with shared service accounts |\n| Production habit | Every agent registered with an owner |\n\n### Registry entry\n\n| Field | Example |\n|---|---|\n| Agent ID | agent:support-triage |\n| Owner | Support platform team |\n| Acts on behalf of | Authenticated customer |\n| Tools | orders_get, returns_start, kb_search |\n| Data access | Orders (read), returns (write, limited) |\n| Status | Production, reviewed 2026-10 |"}, {"id": 89, "title": "AGENTS.md and skills", "tldr": "Project instruction files (AGENTS.md, CLAUDE.md) tell agents how a codebase or workspace works; skills package task-specific instructions and scripts that agents load only when relevant. Both are versioned knowledge for agents.", "real": "AGENTS.md, launched in 2025 and reported in use by more than 60,000 open-source projects by December 2025, and Anthropic’s Agent Skills (October 2025), which load a skill’s full instructions only when its description matches the task, are complementary approaches.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | File-based knowledge for agents |\n| Why it matters | Consistent behavior without bloated prompts |\n| AGENTS.md | Always-relevant project rules and commands |\n| Skills | On-demand procedures with optional scripts |\n| Trade-off | Maintenance vs consistency |\n| Failure mode | Outdated instructions followed precisely |\n| Production habit | Review in code review; keep concise |\n\n### Skill folder\n\n```text\nskills/\n  release-notes/\n    SKILL.md          # name, description, step-by-step instructions\n    template.md       # output template\n    collect.py        # script to gather merged PRs\n```"}, {"id": 90, "title": "Agent ecosystems and commerce", "tldr": "Agents increasingly act in ecosystems: app directories inside assistants, tool marketplaces, and agent-initiated payments. New protocols address how agents discover services, prove authorization and pay safely on users’ behalf.", "real": "In 2025, Visa and Mastercard announced agentic commerce programs, Google introduced the Agent Payments Protocol (AP2), and OpenAI and Stripe launched the Agentic Commerce Protocol for purchases inside ChatGPT, signaling standards for agent-driven transactions.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Markets and protocols where agents transact and integrate |\n| Why it matters | Agents moving from answering to acting economically |\n| Key concerns | User mandates, spending limits, fraud, liability |\n| Trade-off | Convenience vs financial risk |\n| Failure mode | Agents completing purchases without explicit user authorization |\n| Production habit | Explicit, scoped user mandates and confirmations |\n\n### Safe agent payment flow\n\n```mermaid\nflowchart LR\n  USER[User sets mandate: item, max price] --> AGENT[Agent finds options]\n  AGENT --> CONFIRM[User confirms purchase]\n  CONFIRM --> PAY[Payment via tokenized credential]\n  PAY --> RECEIPT[Receipt + audit log]\n```"}, {"id": 91, "title": "When multiple agents beat one", "tldr": "Use multiple agents when work splits into independent parallel parts, when each part needs isolated context or different tools, or when separation of duties matters. Otherwise a single capable agent with good tools is simpler, cheaper and more coherent.", "real": "In June 2025 Cognition argued in “Don’t Build Multi-Agents” that sharing context between agents is fragile for tightly coupled tasks, while Anthropic reported large gains from multi-agent designs on broad research, showing the answer depends on task structure.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Choosing between single and multi-agent designs |\n| Why it matters | Multi-agent adds cost and failure modes |\n| Good fit | Breadth-first research, parallel independent subtasks |\n| Poor fit | Coherent single artifacts (one code change, one document) |\n| Trade-off | Parallelism vs coordination |\n| Failure mode | Agents producing conflicting parts |\n| Production habit | Prove gains over a single-agent baseline |\n\n### Decision\n\n```mermaid\nflowchart TD\n  A{Subtasks independent?} -- no --> SINGLE[Single agent]\n  A -- yes --> B{Each needs large separate context or tools?}\n  B -- no --> PAR[Single agent with parallel tool calls]\n  B -- yes --> MULTI[Orchestrator + subagents]\n```"}, {"id": 92, "title": "Orchestrator and subagents", "tldr": "An orchestrator agent decomposes the task, gives subagents precise briefs, runs them (often in parallel) and synthesizes their condensed results. Subagents keep their own context, so the orchestrator stays focused.", "real": "Anthropic’s 2025 research system used a lead agent that created 3–5 subagents for typical complex queries, each searching in parallel and returning condensed findings to the lead.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Hierarchical delegation with context isolation |\n| Why it matters | Scales breadth without overloading one context |\n| Trade-off | Token cost multiplies |\n| Failure mode | Vague briefs causing duplicate or missing work |\n| Production habit | Standard brief and result formats |\n\n### Brief template\n\n```yaml\nobjective: Identify 2026 pricing for top 3 competitors' enterprise plans\nsources: Official sites, press releases\nexclude: Forums, speculation\noutput: Table [vendor, plan, price, source URL, date]\nlimits: 10 searches, 8 page reads\nreturn: findings, confidence, open questions\n```"}, {"id": 93, "title": "Handoffs between specialist agents", "tldr": "Handoffs pass control of a conversation from one agent to another better suited for the next part, carrying context. They fit staged customer journeys; design clear handoff rules and avoid ping-pong.", "real": "The OpenAI Agents SDK made handoffs a core primitive in 2025, following its 2024 Swarm experiment, so a triage agent can transfer a conversation to billing or support specialists.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Transferring conversation ownership between agents |\n| Why it matters | Specialized instructions and tools per stage |\n| Trade-off | Specialization vs fragmented experience |\n| Failure mode | Agents bouncing users back and forth |\n| Production habit | Handoff summary; limit transfers per conversation |\n\n### Handoff flow\n\n```mermaid\nflowchart LR\n  T[Triage] -->|billing| B[Billing agent]\n  T -->|technical| S[Support agent]\n  B -->|approval needed| H[Human]\n  S -->|refund request| B\n```"}, {"id": 94, "title": "Critic and reviewer agents", "tldr": "A separate reviewer agent checks another agent’s output against criteria, such as policy, accuracy, tests or style, before it is released. Separation of roles catches errors self-review misses, especially with different prompts, models or evidence.", "real": "Code review agents (for example GitHub Copilot code review and CodeRabbit) act as reviewers of human and AI-written pull requests, and many coding-agent workflows add an automated review pass before human review.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | An independent agent evaluating outputs |\n| Why it matters | Quality gate with a different perspective |\n| When to use | Clear criteria; high cost of errors |\n| Trade-off | Extra cost and latency |\n| Failure mode | Reviewer rubber-stamping (same model, same blind spots) |\n| Production habit | Reviewer gets evidence and checklist; measure catch rate |\n\n### Pattern\n\n```mermaid\nflowchart LR\n  WORKER[Worker agent] --> DRAFT[Output]\n  DRAFT --> REVIEW[Reviewer agent with checklist]\n  REVIEW -->|issues| WORKER\n  REVIEW -->|approved| RELEASE[Release / human review]\n```"}, {"id": 95, "title": "Shared state and coordination", "tldr": "Agents coordinate through shared task boards, files or databases where they post results and claim work. Structure entries, assign ownership, and prevent conflicting edits with locks or claims.", "real": "Multi-agent coding setups commonly coordinate through git branches, shared task lists and files, assigning each agent separate files or features to avoid merge conflicts.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Common workspace for agent collaboration |\n| Why it matters | Persistent, inspectable coordination |\n| Trade-off | Flexibility vs consistency |\n| Failure mode | Two agents editing the same file |\n| Production habit | Claim-before-work; one owner per artifact |\n\n### Task board\n\n| Task | Owner | Status | Output |\n|---|---|---|---|\n| Summarize vendor A | agent-2 | done | notes/a.md |\n| Summarize vendor B | agent-3 | in progress | — |\n| Compare vendors | lead | blocked by B | — |"}, {"id": 96, "title": "Communication design between agents", "tldr": "Inter-agent messages should be structured: objective, constraints, context references, expected output format, and results with evidence and confidence. Pass references to large artifacts rather than copying them.", "real": "Anthropic found that early versions of its research system failed when the lead agent gave short, vague instructions to subagents, and improved results by teaching the lead to write detailed task descriptions with objectives, formats and boundaries.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Message formats between agents |\n| Why it matters | Miscommunication is a top multi-agent failure |\n| Trade-off | Detail vs token cost |\n| Failure mode | Subagent unaware of key constraints |\n| Production habit | Schemas for briefs and results |\n\n### Result schema\n\n```json\n{\"task_id\": \"T2\", \"status\": \"complete\",\n \"findings\": [{\"claim\": \"Vendor B enterprise plan is $45/user/month\", \"source\": \"https://...\"}],\n \"confidence\": \"medium\", \"open_questions\": [\"Annual discount unclear\"]}\n```"}, {"id": 97, "title": "Debate and ensembles", "tldr": "Multiple agents answering independently, debating or voting can improve accuracy on reasoning and judgment tasks. Gains depend on diversity of approach and good aggregation, and come at multiplied cost.", "real": "A 2023 study by Du et al. on multiagent debate reported improved factuality and reasoning when several model instances critiqued each other’s answers over multiple rounds.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Several agents producing and reconciling answers |\n| Why it matters | Reduces single-path errors |\n| When to use | High-stakes judgments, ambiguous analysis |\n| Trade-off | Cost multiplier |\n| Failure mode | Identical agents agreeing on the same mistake |\n| Production habit | Vary models, prompts or evidence; record dissent |\n\n### Aggregation options\n\n| Method | Use |\n|---|---|\n| Majority vote | Classification |\n| Judge agent | Open-ended answers |\n| Union of findings | Review / audit tasks |\n| Escalate on disagreement | High stakes |"}, {"id": 98, "title": "How multi-agent systems fail", "tldr": "Multi-agent failures cluster into specification problems (unclear roles and tasks), inter-agent misalignment (ignored or withheld information, conflicting actions) and weak verification (premature termination, missing checks).", "real": "The 2025 MAST study by Cemri et al. analyzed traces from several multi-agent frameworks and defined 14 failure modes in these three categories, finding that many failures came from system design rather than model limits.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Taxonomy of multi-agent breakdowns |\n| Why it matters | Guides design reviews and evals |\n| Trade-off | More agents, more interfaces to fail |\n| Production habit | Tag failures by category in weekly reviews |\n\n### Mitigations\n\n| Category | Mitigation |\n|---|---|\n| Specification | Clear role prompts, briefs with boundaries |\n| Misalignment | Structured messages, shared state, conflict detection |\n| Verification | Dedicated verifier, tests, completion criteria |"}, {"id": 99, "title": "Cost control for agent teams", "tldr": "Each agent carries its own context and reasoning, so multi-agent systems consume many more tokens. Scale the number of agents and tool calls to task complexity, set per-agent budgets and measure cost per successful task.", "real": "Anthropic reported its multi-agent research system used about 15 times more tokens than chat interactions and embedded explicit effort-scaling rules in prompts, such as one agent with 3–10 tool calls for simple fact-finding.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Managing spend in multi-agent systems |\n| Why it matters | Cost can exceed task value |\n| Levers | Effort scaling, budgets, cheaper models for subagents, caching |\n| Trade-off | Thoroughness vs cost |\n| Failure mode | Ten subagents for a one-line answer |\n| Production habit | Complexity classifier decides team size |\n\n### Effort scaling\n\n| Query complexity | Subagents | Tool calls each |\n|---|---|---|\n| Simple | 0–1 | 3–10 |\n| Comparison | 2–4 | 10–15 |\n| Broad research | 5–10 | Budgeted |"}, {"id": 100, "title": "Designing an agent team", "tldr": "Design agent teams like small organizations: clear roles, minimal handoffs, shared goals, defined interfaces, verification roles and a single accountable synthesizer. Start with two roles and add more only when evals show benefit.", "real": "Successful public examples, such as orchestrator-subagent research systems and coding workflows pairing an implementer with a reviewer, use few roles with clear contracts rather than large simulated organizations.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structuring roles and interactions |\n| Why it matters | Team design determines reliability |\n| Principles | Few roles, clear contracts, verification, one synthesizer |\n| Trade-off | Specialization vs coordination cost |\n| Failure mode | Simulating a whole company of agents |\n| Production habit | Add roles one at a time with eval evidence |\n\n### Minimal effective team\n\n```mermaid\nflowchart LR\n  LEAD[Lead: plan + synthesize] --> WORKERS[Workers: parallel subtasks]\n  WORKERS --> LEAD\n  LEAD --> VERIFY[Verifier: checks + tests]\n  VERIFY --> LEAD\n  LEAD --> OUT[Final output]\n```"}, {"id": 101, "title": "Coding agents: the landscape", "tldr": "Coding agents range from inline completion to interactive terminal and IDE agents to background agents that turn tickets into pull requests. They are the most mature agent category because code can be compiled, tested and reviewed.", "real": "Devin (Cognition, March 2024), Claude Code (Anthropic, February 2025), OpenAI Codex and GitHub Copilot’s coding agent (both May 2025) and Cursor’s agent mode illustrate the rapid spread of coding agents across developer workflows.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Agents that read, write, test and ship code |\n| Why it matters | High-value, verifiable work |\n| Modes | Inline, interactive, background, review |\n| Trade-off | Speed vs review load and quality risk |\n| Failure mode | Large unreviewable changes |\n| Production habit | Small tasks, tests required, human review |\n\n### Modes\n\n| Mode | Human involvement | Example |\n|---|---|---|\n| Inline | Continuous | Completions in editor |\n| Interactive | Frequent | Pairing in terminal or IDE |\n| Background | At PR review | Ticket → PR |\n| Review | Reads comments | Automated PR review |"}, {"id": 102, "title": "Repository context", "tldr": "Coding agents need to understand a codebase: structure, conventions, build and test commands, and architecture. Provide instruction files, let agents search and read on demand, and keep documentation accurate.", "real": "AGENTS.md and CLAUDE.md files give coding agents project-specific commands and conventions; OpenAI’s 2026 “Harness engineering” post emphasized structured, up-to-date in-repo documentation as essential for agent-written code.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How agents learn a codebase |\n| Why it matters | Prevents convention violations and wasted exploration |\n| Sources | Instruction files, docs, search tools, tests |\n| Trade-off | Doc maintenance vs agent effectiveness |\n| Failure mode | Agent inventing patterns that don’t match the codebase |\n| Production habit | Short instruction file + pointers to deeper docs |\n\n### What to document for agents\n\n| Item | Example |\n|---|---|\n| Commands | install, test, lint, run |\n| Architecture | Module boundaries, data flow |\n| Conventions | Naming, error handling, logging |\n| Rules | Files not to edit, required reviews |\n| Gotchas | Flaky tests, environment quirks |"}, {"id": 103, "title": "Editing strategies", "tldr": "Agents modify code through whole-file rewrites, search-and-replace edits, unified diffs or AST-aware tools. Targeted edits are cheaper and safer for large files; validate every edit by re-reading, linting and testing.", "real": "Aider, an open-source coding assistant, published benchmarks comparing edit formats such as whole-file, search/replace blocks and unified diffs, finding that the choice of edit format materially affected model success.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How agents apply code changes |\n| Why it matters | Edit errors corrupt files or miss changes |\n| Formats | Whole file, search/replace, diff, structured edit tools |\n| Trade-off | Token efficiency vs robustness |\n| Failure mode | Search string not unique, wrong location edited |\n| Production habit | Require unique matches; lint after each edit |\n\n### Comparison\n\n| Format | Pros | Cons |\n|---|---|---|\n| Whole file | Simple | Expensive for large files |\n| Search/replace | Precise, cheap | Fails if text not unique |\n| Unified diff | Standard | Models make formatting errors |\n| Structured edit tool | Validated | Tool-specific |"}, {"id": 104, "title": "Test-driven agent loops", "tldr": "Tests turn coding into a verifiable loop: reproduce the bug with a failing test, implement the fix, run tests, read failures, iterate. Protect against agents weakening tests to make them pass.", "real": "SWE-bench (2023) evaluates coding agents by running hidden tests from the real fix after the agent’s patch, making passing tests the definition of success for real GitHub issues.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Tests as the agent’s feedback signal |\n| Why it matters | Objective progress and completion criteria |\n| Trade-off | Test writing takes time |\n| Failure mode | Agent deleting or skipping failing tests |\n| Production habit | Flag test modifications for review |\n\n### Loop\n\n```mermaid\nflowchart LR\n  REPRO[Reproduce: failing test] --> FIX[Change code]\n  FIX --> RUN[Run tests]\n  RUN -- fail --> ANALYZE[Read failure]\n  ANALYZE --> FIX\n  RUN -- pass --> QUALITY[Lint + type check + full suite]\n  QUALITY --> DONE[Report with evidence]\n```"}, {"id": 105, "title": "Sandboxes for coding agents", "tldr": "Run coding agents in isolated environments: containers or microVMs with the repository, dependencies and test tools, limited network access and no production credentials. Sandboxes make autonomy safe.", "real": "Cloud coding agents such as OpenAI’s Codex run each task in its own isolated cloud container preloaded with the repository, and Firecracker microVMs (open-sourced by AWS in 2018) are widely used for lightweight isolation of untrusted code.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Isolated execution environments for code agents |\n| Why it matters | Contains mistakes and injected instructions |\n| Controls | Filesystem scope, network allow-list, no secrets, resource limits |\n| Trade-off | Setup effort vs safety |\n| Failure mode | Agent running on a developer laptop with cloud credentials |\n| Production habit | Ephemeral sandbox per task; reproducible images |\n\n### Sandbox spec\n\n| Setting | Value |\n|---|---|\n| Image | Repo + toolchain, pinned versions |\n| Network | Package registries only |\n| Credentials | None (or short-lived read-only) |\n| Limits | 4 CPU, 8 GB RAM, 60 min |\n| Output | Branch + logs |"}, {"id": 106, "title": "Terminal and shell use", "tldr": "Shell access lets agents run builds, tests, linters, git and scripts, which greatly increases capability. Control it with command allow-lists, approval for risky commands, sandboxing and output truncation.", "real": "Terminal-Bench (2025) evaluates agents on real command-line tasks such as compiling code, configuring environments and processing data, reflecting how central shell use has become to agent capability.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Agent execution of shell commands |\n| Why it matters | Access to the full developer toolchain |\n| Risks | Destructive commands, data exfiltration, long-running processes |\n| Trade-off | Capability vs control |\n| Failure mode | `rm -rf` or force pushes without approval |\n| Production habit | Allow-list common commands; ask for others |\n\n### Command policy\n\n| Command type | Policy |\n|---|---|\n| Read-only (ls, cat, grep, git status) | Allow |\n| Build and test | Allow |\n| Package install | Ask |\n| Network (curl, wget) | Allow-listed domains |\n| Destructive (rm -rf, git push --force) | Deny / ask |"}, {"id": 107, "title": "Code review agents", "tldr": "Review agents analyze pull requests for bugs, security issues and convention violations, commenting with severity and suggested fixes. They speed reviews but must be tuned to avoid noise; humans keep merge authority.", "real": "GitHub Copilot code review and tools such as CodeRabbit became widely used during 2024–2025, and teams commonly measure the share of AI comments that developers accept to tune rules.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Automated reviewer on code changes |\n| Why it matters | Faster, consistent first-pass review |\n| Good at | Bugs, missing checks, security patterns |\n| Weak at | Product intent, architecture decisions |\n| Trade-off | Coverage vs comment noise |\n| Failure mode | Dozens of nitpicks hiding one real bug |\n| Production habit | Severity labels; track acceptance rate |\n\n### Comment format\n\n```text\n[HIGH] Possible SQL injection: `query` built with f-string from request param `sort`.\nSuggest: map `sort` through an allow-list before building the query.\n```"}, {"id": 108, "title": "Background agents and pull requests", "tldr": "Background agents take a ticket, work asynchronously in a sandbox, and open a pull request with a summary, test results and open questions. They scale engineering capacity for well-specified tasks while humans review.", "real": "GitHub Copilot’s coding agent, announced in May 2025, can be assigned GitHub issues and opens draft pull requests that developers review, with the agent responding to review comments.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Asynchronous agents producing PRs |\n| Why it matters | Parallel work without developer attention |\n| Good tasks | Bugs with repro steps, small features, migrations, tests |\n| Trade-off | Review burden shifts to humans |\n| Failure mode | Vague tickets producing wrong solutions |\n| Production habit | Ticket templates with acceptance criteria |\n\n### PR description template\n\n```markdown\n## Summary\nFixes #412: checkout fails for empty coupon codes.\n## Changes\n- Treat empty coupon string as None in `apply_coupon`\n## Verification\n- Added test `test_empty_coupon_ignored`; full suite passing (1,284 tests)\n## Open questions\n- Should whitespace-only codes also be ignored? (assumed yes)\n```"}, {"id": 109, "title": "Evaluating coding agents", "tldr": "Use public benchmarks to shortlist models and private task suites from your own history to decide. Measure resolve rate with hidden tests, review acceptance, cost, time, diff size and regressions.", "real": "SWE-bench Verified, a 500-task human-validated subset released in August 2024, became a standard benchmark for coding agents, and organizations build internal suites from resolved tickets to reflect their own codebases.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Measuring coding agent effectiveness |\n| Why it matters | Benchmarks may not reflect your stack |\n| Metrics | Resolve rate, PR merge rate, review time, defects, cost |\n| Trade-off | Building internal suites takes effort |\n| Failure mode | Choosing tools from leaderboard scores alone |\n| Production habit | Quarterly re-evaluation on internal tasks |\n\n### Internal suite fields\n\n| Field | Example |\n|---|---|\n| Ticket text | Original issue |\n| Starting commit | Before fix |\n| Hidden tests | From the real fix |\n| Pass criteria | Hidden tests + full suite |\n| Cost and time | Recorded per run |"}, {"id": 110, "title": "Adopting coding agents in teams", "tldr": "Introduce coding agents with a policy (approved tools, data rules), shared instruction files, permission settings, review norms and measurement. Expect different gains for different tasks and developers; measure rather than assume.", "real": "A July 2025 METR randomized study found experienced open-source developers took 19% longer on tasks in their own repositories when allowed AI tools, while believing they were faster, highlighting the need to measure real effects.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Organizational rollout of coding agents |\n| Why it matters | Productivity effects vary widely |\n| Elements | Policy, permissions, instruction files, training, metrics |\n| Trade-off | Speed of adoption vs quality control |\n| Failure mode | Mandating tools without measuring outcomes |\n| Production habit | Track cycle time, change failure rate, satisfaction |\n\n### Rollout plan\n\n| Phase | Activity |\n|---|---|\n| Pilot | Volunteers, varied task types |\n| Policy | Data rules, approved tools, review norms |\n| Enablement | AGENTS.md, permission presets, training |\n| Measure | Before/after delivery and quality metrics |\n| Scale | Expand where evidence is positive |"}, {"id": 111, "title": "Browser and computer-use agents", "tldr": "These agents operate websites and desktop applications like a person: reading the screen, clicking, typing and scrolling. They automate tasks where no API exists, but are slower, costlier and more fragile than API-based agents.", "real": "Anthropic released computer use in public beta in October 2024, OpenAI launched Operator in January 2025 and ChatGPT agent in July 2025, and Google introduced browser-control capabilities through Project Mariner.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Agents controlling GUIs via screenshots and input actions |\n| Why it matters | Reaches systems without APIs |\n| When to use | Legacy apps, websites without APIs, one-off tasks |\n| When not to use | When an API or MCP server exists |\n| Trade-off | Universality vs speed and reliability |\n| Failure mode | Misclicks on changed layouts; injected page instructions |\n| Production habit | Prefer APIs; use GUI agents as a last resort |\n\n### Comparison\n\n| Approach | Speed | Reliability | Injection exposure |\n|---|---|---|---|\n| API / MCP tools | Fast | High | Low |\n| Scripted browser automation | Medium | Medium | Medium |\n| Vision-based computer use | Slow | Lower | High |"}, {"id": 112, "title": "Perception: screenshots, DOM and accessibility trees", "tldr": "Agents perceive interfaces through screenshots (pixels), the DOM (HTML structure) or accessibility trees (semantic elements). Combining structured page data with screenshots improves reliability and reduces cost.", "real": "Benchmarks such as Mind2Web (2023) and WebArena (2023) explored agents using HTML and accessibility representations, while vision-based approaches such as Set-of-Mark prompting (2023) overlaid numbered labels on screenshots to help models refer to elements.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How the agent “sees” the interface |\n| Why it matters | Perception errors cause wrong actions |\n| Options | Screenshots, DOM, accessibility tree, hybrid |\n| Trade-off | Pixels are universal; structure is precise and cheaper |\n| Failure mode

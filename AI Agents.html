eport |\n\n### Segmented eval report (illustrative)\n\n| Segment | Task success |\n|---|---|\n| English | 91% |\n| Hindi | 83% |\n| Tamil | 79% |\n| Non-native phrasing | 80% |"}, {"id": 179, "title": "Documenting agents", "tldr": "Document each agent: purpose, scope, users, tools and permissions, data, models, evaluation results, limitations, safeguards, oversight and owners. Documentation supports users, auditors, incident responders and future maintainers.", "real": "Model cards (2019) and AI system cards from AI labs established documentation norms, and the EU AI Act requires technical documentation for high-risk systems, which agent teams adapt into agent cards.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structured description of an agent |\n| Why it matters | Transparency, compliance, maintainability |\n| Trade-off | Effort vs value (high for high-risk agents) |\n| Failure mode | Documentation drifting from reality |\n| Production habit | Generate from registry + release manifest |\n\n### Agent documentation template\n\n| Section | Content |\n|---|---|\n| Purpose | Job, users, scope |\n| Capabilities | Tools, permissions, autonomy |\n| Data | Sources, retention |\n| Models | Versions, routing |\n| Evaluation | Success, pass^k, safety, segments |\n| Limitations | Known failure modes |\n| Safeguards | Guardrails, approvals, monitoring |\n| Ownership | Owner, escalation contacts |"}, {"id": 180, "title": "Handling agent incidents responsibly", "tldr": "When an agent causes harm, contain it, assess who was affected, remediate (refunds, corrections, notifications), investigate root causes, communicate honestly and improve systems. Some incidents trigger legal reporting duties.", "real": "The AI Incident Database, maintained by the Responsible AI Collaborative, catalogs real-world AI incidents, helping organizations learn from failures such as chatbot misstatements and harmful automated decisions.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Responsible response to agent-caused harm |\n| Why it matters | Limits damage; preserves trust |\n| Steps | Contain, assess, remediate, investigate, communicate, prevent |\n| Trade-off | Transparency vs legal caution |\n| Failure mode | Fixing the bug but not the affected users’ outcomes |\n| Production habit | Remediation plan for affected users in every postmortem |\n\n### Response checklist\n\n- [ ] Agent or tool disabled\n- [ ] Affected runs and users identified from traces\n- [ ] Users’ outcomes corrected\n- [ ] Notifications sent where required\n- [ ] Root cause fixed in design\n- [ ] Eval and red-team cases added\n- [ ] Postmortem shared"}, {"id": 181, "title": "Finding good agent use cases", "tldr": "Good first agent use cases are frequent, time-consuming, rule-guided tasks with clear success checks, available tools or APIs, recoverable errors and measurable value. Score candidates on value, feasibility and risk before building.", "real": "Gartner predicted in June 2025 that over 40% of agentic AI projects would be canceled by the end of 2027, citing costs, unclear business value and inadequate risk controls, which makes disciplined use-case selection essential.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Choosing where agents create value |\n| Why it matters | Most failures start with the wrong use case |\n| Good signs | High volume, clear rules, APIs available, verifiable outcomes |\n| Bad signs | Rare tasks, ambiguous goals, irreversible high-stakes actions |\n| Trade-off | Ambition vs probability of success |\n| Production habit | Score and rank candidates with stakeholders |\n\n### Scoring sheet\n\n| Use case | Volume | Value | Feasibility | Risk | Score |\n|---|---|---|---|---|---|\n| Order status + returns | High | Medium | High | Low | ★★★★★ |\n| Invoice exception triage | Medium | High | Medium | Medium | ★★★★ |\n| Contract negotiation | Low | High | Low | High | ★ |"}, {"id": 182, "title": "ROI and business cases", "tldr": "Calculate value as tasks automated or accelerated times value per task, minus model costs, tooling, human review, engineering and operations. Use ranges, pilot data and stage gates, and track realized ROI after launch.", "real": "Klarna estimated in 2024 that its AI assistant would drive about $40 million in profit improvement that year, and later emphasized continued human support, illustrating both the scale of potential value and the need to balance automation with quality.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Financial justification for agents |\n| Why it matters | Secures investment; prevents zombie projects |\n| Include | Model, infrastructure, review, engineering, ops costs |\n| Trade-off | Early estimates are uncertain |\n| Failure mode | Counting only model costs |\n| Production habit | Measure realized value monthly |\n\n### ROI model\n\n```\nannual_value = tasks_per_year × resolution_rate × (human_cost_per_task − agent_cost_per_task)\n               − review_costs − platform_and_engineering_costs\nExample: 500,000 × 0.6 × ($5.00 − $0.08) − $150,000 − $400,000 = $926,000\n```"}, {"id": 183, "title": "Pricing agent products", "tldr": "Agent products are priced per seat, per usage (tasks, conversations, credits) or per outcome (resolutions). Choose a model aligned with customer value and your cost structure, with limits that protect margins.", "real": "Salesforce launched Agentforce in 2024 at $2 per conversation and Intercom charges $0.99 per resolution for Fin, while Microsoft priced Microsoft 365 Copilot as a $30 per user per month add-on, illustrating different pricing philosophies.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Monetization models for agents |\n| Why it matters | Agents have variable costs per task |\n| Models | Seat, usage, outcome, hybrid |\n| Trade-off | Customer predictability vs alignment with value |\n| Failure mode | Flat pricing with unlimited heavy usage |\n| Production habit | Monitor margin per customer |\n\n### Comparison\n\n| Model | Pros | Cons |\n|---|---|---|\n| Per seat | Predictable | Misaligned with usage |\n| Per task / conversation | Tracks cost | Customer bill uncertainty |\n| Per outcome | Aligned with value | Outcome definition disputes |\n| Hybrid | Balanced | Complexity |"}, {"id": 184, "title": "Build vs buy", "tldr": "Buy agents for common functions (support platforms, coding assistants, meeting notes) when they fit; build when the agent depends on proprietary workflows, data or differentiated experiences. Many organizations combine bought platforms with custom tools.", "real": "Enterprises adopted packaged agent products such as GitHub Copilot, Intercom Fin and Salesforce Agentforce while building custom agents for proprietary processes, often connecting them through MCP or vendor APIs.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Sourcing decision for agent capabilities |\n| Why it matters | Focuses engineering on differentiation |\n| Buy when | Common use case, good vendor fit, fast value |\n| Build when | Proprietary process, unique data, competitive advantage |\n| Trade-off | Speed vs control and fit |\n| Failure mode | Building a generic support agent from scratch |\n| Production habit | Re-evaluate yearly as vendors mature |\n\n### Decision factors\n\n| Factor | Build | Buy |\n|---|---|---|\n| Differentiation | High | Low |\n| Time to value | Slower | Faster |\n| Customization | Full | Limited |\n| Maintenance | Yours | Vendor’s |\n| Data control | Full | Contractual |"}, {"id": 185, "title": "Change management and adoption", "tldr": "Agents change how people work. Involve affected teams early, explain what the agent does and doesn’t do, train users and reviewers, address job concerns honestly, celebrate wins and measure adoption, not just deployment.", "real": "Duolingo’s April 2025 “AI-first” announcement drew public backlash over workforce implications, while companies that framed agents as handling routine work so people could focus on complex cases generally reported smoother adoption.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Helping people adopt agents successfully |\n| Why it matters | Unused or resisted agents deliver no value |\n| Practices | Involvement, training, transparent communication, feedback channels |\n| Trade-off | Speed of rollout vs acceptance |\n| Failure mode | Launching an agent without informing the team it affects |\n| Production habit | Adoption metrics and user feedback reviews |\n\n### Adoption plan\n\n```mermaid\nflowchart LR\n  INVOLVE[Involve team in design] --> PILOT[Pilot with champions]\n  PILOT --> TRAIN[Train users + reviewers]\n  TRAIN --> LAUNCH[Launch with feedback channel]\n  LAUNCH --> IMPROVE[Improve + share results]\n```"}, {"id": 186, "title": "Human–agent teams", "tldr": "The most effective deployments combine agents and people: agents handle volume and preparation, humans handle judgment, exceptions and relationships. Redesign workflows and roles around this split rather than simply adding an agent.", "real": "Microsoft’s 2025 Work Trend Index described “human-agent teams” and the idea of employees directing agents, while support organizations using AI agents commonly shifted human staff toward complex cases and quality review.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Workflows designed for humans and agents together |\n| Why it matters | Combines scale with judgment |\n| Agent strengths | Volume, speed, consistency, preparation |\n| Human strengths | Judgment, empathy, exceptions, accountability |\n| Trade-off | Redesign effort vs better outcomes |\n| Failure mode | Humans reduced to rubber-stamping agent output |\n| Production habit | Define handoff points and human responsibilities |\n\n### Work split\n\n| Task | Agent | Human |\n|---|---|---|\n| Routine requests | Resolves | Audits samples |\n| Complex cases | Prepares summary + options | Decides |\n| Policy exceptions | Flags | Approves |\n| Escalated customers | Hands off with context | Handles |"}, {"id": 187, "title": "AgentOps roles and teams", "tldr": "Operating agents needs new responsibilities: agent owners, agent engineers, evaluation and quality specialists, platform engineers for gateways and tooling, and reviewers or supervisors who oversee agent work.", "real": "The rise of titles such as “AI engineer” after 2023, and of centralized AI platform teams in large companies, reflects how organizations created roles to build and operate agents in production.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Roles needed to run agents |\n| Why it matters | Agents need ongoing care after launch |\n| Trade-off | Headcount vs agent quality |\n| Failure mode | Agent launched by a project team that then disbands |\n| Production habit | Named owner and on-call for each production agent |\n\n### Roles\n\n| Role | Responsibility |\n|---|---|\n| Agent owner | Scope, outcomes, prioritization |\n| Agent engineer | Prompts, tools, orchestration |\n| Eval / quality lead | Eval suites, failure analysis |\n| Platform engineer | Gateway, tracing, sandboxes, registry |\n| Domain reviewer | Approvals, quality judgments |\n| Risk / compliance | Reviews, policies |"}, {"id": 188, "title": "Evaluating agent vendors", "tldr": "Assess vendors on task performance with your data, reliability, security and data handling, integration options (APIs, MCP), controls (permissions, approvals, audit), pricing at your volume and roadmap stability.", "real": "Gartner’s 2025 warning about “agent washing” advised buyers to scrutinize vendor claims, since many products marketed as agents were chatbots or scripted automation without genuine agentic capabilities.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structured vendor assessment |\n| Why it matters | Marketing claims vary widely from reality |\n| Method | Pilot on your tasks with your eval criteria |\n| Trade-off | Evaluation time vs risk of wrong choice |\n| Failure mode | Buying from a demo |\n| Production habit | Contract terms for data, SLAs and exit |\n\n### Vendor scorecard\n\n| Criterion | Question |\n|---|---|\n| Performance | Success rate on our eval tasks? |\n| Reliability | pass^k, uptime, SLAs? |\n| Security | Certifications, data retention, isolation? |\n| Controls | Permissions, approvals, audit logs? |\n| Integration | APIs, MCP, SSO? |\n| Cost | Price at our volume? |\n| Exit | Data export, contract terms? |"}, {"id": 189, "title": "Building an agent platform", "tldr": "When many teams build agents, provide a shared platform: model gateway, tool registry and MCP servers, sandboxes, memory and state services, evaluation and tracing, identity and permissions, policy enforcement and cost management.", "real": "Cloud providers launched managed agent platforms during 2025, such as Amazon Bedrock AgentCore, Google’s Vertex AI Agent Engine and Microsoft’s Azure AI Foundry Agent Service, offering runtime, memory, identity and observability for agents.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Shared infrastructure for building and running agents |\n| Why it matters | Consistency, security and speed across teams |\n| Components | Gateway, tool registry, sandboxes, state, evals, tracing, identity, policy |\n| Trade-off | Platform investment vs duplicated team effort |\n| Failure mode | Each team building its own unreviewed agent stack |\n| Production habit | Paved road: templates that include all safeguards |\n\n### Platform architecture\n\n```mermaid\nflowchart TB\n  TEAMS[Product teams' agents] --> SDK[Platform SDK + templates]\n  SDK --> GW[Model gateway]\n  SDK --> REG[Tool registry / MCP servers]\n  SDK --> SB[Sandboxes]\n  SDK --> STATE[State + memory]\n  SDK --> ID[Agent identity + permissions]\n  OBS[Tracing, evals, cost, policy] -.-> SDK\n```"}, {"id": 190, "title": "Measuring business impact", "tldr": "Measure agents by business outcomes: time saved, tasks resolved, cycle time, quality, customer satisfaction, revenue and cost per outcome. Compare with baselines or control groups, and include negative effects such as rework and complaints.", "real": "Controlled studies, such as Brynjolfsson, Li and Raymond’s 2023 study of a generative AI assistant for customer support agents, which found about a 14% average productivity increase with larger gains for less experienced workers, show the value of measured rather than assumed impact.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Quantifying real-world effects of agents |\n| Why it matters | Justifies investment and guides improvement |\n| Methods | Baselines, A/B or holdout groups, before/after with controls |\n| Trade-off | Rigor vs speed of reporting |\n| Failure mode | Counting conversations handled without checking outcomes |\n| Production habit | Include rework, escalations and complaints in impact |\n\n### Impact scorecard\n\n| Metric | Baseline | With agent |\n|---|---|---|\n| Median resolution time | 9 h | 1.5 h |\n| Cost per resolution | $5.00 | $1.40 (incl. review) |\n| CSAT | 4.2 | 4.3 |\n| Recontact within 7 days | 12% | 13% |\n| Escalation rate | — | 28% |\n\n(Illustrative.)"}, {"id": 191, "title": "Capability trends", "tldr": "Agent capabilities are improving quickly: longer task horizons, better tool use, stronger coding and computer use, and lower cost per unit of capability. Plan products that benefit from better models without depending on unproven capabilities.", "real": "METR’s March 2025 analysis estimated that the length of tasks frontier agents could complete with 50% reliability had been doubling roughly every seven months, while analyses such as a16z’s “LLMflation” estimated rapidly falling prices for a fixed capability level.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Trends shaping what agents can do |\n| Why it matters | Product roadmaps depend on capability timing |\n| Trade-off | Building ahead of capability vs waiting |\n| Failure mode | Heavy scaffolding that new models make unnecessary |\n| Production habit | Capability triggers: re-run evals on new models |\n\n### Planning with trends\n\n| Strategy | Example |\n|---|---|\n| Design to swap models | Gateway + portable evals |\n| Capability triggers | “Enable autonomous mode when pass^4 ≥ 85%” |\n| Avoid over-scaffolding | Keep harness logic simple and removable |"}, {"id": 192, "title": "Long-horizon agents", "tldr": "Agents are moving from minutes-long tasks to hours or days of work. Long horizons require durable state, progress tracking, periodic verification, budget management and human check-ins at milestones.", "real": "Anthropic’s November 2025 guidance on harnesses for long-running agents described initializer and coding agents that worked across many sessions using progress files, feature lists and git history.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Agents working across many sessions |\n| Why it matters | Larger, more valuable tasks |\n| Requirements | Durable state, notes, checkpoints, milestones, budgets |\n| Trade-off | Autonomy vs drift and cost |\n| Failure mode | Agent working for hours in the wrong direction |\n| Production habit | Milestone reviews with humans |\n\n### Milestone structure\n\n```mermaid\nflowchart LR\n  M1[Milestone 1: verified] --> REVIEW1[Human check]\n  REVIEW1 --> M2[Milestone 2: verified]\n  M2 --> REVIEW2[Human check]\n  REVIEW2 --> M3[Milestone 3: done]\n```"}, {"id": 193, "title": "Open problems", "tldr": "Key unsolved problems remain: reliable long-horizon execution, robust defense against prompt injection, evaluation of open-ended tasks, trustworthy memory, agent identity and accountability, and economic viability for complex tasks.", "real": "Security researchers and AI labs have repeatedly stated that prompt injection lacks a complete solution at the model level, which is why architectural containment patterns remain the recommended defense in 2025–2026 guidance.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Limits of current agent technology |\n| Why it matters | Sets realistic expectations and research priorities |\n| Trade-off | Ambition vs reliability |\n| Production habit | Design around open problems rather than assuming they’re solved |\n\n### Open problems and current mitigations\n\n| Problem | Current mitigation |\n|---|---|\n| Prompt injection | Least privilege, isolation, approvals |\n| Long-horizon reliability | Checkpoints, verification, milestones |\n| Evaluation of open tasks | Expert review, rubrics, outcome metrics |\n| Memory trustworthiness | Provenance, user control |\n| Accountability | Identity, audit trails, owners |"}, {"id": 194, "title": "Agent architecture review checklist", "tldr": "Review every agent before launch and after major changes: job and scope, success criteria, autonomy, tools and permissions, context and memory, guardrails, evaluation, observability, security, cost and governance.", "real": "Cloud well-architected frameworks from AWS, Microsoft and Google added generative AI and agent guidance in 2024–2025, reflecting a move toward structured reviews for agentic workloads.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | A standard launch and change review |\n| Why it matters | Catches predictable failures |\n| Production habit | Use at design, pre-launch and quarterly |\n\n### Checklist\n\n| Area | Question |\n|---|---|\n| Scope | Is the job narrow and clear? |\n| Design | Is an agent needed, or would a workflow do? |\n| Autonomy | Per-action policy defined? |\n| Tools | Task-level, least privilege, idempotent writes? |\n| Context | Budgets, compaction, retrieval tested? |\n| Safety | Trifecta check, guardrails, approvals, sandbox? |\n| Evals | Outcome + safety suites, pass^k targets met? |\n| Ops | Tracing, metrics, kill switch, runbooks? |\n| Cost | Cost per success within budget? |\n| Governance | Owner, disclosure, audit trail, privacy? |"}, {"id": 195, "title": "Capstone: a customer support agent", "tldr": "Build a support agent for an online store: scoped tools for orders and returns, policy retrieval, a policy engine with refund limits, human handoff with summaries, disclosure, evals with simulated customers, and staged rollout.", "real": "This capstone combines patterns from Klarna’s and Intercom’s public deployments, tau-bench-style evaluation and the Air Canada ruling’s lesson that policy answers must be grounded and accurate.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| Scope | Order status, returns, address changes |\n| Tools | orders_get, returns_start, address_update, kb_search, handoff |\n| Autonomy | Auto for reads and returns; refunds > $50 need approval |\n| Evals | 200 simulated conversations, pass^4 ≥ 80%, 0 policy violations |\n| Rollout | 5% → 25% → 100% with weekly reviews |\n\n### Architecture\n\n```mermaid\nflowchart LR\n  CUST[Customer] --> AGENT[Support agent]\n  AGENT --> KB[Policy RAG]\n  AGENT --> TOOLS[Order tools]\n  TOOLS --> GUARD[Policy engine]\n  AGENT --> HANDOFF[Human handoff + summary]\n  AGENT --> TRACE[Tracing + evals]\n```"}, {"id": 196, "title": "Capstone: a research agent", "tldr": "Build a research agent that plans, searches and reads sources in parallel, tracks findings with citations, checks for conflicting evidence and produces a report with explicit uncertainty, within token and time budgets.", "real": "This capstone follows the orchestrator–subagent design Anthropic described in 2025, with a lead researcher, parallel subagents, and a citation step, plus effort scaling by query complexity.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| Scope | Market and technical research questions |\n| Tools | web_search, fetch_page, internal_docs_search, notes |\n| Design | Lead + 2–5 subagents; citation verification pass |\n| Evals | Expert checklists for coverage; citation accuracy ≥ 95% |\n| Budgets | ≤ 60 tool calls, ≤ 10 minutes |\n\n### Flow\n\n```mermaid\nflowchart LR\n  Q[Question] --> LEAD[Lead: plan]\n  LEAD --> S1[Subagent 1]\n  LEAD --> S2[Subagent 2]\n  S1 --> LEAD\n  S2 --> LEAD\n  LEAD --> CITE[Citation check]\n  CITE --> REPORT[Report + uncertainty]\n```"}, {"id": 197, "title": "Capstone: an IT operations agent", "tldr": "Build an ops agent that triages alerts, gathers logs and metrics, correlates with recent deploys, proposes runbook actions, and executes only approved reversible actions, while drafting incident updates.", "real": "Observability and incident management vendors introduced AI investigation agents in 2024–2025 that focus first on diagnosis and summarization, reflecting the industry’s cautious approach to automated remediation.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| Scope | Alert triage, diagnosis, incident summaries |\n| Tools | metrics_query, logs_search, deploys_list, runbook_get, action_execute (approved only) |\n| Autonomy | Read-only by default; restarts/rollbacks with approval |\n| Evals | Replayed past incidents; diagnosis accuracy, time to diagnosis |\n| Safety | Production credentials scoped; every action audited |\n\n### Flow\n\n```mermaid\nflowchart LR\n  ALERT[Alert] --> GATHER[Gather metrics, logs, deploys]\n  GATHER --> DIAG[Diagnosis + evidence]\n  DIAG --> PROPOSE[Propose runbook action]\n  PROPOSE --> APPROVE{On-call approves?}\n  APPROVE -- yes --> EXEC[Execute + verify]\n  APPROVE -- no --> NOTE[Add note to incident]\n```"}, {"id": 198, "title": "Capstone: an internal coding agent workflow", "tldr": "Set up background coding agents for a team: ticket templates with acceptance criteria, sandboxed execution, AGENTS.md, test gates, PR-only output, AI review pass, human merge and metrics on merge rate, defects and cost.", "real": "This capstone mirrors GitHub Copilot’s coding agent and OpenAI’s Codex cloud workflows introduced in 2025, in which agents work in isolated environments and deliver pull requests for human review.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| Scope | Bugs with repro steps, small features, test additions |\n| Environment | Ephemeral container, no production secrets |\n| Gates | Tests + lint pass; AI review; human approval |\n| Metrics | PR merge rate, review time, post-merge defects, cost per merged PR |\n| Rollout | One team, then expand with evidence |\n\n### Pipeline\n\n```mermaid\nflowchart LR\n  TICKET[Ticket with acceptance criteria] --> SANDBOX[Sandbox]\n  SANDBOX --> AGENT[Coding agent]\n  AGENT --> TESTS[Tests + lint]\n  TESTS --> PR[Pull request]\n  PR --> AIREVIEW[AI review]\n  AIREVIEW --> HUMAN[Human review + merge]\n```"}, {"id": 199, "title": "The agent builder’s principles", "tldr": "Distill the handbook into principles: start simple, scope narrowly, design tools carefully, curate context, verify everything, enforce rules in code, evaluate with repeated trials, trace every run, limit privileges, and keep humans accountable.", "real": "Guidance from Anthropic, OpenAI, Google and practitioners converged during 2024–2026 on similar principles: simplicity, transparency, careful tool design, evaluation and human oversight.", "body": "### Agent card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Core principles for building agents |\n| Why it matters | A compact guide for decisions |\n| Production habit | Revisit principles in every design review |\n\n### Principles\n\n| # | Principle |\n|---|---|\n| 1 | Use the simplest design that meets the eval bar |\n| 2 | Narrow scope before broad ambition |\n| 3 | Tools are interfaces: design them for the model |\n| 4 | Context is scarce: curate it |\n| 5 | Verify outcomes, don’t assume them |\n| 6 | Rules that matter live in code |\n| 7 | Measure pass^k, not lucky runs |\n| 8 | Trace everything |\n| 9 | Least privilege; contain injection |\n| 10 | A human owns every agent |"}, {"id": 200, "title": "Glossary and mastery roadmap", "tldr": "Use the glossary for shared language and the roadmap to progress from single tool calls to production multi-agent systems. Build, measure, break and fix real agents to develop mastery.", "real": "Recommended reading: Anthropic’s “Building effective agents”, “Effective context engineering for AI agents” and “Writing effective tools for agents”; OpenAI’s “A practical guide to building agents”; the ReAct, Reflexion, SWE-agent and tau-bench papers; and the MCP specification.", "body": "### Glossary\n\n| Term | Meaning |\n|---|---|\n| Agent | Model-directed loop using tools toward a goal |\n| Workflow | Code-directed sequence of model calls |\n| Harness | Software around the model: tools, context, limits |\n| ACI | Agent–computer interface |\n| ReAct | Reason + act loop |\n| Compaction | Summarizing context to continue |\n| MCP / A2A | Agent–tool / agent–agent protocols |\n| pass^k | Success on all k trials |\n| Lethal trifecta | Private data + untrusted content + external communication |\n| HITL | Human in the loop |\n\n### Mastery roadmap\n\n1. Build the step-by-step agent in Part 7\n2. Write 50 eval tasks and measure pass^4\n3. Redesign tools based on trace analysis\n4. Add approvals and a policy engine\n5. Expose an internal system via MCP\n6. Red-team your agent and fix findings\n7. Run a long-horizon agent with progress files\n8. Lead an agent architecture review"}];
const PARTS = ["Agent foundations", "How agents reason", "Designing an agent", "Tools for agents", "Context and memory", "Control flow and orchestration", "Building an agent step by step", "Agent frameworks and SDKs", "Protocols and ecosystems", "Multi-agent systems", "Coding agents", "Browser and computer-use agents", "Domain agents", "Evaluating agents", "Observability and operations", "Reliability, latency and cost", "Agent security", "Governance and responsible agents", "Agents in business", "Future, capstones and mastery"];
const TOTAL = 200, PER = 10;
function idsOf(p){ const a = []; for (let i = (p-1)*PER + 1; i <= p*PER; i++) a.push(i); return a; }
const partOf = id => Math.ceil(id / PER);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "ai-agents-progress-v1";
const LS_LAST = "ai-agents-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try{ await dbRef.set({done:[...done].sort((a,b)=>a-b), updated:Date.now()}); }
  catch(e){ if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; pushRemote(); }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...done])); }catch(e){} }
function toggle(id){
  if (done.has(id)) done.delete(id); else done.add(id);
  saveLocal(); pushRemote(); renderAll();
  toast(done.has(id) ? "Chapter " + id + " marked complete" : "Chapter " + id + " marked not complete");
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(s){
  if (window.marked && marked.parse){
    const html = marked.parse(s, {gfm:true, headerIds:false, mangle:false});
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  }
  return "<pre>" + esc(s) + "</pre>";
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function currentId(){
  const m = location.hash.match(/^#ch-(\d{1,3})$/);
  const n = m ? +m[1] : 0;
  return n >= 1 && n <= TOTAL ? n : 0;
}

/* ---------- header memory bank ---------- */
function renderBank(){
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    html += '<div class="bank-group" title="Part ' + p + ': ' + esc(PARTS[p-1]) + '">';
    for (const i of idsOf(p)){
      html += '<button class="cell' + (done.has(i) ? " done" : "") + (i === cur ? " here" : "") +
        '" data-go="' + i + '" aria-label="Chapter ' + i + (done.has(i) ? ", complete" : "") + '"></button>';
    }
    html += "</div>";
  }
  document.getElementById("bank").innerHTML = html;
  document.getElementById("doneCount").textContent = done.size;
  document.getElementById("pct").textContent = Math.round(done.size * 100 / TOTAL) + "%";
}

/* ---------- sidebar ---------- */
const openParts = new Set();
function renderSide(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const matches = ids.filter(i => !q || byId[i].title.toLowerCase().includes(q) || byId[i].tldr.toLowerCase().includes(q) || String(i) === q);
    if (q && !matches.length) continue;
    const count = ids.filter(i => done.has(i)).length;
    const open = q || openParts.has(p) || partOf(cur) === p;
    html += '<div class="part' + (open ? " open" : "") + '">' +
      '<button class="part-head" data-part="' + p + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="part-num">' + String(p).padStart(2, "0") + '</span>' +
      '<span class="part-name">' + esc(PARTS[p-1]) + '</span>' +
      '<span class="part-count' + (count === PER ? " full" : "") + '">' + count + '/' + PER + '</span></button><ul class="part-list">';
    for (const i of matches){
      html += '<li class="ch-row' + (i === cur ? " active" : "") + '">' +
        '<button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="' + (done.has(i) ? "Mark chapter " + i + " not complete" : "Mark chapter " + i + " complete") + '">' + TICK + '</button>' +
        '<a href="#ch-' + i + '"><span class="n">' + i + '.</span>' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ul></div>";
  }
  if (!html) html = '<p style="color:var(--muted);font-size:14px;padding:8px">No chapters match that search. Try a shorter word like “tools”, “memory” or “eval”.</p>';
  document.getElementById("parts").innerHTML = html;
}

/* ---------- diagrams and charts ---------- */
let mermaidPromise = null, renderSeq = 0;
const svgCache = new Map();
function isDark(){
  const a = document.documentElement.getAttribute("data-theme");
  if (a) return a === "dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function ensureMermaid(){
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (mermaidPromise) return mermaidPromise;
  mermaidPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js";
    s.onload = () => {
      try{
        window.mermaid.initialize({ startOnLoad:false, securityLevel:"strict", theme: isDark() ? "dark" : "neutral",
          fontFamily:"IBM Plex Sans, system-ui, sans-serif", flowchart:{ curve:"basis", htmlLabels:true } });
        resolve(window.mermaid);
      }catch(e){ reject(e); }
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return mermaidPromise;
}
function fitSvg(div){
  const svg = div.querySelector("svg");
  if (!svg) return;
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Diagram");
  const vb = (svg.getAttribute("viewBox") || "").split(/\s+/).map(Number);
  const vbw = vb[2] || 0;
  if (vbw && div.clientWidth && div.clientWidth < vbw * 0.7){
    svg.style.maxWidth = "none";
    svg.style.width = Math.round(vbw * 0.85) + "px";
  }
}
function fmtNum(v){ return Number(v).toLocaleString("en-US", { maximumFractionDigits: 3 }); }
function renderChart(el, spec){
  const max = Math.max(...spec.data.map(d => d[1]));
  const unit = spec.unit || "";
  const sep = (unit === "%" || unit === "×") ? "" : " ";
  let rows = "";
  for (const [label, v] of spec.data){
    let w = spec.log ? (Math.log10(v + 1) / Math.log10(max + 1)) * 100 : (v / max) * 100;
    w = Math.max(w, 1.5);
    rows += '<div class="bar-row"><span class="bar-label">' + esc(String(label)) + '</span><span class="bar-track"><span class="bar" style="width:' + w.toFixed(1) + '%"></span></span><span class="bar-val">' + fmtNum(v) + sep + esc(unit) + '</span></div>';
  }
  const fig = document.createElement("figure");
  fig.className = "chart";
  fig.innerHTML = '<figcaption>' + esc(spec.title || "") + '</figcaption>' + rows + (spec.log ? '<div class="chart-note">Bar lengths use a logarithmic scale.</div>' : "");
  el.replaceWith(fig);
}
function enhance(root){
  root.querySelectorAll("code.language-chart").forEach(code => {
    const pre = code.closest("pre") || code;
    try{ renderChart(pre, JSON.parse(code.textContent)); }catch(e){}
  });
  const blocks = [...root.querySelectorAll("code.language-mermaid")];
  if (!blocks.length) return;
  const seq = ++renderSeq;
  const holders = blocks.map(code => {
    const pre = code.closest("pre") || code;
    const div = document.createElement("div");
    div.className = "diagram loading";
    div.textContent = "Loading diagram…";
    div.dataset.src = code.textContent;
    pre.replaceWith(div);
    if (svgCache.has(div.dataset.src)){ div.classList.remove("loading"); div.innerHTML = svgCache.get(div.dataset.src); div.dataset.done = "1"; fitSvg(div); }
    return div;
  }).filter(div => !div.dataset.done);
  if (!holders.length) return;
  ensureMermaid().then(async m => {
    for (let k = 0; k < holders.length; k++){
      const div = holders[k];
      if (seq !== renderSeq || !div.isConnected) return;
      const id = "mmd-" + seq + "-" + k;
      try{
        const out = await m.render(id, div.dataset.src);
        if (!div.isConnected) return;
        div.classList.remove("loading");
        div.innerHTML = out.svg;
        svgCache.set(div.dataset.src, out.svg);
        fitSvg(div);
      }catch(e){
        const junk = document.getElementById("d" + id); if (junk) junk.remove();
        div.classList.remove("loading");
        div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>";
      }
    }
  }).catch(() => {
    holders.forEach(div => { div.classList.remove("loading"); div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>"; });
  });
}

/* ---------- chapter view ---------- */
function renderChapter(id){
  const c = byId[id];
  const p = partOf(id);
  const ids = idsOf(p);
  const isDone = done.has(id);
  const tabs = ids.map(i =>
    '<button class="tab' + (i === id ? " active" : "") + '" role="tab" aria-selected="' + (i === id) + '" data-go="' + i + '">' +
    '<span class="dot' + (done.has(i) ? " on" : "") + '"></span><span class="tab-t">' + i + '. ' + esc(byId[i].title) + '</span></button>'
  ).join("");
  document.getElementById("main").innerHTML =
    '<p class="crumb">Part ' + p + ' of 20: ' + esc(PARTS[p-1]) + '</p>' +
    '<div class="tabs" role="tablist" aria-label="Chapters in this part">' + tabs + '</div>' +
    '<article>' +
      '<p class="ch-no">Chapter ' + id + ' of ' + TOTAL + '</p>' +
      '<h1 class="ch-title">' + esc(c.title) + '</h1>' +
      '<section class="box tldr"><h2>TL;DR</h2><p>' + inlineMd(c.tldr) + '</p></section>' +
      '<div class="body">' + md(c.body) + '</div>' +
      '<section class="box real"><h2>Real-world example</h2><p>' + inlineMd(c.real) + '</p></section>' +
      '<div class="done-bar">' +
        '<button class="complete' + (isDone ? " on" : "") + '" data-toggle="' + id + '" aria-pressed="' + isDone + '">' +
          '<span class="tick' + (isDone ? " on" : "") + '">' + TICK + '</span>' + (isDone ? "Completed" : "Mark as complete") + '</button>' +
        '<div class="nav">' +
          '<button class="btn" data-go="' + (id - 1) + '"' + (id === 1 ? " disabled" : "") + '>Previous</button>' +
          '<button class="btn" data-go="' + (id + 1) + '"' + (id === TOTAL ? " disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  enhance(document.getElementById("main"));
}

/* ---------- contents view ---------- */
function renderContents(){
  let html = '<div class="contents"><h1>Contents</h1>' +
    '<p class="lead">A focused reference on AI agents in twenty parts: foundations and reasoning, agent design, tools, context and memory, orchestration, a step-by-step build in Python, frameworks, protocols, multi-agent systems, coding, browser and domain agents, evaluation, operations, reliability, security, governance and business adoption. Every chapter has an agent card covering what it is, why it matters, when to use it and when not, trade-offs, failure modes and production habits. Tick a chapter when you finish it; your progress is saved. Agent frameworks, protocols and regulations change quickly, so confirm specifics against current documentation.</p>' +
    '<div class="contents-actions"><button class="btn" data-go="' + firstUnread() + '">' + (done.size ? "Continue with chapter " + firstUnread() : "Start chapter 1") + '</button>' +
    '<button class="btn" id="resetBtn">Reset progress</button></div><div class="grid">';
  for (let p = 1; p <= 20; p++){
    const ids = idsOf(p);
    const count = ids.filter(i => done.has(i)).length;
    html += '<section class="pcard"><h2>Part ' + p + ': ' + esc(PARTS[p-1]) + '</h2><div class="meta">' + count + ' of ' + PER + ' complete</div><ol>';
    for (const i of ids){
      html += '<li><button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="Toggle chapter ' + i + '">' + TICK + '</button><a href="#ch-' + i + '">' + i + '. ' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ol></section>";
  }
  document.getElementById("main").innerHTML = html + "</div></div>";
}
function firstUnread(){ for (let i = 1; i <= TOTAL; i++) if (!done.has(i)) return i; return TOTAL; }

/* ---------- routing ---------- */
let lastRendered = null;
function renderAll(){
  const id = currentId();
  renderBank(); renderSide();
  const y = window.scrollY;
  if (id) renderChapter(id); else renderContents();
  if (lastRendered === location.hash) window.scrollTo(0, y);
  lastRendered = location.hash;
}
function route(){
  const id = currentId();
  if (!id && location.hash !== "#contents"){
    let last = 0; try{ last = +localStorage.getItem(LS_LAST) || 0; }catch(e){}
    location.replace("#ch-" + (last >= 1 && last <= TOTAL ? last : 1));
    return;
  }
  if (id){ try{ localStorage.setItem(LS_LAST, id); }catch(e){} }
  document.body.classList.remove("drawer");
  renderAll();
  window.scrollTo(0, 0);
  const active = document.querySelector(".ch-row.active");
  if (active) active.scrollIntoView({block:"nearest"});
  const tab = document.querySelector(".tab.active");
  if (tab && tab.parentElement){ const r = tab.parentElement; const left = tab.offsetLeft - r.offsetLeft; if (left < r.scrollLeft || left + tab.offsetWidth > r.scrollLeft + r.clientWidth) r.scrollLeft = left - 16; }
}
function go(id){ if (id >= 1 && id <= TOTAL) location.hash = "#ch-" + id; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){ e.preventDefault(); toggle(+t.dataset.toggle); return; }
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled){ go(+g.dataset.go); return; }
  const ph = e.target.closest("[data-part]");
  if (ph){
    const p = +ph.dataset.part;
    const el = ph.parentElement;
    const isOpen = el.classList.toggle("open");
    if (isOpen) openParts.add(p); else openParts.delete(p);
    ph.setAttribute("aria-expanded", isOpen);
    return;
  }
  if (e.target.id === "resetBtn"){
    if (confirm("Clear all 200 ticks? This can’t be undone.")){ done.clear(); saveLocal(); pushRemote(); renderAll(); toast("Progress reset"); }
  }
});
document.getElementById("search").addEventListener("input", renderSide);
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.add("drawer"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = currentId(); if (!id) return;
  if (e.key === "ArrowRight") go(id + 1);
  else if (e.key === "ArrowLeft") go(id - 1);
});
function setTopH(){ document.documentElement.style.setProperty("--top-h", document.getElementById("top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);
window.addEventListener("hashchange", route);
setTopH();
route();
initSync();
</script>
</body>
</html>

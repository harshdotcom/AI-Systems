ent, reviews, marketing, support |\n| AI uses | Product descriptions, review summaries, support answers |\n| Watch out for | Overselling from delayed inventory syncs |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ORDER[Shopify order webhook] --> STOCK[Update inventory]\n  STOCK --> LOW{Stock below reorder point?}\n  LOW -->|yes| PO[Draft purchase order + alert]\n  ORDER --> SHIP[Create shipment]\n  SHIP --> NOTIFY[Send tracking to customer]\n  NOTIFY --> REVIEW[7 days later: review request]\n```\n\n### Worked example\n\n```text\nReorder point = average daily sales × lead time days + safety stock\n= 12 units/day × 7 days + 20 = 104 units\n```"}, {"id": 159, "title": "IT operations and alerting", "tldr": "Automate incident alert routing, ticket creation, access requests, onboarding/offboarding, certificate expiry checks and on-call summaries. AI can summarize alerts and logs, but changes to production should require approval.", "real": "IT teams commonly connect monitoring tools such as Datadog, Grafana and PagerDuty to Slack or Teams through automation workflows, and AI summaries of noisy alert streams have become common.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Automating IT and DevOps workflows |\n| Flows | Alert routing, access requests, provisioning, expiry checks, summaries |\n| AI uses | Alert summarization, runbook suggestions |\n| Watch out for | Automated remediation without guardrails |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ALERT[Monitoring alert] --> DEDUPE[Dedupe / group]\n  DEDUPE --> AI[AI summary + likely cause from runbook]\n  AI --> PAGE{Severity high?}\n  PAGE -->|yes| ONCALL[Page on-call]\n  PAGE -->|no| TICKET[Create ticket]\n```\n\n### Worked example\n\n| Automation | Example |\n|---|---|\n| Certificate expiry | Daily check; alert 30 and 7 days before expiry |\n| Access request | Form → manager approval → provisioning → audit log |\n| Offboarding | HR event → disable SSO → revoke tokens → ticket |"}, {"id": 160, "title": "Personal productivity automation", "tldr": "Individuals can automate daily briefings, email triage, note capture, reading lists, expense tracking and reminders. Start with one annoying weekly task, and keep personal automations separate from company systems and data policies.", "real": "Personal automation is how many professionals first learn tools such as Zapier, n8n and Apple Shortcuts, before applying the same skills at work.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Automations for individual workflows |\n| Ideas | Daily brief, meeting prep, receipts to sheet, read-later summaries |\n| Tools | Zapier, n8n, Shortcuts, AI assistants with MCP |\n| Watch out for | Company data flowing into personal accounts |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  MORNING[7:30 every weekday] --> CAL[Today's meetings]\n  MORNING --> MAIL[Important unread emails]\n  MORNING --> TASKS[Due tasks]\n  CAL --> AI[AI daily brief]\n  MAIL --> AI\n  TASKS --> AI\n  AI --> SEND[Send to phone]\n```\n\n### Worked example\n\n| Weekly task | Minutes saved |\n|---|---|\n| Copying receipts to expense sheet | 30 |\n| Summarizing newsletters | 45 |\n| Preparing for 1:1 meetings | 40 |\n| Total | ≈ 2 hours/week |"}, {"id": 161, "title": "Idempotency", "tldr": "Automations run more than once: retries, duplicate webhooks, manual re-runs. Idempotent design ensures running the same event twice has the same effect as once, using unique keys, upserts, processed-ID tracking and idempotency keys on APIs.", "real": "Payment APIs such as Stripe support idempotency keys so retried requests don’t create duplicate charges, and webhook providers commonly warn that events may be delivered more than once.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Safe repetition of the same operation |\n| Techniques | Unique event IDs, upserts, processed-ID store, idempotency keys |\n| Why it matters | Prevents duplicate records, emails, payments |\n| Watch out for | “Create” actions triggered by retried webhooks |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EVENT[Webhook event id=evt_77] --> SEEN{Already processed evt_77?}\n  SEEN -->|yes| SKIP[Return 200, do nothing]\n  SEEN -->|no| PROCESS[Process]\n  PROCESS --> MARK[Store evt_77 as processed]\n```\n\n### Worked example\n\n| Action | Idempotent version |\n|---|---|\n| Create CRM contact | Upsert by email |\n| Send welcome email | Check “welcome_sent” flag first |\n| Create invoice via API | Pass idempotency key = order ID |\n| Append sheet row | Check order ID exists before append |"}, {"id": 162, "title": "Retries and backoff", "tldr": "Retry transient failures (timeouts, 429 rate limits, 5xx errors) with exponential backoff and jitter, capped attempts and respect for Retry-After headers. Don’t retry permanent errors such as validation or authentication failures.", "real": "AWS’s architecture guidance on “exponential backoff and jitter” showed that adding randomness to retry delays reduces synchronized retry storms against overloaded services.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Automatic recovery from temporary failures |\n| Retry | Timeouts, 429, 500–504 |\n| Don’t retry | 400 bad request, 401/403 auth, 404 not found |\n| Watch out for | Retrying non-idempotent actions |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CALL[API call] --> RES{Result}\n  RES -->|success| DONE[Continue]\n  RES -->|429 / 5xx / timeout| WAIT[Wait: 2, 4, 8 s + jitter]\n  WAIT --> COUNT{Fewer than 4 attempts?}\n  COUNT -->|yes| CALL\n  COUNT -->|no| ESCALATE[Error workflow + alert]\n  RES -->|400 / 401| FAIL[Fail fast: fix input or credentials]\n```\n\n### Worked example\n\n```python\nimport random, time\n\ndef backoff_delays(base=2.0, attempts=4, cap=30.0):\n    return [min(cap, base * 2 ** i) * random.uniform(0.5, 1.0) for i in range(attempts)]\n\nprint([round(d, 1) for d in backoff_delays()])   # e.g. [1.4, 3.1, 6.6, 12.9]\n```"}, {"id": 163, "title": "Error handling patterns", "tldr": "Classify errors by type and impact, then choose: retry, fallback (alternative provider or default value), dead-letter queue for later processing, human task, or stop and alert. Never silently drop data.", "real": "Dead-letter queues, used in messaging systems such as Amazon SQS, hold messages that repeatedly fail processing so they can be inspected and replayed instead of being lost.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structured responses to failures |\n| Patterns | Retry, fallback, dead-letter, compensation, human task, alert |\n| Principle | Every failure is visible and recoverable |\n| Watch out for | “Continue on error” hiding lost records |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  ERR[Error] --> TRANSIENT{Transient?}\n  TRANSIENT -->|yes| RETRY[Retry with backoff]\n  TRANSIENT -->|no| CRITICAL{Critical data?}\n  CRITICAL -->|yes| DLQ[Dead-letter store + alert]\n  CRITICAL -->|no| FALLBACK[Fallback / default + log]\n  RETRY -->|still failing| DLQ\n  DLQ --> REPLAY[Fix + replay]\n```\n\n### Worked example\n\n| Failure | Pattern |\n|---|---|\n| Primary LLM provider outage | Fallback to second provider |\n| Enrichment API returns nothing | Default “unknown” + continue |\n| CRM write fails after retries | Dead-letter table + alert |\n| Payment step fails after invoice created | Compensation: void invoice |"}, {"id": 164, "title": "Logging and monitoring automations", "tldr": "Log every run with inputs (redacted), outputs, duration, cost and errors; build dashboards for success rates, volumes and latency; alert on failures and anomalies. Business owners need simple status views, engineers need detailed traces.", "real": "Automation platforms provide execution histories (n8n executions, Zapier Zap history, Make scenario history), and production teams export these to central monitoring for alerting and retention.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Observability for workflows |\n| Metrics | Runs, success rate, errors by type, duration, AI cost |\n| Alerts | Failure spikes, volume drops, cost spikes |\n| Watch out for | Logging sensitive data in plain text |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  WF[Workflows] --> LOGS[Run logs: status, duration, cost]\n  LOGS --> DASH[Dashboard]\n  LOGS --> ALERTS[Alerts]\n  DASH --> OWNER[Business owner weekly review]\n```\n\n### Worked example\n\n| Alert rule | Why |\n|---|---|\n| Success rate < 95% over 1 hour | Something is failing |\n| Zero runs in 24 h for a daily-active workflow | Trigger broken |\n| AI cost > 2× daily average | Runaway loop or volume spike |"}, {"id": 165, "title": "Testing automations", "tldr": "Test workflows with representative sample data, edge cases (missing fields, unicode, huge inputs), failure simulations and AI evaluation sets before publishing. Use separate test credentials and sandbox accounts so tests never touch real customers.", "real": "Most SaaS platforms used in automations, such as Stripe and Shopify, provide test modes or development stores so workflows can be tested without real money or customers.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Verifying workflows before production |\n| Test types | Happy path, edge cases, failures, AI evals, load |\n| Environments | Sandbox accounts, test credentials, staging instance |\n| Watch out for | Testing in production with real customers |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SAMPLES[Sample inputs: normal + edge cases] --> RUN[Run in staging]\n  RUN --> CHECK[Check outputs + side effects]\n  CHECK --> FAIL[Simulate API failures]\n  FAIL --> EVAL[Run AI eval set]\n  EVAL --> APPROVE[Approve for production]\n```\n\n### Worked example\n\n| Test case | Expected behavior |\n|---|---|\n| Email with no company name | company = “Unknown”, lead still created |\n| Name with Unicode (Ananyā) | Stored correctly |\n| 25 MB attachment | Rejected with notice, no crash |\n| CRM API returns 503 | Retries, then error workflow alert |"}, {"id": 166, "title": "Versioning and change management", "tldr": "Track workflow versions, document changes, test in staging and publish deliberately. Pin model versions and API versions where possible, and keep rollback paths. Small changes to prompts or mappings can have big effects.", "real": "n8n 2.0 introduced separate Save and Publish steps and later added autosave with version history, making it easier to edit safely and restore previous versions.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Controlled changes to automations |\n| Practices | Version history, change notes, staging, pinned versions, rollback |\n| Includes | Workflows, prompts, models, credentials, external API versions |\n| Watch out for | Provider model updates changing behavior silently |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CHANGE[Change request] --> DRAFT[Draft in staging]\n  DRAFT --> TEST[Test + eval]\n  TEST --> NOTE[Change note]\n  NOTE --> PUBLISH[Publish]\n  PUBLISH --> MONITOR[Monitor 24 h]\n  MONITOR -->|issue| ROLLBACK[Restore previous version]\n```\n\n### Worked example\n\n| Change log entry | Example |\n|---|---|\n| Date | 2026-11-21 |\n| Workflow | Support triage v14 |\n| Change | Added “account” examples to prompt |\n| Eval result | 94% → 96% accuracy |\n| Rollback | Restore v13 |"}, {"id": 167, "title": "Rate limits and quotas", "tldr": "Every API and platform has limits: requests per second, daily quotas, task/credit allowances and LLM tokens per minute. Design with batching, queues, throttling and caching, and monitor usage against limits.", "real": "Google Sheets API, Gmail API and most SaaS APIs enforce per-minute or daily quotas, and LLM providers apply tokens-per-minute and requests-per-minute limits by account tier.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Working within API and platform limits |\n| Techniques | Batching, throttling, queues, caching, spreading schedules |\n| Monitoring | Usage dashboards, 429 rates |\n| Watch out for | All workflows scheduled at exactly 9:00 |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ITEMS[1,000 items] --> BATCH[Batches of 50]\n  BATCH --> THROTTLE[1 batch per 2 seconds]\n  THROTTLE --> API[API with 30 requests/minute limit]\n```\n\n### Worked example\n\n```text\nAPI limit: 60 requests/minute\nItems: 1,200; batch size per request: 20 → 60 requests needed\nAt 1 request/second → 60 seconds total, exactly at limit → use 1 request per 1.2 s (72 s) for safety margin\n```"}, {"id": 168, "title": "Queues and batching", "tldr": "Queues decouple receiving work from processing it: webhooks enqueue jobs quickly, workers process at a controlled pace, failures are retried and spikes are absorbed. Batch processing groups items to reduce API calls and costs.", "real": "n8n’s queue mode uses Redis to distribute executions to workers, and LLM providers offer batch APIs at roughly half price for asynchronous processing.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Buffering and grouping work |\n| Benefits | Spike absorption, rate control, retries, lower cost |\n| Tools | n8n queue mode, Redis, SQS, database job tables, LLM batch APIs |\n| Watch out for | Queues growing faster than workers process them |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  HOOK[Webhook: 500 events/min spike] --> QUEUE[(Queue)]\n  QUEUE --> W1[Worker]\n  QUEUE --> W2[Worker]\n  W1 --> API[Downstream API at safe rate]\n  W2 --> API\n  QUEUE --> METRIC[Queue depth alert]\n```\n\n### Worked example\n\n| Job | Real-time or batch? |\n|---|---|\n| Customer chat reply | Real-time |\n| Classify 50,000 historical tickets | Batch API overnight |\n| Nightly CRM enrichment | Scheduled batch |\n| Payment confirmation email | Real-time |"}, {"id": 169, "title": "Human-in-the-loop design", "tldr": "Decide where humans approve, edit or handle exceptions based on risk and AI confidence. Give reviewers concise context, clear choices and deadlines, record decisions, and use their corrections to improve prompts and rules.", "real": "Approval steps exist across platforms, such as n8n’s send-and-wait operations, Zapier’s human-in-the-loop features and Power Automate’s Approvals connector, reflecting their importance for safe AI automation.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structured human checkpoints |\n| Triggers | High value, low confidence, policy exceptions, external communication |\n| Design | Context, recommendation, approve/edit/reject, timeout |\n| Watch out for | Approval fatigue from too many low-value requests |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  AI[AI decision + confidence] --> ROUTE{Risk + confidence}\n  ROUTE -->|low risk, high confidence| AUTO[Automatic]\n  ROUTE -->|otherwise| REVIEW[Human review with context]\n  REVIEW --> RECORD[Record decision]\n  RECORD --> LEARN[Improve prompts/rules]\n```\n\n### Worked example\n\n| Case | Route |\n|---|---|\n| Ticket category confidence 0.95, low risk | Automatic |\n| Refund ≤ ₹2,000 matching policy | Automatic |\n| Refund > ₹2,000 | Human approval |\n| Reply to a legal complaint | Human writes response |"}, {"id": 170, "title": "Documentation and ownership", "tldr": "Every production automation needs an owner, a purpose statement, a diagram, trigger and schedule, systems and credentials used, failure handling, and a runbook. Undocumented automations become risky “shadow IT” when their creators leave.", "real": "Automation sprawl is a common governance problem, which is why tools such as Make Grid and Zapier’s admin features focus on mapping automations, connections and owners across organizations.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Knowing what each automation does and who owns it |\n| Must document | Owner, purpose, trigger, systems, data, failure handling, runbook |\n| Where | Automation catalog, sticky notes in workflows, wiki |\n| Watch out for | Critical workflows owned by people who’ve left |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  WF[Workflow] --> CATALOG[(Automation catalog)]\n  CATALOG --> OWNER[Owner + backup owner]\n  CATALOG --> RUNBOOK[Runbook]\n  CATALOG --> DATA[Data + credentials used]\n  CATALOG --> REVIEW[Quarterly review]\n```\n\n### Worked example\n\n| Catalog field | Example |\n|---|---|\n| Name | Support triage v14 |\n| Owner / backup | Priya (Support Ops) / Arjun (IT) |\n| Trigger | Gmail support@ inbox |\n| Systems | Gmail, Zendesk, Slack, LLM provider |\n| Data | Customer emails (PII) |\n| If it fails | Error workflow → #automation-alerts; manual triage runbook |"}, {"id": 171, "title": "Credentials and secrets", "tldr": "Automations hold keys to many systems. Store secrets only in the platform’s credential manager or a secret vault, use service accounts, rotate keys, restrict who can use credentials and never paste secrets into prompts, code nodes or logs.", "real": "GitHub’s secret scanning and similar tools detect API keys leaked in code repositories, and leaked automation credentials have been abused within minutes of exposure.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Protecting authentication material |\n| Practices | Credential manager/vault, service accounts, rotation, access control |\n| Never | Secrets in prompts, workflow text fields, screenshots, logs |\n| Watch out for | Exported workflows or templates containing hard-coded keys |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  VAULT[(Credential store / vault)] --> WF[Workflow nodes by reference]\n  ADMIN[Admin] -->|grant use| TEAM[Specific team]\n  ROTATE[Scheduled rotation] --> VAULT\n  LOGS[Logs] -.redacted.-> SIEM[Monitoring]\n```\n\n### Worked example\n\n| Bad | Good |\n|---|---|\n| API key typed into HTTP node header text | Header Auth credential |\n| Personal Gmail OAuth for company flow | Shared service account / delegated access |\n| Same key for dev and prod | Separate keys per environment |"}, {"id": 172, "title": "Least-privilege OAuth scopes", "tldr": "Grant automations the minimum permissions they need: read-only where possible, specific folders or channels, limited API scopes and dedicated bot users. Review granted scopes periodically and remove unused connections.", "real": "Major platforms such as Google, Microsoft and Slack provide fine-grained scopes (for example read-only Gmail or channel-specific bot permissions) precisely to limit what integrations can access.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Minimal permissions for integrations |\n| Why it matters | Limits damage from compromised workflows or credentials |\n| Practices | Narrow scopes, bot users, folder/channel restrictions, reviews |\n| Watch out for | “Full access” scopes accepted for convenience |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  NEED[Workflow need: read one shared folder] --> SCOPE[Request narrow scope]\n  SCOPE --> BOT[Dedicated service account with folder access only]\n  BOT --> REVIEW[Quarterly access review]\n```\n\n### Worked example\n\n| Workflow | Needed access | Avoid |\n|---|---|---|\n| Post daily report to Slack | chat:write to #reports | Admin scopes |\n| Read invoice PDFs from Drive folder | That folder only | Full Drive |\n| Create HubSpot contacts | Contacts write | All CRM objects + settings |"}, {"id": 173, "title": "Securing webhooks", "tldr": "Public webhook URLs can be discovered and abused. Authenticate incoming webhooks with signature verification, secret headers or tokens; validate payloads; restrict methods; rate-limit; and respond quickly before heavy processing.", "real": "Providers such as Stripe, GitHub and Shopify sign webhook payloads with HMAC signatures and document verification steps, including timestamp checks to prevent replay attacks.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Protecting HTTP entry points |\n| Controls | Signatures, auth headers, payload validation, rate limits, IP allow-lists |\n| Replay defense | Timestamp tolerance + event ID dedupe |\n| Watch out for | Unauthenticated webhooks that trigger actions or AI spend |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REQ[Incoming webhook] --> AUTH{Signature valid?}\n  AUTH -->|no| REJECT[401 + log]\n  AUTH -->|yes| FRESH{Timestamp within 5 min?}\n  FRESH -->|no| REJECT\n  FRESH -->|yes| DEDUPE{Event ID seen?}\n  DEDUPE -->|yes| OK[200, skip]\n  DEDUPE -->|no| PROCESS[Validate payload + process]\n```\n\n### Worked example\n\n```python\nimport hmac, hashlib, time\n\ndef verify(secret: bytes, body: bytes, timestamp: str, signature: str, tolerance=300) -> bool:\n    if abs(time.time() - int(timestamp)) > tolerance:\n        return False\n    expected = hmac.new(secret, f\"{timestamp}.\".encode() + body, hashlib.sha256).hexdigest()\n    return hmac.compare_digest(expected, signature)\n```"}, {"id": 174, "title": "Personal data and privacy", "tldr": "Automations often process personal data (names, emails, messages, documents). Minimize what flows through AI and third parties, check data processing agreements, set retention on execution logs, honor deletion requests and comply with laws such as GDPR and India’s DPDP Act.", "real": "India’s Digital Personal Data Protection Act (2023), with rules notified in November 2025, and the EU GDPR both impose obligations on processing personal data, including through vendors and AI services.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Privacy-aware automation design |\n| Practices | Minimization, redaction, DPAs with vendors, retention limits, deletion |\n| AI specifics | Provider data terms, no-training options, regional processing |\n| Watch out for | Execution logs storing full personal data indefinitely |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DATA[Personal data] --> MIN[Minimize + redact unnecessary fields]\n  MIN --> AI[AI provider under data agreement]\n  MIN --> LOGS[Execution logs: limited retention]\n  DELETE[Deletion request] --> LOGS\n  DELETE --> STORES[All data stores + vector indexes]\n```\n\n### Worked example\n\n| Setting | Recommendation |\n|---|---|\n| Execution data retention | 7–30 days for workflows with personal data |\n| Fields sent to LLM | Only those needed for the task |\n| Phone/email in prompts | Redact when not needed |\n| Vendor review | DPA, sub-processors, data location |"}, {"id": 175, "title": "Prompt injection in automations", "tldr": "When AI steps read untrusted content (emails, web pages, documents, form inputs), that content can contain instructions trying to hijack the AI. Treat AI outputs as untrusted, restrict tools available to AI steps, and require approval for sensitive actions.", "real": "OWASP ranked prompt injection as the top risk in its 2025 Top 10 for LLM Applications, and security researchers have demonstrated injections hidden in emails and web pages targeting AI assistants.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Malicious instructions in content processed by AI |\n| Entry points | Emails, web pages, PDFs, support tickets, form fields |\n| Defenses | Least-privilege tools, output validation, approvals, separation |\n| Watch out for | Email-reading agents with send/forward tools |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EMAIL[Inbound email with hidden instructions] --> AI[AI classification step]\n  AI --> OUT[Output: label only from allowed list]\n  OUT --> VALIDATE[Validate label]\n  VALIDATE --> ROUTE[Route]\n  AI -.no tools available.-> SAFE[Cannot send or delete]\n```\n\n### Worked example\n\n| Design choice | Effect on injection risk |\n|---|---|\n| AI only returns a category from a fixed list | Low impact even if manipulated |\n| AI drafts reply, human sends | Moderate, reviewed |\n| AI agent can forward emails and access files | High risk: remove tools or add approval |"}, {"id": 176, "title": "AI output risks", "tldr": "AI can produce wrong, biased, offensive or confidential content. Mitigate with grounding, validation, content filters, tone rules, disclosure where required and human review for external or high-impact outputs.", "real": "In the 2024 Moffatt v. Air Canada decision, a Canadian tribunal held the airline responsible for incorrect information given by its website chatbot, showing that organizations are accountable for automated AI outputs.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Risks from generated content |\n| Types | Hallucination, bias, toxicity, leakage, defamation |\n| Controls | RAG grounding, validation, filters, review, disclosure |\n| Watch out for | Auto-sending AI-generated policy answers to customers |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  GEN[AI output] --> GROUND{Grounded in sources?}\n  GROUND -->|no| HOLD[Hold for review]\n  GROUND -->|yes| FILTER[Safety + PII filter]\n  FILTER --> EXTERNAL{Customer-facing?}\n  EXTERNAL -->|yes, high impact| REVIEW[Human review]\n  EXTERNAL -->|no| USE[Use internally]\n```\n\n### Worked example\n\n| Output | Control |\n|---|---|\n| Policy answer to customer | RAG with citations + “not found” behavior |\n| Internal summary | Light checks |\n| Public social post | Human approval |\n| Legal/medical statements | Not automated |"}, {"id": 177, "title": "Governing automation across an organization", "tldr": "As automation spreads, establish governance: approved platforms, connection policies, data classification rules, review for high-risk automations, an automation catalog, ownership and training. Enable citizen developers with guardrails rather than banning tools.", "real": "Enterprise automation platforms offer governance features such as Power Platform data loss prevention policies, Zapier app restrictions and n8n role-based access, reflecting demand for controlled citizen automation.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Policies and processes for automation at scale |\n| Elements | Approved tools, connector policies, risk reviews, catalog, training |\n| Goal | Speed with safety |\n| Watch out for | Shadow automations on personal accounts |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  CENTER[Automation center of excellence] --> POLICY[Policies: tools, data, AI use]\n  CENTER --> PLATFORM[Approved platforms + templates]\n  CENTER --> REVIEW[Risk review for high-impact flows]\n  CENTER --> TRAIN[Training + community]\n  TEAMS[Business teams] --> PLATFORM\n```\n\n### Worked example\n\n| Automation risk tier | Review required |\n|---|---|\n| Personal productivity, no customer data | None (approved tools only) |\n| Team workflow with internal data | Owner + documentation |\n| Customer data or external messages | Security/privacy review |\n| Financial transactions or AI decisions about people | Formal review + approvals |"}, {"id": 178, "title": "Audit logs and compliance", "tldr": "Regulated processes need evidence: who changed workflows, which runs processed which records, what AI decided and who approved. Enable audit logs, retain execution records per policy and link automation controls to compliance frameworks.", "real": "Enterprise tiers of automation platforms, including n8n Enterprise, Zapier Enterprise and Make Enterprise, include audit logs, and compliance frameworks such as SOC 2 require evidence of change management and access control.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Traceability of automation activity |\n| Records | Workflow changes, executions, approvals, AI decisions, access |\n| Retention | Per legal and policy requirements |\n| Watch out for | Audit needs conflicting with privacy minimization; balance both |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CHANGE[Workflow change] --> AUDIT[(Audit log)]\n  RUN[Execution] --> AUDIT\n  APPROVAL[Human approval] --> AUDIT\n  AIDEC[AI decision + version] --> AUDIT\n  AUDIT --> AUDITOR[Compliance evidence]\n```\n\n### Worked example\n\n| Evidence for auditors | Source |\n|---|---|\n| Who approved invoice payments | Approval step records |\n| Workflow change history | Version history / Git |\n| Access to credentials | Platform role assignments |\n| AI model and prompt version per decision | Logged with each run |"}, {"id": 179, "title": "Vendor and platform risk", "tldr": "Automation platforms and AI providers become critical vendors. Assess security certifications, data handling, uptime, pricing changes, lock-in and exit options; keep exports of workflows and avoid single points of failure for critical processes.", "real": "The automation market has seen frequent acquisitions and pricing changes, including Workday’s acquisitions of Flowise and Pipedream and Make’s move to credit-based billing, so vendor roadmaps can shift quickly.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Managing dependence on automation vendors |\n| Assess | Security (SOC 2, ISO 27001), data terms, uptime, pricing, exportability |\n| Mitigate | Exports, abstraction for critical flows, fallback providers |\n| Watch out for | Critical business processes depending on one unmonitored SaaS |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  VENDOR[Vendor] --> SEC[Security + compliance]\n  VENDOR --> DATA[Data processing terms]\n  VENDOR --> SLA[Uptime + support]\n  VENDOR --> EXIT[Export + exit plan]\n  VENDOR --> COST[Pricing stability]\n```\n\n### Worked example\n\n| Critical flow | Resilience measure |\n|---|---|\n| Order processing | Queue + manual fallback procedure |\n| AI classification | Second model provider configured |\n| Workflow definitions | Weekly exports to Git |"}, {"id": 180, "title": "Responsible automation and people", "tldr": "Automation changes jobs. Involve the people doing the work, automate tasks rather than eliminating judgment, communicate openly, retrain staff for higher-value work, measure quality and customer impact, and keep humans accountable for decisions affecting people.", "real": "Research on generative AI in customer support (Brynjolfsson, Li and Raymond, 2023) found productivity gains of about 14% on average, largest for less experienced workers, suggesting AI can augment people rather than only replace them.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Ethical, people-centered automation |\n| Principles | Involve workers, transparency, augmentation, accountability |\n| Measure | Quality, customer outcomes, employee experience |\n| Watch out for | Automating away expertise you’ll need for exceptions |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  WORKERS[People doing the work] --> MAP[Map tasks together]\n  MAP --> AUTOMATE[Automate repetitive tasks]\n  AUTOMATE --> UPSKILL[Retrain for higher-value work]\n  UPSKILL --> FEEDBACK[Feedback improves automations]\n  FEEDBACK --> AUTOMATE\n```\n\n### Worked example\n\n| Task in support role | Approach |\n|---|---|\n| Copying order details into tickets | Automate |\n| Drafting standard replies | AI draft + agent edits |\n| Handling upset customers | Human, with AI summary |\n| Improving knowledge base | Humans, informed by AI gap analysis |"}, {"id": 181, "title": "Project 1: AI lead qualification in n8n", "tldr": "Build a workflow that receives leads from a website webhook, extracts structured details with AI, scores them with transparent rules, upserts them into the CRM and alerts sales for hot leads within minutes.", "real": "Combining AI extraction with deterministic scoring keeps lead routing explainable, a pattern recommended over letting a model directly decide which leads get attention.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Hot leads reach sales within 5 minutes with context |\n| Nodes | Webhook, Information Extractor, Code, CRM (upsert), IF, Slack |\n| AI role | Extract company size, intent, timeline from free text |\n| Success metric | ≥ 90% correct extraction on 50 test leads |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  HOOK[Webhook: form POST] --> EXTRACT[Information Extractor: intent, timeline, team size]\n  EXTRACT --> SCORE[Code: rule-based score]\n  SCORE --> CRM[CRM: upsert contact + score]\n  CRM --> HOT{Score ≥ 60?}\n  HOT -->|yes| SLACK[Slack #sales: summary + link]\n  HOT -->|no| NURTURE[Add to nurture list]\n```\n\n### Worked example\n\n```javascript\n// Code node: transparent lead score (Run Once for All Items)\nreturn $input.all().map(item => {\n  const j = item.json;\n  let score = 0;\n  const domain = (j.email || '').trim().toLowerCase().split('@')[1];\n  if (domain && !['gmail.com', 'yahoo.com', 'outlook.com'].includes(domain)) score += 20;\n  if (j.intent === 'purchase') score += 30;\n  if (['this_month', 'this_quarter'].includes(j.timeline)) score += 20;\n  if ((j.team_size || 0) >= 20) score += 15;\n  return { json: { ...j, score, hot: score >= 60 } };\n});\n```"}, {"id": 182, "title": "Project 2: support triage with draft replies", "tldr": "Extend the triage system: classify each support email, retrieve relevant help articles from a vector store, draft a grounded reply with citations, save it as a draft for an agent, and escalate urgent cases.", "real": "Draft-first support automation lets organizations capture most of the time savings of AI responses while humans keep control over customer communication.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Agents start from a good draft for every email |\n| Components | Gmail Trigger, Text Classifier, vector store retrieval, LLM chain, Gmail draft |\n| Guardrail | Drafts only; “not found” when no article matches |\n| Success metric | Agents send ≥ 60% of drafts with minor edits |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  MAIL[Gmail Trigger] --> CLASS[Text Classifier]\n  CLASS --> RET[Vector store: top 4 help articles]\n  RET --> DRAFT[LLM: grounded reply with citations]\n  DRAFT --> GMAIL[Gmail: create draft in thread]\n  CLASS -->|urgent| SLACK[Slack alert]\n```\n\n### Worked example\n\n```text\nWrite a reply to the customer using only the help articles provided.\n- Friendly, concise (under 120 words)\n- Include the article link you relied on\n- If the articles don't answer the question, write: \"Thanks for reaching out — a teammate will reply shortly.\"\n- Never promise refunds or timelines not stated in the articles.\n```"}, {"id": 183, "title": "Project 3: competitor price monitor with Crawl4AI", "tldr": "Every morning, crawl competitor product pages you’re permitted to monitor, extract prices with a CSS schema, store them with timestamps, compare with yesterday and send a Slack report of changes.", "real": "Price monitoring is one of the most common web data automations, and Crawl4AI’s LLM-free CSS extraction keeps daily runs fast and inexpensive.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Daily price change report |\n| Stack | Python + Crawl4AI (or Crawl4AI Docker via n8n), Postgres, Slack |\n| Compliance | Check terms and robots.txt; low request rates |\n| Success metric | Prices captured for ≥ 98% of tracked products |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SCHED[06:00 daily] --> CRAWL[Crawl4AI arun_many: product URLs]\n  CRAWL --> EXTRACT[JsonCssExtractionStrategy: name, price]\n  EXTRACT --> DB[(prices table)]\n  DB --> DIFF[Compare with previous day]\n  DIFF --> SLACK[Slack: changes + missing prices]\n```\n\n### Worked example\n\n```sql\n-- Prices that changed since the previous capture\nSELECT t.product_url, y.price AS yesterday, t.price AS today,\n       round(100.0 * (t.price - y.price) / y.price, 1) AS pct_change\nFROM prices t\nJOIN prices y ON y.product_url = t.product_url\nWHERE t.captured_on = current_date\n  AND y.captured_on = current_date - 1\n  AND t.price <> y.price;\n```"}, {"id": 184, "title": "Project 4: documentation chatbot (RAG)", "tldr": "Crawl your documentation with Crawl4AI or Firecrawl, chunk and embed pages into a vector store, and build an n8n chat agent that answers with citations. Re-crawl weekly and upsert changed pages.", "real": "Documentation assistants are among the most common RAG deployments, and LLM-friendly crawlers exist largely to make this ingestion step simple.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Accurate, cited answers about your product docs |\n| Ingestion | Deep crawl → Markdown → chunk → embed → vector store |\n| Query | Chat Trigger → AI Agent → vector store tool |\n| Success metric | ≥ 90% correct answers on 50 test questions |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  subgraph Weekly ingestion\n    CRAWL[Crawl docs site] --> MD[Markdown pages]\n    MD --> CHUNK[Chunk + metadata: url, title]\n    CHUNK --> VS[(Vector store)]\n  end\n  subgraph Chat\n    USER[User] --> AGENT[n8n AI Agent]\n    AGENT --> VS\n    AGENT --> ANSWER[Answer + source links]\n  end\n```\n\n### Worked example\n\n| Test question | Pass criteria |\n|---|---|\n| “How do I rotate an API key?” | Correct steps + link to security docs |\n| “Do you support SAML?” | Correct yes/no from docs + link |\n| “What’s your CEO’s favorite food?” | “I couldn’t find this in our documentation.” |"}, {"id": 185, "title": "Project 5: invoice extraction in Make", "tldr": "Build a Make scenario that watches an inbox for invoices, extracts fields with an AI module, validates totals, checks duplicates in a data store, routes exceptions for review and records clean invoices in a sheet or accounting app.", "real": "Make’s routers, data stores and error handlers map naturally onto invoice processing steps such as validation, deduplication and exception handling.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Clean invoices recorded automatically; exceptions reviewed |\n| Modules | Email watch, AI extraction, Set variables, Data store, Router, Sheets/accounting |\n| Error handling | Break directive for API failures |\n| Success metric | ≥ 95% field accuracy, zero duplicate postings |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  WATCH[Watch emails: has attachment] --> AI[AI extraction module]\n  AI --> CHECK[Data store: invoice number exists?]\n  CHECK --> ROUTER{Router}\n  ROUTER -->|duplicate| DUP[Notify: duplicate]\n  ROUTER -->|totals mismatch| REVIEW[Review sheet]\n  ROUTER -->|valid| RECORD[Record invoice + add to data store]\n```\n\n### Worked example\n\n| Router filter | Condition |\n|---|---|\n| Duplicate | Data store search returned a record |\n| Totals mismatch | `{{formatNumber(subtotal + tax; 2)}}` ≠ `{{formatNumber(total; 2)}}` |\n| Valid | Not duplicate AND totals match |"}, {"id": 186, "title": "Project 6: content repurposing in Zapier", "tldr": "When a new blog post is published, a Zap generates social posts and a newsletter blurb with AI, stores them in a Zapier Table for review, and schedules approved items to social and email tools.", "real": "Zapier’s combination of AI steps, Tables and integrations with publishing tools makes it well suited to marketing teams building review-then-publish pipelines without code.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Every post becomes approved social + newsletter content |\n| Steps | RSS trigger → AI step → Table record → approval → schedule |\n| Guardrail | Nothing publishes without status = Approved |\n| Success metric | Content ready within 1 hour of publishing |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  RSS[RSS: new blog post] --> AI[AI step: 3 LinkedIn posts + newsletter blurb]\n  AI --> TABLE[(Zapier Table: status Draft)]\n  TABLE --> EDIT[Editor reviews + sets Approved]\n  EDIT --> ZAP2[Zap: on status Approved]\n  ZAP2 --> SOCIAL[Schedule social posts]\n  ZAP2 --> NEWS[Add to newsletter draft]\n```\n\n### Worked example\n\n| Table field | Purpose |\n|---|---|\n| Post URL | Source |\n| LinkedIn 1–3 | AI drafts |\n| Newsletter blurb | AI draft |\n| Status | Draft / Approved / Rejected |\n| Reviewer notes | Feedback to improve prompts |"}, {"id": 187, "title": "Project 7: daily industry news digest", "tldr": "Each morning, search for news on chosen topics, fetch articles as Markdown, have an LLM deduplicate and summarize the most important items with links, and email or Slack a concise digest.", "real": "News digests built from search APIs, reader or crawl tools and LLM summarization are a popular personal and team automation, replacing manual scanning of many sites.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| Goal | 5–8 key stories daily with summaries and links |\n| Stack | Firecrawl search (or RSS) + LLM + email/Slack |\n| Guardrail | Summaries only from fetched content; always link sources |\n| Success metric | Team rates digest useful ≥ 4/5 |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SCHED[07:00] --> SEARCH[Search: topics, last 24 h]\n  SEARCH --> FETCH[Fetch articles as Markdown]\n  FETCH --> DEDUPE[Deduplicate similar stories]\n  DEDUPE --> SUMMARIZE[LLM: rank + summarize]\n  SUMMARIZE --> SEND[Email / Slack digest]\n```\n\n### Worked example\n\n```text\nFrom the articles below, pick the 6 most important for a B2B SaaS founder.\nFor each: headline (≤ 12 words), 2-sentence summary from the article only, source link.\nMerge duplicate stories. Skip press releases without news value.\n```"}, {"id": 188, "title": "Project 8: meeting notes to tasks", "tldr": "When a meeting recording or transcript is available, generate a summary, decisions and action items with owners and due dates, create tasks in your project tool, and post the summary to the team channel.", "real": "Meeting platforms offer built-in AI summaries, but custom automations let teams push action items directly into their own task systems and CRMs.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| Goal | No action item lost after meetings |\n| Stack | Transcript source → LLM structured output → project tool + Slack |\n| Guardrail | Owners mapped to real users; unknown owners flagged |\n| Success metric | ≥ 90% of action items captured correctly |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TRANSCRIPT[New transcript] --> LLM[LLM: summary, decisions, actions JSON]\n  LLM --> MAP[Map owner names to user IDs]\n  MAP --> TASKS[Create tasks]\n  MAP --> UNKNOWN{Unknown owner?}\n  UNKNOWN -->|yes| ASK[Ask meeting host to assign]\n  LLM --> POST[Post summary to channel]\n```\n\n### Worked example\n\n| Action item JSON field | Example |\n|---|---|\n| owner | “Asha” → user ID U123 |\n| task | “Send pilot agreement” |\n| due | “2026-11-25” or null |\n| source_quote | Short excerpt for verification |"}, {"id": 189, "title": "Project 9: MCP server for internal automations", "tldr": "Expose a few safe internal automations (create ticket, look up customer, check order) as MCP tools backed by n8n webhooks, so team members can trigger them from Claude or other MCP clients with natural language.", "real": "Exposing workflows through MCP is a growing pattern; n8n, Make and Zapier all offer MCP server capabilities, and custom servers can be built quickly with the MCP Python SDK.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Natural-language access to approved internal actions |\n| Stack | FastMCP server (or n8n MCP Server Trigger) + n8n webhooks |\n| Guardrail | Only read or low-risk create actions; auth on webhooks; logging |\n| Success metric | Tools used weekly; zero unauthorized actions |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  USER[Employee in Claude] --> MCP[MCP server: 3 tools]\n  MCP --> W1[n8n webhook: lookup_customer]\n  MCP --> W2[n8n webhook: check_order]\n  MCP --> W3[n8n webhook: create_ticket]\n  MCP --> LOG[Audit log]\n```\n\n### Worked example\n\n```json\n{\n  \"mcpServers\": {\n    \"ops-tools\": {\n      \"command\": \"python\",\n      \"args\": [\"/path/to/ops_tools_server.py\"]\n    }\n  }\n}\n```\n\n(Claude Desktop-style configuration for a local stdio server built like chapter 100.)"}, {"id": 190, "title": "Project 10: multi-agent research pipeline", "tldr": "Build a research pipeline where a planner breaks a question into sub-questions, research agents search and crawl sources in parallel, and a writer agent synthesizes a cited report, with budgets and a human review step.", "real": "Anthropic reported in 2025 that its multi-agent research system outperformed a single agent on broad research tasks while using many more tokens, illustrating both the power and the cost of multi-agent designs.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Cited research brief on a business question |\n| Stack | n8n AI Agents (or CrewAI/LangGraph) + search + Crawl4AI/Firecrawl |\n| Controls | Max sources, max tokens, citations required, human review |\n| Success metric | Reviewer finds no unsupported claims in 10 test briefs |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  Q[Research question] --> PLAN[Planner: 3–5 sub-questions]\n  PLAN --> R1[Researcher 1: search + crawl]\n  PLAN --> R2[Researcher 2: search + crawl]\n  PLAN --> R3[Researcher 3: search + crawl]\n  R1 --> WRITE[Writer: synthesize with citations]\n  R2 --> WRITE\n  R3 --> WRITE\n  WRITE --> REVIEW[Human review]\n```\n\n### Worked example\n\n| Budget control | Value |\n|---|---|\n| Sub-questions | ≤ 5 |\n| Sources per researcher | ≤ 6 pages |\n| Max tokens per run | 300,000 |\n| Required output | Every claim followed by a source link |"}, {"id": 191, "title": "Running an automation discovery workshop", "tldr": "Find the best automation opportunities by mapping processes with the people who do the work: list tasks, volumes, time per task, pain points, systems and data, then score opportunities by value and feasibility.", "real": "Automation centers of excellence at large companies typically run structured discovery sessions and maintain opportunity backlogs, because the highest-value processes are rarely obvious from outside a team.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structured session to find automation opportunities |\n| Inputs | Process steps, volumes, time, errors, systems |\n| Output | Prioritized backlog with owners |\n| Watch out for | Only interviewing managers, not the people doing the work |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LIST[List recurring tasks] --> MEASURE[Volume × time × error cost]\n  MEASURE --> FEAS[Feasibility: data, APIs, rules]\n  FEAS --> MATRIX[Value vs effort matrix]\n  MATRIX --> BACKLOG[Prioritized backlog]\n```\n\n### Worked example\n\n| Task | Volume/month | Minutes each | Hours/month | Feasibility | Priority |\n|---|---|---|---|---|---|\n| Invoice entry | 400 | 4 | 26.7 | High | 1 |\n| Lead research | 150 | 15 | 37.5 | Medium | 2 |\n| Weekly report | 4 | 90 | 6 | High | 3 |\n| Contract review | 10 | 120 | 20 | Low (needs legal) | Later |"}, {"id": 192, "title": "Calculating ROI", "tldr": "ROI compares time and error savings plus revenue impact against build, run and maintenance costs. Include AI and platform costs, human review time and maintenance hours, and measure actual results after launch.", "real": "Organizations increasingly track automation outcomes such as hours saved and cost per execution, and platforms such as Make, Zapier and n8n expose usage data that helps calculate running costs.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Business case for an automation |\n| Benefits | Time saved, fewer errors, faster response, revenue |\n| Costs | Build, platform, AI tokens, review time, maintenance |\n| Watch out for | Ignoring maintenance and exception handling time |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SAVED[Hours saved × hourly cost] --> BENEFIT[Monthly benefit]\n  ERRORS[Error reduction value] --> BENEFIT\n  BUILD[Build cost] --> PAYBACK[Payback period]\n  RUN[Monthly run + maintenance] --> NET[Net monthly benefit]\n  BENEFIT --> NET\n  NET --> PAYBACK\n```\n\n### Worked example\n\n```text\nInvoice automation:\nTime saved 23.4 h/month × ₹600 = ₹14,040/month\nRunning cost: platform ₹2,000 + AI ₹800 + maintenance 2 h × ₹1,500 = ₹5,800/month\nNet benefit = ₹8,240/month; build cost ₹60,000 → payback ≈ 7.3 months\n```"}, {"id": 193, "title": "Architecture patterns for AI automation", "tldr": "Recurring patterns cover most systems: event-driven pipelines, scheduled sync, request–response APIs, human-in-the-loop approvals, RAG assistants, agent-with-tools, fan-out/fan-in batch processing and dead-letter recovery. Combine them deliberately.", "real": "These patterns mirror established enterprise integration patterns (Hohpe and Woolf, 2003), now extended with AI steps, agents and MCP tool connections.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Reusable designs for automation systems |\n| Core patterns | Event-driven, scheduled sync, API, HITL, RAG, agent, fan-out, DLQ |\n| Benefit | Faster, more reliable designs |\n| Watch out for | Mixing patterns without clear boundaries |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  P[Patterns] --> EVT[Event-driven: webhook → process]\n  P --> SYNC[Scheduled sync: cursor-based]\n  P --> HITL[Approval: pause → decide → resume]\n  P --> RAG[RAG assistant]\n  P --> AGENT[Agent with tools]\n  P --> FAN[Fan-out / fan-in batches]\n  P --> DLQ[Dead-letter + replay]\n```\n\n### Worked example\n\n| Business need | Pattern |\n|---|---|\n| React to new orders instantly | Event-driven |\n| Nightly CRM ↔ billing sync | Scheduled sync with cursor |\n| Refunds above limit | Human-in-the-loop |\n| Answer policy questions | RAG assistant |\n| Process 10,000 documents | Fan-out batches + DLQ |"}, {"id": 194, "title": "Platform selection playbook", "tldr": "Choose platforms with a structured pilot: define requirements, shortlist 2–3 tools, build the same representative workflow in each, compare build time, reliability, cost at expected volume, security and team fit, then decide.", "real": "Head-to-head pilots are common because platform strengths differ sharply, for example Zapier’s integration breadth, Make’s visual data handling and n8n’s self-hosting and AI depth.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Evidence-based platform choice |\n| Steps | Requirements → shortlist → pilot → score → decide |\n| Criteria | Integrations, AI, hosting, cost, governance, skills |\n| Watch out for | Choosing on demos instead of your real workflow |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REQ[Requirements] --> SHORT[Shortlist 2–3 platforms]\n  SHORT --> PILOT[Build same workflow in each]\n  PILOT --> SCORE[Score: time, reliability, cost, security]\n  SCORE --> DECIDE[Decision + standards]\n```\n\n### Worked example\n\n| Criterion (weight) | n8n | Zapier | Make |\n|---|---|---|---|\n| Integrations needed (25%) | 4 | 5 | 4 |\n| AI agent depth (20%) | 5 | 4 | 4 |\n| Data control / hosting (20%) | 5 | 2 | 2 |\n| Builder skill fit (20%) | 3 | 5 | 4 |\n| Cost at volume (15%) | 5 | 3 | 4 |\n| Weighted score | 4.35 | 3.90 | 3.60 |\n\n(Scores are an example for one hypothetical team; your weights will differ.)"}, {"id": 195, "title": "Production readiness checklist", "tldr": "Before going live, confirm the automation is tested, idempotent, monitored, documented, secure and owned, with AI steps evaluated, approvals where needed, error handling and a rollback plan.", "real": "Teams that treat automations as production software, with reviews, monitoring and ownership, avoid the common failure mode of critical processes silently breaking.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Go-live gate for automations |\n| Covers | Testing, reliability, security, AI quality, documentation, ownership |\n| When | Before first publish and after major changes |\n| Watch out for | “It worked on my three test records” |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TEST[Tests + AI evals pass] --> GATE{Ready?}\n  ERR[Error handling + alerts] --> GATE\n  SEC[Least-privilege credentials] --> GATE\n  DOC[Owner + runbook] --> GATE\n  GATE -->|yes| LIVE[Publish]\n  GATE -->|no| FIX[Fix gaps]\n```\n\n### Worked example\n\n- [ ] Tested with real-world samples and edge cases\n- [ ] Duplicate events handled (idempotent)\n- [ ] Retries and error workflow configured\n- [ ] AI steps evaluated on a labeled set; guardrails in place\n- [ ] Human approval for high-impact actions\n- [ ] Credentials are service accounts with narrow scopes\n- [ ] Execution data retention set for personal data\n- [ ] Owner, backup owner and runbook documented\n- [ ] Monitoring and alerts live"}, {"id": 196, "title": "Building an automation business", "tldr": "Many professionals build careers or agencies around AI automation: discovery, implementation, maintenance retainers and training. Success depends on solving measurable business problems, reliable delivery, clear scopes and ongoing support.", "real": "Automation platforms run partner and expert programs, such as Make’s partner program, Zapier’s expert directory and n8n’s expert partners, connecting businesses with automation consultants.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Offering automation as a service |\n| Offers | Audits, builds, retainers, training, productized automations |\n| Keys | Measurable outcomes, documentation, support, security |\n| Watch out for | Building critical client systems on your personal accounts |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  AUDIT[Discovery audit] --> PROPOSAL[Scoped proposal with ROI]\n  PROPOSAL --> BUILD[Build + test]\n  BUILD --> HANDOFF[Documentation + training]\n  HANDOFF --> RETAINER[Monitoring + improvement retainer]\n```\n\n### Worked example\n\n| Offer | Typical structure |\n|---|---|\n| Automation audit | Fixed fee, 1–2 weeks, prioritized roadmap |\n| Implementation | Fixed scope per workflow with acceptance tests |\n| Retainer | Monthly monitoring, fixes, small improvements |\n| Training | Workshops for internal citizen developers |"}, {"id": 197, "title": "Career paths and skills", "tldr": "AI automation roles include automation specialist, workflow/integration engineer, AI engineer, RPA developer and automation architect. Core skills: process thinking, APIs and JSON, one main platform deeply, basic JavaScript/Python, LLM prompting and evaluation, and reliability and security practices.", "real": "Job listings for “AI automation” and “n8n developer” roles grew alongside platform adoption, and n8n reported in 2025 that more than 80% of workflows on its platform embed AI agents.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Roles and skills in AI automation |\n| Foundations | Process mapping, APIs, JSON, data mapping |\n| Technical | JavaScript/Python, SQL, Docker, LLM APIs |\n| Differentiators | Reliability, security, evaluation, business ROI focus |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BEGIN[Beginner: no-code Zaps + scenarios] --> INTER[Intermediate: n8n, APIs, AI steps]\n  INTER --> ADV[Advanced: agents, RAG, self-hosting, MCP]\n  ADV --> ARCH[Architect: governance, platforms, strategy]\n```\n\n### Worked example\n\n| Level | Portfolio project |\n|---|---|\n| Beginner | Form → AI classify → sheet → Slack |\n| Intermediate | Support triage with structured output + error workflow |\n| Advanced | RAG docs bot + Crawl4AI ingestion + self-hosted n8n queue mode |\n| Architect | Automation catalog, governance policy, platform selection report |"}, {"id": 198, "title": "Trends shaping AI automation", "tldr": "Key trends: agents embedded in workflows, MCP as the standard tool interface, natural-language workflow building, computer-use and browser agents, consolidation of vendors, execution-based pricing and stronger governance and security defaults.", "real": "In 2025–2026, n8n added an AI Workflow Builder and instance-level MCP server, Zapier made Agents generally available, Make added MCP and sub-agents, and Workday acquired Flowise and Pipedream.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Directions the field is moving |\n| Trends | Agents in workflows, MCP, NL building, computer use, consolidation |\n| Implication | Skills in evaluation, security and architecture grow in value |\n| Watch out for | Chasing every new tool instead of mastering fundamentals |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  NOW[Workflows with AI steps] --> NEXT[Agents inside governed workflows]\n  NEXT --> MCPSTD[MCP-connected tool ecosystems]\n  MCPSTD --> NL[Natural-language building + review]\n  NL --> AUTONOMY[More autonomy with stronger guardrails]\n```\n\n### Worked example\n\n| Trend | What to learn |\n|---|---|\n| MCP everywhere | Build and secure MCP servers/clients |\n| Agents in workflows | Tool design, evaluation, HITL |\n| Natural-language builders | Reviewing generated workflows critically |\n| Secure-by-default platforms | Task runners, isolation, credential hygiene |"}, {"id": 199, "title": "Learning roadmap: basic to advanced", "tldr": "Progress in stages: automation concepts and one no-code tool; APIs, JSON and webhooks; n8n in depth; AI steps with structured output; RAG and agents; web data with Crawl4AI/Firecrawl; production operations; security and governance; then architecture and specialization.", "real": "Official learning resources include n8n’s documentation and courses, Zapier Learn, Make Academy, Crawl4AI’s documentation and Firecrawl’s docs, all free to access.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structured path through this guide |\n| Method | One project per stage, measured and documented |\n| Time | Roughly 3–6 months of steady practice to reach advanced level |\n| Watch out for | Skipping fundamentals (APIs, data mapping, error handling) |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  S1[Stage 1: concepts + Zapier/Make basics] --> S2[Stage 2: APIs, JSON, webhooks]\n  S2 --> S3[Stage 3: n8n core + advanced]\n  S3 --> S4[Stage 4: AI steps + structured output]\n  S4 --> S5[Stage 5: RAG + agents + MCP]\n  S5 --> S6[Stage 6: web data: Crawl4AI, Firecrawl]\n  S6 --> S7[Stage 7: production, security, governance]\n```\n\n### Worked example\n\n| Stage | Chapters | Project |\n|---|---|---|\n| 1 | 1–10, 51–70 | Form → AI → sheet → Slack |\n| 2–3 | 11–30 | Lead capture workflow in n8n |\n| 4 | 31–40, 81–90 | Support triage with structured output |\n| 5 | 91–100 | RAG chatbot + MCP server |\n| 6 | 101–130 | Price monitor with Crawl4AI |\n| 7 | 41–50, 161–180 | Self-hosted n8n in queue mode with monitoring |"}, {"id": 200, "title": "Glossary", "tldr": "A shared vocabulary for AI automation, covering the terms used throughout this guide.", "real": "Each platform uses its own names for similar ideas (Zaps, scenarios, workflows; steps, modules, nodes), so a shared glossary helps teams compare tools and communicate clearly.", "body": "### Diagram\n\n```mermaid\nflowchart LR\n  WF[Workflow terms] --> AI[AI terms]\n  AI --> WEB[Web data terms]\n  WEB --> OPS[Operations terms]\n```\n\n### Glossary\n\n| Term | Meaning |\n|---|---|\n| Trigger | Event that starts a workflow |\n| Node / step / module | One unit of work in a workflow |\n| Item / bundle | One record of data flowing through a workflow |\n| Webhook | HTTP endpoint that receives events |\n| Expression | Dynamic value computed from data (`{{ ... }}`) |\n| Idempotency | Running twice has the same effect as once |\n| Structured output | AI response conforming to a schema |\n| RAG | Retrieval-augmented generation from your documents |\n| Agent | AI that chooses tools and steps toward a goal |\n| MCP | Model Context Protocol for connecting AI to tools |\n| Human in the loop | Human approval or input inside an automation |\n| Queue mode | n8n mode distributing executions to workers via Redis |\n| Crawl | Visiting many pages by following links |\n| fit_markdown | Crawl4AI’s filtered, noise-reduced Markdown output |\n| Headless browser | Browser running without a visible window |\n| RPA | Automating applications through their user interface |\n| Task / credit / execution | Billing units in Zapier / Make / n8n |\n| Dead-letter queue | Store for failed jobs to inspect and replay |"}];
const PARTS = ["AI automation foundations", "n8n fundamentals", "n8n advanced", "AI in n8n", "n8n in production", "Zapier", "Make", "Other automation platforms", "LLM building blocks", "Agent builders and frameworks", "Web scraping fundamentals", "Crawl4AI", "Firecrawl, Apify and web data tools", "Browser and computer-use automation", "Document and data automation", "Business use cases", "Reliability and operations", "Security, privacy and governance", "Hands-on projects", "Mastery"];
const TOTAL = 200, PER = 10;
function idsOf(p){ const a = []; for (let i = (p-1)*PER + 1; i <= p*PER; i++) a.push(i); return a; }
const partOf = id => Math.ceil(id / PER);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "ai-automation-progress-v1";
const LS_LAST = "ai-automation-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
  if (!dbRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try{ await dbRef.set({done:[...done].sort((a,b)=>a-b), updated:Date.now()}); }
  catch(e){ if (e && (e.code === "revoked" || e.code === "invalid_argument" || e.code === "not_granted")) dbRef = null; }
  writing = false;
  if (pendingWrite){ pendingWrite = false; pushRemote(); }
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...done])); }catch(e){} }
function toggle(id){
  if (done.has(id)) done.delete(id); else done.add(id);
  saveLocal(); pushRemote(); renderAll();
  toast(done.has(id) ? "Chapter " + id + " marked complete" : "Chapter " + id + " marked not complete");
}

/* ---------- helpers ---------- */
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inlineMd(s){
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function md(s){
  if (window.marked && marked.parse){
    const html = marked.parse(s, {gfm:true, headerIds:false, mangle:false});
    return html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>");
  }
  return "<pre>" + esc(s) + "</pre>";
}
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}
function currentId(){
  const m = location.hash.match(/^#ch-(\d{1,3})$/);
  const n = m ? +m[1] : 0;
  return n >= 1 && n <= TOTAL ? n : 0;
}

/* ---------- header memory bank ---------- */
function renderBank(){
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= PARTS.length; p++){
    html += '<div class="bank-group" title="Part ' + p + ': ' + esc(PARTS[p-1]) + '">';
    for (const i of idsOf(p)){
      html += '<button class="cell' + (done.has(i) ? " done" : "") + (i === cur ? " here" : "") +
        '" data-go="' + i + '" aria-label="Chapter ' + i + (done.has(i) ? ", complete" : "") + '"></button>';
    }
    html += "</div>";
  }
  document.getElementById("bank").innerHTML = html;
  document.getElementById("doneCount").textContent = done.size;
  document.getElementById("pct").textContent = Math.round(done.size * 100 / TOTAL) + "%";
}

/* ---------- sidebar ---------- */
const openParts = new Set();
function renderSide(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const cur = currentId();
  let html = "";
  for (let p = 1; p <= PARTS.length; p++){
    const ids = idsOf(p);
    const matches = ids.filter(i => !q || byId[i].title.toLowerCase().includes(q) || byId[i].tldr.toLowerCase().includes(q) || String(i) === q);
    if (q && !matches.length) continue;
    const count = ids.filter(i => done.has(i)).length;
    const open = q || openParts.has(p) || partOf(cur) === p;
    html += '<div class="part' + (open ? " open" : "") + '">' +
      '<button class="part-head" data-part="' + p + '" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="part-num">' + String(p).padStart(2, "0") + '</span>' +
      '<span class="part-name">' + esc(PARTS[p-1]) + '</span>' +
      '<span class="part-count' + (count === PER ? " full" : "") + '">' + count + '/' + PER + '</span></button><ul class="part-list">';
    for (const i of matches){
      html += '<li class="ch-row' + (i === cur ? " active" : "") + '">' +
        '<button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="' + (done.has(i) ? "Mark chapter " + i + " not complete" : "Mark chapter " + i + " complete") + '">' + TICK + '</button>' +
        '<a href="#ch-' + i + '"><span class="n">' + i + '.</span>' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ul></div>";
  }
  if (!html) html = '<p style="color:var(--muted);font-size:14px;padding:8px">No chapters match that search. Try a shorter word like “n8n”, “webhook” or “crawl”.</p>';
  document.getElementById("parts").innerHTML = html;
}

/* ---------- diagrams and charts ---------- */
let mermaidPromise = null, renderSeq = 0;
const svgCache = new Map();
function isDark(){
  const a = document.documentElement.getAttribute("data-theme");
  if (a) return a === "dark";
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function ensureMermaid(){
  if (window.mermaid) return Promise.resolve(window.mermaid);
  if (mermaidPromise) return mermaidPromise;
  mermaidPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js";
    s.onload = () => {
      try{
        window.mermaid.initialize({ startOnLoad:false, securityLevel:"strict", theme: isDark() ? "dark" : "neutral",
          fontFamily:"IBM Plex Sans, system-ui, sans-serif", flowchart:{ curve:"basis", htmlLabels:true } });
        resolve(window.mermaid);
      }catch(e){ reject(e); }
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return mermaidPromise;
}
function fitSvg(div){
  const svg = div.querySelector("svg");
  if (!svg) return;
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Diagram");
  const vb = (svg.getAttribute("viewBox") || "").split(/\s+/).map(Number);
  const vbw = vb[2] || 0;
  if (vbw && div.clientWidth && div.clientWidth < vbw * 0.7){
    svg.style.maxWidth = "none";
    svg.style.width = Math.round(vbw * 0.85) + "px";
  }
}
function fmtNum(v){ return Number(v).toLocaleString("en-US", { maximumFractionDigits: 3 }); }
function renderChart(el, spec){
  const max = Math.max(...spec.data.map(d => d[1]));
  const unit = spec.unit || "";
  const sep = (unit === "%" || unit === "×") ? "" : " ";
  let rows = "";
  for (const [label, v] of spec.data){
    let w = spec.log ? (Math.log10(v + 1) / Math.log10(max + 1)) * 100 : (v / max) * 100;
    w = Math.max(w, 1.5);
    rows += '<div class="bar-row"><span class="bar-label">' + esc(String(label)) + '</span><span class="bar-track"><span class="bar" style="width:' + w.toFixed(1) + '%"></span></span><span class="bar-val">' + fmtNum(v) + sep + esc(unit) + '</span></div>';
  }
  const fig = document.createElement("figure");
  fig.className = "chart";
  fig.innerHTML = '<figcaption>' + esc(spec.title || "") + '</figcaption>' + rows + (spec.log ? '<div class="chart-note">Bar lengths use a logarithmic scale.</div>' : "");
  el.replaceWith(fig);
}
function enhance(root){
  root.querySelectorAll("code.language-chart").forEach(code => {
    const pre = code.closest("pre") || code;
    try{ renderChart(pre, JSON.parse(code.textContent)); }catch(e){}
  });
  const blocks = [...root.querySelectorAll("code.language-mermaid")];
  if (!blocks.length) return;
  const seq = ++renderSeq;
  const holders = blocks.map(code => {
    const pre = code.closest("pre") || code;
    const div = document.createElement("div");
    div.className = "diagram loading";
    div.textContent = "Loading diagram…";
    div.dataset.src = code.textContent;
    pre.replaceWith(div);
    if (svgCache.has(div.dataset.src)){ div.classList.remove("loading"); div.innerHTML = svgCache.get(div.dataset.src); div.dataset.done = "1"; fitSvg(div); }
    return div;
  }).filter(div => !div.dataset.done);
  if (!holders.length) return;
  ensureMermaid().then(async m => {
    for (let k = 0; k < holders.length; k++){
      const div = holders[k];
      if (seq !== renderSeq || !div.isConnected) return;
      const id = "mmd-" + seq + "-" + k;
      try{
        const out = await m.render(id, div.dataset.src);
        if (!div.isConnected) return;
        div.classList.remove("loading");
        div.innerHTML = out.svg;
        svgCache.set(div.dataset.src, out.svg);
        fitSvg(div);
      }catch(e){
        const junk = document.getElementById("d" + id); if (junk) junk.remove();
        div.classList.remove("loading");
        div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>";
      }
    }
  }).catch(() => {
    holders.forEach(div => { div.classList.remove("loading"); div.innerHTML = "<pre><code>" + esc(div.dataset.src) + "</code></pre>"; });
  });
}

/* ---------- chapter view ---------- */
function renderChapter(id){
  const c = byId[id];
  const p = partOf(id);
  const ids = idsOf(p);
  const isDone = done.has(id);
  const tabs = ids.map(i =>
    '<button class="tab' + (i === id ? " active" : "") + '" role="tab" aria-selected="' + (i === id) + '" data-go="' + i + '">' +
    '<span class="dot' + (done.has(i) ? " on" : "") + '"></span><span class="tab-t">' + i + '. ' + esc(byId[i].title) + '</span></button>'
  ).join("");
  document.getElementById("main").innerHTML =
    '<p class="crumb">Part ' + p + ' of ' + PARTS.length + ': ' + esc(PARTS[p-1]) + '</p>' +
    '<div class="tabs" role="tablist" aria-label="Chapters in this part">' + tabs + '</div>' +
    '<article>' +
      '<p class="ch-no">Chapter ' + id + ' of ' + TOTAL + '</p>' +
      '<h1 class="ch-title">' + esc(c.title) + '</h1>' +
      '<section class="box tldr"><h2>TL;DR</h2><p>' + inlineMd(c.tldr) + '</p></section>' +
      '<div class="body">' + md(c.body) + '</div>' +
      '<section class="box real"><h2>Real-world example</h2><p>' + inlineMd(c.real) + '</p></section>' +
      '<div class="done-bar">' +
        '<button class="complete' + (isDone ? " on" : "") + '" data-toggle="' + id + '" aria-pressed="' + isDone + '">' +
          '<span class="tick' + (isDone ? " on" : "") + '">' + TICK + '</span>' + (isDone ? "Completed" : "Mark as complete") + '</button>' +
        '<div class="nav">' +
          '<button class="btn" data-go="' + (id - 1) + '"' + (id === 1 ? " disabled" : "") + '>Previous</button>' +
          '<button class="btn" data-go="' + (id + 1) + '"' + (id === TOTAL ? " disabled" : "") + '>Next</button>' +
        '</div>' +
      '</div>' +
    '</article>';
  enhance(document.getElementById("main"));
}

/* ---------- contents view ---------- */
function renderContents(){
  let html = '<div class="contents"><h1>Contents</h1>' +
    '<p class="lead">A complete AI automation guide in twenty parts, from basics to advanced: foundations, n8n in depth (fundamentals, advanced features, AI agents, RAG, MCP, self-hosting and production), Zapier, Make, Power Automate and other platforms, LLM building blocks, agent builders (Dify, Flowise, Langflow, OpenAI Agent Builder, LangGraph, CrewAI), web data with Crawl4AI, Firecrawl and Apify, browser and computer-use automation, document and business automations, reliability, security and governance, ten hands-on projects and a mastery roadmap. Every chapter has an automation card, a diagram and a worked example. Tools change quickly, so confirm details against current documentation. Tick a chapter when you finish it; your progress is saved.</p>' +
    '<div class="contents-actions"><button class="btn" data-go="' + firstUnread() + '">' + (done.size ? "Continue with chapter " + firstUnread() : "Start chapter 1") + '</button>' +
    '<button class="btn" id="resetBtn">Reset progress</button></div><div class="grid">';
  for (let p = 1; p <= PARTS.length; p++){
    const ids = idsOf(p);
    const count = ids.filter(i => done.has(i)).length;
    html += '<section class="pcard"><h2>Part ' + p + ': ' + esc(PARTS[p-1]) + '</h2><div class="meta">' + count + ' of ' + PER + ' complete</div><ol>';
    for (const i of ids){
      html += '<li><button class="tick' + (done.has(i) ? " on" : "") + '" data-toggle="' + i + '" aria-label="Toggle chapter ' + i + '">' + TICK + '</button><a href="#ch-' + i + '">' + i + '. ' + esc(byId[i].title) + '</a></li>';
    }
    html += "</ol></section>";
  }
  document.getElementById("main").innerHTML = html + "</div></div>";
}
function firstUnread(){ for (let i = 1; i <= TOTAL; i++) if (!done.has(i)) return i; return TOTAL; }

/* ---------- routing ---------- */
let lastRendered = null;
function renderAll(){
  const id = currentId();
  renderBank(); renderSide();
  const y = window.scrollY;
  if (id) renderChapter(id); else renderContents();
  if (lastRendered === location.hash) window.scrollTo(0, y);
  lastRendered = location.hash;
}
function route(){
  const id = currentId();
  if (!id && location.hash !== "#contents"){
    let last = 0; try{ last = +localStorage.getItem(LS_LAST) || 0; }catch(e){}
    location.replace("#ch-" + (last >= 1 && last <= TOTAL ? last : 1));
    return;
  }
  if (id){ try{ localStorage.setItem(LS_LAST, id); }catch(e){} }
  document.body.classList.remove("drawer");
  renderAll();
  window.scrollTo(0, 0);
  const active = document.querySelector(".ch-row.active");
  if (active) active.scrollIntoView({block:"nearest"});
  const tab = document.querySelector(".tab.active");
  if (tab && tab.parentElement){ const r = tab.parentElement; const left = tab.offsetLeft - r.offsetLeft; if (left < r.scrollLeft || left + tab.offsetWidth > r.scrollLeft + r.clientWidth) r.scrollLeft = left - 16; }
}
function go(id){ if (id >= 1 && id <= TOTAL) location.hash = "#ch-" + id; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){ e.preventDefault(); toggle(+t.dataset.toggle); return; }
  const g = e.target.closest("[data-go]");
  if (g && !g.disabled){ go(+g.dataset.go); return; }
  const ph = e.target.closest("[data-part]");
  if (ph){
    const p = +ph.dataset.part;
    const el = ph.parentElement;
    const isOpen = el.classList.toggle("open");
    if (isOpen) openParts.add(p); else openParts.delete(p);
    ph.setAttribute("aria-expanded", isOpen);
    return;
  }
  if (e.target.id === "resetBtn"){
    if (confirm("Clear all 200 ticks? This can’t be undone.")){ done.clear(); saveLocal(); pushRemote(); renderAll(); toast("Progress reset"); }
  }
});
document.getElementById("search").addEventListener("input", renderSide);
document.getElementById("menuBtn").addEventListener("click", () => document.body.classList.add("drawer"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("drawer"));
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = currentId(); if (!id) return;
  if (e.key === "ArrowRight") go(id + 1);
  else if (e.key === "ArrowLeft") go(id - 1);
});
function setTopH(){ document.documentElement.style.setProperty("--top-h", document.getElementById("top").offsetHeight + "px"); }
window.addEventListener("resize", setTopH);
window.addEventListener("hashchange", route);
setTopH();
route();
initSync();
</script>

ctly to the internet |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INTERNET[Internet] -->|443 HTTPS| PROXY[Caddy]\n  PROXY -->|http://n8n:5678| N8N[n8n]\n  PROXY -.auto certificates.-> LE[Let's Encrypt]\n```\n\n### Worked example\n\n```text\n# Caddyfile: automatic HTTPS for n8n\nn8n.example.com {\n    reverse_proxy n8n:5678\n}\n```"}, {"id": 46, "title": "Backups and upgrades", "tldr": "Back up the PostgreSQL database, the n8n data volume and the encryption key; test restores. Upgrade regularly, reading release notes and breaking changes, testing in staging, and pinning image versions in production.", "real": "Before the 2.0 upgrade, n8n shipped a Migration Report tool (from version 1.121.0) for global admins that scans workflows and instance configuration for issues, and supported 1.x with security and bug fixes for three months after 2.0.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Protecting and updating your instance |\n| Back up | Database, data volume, encryption key, workflow exports |\n| Upgrade process | Read notes → staging → backup → upgrade → verify |\n| Watch out for | Using the `latest` tag in production |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  NOTES[Read release notes + breaking changes] --> STAGE[Upgrade staging]\n  STAGE --> TEST[Run critical workflows]\n  TEST --> BACKUP[Back up production]\n  BACKUP --> UPGRADE[Upgrade production: pinned version]\n  UPGRADE --> VERIFY[Verify executions]\n```\n\n### Worked example\n\n```bash\n# Nightly PostgreSQL backup\ndocker compose exec -T postgres pg_dump -U n8n n8n | gzip > backups/n8n-$(date +%F).sql.gz\n\n# Pin a specific version in docker-compose.yml, for example:\n# image: docker.n8n.io/n8nio/n8n:<version>\n```"}, {"id": 47, "title": "Monitoring n8n", "tldr": "Monitor instance health (CPU, memory, queue length), execution failures, latency and webhook availability. Use n8n’s Prometheus metrics endpoint, log streaming, an error workflow and an external uptime check.", "real": "Setting N8N_METRICS=true exposes a /metrics endpoint in Prometheus format, and n8n Enterprise adds log streaming to external destinations.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Observability for automation infrastructure |\n| Signals | Failed executions, queue depth, durations, resource usage, uptime |\n| Tools | Prometheus + Grafana, error workflow, uptime monitor, logs |\n| Watch out for | Discovering failures only when users complain |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  N8N[n8n /metrics] --> PROM[Prometheus]\n  PROM --> GRAF[Grafana dashboards + alerts]\n  ERRWF[Error workflow] --> SLACK[Slack alerts]\n  UPTIME[Uptime check on /healthz] --> PAGER[On-call alert]\n```\n\n### Worked example\n\n| Alert | Threshold |\n|---|---|\n| Failed executions | > 5 in 15 minutes for critical workflows |\n| Redis queue waiting jobs | > 500 for 10 minutes |\n| Instance health endpoint | Down for 2 minutes |\n| Disk usage | > 80% |"}, {"id": 48, "title": "Securing n8n", "tldr": "Secure n8n with HTTPS, strong authentication (SSO/2FA), least-privilege user roles, restricted community nodes, task runners in external mode for code isolation, network egress limits, credential hygiene and regular upgrades.", "real": "n8n 2.0 tightened defaults across the board, including running Code nodes on task runners, blocking environment variable access from Code nodes and enforcing settings file permissions.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Hardening the automation platform |\n| Why it matters | n8n holds credentials to many business systems |\n| Controls | SSO/2FA, roles, HTTPS, isolation, upgrades, audit, restricted nodes |\n| Watch out for | Public editor with weak passwords; outdated versions |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  SEC[n8n security] --> ACCESS[Access: SSO, 2FA, roles]\n  SEC --> NET[Network: HTTPS, private editor, egress limits]\n  SEC --> CODE[Code isolation: task runners, external mode]\n  SEC --> CREDS[Credentials: least privilege, rotation]\n  SEC --> UPDATES[Patching: timely upgrades]\n```\n\n### Worked example\n\n| Setting / practice | Effect |\n|---|---|\n| Editor reachable only via VPN/ZTNA; webhooks public | Smaller attack surface |\n| Task runners in external mode | Stronger isolation of user code |\n| NODES_EXCLUDE for risky nodes (e.g. Execute Command) | Prevents shell access from workflows |\n| Regular `n8n audit` / security reviews | Find risky credentials and nodes |"}, {"id": 49, "title": "Self-hosting vs n8n Cloud: cost and trade-offs", "tldr": "n8n Cloud removes infrastructure work; self-hosting gives control, data residency and unlimited executions at server cost, but requires operations skills. Compare total cost including engineering time, not just server price.", "real": "n8n moved to execution-based pricing on its paid plans, counting complete workflow runs rather than steps, while the self-hosted Community Edition remains free.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Hosting decision for n8n |\n| Cloud pros | No ops, automatic upgrades, support |\n| Self-host pros | Data control, no execution caps, custom infrastructure |\n| Watch out for | Ignoring engineering hours for self-hosting |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  Q{Strict data residency or very high volume?} -->|yes| SELF[Self-host]\n  Q -->|no| OPS{Team comfortable running servers?}\n  OPS -->|yes| EITHER[Either: compare costs]\n  OPS -->|no| CLOUD[n8n Cloud]\n```\n\n### Worked example\n\n```text\nSelf-hosting (illustrative):\nVM 4 vCPU / 8 GB ≈ ₹6,000/month + managed Postgres ≈ ₹3,000/month\nEngineering upkeep 4 hours/month × ₹2,000/hour = ₹8,000/month\nTotal ≈ ₹17,000/month → compare with the cloud plan covering your executions\n```"}, {"id": 50, "title": "Project: production support triage system", "tldr": "Combine everything into a production-grade workflow: email trigger, AI classification and extraction, deduplication, ticket creation, Slack alerts for urgent issues, error workflow, evaluation set and queue-mode deployment.", "real": "Support triage is one of the most widely deployed AI automation patterns because classification and extraction are tasks current LLMs perform reliably with clear instructions.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Route and summarize every support email automatically |\n| Nodes | Gmail Trigger, Information Extractor, Remove Duplicates, Switch, ticketing app, Slack |\n| Reliability | Retries, error workflow, evaluation set, monitoring |\n| Success metric | ≥ 95% correct category on 100 labeled emails |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  MAIL[Gmail Trigger] --> DEDUP[Remove Duplicates: message ID]\n  DEDUP --> EXTRACT[Information Extractor: category, urgency, summary, customer]\n  EXTRACT --> SWITCH{Switch: category}\n  SWITCH -->|billing| T1[Ticket: Billing queue]\n  SWITCH -->|technical| T2[Ticket: Tech queue]\n  SWITCH -->|other| T3[Ticket: General]\n  T1 --> URG{Urgency high?}\n  T2 --> URG\n  URG -->|yes| SLACK[Slack alert to on-call]\n```\n\n### Worked example\n\n| Field | Schema |\n|---|---|\n| category | enum: billing, technical, account, other |\n| urgency | enum: low, medium, high |\n| summary | string, ≤ 2 sentences |\n| customer_email | string |\n| order_id | string or null |"}, {"id": 51, "title": "Zapier fundamentals", "tldr": "Zapier connects apps with Zaps: a trigger in one app starts a sequence of action steps in others. It has the largest integration library and the gentlest learning curve, making it the default choice for non-technical teams.", "real": "By 2026 Zapier connected about 9,000 apps and had expanded from simple Zaps into an AI orchestration platform with Agents, Chatbots, Tables, Forms, Canvas, Copilot and an MCP server.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Cloud no-code automation platform |\n| Core unit | Zap = trigger + actions |\n| Billing unit | Tasks (each successful action step) |\n| Watch out for | Task costs growing with multi-step, high-volume Zaps |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TRIGGER[Trigger: new Typeform response] --> A1[Action: create HubSpot contact]\n  A1 --> A2[Action: AI by Zapier summarize]\n  A2 --> A3[Action: Slack message]\n```\n\n### Worked example\n\n| Zap step | Tasks used per run |\n|---|---|\n| Trigger (new form response) | 0 |\n| Filter (only India) | 0 (built-in) |\n| Create HubSpot contact | 1 |\n| Send Slack message | 1 |\n| Per run total | 2 tasks → 1,000 runs/month = 2,000 tasks |"}, {"id": 52, "title": "Filters, paths and Formatter", "tldr": "Filters stop a Zap unless conditions are met; Paths create branches with different actions; Formatter transforms text, numbers, dates and lists. These built-in tools handle most logic without code and don’t consume tasks.", "real": "Zapier’s pricing documentation notes that built-in utility steps such as Filter and Formatter don’t count as tasks, while app actions do.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Logic and transformation tools in Zapier |\n| Filter | Continue only if conditions match |\n| Paths | If/else branching with multiple routes |\n| Formatter | Dates, text, numbers, line items, lookup tables |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TRIG[New order] --> FMT[Formatter: date to IST]\n  FMT --> PATHS{Paths}\n  PATHS -->|total ≥ ₹10,000| VIP[Notify account manager]\n  PATHS -->|else| STD[Standard thank-you email]\n```\n\n### Worked example\n\n| Formatter action | Input | Output |\n|---|---|---|\n| Text → Title Case | “asha rao” | “Asha Rao” |\n| Date/Time → Format | 2026-11-21T04:30:00Z | 21/11/2026 10:00 (Asia/Kolkata) |\n| Numbers → Format currency | 2499 | ₹2,499.00 |\n| Utilities → Lookup table | “IN” | “India” |"}, {"id": 53, "title": "Webhooks and code in Zapier", "tldr": "Webhooks by Zapier lets you receive data from any system (Catch Hook) or send HTTP requests; Code by Zapier runs small JavaScript or Python snippets for custom logic. Together they cover apps without native integrations.", "real": "Code by Zapier exposes step inputs as inputData (JavaScript) or input_data (Python) and returns data by setting an output object, documented in Zapier’s code step help pages.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Custom HTTP and code steps |\n| Webhooks | Catch Hook (receive), POST/GET/Custom Request (send) |\n| Code | JavaScript or Python with time and memory limits |\n| Watch out for | Large logic in code steps that’s hard for teammates to maintain |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  APP[Custom app] -->|POST JSON| HOOK[Webhooks by Zapier: Catch Hook]\n  HOOK --> CODE[Code by Zapier: clean data]\n  CODE --> SHEETS[Google Sheets: add row]\n```\n\n### Worked example\n\n```python\n# Code by Zapier (Python): input_data fields are mapped in the step editor\nemail = input_data.get(\"email\", \"\").strip().lower()\ndomain = email.split(\"@\")[1] if \"@\" in email else \"\"\nfree = domain in {\"gmail.com\", \"yahoo.com\", \"outlook.com\"}\n\noutput = {\"email\": email, \"domain\": domain, \"is_free_email\": free}\n```"}, {"id": 54, "title": "Tables, Forms and Interfaces", "tldr": "Zapier Tables stores structured data, Zapier Forms and Interfaces build simple forms and portals, and together with Zaps they let teams create lightweight internal apps without separate databases or front-end code.", "real": "Zapier positions Tables, Forms, Interfaces, Chatbots and Agents as products designed to work together, with Canvas mapping how data moves between them.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Built-in data and UI building blocks |\n| Tables | Structured records with fields, views and triggers |\n| Forms / Interfaces | Intake forms, portals, simple internal tools |\n| Watch out for | Outgrowing them for complex apps or large datasets |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  FORM[Interface form: equipment request] --> TABLE[(Zapier Table: requests)]\n  TABLE --> ZAP[Zap: on new record]\n  ZAP --> APPROVE[Manager approval]\n  APPROVE --> UPDATE[Update record status]\n```\n\n### Worked example\n\n| Internal tool | Built with |\n|---|---|\n| Laptop request portal | Interfaces form + Table + approval Zap |\n| Content calendar | Table with status field + Zaps for reminders |\n| Lead intake | Form + Table + enrichment + CRM Zap |"}, {"id": 55, "title": "AI steps in Zapier", "tldr": "Zapier offers AI steps (AI by Zapier and integrations with model providers) to summarize, classify, extract and write within Zaps. Use structured outputs, clear instructions and filters on AI results before taking actions.", "real": "Zapier integrates with hundreds of AI apps, including OpenAI, Anthropic Claude and Google Gemini, and its built-in AI by Zapier step can parse and transform text inside Zaps.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | LLM-powered steps inside Zaps |\n| Uses | Summaries, classification, extraction, drafting replies |\n| Best practice | Ask for specific fields; validate with filters |\n| Watch out for | Sending AI drafts directly to customers without review |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EMAIL[New Gmail email] --> AI[AI step: extract name, company, request type]\n  AI --> FILTER{Filter: request type = demo}\n  FILTER --> CRM[Create CRM deal]\n  CRM --> DRAFT[Create Gmail draft reply for review]\n```\n\n### Worked example\n\n```text\nInstructions for the AI step:\nFrom the email, extract:\n- contact_name\n- company\n- request_type: one of demo, pricing, support, other\n- summary: one sentence\nIf a field is missing, return \"unknown\".\n```"}, {"id": 56, "title": "Zapier Agents", "tldr": "Zapier Agents are AI teammates configured with instructions, knowledge sources and access to Zapier actions across thousands of apps. They can run on triggers or on demand, and should be scoped with limited actions and review steps.", "real": "By mid-2026 Zapier Agents were generally available, and agents built into Zap workflows were bundled into Zapier’s base plans rather than sold separately.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Autonomous AI assistants using Zapier actions |\n| Configuration | Instructions, knowledge, allowed actions, triggers |\n| Best for | Research, enrichment, triage tasks with variable steps |\n| Watch out for | Broad action permissions without human checkpoints |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TRIG[New lead in CRM] --> AGENT[Zapier Agent: research lead]\n  AGENT --> WEB[Web research]\n  AGENT --> CRMREAD[Read CRM history]\n  AGENT --> BRIEF[Write brief to CRM notes]\n  BRIEF --> REVIEW[Sales rep reviews]\n```\n\n### Worked example\n\n```text\nAgent instructions:\nWhen a new lead is created, research the company website and recent news.\nWrite a 5-bullet brief: what they do, size, likely needs, recent news, suggested opener.\nOnly use the actions: search web, read CRM record, update CRM notes.\nNever email the lead directly.\n```"}, {"id": 57, "title": "Zapier MCP", "tldr": "Zapier MCP turns Zapier’s app actions into tools that any MCP client, such as Claude or ChatGPT, can call, with authentication and governance handled by Zapier. Configure exactly which actions are exposed and lock fields where needed.", "real": "Zapier’s MCP server is available at mcp.zapier.com and can be added to Claude Code with a single command, and Zapier reported hundreds of thousands of MCP servers created by 2026.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Zapier actions exposed via Model Context Protocol |\n| Why it matters | AI assistants can act across thousands of apps |\n| Controls | Choose actions, lock fields (e.g. fixed Slack channel), connections |\n| Watch out for | Exposing destructive actions to assistants |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CLAUDE[Claude / ChatGPT / MCP client] -->|MCP| ZMCP[Zapier MCP server]\n  ZMCP --> A1[Gmail: create draft]\n  ZMCP --> A2[Slack: post to #updates]\n  ZMCP --> A3[Sheets: add row]\n```\n\n### Worked example\n\n```bash\n# Add Zapier MCP to Claude Code (from Zapier's setup page)\nclaude mcp add --transport http \"Zapier-MCP\" https://mcp.zapier.com/api/v1/connect\n```\n\n| Exposed action | Locked field |\n|---|---|\n| Slack: send channel message | Channel = #ai-updates |\n| Gmail: create draft | (drafts only, no send) |"}, {"id": 58, "title": "Copilot and Canvas", "tldr": "Zapier Copilot builds Zaps, Tables, Agents and more from natural-language descriptions; Canvas maps business processes visually and links them to automations. Use them to draft quickly, then review every step before turning on.", "real": "Zapier describes Copilot as orchestrating across its products, building multi-product systems while mapping the process visually in Canvas.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | AI-assisted building and process mapping |\n| Copilot | Natural language → Zap drafts |\n| Canvas | Visual process diagrams connected to automations |\n| Watch out for | Accepting generated Zaps without testing edge cases |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DESCRIBE[Describe process in plain English] --> COPILOT[Copilot drafts Zap + Table]\n  COPILOT --> CANVAS[Canvas shows process map]\n  CANVAS --> REVIEW[Review fields + filters]\n  REVIEW --> TEST[Test with real samples]\n  TEST --> ON[Turn on]\n```\n\n### Worked example\n\n```text\nPrompt to Copilot:\n\"When someone books a demo in Calendly, create a HubSpot contact if new,\nadd a deal in the Demo stage, and post a Slack message in #sales with the\ncompany name and meeting time in IST.\"\n```"}, {"id": 59, "title": "Zapier pricing, governance and limits", "tldr": "Zapier bills by tasks with plan tiers; enterprise plans add SSO, SCIM, admin controls, audit logs and app restrictions. Watch task consumption, polling intervals and run limits as automations grow.", "real": "Zapier publishes trust credentials including SOC 2 Type II and offers enterprise governance features such as SAML SSO, SCIM provisioning and audit logs.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Cost and control model for Zapier |\n| Cost drivers | Number of action steps × runs |\n| Governance | SSO, SCIM, app allow-lists, audit logs, shared connections |\n| Watch out for | Polling triggers delaying automations on lower plans |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  RUNS[Runs per month] --> TASKS[Tasks = action steps × runs]\n  STEPS[Action steps per Zap] --> TASKS\n  TASKS --> PLAN[Plan tier needed]\n```\n\n### Worked example\n\n```text\nZap with 4 action steps, 3,000 runs/month → 12,000 tasks/month\nOptimization: move 2 steps into one Formatter/Code step where possible\n→ 3 action steps × 3,000 = 9,000 tasks (25% fewer)\n```"}, {"id": 60, "title": "When to choose Zapier", "tldr": "Choose Zapier when non-technical teams build automations, integrations breadth matters most, speed beats customization, and data volumes are moderate. Consider n8n or Make when complex logic, high volume or self-hosting dominate.", "real": "Industry comparisons in 2026 consistently position Zapier as strongest for integration breadth and ease of use, Make for visual data transformation, and n8n for technical teams, AI-heavy workflows and self-hosting.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Fit assessment for Zapier |\n| Strengths | Integrations, ease of use, governance, AI products |\n| Weaknesses | Task-based cost at volume, complex branching, no self-hosting |\n| Watch out for | Rebuilding everything in Zapier when one team needs code-level control |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  Q1{Non-technical builders?} -->|yes| Z[Zapier]\n  Q1 -->|no| Q2{Complex data transformation?}\n  Q2 -->|yes| M[Make or n8n]\n  Q2 -->|no| Q3{Self-hosting or AI-heavy?}\n  Q3 -->|yes| N[n8n]\n  Q3 -->|no| Z\n```\n\n### Worked example\n\n| Scenario | Recommendation |\n|---|---|\n| Marketing team connecting 15 SaaS tools | Zapier |\n| Data team syncing 100,000 rows nightly | n8n (or code) |\n| Agency building complex client scenarios | Make or n8n |\n| Company needing on-premise automation | n8n self-hosted |"}, {"id": 61, "title": "Make fundamentals", "tldr": "Make (formerly Integromat, owned by Celonis) builds automations as visual scenarios: modules connected on a canvas, processing data in bundles. It excels at complex data transformation with routers, iterators and aggregators.", "real": "Make switched its billing unit from operations to credits on August 27, 2025; most module actions still consume one credit, while some built-in AI features consume credits based on usage.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Visual scenario-based automation platform |\n| Core units | Scenario, module, bundle, connection |\n| Billing | Credits (most module runs = 1 credit) |\n| Watch out for | Modules that output many bundles multiplying credit usage |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  WATCH[Watch rows: Google Sheets] --> ITER[Iterator]\n  ITER --> HTTP[HTTP: enrich]\n  HTTP --> ROUTER{Router}\n  ROUTER --> CRM[Update CRM]\n  ROUTER --> SLACK[Slack alert]\n```\n\n### Worked example\n\n```text\nScenario: Watch rows (returns 50 new rows) → Create CRM contact → Send Slack message\nCredits ≈ 1 (trigger) + 50 (CRM) + 50 (Slack) = 101 per run\nBatching Slack messages with an aggregator: 1 + 50 + 1 = 52\n```"}, {"id": 62, "title": "Mapping and functions in Make", "tldr": "Make maps values from earlier modules using references like 1.email and transforms them with built-in functions for text, dates, math and arrays, written inside double curly braces with semicolon-separated arguments.", "real": "Make’s function reference includes text functions (lower, replace, trim), date functions (formatDate, parseDate, addDays), array functions (map, get, join) and general functions (if, ifempty).", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Inline data transformation |\n| Syntax | `{{functionName(arg1; arg2)}}` with module references like `3.price` |\n| Categories | General, math, text, date, array functions |\n| Watch out for | Time zone settings when formatting dates |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  M1[Module 1: Webhook] --> MAP[Mapping panel: functions]\n  MAP --> M2[Module 2: CRM fields]\n```\n\n### Worked example\n\n| Goal | Make expression |\n|---|---|\n| Lowercase email | `{{lower(1.email)}}` |\n| Default company | `{{ifempty(1.company; \"Unknown\")}}` |\n| Format today | `{{formatDate(now; \"YYYY-MM-DD\")}}` |\n| Add 7 days | `{{addDays(now; 7)}}` |\n| First array element | `{{get(1.items; 1)}}` |\n| Join tags | `{{join(1.tags; \", \")}}` |"}, {"id": 63, "title": "Routers and filters", "tldr": "Routers split a scenario into multiple routes processed in order; filters between modules decide whether bundles continue. A fallback route handles bundles matching no other filter.", "real": "Make’s router documentation describes processing routes sequentially and supports a fallback route that runs only when no other route’s filter matches.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Branching and conditional flow |\n| Router | One input, many routes |\n| Filters | Conditions on links between modules |\n| Watch out for | Overlapping filters sending bundles down multiple routes |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ORDER[New order] --> ROUTER{Router}\n  ROUTER -->|filter: country = IN| INDIA[Indian fulfillment]\n  ROUTER -->|filter: country ≠ IN| INTL[International fulfillment]\n  ROUTER -->|fallback| REVIEW[Manual review]\n```\n\n### Worked example\n\n| Route | Filter condition |\n|---|---|\n| High value | total ≥ 10000 |\n| Standard | total < 10000 AND total > 0 |\n| Fallback | (none matched, e.g. missing total) |"}, {"id": 64, "title": "Iterators and aggregators", "tldr": "Iterators split an array into separate bundles so each item can be processed; aggregators combine many bundles back into one (array, text, numeric or table). They’re key to handling line items and batching.", "real": "Make provides Array, Text, Numeric and Table aggregators, and its documentation describes the iterator–aggregator pattern for processing order line items and building summaries.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Split and combine bundles |\n| Iterator | Array → many bundles |\n| Aggregator | Many bundles → one bundle |\n| Watch out for | Aggregating from the wrong source module |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ORDER[Order with 5 line items] --> ITER[Iterator: items]\n  ITER --> STOCK[Check stock per item: 5 bundles]\n  STOCK --> AGG[Array aggregator: 1 bundle]\n  AGG --> EMAIL[One email with all items]\n```\n\n### Worked example\n\n| Aggregator | Use |\n|---|---|\n| Array aggregator | Build a list to send in one API call |\n| Text aggregator | Combine lines into a single message |\n| Numeric aggregator | Sum totals across bundles |\n| Table aggregator | Create a table for email/report |"}, {"id": 65, "title": "Data stores and data structures", "tldr": "Data stores are Make’s built-in tables for persisting data between runs (lookups, deduplication, state). Data structures define the shape of JSON for parsing and creating payloads.", "real": "Make’s data stores support add, update, search, get and delete operations, and data structures are reused across JSON, webhooks and data stores to keep formats consistent.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Built-in storage and schemas |\n| Data store uses | Deduplication, processed IDs, small lookup tables |\n| Data structures | JSON schemas for parse/create JSON and webhooks |\n| Watch out for | Data store size limits on lower plans |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  NEW[New record] --> CHECK[Data store: search by ID]\n  CHECK --> EXISTS{Found?}\n  EXISTS -->|yes| SKIP[Skip duplicate]\n  EXISTS -->|no| PROCESS[Process + add ID to data store]\n```\n\n### Worked example\n\n| Data store field | Type |\n|---|---|\n| key | order ID |\n| processed_at | date |\n| status | text |"}, {"id": 66, "title": "Error handling in Make", "tldr": "Make attaches error handler routes to modules with directives: Resume (substitute output), Ignore (skip), Break (store as incomplete execution for retry), Rollback (stop and revert where possible) and Commit (stop but keep changes).", "real": "Make’s error handling documentation lists Break, Commit, Ignore, Resume and Rollback directives, and incomplete executions can be retried automatically when Break is used.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Per-module failure routes |\n| Directives | Resume, Ignore, Break, Rollback, Commit |\n| Incomplete executions | Saved failed runs that can be retried |\n| Watch out for | Ignore hiding real data loss |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  MODULE[HTTP module] -->|error| HANDLER{Error handler}\n  HANDLER --> RESUME[Resume: default values]\n  HANDLER --> BREAK[Break: retry later]\n  HANDLER --> IGNORE[Ignore: skip bundle]\n  HANDLER --> ROLLBACK[Rollback: stop]\n```\n\n### Worked example\n\n| Module | Directive |\n|---|---|\n| Enrichment API (optional) | Resume with empty enrichment |\n| Payment record creation | Break with automatic retries |\n| Logging to sheet (non-critical) | Ignore |\n| Multi-step database transaction | Rollback |"}, {"id": 67, "title": "Webhooks and HTTP in Make", "tldr": "Custom webhooks receive data from any app; the HTTP module calls any API with authentication, headers and JSON bodies; Webhook Response returns custom responses. These extend Make beyond its prebuilt apps.", "real": "Make’s HTTP app supports API key, basic and OAuth 2.0 authentication, and custom webhooks can determine data structure automatically from a sample request.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Generic integration tools |\n| Modules | Custom webhook, Webhook response, HTTP make a request |\n| Features | Auth, headers, query strings, JSON parsing |\n| Watch out for | Not responding quickly to webhook callers |\n\n### Diagram\n\n```mermaid\nsequenceDiagram\n  participant App as External app\n  participant MW as Make custom webhook\n  participant HTTP as HTTP module\n  App->>MW: POST JSON\n  MW->>HTTP: Call enrichment API\n  HTTP-->>MW: JSON response\n  MW-->>App: Webhook response 200\n```\n\n### Worked example\n\n| HTTP module setting | Value |\n|---|---|\n| URL | https://api.example.com/v1/companies |\n| Method | GET |\n| Query string | domain = `{{1.domain}}` |\n| Headers | Authorization: Bearer (from connection) |\n| Parse response | Yes |"}, {"id": 68, "title": "Make AI Agents and AI Toolkit", "tldr": "Make AI Agents let a model choose among scenarios and tools to complete goals, with support for MCP servers and sub-agents; the AI Toolkit provides ready AI modules for tasks like extraction and categorization. Use your own model provider connection or Make’s AI Provider.", "real": "In November 2025 Make allowed all paid plans to use their own AI provider connections in Make AI Agents and the AI Toolkit, and in 2026 added MCP support and sub-agents as tools in its new AI Agents app.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | AI decision-making inside Make |\n| Agents | Goal + tools (scenarios, MCP) + model |\n| AI Toolkit | Prebuilt AI modules (extract, categorize, summarize) |\n| Watch out for | Credit usage of Make’s AI Provider vs your own API key |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REQUEST[Customer request] --> AGENT[Make AI Agent]\n  AGENT --> S1[Scenario tool: check order]\n  AGENT --> S2[Scenario tool: create ticket]\n  AGENT --> MCP[MCP server tools]\n  AGENT --> RESP[Response]\n```\n\n### Worked example\n\n| Choice | Billing effect |\n|---|---|\n| Make’s AI Provider | Credits based on model and tokens |\n| Your own OpenAI/Anthropic connection | Pay provider directly; module still uses Make credits |"}, {"id": 69, "title": "Make Grid and MCP server", "tldr": "Make Grid auto-maps your automation landscape, showing scenarios, apps, AI agents and dependencies; Make’s MCP server exposes scenarios as tools for external AI assistants. Both help manage automation at scale.", "real": "Make Grid launched in public beta in 2025 and in July 2026 added support for mapping n8n, Claude Managed Agents and Relevance AI alongside Make scenarios.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Observability map + AI tool exposure |\n| Grid | Visual dependency map, content search across scenarios |\n| MCP server | Scenarios callable from MCP clients |\n| Watch out for | Exposing scenarios that modify data without safeguards |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  GRID[Make Grid] --> SC[Scenarios]\n  GRID --> APPS[Connected apps]\n  GRID --> AGENTS[AI agents]\n  GRID --> DEP[Dependencies + data flows]\n  MCPCLIENT[Claude / other MCP clients] --> MCPSERVER[Make MCP server] --> SC\n```\n\n### Worked example\n\n| Question | Grid helps answer |\n|---|---|\n| Which scenarios break if we change the CRM field “Lead Source”? | Dependency search |\n| Which automations use a departing employee’s connection? | Connection mapping |\n| Where are AI prompts used? | Content search across configurations |"}, {"id": 70, "title": "When to choose Make", "tldr": "Choose Make for visual, complex data manipulation at moderate cost, especially for operations and marketing teams and agencies. Choose Zapier for simplest setup and widest integrations, and n8n for self-hosting, code and AI-heavy engineering work.", "real": "Make connects about 3,000+ apps, fewer than Zapier, but comparisons frequently credit Make’s iterators, aggregators and visual router logic as stronger for data transformation.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Fit assessment for Make |\n| Strengths | Visual complex logic, data transformation, price/performance |\n| Weaknesses | Steeper learning curve than Zapier, cloud-only |\n| Watch out for | Credits multiplying with many bundles |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  Q{Main need} -->|complex visual data flows| MAKE[Make]\n  Q -->|simplest no-code + widest apps| ZAP[Zapier]\n  Q -->|self-host, code, AI agents| N8N[n8n]\n```\n\n### Worked example\n\n| Scenario | Why Make fits |\n|---|---|\n| E-commerce order line-item processing | Iterators/aggregators |\n| Agency managing many client automations | Visual scenarios, organizations, teams |\n| Multi-branch marketing workflows | Routers and filters |"}, {"id": 71, "title": "Microsoft Power Automate", "tldr": "Power Automate automates Microsoft 365 and beyond with cloud flows (API-based), desktop flows (RPA for Windows apps) and Copilot-assisted building. It’s the natural choice in Microsoft-centric organizations, with governance through the Power Platform admin center.", "real": "Power Automate includes Power Automate Desktop for recording and running UI automations on Windows, and Microsoft added Copilot to let users describe flows in natural language.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Microsoft’s automation platform |\n| Flow types | Cloud flows (automated, instant, scheduled), desktop flows (RPA) |\n| Strengths | Microsoft 365, Teams, SharePoint, Dataverse, governance |\n| Watch out for | Premium connector licensing costs |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  OUTLOOK[New Outlook email with attachment] --> SAVE[Save to SharePoint]\n  SAVE --> AI[AI Builder: extract invoice fields]\n  AI --> APPROVAL[Teams approval]\n  APPROVAL --> DESKTOP[Desktop flow: enter into legacy ERP]\n```\n\n### Worked example\n\n| Need | Power Automate feature |\n|---|---|\n| Teams approval for expenses | Approvals connector |\n| Automate a Windows-only legacy app | Desktop flow |\n| Extract fields from forms | AI Builder document processing |\n| Company-wide governance | Data loss prevention policies for connectors |"}, {"id": 72, "title": "Activepieces", "tldr": "Activepieces is an open-source (MIT-licensed core) automation platform with a clean builder, self-hosting, MCP server and client support and an embedding SDK. It’s attractive when licensing freedom and embedding automation in your own product matter.", "real": "Activepieces shipped native Model Context Protocol server and client pieces in 2025, letting flows be exposed as tools and external MCP tools be called from flows.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Open-source no-code automation platform |\n| License | MIT (community edition) |\n| Strengths | Self-hosting, permissive license, MCP, embedding |\n| Watch out for | Smaller integration library than Zapier |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TRIGGER[Trigger piece] --> PIECE1[App piece]\n  PIECE1 --> AI[AI piece]\n  AI --> PIECE2[Action piece]\n  MCPC[MCP client] --> FLOWS[Flows exposed as MCP tools]\n```\n\n### Worked example\n\n| Requirement | Activepieces fit |\n|---|---|\n| SaaS product wants embedded automations for customers | Embed SDK |\n| Need permissive license for modifications | MIT core |\n| Self-hosted AI automation | Docker deployment + AI pieces |"}, {"id": 73, "title": "Pipedream", "tldr": "Pipedream is a developer-focused integration platform combining prebuilt actions for 3,000+ apps with full Node.js and Python code steps, managed authentication and APIs for embedding integrations into AI agents.", "real": "Workday signed an agreement to acquire Pipedream in November 2025, citing its more than 3,000 prebuilt connectors as connectivity for Workday’s AI agents.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Code-friendly integration platform |\n| Strengths | Code steps, managed OAuth, connectors for AI agents |\n| Users | Developers building integrations and agent tools |\n| Watch out for | Roadmap changes after acquisition; check current offering |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TRIGGER[HTTP / app trigger] --> CODE1[Node.js step]\n  CODE1 --> ACTION[Prebuilt app action]\n  ACTION --> CODE2[Python step]\n  AGENT[Your AI agent] --> CONNECT[Managed auth connectors]\n```\n\n### Worked example\n\n| Use case | Why Pipedream |\n|---|---|\n| Developer needs code + integrations | Mix code steps and actions |\n| Product needs users to connect their apps for an agent | Managed authentication |"}, {"id": 74, "title": "Enterprise iPaaS", "tldr": "Enterprise integration platforms such as Workato, MuleSoft, Boomi and SAP Integration Suite handle large-scale, governed integrations between core systems (ERP, CRM, HR) with strong security, monitoring and API management. They cost more and need specialists.", "real": "MuleSoft (acquired by Salesforce in 2018) and Boomi are long-established enterprise integration platforms, and Workato and others added AI agent capabilities to their enterprise automation offerings.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Enterprise-grade integration and automation |\n| Strengths | Governance, scale, API management, SLAs |\n| Typical systems | SAP, Oracle, Salesforce, Workday, data warehouses |\n| Watch out for | Long implementation timelines and licensing costs |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ERP[ERP] <--> IPAAS[Enterprise iPaaS]\n  CRM[CRM] <--> IPAAS\n  HR[HR system] <--> IPAAS\n  IPAAS --> API[Managed APIs]\n  IPAAS --> MON[Monitoring + audit]\n```\n\n### Worked example\n\n| Need | Typical choice |\n|---|---|\n| Sync orders between SAP and Salesforce at scale | Enterprise iPaaS |\n| Team-level SaaS automations | Zapier / Make / n8n |\n| Expose internal APIs with governance | API management platform |"}, {"id": 75, "title": "RPA and UiPath", "tldr": "Robotic process automation mimics human actions in user interfaces (clicks, typing, screen reading) for systems without APIs. Modern RPA platforms such as UiPath add AI document processing and agentic orchestration, but UI automation remains more fragile than APIs.", "real": "UiPath, one of the largest RPA vendors, repositioned around “agentic automation” in 2025, combining software robots, AI agents and human workflows in one orchestration platform.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Automating applications through their UI |\n| When to use | Legacy or desktop apps without APIs |\n| Platforms | UiPath, Automation Anywhere, Power Automate Desktop |\n| Watch out for | UI changes breaking robots; high maintenance |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  NEED[Automate a system] --> API{API available?}\n  API -->|yes| USEAPI[Use API integration]\n  API -->|no| RPA[RPA / UI automation]\n  RPA --> MONITOR[Monitor + maintain selectors]\n```\n\n### Worked example\n\n| Integration approach | Reliability | Maintenance |\n|---|---|---|\n| Official API | High | Low |\n| Database integration (read-only) | Medium-high | Medium |\n| RPA on stable desktop app | Medium | Medium-high |\n| RPA on frequently changing web UI | Low | High |"}, {"id": 76, "title": "Google Workspace automation", "tldr": "Google Apps Script automates Gmail, Sheets, Docs, Drive and Calendar with JavaScript running on Google’s servers, triggered on schedules or events. Google has also introduced AI-driven Workspace Flows for no-code automation with Gemini.", "real": "Google announced Workspace Flows in April 2025, using Gemini to automate multi-step processes across Workspace apps, complementing long-standing Apps Script automation.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Native automation inside Google Workspace |\n| Tools | Apps Script, triggers, Workspace Flows |\n| Strengths | Free with Workspace, deep Google app access |\n| Watch out for | Execution time quotas and script ownership when people leave |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TIMER[Time-driven trigger: daily] --> SCRIPT[Apps Script]\n  SCRIPT --> GMAIL[Search Gmail]\n  GMAIL --> SHEET[Append to Sheet]\n  SHEET --> EMAIL[Send summary email]\n```\n\n### Worked example\n\n```javascript\n// Apps Script: log yesterday's invoice emails to a sheet\nfunction logInvoiceEmails() {\n  const sheet = SpreadsheetApp.getActive().getSheetByName('Invoices');\n  const threads = GmailApp.search('subject:invoice newer_than:1d');\n  threads.forEach(thread => {\n    thread.getMessages().forEach(msg => {\n      sheet.appendRow([msg.getDate(), msg.getFrom(), msg.getSubject()]);\n    });\n  });\n}\n```"}, {"id": 77, "title": "IFTTT and consumer automation", "tldr": "IFTTT and phone automation tools (Apple Shortcuts, Android automation apps) handle personal automations: smart home, notifications, social posting and simple app connections. They’re great for individuals but not for business-critical workflows.", "real": "IFTTT (“If This Then That”), founded in 2010, popularized simple trigger–action applets for consumer apps and smart home devices.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Personal automation tools |\n| Examples | IFTTT, Apple Shortcuts, Android automation apps |\n| Strengths | Simple, mobile, smart home |\n| Watch out for | Using personal tools for company data |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LOCATION[Arrive at office] --> SHORTCUT[Phone automation]\n  SHORTCUT --> SILENT[Silence phone]\n  SHORTCUT --> LOG[Log time to sheet]\n```\n\n### Worked example\n\n| Personal automation | Tool |\n|---|---|\n| Save starred emails to notes | IFTTT applet |\n| Morning routine: weather + calendar summary | Apple Shortcuts |\n| Turn on lights at sunset | Smart home automation |"}, {"id": 78, "title": "AI-first automation tools", "tldr": "A newer category of tools, including Relay.app, Gumloop and Lindy, builds automation around AI agents from the start, with natural-language setup, human-in-the-loop steps and AI-native nodes. They’re quick for AI-heavy tasks but have smaller ecosystems.", "real": "Relay.app focuses on agents, workflows and human-in-the-loop steps for small teams, and it added tables and MCP server support, according to Zapier’s 2026 comparison.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Automation platforms designed around AI agents |\n| Examples | Relay.app, Gumloop, Lindy |\n| Strengths | Fast AI agent setup, natural-language building |\n| Watch out for | Vendor maturity, integration depth, data policies |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DESCRIBE[Describe the task] --> AGENT[AI agent configured]\n  AGENT --> TOOLS[App connections]\n  AGENT --> HUMAN[Human review steps]\n  HUMAN --> RESULT[Result]\n```\n\n### Worked example\n\n| Evaluate an AI-first tool on | Question |\n|---|---|\n| Reliability | Can it run 100 times with consistent results? |\n| Data handling | Where is data stored and processed? |\n| Exportability | Can workflows be exported if you leave? |\n| Cost | How are AI credits priced at volume? |"}, {"id": 79, "title": "Code-first orchestration", "tldr": "When workflows become core software, code-first tools such as Windmill, Temporal, Prefect and Apache Airflow provide version control, testing, durable execution and scale. Durable execution engines like Temporal are increasingly used for long-running AI agents.", "real": "Apache Airflow (open-sourced by Airbnb in 2015) is a standard for scheduled data pipelines, and Temporal is used for durable, long-running workflows that survive process crashes and restarts.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Workflow orchestration written in code |\n| Examples | Airflow, Prefect, Dagster (data); Temporal (durable apps); Windmill (scripts + UI) |\n| Strengths | Testing, version control, scale, durability |\n| Watch out for | Engineering effort vs no-code speed |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  NEED{Workflow type} -->|scheduled data pipelines| AIRFLOW[Airflow / Prefect / Dagster]\n  NEED -->|long-running business processes, agents| TEMPORAL[Temporal]\n  NEED -->|internal scripts with UIs| WINDMILL[Windmill]\n  NEED -->|SaaS app integrations| NOCODE[n8n / Zapier / Make]\n```\n\n### Worked example\n\n| Signal you’ve outgrown no-code | Move toward |\n|---|---|\n| Workflows need unit tests and code review | Code-first orchestration |\n| Processes run for weeks with complex state | Durable execution (Temporal) |\n| Heavy data transformation on millions of rows | Data pipeline tools |"}, {"id": 80, "title": "Platform comparison matrix", "tldr": "No single platform wins everywhere. Match the tool to builders, integrations, hosting, AI depth, volume and governance, and accept a mixed stack: a main workflow platform, web data tools, and code for specialized cases.", "real": "Many organizations run several automation platforms simultaneously, which is why tools such as Make Grid now map automations across platforms including n8n.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Side-by-side platform comparison |\n| Why it matters | Avoids forcing one tool onto every use case |\n| Strategy | One primary platform + specialized tools |\n| Watch out for | Uncontrolled tool sprawl without ownership |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  STACK[Typical AI automation stack] --> MAIN[Primary: n8n / Zapier / Make]\n  STACK --> WEB[Web data: Crawl4AI / Firecrawl]\n  STACK --> AGENT[Agent framework for custom products]\n  STACK --> CODE[Code orchestration for core pipelines]\n```\n\n### Worked example\n\n| Platform | Best for | Hosting | AI depth |\n|---|---|---|---|\n| n8n | Technical teams, AI agents, self-hosting | Cloud or self-host | High |\n| Zapier | Non-technical teams, integration breadth | Cloud | Medium-high |\n| Make | Visual complex data flows | Cloud | Medium |\n| Power Automate | Microsoft organizations, RPA | Cloud + desktop | Medium |\n| Activepieces | Open-source, embedding | Cloud or self-host | Medium |\n| Pipedream | Developers, agent connectors | Cloud | Medium |\n| UiPath | Enterprise RPA + agents | Cloud / on-prem | Medium-high |"}, {"id": 81, "title": "LLMs for automation builders", "tldr": "In automations, LLMs act as flexible functions: text in, structured result out. They excel at classification, extraction, summarization, drafting and reasoning over messy inputs, and are weak at exact arithmetic, facts they weren’t given and guaranteed consistency.", "real": "All major workflow platforms (n8n, Zapier, Make, Power Automate) now include native LLM steps, and providers such as Anthropic, OpenAI and Google offer APIs with structured output and tool calling designed for automation.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Language models used as workflow steps |\n| Great at | Classifying, extracting, summarizing, drafting, routing |\n| Weak at | Exact math, unseen facts, perfect determinism |\n| Watch out for | Treating LLM output as verified truth |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INPUT[Messy text: email, PDF, chat] --> LLM[LLM step with clear instructions]\n  LLM --> STRUCT[Structured output: labels, fields, summary]\n  STRUCT --> CODE[Deterministic steps: rules, math, API calls]\n```\n\n### Worked example\n\n| Task | LLM or code? |\n|---|---|\n| Detect if an email is a complaint | LLM |\n| Calculate invoice total with tax | Code |\n| Extract address from free text | LLM + validation |\n| Check if date is a weekend | Code |"}, {"id": 82, "title": "Prompting for automation", "tldr": "Automation prompts should be specific, consistent and machine-readable: define the task, allowed outputs, format, edge-case handling and examples. Put stable instructions first and variable data last, inside clear delimiters.", "real": "Prompting guides from Anthropic, OpenAI and Google all recommend explicit instructions, examples and delimiters for reliable outputs, practices especially important when outputs feed other systems.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Prompt design for unattended use |\n| Must include | Task, allowed values, format, unknown handling, examples |\n| Settings | Low temperature for classification/extraction |\n| Watch out for | Free-form answers parsed by downstream nodes |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  P[Prompt] --> ROLE[Role + task]\n  P --> RULES[Allowed outputs + rules]\n  P --> EX[2–4 examples]\n  P --> FORMAT[Exact output format]\n  P --> DATA[Input data in delimiters]\n```\n\n### Worked example\n\n```text\nYou route support emails.\nAllowed categories: billing, technical, account, other.\nRules:\n- Return JSON only: {\"category\": \"...\", \"urgency\": \"low|medium|high\", \"reason\": \"<10 words>\"}\n- urgency is high only if the customer cannot use the product or mentions legal action.\n- If unsure, use category \"other\".\n\n<email>\n{{ $json.text }}\n<\/email>\n```"}, {"id": 83, "title": "Structured output", "tldr": "Get machine-readable results by requesting JSON matching a schema, using provider structured-output features or forced tool calls where available, and validating results in code before acting on them.", "real": "OpenAI introduced Structured Outputs with strict JSON schema adherence in August 2024, and other providers support schema-shaped output through tool calling, which automation platforms expose as output parsers.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Schema-conforming AI responses |\n| Methods | Native structured output, forced tool calls, output parsers |\n| Validation | Schema + business rules in code |\n| Watch out for | Assuming valid JSON means correct values |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LLM[LLM] --> JSON[JSON output]\n  JSON --> SCHEMA{Schema valid?}\n  SCHEMA -->|no| RETRY[Retry with error]\n  SCHEMA -->|yes| RULES{Business rules OK?}\n  RULES -->|no| HUMAN[Human review]\n  RULES -->|yes| ACT[Write to system]\n```\n\n### Worked example\n\n```python\nfrom pydantic import BaseModel, Field, ValidationError\nfrom typing import Literal\n\nclass Ticket(BaseModel):\n    category: Literal[\"billing\", \"technical\", \"account\", \"other\"]\n    urgency: Literal[\"low\", \"medium\", \"high\"]\n    reason: str = Field(max_length=80)\n\nraw = '{\"category\": \"billing\", \"urgency\": \"high\", \"reason\": \"charged twice\"}'\ntry:\n    ticket = Ticket.model_validate_json(raw)\nexcept ValidationError as e:\n    print(\"Send to review:\", e)\n```"}, {"id": 84, "title": "Choosing models for automation", "tldr": "Pick models per step: small, fast, cheap models for classification and extraction at volume; larger models for complex reasoning, writing and agents. Evaluate on your own examples, track cost per run, and keep a fallback model.", "real": "Providers offer model tiers, such as Anthropic’s Haiku, Sonnet and Opus families, so automation builders can route simple tasks to cheaper models and reserve larger models for hard cases.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Matching models to automation tasks |\n| Criteria | Accuracy on your data, latency, cost, context length, data terms |\n| Strategy | Small model default, large model for hard cases |\n| Watch out for | Using the most expensive model for every simple step |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  TASK{Task complexity} -->|classify, extract| SMALL[Small fast model]\n  TASK -->|write, reason, multi-step| LARGE[Large model]\n  TASK -->|private data, offline| LOCAL[Local model via Ollama]\n  SMALL -->|low confidence| LARGE\n```\n\n### Worked example\n\n| Step | Model tier | Why |\n|---|---|---|\n| Spam vs not spam | Small | Simple, high volume |\n| Extract invoice fields | Small/medium | Structured task |\n| Draft personalized proposal | Large | Quality writing |\n| Agent researching a lead | Large | Multi-step reasoning with tools |"}, {"id": 85, "title": "Embeddings and semantic search", "tldr": "Embeddings turn text into vectors so automations can find similar items by meaning: matching tickets to knowledge articles, deduplicating leads, clustering feedback and powering RAG. Store them in a vector database or Postgres with pgvector.", "real": "The sentence-transformers library and provider embedding APIs are widely used to build semantic search, and n8n, Make and Zapier ecosystems all integrate with vector databases such as Pinecone, Qdrant and Supabase.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Numeric representations of meaning |\n| Uses | Search, deduplication, clustering, RAG, recommendations |\n| Storage | Vector DBs (Pinecone, Qdrant), pgvector, Supabase |\n| Watch out for | Mixing embeddings from different models |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TICKET[New ticket text] --> EMB[Embed]\n  EMB --> SEARCH[Similarity search]\n  KB[(Knowledge article embeddings)] --> SEARCH\n  SEARCH --> TOP[Top 3 relevant articles]\n  TOP --> REPLY[Suggest articles to agent]\n```\n\n### Worked example\n\n```python\nfrom sentence_transformers import SentenceTransformer\n\nmodel = SentenceTransformer(\"all-MiniLM-L6-v2\")\narticles = [\"How to reset your password\", \"Refund policy and timelines\", \"Changing your billing address\"]\narticle_vecs = model.encode(articles, normalize_embeddings=True)\n\nquery = model.encode([\"I forgot my login password\"], normalize_embeddings=True)[0]\nscores = article_vecs @ query\nprint(articles[int(scores.argmax())])   # How to reset your password\n```"}, {"id": 86, "title": "RAG for automations", "tldr": "Retrieval-augmented generation lets automations answer and act using your own documents: retrieve relevant chunks, give them to the model with instructions to cite and to say when information is missing. Keep the index updated by automation too.", "real": "Lewis et al. introduced retrieval-augmented generation in 2020, and it has become the standard approach for internal knowledge assistants and support bots built on automation platforms.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Grounding AI answers in retrieved documents |\n| Pipelines | Ingestion (sync, chunk, embed) + query (retrieve, answer) |\n| Must have | Citations, “not found” behavior, freshness |\n| Watch out for | Stale indexes after documents change |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  subgraph Sync\n    DOCS[Docs updated] --> CHUNK[Chunk + embed] --> INDEX[(Vector index)]\n  end\n  subgraph Answer\n    Q[Question] --> RET[Retrieve top chunks] --> LLM[Answer with citations]\n  end\n  INDEX --> RET\n```\n\n### Worked example\n\n```text\nAnswer the question using only the sources below. Cite sources like [S1].\nIf the sources don't contain the answer, reply exactly: \"I couldn't find this in our documentation.\"\n\n[S1] Refunds are processed within 7 business days of approval.\n[S2] Annual plans can be refunded within 30 days of purchase.\n\nQuestion: How long do refunds take?\n```"}, {"id": 87, "title": "Tool calling", "tldr": "Tool calling lets models request functions you define (look up an order, search a database, create a ticket). The automation executes the call, returns results and the model continues. It’s the mechanism behind every AI agent node.", "real": "OpenAI introduced function calling in June 2023 and Anthropic made tool use generally available in May 2024; workflow platforms wrap this capability in their agent nodes.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Model-requested function execution |\n| Parts | Tool name, description, input schema, execution, result |\n| Best practice | Few, task-level tools with precise descriptions |\n| Watch out for | Executing tool calls without validation or permission checks |\n\n### Diagram\n\n```mermaid\nsequenceDiagram\n  participant W as Workflow\n  participant M as Model\n  participant T as Tool: get_order\n  W->>M: Question + tool definitions\n  M-->>W: Call get_order(order_id=\"ORD-1042\")\n  W->>T: Execute\n  T-->>W: {status: shipped}\n  W->>M: Tool result\n  M-->>W: \"Your order has shipped.\"\n```\n\n### Worked example\n\n```json\n{\n  \"name\": \"get_order\",\n  \"description\": \"Look up an order by ID like ORD-1042. Returns status, items and estimated delivery date.\",\n  \"input_schema\": {\n    \"type\": \"object\",\n    \"properties\": {\"order_id\": {\"type\": \"string\", \"pattern\": \"^ORD-[0-9]+$\"}},\n    \"required\": [\"order_id\"]\n  }\n}\n```"}, {"id": 88, "title": "Token costs and budgets", "tldr": "LLM costs scale with input and output tokens per call × calls per run × runs per month. Reduce costs with smaller models, shorter prompts, trimming inputs, caching, batching and only calling AI when rules can’t decide.", "real": "Model providers price input and output tokens separately (output usually costs several times more) and offer discounts for cached prompt prefixes and batch processing.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Managing AI spend in automations |\n| Formula | Cost = input tokens × input price + output tokens × output price |\n| Levers | Model choice, prompt length, rules first, caching, batching |\n| Watch out for | Agents looping and multiplying calls |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  RUNS[Runs per month] --> COST[Monthly AI cost]\n  CALLS[AI calls per run] --> COST\n  TOKENS[Tokens per call] --> COST\n  PRICE[Model prices] --> COST\n```\n\n### Worked example\n\nIllustrative prices: $1 per million input tokens, $5 per million output tokens (small model).\n\n```text\nClassification: 800 input + 30 output tokens per email\nPer email = 800 × 1/1,000,000 + 30 × 5/1,000,000 = $0.0008 + $0.00015 = $0.00095\n20,000 emails/month ≈ $19\nSame task on a model 10× more expensive ≈ $190\n```"}, {"id": 89, "title": "Guardrails and validation", "tldr": "Protect automations from bad AI output with schema validation, allowed-value checks, confidence thresholds, content filters, length limits, PII redaction and human review for high-impact actions. Guardrails belong in deterministic steps, not only in prompts.", "real": "OWASP’s Top 10 for LLM Applications (2025 edition) lists improper output handling and excessive agency among top risks, both directly relevant to AI steps that trigger actions.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Checks around AI steps |\n| Types | Schema, allowed values, business rules, safety filters, approvals |\n| Placement | Before and after AI steps; before actions |\n| Watch out for | “The prompt says not to” as the only safeguard |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  AI[AI output] --> V1[Schema check]\n  V1 --> V2[Business rules: amount ≤ limit]\n  V2 --> V3[Content check: no PII leak]\n  V3 --> RISK{High impact?}\n  RISK -->|yes| APPROVE[Human approval]\n  RISK -->|no| ACT[Act]\n  APPROVE --> ACT\n```\n\n### Worked example\n\n| AI decision | Guardrail |\n|---|---|\n| Refund amount suggested | Must be ≤ order total and ≤ ₹5,000 auto-limit |\n| Category label | Must be in allowed list, else “other” |\n| Customer reply draft | Saved as draft; human sends |\n| Extracted email | Regex validation before CRM insert |"}, {"id": 90, "title": "Evaluating AI steps", "tldr": "Measure AI step quality with a labeled test set: accuracy for classification, field-level match for extraction, rubric or LLM-judge scores for writing. Re-run evaluations whenever you change prompts, models or inputs.", "real": "Evaluation features now exist across the automation stack, from n8n Evaluations to LLM observability tools such as LangSmith and Langfuse, reflecting that untested AI steps regress silently.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Quantifying AI step reliability |\n| Metrics | Accuracy, precision/recall, field match, rubric scores |\n| Dataset | 50–200 real examples including edge cases |\n| Watch out for | Judging quality from a few manual tests |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SAMPLES[Real samples] --> LABEL[Label expected outputs]\n  LABEL --> RUN[Run AI step]\n  RUN --> SCORE[Score]\n  SCORE --> THRESH{Meets threshold?}\n  THRESH -->|yes| DEPLOY[Deploy]\n  THRESH -->|no| IMPROVE[Improve prompt / model]\n```\n\n### Worked example\n\n| Metric | Value |\n|---|---|\n| Test emails | 120 |\n| Correct category | 113 |\n| Accuracy | 113 / 120 = 94.2% |\n| Most common error | “account” mislabeled as “billing” (5 cases) |\n| Fix | Add two examples distinguishing cancellation from billing disputes |"}, {"id": 91, "title": "Workflows vs agents in practice", "tldr": "Use workflows when steps are known and predictable; use agents when the path depends on what the AI discovers. Most production systems are hybrids: deterministic workflows that call an agent for one flexible step, with guardrails around it.", "real": "Anthropic’s December 2024 guidance distinguished workflows (predefined code paths) from agents (models directing their own process), recommending the simplest approach that works.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Deciding how much autonomy to give AI |\n| Workflow | Predictable, cheap, testable |\n| Agent | Flexible, more expensive, harder to test |\n| Hybrid | Workflow shell + agent step + approvals |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TRIG[Trigger: new lead] --> ENRICH[Fixed: enrich via API]\n  ENRICH --> AGENT[Agent step: research + write brief]\n  AGENT --> CHECK[Fixed: validate output]\n  CHECK --> CRM[Fixed: update CRM]\n```\n\n### Worked example\n\n| Process | Design |\n|---|---|\n| Invoice → accounting entry | Workflow with AI extraction |\n| Answer open-ended customer questions with tools | Agent inside workflow |\n| Competitive research report | Agent with search + crawl tools |"}, {"id": 92, "title": "Dify", "tldr": "Dify is an open-source platform for building LLM applications: chatbots, agents and AI workflows with a visual editor, built-in RAG knowledge bases, model management, APIs and observability. It’s strong for AI apps rather than broad SaaS integrations.", "real": "Dify, developed by LangGenius, became one of the most-starred open-source LLM application platforms on GitHub, offering both a cloud service and self-hosting via Docker Compose.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Open-source LLM app and agent builder |\n| Features | Chatflows, workflows, agents, knowledge bases (RAG), API publishing |\n| Hosting | Dify Cloud or self-hosted |\n| Watch out for | Fewer business app integrations than workflow platforms |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  USER[User question] --> CHATFLOW[Dify chatflow]\n  CHATFLOW --> KB[(Knowledge base retrieval)]\n  CHATFLOW --> LLM[LLM node]\n  CHATFLOW --> TOOL[Tool / HTTP node]\n  LLM --> ANSWER[Answer via web app or API]\n```\n\n### Worked example\n\n| Need | Dify feature |\n|---|---|\n| Internal HR policy chatbot | Knowledge base + chatflow |\n| AI app exposed to your product | Published API endpoint |\n| Combine with n8n for actions | Dify calls n8n webhook as a tool |"}, {"id": 93, "title": "Flowise", "tldr": "Flowise is an open-source, low-code builder for LLM flows and agents with a drag-and-drop canvas built around LangChain-style components, supporting RAG, agents, multi-agent flows and API deployment.", "real": "Workday acquired Flowise in August 2025 to bring its agent builder into the Workday platform, while stating its commitment to Flowise’s open-source foundation.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Visual LLM flow and agent builder |\n| Features | Chatflows, agentflows, RAG, tools, APIs, embeddable chat |\n| Hosting | Self-hosted or cloud |\n| Watch out for | Roadmap shifts after acquisition; check current licensing and features |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LOADER[Document loader] --> SPLIT[Text splitter]\n  SPLIT --> EMB[Embeddings]\n  EMB --> VS[(Vector store)]\n  VS --> CHAIN[Conversational retrieval chain]\n  CHAIN --> API[Chat API / widget]\n```\n\n### Worked example\n\n| Flowise vs n8n for a docs chatbot | |\n|---|---|\n| Flowise | Faster to prototype pure LLM/RAG chat |\n| n8n | Better when the bot must also act across many business apps |"}, {"id": 94, "title": "Langflow", "tldr": "Langflow is an open-source visual builder for AI agents and RAG pipelines with Python-based components you can customize, an API for every flow and MCP support. It suits teams wanting visual prototyping with code-level extensibility.", "real": "DataStax acquired Langflow in 2024, and IBM subsequently agreed to acquire DataStax in 2025, bringing Langflow into IBM’s AI portfolio.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Visual AI flow builder with Python components |\n| Features | Agents, RAG, custom components, API endpoints, MCP |\n| Strength | Easy to extend in Python |\n| Watch out for | Production hardening and hosting responsibilities |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INPUT[Chat input] --> AGENT[Agent component]\n  AGENT --> TOOLS[Tools: search, calculator, custom Python]\n  AGENT --> MODEL[Model component]\n  AGENT --> OUTPUT[Chat output / API]\n```\n\n### Worked example\n\n| Builder choice | Best fit |\n|---|---|\n| Dify | AI apps with built-in knowledge bases and app publishing |\n| Flowise | Quick LangChain-style chat/RAG flows |\n| Langflow | Visual + custom Python components |\n| n8n | AI plus broad business automation |"}, {"id": 95, "title": "OpenAI AgentKit and Agent Builder", "tldr": "OpenAI’s AgentKit includes Agent Builder, a visual canvas for multi-step agents, plus tools for embedding chat interfaces, connectors and evaluations. It’s tightly integrated with OpenAI models and services.", "real": "OpenAI launched AgentKit, including Agent Builder, at its DevDay in October 2025, prompting debate about competition with workflow tools; early users noted it focused on agents rather than broad app integration.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | OpenAI’s toolkit for building and deploying agents |\n| Components | Agent Builder (visual), ChatKit (embedded UI), connectors, evals |\n| Strength | Native OpenAI model and tool integration |\n| Watch out for | Vendor lock-in; fewer business integrations than iPaaS tools |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BUILDER[Agent Builder canvas] --> AGENT[Agent workflow]\n  AGENT --> TOOLS[File search, web search, connectors, MCP]\n  AGENT --> GUARD[Guardrails]\n  AGENT --> CHATKIT[ChatKit embedded in your app]\n  EVALS[Evals] -.-> AGENT\n```\n\n### Worked example\n\n| Scenario | Fit |\n|---|---|\n| Customer-facing assistant on OpenAI models | Good |\n| Multi-vendor model strategy | Consider n8n, LangGraph or model-agnostic tools |\n| Heavy SaaS integration actions | Combine with Zapier/n8n via MCP or webhooks |"}, {"id": 96, "title": "LangGraph", "tldr": "LangGraph is an open-source framework for building stateful agents as graphs of nodes and edges in Python or JavaScript, with persistence, human-in-the-loop interrupts and streaming. It’s for developers who need precise control over agent behavior.", "real": "LangGraph, from the LangChain team, is used to build production agents with checkpointing that lets workflows pause for human approval and resume later.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Code framework for stateful agent graphs |\n| Features | State, nodes, conditional edges, checkpoints, interrupts |\n| Strength | Fine-grained control and durability |\n| Watch out for | More engineering effort than visual builders |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  START[Start] --> CLASSIFY[Classify request]\n  CLASSIFY -->|refund| REFUND[Refund node]\n  CLASSIFY -->|question| ANSWER[Answer node]\n  REFUND --> APPROVE[Interrupt: human approval]\n  APPROVE --> DONE[End]\n  ANSWER --> DONE\n```\n\n### Worked example\n\n```python\nfrom typing import TypedDict\nfrom langgraph.graph import StateGraph, START, END\n\nclass State(TypedDict):\n    text: str\n    route: str\n\ndef classify(state: State) -> dict:\n    return {\"route\": \"refund\" if \"refund\" in state[\"text\"].lower() else \"question\"}\n\ngraph = StateGraph(State)\ngraph.add_node(\"classify\", classify)\ngraph.add_node(\"refund\", lambda s: {\"text\": \"Refund request queued for approval\"})\ngraph.add_node(\"question\", lambda s: {\"text\": \"Answering question\"})\ngraph.add_edge(START, \"classify\")\ngraph.add_conditional_edges(\"classify\", lambda s: s[\"route\"], {\"refund\": \"refund\", \"question\": \"question\"})\ngraph.add_edge(\"refund\", END)\ngraph.add_edge(\"question\", END)\n\napp = graph.compile()\nprint(app.invoke({\"text\": \"I want a refund\", \"route\": \"\"}))\n```"}, {"id": 97, "title": "CrewAI and multi-agent frameworks", "tldr": "CrewAI organizes agents as a crew with roles, goals and tasks that collaborate sequentially or hierarchically. Multi-agent setups suit research and content pipelines, but cost more tokens and need clear task boundaries.", "real": "CrewAI became a popular open-source Python framework for role-based multi-agent automation, and offers an enterprise platform for deploying crews.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Role-based multi-agent framework |\n| Concepts | Agents (role, goal, backstory), tasks, crew, process |\n| Best for | Research → write → review pipelines |\n| Watch out for | Many agents where one well-designed agent suffices |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  RESEARCHER[Researcher agent] --> WRITER[Writer agent]\n  WRITER --> EDITOR[Editor agent]\n  EDITOR --> OUTPUT[Final report]\n```\n\n### Worked example\n\n```python\nfrom crewai import Agent, Task, Crew, Process\n\nresearcher = Agent(role=\"Market researcher\", goal=\"Find facts about a company\", backstory=\"Careful analyst who cites sources\")\nwriter = Agent(role=\"Sales writer\", goal=\"Write a concise account brief\", backstory=\"B2B copywriter\")\n\nresearch = Task(description=\"Research {company}: products, size, recent news.\", expected_output=\"Bullet facts with sources\", agent=researcher)\nbrief = Task(description=\"Write a 5-bullet sales brief from the research.\", expected_output=\"5 bullets\", agent=writer)\n\ncrew = Crew(agents=[researcher, writer], tasks=[research, brief], process=Process.sequential)\nresult = crew.kickoff(inputs={\"company\": \"Acme Ltd\"})\n```"}, {"id": 98, "title": "Agent SDKs", "tldr": "Model providers offer agent SDKs that handle the tool-calling loop, context management, sub-agents and permissions in code: for example the Claude Agent SDK and the OpenAI Agents SDK. Use them when building agents into your own products.", "real": "Anthropic renamed its Claude Code SDK to the Claude Agent SDK in September 2025, offering the same agent harness that powers Claude Code for building general-purpose agents.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Libraries for building agents in code |\n| Examples | Claude Agent SDK, OpenAI Agents SDK, Google Agent Development Kit |\n| Provides | Agent loop, tools, MCP, sub-agents, permissions, sessions |\n| Watch out for | Granting file or shell tools without sandboxing |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  APP[Your app] --> SDK[Agent SDK]\n  SDK --> MODEL[Model]\n  SDK --> TOOLS[Custom tools + MCP servers]\n  SDK --> PERMS[Permission checks]\n  SDK --> CONTEXT[Context management]\n```\n\n### Worked example\n\n| Need | Choose |\n|---|---|\n| Visual business automation | n8n / Zapier / Make |\n| Agent inside your SaaS product | Agent SDK or LangGraph |\n| Quick internal chatbot | Dify / Flowise / n8n |"}, {"id": 99, "title": "The Model Context Protocol", "tldr": "MCP is an open protocol connecting AI applications to tools and data through servers exposing tools, resources and prompts. Automation platforms act as MCP clients (calling tools) and servers (exposing workflows), making integrations reusable across AI apps.", "real": "Anthropic released MCP in November 2024; it was adopted by OpenAI, Google, Microsoft, Zapier, Make and n8n, and in December 2025 was donated to the Linux Foundation’s Agentic AI Foundation.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Standard protocol for AI–tool connections |\n| Primitives | Tools, resources, prompts |\n| Transports | stdio (local), streamable HTTP (remote) |\n| Watch out for | Connecting untrusted MCP servers with sensitive data access |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  HOSTS[AI apps: Claude, ChatGPT, Cursor] --> CLIENT[MCP clients]\n  CLIENT --> S1[Zapier MCP]\n  CLIENT --> S2[n8n MCP Server Trigger]\n  CLIENT --> S3[Make MCP server]\n  CLIENT --> S4[Your custom MCP server]\n```\n\n### Worked example\n\n| Platform | MCP role |\n|---|---|\n| Zapier | Server: app actions as tools |\n| n8n | Client (MCP Client Tool) and server (MCP Server Trigger) |\n| Make | Server and client (AI Agents app) |\n| Activepieces | Server and client pieces |"}, {"id": 100, "title": "Building your own MCP server", "tldr": "Wrap internal APIs or automations in an MCP server so any AI assistant can use them. Define small, clearly described tools with typed inputs, enforce authentication and authorization in the server, and log every call.", "real": "The official MCP Python SDK includes FastMCP, which turns decorated Python functions into MCP tools with schemas generated from type hints.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Custom tool server for AI assistants |\n| Why it matters | Reusable access to your systems from any MCP client |\n| Practices | Narrow tools, typed inputs, auth, rate limits, logs |\n| Watch out for | Tools that expose more data than the user may see |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ASSISTANT[AI assistant] -->|MCP| SERVER[Your MCP server]\n  SERVER --> AUTH[Auth + permission check]\n  AUTH --> N8N[Trigger n8n webhook]\n  AUTH --> DB[(Read-only database)]\n  SERVER --> LOG[Audit log]\n```\n\n### Worked example\n\n```python\nimport httpx\nfrom mcp.server.fastmcp import FastMCP\n\nmcp = FastMCP(\"ops-tools\")\n\n@mcp.tool()\ndef create_support_ticket(title: str, priority: str, description: str) -> str:\n    \"\"\"Create a support ticket. priority must be one of: low, medium, high.\"\"\"\n    if priority not in {\"low\", \"medium\", \"high\"}:\n        return \"Error: priority must be low, medium or high\"\n    resp = httpx.post(\"https://n8n.example.com/webhook/create-ticket\",\n                      json={\"title\": title, \"priority\": priority, \"description\": description},\n                      headers={\"X-Api-Key\": \"load-from-secret-store\"}, timeout=15)\n    resp.raise_for_status()\n    return f\"Ticket created: {resp.json().get('ticket_id')}\"\n\nif __name__ == \"__main__\":\n    mcp.run()\n```"}, {"id": 101, "title": "Web data for AI automation", "tldr": "Many automations need web data: competitor prices, job listings, documentation for RAG, news monitoring, lead research. Web data tools fetch pages, render JavaScript, clean HTML into Markdown and extract structured fields for LLMs and databases.", "real": "Crawl4AI’s GitHub project describes its purpose as turning the web into clean, LLM-ready Markdown for RAG, agents and data pipelines, reflecting how central web data has become to AI systems.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Collecting web content for automation and AI |\n| Approaches | Official APIs, feeds/sitemaps, HTTP + parsing, headless browsers, crawling services |\n| Output | Markdown for LLMs, JSON for databases |\n| Watch out for | Scraping when an official API or data export exists |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SOURCE[Web source] --> API{Official API or feed?}\n  API -->|yes| USEAPI[Use API / RSS / sitemap]\n  API -->|no| FETCH[Fetch HTML or render with browser]\n  FETCH --> CLEAN[Clean to Markdown]\n  CLEAN --> EXTRACT[Extract fields: CSS or LLM]\n  EXTRACT --> STORE[(Database / vector store)]\n```\n\n### Worked example\n\n| Use case | Typical tool |\n|---|---|\n| Ingest a docs site into RAG | Crawl4AI or Firecrawl crawl → Markdown |\n| Monitor 50 product prices daily | CSS extraction + schedule |\n| Research a company for sales | Search + scrape + LLM summary |\n| Collect news headlines | RSS feeds first |"}, {"id": 102, "title": "Legal and ethical scraping", "tldr": "Scrape responsibly: check terms of service and robots.txt, prefer official APIs, avoid logged-in or personal data without a lawful basis, respect rate limits, don’t bypass access controls and comply with copyright and privacy laws. Get legal advice for commercial projects.", "real": "In hiQ Labs v. LinkedIn, US courts held that scraping publicly accessible data was unlikely to violate the federal anti-hacking law, but the case ended in 2022 with hiQ found to have breached LinkedIn’s user agreement, showing that contracts and other laws still matter.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Rules for responsible web data collection |\n| Check | Terms of service, robots.txt, copyright, privacy law (GDPR, DPDP) |\n| Practice | Rate limits, identify your bot, collect only needed data |\n| Watch out for | Scraping personal data or content behind logins |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  START[Plan to scrape a site] --> API{Official API or licensed data?}\n  API -->|yes| USE[Use it]\n  API -->|no| TOS{Terms allow automated access?}\n  TOS -->|no| STOP[Don't scrape / ask permission]\n  TOS -->|yes or unclear| ROBOTS{robots.txt allows path?}\n  ROBOTS -->|no| STOP\n  ROBOTS -->|yes| PII{Personal data involved?}\n  PII -->|yes| LEGAL[Legal review + lawful basis]\n  PII -->|no| POLITE[Scrape politely: rate limits, caching]\n```\n\n### Worked example\n\n```python\nfrom urllib.robotparser import RobotFileParser\n\nrp = RobotFileParser()\nrp.set_url(\"https://example.com/robots.txt\")\nrp.read()\nprint(rp.can_fetch(\"MyCompanyBot/1.0 (+https://mycompany.example/bot)\", \"https://example.com/products/\"))\n```\n\n(This summary is not legal advice; laws differ by country.)"}, {"id": 103, "title": "How web pages work for scrapers", "tldr": "Pages arrive as HTML from the server, often with JavaScript that loads more content later. Static pages can be fetched with HTTP clients; dynamic pages need a headless browser or the underlying API the page calls. Developer tools show which is which.", "real": "Many modern sites built with React, Vue or Next.js load data through background API requests, which scrapers can often call directly (where permitted) instead of rendering the whole page.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Static vs dynamic page rendering |\n| Static | HTML contains the data; HTTP client is enough |\n| Dynamic | JavaScript loads data; use browser or its API |\n| Watch out for | Scraping an empty HTML shell from a JavaScript app |\n\n### Diagram\n\n```mermaid\nsequenceDiagram\n  participant B as Browser\n  participant S as Server\n  partic

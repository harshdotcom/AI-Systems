<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Automation: 200 Chapters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2F5; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#171A21; --muted:#575D6B; --line:#D9DCE4;
  --accent:#EA4B71; --accent-soft:#FDE6EC; --accent-ink:#FFFFFF;
  --amber:#B97A0B; --tldr-bg:#FFF5DC; --tldr-line:#D49A22;
  --indigo:#24456E; --real-bg:#E4ECF7; --real-line:#4A72A8;
  --code-bg:#181A16; --code-ink:#E6E9E1; --inline-code:#E9ECE4;
  --cell-empty:#DCE0D6; --shadow:0 1px 0 rgba(24,26,22,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
    --accent:#F7A1B6; --accent-soft:#3A1622; --accent-ink:#2A0A14;
    --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
    --indigo:#A6C3EC; --real-bg:#131F33; --real-line:#5E86C2;
    --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
    --cell-empty:#2E332B; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
  --accent:#F7A1B6; --accent-soft:#3A1622; --accent-ink:#2A0A14;
  --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
  --indigo:#A6C3EC; --real-bg:#131F33; --real-line:#5E86C2;
  --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
  --cell-empty:#2E332B; --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header with the memory-bank progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:20px;padding:12px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted)}
.bank{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bank-row{display:flex;gap:4px;flex-wrap:nowrap;min-width:0}
.bank-group{flex:1;min-width:0;display:flex;gap:2px;padding:3px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.cell{flex:1;min-width:2px;max-width:10px;height:18px;border-radius:2px;background:var(--cell-empty);border:0;padding:0;cursor:pointer;transition:background .2s}
.cell.done{background:var(--accent)}
.cell.here{box-shadow:0 0 0 2px var(--amber)}
.bank-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bank-meta strong{color:var(--ink);font-weight:600}
.top-actions{display:flex;gap:8px}
.btn{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.menu-btn{display:none}

/* Shell */
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,76px));height:calc(100dvh - var(--top-h,76px) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg)}
.search{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
.part{margin-bottom:4px}
.part-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:8px;cursor:pointer}
.part-head:hover{background:var(--surface-2)}
.part-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);width:22px;flex:none}
.part-name{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.part-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.part-count.full{color:var(--accent);font-weight:600}
.part-list{list-style:none;margin:0 0 6px;padding:0 0 0 30px;display:none}
.part.open .part-list{display:block}
.ch-row{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:6px}
.ch-row.active{background:var(--accent-soft)}
.ch-row a{flex:1;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.ch-row a .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.tick{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:11px;height:11px;opacity:0}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{opacity:1;color:var(--accent-ink)}
.hidden{display:none!important}

/* Main reading area */
.main{padding:24px 32px 80px;min-width:0}
.crumb{font-size:14px;color:var(--muted);margin:0 0 12px}
.crumb a{color:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;font-size:14px;color:var(--muted);max-width:240px;text-align:left}
.tab .tab-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--cell-empty)}
.tab .dot.on{background:var(--accent)}
article{max-width:780px}
.ch-no{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--accent);font-size:15px;margin:0}
h1.ch-title{font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:6px 0 22px;font-weight:700;text-wrap:balance}
.box{border-radius:10px;padding:16px 18px;margin:0 0 26px;border-left:4px solid}
.box h2{font-size:14px;margin:0 0 6px;font-weight:600}
.box p{margin:0}
.tldr{background:var(--tldr-bg);border-color:var(--tldr-line)}
.tldr h2{color:var(--amber)}
.tldr p{font-size:17px;line-height:1.55}
.real{background:var(--real-bg);border-color:var(--real-line);margin-top:34px}
.real h2{color:var(--indigo)}
.body h3{font-size:20px;margin:30px 0 10px;letter-spacing:-.01em}
.body p{margin:0 0 14px}
.body ul,.body ol{padding-left:22px;margin:0 0 16px}
.body li{margin:4px 0}
.body li input[type=checkbox]{margin-right:6px;accent-color:var(--accent)}
.body code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.88em;background:var(--inline-code);padding:1px 5px;border-radius:4px}
.body pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13.5px;line-height:1.55;margin:0 0 18px}
.body pre code{background:none;padding:0;font-size:inherit;color:inherit}
.table-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.body table{border-collapse:collapse;width:100%;font-size:14px}
.body th,.body td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.body th{background:var(--surface-2);font-weight:600}
.body tr:last-child td{border-bottom:0}
.body strong{font-weight:600}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.complete{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:15px}
.complete .tick{border-color:currentColor;pointer-events:none}
.complete.on{background:var(--accent);color:var(--accent-ink)}
.complete.on .tick{background:var(--accent-ink);border-color:var(--accent-ink)}
.complete.on .tick svg{opacity:1;color:var(--accent)}
.nav{display:flex;gap:8px}
.nav .btn[disabled]{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}

/* Diagrams and charts */
.diagram{margin:0 0 20px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
.diagram svg{display:block;margin:0 auto;height:auto}
.diagram.loading{color:var(--muted);font-size:14px}
.chart{margin:0 0 20px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chart figcaption{font-weight:600;font-size:14px;margin:0 0 10px}
.bar-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.bar-label{color:var(--ink);line-height:1.3}
.bar-track{height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar{display:block;height:100%;background:var(--accent);border-radius:7px 0 0 7px}
.bar-val{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.chart-note{font-size:12px;color:var(--muted);margin-top:6px}

/* Contents view */
.contents h1{font-size:32px;margin:0 0 6px;letter-spacing:-.02em}
.contents .lead{color:var(--muted);margin:0 0 24px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.pcard h2{font-size:15px;margin:0 0 2px;line-height:1.3}
.pcard .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pcard ol{list-style:none;padding:0;margin:0}
.pcard li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13.5px;line-height:1.35}
.pcard li a{color:var(--ink);text-decoration:none;flex:1}
.pcard li a:hover{text-decoration:underline}
.contents-actions{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}

/* Mobile */
.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);height:auto;z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .menu-btn{display:inline-block}
  .main{padding:18px 16px 60px}
  .top-inner{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand{flex:1}
  .bank{order:3;flex-basis:100%}
  .bank-row{gap:3px}
  .bank-group{gap:1px;padding:2px}
  .cell{height:12px;max-width:none;min-width:0}
  .bank-row{flex-wrap:wrap;row-gap:3px;gap:3px}
  .bank-group{flex:0 0 calc(10% - 2.7px);gap:1px;padding:1px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header class="top" id="top">
  <div class="top-inner">
    <button class="btn menu-btn" id="menuBtn" aria-label="Open chapter list">Chapters</button>
    <div class="brand"><b>AI Automation</b><span>n8n, Zapier, Make, Crawl4AI, Firecrawl, agents and MCP, from basics to production</span></div>
    <div class="bank" aria-label="Course progress">
      <div class="bank-row" id="bank"></div>
      <div class="bank-meta"><span><strong id="doneCount">0</strong> of 200 chapters complete</span><span id="pct">0%</span></div>
    </div>
    <div class="top-actions"><a class="btn" href="#contents" style="text-decoration:none">Contents</a></div>
  </div>
</header>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <nav class="side" id="side" aria-label="Chapters">
    <input class="search" id="search" type="search" placeholder="Search chapters" aria-label="Search chapters">
    <div id="parts"></div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const CHAPTERS = [{"id": 1, "title": "What AI automation is", "tldr": "AI automation combines classic workflow automation (triggers, actions, data moving between apps) with AI steps that read, classify, extract, write and decide. It turns repetitive knowledge work into reliable pipelines that run without manual effort.", "real": "Accel’s announcement of n8n’s October 2025 Series C stated that more than 80% of workflows built on n8n embed AI agents, showing how quickly AI has become part of everyday automation.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Workflows that move data between systems with AI steps for judgment tasks |\n| Why it matters | Saves hours of repetitive work and scales operations without hiring linearly |\n| Building blocks | Triggers, actions, data mapping, conditions, AI steps, error handling |\n| Watch out for | Automating a broken process just makes mistakes faster |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TRIGGER[Trigger: new email] --> AI[AI step: classify + extract]\n  AI --> DECIDE{Rule or AI decision}\n  DECIDE -->|support| TICKET[Create ticket]\n  DECIDE -->|sales| CRM[Create CRM lead]\n  TICKET --> NOTIFY[Notify team in Slack]\n  CRM --> NOTIFY\n```\n\n### Worked example\n\n| Manual process | Automated version |\n|---|---|\n| Read each inbound email | Trigger on new email |\n| Decide if it’s sales, support or spam | LLM classifies into a fixed label |\n| Copy details into CRM | AI extracts name, company, need as JSON → CRM node |\n| Tell the right person | Slack message with summary and link |"}, {"id": 2, "title": "The automation spectrum: rules, AI steps and agents", "tldr": "Automation ranges from fixed rules (if X then Y), to workflows with AI steps (AI handles one judgment inside a fixed flow), to agents (AI decides which steps and tools to use). Use the simplest level that reliably solves the problem.", "real": "Anthropic’s “Building effective agents” (December 2024) recommended starting with simple, predictable workflows and only adding autonomous agents when tasks can’t be decomposed into fixed steps.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Levels of autonomy in automation |\n| Why it matters | Higher autonomy = more flexibility but less predictability and higher cost |\n| Rule | Rules → AI steps → agents, only as needed |\n| Watch out for | Building an agent where a 5-node workflow is enough |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  RULES[Rules: deterministic, cheap] --> AISTEP[Workflow + AI steps: judgment inside fixed flow]\n  AISTEP --> AGENT[Agent: AI chooses tools + steps]\n  AGENT --> MULTI[Multi-agent: several agents collaborate]\n```\n\n### Worked example\n\n| Task | Best level |\n|---|---|\n| Copy new Stripe payments to a sheet | Rules |\n| Tag support emails by topic | Workflow + AI step |\n| Research a lead across the web and draft a brief | Agent |\n| Weekly market report from many sources | Multi-step workflow with AI steps (or an agent) |"}, {"id": 3, "title": "Choosing what to automate", "tldr": "Good candidates are frequent, repetitive, rule-based or pattern-based, digital, and costly when done manually. Score candidates by time saved, error reduction, risk and feasibility before building.", "real": "Process mining vendors such as Celonis (which owns Make) built businesses on finding automation opportunities in event logs, because teams often guess wrong about where time is actually spent.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Prioritizing processes for automation |\n| Why it matters | Effort should go where returns are highest |\n| Good signs | High volume, clear inputs/outputs, digital data, stable process |\n| Watch out for | Rare, high-stakes, constantly changing processes |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  IDEA[Candidate process] --> FREQ{Happens weekly or more?}\n  FREQ -->|no| LOW[Low priority]\n  FREQ -->|yes| DIGITAL{Data already digital?}\n  DIGITAL -->|no| DIGITIZE[Digitize first: forms, OCR]\n  DIGITAL -->|yes| RISK{Mistakes costly?}\n  RISK -->|yes| HITL[Automate with human approval]\n  RISK -->|no| AUTO[Automate fully]\n```\n\n### Worked example\n\n```text\nInvoice entry: 400 invoices/month × 4 min each = 1,600 min ≈ 26.7 hours/month\nAutomated: 400 × 0.5 min review = 200 min ≈ 3.3 hours/month\nTime saved ≈ 23.4 hours/month; at ₹600/hour ≈ ₹14,000/month\n```"}, {"id": 4, "title": "Anatomy of an automation", "tldr": "Every automation has a trigger (what starts it), inputs (data received), steps (actions, transformations, AI calls), logic (conditions, loops, branches), outputs (records, messages) and error handling. Designing these explicitly prevents fragile workflows.", "real": "n8n, Zapier, Make and Power Automate all share this structure under different names: workflows, Zaps, scenarios and flows; nodes, steps, modules and actions.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structural parts of any workflow |\n| Why it matters | Shared vocabulary across all tools |\n| Parts | Trigger, data, actions, logic, outputs, errors |\n| Watch out for | No plan for what happens when a step fails |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  T[Trigger] --> I[Input data]\n  I --> S1[Transform]\n  S1 --> L{Logic}\n  L -->|branch A| A1[Action A]\n  L -->|branch B| B1[Action B]\n  A1 --> O[Output]\n  B1 --> O\n  S1 -.on error.-> E[Error handler]\n```\n\n### Worked example\n\n| Concept | n8n | Zapier | Make |\n|---|---|---|---|\n| Workflow | Workflow | Zap | Scenario |\n| Step | Node | Step | Module |\n| Branching | IF / Switch | Paths | Router |\n| Unit of data | Item | Record / field | Bundle |"}, {"id": 5, "title": "APIs, webhooks and JSON", "tldr": "Automations talk to apps through APIs (you request data), webhooks (apps push events to you) and JSON (the common data format). Understanding HTTP methods, status codes and JSON structure lets you connect to anything, even apps without native integrations.", "real": "Every major automation platform provides a generic HTTP request step (n8n HTTP Request node, Zapier Webhooks, Make HTTP module) precisely so users can call APIs that lack prebuilt integrations.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How software systems exchange data |\n| Why it matters | Unlocks integrations beyond prebuilt connectors |\n| Key concepts | GET/POST/PUT/PATCH/DELETE, status codes, headers, JSON |\n| Watch out for | Ignoring pagination and error codes |\n\n### Diagram\n\n```mermaid\nsequenceDiagram\n  participant W as Your workflow\n  participant A as App API\n  W->>A: GET /customers?page=1 (Authorization header)\n  A-->>W: 200 OK + JSON list\n  A->>W: Webhook POST /order-created (event JSON)\n  W-->>A: 200 OK (acknowledge quickly)\n```\n\n### Worked example\n\n```json\n{\n  \"event\": \"order.created\",\n  \"order\": {\n    \"id\": \"ord_1042\",\n    \"total\": 2499,\n    \"currency\": \"INR\",\n    \"customer\": {\"name\": \"Asha Rao\", \"email\": \"asha@example.com\"},\n    \"items\": [{\"sku\": \"TEA-250\", \"qty\": 2}]\n  }\n}\n```\n\n| Path | Value |\n|---|---|\n| order.customer.email | asha@example.com |\n| order.items[0].qty | 2 |"}, {"id": 6, "title": "Authentication for automations", "tldr": "Apps verify your automation’s identity with API keys, OAuth 2.0 (user grants scoped access), basic auth or signed requests. Store credentials in the platform’s credential manager, use the narrowest scopes and rotate keys.", "real": "Automation platforms store credentials encrypted; n8n, for example, encrypts saved credentials with an instance encryption key, which is why self-hosters must back up N8N_ENCRYPTION_KEY.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Proving identity to APIs |\n| Why it matters | Credentials grant real access to business data |\n| Types | API key, OAuth 2.0, basic auth, JWT/signed requests |\n| Watch out for | Admin-level keys used for simple read tasks |\n\n### Diagram\n\n```mermaid\nsequenceDiagram\n  participant U as User\n  participant P as Automation platform\n  participant G as Google OAuth\n  U->>P: Connect Google account\n  P->>G: Redirect with requested scopes\n  U->>G: Approve access\n  G-->>P: Access + refresh tokens\n  P->>P: Store encrypted, refresh automatically\n```\n\n### Worked example\n\n| Need | Better scope |\n|---|---|\n| Read rows from one spreadsheet | Sheets read-only (or specific file access) instead of full Drive |\n| Send emails only | Gmail send scope, not full mailbox |\n| Post to one Slack channel | Bot token with chat:write, invited to that channel |"}, {"id": 7, "title": "Data mapping and transformation", "tldr": "Most automation work is mapping fields from one system to another and transforming them: renaming, formatting dates, splitting names, converting currencies, filtering items. Clean, consistent data makes every downstream step easier.", "real": "Built-in transformation tools exist in every platform (Zapier Formatter, Make functions, n8n expressions and Edit Fields node), reflecting how central transformation is to real automations.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Reshaping data between systems |\n| Why it matters | Mismatched formats break integrations |\n| Common tasks | Dates, names, numbers, arrays, text cleanup |\n| Watch out for | Time zones and locale-specific formats |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SRC[Source: full_name, signup_ts UTC] --> MAP[Map + transform]\n  MAP --> F1[first_name, last_name]\n  MAP --> F2[signup_date in IST]\n  MAP --> F3[email lowercased]\n  F1 --> DEST[Destination CRM]\n  F2 --> DEST\n  F3 --> DEST\n```\n\n### Worked example\n\n| Input | Transformation | Output |\n|---|---|---|\n| “ASHA.Rao@Example.com ” | trim + lowercase | asha.rao@example.com |\n| “2026-11-21T04:30:00Z” | convert to Asia/Kolkata | 2026-11-21 10:00 IST |\n| “₹2,499.00” | strip symbols → number | 2499 |\n| “Asha Rao” | split on first space | first: Asha, last: Rao |"}, {"id": 8, "title": "The AI automation tool landscape", "tldr": "Tools fall into categories: workflow platforms (n8n, Zapier, Make, Power Automate, Activepieces, Pipedream), AI agent builders (Dify, Flowise, Langflow, OpenAI Agent Builder), code frameworks (LangGraph, CrewAI, agent SDKs), web data tools (Crawl4AI, Firecrawl, Apify), browser automation (Playwright, Browser Use) and RPA (UiPath, Power Automate Desktop).", "real": "The market consolidated quickly: Workday acquired Flowise in August 2025 and agreed to acquire Pipedream in November 2025, and SAP invested in n8n in May 2026 at a reported $5.2 billion valuation.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Map of automation tool categories |\n| Why it matters | Choosing the right category saves months |\n| Key split | No-code workflows vs agent builders vs code frameworks vs web data |\n| Watch out for | One tool for everything |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  LAND[AI automation tools] --> WF[Workflow platforms: n8n, Zapier, Make, Power Automate, Activepieces, Pipedream]\n  LAND --> AB[Agent builders: Dify, Flowise, Langflow, OpenAI Agent Builder]\n  LAND --> CODE[Code frameworks: LangGraph, CrewAI, agent SDKs]\n  LAND --> WEB[Web data: Crawl4AI, Firecrawl, Apify, Jina Reader]\n  LAND --> BROWSER[Browser + computer use: Playwright, Browser Use, Stagehand]\n  LAND --> RPA[RPA: UiPath, Power Automate Desktop]\n  LAND --> PROTO[Protocols: MCP]\n```\n\n### Worked example\n\n| Need | Category |\n|---|---|\n| Connect SaaS apps quickly | Workflow platform |\n| Chatbot over company docs | Agent builder or n8n AI nodes |\n| Custom multi-agent product | Code framework |\n| Turn websites into LLM-ready data | Web data tools |\n| Automate a legacy desktop app | RPA |"}, {"id": 9, "title": "Choosing a platform", "tldr": "Choose by who builds (technical or not), integrations needed, data control (self-host or cloud), AI depth, volume and pricing model, governance needs and existing ecosystem. Many teams combine one main platform with code for edge cases.", "real": "n8n offers a free self-hosted Community Edition alongside paid cloud and enterprise plans, while Zapier and Make are cloud-only services; this difference often decides choices for teams with data-residency requirements.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Selecting the main automation platform |\n| Why it matters | Switching later is expensive |\n| Key criteria | Builder skills, integrations, hosting, AI features, pricing, governance |\n| Watch out for | Choosing on hype rather than a pilot workflow |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  START{Need self-hosting or full data control?} -->|yes| SELF[n8n or Activepieces self-hosted]\n  START -->|no| WHO{Who builds?}\n  WHO -->|non-technical teams| EASY[Zapier]\n  WHO -->|visual power users| MAKE[Make]\n  WHO -->|developers + AI-heavy| N8N[n8n Cloud]\n  WHO -->|Microsoft 365 organization| PA[Power Automate]\n```\n\n### Worked example\n\n| Criterion | n8n | Zapier | Make |\n|---|---|---|---|\n| Self-hosting | Yes | No | No |\n| Integrations | \\~1,000+ plus HTTP | \\~9,000 | \\~3,000 |\n| Custom code | JavaScript and Python | Code steps | Limited code |\n| AI agents | AI Agent node, RAG, MCP | Agents, MCP | AI Agents, MCP |\n| Pricing unit | Workflow executions | Tasks | Credits |\n\n(Counts approximate as of 2026; check current vendor pages.)"}, {"id": 10, "title": "Your first automation end to end", "tldr": "Build a small, useful automation first: a form submission that gets classified by AI, saved to a sheet and announced in Slack. You’ll touch triggers, mapping, an AI step, conditions and outputs.", "real": "Form-to-sheet-to-notification flows are among the most popular templates on every automation platform because they deliver immediate value and teach all the core concepts.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Beginner project covering all core concepts |\n| Why it matters | Hands-on learning beats reading |\n| Steps | Trigger → AI classify → condition → save → notify |\n| Watch out for | Testing only with perfect sample data |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  FORM[Contact form submitted] --> AI[AI: classify message as sales, support or other]\n  AI --> SHEET[Append row to sheet]\n  SHEET --> IF{Sales?}\n  IF -->|yes| SLACK[Post to #sales]\n  IF -->|no| SUPPORT[Post to #support]\n```\n\n### Worked example\n\nAI step prompt:\n\n```text\nClassify this website message into exactly one label: sales, support, other.\nReply with only the label in lowercase.\n\nMessage: {{message}}\n```\n\n| Test input | Expected label |\n|---|---|\n| “Do you offer a team plan for 20 people?” | sales |\n| “I can’t log into my account” | support |\n| “Great blog post!” | other |"}, {"id": 11, "title": "What n8n is", "tldr": "n8n is a visual workflow automation and AI orchestration platform with a node-based canvas, code when you need it, hundreds of integrations, built-in AI agent nodes and the option to self-host. It’s licensed under the fair-code Sustainable Use License.", "real": "n8n was founded in Berlin in 2019 by Jan Oberhauser, released version 2.0 in December 2025 focused on secure-by-default execution, and was valued at $5.2 billion after an SAP investment in May 2026.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Node-based workflow + AI agent platform |\n| Why it matters | Combines no-code speed with code flexibility and self-hosting |\n| Editions | Self-hosted Community (free), n8n Cloud, Enterprise |\n| Watch out for | Sustainable Use License limits reselling n8n as a hosted service |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TRIG[Trigger node] --> NODE1[App / core nodes]\n  NODE1 --> AIAGENT[AI Agent node]\n  AIAGENT --> MODEL[Chat model sub-node]\n  AIAGENT --> TOOLS[Tool sub-nodes]\n  AIAGENT --> MEM[Memory sub-node]\n  NODE1 --> CODE[Code node: JS / Python]\n  CODE --> OUT[Output nodes]\n```\n\n### Worked example\n\n| n8n strength | Example use |\n|---|---|\n| Self-hosting | Keep customer data on your own servers |\n| Code node | Custom parsing logic in JavaScript |\n| AI Agent node | Support assistant with tools and memory |\n| HTTP Request node | Call any REST API without a native integration |"}, {"id": 12, "title": "Installing n8n", "tldr": "Start with n8n Cloud for zero setup, or self-host with Docker (recommended) or npm. Persist the data volume, set a timezone, and for production use PostgreSQL, HTTPS and a fixed encryption key.", "real": "n8n’s documentation recommends Docker for self-hosting and provides the official image at docker.n8n.io/n8nio/n8n, with data stored in /home/node/.n8n inside the container.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Getting an n8n instance running |\n| Options | n8n Cloud, Docker, npm (`npx n8n`) |\n| Default port | 5678 |\n| Watch out for | Losing data by not mounting a persistent volume |\n\n### Diagram\n\n```mermaid\nflowchart TD\n  CHOICE{How to run n8n?} -->|no servers| CLOUD[n8n Cloud]\n  CHOICE -->|local learning| DOCKER[Docker on laptop]\n  CHOICE -->|production self-host| PROD[Docker Compose + PostgreSQL + HTTPS]\n  DOCKER --> UI[Open http://localhost:5678]\n```\n\n### Worked example\n\n```bash\ndocker volume create n8n_data\ndocker run -it --rm --name n8n -p 5678:5678 \\\n  -e GENERIC_TIMEZONE=\"Asia/Kolkata\" -e TZ=\"Asia/Kolkata\" \\\n  -v n8n_data:/home/node/.n8n \\\n  docker.n8n.io/n8nio/n8n\n# then open http://localhost:5678 and create the owner account\n```"}, {"id": 13, "title": "The n8n editor", "tldr": "The editor has a canvas of connected nodes, a node panel for configuration with input/output views, an executions list for debugging, and (from 2.0) separate Save and Publish actions so you can edit drafts without changing the live workflow.", "real": "n8n 2.0 separated saving from publishing: Save keeps edits as a draft and Publish pushes changes to production, so running workflows aren’t broken mid-edit.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Visual workflow builder |\n| Key areas | Canvas, node details (input/parameters/output), executions, credentials |\n| Testing | Execute a single node or the whole workflow with test data |\n| Watch out for | Forgetting to publish after testing draft changes |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EDIT[Edit draft] --> TEST[Execute with test data]\n  TEST --> INSPECT[Inspect input/output per node]\n  INSPECT --> SAVE[Save draft]\n  SAVE --> PUBLISH[Publish to production]\n  PUBLISH --> EXEC[Executions list: monitor runs]\n```\n\n### Worked example\n\n| Editor tip | Why |\n|---|---|\n| Pin data on a node | Re-run later nodes without calling the API again |\n| Rename nodes clearly (“Get open tickets”) | Readable expressions and debugging |\n| Use sticky notes | Document intent on the canvas |\n| Check the executions list | See exactly where a production run failed |"}, {"id": 14, "title": "Items: how data flows in n8n", "tldr": "Data moves between nodes as a list of items; each item has a json object (and optionally binary data). Most nodes run once per item, so understanding items explains loops, merges and unexpected duplicates.", "real": "n8n’s data structure documentation defines every item as an object with a json key (and optional binary key), and nodes process all incoming items automatically.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | n8n’s internal data model |\n| Why it matters | Explains how nodes iterate |\n| Structure | `[{ json: {...}, binary: {...} }, ...]` |\n| Watch out for | A node returning 50 items makes the next node run 50 times |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  GET[Get rows: 3 items] --> SEND[Send email: runs 3 times]\n  SEND --> OUT[3 output items]\n  AGG[Aggregate node] -.combine into 1 item.-> SEND\n```\n\n### Worked example\n\n```json\n[\n  {\"json\": {\"name\": \"Asha\", \"email\": \"asha@example.com\"}},\n  {\"json\": {\"name\": \"Ravi\", \"email\": \"ravi@example.com\"}},\n  {\"json\": {\"name\": \"Meera\", \"email\": \"meera@example.com\"}}\n]\n```\n\nThree items flow into a Gmail node, which sends three emails, one per item."}, {"id": 15, "title": "Expressions", "tldr": "Expressions in double curly braces insert dynamic values into node parameters using JavaScript: current item fields, data from earlier nodes, dates and calculations. They’re the glue of n8n workflows.", "real": "n8n expressions support JavaScript plus built-in helpers such as `$json`, `$('Node Name')`, `$now` and `$today` (Luxon date objects), documented in n8n’s expressions reference.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Inline JavaScript for dynamic parameters |\n| Syntax | `{{ ... }}` inside a parameter |\n| Key variables | `$json`, `$('Node').item.json`, `$now`, `$today`, `$execution.id` |\n| Watch out for | Referencing a node that didn’t run in this branch |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  WEBHOOK[Webhook: body.name, body.email] --> SET[Edit Fields]\n  SET --> SLACK[Slack message uses expressions]\n  SLACK --> TEXT[New lead: name + email + date]\n```\n\n### Worked example\n\n| Goal | Expression |\n|---|---|\n| Field from current item | `{{ $json.email }}` |\n| Field from a named node | `{{ $('Webhook').item.json.body.name }}` |\n| Lowercase | `{{ $json.email.toLowerCase() }}` |\n| Today’s date | `{{ $today.toFormat('yyyy-MM-dd') }}` |\n| Price with 18% GST | `{{ ($json.price * 1.18).toFixed(2) }}` |\n| Fallback value | `{{ $json.company ?? 'Unknown' }}` |"}, {"id": 16, "title": "Triggers", "tldr": "Every workflow starts with a trigger: Manual Trigger for testing, Schedule Trigger for timed runs, Webhook for incoming HTTP calls, app triggers (new email, new row) that poll or subscribe, Chat Trigger for AI chat, and Execute Workflow Trigger for sub-workflows.", "real": "n8n 2.0 removed the legacy Start node; manual runs now use the Manual Trigger node, according to n8n’s 2.0 breaking changes documentation.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Nodes that start workflow executions |\n| Types | Manual, Schedule, Webhook, app triggers, Chat, Form, Execute Workflow, Error |\n| Polling vs push | Polling checks periodically; webhooks receive events instantly |\n| Watch out for | Using test webhook URLs in production |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  TRIGGERS[Triggers] --> MAN[Manual: testing]\n  TRIGGERS --> SCHED[Schedule: every day 9:00]\n  TRIGGERS --> HOOK[Webhook: HTTP POST]\n  TRIGGERS --> APP[App trigger: new Gmail message]\n  TRIGGERS --> CHAT[Chat Trigger: AI chat]\n  TRIGGERS --> FORM[Form Trigger: hosted form]\n  TRIGGERS --> ERR[Error Trigger: workflow failures]\n```\n\n### Worked example\n\n| Requirement | Trigger |\n|---|---|\n| Daily sales summary at 8 a.m. | Schedule Trigger (cron `0 8 * * *`) |\n| Website form submits leads | Webhook or Form Trigger |\n| React to new rows in Google Sheets | Google Sheets Trigger |\n| Internal chatbot | Chat Trigger + AI Agent |"}, {"id": 17, "title": "Core nodes", "tldr": "A handful of core nodes power most workflows: HTTP Request, Edit Fields (Set), IF, Switch, Filter, Merge, Loop Over Items, Aggregate, Split Out, Wait, Remove Duplicates and Code. Master these before exploring app nodes.", "real": "n8n’s documentation groups these as core nodes that work with any data, while app nodes wrap specific services’ APIs.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | General-purpose building blocks |\n| Why it matters | Handle logic and transformation for any integration |\n| Most used | HTTP Request, Edit Fields, IF, Switch, Merge, Loop Over Items, Code |\n| Watch out for | Building complex logic with many IF nodes instead of a Switch |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  HTTP[HTTP Request: fetch orders] --> SPLIT[Split Out: one item per order]\n  SPLIT --> FILTER[Filter: total above 5000]\n  FILTER --> SWITCH{Switch: region}\n  SWITCH -->|north| N[North team]\n  SWITCH -->|south| S[South team]\n  N --> MERGE[Merge]\n  S --> MERGE\n  MERGE --> AGG[Aggregate: one summary item]\n```\n\n### Worked example\n\n| Node | Typical use |\n|---|---|\n| Edit Fields (Set) | Rename, add or remove fields |\n| IF / Switch | Branch on conditions |\n| Merge | Combine two branches (append, by key, etc.) |\n| Loop Over Items | Process items in batches (e.g. 10 at a time for rate limits) |\n| Wait | Pause for time or until a webhook resumes |\n| Remove Duplicates | Skip items already seen |"}, {"id": 18, "title": "Credentials", "tldr": "Credentials store authentication for services (API keys, OAuth connections) separately from workflows, encrypted at rest and shareable with permissions. Workflows reference credentials by ID, so exporting a workflow doesn’t export secrets.", "real": "n8n encrypts stored credentials using the instance’s encryption key, and its documentation warns that losing N8N_ENCRYPTION_KEY makes existing credentials unreadable after migrations.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Secure storage for service authentication |\n| Why it matters | Keeps secrets out of workflow logic |\n| Types | API key, OAuth2, header auth, basic auth, predefined app credentials |\n| Watch out for | Personal credentials used in shared production workflows |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CRED[(Encrypted credential store)] --> NODE1[Gmail node]\n  CRED --> NODE2[HTTP Request: header auth]\n  KEY[N8N_ENCRYPTION_KEY] --> CRED\n  EXPORT[Workflow export JSON] -.contains credential reference only.-> CRED\n```\n\n### Worked example\n\n| Credential practice | Reason |\n|---|---|\n| Service accounts for production | Workflows don’t break when an employee leaves |\n| One credential per environment (dev/prod) | Prevents test runs touching production data |\n| Narrow OAuth scopes | Limits damage if compromised |\n| Back up the encryption key securely | Needed to decrypt credentials on restore |"}, {"id": 19, "title": "The Code node", "tldr": "The Code node runs custom JavaScript (and Python) to transform items when built-in nodes aren’t enough. From n8n 2.0, Code node executions run in isolated task runners and environment variable access is blocked by default.", "real": "n8n 2.0 enabled task runners by default for all Code node executions and set N8N_BLOCK_ENV_ACCESS_IN_NODE to true, improving isolation and security.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Custom code step inside workflows |\n| Modes | Run once for all items, or once for each item |\n| Return format | Array of `{ json: {...} }` objects |\n| Watch out for | Business logic hidden in large code blocks nobody can maintain |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  IN[Input items] --> CODE[Code node in task runner]\n  CODE --> OUT[Returned items]\n  CODE -.isolated from.-> MAIN[Main n8n process]\n```\n\n### Worked example\n\n```javascript\n// Mode: Run Once for All Items\nconst items = $input.all();\n\nreturn items\n  .filter(item => item.json.email)\n  .map(item => {\n    const email = item.json.email.trim().toLowerCase();\n    return {\n      json: {\n        email,\n        domain: email.split('@')[1],\n        isFreeMail: ['gmail.com', 'yahoo.com', 'outlook.com'].includes(email.split('@')[1]),\n      },\n    };\n  });\n```"}, {"id": 20, "title": "Project: your first n8n workflow", "tldr": "Build a lead-capture workflow in n8n: a Form Trigger collects leads, Code normalizes the email, an IF node routes business vs personal emails, Google Sheets stores the lead and Slack notifies the team.", "real": "Lead capture and routing is one of the most common starter templates in n8n’s public template library, which contains thousands of community workflows.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| Goal | Capture, enrich and route leads |\n| Nodes | Form Trigger, Code, IF, Google Sheets, Slack |\n| Concepts | Triggers, items, expressions, branching, credentials |\n| Extension | Add AI qualification (Part 4) |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  FORM[Form Trigger: name, email, company, message] --> CODE[Code: normalize email + domain]\n  CODE --> IF{IF: isFreeMail?}\n  IF -->|false: business| SHEET1[Sheets: Leads tab]\n  IF -->|true: personal| SHEET2[Sheets: Personal tab]\n  SHEET1 --> SLACK[Slack: notify #sales]\n```\n\n### Worked example\n\n| Node | Key setting |\n|---|---|\n| Form Trigger | Fields: Name, Email (required), Company, Message |\n| Code | Script from chapter 19 |\n| IF | Condition: `{{ $json.isFreeMail }}` is false |\n| Google Sheets | Operation: Append Row; map columns from expressions |\n| Slack | Text: `New lead: {{ $('Form Trigger').item.json.Name }} ({{ $json.domain }})` |"}, {"id": 21, "title": "Error handling in n8n", "tldr": "Handle failures at three levels: node settings (Retry On Fail, Continue On Fail / error output), workflow-level error workflows triggered by the Error Trigger node, and alerting. Decide per step whether to retry, skip, branch or stop.", "real": "n8n lets each workflow specify an error workflow in its settings; when an execution fails, the error workflow receives details such as the workflow name, failed node and error message through the Error Trigger node.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Strategies for failures in workflows |\n| Node-level | Retry On Fail (tries, wait), On Error: stop / continue / error output |\n| Workflow-level | Error workflow with Error Trigger |\n| Watch out for | Silently continuing on errors and losing data |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  NODE[HTTP Request] -->|success| NEXT[Next step]\n  NODE -->|retry 3 times, then error output| HANDLE[Handle: log + fallback]\n  FAIL[Unhandled failure] --> ERRWF[Error workflow: Error Trigger]\n  ERRWF --> ALERT[Slack/email alert with execution link]\n```\n\n### Worked example\n\n| Step | Error strategy |\n|---|---|\n| Call flaky third-party API | Retry On Fail: 3 tries, 5 s wait |\n| Enrich lead (nice-to-have) | Continue (using error output) with empty enrichment |\n| Write invoice to accounting | Stop workflow + error workflow alert |\n| All workflows | Shared error workflow posting to #automation-alerts |"}, {"id": 22, "title": "Sub-workflows", "tldr": "Split large workflows into reusable sub-workflows called with the Execute Workflow node and started by the Execute Workflow Trigger. Sub-workflows improve readability, reuse and testing, and can also serve as tools for AI agents.", "real": "In n8n 2.0, a parent workflow receives the result of the child execution when calling a sub-workflow, a behavior change documented in the 2.0 breaking changes guide.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Workflows called by other workflows |\n| Why it matters | Reuse, modularity, smaller canvases |\n| Inputs | Defined fields on Execute Workflow Trigger |\n| Watch out for | Deep chains of sub-workflows that are hard to trace |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  P1[Parent: new lead] --> CALL1[Execute Workflow: Enrich company]\n  P2[Parent: new signup] --> CALL1\n  CALL1 --> CHILD[Child: Execute Workflow Trigger → lookup → AI summary]\n  CHILD --> RESULT[Result returned to parent]\n```\n\n### Worked example\n\n| Reusable sub-workflow | Callers |\n|---|---|\n| Enrich company by domain | Lead capture, signup, CRM sync |\n| Send formatted Slack alert | All error workflows |\n| Classify text with LLM | Support triage, feedback analysis |"}, {"id": 23, "title": "APIs in depth: pagination and rate limits", "tldr": "Real APIs paginate results and limit request rates. Use the HTTP Request node’s pagination options, batch with Loop Over Items, add Wait nodes and respect Retry-After headers to avoid 429 errors and missing data.", "real": "n8n’s HTTP Request node includes built-in pagination modes, such as following a next-page URL from the response or incrementing a page parameter, plus batching options for rate limits.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Handling multi-page responses and request limits |\n| Why it matters | Avoid partial data and blocked API keys |\n| Tools | HTTP pagination, Loop Over Items, Wait, batching settings |\n| Watch out for | Assuming page 1 contains all results |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REQ[Request page 1] --> RESP[Response + next cursor]\n  RESP --> MORE{Has next page?}\n  MORE -->|yes| WAIT[Respect rate limit]\n  WAIT --> REQ2[Request next page]\n  REQ2 --> RESP\n  MORE -->|no| DONE[All items collected]\n```\n\n### Worked example\n\n| HTTP Request pagination setting | Example value |\n|---|---|\n| Mode | Response contains next URL |\n| Next URL | `{{ $response.body.next }}` |\n| Complete when | `{{ !$response.body.next }}` |\n| Max requests | 50 (safety limit) |\n| Interval between requests | 500 ms |"}, {"id": 24, "title": "Binary data and files", "tldr": "Files (PDFs, images, CSVs, audio) travel as binary data alongside JSON in items. Nodes download, convert (Extract From File, Convert to File), upload and pass files to AI models. Manage memory and storage for large files.", "real": "n8n supports storing binary data on the filesystem or in S3-compatible storage instead of memory (configured with N8N_DEFAULT_BINARY_DATA_MODE), which is important for large files in production.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Handling files inside workflows |\n| Key nodes | HTTP Request (download), Extract From File, Convert to File, Read/Write Files |\n| Storage | Memory, filesystem, or S3 for large volumes |\n| Watch out for | Large files in memory crashing the instance |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EMAIL[Gmail trigger: attachment] --> EXTRACT[Extract From File: PDF text]\n  EXTRACT --> AI[AI: extract invoice fields]\n  AI --> SHEET[Append to sheet]\n  EMAIL --> DRIVE[Upload original to Drive]\n```\n\n### Worked example\n\n| Task | Node |\n|---|---|\n| CSV attachment → rows | Extract From File (CSV) |\n| JSON rows → Excel file | Convert to File (XLSX) |\n| Download image from URL | HTTP Request with Response Format: File |\n| Send file to Slack | Slack node, binary property `data` |"}, {"id": 25, "title": "Webhooks in depth", "tldr": "The Webhook node exposes test and production URLs, supports HTTP methods, authentication (header, basic, JWT), response modes (immediately, when last node finishes, or via Respond to Webhook) and raw body access for signature verification.", "real": "n8n gives each Webhook node separate test and production URLs; the production URL only works when the workflow is published/active, a common source of beginner confusion.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | HTTP endpoints that start workflows |\n| Response modes | Immediately, when last node finishes, using Respond to Webhook node |\n| Security | Header/basic/JWT auth, signature verification, IP allow-lists |\n| Watch out for | Slow workflows causing the caller to time out and retry |\n\n### Diagram\n\n```mermaid\nsequenceDiagram\n  participant S as Stripe\n  participant W as n8n Webhook\n  participant Q as Rest of workflow\n  S->>W: POST event (signed)\n  W->>W: Verify signature\n  W-->>S: 200 OK immediately\n  W->>Q: Process event asynchronously\n```\n\n### Worked example\n\n```javascript\n// Code node: verify an HMAC-SHA256 signature on the raw body\n// (requires NODE_FUNCTION_ALLOW_BUILTIN=crypto and the Webhook \"Raw Body\" option)\nconst crypto = require('crypto');\nconst secret = 'replace-with-credential-or-env-approach';\nconst raw = (await this.helpers.getBinaryDataBuffer(0, 'data')).toString('utf8');\nconst expected = crypto.createHmac('sha256', secret).update(raw).digest('hex');\nconst received = $input.first().json.headers['x-signature'];\nif (!received || !crypto.timingSafeEqual(Buffer.from(expected), Buffer.from(received))) {\n  throw new Error('Invalid signature');\n}\nreturn [{ json: JSON.parse(raw) }];\n```\n\n(Header name and signing scheme vary by provider; follow their documentation.)"}, {"id": 26, "title": "Schedules, waits and long-running flows", "tldr": "Use Schedule Triggers for recurring jobs, Wait nodes for delays or human responses, and design long processes (days or weeks) as state machines with persisted state rather than workflows that sleep for days.", "real": "n8n’s Wait node can resume after a time interval, at a specific date, or when a webhook is called, enabling approval flows and drip sequences.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Time-based and paused execution |\n| Tools | Schedule Trigger (cron), Wait (time/date/webhook/form) |\n| Use cases | Reports, reminders, drip emails, approvals |\n| Watch out for | Thousands of executions waiting for weeks consuming resources |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SIGNUP[New signup] --> EMAIL1[Send welcome email]\n  EMAIL1 --> WAIT1[Wait 2 days]\n  WAIT1 --> CHECK{Activated?}\n  CHECK -->|no| EMAIL2[Send tips email]\n  CHECK -->|yes| END[Stop]\n```\n\n### Worked example\n\n| Schedule | Cron expression |\n|---|---|\n| Every day at 08:00 | `0 8 * * *` |\n| Weekdays at 09:30 | `30 9 * * 1-5` |\n| Every 15 minutes | `*/15 * * * *` |\n| First day of each month at 07:00 | `0 7 1 * *` |"}, {"id": 27, "title": "Storing state: data tables and databases", "tldr": "Workflows often need memory between runs: processed IDs, last sync time, counters, lookup tables. Use n8n’s built-in data tables for small datasets, or databases (Postgres, Supabase, Airtable, Redis) for larger or shared state.", "real": "n8n added built-in Data tables in 2025 so workflows could store and query structured data inside n8n without an external database for simple use cases.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Persisting data across executions |\n| Options | n8n data tables, Postgres/MySQL, Supabase, Airtable, Google Sheets, Redis |\n| Common uses | Deduplication, sync cursors, lookups, job tracking |\n| Watch out for | Google Sheets as a high-volume database |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  RUN[Scheduled run] --> READ[Read last_sync_at]\n  READ --> FETCH[Fetch records updated since last_sync_at]\n  FETCH --> PROCESS[Process]\n  PROCESS --> WRITE[Write new last_sync_at]\n```\n\n### Worked example\n\n| State need | Suggested store |\n|---|---|\n| IDs of emails already processed (hundreds/day) | n8n data table or Postgres |\n| Shared customer lookup table | Postgres / Supabase |\n| Rate-limit counters | Redis |\n| Small config managed by non-technical team | Google Sheets or Airtable |"}, {"id": 28, "title": "Environments and version control", "tldr": "Treat workflows like code: separate development and production, version workflow JSON in Git, review changes and promote deliberately. n8n’s enterprise source control connects instances to Git branches; smaller teams can export workflows via CLI or API.", "real": "n8n’s Enterprise plans include Git-based source control and environments, allowing teams to push workflows from a development instance and pull them into production.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Change management for workflows |\n| Why it matters | Prevents untested changes breaking production |\n| Options | Source control (enterprise), CLI export/import, API backups |\n| Watch out for | Editing production workflows directly |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DEV[Dev instance] -->|push| GIT[(Git repository)]\n  GIT --> REVIEW[Pull request review]\n  REVIEW -->|merge| MAIN[main branch]\n  MAIN -->|pull| PROD[Production instance]\n```\n\n### Worked example\n\n```bash\n# Back up all workflows and credentials (credentials stay encrypted)\nn8n export:workflow --all --output=backups/workflows/ --separate\nn8n export:credentials --all --output=backups/credentials/ --separate\n\n# Restore\nn8n import:workflow --separate --input=backups/workflows/\n```"}, {"id": 29, "title": "The n8n API and CLI", "tldr": "n8n’s public REST API (authenticated with an API key) manages workflows, executions and credentials programmatically, and the CLI exports, imports and executes workflows. Use them for backups, CI/CD and monitoring.", "real": "n8n’s public API uses the X-N8N-API-KEY header and exposes endpoints such as /api/v1/workflows and /api/v1/executions on self-hosted and paid cloud plans.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Programmatic control of n8n |\n| Uses | Backups, deployments, monitoring failed executions, bulk changes |\n| Auth | API key in X-N8N-API-KEY header |\n| Watch out for | API keys with access to all workflows stored insecurely |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SCRIPT[Script / CI job] -->|X-N8N-API-KEY| API[n8n public API]\n  API --> WF[Workflows]\n  API --> EX[Executions]\n  API --> CR[Credentials metadata]\n```\n\n### Worked example\n\n```bash\ncurl -s \"https://n8n.example.com/api/v1/executions?status=error&limit=20\" \\\n  -H \"X-N8N-API-KEY: $N8N_API_KEY\" | jq '.data[] | {id, workflowId, startedAt}'\n```"}, {"id": 30, "title": "Templates and community nodes", "tldr": "Start faster with n8n’s template library and extend n8n with community nodes for services without official integrations. Review templates and community packages before using them in production: they run with your credentials.", "real": "n8n hosts thousands of workflow templates and a community nodes ecosystem installable from npm, with a verification program for community nodes available on n8n Cloud.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Reusable workflows and third-party nodes |\n| Why it matters | Faster building; broader integrations |\n| Sources | n8n template library, verified community nodes, npm packages |\n| Watch out for | Unvetted community nodes executing arbitrary code |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TEMPLATE[Template] --> IMPORT[Import into instance]\n  IMPORT --> REVIEW[Review nodes, credentials, prompts]\n  REVIEW --> ADAPT[Adapt to your data]\n  ADAPT --> TEST[Test with sample data]\n  TEST --> PUBLISH[Publish]\n```\n\n### Worked example\n\n| Before using a community node | Check |\n|---|---|\n| Maintainer and activity | Recent releases, open issues |\n| Verified status | Prefer verified nodes |\n| Code review | What it does with credentials and data |\n| Alternative | Could the HTTP Request node do the same? |"}, {"id": 31, "title": "AI nodes in n8n", "tldr": "n8n’s AI features are built on LangChain as cluster nodes: a root node (AI Agent, Basic LLM Chain, Question and Answer Chain, Summarization Chain, vector store) connected to sub-nodes (chat model, memory, tools, embeddings, output parser, document loader).", "real": "n8n documents its AI functionality as LangChain-based cluster nodes, and by 2026 offered an AI Workflow Builder that generates workflows from natural-language descriptions.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Modular AI building blocks inside workflows |\n| Root nodes | AI Agent, Basic LLM Chain, Q&A Chain, Summarization Chain, Information Extractor, Text Classifier |\n| Sub-nodes | Chat models, memory, tools, embeddings, vector stores, output parsers |\n| Watch out for | Using an agent where a single LLM chain suffices |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  ROOT[Root: AI Agent] --> MODEL[Chat Model: Anthropic / OpenAI / Gemini / Ollama]\n  ROOT --> MEMORY[Memory: Simple, Postgres, Redis]\n  ROOT --> TOOL1[Tool: HTTP Request]\n  ROOT --> TOOL2[Tool: Call n8n Workflow]\n  ROOT --> TOOL3[Tool: MCP Client]\n  ROOT --> PARSER[Structured Output Parser]\n```\n\n### Worked example\n\n| Task | Best n8n AI node |\n|---|---|\n| Classify ticket into categories | Text Classifier |\n| Pull fields from an email into JSON | Information Extractor |\n| Summarize a long document | Summarization Chain |\n| Answer questions using documents | Q&A Chain with vector store retriever |\n| Multi-step tasks with tools | AI Agent |"}, {"id": 32, "title": "LLM chains and model sub-nodes", "tldr": "The Basic LLM Chain sends a prompt (with expressions for dynamic data) to a chat model sub-node and returns the response. Choose models by task difficulty, speed and cost; set temperature low for deterministic tasks.", "real": "n8n provides chat model sub-nodes for major providers, including Anthropic, OpenAI, Google Gemini, Mistral and local models through Ollama, so the same workflow can switch models by swapping one sub-node.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Single prompt → model → response |\n| Why it matters | Simplest, cheapest, most predictable AI step |\n| Settings | Model, temperature, max tokens, system message |\n| Watch out for | Unclear output format causing parsing errors downstream |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ITEM[Item: email body] --> CHAIN[Basic LLM Chain: prompt with expressions]\n  CHAIN --> MODEL[Chat Model sub-node]\n  MODEL --> RESP[Response text]\n  RESP --> NEXT[Next node]\n```\n\n### Worked example\n\n```text\nSystem: You summarize customer emails for a support team.\n\nUser: Summarize in 2 sentences, then give sentiment (positive, neutral, negative).\nFormat:\nSummary: <text>\nSentiment: <label>\n\nEmail from {{ $json.from }}:\n{{ $json.text }}\n```"}, {"id": 33, "title": "The AI Agent node", "tldr": "The AI Agent node gives a model instructions, tools and memory, then lets it decide which tools to call in a loop until it can answer. Keep the tool set small, descriptions clear and set a maximum number of iterations.", "real": "n8n’s AI Agent node works as a tools agent, using the model’s native tool-calling to choose among connected tool sub-nodes such as HTTP requests, workflows and MCP tools.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | LLM-driven tool-using loop inside a workflow |\n| Configuration | System message, chat model, tools, memory, max iterations, output parser |\n| Best for | Tasks where steps depend on intermediate results |\n| Watch out for | Vague tool descriptions; too many tools; no iteration limit |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INPUT[User request] --> AGENT[AI Agent]\n  AGENT --> THINK{Need a tool?}\n  THINK -->|yes| TOOL[Call tool: e.g. get_order_status]\n  TOOL --> AGENT\n  THINK -->|no| ANSWER[Final answer]\n```\n\n### Worked example\n\n```text\nSystem message:\nYou are an order support assistant for Chai & Co.\n- Use get_order_status for any question about an order. Ask for the order number if missing.\n- Use search_policies for refund, shipping or return questions.\n- Never promise refunds; say a human will review refund requests.\n- Keep answers under 80 words.\n```\n\n| Tool sub-node | Description given to the agent |\n|---|---|\n| Call n8n Workflow: get_order_status | “Returns status, items and delivery date for an order number like ORD-1234.” |\n| Vector Store Tool: search_policies | “Searches the official refund, shipping and returns policy.” |"}, {"id": 34, "title": "Chat Trigger and memory", "tldr": "The Chat Trigger provides a chat interface (hosted or embeddable) that starts an agent workflow for each message. Memory sub-nodes keep conversation history per session; use persistent memory (Postgres, Redis) in production.", "real": "n8n’s Chat Trigger can be used in a hosted chat page or embedded on websites using n8n’s chat widget package, and memory sub-nodes keep context using a session ID.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Conversational interface + context retention |\n| Memory types | Simple Memory (in-instance), Postgres Chat Memory, Redis Chat Memory, others |\n| Key setting | Session ID and context window length (number of messages) |\n| Watch out for | In-memory history lost on restart; unbounded context growth |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  USER[User message] --> CHAT[Chat Trigger: sessionId]\n  CHAT --> AGENT[AI Agent]\n  MEM[(Postgres Chat Memory keyed by sessionId)] <--> AGENT\n  AGENT --> REPLY[Reply to chat]\n```\n\n### Worked example\n\n| Memory setting | Recommendation |\n|---|---|\n| Storage | Postgres Chat Memory for production |\n| Session key | `{{ $json.sessionId }}` from Chat Trigger |\n| Context window | Last 10–20 messages |\n| Retention | Delete chat history after a defined period for privacy |"}, {"id": 35, "title": "Tools for agents", "tldr": "Tools give agents abilities: HTTP Request Tool for APIs, Call n8n Workflow Tool for complex logic, Code Tool, vector store tools for knowledge, app nodes as tools and MCP Client Tool for external MCP servers. Design tools as narrow, well-described actions.", "real": "n8n allows many regular app nodes to be attached directly to agents as tools, with the model filling parameters marked for AI input using the $fromAI() function.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Actions agents can take |\n| Types | HTTP Request Tool, workflow tool, Code Tool, app-node tools, vector store tool, MCP Client Tool |\n| Parameter filling | `$fromAI('name', 'description', 'type')` for model-provided values |\n| Watch out for | Tools that can delete or send data without approval |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  AGENT[AI Agent] --> T1[Gmail tool: draft reply]\n  AGENT --> T2[Call Workflow tool: lookup customer]\n  AGENT --> T3[HTTP Request tool: weather API]\n  AGENT --> T4[MCP Client tool: external MCP server]\n  AGENT --> T5[Vector store tool: policy search]\n```\n\n### Worked example\n\n| Tool parameter | Value |\n|---|---|\n| Google Sheets tool: lookup column | `email` (fixed) |\n| Lookup value | `{{ $fromAI('customer_email', 'Email address of the customer', 'string') }}` |\n| Tool description | “Finds a customer row by email. Returns plan, signup date and account manager.” |"}, {"id": 36, "title": "Structured output", "tldr": "When downstream nodes need fields, force the AI to return JSON matching a schema using the Structured Output Parser (or the Information Extractor node), then validate before writing to systems.", "real": "n8n’s Structured Output Parser accepts a JSON example or JSON Schema and, combined with an auto-fixing output parser, can retry when the model returns malformed output.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Schema-constrained AI responses |\n| Why it matters | Reliable mapping into CRMs, sheets and databases |\n| Tools | Structured Output Parser, Auto-fixing Output Parser, Information Extractor |\n| Watch out for | Valid JSON with wrong values: still validate business rules |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TEXT[Unstructured email] --> EXTRACT[Information Extractor + schema]\n  EXTRACT --> JSON[JSON fields]\n  JSON --> VALIDATE{IF: required fields present?}\n  VALIDATE -->|yes| CRM[Create CRM deal]\n  VALIDATE -->|no| REVIEW[Human review queue]\n```\n\n### Worked example\n\n```json\n{\n  \"type\": \"object\",\n  \"properties\": {\n    \"company\": {\"type\": \"string\"},\n    \"contact_name\": {\"type\": \"string\"},\n    \"budget_inr\": {\"type\": [\"number\", \"null\"]},\n    \"timeline\": {\"type\": \"string\", \"enum\": [\"this_month\", \"this_quarter\", \"later\", \"unknown\"]},\n    \"intent\": {\"type\": \"string\", \"enum\": [\"purchase\", \"partnership\", \"support\", \"other\"]}\n  },\n  \"required\": [\"company\", \"intent\", \"timeline\"]\n}\n```"}, {"id": 37, "title": "RAG in n8n", "tldr": "Build retrieval-augmented generation with two workflows: an ingestion workflow (load documents, split, embed, insert into a vector store) and a query workflow (retrieve relevant chunks and answer with an agent or Q&A chain), keeping the knowledge base in sync.", "real": "n8n includes vector store nodes for Pinecone, Qdrant, Supabase, PGVector and an in-memory Simple Vector Store, along with document loaders, text splitters and embedding sub-nodes.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Answering from your documents |\n| Ingestion | Loader → splitter → embeddings → vector store insert |\n| Query | Retriever → model → cited answer |\n| Watch out for | Never updating the index when documents change |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  subgraph Ingestion\n    DRIVE[Google Drive: file updated] --> LOAD[Default Data Loader]\n    LOAD --> SPLIT[Recursive Character Text Splitter]\n    SPLIT --> EMB1[Embeddings]\n    EMB1 --> VS[(Vector store)]\n  end\n  subgraph Query\n    CHAT[Chat Trigger] --> AGENT[AI Agent]\n    AGENT --> TOOL[Vector Store Tool]\n    TOOL --> VS\n  end\n```\n\n### Worked example\n\n| Setting | Starting value |\n|---|---|\n| Chunk size | 1,000 characters |\n| Chunk overlap | 200 characters |\n| Top K retrieved | 4–6 |\n| Metadata | file name, URL, updated date |\n| Agent instruction | “Answer only from retrieved policy text; cite the file name; say you don’t know otherwise.” |"}, {"id": 38, "title": "MCP in n8n", "tldr": "n8n works with the Model Context Protocol in both directions: the MCP Client Tool (and MCP Client node) lets workflows and agents call external MCP servers, and the MCP Server Trigger exposes n8n workflows as tools to AI assistants such as Claude.", "real": "n8n added an MCP Server Trigger and MCP Client Tool in 2025, and by 2026 offered an instance-level MCP server that lets tools such as Claude Code or Cursor create and run n8n workflows.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Standard tool connectivity between AI apps and n8n |\n| Client side | MCP Client Tool for agents; MCP Client node for direct calls |\n| Server side | MCP Server Trigger exposes connected tools to MCP clients |\n| Watch out for | Exposing powerful workflows without authentication |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CLAUDE[Claude / Cursor / any MCP client] -->|MCP| SERVER[n8n MCP Server Trigger]\n  SERVER --> WF1[Tool: create_ticket workflow]\n  SERVER --> WF2[Tool: lookup_customer workflow]\n  AGENT[n8n AI Agent] --> CLIENT[MCP Client Tool]\n  CLIENT -->|MCP| EXT[External MCP server: e.g. Zapier, GitHub]\n```\n\n### Worked example\n\n| Direction | Example |\n|---|---|\n| n8n as MCP server | Claude Desktop calls “lookup_customer” implemented as an n8n workflow |\n| n8n as MCP client | n8n agent uses an external MCP server’s search and file tools |\n| Security | Require bearer/header auth on the MCP Server Trigger; expose only needed tools |"}, {"id": 39, "title": "Human in the loop", "tldr": "Add human approval before risky actions: send an approval request (Slack, email, form) and pause with “Send and Wait for Response” or a Wait node, then continue based on the decision. Approval steps make AI automation safe for real business actions.", "real": "Several n8n app nodes, including Slack and Gmail, support a “send and wait for response” operation that pauses the workflow until a human approves, declines or responds, and n8n added human review for AI agent tool calls in early 2026.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Human approval inside automated flows |\n| Why it matters | Prevents costly AI mistakes |\n| Patterns | Approve/decline buttons, edit-before-send forms, timeouts with escalation |\n| Watch out for | Approval requests without enough context to decide |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  AI[AI drafts refund decision] --> APPROVAL[Slack: send and wait for approval]\n  APPROVAL --> DECISION{Approved?}\n  DECISION -->|yes| EXECUTE[Process refund]\n  DECISION -->|no| REPLY[Send polite decline]\n  APPROVAL -->|no response in 24 h| ESCALATE[Escalate to manager]\n```\n\n### Worked example\n\nApproval message:\n\n```text\nRefund request from {{ $json.customer }} for order {{ $json.order_id }}\nAmount: ₹{{ $json.amount }}\nAI recommendation: {{ $json.recommendation }}\nReason: {{ $json.reason }}\n[Approve] [Decline]\n```"}, {"id": 40, "title": "Evaluating AI workflows in n8n", "tldr": "Test AI steps against a dataset of example inputs and expected outputs before and after changes. n8n’s Evaluations feature runs workflows over test cases and records metrics, so prompt or model changes don’t silently reduce quality.", "real": "n8n introduced Evaluations in 2025, using an evaluation trigger that reads test cases (for example from a data table or sheet) and evaluation nodes that record outputs and metrics per run.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Systematic testing of AI workflow quality |\n| Why it matters | Prompt/model changes can break behavior silently |\n| Metrics | Exact match, category accuracy, LLM-judged correctness, tool usage |\n| Watch out for | Testing only 3 happy-path examples |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DATASET[(Test cases: input + expected)] --> RUN[Run workflow per case]\n  RUN --> COMPARE[Compare output vs expected]\n  COMPARE --> METRICS[Accuracy, correctness scores]\n  METRICS --> DECIDE{Better than previous version?}\n  DECIDE -->|yes| PUBLISH[Publish]\n  DECIDE -->|no| ITERATE[Revise prompt/model]\n```\n\n### Worked example\n\n| Test input | Expected category | Version A | Version B |\n|---|---|---|---|\n| “Charged twice this month” | billing | billing | billing |\n| “App crashes on upload” | technical | technical | technical |\n| “Cancel my plan please” | account | billing | account |\n| Accuracy over 50 cases | | 86% | 94% |"}, {"id": 41, "title": "n8n architecture for production", "tldr": "A production n8n deployment has a main instance (editor, API, triggers), optional worker processes executing workflows in queue mode, optional webhook processors, PostgreSQL for data, Redis as the job queue, and a reverse proxy with HTTPS.", "real": "n8n’s queue mode documentation describes the main process adding executions to a Redis-backed queue that worker processes consume, allowing horizontal scaling of workflow execution.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Components of a scalable n8n setup |\n| Components | Main, workers, webhook processors, PostgreSQL, Redis, reverse proxy |\n| Default mode | Regular (single process); queue mode for scale |\n| Watch out for | SQLite and a single container for high-volume production |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  USERS[Users + webhooks] --> PROXY[Reverse proxy: HTTPS]\n  PROXY --> MAIN[n8n main: editor, API, triggers]\n  PROXY --> WH[Webhook processors]\n  MAIN --> REDIS[(Redis queue)]\n  WH --> REDIS\n  REDIS --> W1[Worker 1]\n  REDIS --> W2[Worker 2]\n  MAIN --> PG[(PostgreSQL)]\n  W1 --> PG\n  W2 --> PG\n```\n\n### Worked example\n\n| Scale | Setup |\n|---|---|\n| Personal / small team | Single container + PostgreSQL |\n| Hundreds of executions/hour | Queue mode with 2 workers |\n| Heavy webhook traffic | Add webhook processors behind load balancer |\n| Enterprise | Kubernetes, multiple workers, managed Postgres + Redis |"}, {"id": 42, "title": "Docker Compose deployment", "tldr": "A solid self-hosted setup uses Docker Compose with n8n and PostgreSQL, persistent volumes, a fixed encryption key, correct webhook URL and timezone, and a reverse proxy terminating TLS.", "real": "n8n provides official Docker Compose examples and documents environment variables such as DB_TYPE, WEBHOOK_URL and N8N_ENCRYPTION_KEY for self-hosted deployments.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Repeatable multi-container deployment |\n| Must set | N8N_ENCRYPTION_KEY, WEBHOOK_URL, database settings, timezone |\n| Storage | Volumes for n8n data and PostgreSQL |\n| Watch out for | Changing the encryption key after creating credentials |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  COMPOSE[docker-compose.yml] --> N8N[n8n container]\n  COMPOSE --> PG[postgres container]\n  N8N --> VOL1[(n8n_data volume)]\n  PG --> VOL2[(pg_data volume)]\n  PROXY[Caddy / Nginx TLS] --> N8N\n```\n\n### Worked example\n\n```yaml\nservices:\n  postgres:\n    image: postgres:16\n    restart: unless-stopped\n    environment:\n      POSTGRES_USER: n8n\n      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}\n      POSTGRES_DB: n8n\n    volumes:\n      - pg_data:/var/lib/postgresql/data\n\n  n8n:\n    image: docker.n8n.io/n8nio/n8n\n    restart: unless-stopped\n    ports:\n      - \"127.0.0.1:5678:5678\"\n    environment:\n      DB_TYPE: postgresdb\n      DB_POSTGRESDB_HOST: postgres\n      DB_POSTGRESDB_DATABASE: n8n\n      DB_POSTGRESDB_USER: n8n\n      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}\n      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}\n      N8N_HOST: n8n.example.com\n      N8N_PROTOCOL: https\n      WEBHOOK_URL: https://n8n.example.com/\n      GENERIC_TIMEZONE: Asia/Kolkata\n      TZ: Asia/Kolkata\n    volumes:\n      - n8n_data:/home/node/.n8n\n    depends_on:\n      - postgres\n\nvolumes:\n  pg_data:\n  n8n_data:\n```"}, {"id": 43, "title": "Queue mode and scaling", "tldr": "Queue mode separates triggering from execution: the main instance enqueues executions in Redis and worker processes run them in parallel. Scale by adding workers, tune concurrency, and keep all processes on the same version and encryption key.", "real": "n8n enables queue mode with EXECUTIONS_MODE=queue and Redis connection variables, and workers are started with the n8n worker command, with a per-worker concurrency setting.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Distributed execution with Redis + workers |\n| Key settings | EXECUTIONS_MODE=queue, QUEUE_BULL_REDIS_HOST, same N8N_ENCRYPTION_KEY everywhere |\n| Scaling | More workers; tune `--concurrency` |\n| Watch out for | Mismatched versions or encryption keys between main and workers |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TRIGGER[Triggers on main] --> QUEUE[(Redis queue)]\n  QUEUE --> W1[Worker: concurrency 10]\n  QUEUE --> W2[Worker: concurrency 10]\n  QUEUE --> W3[Worker: concurrency 10]\n```\n\n### Worked example\n\n```yaml\n  # add to the Compose file from chapter 42 (shared env on n8n and worker)\n  redis:\n    image: redis:7\n    restart: unless-stopped\n\n  n8n-worker:\n    image: docker.n8n.io/n8nio/n8n\n    command: worker --concurrency=10\n    restart: unless-stopped\n    environment:\n      EXECUTIONS_MODE: queue\n      QUEUE_BULL_REDIS_HOST: redis\n      DB_TYPE: postgresdb\n      DB_POSTGRESDB_HOST: postgres\n      DB_POSTGRESDB_DATABASE: n8n\n      DB_POSTGRESDB_USER: n8n\n      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}\n      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}\n    depends_on:\n      - redis\n      - postgres\n# also set EXECUTIONS_MODE=queue and QUEUE_BULL_REDIS_HOST=redis on the main n8n service\n```\n\n```text\nCapacity estimate: 3 workers × concurrency 10 = 30 executions in parallel\nIf an average execution takes 6 s → ≈ 30 / 6 = 5 executions per second ≈ 18,000 per hour (upper bound)\n```"}, {"id": 44, "title": "Configuration and environment variables", "tldr": "n8n is configured through environment variables: database, URLs, timezone, execution data pruning, security settings, binary data mode, task runners and metrics. Keep configuration in version-controlled files with secrets in a secret manager.", "real": "n8n’s environment variable reference lists settings such as EXECUTIONS_DATA_PRUNE and EXECUTIONS_DATA_MAX_AGE for automatic cleanup of old execution data, which otherwise grows the database.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Instance-level settings |\n| Key groups | Database, URLs, security, executions, binary data, metrics, runners |\n| Secrets | Encryption key, DB password, SMTP credentials |\n| Watch out for | Execution history filling the database |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  CONFIG[Environment variables] --> DB[Database: DB_TYPE, DB_POSTGRESDB_*]\n  CONFIG --> URLS[URLs: N8N_HOST, WEBHOOK_URL]\n  CONFIG --> EXEC[Executions: pruning, timeouts]\n  CONFIG --> SEC[Security: encryption key, env access]\n  CONFIG --> OBS[Observability: N8N_METRICS]\n```\n\n### Worked example\n\n| Variable | Example | Purpose |\n|---|---|---|\n| EXECUTIONS_DATA_PRUNE | true | Delete old execution data |\n| EXECUTIONS_DATA_MAX_AGE | 336 | Keep 14 days (hours) |\n| EXECUTIONS_TIMEOUT | 3600 | Stop executions after 1 hour (seconds) |\n| N8N_DEFAULT_BINARY_DATA_MODE | filesystem | Keep large files out of memory |\n| N8N_METRICS | true | Expose Prometheus metrics |\n| N8N_BLOCK_ENV_ACCESS_IN_NODE | true (2.0 default) | Prevent Code nodes reading env vars |"}, {"id": 45, "title": "Reverse proxy and HTTPS", "tldr": "Put n8n behind a reverse proxy (Caddy, Nginx, Traefik, a cloud load balancer) that terminates TLS, forwards websocket connections for the editor, and sets correct headers so webhook URLs are generated properly.", "real": "Webhook providers such as Stripe and GitHub require HTTPS endpoints, and n8n’s WEBHOOK_URL setting must match the public HTTPS address so generated webhook URLs are correct behind a proxy.", "body": "### Automation card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Public HTTPS entry point for n8n |\n| Why it matters | Security and working webhooks |\n| Options | Caddy (automatic TLS), Nginx + Certbot, Traefik, cloud load balancers |\n| Watch out for | Exposing port 5678 dire

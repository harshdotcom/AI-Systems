<!DOCTYPE html>
<html lang="en">
<head>

<title>Human Psychology: 100 Chapters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2F5; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#171A21; --muted:#575D6B; --line:#D9DCE4;
  --accent:#6D28D9; --accent-soft:#EDE7FB; --accent-ink:#FFFFFF;
  --amber:#B97A0B; --tldr-bg:#FFF5DC; --tldr-line:#D49A22;
  --indigo:#0F5E57; --real-bg:#E0F1EE; --real-line:#2F8A80;
  --code-bg:#181A16; --code-ink:#E6E9E1; --inline-code:#E9ECE4;
  --cell-empty:#DCE0D6; --shadow:0 1px 0 rgba(24,26,22,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
    --accent:#C4B5FD; --accent-soft:#251B3D; --accent-ink:#160D2B;
    --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
    --indigo:#8FD5CB; --real-bg:#0F2522; --real-line:#4FA79B;
    --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
    --cell-empty:#2E332B; --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121411; --surface:#191C17; --surface-2:#20241E; --ink:#E7EAE3; --muted:#A1A79A; --line:#2E332B;
  --accent:#C4B5FD; --accent-soft:#251B3D; --accent-ink:#160D2B;
  --amber:#E5AE4A; --tldr-bg:#2A2312; --tldr-line:#D99C2E;
  --indigo:#8FD5CB; --real-bg:#0F2522; --real-line:#4FA79B;
  --code-bg:#0C0E0B; --code-ink:#DDE2D6; --inline-code:#2A3027;
  --cell-empty:#2E332B; --shadow:none;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header with the memory-bank progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;gap:20px;padding:12px 20px;max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:13px;color:var(--muted)}
.bank{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bank-row{display:flex;gap:4px;flex-wrap:nowrap;min-width:0}
.bank-group{flex:1;min-width:0;display:flex;gap:2px;padding:3px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.cell{flex:1;min-width:2px;max-width:10px;height:18px;border-radius:2px;background:var(--cell-empty);border:0;padding:0;cursor:pointer;transition:background .2s}
.cell.done{background:var(--accent)}
.cell.here{box-shadow:0 0 0 2px var(--amber)}
.bank-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bank-meta strong{color:var(--ink);font-weight:600}
.top-actions{display:flex;gap:8px}
.btn{color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.menu-btn{display:none}

/* Shell */
.shell{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1440px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,76px));height:calc(100dvh - var(--top-h,76px) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--bg)}
.search{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
.part{margin-bottom:4px}
.part-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:8px;cursor:pointer}
.part-head:hover{background:var(--surface-2)}
.part-num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);width:22px;flex:none}
.part-name{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.part-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.part-count.full{color:var(--accent);font-weight:600}
.part-list{list-style:none;margin:0 0 6px;padding:0 0 0 30px;display:none}
.part.open .part-list{display:block}
.ch-row{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:6px}
.ch-row.active{background:var(--accent-soft)}
.ch-row a{flex:1;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.35}
.ch-row a .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.tick{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:11px;height:11px;opacity:0}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.on svg{opacity:1;color:var(--accent-ink)}
.hidden{display:none!important}

/* Main reading area */
.main{padding:24px 32px 80px;min-width:0}
.crumb{font-size:14px;color:var(--muted);margin:0 0 12px}
.crumb a{color:inherit}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;font-size:14px;color:var(--muted);max-width:240px;text-align:left}
.tab .tab-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--cell-empty)}
.tab .dot.on{background:var(--accent)}
article{max-width:780px}
.ch-no{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--accent);font-size:15px;margin:0}
h1.ch-title{font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-.02em;margin:6px 0 22px;font-weight:700;text-wrap:balance}
.box{border-radius:10px;padding:16px 18px;margin:0 0 26px;border-left:4px solid}
.box h2{font-size:14px;margin:0 0 6px;font-weight:600}
.box p{margin:0}
.tldr{background:var(--tldr-bg);border-color:var(--tldr-line)}
.tldr h2{color:var(--amber)}
.tldr p{font-size:17px;line-height:1.55}
.real{background:var(--real-bg);border-color:var(--real-line);margin-top:34px}
.real h2{color:var(--indigo)}
.body h3{font-size:20px;margin:30px 0 10px;letter-spacing:-.01em}
.body p{margin:0 0 14px}
.body ul,.body ol{padding-left:22px;margin:0 0 16px}
.body li{margin:4px 0}
.body li input[type=checkbox]{margin-right:6px;accent-color:var(--accent)}
.body code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.88em;background:var(--inline-code);padding:1px 5px;border-radius:4px}
.body pre{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:10px;overflow-x:auto;font-size:13.5px;line-height:1.55;margin:0 0 18px}
.body pre code{background:none;padding:0;font-size:inherit;color:inherit}
.table-wrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.body table{border-collapse:collapse;width:100%;font-size:14px}
.body th,.body td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.body th{background:var(--surface-2);font-weight:600}
.body tr:last-child td{border-bottom:0}
.body strong{font-weight:600}
.done-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.complete{display:flex;align-items:center;gap:10px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:15px}
.complete .tick{border-color:currentColor;pointer-events:none}
.complete.on{background:var(--accent);color:var(--accent-ink)}
.complete.on .tick{background:var(--accent-ink);border-color:var(--accent-ink)}
.complete.on .tick svg{opacity:1;color:var(--accent)}
.nav{display:flex;gap:8px}
.nav .btn[disabled]{opacity:.4;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.show{opacity:1}

/* Diagrams and charts */
.diagram{margin:0 0 20px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
.diagram svg{display:block;margin:0 auto;height:auto}
.diagram.loading{color:var(--muted);font-size:14px}
.chart{margin:0 0 20px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.chart figcaption{font-weight:600;font-size:14px;margin:0 0 10px}
.bar-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.bar-label{color:var(--ink);line-height:1.3}
.bar-track{height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar{display:block;height:100%;background:var(--accent);border-radius:7px 0 0 7px}
.bar-val{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.chart-note{font-size:12px;color:var(--muted);margin-top:6px}

/* Contents view */
.contents h1{font-size:32px;margin:0 0 6px;letter-spacing:-.02em}
.contents .lead{color:var(--muted);margin:0 0 24px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.pcard h2{font-size:15px;margin:0 0 2px;line-height:1.3}
.pcard .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.pcard ol{list-style:none;padding:0;margin:0}
.pcard li{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:13.5px;line-height:1.35}
.pcard li a{color:var(--ink);text-decoration:none;flex:1}
.pcard li a:hover{text-decoration:underline}
.contents-actions{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}

/* Mobile */
.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);height:auto;z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
  .menu-btn{display:inline-block}
  .main{padding:18px 16px 60px}
  .top-inner{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .brand{flex:1}
  .bank{order:3;flex-basis:100%}
  .bank-row{gap:3px}
  .bank-group{gap:1px;padding:2px}
  .cell{height:12px;max-width:none;min-width:0}
  .bank-row{flex-wrap:wrap;row-gap:3px;gap:3px}
  .bank-group{flex:0 0 calc(10% - 2.7px);gap:1px;padding:1px}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
const CHAPTERS = [{"id": 1, "title": "What psychology is", "tldr": "Psychology is the scientific study of mind and behavior: how people perceive, think, feel, learn, decide, develop and relate to others. It combines biology, cognition and social context, and tests ideas with evidence rather than intuition.", "real": "Wilhelm Wundt opened the first laboratory dedicated to experimental psychology in Leipzig in 1879, and William James published “The Principles of Psychology” in 1890, two milestones in psychology becoming a science.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Science of mind and behavior |\n| Levels | Biological, psychological (thoughts, emotions), social |\n| Why it matters | Explains everyday behavior and guides health, education, work and policy |\n| Common misconception | Psychology is just common sense; many intuitions fail when tested |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  BEHAVIOR[Behavior and experience] --> BIO[Biology: brain, genes, hormones]\n  BEHAVIOR --> PSY[Psychology: thoughts, emotions, learning]\n  BEHAVIOR --> SOC[Social: culture, relationships, situations]\n```\n\n### Worked example\n\nWhy might a student procrastinate before an exam?\n\n| Level | Possible explanation |\n|---|---|\n| Biological | Poor sleep reducing self-control and focus |\n| Psychological | Anxiety about failure; avoiding an unpleasant task feels relieving |\n| Social | Friends’ plans compete for time; unclear expectations from teachers |"}, {"id": 2, "title": "A short history of psychology", "tldr": "Psychology grew from philosophy and physiology into an experimental science, moving through structuralism, functionalism, psychoanalysis, behaviorism, humanistic psychology, the cognitive revolution and today’s integrated, biologically informed and cross-cultural approaches.", "real": "Behaviorism, launched by John B. Watson’s 1913 manifesto, dominated American psychology until the “cognitive revolution” of the 1950s–60s brought mental processes back into scientific study.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Evolution of psychological schools of thought |\n| Why it matters | Explains why modern psychology looks the way it does |\n| Trend | From single grand theories to evidence-based, multi-level explanations |\n| Common misconception | Freud represents modern psychology; most of his theories lack scientific support |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  STRUCT[1879: Structuralism, Wundt] --> FUNC[1890s: Functionalism, James]\n  FUNC --> PSYCHO[1900s: Psychoanalysis, Freud]\n  PSYCHO --> BEHAV[1913: Behaviorism, Watson]\n  BEHAV --> HUMAN[1950s: Humanistic, Rogers, Maslow]\n  HUMAN --> COG[1960s: Cognitive revolution]\n  COG --> MODERN[Today: neuroscience, evolutionary, cultural, open science]\n```\n\n### Worked example\n\n| School | Main question | Typical method |\n|---|---|---|\n| Behaviorism | How does the environment shape behavior? | Animal learning experiments |\n| Cognitive | How do people process information? | Reaction-time and memory tasks |\n| Humanistic | How do people reach their potential? | Case studies, self-reports |\n| Neuroscience | What brain processes underlie behavior? | Brain imaging, lesion studies |"}, {"id": 3, "title": "Major perspectives in psychology", "tldr": "Psychologists explain behavior from different perspectives: biological, cognitive, behavioral, psychodynamic, humanistic, evolutionary and sociocultural. Each highlights different causes; good explanations often combine several.", "real": "The biopsychosocial model, proposed by psychiatrist George Engel in 1977, became widely used in health psychology and medicine to integrate biological, psychological and social factors.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Lenses for explaining behavior |\n| Why it matters | Avoids one-dimensional explanations |\n| Integration | Biopsychosocial model |\n| Common misconception | One perspective is “right” and others are wrong |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  Q[Why do people overeat?] --> B[Biological: hunger hormones, genetics]\n  Q --> C[Cognitive: beliefs about food, attention to cues]\n  Q --> BE[Behavioral: habits, rewards]\n  Q --> E[Evolutionary: preference for calorie-dense food]\n  Q --> S[Sociocultural: portion norms, food environment]\n```\n\n### Worked example\n\n| Perspective | Explanation of fear of public speaking |\n|---|---|\n| Biological | Heightened stress response (racing heart, adrenaline) |\n| Cognitive | Belief that the audience is judging every mistake |\n| Behavioral | Avoidance reduces anxiety short term, maintaining fear |\n| Evolutionary | Social rejection was dangerous for ancestral humans |\n| Sociocultural | Cultural emphasis on performance and status |"}, {"id": 4, "title": "Research methods", "tldr": "Psychology uses descriptive methods (observation, surveys, case studies), correlational studies (relationships between variables) and experiments (manipulating variables with random assignment) to test causes. Only well-designed experiments support causal conclusions.", "real": "Randomized controlled trials, in which participants are randomly assigned to conditions, are the standard for testing psychological treatments such as cognitive behavioral therapy.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Ways of gathering evidence about behavior |\n| Why it matters | Determines what conclusions are justified |\n| Key rule | Correlation does not imply causation |\n| Common misconception | A single study proves a theory |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  QUESTION[Research question] --> HYP[Hypothesis]\n  HYP --> DESIGN{Design}\n  DESIGN --> DESC[Descriptive: what happens?]\n  DESIGN --> CORR[Correlational: what goes together?]\n  DESIGN --> EXP[Experimental: what causes what?]\n  EXP --> RANDOM[Random assignment + control group]\n```\n\n### Worked example\n\nClaim: “Students who eat breakfast get better grades.”\n\n| Design | Conclusion allowed |\n|---|---|\n| Survey finds breakfast eaters have higher grades | Association only: family routines or sleep could explain both |\n| Randomly assign students to breakfast vs no breakfast for a term | If grades differ, breakfast likely causes the difference |"}, {"id": 5, "title": "Statistics and effect sizes", "tldr": "Psychological findings are summarized with statistics. Look beyond “statistically significant” to effect size (how big?), confidence intervals (how precise?), sample size and whether results replicate.", "real": "Jacob Cohen proposed conventions for effect sizes in 1988 (d = 0.2 small, 0.5 medium, 0.8 large), and many journals now require reporting effect sizes and confidence intervals, not just p-values.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Tools for summarizing and testing data |\n| Why it matters | Separates meaningful effects from noise |\n| Key ideas | Mean, variability, correlation (r), effect size (d), p-value, confidence interval |\n| Common misconception | “Significant” means large or important |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DATA[Data] --> DESCRIBE[Describe: mean, SD]\n  DESCRIBE --> TEST[Test: p-value]\n  DESCRIBE --> SIZE[Effect size: how big]\n  SIZE --> CI[Confidence interval: how precise]\n  CI --> REPLICATE[Does it replicate?]\n```\n\n### Worked example\n\nTwo groups take a memory test (standard deviation 10 points in both):\n\n```text\nGroup A mean = 72, Group B mean = 67\nCohen's d = (72 − 67) / 10 = 0.5  → a medium effect\nCorrelation r = 0.30 → about 9% of variance shared (r² = 0.09)\n```"}, {"id": 6, "title": "The replication crisis and open science", "tldr": "Many published psychology findings failed to replicate when repeated, due to small samples, flexible analyses and publication bias. Open science practices, such as preregistration, larger samples and data sharing, are improving reliability.", "real": "The Open Science Collaboration’s 2015 project repeated 100 psychology studies and found significant results in about 36% of replications, with effect sizes on average about half the original size.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Widespread failure of findings to reproduce |\n| Causes | Small samples, p-hacking, publication bias, questionable research practices |\n| Reforms | Preregistration, registered reports, large multi-lab studies, open data |\n| Common misconception | Psychology is unscientific; the crisis shows science self-correcting |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SMALL[Small samples] --> FALSE[False positives]\n  FLEX[Flexible analyses] --> FALSE\n  PUB[Only positive results published] --> FALSE\n  FALSE --> FAIL[Replications fail]\n  FAIL --> REFORM[Preregistration, big samples, open data]\n```\n\n### Worked example\n\n| Finding | Replication status (as of recent large studies) |\n|---|---|\n| Ego depletion (willpower as a limited resource) | Large multi-lab replication found near-zero effect |\n| Power posing raising hormones | Hormonal effects not replicated |\n| Anchoring effect | Robustly replicated |\n| Stroop effect | Robustly replicated |"}, {"id": 7, "title": "Research ethics", "tldr": "Psychological research must protect participants: informed consent, minimal harm, confidentiality, the right to withdraw, debriefing after deception and review by ethics committees. Modern rules arose partly from past abuses.", "real": "The Belmont Report (1979), written after revelations about the Tuskegee syphilis study (1932–1972), set out respect for persons, beneficence and justice as principles that still guide human research ethics.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Principles protecting research participants |\n| Why it matters | Trust and human dignity |\n| Core requirements | Consent, minimal risk, confidentiality, withdrawal, debriefing, review boards |\n| Common misconception | Famous classic studies would be approved today; many would not |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PROPOSAL[Study proposal] --> IRB[Ethics review board]\n  IRB --> CONSENT[Informed consent]\n  CONSENT --> STUDY[Study with right to withdraw]\n  STUDY --> DEBRIEF[Debriefing]\n  STUDY --> DATA[Confidential data handling]\n```\n\n### Worked example\n\n| Study | Ethical concern |\n|---|---|\n| Milgram obedience (1963) | Severe stress; pressure not to withdraw |\n| Little Albert (1920) | Conditioning fear in an infant without later reversal |\n| Modern online survey | Consent screen, anonymous data, contact for questions |"}, {"id": 8, "title": "Nature and nurture", "tldr": "Behavior arises from genes and environment acting together. Twin and adoption studies estimate heritability, the share of variation in a trait within a population linked to genetic differences, but heritability doesn’t mean a trait is fixed or determined.", "real": "A 2015 meta-analysis by Polderman and colleagues, covering about 50 years of twin studies on over 14 million twin pairs, found the average heritability across human traits was about 49%.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Interplay of genetic and environmental influences |\n| Key tools | Twin studies, adoption studies, molecular genetics |\n| Why it matters | Avoids both genetic and environmental determinism |\n| Common misconception | “50% heritable” means 50% of your trait comes from genes |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  GENES[Genes] --> INTERACT[Gene–environment interaction]\n  ENV[Environment] --> INTERACT\n  INTERACT --> TRAIT[Traits and behavior]\n  TRAIT --> SELECT[People choose environments]\n  SELECT --> ENV\n```\n\n### Worked example\n\n| Statement | Correct? |\n|---|---|\n| Height is highly heritable, so nutrition doesn’t matter | No: average heights rose with better nutrition |\n| Heritability describes variation in a population | Yes |\n| A highly heritable trait can still change with environment | Yes |"}, {"id": 9, "title": "The brain at a glance", "tldr": "The brain contains about 86 billion neurons organized into regions specialized for functions such as vision, movement, memory, emotion and planning, but most behavior depends on networks of regions working together.", "real": "Suzana Herculano-Houzel’s 2009 research estimated the human brain contains about 86 billion neurons, revising the commonly quoted figure of 100 billion.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Organ generating thought, emotion and behavior |\n| Key idea | Specialized regions + connected networks |\n| Why it matters | Biological basis for every topic in psychology |\n| Common misconception | People use only 10% of their brains |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  BRAIN[Brain] --> FRONTAL[Frontal lobe: planning, self-control]\n  BRAIN --> PARIETAL[Parietal lobe: touch, spatial awareness]\n  BRAIN --> TEMPORAL[Temporal lobe: hearing, language, memory]\n  BRAIN --> OCCIPITAL[Occipital lobe: vision]\n  BRAIN --> LIMBIC[Limbic system: emotion, memory]\n  BRAIN --> STEM[Brainstem: breathing, heart rate]\n```\n\n### Worked example\n\n| Everyday activity | Main brain systems involved |\n|---|---|\n| Recognizing a friend’s face | Occipital and temporal regions |\n| Resisting a second dessert | Prefrontal cortex + reward circuits |\n| Remembering yesterday’s lunch | Hippocampus + cortex |\n| Startling at a loud noise | Brainstem + amygdala |"}, {"id": 10, "title": "Evolution and behavior", "tldr": "Evolutionary psychology asks how mental abilities and tendencies may have helped ancestors survive and reproduce, such as fear of snakes, preference for sweet foods and strong social bonds. Hypotheses must be tested carefully to avoid just-so stories.", "real": "Research by Öhman and Mineka (2001) found people learn fear associations to snakes and spiders more readily than to neutral objects, consistent with an evolved “preparedness” to fear ancestral threats.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Evolutionary explanations for psychological traits |\n| Why it matters | Explains universal tendencies and mismatches with modern life |\n| Key idea | Mismatch: traits adaptive then may be unhelpful now |\n| Common misconception | Evolved means unchangeable or morally justified |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ANCESTRAL[Ancestral environment] --> ADAPT[Adaptive tendency]\n  ADAPT --> MODERN[Modern environment]\n  MODERN --> MISMATCH[Mismatch: e.g. sugar preference + abundant sweets]\n```\n\n### Worked example\n\n| Tendency | Ancestral benefit | Modern mismatch |\n|---|---|---|\n| Craving sugar and fat | Scarce calories | Abundant processed food |\n| Sensitivity to social rejection | Group membership aided survival | Social media comparison stress |\n| Attention to threats | Avoid predators | Doom-scrolling negative news |"}, {"id": 11, "title": "Neurons and neurotransmitters", "tldr": "Neurons communicate with electrical signals inside the cell and chemical signals (neurotransmitters) across synapses. Different neurotransmitters, such as dopamine, serotonin, GABA and glutamate, influence mood, movement, learning and arousal.", "real": "Otto Loewi’s 1921 experiment with frog hearts demonstrated chemical neurotransmission, earning him a share of the 1936 Nobel Prize in Physiology or Medicine.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How nerve cells send messages |\n| Key parts | Dendrites, cell body, axon, synapse |\n| Why it matters | Basis of drugs, medications and brain function |\n| Common misconception | Depression is simply “low serotonin”; the causes are more complex |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DEND[Dendrites receive signals] --> BODY[Cell body integrates]\n  BODY --> AXON[Axon: electrical impulse]\n  AXON --> TERM[Terminal releases neurotransmitter]\n  TERM --> SYN[Synapse]\n  SYN --> NEXT[Next neuron's receptors]\n```\n\n### Worked example\n\n| Neurotransmitter | Main roles |\n|---|---|\n| Glutamate | Main excitatory signal; learning |\n| GABA | Main inhibitory signal; calming |\n| Dopamine | Motivation, reward learning, movement |\n| Serotonin | Mood, sleep, appetite regulation |\n| Acetylcholine | Muscle movement, attention, memory |"}, {"id": 12, "title": "Major brain structures", "tldr": "The brainstem keeps you alive, the cerebellum coordinates movement, the limbic system (including the amygdala and hippocampus) handles emotion and memory, and the cerebral cortex supports perception, language, planning and reasoning.", "real": "Patient H.M. (Henry Molaison), whose hippocampi were largely removed in 1953 to treat epilepsy, could no longer form new long-term declarative memories, revealing the hippocampus’s role in memory.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Key regions and their main functions |\n| Why it matters | Links behavior to biology |\n| Caution | Functions are distributed across networks |\n| Common misconception | Left-brained vs right-brained personalities |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  CORTEX[Cerebral cortex: thinking, perception] --> LIMBIC[Limbic system]\n  LIMBIC --> AMY[Amygdala: threat, emotion]\n  LIMBIC --> HIPPO[Hippocampus: new memories]\n  LIMBIC --> HYPO[Hypothalamus: hunger, hormones]\n  CORTEX --> CEREB[Cerebellum: coordination]\n  CEREB --> STEM[Brainstem: vital functions]\n```\n\n### Worked example\n\n| Situation | Structure most involved |\n|---|---|\n| Sudden fear of a snake-like shape | Amygdala |\n| Learning a new route | Hippocampus |\n| Feeling hungry | Hypothalamus |\n| Riding a bicycle smoothly | Cerebellum |"}, {"id": 13, "title": "Neuroplasticity", "tldr": "The brain changes with experience throughout life: synapses strengthen or weaken, new connections form, and regions can adapt after injury. Practice physically shapes the brain, although plasticity is greatest in childhood.", "real": "Eleanor Maguire’s 2000 study found London taxi drivers, who memorize the city’s complex street layout, had larger posterior hippocampi than control participants, with size related to years of experience.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | The brain’s capacity to change |\n| Why it matters | Learning, recovery from injury, habit change |\n| Principle | “Neurons that fire together wire together” (Hebbian learning) |\n| Common misconception | Brain training games broadly boost intelligence |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PRACTICE[Repeated practice] --> ACTIVATE[Same neural pathways activated]\n  ACTIVATE --> STRENGTHEN[Synapses strengthen]\n  STRENGTHEN --> EASIER[Skill becomes easier]\n  EASIER --> PRACTICE\n```\n\n### Worked example\n\n| Claim | Evidence |\n|---|---|\n| Learning a musical instrument changes brain structure | Supported by imaging studies |\n| Brain-training apps improve general intelligence | Weak: gains mostly on trained tasks (FTC fined Lumosity in 2016 over claims) |\n| Stroke patients can regain function with rehabilitation | Supported, especially with intensive practice |"}, {"id": 14, "title": "The nervous and endocrine systems", "tldr": "The nervous system sends fast electrical signals; the endocrine system sends slower chemical messages (hormones) through the blood. The sympathetic system triggers “fight or flight”; the parasympathetic system calms the body.", "real": "Walter Cannon described the “fight or flight” response in the early 20th century, and Hans Selye’s work from the 1930s onward described how prolonged stress affects the body.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Body-wide communication systems |\n| Why it matters | Explains stress, arousal and recovery |\n| Key systems | Sympathetic (activate), parasympathetic (rest), HPA axis (stress hormones) |\n| Common misconception | Stress responses are always harmful; short-term stress can help performance |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  THREAT[Perceived threat] --> HYPO[Hypothalamus]\n  HYPO --> SYMP[Sympathetic nerves: fast]\n  HYPO --> PIT[Pituitary]\n  PIT --> ADRENAL[Adrenal glands]\n  ADRENAL --> CORT[Cortisol: slower, sustained]\n  SYMP --> BODY[Heart rate up, breathing faster]\n```\n\n### Worked example\n\n| Before an interview | Body response | Calming technique |\n|---|---|---|\n| Racing heart, sweaty palms | Sympathetic activation | Slow breathing (longer exhale) activates parasympathetic response |\n| Hard to focus | High arousal | Reappraise: “my body is preparing me to perform” |"}, {"id": 15, "title": "Sleep", "tldr": "Sleep cycles through stages (light, deep and REM sleep) roughly every 90 minutes. Sleep supports memory consolidation, emotional regulation, attention and health. Adults generally need at least 7 hours per night.", "real": "The American Academy of Sleep Medicine and Sleep Research Society recommended in 2015 that adults sleep 7 or more hours per night regularly for optimal health.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Active, cyclical brain state essential for health |\n| Why it matters | Memory, mood, judgment, physical health |\n| Stages | N1, N2 (light), N3 (deep), REM (dreaming) |\n| Common misconception | You can fully “catch up” on chronic sleep loss at weekends |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  WAKE[Awake] --> N1[N1 light]\n  N1 --> N2[N2 light]\n  N2 --> N3[N3 deep sleep]\n  N3 --> N2B[N2]\n  N2B --> REM[REM: vivid dreams]\n  REM --> N1\n```\n\n### Worked example\n\nPlanning a sleep schedule with \\~90-minute cycles:\n\n```text\nWake-up time: 6:30 a.m.\n5 cycles × 90 min = 7.5 hours + ~15 min to fall asleep\n→ Go to bed around 10:45 p.m.\n```\n\n| Habit | Effect on sleep |\n|---|---|\n| Consistent wake time | Stabilizes circadian rhythm |\n| Caffeine after mid-afternoon | Delays sleep onset |\n| Bright screens late at night | Can delay sleepiness |"}, {"id": 16, "title": "Circadian rhythms", "tldr": "Circadian rhythms are roughly 24-hour cycles in alertness, body temperature and hormones, set mainly by light. Jet lag, shift work and late-night light disrupt them, affecting mood, performance and health.", "real": "Jeffrey Hall, Michael Rosbash and Michael Young received the 2017 Nobel Prize in Physiology or Medicine for discovering molecular mechanisms that control circadian rhythms.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Internal 24-hour biological clock |\n| Why it matters | Sleep timing, alertness, performance |\n| Main cue | Light, especially morning daylight |\n| Common misconception | Night owls are simply lazy; chronotype has biological components |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LIGHT[Morning light] --> SCN[Brain clock: suprachiasmatic nucleus]\n  SCN --> MELATONIN[Melatonin suppressed by day, rises at night]\n  SCN --> ALERT[Alertness and body temperature rhythms]\n  NIGHTLIGHT[Bright light late at night] -.delays.-> SCN\n```\n\n### Worked example\n\n| Situation | Practical adjustment |\n|---|---|\n| Flying east (jet lag) | Seek morning light at destination |\n| Shift work | Keep bedroom dark; consistent sleep blocks |\n| Teen sleepiness in early classes | Biological shift toward later sleep in adolescence |"}, {"id": 17, "title": "Hormones and behavior", "tldr": "Hormones such as cortisol, adrenaline, oxytocin, testosterone, estrogen and melatonin influence mood, stress, social behavior and energy. Effects depend on context and interact with psychology; popular claims are often oversimplified.", "real": "Early studies suggesting that intranasal oxytocin increased trust (2005) attracted wide attention, but later replication attempts and meta-analyses found the effects on human trust much less consistent than first reported.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Chemical messengers affecting behavior |\n| Why it matters | Stress, sleep, social bonding, development |\n| Key point | Hormones influence; they rarely determine behavior alone |\n| Common misconception | Oxytocin is simply the “love hormone” |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SITUATION[Situation] --> BRAIN[Brain appraisal]\n  BRAIN --> HORMONES[Hormone release]\n  HORMONES --> BODY[Body + mood changes]\n  BODY --> BEHAVIOR[Behavior]\n  BEHAVIOR --> SITUATION\n```\n\n### Worked example\n\n| Hormone | Typical role | Popular oversimplification |\n|---|---|---|\n| Cortisol | Mobilizes energy under stress | “Stress hormone = always bad” |\n| Oxytocin | Social bonding, childbirth, lactation | “Love hormone” |\n| Melatonin | Signals biological night | “Sleeping pill hormone” |"}, {"id": 18, "title": "Genetics and epigenetics", "tldr": "Most psychological traits are influenced by many genes, each with tiny effects, plus environment. Epigenetic mechanisms change how genes are expressed without changing DNA sequences, and can respond to experiences, though popular claims often exceed the evidence.", "real": "Genome-wide association studies of educational attainment and other traits have identified thousands of genetic variants each with very small effects, showing that complex traits are highly polygenic.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Genetic influences and gene regulation |\n| Why it matters | Explains individual differences and risk factors |\n| Key idea | Polygenic: many genes, small effects |\n| Common misconception | There is a single gene “for” intelligence or depression |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  MANY[Thousands of genetic variants] --> PREDISP[Small predispositions]\n  ENV[Environment and experiences] --> EXPRESSION[Gene expression via epigenetics]\n  PREDISP --> TRAIT[Trait]\n  EXPRESSION --> TRAIT\n```\n\n### Worked example\n\n| Claim | Assessment |\n|---|---|\n| “Scientists found the gene for anxiety” | Misleading: many genes contribute small effects |\n| Genetic risk + supportive environment can produce good outcomes | Consistent with evidence |\n| Trauma effects are inherited for generations via epigenetics | Shown in some animal studies; human evidence limited |"}, {"id": 19, "title": "Drugs and the brain", "tldr": "Psychoactive drugs alter brain chemistry: stimulants increase arousal, depressants slow activity, hallucinogens alter perception and opioids relieve pain. Many affect dopamine reward pathways; repeated use can lead to tolerance, dependence and addiction.", "real": "Caffeine, which blocks adenosine receptors that build sleep pressure, is the world’s most widely consumed psychoactive substance.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Substances changing brain function |\n| Why it matters | Health, behavior, addiction |\n| Key processes | Tolerance, withdrawal, reward learning |\n| Common misconception | Addiction is purely a lack of willpower |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  USE[Repeated use] --> REWARD[Dopamine reward signals]\n  REWARD --> LEARN[Strong cue–reward learning]\n  USE --> TOLERANCE[Tolerance: need more for same effect]\n  LEARN --> CRAVING[Cravings triggered by cues]\n  TOLERANCE --> CRAVING\n```\n\n### Worked example\n\nCaffeine timing (half-life roughly 5 hours, varying widely between people):\n\n```text\n200 mg coffee at 4 p.m.\n≈ 100 mg remains around 9 p.m.\n≈ 50 mg remains around 2 a.m.  → can still disrupt sleep for many people\n```"}, {"id": 20, "title": "Brain injury and what it teaches", "tldr": "Brain injuries and neurological conditions reveal how specific regions contribute to behavior, from personality changes after frontal lobe damage to language problems after damage to particular areas. Modern imaging complements these case studies.", "real": "In 1848, railway foreman Phineas Gage survived an iron rod passing through his frontal lobe; reports of changes in his personality and behavior influenced early ideas about the frontal lobe’s role in self-control.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Learning about brain function from damage |\n| Why it matters | Links regions to abilities |\n| Famous cases | Phineas Gage, H.M., Broca’s patient “Tan” |\n| Common misconception | Gage permanently became a different person; later evidence suggests partial recovery |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DAMAGE[Damage to region] --> CHANGE[Specific behavior change]\n  CHANGE --> INFER[Infer region's role]\n  INFER --> TEST[Confirm with imaging + other cases]\n```\n\n### Worked example\n\n| Damaged area | Typical effect |\n|---|---|\n| Broca’s area (left frontal) | Difficulty producing fluent speech |\n| Wernicke’s area (left temporal) | Difficulty understanding language |\n| Hippocampus | Difficulty forming new memories |\n| Prefrontal cortex | Problems with planning and self-control |"}, {"id": 21, "title": "Sensation vs perception", "tldr": "Sensation is detecting physical energy (light, sound, pressure) with sense organs; perception is the brain organizing and interpreting those signals into meaningful experience. What we perceive is a construction, not a direct copy of reality.", "real": "The 2015 viral “dress” photo, seen by some people as blue and black and by others as white and gold, showed how the brain’s assumptions about lighting can produce different perceptions of the same image.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Detecting signals vs interpreting them |\n| Why it matters | Explains illusions, disagreements and biases |\n| Key idea | Perception = sensory input + expectations + context |\n| Common misconception | We see the world exactly as it is |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  STIM[Physical stimulus] --> SENSE[Sense organ: transduction]\n  SENSE --> SIGNAL[Neural signals]\n  SIGNAL --> BRAIN[Brain processing]\n  EXPECT[Expectations + context] --> BRAIN\n  BRAIN --> PERCEPT[Perception]\n```\n\n### Worked example\n\n| Scenario | Sensation | Perception |\n|---|---|---|\n| Hearing a ringtone in a café | Sound waves of certain frequencies | “That’s my phone!” (sometimes wrongly) |\n| Reading messy handwriting | Ink shapes | Words, guided by context |"}, {"id": 22, "title": "Vision", "tldr": "The eye focuses light onto the retina, where rods (low light) and cones (color, detail) convert it to neural signals. The brain processes color, shape, motion and depth in parallel pathways, filling in gaps such as the blind spot.", "real": "David Hubel and Torsten Wiesel discovered neurons in the visual cortex that respond to specific edge orientations, work that earned them the 1981 Nobel Prize in Physiology or Medicine.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Turning light into visual experience |\n| Key parts | Cornea, lens, retina (rods, cones), optic nerve, visual cortex |\n| Why it matters | Vision dominates human perception |\n| Common misconception | The eye works like a camera recording a complete image |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LIGHT[Light] --> EYE[Cornea + lens]\n  EYE --> RETINA[Retina: rods + cones]\n  RETINA --> OPTIC[Optic nerve]\n  OPTIC --> THALAMUS[Thalamus]\n  THALAMUS --> V1[Visual cortex]\n  V1 --> WHAT[What pathway: objects]\n  V1 --> WHERE[Where/how pathway: location, motion]\n```\n\n### Worked example\n\n| Observation | Explanation |\n|---|---|\n| Colors fade at dusk | Cones need more light; rods dominate |\n| You don’t notice your blind spot | The brain fills in missing information |\n| Peripheral vision is blurry | Fewer cones outside the fovea |"}, {"id": 23, "title": "Hearing and the other senses", "tldr": "Hearing converts sound waves into neural signals in the cochlea; touch, temperature and pain come from skin receptors; taste and smell are chemical senses; balance and body position come from the vestibular system and proprioception.", "real": "Linda Buck and Richard Axel received the 2004 Nobel Prize in Physiology or Medicine for discovering the large family of odorant receptor genes underlying the sense of smell.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Non-visual sensory systems |\n| Why it matters | Safety, flavor, balance, social communication |\n| Key idea | Flavor = taste + smell |\n| Common misconception | Humans have only five senses |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  SENSES[Senses] --> HEAR[Hearing: cochlea]\n  SENSES --> TOUCH[Touch, temperature, pain: skin]\n  SENSES --> TASTE[Taste: tongue]\n  SENSES --> SMELL[Smell: nose]\n  SENSES --> BALANCE[Balance: inner ear]\n  SENSES --> PROPRIO[Body position: muscles, joints]\n```\n\n### Worked example\n\n| Experience | Senses involved |\n|---|---|\n| Food tastes bland with a cold | Smell blocked, reducing flavor |\n| Seasickness | Conflict between visual and vestibular signals |\n| Touching your nose with eyes closed | Proprioception |"}, {"id": 24, "title": "Gestalt principles of perception", "tldr": "The brain groups visual elements into wholes using principles such as proximity, similarity, continuity, closure and figure–ground. Designers use these principles to make interfaces and graphics easy to understand.", "real": "Gestalt psychologists including Max Wertheimer, Wolfgang Köhler and Kurt Koffka developed these principles in Germany in the early 20th century, summarized as “the whole is other than the sum of its parts”.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Rules for perceptual grouping |\n| Why it matters | Design, reading, recognizing objects |\n| Principles | Proximity, similarity, continuity, closure, figure–ground |\n| Common misconception | We perceive elements individually and then combine them consciously |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  GESTALT[Gestalt grouping] --> PROX[Proximity: close items belong together]\n  GESTALT --> SIM[Similarity: similar items group]\n  GESTALT --> CONT[Continuity: smooth lines continue]\n  GESTALT --> CLOS[Closure: we complete gaps]\n  GESTALT --> FIG[Figure–ground: object vs background]\n```\n\n### Worked example\n\n| Design situation | Principle applied |\n|---|---|\n| Form label placed next to its input box | Proximity |\n| All clickable buttons the same color | Similarity |\n| Logo with gaps still recognized as a shape | Closure |\n| Text on a busy photo is hard to read | Weak figure–ground contrast |"}, {"id": 25, "title": "Top-down processing and expectations", "tldr": "Perception combines bottom-up sensory data with top-down knowledge, expectations and context. Expectations speed recognition but can also make us see what we expect rather than what is there.", "real": "In a classic 1949 study, Bruner and Postman showed participants playing cards with mismatched colors (such as a red six of spades); people took longer to recognize them and often misperceived them as normal cards.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Knowledge and context shaping perception |\n| Why it matters | Explains fast reading, proofreading errors and biases |\n| Related | Perceptual set, priming, context effects |\n| Common misconception | Expectations only influence interpretation, not what we see |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BOTTOM[Bottom-up: sensory features] --> PERCEPT[Perception]\n  TOP[Top-down: knowledge, expectations, context] --> PERCEPT\n  PERCEPT --> ERROR[Fast but sometimes wrong]\n```\n\n### Worked example\n\n| Situation | Top-down effect |\n|---|---|\n| Missing your own typos | You read what you meant to write |\n| Hearing your name in a noisy room | Prioritized expectation |\n| Ambiguous “13”/“B” read differently among numbers vs letters | Context decides interpretation |"}, {"id": 26, "title": "Illusions", "tldr": "Illusions occur when the brain’s normally helpful assumptions about the world produce incorrect perceptions. They reveal how perception works, such as size constancy, depth cues and color constancy.", "real": "The Müller-Lyer illusion (1889), where lines with inward or outward arrowheads look different in length, has been studied across cultures, with evidence that visual experience influences its strength.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Systematic misperceptions |\n| Why it matters | Window into perceptual assumptions |\n| Types | Geometric, color, motion, ambiguous figures |\n| Common misconception | Illusions mean perception is broken; they reflect normally useful shortcuts |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INPUT[Ambiguous or unusual input] --> ASSUMPTION[Normal assumption: e.g. depth, lighting]\n  ASSUMPTION --> USUAL[Usually correct perception]\n  ASSUMPTION --> ILLUSION[Incorrect in this special case]\n```\n\n### Worked example\n\n| Illusion | Assumption that misfires |\n|---|---|\n| Moon looks larger near the horizon | Distance cues from landscape |\n| Ponzo (railway tracks) illusion | Converging lines signal depth |\n| Checker shadow illusion | Brain corrects for shadows (color constancy) |"}, {"id": 27, "title": "Attention", "tldr": "Attention selects a small portion of available information for deeper processing. It is limited: focusing on one thing reduces processing of others. Attention can be captured by salient stimuli or directed voluntarily by goals.", "real": "Colin Cherry’s 1953 “cocktail party” experiments showed people listening to one message in one ear noticed little of the other message, but could notice salient changes such as their own name.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Selecting information for processing |\n| Why it matters | Learning, safety, productivity |\n| Types | Selective, divided, sustained, executive |\n| Common misconception | Attention is unlimited if you try hard enough |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ALL[All incoming information] --> FILTER[Attention filter]\n  GOALS[Goals] --> FILTER\n  SALIENT[Salient stimuli: loud, moving, own name] --> FILTER\n  FILTER --> PROCESSED[Deeply processed]\n  FILTER --> IGNORED[Mostly ignored]\n```\n\n### Worked example\n\n| Situation | Attention principle |\n|---|---|\n| Notifications pulling you from work | Stimulus-driven capture |\n| Studying with a clear goal | Goal-directed attention |\n| Missing a friend waving in a crowd | Limited capacity |"}, {"id": 28, "title": "Inattentional and change blindness", "tldr": "When attention is focused, people often fail to notice unexpected objects (inattentional blindness) or changes in a scene (change blindness), even obvious ones. Looking is not the same as seeing.", "real": "In Simons and Chabris’s 1999 study, roughly half of participants counting basketball passes failed to notice a person in a gorilla suit walking through the scene.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Failure to notice unexpected things |\n| Why it matters | Driving, eyewitness testimony, safety monitoring |\n| Key insight | People overestimate what they notice |\n| Common misconception | “I would definitely have seen that” |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TASK[Focused task] --> ATTN[Attention narrowed]\n  ATTN --> MISS[Unexpected event not processed]\n  MISS --> CONFIDENT[Person confident nothing happened]\n```\n\n### Worked example\n\n| Real-world case | Implication |\n|---|---|\n| Driver talking on phone misses cyclist | Hands-free calls still divide attention |\n| Radiologists miss unexpected anomaly | Checklists for systematic search |\n| Witness misses key detail | Eyewitness reports need caution |"}, {"id": 29, "title": "Multitasking", "tldr": "Humans rarely perform two demanding tasks truly simultaneously; they switch attention, paying time and accuracy costs with each switch. Heavy media multitaskers are not better at filtering distractions.", "real": "Rubinstein, Meyer and Evans (2001) measured “switch costs” in task-switching experiments, and Ophir, Nass and Wagner (2009) found heavy media multitaskers performed worse on tests of filtering irrelevant information.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Switching between tasks |\n| Why it matters | Productivity, errors, safety |\n| Key cost | Time and errors at each switch |\n| Common misconception | Multitasking makes you more productive |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TASKA[Task A] -->|switch cost| TASKB[Task B]\n  TASKB -->|switch cost| TASKA\n  TASKA --> SLOWER[Slower + more errors overall]\n```\n\n### Worked example\n\nBatching vs constant switching for 2 hours of report writing:\n\n| Approach | Typical result |\n|---|---|\n| Checking messages every 5 minutes | Frequent re-orientation; shallow work |\n| 50-minute focus blocks + message check between blocks | Fewer switches; deeper concentration |"}, {"id": 30, "title": "Applying perception and attention", "tldr": "Knowing perception and attention limits helps design better environments: reduce distractions, make important information salient, use checklists for critical tasks, and don’t rely on people noticing unexpected events.", "real": "Checklists introduced in aviation and later in surgery, such as the World Health Organization’s Surgical Safety Checklist (2008), reduce errors partly by compensating for attention and memory limits.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Practical use of perception and attention science |\n| Why it matters | Safety, learning, design |\n| Tools | Checklists, salience, removing distractions, chunking information |\n| Common misconception | Errors are mainly due to carelessness |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LIMITS[Attention limits] --> DESIGN[Design environment]\n  DESIGN --> SALIENT[Make key info salient]\n  DESIGN --> REDUCE[Reduce distractions]\n  DESIGN --> CHECK[Checklists for critical steps]\n```\n\n### Worked example\n\n| Setting | Application |\n|---|---|\n| Studying | Phone in another room during study blocks |\n| Workplace safety | Bright labels on hazards; pre-task checklists |\n| App design | One clear primary button per screen |"}, {"id": 31, "title": "Classical conditioning", "tldr": "In classical conditioning, a neutral stimulus repeatedly paired with a meaningful one comes to trigger a similar response. It explains learned emotional reactions, food aversions and some fears and phobias.", "real": "Ivan Pavlov observed in the early 1900s that dogs began salivating to stimuli associated with food, and in 1920 Watson and Rayner’s ethically troubling “Little Albert” study conditioned fear of a white rat in an infant.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Learning by association between stimuli |\n| Key terms | Unconditioned stimulus/response, conditioned stimulus/response, extinction |\n| Why it matters | Emotional reactions, phobias, advertising |\n| Common misconception | Conditioning only applies to animals |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BEFORE[Food: unconditioned stimulus] --> SALIVA[Salivation]\n  PAIR[Bell + food repeatedly] --> LEARN[Association formed]\n  LEARN --> AFTER[Bell alone: conditioned stimulus]\n  AFTER --> SALIVA2[Salivation: conditioned response]\n```\n\n### Worked example\n\n| Everyday example | Conditioned stimulus | Response |\n|---|---|---|\n| Food poisoning after a dish | Smell of that dish | Nausea |\n| Dentist visits | Sound of a drill | Anxiety |\n| Advertising | Brand logo paired with happy music | Positive feelings |"}, {"id": 32, "title": "Operant conditioning", "tldr": "In operant conditioning, behavior is shaped by consequences: reinforcement increases behavior, punishment decreases it. Positive means adding something; negative means removing something.", "real": "B. F. Skinner studied operant learning in the 1930s–1950s using controlled chambers, and his principles underpin applied behavior analysis and many app engagement features.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Learning from consequences |\n| Four types | Positive/negative reinforcement, positive/negative punishment |\n| Why it matters | Parenting, education, habits, product design |\n| Common misconception | Negative reinforcement means punishment |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  CONSEQ[Consequence] --> ADD[Add something]\n  CONSEQ --> REMOVE[Remove something]\n  ADD --> PR[Pleasant: positive reinforcement → behavior increases]\n  ADD --> PP[Unpleasant: positive punishment → behavior decreases]\n  REMOVE --> NR[Unpleasant removed: negative reinforcement → behavior increases]\n  REMOVE --> NP[Pleasant removed: negative punishment → behavior decreases]\n```\n\n### Worked example\n\n| Example | Type |\n|---|---|\n| Praise for finishing homework | Positive reinforcement |\n| Seatbelt alarm stops when you buckle up | Negative reinforcement |\n| Extra chores for breaking a rule | Positive punishment |\n| Losing phone time for breaking a rule | Negative punishment |"}, {"id": 33, "title": "Reinforcement schedules", "tldr": "Reinforcement can be continuous or intermittent. Variable-ratio schedules (rewards after an unpredictable number of responses) produce high, persistent response rates, which is why slot machines and some app features are so compelling.", "real": "Ferster and Skinner’s 1957 book “Schedules of Reinforcement” documented how different schedules shape response patterns, and researchers have linked variable rewards in social media feeds to habitual checking.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Patterns of when rewards occur |\n| Types | Fixed/variable ratio, fixed/variable interval |\n| Why it matters | Habit strength, persistence, design ethics |\n| Common misconception | Rewarding every time builds the most persistent behavior |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  SCHED[Schedules] --> FR[Fixed ratio: every 10 sales → bonus]\n  SCHED --> VR[Variable ratio: unpredictable wins → very persistent]\n  SCHED --> FI[Fixed interval: monthly salary]\n  SCHED --> VI[Variable interval: checking for new messages]\n```\n\n### Worked example\n\n| Behavior | Schedule | Why it’s hard to stop |\n|---|---|---|\n| Pulling to refresh a feed | Variable ratio/interval | Sometimes something new appears |\n| Gambling | Variable ratio | Unpredictable wins |\n| Learning a new skill | Start continuous, then intermittent | Builds, then maintains behavior |"}, {"id": 34, "title": "Observational learning", "tldr": "People learn by watching others: attending to a model, remembering the behavior, being able to reproduce it and being motivated to do so. Modeling shapes skills, norms and aggression, and explains the influence of role models and media.", "real": "Albert Bandura’s 1961 Bobo doll experiments showed children who watched an adult behave aggressively toward a doll were more likely to imitate that aggression.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Learning through observing models |\n| Steps | Attention, retention, reproduction, motivation |\n| Why it matters | Parenting, teaching, workplace culture |\n| Common misconception | People only learn from their own direct experiences |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  MODEL[Observe model] --> ATTEND[Attention]\n  ATTEND --> RETAIN[Retention]\n  RETAIN --> REPRODUCE[Reproduction ability]\n  REPRODUCE --> MOTIVE[Motivation: consequences seen]\n  MOTIVE --> BEHAVE[Behavior]\n```\n\n### Worked example\n\n| Setting | Observational learning |\n|---|---|\n| New employee | Copies how senior colleagues treat customers |\n| Children | Imitate parents’ phone habits |\n| Training | Video demonstrations before practice |"}, {"id": 35, "title": "How memory works", "tldr": "Memory involves encoding (getting information in), storage (keeping it) and retrieval (getting it out). Models describe sensory memory, limited working memory and long-term memory, with attention determining what gets encoded.", "real": "Atkinson and Shiffrin proposed the multi-store memory model in 1968, and Baddeley and Hitch’s 1974 working memory model added components for verbal and visual-spatial information and attentional control.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Systems for encoding, storing and retrieving information |\n| Why it matters | Learning, identity, decisions |\n| Capacity | Working memory holds only about 4 chunks (Cowan, 2001) |\n| Common misconception | Memory works like a video recording |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  INPUT[Sensory input] --> SENSORY[Sensory memory: fractions of a second]\n  SENSORY -->|attention| WORKING[Working memory: about 4 chunks]\n  WORKING -->|encoding| LONG[Long-term memory]\n  LONG -->|retrieval| WORKING\n```\n\n### Worked example\n\nChunking a phone number:\n\n```text\n9876543210 → 10 separate digits (hard to hold)\n98765 43210 → 2 chunks of 5 (easier)\n```"}, {"id": 36, "title": "Encoding and deep processing", "tldr": "How you process information determines how well you remember it. Thinking about meaning, connecting to what you already know, generating examples and visualizing create stronger memories than rereading or highlighting.", "real": "Craik and Lockhart’s 1972 levels-of-processing framework and later experiments showed words processed for meaning were remembered far better than words processed for appearance.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Turning experiences into memories |\n| Why it matters | Study and training effectiveness |\n| Techniques | Elaboration, self-explanation, examples, visualization |\n| Common misconception | Rereading notes is an effective way to learn |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SHALLOW[Shallow: how it looks] --> WEAK[Weak memory]\n  MEDIUM[Intermediate: how it sounds] --> MODERATE[Moderate memory]\n  DEEP[Deep: what it means + links] --> STRONG[Strong memory]\n```\n\n### Worked example\n\n| Study method | Processing depth |\n|---|---|\n| Highlighting a textbook | Shallow |\n| Rewriting notes word for word | Shallow–moderate |\n| Explaining the concept to a friend | Deep |\n| Creating your own examples | Deep |"}, {"id": 37, "title": "Forgetting", "tldr": "Forgetting is rapid at first and then levels off. Causes include fading traces, interference from similar memories and retrieval failure. Reviewing at the right times greatly slows forgetting.", "real": "Hermann Ebbinghaus’s experiments on himself, published in 1885, produced the “forgetting curve”, showing that much newly learned material is lost within days without review.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Loss of accessibility of memories |\n| Causes | Decay, interference, retrieval failure, lack of encoding |\n| Why it matters | Explains why cramming fails long term |\n| Common misconception | Forgotten memories are always permanently erased |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LEARN[Learn] --> DROP[Steep early forgetting]\n  DROP --> REVIEW1[Review]\n  REVIEW1 --> SLOWER[Slower forgetting]\n  SLOWER --> REVIEW2[Review again]\n  REVIEW2 --> DURABLE[Durable memory]\n```\n\n### Worked example\n\n| Interference type | Example |\n|---|---|\n| Proactive (old disrupts new) | Typing your old password after changing it |\n| Retroactive (new disrupts old) | Learning Spanish makes French vocabulary harder to recall |\n| Retrieval failure | Name “on the tip of your tongue” |"}, {"id": 38, "title": "Retrieval practice and spacing", "tldr": "Testing yourself (retrieval practice) and spreading study over time (spacing) are among the most effective learning strategies. They feel harder than rereading, but this “desirable difficulty” builds durable memories.", "real": "Roediger and Karpicke (2006) found students who practiced recalling a text remembered more a week later than those who restudied it, and Dunlosky and colleagues’ 2013 review rated practice testing and distributed practice as the highest-utility study techniques.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Evidence-based study techniques |\n| Why it matters | Better learning with the same time |\n| Techniques | Flashcards, practice questions, spaced review, interleaving |\n| Common misconception | If studying feels easy, it’s working |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DAY1[Day 1: learn + quiz] --> DAY3[Day 3: quiz]\n  DAY3 --> DAY7[Day 7: quiz]\n  DAY7 --> DAY14[Day 14: quiz]\n  DAY14 --> DAY30[Day 30: quiz]\n  DAY30 --> LONG[Long-term retention]\n```\n\n### Worked example\n\nSame 4 hours of study for an exam in 3 weeks:\n\n| Plan | Expected outcome |\n|---|---|\n| 4 hours rereading the night before | Feels familiar; poor long-term retention |\n| 8 × 30-minute sessions over 3 weeks, mostly self-testing | Better recall on exam and later |"}, {"id": 39, "title": "False memories", "tldr": "Memory is reconstructive: each recall can alter details, and suggestions, leading questions and imagination can create confident but false memories. Confidence doesn’t guarantee accuracy.", "real": "Loftus and Palmer (1974) found people estimated higher speeds when asked how fast cars “smashed” (about 41 mph) than when the verb was “contacted” (about 32 mph), and in a 1995 study about a quarter of participants came to remember a childhood event of being lost in a mall that never happened.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Memories of events that didn’t happen or happened differently |\n| Why it matters | Eyewitness testimony, therapy, personal history |\n| Causes | Suggestion, misinformation, imagination, social pressure |\n| Common misconception | Vivid, confident memories must be accurate |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EVENT[Original event] --> MEMORY[Memory trace]\n  SUGGEST[Leading question or misinformation] --> RECON[Reconstruction at recall]\n  MEMORY --> RECON\n  RECON --> ALTERED[Altered memory recalled confidently]\n```\n\n### Worked example\n\n| Interview question | Effect |\n|---|---|\n| “Did you see the broken glass?” | Suggests glass existed |\n| “What did you see?” | Neutral; fewer distortions |\n| Repeated imagining of an event | Increases false memory risk |"}, {"id": 40, "title": "Habits", "tldr": "Habits are behaviors triggered automatically by context cues after repetition in stable situations. Building habits works best with consistent cues, small actions and rewards; breaking habits works best by changing environments and cues.", "real": "Lally and colleagues (2010) found new daily habits took a median of 66 days to reach maximum automaticity, with a wide range of 18 to 254 days across people and behaviors.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Automatic cue-driven behavior |\n| Why it matters | Much daily behavior is habitual |\n| Building | Stable cue + small action + repetition + reward |\n| Common misconception | Habits form in exactly 21 days |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CUE[Cue: after morning coffee] --> ROUTINE[Routine: 10 push-ups]\n  ROUTINE --> REWARD[Reward: sense of progress]\n  REWARD --> REPEAT[Repeat in same context]\n  REPEAT --> AUTO[Automaticity over weeks to months]\n```\n\n### Worked example\n\n| Goal | Habit design |\n|---|---|\n| Read more | “After I brush my teeth at night, I read 2 pages” |\n| Reduce snacking | Don’t keep snacks in view; fruit on the counter |\n| Exercise | Pack gym bag the night before; same time daily |"}, {"id": 41, "title": "Concepts and categories", "tldr": "People organize knowledge into concepts and categories, often around prototypes (typical examples) rather than strict definitions. Categories speed thinking but can also produce stereotypes when applied rigidly to people.", "real": "Eleanor Rosch’s research in the 1970s showed people judge some category members as more typical than others (a robin is a “better” bird than a penguin), supporting prototype theory.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Mental groupings of objects, ideas and people |\n| Why it matters | Efficient thinking and communication |\n| Models | Definitions, prototypes, exemplars |\n| Common misconception | Categories always have clear boundaries |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  BIRD[Category: bird] --> TYPICAL[Typical: sparrow, robin]\n  BIRD --> LESS[Less typical: penguin, ostrich]\n  BIRD --> BORDER[Borderline cases debated]\n```\n\n### Worked example\n\n| Category | Prototype effect |\n|---|---|\n| “Furniture” | Chair judged more typical than a rug |\n| “Engineer” | Stereotyped mental image may exclude many real engineers |\n| “Healthy food” | Prototypes can mislead (fruit juice vs whole fruit) |"}, {"id": 42, "title": "Problem solving", "tldr": "People solve problems using algorithms (step-by-step procedures), heuristics (shortcuts), insight and analogy. Obstacles include fixation, functional fixedness and mental sets; stepping away and reframing often help.", "real": "Karl Duncker’s 1945 candle problem, where people must attach a candle to a wall using a box of tacks, showed functional fixedness: people struggled to see the box as a shelf rather than only a container.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Moving from a problem state to a goal state |\n| Strategies | Algorithms, heuristics, working backward, analogies |\n| Obstacles | Functional fixedness, mental set, confirmation bias |\n| Common misconception | Good problem solvers never get stuck |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DEFINE[Define problem] --> GENERATE[Generate options]\n  GENERATE --> EVALUATE[Evaluate]\n  EVALUATE --> TRY[Try solution]\n  TRY -->|stuck| REFRAME[Reframe / take a break / analogy]\n  REFRAME --> GENERATE\n  TRY -->|works| DONE[Solved]\n```\n\n### Worked example\n\n| Obstacle | Example | Remedy |\n|---|---|---|\n| Functional fixedness | Not using a coin as a screwdriver | Ask “what else could this be?” |\n| Mental set | Reusing an old approach that no longer fits | Try a different representation |\n| Fixation | Staring at the same failed solution | Take a break (incubation) |"}, {"id": 43, "title": "Heuristics", "tldr": "Heuristics are mental shortcuts that allow fast judgments: availability (easily recalled events seem more common), representativeness (judging by similarity to a prototype) and anchoring (relying on a first number). They’re often useful but produce predictable errors.", "real": "Amos Tversky and Daniel Kahneman’s 1974 Science paper “Judgment under Uncertainty: Heuristics and Biases” described these heuristics and became one of the most influential papers in the social sciences.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Mental shortcuts for judgment |\n| Why it matters | Explains systematic errors in everyday decisions |\n| Main types | Availability, representativeness, anchoring |\n| Common misconception | Heuristics are always irrational; they’re often efficient |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  QUESTION[Hard question: how likely is X?] --> SUBSTITUTE[Easier question answered instead]\n  SUBSTITUTE --> AVAIL[How easily do examples come to mind?]\n  SUBSTITUTE --> REP[How similar is it to a typical case?]\n  SUBSTITUTE --> ANCHOR[Adjust from a starting number]\n```\n\n### Worked example\n\n| Heuristic | Example error |\n|---|---|\n| Availability | Fearing flying more than driving after news of a plane crash |\n| Representativeness | Assuming a quiet, bookish person is a librarian rather than a salesperson despite base rates |\n| Anchoring | Spending more because a “was ₹5,000, now ₹2,999” tag anchors value |"}, {"id": 44, "title": "Cognitive biases", "tldr": "Cognitive biases are systematic deviations from accurate judgment: confirmation bias, hindsight bias, overconfidence, sunk-cost thinking, the planning fallacy and others. Awareness alone helps little; structured decision processes help more.", "real": "Buehler, Griffin and Ross (1994) found students’ estimates of thesis completion times were far too optimistic, with most finishing later than even their “worst-case” predictions, illustrating the planning fallacy.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Predictable thinking errors |\n| Why it matters | Affects money, health, work and relationships |\n| Countermeasures | Base rates, checklists, pre-mortems, outside views, second opinions |\n| Common misconception | Smart people are immune to biases |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BELIEF[Existing belief] --> SEEK[Seek confirming information]\n  SEEK --> INTERPRET[Interpret ambiguity as support]\n  INTERPRET --> REMEMBER[Remember hits, forget misses]\n  REMEMBER --> STRONGER[Belief grows stronger]\n  STRONGER --> SEEK\n```\n\n### Worked example\n\n| Bias | Debiasing technique |\n|---|---|\n| Confirmation bias | Actively look for disconfirming evidence |\n| Planning fallacy | Use durations of similar past projects (outside view) |\n| Sunk cost | Ask “if I were starting fresh today, would I choose this?” |\n| Overconfidence | Give ranges and track your prediction accuracy |"}, {"id": 45, "title": "Two modes of thinking", "tldr": "Psychologists often describe fast, automatic, intuitive thinking (System 1) and slow, effortful, deliberate thinking (System 2). Intuition works well in familiar, regular environments with feedback; deliberate reasoning helps in novel or high-stakes situations.", "real": "Daniel Kahneman popularized the System 1/System 2 framework in “Thinking, Fast and Slow” (2011); he received the 2002 Nobel Memorial Prize in Economic Sciences for work with Amos Tversky on judgment and decision-making.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Dual-process view of thinking |\n| Why it matters | Knowing when to trust intuition |\n| Good intuition needs | Regular environment, lots of practice, quick feedback |\n| Common misconception | The two systems are separate brain parts; they’re descriptive labels |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SITUATION[Situation] --> FAST[System 1: fast, automatic]\n  FAST --> ANSWER[Quick answer]\n  ANSWER --> CHECK{Familiar + low stakes?}\n  CHECK -->|yes| ACT[Act on intuition]\n  CHECK -->|no| SLOW[System 2: deliberate check]\n  SLOW --> ACT2[Considered decision]\n```\n\n### Worked example\n\nA bat and ball cost ₹110 in total. The bat costs ₹100 more than the ball. How much is the ball?\n\n```text\nIntuitive answer: ₹10 (wrong: bat would be ₹110, total ₹120)\nDeliberate answer: ball = x, bat = x + 100, total 2x + 100 = 110 → x = ₹5\n```"}, {"id": 46, "title": "Risk and loss aversion", "tldr": "People feel losses more strongly than equivalent gains (loss aversion) and evaluate outcomes relative to reference points. Framing the same facts as gains or losses can change decisions.", "real": "Kahneman and Tversky’s prospect theory (1979) formalized these patterns, and later estimates suggested losses weigh roughly twice as heavily as equivalent gains in many contexts.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Asymmetric sensitivity to losses and gains |\n| Why it matters | Investing, negotiation, health choices, marketing |\n| Related | Framing effects, endowment effect, status quo bias |\n| Common misconception | People evaluate outcomes in absolute terms |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REF[Reference point] --> GAIN[Gain of ₹1,000: some pleasure]\n  REF --> LOSS[Loss of ₹1,000: stronger pain]\n  LOSS --> AVOID[Choices that avoid losses]\n```\n\n### Worked example\n\n| Frame | Typical preference |\n|---|---|\n| “This surgery has a 90% survival rate” | More people choose surgery |\n| “This surgery has a 10% mortality rate” | Fewer choose surgery, though identical |\n| “Avoid losing ₹500 by insulating your home” | Often more persuasive than “save ₹500” |"}, {"id": 47, "title": "Choice and decision environments", "tldr": "How choices are presented, including defaults, order, number of options and simplicity, strongly influences decisions. Thoughtful choice architecture (“nudges”) can help people act in their own interests while preserving freedom.", "real": "Johnson and Goldstein (2003) found organ donation consent rates were dramatically higher in countries with opt-out defaults than opt-in, and Thaler and Sunstein’s “Nudge” (2008) popularized choice architecture.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Influence of how choices are structured |\n| Why it matters | Policy, product design, personal decisions |\n| Tools | Defaults, simplification, reminders, feedback |\n| Common misconception | “More choice is always better”; evidence on choice overload is mixed |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  OPTIONS[Options] --> PRESENT[Presentation: defaults, order, framing]\n  PRESENT --> DECISION[Decision]\n  INERTIA[Inertia + effort] --> DECISION\n```\n\n### Worked example\n\n| Design | Effect |\n|---|---|\n| Automatic enrollment in retirement savings (opt out allowed) | Much higher participation than opt-in |\n| Healthy food at eye level in cafeterias | More healthy choices |\n| 24 vs 6 jam varieties (Iyengar & Lepper, 2000) | Original study found fewer purchases with more choice; later meta-analyses found the average effect near zero, varying by context |"}, {"id": 48, "title": "Intelligence", "tldr": "Intelligence tests measure reasoning, knowledge, memory and processing speed; scor

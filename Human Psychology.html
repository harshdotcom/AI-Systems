es tend to correlate, reflecting a general factor (g). IQ predicts school and job performance moderately, is influenced by genes and environment, and rose across generations (Flynn effect).", "real": "James Flynn documented that average IQ scores rose by about 3 points per decade across many countries during the 20th century, too fast to be genetic, pointing to environmental factors such as education and nutrition.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Ability to reason, learn and solve problems |\n| Measurement | IQ tests: mean 100, standard deviation 15 |\n| Why it matters | Predicts some outcomes; often over-interpreted |\n| Common misconception | IQ is fixed and measures a person’s worth |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  G[General ability g] --> VERBAL[Verbal comprehension]\n  G --> REASON[Fluid reasoning]\n  G --> MEMORY[Working memory]\n  G --> SPEED[Processing speed]\n  G --> SPATIAL[Visual-spatial]\n```\n\n### Worked example\n\nWith mean 100 and standard deviation 15:\n\n| Score range | Approximate share of population |\n|---|---|\n| 85–115 (±1 SD) | \\~68% |\n| 70–130 (±2 SD) | \\~95% |\n| Above 130 | \\~2% |"}, {"id": 49, "title": "Creativity", "tldr": "Creativity is producing ideas that are both novel and useful. It involves divergent thinking (many options) and convergent thinking (selecting and refining), domain knowledge, motivation and environments that tolerate risk and failure.", "real": "J. P. Guilford’s 1950 address to the American Psychological Association called for scientific study of creativity, and his “alternative uses” tasks for divergent thinking are still used in research.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Generating novel and useful ideas |\n| Why it matters | Innovation, problem solving, art |\n| Process | Preparation, incubation, insight, verification |\n| Common misconception | Creativity is a rare gift unrelated to knowledge or practice |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PREP[Preparation: learn the domain] --> DIVERGE[Diverge: many ideas]\n  DIVERGE --> INCUBATE[Incubation: step away]\n  INCUBATE --> CONVERGE[Converge: select + refine]\n  CONVERGE --> TEST[Test + iterate]\n```\n\n### Worked example\n\nAlternative uses task: “How many uses for a brick?”\n\n| Scoring dimension | Example |\n|---|---|\n| Fluency | 15 uses listed |\n| Flexibility | Uses across categories (building, art, exercise, tool) |\n| Originality | “Paperweight for a giant’s homework” (rare answer) |"}, {"id": 50, "title": "Language and thought", "tldr": "Language is a structured system for communicating meaning, acquired remarkably quickly by children. Language can influence attention, memory and categorization in modest ways, but it doesn’t rigidly determine what people can think.", "real": "Research on color terms, such as studies showing Russian speakers (who have separate basic words for light and dark blue) discriminate those shades slightly faster (Winawer et al., 2007), supports a weak form of linguistic influence on perception.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Relationship between language and cognition |\n| Why it matters | Learning, communication, culture |\n| Evidence | Weak linguistic relativity supported; strong determinism not |\n| Common misconception | People can’t think about concepts their language lacks words for |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LANGUAGE[Language categories] --> ATTENTION[Attention to distinctions]\n  ATTENTION --> MEMORY[Memory + categorization]\n  THOUGHT[Thought] --> LANGUAGE\n```\n\n### Worked example\n\n| Example | Influence |\n|---|---|\n| Separate words for light/dark blue | Slightly faster discrimination |\n| Framing “climate change” vs “global warming” | Different associations and concern levels in surveys |\n| Learning a technical vocabulary | Helps notice and discuss distinctions |"}, {"id": 51, "title": "Theories of motivation", "tldr": "Motivation explains why people start, persist in and stop behaviors. Theories emphasize biological drives, incentives, arousal levels, needs and expectations of success multiplied by the value of outcomes.", "real": "Abraham Maslow proposed his hierarchy of needs in 1943; it remains popular, but research hasn’t supported a strict sequence in which lower needs must be met before higher ones matter.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Forces that energize and direct behavior |\n| Theories | Drive reduction, incentive, arousal (Yerkes–Dodson), needs, expectancy–value |\n| Why it matters | Learning, work, health behavior |\n| Common misconception | Maslow’s pyramid is a proven law; he didn’t draw the pyramid himself |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EXPECT[Expectancy: can I succeed?] --> MOTIVATION[Motivation]\n  VALUE[Value: does it matter to me?] --> MOTIVATION\n  COST[Perceived cost: effort, risk] --> MOTIVATION\n  MOTIVATION --> BEHAVIOR[Effort + persistence]\n```\n\n### Worked example\n\nA student avoids studying statistics:\n\n| Factor | Diagnosis | Intervention |\n|---|---|---|\n| Expectancy low | “I’m bad at math” | Small wins, worked examples |\n| Value low | “I’ll never use this” | Connect to career goals |\n| Cost high | Anxiety, long sessions | Short sessions, study group |"}, {"id": 52, "title": "Self-determination theory", "tldr": "Self-determination theory proposes three basic psychological needs: autonomy (choice), competence (mastery) and relatedness (connection). Environments supporting these needs foster intrinsic motivation, well-being and better performance.", "real": "Edward Deci and Richard Ryan developed self-determination theory from the 1970s–80s, and it has been tested in education, health, sports and workplaces across many cultures.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Theory of motivation based on psychological needs |\n| Needs | Autonomy, competence, relatedness |\n| Why it matters | Designing classrooms, teams, apps and parenting |\n| Common misconception | Autonomy means independence from others |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  NEEDS[Basic needs] --> AUT[Autonomy: meaningful choice]\n  NEEDS --> COMP[Competence: growing mastery]\n  NEEDS --> REL[Relatedness: belonging]\n  AUT --> INTRINSIC[Intrinsic motivation + well-being]\n  COMP --> INTRINSIC\n  REL --> INTRINSIC\n```\n\n### Worked example\n\n| Manager behavior | Need supported |\n|---|---|\n| Explains why a task matters and lets the team choose the approach | Autonomy |\n| Gives specific feedback and stretch tasks with support | Competence |\n| Regular one-to-ones and team rituals | Relatedness |"}, {"id": 53, "title": "Intrinsic and extrinsic motivation", "tldr": "Intrinsic motivation comes from interest and enjoyment; extrinsic motivation comes from rewards and pressures. Expected, controlling rewards for already enjoyable activities can reduce intrinsic motivation, while informative feedback can support it.", "real": "Lepper, Greene and Nisbett (1973) found preschoolers who expected a reward for drawing later drew less in free time than those who weren’t rewarded, an effect called overjustification.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Internal vs external sources of motivation |\n| Why it matters | Rewards can help or backfire |\n| Key finding | Controlling, expected rewards can undermine interest |\n| Common misconception | Rewards always increase motivation |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ENJOY[Enjoyable activity] --> REWARD{Reward type}\n  REWARD -->|expected + controlling| DROP[Interest may decline]\n  REWARD -->|unexpected or informative| KEEP[Interest maintained]\n  BORING[Boring task] --> EXT[Extrinsic rewards can help start]\n```\n\n### Worked example\n\n| Situation | Better approach |\n|---|---|\n| Child already loves reading | Praise effort and curiosity; avoid paying per book |\n| Necessary but dull data entry | Reasonable incentives + explain purpose |\n| Employee bonuses | Fair pay + autonomy + recognition of mastery |"}, {"id": 54, "title": "Goal setting", "tldr": "Specific, challenging goals with feedback generally lead to better performance than vague “do your best” goals. Implementation intentions (“if situation X, then I will do Y”) help turn goals into action.", "real": "Locke and Latham’s goal-setting theory, summarized in a 2002 American Psychologist article, drew on hundreds of studies, and Gollwitzer and Sheeran’s 2006 meta-analysis found implementation intentions had a medium-to-large effect on goal attainment.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Using goals to direct effort |\n| Effective goals | Specific, challenging, with feedback and commitment |\n| Tool | Implementation intentions (if–then plans) |\n| Common misconception | Visualizing success alone is enough |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  GOAL[Specific challenging goal] --> PLAN[If–then plans]\n  PLAN --> ACTION[Action]\n  ACTION --> FEEDBACK[Feedback]\n  FEEDBACK --> ADJUST[Adjust strategy]\n  ADJUST --> ACTION\n```\n\n### Worked example\n\n| Vague goal | Improved goal |\n|---|---|\n| “Get fit” | “Walk 30 minutes, 5 days a week for 8 weeks” |\n| Implementation intention | “If it’s 7 a.m. on a weekday, I walk before checking my phone” |\n| Obstacle plan | “If it rains, I do a 20-minute indoor workout video” |"}, {"id": 55, "title": "What emotions are", "tldr": "Emotions are coordinated responses involving appraisal, bodily changes, expressions, feelings and action tendencies. Some expressions are recognized widely across cultures, while emotional experience is also shaped by context, language and culture.", "real": "Paul Ekman’s cross-cultural studies from the 1960s–70s suggested universal recognition of basic facial expressions, while Lisa Feldman Barrett’s theory of constructed emotion (2017) argues emotions are built from bodily states and learned concepts.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Short-lived, multi-component responses to events |\n| Components | Appraisal, physiology, expression, feeling, action tendency |\n| Why it matters | Guides decisions, communication and relationships |\n| Common misconception | Emotions are the opposite of rational thinking |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EVENT[Event] --> APPRAISAL[Appraisal: what does this mean for me?]\n  APPRAISAL --> BODY[Body changes]\n  APPRAISAL --> FEELING[Feeling]\n  APPRAISAL --> EXPRESSION[Expression]\n  FEELING --> ACTION[Action tendency]\n```\n\n### Worked example\n\n| Emotion | Typical appraisal | Action tendency |\n|---|---|---|\n| Fear | Threat I may not handle | Escape or freeze |\n| Anger | Unfair obstacle | Confront |\n| Sadness | Loss | Withdraw, seek comfort |\n| Joy | Goal achieved | Approach, share |"}, {"id": 56, "title": "Theories of emotion", "tldr": "Classic theories debate whether bodily changes cause feelings (James–Lange), occur simultaneously (Cannon–Bard), or combine with cognitive labeling (Schachter–Singer). Modern appraisal and constructionist theories emphasize interpretation of situations and bodily states.", "real": "Schachter and Singer’s 1962 experiment injected participants with adrenaline and placed them with either euphoric or angry confederates, proposing that people label physiological arousal using situational cues.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Explanations of how emotions arise |\n| Why it matters | Informs emotion regulation techniques |\n| Key idea | Interpretation of arousal shapes emotional experience |\n| Common misconception | Emotions simply happen to us without interpretation |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  subgraph James-Lange\n    E1[Event] --> B1[Body response] --> F1[Feeling]\n  end\n  subgraph Two-factor\n    E2[Event] --> B2[Arousal]\n    E2 --> L2[Cognitive label]\n    B2 --> F2[Feeling]\n    L2 --> F2\n  end\n```\n\n### Worked example\n\nSame racing heart before a presentation:\n\n| Interpretation | Likely feeling |\n|---|---|\n| “I’m about to fail” | Anxiety |\n| “My body is energizing me to perform” | Excitement |\n\n(Reappraising anxiety as excitement has improved performance in some studies, such as Brooks, 2014.)"}, {"id": 57, "title": "Emotion regulation", "tldr": "People regulate emotions by choosing situations, changing them, shifting attention, reappraising meaning or modulating responses. Reappraisal is generally linked to better outcomes than habitual suppression of emotional expression.", "real": "James Gross’s process model of emotion regulation (1998) and later research, such as Gross and John (2003), linked habitual reappraisal with better well-being and relationships than habitual suppression.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Influencing which emotions we have and how we express them |\n| Strategies | Situation selection/modification, attention, reappraisal, response modulation |\n| Why it matters | Mental health, relationships, performance |\n| Common misconception | Healthy people don’t feel negative emotions |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SIT[Situation] --> ATTN[Attention]\n  ATTN --> APPRAISE[Appraisal]\n  APPRAISE --> RESPONSE[Response]\n  S1[Situation selection/modification] -.-> SIT\n  S2[Attentional deployment] -.-> ATTN\n  S3[Cognitive reappraisal] -.-> APPRAISE\n  S4[Response modulation] -.-> RESPONSE\n```\n\n### Worked example\n\nCritical feedback from a manager:\n\n| Strategy | Example |\n|---|---|\n| Situation modification | Ask to discuss in a private meeting |\n| Attention | Focus on specific actionable points |\n| Reappraisal | “This feedback helps me improve before the review” |\n| Response modulation | Take slow breaths before replying |"}, {"id": 58, "title": "Stress and coping", "tldr": "Stress arises when demands appear to exceed resources. Short-term stress can sharpen performance; chronic stress harms health. Coping can address the problem itself or manage emotions; social support and a sense of control are strong buffers.", "real": "Lazarus and Folkman’s 1984 transactional model defined stress as depending on appraisals of threat and coping resources, and the Holmes and Rahe Social Readjustment Rating Scale (1967) linked life changes with later illness risk.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Response to demands perceived as exceeding resources |\n| Why it matters | Health, performance, relationships |\n| Coping types | Problem-focused, emotion-focused, social support, meaning-focused |\n| Common misconception | All stress is bad |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  DEMAND[Demand] --> PRIMARY[Primary appraisal: is this a threat?]\n  PRIMARY --> SECONDARY[Secondary appraisal: can I cope?]\n  SECONDARY -->|resources enough| CHALLENGE[Challenge: energized]\n  SECONDARY -->|resources lacking| THREAT[Threat: stress]\n  THREAT --> COPE[Coping strategies]\n```\n\n### Worked example\n\n| Stressor | Problem-focused coping | Emotion-focused coping |\n|---|---|---|\n| Heavy workload | Prioritize, negotiate deadlines | Exercise, talk with a friend |\n| Exam in a week | Study plan with practice tests | Relaxation breathing |\n| Illness of a family member (less controllable) | Arrange practical support | Accept emotions, seek support |"}, {"id": 59, "title": "Happiness and well-being", "tldr": "Well-being includes feeling good (hedonic) and functioning well with meaning and purpose (eudaimonic). Relationships, health, autonomy and meaningful activity matter greatly; people adapt to many changes, and income helps up to a point with debated limits.", "real": "The Harvard Study of Adult Development, running since 1938, found close relationships were among the strongest predictors of health and happiness in later life, and a 2023 adversarial collaboration found happiness rose with income for most people, plateauing mainly among the least happy.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Positive emotions, life satisfaction, meaning |\n| Strong predictors | Relationships, health, autonomy, purpose |\n| Hedonic adaptation | Emotional reactions to changes fade over time |\n| Common misconception | Major purchases or achievements bring lasting happiness |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  WELL[Well-being] --> REL[Close relationships]\n  WELL --> HEALTH[Physical health + sleep]\n  WELL --> MEANING[Meaning + purpose]\n  WELL --> AUTONOMY[Autonomy + control]\n  WELL --> SECURITY[Financial security]\n```\n\n### Worked example\n\n| Spending choice | Evidence-based tendency |\n|---|---|\n| Experiences vs objects | Experiences often bring more lasting satisfaction |\n| Buying time (e.g. outsourcing chores) | Linked to higher life satisfaction (Whillans et al., 2017) |\n| Spending on others | Often increases happiness more than spending on oneself |"}, {"id": 60, "title": "Self-control", "tldr": "Self-control is overriding impulses for longer-term goals. The most effective self-control often comes from structuring environments to avoid temptation and building habits, not from constant willpower battles.", "real": "Mischel’s 1970s marshmallow studies linked children’s ability to delay gratification with later outcomes, but a 2018 replication by Watts, Duncan and Quan with a larger, more diverse sample found weaker associations, largely explained by family background; a multi-lab test of “ego depletion” in 2016 found near-zero effects.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Aligning behavior with long-term goals |\n| Why it matters | Health, finances, learning |\n| Effective strategies | Remove temptations, precommitment, habits, if–then plans |\n| Common misconception | Successful people simply have more willpower |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TEMPT[Temptation] --> ENV{Environment designed?}\n  ENV -->|temptation removed| EASY[Little willpower needed]\n  ENV -->|temptation present| FIGHT[Effortful resistance: often fails]\n  HABIT[Habits] --> EASY\n```\n\n### Worked example\n\n| Goal | Willpower approach | Situational approach |\n|---|---|---|\n| Less phone use at night | “I’ll resist checking” | Charge phone outside bedroom |\n| Save money | “I’ll avoid spending” | Automatic transfer to savings on payday |\n| Study more | “I’ll ignore distractions” | Library + website blocker |"}, {"id": 61, "title": "Lifespan development", "tldr": "Developmental psychology studies change and continuity from conception to old age in physical, cognitive, social and emotional domains. Key debates concern nature vs nurture, continuous vs stage-like change and stability vs change.", "real": "Long-running longitudinal studies, such as New Zealand’s Dunedin Multidisciplinary Health and Development Study (following over 1,000 people born in 1972–73), have tracked how childhood factors relate to adult health and behavior.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Study of how people change across life |\n| Methods | Cross-sectional, longitudinal, sequential designs |\n| Big questions | Nature/nurture, stages vs continuity, stability vs change |\n| Common misconception | Development ends in adulthood |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PRENATAL[Prenatal] --> INFANCY[Infancy]\n  INFANCY --> CHILD[Childhood]\n  CHILD --> ADOL[Adolescence]\n  ADOL --> EARLY[Early adulthood]\n  EARLY --> MIDDLE[Middle adulthood]\n  MIDDLE --> LATE[Late adulthood]\n```\n\n### Worked example\n\n| Design | Strength | Weakness |\n|---|---|---|\n| Cross-sectional (compare ages now) | Fast, cheap | Confounds age with generation |\n| Longitudinal (follow same people) | Shows individual change | Slow, costly, dropouts |"}, {"id": 62, "title": "Infancy", "tldr": "Infants arrive with remarkable abilities: preference for faces and voices, rapid learning of speech sounds and statistical patterns, and early understanding of objects. Responsive caregiving and serve-and-return interactions support brain development.", "real": "Saffran, Aslin and Newport (1996) showed 8-month-old infants could detect word boundaries in a stream of nonsense syllables after just two minutes, using statistical regularities.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Development in the first two years |\n| Key abilities | Face preference, speech sound learning, object understanding |\n| Why it matters | Foundations for language, attachment and learning |\n| Common misconception | Babies are passive and learn little before speaking |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CHILD[Infant babbles or points] --> ADULT[Caregiver responds]\n  ADULT --> CHILD2[Infant responds back]\n  CHILD2 --> ADULT2[Caregiver extends interaction]\n  ADULT2 --> BRAIN[Builds language + social circuits]\n```\n\n### Worked example\n\n| Age (approximate) | Typical milestone |\n|---|---|\n| 2 months | Social smile |\n| 6 months | Babbling, recognizes familiar faces |\n| 9–12 months | Pointing, first words |\n| 18–24 months | Word combinations, rapid vocabulary growth |\n\n(Wide normal variation; concerns should be discussed with a pediatrician.)"}, {"id": 63, "title": "Attachment", "tldr": "Attachment is the emotional bond between children and caregivers, providing a secure base for exploration. Sensitive, responsive caregiving tends to produce secure attachment, which is associated with better social and emotional outcomes.", "real": "John Bowlby developed attachment theory from the 1950s, Harlow’s monkey studies (1958) showed infant monkeys preferred a soft cloth “mother” over a wire one providing food, and Mary Ainsworth’s Strange Situation procedure classified infant attachment patterns.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Enduring emotional bond to caregivers |\n| Patterns | Secure, avoidant, ambivalent/resistant, disorganized |\n| Why it matters | Emotional regulation, relationships |\n| Common misconception | Attachment style is fixed for life |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CARE[Sensitive, responsive care] --> SECURE[Secure attachment]\n  SECURE --> EXPLORE[Confident exploration]\n  EXPLORE --> RETURN[Returns for comfort when distressed]\n  RETURN --> CARE\n```\n\n### Worked example\n\n| Strange Situation reunion behavior | Classification |\n|---|---|\n| Seeks comfort, then calms and resumes play | Secure |\n| Avoids caregiver on return | Avoidant |\n| Seeks contact but resists, hard to soothe | Ambivalent/resistant |\n| Confused, contradictory behavior | Disorganized |"}, {"id": 64, "title": "Piaget and cognitive development", "tldr": "Jean Piaget proposed that children actively construct knowledge through stages: sensorimotor, preoperational, concrete operational and formal operational. Later research shows children often have abilities earlier than Piaget thought, and development is less strictly stage-like.", "real": "Piaget’s conservation tasks, where young children think a tall thin glass holds more liquid than a short wide one containing the same amount, remain classic demonstrations of preoperational thinking.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Stage theory of thinking development |\n| Key concepts | Schemas, assimilation, accommodation |\n| Why it matters | Shaped education and developmental research |\n| Common misconception | Stages begin and end at precise ages |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  S1[Sensorimotor 0–2: object permanence] --> S2[Preoperational 2–7: symbols, egocentrism]\n  S2 --> S3[Concrete operational 7–11: conservation, logic on concrete things]\n  S3 --> S4[Formal operational 11+: abstract reasoning]\n```\n\n### Worked example\n\n| Task | Preoperational child | Concrete operational child |\n|---|---|---|\n| Same water poured into a taller glass | “Tall glass has more” | “Same amount, just poured” |\n| Row of coins spread out | “Longer row has more” | “Same number” |"}, {"id": 65, "title": "Vygotsky and social learning", "tldr": "Lev Vygotsky emphasized that learning is social: children develop by working with more capable others within their zone of proximal development, the gap between what they can do alone and what they can do with help. Scaffolding provides temporary support.", "real": "The term “scaffolding” was introduced by Wood, Bruner and Ross in 1976 to describe tutoring support, and it connects closely with Vygotsky’s zone of proximal development.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Sociocultural theory of development |\n| Key concepts | Zone of proximal development, scaffolding, language as a tool |\n| Why it matters | Teaching, mentoring, coaching |\n| Common misconception | Good teaching means letting learners figure everything out alone |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ALONE[Can do alone] --> ZPD[Zone of proximal development: can do with help]\n  ZPD --> BEYOND[Cannot do yet]\n  SCAFFOLD[Scaffolding] --> ZPD\n  ZPD -->|support fades| ALONE\n```\n\n### Worked example\n\nTeaching a child to ride a bicycle:\n\n| Stage | Scaffold |\n|---|---|\n| Start | Adult holds the seat |\n| Progress | Adult runs alongside, light touch |\n| Nearly independent | Adult watches, gives verbal tips |\n| Independent | Support removed |"}, {"id": 66, "title": "Adolescence", "tldr": "Adolescence involves puberty, identity exploration, increasing peer importance and brain development, with reward-related systems maturing earlier than prefrontal control systems. Teens are capable of mature reasoning, but peers and emotional situations increase risk-taking.", "real": "In a 2005 driving-game study by Gardner and Steinberg, adolescents took more risks when peers were watching, while adults’ risk-taking was little affected by peers.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Transition from childhood to adulthood |\n| Key changes | Puberty, identity, peer influence, brain maturation into the mid-20s |\n| Why it matters | Education, parenting, mental health, policy |\n| Common misconception | Teens can’t make good decisions |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  REWARD[Reward sensitivity rises early] --> RISK[Higher risk-taking in emotional or peer contexts]\n  CONTROL[Prefrontal control matures gradually] --> RISK\n  PEERS[Peers present] --> RISK\n```\n\n### Worked example\n\n| Context | Adolescent decision-making |\n|---|---|\n| Calm, time to think (“cold” cognition) | Often similar to adults |\n| Emotional, with peers (“hot” cognition) | More impulsive choices |\n| Practical implication | Graduated driving licenses with passenger limits |"}, {"id": 67, "title": "Erikson’s psychosocial stages", "tldr": "Erik Erikson proposed eight life stages, each with a central psychosocial challenge, such as trust vs mistrust in infancy, identity vs role confusion in adolescence and generativity vs stagnation in midlife. It’s a useful framework, though not tightly tested.", "real": "Erikson’s “Childhood and Society” (1950) introduced the stages, and James Marcia’s 1966 identity status research extended the adolescent stage into measurable identity statuses.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Lifespan model of psychosocial challenges |\n| Why it matters | Frames development as lifelong |\n| Strength | Rich, intuitive framework |\n| Common misconception | Each stage must be “completed” before the next |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  T[Trust vs mistrust] --> A[Autonomy vs shame]\n  A --> I[Initiative vs guilt]\n  I --> IND[Industry vs inferiority]\n  IND --> ID[Identity vs role confusion]\n  ID --> INT[Intimacy vs isolation]\n  INT --> GEN[Generativity vs stagnation]\n  GEN --> INTEG[Integrity vs despair]\n```\n\n### Worked example\n\n| Identity status (Marcia) | Exploration | Commitment | Example |\n|---|---|---|---|\n| Diffusion | Low | Low | No career direction or interest yet |\n| Foreclosure | Low | High | Follows parents’ chosen career without exploring |\n| Moratorium | High | Low | Trying internships in several fields |\n| Achievement | High | High | Chose a path after exploring options |"}, {"id": 68, "title": "Adulthood and aging", "tldr": "Adulthood brings continued development: crystallized knowledge often grows into later life, while processing speed and fluid reasoning gradually decline. Emotional well-being often improves with age, and lifestyle factors influence cognitive aging.", "real": "Laura Carstensen’s socioemotional selectivity theory and research found older adults tend to prioritize emotionally meaningful goals and often report more positive emotional experiences than younger adults.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Change and growth across adulthood |\n| Patterns | Crystallized ability stable/rising; fluid ability declining |\n| Protective factors | Physical activity, social engagement, learning, sleep, hearing care |\n| Common misconception | Old age means inevitable unhappiness and severe mental decline |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  AGE[Age] --> CRYST[Crystallized: vocabulary, knowledge → stable or rising]\n  AGE --> FLUID[Fluid: speed, novel reasoning → gradual decline]\n  LIFESTYLE[Exercise, social life, learning] --> RESERVE[Cognitive reserve]\n  RESERVE --> FLUID\n```\n\n### Worked example\n\n| Factor | Evidence for brain health |\n|---|---|\n| Regular physical activity | Consistently associated with better cognitive aging |\n| Hearing loss treatment | Identified by the 2020 and 2024 Lancet Commissions as a modifiable dementia risk factor |\n| Social engagement | Associated with lower dementia risk |"}, {"id": 69, "title": "Parenting styles", "tldr": "Research distinguishes parenting by warmth and control: authoritative (warm, clear expectations), authoritarian (strict, low warmth), permissive (warm, few limits) and uninvolved. Authoritative parenting is generally associated with better outcomes, with cultural variation.", "real": "Diana Baumrind identified authoritative, authoritarian and permissive styles in the 1960s, and Maccoby and Martin added the uninvolved (neglectful) style in 1983.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Patterns of parental warmth and control |\n| Dimensions | Responsiveness (warmth) × demandingness (expectations) |\n| Why it matters | Associated with children’s self-regulation and well-being |\n| Common misconception | Strict = good discipline; warmth = spoiling |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  STYLES[Parenting] --> AUTH[Authoritative: high warmth + high expectations]\n  STYLES --> AUTHOR[Authoritarian: low warmth + high control]\n  STYLES --> PERM[Permissive: high warmth + low expectations]\n  STYLES --> UNINV[Uninvolved: low warmth + low expectations]\n```\n\n### Worked example\n\nChild refuses to do homework:\n\n| Style | Response |\n|---|---|\n| Authoritative | “Homework comes before games. Let’s figure out what’s hard and make a plan.” |\n| Authoritarian | “Do it now because I said so.” |\n| Permissive | “Okay, skip it tonight.” |\n| Uninvolved | No response |"}, {"id": 70, "title": "Moral development", "tldr": "Kohlberg proposed stages of moral reasoning from avoiding punishment to following social rules to abstract principles. Critics noted cultural and gender biases and that moral behavior also depends on emotion, intuition and situation, not reasoning alone.", "real": "Lawrence Kohlberg used dilemmas such as the “Heinz dilemma” (whether to steal an expensive drug to save a dying spouse) from 1958, and Carol Gilligan’s 1982 “In a Different Voice” argued his framework underweighted an ethic of care.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How moral reasoning and behavior develop |\n| Kohlberg levels | Preconventional, conventional, postconventional |\n| Critiques | Cultural bias, care ethics, intuition-first views (Haidt) |\n| Common misconception | Moral reasoning alone predicts moral behavior |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PRE[Preconventional: punishment, self-interest] --> CONV[Conventional: approval, laws]\n  CONV --> POST[Postconventional: social contract, universal principles]\n```\n\n### Worked example\n\nHeinz dilemma answers at different levels:\n\n| Level | Reasoning (for stealing) |\n|---|---|\n| Preconventional | “He might not get caught, and his wife is important to him” |\n| Conventional | “A good husband protects his family” |\n| Postconventional | “Human life is worth more than property rights” |\n\n(The level depends on the reasoning, not on whether the person says steal or not steal.)"}, {"id": 71, "title": "Approaches to personality", "tldr": "Personality is a person’s characteristic patterns of thinking, feeling and behaving. Approaches include trait theories, psychodynamic, humanistic, social-cognitive and biological views; trait models have the strongest research base today.", "real": "Gordon Allport and Henry Odbert’s 1936 analysis identified about 18,000 English words describing personality, a starting point for the lexical approach that later produced the Big Five.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Enduring individual patterns of behavior and experience |\n| Why it matters | Predicts outcomes; informs self-understanding |\n| Main approaches | Trait, psychodynamic, humanistic, social-cognitive, biological |\n| Common misconception | Personality types put people into neat boxes |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  P[Personality] --> TRAIT[Traits: stable dimensions]\n  P --> SOCCOG[Social-cognitive: beliefs, self-efficacy, situations]\n  P --> HUMAN[Humanistic: growth, self-concept]\n  P --> PSYDYN[Psychodynamic: unconscious processes]\n  P --> BIO[Biological: genes, temperament]\n```\n\n### Worked example\n\n| Approach | How it explains shyness |\n|---|---|\n| Trait | Low extraversion |\n| Social-cognitive | Belief “I’ll embarrass myself” + avoidance |\n| Biological | Inherited inhibited temperament |\n| Humanistic | Self-concept inconsistent with social experiences |"}, {"id": 72, "title": "The Big Five traits", "tldr": "The Big Five model describes personality on five continuous dimensions: openness, conscientiousness, extraversion, agreeableness and neuroticism (OCEAN). Traits predict outcomes such as job performance (especially conscientiousness), health and relationships.", "real": "The Big Five emerged from lexical research and was popularized by measures such as Costa and McCrae’s NEO Personality Inventory (1985), and meta-analyses link conscientiousness to job performance across occupations.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Five-dimensional trait model |\n| Why it matters | Best-supported framework for personality research |\n| Key feature | Continuous dimensions, not types |\n| Common misconception | High or low scores are simply good or bad |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  BIG5[Big Five] --> O[Openness: curiosity, imagination]\n  BIG5 --> C[Conscientiousness: organization, diligence]\n  BIG5 --> E[Extraversion: sociability, energy]\n  BIG5 --> A[Agreeableness: compassion, cooperation]\n  BIG5 --> N[Neuroticism: emotional instability]\n```\n\n### Worked example\n\n| Trait | High scorer | Low scorer |\n|---|---|---|\n| Openness | Seeks novel ideas | Prefers familiar routines |\n| Conscientiousness | Plans ahead | Spontaneous, flexible |\n| Extraversion | Energized by groups | Prefers quieter settings |\n| Agreeableness | Trusting, cooperative | Skeptical, competitive |\n| Neuroticism | Prone to worry | Emotionally steady |"}, {"id": 73, "title": "Stability and change in personality", "tldr": "Personality is fairly stable in rank order across adulthood but changes on average: people tend to become more conscientious, agreeable and emotionally stable with age. Life experiences and deliberate effort can produce change.", "real": "Roberts, Walton and Viechtbauer’s 2006 meta-analysis of longitudinal studies found substantial mean-level personality change across the lifespan, especially between ages 20 and 40.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How traits stay the same or shift over time |\n| Pattern | “Maturity principle”: rising conscientiousness, agreeableness, stability |\n| Why it matters | People can grow; labels aren’t destiny |\n| Common misconception | Personality is set in stone by age 30 |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  ROLES[New roles: work, partnership, parenthood] --> CHANGE[Trait change]\n  EFFORT[Deliberate practice of new behaviors] --> CHANGE\n  AGE[Age] --> CHANGE\n  CHANGE --> STABLE[Rank order remains fairly stable]\n```\n\n### Worked example\n\n| Life event | Typical trait association |\n|---|---|\n| Starting first job | Increase in conscientiousness |\n| Committed relationship | Decrease in neuroticism (on average) |\n| Volitional change interventions | Small, measurable shifts in targeted traits in some studies |"}, {"id": 74, "title": "Personality tests: useful and not", "tldr": "Good personality measures are reliable (consistent) and valid (measure what they claim and predict outcomes). Big Five inventories meet these standards better than many popular type-based tests, which often have weak test-retest consistency.", "real": "The Myers-Briggs Type Indicator is widely used in workplaces, but researchers have criticized it because many people receive a different type when retested and its types don’t predict job performance well.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Measuring personality |\n| Quality criteria | Reliability, validity, norms |\n| Better tools | Validated Big Five measures (e.g. BFI-2, IPIP-NEO) |\n| Common misconception | Online personality quizzes are scientific assessments |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TEST[Personality test] --> REL{Reliable?}\n  REL -->|no| WEAK[Weak tool]\n  REL -->|yes| VALID{Valid: predicts relevant outcomes?}\n  VALID -->|no| WEAK\n  VALID -->|yes| USEFUL[Useful tool]\n```\n\n### Worked example\n\n| Claim | Assessment |\n|---|---|\n| “My type says I can’t be a leader” | Type labels don’t determine abilities |\n| “Use personality scores alone to hire” | Weak practice; combine with structured interviews and work samples |\n| “Big Five can describe my tendencies” | Reasonable, as a dimensional description |"}, {"id": 75, "title": "Self-concept and self-esteem", "tldr": "Self-concept is what you believe about yourself; self-esteem is how you evaluate yourself. High self-esteem feels good but doesn’t reliably cause success; stable, realistic self-worth and self-compassion tend to be healthier than fragile, inflated self-esteem.", "real": "Baumeister and colleagues’ 2003 review found that boosting self-esteem did not reliably improve academic performance or reduce problem behaviors, challenging the 1980s–90s self-esteem movement.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Beliefs and evaluations about oneself |\n| Why it matters | Motivation, resilience, relationships |\n| Healthier forms | Stable self-worth, self-compassion |\n| Common misconception | Raising self-esteem is the key to success |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EXPERIENCES[Experiences + feedback] --> CONCEPT[Self-concept: who am I?]\n  CONCEPT --> ESTEEM[Self-esteem: how do I feel about myself?]\n  ESTEEM --> BEHAVIOR[Behavior + choices]\n  BEHAVIOR --> EXPERIENCES\n```\n\n### Worked example\n\nAfter failing a driving test:\n\n| Response | Type |\n|---|---|\n| “I’m useless at everything” | Harsh self-criticism |\n| “I’m actually a great driver; the examiner was unfair” | Defensive self-enhancement |\n| “That’s disappointing. Many people fail first time. I’ll practice parking and retake it.” | Self-compassion with accountability |"}, {"id": 76, "title": "Self-efficacy", "tldr": "Self-efficacy is belief in your ability to succeed at a specific task. It grows mainly through mastery experiences, and also through observing similar others, encouragement and interpreting physical states. It predicts effort and persistence.", "real": "Albert Bandura introduced self-efficacy in 1977, and it became one of the most studied concepts in psychology, applied in education, health behavior change and sports.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Task-specific confidence in one’s abilities |\n| Sources | Mastery, vicarious experience, persuasion, physiological states |\n| Why it matters | Influences goals, effort and resilience |\n| Common misconception | Self-efficacy is general self-confidence |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  MASTERY[Mastery experiences: strongest] --> EFF[Self-efficacy]\n  VICARIOUS[Seeing similar others succeed] --> EFF\n  PERSUASION[Encouragement] --> EFF\n  STATES[Interpreting body signals] --> EFF\n  EFF --> EFFORT[Effort + persistence]\n```\n\n### Worked example\n\nBuilding public speaking self-efficacy:\n\n| Step | Source |\n|---|---|\n| Speak for 2 minutes to 3 friends | Mastery (small win) |\n| Watch a colleague with similar background present well | Vicarious |\n| Mentor’s specific encouragement | Persuasion |\n| Reframe nerves as energy | Physiological interpretation |"}, {"id": 77, "title": "Mindsets about ability", "tldr": "People differ in whether they view abilities as fixed or improvable. Growth mindset interventions can modestly help some students, particularly lower-achieving ones, but effects are smaller and more context-dependent than early popular claims suggested.", "real": "Sisk and colleagues’ 2018 meta-analyses found weak overall associations between mindset and achievement and small intervention effects, while Yeager and colleagues’ 2019 US national study found a short online intervention modestly improved grades for lower-achieving students.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Beliefs about whether abilities can grow |\n| Evidence | Small average effects; larger for some groups and supportive contexts |\n| Why it matters | Influences responses to challenge and failure |\n| Common misconception | Telling people to “have a growth mindset” transforms results |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BELIEF[Belief: ability can grow] --> CHALLENGE[Seeks challenges]\n  CHALLENGE --> STRATEGY[Uses effective strategies + feedback]\n  STRATEGY --> IMPROVE[Improvement]\n  CONTEXT[Supportive environment] --> STRATEGY\n```\n\n### Worked example\n\n| Unhelpful praise | Better feedback |\n|---|---|\n| “You’re so smart” | “Your strategy of checking each step worked” |\n| “Just try harder” | “Try a different approach: work through an example first” |"}, {"id": 78, "title": "Locus of control", "tldr": "Locus of control is the extent to which people believe outcomes depend on their own actions (internal) or on luck, fate or powerful others (external). An internal locus is linked to proactive behavior, though accurate recognition of real constraints matters too.", "real": "Julian Rotter introduced locus of control in 1966, and it has been linked to health behaviors, academic achievement and job satisfaction in many studies.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Beliefs about control over outcomes |\n| Types | Internal vs external |\n| Why it matters | Effort, coping, help-seeking |\n| Common misconception | Everything is controllable with the right attitude |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  OUTCOME[Outcome] --> ATTRIB{Attributed to}\n  ATTRIB -->|my actions| INTERNAL[Internal: adjust behavior]\n  ATTRIB -->|luck or others| EXTERNAL[External: less action]\n  REALITY[Real constraints] --> BALANCE[Balanced view]\n```\n\n### Worked example\n\nNot getting a promotion:\n\n| Thought | Locus |\n|---|---|\n| “I need to build the skills they asked for” | Internal |\n| “Promotions are random politics” | External |\n| “Some factors were outside my control; I’ll improve what I can and ask for clear criteria” | Balanced |"}, {"id": 79, "title": "Identity", "tldr": "Identity integrates personal characteristics, values, roles and group memberships (such as nationality, profession, religion or culture) into a sense of who we are. Social identities strongly influence behavior, belonging and intergroup relations.", "real": "Tajfel and Turner’s social identity theory (1979) built on “minimal group” experiments in which people favored their own group even when groups were formed by trivial criteria.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Sense of self across personal and social dimensions |\n| Why it matters | Belonging, motivation, intergroup behavior |\n| Components | Personal identity, social identities, narrative identity |\n| Common misconception | People have one fixed identity |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  SELF[Identity] --> PERSONAL[Personal: traits, values]\n  SELF --> SOCIAL[Social: groups, culture, profession]\n  SELF --> NARRATIVE[Narrative: life story]\n  SOCIAL --> INGROUP[In-group favoritism]\n```\n\n### Worked example\n\n| Context | Salient identity |\n|---|---|\n| International cricket match | National identity |\n| Team meeting | Professional identity |\n| Family festival | Cultural/family identity |"}, {"id": 80, "title": "Know yourself: applying personality research", "tldr": "Personality research helps people choose environments, roles and strategies that fit their tendencies, and to stretch deliberately where needed. Self-knowledge improves with feedback from others, since self-perception has blind spots.", "real": "Simine Vazire’s self–other knowledge asymmetry research (2010) found people know some traits, such as anxiety, better themselves, while others more accurately judge traits such as intelligence and creativity.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Using personality insights practically |\n| Why it matters | Better fit with work, relationships, habits |\n| Tools | Validated assessments, feedback, reflection |\n| Common misconception | Knowing your type tells you what you can’t do |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SELFREPORT[Self-assessment] --> INSIGHT[Self-knowledge]\n  OTHERS[Feedback from others] --> INSIGHT\n  INSIGHT --> FIT[Choose fitting environments]\n  INSIGHT --> STRETCH[Stretch deliberately where needed]\n```\n\n### Worked example\n\n| Tendency | Fit strategy | Stretch strategy |\n|---|---|---|\n| Low extraversion | Prepare for meetings in writing | Practice speaking first in small meetings |\n| Low conscientiousness | Use calendars, checklists, accountability partners | Build one planning habit at a time |\n| High neuroticism | Recovery time after stressful events | Practice reappraisal and exposure to manageable challenges |"}, {"id": 81, "title": "Attribution: explaining behavior", "tldr": "People explain others’ behavior with internal causes (personality) or external causes (situation). We tend to overestimate personality and underestimate situations when judging others (fundamental attribution error), while excusing our own behavior with circumstances.", "real": "In Jones and Harris’s 1967 study, participants judged essay writers as holding the views they wrote about Fidel Castro even when told the writers had been assigned their positions; Lee Ross named the fundamental attribution error in 1977.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | How people infer causes of behavior |\n| Key biases | Fundamental attribution error, actor–observer asymmetry, self-serving bias |\n| Why it matters | Conflict, management, relationships |\n| Common misconception | Behavior mainly reveals character |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BEHAVIOR[Colleague late to meeting] --> OTHERS{Judging others}\n  OTHERS --> PERSON[They're disorganized: dispositional]\n  BEHAVIOR2[I'm late to meeting] --> SELF{Judging myself}\n  SELF --> SITUATION[Traffic was terrible: situational]\n```\n\n### Worked example\n\n| Situation | Fair attribution question |\n|---|---|\n| Team member misses deadline | “What obstacles did they face?” |\n| Driver cuts you off | “Could there be an emergency?” |\n| Student fails an exam | Consider workload, teaching, health, not only ability |"}, {"id": 82, "title": "Attitudes and cognitive dissonance", "tldr": "Attitudes guide behavior, but behavior also shapes attitudes. When actions conflict with beliefs, people feel dissonance and often change beliefs to justify what they did, especially when there’s little external justification.", "real": "In Festinger and Carlsmith’s 1959 experiment, participants paid $1 to tell others a boring task was enjoyable later rated it as more enjoyable than those paid $20, who had sufficient external justification.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Discomfort from inconsistent beliefs and actions |\n| Why it matters | Explains rationalization and commitment |\n| Reduction | Change belief, change behavior, add justifications |\n| Common misconception | Attitudes always come first and cause behavior |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  BELIEF[Belief: I'm health-conscious] --> CONFLICT[Dissonance]\n  ACTION[Action: I smoke] --> CONFLICT\n  CONFLICT --> CHANGEB[Change behavior: quit]\n  CONFLICT --> CHANGEA[Change belief: risks exaggerated]\n  CONFLICT --> JUSTIFY[Add justification: it relieves stress]\n```\n\n### Worked example\n\n| Situation | Dissonance reduction |\n|---|---|\n| Bought an expensive phone | Focus on its advantages; ignore rival reviews |\n| Worked hard to join a club | Value membership more highly |\n| Volunteered for a cause | Attitude toward the cause becomes more positive |"}, {"id": 83, "title": "Conformity", "tldr": "People often conform to group norms because of the desire to be right (informational influence) or accepted (normative influence). Conformity increases with group unanimity and decreases when even one person dissents.", "real": "In Solomon Asch’s line-judgment experiments in the 1950s, participants conformed to a clearly wrong majority on about a third of critical trials, and about three-quarters conformed at least once; one dissenting ally greatly reduced conformity.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Adjusting behavior or beliefs to match a group |\n| Types | Informational and normative influence |\n| Moderators | Group size, unanimity, culture, public vs private responses |\n| Common misconception | Only weak or insecure people conform |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  GROUP[Unanimous group answer] --> PRESSURE[Social pressure]\n  PRESSURE --> CONFORM[Conformity]\n  ALLY[One dissenter] -.reduces.-> CONFORM\n  PRIVATE[Private responses] -.reduces.-> CONFORM\n```\n\n### Worked example\n\n| Setting | Application |\n|---|---|\n| Meetings | Ask for independent written opinions before discussion |\n| Energy saving | “Most of your neighbors save energy” messages leverage norms |\n| Speaking up | Even one person voicing concern makes others likelier to follow |"}, {"id": 84, "title": "Obedience to authority", "tldr": "People often follow instructions from perceived legitimate authorities even when they conflict with conscience. Obedience increases with authority legitimacy, proximity and gradual escalation, and decreases when others refuse or responsibility is clear.", "real": "In Stanley Milgram’s 1963 study, 26 of 40 participants (65%) continued to the maximum 450-volt shock level when instructed by an experimenter, though later analyses showed obedience varied widely across his many experimental variations.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Following orders from authority figures |\n| Factors | Legitimacy, proximity, gradual commitment, diffusion of responsibility |\n| Why it matters | Workplace ethics, safety, institutional abuse |\n| Common misconception | Only cruel people would obey harmful orders |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  AUTHORITY[Legitimate-seeming authority] --> SMALL[Small first step]\n  SMALL --> ESCALATE[Gradual escalation]\n  ESCALATE --> OBEY[Continued obedience]\n  PEERS[Peers refusing] -.reduces.-> OBEY\n  RESPONSIBILITY[Personal responsibility made clear] -.reduces.-> OBEY\n```\n\n### Worked example\n\n| Variation in Milgram’s research | Obedience |\n|---|---|\n| Experimenter in the room | Higher |\n| Experimenter giving orders by phone | Much lower |\n| Two peers refusing to continue | Much lower |\n| Participant had to touch the learner’s hand | Lower |"}, {"id": 85, "title": "The Stanford Prison Experiment and its critics", "tldr": "The 1971 Stanford Prison Experiment is often cited to show that roles and situations make ordinary people abusive, but later analysis revealed experimenter guidance of guards and other flaws, so it is now viewed as a weak scientific demonstration.", "real": "Thibault Le Texier’s 2018–2019 analysis of archival material documented that guards were coached toward harsh behavior, and the BBC Prison Study (Haslam and Reicher, 2002) found groups did not automatically become tyrannical.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Famous but flawed role-play prison study |\n| Why it matters | Lesson in evaluating famous findings critically |\n| Problems | Demand characteristics, coaching, small sample, no control group |\n| Common misconception | It proved anyone becomes cruel when given power |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CLAIM[Popular claim: situations alone create cruelty] --> EVIDENCE[Archival evidence: guards encouraged]\n  EVIDENCE --> REVISED[Revised view: leadership, identity + expectations matter]\n  BBC[BBC Prison Study] --> REVISED\n```\n\n### Worked example\n\n| Lesson | Application |\n|---|---|\n| Leaders shape group norms | Leadership expectations matter in institutions |\n| Famous ≠ well-replicated | Check method details and replications |\n| Situations matter, but so do identity and leadership | Avoid “anyone would do it” fatalism |"}, {"id": 86, "title": "Persuasion", "tldr": "Persuasion works through careful evaluation of arguments (central route) when people are motivated and able, or through cues such as attractiveness, authority and social proof (peripheral route). Common influence principles include reciprocity, commitment, social proof, liking, authority and scarcity.", "real": "Petty and Cacioppo’s Elaboration Likelihood Model (1980s) described the two routes, and Robert Cialdini’s book “Influence” (1984) summarized widely used influence principles.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Changing attitudes or behavior through communication |\n| Routes | Central (arguments) vs peripheral (cues) |\n| Principles | Reciprocity, commitment, social proof, liking, authority, scarcity |\n| Common misconception | Strong arguments always win |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  MESSAGE[Message] --> ABLE{Motivated + able to think?}\n  ABLE -->|yes| CENTRAL[Central route: evaluate arguments]\n  ABLE -->|no| PERIPHERAL[Peripheral route: cues]\n  CENTRAL --> DURABLE[Durable attitude change]\n  PERIPHERAL --> TEMPORARY[Often temporary change]\n```\n\n### Worked example\n\n| Principle | Ethical use | Manipulative use to recognize |\n|---|---|---|\n| Social proof | “9 in 10 guests reuse towels” | Fake reviews |\n| Scarcity | Genuine limited seats | False countdown timers |\n| Commitment | Small sign-up before a bigger health goal | Foot-in-the-door pressure sales |"}, {"id": 87, "title": "Groups: performance and decision-making", "tldr": "Groups can outperform individuals by pooling knowledge, but they also suffer social loafing, conformity pressure and groupthink. Structures like independent idea generation, assigned dissent and diverse expertise improve group decisions.", "real": "Irving Janis described groupthink in 1972 using cases such as the 1961 Bay of Pigs invasion, and Latané, Williams and Harkins (1979) showed people exerted less effort when shouting or clapping in groups (social loafing).", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Psychology of collective work and decisions |\n| Risks | Social loafing, groupthink, polarization, information cascades |\n| Remedies | Individual accountability, independent input, devil’s advocate |\n| Common misconception | Brainstorming in groups always produces more ideas |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  COHESIVE[Highly cohesive group] --> PRESSURE[Pressure for agreement]\n  DIRECTIVE[Directive leader] --> PRESSURE\n  PRESSURE --> GROUPTHINK[Groupthink: dissent suppressed]\n  GROUPTHINK --> POOR[Poor decision]\n  REMEDY[Independent input + assigned critic] -.prevents.-> GROUPTHINK\n```\n\n### Worked example\n\n| Practice | Problem addressed |\n|---|---|\n| Write ideas silently before discussion (“brainwriting”) | Production blocking, conformity |\n| Leader speaks last | Authority bias |\n| Pre-mortem: “Imagine this failed; why?” | Overconfidence, groupthink |\n| Clear individual responsibilities | Social loafing |"}, {"id": 88, "title": "Prejudice and stereotypes", "tldr": "Stereotypes are generalized beliefs about groups; prejudice is negative attitudes; discrimination is unfair treatment. They arise from categorization, in-group favoritism, socialization and competition. Positive intergroup contact under good conditions reduces prejudice.", "real": "Gordon Allport’s “The Nature of Prejudice” (1954) proposed the contact hypothesis, and Pettigrew and Tropp’s 2006 meta-analysis of over 500 studies found intergroup contact generally reduced prejudice.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Biased beliefs, attitudes and behaviors toward groups |\n| Sources | Categorization, in-group bias, norms, competition |\n| Reduction | Equal-status contact, common goals, institutional support |\n| Common misconception | Only openly hostile people are prejudiced |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CATEGORIZE[Categorization] --> STEREOTYPE[Stereotype: belief]\n  STEREOTYPE --> PREJUDICE[Prejudice: attitude]\n  PREJUDICE --> DISCRIM[Discrimination: behavior]\n  CONTACT[Equal-status contact + common goals] -.reduces.-> PREJUDICE\n```\n\n### Worked example\n\n| Strategy | Example |\n|---|---|\n| Structured interviews with fixed criteria | Reduces bias in hiring decisions |\n| Cooperative learning across groups (jigsaw classroom) | Common goals reduce prejudice |\n| Blind auditions | Increased hiring of women in some orchestras (Goldin & Rouse, 2000; later debated) |"}, {"id": 89, "title": "Helping and the bystander effect", "tldr": "People are less likely to help when responsibility feels shared, the situation is ambiguous or they don’t know how to help. In real public emergencies, however, someone usually intervenes; directly asking a specific person for help increases assistance.", "real": "Darley and Latané’s 1968 experiments found people were slower to help when they believed others were present, but a 2019–2020 analysis of CCTV footage of real public conflicts in three countries (Philpot et al.) found at least one bystander intervened in about 91% of incidents.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | When and why people help others |\n| Steps to helping | Notice → interpret as emergency → take responsibility → know how → act |\n| Why it matters | Safety, community, workplace ethics |\n| Common misconception | Crowds never help (the 1964 Kitty Genovese “38 witnesses” story was exaggerated) |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  NOTICE[Notice event] --> INTERPRET[Interpret as emergency]\n  INTERPRET --> RESP[Assume responsibility]\n  RESP --> KNOW[Know how to help]\n  KNOW --> ACT[Help]\n  OTHERS[Others present] -.diffuses.-> RESP\n```\n\n### Worked example\n\n| If you need help in public | Why it works |\n|---|---|\n| Point to one person: “You in the blue shirt, call an ambulance” | Removes diffusion of responsibility |\n| State clearly that it’s an emergency | Removes ambiguity |\n| Give a specific task | Removes uncertainty about how to help |"}, {"id": 90, "title": "Attraction and relationships", "tldr": "Attraction is influenced by proximity, familiarity, similarity, physical attractiveness and reciprocity. Lasting relationships depend on responsiveness, trust, positive interactions and constructive conflict handling.", "real": "Festinger, Schachter and Back’s 1950 study of student housing found friendships formed most often between neighbors, and John Gottman’s research identified criticism, contempt, defensiveness and stonewalling as predictors of relationship breakdown.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Forming and maintaining close relationships |\n| Attraction factors | Proximity, familiarity (mere exposure), similarity, reciprocity |\n| Relationship maintenance | Responsiveness, appreciation, repair after conflict |\n| Common misconception | Opposites attract more than similar people |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  PROXIMITY[Proximity] --> FAMILIAR[Familiarity]\n  FAMILIAR --> LIKING[Liking]\n  SIMILAR[Similarity] --> LIKING\n  RECIPROCITY[They like us] --> LIKING\n  LIKING --> RELATIONSHIP[Relationship]\n  RESPONSIVE[Responsiveness + trust] --> LASTING[Lasting relationship]\n  RELATIONSHIP --> LASTING\n```\n\n### Worked example\n\n| Conflict pattern (Gottman) | Healthier alternative |\n|---|---|\n| Criticism: “You never help” | Gentle start-up: “I’m stressed; could you do the dishes tonight?” |\n| Contempt (mockery, eye-rolling) | Express appreciation regularly |\n| Defensiveness | Accept partial responsibility |\n| Stonewalling | Take a break, then return to the conversation |"}, {"id": 91, "title": "Understanding mental health and disorders", "tldr": "Mental health is a continuum, not a simple on/off state. Mental disorders are diagnosed when patterns of distress or impaired functioning meet criteria in systems such as DSM-5-TR and ICD-11. Diagnosis guides treatment but doesn’t define a person.", "real": "The American Psychiatric Association published DSM-5-TR in 2022, and the World Health Organization’s ICD-11 came into effect in January 2022; both are used worldwide for diagnosis and research.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Psychological well-being and conditions that impair it |\n| Diagnostic systems | DSM-5-TR, ICD-11 |\n| Key criteria | Distress, impairment, duration, not better explained otherwise |\n| Common misconception | Mental illness is rare or a sign of weakness |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  THRIVING[Thriving] --> COPING[Coping with stress]\n  COPING --> STRUGGLING[Struggling]\n  STRUGGLING --> UNWELL[Unwell: may meet criteria for a disorder]\n  SUPPORT[Support + treatment] -.helps move.-> COPING\n```\n\n### Worked example\n\n| Experience | Typical vs possible concern |\n|---|---|\n| Nervous before an exam | Typical, time-limited |\n| Sad for a few days after a setback | Typical |\n| Low mood and loss of interest most days for 2+ weeks, affecting daily life | Worth discussing with a doctor or mental health professional |\n\n(This course is educational; it can’t diagnose. If you’re struggling, a qualified professional can help.)"}, {"id": 92, "title": "Anxiety", "tldr": "Anxiety is a normal response to perceived threat, but anxiety disorders involve excessive, persistent fear or worry that interferes with life. Avoidance maintains anxiety; gradual, supported exposure and cognitive behavioral therapy are effective treatments.", "real": "The World Health Organization estimates that about 4% of the global population lives with an anxiety disorder, making anxiety disorders among the most common mental health conditions.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Fear and worry beyond what the situation warrants |\n| Types | Generalized anxiety, panic, social anxiety, specific phobias |\n| Maintaining factor | Avoidance and safety behaviors |\n| Common misconception | Avoiding triggers is the best way to manage anxiety |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  TRIGGER[Trigger] --> ANXIETY[Anxiety rises]\n  ANXIETY --> AVOID[Avoidance]\n  AVOID --> RELIEF[Short-term relief]\n  RELIEF --> STRONGER[Fear maintained long term]\n  STRONGER --> TRIGGER\n  EXPOSURE[Gradual exposure] -.breaks cycle.-> AVOID\n```\n\n### Worked example\n\nExposure hierarchy for social anxiety (guided by a therapist):\n\n| Step | Situation | Expected anxiety (0–10) |\n|---|---|---|\n| 1 | Ask a shop assistant a question | 3 |\n| 2 | Speak once in a small meeting | 5 |\n| 3 | Introduce yourself at an event | 7 |\n| 4 | Give a 5-minute talk | 9 |"}, {"id": 93, "title": "Depression", "tldr": "Depression involves persistent low mood or loss of interest with changes in sleep, energy, appetite, concentration and self-worth. It arises from biological, psychological and social factors and is treatable with psychotherapy, medication, or both.", "real": "The World Health Organization estimates that about 4% of people worldwide experience depression, and it is a leading cause of disability globally.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Common, serious mood disorder |\n| Causes | Biological, psychological, social factors combined |\n| Treatments | Psychotherapy (e.g. CBT, behavioral activation), medication, combined approaches |\n| Common misconception | Depression is just sadness or can be overcome by “snapping out of it” |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  LOWMOOD[Low mood] --> WITHDRAW[Withdraw from activities]\n  WITHDRAW --> FEWER[Fewer rewarding experiences]\n  FEWER --> LOWMOOD\n  ACTIVATION[Behavioral activation: scheduled meaningful activities] -.breaks cycle.-> WITHDRAW\n```\n\n### Worked example\n\nBehavioral activation plan (used within treatment):\n\n| Day | Small planned activity | Mood after (0–10) |\n|---|---|---|\n| Mon | 10-minute walk | 4 |\n| Tue | Call a friend | 5 |\n| Wed | Cook a simple meal | 5 |\n\n(Anyone experiencing persistent depression, or thoughts of harming themselves, should contact a health professional or local emergency services promptly.)"}, {"id": 94, "title": "Trauma and resilience", "tldr": "Many people experience traumatic events; most show resilience or recover over time, while some develop post-traumatic stress disorder with intrusive memories, avoidance, negative mood changes and hyperarousal. Trauma-focused therapies are effective.", "real": "George Bonanno’s research found resilience, a stable pattern of healthy functioning after potentially traumatic events, is the most common outcome, and PTSD was added to the DSM in 1980.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Responses to extremely stressful events |\n| Outcomes | Resilience, recovery, chronic distress, delayed reactions |\n| Treatments | Trauma-focused CBT, prolonged exposure, cognitive processing therapy, EMDR |\n| Common misconception | Everyone exposed to trauma will develop PTSD |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  EVENT[Potentially traumatic event] --> RESIL[Resilience: most common]\n  EVENT --> RECOVER[Recovery over months]\n  EVENT --> CHRONIC[Chronic symptoms: PTSD]\n  SUPPORT[Social support + treatment] -.improves.-> RECOVER\n```\n\n### Worked example\n\n| Helpful after a distressing event | Less helpful |\n|---|---|\n| Practical support, safety, social connection | Forcing someone to retell details immediately |\n| Normalizing early reactions | Assuming they’ll be permanently damaged |\n| Encouraging professional help if symptoms persist beyond a month | Waiting indefinitely for symptoms to pass |"}, {"id": 95, "title": "Psychological therapies", "tldr": "Effective psychotherapies include cognitive behavioral therapy (changing unhelpful thoughts and behaviors), exposure therapy, interpersonal therapy and acceptance-based approaches. The therapeutic relationship itself also predicts outcomes.", "real": "Aaron Beck developed cognitive therapy in the 1960s, and CBT has been tested in hundreds of randomized trials for depression, anxiety and other conditions, becoming a first-line recommended treatment in guidelines such as those from the UK’s NICE.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Structured psychological treatments |\n| Examples | CBT, exposure, interpersonal therapy, ACT, DBT |\n| Common factor | Strong therapeutic alliance |\n| Common misconception | Therapy is just talking about problems |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SITUATION[Situation] --> THOUGHT[Automatic thought]\n  THOUGHT --> FEELING[Feeling]\n  FEELING --> BEHAVIOR[Behavior]\n  BEHAVIOR --> SITUATION\n  CBT[CBT: examine thoughts, test with experiments] -.-> THOUGHT\n  CBT -.-> BEHAVIOR\n```\n\n### Worked example\n\nCBT thought record:\n\n| Column | Example |\n|---|---|\n| Situation | Friend didn’t reply to message for a day |\n| Automatic thought | “She’s annoyed with me” |\n| Feeling | Anxious (7/10) |\n| Evidence for / against | No sign of conflict; she’s often busy at work |\n| Balanced thought | “She’s probably busy; I’ll check in tomorrow” |\n| Feeling after | Anxious (3/10) |"}, {"id": 96, "title": "Behavior change", "tldr": "Lasting behavior change requires capability (knowledge, skills), opportunity (environment, social support) and motivation (reflective and automatic). Effective interventions target whichever component is missing, rather than only giving information.", "real": "Susan Michie and colleagues’ COM-B model (2011), part of the Behaviour Change Wheel, is widely used to design public health interventions, including by the UK government.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Science of changing what people do |\n| Model | COM-B: Capability + Opportunity + Motivation → Behavior |\n| Why it matters | Health, sustainability, workplace, personal goals |\n| Common misconception | Information alone changes behavior |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  CAP[Capability: skills, knowledge] --> BEH[Behavior]\n  OPP[Opportunity: environment, social support] --> BEH\n  MOT[Motivation: goals, habits, emotions] --> BEH\n  CAP --> MOT\n  OPP --> MOT\n  BEH --> CAP\n```\n\n### Worked example\n\nGoal: drink more water at work\n\n| Barrier | COM-B component | Intervention |\n|---|---|---|\n| Forget during busy days | Motivation (automatic) | Habit cue: drink after each meeting |\n| No water near desk | Opportunity (physical) | Keep a bottle on the desk |\n| Colleagues joke about it | Opportunity (social) | Team water challenge |"}, {"id": 97, "title": "Positive psychology", "tldr": "Positive psychology studies strengths, positive emotions, engagement, meaning and flourishing, complementing the study of problems. Some interventions (gratitude, kindness, savoring) show small-to-moderate benefits; claims should be evaluated carefully.", "real": "Martin Seligman launched positive psychology as a field during his 1998 American Psychological Association presidency and later proposed the PERMA model (2011).", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Science of well-being and human strengths |\n| Model | PERMA: positive emotion, engagement, relationships, meaning, accomplishment |\n| Evidence | Small-to-moderate effects for many interventions |\n| Common misconception | Positive psychology means always thinking positively |\n\n### Diagram\n\n```mermaid\nflowchart TB\n  PERMA[Flourishing] --> P[Positive emotion]\n  PERMA --> E[Engagement: flow]\n  PERMA --> R[Relationships]\n  PERMA --> M[Meaning]\n  PERMA --> A[Accomplishment]\n```\n\n### Worked example\n\n| Practice | How to do it |\n|---|---|\n| Three good things | Each evening, write three things that went well and why |\n| Acts of kindness | Plan several kind acts on one day each week |\n| Savoring | Pause to fully notice a pleasant moment |\n| Strengths use | Use a personal strength in a new way each day for a week |"}, {"id": 98, "title": "Psychology at work", "tldr": "Work psychology covers selection, motivation, leadership, teams and well-being. Psychological safety (feeling safe to speak up), clear goals, autonomy, fair treatment and manageable workloads support performance and health.", "real": "Amy Edmondson’s 1999 research introduced team psychological safety, and Google’s Project Aristotle (2015–2016) found psychological safety was the most important factor distinguishing its effective teams.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Applying psychology to organizations |\n| Key topics | Selection, motivation, leadership, teams, well-being |\n| Evidence-based practices | Structured interviews, work samples, clear goals, psychological safety |\n| Common misconception | Unstructured “gut feel” interviews predict performance well |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  SAFETY[Psychological safety] --> SPEAK[People speak up + admit errors]\n  SPEAK --> LEARN[Team learning]\n  LEARN --> PERFORM[Better performance]\n  CLARITY[Clear goals + roles] --> PERFORM\n```\n\n### Worked example\n\n| Hiring method | Predictive validity |\n|---|---|\n| Structured interviews | Among the strongest predictors |\n| Work sample tests | Strong |\n| Unstructured interviews | Weaker |\n| Years of experience alone | Weak |\n\n(Based on meta-analytic reviews of selection methods, e.g. Schmidt and Hunter, 1998, and Sackett et al., 2022.)"}, {"id": 99, "title": "Psychology of technology and social media", "tldr": "Digital technology affects attention, sleep, social comparison and relationships, but research on overall effects is mixed: average associations with well-being are small, with larger risks for some individuals and patterns of use. How and why people use technology matters more than total time.", "real": "Orben and Przybylski’s 2019 analysis of large datasets found digital technology use explained at most about 0.4% of variation in adolescent well-being, while Jonathan Haidt’s 2024 book “The Anxious Generation” argued smartphones and social media drove rising teen mental health problems, sparking ongoing scientific debate.", "body": "### Concept card\n\n| Aspect | Detail |\n|---|---|\n| What it is | Effects of digital technology on mind and behavior |\n| Evidence | Mixed; small average associations; individual vulnerability matters |\n| Risk patterns | Late-night use, displacement of sleep, harmful content, compulsive checking |\n| Common misconception | All screen time is equally harmful (or harmless) |\n\n### Diagram\n\n```mermaid\nflowchart LR\n  USE[Technology use] --> DISPLACE[Displaces sleep, exercise, in-person time?]\n  USE --> COMPARE[Social comparison]\n  USE --> CONNECT[Connection + support]\n  DISPLACE --> WELLBEING[Well-being]\n  COMPARE --> WELLBEING\n  CONNECT --> WELLBEING\n```\n\n### Worked example\n\n| Healthier pattern | Riskier pattern |\n|---|---|\n| Messaging close friends | Endless scrolling of idealized images |\n| Phone out of the bedroom at night | Use late into the night |\n| Notifications batched | Constant interruptions |\n| Actively creating, learning | Passive consumption when lonely |"}, {"id": 100, "title": "Applying psychology in daily life and glossary", "tldr": "Psychology offers evidence-based tools for daily life: sleep and routines, spaced study, habit design, emotion regulation, fair attributions, structured decisions and supportive relationships. Use evidence critically, and remember that findings are probabilistic, not guarantees.", "real": "Evidence-based guides such as the Dunlosky (2013) review of learning techniques and NICE mental health guidelines translate research into practical recommendations.", "body": "### Diagram\n\n```mermaid\nflowchart LR\n  SLEEP[Sleep + routines] --> LIFE[Better daily functioning]\n  LEARN[Retrieval + spacing] --> LIFE\n  HABITS[Habit design] --> LIFE\n  EMOTION[Reappraisal + support] --> LIFE\n  DECIDE[Structured decisions] --> LIFE\n  RELATE[Responsive relationships] --> LIFE\n```\n\n### Worked example\n\n| Goal | Evidence-based tool | Chapter |\n|---|---|---|\n| Learn faster | Retrieval practice + spacing | 38 |\n| Build a routine | Cue-based habits + if–then plans | 40, 54 |\n| Manage stress | Reappraisal + social support | 57, 58 |\n| Decide better | Outside view, pre-mortem | 44, 87 |\n| Improve relationships | Responsiveness, gentle start-up | 90 |\n\n### Glossary\n\n| Term | Meaning |\n|---|---|\n| Attribution | Explanation of the causes of behavior |\n| Cognitive dissonance | Discomfort from inconsistent beliefs and actions |\n| Conditioning | Learning by association (classical) or consequences (operant) |\n| Effect size | Size of a difference or relationship |\n| Heritability | Share of population variation linked to genetic differences |\n| Heuristic | Mental shortcut |\n| Neuroplasticity | Brain’s capacity to change with experience |\n| Reappraisal | Changing how a situation is interpreted to change emotion |\n| Replication | Repeating a study to test whether results hold |\n| Self-efficacy | Belief in ability to succeed at a specific task |\n| Working memory | Limited system holding information in mind |\n| Zone of proximal development | Tasks a learner can do with support |"}];
const PARTS = ["Foundations of psychology", "Brain and biology", "Sensation, perception and attention", "Learning and memory", "Thinking, decisions and intelligence", "Motivation, emotion and well-being", "Development across the lifespan", "Personality and the self", "Social psychology", "Mental health and applied psychology"];
const TOTAL = 100, PER = 10;
function idsOf(p){ const a = []; for (let i = (p-1)*PER + 1; i <= p*PER; i++) a.push(i); return a; }
const partOf = id => Math.ceil(id / PER);
const byId = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const TICK = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LS_KEY = "human-psychology-progress-v1";
const LS_LAST = "human-psychology-last-v1";

let done = new Set();
try { JSON.parse(localStorage.getItem(LS_KEY) || "[]").forEach(n => done.add(n)); } catch (e) {}

/* ---------- optional cross-device sync via the artifact db ---------- */
let dbRef = null, writing = false, pendingWrite = false;
async function initSync(){
  try{
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    let changed = false;
    if (snap.exists){
      const remote = (snap.data() || {}).done || [];
      remote.forEach(n => { if (!done.has(n)) { done.add(n); changed = true; } });
      if (remote.length !== done.size) pushRemote();
    } else if (done.size) pushRemote();
    if (changed){ saveLocal(); renderAll(); }
  }catch(e){ dbRef = null; }
}
async function pushRemote(){
